<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — TMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

<!-- ── Inline YAML page config ── -->
<script type="text/yaml" id="page-config">
title: Reports
page:
  id: tms-reports
  description: Fleet utilization, cost analysis, and driver performance reports.
datasources:
  - id: fleet_utilization
  - id: cost_analysis
  - id: driver_performance
components:
  - type: StatRow
    id: reports-kpis
    container: stat-row
    stats:
      - { label: Fleet Utilization,      field: avg_utilization_pct, format: percent,  color: indigo }
      - { label: Total Maintenance Cost, field: maintenance_total,   format: currency, color: amber  }
      - { label: Avg Trip Distance,      field: avg_trip_distance,   format: number,   color: blue   }
      - { label: On-Time Delivery,       field: on_time_pct,         format: percent,  color: green  }
  - type: TabPanel
    id: reports-tabs
    container: tab-panel
    tabs:
      - { id: fleet-utilization,  label: Fleet Utilization  }
      - { id: cost-analysis,      label: Cost Analysis       }
      - { id: driver-performance, label: Driver Performance  }
toolbar:
  - { type: ButtonExcel, id: export-excel, label: Export Excel }
  - { type: ButtonPdf,   id: export-pdf,   label: Export PDF   }
</script>

<!-- ── Nav ── -->
<header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-14">
    <div class="flex items-center gap-6">
      <span class="font-bold text-indigo-600 text-lg">TMS</span>
      <nav class="flex gap-1 text-sm">
        <a href="fleet.html"       class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Fleet</a>
        <a href="drivers.html"     class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Drivers</a>
        <a href="trips.html"       class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Trips</a>
        <a href="maintenance.html" class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Maintenance</a>
        <a href="reports.html"     class="px-3 py-1 rounded-md bg-indigo-50 text-indigo-700 font-medium">Reports</a>
        <a href="settings.html"    class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Settings</a>
      </nav>
    </div>
    <div class="flex items-center gap-3 text-sm text-gray-500">
      <span>Admin User</span>
      <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold">AU</div>
    </div>
  </div>
</header>

<!-- ── Page header ── -->
<div class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-6 py-5">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900" data-page-title>Reports</h1>
        <p class="text-sm text-gray-500 mt-0.5">Fleet utilization, cost analysis, and driver performance</p>
      </div>
      <!-- export buttons mounted here -->
      <div id="toolbar" class="flex items-center gap-2"></div>
    </div>
  </div>
</div>

<main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

  <!-- StatRow -->
  <div id="stat-row"></div>

  <!-- Tab Panel (chart + grid injected by tab render functions) -->
  <div id="tab-panel"></div>

</main>

<script type="module">

const PAGE_SIZE = 10;

// ─── StatRow ─────────────────────────────────────────────────────────────────
new StatRow('reports-kpis', [
  { label: 'Fleet Utilization',      value: '74%',    color: 'indigo' },
  { label: 'Total Maintenance Cost', value: '$87.6K', color: 'amber'  },

  { label: 'On-Time Delivery',       value: '85.1%',  color: 'green'  },
]).mount(document.getElementById('stat-row'));

// ─── Export action handler (demo alert) ──────────────────────────────────────
function makeExportHandler(reportName) {
  return (action, params) => {
    if (action === 'export.excel') {
      alert(`Exporting ${reportName} as Excel (${params.filename}.xlsx) — not wired in demo`);
    } else if (action === 'export.pdf') {
      alert(`Exporting ${reportName} as PDF (${params.filename}.pdf) — not wired in demo`);
    }
  };
}

// ─── Helper: render chart ─────────────────────────────────────────────────────
function mountChart(containerId, { data, labels, title, color, width, height }) {
  const chartComp = new Chart(containerId, { data, labels, title }, { color, width, height });
  chartComp.mount(document.getElementById(containerId));
}

// ─── Helper: render export button row ─────────────────────────────────────────
function mountExportButtons(containerId, reportName, filenameBase) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  const excelBtn = new ButtonExcel(`${filenameBase}-excel`, {}, { label: 'Export Excel', filename: filenameBase });
  excelBtn._onAction = makeExportHandler(reportName);
  excelBtn.mount(wrap);

  const pdfBtn = new ButtonPdf(`${filenameBase}-pdf`, {}, { label: 'Export PDF', filename: `${filenameBase}-report` });
  pdfBtn._onAction = makeExportHandler(reportName);
  pdfBtn.mount(wrap);
}

// ─── Tab: Fleet Utilization ───────────────────────────────────────────────────
function renderFleetTab(container) {
  // Chart
  const chartWrap = document.createElement('div');
  chartWrap.id = 'chart-utilization';
  chartWrap.className = 'bg-white rounded-xl border border-gray-200 p-5 mb-4';
  container.appendChild(chartWrap);

  mountChart('chart-utilization', {
    data:   FLEET_ROWS.map(r => r.utilization_pct),
    labels: FLEET_ROWS.map(r => r.plate.split('-').slice(0, 2).join('-')),
    title:  'Truck Utilization % (last 30 days)',
    color:  '#6366f1',
    width:  760,
    height: 220,
  });

  // Export buttons
  const exportRow = document.createElement('div');
  exportRow.id = 'export-utilization';
  exportRow.className = 'flex gap-2 mb-4';
  container.appendChild(exportRow);
  mountExportButtons('export-utilization', 'Fleet Utilization', 'fleet-utilization');

  // Grid
  const gridWrap = document.createElement('div');
  gridWrap.id = 'grid-utilization';
  container.appendChild(gridWrap);

  const DEFS_FLEET = [
    { type: 'TextCell',    id: 'plate',           field: 'plate',           label: 'Truck',          secondary: 'model' },
    { type: 'BadgeCell',   id: 'type',            field: 'type',            label: 'Type' },
    { type: 'TextCell',    id: 'utilization_pct', field: 'utilization_pct', label: 'Utilization %',  secondary: null },
    { type: 'NumberCell',  id: 'total_mileage',   field: 'total_mileage',   label: 'Mileage (km)' },
    { type: 'NumberCell',  id: 'trip_count',      field: 'trip_count',      label: 'Trips' },
    { type: 'NumberCell',  id: 'active_days',     field: 'active_days',     label: 'Active Days' },
    { type: 'TextCell',    id: 'branch_id',       field: 'branch_id',       label: 'Branch' },
  ];

  const grid = new GridView('grid-fleet', {
    rows: FLEET_ROWS,
    meta: { total: FLEET_ROWS.length, page: 1, pageSize: PAGE_SIZE },
  }, DEFS_FLEET);
  grid.mount(gridWrap);
}

// ─── Tab: Cost Analysis ───────────────────────────────────────────────────────
function renderCostTab(container) {
  // Aggregate monthly totals for chart
  const monthTotals = {};
  for (const r of COST_ROWS) {
    monthTotals[r.month] = (monthTotals[r.month] || 0) + r.amount;
  }
  const months = [...new Set(COST_ROWS.map(r => r.month))];
  const monthAmounts = months.map(m => monthTotals[m]);

  // Chart
  const chartWrap = document.createElement('div');
  chartWrap.id = 'chart-cost';
  chartWrap.className = 'bg-white rounded-xl border border-gray-200 p-5 mb-4';
  container.appendChild(chartWrap);

  mountChart('chart-cost', {
    data:   monthAmounts,
    labels: months.map(m => m.split(' ')[0]),  // "Feb", "Mar", …
    title:  'Total Monthly Cost (last 6 months)',
    color:  '#f59e0b',
    width:  760,
    height: 220,
  });

  // Export buttons
  const exportRow = document.createElement('div');
  exportRow.id = 'export-cost';
  exportRow.className = 'flex gap-2 mb-4';
  container.appendChild(exportRow);
  mountExportButtons('export-cost', 'Cost Analysis', 'cost-analysis');

  // Grid
  const gridWrap = document.createElement('div');
  gridWrap.id = 'grid-cost';
  container.appendChild(gridWrap);

  const DEFS_COST = [
    { type: 'TextCell',     id: 'month',    field: 'month',    label: 'Month'    },
    { type: 'BadgeCell',    id: 'category', field: 'category', label: 'Category' },
    { type: 'CurrencyCell', id: 'amount',   field: 'amount',   label: 'Amount'   },
    { type: 'CurrencyCell', id: 'budget',   field: 'budget',   label: 'Budget'   },
    { type: 'CurrencyCell', id: 'variance', field: 'variance', label: 'Variance' },
    {
      type: 'TextCell', id: 'trend', field: 'prev_amount', label: 'Trend',
      // compute rendered manually below
    },
  ];

  // Add trend compute before GridView renders
  const enriched = COST_ROWS.map(r => ({
    ...r,
    trend: r.prev_amount == null ? '—' : r.amount > r.prev_amount ? '↑ Up' : '↓ Down',
  }));

  const DEFS_COST2 = [
    { type: 'TextCell',     id: 'month',    field: 'month',    label: 'Month'    },
    { type: 'BadgeCell',    id: 'category', field: 'category', label: 'Category' },
    { type: 'CurrencyCell', id: 'amount',   field: 'amount',   label: 'Amount'   },
    { type: 'CurrencyCell', id: 'budget',   field: 'budget',   label: 'Budget'   },
    { type: 'CurrencyCell', id: 'variance', field: 'variance', label: 'Variance' },
    { type: 'TextCell',     id: 'trend',    field: 'trend',    label: 'Trend'    },
  ];

  const grid = new GridView('grid-cost', {
    rows: enriched,
    meta: { total: enriched.length, page: 1, pageSize: PAGE_SIZE },
  }, DEFS_COST2);
  grid.mount(gridWrap);
}

// ─── Tab: Driver Performance ──────────────────────────────────────────────────
function renderDriverTab(container) {
  // Export buttons
  const exportRow = document.createElement('div');
  exportRow.id = 'export-drivers';
  exportRow.className = 'flex gap-2 mb-4';
  container.appendChild(exportRow);
  mountExportButtons('export-drivers', 'Driver Performance', 'driver-performance');

  // Grid
  const gridWrap = document.createElement('div');
  gridWrap.id = 'grid-drivers';
  container.appendChild(gridWrap);

  const DEFS_DRIVERS = [
    { type: 'RankCell',    id: 'rank',             field: 'rank',             label: '#' },
    { type: 'TextCell',    id: 'driver_name',       field: 'driver_name',      label: 'Driver'         },
    { type: 'NumberCell',  id: 'trip_count',        field: 'trip_count',       label: 'Trips'          },
    { type: 'TextCell',    id: 'on_time_pct',       field: 'on_time_pct_fmt',  label: 'On-Time %'      },
    { type: 'TextCell',    id: 'avg_rating',        field: 'avg_rating_fmt',   label: 'Avg Rating'     },
    { type: 'NumberCell',  id: 'total_mileage',     field: 'total_mileage',    label: 'Mileage (km)'   },
    { type: 'TextCell',    id: 'fuel_efficiency',   field: 'fuel_efficiency',  label: 'km/L'           },
    { type: 'NumberCell',  id: 'incidents',         field: 'incidents',        label: 'Incidents'      },
  ];

  // Pre-format display values
  const enriched = DRIVER_ROWS.map(r => ({
    ...r,
    on_time_pct_fmt: r.on_time_pct.toFixed(1) + '%',
    avg_rating_fmt:  r.avg_rating.toFixed(2),
  }));

  const grid = new GridView('grid-drivers', {
    rows: enriched,
    meta: { total: enriched.length, page: 1, pageSize: PAGE_SIZE },
  }, DEFS_DRIVERS);
  grid.mount(gridWrap);
}

// ─── TabPanel ─────────────────────────────────────────────────────────────────
const tabPanel = new TabPanel('reports-tabs', { active: 0 }, [
  {
    label: 'Fleet Utilization',
    render(container) { renderFleetTab(container); },
  },
  {
    label: 'Cost Analysis',
    render(container) { renderCostTab(container); },
  },
  {
    label: 'Driver Performance',
    render(container) { renderDriverTab(container); },
  },
]);

tabPanel.mount(document.getElementById('tab-panel'));

// ─── Toolbar export buttons (page-level, defaults to active tab) ───────────────
const toolbar = document.getElementById('toolbar');

// Fleet Utilization export (always visible)
const toolbarExcel = new ButtonExcel('toolbar-excel', {}, { label: 'Export Excel', filename: 'tms-report' });
toolbarExcel._onAction = (action, params) => {
  alert(`Exporting current report as Excel (${params.filename}.xlsx) — not wired in demo`);
};
toolbarExcel.mount(toolbar);

const toolbarPdf = new ButtonPdf('toolbar-pdf', {}, { label: 'Export PDF', filename: 'tms-report' });
toolbarPdf._onAction = (action, params) => {
  alert(`Exporting current report as PDF (${params.filename}.pdf) — not wired in demo`);
};
toolbarPdf.mount(toolbar);
</script>
</body>
</html>
