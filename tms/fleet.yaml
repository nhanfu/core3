# ─────────────────────────────────────────────────────────────────────────────
# TMS Fleet Overview — Declarative Page Config
#
# This file is the single source of truth for the Fleet Overview page.
# The runtime parses it, wires datasources, evaluates show_if / disabled_if
# expressions, and mounts components into their container elements.
# ─────────────────────────────────────────────────────────────────────────────

title: Fleet Overview

# ── Page-level metadata ──────────────────────────────────────────────────────
page:
  id: fleet-overview
  description: Monitor and manage the entire truck fleet across all branches.
  icon: truck
  auth:
    require: [fleet.read]          # user must hold this permission to load the page
    redirect_to: /login            # fallback if unauthenticated

# ── Datasources ──────────────────────────────────────────────────────────────
#
# Each datasource declares:
#   protocol   – transport layer (http | websocket | grpc)
#   roles      – which role groups may fetch this source
#   permission – fine-grained permission key checked at the API layer
#   query      – SQL template; named params (:param) are server-substituted
#   cache      – optional server-side response cache
#
datasources:
  - id: trucks
    protocol: http
    method: GET
    endpoint: /api/v1/trucks
    roles: [admin, fleet_manager, dispatcher]
    permission: fleet.read
    # Columns returned: id, plate, model, type, status, mileage,
    #                   driver_id, driver_name, phone,
    #                   last_service, next_service, branch_id, notes
    query: >
      SELECT
        t.id,
        t.plate,
        t.model,
        t.type,
        t.status,
        t.mileage,
        t.driver_id,
        d.name  AS driver_name,
        d.phone AS driver_phone,
        t.last_service,
        t.next_service,
        t.branch_id,
        t.notes,
        CASE
          WHEN t.next_service < CURRENT_DATE THEN true
          ELSE false
        END AS overdue_next
      FROM trucks t
      LEFT JOIN drivers d ON t.driver_id = d.id
      WHERE t.branch_id IN (:allowed_branches)
      ORDER BY t.plate ASC
    params:
      allowed_branches: "{{user.allowed_branches}}"  # injected at request time
    cache:
      ttl: 30s
      bust_on: [truck.updated, truck.created, truck.deleted, driver.assigned]

  - id: kpi_summary
    protocol: http
    method: GET
    endpoint: /api/v1/trucks/kpis
    roles: [admin, fleet_manager, dispatcher]
    permission: fleet.read
    # Returns: { total, active, maintenance, out_of_service, overdue_service }
    cache:
      ttl: 60s

  - id: branches
    protocol: http
    method: GET
    endpoint: /api/v1/branches
    roles: [admin, fleet_manager]
    permission: org.read
    cache:
      ttl: 300s

# ── Components ────────────────────────────────────────────────────────────────
#
# Components are mounted into DOM elements identified by `container`.
# `source` references a datasource id defined above.
# Field-level `show_if` / `disabled_if` are JS expressions evaluated with
#   `row` bound to the current record.
# Column-level `compute` is a JS expression; `field` is optional when compute
#   is present.
#
components:

  # ── KPI stat row ────────────────────────────────────────────────────────────
  - type: StatRow
    id: fleet-kpis
    container: stat-row
    source: kpi_summary          # populated from API; demo falls back to static values
    stats:
      - label: Total Trucks
        field: total
        color: indigo
        icon: truck
      - label: Active
        field: active
        color: green
        icon: check-circle
        trend: up
        delta_field: active_delta   # e.g. "+3 this month" returned by API
      - label: In Maintenance
        field: maintenance
        color: amber
        icon: wrench
      - label: Out of Service
        field: out_of_service
        color: red
        icon: x-circle
      - label: Service Overdue
        field: overdue_service
        color: orange
        icon: alert-triangle

  # ── Filter bar ──────────────────────────────────────────────────────────────
  - type: FilterBar
    id: fleet-filter
    container: filter-bar
    persist_key: fleet_filters     # saves filter state to sessionStorage
    filters:
      - field: status
        label: Status
        type: select
        options:
          - Active
          - Maintenance
          - Out of Service
        placeholder: All statuses

      - field: type
        label: Truck Type
        type: select
        options:
          - Semi
          - Box Truck
          - Flatbed
          - Refrigerated
          - Tanker
        placeholder: All types

      - field: branch_id
        label: Branch
        type: select
        source: branches           # populates options from the branches datasource
        value_field: id
        label_field: name
        placeholder: All branches
        roles: [admin, fleet_manager]   # only rendered for these roles

      - field: overdue_next
        label: Service Overdue
        type: select
        options:
          - label: "Yes — overdue"
            value: "true"
          - label: "No — on schedule"
            value: "false"
        placeholder: Any

      - field: q
        label: Search
        type: search
        placeholder: "Plate, driver, or model…"
        debounce_ms: 300

  # ── Grid view ───────────────────────────────────────────────────────────────
  - type: GridView
    id: fleet-grid
    container: fleet-grid
    source: trucks
    page_size: 8
    selectable: true              # enables row checkboxes for bulk actions
    row_href: "fleet-detail.html?id={{row.id}}"   # clicking a row navigates here

    columns:
      - type: TextCell
        id: plate
        field: plate
        label: "Plate / Model"
        secondary: model          # renders model name in smaller text below plate
        sortable: true
        min_width: 160

      - type: TextCell
        id: driver
        field: driver_name
        label: Driver
        secondary: driver_phone
        # Show "Unassigned" badge when no driver is linked
        compute: "row.driver_name || 'Unassigned'"
        secondary_compute: "row.driver_name ? row.driver_phone : null"
        sortable: true

      - type: BadgeCell
        id: status
        field: status
        label: Status
        sortable: true
        # Color mapping: keys match field values, values are Tailwind color names
        colors:
          Active:         green
          Maintenance:    amber
          "Out of Service": red

      - type: BadgeCell
        id: type
        field: type
        label: Type
        sortable: true
        colors:
          Semi:         indigo
          "Box Truck":  blue
          Flatbed:      purple
          Refrigerated: cyan
          Tanker:       teal

      - type: NumberCell
        id: mileage
        field: mileage
        label: "Mileage (km)"
        format: "#,###"
        sortable: true
        # Highlight high-mileage trucks in red
        color_compute: "row.mileage > 300000 ? 'red' : row.mileage > 150000 ? 'amber' : 'default'"

      - type: DateCell
        id: last_service
        field: last_service
        label: Last Service
        format: relative          # e.g. "3 weeks ago"
        sortable: true

      - type: DateCell
        id: next_service
        field: next_service
        label: Next Service
        format: relative
        sortable: true
        overdue_field: overdue_next   # turns cell red when true
        # Also show a warning icon if overdue
        icon_compute: "row.overdue_next ? 'alert-triangle' : null"

      - type: TextCell
        id: branch
        field: branch_id
        label: Branch
        # Rendered only for users who can see cross-branch data
        show_if: "user.roles.includes('admin') || user.roles.includes('fleet_manager')"

      - type: ActionCell
        id: actions
        field: ""
        label: ""
        actions:
          - id: view
            label: View
            variant: primary
          - id: assign
            label: Assign Driver
            variant: secondary
            # Disable Assign when truck is already out of service
            disabled_if: "row.status === 'Out of Service'"
          - id: schedule_service
            label: Schedule Service
            variant: ghost
            # Only show Schedule Service when maintenance is actually due soon or overdue
            show_if: "row.overdue_next || row.status === 'Maintenance'"
          - id: decommission
            label: Decommission
            variant: danger
            # Only show option when truck is not already decommissioned
            show_if: "row.status !== 'Out of Service'"
            # Prevent decommissioning low-mileage trucks accidentally
            disabled_if: "row.mileage < 100000"

# ── Actions ───────────────────────────────────────────────────────────────────
#
# Top-level actions are the canonical definitions. Each ActionCell entry above
# references an action by id. The runtime merges the cell-level overrides
# (show_if, disabled_if) with the action-level defaults defined here.
#
actions:
  - id: view
    label: View Truck
    description: Open the truck detail page.
    navigate_to: fleet-detail
    params:
      id: row.id

  - id: assign
    label: Assign Driver
    description: Open the driver assignment dialog for this truck.
    confirm: "Assign {{row.plate}} to a driver?"
    modal: assign-driver-form     # id of a modal/FormPanel to open (future extension)

  - id: schedule_service
    label: Schedule Service
    description: Create a maintenance work order for this truck.
    confirm: "Schedule a service appointment for {{row.plate}}?"
    navigate_to: maintenance-new
    params:
      truck_id: row.id
      pre_fill: "service"

  - id: decommission
    label: Decommission
    description: Mark the truck as permanently out of service.
    variant: danger
    show_if: "row.status !== 'Out of Service'"
    disabled_if: "row.mileage < 100000"
    confirm: "Permanently decommission {{row.plate}}? This cannot be undone."
    mutation:
      method: PATCH
      endpoint: "/api/v1/trucks/{{row.id}}"
      body:
        status: "Out of Service"
      on_success:
        toast: "{{row.plate}} has been decommissioned."
        refresh: [trucks, kpi_summary]
      on_error:
        toast: "Failed to decommission {{row.plate}}. Please try again."
        variant: error

# ── Bulk actions ─────────────────────────────────────────────────────────────
#
# Shown in a contextual bar when rows are selected via checkboxes.
#
bulk_actions:
  - id: bulk_assign_route
    label: Assign to Route
    variant: primary
    confirm: "Assign {{selection.count}} trucks to a route?"

  - id: bulk_export
    label: Export Selected
    variant: secondary
    export:
      format: xlsx
      filename: "fleet-export-{{date}}.xlsx"

  - id: bulk_decommission
    label: Decommission Selected
    variant: danger
    confirm: "Decommission {{selection.count}} trucks? This cannot be undone."
    require_all: "row.status !== 'Out of Service'"   # fails if any selected truck is already OOS

# ── Page-level toolbar buttons ────────────────────────────────────────────────
toolbar:
  - id: add_truck
    label: "+ Add Truck"
    variant: primary
    permission: fleet.write
    navigate_to: fleet-new

  - id: export_all
    label: Export All
    variant: secondary
    permission: fleet.read
    export:
      format: xlsx
      source: trucks
      filename: "all-trucks-{{date}}.xlsx"
