page:
  title: Driver Management
  subtitle: Manage all drivers and their assignments

datasource:
  table: drivers
  fields:
    - id
    - name
    - phone
    - email
    - license_number
    - license_expiry
    - status
    - assigned_truck_id
    - truck_plate
    - total_trips
    - mileage_ytd
    - rating

components:
  - type: StatRow
    id: driver-stats
    stats:
      - label: Total Drivers
        value_key: total_count
        color: indigo
      - label: Active
        value_key: active_count
        color: green
        trend: up
        delta: "+3 this month"
      - label: On Leave
        value_key: on_leave_count
        color: amber
      - label: Expiring License
        value_key: expiring_count
        color: red
        delta: within 30 days

  - type: FilterBar
    id: driver-filter
    filters:
      - field: status
        label: Status
        type: select
        options:
          - Active
          - On Leave
          - Suspended
      - field: q
        label: Search
        type: search
        placeholder: "Name or license number…"

  - type: GridView
    id: driver-grid
    pageSize: 8
    columns:
      - type: AvatarCell
        id: avatar
        field: name
        label: ""
      - type: TextCell
        id: name
        field: name
        label: Driver
        secondary: email
      - type: BadgeCell
        id: status
        field: status
        label: Status
      - type: TextCell
        id: license
        field: license_number
        label: License No.
      - type: DateCell
        id: expiry
        field: license_expiry
        label: License Expiry
        format: short
        overdueField: license_overdue
      - type: NumberCell
        id: trips_ytd
        field: total_trips
        label: Trips YTD
      - type: PercentCell
        id: rating
        field: rating
        label: Rating
      - type: ActionCell
        id: actions
        field: ""
        label: ""
        actions:
          - id: view
            label: View
          - id: assign
            label: Assign Truck
          - id: suspend
            label: Suspend
            variant: danger
