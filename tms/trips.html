<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Management — TMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

<!-- ── Inline YAML page config ── -->
<script type="text/yaml" id="page-config">
page:
  title: Trip Management
  subtitle: Track and manage all freight trips

datasource:
  table: trips
  fields:
    - id
    - trip_number
    - truck_plate
    - driver_name
    - origin
    - destination
    - status
    - departure_time
    - arrival_time
    - distance_km
    - cargo_type
    - cargo_weight

components:
  - type: StatRow
    id: trip-stats
    stats:
      - { label: Scheduled,       value_key: scheduled_count,  color: indigo }
      - { label: In Transit,      value_key: in_transit_count, color: blue }
      - { label: Completed Today, value_key: completed_today,  color: green,  trend: up }
      - { label: Cancelled,       value_key: cancelled_count,  color: red }

  - type: FilterBar
    id: trip-filter
    filters:
      - { field: status, label: Status, type: select, options: [Scheduled, In Transit, Completed, Cancelled] }
      - { field: q,      label: Search, type: search, placeholder: "Trip #, truck or driver…" }

  - type: GridView
    id: trip-grid
    pageSize: 8
    columns:
      - { type: TextCell,   id: trip_number, field: trip_number,    label: "Trip #",           secondary: cargo_type }
      - { type: TextCell,   id: truck,       field: truck_plate,    label: "Truck / Driver",   secondary: driver_name }
      - { type: TextCell,   id: route,       field: origin,         label: "Origin → Dest.",   secondary: destination }
      - { type: BadgeCell,  id: status,      field: status,         label: Status }
      - { type: DateCell,   id: departure,   field: departure_time, label: Departure,          format: short }
      - { type: DateCell,   id: arrival,     field: arrival_time,   label: Arrival,            format: short }
      - { type: NumberCell, id: distance,    field: distance_km,    label: "Distance (km)" }
      - { type: TextCell,   id: cargo,       field: cargo_type,     label: Cargo,              secondary: cargo_weight_display }
      - type: ActionCell
        id: actions
        field: ""
        label: ""
        actions:
          - { id: view,   label: View }
          - { id: cancel, label: Cancel, variant: danger }
</script>

<!-- ── Nav ── -->
<header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-14">
    <div class="flex items-center gap-6">
      <span class="font-bold text-indigo-600 text-lg">TMS</span>
      <nav class="flex gap-1 text-sm">
        <a href="fleet.html"       class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Fleet</a>
        <a href="drivers.html"     class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Drivers</a>
        <a href="trips.html"       class="px-3 py-1 rounded-md bg-indigo-50 text-indigo-700 font-medium">Trips</a>
        <a href="maintenance.html" class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Maintenance</a>
        <a href="reports.html"     class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Reports</a>
        <a href="settings.html"    class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Settings</a>
      </nav>
    </div>
    <div class="flex items-center gap-3 text-sm text-gray-500">
      <span>Admin User</span>
      <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold">AU</div>
    </div>
  </div>
</header>

<!-- ── Page header ── -->
<div class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-6 py-5">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Trip Management</h1>
        <p class="text-sm text-gray-500 mt-0.5">Track and manage all freight trips</p>
      </div>
      <button onclick="alert('New Trip — not wired in demo')"
              class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
        + New Trip
      </button>
    </div>
  </div>
</div>

<main class="max-w-7xl mx-auto px-6 py-6 space-y-6">
  <div id="stat-row"></div>
  <div id="filter-bar"></div>
  <div id="trip-grid"></div>
</main>

<div id="confirm-root"></div>

<script type="module">
import {
  StatRow, FilterBar, GridView, ConfirmDialog,
  TextCell, BadgeCell, NumberCell, DateCell, ActionCell,
} from '../../lib/components.js';

// ─── Parse YAML config ─────────────────────────────────────────────────────────
const config    = jsyaml.load(document.getElementById('page-config').textContent);
const statCfg   = config.components.find(c => c.type === 'StatRow');
const filterCfg = config.components.find(c => c.type === 'FilterBar');
const gridCfg   = config.components.find(c => c.type === 'GridView');
const PAGE_SIZE = gridCfg.pageSize || 8;

// Column definitions come entirely from the YAML
const DEFS = gridCfg.columns;

// ─── Fleet-wide summary stats ───────────────────────────────────────────────────
const FLEET_STATS = {
  scheduled_count:  4,
  in_transit_count: 3,
  completed_today:  3,
  cancelled_count:  2,
};

// ─── Mock data (12 trips) ───────────────────────────────────────────────────────
const ALL_TRIPS = [

  {

  {

  },
  {
    id: 'TR004', trip_number: 'TRP-2026-004',
    truck_plate: 'IL-401-STU', driver_name: 'Tom Williams',
    origin: 'Chicago, IL',       destination: 'Detroit, MI',
    status: 'Scheduled',

  },
  {
    id: 'TR005', trip_number: 'TRP-2026-005',
    truck_plate: 'WA-501-VWX', driver_name: 'Diana Park',
    origin: 'Seattle, WA',       destination: 'Portland, OR',
    status: 'Completed',
    departure_time: '2026-07-25', arrival_time: '2026-07-25',
    distance_km: 283, cargo_type: 'Groceries',      cargo_weight_display: '4,500 kg',
  },
  {

  },
  {
    id: 'TR007', trip_number: 'TRP-2026-007',

    origin: 'Denver, CO',        destination: 'Salt Lake City, UT',
    status: 'Scheduled',
    departure_time: '2026-07-27', arrival_time: '2026-07-27',
    distance_km: 661, cargo_type: 'Machinery',      cargo_weight_display: '9,200 kg',
  },
  {
    id: 'TR008', trip_number: 'TRP-2026-008',
    truck_plate: 'TX-202-MNO', driver_name: 'James Lee',
    origin: 'Austin, TX',        destination: 'San Antonio, TX',
    status: 'Cancelled',

    distance_km: 128, cargo_type: 'Retail Goods',   cargo_weight_display: '3,600 kg',
  },
  {
    id: 'TR009', trip_number: 'TRP-2026-009',
    truck_plate: 'CA-103-PQR', driver_name: 'Unassigned',
    origin: 'Sacramento, CA',    destination: 'Reno, NV',
    status: 'Scheduled',

  },
  {
    id: 'TR010', trip_number: 'TRP-2026-010',
    truck_plate: 'FL-302-BCD', driver_name: 'Linda Davis',
    origin: 'Tampa, FL',         destination: 'Jacksonville, FL',
    status: 'Completed',
    departure_time: '2026-07-25', arrival_time: '2026-07-25',
    distance_km: 296, cargo_type: 'Perishables',    cargo_weight_display: '4,200 kg',
  },
  {
    id: 'TR011', trip_number: 'TRP-2026-011',
    truck_plate: 'IL-402-EFG', driver_name: 'Tom Williams',
    origin: 'Indianapolis, IN',  destination: 'Columbus, OH',
    status: 'Cancelled',
    departure_time: '2026-07-24', arrival_time: null,
    distance_km: 280, cargo_type: 'Electronics',    cargo_weight_display: '2,100 kg',
  },
  {
    id: 'TR012', trip_number: 'TRP-2026-012',
    truck_plate: 'CA-102-DEF', driver_name: 'Sarah Chen',
    origin: 'San Diego, CA',     destination: 'Los Angeles, CA',
    status: 'In Transit',
    departure_time: '2026-07-25', arrival_time: '2026-07-25',
    distance_km: 193, cargo_type: 'Consumer Goods', cargo_weight_display: '5,500 kg',
  },
];

// ─── State ─────────────────────────────────────────────────────────────────────
let filters = { status: '', q: '' };
let page    = 1;

function filtered() {
  return ALL_TRIPS.filter(t =>
    (!filters.status || t.status === filters.status) &&
    (!filters.q      || t.trip_number.toLowerCase().includes(filters.q.toLowerCase())  ||
                        t.truck_plate.toLowerCase().includes(filters.q.toLowerCase())   ||
                        t.driver_name.toLowerCase().includes(filters.q.toLowerCase()))
  );
}

// ─── Confirm dialog (single reusable instance) ─────────────────────────────────
let pendingConfirmCb = null;
const confirmDlg = new ConfirmDialog('main-confirm', { open: false });
confirmDlg._onAction = (action) => {
  if (action === 'confirm' && typeof pendingConfirmCb === 'function') {
    pendingConfirmCb();
    pendingConfirmCb = null;
  }
};
confirmDlg.mount(document.getElementById('confirm-root'));

function showConfirm({ title, message, confirmLabel = 'Confirm', variant = 'danger', onConfirm }) {
  pendingConfirmCb = onConfirm;
  confirmDlg.setState({ open: true, title, message, confirmLabel, variant });
}

// ─── StatRow — values resolved from YAML stat config keys ─────────────────────
new StatRow(statCfg.id,
  statCfg.stats.map(s => ({
    label: s.label,
    value: FLEET_STATS[s.value_key] ?? 0,
    color: s.color,
    trend: s.trend || null,
    delta: s.delta || null,
  }))
).mount(document.getElementById('stat-row'));

// ─── FilterBar — field list from YAML filter config ───────────────────────────
const filterBar = new FilterBar(filterCfg.id, { values: {} },
  filterCfg.filters.map(f => ({
    field:       f.field,
    label:       f.label,
    type:        f.type,
    options:     f.options     || [],
    placeholder: f.placeholder || '',
  }))
);
filterBar._onAction = (action, params) => {
  if (action === 'filter.change') {
    filters = { status: params.values.status || '', q: params.values.q || '' };
  } else {
    filters = { status: '', q: '' };
  }
  page = 1;
  refreshGrid();
};
filterBar.mount(document.getElementById('filter-bar'));

// ─── GridView — columns driven by YAML DEFS ────────────────────────────────────
let grid;
let _gridSetState; // original setState, saved before pagination interception

function refreshGrid() {
  const rows     = filtered();
  const start    = (page - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  const meta     = { total: rows.length, page, pageSize: PAGE_SIZE };

  if (!grid) {
    grid = new GridView(gridCfg.id, { rows: pageRows, meta }, DEFS);

    // Save and intercept setState so pagination drives real data slicing
    _gridSetState = grid.setState.bind(grid);
    grid.setState = function (newState) {
      if (newState.meta && newState.meta.page !== undefined) {
        page = newState.meta.page;
        refreshGrid();
      } else {
        _gridSetState(newState);
      }
    };

    grid._onAction = (action, params) => {
      const t = params.row;
      if (action === 'view') {
        window.location.href = `trip-detail.html?id=${t.id}`;
      } else if (action === 'cancel') {
        if (t.status === 'Cancelled') {
          alert(`Trip ${t.trip_number} is already cancelled.`);
          return;
        }
        showConfirm({
          title:        'Cancel Trip',
          message:      `Cancel trip ${t.trip_number} (${t.origin} → ${t.destination})? This action cannot be undone.`,
          confirmLabel: 'Cancel Trip',
          variant:      'danger',
          onConfirm: () => {
            t.status = 'Cancelled';
            t.arrival_time = null;
            refreshGrid();
          },
        });
      }
    };

    grid.mount(document.getElementById('trip-grid'));
  } else {
    _gridSetState({ rows: pageRows, meta });
  }
}

refreshGrid();
</script>
</body>
</html>
