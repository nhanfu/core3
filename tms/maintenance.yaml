# ─────────────────────────────────────────────────────────────────────────────
# TMS Maintenance Dashboard — Declarative Page Config
#
# This file is the single source of truth for the Maintenance Dashboard page.
# The runtime parses it, wires datasources, evaluates show_if / disabled_if
# expressions, and mounts components into their container elements.
# ─────────────────────────────────────────────────────────────────────────────

title: Maintenance Dashboard

# ── Page-level metadata ──────────────────────────────────────────────────────
page:
  id: maintenance-dashboard
  description: Track and manage all vehicle maintenance records across the fleet.
  icon: wrench
  auth:
    require: [maintenance.read]
    redirect_to: /login

# ── Datasources ──────────────────────────────────────────────────────────────
datasources:
  - id: maintenance_records
    protocol: http
    method: GET
    endpoint: /api/v1/maintenance
    roles: [admin, fleet_manager, mechanic]
    permission: maintenance.read
    # Columns returned: id, truck_plate, truck_model, service_type, status,
    #                   due_date, completed_date, technician, estimated_cost,
    #                   actual_cost, priority, notes, is_overdue
    query: >
      SELECT
        m.id,
        t.plate  AS truck_plate,
        t.model  AS truck_model,
        m.service_type,
        m.status,
        m.due_date,
        m.completed_date,
        m.technician,
        m.estimated_cost,
        m.actual_cost,
        m.priority,
        m.notes,
        CASE
          WHEN m.status NOT IN ('Completed')
           AND m.due_date < CURRENT_DATE THEN true
          ELSE false
        END AS is_overdue
      FROM maintenance_records m
      JOIN trucks t ON m.truck_id = t.id
      ORDER BY
        CASE m.priority WHEN 'High' THEN 1 WHEN 'Medium' THEN 2 ELSE 3 END,
        m.due_date ASC
    cache:
      ttl: 30s
      bust_on: [maintenance.updated, maintenance.created, maintenance.completed]

  - id: maintenance_kpis
    protocol: http
    method: GET
    endpoint: /api/v1/maintenance/kpis
    roles: [admin, fleet_manager, mechanic]
    permission: maintenance.read
    # Returns: { overdue, due_this_week, in_progress, completed_this_month,
    #            fleet_health_pct, inspections_current_pct, on_schedule_pct }
    cache:
      ttl: 60s
      bust_on: [maintenance.updated, maintenance.created, maintenance.completed]

  - id: technicians
    protocol: http
    method: GET
    endpoint: /api/v1/users?role=mechanic
    roles: [admin, fleet_manager]
    permission: org.read
    cache:
      ttl: 300s

# ── Components ────────────────────────────────────────────────────────────────
components:

  # ── KPI stat row ────────────────────────────────────────────────────────────
  - type: StatRow
    id: maintenance-kpis
    container: stat-row
    source: maintenance_kpis
    stats:
      - label: Overdue
        field: overdue
        color: red
        icon: alert-triangle
      - label: Due This Week
        field: due_this_week
        color: amber
        icon: clock
      - label: In Progress
        field: in_progress
        color: blue
        icon: tool
      - label: Completed This Month
        field: completed_this_month
        color: green
        icon: check-circle

  # ── Fleet health progress bars ───────────────────────────────────────────────
  - type: ProgressBar
    id: progress-fleet-health
    container: progress-fleet-health
    source: maintenance_kpis
    label: Fleet Health
    field: fleet_health_pct
    color: green

  - type: ProgressBar
    id: progress-inspections
    container: progress-inspections
    source: maintenance_kpis
    label: Inspections Current
    field: inspections_current_pct
    color: indigo

  - type: ProgressBar
    id: progress-on-schedule
    container: progress-on-schedule
    source: maintenance_kpis
    label: Services on Schedule
    field: on_schedule_pct
    color: teal

  # ── Filter bar ──────────────────────────────────────────────────────────────
  - type: FilterBar
    id: maintenance-filter
    container: filter-bar
    persist_key: maintenance_filters
    filters:
      - field: service_type
        label: Service Type
        type: select
        options:
          - Oil Change
          - Inspection
          - Tire Rotation
          - Brake Service
          - Engine Overhaul
        placeholder: All types

      - field: technician
        label: Technician
        type: select
        source: technicians
        value_field: name
        label_field: name
        placeholder: All technicians

      - field: due_date
        label: Due Date Range
        type: date-range

  # ── Tab panel with four views ─────────────────────────────────────────────────
  - type: TabPanel
    id: maintenance-tabs
    container: tab-panel
    tabs:
      - id: all
        label: All
        grid: grid-all

      - id: overdue
        label: Overdue
        grid: grid-overdue
        filter:
          status: Overdue

      - id: due-this-week
        label: Due This Week
        grid: grid-week
        filter:
          due_within_days: 7

      - id: completed
        label: Completed
        grid: grid-completed
        filter:
          status: Completed

  # ── Column definition set (shared across all tab grids) ──────────────────────
  # Runtime YAML anchors (&) are expanded at parse time; each grid references
  # the same column set via the alias (*maintenance_columns).

  # ── Grid — All ────────────────────────────────────────────────────────────────
  - type: GridView
    id: grid-all
    container: grid-all
    source: maintenance_records
    page_size: 10
    selectable: false

    columns: &maintenance_columns
      - type: TextCell
        id: truck
        field: truck_plate
        label: Truck
        secondary: truck_model
        sortable: true

      - type: BadgeCell
        id: service_type
        field: service_type
        label: Service Type
        sortable: true
        colors:
          Oil Change:      blue
          Inspection:      teal
          Tire Rotation:   gray
          Brake Service:   orange
          Engine Overhaul: red

      - type: BadgeCell
        id: status
        field: status
        label: Status
        sortable: true
        colors:
          Scheduled:     purple
          "In Progress": blue
          Completed:     green
          Overdue:       red

      - type: DateCell
        id: due_date
        field: due_date
        label: Due Date
        format: relative
        overdue_field: is_overdue
        sortable: true
        # Red + warning icon when is_overdue is true
        icon_compute: "row.is_overdue ? 'alert-triangle' : null"

      - type: DateCell
        id: completed_date
        field: completed_date
        label: Completed
        format: short

      - type: TextCell
        id: technician
        field: technician
        label: Technician

      - type: CurrencyCell
        id: estimated_cost
        field: estimated_cost
        label: Est. Cost
        currency: USD
        align: right

      - type: CurrencyCell
        id: actual_cost
        field: actual_cost
        label: Actual Cost
        currency: USD
        align: right

      - type: BadgeCell
        id: priority
        field: priority
        label: Priority
        colors:
          High:   red
          Medium: amber
          Low:    green

      - type: ActionCell
        id: actions
        field: ""
        label: ""
        actions:
          - id: mark_done
            label: Mark Done
            variant: primary
            show_if: "row.status !== 'Completed'"
          - id: reschedule
            label: Reschedule
            variant: ghost
            show_if: "row.status !== 'Completed'"
          - id: view_details
            label: View Details

  # ── Grid — Overdue ────────────────────────────────────────────────────────────
  - type: GridView
    id: grid-overdue
    container: grid-overdue
    source: maintenance_records
    page_size: 10
    server_filter:
      status: Overdue
    columns: *maintenance_columns

  # ── Grid — Due This Week ──────────────────────────────────────────────────────
  - type: GridView
    id: grid-week
    container: grid-week
    source: maintenance_records
    page_size: 10
    server_filter:
      due_within_days: 7
    columns: *maintenance_columns

  # ── Grid — Completed ──────────────────────────────────────────────────────────
  - type: GridView
    id: grid-completed
    container: grid-completed
    source: maintenance_records
    page_size: 10
    server_filter:
      status: Completed
    columns: *maintenance_columns

# ── Actions ───────────────────────────────────────────────────────────────────
actions:
  - id: mark_done
    label: Mark Done
    description: Mark a maintenance record as completed.
    variant: primary
    confirm: "Mark service '{{row.service_type}}' for {{row.truck_plate}} as completed?"
    mutation:
      method: PATCH
      endpoint: "/api/v1/maintenance/{{row.id}}"
      body:
        status: Completed
        completed_date: "{{now}}"
      on_success:
        toast: "{{row.truck_plate}} – {{row.service_type}} marked as completed."
        refresh: [maintenance_records, maintenance_kpis]
      on_error:
        toast: "Failed to update maintenance record."
        variant: error

  - id: reschedule
    label: Reschedule
    description: Change the scheduled date for a maintenance appointment.
    modal: reschedule-form
    params:
      record_id: row.id
      truck_plate: row.truck_plate
      service_type: row.service_type
      current_due_date: row.due_date

  - id: view_details
    label: View Details
    description: Open the full maintenance record detail page.
    navigate_to: maintenance-detail
    params:
      id: row.id

# ── Bulk actions ─────────────────────────────────────────────────────────────
bulk_actions:
  - id: bulk_mark_done
    label: Mark Selected Done
    variant: primary
    confirm: "Mark {{selection.count}} maintenance records as completed?"

  - id: bulk_reassign
    label: Reassign Technician
    variant: secondary
    modal: reassign-technician-form

# ── Page-level toolbar buttons ────────────────────────────────────────────────
toolbar:
  - id: add_record
    label: "+ Schedule Service"
    variant: primary
    permission: maintenance.write
    navigate_to: maintenance-new

  - id: export_records
    label: Export
    variant: secondary
    permission: maintenance.read
    export:
      format: xlsx
      source: maintenance_records
      filename: "maintenance-{{date}}.xlsx"
