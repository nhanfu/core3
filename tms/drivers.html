<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Management — TMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

<!-- ── Inline YAML page config ── -->
<script type="text/yaml" id="page-config">
page:
  title: Driver Management
  subtitle: Manage all drivers and their assignments

datasource:
  table: drivers
  fields:
    - id
    - name
    - phone
    - email
    - license_number
    - license_expiry
    - status
    - assigned_truck_id
    - truck_plate
    - total_trips
    - mileage_ytd
    - rating

components:
  - type: StatRow
    id: driver-stats
    stats:
      - { label: Total Drivers,    value_key: total_count,    color: indigo }
      - { label: Active,           value_key: active_count,   color: green,  trend: up, delta: "+3 this month" }
      - { label: On Leave,         value_key: on_leave_count, color: amber }
      - { label: Expiring License, value_key: expiring_count, color: red,    delta: "within 30 days" }

  - type: FilterBar
    id: driver-filter
    filters:
      - { field: status, label: Status, type: select, options: [Active, On Leave, Suspended] }
      - { field: q,      label: Search, type: search, placeholder: "Name or license number…" }

  - type: GridView
    id: driver-grid
    pageSize: 8
    columns:
      - { type: AvatarCell,  id: avatar,    field: name,           label: "" }
      - { type: TextCell,    id: name,      field: name,           label: Driver,            secondary: email }
      - { type: BadgeCell,   id: status,    field: status,         label: Status }
      - { type: TextCell,    id: license,   field: license_number, label: "License No." }
      - { type: DateCell,    id: expiry,    field: license_expiry, label: "License Expiry",  format: short, overdueField: license_overdue }
      - { type: NumberCell,  id: trips_ytd, field: total_trips,    label: "Trips YTD" }
      - { type: PercentCell, id: rating,    field: rating,         label: Rating }
      - type: ActionCell
        id: actions
        field: ""
        label: ""
        actions:
          - { id: view,    label: View }
          - { id: assign,  label: "Assign Truck" }
          - { id: suspend, label: Suspend, variant: danger }
</script>

<!-- ── Nav ── -->
<header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-14">
    <div class="flex items-center gap-6">
      <span class="font-bold text-indigo-600 text-lg">TMS</span>
      <nav class="flex gap-1 text-sm">
        <a href="fleet.html"       class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Fleet</a>
        <a href="drivers.html"     class="px-3 py-1 rounded-md bg-indigo-50 text-indigo-700 font-medium">Drivers</a>
        <a href="trips.html"       class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Trips</a>
        <a href="maintenance.html" class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Maintenance</a>
        <a href="reports.html"     class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Reports</a>
        <a href="settings.html"    class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Settings</a>
      </nav>
    </div>
    <div class="flex items-center gap-3 text-sm text-gray-500">
      <span>Admin User</span>
      <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold">AU</div>
    </div>
  </div>
</header>

<!-- ── Page header ── -->
<div class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-6 py-5">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Driver Management</h1>
        <p class="text-sm text-gray-500 mt-0.5">Manage all drivers and their assignments</p>
      </div>
      <button onclick="alert('Add Driver — not wired in demo')"
              class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
        + Add Driver
      </button>
    </div>
  </div>
</div>

<main class="max-w-7xl mx-auto px-6 py-6 space-y-6">
  <div id="stat-row"></div>
  <div id="filter-bar"></div>
  <div id="driver-grid"></div>
</main>

<div id="confirm-root"></div>

<script type="module">
import {
  StatRow, FilterBar, GridView, ConfirmDialog,
  TextCell, BadgeCell, NumberCell, DateCell, ActionCell, AvatarCell, PercentCell,
} from '../../lib/components.js';

// ─── Parse YAML config ─────────────────────────────────────────────────────────
const config    = jsyaml.load(document.getElementById('page-config').textContent);
const statCfg   = config.components.find(c => c.type === 'StatRow');
const filterCfg = config.components.find(c => c.type === 'FilterBar');
const gridCfg   = config.components.find(c => c.type === 'GridView');
const PAGE_SIZE = gridCfg.pageSize || 8;

// Column definitions come entirely from the YAML — no hardcoded DEFS below
const DEFS = gridCfg.columns;

// ─── Fleet-wide summary stats ───────────────────────────────────────────────────
const FLEET_STATS = {
  total_count:    28,
  active_count:   22,
  on_leave_count:  4,
  expiring_count:  3,
};

// ─── Mock data (10 drivers) ────────────────────────────────────────────────────
const ALL_DRIVERS = [
  {
    id: 'D001', name: 'Mike Johnson',   phone: '+1-555-0201', email: 'mike.j@tms.com',
    license_number: 'CDL-TX-201456', license_expiry: '2027-03-15',
    status: 'Active',    truck_plate: 'TX-201-GHI',
    total_trips: 142, mileage_ytd: 28400, rating: 91, license_overdue: false,
  },
  {
    id: 'D002', name: 'Sarah Chen',     phone: '+1-555-0202', email: 'sarah.c@tms.com',
    license_number: 'CDL-CA-102889', license_expiry: '2026-08-10',
    status: 'Active',    truck_plate: 'CA-101-ABC',
    total_trips: 98,  mileage_ytd: 19200, rating: 87, license_overdue: true,
  },
  {
    id: 'D003', name: 'Carlos Rivera',  phone: '+1-555-0203', email: 'carlos.r@tms.com',
    license_number: 'CDL-FL-305712', license_expiry: '2026-07-20',
    status: 'Active',    truck_plate: 'FL-301-JKL',
    total_trips: 215, mileage_ytd: 42100, rating: 95, license_overdue: true,
  },
  {
    id: 'D004', name: 'Emily Watson',   phone: '+1-555-0204', email: 'emily.w@tms.com',
    license_number: 'CDL-WA-504321', license_expiry: '2027-11-28',
    status: 'On Leave',  truck_plate: null,
    total_trips: 67,  mileage_ytd: 13800, rating: 82, license_overdue: false,
  },
  {
    id: 'D005', name: 'James Lee',      phone: '+1-555-0205', email: 'james.l@tms.com',
    license_number: 'CDL-IL-401078', license_expiry: '2026-08-20',
    status: 'Suspended', truck_plate: null,
    total_trips: 31,  mileage_ytd:  5900, rating: 54, license_overdue: true,
  },
  {
    id: 'D006', name: 'Tom Williams',   phone: '+1-555-0206', email: 'tom.w@tms.com',
    license_number: 'CDL-TX-209445', license_expiry: '2027-06-04',
    status: 'Active',    truck_plate: 'IL-401-STU',
    total_trips: 178, mileage_ytd: 35600, rating: 88, license_overdue: false,
  },
  {
    id: 'D007', name: 'Diana Park',     phone: '+1-555-0207', email: 'diana.p@tms.com',
    license_number: 'CDL-WA-502156', license_expiry: '2026-08-05',
    status: 'Active',    truck_plate: 'WA-501-VWX',
    total_trips: 124, mileage_ytd: 24800, rating: 93, license_overdue: true,
  },
  {
    id: 'D008', name: 'Robert Brown',   phone: '+1-555-0208', email: 'robert.b@tms.com',
    license_number: 'CDL-CA-104782', license_expiry: '2027-09-17',
    status: 'Active',    truck_plate: 'CA-104-YZA',
    total_trips: 203, mileage_ytd: 40600, rating: 90, license_overdue: false,
  },
  {
    id: 'D009', name: 'Linda Davis',    phone: '+1-555-0209', email: 'linda.d@tms.com',
    license_number: 'CDL-FL-302544', license_expiry: '2027-02-22',
    status: 'On Leave',  truck_plate: null,
    total_trips: 89,  mileage_ytd: 17800, rating: 79, license_overdue: false,
  },
  {
    id: 'D010', name: 'Kevin Martinez', phone: '+1-555-0210', email: 'kevin.m@tms.com',
    license_number: 'CDL-IL-402671', license_expiry: '2027-04-30',
    status: 'Active',    truck_plate: 'WA-502-HIJ',
    total_trips: 156, mileage_ytd: 31200, rating: 86, license_overdue: false,
  },
];

// ─── State ─────────────────────────────────────────────────────────────────────
let filters = { status: '', q: '' };
let page    = 1;

function filtered() {
  return ALL_DRIVERS.filter(d =>
    (!filters.status || d.status === filters.status) &&
    (!filters.q      || d.name.toLowerCase().includes(filters.q.toLowerCase()) ||
                        d.license_number.toLowerCase().includes(filters.q.toLowerCase()))
  );
}

// ─── Confirm dialog (single reusable instance) ─────────────────────────────────
let pendingConfirmCb = null;
const confirmDlg = new ConfirmDialog('main-confirm', { open: false });
confirmDlg._onAction = (action) => {
  if (action === 'confirm' && typeof pendingConfirmCb === 'function') {
    pendingConfirmCb();
    pendingConfirmCb = null;
  }
};
confirmDlg.mount(document.getElementById('confirm-root'));

function showConfirm({ title, message, confirmLabel = 'Confirm', variant = 'danger', onConfirm }) {
  pendingConfirmCb = onConfirm;
  confirmDlg.setState({ open: true, title, message, confirmLabel, variant });
}

// ─── StatRow — values resolved from YAML stat config keys ─────────────────────
new StatRow(statCfg.id,
  statCfg.stats.map(s => ({
    label: s.label,
    value: FLEET_STATS[s.value_key] ?? 0,
    color: s.color,
    trend: s.trend || null,
    delta: s.delta || null,
  }))
).mount(document.getElementById('stat-row'));

// ─── FilterBar — field list from YAML filter config ───────────────────────────
const filterBar = new FilterBar(filterCfg.id, { values: {} },
  filterCfg.filters.map(f => ({
    field:       f.field,
    label:       f.label,
    type:        f.type,
    options:     f.options     || [],
    placeholder: f.placeholder || '',
  }))
);
filterBar._onAction = (action, params) => {
  if (action === 'filter.change') {
    filters = { status: params.values.status || '', q: params.values.q || '' };
  } else {
    filters = { status: '', q: '' };
  }
  page = 1;
  refreshGrid();
};
filterBar.mount(document.getElementById('filter-bar'));

// ─── GridView — columns driven by YAML DEFS ────────────────────────────────────
let grid;
let _gridSetState; // original setState, saved before pagination interception

function refreshGrid() {
  const rows     = filtered();
  const start    = (page - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  const meta     = { total: rows.length, page, pageSize: PAGE_SIZE };

  if (!grid) {
    grid = new GridView(gridCfg.id, { rows: pageRows, meta }, DEFS);

    // Save and intercept setState so GridView pagination buttons drive real data slicing
    _gridSetState = grid.setState.bind(grid);
    grid.setState = function (newState) {
      if (newState.meta && newState.meta.page !== undefined) {
        page = newState.meta.page;
        refreshGrid();
      } else {
        _gridSetState(newState);
      }
    };

    grid._onAction = (action, params) => {
      const d = params.row;
      if (action === 'view') {
        window.location.href = `driver-detail.html?id=${d.id}`;
      } else if (action === 'assign') {
        showConfirm({
          title:        'Assign Truck',
          message:      `Assign a truck to ${d.name}? This will update their current assignment.`,
          confirmLabel: 'Assign',
          variant:      'primary',
          onConfirm:    () => alert(`Truck assignment saved for ${d.name}`),
        });
      } else if (action === 'suspend') {
        if (d.status === 'Suspended') {
          alert(`${d.name} is already suspended.`);
          return;
        }
        showConfirm({
          title:        'Suspend Driver',
          message:      `Suspend ${d.name}? They will be removed from all active assignments.`,
          confirmLabel: 'Suspend',
          variant:      'danger',
          onConfirm: () => {
            d.status = 'Suspended';
            refreshGrid();
          },
        });
      }
    };

    grid.mount(document.getElementById('driver-grid'));
  } else {
    _gridSetState({ rows: pageRows, meta });
  }
}

refreshGrid();
</script>
</body>
</html>
