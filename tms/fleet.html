<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Overview — TMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

<!-- ── Inline YAML page config ──────────────────────────────────────────────
     The runtime reads this block, parses it, and uses the resulting object
     to drive datasource wiring, component rendering, and action handling.
     In production this tag would be served by the page controller; in this
     demo it is inlined so the page is self-contained.
──────────────────────────────────────────────────────────────────────────── -->
<script type="text/yaml" id="page-config">
title: Fleet Overview

page:
  id: fleet-overview
  auth:
    require: [fleet.read]

datasources:
  - id: trucks
    protocol: http
    method: GET
    endpoint: /api/v1/trucks
    roles: [admin, fleet_manager, dispatcher]
    permission: fleet.read
    cache:
      ttl: 30s

  - id: kpi_summary
    protocol: http
    endpoint: /api/v1/trucks/kpis
    permission: fleet.read
    cache:
      ttl: 60s

components:
  - type: StatRow
    id: fleet-kpis
    container: stat-row
    source: kpi_summary
    stats:
      - label: Total Trucks
        field: total
        color: indigo
      - label: Active
        field: active
        color: green
        trend: up
      - label: In Maintenance
        field: maintenance
        color: amber
      - label: Out of Service
        field: out_of_service
        color: red
      - label: Service Overdue
        field: overdue_service
        color: orange

  - type: FilterBar
    id: fleet-filter
    container: filter-bar
    filters:
      - field: status
        label: Status
        type: select
        options: [Active, Maintenance, Out of Service]
      - field: type
        label: Truck Type
        type: select
        options: [Semi, Box Truck, Flatbed, Refrigerated, Tanker]
      - field: overdue_next
        label: Service Overdue
        type: select
        options:
          - label: "Yes — overdue"
            value: "true"
          - label: "No — on schedule"
            value: "false"
      - field: q
        label: Search
        type: search
        placeholder: "Plate, driver, or model…"

  - type: GridView
    id: fleet-grid
    container: fleet-grid
    source: trucks
    page_size: 8
    selectable: true
    columns:
      - type: TextCell
        id: plate
        field: plate
        label: "Plate / Model"
        secondary: model
        sortable: true
      - type: TextCell
        id: driver
        field: driver_name
        label: Driver
        secondary: driver_phone
        sortable: true
      - type: BadgeCell
        id: status
        field: status
        label: Status
        sortable: true
        colors:
          Active: green
          Maintenance: amber
          "Out of Service": red
      - type: BadgeCell
        id: type
        field: type
        label: Type
        sortable: true
      - type: NumberCell
        id: mileage
        field: mileage
        label: "Mileage (km)"
        format: "#,###"
        sortable: true
      - type: DateCell
        id: last_service
        field: last_service
        label: Last Service
        format: relative
        sortable: true
      - type: DateCell
        id: next_service
        field: next_service
        label: Next Service
        format: relative
        sortable: true
        overdue_field: overdue_next
      - type: ActionCell
        id: actions
        field: ""
        label: ""
        actions:
          - id: view
            label: View
          - id: assign
            label: Assign Driver
            disabled_if: "row.status === 'Out of Service'"
          - id: decommission
            label: Decommission
            variant: danger
            show_if: "row.status !== 'Out of Service'"
            disabled_if: "row.mileage < 100000"

actions:
  - id: view
    label: View Truck
    navigate_to: fleet-detail
    params:
      id: row.id
  - id: assign
    label: Assign Driver
    confirm: "Assign {row.plate} to a driver?"
  - id: decommission
    label: Decommission
    variant: danger
    show_if: "row.status !== 'Out of Service'"
    disabled_if: "row.mileage < 100000"
    confirm: "Permanently decommission {row.plate}? This cannot be undone."
</script>

<!-- ── Nav ─────────────────────────────────────────────────────────────────── -->
<header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-14">
    <div class="flex items-center gap-6">
      <span class="font-bold text-indigo-600 text-lg tracking-tight">TMS</span>
      <nav class="flex gap-1 text-sm">
        <a href="fleet.html"       class="px-3 py-1 rounded-md bg-indigo-50 text-indigo-700 font-medium">Fleet</a>
        <a href="drivers.html"     class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Drivers</a>
        <a href="trips.html"       class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Trips</a>
        <a href="maintenance.html" class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Maintenance</a>
        <a href="reports.html"     class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Reports</a>
        <a href="settings.html"    class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Settings</a>
      </nav>
    </div>
    <div class="flex items-center gap-3 text-sm text-gray-500">
      <span>Fleet Manager</span>
      <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold">FM</div>
    </div>
  </div>
</header>

<!-- ── YAML-driven banner ────────────────────────────────────────────────────
     Demonstrates that the page is config-driven. In a real deployment this
     would be removed; the banner is purely for demo clarity.
──────────────────────────────────────────────────────────────────────────── -->
<div id="yaml-banner" class="bg-indigo-600 text-white text-xs px-6 py-1.5 flex items-center gap-2">
  <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20A10 10 0 0012 2z"/>
  </svg>
  <span>Page config loaded from YAML &mdash; title: <strong id="banner-title"></strong> &mdash;
        datasources: <strong id="banner-ds"></strong> &mdash;
        components: <strong id="banner-comp"></strong></span>
</div>

<!-- ── Page header ──────────────────────────────────────────────────────────── -->
<div class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-6 py-5">
    <div class="flex items-center justify-between">
      <div>
        <h1 id="page-title" class="text-2xl font-bold text-gray-900">Fleet Overview</h1>
        <p class="text-sm text-gray-500 mt-0.5">Manage all trucks across all branches</p>
      </div>
      <button onclick="alert('Add Truck — not wired in demo')"
              class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
        + Add Truck
      </button>
    </div>
  </div>
</div>

<main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

  <!-- StatRow -->
  <div id="stat-row"></div>

  <!-- FilterBar -->
  <div id="filter-bar"></div>

  <!-- Bulk action bar (visible when rows are selected) -->
  <div id="bulk-bar" class="hidden items-center justify-between bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-2">
    <span id="bulk-label" class="text-sm font-medium text-indigo-700">0 trucks selected</span>
    <div class="flex gap-2">
      <button onclick="alert('Assign to Route')"
              class="px-3 py-1.5 text-sm bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
        Assign to Route
      </button>
      <button onclick="alert('Export selected')"
              class="px-3 py-1.5 text-sm bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50">
        Export
      </button>
    </div>
  </div>

  <!-- GridView -->
  <div id="fleet-grid"></div>

</main>

<script type="module">
import {
  StatRow, FilterBar, GridView,
  TextCell, BadgeCell, NumberCell, DateCell, ActionCell,
} from '../lib/components/index.js';
import { BaseComponent } from '../lib/runtime.js';

// ─── 1. Parse the YAML page config ──────────────────────────────────────────
const pageConfig = jsyaml.load(document.getElementById('page-config').textContent);

// Reflect parsed config in the demo banner
document.getElementById('banner-title').textContent  = pageConfig.title;
document.getElementById('banner-ds').textContent     = pageConfig.datasources.length;
document.getElementById('banner-comp').textContent   = pageConfig.components.length;
document.getElementById('page-title').textContent    = pageConfig.title;

// ─── 2. Mock data (stands in for the `trucks` datasource) ───────────────────
const ALL_TRUCKS = [
  { id: 'T001', plate: 'CA-101-ABC', model: 'Freightliner Cascadia',  driver_name: 'Mike Johnson',   driver_phone: '+1-555-0101', status: 'Active',         type: 'Semi',         mileage: 125400, last_service: '2026-07-01', next_service: '2026-08-15', overdue_next: false },
  { id: 'T002', plate: 'CA-102-DEF', model: 'Kenworth T680',          driver_name: 'Sarah Chen',     driver_phone: '+1-555-0102', status: 'Maintenance',    type: 'Semi',         mileage: 98200,  last_service: '2026-06-15', next_service: '2026-07-15', overdue_next: true  },
  { id: 'T003', plate: 'TX-201-GHI', model: 'Peterbilt 579',          driver_name: 'Carlos Rivera',  driver_phone: '+1-555-0103', status: 'Active',         type: 'Semi',         mileage: 210500, last_service: '2026-07-10', next_service: '2026-08-10', overdue_next: false },
  { id: 'T004', plate: 'FL-301-JKL', model: 'Isuzu NPR',              driver_name: 'Emily Watson',   driver_phone: '+1-555-0104', status: 'Active',         type: 'Box Truck',    mileage: 45800,  last_service: '2026-06-20', next_service: '2026-08-20', overdue_next: false },
  { id: 'T005', plate: 'TX-202-MNO', model: 'International LT',       driver_name: 'James Lee',      driver_phone: '+1-555-0105', status: 'Out of Service', type: 'Semi',         mileage: 320100, last_service: '2026-05-01', next_service: '2026-07-01', overdue_next: true  },
  { id: 'T006', plate: 'CA-103-PQR', model: 'Ford Transit',           driver_name: 'Unassigned',     driver_phone: null,          status: 'Active',         type: 'Box Truck',    mileage: 28400,  last_service: '2026-07-05', next_service: '2026-09-05', overdue_next: false },
  { id: 'T007', plate: 'IL-401-STU', model: 'Mack Anthem',            driver_name: 'Tom Williams',   driver_phone: '+1-555-0107', status: 'Active',         type: 'Flatbed',      mileage: 185200, last_service: '2026-06-28', next_service: '2026-07-28', overdue_next: true  },
  { id: 'T008', plate: 'WA-501-VWX', model: 'Volvo VNL',              driver_name: 'Diana Park',     driver_phone: '+1-555-0108', status: 'Maintenance',    type: 'Semi',         mileage: 156700, last_service: '2026-07-08', next_service: '2026-08-08', overdue_next: false },
  { id: 'T009', plate: 'CA-104-YZA', model: 'Kenworth T880',          driver_name: 'Robert Brown',   driver_phone: '+1-555-0109', status: 'Active',         type: 'Flatbed',      mileage: 234800, last_service: '2026-06-30', next_service: '2026-07-30', overdue_next: false },
  { id: 'T010', plate: 'FL-302-BCD', model: 'Freightliner M2',        driver_name: 'Linda Davis',    driver_phone: '+1-555-0110', status: 'Active',         type: 'Box Truck',    mileage: 67200,  last_service: '2026-07-12', next_service: '2026-09-12', overdue_next: false },
  { id: 'T011', plate: 'IL-402-EFG', model: 'Western Star 5700',      driver_name: 'Kevin Martinez', driver_phone: '+1-555-0111', status: 'Out of Service', type: 'Semi',         mileage: 412000, last_service: '2026-04-15', next_service: '2026-06-15', overdue_next: true  },
  { id: 'T012', plate: 'WA-502-HIJ', model: 'Peterbilt 567',          driver_name: 'Nancy Wilson',   driver_phone: '+1-555-0112', status: 'Active',         type: 'Flatbed',      mileage: 142300, last_service: '2026-07-03', next_service: '2026-08-03', overdue_next: false },
];

// ─── 3. Derive KPIs from mock data (stands in for `kpi_summary` datasource) ─
const KPIS = {
  total:          ALL_TRUCKS.length,
  active:         ALL_TRUCKS.filter(t => t.status === 'Active').length,
  maintenance:    ALL_TRUCKS.filter(t => t.status === 'Maintenance').length,
  out_of_service: ALL_TRUCKS.filter(t => t.status === 'Out of Service').length,
  overdue_service: ALL_TRUCKS.filter(t => t.overdue_next).length,
};

// ─── 4. Column definitions (derived from the YAML gridview component config) ─
//
// In a real runtime the column definitions would be built automatically from
// pageConfig.components.find(c => c.id === 'fleet-grid').columns.
// Here we construct the JS objects that the GridView constructor expects.
//
const gridConfig = pageConfig.components.find(c => c.id === 'fleet-grid');
const PAGE_SIZE  = gridConfig.page_size || 8;

const COLUMN_DEFS = [
  { type: 'TextCell',   id: 'plate',        field: 'plate',        label: 'Plate / Model',  secondary: 'model' },
  { type: 'TextCell',   id: 'driver',       field: 'driver_name',  label: 'Driver',          secondary: 'driver_phone' },
  { type: 'BadgeCell',  id: 'status',       field: 'status',       label: 'Status' },
  { type: 'BadgeCell',  id: 'type',         field: 'type',         label: 'Type' },
  { type: 'NumberCell', id: 'mileage',      field: 'mileage',      label: 'Mileage (km)' },
  { type: 'DateCell',   id: 'last_service', field: 'last_service', label: 'Last Service',  format: 'relative' },
  { type: 'DateCell',   id: 'next_service', field: 'next_service', label: 'Next Service',  format: 'relative', overdueField: 'overdue_next' },
  { type: 'ActionCell', id: 'actions',      field: '',             label: '',
    actions: [
      { id: 'view',         label: 'View' },
      { id: 'assign',       label: 'Assign Driver' },
      { id: 'decommission', label: 'Decommission', variant: 'danger' },
    ],
  },
];

// ─── 5. Filter state ─────────────────────────────────────────────────────────
let filters = { status: '', type: '', overdue_next: '', q: '' };
let page = 1;

function filtered() {
  return ALL_TRUCKS.filter(t => {
    if (filters.status && t.status !== filters.status) return false;
    if (filters.type   && t.type   !== filters.type)   return false;
    if (filters.overdue_next !== '') {
      const want = filters.overdue_next === 'true';
      if (t.overdue_next !== want) return false;
    }
    if (filters.q) {
      const q = filters.q.toLowerCase();
      if (!t.plate.toLowerCase().includes(q) &&
          !t.driver_name.toLowerCase().includes(q) &&
          !t.model.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

// ─── 6. Mount StatRow ────────────────────────────────────────────────────────
//
// StatRow constructor: new StatRow(id, stats[])
// Each stat: { label, value, color, trend?, delta? }
//
const statConfig = pageConfig.components.find(c => c.type === 'StatRow');
new StatRow('fleet-kpis', [
  { label: statConfig.stats[0].label, value: KPIS.total,          color: statConfig.stats[0].color },
  { label: statConfig.stats[1].label, value: KPIS.active,         color: statConfig.stats[1].color, trend: 'up', delta: '+2 this month' },
  { label: statConfig.stats[2].label, value: KPIS.maintenance,    color: statConfig.stats[2].color },
  { label: statConfig.stats[3].label, value: KPIS.out_of_service, color: statConfig.stats[3].color },
  { label: statConfig.stats[4].label, value: KPIS.overdue_service, color: statConfig.stats[4].color },
]).mount(document.getElementById('stat-row'));

// ─── 7. Mount FilterBar ──────────────────────────────────────────────────────
//
// FilterBar constructor: new FilterBar(id, state, filterDefs[])
// Filter def: { field, label, type, options?, placeholder? }
//
const fbConfig  = pageConfig.components.find(c => c.type === 'FilterBar');
const filterDefs = fbConfig.filters.map(f => ({
  field:       f.field,
  label:       f.label,
  type:        f.type,
  placeholder: f.placeholder || '',
  options:     f.options
    ? f.options.map(o => (typeof o === 'string' ? o : o.label))
    : undefined,
}));

const filterBar = new FilterBar('fleet-filter', { values: {} }, filterDefs);
filterBar._onAction = (action, params) => {
  if (action === 'filter.change') {
    const v = params.values;
    // Map display label back to value for the overdue_next select
    let overdueVal = '';
    if (v.overdue_next === 'Yes — overdue')   overdueVal = 'true';
    if (v.overdue_next === 'No — on schedule') overdueVal = 'false';
    filters = {
      status:      v.status      || '',
      type:        v.type        || '',
      overdue_next: overdueVal,
      q:           v.q           || '',
    };
  } else {
    // filter.clear
    filters = { status: '', type: '', overdue_next: '', q: '' };
  }
  page = 1;
  refreshGrid();
};
filterBar.mount(document.getElementById('filter-bar'));

// ─── 8. Mount GridView ───────────────────────────────────────────────────────
//
// GridView constructor: new GridView(id, state, columnDefs[])
// state: { rows, meta: { total, page, pageSize } }
// grid.setState(newState) re-renders without creating a new instance.
//
let grid;

function refreshGrid() {
  const rows      = filtered();
  const start     = (page - 1) * PAGE_SIZE;
  const pageRows  = rows.slice(start, start + PAGE_SIZE);
  const meta      = { total: rows.length, page, pageSize: PAGE_SIZE };

  if (!grid) {
    grid = new GridView('fleet-grid', { rows: pageRows, meta }, COLUMN_DEFS);

    grid._onAction = (action, params) => {
      // ── Row pagination ─────────────────────────────────────────────────────
      if (action === 'page.change') {
        page = params.page;
        refreshGrid();
        return;
      }

      const row = params.row;

      // ── view: navigate to detail page ─────────────────────────────────────
      if (action === 'view') {
        window.location.href = `fleet-detail.html?id=${row.id}`;
        return;
      }

      // ── assign: show assignment dialog ────────────────────────────────────
      if (action === 'assign') {
        if (row.status === 'Out of Service') return; // disabled
        alert(`Assign Driver — truck ${row.plate}\n\nIn a real app this opens a driver search dialog.`);
        return;
      }

      // ── decommission: confirm then act ────────────────────────────────────
      if (action === 'decommission') {
        if (row.status === 'Out of Service') return; // show_if guard
        if (row.mileage < 100000) return;            // disabled_if guard

        // Read confirm text from the YAML actions config
        const actionDef = pageConfig.actions.find(a => a.id === 'decommission');
        const confirmText = actionDef.confirm
          .replace('{row.plate}', row.plate);

        if (confirm(confirmText)) {
          alert(`${row.plate} has been decommissioned.\n(In production this PATCHes /api/v1/trucks/${row.id})`);
        }
        return;
      }
    };

    grid.mount(document.getElementById('fleet-grid'));
  } else {
    grid.setState({ rows: pageRows, meta });
  }
}

refreshGrid();

// ─── 9. Log parsed config to console for inspection ─────────────────────────
console.group('[TMS] Page config loaded from YAML');
console.log('Title:', pageConfig.title);
console.log('Auth:', pageConfig.page.auth);
console.log('Datasources:', pageConfig.datasources.map(d => d.id));
console.log('Components:', pageConfig.components.map(c => `${c.type}#${c.id}`));
console.log('Actions:', pageConfig.actions.map(a => a.id));
console.groupEnd();
</script>
</body>
</html>
