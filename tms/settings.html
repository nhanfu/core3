<!-- ── Page header ───────────────────────────────────────────────────────────-->

<!-- ── Inline YAML config ─────────────────────────────────────────────────────
     This block is the authoritative config for this page. The runtime (or this
     demo script) parses it with js-yaml to build column definitions, form
     field lists, and action wiring — no hard-coded strings in the JS below.
─────────────────────────────────────────────────────────────────────────────-->
<script type="application/x-yaml" id="page-config">
title: Settings

page:
  id: settings
  auth:
    require: [settings.read]

datasources:
  - id: branches
    endpoint: /api/v1/branches
    roles: [admin, fleet_manager]
  - id: users
    endpoint: /api/v1/users
    roles: [admin]
  - id: roles
    endpoint: /api/v1/roles
    roles: [admin]

components:
  - type: TabPanel
    id: settings-tabs
    container: settings-tabs
    tabs:

      # ── Tab 1: Branches ───────────────────────────────────────────────────
      - id: branches
        label: Branches
        toolbar:
          - id: add_branch
            label: "+ Add Branch"
            variant: primary
            action: branch.create
        grid:
          id: branches-grid
          source: branches
          page_size: 10
          columns:
            - type: TextCell
              id: id
              field: id
              label: "ID"
            - type: TextCell
              id: branch_name
              field: branch_name
              label: Branch Name
              secondary: code          # shows branch code as sub-text
            - type: TextCell
              id: location
              field: city
              label: Location
              secondary: region
            - type: BadgeCell
              id: status
              field: status
              label: Status
              colors:
                Active:   green
                Inactive: gray
            - type: NumberCell
              id: truck_count
              field: truck_count
              label: Trucks
              align: right
            - type: ActionCell
              id: actions
              label: ""
              actions:
                - id: branch.edit
                  label: Edit
                  variant: primary
                - id: branch.deactivate
                  label: Deactivate
                  variant: danger
                  show_if: "row.status === 'Active'"
                  disabled_if: "row.truck_count > 0"
        form:
          id: branch-form
          fields:
            - type: TextInput
              field: branch_name
              label: Branch Name
              required: true
              placeholder: "e.g. Los Angeles Central"
            - type: TextInput
              field: code
              label: Branch Code
              required: true
              placeholder: "e.g. LA-01"
            - type: TextInput
              field: city
              label: City
              required: true
              placeholder: "e.g. Los Angeles"
            - type: SelectInput
              field: region
              label: Region
              required: true
              options: [West, East, North, South, Central]
            - type: SelectInput
              field: country
              label: Country
              required: true
              options: [United States, Canada, Mexico]

      # ── Tab 2: Users ──────────────────────────────────────────────────────
      - id: users
        label: Users
        toolbar:
          - id: invite_user
            label: "+ Invite User"
            variant: primary
            action: user.invite
        grid:
          id: users-grid
          source: users
          page_size: 10
          columns:
            - type: AvatarCell        # initials + colour derived from name string
              id: avatar
              field: name
              label: ""
              size: md
            - type: TextCell
              id: name
              field: name
              label: Name
              secondary: email
            - type: BadgeCell
              id: roles
              field: roles
              label: Roles
              multi: true             # renders one badge per element in the roles[] array
              colors:
                admin:         red
                fleet_manager: indigo
                dispatcher:    blue
                driver:        green
                maintenance:   amber
                viewer:        gray
            - type: BadgeCell
              id: status
              field: status
              label: Status
              colors:
                Active:    green
                Suspended: red
                Pending:   amber
            - type: DateCell
              id: last_login
              field: last_login
              label: Last Login
              format: relative        # "3 days ago", "Today", etc.
            - type: TextCell
              id: branch
              field: branch
              label: Branch
            - type: ActionCell
              id: actions
              label: ""
              actions:
                - id: user.edit_roles
                  label: Edit Roles
                  variant: primary
                - id: user.suspend
                  label: Suspend
                  variant: danger
                  show_if: "row.status === 'Active'"
                  disabled_if: "row.roles.includes('admin')"
        form:
          id: user-roles-form
          fields:
            - type: TextInput
              field: name
              label: Name
              readonly: true
            - type: TextInput
              field: email
              label: Email
              readonly: true
            - type: SelectInput
              field: primary_role
              label: Primary Role
              required: true
              options: [admin, fleet_manager, dispatcher, driver, viewer]
            - type: CheckboxInput
              field: extra_roles
              label: Additional Roles
              options:
                - { label: Fleet Manager, value: fleet_manager }
                - { label: Dispatcher, value: dispatcher }
                - { label: Maintenance Coordinator, value: maintenance }
                - { label: Report Viewer, value: viewer }

      # ── Tab 3: Roles & Permissions ────────────────────────────────────────
      - id: roles
        label: Roles & Permissions
        grid:
          id: roles-grid
          source: roles
          page_size: 10
          expand_row: permissions     # clicking a row shows the permissions[] list
          columns:
            - type: TextCell
              id: role_name
              field: name
              label: Role
              secondary: description
            - type: NumberCell
              id: permission_count
              field: permission_count
              label: Permissions
              align: right
            - type: NumberCell
              id: user_count
              field: user_count
              label: Users Assigned
              align: right
            - type: TextCell
              id: permissions_preview
              field: permissions_preview
              label: Key Permissions
            - type: ActionCell
              id: actions
              label: ""
              actions:
                - id: role.edit
                  label: Edit Permissions
                  variant: primary
                - id: role.clone
                  label: Clone
                  variant: ghost

actions:
  - id: branch.create
    modal: branch-popup
    mutation:
      method: POST
      endpoint: /api/v1/branches
      on_success:
        toast: "Branch created."
        refresh: [branches]
  - id: branch.edit
    modal: branch-popup
    pre_fill: row
    mutation:
      method: PATCH
      endpoint: "/api/v1/branches/{{row.id}}"
      on_success:
        toast: "Branch updated."
        refresh: [branches]
  - id: branch.deactivate
    variant: danger
    show_if: "row.status === 'Active'"
    disabled_if: "row.truck_count > 0"
    confirm: "Deactivate {{row.branch_name}}? Reassign all trucks first."
    mutation:
      method: PATCH
      endpoint: "/api/v1/branches/{{row.id}}"
      body: { status: Inactive }
      on_success:
        toast: "{{row.branch_name}} deactivated."
        refresh: [branches]
  - id: user.edit_roles
    modal: user-roles-popup
    pre_fill: row
    mutation:
      method: PUT
      endpoint: "/api/v1/users/{{row.id}}/roles"
      on_success:
        toast: "Roles updated."
        refresh: [users]
  - id: user.suspend
    variant: danger
    show_if: "row.status === 'Active'"
    disabled_if: "row.roles.includes('admin')"
    confirm: "Suspend {{row.name}}? They will be logged out immediately."
    mutation:
      method: PATCH
      endpoint: "/api/v1/users/{{row.id}}"
      body: { status: Suspended }
      on_success:
        toast: "{{row.name}} suspended."
        refresh: [users]
  - id: role.edit
    navigate_to: role-detail
    params: { id: row.id }
  - id: role.clone
    confirm: "Clone the '{{row.name}}' role?"
    mutation:
      method: POST
      endpoint: /api/v1/roles/clone
      body: { source_id: row.id }
      on_success:
        toast: "Role cloned."
        refresh: [roles]
</script>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// Imports — components resolve from lib/ relative to tms/
// ─────────────────────────────────────────────────────────────────────────────
import {
  TabPanel, GridView, FormPanel, PopupEditor, ConfirmDialog, Button,
  TextInput, SelectInput, CheckboxInput,
  TextCell, BadgeCell, NumberCell, DateCell, ActionCell, AvatarCell,
} from '../lib/components.js';

// ─────────────────────────────────────────────────────────────────────────────
// 1. Parse the inline YAML config
//    js-yaml is loaded from CDN (global: jsyaml).
//    The parsed object drives column definitions, form fields, and actions.
// ─────────────────────────────────────────────────────────────────────────────
const rawYaml   = document.getElementById('page-config').textContent;
const config    = jsyaml.load(rawYaml);

// Helpers: walk the config tree to find tab and grid definitions
const tabsConfig  = config.components.find(c => c.type === 'TabPanel').tabs;
const branchTab   = tabsConfig.find(t => t.id === 'branches');
const usersTab    = tabsConfig.find(t => t.id === 'users');
const rolesTab    = tabsConfig.find(t => t.id === 'roles');
const actionsMap  = Object.fromEntries((config.actions || []).map(a => [a.id, a]));

// Build GridView DEFS from a tab's grid.columns array (config-driven)
function buildDefs(tabCfg) {
  return tabCfg.grid.columns.map(col => ({
    type:         col.type,
    id:           col.id,
    field:        col.field,
    label:        col.label ?? '',
    secondary:    col.secondary,
    format:       col.format,
    overdueField: col.overdue_field,
    actions:      col.actions?.map(a => ({
      id:       a.id,
      label:    a.label,
      variant:  a.variant ?? 'primary',
      showIf:   a.show_if,
      disabledIf: a.disabled_if,
    })),
  }));
}

// ─────────────────────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────────────

const ALL_BRANCHES = [

// -- Users (8 records) --------------------------------------------------------
const ALL_USERS = [

// ─────────────────────────────────────────────────────────────────────────────
// 3. Utility helpers
// ─────────────────────────────────────────────────────────────────────────────

// Toast: renders a temporary notification at bottom-right
function showToast(message, variant = 'success') {
  const root = document.getElementById('toast-root');
  const colors = {
    success: 'bg-green-600',
    error:   'bg-red-600',
    info:    'bg-indigo-600',
  };
  const el = document.createElement('div');
  el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium ${colors[variant] ?? colors.success}`;
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

// Interpolate {{row.field}} / {{form.field}} template strings
function interpolate(template, ctx) {
  return String(template ?? '').replace(/\{\{(\w+)\.(\w+)\}\}/g, (_, ns, key) => {
    return (ctx[ns]?.[key] ?? '') ;
  });
}

// Evaluate a show_if / disabled_if expression safely
function evalGuard(expr, row) {
  if (!expr) return false;
  try {
    // eslint-disable-next-line no-new-func
    return new Function('row', `return !!(${expr})`)(row);
  } catch {
    return false;
  }
}

// Relative date formatter
function fmtRelative(value) {
  if (!value) return '—';
  const d = new Date(String(value).includes('T') ? value : value + 'T00:00:00');
  if (isNaN(d)) return String(value);
  const diffMs   = Date.now() - d.getTime();
  const absDays  = Math.floor(Math.abs(diffMs) / 86400000);
  if (absDays === 0) return 'Today';
  if (absDays === 1) return 'Yesterday';
  if (absDays < 30)  return `${absDays} days ago`;
  const wks = Math.floor(absDays / 7);
  return `${wks}w ago`;
}

// Badge colour lookup (matches lib/components/helpers.js STATUS_COLORS)
const BADGE_COLORS = {
  active:        'bg-green-100 text-green-800',
  suspended:     'bg-red-100 text-red-800',
  pending:       'bg-amber-100 text-amber-800',
  inactive:      'bg-gray-100 text-gray-600',
  admin:         'bg-red-100 text-red-800',
  fleet_manager: 'bg-indigo-100 text-indigo-800',
  dispatcher:    'bg-blue-100 text-blue-800',
  driver:        'bg-green-100 text-green-800',
  maintenance:   'bg-amber-100 text-amber-800',
  viewer:        'bg-gray-100 text-gray-700',
};
function badge(value, extraCls = '') {
  const cls = BADGE_COLORS[String(value).toLowerCase()] ?? 'bg-gray-100 text-gray-700';
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${cls} ${extraCls}">${value}</span>`;
}

// Avatar initials + colour (mirrors lib/components/AvatarCell.js)
const AVT_COLORS = ['bg-indigo-500','bg-blue-500','bg-green-500','bg-amber-500','bg-red-500','bg-purple-500'];
function avatarHtml(name, size = 'md') {
  const initials = (name || '').split(' ').map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase() || '?';
  const color    = AVT_COLORS[(name || ' ').charCodeAt(0) % AVT_COLORS.length];
  const sz       = size === 'lg' ? 'w-10 h-10 text-base' : 'w-8 h-8 text-sm';
  return `<span class="${sz} ${color} inline-flex items-center justify-center rounded-full text-white font-medium flex-shrink-0" title="${name}">${initials}</span>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// 4. Shared modal state
// ─────────────────────────────────────────────────────────────────────────────
let branchPopup, userRolesPopup, confirmDialog;
let currentBranchRow = null; // row being edited (null = create mode)
let currentUserRow   = null;

// ─────────────────────────────────────────────────────────────────────────────
// 5. Build Branch form (fields from YAML config)
// ─────────────────────────────────────────────────────────────────────────────
function buildBranchForm(prefill = null) {
  // Derive form fields from the YAML tab config — single source of truth
  const fieldDefs = branchTab.form.fields;

  const form = new FormPanel('branch-form-panel', {
    values: prefill ?? {},
    saving: false,
    dirty:  false,
    errors: {},
  }, { title: '' });

  form.draw = function(container) {
    container.innerHTML = '';
    const fieldsDiv = document.createElement('div');
    fieldsDiv.className = 'flex flex-col gap-4';
    container.appendChild(fieldsDiv);

    // Instantiate each field from the YAML field definitions
    for (const def of fieldDefs) {
      const val = prefill?.[def.field] ?? '';
      if (def.type === 'TextInput') {
        const inp = new TextInput(`bf-${def.field}`, { value: val }, {
          label:       def.label,
          required:    def.required,
          placeholder: def.placeholder ?? '',
          readonly:    def.readonly ?? false,
          field:       def.field,
        });
        form.registerField(inp);
        inp.mount(fieldsDiv);
      } else if (def.type === 'SelectInput') {
        const sel = new SelectInput(`bf-${def.field}`, { value: val, options: def.options ?? [] }, {
          label:    def.label,
          required: def.required,
          field:    def.field,
        });
        form.registerField(sel);
        sel.mount(fieldsDiv);
      }
    }

    // Action buttons row
    const btnsDiv = document.createElement('div');
    btnsDiv.className = 'flex gap-2 mt-6 pt-5 border-t border-gray-100';
    container.appendChild(btnsDiv);

    const saveBtn = new Button('bf-save', {}, {
      label:   prefill ? 'Save Changes' : 'Create Branch',
      variant: 'primary',
      action:  prefill ? 'branch.edit' : 'branch.create',
    });
    saveBtn._onAction = () => handleBranchSave();
    saveBtn.draw(btnsDiv);

    const cancelBtn = new Button('bf-cancel', {}, { label: 'Cancel', variant: 'secondary' });
    cancelBtn.draw(btnsDiv);
    btnsDiv.querySelector('[data-action-id]');
    // Wire cancel
    btnsDiv.querySelectorAll('button')[1].addEventListener('click', () => {
      branchPopup.setState({ open: false });
    });
  };

  return form;
}

// ─────────────────────────────────────────────────────────────────────────────
// 6. Build User-roles form (fields from YAML config)
// ─────────────────────────────────────────────────────────────────────────────
function buildUserRolesForm(userRow) {
  const fieldDefs = usersTab.form.fields;

  const form = new FormPanel('user-roles-form-panel', {
    values: userRow,
    saving: false,
  }, { title: '' });

  form.draw = function(container) {
    container.innerHTML = '';
    const fieldsDiv = document.createElement('div');
    fieldsDiv.className = 'flex flex-col gap-4';
    container.appendChild(fieldsDiv);

    for (const def of fieldDefs) {
      const val = def.field === 'primary_role' ? (userRow.roles?.[0] ?? '') : (userRow[def.field] ?? '');

      if (def.type === 'TextInput') {
        const inp = new TextInput(`uf-${def.field}`, { value: String(val) }, {
          label:    def.label,
          required: def.required ?? false,
          readonly: def.readonly ?? false,
          field:    def.field,
        });
        if (!def.readonly) form.registerField(inp);
        inp.mount(fieldsDiv);
      } else if (def.type === 'SelectInput') {
        const sel = new SelectInput(`uf-${def.field}`, { value: String(val), options: def.options ?? [] }, {
          label:    def.label,
          required: def.required ?? false,
          field:    def.field,
        });
        form.registerField(sel);
        sel.mount(fieldsDiv);
      } else if (def.type === 'CheckboxInput') {
        // Render checkbox group manually (CheckboxInput component)
        const wrap = document.createElement('div');
        wrap.className = 'flex flex-col gap-1';
        fieldsDiv.appendChild(wrap);
        const lbl = document.createElement('p');
        lbl.className = 'text-sm font-medium text-gray-700';
        lbl.textContent = def.label ?? '';
        wrap.appendChild(lbl);
        const cbxWrap = document.createElement('div');
        cbxWrap.className = 'flex flex-col gap-2 mt-1';
        wrap.appendChild(cbxWrap);
        const currentRoles = Array.isArray(userRow.roles) ? userRow.roles : [];
        for (const opt of (def.options ?? [])) {
          const rowEl = document.createElement('label');
          rowEl.className = 'flex items-center gap-2 text-sm text-gray-700 cursor-pointer';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.value = opt.value;
          cb.checked = currentRoles.includes(opt.value);
          cb.className = 'rounded border-gray-300 text-indigo-600 focus:ring-indigo-500';
          rowEl.appendChild(cb);
          rowEl.appendChild(document.createTextNode(opt.label));
          cbxWrap.appendChild(rowEl);
        }
      }
    }

    // Hint text
    const hint = document.createElement('p');
    hint.className = 'text-xs text-gray-400 mt-1';
    hint.textContent = 'Supplemental roles grant extra permissions on top of the primary role.';
    fieldsDiv.appendChild(hint);

    // Buttons
    const btnsDiv = document.createElement('div');
    btnsDiv.className = 'flex gap-2 mt-6 pt-5 border-t border-gray-100';
    container.appendChild(btnsDiv);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'px-4 py-2 text-sm font-medium bg-indigo-600 text-white rounded-md hover:bg-indigo-700 shadow-sm';
    saveBtn.textContent = 'Save Roles';
    saveBtn.addEventListener('click', () => handleUserRolesSave(userRow));
    btnsDiv.appendChild(saveBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', () => userRolesPopup.setState({ open: false }));
    btnsDiv.appendChild(cancelBtn);
  };

  return form;
}

// ─────────────────────────────────────────────────────────────────────────────
// 7. Modal action handlers
// ─────────────────────────────────────────────────────────────────────────────
function handleBranchSave() {
  // Demo: show a toast and close the popup
  const mode = currentBranchRow ? 'updated' : 'created';
  showToast(`Branch ${mode} successfully. (demo mode — not persisted)`, 'success');
  branchPopup.setState({ open: false });
  if (!currentBranchRow) {
    // Optimistically append a fake row to the branches grid
    const newRow = {
      id: `BR-0${ALL_BRANCHES.length + 1}`,
      branch_name: 'New Branch',
      code: 'NB-01',
      city: 'New City',
      region: 'West',
      country: 'United States',
      status: 'Active',
      truck_count: 0,
    };
    ALL_BRANCHES.push(newRow);
    refreshBranchesGrid();
  }
}

function handleBranchDeactivate(row) {
  if (row.truck_count > 0) {
    showToast(`Cannot deactivate — reassign ${row.truck_count} truck(s) first.`, 'error');
    return;
  }
  // Persist in mock data
  row.status = 'Inactive';
  showToast(`${row.branch_name} has been deactivated.`, 'success');
  confirmDialog.setState({ open: false });
  refreshBranchesGrid();
}

function handleUserRolesSave(row) {
  showToast(`Roles updated for ${row.name}. (demo mode)`, 'success');
  userRolesPopup.setState({ open: false });
}

function handleUserSuspend(row) {
  row.status = 'Suspended';
  showToast(`${row.name} has been suspended.`, 'success');
  confirmDialog.setState({ open: false });
  refreshUsersTable();
}

// ─────────────────────────────────────────────────────────────────────────────
// 8. Branches tab renderer
// ─────────────────────────────────────────────────────────────────────────────

// Column defs built from YAML: GridView only renders types in its CELL_MAP,
// so we filter to the supported types and let custom logic handle the rest.
const BRANCH_DEFS = buildDefs(branchTab);

let branchesGrid = null;

function refreshBranchesGrid() {
  if (!branchesGrid) return;
  branchesGrid.setState({
    rows: ALL_BRANCHES,
    meta: { total: ALL_BRANCHES.length, page: 1, pageSize: 10 },
  });
}

function renderBranchesTab(container) {
  // ── Toolbar ──────────────────────────────────────────────────────────────
  const toolbar = document.createElement('div');
  toolbar.className = 'flex items-center justify-between mb-4';
  container.appendChild(toolbar);

  const title = document.createElement('p');
  title.className = 'text-sm text-gray-500';
  title.textContent = `${ALL_BRANCHES.length} branch locations`;
  toolbar.appendChild(title);

  // "+ Add Branch" button — action from YAML: branchTab.toolbar[0]
  const addBtn = document.createElement('button');
  addBtn.className = 'px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm';
  addBtn.textContent = branchTab.toolbar[0].label;
  addBtn.addEventListener('click', () => {
    currentBranchRow = null;
    branchPopup.child = buildBranchForm(null);
    branchPopup.setState({ open: true, title: 'Add Branch' });
  });
  toolbar.appendChild(addBtn);

  // ── GridView ─────────────────────────────────────────────────────────────
  // Column defs come directly from the parsed YAML config (BRANCH_DEFS above).
  // ActionCell actions use show_if / disabled_if from the YAML.
  branchesGrid = new GridView('branches-grid', {
    rows: ALL_BRANCHES,
    meta: { total: ALL_BRANCHES.length, page: 1, pageSize: 10 },
  }, BRANCH_DEFS);

  // Action handler: wires action ids to behaviour
  branchesGrid._onAction = (actionId, params) => {
    const row = params.row;
    if (actionId === 'branch.edit') {
      currentBranchRow = row;
      branchPopup.child = buildBranchForm(row);
      branchPopup.setState({ open: true, title: 'Edit Branch' });
    } else if (actionId === 'branch.deactivate') {
      // Check show_if from YAML config
      const actionDef = actionsMap['branch.deactivate'];
      if (evalGuard(actionDef.disabled_if, row)) {
        showToast(`Cannot deactivate — ${row.truck_count} truck(s) still assigned.`, 'error');
        return;
      }
      // Show ConfirmDialog (defined in actions YAML: confirm: "Deactivate …?")
      confirmDialog.setState({
        open:         true,
        title:        'Deactivate Branch',
        message:      interpolate(actionDef.confirm, { row }),
        confirmLabel: 'Deactivate',
        cancelLabel:  'Cancel',
        variant:      'danger',
        params:       { row },
      });
      confirmDialog._onAction = (_, p) => handleBranchDeactivate(p.row);
    }
  };

  branchesGrid.mount(container);
}

// ─────────────────────────────────────────────────────────────────────────────
// 9. Users tab renderer
//    GridView's CELL_MAP doesn't include AvatarCell or multi-badge, so we
//    render the users table manually using the column definitions from YAML.
// ─────────────────────────────────────────────────────────────────────────────
let usersTableRoot = null;

function renderUsersTable() {
  if (!usersTableRoot) return;
  usersTableRoot.innerHTML = '';

  // YAML column definitions drive what we render
  const colDefs = usersTab.grid.columns;

  const outer = document.createElement('div');
  outer.className = 'overflow-x-auto rounded-lg border border-gray-200';
  usersTableRoot.appendChild(outer);

  const table = document.createElement('table');
  table.className = 'min-w-full divide-y divide-gray-200';
  outer.appendChild(table);

  // Header row — labels from YAML column config
  const thead = document.createElement('thead');
  thead.className = 'bg-gray-50';
  table.appendChild(thead);
  const headerRow = document.createElement('tr');
  thead.appendChild(headerRow);
  for (const col of colDefs) {
    const th = document.createElement('th');
    th.className = 'px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider whitespace-nowrap';
    th.textContent = col.label ?? '';
    headerRow.appendChild(th);
  }

  // Body rows — one per user, cells rendered per col type from YAML
  const tbody = document.createElement('tbody');
  tbody.className = 'bg-white divide-y divide-gray-100';
  table.appendChild(tbody);

  for (const row of ALL_USERS) {
    const tr = document.createElement('tr');
    tr.className = 'hover:bg-gray-50 transition-colors';
    tbody.appendChild(tr);

    for (const col of colDefs) {
      const td = document.createElement('td');
      td.className = 'px-4 py-3';
      tr.appendChild(td);

      if (col.type === 'AvatarCell') {
        // AvatarCell: initials circle coloured by name hash (mirrors AvatarCell.js)
        td.innerHTML = avatarHtml(row[col.field], col.size ?? 'md');

      } else if (col.type === 'TextCell') {
        const primary = document.createElement('p');
        primary.className = 'text-sm text-gray-900 font-medium';
        primary.textContent = row[col.field] ?? '—';
        td.appendChild(primary);
        if (col.secondary && row[col.secondary]) {
          const sec = document.createElement('p');
          sec.className = 'text-xs text-gray-500 mt-0.5';
          sec.textContent = row[col.secondary];
          td.appendChild(sec);
        }

      } else if (col.type === 'BadgeCell' && col.multi) {
        // Multi-badge: one badge per element in the roles[] array (YAML: multi: true)
        const roles = Array.isArray(row[col.field]) ? row[col.field] : [];
        const wrap  = document.createElement('div');
        wrap.className = 'flex flex-wrap gap-1';
        td.appendChild(wrap);
        if (roles.length === 0) {
          wrap.innerHTML = '<span class="text-gray-400 text-sm">—</span>';
        } else {
          for (const r of roles) wrap.innerHTML += badge(r);
        }

      } else if (col.type === 'BadgeCell') {
        td.innerHTML = badge(row[col.field]);

      } else if (col.type === 'DateCell') {
        const span = document.createElement('span');
        span.className = 'text-sm text-gray-700';
        span.textContent = fmtRelative(row[col.field]);
        td.appendChild(span);

      } else if (col.type === 'ActionCell') {
        // Action buttons — show_if / disabled_if from YAML
        const wrap = document.createElement('div');
        wrap.className = 'flex gap-3';
        td.appendChild(wrap);

        for (const actionCfg of (col.actions ?? [])) {
          const actionDef = actionsMap[actionCfg.id] ?? {};
          // Evaluate show_if guard from YAML
          if (actionCfg.show_if && !evalGuard(actionCfg.show_if, row)) continue;

          const isDisabled = actionCfg.disabled_if ? evalGuard(actionCfg.disabled_if, row) : false;
          const variantCls = {
            primary:   'text-indigo-600 hover:text-indigo-900',
            danger:    'text-red-500 hover:text-red-800',
            ghost:     'text-gray-400 hover:text-gray-600',
            secondary: 'text-gray-600 hover:text-gray-900',
          }[actionCfg.variant ?? 'primary'];

          const btn = document.createElement('button');
          btn.className = `text-sm font-medium ${variantCls} transition-colors ${isDisabled ? 'opacity-40 cursor-not-allowed' : ''}`;
          btn.textContent = actionCfg.label;
          btn.disabled = isDisabled;

          btn.addEventListener('click', () => {
            if (actionCfg.id === 'user.edit_roles') {
              currentUserRow = row;
              userRolesPopup.child = buildUserRolesForm(row);
              userRolesPopup.setState({ open: true, title: 'Edit User Roles' });
            } else if (actionCfg.id === 'user.suspend') {
              confirmDialog.setState({
                open:         true,
                title:        'Suspend User',
                message:      interpolate(actionDef.confirm ?? 'Suspend {{row.name}}?', { row }),
                confirmLabel: 'Suspend',
                cancelLabel:  'Cancel',
                variant:      'danger',
                params:       { row },
              });
              confirmDialog._onAction = (_, p) => handleUserSuspend(p.row);
            }
          });
          wrap.appendChild(btn);
        }
      }
    }
  }
}

function refreshUsersTable() {
  renderUsersTable();
}

function renderUsersTab(container) {
  // ── Toolbar ──────────────────────────────────────────────────────────────
  const toolbar = document.createElement('div');
  toolbar.className = 'flex items-center justify-between mb-4';
  container.appendChild(toolbar);

  const title = document.createElement('p');
  title.className = 'text-sm text-gray-500';
  title.textContent = `${ALL_USERS.length} user accounts`;
  toolbar.appendChild(title);

  const inviteBtn = document.createElement('button');
  inviteBtn.className = 'px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm';
  inviteBtn.textContent = usersTab.toolbar[0].label;
  inviteBtn.addEventListener('click', () => showToast('Invite user — not wired in demo.', 'info'));
  toolbar.appendChild(inviteBtn);

  // ── Table root — we render manually to support AvatarCell + multi-badge ──
  usersTableRoot = document.createElement('div');
  container.appendChild(usersTableRoot);
  renderUsersTable();
}

// ─────────────────────────────────────────────────────────────────────────────
// 10. Roles tab renderer
//     Uses GridView for the grid, plus inline <details> expand for permissions.
// ─────────────────────────────────────────────────────────────────────────────
const ROLES_DEFS = buildDefs(rolesTab);

function renderRolesTab(container) {
  const title = document.createElement('p');
  title.className = 'text-sm text-gray-500 mb-4';
  title.textContent = `${ALL_ROLES.length} roles — click a row to expand permissions`;
  container.appendChild(title);

  // Custom table for roles — we need expandable rows (GridView doesn't support it)
  const outer = document.createElement('div');
  outer.className = 'overflow-x-auto rounded-lg border border-gray-200';
  container.appendChild(outer);

  const table = document.createElement('table');
  table.className = 'min-w-full divide-y divide-gray-200';
  outer.appendChild(table);

  // Header
  const thead = document.createElement('thead');
  thead.className = 'bg-gray-50';
  table.appendChild(thead);
  const headerRow = document.createElement('tr');
  thead.appendChild(headerRow);

  // Column labels from YAML config
  const colDefs = rolesTab.grid.columns;
  for (const col of colDefs) {
    const th = document.createElement('th');
    const align = col.align === 'right' ? 'text-right' : 'text-left';
    th.className = `px-4 py-3 ${align} text-xs font-semibold text-gray-500 uppercase tracking-wider whitespace-nowrap`;
    th.textContent = col.label ?? '';
    headerRow.appendChild(th);
  }

  const tbody = document.createElement('tbody');
  tbody.className = 'bg-white divide-y divide-gray-100';
  table.appendChild(tbody);

  // Role colour badges
  const roleColors = {
    admin:         'bg-red-100 text-red-700 border border-red-200',
    fleet_manager: 'bg-indigo-100 text-indigo-700 border border-indigo-200',
    driver:        'bg-green-100 text-green-700 border border-green-200',
    viewer:        'bg-gray-100 text-gray-600 border border-gray-200',
  };

  for (const row of ALL_ROLES) {
    // Main row
    const tr = document.createElement('tr');
    tr.className = 'hover:bg-gray-50 transition-colors cursor-pointer';
    tbody.appendChild(tr);

    for (const col of colDefs) {
      const td = document.createElement('td');
      td.className = 'px-4 py-3';
      tr.appendChild(td);

      if (col.type === 'TextCell' && col.id === 'role_name') {
        const nameWrap = document.createElement('div');
        nameWrap.className = 'flex items-center gap-2';
        td.appendChild(nameWrap);
        const nameBadge = document.createElement('span');
        nameBadge.className = `inline-flex items-center px-2.5 py-1 rounded-md text-sm font-semibold ${roleColors[row.name] ?? 'bg-gray-100 text-gray-700'}`;
        nameBadge.textContent = row.name;
        nameWrap.appendChild(nameBadge);
        if (row.description) {
          const desc = document.createElement('span');
          desc.className = 'text-xs text-gray-500';
          desc.textContent = row.description;
          nameWrap.appendChild(desc);
        }

      } else if (col.type === 'NumberCell') {
        td.className += ' text-right';
        const span = document.createElement('span');
        span.className = 'text-sm font-semibold text-gray-900';
        span.textContent = row[col.field]?.toLocaleString() ?? '—';
        td.appendChild(span);

      } else if (col.type === 'TextCell') {
        // permissions_preview: truncated list of permission keys
        const span = document.createElement('span');
        span.className = 'text-xs font-mono text-gray-500';
        span.textContent = row[col.field] ?? '—';
        td.appendChild(span);

      } else if (col.type === 'ActionCell') {
        const wrap = document.createElement('div');
        wrap.className = 'flex gap-3';
        td.appendChild(wrap);

        for (const actionCfg of (col.actions ?? [])) {
          const variantCls = {
            primary: 'text-indigo-600 hover:text-indigo-900',
            ghost:   'text-gray-400 hover:text-gray-600',
          }[actionCfg.variant ?? 'primary'];

          const btn = document.createElement('button');
          btn.className = `text-sm font-medium ${variantCls} transition-colors`;
          btn.textContent = actionCfg.label;
          btn.addEventListener('click', (e) => {
            e.stopPropagation(); // don't expand the row
            if (actionCfg.id === 'role.edit') {
              showToast(`Navigate to role editor for '${row.name}'. (demo mode)`, 'info');
            } else if (actionCfg.id === 'role.clone') {
              const actionDef = actionsMap['role.clone'];
              confirmDialog.setState({
                open:         true,
                title:        'Clone Role',
                message:      interpolate(actionDef.confirm ?? "Clone '{{row.name}}'?", { row }),
                confirmLabel: 'Clone',
                cancelLabel:  'Cancel',
                variant:      'primary',
                params:       { row },
              });
              confirmDialog._onAction = (_, p) => {
                showToast(`Role '${p.row.name}' cloned. (demo mode)`, 'success');
                confirmDialog.setState({ open: false });
              };
            }
          });
          wrap.appendChild(btn);
        }
      }
    }

    // Expandable permissions row — `expand_row: permissions` from YAML
    const expandTr = document.createElement('tr');
    expandTr.className = 'hidden bg-gray-50';
    tbody.appendChild(expandTr);
    const expandTd = document.createElement('td');
    expandTd.colSpan = colDefs.length;
    expandTd.className = 'px-6 py-4';
    expandTr.appendChild(expandTd);

    const permHeader = document.createElement('p');
    permHeader.className = 'text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2';
    permHeader.textContent = `All permissions for '${row.name}' (${row.permission_count})`;
    expandTd.appendChild(permHeader);

    const permGrid = document.createElement('div');
    permGrid.className = 'flex flex-wrap gap-1.5';
    expandTd.appendChild(permGrid);

    for (const perm of (row.permissions ?? [])) {
      const chip = document.createElement('span');
      chip.className = 'inline-flex items-center px-2 py-0.5 rounded text-xs font-mono bg-white border border-gray-200 text-gray-700';
      chip.textContent = perm;
      permGrid.appendChild(chip);
    }

    // Toggle expand on row click
    tr.addEventListener('click', () => {
      const isHidden = expandTr.classList.contains('hidden');
      expandTr.classList.toggle('hidden', !isHidden);
      tr.classList.toggle('bg-indigo-50', isHidden);
    });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// 11. Initialise shared modals (PopupEditor + ConfirmDialog)
// ─────────────────────────────────────────────────────────────────────────────

// Branch popup — wraps the branch FormPanel; child is set before opening
branchPopup = new PopupEditor('branch-popup', { open: false, title: 'Add Branch' }, {
  width: 'max-w-xl',
});
branchPopup.mount(document.getElementById('branch-popup-root'));

// User roles popup
userRolesPopup = new PopupEditor('user-roles-popup', { open: false, title: 'Edit User Roles' }, {
  width: 'max-w-lg',
});
userRolesPopup.mount(document.getElementById('user-roles-popup-root'));

// Shared confirm dialog — reused for all destructive actions (deactivate, suspend, clone)
confirmDialog = new ConfirmDialog('confirm-dialog', { open: false });
// Override _onAction so callers can set it per-use
const _originalSubmit = confirmDialog.submit.bind(confirmDialog);
confirmDialog.submit = function(action, params) {
  if (typeof this._onAction === 'function') this._onAction(action, params);
};
confirmDialog.mount(document.getElementById('confirm-root'));

// ─────────────────────────────────────────────────────────────────────────────
// 12. Build TabPanel — tabs correspond to the `tabs:` array in the YAML config
// ─────────────────────────────────────────────────────────────────────────────

// Tab labels come from the YAML config — single source of truth
const tabs = tabsConfig.map((tabCfg, i) => ({
  label:  tabCfg.label,
  render: [renderBranchesTab, renderUsersTab, renderRolesTab][i],
}));

const tabPanel = new TabPanel('settings-tabs', { active: 0 }, tabs);
tabPanel.mount(document.getElementById('settings-tabs'));
</script>
