title: Khách hàng

page:
  id: customers
  auth:
    require: [crm.read]

datasources:
  - id: customers
    single: false
    permission: crm.read
    query: |
      SELECT c.id, c.code, c.name, c.tax_code, c.phone, c.email, c.stage, c.visibility, c.status,
        CASE c.stage
          WHEN 'Lead' THEN 'Khách tiềm năng'
          WHEN 'Contacting' THEN 'Đang tiếp cận'
          WHEN 'Customer' THEN 'Khách hàng'
          ELSE c.stage
        END AS stage_label,
        c.owner_name,
        CASE c.visibility WHEN 'Private' THEN 'Riêng' ELSE 'Công khai' END AS visibility_label,
        CASE c.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label,
        c.created_at
      FROM customers c
      WHERE (NULLIF(:stage, '') IS NULL OR c.stage = :stage)
        AND (:q IS NULL OR c.code ILIKE '%' || :q || '%'
          OR c.name ILIKE '%' || :q || '%'
          OR c.tax_code ILIKE '%' || :q || '%'
          OR c.phone ILIKE '%' || :q || '%')
      ORDER BY c.created_at DESC, c.name

toolbar:
  - id: add_customer_btn
    label: '+ Thêm khách hàng'
    variant: primary
    permission: crm.write
    action: add_customer

components:
  - type: ListToolbar
    source: customers
    filter_field: q
    search:
      label: Tìm kiếm khách hàng
      placeholder: 'Tìm mã, tên, MST, SĐT...'
  - type: StatusTabs
    source: customers
    filter_field: stage
    tabs:
      - { id: '', label: Tất cả }
      - { id: Lead, label: Khách tiềm năng }
      - { id: Contacting, label: Đang tiếp cận }
      - { id: Customer, label: Khách hàng }
  - type: DataGrid
    source: customers
    page_size: 10
    row_key: id
    selectable: true
    empty_state:
      title: Không có khách hàng
      description: Thử thay đổi bộ lọc hoặc tạo khách hàng mới.
    columns:
      - field: id
        label: Mã HT
        sortable: true
      - field: code
        label: Mã / tên
        type: PrimaryEntityCell
        secondary: name
      - field: tax_code
        label: Mã số thuế
      - field: stage_label
        label: Giai đoạn
        type: StatusChip
        colors:
          Khách tiềm năng: blue
          Đang tiếp cận: amber
          Khách hàng: green
      - field: owner_name
        label: Sale phụ trách
      - field: phone
        label: Liên hệ chính
        type: PrimaryEntityCell
        secondary: email
      - field: visibility_label
        label: Hiển thị
      - field: status_label
        label: Trạng thái
        type: StatusChip
        colors:
          Hoạt động: green
          Ngưng hoạt động: red
      - field: created_at
        label: Ngày giờ tạo
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - id: view_customer
            label: Chi tiết
            variant: ghost
          - id: edit_customer
            label: Sửa
            variant: ghost
          - id: delete_customer
            label: Xóa
            variant: danger

actions:
  - { id: view_customer, type: navigate, navigate_to: /crm/entities/detail, params: { id: '{row.id}', kind: customer, back: /customers } }
  - id: add_customer
    type: form
    title: Thêm khách hàng
    table: customers
    operation: insert
    refresh: [customers]
    fields:
      - { field: code, label: Mã khách hàng, type: text, required: true }
      - { field: name, label: Tên khách hàng, type: text, required: true }
      - { field: tax_code, label: Mã số thuế, type: text }
      - { field: phone, label: Số điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: stage, label: Giai đoạn, type: select, options: [Lead, Contacting, Customer], default: Lead }
      - { field: owner_name, label: Sale phụ trách, type: text }
      - { field: visibility, label: Hiển thị, type: select, options: [Public, Private], default: Public }
      - { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }
  - id: edit_customer
    type: form
    title: Cập nhật khách hàng
    table: customers
    operation: update
    prefill: row
    refresh: [customers]
    fields:
      - { field: code, label: Mã khách hàng, type: text, required: true }
      - { field: name, label: Tên khách hàng, type: text, required: true }
      - { field: tax_code, label: Mã số thuế, type: text }
      - { field: phone, label: Số điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: stage, label: Giai đoạn, type: select, options: [Lead, Contacting, Customer] }
      - { field: owner_name, label: Sale phụ trách, type: text }
      - { field: visibility, label: Hiển thị, type: select, options: [Public, Private] }
      - { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }
  - id: delete_customer
    type: delete
    confirm: 'Xóa khách hàng {{row.name}}?'
    table: customers
    refresh: [customers]
