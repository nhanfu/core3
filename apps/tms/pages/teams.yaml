title: Team
page:
  id: teams
  auth: { require: [settings.read] }
datasources:
  - id: teams
    single: false
    permission: settings.read
    query: |
      SELECT t.*, d.name AS department_name, e.name AS manager_name, CASE t.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label FROM teams t LEFT JOIN departments d ON d.id = t.department_id LEFT JOIN employees e ON e.id = t.manager_id
      WHERE (NULLIF(:status, '') IS NULL OR t.status = :status) AND (:q IS NULL OR t.code ILIKE '%' || :q || '%' OR t.name ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%') ORDER BY t.created_at DESC, t.name
  - id: team_department_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM departments WHERE status = 'Active' ORDER BY name"
  - id: team_manager_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name || ' (' || code || ')' AS label FROM employees WHERE status = 'Active' ORDER BY name"
toolbar:
  - { id: add_team_btn, label: '+ Thêm team', variant: primary, permission: settings.write, action: add_team }
components:
  - type: ListToolbar
    source: teams
    filter_field: q
    search: { label: Tìm kiếm team, placeholder: 'Tìm mã, tên hoặc phòng ban...' }
    actions: [{ id: teams.export, label: 'Xuất CSV', icon: '↓' }]
  - type: StatusTabs
    source: teams
    filter_field: status
    tabs: [{ id: '', label: Tất cả }, { id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }]
  - type: DataGrid
    source: teams
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: Không có team, description: Thử thay đổi bộ lọc hoặc tạo team mới. }
    columns:
      - { field: id, label: Mã HT, sortable: true }
      - { field: code, label: Mã / tên, type: PrimaryEntityCell, secondary: name }
      - { field: department_name, label: Phòng ban }
      - { field: manager_name, label: Người phụ trách }
      - { field: status_label, label: Trạng thái, type: StatusChip, colors: { Hoạt động: green, Ngưng hoạt động: red } }
      - { field: created_at, label: Ngày giờ tạo }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions: [{ id: edit_team, label: Sửa, variant: ghost }, { id: delete_team, label: Xóa, variant: danger }]
actions:
  - id: add_team
    type: form
    title: Thêm team
    table: teams
    operation: insert
    refresh: [teams]
    fields: [{ field: code, label: Mã team, type: text, required: true }, { field: name, label: Tên team, type: text, required: true }, { field: department_id, label: Phòng ban, type: select, options_source: team_department_lookup }, { field: manager_id, label: Người phụ trách, type: select, options_source: team_manager_lookup }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }]
  - id: edit_team
    type: form
    title: Cập nhật team
    table: teams
    operation: update
    prefill: row
    refresh: [teams]
    fields: [{ field: code, label: Mã team, type: text, required: true }, { field: name, label: Tên team, type: text, required: true }, { field: department_id, label: Phòng ban, type: select, options_source: team_department_lookup }, { field: manager_id, label: Người phụ trách, type: select, options_source: team_manager_lookup }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }]
  - { id: delete_team, type: delete, confirm: 'Xóa team {{row.name}}?', table: teams, refresh: [teams] }
