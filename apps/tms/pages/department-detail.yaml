title: Chi tiết phòng ban
page: { id: department-detail, breadcrumb: [Tổ chức & phân quyền, Phòng ban, Chi tiết], auth: { require: [settings.read] } }
datasources:
  - id: department_detail
    single: true
    permission: settings.read
    query: "SELECT d.id, d.code, d.name, d.branch_id, b.name AS branch_name, d.status FROM departments d LEFT JOIN branches b ON b.id = d.branch_id WHERE d.id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)"
  - id: department_teams
    single: false
    permission: settings.read
    query: "SELECT t.id, t.code, t.name, t.manager_id, e.name AS manager_name, t.status FROM teams t JOIN departments d ON d.id = t.department_id LEFT JOIN employees e ON e.id = t.manager_id WHERE t.department_id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY t.name"
  - id: department_employees
    single: false
    permission: settings.read
    query: "SELECT e.id, e.code, e.name, e.job_title, e.status FROM employees e JOIN departments d ON d.id = :id WHERE e.department ILIKE '%' || replace(d.name, 'Phòng ', '') || '%' AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
  - id: department_detail_parent_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM departments ORDER BY name"
  - id: department_detail_branch_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
components:
  - { type: DocumentSummary, source: department_detail, title_field: name, subtitle_field: code, status_field: status, columns: [{ field: branch_name, label: Chi nhánh }] }
  - type: DataGrid
    source: department_teams
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có team }
    columns: [{ field: code, label: Mã đội nhóm }, { field: name, label: Đội nhóm }, { field: manager_name, label: Người phụ trách }, { field: status, label: Trạng thái }]
  - type: DataGrid
    source: department_employees
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có nhân viên }
    columns: [{ field: code, label: Mã nhân viên }, { field: name, label: Họ tên }, { field: job_title, label: Chức danh }, { field: status, label: Trạng thái }]
toolbar:
  - { id: back_departments, label: 'Danh sách phòng ban', icon: arrow-left, variant: secondary, action: back_departments }
  - { id: edit_department_detail, label: Sửa phòng ban, variant: primary, permission: settings.write, action: edit_department_detail }
actions:
  - { id: back_departments, type: navigate, navigate_to: /org/departments }
  - id: edit_department_detail
    type: form
    permission: settings.write
    title: Cập nhật phòng ban
    table: departments
    operation: update
    prefill: source
    prefill_source: department_detail
    refresh: [department_detail, department_teams, department_employees]
    fields: [{ field: code, label: Mã phòng ban, type: text, required: true }, { field: name, label: Tên phòng ban, type: text, required: true }, { field: parent_id, label: Phòng ban cha, type: select, options_source: department_detail_parent_lookup }, { field: branch_id, label: Chi nhánh, type: select, options_source: department_detail_branch_lookup }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }] }]
