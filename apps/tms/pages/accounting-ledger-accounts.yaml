title: Account system
page: { id: accounting-ledger-accounts, breadcrumb: [Accountant, Account system], auth: { require: [accounting.read] } }
datasources:
  - id: ledger_accounts
    single: false
    permission: accounting.read
    query: |
      SELECT a.id, a.code, a.name, a.description, a.currency, a.status, a.sort_order, a.parent_id, p.name AS parent_name, a.created_at FROM accounting_entries a
      LEFT JOIN accounting_entries p ON p.id = a.parent_id AND p.kind = 'ledger_account'
      WHERE a.kind = 'ledger_account' AND (:view_scope = 'all' OR a.branch_id = :current_branch_id) AND (:status IS NULL OR a.status = :status) AND (:q IS NULL OR a.code ILIKE '%' || :q || '%' OR a.name ILIKE '%' || :q || '%' OR a.description ILIKE '%' || :q || '%') ORDER BY a.sort_order, a.code
  - id: ledger_account_parent_lookup
    permission: accounting.read
    query: SELECT id, code, name FROM accounting_entries WHERE kind = 'ledger_account' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY code
  - id: ledger_currency_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'currency' AND status = 'Active' UNION SELECT DISTINCT currency AS value, currency AS label FROM accounting_entries WHERE currency IS NOT NULL AND currency <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
toolbar: [{ id: add_ledger_account_btn, label: '+ Add account', variant: primary, permission: accounting.write, action: add_ledger_account }]
components:
  - { type: ListToolbar, source: ledger_accounts, filter_field: q, search: { label: Search accounts, placeholder: 'Find number, name or description...' }, actions: [{ id: ledger_accounts.export, label: 'Export CSV', icon: download }] }
  - { type: StatusTabs, source: ledger_accounts, filter_field: status, tabs: [{ id: '', label: All }, { id: Active, label: In use }, { id: Inactive, label: Discontinue use }] }
  - type: DataGrid
    source: ledger_accounts
    tree: true
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: There are no accounting accounts }
    columns:
      - { field: code, label: Number, sortable: true }
      - { field: name, label: Account name, type: PrimaryEntityCell, secondary: description }
      - { field: parent_name, label: Parent account }
      - { field: currency, label: Money }
      - { field: sort_order, label: Order, align: right }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - field: actions
        label: ''
        sortable: false
        actions: [{ id: edit_ledger_account, label: Fix, variant: ghost, permission: accounting.write }, { id: delete_ledger_account, label: Erase, variant: danger, permission: accounting.write }]
actions:
  - id: add_ledger_account
    type: form
    permission: accounting.write
    title: Add accounting accounts
    table: accounting_entries
    scope: ledger_account
    operation: insert
    refresh: [ledger_accounts]
    fields: [{ field: code, label: Number, type: text, required: true }, { field: name, label: Account name, type: text, required: true }, { field: parent_id, label: Parent account, type: select, options_source: ledger_account_parent_lookup }, { field: currency, label: Money, type: select, options_source: ledger_currency_lookup, default: VND }, { field: description, label: Interpretation, type: textarea }, { field: sort_order, label: Order, type: number, default: 0 }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }]
  - id: edit_ledger_account
    type: form
    permission: accounting.write
    title: Update accounting accounts
    table: accounting_entries
    scope: ledger_account
    operation: update
    prefill: row
    refresh: [ledger_accounts]
    fields: [{ field: code, label: Number, type: text, required: true }, { field: name, label: Account name, type: text, required: true }, { field: parent_id, label: Parent account, type: select, options_source: ledger_account_parent_lookup }, { field: currency, label: Money, type: select, options_source: ledger_currency_lookup }, { field: description, label: Interpretation, type: textarea }, { field: sort_order, label: Order, type: number }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }]
  - { id: delete_ledger_account, type: delete, permission: accounting.write, table: accounting_entries, scope: ledger_account, confirm: 'Delete account {{row.code}}?', refresh: [ledger_accounts] }
