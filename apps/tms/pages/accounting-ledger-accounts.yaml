title: Hệ thống tài khoản
page: { id: accounting-ledger-accounts, auth: { require: [accounting.read] } }
datasources:
  - id: ledger_accounts
    single: false
    permission: accounting.read
    query: |
      SELECT a.id, a.code, a.name, a.description, a.currency, a.status, a.sort_order, a.parent_id, p.name AS parent_name, a.created_at FROM accounting_entries a
      LEFT JOIN accounting_entries p ON p.id = a.parent_id AND p.kind = 'ledger_account'
      WHERE a.kind = 'ledger_account' AND (:view_scope = 'all' OR a.branch_id = :current_branch_id) AND (:status IS NULL OR a.status = :status) AND (:q IS NULL OR a.code ILIKE '%' || :q || '%' OR a.name ILIKE '%' || :q || '%' OR a.description ILIKE '%' || :q || '%') ORDER BY a.sort_order, a.code
  - id: ledger_account_parent_lookup
    permission: accounting.read
    query: SELECT id, code, name FROM accounting_entries WHERE kind = 'ledger_account' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY code
  - id: ledger_currency_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'currency' AND status = 'Active' UNION SELECT DISTINCT currency AS value, currency AS label FROM accounting_entries WHERE currency IS NOT NULL AND currency <> '' ORDER BY label"
toolbar: [{ id: add_ledger_account_btn, label: '+ Thêm tài khoản', variant: primary, permission: accounting.write, action: add_ledger_account }]
components:
  - { type: ListToolbar, source: ledger_accounts, filter_field: q, search: { label: Tìm kiếm tài khoản, placeholder: 'Tìm số hiệu, tên hoặc diễn giải...' }, actions: [{ id: ledger_accounts.export, label: 'Xuất CSV', icon: '↓' }] }
  - { type: StatusTabs, source: ledger_accounts, filter_field: status, tabs: [{ id: '', label: Tất cả }, { id: Active, label: Đang sử dụng }, { id: Inactive, label: Ngưng sử dụng }] }
  - type: DataGrid
    source: ledger_accounts
    tree: true
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: Không có tài khoản kế toán }
    columns:
      - { field: code, label: Số hiệu, sortable: true }
      - { field: name, label: Tên tài khoản, type: PrimaryEntityCell, secondary: description }
      - { field: parent_name, label: Tài khoản cha }
      - { field: currency, label: Tiền tệ }
      - { field: sort_order, label: Thứ tự, align: right }
      - field: status
        label: Trạng thái
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - field: actions
        label: ''
        sortable: false
        actions: [{ id: edit_ledger_account, label: Sửa, variant: ghost }, { id: delete_ledger_account, label: Xóa, variant: danger }]
actions:
  - id: add_ledger_account
    type: form
    title: Thêm tài khoản kế toán
    table: accounting_entries
    scope: ledger_account
    operation: insert
    refresh: [ledger_accounts]
    fields: [{ field: code, label: Số hiệu, type: text, required: true }, { field: name, label: Tên tài khoản, type: text, required: true }, { field: parent_id, label: Tài khoản cha, type: select, options_source: ledger_account_parent_lookup }, { field: currency, label: Tiền tệ, type: select, options_source: ledger_currency_lookup, default: VND }, { field: description, label: Diễn giải, type: textarea }, { field: sort_order, label: Thứ tự, type: number, default: 0 }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }]
  - id: edit_ledger_account
    type: form
    title: Cập nhật tài khoản kế toán
    table: accounting_entries
    scope: ledger_account
    operation: update
    prefill: row
    refresh: [ledger_accounts]
    fields: [{ field: code, label: Số hiệu, type: text, required: true }, { field: name, label: Tên tài khoản, type: text, required: true }, { field: parent_id, label: Tài khoản cha, type: select, options_source: ledger_account_parent_lookup }, { field: currency, label: Tiền tệ, type: select, options_source: ledger_currency_lookup }, { field: description, label: Diễn giải, type: textarea }, { field: sort_order, label: Thứ tự, type: number }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }]
  - { id: delete_ledger_account, type: delete, table: accounting_entries, scope: ledger_account, confirm: 'Xóa tài khoản {{row.code}}?', refresh: [ledger_accounts] }
