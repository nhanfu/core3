title: Tổng quan

page:
  id: dashboard
  auth:
    require: [fleet.read]

datasources:
  - id: dashboard_routes
    single: false
    permission: fleet.read
    query: |
      SELECT origin || ' → ' || destination AS route, COUNT(*) AS trip_count,
        COALESCE(SUM(distance_km), 0) AS total_distance_km
      FROM trips
      WHERE (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      GROUP BY origin, destination ORDER BY trip_count DESC, route
  - id: dashboard_customers
    single: false
    permission: fleet.read
    query: |
      SELECT customer_name, COUNT(*) AS order_count, COALESCE(SUM(total_amount), 0) AS total_amount
      FROM orders
      WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      GROUP BY customer_name ORDER BY order_count DESC, total_amount DESC
  - id: dashboard_kpis
    single: true
    permission: fleet.read
    query: |
      SELECT
        (SELECT COUNT(*) FROM trips WHERE (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS total_trips,
        (SELECT COUNT(*) FROM trips WHERE status = 'In Transit' AND (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS in_transit,
        (SELECT COUNT(*) FROM trips WHERE status = 'Scheduled' AND (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS scheduled,
        (SELECT COUNT(*) FROM maintenance WHERE status = 'Overdue') AS overdue_maintenance,
        (SELECT COUNT(*) FROM trucks WHERE status = 'Active') AS active_trucks,
        (SELECT COUNT(*) FROM orders WHERE status = 'Draft') AS draft_orders,
        (SELECT COUNT(*) FROM orders WHERE status = 'Pending Approval') AS pending_orders,
        (SELECT COUNT(*) FROM trips WHERE status IN ('Scheduled', 'In Transit') AND truck_id IS NULL) AS unassigned_trips,
        (SELECT COUNT(*) FROM accounting_entries WHERE kind = 'debit_note' AND status <> 'Paid' AND due_date < CURRENT_DATE) AS overdue_debit_notes,
        (SELECT COUNT(*) FROM accounting_entries WHERE kind = 'payment_request' AND status = 'Pending Approval') AS expense_approvals,
        (SELECT COUNT(*) FROM employment_contracts WHERE status = 'Expiring' OR (end_date IS NOT NULL AND end_date BETWEEN CURRENT_DATE AND CURRENT_DATE + INTERVAL 30 DAY)) AS expiring_contracts,
        (SELECT COUNT(*) FROM drivers WHERE status = 'Active') AS active_drivers,
        (SELECT COUNT(*) FROM containers WHERE status = 'Available') AS available_containers,
        (SELECT COUNT(*) FROM trips WHERE status = 'Completed' AND (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS completed_trips,
        (SELECT COUNT(*) FROM trips WHERE status = 'Cancelled' AND (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS cancelled_trips,
        (SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'Completed') / NULLIF(COUNT(*), 0), 1) FROM trips WHERE (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS completion_rate,
        (SELECT ROUND(AVG(date_diff('minute', departure_time, arrival_time)) / 60.0, 1) FROM trips WHERE arrival_time IS NOT NULL AND departure_time IS NOT NULL AND (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS average_trip_hours,
        (SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE truck_id IS NULL) / NULLIF(COUNT(*), 0), 1) FROM trips WHERE (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS unassigned_rate,
        (SELECT COALESCE(SUM(distance_km), 0) FROM trips WHERE (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS total_distance_km,
        (SELECT COALESCE(SUM(total_amount), 0) FROM orders WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS revenue_total,
        (SELECT COUNT(*) FROM orders WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS order_count,
        (SELECT COUNT(*) FROM customers WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS new_customer_count,
        (SELECT COALESCE(SUM(cost_amount), 0) FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS cost_total,
        (SELECT COALESCE(SUM(profit_amount), 0) FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS profit_total,
        (SELECT COUNT(*) FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS quote_count,
        (SELECT COALESCE(SUM(amount), 0) FROM accounting_entries WHERE kind = 'debit_note' AND status <> 'Paid') AS receivables_outstanding,
        (SELECT COALESCE(SUM(amount), 0) FROM accounting_entries WHERE kind = 'payment_request' AND status NOT IN ('Paid', 'Cancelled')) AS payables_outstanding,
        (SELECT COALESCE(SUM(amount), 0) FROM accounting_entries WHERE kind = 'advance' AND status NOT IN ('Cancelled', 'Settled')) AS advances_outstanding,
        (SELECT COUNT(*) FROM employees WHERE status = 'Active') AS active_employees,
        (SELECT COALESCE(SUM(net_salary), 0) FROM payrolls WHERE (:from_date IS NULL OR pay_month >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR pay_month <= CAST(:to_date AS DATE))) AS payroll_total
  - id: dashboard_trip_status
    single: false
    permission: fleet.read
    query: |
      SELECT CASE status
        WHEN 'Scheduled' THEN 'Đã lên lịch'
        WHEN 'In Transit' THEN 'Đang vận chuyển'
        WHEN 'Completed' THEN 'Hoàn thành'
        WHEN 'Cancelled' THEN 'Đã hủy'
        ELSE status END AS status, COUNT(*) AS trip_count
      FROM trips
      WHERE (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      GROUP BY status
      ORDER BY trip_count DESC, status
  - id: dashboard_financial_monthly
    single: false
    permission: fleet.read
    query: |
      SELECT month, SUM(revenue) AS revenue, SUM(cost) AS cost, SUM(profit) AS profit
      FROM (
        SELECT strftime(order_date, '%Y-%m') AS month, total_amount AS revenue, 0 AS cost, 0 AS profit
        FROM orders
        WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        UNION ALL
        SELECT strftime(created_at, '%Y-%m') AS month, 0 AS revenue, cost_amount AS cost, profit_amount AS profit
        FROM quotes
        WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      ) grouped
      GROUP BY month ORDER BY month
  - id: dashboard_dispatch_queue
    single: false
    permission: fleet.read
    query: |
      SELECT t.id, t.trip_number, t.origin, t.destination,
        CASE t.status WHEN 'Scheduled' THEN 'Đã lên lịch' WHEN 'In Transit' THEN 'Đang vận chuyển' ELSE t.status END AS status,
        t.departure_time, tr.plate AS truck_plate, d.name AS driver_name
      FROM trips t
      LEFT JOIN trucks tr ON tr.id = t.truck_id
      LEFT JOIN drivers d ON d.id = t.driver_id
      WHERE t.status IN ('Scheduled', 'In Transit')
        AND (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      ORDER BY CASE t.status WHEN 'In Transit' THEN 0 ELSE 1 END, t.departure_time

components:
  - type: ListToolbar
    source: dashboard_dispatch_queue
    filter_sources: [dashboard_kpis, dashboard_trip_status, dashboard_dispatch_queue, dashboard_routes, dashboard_customers]
    date_range: { from_field: from_date, to_field: to_date, from_label: 'Từ ngày', to_label: 'Đến ngày', presets: [month, previous_month, quarter, year, last_12_months], preset_style: segmented, default_preset: month }
    actions: [{ id: dashboard_dispatch_queue.export, label: 'Xuất CSV', icon: '↓' }]
  - type: PageIntro
    greeting: Xin chào
    title: Tổng quan vận hành
    action_label: Mẹo
  - type: StatRow
    source: dashboard_kpis
    title: Việc cần làm
    stats:
      - { label: Đơn nháp, field: draft_orders, color: indigo }
      - { label: Đơn chờ duyệt, field: pending_orders, color: amber }
      - { label: Chuyến chưa điều xe, field: unassigned_trips, color: red }
      - { label: Chuyến đang chạy, field: in_transit, color: blue }
      - { label: Giấy báo nợ quá hạn, field: overdue_debit_notes, color: red }
      - { label: Chi phí chờ duyệt, field: expense_approvals, color: amber }
      - { label: Hợp đồng sắp hết hạn, field: expiring_contracts, color: amber }

  - type: StatRow
    source: dashboard_kpis
    title: Vận hành
    stats:
      - { label: Tổng chuyến, field: total_trips, color: blue }
      - { label: Hoàn thành, field: completed_trips, color: green }
      - { label: Tỷ lệ hoàn thành, field: completion_rate, format: percent, color: green }
      - { label: TB thời gian chạy (giờ), field: average_trip_hours, format: number, color: indigo }
      - { label: Tỷ lệ chưa điều xe, field: unassigned_rate, format: percent, color: amber }
      - { label: Hủy, field: cancelled_trips, color: red }

  - type: StatRow
    source: dashboard_kpis
    title: Doanh thu · Chi phí
    stats:
      - { label: Doanh thu, field: revenue_total, format: currency, currency: VND, color: blue }
      - { label: Chi phí, field: cost_total, format: currency, currency: VND, color: amber }
      - { label: Lợi nhuận, field: profit_total, format: currency, currency: VND, color: green }
      - { label: Số đơn hàng, field: order_count, color: indigo }
      - { label: Khách hàng mới, field: new_customer_count, color: blue }
      - { label: Số báo giá, field: quote_count, color: indigo }

  - type: StatRow
    source: dashboard_kpis
    title: Công nợ · Dòng tiền
    stats:
      - { label: Công nợ phải thu, field: receivables_outstanding, format: currency, currency: VND, color: blue }
      - { label: Công nợ phải trả, field: payables_outstanding, format: currency, currency: VND, color: red }
      - { label: Tạm ứng còn lại, field: advances_outstanding, format: currency, currency: VND, color: amber }
      - { label: Giấy báo nợ quá hạn, field: overdue_debit_notes, color: red }
      - { label: Chi phí chờ duyệt, field: expense_approvals, color: amber }
      - { label: Tổng km, field: total_distance_km, format: number, color: indigo }

  - type: StatRow
    source: dashboard_kpis
    title: Nhân sự
    stats:
      - { label: Nhân sự hoạt động, field: active_employees, color: blue }
      - { label: Hợp đồng sắp hết hạn, field: expiring_contracts, color: amber }
      - { label: Tài xế hoạt động, field: active_drivers, color: blue }
      - { label: Container sẵn sàng, field: available_containers, color: blue }
      - { label: Tổng bảng lương, field: payroll_total, format: currency, currency: VND, color: blue }
      - { label: Chuyến hoàn thành, field: completed_trips, color: green }

  - type: Chart
    source: dashboard_financial_monthly
    title: Doanh thu · Chi phí · Lợi nhuận theo tháng
    label_field: month
    value_field: revenue
    variant: line
    layout: inline
    width: 640
    height: 260
    series:
      - { field: revenue, label: Doanh thu, color: '#2563eb' }
      - { field: cost, label: Chi phí, color: '#f59e0b' }
      - { field: profit, label: Lợi nhuận, color: '#10b981' }
  - type: Chart
    source: dashboard_trip_status
    title: Tổng quan trạng thái chuyến
    label_field: status
    value_field: trip_count
    variant: pie
    layout: inline
    width: 400
    height: 260
    color: '#4f46e5'

  - type: GridView
    source: dashboard_dispatch_queue
    page_size: 8
    columns:
      - type: TextCell
        field: trip_number
        label: Mã chuyến
      - type: TextCell
        field: origin
        label: Tuyến đường
        secondary: destination
      - type: TextCell
        field: truck_plate
        label: Phương tiện
        secondary: driver_name
      - type: BadgeCell
        field: status
        label: Trạng thái
        colors:
          Đã lên lịch: amber
          Đang vận chuyển: blue
      - type: DateCell
        field: departure_time
        label: Khởi hành
        format: short
  - type: DataGrid
    source: dashboard_routes
    page_size: 10
    row_key: route
    columns: [{ field: route, label: Tuyến đường }, { field: trip_count, label: Số chuyến, align: right }, { field: total_distance_km, label: Tổng km, align: right }]
  - type: DataGrid
    source: dashboard_customers
    page_size: 10
    row_key: customer_name
    columns: [{ field: customer_name, label: Khách hàng }, { field: order_count, label: Số đơn, align: right }, { field: total_amount, label: Giá trị đơn, align: right }]
