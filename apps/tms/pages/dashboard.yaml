title: Tổng quan

page:
  id: dashboard
  auth:
    require: [fleet.read]

datasources:
  - id: dashboard_routes
    single: false
    permission: fleet.read
    query: |
      SELECT origin || ' → ' || destination AS route, COUNT(*) AS trip_count,
        COALESCE(SUM(distance_km), 0) AS total_distance_km
      FROM trips t
      WHERE (:from_date IS NULL OR departure_time >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))
      GROUP BY origin, destination ORDER BY trip_count DESC, route
  - id: dashboard_customers
    single: false
    permission: fleet.read
    query: |
      SELECT customer_name, COUNT(*) AS order_count, COALESCE(SUM(total_amount), 0) AS total_amount
      FROM orders
      WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:view_scope = 'all' OR branch_id = :current_branch_id)
      GROUP BY customer_name ORDER BY order_count DESC, total_amount DESC
  - id: dashboard_kpis
    single: true
    permission: fleet.read
    query: |
      SELECT
        (SELECT COUNT(*) FROM trips t WHERE (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS total_trips,
        (SELECT COUNT(*) FROM trips t WHERE t.status = 'In Transit' AND (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS in_transit,
        (SELECT COUNT(*) FROM trips t WHERE t.status = 'Scheduled' AND (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS scheduled,
        (SELECT COUNT(*) FROM maintenance m LEFT JOIN trucks t ON t.id = m.truck_id WHERE m.status = 'Overdue' AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)) AS overdue_maintenance,
        (SELECT COUNT(*) FROM trucks t WHERE t.status = 'Active' AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)) AS active_trucks,
        (SELECT COUNT(*) FROM orders WHERE status = 'Draft' AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS draft_orders,
        (SELECT COUNT(*) FROM orders WHERE status = 'Pending Approval' AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS pending_orders,
        (SELECT COUNT(*) FROM trips t WHERE t.status IN ('Scheduled', 'In Transit') AND t.truck_id IS NULL AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)) AS unassigned_trips,
        (SELECT COUNT(*) FROM accounting_entries WHERE kind = 'debit_note' AND status <> 'Paid' AND due_date < CURRENT_DATE AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS overdue_debit_notes,
        (SELECT COUNT(*) FROM accounting_entries WHERE kind = 'payment_request' AND status = 'Pending Approval' AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS expense_approvals,
        (SELECT COUNT(*) FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (c.status = 'Expiring' OR (c.end_date IS NOT NULL AND c.end_date BETWEEN CURRENT_DATE AND CURRENT_DATE + INTERVAL 30 DAY)) AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)) AS expiring_contracts,
        (SELECT COUNT(*) FROM drivers d WHERE d.status = 'Active' AND (:view_scope = 'all' OR d.assigned_truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS active_drivers,
        (SELECT COUNT(*) FROM containers WHERE status = 'Available' AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS available_containers,
        (SELECT COUNT(*) FROM trips t WHERE t.status = 'Completed' AND (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS completed_trips,
        (SELECT COUNT(*) FROM trips t WHERE t.status = 'Cancelled' AND (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS cancelled_trips,
        (SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE t.status = 'Completed') / NULLIF(COUNT(*), 0), 1) FROM trips t WHERE (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS completion_rate,
        (SELECT ROUND(AVG(date_diff('minute', t.departure_time, t.arrival_time)) / 60.0, 1) FROM trips t WHERE t.arrival_time IS NOT NULL AND t.departure_time IS NOT NULL AND (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS average_trip_hours,
        (SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE t.truck_id IS NULL) / NULLIF(COUNT(*), 0), 1) FROM trips t WHERE (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS unassigned_rate,
        (SELECT COALESCE(SUM(t.distance_km), 0) FROM trips t WHERE (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))) AS total_distance_km,
        (SELECT COALESCE(SUM(total_amount), 0) FROM orders WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS revenue_total,
        (SELECT COUNT(*) FROM orders WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS order_count,
        (SELECT COUNT(*) FROM customers WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR (:view_scope = 'own' AND owner_name = :current_user_name) OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)))) AS new_customer_count,
        (SELECT COALESCE(SUM(cost_amount), 0) FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS cost_total,
        (SELECT COALESCE(SUM(profit_amount), 0) FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS profit_total,
        (SELECT ROUND(100.0 * COALESCE(SUM(profit_amount), 0) / NULLIF((SELECT COALESCE(SUM(total_amount), 0) FROM orders WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)), 0), 1) FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS profit_margin,
        (SELECT COUNT(*) FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS quote_count,
        (SELECT COALESCE(SUM(amount), 0) FROM accounting_entries WHERE kind = 'debit_note' AND status <> 'Paid' AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS receivables_outstanding,
        (SELECT COALESCE(SUM(amount), 0) FROM accounting_entries WHERE kind = 'payment_request' AND status NOT IN ('Paid', 'Cancelled') AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS payables_outstanding,
        (SELECT COALESCE(SUM(amount), 0) FROM accounting_entries WHERE kind = 'advance' AND status NOT IN ('Cancelled', 'Settled') AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS advances_outstanding,
        (SELECT COUNT(*) FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.status = 'Active' AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)) AS active_employees,
        (SELECT COALESCE(SUM(p.net_salary), 0) FROM payrolls p JOIN employees e ON e.id = p.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:from_date IS NULL OR p.pay_month >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR p.pay_month <= CAST(:to_date AS DATE)) AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)) AS payroll_total
  - id: dashboard_trip_status
    single: false
    permission: fleet.read
    query: |
      SELECT CASE status
        WHEN 'Scheduled' THEN 'Đã lên lịch'
        WHEN 'In Transit' THEN 'Đang vận chuyển'
        WHEN 'Completed' THEN 'Hoàn thành'
        WHEN 'Cancelled' THEN 'Đã hủy'
        ELSE status END AS status, COUNT(*) AS trip_count
      FROM trips t
      WHERE (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))
      GROUP BY status
      ORDER BY trip_count DESC, status
  - id: dashboard_financial_monthly
    single: false
    permission: fleet.read
    query: |
      SELECT month, SUM(revenue) AS revenue, SUM(cost) AS cost, SUM(profit) AS profit
      FROM (
        SELECT strftime(order_date, '%Y-%m') AS month, total_amount AS revenue, 0 AS cost, 0 AS profit
        FROM orders
        WHERE (:from_date IS NULL OR order_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR order_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)
        UNION ALL
        SELECT strftime(created_at, '%Y-%m') AS month, 0 AS revenue, cost_amount AS cost, profit_amount AS profit
        FROM quotes
        WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)
      ) grouped
      GROUP BY month ORDER BY month
  - id: dashboard_dispatch_queue
    single: false
    permission: fleet.read
    query: |
      SELECT t.id, t.trip_number, t.origin, t.destination,
        CASE t.status WHEN 'Scheduled' THEN 'Đã lên lịch' WHEN 'In Transit' THEN 'Đang vận chuyển' ELSE t.status END AS status,
        t.departure_time, tr.plate AS truck_plate, d.name AS driver_name
      FROM trips t
      LEFT JOIN trucks tr ON tr.id = t.truck_id
      LEFT JOIN drivers d ON d.id = t.driver_id
      WHERE t.status IN ('Scheduled', 'In Transit')
        AND (:from_date IS NULL OR t.departure_time >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR t.departure_time < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:view_scope = 'all' OR t.branch_id = :current_branch_id OR t.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))
        AND (:q IS NULL OR t.trip_number ILIKE '%' || :q || '%'
          OR t.origin ILIKE '%' || :q || '%'
          OR t.destination ILIKE '%' || :q || '%'
          OR tr.plate ILIKE '%' || :q || '%'
          OR d.name ILIKE '%' || :q || '%')
      ORDER BY CASE t.status WHEN 'In Transit' THEN 0 ELSE 1 END, t.departure_time

components:
  - type: PageIntro
    greeting: Xin chào
    title: Tổng quan
    greeting_side: right
    compact: true
    action_label: Mẹo
  - type: ListToolbar
    source: dashboard_dispatch_queue
    filter_field: q
    search: false
    filter_sources: [dashboard_kpis, dashboard_trip_status, dashboard_dispatch_queue, dashboard_routes, dashboard_customers]
    date_range: { from_field: from_date, to_field: to_date, from_label: 'Từ ngày', to_label: 'Đến ngày', presets: [month, previous_month, quarter, year, last_12_months], preset_style: segmented, default_preset: month }
    actions: [{ id: dashboard_dispatch_queue.export, label: 'Xuất CSV', icon: download }]
    actions_inline: true
  - type: StatRow
    source: dashboard_kpis
    title: Việc cần làm
    stats:
      - { label: Đơn nháp, field: draft_orders, color: indigo, navigate_to: '/orders?status=Draft' }
      - { label: Đơn chờ duyệt, field: pending_orders, color: amber, navigate_to: '/orders?status=Pending%20Approval' }
      - { label: Chuyến chưa điều xe, field: unassigned_trips, color: red, navigate_to: /orders }
      - { label: Chuyến đang chạy, field: in_transit, color: blue, navigate_to: /orders }
      - { label: Giấy báo nợ quá hạn, field: overdue_debit_notes, color: red, navigate_to: /accounting/debit-notes }
      - { label: Đề nghị chi chờ duyệt, field: expense_approvals, color: amber, navigate_to: '/accounting/payment-requests?status=Pending%20Approval' }
      - { label: HĐ sắp hết hạn, field: expiring_contracts, color: amber, navigate_to: '/hr/contracts?status=Expiring' }

  - type: StatRow
    source: dashboard_kpis
    title: Vận hành
    stats:
      - { label: Tổng chuyến, field: total_trips, color: blue }
      - { label: Hoàn thành, field: completed_trips, color: green }
      - { label: Tỷ lệ hoàn thành, field: completion_rate, format: percent, color: green }
      - { label: TB thời gian chạy (giờ), field: average_trip_hours, format: number, color: indigo }
      - { label: Tỷ lệ chưa điều xe, field: unassigned_rate, format: percent, color: amber }
      - { label: Hủy, field: cancelled_trips, color: red }

  - type: StatRow
    source: dashboard_kpis
    title: Doanh thu · Chi phí
    stats:
      - { label: Doanh thu, field: revenue_total, format: currency, currency: VND, color: blue }
      - { label: Chi phí, field: cost_total, format: currency, currency: VND, color: amber }
      - { label: Lợi nhuận, field: profit_total, format: currency, currency: VND, color: green }
      - { label: Biên lãi, field: profit_margin, format: percent, color: green }
      - { label: Số đơn hàng, field: order_count, color: indigo }
      - { label: Khách hàng mới, field: new_customer_count, color: blue }

  - type: StatRow
    source: dashboard_kpis
    title: Công nợ · Dòng tiền
    stats:
      - { label: Công nợ phải thu, field: receivables_outstanding, format: currency, currency: VND, color: blue }
      - { label: Công nợ phải trả, field: payables_outstanding, format: currency, currency: VND, color: red }
      - { label: Tạm ứng còn lại, field: advances_outstanding, format: currency, currency: VND, color: amber }
      - { label: Giấy báo nợ quá hạn, field: overdue_debit_notes, color: red }
      - { label: Chi phí chờ duyệt, field: expense_approvals, color: amber }
      - { label: Tổng km, field: total_distance_km, format: number, color: indigo }

  - type: StatRow
    source: dashboard_kpis
    title: Nhân sự
    stats:
      - { label: Nhân sự hoạt động, field: active_employees, color: blue }
      - { label: Hợp đồng sắp hết hạn, field: expiring_contracts, color: amber }
      - { label: Tài xế hoạt động, field: active_drivers, color: blue }
      - { label: Container sẵn sàng, field: available_containers, color: blue }
      - { label: Tổng bảng lương, field: payroll_total, format: currency, currency: VND, color: blue }
      - { label: Chuyến hoàn thành, field: completed_trips, color: green }

  - type: Chart
    source: dashboard_financial_monthly
    title: Doanh thu · Chi phí · Lợi nhuận theo tháng
    label_field: month
    value_field: revenue
    variant: line
    layout: inline
    width: 640
    height: 260
    series:
      - { field: revenue, label: Doanh thu, color: blue }
      - { field: cost, label: Chi phí, color: amber }
      - { field: profit, label: Lợi nhuận, color: green }
  - type: Chart
    source: dashboard_trip_status
    title: Tổng quan trạng thái chuyến
    label_field: status
    value_field: trip_count
    variant: pie
    layout: inline
    width: 400
    height: 260
    color: indigo

  - type: GridView
    source: dashboard_dispatch_queue
    page_size: 8
    columns:
      - type: TextCell
        field: trip_number
        label: Mã chuyến
      - type: TextCell
        field: origin
        label: Tuyến đường
        secondary: destination
      - type: TextCell
        field: truck_plate
        label: Phương tiện
        secondary: driver_name
      - type: BadgeCell
        field: status
        label: Trạng thái
        colors:
          Đã lên lịch: amber
          Đang vận chuyển: blue
      - type: DateCell
        field: departure_time
        label: Khởi hành
        format: short
  - type: DataGrid
    source: dashboard_routes
    page_size: 10
    row_key: route
    empty_state: { title: Chưa có dữ liệu tuyến đường }
    columns: [{ field: route, label: Tuyến đường, sortable: true }, { field: trip_count, label: Số chuyến, align: right, sortable: true }, { field: total_distance_km, label: Tổng km, align: right, sortable: true }]
  - type: DataGrid
    source: dashboard_customers
    page_size: 10
    row_key: customer_name
    empty_state: { title: Chưa có dữ liệu khách hàng }
    columns: [{ field: customer_name, label: Khách hàng, sortable: true }, { field: order_count, label: Số đơn, align: right, sortable: true }, { field: total_amount, label: Giá trị đơn, align: right, sortable: true }]
