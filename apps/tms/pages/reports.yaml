title: Report

page:
  id: reports
  auth:
    require: [reports.read]

datasources:
  - id: reports_fleet
    single: true
    permission: reports.read
    query: |
      SELECT COUNT(*) AS total_trucks,
        COUNT(*) FILTER (WHERE status = 'Active') AS active_trucks,
        COUNT(*) FILTER (WHERE status = 'Maintenance') AS maintenance_trucks,
        ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'Active') / NULLIF(COUNT(*), 0), 1) AS utilization_pct,
        AVG(mileage) AS avg_mileage
      FROM trucks
      WHERE (:view_scope = 'all' OR branch_id = :current_branch_id)
  - id: reports_costs
    single: true
    permission: reports.financials
    query: |
      SELECT SUM(m.cost) AS grand_total, AVG(m.cost) AS avg_cost, COUNT(*) AS total_services
      FROM maintenance m LEFT JOIN trucks t ON t.id = m.truck_id
      WHERE m.status = 'Completed' AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)
  - id: reports_drivers
    single: false
    permission: reports.read
    query: |
      SELECT d.id AS driver_id, d.name AS driver_name, d.status AS driver_status,
        COUNT(tr.id) AS total_trips,
        COUNT(tr.id) FILTER (WHERE tr.status = 'Completed') AS completed_trips,
        COUNT(tr.id) FILTER (WHERE tr.status = 'Cancelled') AS cancelled_trips,
        COALESCE(SUM(tr.distance_km), 0) AS total_km,
        ROUND(100.0 * COUNT(tr.id) FILTER (WHERE tr.status = 'Completed') / NULLIF(COUNT(tr.id), 0), 1) AS completion_rate
      FROM drivers d
        LEFT JOIN trucks t ON t.id = d.assigned_truck_id
        LEFT JOIN trips tr ON tr.driver_id = d.id
          AND (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR tr.truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id))
      WHERE (:view_scope = 'all' OR t.branch_id = :current_branch_id)
      GROUP BY d.id, d.name, d.status
      ORDER BY completed_trips DESC, total_km DESC

components:
  - type: TabGroup
    tabs:
      - id: fleet-tab
        label: Vehicle performance
        components:
          - type: StatRow
            source: reports_fleet
            stats:
              - label: Total means
                field: total_trucks
                color: blue
              - label: Vehicles are ready
                field: active_trucks
                color: green
              - label: Under maintenance
                field: maintenance_trucks
                color: amber
              - label: Usage rate (%)
                field: utilization_pct
                color: indigo
              - label: Average kilometers
                field: avg_mileage
                color: indigo

      - id: cost-tab
        label: Cost analysis
        permission: reports.financials
        components:
          - type: StatRow
            source: reports_costs
            stats:
              - label: Total
                field: grand_total
                color: red
              - label: Average maintenance costs
                field: avg_cost
                color: amber
              - label: Total maintenance
                field: total_services
                color: blue

      - id: driver-tab
        label: Driver performance
        components:
          - type: GridView
            source: reports_drivers
            page_size: 20
            empty_state: { title: No driver data available }
            columns:
              - type: TextCell
                field: driver_name
                label: Driver
              - type: BadgeCell
                field: driver_status
                label: Status
                colors:
                  Active: green
                  On Leave: amber
                  Inactive: red
              - type: NumberCell
                field: total_trips
                label: Total trip
                format: "#,###"
              - type: NumberCell
                field: completed_trips
                label: Complete
                format: "#,###"
              - type: NumberCell
                field: cancelled_trips
                label: Canceled
                format: "#,###"
              - type: NumberCell
                field: total_km
                label: Total km
                format: "#,###"
              - type: NumberCell
                field: completion_rate
                label: Completion rate (%)
                format: "#,###"
