title: Loại hàng hóa

page:
  id: catalog-cargo-types
  auth:
    require: [catalog.read]

datasources:
  - id: cargo_types
    single: false
    permission: catalog.read
    query: |
      SELECT id, code, name, description, status, sort_order, created_at
      FROM master_data
      WHERE kind = 'cargo_type'
        AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%')
      ORDER BY sort_order, code

toolbar:
  - { id: add_cargo_type_btn, label: '+ Thêm loại hàng hóa', variant: primary, permission: catalog.write, action: add_cargo_type }

components:
  - type: ListToolbar
    source: cargo_types
    filter_field: q
    search: { label: Tìm kiếm loại hàng hóa, placeholder: 'Tìm mã, tên hoặc mô tả...' }
  - type: StatusTabs
    source: cargo_types
    filter_field: status
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Đang sử dụng }
      - { id: Inactive, label: Ngưng sử dụng }
  - type: DataGrid
    source: cargo_types
    page_size: 20
    row_key: id
    selectable: true
    empty_state: { title: Không có loại hàng hóa, description: Tạo loại hàng hóa đầu tiên để sử dụng trong đơn hàng. }
    columns:
      - { field: code, label: Mã, sortable: true }
      - { field: name, label: Loại hàng hóa, type: PrimaryEntityCell, secondary: description }
      - { field: sort_order, label: Thứ tự, align: right }
      - field: status
        label: Trạng thái
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Ngày tạo }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_cargo_type, label: Sửa, variant: ghost }
          - { id: delete_cargo_type, label: Xóa, variant: danger }

actions:
  - id: add_cargo_type
    type: form
    title: Thêm loại hàng hóa
    table: master_data
    scope: cargo_type
    operation: insert
    refresh: [cargo_types]
    fields:
      - { field: code, label: Mã, type: text, required: true }
      - { field: name, label: Loại hàng hóa, type: text, required: true }
      - { field: description, label: Mô tả, type: textarea }
      - { field: sort_order, label: Thứ tự, type: number, default: 0 }
      - { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }
  - id: edit_cargo_type
    type: form
    title: Cập nhật loại hàng hóa
    table: master_data
    scope: cargo_type
    operation: update
    prefill: row
    refresh: [cargo_types]
    fields:
      - { field: code, label: Mã, type: text, required: true }
      - { field: name, label: Loại hàng hóa, type: text, required: true }
      - { field: description, label: Mô tả, type: textarea }
      - { field: sort_order, label: Thứ tự, type: number }
      - { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }
  - { id: delete_cargo_type, type: delete, table: master_data, scope: cargo_type, confirm: 'Xóa loại hàng hóa {{row.name}}?', refresh: [cargo_types] }
