title: Trạng thái chuyến
page: { id: system-trip-statuses, breadcrumb: [Hệ thống, Trạng thái chuyến], auth: { require: [system.read] } }
datasources:
  - { id: trip_statuses, single: false, permission: system.read, query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'trip_status' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code" }
toolbar: [{ id: add_trip_status, label: '+ Thêm trạng thái', variant: primary, permission: system.write, action: add_trip_status }]
components: [{ type: ListToolbar, source: trip_statuses, filter_field: q, search: { label: Tìm trạng thái, placeholder: 'Tìm mã hoặc tên...' }, actions: [{ id: trip_statuses.export, label: 'Xuất CSV', icon: download }] }, { type: StatusTabs, source: trip_statuses, filter_field: status, tabs: [{ id: '', label: Tất cả }, { id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }, { type: DataGrid, source: trip_statuses, page_size: 20, column_chooser: true, row_key: id, empty_state: { title: Chưa có trạng thái chuyến }, columns: [{ field: code, label: Mã }, { field: name, label: Trạng thái chuyến, type: PrimaryEntityCell, secondary: description }, { field: config_value, label: Giá trị }, { field: status, label: Trạng thái, type: StatusChip, colors: { Active: green, Inactive: red } }, { field: actions, label: '', sortable: false, actions: [{ id: edit_trip_status, label: Sửa, variant: ghost, permission: system.write }, { id: delete_trip_status, label: Xóa, variant: danger, permission: system.write }] }] }]
actions:
  - { id: add_trip_status, type: form, permission: system.write, title: Thêm trạng thái chuyến, table: system_configs, scope: trip_status, operation: insert, refresh: [trip_statuses], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Giá trị, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }], default: Active }] }
  - { id: edit_trip_status, type: form, permission: system.write, title: Cập nhật trạng thái chuyến, table: system_configs, scope: trip_status, operation: update, prefill: row, refresh: [trip_statuses], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Giá trị, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }] }
  - { id: delete_trip_status, type: delete, permission: system.write, table: system_configs, scope: trip_status, confirm: 'Xóa trạng thái {{row.name}}?', refresh: [trip_statuses] }
