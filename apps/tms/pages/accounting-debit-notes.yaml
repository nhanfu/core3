title: Giấy báo nợ
page: { id: accounting-debit-notes, auth: { require: [accounting.read] } }
datasources:
  - id: debit_notes
    single: false
    permission: accounting.read
    query: |
      SELECT id, code, name, counterparty, amount, currency, status, CAST(document_date AS VARCHAR) AS document_date, CAST(due_date AS VARCHAR) AS due_date, description, created_at
      FROM accounting_entries WHERE kind = 'debit_note' AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR counterparty ILIKE '%' || :q || '%')
      ORDER BY document_date DESC, code
toolbar:
  - { id: add_debit_note_btn, label: '+ Thêm giấy báo nợ', variant: primary, permission: accounting.write, action: add_debit_note }
components:
  - { type: ListToolbar, source: debit_notes, filter_field: q, search: { label: Tìm kiếm giấy báo nợ, placeholder: 'Tìm số chứng từ hoặc đối tác...' } }
  - type: StatusTabs
    source: debit_notes
    filter_field: status
    tabs: [{ id: '', label: Tất cả }, { id: Draft, label: Nháp }, { id: Pending Approval, label: Đang duyệt }, { id: Approved, label: Đã duyệt }]
  - type: DataGrid
    source: debit_notes
    page_size: 20
    row_key: id
    selectable: true
    empty_state: { title: Không có giấy báo nợ }
    columns:
      - { field: code, label: Số chứng từ, sortable: true }
      - { field: name, label: Nội dung, type: PrimaryEntityCell, secondary: counterparty }
      - { field: document_date, label: Ngày chứng từ }
      - { field: due_date, label: Hạn thanh toán }
      - { field: amount, label: Giá trị, align: right }
      - { field: currency, label: Tiền tệ }
      - field: status
        label: Trạng thái
        type: StatusChip
        colors: { Draft: neutral, Pending Approval: amber, Approved: green }
      - field: actions
        label: ''
        sortable: false
        actions: [{ id: edit_debit_note, label: Sửa, variant: ghost }, { id: delete_debit_note, label: Xóa, variant: danger }]
actions:
  - id: add_debit_note
    type: form
    title: Thêm giấy báo nợ
    table: accounting_entries
    scope: debit_note
    operation: insert
    refresh: [debit_notes]
    fields: [{ field: code, label: Số chứng từ, type: text, required: true }, { field: name, label: Nội dung, type: text, required: true }, { field: counterparty, label: Đối tác, type: text }, { field: amount, label: Giá trị, type: number, default: 0 }, { field: currency, label: Tiền tệ, type: text, default: VND }, { field: status, label: Trạng thái, type: select, options: [Draft, Pending Approval, Approved], default: Draft }, { field: document_date, label: Ngày chứng từ, type: date }, { field: due_date, label: Hạn thanh toán, type: date }, { field: description, label: Ghi chú, type: textarea }]
  - id: edit_debit_note
    type: form
    title: Cập nhật giấy báo nợ
    table: accounting_entries
    scope: debit_note
    operation: update
    prefill: row
    refresh: [debit_notes]
    fields: [{ field: code, label: Số chứng từ, type: text, required: true }, { field: name, label: Nội dung, type: text, required: true }, { field: counterparty, label: Đối tác, type: text }, { field: amount, label: Giá trị, type: number }, { field: currency, label: Tiền tệ, type: text }, { field: status, label: Trạng thái, type: select, options: [Draft, Pending Approval, Approved] }, { field: document_date, label: Ngày chứng từ, type: date }, { field: due_date, label: Hạn thanh toán, type: date }, { field: description, label: Ghi chú, type: textarea }]
  - { id: delete_debit_note, type: delete, table: accounting_entries, scope: debit_note, confirm: 'Xóa giấy báo nợ {{row.code}}?', refresh: [debit_notes] }
