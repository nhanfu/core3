title: Giấy báo nợ
page: { id: accounting-debit-notes, breadcrumb: [Kế toán, Giấy báo nợ], auth: { require: [accounting.read] } }
datasources:
  - id: debit_notes
    single: false
    permission: accounting.read
    query: |
      SELECT id, code, name, counterparty, amount, currency,
        printf('%,.0f', COALESCE(amount, 0)) AS amount_display, status,
        CASE status WHEN 'Draft' THEN 'Nháp' WHEN 'Pending Approval' THEN 'Đang duyệt'
          WHEN 'Approved' THEN 'Đã duyệt' WHEN 'Paid' THEN 'Đã thanh toán'
          WHEN 'Cancelled' THEN 'Đã hủy' ELSE status END AS status_label,
        CAST(document_date AS VARCHAR) AS document_date, CAST(due_date AS VARCHAR) AS due_date, description, created_at
      FROM accounting_entries WHERE kind = 'debit_note' AND (:view_scope = 'all' OR branch_id = :current_branch_id) AND (:status IS NULL OR status = :status) AND (:from_date IS NULL OR document_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR document_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR counterparty ILIKE '%' || :q || '%')
      ORDER BY document_date DESC, code
  - id: debit_note_currency_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'currency' AND status = 'Active' UNION SELECT DISTINCT currency AS value, currency AS label FROM accounting_entries WHERE currency IS NOT NULL AND currency <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
toolbar:
  - { id: add_debit_note_btn, label: '+ Thêm giấy báo nợ', variant: primary, permission: accounting.write, action: add_debit_note }
components:
  - { type: ListToolbar, source: debit_notes, filter_field: q, search: { label: Tìm kiếm giấy báo nợ, placeholder: 'Tìm số chứng từ hoặc đối tác...' }, date_range: { from_field: from_date, to_field: to_date, from_label: 'Từ ngày chứng từ', to_label: 'Đến ngày chứng từ', presets: [today, week, month, quarter, year, all] }, actions: [{ id: debit_notes.export, label: 'Xuất Excel', icon: download, params: { format: xlsx } }] }
  - type: StatusTabs
    source: debit_notes
    filter_field: status
    variant: contained
    tabs: [{ id: '', label: Tất cả }, { id: Draft, label: Nháp }, { id: Pending Approval, label: Đang duyệt }, { id: Approved, label: Đã duyệt }, { id: Paid, label: Đã thanh toán }, { id: Cancelled, label: Đã hủy }]
  - type: DataGrid
    source: debit_notes
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: Không có giấy báo nợ }
    columns:
      - { field: code, label: Số chứng từ, sortable: true }
      - { field: name, label: Nội dung, type: PrimaryEntityCell, secondary: counterparty }
      - { field: document_date, label: Ngày chứng từ }
      - { field: due_date, label: Hạn thanh toán }
      - { field: amount_display, label: Giá trị, align: right }
      - { field: currency, label: Tiền tệ }
      - field: status_label
        label: Trạng thái
        type: StatusChip
        colors: { Nháp: neutral, Đang duyệt: amber, Đã duyệt: green, Đã thanh toán: blue, Đã hủy: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_debit_note, label: Chi tiết, variant: secondary, permission: accounting.read }
          - { id: edit_debit_note, label: Sửa, variant: ghost, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: submit_debit_note, label: Trình duyệt, variant: primary, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: approve_debit_note, label: Duyệt, variant: primary, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: reject_debit_note, label: Từ chối, variant: ghost, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: pay_debit_note, label: Đã thanh toán, variant: primary, permission: accounting.pay, show_if: "row.status === 'Approved'" }
          - { id: cancel_debit_note, label: Hủy, variant: danger, permission: accounting.write, show_if: "['Draft', 'Pending Approval', 'Approved'].includes(row.status)" }
          - { id: delete_debit_note, label: Xóa, variant: danger, permission: accounting.write, show_if: "row.status === 'Draft'" }
actions:
  - id: add_debit_note
    type: form
    permission: accounting.write
    title: Thêm giấy báo nợ
    table: accounting_entries
    scope: debit_note
    operation: insert
    refresh: [debit_notes]
    fields: [{ field: code, label: Số chứng từ, type: text, required: true }, { field: name, label: Nội dung, type: text, required: true }, { field: counterparty, label: Đối tác, type: text }, { field: currency, label: Tiền tệ, type: select, options_source: debit_note_currency_lookup, default: VND }, { field: document_date, label: Ngày chứng từ, type: date }, { field: due_date, label: Hạn thanh toán, type: date }, { field: description, label: Ghi chú, type: textarea }]
  - id: edit_debit_note
    type: form
    permission: accounting.write
    title: Cập nhật giấy báo nợ
    table: accounting_entries
    scope: debit_note
    operation: update
    prefill: row
    refresh: [debit_notes]
    fields: [{ field: code, label: Số chứng từ, type: text, required: true }, { field: name, label: Nội dung, type: text, required: true }, { field: counterparty, label: Đối tác, type: text }, { field: currency, label: Tiền tệ, type: select, options_source: debit_note_currency_lookup }, { field: document_date, label: Ngày chứng từ, type: date }, { field: due_date, label: Hạn thanh toán, type: date }, { field: description, label: Ghi chú, type: textarea }]
  - { id: view_debit_note, type: navigate, permission: accounting.read, navigate_to: /accounting/documents/detail, params: { id: '{row.id}', kind: debit_note, back: /accounting/debit-notes } }
  - { id: submit_debit_note, type: server, permission: accounting.write, action: accounting.debit_notes.submit_for_approval, confirm: 'Trình duyệt giấy báo nợ {{row.code}}?', refresh: [debit_notes] }
  - { id: approve_debit_note, type: server, permission: accounting.approve, action: accounting.debit_notes.approve, confirm: 'Duyệt giấy báo nợ {{row.code}}?', refresh: [debit_notes] }
  - { id: reject_debit_note, type: server, permission: accounting.approve, action: accounting.debit_notes.reject, confirm: 'Từ chối giấy báo nợ {{row.code}}?', refresh: [debit_notes] }
  - { id: pay_debit_note, type: server, permission: accounting.pay, action: accounting.debit_notes.mark_paid, confirm: 'Xác nhận đã thanh toán giấy báo nợ {{row.code}}?', refresh: [debit_notes] }
  - { id: cancel_debit_note, type: server, permission: accounting.write, action: accounting.debit_notes.cancel, confirm: 'Hủy giấy báo nợ {{row.code}}?', refresh: [debit_notes] }
  - { id: delete_debit_note, type: delete, permission: accounting.write, table: accounting_entries, scope: debit_note, confirm: 'Xóa giấy báo nợ {{row.code}}?', refresh: [debit_notes] }
