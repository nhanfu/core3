title: Quy trình duyệt
page: { id: system-approval-flows, breadcrumb: [Hệ thống, Quy trình duyệt], auth: { require: [system.read] } }
datasources:
  - id: approval_flows
    single: false
    permission: system.read
    query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'approval_flow' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code"
toolbar: [{ id: add_approval_flow, label: '+ Thêm quy trình', variant: primary, permission: system.write, action: add_approval_flow }]
components:
  - { type: ListToolbar, source: approval_flows, filter_field: q, search: { label: Tìm quy trình, placeholder: 'Tìm mã hoặc tên...' }, actions: [{ id: approval_flows.export, label: 'Xuất CSV', icon: download }] }
  - { type: StatusTabs, source: approval_flows, filter_field: status, tabs: [{ id: '', label: Tất cả }, { id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }
  - type: DataGrid
    source: approval_flows
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có quy trình duyệt }
    columns:
      - { field: code, label: Mã }
      - { field: name, label: Quy trình, type: PrimaryEntityCell, secondary: description }
      - { field: config_value, label: Cấu hình cũ }
      - { field: status, label: Trạng thái, type: StatusChip, colors: { Active: green, Inactive: red } }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_approval_flow, label: Chi tiết, variant: primary, permission: system.read }
          - { id: edit_approval_flow, label: Sửa, variant: ghost, permission: system.write }
          - { id: delete_approval_flow, label: Xóa, variant: danger, permission: system.write }
actions:
  - { id: view_approval_flow, type: navigate, permission: system.read, navigate_to: /system/approval-flows/detail, params: { id: '{row.id}' } }
  - { id: add_approval_flow, type: form, permission: system.write, title: Thêm quy trình duyệt, table: system_configs, scope: approval_flow, operation: insert, refresh: [approval_flows], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Các bước cũ, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }], default: Active }] }
  - { id: edit_approval_flow, type: form, permission: system.write, title: Cập nhật quy trình duyệt, table: system_configs, scope: approval_flow, operation: update, prefill: row, refresh: [approval_flows], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Các bước cũ, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }] }
  - { id: delete_approval_flow, type: delete, permission: system.write, table: system_configs, scope: approval_flow, confirm: 'Xóa quy trình {{row.name}}?', refresh: [approval_flows] }
