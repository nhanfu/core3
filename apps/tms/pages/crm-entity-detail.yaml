title: Chi tiết đối tượng CRM
page: { id: crm-entity-detail, breadcrumb: [Kinh doanh, Đối tượng, Chi tiết], auth: { require: [crm.read] } }

datasources:
  - id: crm_entity_detail
    single: true
    permission: crm.read
    query: |
      SELECT c.id, 'customer' AS kind, c.code, c.name, c.tax_code, c.phone, c.email,
        c.owner_name, c.visibility, c.status AS status, c.stage AS stage, NULL AS partner_type,
        CASE c.visibility WHEN 'Private' THEN 'Riêng' ELSE 'Công khai' END AS visibility_label,
        CASE c.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label,
        CASE c.stage WHEN 'Lead' THEN 'Khách tiềm năng'
          WHEN 'Contacting' THEN 'Đang tiếp cận'
          WHEN 'Customer' THEN 'Khách hàng' ELSE c.stage END AS category_label,
        'Giai đoạn CRM' AS category_name, CAST(c.created_at AS VARCHAR) AS created_at
      FROM customers c
      WHERE :kind = 'customer' AND c.id = :id
        AND (:view_scope = 'all'
          OR (:view_scope = 'branch' AND (c.visibility = 'Public' OR c.owner_name = :current_user_name))
          OR (:view_scope = 'own' AND c.owner_name = :current_user_name))
      UNION ALL
      SELECT p.id, 'partner', p.code, p.name, p.tax_code, p.phone, p.email,
        p.owner_name, p.visibility, p.status, NULL AS stage, p.partner_type,
        CASE p.visibility WHEN 'Private' THEN 'Riêng' ELSE 'Công khai' END,
        CASE p.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END,
        CASE p.partner_type WHEN 'Carrier' THEN 'Nhà xe'
          WHEN 'Supplier' THEN 'Nhà cung cấp'
          WHEN 'ShippingLine' THEN 'Hãng tàu'
          WHEN 'Warehouse' THEN 'Kho / bãi'
          WHEN 'Depot' THEN 'Depot' ELSE 'Khác' END,
        'Loại đối tượng', CAST(p.created_at AS VARCHAR)
      FROM partners p
      WHERE :kind = 'partner' AND p.id = :id
        AND (:view_scope = 'all'
          OR (:view_scope = 'branch' AND (p.visibility = 'Public' OR p.owner_name = :current_user_name))
          OR (:view_scope = 'own' AND p.owner_name = :current_user_name))
  - id: crm_entity_contacts
    single: false
    permission: crm.read
    query: |
      SELECT id, customer_id AS entity_id, name, role_title, phone, email,
        is_primary, CASE WHEN is_primary THEN 'Liên hệ chính' ELSE 'Liên hệ phụ' END AS primary_label,
        notes, CAST(created_at AS VARCHAR) AS created_at
      FROM customer_contacts
      WHERE :kind = 'customer' AND customer_id = :id
        AND EXISTS (SELECT 1 FROM customers c WHERE c.id = customer_id AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (c.visibility = 'Public' OR c.owner_name = :current_user_name)) OR (:view_scope = 'own' AND c.owner_name = :current_user_name)))
      UNION ALL
      SELECT id, partner_id, name, role_title, phone, email,
        is_primary, CASE WHEN is_primary THEN 'Liên hệ chính' ELSE 'Liên hệ phụ' END,
        notes, CAST(created_at AS VARCHAR)
      FROM partner_contacts
      WHERE :kind = 'partner' AND partner_id = :id
        AND EXISTS (SELECT 1 FROM partners p WHERE p.id = partner_id AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (p.visibility = 'Public' OR p.owner_name = :current_user_name)) OR (:view_scope = 'own' AND p.owner_name = :current_user_name)))
      ORDER BY is_primary DESC, created_at, name
  - id: crm_entity_activity
    single: false
    permission: crm.read
    query: |
      SELECT actor_name, action,
        CASE WHEN action LIKE '%.contacts.create' THEN 'Thêm người liên hệ'
          WHEN action LIKE '%.contacts.update' THEN 'Cập nhật người liên hệ'
          WHEN action LIKE '%.contacts.delete' THEN 'Xóa người liên hệ'
          ELSE action END AS action_label,
        detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity
      WHERE resource = CASE WHEN :kind = 'customer' THEN 'customers' ELSE 'partners' END
        AND resource_id = :id
        AND (
          (:kind = 'customer' AND EXISTS (SELECT 1 FROM customers c WHERE c.id = :id AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (c.visibility = 'Public' OR c.owner_name = :current_user_name)) OR (:view_scope = 'own' AND c.owner_name = :current_user_name))))
          OR (:kind = 'partner' AND EXISTS (SELECT 1 FROM partners p WHERE p.id = :id AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (p.visibility = 'Public' OR p.owner_name = :current_user_name)) OR (:view_scope = 'own' AND p.owner_name = :current_user_name))))
        )
      UNION ALL
      SELECT 'Hệ thống', 'created', 'Đã tạo', 'Khởi tạo đối tượng CRM',
        CAST(created_at AS VARCHAR)
      FROM customers c WHERE :kind = 'customer' AND c.id = :id
        AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (c.visibility = 'Public' OR c.owner_name = :current_user_name)) OR (:view_scope = 'own' AND c.owner_name = :current_user_name))
      UNION ALL
      SELECT 'Hệ thống', 'created', 'Đã tạo', 'Khởi tạo đối tượng CRM',
        CAST(created_at AS VARCHAR)
      FROM partners p WHERE :kind = 'partner' AND p.id = :id
        AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (p.visibility = 'Public' OR p.owner_name = :current_user_name)) OR (:view_scope = 'own' AND p.owner_name = :current_user_name))
      ORDER BY created_at DESC

toolbar:
  - { id: back_crm_btn, label: 'Danh sách', icon: arrow-left, variant: secondary, action: back_crm }
  - { id: edit_crm_entity, label: Sửa đối tượng, variant: primary, permission: crm.write, action: edit_crm_entity }

components:
  - type: DocumentSummary
    source: crm_entity_detail
    title_field: code
    subtitle_field: name
    status_field: status_label
    status_colors: { Hoạt động: green, Ngưng hoạt động: red }
    columns:
      - { field: category_label, label: Phân loại }
      - { field: tax_code, label: Mã số thuế }
      - { field: owner_name, label: Sale phụ trách }
      - { field: visibility_label, label: Phạm vi hiển thị }
      - { field: phone, label: Điện thoại chính }
      - { field: email, label: Email chính }
  - type: ContactGrid
    source: crm_entity_contacts
    title: Người liên hệ
    description: Liên hệ chính được đồng bộ lên thông tin đối tượng.
    page_size: 25
    row_key: id
    actions:
      - { id: add_crm_contact, label: '+ Thêm người liên hệ', variant: primary, permission: crm.write }
    empty_state: { title: Chưa có người liên hệ }
    columns:
      - { field: name, label: Họ tên, type: PrimaryEntityCell, secondary: role_title }
      - { field: phone, label: Điện thoại }
      - { field: email, label: Email }
      - { field: primary_label, label: Vai trò, type: StatusChip, colors: { Liên hệ chính: green, Liên hệ phụ: neutral } }
      - { field: notes, label: Ghi chú }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_crm_contact, label: Sửa, variant: ghost, permission: crm.write }
          - { id: delete_crm_contact, label: Xóa, variant: danger, permission: crm.write }
  - type: ApprovalTimeline
    source: crm_entity_activity
    title: Lịch sử liên hệ
    empty_state: { title: Chưa có hoạt động liên hệ }
    actor_field: actor_name
    action_field: action_label
    detail_field: detail
    timestamp_field: created_at

actions:
  - { id: back_crm, type: navigate, navigate_to: '{state.back}' }
  - id: edit_crm_entity
    type: server_form
    permission: crm.write
    title: Cập nhật đối tượng CRM
    action: crm.entities.update
    prefill: source
    prefill_source: crm_entity_detail
    params: { id: '{state.id}', kind: '{state.kind}' }
    refresh: [crm_entity_detail, crm_entity_contacts, crm_entity_activity]
    fields:
      - { field: code, label: Mã đối tượng, type: text, required: true }
      - { field: name, label: Tên đối tượng, type: text, required: true }
      - { field: tax_code, label: Mã số thuế, type: text }
      - { field: phone, label: Điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: stage, label: Giai đoạn CRM, type: select, show_if: "state.kind === 'customer'", options: [{ id: Lead, label: Khách tiềm năng }, { id: Contacting, label: Đang tiếp cận }, { id: Customer, label: Khách hàng }] }
      - { field: partner_type, label: Loại đối tác, type: select, show_if: "state.kind === 'partner'", options: [{ id: Carrier, label: Nhà xe }, { id: Supplier, label: Nhà cung cấp }, { id: ShippingLine, label: Hãng tàu }, { id: Warehouse, label: Kho / bãi }, { id: Depot, label: Depot }, { id: Other, label: Khác }] }
      - { field: owner_name, label: Sale phụ trách, type: text }
      - { field: visibility, label: Phạm vi hiển thị, type: select, options: [{ id: Public, label: Công khai }, { id: Private, label: Riêng }] }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }] }
  - id: add_crm_contact
    type: server_form
    permission: crm.write
    title: Thêm người liên hệ
    action: crm.contacts.create
    params: { id: '{state.id}', kind: '{state.kind}' }
    refresh: [crm_entity_contacts, crm_entity_detail, crm_entity_activity]
    fields:
      - { field: name, label: Họ tên, type: text, required: true }
      - { field: role_title, label: Chức vụ, type: text }
      - { field: phone, label: Điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: is_primary, label: Liên hệ chính, type: select, options: [{ id: false, label: Không }, { id: true, label: Có }], default: false }
      - { field: notes, label: Ghi chú, type: textarea }
  - id: edit_crm_contact
    type: server_form
    permission: crm.write
    title: Cập nhật người liên hệ
    action: crm.contacts.update
    prefill: row
    params: { id: '{state.id}', kind: '{state.kind}', contact_id: '{row.id}' }
    refresh: [crm_entity_contacts, crm_entity_detail, crm_entity_activity]
    fields:
      - { field: name, label: Họ tên, type: text, required: true }
      - { field: role_title, label: Chức vụ, type: text }
      - { field: phone, label: Điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: is_primary, label: Liên hệ chính, type: select, options: [{ id: false, label: Không }, { id: true, label: Có }] }
      - { field: notes, label: Ghi chú, type: textarea }
  - id: delete_crm_contact
    type: server
    permission: crm.write
    action: crm.contacts.delete
    confirm: 'Xóa người liên hệ {{row.name}}?'
    params: { id: '{state.id}', kind: '{state.kind}', contact_id: '{row.id}' }
    refresh: [crm_entity_contacts, crm_entity_detail, crm_entity_activity]
