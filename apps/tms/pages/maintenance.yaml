title: Bảo dưỡng

page:
  id: maintenance
  auth:
    require: [maintenance.read]

datasources:
  - id: maintenance_kpis
    single: true
    permission: maintenance.read
    query: |
      SELECT COUNT(*) FILTER (WHERE m.status = 'Overdue' OR (m.status = 'Scheduled' AND m.scheduled_date < CURRENT_DATE)) AS overdue,
        COUNT(*) FILTER (WHERE m.scheduled_date BETWEEN CURRENT_DATE AND CURRENT_DATE + INTERVAL '7 days' AND m.status = 'Scheduled') AS due_this_week,
        COUNT(*) FILTER (WHERE m.status = 'In Progress') AS in_progress,
        COUNT(*) FILTER (WHERE m.status = 'Completed' AND m.completed_date >= date_trunc('month', CURRENT_DATE)) AS completed_month
      FROM maintenance m JOIN trucks t ON t.id = m.truck_id
      WHERE (:view_scope = 'all' OR t.branch_id = :current_branch_id)
  - id: maintenance
    single: false
    permission: maintenance.read
    query: |
      SELECT m.*, t.plate AS truck_plate, t.model AS truck_model, u.name AS technician_name
      FROM maintenance m
      LEFT JOIN trucks t ON t.id = m.truck_id
      LEFT JOIN users u ON u.id = m.technician_id
      WHERE (:view_scope = 'all' OR t.branch_id = :current_branch_id)
        AND (:status IS NULL OR m.status = :status)
        AND (:service_type IS NULL OR m.service_type = :service_type)
        AND (:q IS NULL OR t.plate ILIKE '%' || :q || '%' OR m.service_type ILIKE '%' || :q || '%' OR m.notes ILIKE '%' || :q || '%')
      ORDER BY m.scheduled_date DESC
  - id: maintenance_truck_lookup
    single: false
    permission: maintenance.read
    query: "SELECT id AS value, plate || ' - ' || model AS label FROM trucks WHERE (:view_scope = 'all' OR branch_id = :current_branch_id) UNION SELECT DISTINCT t.id AS value, t.plate || ' - ' || t.model AS label FROM maintenance m JOIN trucks t ON t.id = m.truck_id WHERE m.truck_id IS NOT NULL AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY label"
  - id: maintenance_technician_lookup
    single: false
    permission: maintenance.read
    query: "SELECT id AS value, name AS label FROM users WHERE enabled = true AND (:view_scope = 'all' OR branch_id = :current_branch_id) UNION SELECT DISTINCT u.id AS value, u.name AS label FROM maintenance m JOIN trucks t ON t.id = m.truck_id JOIN users u ON u.id = m.technician_id WHERE m.technician_id IS NOT NULL AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - id: add_maintenance_btn
    label: "+ Lên lịch bảo dưỡng"
    variant: primary
    permission: maintenance.write
    action: add_maintenance

filters:
  source: maintenance
  all_label: Tất cả
  clear_label: Xóa bộ lọc
  fields:
    - field: status
      label: Trạng thái
      type: select
      options: [{ id: Scheduled, label: Đã lên lịch }, { id: 'In Progress', label: Đang thực hiện }, { id: Completed, label: Hoàn thành }, { id: Overdue, label: Quá hạn }]
    - field: service_type
      label: Loại bảo dưỡng
      type: select
      options:
        - { id: 'Oil Change', label: Thay dầu }
        - { id: 'Tire Rotation', label: Đảo lốp }
        - { id: 'Brake Service', label: Bảo dưỡng phanh }
        - { id: 'Engine Overhaul', label: Đại tu động cơ }
        - { id: 'Transmission Service', label: Bảo dưỡng hộp số }
        - { id: 'AC Repair', label: Sửa điều hòa }
        - { id: Electrical, label: Điện }
        - { id: 'Body Repair', label: Sửa thân vỏ }
        - { id: 'Annual Inspection', label: Kiểm định định kỳ }
        - { id: Other, label: Khác }
    - field: q
      label: Tìm kiếm
      type: search
      placeholder: "Biển số hoặc loại bảo dưỡng..."

components:
  - type: StatRow
    source: maintenance_kpis
    stats:
      - label: Quá hạn
        field: overdue
        color: red
      - label: Đến hạn tuần này
        field: due_this_week
        color: amber
      - label: Đang thực hiện
        field: in_progress
        color: blue
      - label: Hoàn thành tháng này
        field: completed_month
        color: green

  - type: GridView
    source: maintenance
    page_size: 8
    empty_state: { title: Không có lịch bảo dưỡng, description: Thử thay đổi bộ lọc hoặc lên lịch bảo dưỡng mới. }
    columns:
      - type: TextCell
        field: truck_plate
        label: Phương tiện
        secondary: truck_model
      - type: TextCell
        field: service_type
        label: Loại bảo dưỡng
      - type: BadgeCell
        field: status
        label: Trạng thái
        colors:
          Scheduled: blue
          In Progress: indigo
          Completed: green
          Overdue: red
      - type: DateCell
        field: scheduled_date
        label: Ngày dự kiến
        format: short
      - type: DateCell
        field: completed_date
        label: Ngày hoàn thành
        format: short
      - type: NumberCell
        field: cost
        label: Chi phí (VNĐ)
        format: "#,###"
      - type: TextCell
        field: technician_name
        label: Kỹ thuật viên
      - type: ActionCell
        label: ""
        actions:
          - id: edit_maintenance
            label: Sửa
            variant: ghost
            permission: maintenance.write
          - id: mark_done
            label: Đánh dấu hoàn thành
            variant: secondary
            permission: maintenance.write
          - id: delete_maintenance
            label: Xóa
            variant: danger
            permission: maintenance.write

actions:
  - id: add_maintenance
    type: form
    permission: maintenance.write
    title: Lên lịch bảo dưỡng
    table: maintenance
    operation: insert
    prefill: null
    refresh: [maintenance, maintenance_kpis]
    fields:
      - field: truck_id
        label: Mã phương tiện
        type: select
        options_source: maintenance_truck_lookup
        required: true
      - field: service_type
        label: Loại bảo dưỡng
        type: select
        required: true
        options:
          - Oil Change
          - Tire Rotation
          - Brake Service
          - Engine Overhaul
          - Transmission Service
          - AC Repair
          - Electrical
          - Body Repair
          - Annual Inspection
          - Other
      - field: status
        label: Trạng thái
        type: select
        required: false
        options: [{ id: Scheduled, label: Đã lên lịch }, { id: 'In Progress', label: Đang thực hiện }, { id: Completed, label: Hoàn thành }, { id: Overdue, label: Quá hạn }]
        default: Scheduled
      - field: scheduled_date
        label: Ngày dự kiến
        type: date
        required: true
      - field: technician_id
        label: Mã kỹ thuật viên
        type: select
        options_source: maintenance_technician_lookup
        required: false
      - field: cost
        label: Chi phí (VNĐ)
        type: number
        required: false
      - field: notes
        label: Ghi chú
        type: textarea
        required: false

  - id: edit_maintenance
    type: form
    permission: maintenance.write
    title: Cập nhật bảo dưỡng
    table: maintenance
    operation: update
    prefill: row
    refresh: [maintenance, maintenance_kpis]
    fields:
      - field: truck_id
        label: Mã phương tiện
        type: select
        options_source: maintenance_truck_lookup
        required: true
      - field: service_type
        label: Loại bảo dưỡng
        type: select
        required: true
        options:
          - Oil Change
          - Tire Rotation
          - Brake Service
          - Engine Overhaul
          - Transmission Service
          - AC Repair
          - Electrical
          - Body Repair
          - Annual Inspection
          - Other
      - field: status
        label: Trạng thái
        type: select
        required: false
        options: [{ id: Scheduled, label: Đã lên lịch }, { id: 'In Progress', label: Đang thực hiện }, { id: Completed, label: Hoàn thành }, { id: Overdue, label: Quá hạn }]
        default: Scheduled
      - field: scheduled_date
        label: Ngày dự kiến
        type: date
        required: true
      - field: technician_id
        label: Mã kỹ thuật viên
        type: select
        options_source: maintenance_technician_lookup
        required: false
      - field: cost
        label: Chi phí (VNĐ)
        type: number
        required: false
      - field: notes
        label: Ghi chú
        type: textarea
        required: false

  - id: mark_done
    type: patch
    permission: maintenance.write
    confirm: "Đánh dấu công việc này đã hoàn thành?"
    table: maintenance
    body:
      status: Completed
    refresh: [maintenance, maintenance_kpis]

  - id: delete_maintenance
    type: delete
    permission: maintenance.write
    confirm: "Xóa bản ghi bảo dưỡng này?"
    table: maintenance
    refresh: [maintenance, maintenance_kpis]
