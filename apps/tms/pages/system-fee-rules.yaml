title: Công thức phí chuyến
page: { id: system-fee-rules, auth: { require: [system.read] } }
datasources:
  - { id: fee_rules, single: false, permission: system.read, query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'fee_rule' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code" }
toolbar: [{ id: add_fee_rule, label: '+ Thêm công thức', variant: primary, permission: system.write, action: add_fee_rule }]
components: [{ type: ListToolbar, source: fee_rules, filter_field: q, search: { label: Tìm công thức, placeholder: 'Tìm mã hoặc tên...' } }, { type: StatusTabs, source: fee_rules, filter_field: status, tabs: [{ id: '', label: Tất cả }, { id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }, { type: DataGrid, source: fee_rules, page_size: 20, row_key: id, columns: [{ field: code, label: Mã }, { field: name, label: Công thức phí, type: PrimaryEntityCell, secondary: description }, { field: config_value, label: Biểu thức }, { field: status, label: Trạng thái, type: StatusChip, colors: { Active: green, Inactive: red } }, { field: actions, label: '', sortable: false, actions: [{ id: edit_fee_rule, label: Sửa, variant: ghost }, { id: delete_fee_rule, label: Xóa, variant: danger }] }] }]
actions:
  - { id: add_fee_rule, type: form, title: Thêm công thức phí, table: system_configs, scope: fee_rule, operation: insert, refresh: [fee_rules], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Biểu thức, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }] }
  - { id: edit_fee_rule, type: form, title: Cập nhật công thức phí, table: system_configs, scope: fee_rule, operation: update, prefill: row, refresh: [fee_rules], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Biểu thức, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }] }
  - { id: delete_fee_rule, type: delete, table: system_configs, scope: fee_rule, confirm: 'Xóa công thức {{row.name}}?', refresh: [fee_rules] }
