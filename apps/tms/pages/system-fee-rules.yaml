title: Trip fee formula
page: { id: system-fee-rules, breadcrumb: [System, Trip fee formula], auth: { require: [system.read] } }
datasources:
  - { id: fee_rules, single: false, permission: system.read, query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'fee_rule' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code" }
toolbar: [{ id: add_fee_rule, label: '+ Add formula', variant: primary, permission: system.write, action: add_fee_rule }]
components: [{ type: ListToolbar, source: fee_rules, filter_field: q, search: { label: Find the recipe, placeholder: 'Find code or name...' }, actions: [{ id: fee_rules.export, label: 'Export CSV', icon: download }] }, { type: StatusTabs, source: fee_rules, filter_field: status, tabs: [{ id: '', label: All }, { id: Active, label: Using }, { id: Inactive, label: Stop using }] }, { type: DataGrid, source: fee_rules, page_size: 20, column_chooser: true, row_key: id, empty_state: { title: There is no fee formula yet }, columns: [{ field: code, label: Code }, { field: name, label: Fee formula, type: PrimaryEntityCell, secondary: description }, { field: config_value, label: Expression }, { field: status, label: Status, type: StatusChip, colors: { Active: green, Inactive: red } }, { field: actions, label: '', sortable: false, actions: [{ id: edit_fee_rule, label: Fix, variant: ghost, permission: system.write }, { id: delete_fee_rule, label: Erase, variant: danger, permission: system.write }] }] }]
actions:
  - { id: add_fee_rule, type: form, permission: system.write, title: Add fee formula, table: system_configs, scope: fee_rule, operation: insert, refresh: [fee_rules], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Expression, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }] }
  - { id: edit_fee_rule, type: form, permission: system.write, title: Update fee formula, table: system_configs, scope: fee_rule, operation: update, prefill: row, refresh: [fee_rules], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Expression, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }] }
  - { id: delete_fee_rule, type: delete, permission: system.write, table: system_configs, scope: fee_rule, confirm: 'Delete formula {{row.name}}?', refresh: [fee_rules] }
