title: Lịch điều

page:
  id: trips
  breadcrumb: [Điều hành, Lịch điều]
  auth:
    require: [trips.read]

datasources:
  - id: trips_stats
    single: true
    permission: trips.read
    query: |
      SELECT COUNT(*) FILTER (WHERE tr.status = 'Scheduled') AS scheduled_count,
        COUNT(*) FILTER (WHERE tr.status = 'In Transit') AS in_transit_count,
        COUNT(*) FILTER (WHERE tr.status = 'Completed' AND DATE(tr.arrival_time) = CURRENT_DATE) AS completed_today,
        COUNT(*) FILTER (WHERE tr.status = 'Cancelled') AS cancelled_count
      FROM trips tr LEFT JOIN trucks t ON t.id = tr.truck_id
      WHERE (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id)
  - id: trips
    single: false
    permission: trips.read
    query: |
      SELECT tr.*, t.plate AS truck_plate, d.name AS driver_name
      FROM trips tr
      LEFT JOIN trucks t ON t.id = tr.truck_id
      LEFT JOIN drivers d ON d.id = tr.driver_id
      WHERE (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id)
        AND (:status IS NULL OR tr.status = :status)
        AND (NULLIF(:unassigned, '') IS NULL OR (:unassigned = 'true' AND tr.truck_id IS NULL))
        AND (:q IS NULL OR tr.trip_number ILIKE '%' || :q || '%' OR tr.origin ILIKE '%' || :q || '%' OR tr.destination ILIKE '%' || :q || '%' OR t.plate ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%')
      ORDER BY tr.departure_time DESC
  - id: trip_truck_lookup
    single: false
    permission: trips.read
    query: "SELECT id AS value, plate || ' - ' || model AS label FROM trucks WHERE (:view_scope = 'all' OR branch_id = :current_branch_id) UNION SELECT DISTINCT t.id AS value, t.plate || ' - ' || t.model AS label FROM trips tr JOIN trucks t ON t.id = tr.truck_id WHERE tr.truck_id IS NOT NULL AND (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id) ORDER BY label"
  - id: trip_branch_lookup
    single: false
    permission: trips.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
  - id: trip_driver_lookup
    single: false
    permission: trips.read
    query: "SELECT id AS value, name AS label FROM drivers WHERE status = 'Active' AND (:view_scope = 'all' OR assigned_truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id)) UNION SELECT DISTINCT d.id AS value, d.name AS label FROM trips tr JOIN trucks t ON t.id = tr.truck_id JOIN drivers d ON d.id = tr.driver_id WHERE tr.driver_id IS NOT NULL AND (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id) ORDER BY label"
  - id: trip_cargo_type_lookup
    single: false
    permission: trips.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'cargo_type' AND status = 'Active' UNION SELECT DISTINCT tr.cargo_type AS value, tr.cargo_type AS label FROM trips tr LEFT JOIN trucks t ON t.id = tr.truck_id WHERE tr.cargo_type IS NOT NULL AND tr.cargo_type <> '' AND (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - id: add_trip_btn
    label: '+ Tạo chuyến'
    variant: primary
    permission: trips.write
    action: add_trip

components:
  - type: ListToolbar
    source: trips
    filter_field: q
    search:
      label: Tìm kiếm chuyến
      placeholder: 'Tìm theo mã chuyến, điểm đi hoặc điểm đến...'
    actions: [{ id: trips.export, label: 'Xuất CSV', icon: download }]
  - type: StatusTabs
    source: trips
    filter_field: status
    variant: contained
    tabs:
      - { id: '', label: Tất cả }
      - { id: Scheduled, label: Đã lên lịch }
      - { id: 'In Transit', label: Đang vận chuyển }
      - { id: Completed, label: Hoàn thành }
      - { id: Cancelled, label: Đã hủy }
  - type: DataGrid
    source: trips
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state:
      title: Không có chuyến xe
      description: Thử thay đổi bộ lọc hoặc tạo chuyến mới.
    columns:
      - { field: trip_number, label: Mã chuyến, sortable: true }
      - { field: origin, label: Tuyến đường, type: PrimaryEntityCell, secondary: destination }
      - { field: truck_plate, label: Phương tiện, type: PrimaryEntityCell, secondary: driver_name }
      - field: status
        label: Trạng thái
        type: StatusChip
        colors:
          Scheduled: blue
          In Transit: amber
          Completed: green
          Cancelled: red
      - { field: departure_time, label: Khởi hành, type: DateCell }
      - { field: arrival_time, label: Dự kiến đến, type: DateCell }
      - { field: distance_km, label: Quãng đường (km), align: right }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - id: edit_trip
            label: Sửa
            variant: ghost
            permission: trips.write
          - id: start_trip
            label: Khởi hành
            variant: primary
            permission: trips.write
            show_if: "row.status === 'Scheduled'"
          - id: complete_trip
            label: Hoàn thành
            variant: primary
            permission: trips.write
            show_if: "row.status === 'In Transit'"
          - id: cancel_trip
            label: Hủy
            variant: danger
            permission: trips.write
            show_if: "['Scheduled', 'In Transit'].includes(row.status)"

actions:
  - id: add_trip
    type: form
    permission: trips.write
    title: Tạo chuyến
    table: trips
    operation: insert
    prefill: null
    refresh: [trips, trips_stats]
    fields:
      - field: trip_number
        label: Mã chuyến
        type: text
        required: false
      - field: origin
        label: Điểm đi
        type: text
        required: true
      - field: destination
        label: Điểm đến
        type: text
        required: true
      - field: branch_id
        label: Chi nhánh
        type: select
        options_source: trip_branch_lookup
        required: false
      - field: truck_id
        label: Phương tiện
        type: select
        options_source: trip_truck_lookup
        required: false
      - field: driver_id
        label: Tài xế
        type: select
        options_source: trip_driver_lookup
        required: false
      - field: departure_time
        label: Thời gian khởi hành
        type: datetime
        required: false
      - field: arrival_time
        label: Thời gian dự kiến đến
        type: datetime
        required: false
      - field: distance_km
        label: Quãng đường (km)
        type: number
        required: false
      - field: cargo_type
        label: Loại hàng
        type: select
        options_source: trip_cargo_type_lookup
        required: false
      - field: cargo_weight
        label: Khối lượng hàng (kg)
        type: number
        required: false
      - field: notes
        label: Ghi chú
        type: textarea
        required: false

  - id: edit_trip
    type: form
    permission: trips.write
    title: Cập nhật chuyến
    table: trips
    operation: update
    prefill: row
    refresh: [trips, trips_stats]
    fields:
      - field: trip_number
        label: Mã chuyến
        type: text
        required: false
      - field: origin
        label: Điểm đi
        type: text
        required: true
      - field: destination
        label: Điểm đến
        type: text
        required: true
      - field: branch_id
        label: Chi nhánh
        type: select
        options_source: trip_branch_lookup
        required: false
      - field: truck_id
        label: Phương tiện
        type: select
        options_source: trip_truck_lookup
        required: false
      - field: driver_id
        label: Tài xế
        type: select
        options_source: trip_driver_lookup
        required: false
      - field: departure_time
        label: Thời gian khởi hành
        type: datetime
        required: false
      - field: arrival_time
        label: Thời gian dự kiến đến
        type: datetime
        required: false
      - field: distance_km
        label: Quãng đường (km)
        type: number
        required: false
      - field: cargo_type
        label: Loại hàng
        type: select
        options_source: trip_cargo_type_lookup
        required: false
      - field: cargo_weight
        label: Khối lượng hàng (kg)
        type: number
        required: false
      - field: notes
        label: Ghi chú
        type: textarea
        required: false

  - id: cancel_trip
    type: server
    permission: trips.write
    action: trips.cancel
    confirm: "Hủy chuyến {{row.trip_number}}?"
    params: { id: '{row.id}' }
    refresh: [trips, trips_stats]
  - id: start_trip
    type: server
    permission: trips.write
    action: trips.start
    confirm: "Xác nhận khởi hành chuyến {{row.trip_number}}?"
    params: { id: '{row.id}' }
    refresh: [trips, trips_stats]
  - id: complete_trip
    type: server
    permission: trips.write
    action: trips.complete
    confirm: "Xác nhận hoàn thành chuyến {{row.trip_number}}?"
    params: { id: '{row.id}' }
    refresh: [trips, trips_stats]
