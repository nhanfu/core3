title: Lịch điều

page:
  id: trips
  auth:
    require: [trips.read]

datasources:
  - id: trips_stats
    single: true
    permission: trips.read
    query: |
      SELECT COUNT(*) FILTER (WHERE status = 'Scheduled') AS scheduled_count,
        COUNT(*) FILTER (WHERE status = 'In Transit') AS in_transit_count,
        COUNT(*) FILTER (WHERE status = 'Completed' AND DATE(arrival_time) = CURRENT_DATE) AS completed_today,
        COUNT(*) FILTER (WHERE status = 'Cancelled') AS cancelled_count
      FROM trips
  - id: trips
    single: false
    permission: trips.read
    query: |
      SELECT tr.*, t.plate AS truck_plate, d.name AS driver_name
      FROM trips tr
      LEFT JOIN trucks t ON t.id = tr.truck_id
      LEFT JOIN drivers d ON d.id = tr.driver_id
      WHERE (:status IS NULL OR tr.status = :status)
        AND (:q IS NULL OR tr.trip_number ILIKE '%' || :q || '%' OR tr.origin ILIKE '%' || :q || '%' OR tr.destination ILIKE '%' || :q || '%' OR t.plate ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%')
      ORDER BY tr.departure_time DESC

toolbar:
  - id: add_trip_btn
    label: '+ Tạo chuyến'
    variant: primary
    permission: trips.write
    action: add_trip

components:
  - type: ListToolbar
    source: trips
    filter_field: q
    search:
      label: Tìm kiếm chuyến
      placeholder: 'Tìm theo mã chuyến, điểm đi hoặc điểm đến...'
    actions: [{ id: trips.export, label: 'Xuất CSV', icon: '↓' }]
  - type: StatusTabs
    source: trips
    filter_field: status
    tabs:
      - { id: '', label: Tất cả }
      - { id: Scheduled, label: Đã lên lịch }
      - { id: 'In Transit', label: Đang vận chuyển }
      - { id: Completed, label: Hoàn thành }
      - { id: Cancelled, label: Đã hủy }
  - type: DataGrid
    source: trips
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state:
      title: Không có chuyến xe
      description: Thử thay đổi bộ lọc hoặc tạo chuyến mới.
    columns:
      - { field: trip_number, label: Mã chuyến, sortable: true }
      - { field: origin, label: Tuyến đường, type: PrimaryEntityCell, secondary: destination }
      - { field: truck_plate, label: Phương tiện, type: PrimaryEntityCell, secondary: driver_name }
      - field: status
        label: Trạng thái
        type: StatusChip
        colors:
          Scheduled: blue
          In Transit: amber
          Completed: green
          Cancelled: red
      - { field: departure_time, label: Khởi hành, type: DateCell }
      - { field: arrival_time, label: Dự kiến đến, type: DateCell }
      - { field: distance_km, label: Quãng đường (km), align: right }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - id: edit_trip
            label: Sửa
            variant: ghost
          - id: cancel_trip
            label: Hủy
            variant: danger

actions:
  - id: add_trip
    type: form
    title: Schedule Trip
    table: trips
    operation: insert
    prefill: null
    refresh: [trips, trips_stats]
    fields:
      - field: trip_number
        label: Trip #
        type: text
        required: false
      - field: origin
        label: Origin
        type: text
        required: true
      - field: destination
        label: Destination
        type: text
        required: true
      - field: truck_id
        label: Truck ID
        type: text
        required: false
      - field: driver_id
        label: Driver ID
        type: text
        required: false
      - field: departure_time
        label: Departure Time
        type: date
        required: false
      - field: arrival_time
        label: Arrival Time
        type: date
        required: false
      - field: distance_km
        label: Distance (km)
        type: number
        required: false
      - field: cargo_type
        label: Cargo Type
        type: text
        required: false
      - field: cargo_weight
        label: Cargo Weight (kg)
        type: number
        required: false
      - field: notes
        label: Notes
        type: textarea
        required: false

  - id: edit_trip
    type: form
    title: Edit Trip
    table: trips
    operation: update
    prefill: row
    refresh: [trips, trips_stats]
    fields:
      - field: trip_number
        label: Trip #
        type: text
        required: false
      - field: origin
        label: Origin
        type: text
        required: true
      - field: destination
        label: Destination
        type: text
        required: true
      - field: truck_id
        label: Truck ID
        type: text
        required: false
      - field: driver_id
        label: Driver ID
        type: text
        required: false
      - field: status
        label: Status
        type: select
        required: false
        options: [Scheduled, In Transit, Completed, Cancelled]
        default: Scheduled
      - field: departure_time
        label: Departure Time
        type: date
        required: false
      - field: arrival_time
        label: Arrival Time
        type: date
        required: false
      - field: distance_km
        label: Distance (km)
        type: number
        required: false
      - field: cargo_type
        label: Cargo Type
        type: text
        required: false
      - field: cargo_weight
        label: Cargo Weight (kg)
        type: number
        required: false
      - field: notes
        label: Notes
        type: textarea
        required: false

  - id: cancel_trip
    type: server
    action: trips.cancel
    confirm: "Cancel this trip?"
    params: { id: '{row.id}' }
    refresh: [trips, trips_stats]
