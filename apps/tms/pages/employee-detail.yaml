title: Chi tiết nhân viên
page: { id: employee-detail, auth: { require: [hr.read] } }
datasources:
  - id: employee_detail
    single: true
    permission: hr.read
    query: |
      SELECT e.id, e.code, e.name, e.job_title, e.phone, e.email, e.department,
        CAST(e.start_date AS VARCHAR) AS start_date, e.dependents, e.status,
        CASE e.status WHEN 'OnLeave' THEN 'Nghỉ phép' WHEN 'Inactive' THEN 'Ngưng làm việc' ELSE 'Đang làm việc' END AS status_label
      FROM employees e WHERE e.id = :id
  - id: employee_contracts
    single: false
    permission: hr.read
    query: |
      SELECT c.id, c.code, c.contract_type, CAST(c.start_date AS VARCHAR) AS start_date,
        CAST(c.end_date AS VARCHAR) AS end_date, c.base_salary, c.status
      FROM employment_contracts c WHERE c.employee_id = :id ORDER BY c.start_date DESC
  - id: employee_activity
    single: false
    permission: hr.read
    query: |
      SELECT actor_name, action, detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity WHERE resource = 'employees' AND resource_id = :id
      ORDER BY created_at DESC
  - id: employee_documents
    single: false
    permission: hr.read
    query: "SELECT id, employee_id, file_name, mime_type, size_bytes, CAST(created_at AS VARCHAR) AS created_at FROM employee_documents WHERE employee_id = :id ORDER BY created_at DESC"
components:
  - { type: DocumentSummary, source: employee_detail, title_field: name, subtitle_field: code, status_field: status_label, status_colors: { Đang làm việc: green, Nghỉ phép: amber, Ngưng làm việc: red }, columns: [{ field: job_title, label: Chức danh }, { field: department, label: Phòng ban }, { field: phone, label: Điện thoại }, { field: email, label: Email }, { field: start_date, label: Ngày vào làm }, { field: dependents, label: Người phụ thuộc }] }
  - type: DataGrid
    source: employee_contracts
    page_size: 20
    row_key: id
    empty_state: { title: Chưa có hợp đồng }
    columns: [{ field: code, label: Hợp đồng }, { field: contract_type, label: Loại }, { field: start_date, label: Từ ngày }, { field: end_date, label: Đến ngày }, { field: base_salary, label: Lương cơ bản, align: right }, { field: status, label: Trạng thái }]
  - type: ApprovalTimeline
    source: employee_activity
    title: Lịch sử nhân viên
    actor_field: actor_name
    action_field: action
    detail_field: detail
    timestamp_field: created_at
  - type: DataGrid
    source: employee_documents
    page_size: 20
    row_key: id
    empty_state: { title: Chưa có tài liệu nhân sự }
    columns: [{ field: file_name, label: Tên tệp }, { field: mime_type, label: Loại }, { field: size_bytes, label: Dung lượng, align: right }, { field: created_at, label: Ngày tải lên }, { field: actions, label: '', sortable: false, actions: [{ id: download_employee_document, label: Tải xuống, variant: ghost }] }]
toolbar:
  - { id: back_employees, label: '← Danh sách nhân viên', variant: secondary, action: back_employees }
  - { id: edit_employee_detail, label: Sửa thông tin, variant: primary, permission: hr.write, action: edit_employee_detail }
  - { id: upload_employee_document, label: '+ Tải tài liệu', variant: secondary, permission: hr.write, action: upload_employee_document }
actions:
  - { id: back_employees, type: navigate, navigate_to: /hr/employees }
  - { id: upload_employee_document, type: upload, kind: employee_document, params: { employee_id: '{state.id}' }, refresh: [employee_documents, employee_activity] }
  - { id: download_employee_document, type: download, kind: employee_document }
  - id: edit_employee_detail
    type: form
    title: Cập nhật nhân viên
    table: employees
    operation: update
    prefill: source
    prefill_source: employee_detail
    refresh: [employee_detail, employee_activity]
    fields: [{ field: code, label: Mã nhân viên, type: text, required: true }, { field: name, label: Họ tên, type: text, required: true }, { field: job_title, label: Chức danh, type: text }, { field: phone, label: Số điện thoại, type: text }, { field: email, label: Email, type: text }, { field: department, label: Phòng ban, type: text }, { field: start_date, label: Ngày vào làm, type: date }, { field: dependents, label: Người phụ thuộc, type: number }, { field: status, label: Trạng thái, type: select, options: [Active, OnLeave, Inactive] }]
