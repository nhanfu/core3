title: Quản lý dung lượng
page: { id: system-storage, breadcrumb: [Hệ thống, Quản lý dung lượng], auth: { require: [system.read] } }
datasources:
  - id: storage_usage
    single: true
    permission: system.read
    query: |
      SELECT
        (SELECT COUNT(*) FROM chat_attachments a JOIN chat_messages m ON m.id = a.message_id JOIN chat_participants cp ON cp.thread_id = m.thread_id WHERE (:view_scope = 'all' OR cp.user_id = :current_user_id)) +
        (SELECT COUNT(*) FROM employee_documents ed JOIN employees e ON e.id = ed.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)) +
        (SELECT COUNT(*) FROM contract_documents cd JOIN employment_contracts c ON c.id = cd.contract_id JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)) +
        (SELECT COUNT(*) FROM company_documents) AS file_count,
        (SELECT COALESCE(SUM(a.size_bytes), 0) FROM chat_attachments a JOIN chat_messages m ON m.id = a.message_id JOIN chat_participants cp ON cp.thread_id = m.thread_id WHERE (:view_scope = 'all' OR cp.user_id = :current_user_id)) +
        (SELECT COALESCE(SUM(ed.size_bytes), 0) FROM employee_documents ed JOIN employees e ON e.id = ed.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)) +
        (SELECT COALESCE(SUM(cd.size_bytes), 0) FROM contract_documents cd JOIN employment_contracts c ON c.id = cd.contract_id JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)) +
        (SELECT COALESCE(SUM(size_bytes), 0) FROM company_documents) AS used_bytes,
        (SELECT config_value FROM system_configs WHERE kind = 'storage' AND code = 'LOCAL' LIMIT 1) AS storage_root
  - { id: storage_configs, single: false, permission: system.read, query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'storage' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code" }
toolbar: [{ id: add_storage_config, label: '+ Thêm cấu hình kho', variant: primary, permission: system.write, action: add_storage_config }]
components:
  - { type: StatRow, source: storage_usage, stats: [{ label: Số tệp, field: file_count, color: blue }, { label: Dung lượng đã dùng (bytes), field: used_bytes, color: indigo }, { label: Thư mục lưu trữ, field: storage_root, color: blue }] }
  - { type: ListToolbar, source: storage_configs, filter_field: q, search: { label: Tìm cấu hình kho, placeholder: 'Tìm mã hoặc tên...' }, actions: [{ id: storage_configs.export, label: 'Xuất CSV', icon: download }] }
  - { type: StatusTabs, source: storage_configs, filter_field: status, tabs: [{ id: '', label: Tất cả }, { id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }
  - type: DataGrid
    source: storage_configs
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có cấu hình kho }
    columns: [{ field: code, label: Mã }, { field: name, label: Cấu hình kho, type: PrimaryEntityCell, secondary: description }, { field: config_value, label: Giá trị }, { field: status, label: Trạng thái, type: StatusChip, colors: { Active: green, Inactive: red } }, { field: actions, label: '', sortable: false, actions: [{ id: edit_storage_config, label: Sửa, variant: ghost, permission: system.write }, { id: delete_storage_config, label: Xóa, variant: danger, permission: system.write }] }]
actions:
  - { id: add_storage_config, type: form, permission: system.write, title: Thêm cấu hình kho, table: system_configs, scope: storage, operation: insert, refresh: [storage_configs], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Giá trị, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }], default: Active }] }
  - { id: edit_storage_config, type: form, permission: system.write, title: Cập nhật cấu hình kho, table: system_configs, scope: storage, operation: update, prefill: row, refresh: [storage_configs], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Giá trị, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }] }
  - { id: delete_storage_config, type: delete, permission: system.write, table: system_configs, scope: storage, confirm: 'Xóa cấu hình {{row.name}}?', refresh: [storage_configs] }
