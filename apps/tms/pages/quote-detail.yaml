title: Chi tiết báo giá
page: { id: quote-detail, auth: { require: [crm.read] } }

datasources:
  - id: quote_detail
    single: true
    permission: crm.read
    query: |
      SELECT q.id, q.code, q.customer_name, q.title, q.status,
        CASE q.status WHEN 'Draft' THEN 'Nháp' WHEN 'Sent' THEN 'Đã gửi'
          WHEN 'Accepted' THEN 'Đã chấp nhận'
          WHEN 'Cancelled' THEN 'Đã hủy' ELSE q.status END AS status_label,
        CAST(q.valid_until AS VARCHAR) AS valid_until,
        printf('%,.0f ₫', COALESCE(q.amount, 0)) AS amount_display,
        printf('%,.0f ₫', COALESCE(q.cost_amount, 0)) AS cost_amount_display,
        printf('%,.0f ₫', COALESCE(q.profit_amount, 0)) AS profit_amount_display,
        CASE WHEN COALESCE(q.amount, 0) = 0 THEN '0.00%'
          ELSE printf('%.2f%%', q.profit_amount * 100.0 / q.amount) END AS margin_display
      FROM quotes q
      WHERE q.id = :id
  - id: quote_detail_lines
    single: false
    permission: crm.read
    query: |
      SELECT l.id, l.quote_id AS document_id, l.sequence, l.description,
        CAST(l.quantity AS DOUBLE) AS quantity, l.unit,
        CAST(l.unit_price AS DOUBLE) AS unit_price,
        CAST(l.cost_price AS DOUBLE) AS cost_price,
        CAST(l.tax_rate AS DOUBLE) AS tax_rate,
        CAST(l.line_total AS DOUBLE) AS line_total,
        CAST(l.cost_total AS DOUBLE) AS cost_total,
        printf('%,.3f', l.quantity) AS quantity_display,
        printf('%,.0f ₫', l.unit_price) AS unit_price_display,
        printf('%,.0f ₫', l.cost_price) AS cost_price_display,
        printf('%.2f%%', l.tax_rate) AS tax_rate_display,
        printf('%,.0f ₫', l.line_total) AS line_total_display,
        printf('%,.0f ₫', l.line_total - l.cost_total) AS profit_display,
        q.status AS parent_status
      FROM quote_lines l
      JOIN quotes q ON q.id = l.quote_id
      WHERE l.quote_id = :id
      ORDER BY l.sequence
  - id: quote_detail_timeline
    single: false
    permission: crm.read
    query: |
      SELECT actor_name, action,
        CASE action
          WHEN 'quotes.send' THEN 'Đã gửi'
          WHEN 'quotes.accept' THEN 'Đã chấp nhận'
          WHEN 'quotes.revise' THEN 'Trả về nháp'
          WHEN 'quotes.cancel' THEN 'Đã hủy'
          WHEN 'quotes.lines.create' THEN 'Thêm dòng báo giá'
          WHEN 'quotes.lines.update' THEN 'Cập nhật dòng báo giá'
          WHEN 'quotes.lines.delete' THEN 'Xóa dòng báo giá'
          ELSE action END AS action_label,
        detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity
      WHERE resource = 'quotes' AND resource_id = :id
      UNION ALL
      SELECT 'Hệ thống', 'created', 'Đã tạo', 'Khởi tạo báo giá',
        CAST(created_at AS VARCHAR)
      FROM quotes WHERE id = :id
      ORDER BY created_at DESC
  - id: quote_unit_lookup
    single: false
    permission: crm.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'unit' AND status = 'Active' UNION SELECT DISTINCT unit AS value, unit AS label FROM quote_lines WHERE unit IS NOT NULL AND unit <> '' ORDER BY label"

toolbar:
  - { id: back_quotes_btn, label: '← Danh sách báo giá', variant: secondary, action: back_quotes }

components:
  - type: DocumentSummary
    source: quote_detail
    title_field: code
    subtitle_field: title
    status_field: status_label
    status_colors: { Nháp: neutral, Đã gửi: blue, Đã chấp nhận: green, Đã hủy: red }
    columns:
      - { field: customer_name, label: Khách hàng }
      - { field: valid_until, label: Hiệu lực đến }
      - { field: margin_display, label: Biên lợi nhuận }
  - type: LineItemGrid
    source: quote_detail_lines
    title: Chi tiết mua / bán
    description: Doanh thu, giá vốn và lợi nhuận được tính từ từng dòng.
    page_size: 50
    row_key: id
    actions:
      - { id: add_quote_line, label: '+ Thêm dòng', variant: primary, permission: crm.write, show_if: "state.quote_detail.status === 'Draft'" }
    empty_state: { title: Chưa có dòng báo giá }
    columns:
      - { field: sequence, label: STT, align: right }
      - { field: description, label: Nội dung }
      - { field: quantity_display, label: Số lượng, align: right }
      - { field: unit, label: Đơn vị }
      - { field: unit_price_display, label: Giá bán, align: right }
      - { field: cost_price_display, label: Giá vốn, align: right }
      - { field: tax_rate_display, label: Thuế, align: right }
      - { field: line_total_display, label: Thành tiền, align: right }
      - { field: profit_display, label: Lợi nhuận, align: right }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_quote_line, label: Sửa, variant: ghost, show_if: "row.parent_status === 'Draft' && user.permissions.includes('crm.write')" }
          - { id: delete_quote_line, label: Xóa, variant: danger, show_if: "row.parent_status === 'Draft' && user.permissions.includes('crm.write')" }
  - type: MoneySummary
    source: quote_detail
    title: Hiệu quả báo giá
    stats:
      - { label: Doanh thu, field: amount_display, color: blue }
      - { label: Giá vốn, field: cost_amount_display, color: amber }
      - { label: Lợi nhuận, field: profit_amount_display, color: green }
      - { label: Biên lợi nhuận, field: margin_display, color: indigo }
  - type: ApprovalTimeline
    source: quote_detail_timeline
    title: Lịch sử báo giá
    actor_field: actor_name
    action_field: action_label
    detail_field: detail
    timestamp_field: created_at

actions:
  - { id: back_quotes, type: navigate, navigate_to: /quotes }
  - id: add_quote_line
    type: server_form
    title: Thêm dòng báo giá
    action: quotes.lines.create
    params: { id: '{state.id}' }
    refresh: [quote_detail_lines, quote_detail, quote_detail_timeline]
    fields:
      - { field: description, label: Nội dung, type: text, required: true }
      - { field: quantity, label: Số lượng, type: number, default: 1, required: true }
      - { field: unit, label: Đơn vị, type: select, options_source: quote_unit_lookup, default: Chuyến, required: true }
      - { field: unit_price, label: Giá bán, type: number, default: 0, required: true }
      - { field: cost_price, label: Giá vốn, type: number, default: 0, required: true }
      - { field: tax_rate, label: Thuế suất (%), type: number, default: 0, required: true }
  - id: edit_quote_line
    type: server_form
    title: Cập nhật dòng báo giá
    action: quotes.lines.update
    prefill: row
    params: { id: '{state.id}', line_id: '{row.id}' }
    refresh: [quote_detail_lines, quote_detail, quote_detail_timeline]
    fields:
      - { field: description, label: Nội dung, type: text, required: true }
      - { field: quantity, label: Số lượng, type: number, required: true }
      - { field: unit, label: Đơn vị, type: select, options_source: quote_unit_lookup, required: true }
      - { field: unit_price, label: Giá bán, type: number, required: true }
      - { field: cost_price, label: Giá vốn, type: number, required: true }
      - { field: tax_rate, label: Thuế suất (%), type: number, required: true }
  - id: delete_quote_line
    type: server
    action: quotes.lines.delete
    confirm: 'Xóa dòng báo giá {{row.description}}?'
    params: { id: '{state.id}', line_id: '{row.id}' }
    refresh: [quote_detail_lines, quote_detail, quote_detail_timeline]
