title: Quote details
page: { id: quote-detail, breadcrumb: [Business, Quote, Detail], auth: { require: [crm.read] } }

datasources:
  - id: quote_detail
    single: true
    permission: crm.read
    query: |
      SELECT q.id, q.code, q.customer_name, q.title, q.status,
        CASE q.status WHEN 'Draft' THEN 'Nháp' WHEN 'Sent' THEN 'Đã gửi'
          WHEN 'Accepted' THEN 'Đã chấp nhận'
          WHEN 'Cancelled' THEN 'Đã hủy' ELSE q.status END AS status_label,
        CAST(q.valid_until AS VARCHAR) AS valid_until,
        printf('%,.0f ₫', COALESCE(q.amount, 0)) AS amount_display,
        printf('%,.0f ₫', COALESCE(q.cost_amount, 0)) AS cost_amount_display,
        printf('%,.0f ₫', COALESCE(q.profit_amount, 0)) AS profit_amount_display,
        CASE WHEN COALESCE(q.amount, 0) = 0 THEN '0.00%'
          ELSE printf('%.2f%%', q.profit_amount * 100.0 / q.amount) END AS margin_display
      FROM quotes q
      WHERE q.id = :id AND (:view_scope = 'all' OR q.branch_id = :current_branch_id)
  - id: quote_detail_lines
    single: false
    permission: crm.read
    query: |
      SELECT l.id, l.quote_id AS document_id, l.sequence, l.description,
        CAST(l.quantity AS DOUBLE) AS quantity, l.unit,
        CAST(l.unit_price AS DOUBLE) AS unit_price,
        CAST(l.cost_price AS DOUBLE) AS cost_price,
        CAST(l.tax_rate AS DOUBLE) AS tax_rate,
        CAST(l.line_total AS DOUBLE) AS line_total,
        CAST(l.cost_total AS DOUBLE) AS cost_total,
        printf('%,.3f', l.quantity) AS quantity_display,
        printf('%,.0f ₫', l.unit_price) AS unit_price_display,
        printf('%,.0f ₫', l.cost_price) AS cost_price_display,
        printf('%.2f%%', l.tax_rate) AS tax_rate_display,
        printf('%,.0f ₫', l.line_total) AS line_total_display,
        printf('%,.0f ₫', l.line_total - l.cost_total) AS profit_display,
        q.status AS parent_status
      FROM quote_lines l
      JOIN quotes q ON q.id = l.quote_id
      WHERE l.quote_id = :id AND (:view_scope = 'all' OR q.branch_id = :current_branch_id)
      ORDER BY l.sequence
  - id: quote_detail_timeline
    single: false
    permission: crm.read
    query: |
      SELECT actor_name, action,
        CASE action
          WHEN 'quotes.send' THEN 'Đã gửi'
          WHEN 'quotes.accept' THEN 'Đã chấp nhận'
          WHEN 'quotes.revise' THEN 'Trả về nháp'
          WHEN 'quotes.cancel' THEN 'Đã hủy'
          WHEN 'quotes.lines.create' THEN 'Thêm dòng báo giá'
          WHEN 'quotes.lines.update' THEN 'Cập nhật dòng báo giá'
          WHEN 'quotes.lines.delete' THEN 'Xóa dòng báo giá'
          ELSE action END AS action_label,
        detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity
      WHERE resource = 'quotes' AND resource_id = :id
        AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM quotes q WHERE q.id = :id AND q.branch_id = :current_branch_id))
      UNION ALL
      SELECT 'Hệ thống', 'created', 'Đã tạo', 'Khởi tạo báo giá',
        CAST(created_at AS VARCHAR)
      FROM quotes WHERE id = :id AND (:view_scope = 'all' OR branch_id = :current_branch_id)
      ORDER BY created_at DESC
  - id: quote_unit_lookup
    single: false
    permission: crm.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'unit' AND status = 'Active' UNION SELECT DISTINCT unit AS value, unit AS label FROM quote_lines WHERE unit IS NOT NULL AND unit <> '' ORDER BY label"

toolbar:
  - { id: back_quotes_btn, label: 'List of quotes', icon: arrow-left, variant: secondary, action: back_quotes }
  - { id: edit_quote_detail, label: Edit quote, variant: primary, permission: crm.write, show_if: "state.quote_detail.status === 'Draft'", action: edit_quote_detail }

components:
  - type: DocumentSummary
    source: quote_detail
    title_field: code
    subtitle_field: title
    status_field: status_label
    status_colors: { Nháp: neutral, Đã gửi: blue, Đã chấp nhận: green, Đã hủy: red }
    columns:
      - { field: customer_name, label: Client }
      - { field: valid_until, label: Effect arrives }
      - { field: margin_display, label: Profit margin }
  - type: LineItemGrid
    source: quote_detail_lines
    title: Buy/sell details
    description: Revenue, cost price and profit are calculated from each line.
    page_size: 50
    row_key: id
    actions:
      - { id: add_quote_line, label: '+ Add lines', variant: primary, permission: crm.write, show_if: "state.quote_detail.status === 'Draft'" }
    empty_state: { title: There are no quotes yet }
    columns:
      - { field: sequence, label: No, align: right }
      - { field: description, label: Content }
      - { field: quantity_display, label: Quantity, align: right }
      - { field: unit, label: Unit }
      - { field: unit_price_display, label: Selling price, align: right }
      - { field: cost_price_display, label: Capital price, align: right }
      - { field: tax_rate_display, label: Tax, align: right }
      - { field: line_total_display, label: Make money, align: right }
      - { field: profit_display, label: Profit, align: right }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_quote_line, label: Fix, variant: ghost, permission: crm.write, show_if: "row.parent_status === 'Draft'" }
          - { id: delete_quote_line, label: Erase, variant: danger, permission: crm.write, show_if: "row.parent_status === 'Draft'" }
  - type: MoneySummary
    source: quote_detail
    title: Quote efficiency
    stats:
      - { label: Revenue, field: amount_display, color: blue }
      - { label: Capital price, field: cost_amount_display, color: amber }
      - { label: Profit, field: profit_amount_display, color: green }
      - { label: Profit margin, field: margin_display, color: indigo }
  - type: ApprovalTimeline
    source: quote_detail_timeline
    title: Quote history
    empty_state: { title: There is no quote activity yet }
    actor_field: actor_name
    action_field: action_label
    detail_field: detail
    timestamp_field: created_at

actions:
  - { id: back_quotes, type: navigate, navigate_to: /quotes }
  - id: edit_quote_detail
    type: form
    permission: crm.write
    title: Update quote
    table: quotes
    operation: update
    prefill: source
    prefill_source: quote_detail
    refresh: [quote_detail, quote_detail_lines, quote_detail_timeline]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: customer_name, label: Client, type: select, options_source: quote_customer_lookup, required: true }
      - { field: title, label: Content, type: text, required: true }
      - { field: valid_until, label: Effect arrives, type: date }
  - id: add_quote_line
    type: server_form
    permission: crm.write
    title: Add a quote line
    action: quotes.lines.create
    handler: line_item
    operation: create
    domain: quote
    params: { id: '{state.id}' }
    refresh: [quote_detail_lines, quote_detail, quote_detail_timeline]
    fields:
      - { field: description, label: Content, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, default: 1, required: true }
      - { field: unit, label: Unit, type: select, options_source: quote_unit_lookup, default: Chuyến, required: true }
      - { field: unit_price, label: Selling price, type: money, currency: VND, default: 0, required: true }
      - { field: cost_price, label: Capital price, type: money, currency: VND, default: 0, required: true }
      - { field: tax_rate, label: Tax rate (%), type: number, default: 0, required: true }
  - id: edit_quote_line
    type: server_form
    permission: crm.write
    title: Update quote line
    action: quotes.lines.update
    handler: line_item
    operation: update
    domain: quote
    prefill: row
    params: { id: '{state.id}', line_id: '{row.id}' }
    refresh: [quote_detail_lines, quote_detail, quote_detail_timeline]
    fields:
      - { field: description, label: Content, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true }
      - { field: unit, label: Unit, type: select, options_source: quote_unit_lookup, required: true }
      - { field: unit_price, label: Selling price, type: money, currency: VND, required: true }
      - { field: cost_price, label: Capital price, type: money, currency: VND, required: true }
      - { field: tax_rate, label: Tax rate (%), type: number, required: true }
  - id: delete_quote_line
    type: server
    permission: crm.write
    action: quotes.lines.delete
    handler: line_item
    operation: delete
    domain: quote
    confirm: 'Remove quote line {{row.description}}?'
    params: { id: '{state.id}', line_id: '{row.id}' }
    refresh: [quote_detail_lines, quote_detail, quote_detail_timeline]
