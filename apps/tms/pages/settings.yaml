title: Cài đặt

page:
  id: settings
  auth:
    require: [settings.read]

datasources:
  - id: branches
    single: false
    permission: settings.read
    query: |
      SELECT b.*, COUNT(t.id) AS truck_count
      FROM branches b LEFT JOIN trucks t ON t.branch_id = b.id
      GROUP BY b.id, b.name, b.city, b.region, b.status, b.created_at, b.updated_at
      ORDER BY b.name
  - id: users
    single: false
    permission: settings.read
    query: |
      SELECT u.id, u.email, u.name, u.avatar_url, u.preferred_lang, u.created_at,
        string_agg(r.name, ',') AS roles_csv
      FROM users u
      LEFT JOIN user_roles ur ON ur.user_id = u.id
      LEFT JOIN roles r ON r.id = ur.role_id
      GROUP BY u.id, u.email, u.name, u.avatar_url, u.preferred_lang, u.created_at
      ORDER BY u.name
  - id: roles
    single: false
    permission: settings.read
    query: |
      SELECT r.id, r.name, r.description, r.view_scope, COUNT(p.id) AS permission_count
      FROM roles r LEFT JOIN permissions p ON p.role_id = r.id
      GROUP BY r.id, r.name, r.description, r.view_scope
      ORDER BY r.name
  - id: settings_role_lookup
    single: false
    permission: settings.read
    query: "SELECT name AS value, name AS label FROM roles ORDER BY name"
  - id: translations
    single: false
    permission: settings.read
    query: |
      SELECT * FROM translations
      WHERE (:lang IS NULL OR lang = :lang)
        AND (:page_filter IS NULL OR page = :page_filter)
        AND (:q IS NULL OR text ILIKE '%' || :q || '%' OR translated ILIKE '%' || :q || '%')
      ORDER BY page, component, text

toolbar:
  - id: add_branch_btn
    label: "+ Thêm chi nhánh"
    variant: secondary
    permission: settings.write
    action: add_branch
  - id: add_user_btn
    label: "+ Mời người dùng"
    variant: primary
    permission: settings.write
    action: add_user

filters:
  source: translations
  all_label: Tất cả
  clear_label: Xóa bộ lọc
  fields:
    - field: lang
      label: Ngôn ngữ
      type: select
      options: [{ id: en, label: English }, { id: vi, label: Tiếng Việt }]
    - field: page_filter
      label: Trang
      type: select
      options: [{ id: '*', label: Tất cả trang }, { id: fleet, label: Đội xe }, { id: drivers, label: Tài xế }, { id: trips, label: Chuyến }, { id: maintenance, label: Bảo dưỡng }, { id: reports, label: Báo cáo }, { id: settings, label: Cài đặt }]
    - field: q
      label: Tìm kiếm
      type: search
      placeholder: "Từ khóa hoặc nội dung..."

components:
  - type: TabGroup
    tabs:
      - id: branches-tab
        label: Chi nhánh
        permission: settings.read
        components:
          - type: GridView
            source: branches
            page_size: 20
            empty_state: { title: Không có chi nhánh }
            columns:
              - type: TextCell
                field: name
                label: Tên
              - type: TextCell
                field: city
                label: Thành phố
                secondary: region
              - type: BadgeCell
                field: status
                label: Trạng thái
                colors:
                  Active: green
                  Inactive: red
              - type: NumberCell
                field: truck_count
                label: Phương tiện
                format: "#,###"
              - type: ActionCell
                label: ""
                actions:
                  - id: edit_branch
                    label: Sửa
                    variant: ghost
                    permission: settings.write
                  - id: delete_branch
                    label: Xóa
                    variant: danger
                    permission: settings.write

      - id: users-tab
        label: Người dùng
        permission: settings.read
        components:
          - type: GridView
            source: users
            page_size: 20
            empty_state: { title: Không có người dùng }
            columns:
              - type: TextCell
                field: name
                label: Tên
              - type: TextCell
                field: email
                label: Email
              - type: TextCell
                field: roles_csv
                label: Vai trò
              - type: TextCell
                field: preferred_lang
                label: Ngôn ngữ
              - type: ActionCell
                label: ""
                actions:
                  - id: edit_user
                    label: Sửa
                    variant: ghost
                    permission: settings.write

      - id: roles-tab
        label: Vai trò
        permission: settings.read
        components:
          - type: GridView
            source: roles
            page_size: 20
            empty_state: { title: Không có vai trò }
            columns:
              - type: TextCell
                field: name
                label: Vai trò
              - type: TextCell
                field: description
                label: Mô tả
              - type: NumberCell
                field: permission_count
                label: Quyền
                format: "#,###"

      - id: translations-tab
        label: Bản dịch
        permission: settings.write
        components:
          - type: GridView
            source: translations
            page_size: 15
            empty_state: { title: Không có bản dịch }
            columns:
              - type: TextCell
                field: lang
                label: Ngôn ngữ
              - type: TextCell
                field: page
                label: Trang
              - type: TextCell
                field: component
                label: Thành phần
              - type: TextCell
                field: text
                label: Khóa
              - type: TextCell
                field: translated
                label: Bản dịch
              - type: ActionCell
                label: ""
                actions:
                  - id: edit_translation
                    label: Sửa
                    variant: ghost
                    permission: settings.write

actions:
  - id: add_branch
    type: form
    permission: settings.write
    title: Thêm chi nhánh
    table: branches
    operation: insert
    prefill: null
    refresh: [branches]
    fields:
      - field: name
        label: Tên
        type: text
        required: true
      - field: city
        label: Thành phố
        type: text
        required: true
      - field: region
        label: Khu vực
        type: text
        required: false
      - field: status
        label: Trạng thái
        type: select
        required: false
        options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }]
        default: Active

  - id: edit_branch
    type: form
    permission: settings.write
    title: Cập nhật chi nhánh
    table: branches
    operation: update
    prefill: row
    refresh: [branches]
    fields:
      - field: name
        label: Tên
        type: text
        required: true
      - field: city
        label: Thành phố
        type: text
        required: true
      - field: region
        label: Khu vực
        type: text
        required: false
      - field: status
        label: Trạng thái
        type: select
        required: false
        options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }]
        default: Active

  - id: delete_branch
    type: delete
    permission: settings.write
    confirm: "Xóa chi nhánh {{row.name}}?"
    table: branches
    refresh: [branches]

  - id: add_user
    type: form
    permission: settings.write
    title: Mời người dùng
    table: users
    operation: insert
    prefill: null
    refresh: [users]
    fields:
      - field: name
        label: Tên
        type: text
        required: true
      - field: email
        label: Email
        type: text
        required: true
      - field: password
        label: Mật khẩu ban đầu
        type: text
        required: true
      - field: roles
        label: Vai trò
        type: multi-select
        options_source: settings_role_lookup
        search_placeholder: 'Tìm vai trò...'
        multiple: true
        required: false

  - id: edit_user
    type: form
    permission: settings.write
    title: Cập nhật người dùng
    table: users
    operation: update
    prefill: row
    refresh: [users]
    fields:
      - field: name
        label: Tên
        type: text
        required: false
      - field: email
        label: Email
        type: text
        required: false
      - field: roles
        label: Vai trò
        type: multi-select
        options_source: settings_role_lookup
        search_placeholder: 'Tìm vai trò...'
        multiple: true
        required: false

  - id: edit_translation
    type: form
    permission: settings.write
    title: Cập nhật bản dịch
    table: translations
    operation: update
    prefill: row
    refresh: [translations]
    fields:
      - field: translated
        label: Nội dung bản dịch
        type: textarea
        required: true
