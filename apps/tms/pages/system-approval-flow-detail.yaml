title: Chi tiết quy trình duyệt
page: { id: system-approval-flow-detail, auth: { require: [system.read] } }
datasources:
  - id: approval_flow
    single: true
    permission: system.read
    query: "SELECT id, code, name, description, status FROM system_configs WHERE id = :id AND kind = 'approval_flow'"
  - id: approval_steps
    single: false
    permission: system.read
    query: "SELECT id, flow_id, sequence, name, approver_role, printf('%,.0f ₫', min_amount) AS min_amount_display, min_amount, status FROM approval_flow_steps WHERE flow_id = :id ORDER BY sequence, id"
components:
  - { type: DocumentSummary, source: approval_flow, title_field: name, subtitle_field: code, status_field: status, columns: [{ field: description, label: Mô tả }] }
  - type: DataGrid
    source: approval_steps
    page_size: 50
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có bước duyệt, description: Thêm bước đầu tiên cho quy trình. }
    columns:
      - { field: sequence, label: Thứ tự, align: right }
      - { field: name, label: Bước duyệt }
      - { field: approver_role, label: Vai trò duyệt }
      - { field: min_amount_display, label: Từ mức tiền, align: right }
      - { field: status, label: Trạng thái }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: move_step_up, label: Lên, variant: ghost, show_if: "user.permissions.includes('system.write')" }
          - { id: move_step_down, label: Xuống, variant: ghost, show_if: "user.permissions.includes('system.write')" }
          - { id: edit_step, label: Sửa, variant: ghost, show_if: "user.permissions.includes('system.write')" }
          - { id: delete_step, label: Xóa, variant: danger, show_if: "user.permissions.includes('system.write')" }
toolbar:
  - { id: back_approval_flows, label: '← Danh sách quy trình', variant: secondary, action: back_approval_flows }
  - { id: add_step, label: '+ Thêm bước', variant: primary, permission: system.write, action: add_step }
actions:
  - { id: back_approval_flows, type: navigate, navigate_to: /system/approval-flows }
  - id: add_step
    type: server_form
    title: Thêm bước duyệt
    action: system.approval_steps.create
    params: { id: '{state.id}' }
    refresh: [approval_steps]
    fields: [{ field: name, label: Tên bước, type: text, required: true }, { field: approver_role, label: Vai trò duyệt, type: text, required: true }, { field: min_amount, label: Từ mức tiền, type: number, default: 0 }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }]
  - id: edit_step
    type: server_form
    title: Cập nhật bước duyệt
    action: system.approval_steps.update
    params: { id: '{state.id}', step_id: '{row.id}' }
    refresh: [approval_steps]
    fields: [{ field: name, label: Tên bước, type: text, required: true }, { field: approver_role, label: Vai trò duyệt, type: text, required: true }, { field: min_amount, label: Từ mức tiền, type: number, required: true }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }]
  - { id: delete_step, type: server, action: system.approval_steps.delete, confirm: 'Xóa bước duyệt này?', refresh: [approval_steps], params: { id: '{state.id}', step_id: '{row.id}' } }
  - { id: move_step_up, type: server, action: system.approval_steps.move_up, refresh: [approval_steps], params: { id: '{state.id}', step_id: '{row.id}' } }
  - { id: move_step_down, type: server, action: system.approval_steps.move_down, refresh: [approval_steps], params: { id: '{state.id}', step_id: '{row.id}' } }
