title: Đối tượng
scope: { label: 'Phạm vi xem', value: 'Toàn công ty' }

page:
  id: partners
  breadcrumb: [Kinh doanh, Đối tượng]
  auth:
    require: [crm.read]

datasources:
  - id: partners
    single: false
    permission: crm.read
    query: |
      SELECT p.id, REPLACE(UPPER(p.id), 'PARTNER-', 'DT') AS system_code, p.code, p.name, p.tax_code, p.phone, p.email,
        p.partner_type, p.owner_name, p.visibility, p.status,
        CASE p.partner_type
          WHEN 'Carrier' THEN 'Nhà xe'
          WHEN 'Supplier' THEN 'Nhà cung cấp'
          WHEN 'ShippingLine' THEN 'Hãng tàu'
          WHEN 'Warehouse' THEN 'Kho / bãi'
          WHEN 'Depot' THEN 'Depot'
          ELSE 'Khác'
        END AS partner_type_label,
        CASE p.visibility WHEN 'Private' THEN 'Riêng' ELSE 'Công khai' END AS visibility_label,
        CASE p.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label,
        p.created_at
      FROM partners p
      WHERE (NULLIF(:partner_type, '') IS NULL OR p.partner_type = :partner_type)
        AND (NULLIF(:visibility, '') IS NULL OR p.visibility = :visibility)
        AND (NULLIF(:status, '') IS NULL OR p.status = :status)
        AND (:view_scope = 'all'
          OR (:view_scope = 'branch' AND (p.visibility = 'Public' OR p.owner_name = :current_user_name))
          OR (:view_scope = 'own' AND p.owner_name = :current_user_name))
        AND (:q IS NULL OR p.code ILIKE '%' || :q || '%'
          OR p.name ILIKE '%' || :q || '%'
          OR p.tax_code ILIKE '%' || :q || '%'
          OR p.phone ILIKE '%' || :q || '%')
      ORDER BY p.created_at DESC, p.name
  - id: partner_owner_lookup
    single: false
    permission: crm.read
    query: "SELECT e.name AS value, e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.status = 'Active' AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) UNION SELECT DISTINCT owner_name AS value, owner_name AS label FROM partners WHERE owner_name IS NOT NULL AND owner_name <> '' AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)) OR (:view_scope = 'own' AND owner_name = :current_user_name)) ORDER BY label"

toolbar:
  - id: add_partner_btn
    label: '+ Thêm đối tượng'
    variant: primary
    permission: crm.write
    action: add_partner

components:
  - type: ListToolbar
    source: partners
    filter_field: q
    search:
      label: Tìm kiếm đối tượng
      placeholder: 'Tìm mã, tên, MST, SĐT...'
    search_button: true
    actions: [{ id: partners.export, label: 'Xuất CSV', icon: download }]
    help: true
  - type: StatusTabs
    source: partners
    filter_field: partner_type
    show_counts: true
    variant: contained
    tabs:
      - { id: '', label: Tất cả }
      - { id: Carrier, label: Nhà xe }
      - { id: Supplier, label: Nhà cung cấp }
      - { id: ShippingLine, label: Hãng tàu }
  - type: DataGrid
    source: partners
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state:
      title: Không có đối tượng
      description: Thử thay đổi bộ lọc hoặc tạo đối tượng mới.
    columns:
      - field: system_code
        label: Mã HT
        sortable: true
      - field: code
        label: Mã / tên
        type: PrimaryEntityCell
        secondary: name
      - field: tax_code
        label: Mã số thuế
      - field: partner_type_label
        label: Loại
        type: StatusChip
        colors:
          Nhà xe: blue
          Nhà cung cấp: amber
          Hãng tàu: teal
          Kho / bãi: violet
          Depot: indigo
          Khác: slate
      - field: owner_name
        label: Sale phụ trách
      - field: phone
        label: Liên hệ chính
        type: PrimaryEntityCell
        secondary: email
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - id: view_partner
            label: Chi tiết
            variant: ghost
            permission: crm.read
          - id: edit_partner
            label: Sửa
            variant: ghost
            permission: crm.write
          - id: delete_partner
            label: Xóa
            variant: danger
            permission: crm.write

actions:
  - { id: view_partner, type: navigate, permission: crm.read, navigate_to: /crm/entities/detail, params: { id: '{row.id}', kind: partner, back: /partners } }
  - id: add_partner
    type: form
    permission: crm.write
    title: Thêm đối tượng
    table: partners
    operation: insert
    refresh: [partners]
    fields:
      - { field: code, label: Mã đối tượng, type: text, required: true }
      - { field: name, label: Tên đối tượng, type: text, required: true }
      - { field: tax_code, label: Mã số thuế, type: text }
      - { field: phone, label: Số điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: partner_type, label: Loại đối tượng, type: select, options: [{ id: Carrier, label: Nhà vận chuyển }, { id: Supplier, label: Nhà cung cấp }, { id: ShippingLine, label: Hãng tàu }, { id: Warehouse, label: Kho }, { id: Depot, label: Depot }, { id: Other, label: Khác }], default: Supplier }
      - { field: owner_name, label: Sale phụ trách, type: select, options_source: partner_owner_lookup }
      - { field: visibility, label: Hiển thị, type: select, options: [{ id: Public, label: Công khai }, { id: Private, label: Riêng }], default: Public }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }], default: Active }
  - id: edit_partner
    type: form
    permission: crm.write
    title: Cập nhật đối tượng
    table: partners
    operation: update
    prefill: row
    refresh: [partners]
    fields:
      - { field: code, label: Mã đối tượng, type: text, required: true }
      - { field: name, label: Tên đối tượng, type: text, required: true }
      - { field: tax_code, label: Mã số thuế, type: text }
      - { field: phone, label: Số điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: partner_type, label: Loại đối tượng, type: select, options: [{ id: Carrier, label: Nhà vận chuyển }, { id: Supplier, label: Nhà cung cấp }, { id: ShippingLine, label: Hãng tàu }, { id: Warehouse, label: Kho }, { id: Depot, label: Depot }, { id: Other, label: Khác }] }
      - { field: owner_name, label: Sale phụ trách, type: select, options_source: partner_owner_lookup }
      - { field: visibility, label: Hiển thị, type: select, options: [{ id: Public, label: Công khai }, { id: Private, label: Riêng }] }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }] }
  - id: delete_partner
    type: delete
    permission: crm.write
    confirm: 'Xóa đối tượng {{row.name}}?'
    table: partners
    refresh: [partners]
