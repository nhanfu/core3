title: Bảng lương

page:
  id: payroll
  breadcrumb: [Nhân sự, Bảng lương]
  auth:
    require: [hr.read]

datasources:
  - id: payroll_totals
    single: true
    permission: hr.read
    query: |
      SELECT COUNT(*) AS payroll_count,
        COALESCE(SUM(p.net_salary), 0) AS net_total,
        COALESCE(SUM(CASE WHEN p.status = 'Paid' THEN p.net_salary ELSE 0 END), 0) AS paid_total,
        COALESCE(SUM(CASE WHEN p.status IN ('Draft', 'Approved') THEN p.net_salary ELSE 0 END), 0) AS pending_total
      FROM payrolls p JOIN employees e ON e.id = p.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (:from_date IS NULL OR p.pay_month >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR p.pay_month < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
  - id: payroll
    single: false
    permission: hr.read
    query: |
      SELECT p.id, p.code, p.employee_id,
        CAST(p.pay_month AS VARCHAR) AS pay_month,
        p.base_salary, p.allowance, p.deduction, p.net_salary, p.status,
        p.created_at, p.updated_at,
        e.code AS employee_code, e.name AS employee_name,
        printf('%,.0f', COALESCE(p.base_salary, 0)) AS base_salary_display,
        printf('%,.0f', COALESCE(p.allowance, 0)) AS allowance_display,
        printf('%,.0f', COALESCE(p.deduction, 0)) AS deduction_display,
        printf('%,.0f', COALESCE(p.net_salary, 0)) AS net_salary_display,
        CASE p.status WHEN 'Draft' THEN 'Nháp' WHEN 'Approved' THEN 'Đã duyệt' ELSE 'Đã chi' END AS status_label
      FROM payrolls p
      LEFT JOIN employees e ON e.id = p.employee_id
      LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR p.status = :status)
        AND (:from_date IS NULL OR p.pay_month >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR p.pay_month < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR p.code ILIKE '%' || :q || '%' OR e.code ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%')
      ORDER BY p.pay_month DESC, p.created_at DESC
  - id: payroll_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"

toolbar:
  - id: add_payroll_btn
    label: '+ Lập bảng lương'
    variant: primary
    permission: hr.write
    action: add_payroll

components:
  - type: ListToolbar
    source: payroll
    filter_sources: [payroll, payroll_totals]
    date_range: { from_field: from_date, to_field: to_date, from_label: 'Từ tháng', to_label: 'Đến tháng', presets: [today, week, month, quarter, year, all] }
    filter_field: q
    search: { label: Tìm kiếm bảng lương, placeholder: 'Tìm mã bảng lương, mã hoặc tên nhân viên...' }
    actions: [{ id: payroll.export, label: 'Xuất CSV', icon: download }]
  - type: StatRow
    source: payroll_totals
    stats: [{ label: Bảng lương, field: payroll_count, color: blue }, { label: Tổng thực lãnh, field: net_total, color: blue }, { label: Đã chi, field: paid_total, color: green }, { label: Chờ xử lý, field: pending_total, color: amber }]
  - type: StatusTabs
    source: payroll
    filter_field: status
    variant: contained
    tabs:
      - { id: '', label: Tất cả }
      - { id: Draft, label: Nháp }
      - { id: Approved, label: Đã duyệt }
      - { id: Paid, label: Đã chi }
  - type: DataGrid
    source: payroll
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: Không có bảng lương, description: Thử thay đổi bộ lọc hoặc lập bảng lương mới. }
    columns:
      - { field: code, label: Số bảng lương }
      - { field: employee_code, label: Nhân viên, type: PrimaryEntityCell, secondary: employee_name }
      - { field: pay_month, label: Tháng lương }
      - { field: base_salary_display, label: Lương cơ bản, align: right }
      - { field: allowance_display, label: Phụ cấp, align: right }
      - { field: deduction_display, label: Khấu trừ, align: right }
      - { field: net_salary_display, label: Thực lãnh, align: right }
      - field: status_label
        label: Trạng thái
        type: StatusChip
        colors: { Nháp: neutral, Đã duyệt: amber, Đã chi: green }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_payroll, label: Chi tiết, variant: primary, permission: hr.read }
          - { id: edit_payroll, label: Sửa, variant: ghost, permission: hr.write, show_if: "row.status === 'Draft'" }
          - { id: approve_payroll, label: Duyệt, variant: primary, permission: hr.approve, show_if: "row.status === 'Draft'" }
          - { id: reopen_payroll, label: Mở lại, variant: ghost, permission: hr.approve, show_if: "row.status === 'Approved'" }
          - { id: pay_payroll, label: Xác nhận chi, variant: primary, permission: hr.pay, show_if: "row.status === 'Approved'" }
          - { id: delete_payroll, label: Xóa, variant: danger, permission: hr.write, show_if: "row.status === 'Draft'" }

actions:
  - { id: view_payroll, type: navigate, permission: hr.read, navigate_to: /hr/payroll/detail, params: { id: '{row.id}' } }
  - id: add_payroll
    type: form
    permission: hr.write
    title: Lập bảng lương
    table: payrolls
    operation: insert
    refresh: [payroll]
    fields:
      - { field: code, label: Số bảng lương, type: text, required: true }
      - { field: employee_id, label: Nhân viên, type: select, options_source: payroll_employee_lookup, required: true }
      - { field: pay_month, label: Tháng lương, type: date, required: true }
      - { field: base_salary, label: Lương cơ bản, type: money, currency: VND, default: 0 }
      - { field: allowance, label: Phụ cấp, type: money, currency: VND, default: 0 }
      - { field: deduction, label: Khấu trừ, type: money, currency: VND, default: 0 }
      - { field: net_salary, label: Thực lãnh, type: money, currency: VND, default: 0 }
  - id: edit_payroll
    type: form
    permission: hr.write
    title: Cập nhật bảng lương
    table: payrolls
    operation: update
    prefill: row
    refresh: [payroll]
    fields:
      - { field: code, label: Số bảng lương, type: text, required: true }
      - { field: employee_id, label: Nhân viên, type: select, options_source: payroll_employee_lookup, required: true }
      - { field: pay_month, label: Tháng lương, type: date, required: true }
      - { field: base_salary, label: Lương cơ bản, type: money, currency: VND }
      - { field: allowance, label: Phụ cấp, type: money, currency: VND }
      - { field: deduction, label: Khấu trừ, type: money, currency: VND }
      - { field: net_salary, label: Thực lãnh, type: money, currency: VND }
  - { id: approve_payroll, type: server, permission: hr.approve, action: hr.payroll.approve, confirm: 'Duyệt bảng lương {{row.code}}?', refresh: [payroll] }
  - { id: reopen_payroll, type: server, permission: hr.approve, action: hr.payroll.reopen, confirm: 'Mở lại bảng lương {{row.code}} để chỉnh sửa?', refresh: [payroll] }
  - { id: pay_payroll, type: server, permission: hr.pay, action: hr.payroll.mark_paid, confirm: 'Xác nhận đã chi bảng lương {{row.code}}?', refresh: [payroll] }
  - id: delete_payroll
    type: delete
    permission: hr.write
    confirm: 'Xóa bảng lương {{row.code}}?'
    table: payrolls
    refresh: [payroll]
