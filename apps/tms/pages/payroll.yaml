title: Bảng lương

page:
  id: payroll
  auth:
    require: [hr.read]

datasources:
  - id: payroll
    single: false
    permission: hr.read
    query: |
      SELECT p.id, p.code, p.employee_id,
        CAST(p.pay_month AS VARCHAR) AS pay_month,
        p.base_salary, p.allowance, p.deduction, p.net_salary, p.status,
        p.created_at, p.updated_at,
        e.code AS employee_code, e.name AS employee_name,
        printf('%,.0f', COALESCE(p.base_salary, 0)) AS base_salary_display,
        printf('%,.0f', COALESCE(p.allowance, 0)) AS allowance_display,
        printf('%,.0f', COALESCE(p.deduction, 0)) AS deduction_display,
        printf('%,.0f', COALESCE(p.net_salary, 0)) AS net_salary_display,
        CASE p.status WHEN 'Draft' THEN 'Nháp' WHEN 'Approved' THEN 'Đã duyệt' ELSE 'Đã chi' END AS status_label
      FROM payrolls p
      LEFT JOIN employees e ON e.id = p.employee_id
      WHERE (NULLIF(:status, '') IS NULL OR p.status = :status)
        AND (:q IS NULL OR p.code ILIKE '%' || :q || '%' OR e.code ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%')
      ORDER BY p.pay_month DESC, p.created_at DESC

toolbar:
  - id: add_payroll_btn
    label: '+ Lập bảng lương'
    variant: primary
    permission: hr.write
    action: add_payroll

components:
  - type: ListToolbar
    source: payroll
    filter_field: q
    search: { label: Tìm kiếm bảng lương, placeholder: 'Tìm mã bảng lương, mã hoặc tên nhân viên...' }
  - type: StatusTabs
    source: payroll
    filter_field: status
    tabs:
      - { id: '', label: Tất cả }
      - { id: Draft, label: Nháp }
      - { id: Approved, label: Đã duyệt }
      - { id: Paid, label: Đã chi }
  - type: DataGrid
    source: payroll
    page_size: 10
    row_key: id
    selectable: true
    empty_state: { title: Không có bảng lương, description: Thử thay đổi bộ lọc hoặc lập bảng lương mới. }
    columns:
      - { field: code, label: Số bảng lương }
      - { field: employee_code, label: Nhân viên, type: PrimaryEntityCell, secondary: employee_name }
      - { field: pay_month, label: Tháng lương }
      - { field: base_salary_display, label: Lương cơ bản, align: right }
      - { field: allowance_display, label: Phụ cấp, align: right }
      - { field: deduction_display, label: Khấu trừ, align: right }
      - { field: net_salary_display, label: Thực lãnh, align: right }
      - field: status_label
        label: Trạng thái
        type: StatusChip
        colors: { Nháp: slate, Đã duyệt: amber, Đã chi: green }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_payroll, label: Sửa, variant: ghost, show_if: "row.status === 'Draft'" }
          - { id: approve_payroll, label: Duyệt, variant: primary, show_if: "row.status === 'Draft' && user.permissions.includes('hr.approve')" }
          - { id: reopen_payroll, label: Mở lại, variant: ghost, show_if: "row.status === 'Approved' && user.permissions.includes('hr.approve')" }
          - { id: pay_payroll, label: Xác nhận chi, variant: primary, show_if: "row.status === 'Approved' && user.permissions.includes('hr.pay')" }
          - { id: delete_payroll, label: Xóa, variant: danger, show_if: "row.status === 'Draft'" }

actions:
  - id: add_payroll
    type: form
    title: Lập bảng lương
    table: payrolls
    operation: insert
    refresh: [payroll]
    fields:
      - { field: code, label: Số bảng lương, type: text, required: true }
      - { field: employee_id, label: Mã HT nhân viên, type: text, required: true }
      - { field: pay_month, label: Tháng lương, type: date, required: true }
      - { field: base_salary, label: Lương cơ bản, type: number, default: 0 }
      - { field: allowance, label: Phụ cấp, type: number, default: 0 }
      - { field: deduction, label: Khấu trừ, type: number, default: 0 }
      - { field: net_salary, label: Thực lãnh, type: number, default: 0 }
  - id: edit_payroll
    type: form
    title: Cập nhật bảng lương
    table: payrolls
    operation: update
    prefill: row
    refresh: [payroll]
    fields:
      - { field: code, label: Số bảng lương, type: text, required: true }
      - { field: employee_id, label: Mã HT nhân viên, type: text, required: true }
      - { field: pay_month, label: Tháng lương, type: date, required: true }
      - { field: base_salary, label: Lương cơ bản, type: number }
      - { field: allowance, label: Phụ cấp, type: number }
      - { field: deduction, label: Khấu trừ, type: number }
      - { field: net_salary, label: Thực lãnh, type: number }
  - { id: approve_payroll, type: server, action: hr.payroll.approve, confirm: 'Duyệt bảng lương {{row.code}}?', refresh: [payroll] }
  - { id: reopen_payroll, type: server, action: hr.payroll.reopen, confirm: 'Mở lại bảng lương {{row.code}} để chỉnh sửa?', refresh: [payroll] }
  - { id: pay_payroll, type: server, action: hr.payroll.mark_paid, confirm: 'Xác nhận đã chi bảng lương {{row.code}}?', refresh: [payroll] }
  - id: delete_payroll
    type: delete
    confirm: 'Xóa bảng lương {{row.code}}?'
    table: payrolls
    refresh: [payroll]
