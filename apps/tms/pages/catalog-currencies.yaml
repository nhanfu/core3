title: Tiền tệ

page:
  id: catalog-currencies
  breadcrumb: [Danh mục, Tiền tệ]
  auth:
    require: [catalog.read]

datasources:
  - id: currencies
    single: false
    permission: catalog.read
    query: |
      SELECT m.id, m.code, m.name, m.description, m.symbol, m.decimals, m.status, m.sort_order,
        COALESCE(r.rate_to_vnd, CASE WHEN m.code = 'VND' THEN 1 ELSE NULL END) AS rate_to_vnd,
        CAST(r.effective_date AS VARCHAR) AS rate_effective_date,
        r.source AS rate_source, r.synced_at AS rate_synced_at, m.created_at
      FROM master_data m
      LEFT JOIN currency_rates r ON r.currency_code = m.code
      WHERE m.kind = 'currency'
        AND (:status IS NULL OR m.status = :status)
        AND (:q IS NULL OR m.code ILIKE '%' || :q || '%' OR m.name ILIKE '%' || :q || '%' OR m.symbol ILIKE '%' || :q || '%')
      ORDER BY m.sort_order, m.code

toolbar:
  - { id: add_currency_btn, label: '+ Thêm tiền tệ', variant: primary, permission: catalog.write, action: add_currency }
  - { id: sync_currency_rates_btn, label: 'Đồng bộ tỷ giá', variant: secondary, permission: catalog.write, action: sync_currency_rates }

components:
  - type: ListToolbar
    source: currencies
    filter_field: q
    search: { label: Tìm kiếm tiền tệ, placeholder: 'Tìm mã, tên hoặc ký hiệu...' }
    actions: [{ id: currencies.export, label: 'Xuất CSV', icon: download }, { id: import_currencies, label: 'Nhập CSV', icon: upload }]
  - type: StatusTabs
    source: currencies
    filter_field: status
    variant: contained
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Đang sử dụng }
      - { id: Inactive, label: Ngưng sử dụng }
  - type: DataGrid
    source: currencies
    column_chooser: true
    page_size: 20
    row_key: id
    selectable: true
    empty_state: { title: Không có tiền tệ, description: Tạo tiền tệ đầu tiên để sử dụng trong báo giá. }
    columns:
      - { field: code, label: Mã, sortable: true }
      - { field: name, label: Tiền tệ, type: PrimaryEntityCell, secondary: description }
      - { field: symbol, label: Ký hiệu, align: center }
      - { field: decimals, label: Số lẻ, align: right }
      - { field: rate_to_vnd, label: Tỷ giá / VND, align: right }
      - { field: rate_effective_date, label: Ngày hiệu lực }
      - { field: rate_source, label: Nguồn }
      - { field: sort_order, label: Thứ tự, align: right }
      - field: status
        label: Trạng thái
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Ngày tạo }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_currency, label: Sửa, variant: ghost, permission: catalog.write }
          - { id: delete_currency, label: Xóa, variant: danger, permission: catalog.write }

actions:
  - { id: sync_currency_rates, type: server, permission: catalog.write, action: catalog.currencies.sync_rates, refresh: [currencies] }
  - { id: import_currencies, type: upload, permission: catalog.write, kind: master_data_import, scope: currency, refresh: [currencies] }
  - id: add_currency
    type: form
    permission: catalog.write
    title: Thêm tiền tệ
    table: master_data
    scope: currency
    operation: insert
    refresh: [currencies]
    fields:
      - { field: code, label: Mã ISO, type: text, required: true }
      - { field: name, label: Tên tiền tệ, type: text, required: true }
      - { field: symbol, label: Ký hiệu, type: text }
      - { field: decimals, label: Số chữ số lẻ, type: number, default: 2 }
      - { field: description, label: Mô tả, type: textarea }
      - { field: sort_order, label: Thứ tự, type: number, default: 0 }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }], default: Active }
  - id: edit_currency
    type: form
    permission: catalog.write
    title: Cập nhật tiền tệ
    table: master_data
    scope: currency
    operation: update
    prefill: row
    refresh: [currencies]
    fields:
      - { field: code, label: Mã ISO, type: text, required: true }
      - { field: name, label: Tên tiền tệ, type: text, required: true }
      - { field: symbol, label: Ký hiệu, type: text }
      - { field: decimals, label: Số chữ số lẻ, type: number }
      - { field: description, label: Mô tả, type: textarea }
      - { field: sort_order, label: Thứ tự, type: number }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }
  - { id: delete_currency, type: delete, permission: catalog.write, table: master_data, scope: currency, confirm: 'Xóa tiền tệ {{row.name}}?', refresh: [currencies] }
