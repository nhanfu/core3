title: Cấu hình sinh mã
page: { id: system-code-rules, auth: { require: [system.read] } }
datasources:
  - id: code_rules
    single: false
    permission: system.read
    query: |
      SELECT id, code, name, prefix, sequence_width, reset_cadence, next_sequence,
        CASE WHEN prefix IS NOT NULL THEN replace(replace(prefix, '{YYYY}', CAST(year(current_date) AS VARCHAR)), '{SEQ:' || CAST(sequence_width AS VARCHAR) || '}', lpad(CAST(next_sequence AS VARCHAR), sequence_width, '0')) ELSE config_value END AS preview,
        config_value, description, status, sort_order, created_at
      FROM system_configs
      WHERE kind = 'code_rule' AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%')
      ORDER BY sort_order, code
toolbar: [{ id: add_code_rule, label: '+ Thêm quy tắc', variant: primary, permission: system.write, action: add_code_rule }]
components:
  - { type: ListToolbar, source: code_rules, filter_field: q, search: { label: Tìm quy tắc, placeholder: 'Tìm mã hoặc tên...' }, actions: [{ id: code_rules.export, label: 'Xuất CSV', icon: '↓' }] }
  - { type: StatusTabs, source: code_rules, filter_field: status, tabs: [{ id: '', label: Tất cả }, { id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }
  - type: DataGrid
    source: code_rules
    page_size: 20
    column_chooser: true
    row_key: id
    columns:
      - { field: code, label: Mã }
      - { field: name, label: Quy tắc, type: PrimaryEntityCell, secondary: description }
      - { field: prefix, label: Tiền tố }
      - { field: sequence_width, label: Độ dài }
      - { field: reset_cadence, label: Chu kỳ đặt lại }
      - { field: preview, label: Mẫu xem trước }
      - { field: status, label: Trạng thái, type: StatusChip, colors: { Active: green, Inactive: red } }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: preview_code_rule, label: Xem mẫu, variant: ghost }
          - { id: edit_code_rule, label: Sửa, variant: ghost }
          - { id: delete_code_rule, label: Xóa, variant: danger }
actions:
  - { id: preview_code_rule, type: server, action: system.code_rules.preview, refresh: [code_rules], params: { id: '{row.id}' } }
  - { id: add_code_rule, type: form, title: Thêm quy tắc mã, table: system_configs, scope: code_rule, operation: insert, refresh: [code_rules], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: prefix, label: Tiền tố / mẫu, type: text, required: true }, { field: sequence_width, label: Độ dài số thứ tự, type: number, default: 4, required: true }, { field: reset_cadence, label: Chu kỳ đặt lại, type: select, options: [never, monthly, yearly], default: never }, { field: next_sequence, label: Số thứ tự kế tiếp, type: number, default: 1 }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }] }
  - { id: edit_code_rule, type: form, title: Cập nhật quy tắc mã, table: system_configs, scope: code_rule, operation: update, prefill: row, refresh: [code_rules], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: prefix, label: Tiền tố / mẫu, type: text, required: true }, { field: sequence_width, label: Độ dài số thứ tự, type: number, required: true }, { field: reset_cadence, label: Chu kỳ đặt lại, type: select, options: [never, monthly, yearly] }, { field: next_sequence, label: Số thứ tự kế tiếp, type: number, required: true }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }] }
  - { id: delete_code_rule, type: delete, table: system_configs, scope: code_rule, confirm: 'Xóa quy tắc {{row.name}}?', refresh: [code_rules] }
