title: Configure code generation
page: { id: system-code-rules, breadcrumb: [System, Configure code generation], auth: { require: [system.read] } }
datasources:
  - id: code_rules
    single: false
    permission: system.read
    query: |
      SELECT id, code, name, prefix, sequence_width, reset_cadence, next_sequence,
        CASE WHEN prefix IS NOT NULL THEN replace(replace(prefix, '{YYYY}', CAST(year(current_date) AS VARCHAR)), '{SEQ:' || CAST(sequence_width AS VARCHAR) || '}', lpad(CAST(next_sequence AS VARCHAR), sequence_width, '0')) ELSE config_value END AS preview,
        config_value, description, status, sort_order, created_at
      FROM system_configs
      WHERE kind = 'code_rule' AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%')
      ORDER BY sort_order, code
toolbar: [{ id: add_code_rule, label: '+ Add rules', variant: primary, permission: system.write, action: add_code_rule }]
components:
  - { type: ListToolbar, source: code_rules, filter_field: q, search: { label: Find the rules, placeholder: 'Find code or name...' }, actions: [{ id: code_rules.export, label: 'Export CSV', icon: download }] }
  - { type: StatusTabs, source: code_rules, filter_field: status, tabs: [{ id: '', label: All }, { id: Active, label: Using }, { id: Inactive, label: Stop using }] }
  - type: DataGrid
    source: code_rules
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: There are no code generation rules yet }
    columns:
      - { field: code, label: Code }
      - { field: name, label: Rules, type: PrimaryEntityCell, secondary: description }
      - { field: prefix, label: Prefix }
      - { field: sequence_width, label: Length }
      - { field: reset_cadence, label: Reset cycle }
      - { field: preview, label: Preview sample }
      - { field: status, label: Status, type: StatusChip, colors: { Active: green, Inactive: red } }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: preview_code_rule, label: See sample, variant: ghost, permission: system.read }
          - { id: edit_code_rule, label: Fix, variant: ghost, permission: system.write }
          - { id: delete_code_rule, label: Erase, variant: danger, permission: system.write }
actions:
  - { id: preview_code_rule, type: server, permission: system.read, action: system.code_rules.preview, result: alert, result_field: preview, refresh: [code_rules], params: { id: '{row.id}' } , handler: code_rule_preview}
  - { id: add_code_rule, type: form, permission: system.write, title: Add code rule, table: system_configs, scope: code_rule, operation: insert, refresh: [code_rules], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: prefix, label: Prefix/pattern, type: text, required: true }, { field: sequence_width, label: Sequence number length, type: number, default: 4, required: true }, { field: reset_cadence, label: Reset cycle, type: select, options: [{ id: never, label: No reset }, { id: monthly, label: Monthly }, { id: yearly, label: Annual }], default: never }, { field: next_sequence, label: Next serial number, type: number, default: 1 }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }] }
  - { id: edit_code_rule, type: form, permission: system.write, title: Update code rules, table: system_configs, scope: code_rule, operation: update, prefill: row, refresh: [code_rules], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: prefix, label: Prefix/pattern, type: text, required: true }, { field: sequence_width, label: Sequence number length, type: number, required: true }, { field: reset_cadence, label: Reset cycle, type: select, options: [{ id: never, label: No reset }, { id: monthly, label: Monthly }, { id: yearly, label: Annual }] }, { field: next_sequence, label: Next serial number, type: number, required: true }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }] }
  - { id: delete_code_rule, type: delete, permission: system.write, table: system_configs, scope: code_rule, confirm: 'Remove rule {{row.name}}?', refresh: [code_rules] }
