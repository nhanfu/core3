title: Tài xế

page:
  id: drivers
  auth:
    require: [drivers.read]

datasources:
  - id: drivers
    single: false
    permission: drivers.read
    query: |
      SELECT d.id, d.name, d.phone, d.email, d.license_number, d.license_expiry,
        t.plate AS truck_plate,
        CASE d.status
          WHEN 'Active' THEN 'Đang hoạt động'
          WHEN 'On Leave' THEN 'Nghỉ phép'
          WHEN 'Inactive' THEN 'Ngưng hoạt động'
          ELSE d.status
        END AS availability,
        'Admin User' AS created_by, d.created_at
      FROM drivers d
      LEFT JOIN trucks t ON t.id = d.assigned_truck_id
      WHERE (:status IS NULL OR d.status = :status)
        AND (:q IS NULL OR d.name ILIKE '%' || :q || '%' OR d.license_number ILIKE '%' || :q || '%' OR d.phone ILIKE '%' || :q || '%')
      ORDER BY d.name

toolbar:
  - id: add_driver_btn
    label: '+ Thêm tài xế'
    variant: primary
    permission: drivers.write
    action: add_driver

components:
  - type: ListToolbar
    source: drivers
    filter_field: q
    search:
      label: Tìm kiếm tài xế
      placeholder: 'Tìm theo tên, số điện thoại, giấy phép...'
  - type: StatusTabs
    source: drivers
    filter_field: status
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Đang hoạt động }
      - { id: 'On Leave', label: Nghỉ phép }
      - { id: Inactive, label: Ngưng hoạt động }
  - type: DataGrid
    source: drivers
    page_size: 10
    row_key: id
    selectable: true
    empty_state:
      title: Không có tài xế
      description: Thử thay đổi bộ lọc hoặc tạo tài xế mới.
    columns:
      - { field: id, label: Mã HT, sortable: true }
      - { field: name, label: Họ tên, type: PrimaryEntityCell, secondary: phone }
      - { field: license_number, label: Số giấy phép }
      - { field: truck_plate, label: Phương tiện }
      - { field: license_expiry, label: Hạn giấy phép, type: DateCell }
      - field: availability
        label: Trạng thái
        type: StatusChip
        colors:
          Đang hoạt động: green
          Nghỉ phép: amber
          Ngưng hoạt động: red
      - { field: created_by, label: Người tạo }
      - { field: created_at, label: Ngày giờ tạo, type: DateCell }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_driver, label: Sửa, variant: ghost }
          - { id: delete_driver, label: Xóa, variant: danger }

actions:
  - id: add_driver
    type: form
    title: Thêm tài xế
    table: drivers
    operation: insert
    refresh: [drivers]
    fields:
      - { field: name, label: Họ tên, type: text, required: true }
      - { field: phone, label: Số điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: license_number, label: Số giấy phép, type: text, required: true }
      - { field: license_expiry, label: Hạn giấy phép, type: date, required: true }
      - { field: status, label: Trạng thái, type: select, options: [Active, On Leave, Inactive], default: Active }
  - id: edit_driver
    type: form
    title: Cập nhật tài xế
    table: drivers
    operation: update
    prefill: row
    refresh: [drivers]
    fields:
      - { field: name, label: Họ tên, type: text, required: true }
      - { field: phone, label: Số điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: license_number, label: Số giấy phép, type: text, required: true }
      - { field: license_expiry, label: Hạn giấy phép, type: date, required: true }
      - { field: status, label: Trạng thái, type: select, options: [Active, On Leave, Inactive] }
  - id: delete_driver
    type: delete
    confirm: 'Xóa tài xế {{row.name}}?'
    table: drivers
    refresh: [drivers]
