title: Tài xế

page:
  id: drivers
  breadcrumb: [Danh mục, Tài xế]
  auth:
    require: [drivers.read]

datasources:
  - id: drivers
    single: false
    permission: drivers.read
    query: |
      SELECT d.id, d.name, d.phone, d.email, d.license_number, d.license_expiry, d.status,
        t.plate AS truck_plate,
        CASE d.status
          WHEN 'Active' THEN 'Đang hoạt động'
          WHEN 'On Leave' THEN 'Nghỉ phép'
          WHEN 'Inactive' THEN 'Ngưng hoạt động'
          ELSE d.status
        END AS availability,
        CASE
          WHEN d.license_expiry < CURRENT_DATE THEN 'Đã hết hạn'
          WHEN d.license_expiry <= CURRENT_DATE + INTERVAL 30 DAY THEN 'Sắp hết hạn'
          ELSE 'Còn hiệu lực'
        END AS compliance_label,
        'Admin User' AS created_by, d.created_at
      FROM drivers d
      LEFT JOIN trucks t ON t.id = d.assigned_truck_id
      WHERE (:status IS NULL OR d.status = :status)
        AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)
        AND (:from_date IS NULL OR d.license_expiry >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR d.license_expiry < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR d.name ILIKE '%' || :q || '%' OR d.license_number ILIKE '%' || :q || '%' OR d.phone ILIKE '%' || :q || '%')
      ORDER BY d.name
  - id: driver_vehicle_lookup
    single: false
    permission: drivers.read
    query: "SELECT id AS value, plate || ' - ' || model AS label FROM trucks WHERE (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY plate"

toolbar:
  - id: add_driver_btn
    label: '+ Thêm tài xế'
    variant: primary
    permission: drivers.write
    action: add_driver

components:
  - type: ListToolbar
    source: drivers
    filter_field: q
    search:
      label: Tìm kiếm tài xế
      placeholder: 'Tìm theo tên, số điện thoại, giấy phép...'
    date_range: { from_field: from_date, to_field: to_date, from_label: 'Hạn giấy phép từ', to_label: 'Hạn giấy phép đến', presets: [today, week, month, quarter, year, all] }
    actions: [{ id: drivers.export, label: 'Xuất CSV', icon: download }]
  - type: StatusTabs
    source: drivers
    filter_field: status
    show_counts: false
    variant: contained
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Đang hoạt động }
      - { id: 'On Leave', label: Nghỉ phép }
      - { id: Inactive, label: Ngưng hoạt động }
  - type: DataGrid
    source: drivers
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state:
      title: Không có tài xế
      description: Thử thay đổi bộ lọc hoặc tạo tài xế mới.
    columns:
      - { field: id, label: Mã HT, sortable: true }
      - { field: name, label: Họ tên, type: PrimaryEntityCell, secondary: phone }
      - { field: license_number, label: Số giấy phép }
      - { field: truck_plate, label: Phương tiện }
      - { field: license_expiry, label: Hạn giấy phép, type: DateCell }
      - field: compliance_label
        label: Tuân thủ
        type: StatusChip
        colors: { Còn hiệu lực: green, Sắp hết hạn: amber, Đã hết hạn: red }
      - field: availability
        label: Trạng thái
        type: StatusChip
        colors:
          Đang hoạt động: green
          Nghỉ phép: amber
          Ngưng hoạt động: red
      - { field: created_by, label: Người tạo }
      - { field: created_at, label: Ngày giờ tạo, type: DateCell }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_driver, label: Chi tiết, variant: primary, permission: drivers.read }
          - { id: edit_driver, label: Sửa, variant: ghost, permission: drivers.write }
          - { id: delete_driver, label: Xóa, variant: danger, permission: drivers.write }

actions:
  - { id: view_driver, type: navigate, permission: drivers.read, navigate_to: /drivers/detail, params: { id: '{row.id}' } }
  - id: add_driver
    type: form
    permission: drivers.write
    title: Thêm tài xế
    table: drivers
    operation: insert
    refresh: [drivers]
    fields:
      - { field: name, label: Họ tên, type: text, required: true }
      - { field: phone, label: Số điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: license_number, label: Số giấy phép, type: text, required: true }
      - { field: license_expiry, label: Hạn giấy phép, type: date, required: true }
      - { field: assigned_truck_id, label: Phương tiện phụ trách, type: select, options_source: driver_vehicle_lookup }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang hoạt động }, { id: 'On Leave', label: Nghỉ phép }, { id: Inactive, label: Ngưng hoạt động }], default: Active }
  - id: edit_driver
    type: form
    permission: drivers.write
    title: Cập nhật tài xế
    table: drivers
    operation: update
    prefill: row
    refresh: [drivers]
    fields:
      - { field: name, label: Họ tên, type: text, required: true }
      - { field: phone, label: Số điện thoại, type: text }
      - { field: email, label: Email, type: text }
      - { field: license_number, label: Số giấy phép, type: text, required: true }
      - { field: license_expiry, label: Hạn giấy phép, type: date, required: true }
      - { field: assigned_truck_id, label: Phương tiện phụ trách, type: select, options_source: driver_vehicle_lookup }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang hoạt động }, { id: 'On Leave', label: Nghỉ phép }, { id: Inactive, label: Ngưng hoạt động }] }
  - id: delete_driver
    type: delete
    permission: drivers.write
    confirm: 'Xóa tài xế {{row.name}}?'
    table: drivers
    refresh: [drivers]
