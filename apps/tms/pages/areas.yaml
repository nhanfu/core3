title: Khu vực
page:
  id: areas
  auth: { require: [dispatch.read] }
datasources:
  - id: areas
    single: false
    permission: dispatch.read
    query: |
      SELECT a.*, p.name AS parent_name, CASE a.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label FROM areas a LEFT JOIN areas p ON p.id = a.parent_id
      WHERE (NULLIF(:status, '') IS NULL OR a.status = :status) AND (:q IS NULL OR a.code ILIKE '%' || :q || '%' OR a.name ILIKE '%' || :q || '%' OR a.region ILIKE '%' || :q || '%')
      ORDER BY a.created_at DESC, a.name
  - id: area_parent_lookup
    single: false
    permission: dispatch.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM areas ORDER BY name"
toolbar:
  - { id: add_area_btn, label: '+ Thêm khu vực', variant: primary, permission: dispatch.write, action: add_area }
components:
  - type: ListToolbar
    source: areas
    filter_field: q
    search: { label: Tìm kiếm khu vực, placeholder: 'Tìm mã, tên hoặc vùng miền...' }
  - type: StatusTabs
    source: areas
    filter_field: status
    tabs: [{ id: '', label: Tất cả }, { id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }]
  - type: DataGrid
    source: areas
    tree: true
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: Không có khu vực, description: Thử thay đổi bộ lọc hoặc tạo khu vực mới. }
    columns:
      - { field: id, label: Mã HT, sortable: true }
      - { field: code, label: Mã / tên, type: PrimaryEntityCell, secondary: name }
      - { field: region, label: Vùng miền }
      - { field: parent_name, label: Khu vực cha }
      - { field: description, label: Ghi chú }
      - { field: status_label, label: Trạng thái, type: StatusChip, colors: { Hoạt động: green, Ngưng hoạt động: red } }
      - { field: created_at, label: Ngày giờ tạo }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions: [{ id: view_area, label: Chi tiết, variant: primary }, { id: edit_area, label: Sửa, variant: ghost }, { id: delete_area, label: Xóa, variant: danger }]
actions:
  - { id: view_area, type: navigate, navigate_to: /areas/detail, params: { id: '{row.id}' } }
  - id: add_area
    type: form
    title: Thêm khu vực
    table: areas
    operation: insert
    refresh: [areas]
    fields: [{ field: code, label: Mã khu vực, type: text, required: true }, { field: name, label: Tên khu vực, type: text, required: true }, { field: parent_id, label: Khu vực cha, type: select, options_source: area_parent_lookup }, { field: region, label: Vùng miền, type: text }, { field: description, label: Ghi chú, type: textarea }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }]
  - id: edit_area
    type: form
    title: Cập nhật khu vực
    table: areas
    operation: update
    prefill: row
    refresh: [areas]
    fields: [{ field: code, label: Mã khu vực, type: text, required: true }, { field: name, label: Tên khu vực, type: text, required: true }, { field: parent_id, label: Khu vực cha, type: select, options_source: area_parent_lookup }, { field: region, label: Vùng miền, type: text }, { field: description, label: Ghi chú, type: textarea }, { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }]
  - { id: delete_area, type: delete, confirm: 'Xóa khu vực {{row.name}}?', table: areas, refresh: [areas] }
