title: Vai trò
page:
  id: roles
  auth: { require: [settings.read] }
datasources:
  - id: org_roles
    single: false
    permission: settings.read
    query: |
      SELECT r.id, r.name, r.description, r.view_scope, COUNT(DISTINCT p.id) AS permission_count,
        COUNT(DISTINCT ur.user_id) AS user_count
      FROM roles r LEFT JOIN permissions p ON p.role_id = r.id
        LEFT JOIN user_roles ur ON ur.role_id = r.id
      WHERE (:q IS NULL OR r.name ILIKE '%' || :q || '%' OR r.description ILIKE '%' || :q || '%')
      GROUP BY r.id, r.name, r.description, r.view_scope
      ORDER BY r.name
components:
  - type: ListToolbar
    source: org_roles
    filter_field: q
    search: { label: Tìm kiếm vai trò, placeholder: 'Tìm tên hoặc mô tả...' }
    actions: [{ id: org_roles.export, label: 'Xuất CSV', icon: '↓' }]
  - type: DataGrid
    source: org_roles
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: Không có vai trò }
    columns:
      - { field: id, label: Mã HT, sortable: true }
      - { field: name, label: Vai trò, type: PrimaryEntityCell, secondary: description }
      - { field: permission_count, label: Số quyền, align: right }
      - { field: view_scope, label: Phạm vi xem, type: StatusChip, colors: { all: blue, branch: amber, own: neutral } }
      - { field: user_count, label: Số người dùng, align: right }
      - field: actions
        label: ''
        sortable: false
        actions: [{ id: view_role, label: Chi tiết, variant: primary }]
actions:
  - { id: view_role, type: navigate, navigate_to: /org/roles/detail, params: { id: '{row.id}' } }
