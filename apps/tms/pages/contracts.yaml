title: Contract

page:
  id: contracts
  breadcrumb: [Human resources, Contract]
  auth:
    require: [hr.read]

datasources:
  - id: contracts
    single: false
    permission: hr.read
    query: |
      SELECT c.*, e.code AS employee_code, e.name AS employee_name,
        CASE c.contract_type WHEN 'Probation' THEN 'Thử việc' WHEN 'Indefinite' THEN 'Không xác định thời hạn' ELSE 'Xác định thời hạn' END AS contract_type_label,
        CASE c.status WHEN 'Expiring' THEN 'Sắp hết hạn' WHEN 'Expired' THEN 'Hết hạn' WHEN 'Terminated' THEN 'Đã chấm dứt' ELSE 'Hiệu lực' END AS status_label
      FROM employment_contracts c
      LEFT JOIN employees e ON e.id = c.employee_id
      LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR c.status = :status)
        AND (:from_date IS NULL OR c.start_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR c.start_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR c.code ILIKE '%' || :q || '%' OR e.code ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%')
      ORDER BY c.end_date NULLS LAST, c.created_at DESC
  - id: contract_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"

toolbar:
  - id: add_contract_btn
    label: '+ Add contract'
    variant: primary
    permission: hr.write
    action: add_contract

components:
  - type: ListToolbar
    source: contracts
    filter_field: q
    search: { label: Search for contracts, placeholder: 'Find contract code, employee code or name...' }
    date_range: { from_field: from_date, to_field: to_date, from_label: 'From effective date', to_label: 'Until effective date', presets: [today, week, month, quarter, year, all] }
    actions: [{ id: contracts.export, label: 'Export CSV', icon: download }]
  - type: StatusTabs
    source: contracts
    filter_field: status
    variant: contained
    tabs:
      - { id: '', label: All }
      - { id: Active, label: Effect }
      - { id: Expiring, label: About to expire }
      - { id: Expired, label: Expired }
  - type: DataGrid
    source: contracts
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: No contract, description: Try changing the filter or creating a new contract. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: code, label: Contract }
      - { field: employee_code, label: Staff, type: PrimaryEntityCell, secondary: employee_name }
      - { field: contract_type_label, label: Contract type }
      - { field: start_date, label: Magnetic effect }
      - { field: end_date, label: Effect arrives }
      - { field: base_salary, label: Basic salary, align: right }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Effect: green, About to expire: amber, Expired: red, Terminated: blue }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_contract, label: Detail, variant: primary, permission: hr.read }
          - { id: edit_contract, label: Fix, variant: ghost, permission: hr.write }
          - { id: delete_contract, label: Erase, variant: danger, permission: hr.write }

actions:
  - { id: view_contract, type: navigate, permission: hr.read, navigate_to: /hr/contracts/detail, params: { id: '{row.id}' } }
  - id: add_contract
    type: form
    permission: hr.write
    title: Add contract
    table: employment_contracts
    operation: insert
    refresh: [contracts]
    fields:
      - { field: code, label: Contract code, type: text, required: true }
      - { field: employee_id, label: Staff, type: select, options_source: contract_employee_lookup, required: true }
      - { field: contract_type, label: Contract type, type: select, options: [{ id: Probation, label: Try job }, { id: FixedTerm, label: Determine the deadline }, { id: Indefinite, label: No deadline specified }], default: FixedTerm }
      - { field: start_date, label: Magnetic effect, type: date, required: true }
      - { field: end_date, label: Effect arrives, type: date }
      - { field: base_salary, label: Basic salary, type: money, currency: VND, default: 0 }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Effect }, { id: Expiring, label: About to expire }, { id: Expired, label: Expired }, { id: Terminated, label: Terminated }], default: Active }
  - id: edit_contract
    type: form
    permission: hr.write
    title: Update contract
    table: employment_contracts
    operation: update
    prefill: row
    refresh: [contracts]
    fields:
      - { field: code, label: Contract code, type: text, required: true }
      - { field: employee_id, label: Staff, type: select, options_source: contract_employee_lookup, required: true }
      - { field: contract_type, label: Contract type, type: select, options: [{ id: Probation, label: Try job }, { id: FixedTerm, label: Determine the deadline }, { id: Indefinite, label: No deadline specified }] }
      - { field: start_date, label: Magnetic effect, type: date, required: true }
      - { field: end_date, label: Effect arrives, type: date }
      - { field: base_salary, label: Basic salary, type: money, currency: VND }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Effect }, { id: Expiring, label: About to expire }, { id: Expired, label: Expired }, { id: Terminated, label: Terminated }] }
  - id: delete_contract
    type: delete
    permission: hr.write
    confirm: 'Delete contract {{row.code}}?'
    table: employment_contracts
    refresh: [contracts]
