title: Hợp đồng

page:
  id: contracts
  breadcrumb: [Nhân sự, Hợp đồng]
  auth:
    require: [hr.read]

datasources:
  - id: contracts
    single: false
    permission: hr.read
    query: |
      SELECT c.*, e.code AS employee_code, e.name AS employee_name,
        CASE c.contract_type WHEN 'Probation' THEN 'Thử việc' WHEN 'Indefinite' THEN 'Không xác định thời hạn' ELSE 'Xác định thời hạn' END AS contract_type_label,
        CASE c.status WHEN 'Expiring' THEN 'Sắp hết hạn' WHEN 'Expired' THEN 'Hết hạn' WHEN 'Terminated' THEN 'Đã chấm dứt' ELSE 'Hiệu lực' END AS status_label
      FROM employment_contracts c
      LEFT JOIN employees e ON e.id = c.employee_id
      LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR c.status = :status)
        AND (:from_date IS NULL OR c.start_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR c.start_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR c.code ILIKE '%' || :q || '%' OR e.code ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%')
      ORDER BY c.end_date NULLS LAST, c.created_at DESC
  - id: contract_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"

toolbar:
  - id: add_contract_btn
    label: '+ Thêm hợp đồng'
    variant: primary
    permission: hr.write
    action: add_contract

components:
  - type: ListToolbar
    source: contracts
    filter_field: q
    search: { label: Tìm kiếm hợp đồng, placeholder: 'Tìm mã hợp đồng, mã hoặc tên nhân viên...' }
    date_range: { from_field: from_date, to_field: to_date, from_label: 'Từ ngày hiệu lực', to_label: 'Đến ngày hiệu lực', presets: [today, week, month, quarter, year, all] }
    actions: [{ id: contracts.export, label: 'Xuất CSV', icon: download }]
  - type: StatusTabs
    source: contracts
    filter_field: status
    variant: contained
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Hiệu lực }
      - { id: Expiring, label: Sắp hết hạn }
      - { id: Expired, label: Hết hạn }
  - type: DataGrid
    source: contracts
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: Không có hợp đồng, description: Thử thay đổi bộ lọc hoặc tạo hợp đồng mới. }
    columns:
      - { field: id, label: Mã HT, sortable: true }
      - { field: code, label: Hợp đồng }
      - { field: employee_code, label: Nhân viên, type: PrimaryEntityCell, secondary: employee_name }
      - { field: contract_type_label, label: Loại hợp đồng }
      - { field: start_date, label: Hiệu lực từ }
      - { field: end_date, label: Hiệu lực đến }
      - { field: base_salary, label: Lương cơ bản, align: right }
      - field: status_label
        label: Trạng thái
        type: StatusChip
        colors: { Hiệu lực: green, Sắp hết hạn: amber, Hết hạn: red, Đã chấm dứt: blue }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_contract, label: Chi tiết, variant: primary, permission: hr.read }
          - { id: edit_contract, label: Sửa, variant: ghost, permission: hr.write }
          - { id: delete_contract, label: Xóa, variant: danger, permission: hr.write }

actions:
  - { id: view_contract, type: navigate, permission: hr.read, navigate_to: /hr/contracts/detail, params: { id: '{row.id}' } }
  - id: add_contract
    type: form
    permission: hr.write
    title: Thêm hợp đồng
    table: employment_contracts
    operation: insert
    refresh: [contracts]
    fields:
      - { field: code, label: Mã hợp đồng, type: text, required: true }
      - { field: employee_id, label: Nhân viên, type: select, options_source: contract_employee_lookup, required: true }
      - { field: contract_type, label: Loại hợp đồng, type: select, options: [{ id: Probation, label: Thử việc }, { id: FixedTerm, label: Xác định thời hạn }, { id: Indefinite, label: Không xác định thời hạn }], default: FixedTerm }
      - { field: start_date, label: Hiệu lực từ, type: date, required: true }
      - { field: end_date, label: Hiệu lực đến, type: date }
      - { field: base_salary, label: Lương cơ bản, type: money, currency: VND, default: 0 }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hiệu lực }, { id: Expiring, label: Sắp hết hạn }, { id: Expired, label: Hết hạn }, { id: Terminated, label: Đã chấm dứt }], default: Active }
  - id: edit_contract
    type: form
    permission: hr.write
    title: Cập nhật hợp đồng
    table: employment_contracts
    operation: update
    prefill: row
    refresh: [contracts]
    fields:
      - { field: code, label: Mã hợp đồng, type: text, required: true }
      - { field: employee_id, label: Nhân viên, type: select, options_source: contract_employee_lookup, required: true }
      - { field: contract_type, label: Loại hợp đồng, type: select, options: [{ id: Probation, label: Thử việc }, { id: FixedTerm, label: Xác định thời hạn }, { id: Indefinite, label: Không xác định thời hạn }] }
      - { field: start_date, label: Hiệu lực từ, type: date, required: true }
      - { field: end_date, label: Hiệu lực đến, type: date }
      - { field: base_salary, label: Lương cơ bản, type: money, currency: VND }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hiệu lực }, { id: Expiring, label: Sắp hết hạn }, { id: Expired, label: Hết hạn }, { id: Terminated, label: Đã chấm dứt }] }
  - id: delete_contract
    type: delete
    permission: hr.write
    confirm: 'Xóa hợp đồng {{row.code}}?'
    table: employment_contracts
    refresh: [contracts]
