title: Chi tiết phương tiện
page: { id: vehicle-detail, auth: { require: [fleet.read] } }
datasources:
  - id: vehicle_detail
    single: true
    permission: fleet.read
    query: |
      SELECT t.id, t.plate, t.model, t.type, t.status, t.capacity_kg, t.mileage, t.last_service, t.next_service,
        b.name AS branch_name, d.name AS driver_name, d.license_number,
        CASE WHEN t.status = 'Out of Service' THEN 'Ngưng hoạt động' WHEN t.status = 'Maintenance' THEN 'Bảo dưỡng' ELSE 'Sẵn sàng' END AS status_label
      FROM trucks t LEFT JOIN branches b ON b.id = t.branch_id LEFT JOIN drivers d ON d.id = t.driver_id WHERE t.id = :id
  - id: vehicle_maintenance
    single: false
    permission: fleet.read
    query: "SELECT id, service_type, status, CAST(scheduled_date AS VARCHAR) AS scheduled_date, CAST(completed_date AS VARCHAR) AS completed_date, cost, notes FROM maintenance WHERE truck_id = :id ORDER BY scheduled_date DESC"
  - id: vehicle_trips
    single: false
    permission: fleet.read
    query: "SELECT id, trip_number, origin, destination, status, CAST(departure_time AS VARCHAR) AS departure_time FROM trips WHERE truck_id = :id ORDER BY departure_time DESC"
components:
  - { type: DocumentSummary, source: vehicle_detail, title_field: plate, subtitle_field: model, status_field: status_label, status_colors: { 'Sẵn sàng': green, 'Bảo dưỡng': amber, 'Ngưng hoạt động': red }, columns: [{ field: type, label: Loại xe }, { field: branch_name, label: Chi nhánh }, { field: capacity_kg, label: Tải trọng }, { field: mileage, label: Số km }, { field: last_service, label: Bảo dưỡng gần nhất }, { field: next_service, label: Bảo dưỡng kế tiếp }, { field: driver_name, label: Tài xế phụ trách }, { field: license_number, label: Giấy phép }] }
  - type: DataGrid
    source: vehicle_maintenance
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có lịch bảo dưỡng }
    columns: [{ field: service_type, label: Hạng mục }, { field: status, label: Trạng thái }, { field: scheduled_date, label: Dự kiến }, { field: completed_date, label: Hoàn thành }, { field: cost, label: Chi phí, align: right }, { field: notes, label: Ghi chú }]
  - type: DataGrid
    source: vehicle_trips
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có chuyến xe }
    columns: [{ field: trip_number, label: Chuyến }, { field: origin, label: Điểm đi }, { field: destination, label: Điểm đến }, { field: departure_time, label: Khởi hành }, { field: status, label: Trạng thái }]
toolbar:
  - { id: back_vehicles, label: '← Danh sách phương tiện', variant: secondary, action: back_vehicles }
actions:
  - { id: back_vehicles, type: navigate, navigate_to: /vehicles }
