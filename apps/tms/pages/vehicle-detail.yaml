title: Chi tiết phương tiện
page: { id: vehicle-detail, breadcrumb: [Quản lý, Phương tiện, Chi tiết], auth: { require: [fleet.read] } }
datasources:
  - id: vehicle_detail
    single: true
    permission: fleet.read
    query: |
      SELECT t.id, t.plate, t.model, t.type, t.status, t.capacity_kg, t.mileage, t.last_service, t.next_service,
        b.name AS branch_name, d.name AS driver_name, d.license_number,
        CASE WHEN t.status = 'Out of Service' THEN 'Ngưng hoạt động' WHEN t.status = 'Maintenance' THEN 'Bảo dưỡng' ELSE 'Sẵn sàng' END AS status_label
      FROM trucks t LEFT JOIN branches b ON b.id = t.branch_id LEFT JOIN drivers d ON d.id = t.driver_id
      WHERE t.id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)
  - id: vehicle_maintenance
    single: false
    permission: fleet.read
    query: "SELECT m.id, m.service_type, m.status, CAST(m.scheduled_date AS VARCHAR) AS scheduled_date, CAST(m.completed_date AS VARCHAR) AS completed_date, m.cost, m.notes FROM maintenance m JOIN trucks t ON t.id = m.truck_id WHERE m.truck_id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY m.scheduled_date DESC"
  - id: vehicle_trips
    single: false
    permission: fleet.read
    query: "SELECT tr.id, tr.trip_number, tr.origin, tr.destination, tr.status, CAST(tr.departure_time AS VARCHAR) AS departure_time FROM trips tr JOIN trucks t ON t.id = tr.truck_id WHERE tr.truck_id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY tr.departure_time DESC"
  - id: vehicle_detail_branch_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
  - id: vehicle_detail_type_lookup
    single: false
    permission: fleet.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'vehicle_type' AND status = 'Active' UNION SELECT DISTINCT type AS value, type AS label FROM trucks WHERE type IS NOT NULL AND type <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
  - id: vehicle_detail_driver_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM drivers WHERE status = 'Active' ORDER BY name"
components:
  - { type: DocumentSummary, source: vehicle_detail, title_field: plate, subtitle_field: model, status_field: status_label, status_colors: { 'Sẵn sàng': green, 'Bảo dưỡng': amber, 'Ngưng hoạt động': red }, columns: [{ field: type, label: Loại xe }, { field: branch_name, label: Chi nhánh }, { field: capacity_kg, label: Tải trọng }, { field: mileage, label: Số km }, { field: last_service, label: Bảo dưỡng gần nhất }, { field: next_service, label: Bảo dưỡng kế tiếp }, { field: driver_name, label: Tài xế phụ trách }, { field: license_number, label: Giấy phép }] }
  - type: DataGrid
    source: vehicle_maintenance
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có lịch bảo dưỡng }
    columns: [{ field: service_type, label: Hạng mục }, { field: status, label: Trạng thái }, { field: scheduled_date, label: Dự kiến }, { field: completed_date, label: Hoàn thành }, { field: cost, label: Chi phí, align: right }, { field: notes, label: Ghi chú }]
  - type: DataGrid
    source: vehicle_trips
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có chuyến xe }
    columns: [{ field: trip_number, label: Chuyến }, { field: origin, label: Điểm đi }, { field: destination, label: Điểm đến }, { field: departure_time, label: Khởi hành }, { field: status, label: Trạng thái }]
toolbar:
  - { id: back_vehicles, label: 'Danh sách phương tiện', icon: arrow-left, variant: secondary, action: back_vehicles }
  - { id: edit_vehicle_detail, label: Sửa phương tiện, variant: primary, permission: fleet.write, action: edit_vehicle_detail }
actions:
  - { id: back_vehicles, type: navigate, navigate_to: /vehicles }
  - id: edit_vehicle_detail
    type: form
    permission: fleet.write
    title: Cập nhật phương tiện
    table: trucks
    operation: update
    prefill: source
    prefill_source: vehicle_detail
    refresh: [vehicle_detail, vehicle_maintenance, vehicle_trips]
    fields:
      - { field: plate, label: Biển số / số hiệu, type: text, required: true }
      - { field: model, label: Hãng / mẫu xe, type: text, required: true }
      - { field: type, label: Loại phương tiện, type: select, options_source: vehicle_detail_type_lookup }
      - { field: branch_id, label: Chi nhánh, type: select, options_source: vehicle_detail_branch_lookup }
      - { field: driver_id, label: Tài xế phụ trách, type: select, options_source: vehicle_detail_driver_lookup }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Sẵn sàng }, { id: Maintenance, label: Bảo dưỡng }, { id: 'Out of Service', label: Ngưng hoạt động }] }
      - { field: capacity_kg, label: Tải trọng (kg), type: number }
      - { field: mileage, label: Số km, type: number }
      - { field: last_service, label: Bảo dưỡng gần nhất, type: date }
      - { field: next_service, label: Bảo dưỡng kế tiếp, type: date }
      - { field: notes, label: Ghi chú, type: textarea }
