title: Địa điểm

page:
  id: locations
  breadcrumb: [Danh mục, Địa điểm]
  auth:
    require: [dispatch.read]

datasources:
  - id: locations
    single: false
    permission: dispatch.read
    query: |
      SELECT l.*, a.code AS area_code, a.name AS area_name,
        CASE l.location_type WHEN 'Port' THEN 'Cảng' WHEN 'Warehouse' THEN 'Kho / bãi' WHEN 'Depot' THEN 'Depot' WHEN 'Customer' THEN 'Khách hàng' ELSE 'Khác' END AS location_type_label,
        CASE l.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label
      FROM locations l
      LEFT JOIN areas a ON a.id = l.area_id
      WHERE (:view_scope = 'all' OR l.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR l.status = :status)
        AND (:q IS NULL OR l.code ILIKE '%' || :q || '%' OR l.name ILIKE '%' || :q || '%' OR l.city ILIKE '%' || :q || '%' OR l.address ILIKE '%' || :q || '%')
      ORDER BY l.created_at DESC, l.name
  - id: area_lookup
    single: false
    permission: dispatch.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM areas ORDER BY status DESC, name"

toolbar:
  - id: add_location_btn
    label: '+ Thêm địa điểm'
    variant: primary
    permission: dispatch.write
    action: add_location

components:
  - type: ListToolbar
    source: locations
    filter_field: q
    search: { label: Tìm kiếm địa điểm, placeholder: 'Tìm mã, tên, thành phố hoặc địa chỉ...' }
    actions: [{ id: locations.export, label: 'Xuất CSV', icon: download }]
  - type: StatusTabs
    source: locations
    filter_field: status
    show_counts: false
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Hoạt động }
      - { id: Inactive, label: Ngưng hoạt động }
  - type: DataGrid
    source: locations
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: Không có địa điểm, description: Thử thay đổi bộ lọc hoặc tạo địa điểm mới. }
    columns:
      - { field: id, label: Mã HT, sortable: true }
      - { field: code, label: Mã / tên, type: PrimaryEntityCell, secondary: name }
      - { field: location_type_label, label: Loại }
      - { field: address, label: Địa chỉ, type: PrimaryEntityCell, secondary: city }
      - { field: area_code, label: Khu vực, type: PrimaryEntityCell, secondary: area_name }
      - field: status_label
        label: Trạng thái
        type: StatusChip
        colors: { Hoạt động: green, Ngưng hoạt động: red }
      - { field: created_at, label: Ngày giờ tạo }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_location, label: Sửa, variant: ghost, permission: dispatch.write }
          - { id: delete_location, label: Xóa, variant: danger, permission: dispatch.write }

actions:
  - id: add_location
    type: form
    permission: dispatch.write
    title: Thêm địa điểm
    table: locations
    operation: insert
    refresh: [locations]
    fields:
      - { field: code, label: Mã địa điểm, type: text, required: true }
      - { field: name, label: Tên địa điểm, type: text, required: true }
      - { field: location_type, label: Loại địa điểm, type: select, options: [{ id: Port, label: Cảng }, { id: Warehouse, label: Kho }, { id: Depot, label: Depot }, { id: Customer, label: Khách hàng }, { id: Other, label: Khác }], default: Other }
      - { field: address, label: Địa chỉ, type: text }
      - { field: city, label: Thành phố, type: text }
      - { field: area_id, label: Khu vực, type: select, options_source: area_lookup }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }], default: Active }
  - id: edit_location
    type: form
    permission: dispatch.write
    title: Cập nhật địa điểm
    table: locations
    operation: update
    prefill: row
    refresh: [locations]
    fields:
      - { field: code, label: Mã địa điểm, type: text, required: true }
      - { field: name, label: Tên địa điểm, type: text, required: true }
      - { field: location_type, label: Loại địa điểm, type: select, options: [{ id: Port, label: Cảng }, { id: Warehouse, label: Kho }, { id: Depot, label: Depot }, { id: Customer, label: Khách hàng }, { id: Other, label: Khác }] }
      - { field: address, label: Địa chỉ, type: text }
      - { field: city, label: Thành phố, type: text }
      - { field: area_id, label: Khu vực, type: select, options_source: area_lookup }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }] }
  - id: delete_location
    type: delete
    permission: dispatch.write
    confirm: 'Xóa địa điểm {{row.name}}?'
    table: locations
    refresh: [locations]
