title: Loại hình vận chuyển
page: { id: system-shipment-types, breadcrumb: [Hệ thống, Loại hình vận chuyển], auth: { require: [system.read] } }
datasources:
  - { id: shipment_types, single: false, permission: system.read, query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'shipment_type' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code" }
toolbar: [{ id: add_shipment_type, label: '+ Thêm loại hình', variant: primary, permission: system.write, action: add_shipment_type }]
components: [{ type: ListToolbar, source: shipment_types, filter_field: q, search: { label: Tìm loại hình, placeholder: 'Tìm mã hoặc tên...' }, actions: [{ id: shipment_types.export, label: 'Xuất CSV', icon: download }] }, { type: StatusTabs, source: shipment_types, filter_field: status, tabs: [{ id: '', label: Tất cả }, { id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }, { type: DataGrid, source: shipment_types, page_size: 20, column_chooser: true, row_key: id, empty_state: { title: Chưa có loại hình vận chuyển }, columns: [{ field: code, label: Mã }, { field: name, label: Loại hình, type: PrimaryEntityCell, secondary: description }, { field: config_value, label: Giá trị }, { field: status, label: Trạng thái, type: StatusChip, colors: { Active: green, Inactive: red } }, { field: actions, label: '', sortable: false, actions: [{ id: edit_shipment_type, label: Sửa, variant: ghost, permission: system.write }, { id: delete_shipment_type, label: Xóa, variant: danger, permission: system.write }] }] }]
actions:
  - { id: add_shipment_type, type: form, permission: system.write, title: Thêm loại hình vận chuyển, table: system_configs, scope: shipment_type, operation: insert, refresh: [shipment_types], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Giá trị, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }], default: Active }] }
  - { id: edit_shipment_type, type: form, permission: system.write, title: Cập nhật loại hình, table: system_configs, scope: shipment_type, operation: update, prefill: row, refresh: [shipment_types], fields: [{ field: code, label: Mã, type: text, required: true }, { field: name, label: Tên, type: text, required: true }, { field: config_value, label: Giá trị, type: text }, { field: description, label: Mô tả, type: textarea }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }] }
  - { id: delete_shipment_type, type: delete, permission: system.write, table: system_configs, scope: shipment_type, confirm: 'Xóa loại hình {{row.name}}?', refresh: [shipment_types] }
