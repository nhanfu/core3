title: Tổng quan phương tiện

page:
  id: fleet
  auth:
    require: [fleet.read]

datasources:
  - id: trucks_kpis
    single: true
    permission: fleet.read
    query: |
      SELECT COUNT(*) AS total,
        COUNT(*) FILTER (WHERE status = 'Active') AS active,
        COUNT(*) FILTER (WHERE status = 'Maintenance') AS maintenance,
        COUNT(*) FILTER (WHERE status = 'Out of Service') AS out_of_service,
        COUNT(*) FILTER (WHERE next_service IS NOT NULL AND next_service < CURRENT_DATE) AS overdue_service
      FROM trucks
      WHERE (:view_scope = 'all' OR branch_id = :current_branch_id)
  - id: trucks
    single: false
    permission: fleet.read
    query: |
      SELECT t.*, d.name AS driver_name, d.phone AS driver_phone,
        (t.next_service IS NOT NULL AND t.next_service < CURRENT_DATE) AS overdue_next
      FROM trucks t LEFT JOIN drivers d ON d.id = t.driver_id
      WHERE (:view_scope = 'all' OR t.branch_id = :current_branch_id)
        AND (:status IS NULL OR t.status = :status)
        AND (:type IS NULL OR t.type = :type)
        AND (:q IS NULL OR t.plate ILIKE '%' || :q || '%' OR t.model ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%')
      ORDER BY t.plate
  - id: fleet_driver_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM drivers WHERE status = 'Active' AND (:view_scope = 'all' OR assigned_truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id)) UNION SELECT DISTINCT d.id AS value, d.name AS label FROM trucks t JOIN drivers d ON d.id = t.driver_id WHERE t.driver_id IS NOT NULL AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY label"
  - id: fleet_type_lookup
    single: false
    permission: fleet.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'vehicle_type' AND status = 'Active' UNION SELECT DISTINCT type AS value, type AS label FROM trucks WHERE type IS NOT NULL AND type <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - id: add_truck_btn
    label: "+ Thêm phương tiện"
    variant: primary
    permission: fleet.write
    action: add_truck

filters:
  source: trucks
  all_label: Tất cả
  clear_label: Xóa bộ lọc
  fields:
    - field: status
      label: Trạng thái
      type: select
      options: [{ id: Active, label: Sẵn sàng }, { id: Maintenance, label: Bảo dưỡng }, { id: 'Out of Service', label: Ngưng hoạt động }]
    - field: type
      label: Loại phương tiện
      type: select
      options_source: fleet_type_lookup
    - field: q
      label: Tìm kiếm
      type: search
      placeholder: "Biển số, mẫu xe hoặc tài xế..."

components:
  - type: StatRow
    source: trucks_kpis
    stats:
      - label: Tổng phương tiện
        field: total
        color: blue
      - label: Sẵn sàng
        field: active
        color: green
      - label: Đang bảo dưỡng
        field: maintenance
        color: amber
      - label: Ngưng hoạt động
        field: out_of_service
        color: red
      - label: Quá hạn bảo dưỡng
        field: overdue_service
        color: amber

  - type: GridView
    source: trucks
    page_size: 8
    empty_state: { title: Không có phương tiện, description: Thử thay đổi bộ lọc hoặc thêm phương tiện mới. }
    columns:
      - type: TextCell
        field: plate
        label: Biển số
        secondary: model
      - type: TextCell
        field: driver_name
        label: Tài xế
        secondary: driver_phone
      - type: BadgeCell
        field: status
        label: Trạng thái
        colors:
          Active: green
          Maintenance: amber
          Out of Service: red
      - type: BadgeCell
        field: type
        label: Loại phương tiện
        colors:
          Semi: indigo
          Box Truck: blue
          Flatbed: purple
          Refrigerated: cyan
          Tanker: teal
      - type: NumberCell
        field: mileage
        label: Số km
        format: "#,###"
      - type: DateCell
        field: last_service
        label: Bảo dưỡng gần nhất
        format: relative
      - type: DateCell
        field: next_service
        label: Bảo dưỡng tiếp theo
        format: relative
        overdueField: overdue_next
      - type: ActionCell
        label: ""
        actions:
          - id: edit_truck
            label: Sửa
            variant: ghost
            permission: fleet.write
          - id: delete_truck
            label: Xóa
            variant: danger
            permission: fleet.write

actions:
  - id: add_truck
    type: form
    permission: fleet.write
    title: Thêm phương tiện
    table: trucks
    operation: insert
    prefill: null
    refresh: [trucks, trucks_kpis]
    fields:
      - field: plate
        label: Biển số
        type: text
        required: true
      - field: model
        label: Mẫu xe
        type: text
        required: false
      - field: type
        label: Loại phương tiện
        type: select
        required: false
        options_source: fleet_type_lookup
      - field: status
        label: Trạng thái
        type: select
        required: false
        options: [{ id: Active, label: Sẵn sàng }, { id: Maintenance, label: Bảo dưỡng }, { id: 'Out of Service', label: Ngưng hoạt động }]
        default: Active
      - field: mileage
        label: Số km
        type: number
        required: false
        default: 0
      - field: driver_id
        label: Mã tài xế
        type: select
        options_source: fleet_driver_lookup
        required: false
      - field: last_service
        label: Bảo dưỡng gần nhất
        type: date
        required: false
      - field: next_service
        label: Bảo dưỡng tiếp theo
        type: date
        required: false
      - field: notes
        label: Ghi chú
        type: textarea
        required: false

  - id: edit_truck
    type: form
    permission: fleet.write
    title: Cập nhật phương tiện
    table: trucks
    operation: update
    prefill: row
    refresh: [trucks, trucks_kpis]
    fields:
      - field: plate
        label: Biển số
        type: text
        required: true
      - field: model
        label: Mẫu xe
        type: text
        required: false
      - field: type
        label: Loại phương tiện
        type: select
        required: false
        options_source: fleet_type_lookup
      - field: status
        label: Trạng thái
        type: select
        required: false
        options: [{ id: Active, label: Sẵn sàng }, { id: Maintenance, label: Bảo dưỡng }, { id: 'Out of Service', label: Ngưng hoạt động }]
        default: Active
      - field: mileage
        label: Số km
        type: number
        required: false
        default: 0
      - field: driver_id
        label: Mã tài xế
        type: select
        options_source: fleet_driver_lookup
        required: false
      - field: last_service
        label: Bảo dưỡng gần nhất
        type: date
        required: false
      - field: next_service
        label: Bảo dưỡng tiếp theo
        type: date
        required: false
      - field: notes
        label: Ghi chú
        type: textarea
        required: false

  - id: delete_truck
    type: delete
    permission: fleet.write
    confirm: "Xóa phương tiện {{row.plate}}?"
    table: trucks
    refresh: [trucks, trucks_kpis]
