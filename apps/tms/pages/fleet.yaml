title: Fleet Overview

page:
  id: fleet
  auth:
    require: [fleet.read]

datasources:
  - id: trucks_kpis
    single: true
    permission: fleet.read
    query: |
      SELECT COUNT(*) AS total,
        COUNT(*) FILTER (WHERE status = 'Active') AS active,
        COUNT(*) FILTER (WHERE status = 'Maintenance') AS maintenance,
        COUNT(*) FILTER (WHERE status = 'Out of Service') AS out_of_service,
        COUNT(*) FILTER (WHERE next_service IS NOT NULL AND next_service < CURRENT_DATE) AS overdue_service
      FROM trucks
  - id: trucks
    single: false
    permission: fleet.read
    query: |
      SELECT t.*, d.name AS driver_name, d.phone AS driver_phone,
        (t.next_service IS NOT NULL AND t.next_service < CURRENT_DATE) AS overdue_next
      FROM trucks t LEFT JOIN drivers d ON d.id = t.driver_id
      WHERE (:status IS NULL OR t.status = :status)
        AND (:type IS NULL OR t.type = :type)
        AND (:q IS NULL OR t.plate ILIKE '%' || :q || '%' OR t.model ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%')
      ORDER BY t.plate
  - id: fleet_driver_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM drivers WHERE status = 'Active' UNION SELECT DISTINCT d.id AS value, d.name AS label FROM trucks t JOIN drivers d ON d.id = t.driver_id WHERE t.driver_id IS NOT NULL ORDER BY label"
  - id: fleet_type_lookup
    single: false
    permission: fleet.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'vehicle_type' AND status = 'Active' UNION SELECT DISTINCT type AS value, type AS label FROM trucks WHERE type IS NOT NULL AND type <> '' ORDER BY label"

toolbar:
  - id: add_truck_btn
    label: "+ Add Truck"
    variant: primary
    permission: fleet.write
    action: add_truck

filters:
  source: trucks
  fields:
    - field: status
      label: Status
      type: select
      options: [Active, Maintenance, Out of Service]
    - field: type
      label: Type
      type: select
      options_source: fleet_type_lookup
    - field: q
      label: Search
      type: search
      placeholder: "Plate, model or driver..."

components:
  - type: StatRow
    source: trucks_kpis
    stats:
      - label: Total Trucks
        field: total
        color: blue
      - label: Active
        field: active
        color: green
      - label: In Maintenance
        field: maintenance
        color: amber
      - label: Out of Service
        field: out_of_service
        color: red
      - label: Service Overdue
        field: overdue_service
        color: amber

  - type: GridView
    source: trucks
    page_size: 8
    columns:
      - type: TextCell
        field: plate
        label: Plate
        secondary: model
      - type: TextCell
        field: driver_name
        label: Driver
        secondary: driver_phone
      - type: BadgeCell
        field: status
        label: Status
        colors:
          Active: green
          Maintenance: amber
          Out of Service: red
      - type: BadgeCell
        field: type
        label: Type
        colors:
          Semi: indigo
          Box Truck: blue
          Flatbed: purple
          Refrigerated: cyan
          Tanker: teal
      - type: NumberCell
        field: mileage
        label: Mileage
        format: "#,###"
      - type: DateCell
        field: last_service
        label: Last Service
        format: relative
      - type: DateCell
        field: next_service
        label: Next Service
        format: relative
        overdueField: overdue_next
      - type: ActionCell
        label: ""
        actions:
          - id: edit_truck
            label: Edit
            variant: ghost
            show_if: "user.permissions.includes('fleet.write')"
          - id: delete_truck
            label: Delete
            variant: danger
            show_if: "user.permissions.includes('fleet.write')"

actions:
  - id: add_truck
    type: form
    title: Add Truck
    table: trucks
    operation: insert
    prefill: null
    refresh: [trucks, trucks_kpis]
    fields:
      - field: plate
        label: Plate
        type: text
        required: true
      - field: model
        label: Model
        type: text
        required: false
      - field: type
        label: Type
        type: select
        required: false
        options_source: fleet_type_lookup
      - field: status
        label: Status
        type: select
        required: false
        options: [Active, Maintenance, Out of Service]
        default: Active
      - field: mileage
        label: Mileage
        type: number
        required: false
        default: 0
      - field: driver_id
        label: Driver ID
        type: select
        options_source: fleet_driver_lookup
        required: false
      - field: last_service
        label: Last Service
        type: date
        required: false
      - field: next_service
        label: Next Service
        type: date
        required: false
      - field: notes
        label: Notes
        type: textarea
        required: false

  - id: edit_truck
    type: form
    title: Edit Truck
    table: trucks
    operation: update
    prefill: row
    refresh: [trucks, trucks_kpis]
    fields:
      - field: plate
        label: Plate
        type: text
        required: true
      - field: model
        label: Model
        type: text
        required: false
      - field: type
        label: Type
        type: select
        required: false
        options_source: fleet_type_lookup
      - field: status
        label: Status
        type: select
        required: false
        options: [Active, Maintenance, Out of Service]
        default: Active
      - field: mileage
        label: Mileage
        type: number
        required: false
        default: 0
      - field: driver_id
        label: Driver ID
        type: select
        options_source: fleet_driver_lookup
        required: false
      - field: last_service
        label: Last Service
        type: date
        required: false
      - field: next_service
        label: Next Service
        type: date
        required: false
      - field: notes
        label: Notes
        type: textarea
        required: false

  - id: delete_truck
    type: delete
    confirm: "Delete truck {{row.plate}}?"
    table: trucks
    refresh: [trucks, trucks_kpis]
