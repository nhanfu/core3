title: Đơn vị tính

page:
  id: catalog-units
  auth:
    require: [catalog.read]

datasources:
  - id: units
    single: false
    permission: catalog.read
    query: |
      SELECT id, code, name, description, status, sort_order, created_at
      FROM master_data
      WHERE kind = 'unit'
        AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%')
      ORDER BY sort_order, code

toolbar:
  - { id: add_unit_btn, label: '+ Thêm đơn vị tính', variant: primary, permission: catalog.write, action: add_unit }

components:
  - type: ListToolbar
    source: units
    filter_field: q
    search: { label: Tìm kiếm đơn vị tính, placeholder: 'Tìm mã, tên hoặc mô tả...' }
  - type: StatusTabs
    source: units
    filter_field: status
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Đang sử dụng }
      - { id: Inactive, label: Ngưng sử dụng }
  - type: DataGrid
    source: units
    page_size: 20
    row_key: id
    selectable: true
    empty_state: { title: Không có đơn vị tính, description: Tạo đơn vị tính đầu tiên để sử dụng trong biểu mẫu. }
    columns:
      - { field: code, label: Mã, sortable: true }
      - { field: name, label: Đơn vị tính, type: PrimaryEntityCell, secondary: description }
      - { field: sort_order, label: Thứ tự, align: right }
      - field: status
        label: Trạng thái
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Ngày tạo }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_unit, label: Sửa, variant: ghost }
          - { id: delete_unit, label: Xóa, variant: danger }

actions:
  - id: add_unit
    type: form
    title: Thêm đơn vị tính
    table: master_data
    scope: unit
    operation: insert
    refresh: [units]
    fields:
      - { field: code, label: Mã, type: text, required: true }
      - { field: name, label: Đơn vị tính, type: text, required: true }
      - { field: description, label: Mô tả, type: textarea }
      - { field: sort_order, label: Thứ tự, type: number, default: 0 }
      - { field: status, label: Trạng thái, type: select, options: [Active, Inactive], default: Active }
  - id: edit_unit
    type: form
    title: Cập nhật đơn vị tính
    table: master_data
    scope: unit
    operation: update
    prefill: row
    refresh: [units]
    fields:
      - { field: code, label: Mã, type: text, required: true }
      - { field: name, label: Đơn vị tính, type: text, required: true }
      - { field: description, label: Mô tả, type: textarea }
      - { field: sort_order, label: Thứ tự, type: number }
      - { field: status, label: Trạng thái, type: select, options: [Active, Inactive] }
  - { id: delete_unit, type: delete, table: master_data, scope: unit, confirm: 'Xóa đơn vị tính {{row.name}}?', refresh: [units] }
