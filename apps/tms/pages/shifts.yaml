title: Shift

page:
  id: shifts
  breadcrumb: [Human resources, Shift]
  auth:
    require: [hr.read]

datasources:
  - id: shifts
    single: false
    permission: hr.read
    query: |
      SELECT s.*, CASE s.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label
      FROM work_shifts s
      WHERE (NULLIF(:status, '') IS NULL OR s.status = :status)
        AND (:q IS NULL OR s.code ILIKE '%' || :q || '%' OR s.name ILIKE '%' || :q || '%')
      ORDER BY s.created_at DESC, s.name
  - id: shift_assignments
    single: false
    permission: hr.read
    query: |
      SELECT t.id, t.employee_id, e.code AS employee_code, e.name AS employee_name,
        CAST(t.work_date AS VARCHAR) AS work_date, t.shift_id, s.code AS shift_code,
        s.name AS shift_name, t.hours, t.status
      FROM timesheets t JOIN employees e ON e.id = t.employee_id
        LEFT JOIN work_shifts s ON s.id = t.shift_id
        LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (:from_date IS NULL OR t.work_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR t.work_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:assignment_q IS NULL OR e.code ILIKE '%' || :assignment_q || '%' OR e.name ILIKE '%' || :assignment_q || '%')
      ORDER BY t.work_date DESC, e.name
  - id: shift_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
  - id: shift_definition_lookup
    single: false
    permission: hr.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM work_shifts WHERE status = 'Active' ORDER BY name"

toolbar:
  - id: add_shift_btn
    label: '+ Add working shifts'
    variant: primary
    permission: hr.write
    action: add_shift
  - { id: add_shift_assignment_btn, label: '+ Split shifts', variant: secondary, permission: hr.write, action: add_shift_assignment }

components:
  - type: ListToolbar
    source: shifts
    filter_field: q
    search: { label: Search for shifts, placeholder: 'Find the code or name of the ca...' }
    actions: [{ id: shifts.export, label: 'Export CSV', icon: download }]
  - type: ListToolbar
    source: shift_assignments
    filter_sources: [shift_assignments]
    date_range: { from_field: from_date, to_field: to_date, from_label: 'From date', to_label: 'Come day', presets: [today, week, month, quarter, year, all] }
    filter_field: assignment_q
    search: { label: Find shift division, placeholder: 'Find staff...' }
    actions: [{ id: shift_assignments.export, label: 'Export CSV', icon: download }]
  - type: ScheduleGrid
    source: shift_assignments
    title: Shift schedule
    date_field: work_date
    resource_field: employee_code
    resource_label_field: employee_name
    title_field: shift_code
    subtitle_field: shift_name
    status_field: status
    empty_state: { title: There is no shift schedule yet, description: Try changing the time period or adding new shifts. }
  - type: StatusTabs
    source: shifts
    filter_field: status
    variant: contained
    tabs:
      - { id: '', label: All }
      - { id: Active, label: Work }
      - { id: Inactive, label: Shut down }
  - type: DataGrid
    source: shifts
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: There are no shifts, description: Try changing the filter or creating a new shift. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: code, label: Code/name, type: PrimaryEntityCell, secondary: name }
      - { field: start_time, label: Begin }
      - { field: end_time, label: End }
      - { field: break_minutes, label: Rest between shifts (minutes), align: right }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Work: green, Shut down: red }
      - { field: created_at, label: Creation date and time }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_shift, label: Fix, variant: ghost, permission: hr.write }
          - { id: delete_shift, label: Erase, variant: danger, permission: hr.write }
  - type: DataGrid
    source: shift_assignments
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: There are no shifts yet }
    columns: [{ field: employee_code, label: Staff, type: PrimaryEntityCell, secondary: employee_name }, { field: work_date, label: Day }, { field: shift_code, label: Ca, type: PrimaryEntityCell, secondary: shift_name }, { field: hours, label: Number of hours, align: right }, { field: status, label: Status }]
    selectable: true

actions:
  - id: add_shift_assignment
    type: form
    permission: hr.write
    title: Assign shifts to employees
    table: timesheets
    operation: insert
    refresh: [shift_assignments]
    fields: [{ field: employee_id, label: Staff, type: select, options_source: shift_employee_lookup, required: true }, { field: work_date, label: Shift division day, type: date, required: true }, { field: shift_id, label: Shift, type: select, options_source: shift_definition_lookup, required: true }, { field: hours, label: Number of hours, type: number, default: 8 }, { field: status, label: Status, type: select, options: [{ id: Present, label: Present }, { id: Leave, label: On leave }, { id: Absent, label: Absent }], default: Present }]
  - id: add_shift
    type: form
    permission: hr.write
    title: Add shifts
    table: work_shifts
    operation: insert
    refresh: [shifts]
    fields:
      - { field: code, label: Code ca, type: text, required: true }
      - { field: name, label: Name of singer, type: text, required: true }
      - { field: start_time, label: Start time, type: time, required: true }
      - { field: end_time, label: End time, type: time, required: true }
      - { field: break_minutes, label: Rest between shifts (minutes), type: number, default: 0 }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }
  - id: edit_shift
    type: form
    permission: hr.write
    title: Update work shifts
    table: work_shifts
    operation: update
    prefill: row
    refresh: [shifts]
    fields:
      - { field: code, label: Code ca, type: text, required: true }
      - { field: name, label: Name of singer, type: text, required: true }
      - { field: start_time, label: Start time, type: time, required: true }
      - { field: end_time, label: End time, type: time, required: true }
      - { field: break_minutes, label: Rest between shifts (minutes), type: number }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }
  - id: delete_shift
    type: delete
    permission: hr.write
    confirm: 'Delete shift {{row.name}}?'
    table: work_shifts
    refresh: [shifts]
