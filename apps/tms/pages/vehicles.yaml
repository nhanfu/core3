title: Phương tiện

page:
  id: vehicles
  breadcrumb: [Quản lý, Phương tiện]
  auth:
    require: [fleet.read]

datasources:
  - id: vehicles
    single: false
    permission: fleet.read
    query: |
      SELECT t.id, REPLACE(UPPER(t.id), 'TRUCK-', 'XE') AS system_code,
        t.plate, t.model, t.status, t.type AS vehicle_type,
        b.name AS owner_name, t.capacity_kg,
        CASE t.status
          WHEN 'Active' THEN 'Sẵn sàng'
          WHEN 'Maintenance' THEN 'Bảo dưỡng'
          WHEN 'Out of Service' THEN 'Ngưng hoạt động'
          ELSE t.status
        END AS availability,
        'Admin User' AS created_by, t.created_at
      FROM trucks t
      LEFT JOIN branches b ON b.id = t.branch_id
      WHERE (:status IS NULL OR t.status = :status)
        AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)
        AND (:q IS NULL OR t.plate ILIKE '%' || :q || '%' OR t.model ILIKE '%' || :q || '%' OR t.type ILIKE '%' || :q || '%')
      ORDER BY t.created_at DESC, t.plate
  - id: vehicle_branch_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
  - id: vehicle_type_lookup
    single: false
    permission: fleet.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'vehicle_type' AND status = 'Active' UNION SELECT DISTINCT type AS value, type AS label FROM trucks WHERE type IS NOT NULL AND type <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - id: add_vehicle_btn
    label: '+ Thêm phương tiện'
    variant: primary
    permission: fleet.write
    action: add_vehicle

components:
  - type: ListToolbar
    source: vehicles
    filter_field: q
    search:
      label: Tìm kiếm phương tiện
      placeholder: 'Tìm theo biển số / số hiệu, tên, hãng...'
    actions: [{ id: vehicles.export, label: '', title: 'Xuất CSV', icon: download }]
    advanced_filter: true
    help: true
  - type: StatusTabs
    source: vehicles
    filter_field: status
    show_counts: false
    variant: toggle
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Sẵn sàng }
      - { id: Maintenance, label: Bảo dưỡng }
      - { id: 'Out of Service', label: Ngưng hoạt động }
  - type: DataGrid
    source: vehicles
    page_size: 50
    page_size_options: [10, 25, 50, 100]
    row_numbers: true
    column_chooser: true
    row_key: id
    selectable: true
    empty_state:
      title: Không có phương tiện
      description: Thử thay đổi bộ lọc hoặc tạo phương tiện mới.
    columns:
      - field: system_code
        label: Mã HT
        sortable: true
      - field: plate
        label: Biển số / số hiệu
        type: PrimaryEntityCell
        secondary: model
      - field: vehicle_type
        label: Loại phương tiện
      - field: model
        label: Hãng
      - field: owner_name
        label: Nhà xe
      - field: capacity_kg
        label: Tải trọng
        type: WeightCell
        align: right
      - field: availability
        label: Trạng thái
        type: StatusChip
        colors:
          Sẵn sàng: green
          Bảo dưỡng: amber
          Ngưng hoạt động: red
      - field: created_by
        label: Người tạo
      - field: created_at
        label: Ngày giờ tạo
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - id: view_vehicle
            label: Chi tiết
            variant: primary
            permission: fleet.read
          - id: edit_vehicle
            label: Sửa
            variant: ghost
            permission: fleet.write
          - id: delete_vehicle
            label: Xóa
            variant: danger
            permission: fleet.write

actions:
  - { id: view_vehicle, type: navigate, permission: fleet.read, navigate_to: /vehicles/detail, params: { id: '{row.id}' } }
  - id: add_vehicle
    type: form
    permission: fleet.write
    title: Thêm phương tiện
    table: trucks
    operation: insert
    refresh: [vehicles]
    fields:
      - { field: plate, label: Biển số / số hiệu, type: text, required: true }
      - { field: model, label: Hãng / mẫu xe, type: text, required: true }
      - { field: type, label: Loại phương tiện, type: select, options_source: vehicle_type_lookup }
      - { field: branch_id, label: Chi nhánh, type: select, options_source: vehicle_branch_lookup }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Sẵn sàng }, { id: Maintenance, label: Bảo dưỡng }, { id: 'Out of Service', label: Ngưng hoạt động }], default: Active }
      - { field: capacity_kg, label: Tải trọng (kg), type: number, default: 0 }
      - { field: notes, label: Ghi chú, type: textarea }
  - id: edit_vehicle
    type: form
    permission: fleet.write
    title: Cập nhật phương tiện
    table: trucks
    operation: update
    prefill: row
    refresh: [vehicles]
    fields:
      - { field: plate, label: Biển số / số hiệu, type: text, required: true }
      - { field: model, label: Hãng / mẫu xe, type: text, required: true }
      - { field: type, label: Loại phương tiện, type: select, options_source: vehicle_type_lookup }
      - { field: branch_id, label: Chi nhánh, type: select, options_source: vehicle_branch_lookup }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Sẵn sàng }, { id: Maintenance, label: Bảo dưỡng }, { id: 'Out of Service', label: Ngưng hoạt động }] }
      - { field: capacity_kg, label: Tải trọng (kg), type: number }
      - { field: notes, label: Ghi chú, type: textarea }
  - id: delete_vehicle
    type: delete
    permission: fleet.write
    confirm: 'Xóa phương tiện {{row.plate}}?'
    table: trucks
    refresh: [vehicles]
