title: Tổng hợp CRM
page: { id: crm-dashboard, auth: { require: [crm.read] } }
datasources:
  - id: crm_kpis
    single: true
    permission: crm.read
    query: |
      SELECT (SELECT COUNT(*) FROM customers WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS customer_count,
        (SELECT COUNT(*) FROM employees WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS employee_count,
        (SELECT COUNT(*) FROM teams WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS team_count,
        (SELECT COUNT(*) FROM company_profiles) AS company_count,
        (SELECT COUNT(*) FROM customers WHERE stage = 'Lead' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS lead_count,
        (SELECT COUNT(*) FROM quotes WHERE status = 'Accepted' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS accepted_quote_count,
        (SELECT COALESCE(SUM(amount), 0) FROM quotes WHERE status = 'Accepted' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS accepted_quote_value,
        (SELECT COUNT(*) FROM orders o WHERE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) = 'Approved' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)) AS approved_order_count
  - id: crm_quote_pipeline
    single: false
    permission: crm.read
    query: |
      SELECT status AS label, COUNT(*) AS value FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) GROUP BY status ORDER BY status
  - id: crm_recent_quotes
    single: false
    permission: crm.read
    query: |
      SELECT code, title, customer_name, amount, status, CAST(valid_until AS VARCHAR) AS valid_until
      FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) ORDER BY created_at DESC
  - id: crm_customer_value
    single: false
    permission: crm.read
    query: |
      SELECT customer_name, COUNT(*) AS quote_count, COALESCE(SUM(amount), 0) AS quote_value
      FROM quotes
      WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      GROUP BY customer_name ORDER BY quote_value DESC, customer_name
  - id: crm_employee_breakdown
    single: false
    permission: crm.read
    query: |
      SELECT department, COUNT(*) AS employee_count,
        SUM(CASE WHEN status = 'Active' THEN 1 ELSE 0 END) AS active_count
      FROM employees
      WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      GROUP BY department ORDER BY employee_count DESC, department
components:
  - type: ListToolbar
    source: crm_recent_quotes
    filter_sources: [crm_kpis, crm_quote_pipeline, crm_recent_quotes, crm_customer_value, crm_employee_breakdown]
    date_range: { from_field: from_date, to_field: to_date, from_label: 'Từ ngày', to_label: 'Đến ngày', presets: [today, week, month, quarter, year, all] }
    actions: [{ id: crm_recent_quotes.export, label: 'Xuất CSV', icon: '↓' }]
  - type: StatRow
    source: crm_kpis
    stats:
      - { label: Khách hàng, field: customer_count, color: blue }
      - { label: Nhân viên, field: employee_count, color: indigo }
      - { label: Team, field: team_count, color: blue }
      - { label: Công ty, field: company_count, color: indigo }
      - { label: Khách tiềm năng, field: lead_count, color: amber }
      - { label: Báo giá chấp nhận, field: accepted_quote_count, color: green }
      - { label: Giá trị báo giá, field: accepted_quote_value, color: blue }
      - { label: Đơn đã duyệt, field: approved_order_count, color: indigo }
  - { type: Chart, source: crm_quote_pipeline, title: Phễu báo giá, label_field: label, value_field: value, width: 560, height: 240, color: '#2563eb' }
  - type: DataGrid
    source: crm_recent_quotes
    page_size: 10
    column_chooser: true
    row_key: code
    columns:
      - { field: code, label: Mã }
      - { field: title, label: Báo giá, type: PrimaryEntityCell, secondary: customer_name }
      - { field: amount, label: Giá trị, align: right }
      - { field: valid_until, label: Hiệu lực đến }
      - { field: status, label: Trạng thái, type: StatusChip, colors: { Draft: neutral, Sent: blue, Accepted: green } }
  - type: DataGrid
    source: crm_customer_value
    page_size: 10
    column_chooser: true
    row_key: customer_name
    empty_state: { title: Chưa có xếp hạng khách hàng }
    columns:
      - { field: customer_name, label: Khách hàng, sortable: true }
      - { field: quote_count, label: Số báo giá, align: right }
      - { field: quote_value, label: Giá trị báo giá, align: right }
  - type: DataGrid
    source: crm_employee_breakdown
    page_size: 10
    column_chooser: true
    row_key: department
    empty_state: { title: Chưa có phân bổ nhân sự }
    columns:
      - { field: department, label: Bộ phận, sortable: true }
      - { field: employee_count, label: Nhân sự, align: right }
      - { field: active_count, label: Đang hoạt động, align: right }
actions: []
