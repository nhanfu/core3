title: Chỉ tiêu KPI
page: { id: crm-kpi, auth: { require: [crm.read] } }
datasources:
  - id: crm_stage_kpis
    single: false
    permission: crm.read
    query: |
      SELECT stage AS metric, COUNT(*) AS customer_count,
        SUM(CASE WHEN status = 'Active' THEN 1 ELSE 0 END) AS active_count
      FROM customers GROUP BY stage ORDER BY stage
  - id: crm_quote_kpis
    single: false
    permission: crm.read
    query: |
      SELECT status AS label, COUNT(*) AS value FROM quotes GROUP BY status ORDER BY status
components:
  - { type: Chart, source: crm_quote_kpis, title: Báo giá theo trạng thái, label_field: label, value_field: value, width: 560, height: 240, color: '#0f766e' }
  - type: DataGrid
    source: crm_stage_kpis
    page_size: 20
    row_key: metric
    columns:
      - { field: metric, label: Giai đoạn }
      - { field: customer_count, label: Tổng khách hàng, align: right }
      - { field: active_count, label: Đang hoạt động, align: right }
actions: []
