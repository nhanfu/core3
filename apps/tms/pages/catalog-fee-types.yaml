title: Loại phí

page:
  id: catalog-fee-types
  breadcrumb: [Danh mục, Loại phí]
  auth:
    require: [catalog.read]

datasources:
  - id: fee_types
    single: false
    permission: catalog.read
    query: |
      SELECT id, code, name, description, status, sort_order, created_at
      FROM master_data
      WHERE kind = 'fee_type'
        AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%')
      ORDER BY sort_order, code

toolbar:
  - { id: add_fee_type_btn, label: '+ Thêm loại phí', variant: primary, permission: catalog.write, action: add_fee_type }

components:
  - type: ListToolbar
    source: fee_types
    filter_field: q
    search: { label: Tìm kiếm loại phí, placeholder: 'Tìm mã, tên hoặc mô tả...' }
    actions: [{ id: fee_types.export, label: 'Xuất CSV', icon: download }, { id: import_fee_types, label: 'Nhập CSV', icon: upload }]
  - type: StatusTabs
    source: fee_types
    filter_field: status
    variant: contained
    tabs:
      - { id: '', label: Tất cả }
      - { id: Active, label: Đang sử dụng }
      - { id: Inactive, label: Ngưng sử dụng }
  - type: DataGrid
    source: fee_types
    column_chooser: true
    page_size: 20
    row_key: id
    selectable: true
    empty_state: { title: Không có loại phí, description: Tạo loại phí đầu tiên để sử dụng trong báo giá và thanh toán. }
    columns:
      - { field: code, label: Mã, sortable: true }
      - { field: name, label: Loại phí, type: PrimaryEntityCell, secondary: description }
      - { field: sort_order, label: Thứ tự, align: right }
      - field: status
        label: Trạng thái
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Ngày tạo }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_fee_type, label: Sửa, variant: ghost, permission: catalog.write }
          - { id: delete_fee_type, label: Xóa, variant: danger, permission: catalog.write }

actions:
  - { id: import_fee_types, type: upload, permission: catalog.write, kind: master_data_import, scope: fee_type, refresh: [fee_types] }
  - id: add_fee_type
    type: form
    permission: catalog.write
    title: Thêm loại phí
    table: master_data
    scope: fee_type
    operation: insert
    refresh: [fee_types]
    fields:
      - { field: code, label: Mã, type: text, required: true }
      - { field: name, label: Loại phí, type: text, required: true }
      - { field: description, label: Mô tả, type: textarea }
      - { field: sort_order, label: Thứ tự, type: number, default: 0 }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }], default: Active }
  - id: edit_fee_type
    type: form
    permission: catalog.write
    title: Cập nhật loại phí
    table: master_data
    scope: fee_type
    operation: update
    prefill: row
    refresh: [fee_types]
    fields:
      - { field: code, label: Mã, type: text, required: true }
      - { field: name, label: Loại phí, type: text, required: true }
      - { field: description, label: Mô tả, type: textarea }
      - { field: sort_order, label: Thứ tự, type: number }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Đang dùng }, { id: Inactive, label: Ngưng dùng }] }
  - { id: delete_fee_type, type: delete, permission: catalog.write, table: master_data, scope: fee_type, confirm: 'Xóa loại phí {{row.name}}?', refresh: [fee_types] }
