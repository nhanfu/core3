title: Chi tiết hợp đồng
page: { id: contract-detail, breadcrumb: [Nhân sự, Hợp đồng, Chi tiết], auth: { require: [hr.read] } }
datasources:
  - id: contract_detail
    single: true
    permission: hr.read
    query: |
      SELECT c.id, c.code, c.employee_id, c.contract_type, c.start_date, c.end_date,
        c.base_salary, c.status, e.code AS employee_code, e.name AS employee_name,
        e.job_title, e.department,
        CASE c.contract_type WHEN 'Probation' THEN 'Thử việc' WHEN 'Indefinite' THEN 'Không xác định thời hạn' ELSE 'Xác định thời hạn' END AS contract_type_label,
        CASE c.status WHEN 'Expiring' THEN 'Sắp hết hạn' WHEN 'Expired' THEN 'Hết hạn' WHEN 'Terminated' THEN 'Đã chấm dứt' ELSE 'Hiệu lực' END AS status_label
      FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE c.id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)
  - id: contract_activity
    single: false
    permission: hr.read
    query: |
      SELECT actor_name, action, detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity WHERE resource = 'employment_contracts' AND resource_id = :id
        AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE c.id = :id AND d.branch_id = :current_branch_id))
      ORDER BY created_at DESC
  - id: contract_documents
    single: false
    permission: hr.read
    query: "SELECT id, contract_id, file_name, mime_type, size_bytes, CAST(created_at AS VARCHAR) AS created_at FROM contract_documents WHERE contract_id = :id AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE c.id = :id AND d.branch_id = :current_branch_id)) ORDER BY created_at DESC"
  - id: contract_detail_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
components:
  - { type: DocumentSummary, source: contract_detail, title_field: code, subtitle_field: employee_name, status_field: status_label, status_colors: { Hiệu lực: green, Sắp hết hạn: amber, Hết hạn: red, Đã chấm dứt: blue }, columns: [{ field: employee_code, label: Mã nhân viên }, { field: job_title, label: Chức danh }, { field: department, label: Phòng ban }, { field: contract_type_label, label: Loại hợp đồng }, { field: start_date, label: Hiệu lực từ }, { field: end_date, label: Hiệu lực đến }, { field: base_salary, label: Lương cơ bản }] }
  - type: ApprovalTimeline
    source: contract_activity
    title: Lịch sử hợp đồng
    empty_state: { title: Chưa có hoạt động hợp đồng }
    action_labels: { create: Đã tạo, update: Cập nhật, upload: Tải tài liệu lên, delete: Xóa }
    actor_field: actor_name
    action_field: action
    detail_field: detail
    timestamp_field: created_at
  - type: DataGrid
    source: contract_documents
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có tài liệu hợp đồng }
    columns: [{ field: file_name, label: Tên tệp }, { field: mime_type, label: Loại }, { field: size_bytes, label: Dung lượng, align: right }, { field: created_at, label: Ngày tải lên }, { field: actions, label: '', sortable: false, actions: [{ id: download_contract_document, label: Tải xuống, variant: ghost, permission: hr.read }] }]
toolbar:
  - { id: back_contracts, label: 'Danh sách hợp đồng', icon: arrow-left, variant: secondary, action: back_contracts }
  - { id: edit_contract_detail, label: Sửa hợp đồng, variant: primary, permission: hr.write, action: edit_contract_detail }
  - { id: upload_contract_document, label: '+ Tải tài liệu', variant: secondary, permission: hr.write, action: upload_contract_document }
actions:
  - { id: back_contracts, type: navigate, navigate_to: /hr/contracts }
  - { id: upload_contract_document, type: upload, permission: hr.write, kind: contract_document, params: { contract_id: '{state.id}' }, refresh: [contract_documents, contract_activity] }
  - { id: download_contract_document, type: download, permission: hr.read, kind: contract_document }
  - id: edit_contract_detail
    type: form
    permission: hr.write
    title: Cập nhật hợp đồng
    table: employment_contracts
    operation: update
    prefill: source
    prefill_source: contract_detail
    refresh: [contract_detail, contract_activity]
    fields: [{ field: code, label: Mã hợp đồng, type: text, required: true }, { field: employee_id, label: Nhân viên, type: select, options_source: contract_detail_employee_lookup, required: true }, { field: contract_type, label: Loại hợp đồng, type: select, options: [{ id: Probation, label: Thử việc }, { id: FixedTerm, label: Xác định thời hạn }, { id: Indefinite, label: Không xác định thời hạn }] }, { field: start_date, label: Hiệu lực từ, type: date, required: true }, { field: end_date, label: Hiệu lực đến, type: date }, { field: base_salary, label: Lương cơ bản, type: money, currency: VND }, { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hiệu lực }, { id: Expiring, label: Sắp hết hạn }, { id: Expired, label: Hết hạn }, { id: Terminated, label: Đã chấm dứt }] }]
