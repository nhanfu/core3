title: Chi tiết chi nhánh
page: { id: branch-detail, breadcrumb: [Tổ chức & phân quyền, Chi nhánh, Chi tiết], auth: { require: [settings.read] } }
datasources:
  - id: branch_detail
    single: true
    permission: settings.read
    query: "SELECT id, name, city, region, status FROM branches WHERE id = :id AND (:view_scope = 'all' OR id = :current_branch_id)"
  - id: branch_departments
    single: false
    permission: settings.read
    query: "SELECT d.id, d.code, d.name, d.status, COUNT(t.id) AS team_count FROM departments d LEFT JOIN teams t ON t.department_id = d.id WHERE d.branch_id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) GROUP BY d.id, d.code, d.name, d.status ORDER BY d.name"
  - id: branch_trucks
    single: false
    permission: settings.read
    query: "SELECT t.id, t.plate, t.type, t.status FROM trucks t WHERE t.branch_id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY t.plate"
  - id: branch_employees
    single: false
    permission: settings.read
    query: "SELECT e.id, e.code, e.name, e.job_title, e.status FROM employees e JOIN departments d ON e.department ILIKE '%' || replace(d.name, 'Phòng ', '') || '%' WHERE d.branch_id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
components:
  - { type: DocumentSummary, source: branch_detail, title_field: name, subtitle_field: city, status_field: status, columns: [{ field: region, label: Khu vực }] }
  - type: DataGrid
    source: branch_departments
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có phòng ban }
    columns: [{ field: code, label: Mã phòng ban }, { field: name, label: Phòng ban }, { field: team_count, label: Số team, align: right }, { field: status, label: Trạng thái }]
  - type: DataGrid
    source: branch_trucks
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có phương tiện }
    columns: [{ field: plate, label: Biển số }, { field: type, label: Loại xe }, { field: status, label: Trạng thái }]
  - type: DataGrid
    source: branch_employees
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: Chưa có nhân viên }
    columns: [{ field: code, label: Mã nhân viên }, { field: name, label: Họ tên }, { field: job_title, label: Chức danh }, { field: status, label: Trạng thái }]
toolbar:
  - { id: back_branches, label: 'Danh sách chi nhánh', icon: arrow-left, variant: secondary, action: back_branches }
  - { id: edit_branch_detail, label: Sửa chi nhánh, variant: primary, permission: settings.write, action: edit_branch_detail }
actions:
  - { id: back_branches, type: navigate, navigate_to: /org/branches }
  - id: edit_branch_detail
    type: form
    permission: settings.write
    title: Cập nhật chi nhánh
    table: branches
    operation: update
    prefill: source
    prefill_source: branch_detail
    refresh: [branch_detail, branch_departments, branch_trucks, branch_employees]
    fields:
      - { field: name, label: Tên chi nhánh, type: text, required: true }
      - { field: city, label: Tỉnh / thành phố, type: text, required: true }
      - { field: region, label: Khu vực, type: text }
      - { field: status, label: Trạng thái, type: select, options: [{ id: Active, label: Hoạt động }, { id: Inactive, label: Ngưng hoạt động }] }
