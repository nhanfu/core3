title: User
page:
  id: users
  breadcrumb: [Organization & decentralization, User]
  auth: { require: [settings.read] }
datasources:
  - id: org_user_totals
    single: true
    permission: settings.read
    query: |
      SELECT COUNT(*) AS total_users,
        SUM(CASE WHEN COALESCE(enabled, true) THEN 1 ELSE 0 END) AS active_users,
        SUM(CASE WHEN COALESCE(enabled, true) THEN 0 ELSE 1 END) AS disabled_users
      FROM users u
      WHERE (:view_scope = 'all' OR u.branch_id = :current_branch_id)
  - id: branch_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM branches WHERE status = 'Active' AND (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
  - id: department_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM departments WHERE status = 'Active' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY name"
  - id: role_lookup
    single: false
    permission: settings.read
    query: "SELECT name AS value, name AS label FROM roles ORDER BY name"
  - id: org_seat_usage
    single: true
    permission: settings.read
    query: |
      SELECT
        SUM(CASE WHEN COALESCE(enabled, true) THEN 1 ELSE 0 END) AS used_seats,
        CAST(COALESCE((SELECT config_value FROM system_configs WHERE kind = 'organization' AND code = 'USER_SEATS' AND status = 'Active' LIMIT 1), '50') AS INTEGER) AS seat_limit,
        CAST(COALESCE((SELECT config_value FROM system_configs WHERE kind = 'organization' AND code = 'USER_SEATS' AND status = 'Active' LIMIT 1), '50') AS INTEGER) - SUM(CASE WHEN COALESCE(enabled, true) THEN 1 ELSE 0 END) AS available_seats
      FROM users u
      WHERE (:view_scope = 'all' OR u.branch_id = :current_branch_id)
  - id: org_users
    single: false
    permission: settings.read
    query: |
      SELECT u.id, u.name, u.email, u.preferred_lang,
        COALESCE(u.enabled, true) AS enabled,
        CASE WHEN COALESCE(u.enabled, true) THEN 'Active' ELSE 'Inactive' END AS status,
        b.name AS branch_name, d.name AS department_name,
        u.last_login, u.created_at,
        string_agg(r.name, ', ') AS roles_csv,
        string_agg(r.name, ',') AS roles
      FROM users u
      LEFT JOIN branches b ON b.id = u.branch_id
      LEFT JOIN departments d ON d.id = u.department_id
      LEFT JOIN user_roles ur ON ur.user_id = u.id
      LEFT JOIN roles r ON r.id = ur.role_id
      WHERE (:view_scope = 'all' OR u.branch_id = :current_branch_id)
        AND (:status IS NULL OR (CASE WHEN COALESCE(u.enabled, true) THEN 'Active' ELSE 'Inactive' END) = :status)
        AND (:q IS NULL OR u.name ILIKE '%' || :q || '%' OR u.email ILIKE '%' || :q || '%'
          OR COALESCE(b.name, '') ILIKE '%' || :q || '%' OR COALESCE(d.name, '') ILIKE '%' || :q || '%')
      GROUP BY u.id, u.name, u.email, u.preferred_lang, u.enabled,
        u.branch_id, u.department_id, b.name, d.name, u.last_login, u.created_at
      ORDER BY u.name
components:
  - type: StatRow
    source: org_user_totals
    stats:
      - { label: Total account, field: total_users, color: blue }
      - { label: Active, field: active_users, color: green }
      - { label: Locked, field: disabled_users, color: red }
  - type: StatRow
    source: org_seat_usage
    stats:
      - { label: Used space, field: used_seats, color: indigo }
      - { label: Remaining space, field: available_seats, color: green }
      - { label: Total number of seats, field: seat_limit, color: blue }
  - type: ListToolbar
    source: org_users
    filter_field: q
    search: { label: Search for users, placeholder: 'Find name, email, branch or department...' }
    actions: [{ id: org_users.export, label: 'Export CSV', icon: download }]
  - type: StatusTabs
    source: org_users
    filter_field: status
    variant: contained
    tabs: [{ id: '', label: All }, { id: Active, label: Active }, { id: Inactive, label: Locked }]
  - type: DataGrid
    source: org_users
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: No users }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: name, label: User, type: PrimaryEntityCell, secondary: email }
      - { field: status, label: Status, type: StatusChip, colors: { Active: green, Inactive: red } }
      - { field: branch_name, label: Branch }
      - { field: department_name, label: Departments }
      - { field: roles_csv, label: Role }
      - { field: last_login, label: Most recent login, type: DateCell }
      - { field: preferred_lang, label: Language }
      - { field: created_at, label: Creation date, type: DateCell }
      - field: actions
        label: ''
        sortable: false
        actions: [{ id: view_user, label: Detail, variant: primary, permission: settings.read }, { id: edit_user, label: Fix, variant: ghost, permission: settings.write }]
toolbar:
  - { id: add_user_btn, label: '+ Invite users', variant: primary, permission: settings.write, action: add_user }
actions:
  - { id: view_user, type: navigate, permission: settings.read, navigate_to: /org/users/detail, params: { id: '{row.id}' } }
  - id: add_user
    type: form
    permission: settings.write
    title: Invite users
    table: users
    operation: insert
    refresh: [org_users, org_user_totals]
    fields:
      - { field: name, label: Full name, type: text, required: true }
      - { field: email, label: E-mail, type: text, required: true }
      - { field: password, label: Initialization password, type: text, required: true }
      - { field: branch_id, label: Branch, type: select, options_source: branch_lookup }
      - { field: department_id, label: Departments, type: select, options_source: department_lookup }
      - { field: enabled, label: Activate, type: select, options: [{ id: true, label: Activating }, { id: false, label: Locked }], default: true }
      - { field: roles, label: Role, type: multi-select, options_source: role_lookup, search_placeholder: 'Find roles...', multiple: true }
  - id: edit_user
    type: form
    permission: settings.write
    title: Update users
    table: users
    operation: update
    prefill: row
    refresh: [org_users, org_user_totals]
    fields:
      - { field: name, label: Full name, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: branch_id, label: Branch, type: select, options_source: branch_lookup }
      - { field: department_id, label: Departments, type: select, options_source: department_lookup }
      - { field: enabled, label: Activate, type: select, options: [{ id: true, label: Activating }, { id: false, label: Locked }] }
      - { field: roles, label: Role, type: multi-select, options_source: role_lookup, search_placeholder: 'Find roles...', multiple: true }
