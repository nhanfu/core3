title: Tạm ứng
page: { id: accounting-advances, auth: { require: [accounting.read] } }
datasources:
  - id: advances
    single: false
    permission: accounting.read
    query: |
      SELECT a.id, a.code, a.name, a.counterparty, a.amount, a.currency,
        printf('%,.0f', COALESCE(a.amount, 0)) AS amount_display,
        COALESCE((SELECT SUM(s.amount) FROM accounting_entries s WHERE s.kind = 'settlement' AND s.linked_advance_id = a.id), 0) AS settled_amount,
        COALESCE(a.amount, 0) - COALESCE((SELECT SUM(s.amount) FROM accounting_entries s WHERE s.kind = 'settlement' AND s.linked_advance_id = a.id), 0) AS outstanding_amount,
        a.status,
        CASE status WHEN 'Draft' THEN 'Nháp' WHEN 'Pending Approval' THEN 'Đang duyệt'
          WHEN 'Approved' THEN 'Đã duyệt' WHEN 'Cancelled' THEN 'Đã hủy'
          ELSE status END AS status_label,
        CAST(document_date AS VARCHAR) AS document_date, CAST(due_date AS VARCHAR) AS due_date, description, created_at
      FROM accounting_entries a WHERE a.kind = 'advance' AND (:status IS NULL OR a.status = :status) AND (:q IS NULL OR a.code ILIKE '%' || :q || '%' OR a.name ILIKE '%' || :q || '%' OR a.counterparty ILIKE '%' || :q || '%') ORDER BY a.document_date DESC, a.code
toolbar: [{ id: add_advance_btn, label: '+ Thêm tạm ứng', variant: primary, permission: accounting.write, action: add_advance }]
components:
  - { type: ListToolbar, source: advances, filter_field: q, search: { label: Tìm kiếm tạm ứng, placeholder: 'Tìm số chứng từ hoặc người nhận...' }, actions: [{ id: advances.export, label: 'Xuất CSV', icon: '↓' }] }
  - { type: StatusTabs, source: advances, filter_field: status, tabs: [{ id: '', label: Tất cả }, { id: Draft, label: Nháp }, { id: Pending Approval, label: Đang duyệt }, { id: Approved, label: Đã duyệt }, { id: Cancelled, label: Đã hủy }] }
  - type: DataGrid
    source: advances
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: Không có tạm ứng }
    columns:
      - { field: code, label: Số chứng từ, sortable: true }
      - { field: name, label: Nội dung, type: PrimaryEntityCell, secondary: counterparty }
      - { field: document_date, label: Ngày tạm ứng }
      - { field: due_date, label: Hạn hoàn ứng }
      - { field: amount_display, label: Giá trị, align: right }
      - { field: outstanding_amount, label: Còn phải hoàn, align: right }
      - { field: currency, label: Tiền tệ }
      - field: status_label
        label: Trạng thái
        type: StatusChip
        colors: { Nháp: neutral, Đang duyệt: amber, Đã duyệt: green, Đã hủy: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_advance, label: Chi tiết, variant: secondary }
          - { id: edit_advance, label: Sửa, variant: ghost, show_if: "row.status === 'Draft'" }
          - { id: submit_advance, label: Trình duyệt, variant: primary, show_if: "row.status === 'Draft'" }
          - { id: approve_advance, label: Duyệt, variant: primary, show_if: "row.status === 'Pending Approval' && user.permissions.includes('accounting.approve')" }
          - { id: reject_advance, label: Từ chối, variant: ghost, show_if: "row.status === 'Pending Approval' && user.permissions.includes('accounting.approve')" }
          - { id: cancel_advance, label: Hủy, variant: danger, show_if: "['Draft', 'Pending Approval', 'Approved'].includes(row.status)" }
          - { id: delete_advance, label: Xóa, variant: danger, show_if: "row.status === 'Draft'" }
actions:
  - id: add_advance
    type: form
    title: Thêm tạm ứng
    table: accounting_entries
    scope: advance
    operation: insert
    refresh: [advances]
    fields: [{ field: code, label: Số chứng từ, type: text, required: true }, { field: name, label: Nội dung, type: text, required: true }, { field: counterparty, label: Người nhận, type: text }, { field: currency, label: Tiền tệ, type: text, default: VND }, { field: document_date, label: Ngày tạm ứng, type: date }, { field: due_date, label: Hạn hoàn ứng, type: date }, { field: description, label: Ghi chú, type: textarea }]
  - id: edit_advance
    type: form
    title: Cập nhật tạm ứng
    table: accounting_entries
    scope: advance
    operation: update
    prefill: row
    refresh: [advances]
    fields: [{ field: code, label: Số chứng từ, type: text, required: true }, { field: name, label: Nội dung, type: text, required: true }, { field: counterparty, label: Người nhận, type: text }, { field: currency, label: Tiền tệ, type: text }, { field: document_date, label: Ngày tạm ứng, type: date }, { field: due_date, label: Hạn hoàn ứng, type: date }, { field: description, label: Ghi chú, type: textarea }]
  - { id: view_advance, type: navigate, navigate_to: /accounting/documents/detail, params: { id: '{row.id}', kind: advance, back: /accounting/advances } }
  - { id: submit_advance, type: server, action: accounting.advances.submit_for_approval, confirm: 'Trình duyệt tạm ứng {{row.code}}?', refresh: [advances] }
  - { id: approve_advance, type: server, action: accounting.advances.approve, confirm: 'Duyệt tạm ứng {{row.code}}?', refresh: [advances] }
  - { id: reject_advance, type: server, action: accounting.advances.reject, confirm: 'Từ chối tạm ứng {{row.code}}?', refresh: [advances] }
  - { id: cancel_advance, type: server, action: accounting.advances.cancel, confirm: 'Hủy tạm ứng {{row.code}}?', refresh: [advances] }
  - { id: delete_advance, type: delete, table: accounting_entries, scope: advance, confirm: 'Xóa tạm ứng {{row.code}}?', refresh: [advances] }
