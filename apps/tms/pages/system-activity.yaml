title: Lịch sử thao tác
page: { id: system-activity, auth: { require: [system.read] } }
datasources:
  - id: system_activity
    single: false
    permission: system.read
    query: |
      SELECT id, actor_id, actor_name, action, resource, resource_id, detail,
        CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity
      WHERE (:q IS NULL OR actor_name ILIKE '%' || :q || '%' OR action ILIKE '%' || :q || '%' OR resource ILIKE '%' || :q || '%' OR resource_id ILIKE '%' || :q || '%')
        AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      ORDER BY created_at DESC
components:
  - type: ListToolbar
    source: system_activity
    filter_field: q
    date_range: { from_field: from_date, to_field: to_date, from_label: 'Từ ngày', to_label: 'Đến ngày', presets: [today, week, month, quarter, year, last_12_months, all], default_preset: last_12_months }
    search: { label: Tìm kiếm lịch sử, placeholder: 'Tìm người thao tác hoặc tài nguyên...' }
    actions: [{ id: system_activity.export, label: 'Xuất CSV', icon: '↓' }]
  - type: DataGrid
    source: system_activity
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: Không có lịch sử thao tác }
    columns: [{ field: actor_name, label: Người thao tác }, { field: action, label: Hành động }, { field: resource, label: Tài nguyên }, { field: resource_id, label: Mã bản ghi }, { field: detail, label: Chi tiết }, { field: created_at, label: Thời gian }]
actions: []
