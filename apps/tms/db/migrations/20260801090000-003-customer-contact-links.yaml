up: |
  -- DuckDB cannot update a referenced parent row, even when its primary key is
  -- unchanged. CRM repositories validate these links before contact mutations.
  CREATE TABLE customer_contacts_without_fk (
    id VARCHAR PRIMARY KEY,
    customer_id VARCHAR NOT NULL,
    name VARCHAR NOT NULL,
    role_title VARCHAR,
    phone VARCHAR,
    email VARCHAR,
    is_primary BOOLEAN NOT NULL DEFAULT false,
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  INSERT INTO customer_contacts_without_fk SELECT * FROM customer_contacts;
  DROP TABLE customer_contacts;
  ALTER TABLE customer_contacts_without_fk RENAME TO customer_contacts;
  CREATE INDEX IF NOT EXISTS idx_customer_contacts_customer ON customer_contacts(customer_id);

  CREATE TABLE partner_contacts_without_fk (
    id VARCHAR PRIMARY KEY,
    partner_id VARCHAR NOT NULL,
    name VARCHAR NOT NULL,
    role_title VARCHAR,
    phone VARCHAR,
    email VARCHAR,
    is_primary BOOLEAN NOT NULL DEFAULT false,
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  INSERT INTO partner_contacts_without_fk SELECT * FROM partner_contacts;
  DROP TABLE partner_contacts;
  ALTER TABLE partner_contacts_without_fk RENAME TO partner_contacts;
  CREATE INDEX IF NOT EXISTS idx_partner_contacts_partner ON partner_contacts(partner_id);
