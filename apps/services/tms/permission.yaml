# Backend authorization and write metadata for the TMS application.
# Page YAML remains the source for page, datasource, and UI action permissions.

permissions:
  - fleet.read
  - fleet.write
  - drivers.read
  - drivers.write
  - trips.read
  - trips.write
  - maintenance.read
  - maintenance.write
  - orders.read
  - orders.write
  - orders.approve
  - reports.read
  - reports.financials
  - settings.read
  - settings.write
  - crm.read
  - crm.write
  - catalog.read
  - catalog.write
  - accounting.read
  - accounting.write
  - accounting.approve
  - accounting.pay
  - hr.read
  - hr.write
  - hr.approve
  - hr.pay
  - system.read
  - system.write
  - dispatch.read
  - dispatch.write
  - chat.read
  - chat.write

tables:
  orders:
    permission: orders.write
    timestamps: true
    fields: [order_number, customer_name, customer_legal_name, order_date, shipment_type, route, transport_method, trip_count, notes, branch_id]
    preserve: [{ table: order_lines, key: order_id }, { table: order_workflow_states, key: order_id }]
    cascade: [{ table: order_lines, key: order_id }, { table: order_workflow_states, key: order_id }]
  trucks:
    permission: fleet.write
    timestamps: true
    fields: [plate, model, type, status, capacity_kg, mileage, driver_id, last_service, next_service, branch_id, notes]
  drivers:
    permission: drivers.write
    timestamps: true
    fields: [name, phone, email, license_number, license_expiry, status, assigned_truck_id]
  trips:
    permission: trips.write
    timestamps: true
    fields: [trip_number, truck_id, driver_id, branch_id, origin, destination, status, departure_time, arrival_time, distance_km, cargo_type, cargo_weight, notes]
  maintenance:
    permission: maintenance.write
    timestamps: true
    fields: [truck_id, service_type, status, scheduled_date, completed_date, technician_id, cost, notes]
  customers:
    permission: crm.write
    timestamps: true
    fields: [code, name, tax_code, phone, email, stage, owner_name, visibility, status]
    cascade: [{ table: customer_contacts, key: customer_id }]
  quotes:
    permission: crm.write
    timestamps: true
    fields: [code, customer_name, title, status, valid_until, branch_id]
    cascade: [{ table: quote_lines, key: quote_id }]
  partners:
    permission: crm.write
    timestamps: true
    fields: [code, name, tax_code, phone, email, partner_type, owner_name, visibility, status]
    cascade: [{ table: partner_contacts, key: partner_id }]
  containers:
    permission: dispatch.write
    timestamps: true
    fields: [container_number, container_type, owner_name, location_id, branch_id, status, notes]
  locations:
    permission: dispatch.write
    timestamps: true
    fields: [code, name, location_type, address, city, area_id, branch_id, status]
  areas:
    permission: dispatch.write
    timestamps: true
    fields: [code, name, parent_id, region, description, status]
  company_profiles:
    permission: settings.write
    timestamps: true
    fields: [name, short_name, tax_code, address, invoice_address, phone, email, website, bank_name, bank_account, notes]
  departments:
    permission: settings.write
    timestamps: true
    fields: [code, name, parent_id, branch_id, status]
  teams:
    permission: settings.write
    timestamps: true
    fields: [code, name, department_id, manager_id, status]
  employees:
    permission: hr.write
    timestamps: true
    fields: [code, name, job_title, phone, email, department, start_date, dependents, status]
  employment_contracts:
    permission: hr.write
    timestamps: true
    fields: [code, employee_id, contract_type, start_date, end_date, base_salary, status]
  work_shifts:
    permission: hr.write
    timestamps: true
    fields: [code, name, start_time, end_time, break_minutes, status]
  timesheets:
    permission: hr.write
    timestamps: true
    fields: [employee_id, work_date, shift_id, hours, status, notes]
  payrolls:
    permission: hr.write
    timestamps: true
    fields: [code, employee_id, pay_month, base_salary, allowance, deduction, net_salary, status]
  master_data:
    permission: catalog.write
    timestamps: true
    fields: [code, name, description, symbol, decimals, status, sort_order]
    scopes: [container_type, vehicle_type, unit, cargo_type, fee_type, currency]
  accounting_entries:
    permission: accounting.write
    timestamps: true
    fields: [code, name, counterparty, amount, currency, status, document_date, due_date, description, branch_id, linked_advance_id, parent_id, sort_order]
    scopes: [debit_note, payment_request, advance, settlement, invoice_template, ledger_account]
    cascade: [{ table: accounting_entry_lines, key: entry_id }]
  system_configs:
    permission: system.write
    timestamps: true
    fields: [code, name, config_value, description, prefix, sequence_width, reset_cadence, next_sequence, status, sort_order]
    scopes: [code_rule, print_template, approval_flow, shipment_type, trip_status, fee_rule, storage]
    cascade: [{ table: print_template_blocks, key: template_id }, { table: approval_flow_steps, key: flow_id }]
  branches:
    permission: settings.write
    timestamps: true
    fields: [name, city, region, status]
  users:
    permission: settings.write
    query: "SELECT id, email, name, preferred_lang, created_at FROM users WHERE id = :id"
    timestamps: true
    fields: [email, name, avatar_url, preferred_lang, enabled, branch_id, department_id, roles, password]
  roles:
    permission: settings.write
    timestamps: false
    fields: [name, description, view_scope]

endpoints:
  upload.chat_attachment: chat.write
  upload.order_attachment: orders.write
  upload.employee_document: hr.write
  upload.contract_document: hr.write
  upload.company_document: settings.write
  upload.master_data_import: catalog.write
  hr.contract_document.download: hr.read
  org.company_document.download: settings.read
  hr.employee_document.download: hr.read
  chat.attachment.download: chat.read
  orders.attachment.download: orders.read

scope_resources:
  users: users_branch
  employees: employees_branch
  employment_contracts: employment_contracts_branch
  timesheets: timesheets_branch
  payrolls: payrolls_branch
  accounting_entries: accounting_entries_branch
  orders: orders_branch
  quotes: quotes_branch
  locations: locations_branch
  containers: containers_branch
  trucks: trucks_branch
  departments: departments_branch
  drivers: driver_branch
  trips: trips_branch
  maintenance: maintenance_branch
  teams: team_branch
  areas: area_branch

scope_datasources:
  users_branch:
    query: "SELECT branch_id FROM users WHERE id = :id"
  employees_branch:
    query: "SELECT d.branch_id FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.id = :id"
  employment_contracts_branch:
    query: "SELECT d.branch_id FROM employment_contracts r JOIN employees e ON e.id = r.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE r.id = :id"
  timesheets_branch:
    query: "SELECT d.branch_id FROM timesheets r JOIN employees e ON e.id = r.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE r.id = :id"
  payrolls_branch:
    query: "SELECT d.branch_id FROM payrolls r JOIN employees e ON e.id = r.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE r.id = :id"
  accounting_entries_branch:
    query: "SELECT branch_id FROM accounting_entries WHERE id = :id"
  orders_branch:
    query: "SELECT branch_id FROM orders WHERE id = :id"
  quotes_branch:
    query: "SELECT branch_id FROM quotes WHERE id = :id"
  locations_branch:
    query: "SELECT branch_id FROM locations WHERE id = :id"
  containers_branch:
    query: "SELECT branch_id FROM containers WHERE id = :id"
  trucks_branch:
    query: "SELECT branch_id FROM trucks WHERE id = :id"
  departments_branch:
    query: "SELECT branch_id FROM departments WHERE id = :id"
  driver_branch:
    query: "SELECT t.branch_id FROM drivers d LEFT JOIN trucks t ON t.id = d.assigned_truck_id WHERE d.id = :id"
  trips_branch:
    query: "SELECT COALESCE(r.branch_id, t.branch_id) AS branch_id FROM trips r LEFT JOIN trucks t ON t.id = r.truck_id WHERE r.id = :id"
  maintenance_branch:
    query: "SELECT COALESCE(r.branch_id, t.branch_id) AS branch_id FROM maintenance r LEFT JOIN trucks t ON t.id = r.truck_id WHERE r.id = :id"
  team_branch:
    query: "SELECT d.branch_id FROM teams t LEFT JOIN departments d ON d.id = t.department_id WHERE t.id = :id"
  area_branch:
    query: "SELECT branch_id FROM areas WHERE id = :id"
  department_by_id:
    query: "SELECT branch_id FROM departments WHERE id = :id"
  department_by_name:
    query: "SELECT branch_id FROM departments WHERE name ILIKE :name LIMIT 1"

validation_datasources:
  area_node:
    single: true
    query: "SELECT id, parent_id FROM areas WHERE id = :id"
  department_node:
    single: true
    query: "SELECT id, parent_id FROM departments WHERE id = :id"
  ledger_account_node:
    single: true
    query: "SELECT id, parent_id FROM accounting_entries WHERE id = :id AND kind = 'ledger_account'"
  advance_node:
    single: true
    query: "SELECT id FROM accounting_entries WHERE id = :id AND kind = 'advance'"
  order_status:
    single: true
    query: "SELECT COALESCE(s.status, o.status) AS status FROM orders o LEFT JOIN order_workflow_states s ON s.order_id = o.id WHERE o.id = :id"
  accounting_status:
    single: true
    query: "SELECT status FROM accounting_entries WHERE id = :id AND kind = :kind"
  quote_status:
    single: true
    query: "SELECT status FROM quotes WHERE id = :id"
  payroll_status:
    single: true
    query: "SELECT status FROM payrolls WHERE id = :id"
  master_data_node:
    single: true
    query: "SELECT kind FROM master_data WHERE id = :id"
  system_config_node:
    single: true
    query: "SELECT kind FROM system_configs WHERE id = :id"
  accounting_entry_node:
    single: true
    query: "SELECT kind FROM accounting_entries WHERE id = :id"
  user_node:
    single: true
    query: "SELECT id FROM users WHERE id = :id"

mutation_policies:
  orders:
    update:
      preconditions: [{ datasource: order_status, params: { id: '$id' }, field: status, equals: Draft, not_found_message: Order not found, message: Order can only be edited while Draft }]
    delete:
      preconditions: [{ datasource: order_status, params: { id: '$id' }, field: status, equals: Draft, not_found_message: Order not found, message: Order can only be deleted while Draft }]
  accounting_entries:
    update:
      scopes: [debit_note, payment_request, advance, settlement]
      forbid_fields: [status, amount]
      forbid_message: Financial document status and amount require named actions
      preconditions: [{ datasource: accounting_status, params: { id: '$id', kind: '$scope' }, field: status, equals: Draft, not_found_message: Financial document not found, message: Financial document can only be edited while Draft }]
    delete:
      scopes: [debit_note, payment_request, advance, settlement]
      preconditions: [{ datasource: accounting_status, params: { id: '$id', kind: '$scope' }, field: status, equals: Draft, not_found_message: Financial document not found, message: Financial document can only be deleted while Draft }]
  quotes:
    update:
      forbid_fields: [status]
      forbid_message: Quote status requires a named action
      preconditions: [{ datasource: quote_status, params: { id: '$id' }, field: status, equals: Draft, not_found_message: Quote not found, message: Quote can only be edited while Draft }]
    delete:
      preconditions: [{ datasource: quote_status, params: { id: '$id' }, field: status, equals: Draft, not_found_message: Quote not found, message: Quote can only be deleted while Draft }]
  payrolls:
    update:
      forbid_fields: [status]
      forbid_message: Payroll status requires a named action
      preconditions: [{ datasource: payroll_status, params: { id: '$id' }, field: status, equals: Draft, not_found_message: Payroll not found, message: Payroll can only be edited while Draft }]
    delete:
      preconditions: [{ datasource: payroll_status, params: { id: '$id' }, field: status, equals: Draft, not_found_message: Payroll not found, message: Payroll can only be deleted while Draft }]

scope_mutation_policies:
  trucks: { branch_field: branch_id }
  departments: { branch_field: branch_id, references: [{ field: parent_id, resource: departments }] }
  accounting_entries: { branch_field: branch_id }
  orders: { branch_field: branch_id }
  quotes: { branch_field: branch_id }
  locations: { branch_field: branch_id }
  containers: { branch_field: branch_id, references: [{ field: location_id, resource: locations }] }
  teams: { references: [{ field: department_id, resource: departments }] }
  drivers: { references: [{ field: assigned_truck_id, resource: trucks }] }
  trips: { branch_field: branch_id, references: [{ field: truck_id, resource: trucks }] }
  maintenance: { references: [{ field: truck_id, resource: trucks }] }
  users: { branch_field: branch_id, references: [{ field: department_id, resource: departments }] }
  employees: { references: [{ field: department, datasource: department_by_name, params: { name: '$like' }, required: true }] }
  employment_contracts: { references: [{ field: employee_id, resource: employees, required: true }] }
  timesheets: { references: [{ field: employee_id, resource: employees, required: true }] }
  payrolls: { references: [{ field: employee_id, resource: employees, required: true }] }

api_datasources:
  notifications:
    permission: chat.read
    query: "SELECT * FROM notifications WHERE user_id = :user_id ORDER BY created_at DESC"
    table: notifications
    mutations:
      update: { permission: chat.read, fields: [read], where: [id, user_id] }
    mutations:
      create: { permission: chat.write, fields: [user_id, type, title, body, target_path] }
      update: { permission: chat.read, fields: [read], where: [user_id] }
  profile:
    single: true
    permission: settings.read
    query: "SELECT u.id, u.email, u.name, u.avatar_url, u.preferred_lang, u.created_at, string_agg(r.name, ',') AS roles_csv FROM users u LEFT JOIN user_roles ur ON ur.user_id = u.id LEFT JOIN roles r ON r.id = ur.role_id WHERE u.id = :id GROUP BY u.id, u.email, u.name, u.avatar_url, u.preferred_lang, u.created_at"
    table: users
    mutations:
      update: { permission: settings.write, fields: [name, preferred_lang, avatar_url], where: [id] }
  company_profile:
    single: true
    permission: settings.read
    query: "SELECT id, name, short_name, tax_code, address, phone, email, website FROM company_profiles ORDER BY created_at ASC LIMIT 1"
  users:
    permission: settings.write
    table: users
    meta: { relation: { userTable: users, roleTable: roles, joinTable: user_roles, userKey: user_id, roleKey: role_id, roleNameKey: name } }
    mutations:
      create: { permission: settings.write, fields: [email, name, avatar_url, preferred_lang, enabled, branch_id, department_id, password_hash], timestamps: true }
      update: { permission: settings.write, fields: [email, name, avatar_url, preferred_lang, enabled, branch_id, department_id, password_hash], timestamps: true }
      delete: { permission: settings.write }
