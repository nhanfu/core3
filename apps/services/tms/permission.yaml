# Backend authorization and write metadata for the TMS application.
# Page YAML remains the source for page, datasource, and UI action permissions.

permissions:
  - fleet.read
  - fleet.write
  - drivers.read
  - drivers.write
  - trips.read
  - trips.write
  - maintenance.read
  - maintenance.write
  - orders.read
  - orders.write
  - orders.approve
  - reports.read
  - reports.financials
  - settings.read
  - settings.write
  - crm.read
  - crm.write
  - catalog.read
  - catalog.write
  - accounting.read
  - accounting.write
  - accounting.approve
  - accounting.pay
  - hr.read
  - hr.write
  - hr.approve
  - hr.pay
  - system.read
  - system.write
  - dispatch.read
  - dispatch.write
  - chat.read
  - chat.write

tables:
  orders:
    permission: orders.write
    timestamps: true
    fields: [order_number, customer_name, customer_legal_name, order_date, shipment_type, route, transport_method, trip_count, notes, branch_id]
  trucks:
    permission: fleet.write
    timestamps: true
    fields: [plate, model, type, status, capacity_kg, mileage, driver_id, last_service, next_service, branch_id, notes]
  drivers:
    permission: drivers.write
    timestamps: true
    fields: [name, phone, email, license_number, license_expiry, status, assigned_truck_id]
  trips:
    permission: trips.write
    timestamps: true
    fields: [trip_number, truck_id, driver_id, branch_id, origin, destination, status, departure_time, arrival_time, distance_km, cargo_type, cargo_weight, notes]
  maintenance:
    permission: maintenance.write
    timestamps: true
    fields: [truck_id, service_type, status, scheduled_date, completed_date, technician_id, cost, notes]
  customers:
    permission: crm.write
    timestamps: true
    fields: [code, name, tax_code, phone, email, stage, owner_name, visibility, status]
  quotes:
    permission: crm.write
    timestamps: true
    fields: [code, customer_name, title, status, valid_until, branch_id]
  partners:
    permission: crm.write
    timestamps: true
    fields: [code, name, tax_code, phone, email, partner_type, owner_name, visibility, status]
  containers:
    permission: dispatch.write
    timestamps: true
    fields: [container_number, container_type, owner_name, location_id, branch_id, status, notes]
  locations:
    permission: dispatch.write
    timestamps: true
    fields: [code, name, location_type, address, city, area_id, branch_id, status]
  areas:
    permission: dispatch.write
    timestamps: true
    fields: [code, name, parent_id, region, description, status]
  company_profiles:
    permission: settings.write
    timestamps: true
    fields: [name, short_name, tax_code, address, invoice_address, phone, email, website, bank_name, bank_account, notes]
  departments:
    permission: settings.write
    timestamps: true
    fields: [code, name, parent_id, branch_id, status]
  teams:
    permission: settings.write
    timestamps: true
    fields: [code, name, department_id, manager_id, status]
  employees:
    permission: hr.write
    timestamps: true
    fields: [code, name, job_title, phone, email, department, start_date, dependents, status]
  employment_contracts:
    permission: hr.write
    timestamps: true
    fields: [code, employee_id, contract_type, start_date, end_date, base_salary, status]
  work_shifts:
    permission: hr.write
    timestamps: true
    fields: [code, name, start_time, end_time, break_minutes, status]
  timesheets:
    permission: hr.write
    timestamps: true
    fields: [employee_id, work_date, shift_id, hours, status, notes]
  payrolls:
    permission: hr.write
    timestamps: true
    fields: [code, employee_id, pay_month, base_salary, allowance, deduction, net_salary, status]
  master_data:
    permission: catalog.write
    timestamps: true
    fields: [code, name, description, symbol, decimals, status, sort_order]
    scopes: [container_type, vehicle_type, unit, cargo_type, fee_type, currency]
  accounting_entries:
    permission: accounting.write
    timestamps: true
    fields: [code, name, counterparty, amount, currency, status, document_date, due_date, description, branch_id, linked_advance_id, parent_id, sort_order]
    scopes: [debit_note, payment_request, advance, settlement, invoice_template, ledger_account]
  system_configs:
    permission: system.write
    timestamps: true
    fields: [code, name, config_value, description, prefix, sequence_width, reset_cadence, next_sequence, status, sort_order]
    scopes: [code_rule, print_template, approval_flow, shipment_type, trip_status, fee_rule, storage]
  branches:
    permission: settings.write
    timestamps: true
    fields: [name, city, region, status]
  users:
    permission: settings.write
    timestamps: true
    fields: [email, name, avatar_url, preferred_lang, enabled, branch_id, department_id, roles, password]
  roles:
    permission: settings.write
    timestamps: false
    fields: [name, description, view_scope]

endpoints:
  upload.chat_attachment: chat.write
  upload.order_attachment: orders.write
  upload.employee_document: hr.write
  upload.contract_document: hr.write
  upload.company_document: settings.write
  upload.master_data_import: catalog.write
  hr.contract_document.download: hr.read
  org.company_document.download: settings.read
  hr.employee_document.download: hr.read
  chat.attachment.download: chat.read
  orders.attachment.download: orders.read
