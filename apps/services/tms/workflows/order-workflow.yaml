workflow:
  id: orders
  entity: orders
  handler: order_status
  initial: Draft
  permission: orders.write
  mutable: true
  status_source: order_statuses
  allow_add: true
  states:
    - { id: Draft, label: Nháp, color: neutral }
    - { id: Pending Approval, label: Đang duyệt, color: amber }
    - { id: Approved, label: Đã duyệt, color: green }
    - { id: Cancelled, label: Đã hủy, color: red, terminal: true }
    - { id: "Banned", label: "Banned", color: neutral }
  transitions:
    - { id: "move_draft_to_banned", from: "Draft", to: "Banned", permission: "orders.write" }
    - { id: "move_pending_approval_to_banned", from: "Pending Approval", to: "Banned", permission: "orders.write" }
    - { id: "move_cancelled_to_banned", from: "Cancelled", to: "Banned", permission: "orders.write" }

    - { id: submit_for_approval, from: Draft, to: Pending Approval, permission: orders.write }
    - { id: approve, from: Pending Approval, to: Approved, permission: orders.approve }
    - { id: reject, from: Pending Approval, to: Draft, permission: orders.approve }
    - { id: cancel, from: [Draft, Pending Approval, Approved], to: Cancelled, permission: orders.write }
