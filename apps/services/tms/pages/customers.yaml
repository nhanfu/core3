title: Client
scope: { label: 'View range', value: 'Toàn công ty' }

page:
  id: customers
  breadcrumb: [Business, Client]
  auth:
    require: [crm.read]

datasources:
  - id: customers
    single: false
    permission: crm.read
    query: |
      SELECT c.id, REPLACE(UPPER(c.id), 'CUSTOMER-', 'KH') AS system_code,
        c.code, c.name, c.tax_code, c.phone, c.email, c.stage, c.visibility, c.status,
        'Khách hàng' AS entity_type,
        CASE c.stage
          WHEN 'Lead' THEN 'Khách tiềm năng'
          WHEN 'Contacting' THEN 'Đang tiếp cận'
          WHEN 'Customer' THEN 'Khách hàng'
          ELSE c.stage
        END AS stage_label,
        c.owner_name,
        'Admin User' AS created_by,
        CASE c.visibility WHEN 'Private' THEN 'Riêng' ELSE 'Công khai' END AS visibility_label,
        CASE c.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label,
        c.created_at
      FROM customers c
      WHERE (NULLIF(:stage, '') IS NULL OR c.stage = :stage)
        AND (NULLIF(:visibility, '') IS NULL OR c.visibility = :visibility)
        AND (NULLIF(:status, '') IS NULL OR c.status = :status)
        AND (:view_scope = 'all'
          OR (:view_scope = 'branch' AND (c.visibility = 'Public' OR c.owner_name = :current_user_name))
          OR (:view_scope = 'own' AND c.owner_name = :current_user_name))
        AND (:q IS NULL OR c.code ILIKE '%' || :q || '%'
          OR c.name ILIKE '%' || :q || '%'
          OR c.tax_code ILIKE '%' || :q || '%'
          OR c.phone ILIKE '%' || :q || '%')
      ORDER BY c.created_at DESC, c.name
  - id: customer_owner_lookup
    single: false
    permission: crm.read
    query: "SELECT e.name AS value, e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.status = 'Active' AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) UNION SELECT DISTINCT owner_name AS value, owner_name AS label FROM customers WHERE owner_name IS NOT NULL AND owner_name <> '' AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)) OR (:view_scope = 'own' AND owner_name = :current_user_name)) ORDER BY label"

toolbar:
  - id: add_customer_btn
    label: '+ Add customers'
    variant: primary
    permission: crm.write
    action: add_customer

components:
  - type: ListView
    variant: odoo
    source: customers
    create_action: add_customer
    create_label: Add customer
    search:
      label: Search customers
      placeholder: 'Find code, name, tax code, or phone number...'
    filters:
      - field: stage
        label: Stage
        placeholder: All stages
        options:
          - { id: Lead, label: Potential guests }
          - { id: Contacting, label: Approaching }
          - { id: Customer, label: Client }
      - field: visibility
        label: Visibility
        placeholder: All visibility
        options:
          - { id: Public, label: Public }
          - { id: Private, label: Private }
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Working }
          - { id: Inactive, label: Shut down }
    actions: [{ id: customers.export, label: Export Excel, title: Export Excel, icon: download }]
    labels:
      new: Add customer
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all customers
      select_row: Select customer
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: stage
        card:
          title: name
          subtitle: code
          fields:
            - { field: stage_label, label: Stage }
            - { field: owner_name, label: Sales owner }
            - { field: phone, label: Phone }
            - { field: visibility_label, label: Visibility }
    page_size: 50
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_customer
    row_actions: menu
    empty_state:
      title: There are no customers
      description: Try changing filters or creating new customers.
    columns:
      - { field: system_code, label: HT code, sortable: true }
      - { field: code, label: Code/name, type: PrimaryEntityCell, secondary: name }
      - { field: entity_type, label: Type, type: StatusChip, colors: { Khách hàng: neutral } }
      - { field: tax_code, label: Tax code }
      - field: stage_label
        label: Stage
        type: StatusChip
        colors: { Khách tiềm năng: blue, Đang tiếp cận: amber, Khách hàng: green }
      - { field: owner_name, label: Sales is in charge }
      - { field: phone, label: Main contact, type: PrimaryEntityCell, secondary: email }
      - { field: visibility_label, label: Visibility, optional: hide }
      - { field: status_label, label: Status, type: StatusChip, colors: { Hoạt động: green, Ngưng hoạt động: red }, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - id: view_customer
            label: Detail
            variant: secondary
            permission: crm.read
          - id: edit_customer
            label: Edit
            variant: ghost
            permission: crm.write
          - id: delete_customer
            label: Delete
            variant: danger
            permission: crm.write

actions:
  - { id: view_customer, type: navigate, permission: crm.read, navigate_to: /crm/entities/detail, params: { id: '{row.id}', kind: customer, back: /customers } }
  - id: add_customer
    type: form
    permission: crm.write
    title: Add customers
    table: customers
    operation: insert
    refresh: [customers]
    fields:
      - { field: code, label: Customer code, type: text, required: true }
      - { field: name, label: Customer name, type: text, required: true }
      - { field: tax_code, label: Tax code, type: text }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: stage, label: Stage, type: select, options: [{ id: Lead, label: Potential guests }, { id: Contacting, label: Approaching }, { id: Customer, label: Client }], default: Lead }
      - { field: owner_name, label: Sales is in charge, type: select, options_source: customer_owner_lookup }
      - { field: visibility, label: Show, type: select, options: [{ id: Public, label: Public }, { id: Private, label: Private }], default: Public }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }], default: Active }
  - id: edit_customer
    type: form
    permission: crm.write
    title: Update customers
    table: customers
    operation: update
    prefill: row
    refresh: [customers]
    fields:
      - { field: code, label: Customer code, type: text, required: true }
      - { field: name, label: Customer name, type: text, required: true }
      - { field: tax_code, label: Tax code, type: text }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: stage, label: Stage, type: select, options: [{ id: Lead, label: Potential guests }, { id: Contacting, label: Approaching }, { id: Customer, label: Client }] }
      - { field: owner_name, label: Sales is in charge, type: select, options_source: customer_owner_lookup }
      - { field: visibility, label: Show, type: select, options: [{ id: Public, label: Public }, { id: Private, label: Private }] }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }
  - id: delete_customer
    type: delete
    permission: crm.write
    confirm: 'Delete customer {{row.name}}?'
    table: customers
    refresh: [customers]
