title: Area details
page: { id: area-detail, breadcrumb: [Category, Area, Detail], auth: { require: [dispatch.read] } }
datasources:
  - id: area_detail
    single: true
    permission: dispatch.read
    query: "SELECT id, code, name, region, description, status FROM areas WHERE id = :id"
  - id: area_locations
    single: false
    permission: dispatch.read
    query: |
      SELECT l.id, l.code, l.name, l.location_type, l.city, l.address, l.status,
        CASE l.location_type WHEN 'Port' THEN 'Cảng' WHEN 'Warehouse' THEN 'Kho / bãi' WHEN 'Depot' THEN 'Depot' WHEN 'Customer' THEN 'Khách hàng' ELSE 'Khác' END AS location_type_label
      FROM locations l WHERE l.area_id = :id AND (:view_scope = 'all' OR l.branch_id = :current_branch_id) ORDER BY l.name
  - id: area_detail_parent_lookup
    single: false
    permission: dispatch.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM areas ORDER BY name"
components:
  - type: OdooFormView
    source: area_detail
    title_field: name
    subtitle_field: code
    status_field: status
    statusbar:
      - { value: Active, label: Working }
      - { value: Inactive, label: Shut down }
    header_actions:
      - { id: edit_area_detail, label: Edit area, variant: secondary }
    groups:
      - title: Area details
        fields:
          - { field: region, label: Region }
          - { field: description, label: Note, type: textarea, wide: true }
    content_slot: true
  - type: DataGrid
    source: area_locations
    page_size: 50
    column_chooser: true
    row_key: id
    empty_state: { title: There are no locations in the area yet }
    columns: [{ field: code, label: Location code }, { field: name, label: Location }, { field: location_type_label, label: Type }, { field: city, label: City }, { field: address, label: Address }, { field: status, label: Status }]
toolbar:
  - { id: back_areas, label: 'Area list', icon: arrow-left, variant: secondary, action: back_areas }
actions:
  - { id: back_areas, type: navigate, navigate_to: /areas }
  - id: edit_area_detail
    type: form
    permission: dispatch.write
    title: Update area
    table: areas
    operation: update
    prefill: source
    prefill_source: area_detail
    refresh: [area_detail, area_locations]
    fields: [{ field: code, label: Area code, type: text, required: true }, { field: name, label: Area name, type: text, required: true }, { field: parent_id, label: Father area, type: select, options_source: area_detail_parent_lookup }, { field: region, label: Region, type: text }, { field: description, label: Note, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }]
