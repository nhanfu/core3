title: Branch

page:
  id: branches
  breadcrumb: [Organization & decentralization, Branch]
  auth:
    require: [settings.read]

datasources:
  - id: org_branches
    single: false
    permission: settings.read
    query: |
      SELECT b.id, b.name, b.city, b.region, b.status, COUNT(t.id) AS truck_count, b.created_at
      FROM branches b LEFT JOIN trucks t ON t.branch_id = b.id
      WHERE (:status IS NULL OR b.status = :status)
        AND (:view_scope = 'all' OR b.id = :current_branch_id)
        AND (:q IS NULL OR b.name ILIKE '%' || :q || '%' OR b.city ILIKE '%' || :q || '%' OR b.region ILIKE '%' || :q || '%')
      GROUP BY b.id, b.name, b.city, b.region, b.status, b.created_at
      ORDER BY b.name

toolbar:
  - id: add_branch_btn
    label: '+ Add branch'
    variant: primary
    permission: settings.write
    action: add_branch

components:
  - type: ListView
    variant: odoo
    source: org_branches
    create_action: add_branch
    create_label: Add branch
    search:
      label: Search branches
      placeholder: 'Search by name, province, or area...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Working }
          - { id: Inactive, label: Shut down }
    actions: [{ id: org_branches.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      new: Add branch
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all branches
      select_row: Select branch
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: city
          fields:
            - { field: region, label: Area }
            - { field: truck_count, label: Vehicles }
            - { field: status, label: Status }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_branch
    row_actions: menu
    empty_state: { title: No branches, description: Try changing the filter or creating a new branch. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: name, label: Branch name, type: PrimaryEntityCell, secondary: city }
      - { field: region, label: Area }
      - { field: truck_count, label: Number of vehicles, align: right }
      - { field: status, label: Status, type: StatusChip, colors: { Active: green, Inactive: red } }
      - { field: created_at, label: Creation date, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_branch, label: Detail, variant: secondary, permission: settings.read }
          - { id: edit_branch, label: Edit, variant: ghost, permission: settings.write }
          - { id: delete_branch, label: Delete, variant: danger, permission: settings.write }

actions:
  - { id: view_branch, type: navigate, permission: settings.read, navigate_to: /org/branches/detail, params: { id: '{row.id}' } }
  - id: add_branch
    type: form
    permission: settings.write
    title: Add branch
    table: branches
    operation: insert
    refresh: [org_branches]
    fields:
      - { field: name, label: Branch name, type: text, required: true }
      - { field: city, label: Province/city, type: text, required: true }
      - { field: region, label: Area, type: text }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }], default: Active }
  - id: edit_branch
    type: form
    permission: settings.write
    title: Update branch
    table: branches
    operation: update
    prefill: row
    refresh: [org_branches]
    fields:
      - { field: name, label: Branch name, type: text, required: true }
      - { field: city, label: Province/city, type: text, required: true }
      - { field: region, label: Area, type: text }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }
  - id: delete_branch
    type: delete
    permission: settings.write
    confirm: 'Delete branch {{row.name}}?'
    table: branches
    refresh: [org_branches]
