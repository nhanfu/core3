title: Area
page:
  id: areas
  breadcrumb: [Category, Area]
  auth: { require: [dispatch.read] }
datasources:
  - id: areas
    single: false
    permission: dispatch.read
    query: |
      SELECT a.*, p.name AS parent_name, CASE a.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label FROM areas a LEFT JOIN areas p ON p.id = a.parent_id
      WHERE (NULLIF(:status, '') IS NULL OR a.status = :status) AND (:q IS NULL OR a.code ILIKE '%' || :q || '%' OR a.name ILIKE '%' || :q || '%' OR a.region ILIKE '%' || :q || '%')
      ORDER BY a.created_at DESC, a.name
  - id: area_parent_lookup
    single: false
    permission: dispatch.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM areas ORDER BY name"
toolbar:
  - { id: add_area_btn, label: '+ Add area', variant: primary, permission: dispatch.write, action: add_area }
components:
  - type: ListView
    variant: odoo
    source: areas
    create_action: add_area
    create_label: Add area
    search:
      label: Search areas
      placeholder: 'Find code, name, or region...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Working }
          - { id: Inactive, label: Shut down }
    actions: [{ id: areas.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      new: Add area
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all areas
      select_row: Select area
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: region, label: Region }
            - { field: parent_name, label: Parent area }
            - { field: status_label, label: Status }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_area
    row_actions: menu
    empty_state: { title: There is no area, description: Try changing the filter or creating a new area. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: code, label: Code/name, type: PrimaryEntityCell, secondary: name }
      - { field: region, label: Region }
      - { field: parent_name, label: Parent area }
      - { field: description, label: Note }
      - { field: status_label, label: Status, type: StatusChip, colors: { Hoạt động: green, Ngưng hoạt động: red } }
      - { field: created_at, label: Creation date and time, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions: [{ id: view_area, label: Detail, variant: secondary, permission: dispatch.read }, { id: edit_area, label: Edit, variant: ghost, permission: dispatch.write }, { id: delete_area, label: Delete, variant: danger, permission: dispatch.write }]
actions:
  - { id: view_area, type: navigate, permission: dispatch.read, navigate_to: /areas/detail, params: { id: '{row.id}' } }
  - id: add_area
    type: form
    permission: dispatch.write
    title: Add area
    table: areas
    operation: insert
    refresh: [areas]
    fields: [{ field: code, label: Area code, type: text, required: true }, { field: name, label: Area name, type: text, required: true }, { field: parent_id, label: Father area, type: select, options_source: area_parent_lookup }, { field: region, label: Region, type: text }, { field: description, label: Note, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }], default: Active }]
  - id: edit_area
    type: form
    permission: dispatch.write
    title: Update area
    table: areas
    operation: update
    prefill: row
    refresh: [areas]
    fields: [{ field: code, label: Area code, type: text, required: true }, { field: name, label: Area name, type: text, required: true }, { field: parent_id, label: Father area, type: select, options_source: area_parent_lookup }, { field: region, label: Region, type: text }, { field: description, label: Note, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }]
  - { id: delete_area, type: delete, permission: dispatch.write, confirm: 'Delete area {{row.name}}?', table: areas, refresh: [areas] }
