title: Managing company
page:
  id: own-company
  breadcrumb: [Organization & decentralization, Managing company]
  auth: { require: [settings.read] }
datasources:
  - id: own_company
    single: false
    permission: settings.read
    query: SELECT * FROM company_profiles ORDER BY created_at LIMIT 1
  - id: company_profile
    single: true
    permission: settings.read
    query: SELECT * FROM company_profiles ORDER BY created_at LIMIT 1
  - id: company_documents
    single: false
    permission: settings.read
    query: "SELECT id, company_id, file_name, mime_type, size_bytes, CAST(created_at AS VARCHAR) AS created_at FROM company_documents WHERE company_id = (SELECT id FROM company_profiles ORDER BY created_at LIMIT 1) ORDER BY created_at DESC"
components:
  - type: OdooFormView
    source: company_profile
    title_field: name
    subtitle_field: short_name
    header_actions:
      - { id: edit_company, label: Edit company, variant: secondary }
    groups:
      - title: Company information
        fields:
          - { field: tax_code, label: Tax code }
          - { field: address, label: Address }
          - { field: invoice_address, label: Invoice address }
          - { field: phone, label: Phone }
          - { field: email, label: Email }
          - { field: website, label: Website }
      - title: Banking information
        fields:
          - { field: bank_name, label: Bank }
          - { field: bank_account, label: Account number }
          - { field: notes, label: Notes }
    content_slot: true
  - type: DataGrid
    source: company_documents
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: No company documents yet }
    columns: [{ field: file_name, label: File name }, { field: mime_type, label: Type }, { field: size_bytes, label: Capacity, align: right }, { field: created_at, label: Upload date }, { field: actions, label: '', sortable: false, actions: [{ id: download_company_document, label: Download, variant: ghost, permission: settings.read }] }]
toolbar:
  - { id: upload_company_document, label: '+ Download documents', variant: secondary, permission: settings.write, action: upload_company_document }
actions:
  - { id: upload_company_document, type: upload, permission: settings.write, kind: company_document, params: { company_id: '{state.company_profile.id}' }, refresh: [company_documents] }
  - { id: download_company_document, type: download, permission: settings.read, kind: company_document }
  - id: edit_company
    type: form
    permission: settings.write
    title: Information of the managing company
    table: company_profiles
    operation: update
    prefill: source
    prefill_source: company_profile
    refresh: [company_profile, own_company]
    fields:
      - { field: name, label: Company name, type: text, required: true }
      - { field: short_name, label: Abbreviated name, type: text }
      - { field: tax_code, label: Tax code, type: text }
      - { field: address, label: Address, type: text }
      - { field: invoice_address, label: Invoice address, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: website, label: Website, type: text }
      - { field: bank_name, label: Bank, type: text }
      - { field: bank_account, label: Account number, type: text }
      - { field: notes, label: Note, type: textarea }
