title: Advance
page: { id: accounting-advances, breadcrumb: [Accountant, Advance], auth: { require: [accounting.read] } }
datasources:
  - id: advances
    single: false
    permission: accounting.read
    query: |
      SELECT a.id, a.code, a.name, a.counterparty, a.amount, a.currency,
        printf('%,.0f', COALESCE(a.amount, 0)) AS amount_display,
        COALESCE((SELECT SUM(s.amount) FROM accounting_entries s WHERE s.kind = 'settlement' AND s.linked_advance_id = a.id AND (:view_scope = 'all' OR s.branch_id = :current_branch_id)), 0) AS settled_amount,
        COALESCE(a.amount, 0) - COALESCE((SELECT SUM(s.amount) FROM accounting_entries s WHERE s.kind = 'settlement' AND s.linked_advance_id = a.id AND (:view_scope = 'all' OR s.branch_id = :current_branch_id)), 0) AS outstanding_amount,
        a.status,
        CASE status WHEN 'Draft' THEN 'Nháp' WHEN 'Pending Approval' THEN 'Đang duyệt'
          WHEN 'Approved' THEN 'Đã duyệt' WHEN 'Cancelled' THEN 'Đã hủy'
          ELSE status END AS status_label,
        CAST(document_date AS VARCHAR) AS document_date, CAST(due_date AS VARCHAR) AS due_date, description, created_at
      FROM accounting_entries a WHERE a.kind = 'advance' AND (:view_scope = 'all' OR a.branch_id = :current_branch_id) AND (:status IS NULL OR a.status = :status) AND (:from_date IS NULL OR a.document_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR a.document_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:q IS NULL OR a.code ILIKE '%' || :q || '%' OR a.name ILIKE '%' || :q || '%' OR a.counterparty ILIKE '%' || :q || '%') ORDER BY a.document_date DESC, a.code
  - id: advance_currency_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'currency' AND status = 'Active' UNION SELECT DISTINCT currency AS value, currency AS label FROM accounting_entries WHERE currency IS NOT NULL AND currency <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
toolbar: [{ id: add_advance_btn, label: '+ Add advance', variant: primary, permission: accounting.write, action: add_advance }]
components:
  - type: ListView
    variant: odoo
    source: advances
    create_action: add_advance
    create_label: Add advance
    search:
      label: Search advances
      placeholder: 'Find document number, content, or recipient...'
    date_range:
      label: Advance date
      from_field: from_date
      to_field: to_date
      from_label: From date
      to_label: To date
      presets: [today, week, month, quarter, year, all]
      preset_labels:
        today: Today
        week: This week
        month: This month
        quarter: This quarter
        year: This year
        all: All dates
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Draft, label: Draft }
          - { id: Pending Approval, label: Pending approval }
          - { id: Approved, label: Approved }
          - { id: Cancelled, label: Cancelled }
    actions:
      - { id: advances.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add advance
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all advances
      select_row: Select advance
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status_label
        card:
          title: code
          subtitle: name
          fields:
            - { field: counterparty, label: Recipient }
            - { field: amount_display, label: Amount }
            - { field: due_date, label: Due date }
            - { field: status_label, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no advance }
    columns:
      - { field: code, label: Document number, sortable: true }
      - { field: name, label: Content, type: PrimaryEntityCell, secondary: counterparty }
      - { field: document_date, label: Advance date }
      - { field: due_date, label: Refund deadline }
      - { field: amount_display, label: Value, align: right }
      - { field: outstanding_amount, label: Still to complete, align: right }
      - { field: currency, label: Money }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Nháp: neutral, Đang duyệt: amber, Đã duyệt: green, Đã hủy: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_advance, label: View, variant: secondary, permission: accounting.read }
          - { id: edit_advance, label: Edit, variant: ghost, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: submit_advance, label: Submit, variant: primary, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: approve_advance, label: Approve, variant: primary, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: reject_advance, label: Reject, variant: ghost, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: cancel_advance, label: Cancel, variant: danger, permission: accounting.write, show_if: "['Draft', 'Pending Approval', 'Approved'].includes(row.status)" }
          - { id: delete_advance, label: Delete, variant: danger, permission: accounting.write, show_if: "row.status === 'Draft'" }
actions:
  - id: add_advance
    type: form
    permission: accounting.write
    title: Add advance
    table: accounting_entries
    scope: advance
    operation: insert
    refresh: [advances]
    fields: [{ field: code, label: Document number, type: text, required: true }, { field: name, label: Content, type: text, required: true }, { field: counterparty, label: Receiver, type: text }, { field: currency, label: Money, type: select, options_source: advance_currency_lookup, default: VND }, { field: document_date, label: Advance date, type: date }, { field: due_date, label: Refund deadline, type: date }, { field: description, label: Note, type: textarea }]
  - id: edit_advance
    type: form
    permission: accounting.write
    title: Advance update
    table: accounting_entries
    scope: advance
    operation: update
    prefill: row
    refresh: [advances]
    fields: [{ field: code, label: Document number, type: text, required: true }, { field: name, label: Content, type: text, required: true }, { field: counterparty, label: Receiver, type: text }, { field: currency, label: Money, type: select, options_source: advance_currency_lookup }, { field: document_date, label: Advance date, type: date }, { field: due_date, label: Refund deadline, type: date }, { field: description, label: Note, type: textarea }]
  - { id: view_advance, type: navigate, permission: accounting.read, navigate_to: /accounting/documents/detail, params: { id: '{row.id}', kind: advance, back: /accounting/advances } }
  - { id: submit_advance, type: server, permission: accounting.write, action: accounting.advances.submit_for_approval, confirm: 'Browser advance {{row.code}}?', refresh: [advances] , handler: financial_transition, operation: submit_for_approval, kind: advance}
  - { id: approve_advance, type: server, permission: accounting.approve, action: accounting.advances.approve, confirm: 'Browse advance {{row.code}}?', refresh: [advances] , handler: financial_transition, operation: approve, kind: advance}
  - { id: reject_advance, type: server, permission: accounting.approve, action: accounting.advances.reject, confirm: 'Deny advance {{row.code}}?', refresh: [advances] , handler: financial_transition, operation: reject, kind: advance}
  - { id: cancel_advance, type: server, permission: accounting.write, action: accounting.advances.cancel, confirm: 'Cancel advance {{row.code}}?', refresh: [advances] , handler: financial_transition, operation: cancel, kind: advance}
  - { id: delete_advance, type: delete, permission: accounting.write, table: accounting_entries, scope: advance, confirm: 'Delete advance {{row.code}}?', refresh: [advances] }
