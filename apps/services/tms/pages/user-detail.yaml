title: User details
page: { id: user-detail, breadcrumb: [Organization & decentralization, User, Detail], auth: { require: [settings.read] } }
datasources:
  - id: user_detail
    single: true
    permission: settings.read
    query: |
      SELECT u.id, u.email, u.name, u.preferred_lang, u.branch_id, u.department_id,
        COALESCE(u.enabled, true) AS enabled,
        CASE WHEN COALESCE(u.enabled, true) THEN 'Active' ELSE 'Inactive' END AS status,
        b.name AS branch_name, d.name AS department_name,
        COALESCE((SELECT string_agg(r.name, ',') FROM user_roles ur2 JOIN roles r ON r.id = ur2.role_id WHERE ur2.user_id = u.id), '') AS roles,
        CAST(u.last_login AS VARCHAR) AS last_login,
        CAST(u.created_at AS VARCHAR) AS created_at
      FROM users u
      LEFT JOIN branches b ON b.id = u.branch_id
      LEFT JOIN departments d ON d.id = u.department_id
      WHERE u.id = :id AND (:view_scope = 'all' OR u.branch_id = :current_branch_id)
  - id: user_detail_branch_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM branches WHERE status = 'Active' AND (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
  - id: user_detail_department_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM departments WHERE status = 'Active' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY name"
  - id: user_detail_role_lookup
    single: false
    permission: settings.read
    query: "SELECT name AS value, name AS label FROM roles ORDER BY name"
  - id: user_roles
    single: false
    permission: settings.read
    query: |
      SELECT r.id AS role_id, r.name AS role_name,
        CASE WHEN ur.user_id IS NULL THEN false ELSE true END AS enabled,
        CASE WHEN ur.user_id IS NULL THEN 'Chưa gán' ELSE 'Đã gán' END AS status_label
      FROM roles r LEFT JOIN user_roles ur ON ur.role_id = r.id AND ur.user_id = :id
      WHERE (:view_scope = 'all' OR EXISTS (SELECT 1 FROM users u WHERE u.id = :id AND u.branch_id = :current_branch_id))
      ORDER BY r.name
  - id: user_permissions
    single: false
    permission: settings.read
    query: |
      SELECT DISTINCT p.permission_key
      FROM permissions p JOIN user_roles ur ON ur.role_id = p.role_id
      WHERE ur.user_id = :id AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM users u WHERE u.id = :id AND u.branch_id = :current_branch_id)) ORDER BY p.permission_key
  - id: user_activity
    single: false
    permission: settings.read
    query: "SELECT actor_name, action, detail, CAST(created_at AS VARCHAR) AS created_at FROM system_activity WHERE resource = 'users' AND resource_id = :id AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM users u WHERE u.id = :id AND u.branch_id = :current_branch_id)) ORDER BY created_at DESC"
components:
  - type: OdooFormView
    source: user_detail
    title_field: name
    subtitle_field: email
    status_field: status
    status_colors: { Active: green, Inactive: red }
    statusbar:
      - { value: Active, label: Active }
      - { value: Inactive, label: Locked }
    header_actions:
      - { id: edit_user_detail, label: Edit user, variant: secondary }
    message_source: user_activity
    chatter_label: User history
    message_actor_field: actor_name
    message_action_field: action
    message_detail_field: detail
    message_timestamp_field: created_at
    content_slot: true
    groups:
      - title: User details
        fields:
          - { field: branch_name, label: Branch }
          - { field: department_name, label: Department }
          - { field: preferred_lang, label: Language }
          - { field: last_login, label: Most recent login }
          - { field: created_at, label: Created at }
  - type: ListView
    variant: odoo
    source: user_roles
    page_size: 30
    column_chooser: true
    row_key: role_id
    empty_state: { title: There are no roles assigned yet }
    columns: [{ field: role_name, label: Role }, { field: status_label, label: Status, type: StatusChip, colors: { 'Đã gán': green, 'Chưa gán': neutral } }, { field: actions, label: '', sortable: false, actions: [{ id: grant_user_role, label: Assign roles, variant: primary, permission: settings.write, show_if: "!row.enabled" }, { id: revoke_user_role, label: Recall, variant: danger, permission: settings.write, show_if: "row.enabled" }] }]
  - type: ListView
    variant: odoo
    source: user_permissions
    page_size: 50
    column_chooser: true
    row_key: permission_key
    empty_state: { title: No effective rights yet }
    columns: [{ field: permission_key, label: Effective rights }]
toolbar:
  - { id: back_users, label: 'List of users', icon: arrow-left, variant: secondary, action: back_users }
actions:
  - { id: back_users, type: navigate, navigate_to: /org/users }
  - id: edit_user_detail
    type: form
    permission: settings.write
    title: Update users
    table: users
    operation: update
    prefill: source
    prefill_source: user_detail
    refresh: [user_detail, user_roles, user_permissions, user_activity]
    fields:
      - { field: name, label: Full name, type: text, required: true }
      - { field: email, label: E-mail, type: text, required: true }
      - { field: preferred_lang, label: Language, type: select, options: [{ id: vi, label: Vietnamese }, { id: en, label: English }] }
      - { field: branch_id, label: Branch, type: select, options_source: user_detail_branch_lookup }
      - { field: department_id, label: Departments, type: select, options_source: user_detail_department_lookup }
      - { field: enabled, label: Activate, type: select, options: [{ id: true, label: Activating }, { id: false, label: Locked }] }
      - { field: roles, label: Role, type: multi-select, options_source: user_detail_role_lookup, search_placeholder: 'Find roles...', multiple: true }
  - { id: grant_user_role, type: server, permission: settings.write, action: settings.users.grant_role, refresh: [user_roles, user_permissions, user_activity], params: { id: '{state.id}', role_id: '{row.role_id}' } , handler: user_role, operation: grant}
  - { id: revoke_user_role, type: server, permission: settings.write, action: settings.users.revoke_role, refresh: [user_roles, user_permissions, user_activity], params: { id: '{state.id}', role_id: '{row.role_id}' } , handler: user_role, operation: revoke}
