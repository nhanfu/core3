title: Location

page:
  id: locations
  breadcrumb: [Category, Location]
  auth:
    require: [dispatch.read]

datasources:
  - id: locations
    single: false
    permission: dispatch.read
    query: |
      SELECT l.*, a.code AS area_code, a.name AS area_name,
        CASE l.location_type WHEN 'Port' THEN 'Cảng' WHEN 'Warehouse' THEN 'Kho / bãi' WHEN 'Depot' THEN 'Depot' WHEN 'Customer' THEN 'Khách hàng' ELSE 'Khác' END AS location_type_label,
        CASE l.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label
      FROM locations l
      LEFT JOIN areas a ON a.id = l.area_id
      WHERE (:view_scope = 'all' OR l.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR l.status = :status)
        AND (:q IS NULL OR l.code ILIKE '%' || :q || '%' OR l.name ILIKE '%' || :q || '%' OR l.city ILIKE '%' || :q || '%' OR l.address ILIKE '%' || :q || '%')
      ORDER BY l.created_at DESC, l.name
  - id: area_lookup
    single: false
    permission: dispatch.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM areas ORDER BY status DESC, name"

toolbar:
  - id: add_location_btn
    label: '+ Add locations'
    variant: primary
    permission: dispatch.write
    action: add_location

components:
  - type: ListToolbar
    source: locations
    filter_field: q
    search: { label: Search for locations, placeholder: 'Find code, name, city or address...' }
    actions: [{ id: locations.export, label: 'Export CSV', icon: download }]
  - type: StatusTabs
    source: locations
    filter_field: status
    show_counts: false
    tabs:
      - { id: '', label: All }
      - { id: Active, label: Work }
      - { id: Inactive, label: Shut down }
  - type: DataGrid
    source: locations
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: No location available, description: Try changing your filters or creating a new location. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: code, label: Code/name, type: PrimaryEntityCell, secondary: name }
      - { field: location_type_label, label: Type }
      - { field: address, label: Address, type: PrimaryEntityCell, secondary: city }
      - { field: area_code, label: Area, type: PrimaryEntityCell, secondary: area_name }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Work: green, Shut down: red }
      - { field: created_at, label: Creation date and time }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_location, label: Fix, variant: ghost, permission: dispatch.write }
          - { id: delete_location, label: Erase, variant: danger, permission: dispatch.write }

actions:
  - id: add_location
    type: form
    permission: dispatch.write
    title: Add location
    table: locations
    operation: insert
    refresh: [locations]
    fields:
      - { field: code, label: Location code, type: text, required: true }
      - { field: name, label: Location name, type: text, required: true }
      - { field: location_type, label: Location type, type: select, options: [{ id: Port, label: Port }, { id: Warehouse, label: Warehouse }, { id: Depot, label: Depot }, { id: Customer, label: Client }, { id: Other, label: Other }], default: Other }
      - { field: address, label: Address, type: text }
      - { field: city, label: City, type: text }
      - { field: area_id, label: Area, type: select, options_source: area_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }], default: Active }
  - id: edit_location
    type: form
    permission: dispatch.write
    title: Update location
    table: locations
    operation: update
    prefill: row
    refresh: [locations]
    fields:
      - { field: code, label: Location code, type: text, required: true }
      - { field: name, label: Location name, type: text, required: true }
      - { field: location_type, label: Location type, type: select, options: [{ id: Port, label: Port }, { id: Warehouse, label: Warehouse }, { id: Depot, label: Depot }, { id: Customer, label: Client }, { id: Other, label: Other }] }
      - { field: address, label: Address, type: text }
      - { field: city, label: City, type: text }
      - { field: area_id, label: Area, type: select, options_source: area_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }
  - id: delete_location
    type: delete
    permission: dispatch.write
    confirm: 'Delete place {{row.name}}?'
    table: locations
    refresh: [locations]
