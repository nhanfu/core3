title: Object
scope: { label: 'View range', value: 'Toàn công ty' }

page:
  id: partners
  breadcrumb: [Business, Object]
  auth:
    require: [crm.read]

datasources:
  - id: partners
    single: false
    permission: crm.read
    query: |
      SELECT p.id, REPLACE(UPPER(p.id), 'PARTNER-', 'DT') AS system_code, p.code, p.name, p.tax_code, p.phone, p.email,
        p.partner_type, p.owner_name, p.visibility, p.status,
        CASE p.partner_type
          WHEN 'Carrier' THEN 'Nhà xe'
          WHEN 'Supplier' THEN 'Nhà cung cấp'
          WHEN 'ShippingLine' THEN 'Hãng tàu'
          WHEN 'Warehouse' THEN 'Kho / bãi'
          WHEN 'Depot' THEN 'Depot'
          ELSE 'Khác'
        END AS partner_type_label,
        CASE p.visibility WHEN 'Private' THEN 'Riêng' ELSE 'Công khai' END AS visibility_label,
        CASE p.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label,
        p.created_at
      FROM partners p
      WHERE (NULLIF(:partner_type, '') IS NULL OR p.partner_type = :partner_type)
        AND (NULLIF(:visibility, '') IS NULL OR p.visibility = :visibility)
        AND (NULLIF(:status, '') IS NULL OR p.status = :status)
        AND (:view_scope = 'all'
          OR (:view_scope = 'branch' AND (p.visibility = 'Public' OR p.owner_name = :current_user_name))
          OR (:view_scope = 'own' AND p.owner_name = :current_user_name))
        AND (:q IS NULL OR p.code ILIKE '%' || :q || '%'
          OR p.name ILIKE '%' || :q || '%'
          OR p.tax_code ILIKE '%' || :q || '%'
          OR p.phone ILIKE '%' || :q || '%')
      ORDER BY p.created_at DESC, p.name
  - id: partner_owner_lookup
    single: false
    permission: crm.read
    query: "SELECT e.name AS value, e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.status = 'Active' AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) UNION SELECT DISTINCT owner_name AS value, owner_name AS label FROM partners WHERE owner_name IS NOT NULL AND owner_name <> '' AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)) OR (:view_scope = 'own' AND owner_name = :current_user_name)) ORDER BY label"

toolbar:
  - id: add_partner_btn
    label: '+ Add objects'
    variant: primary
    permission: crm.write
    action: add_partner

components:
  - type: ListView
    variant: odoo
    source: partners
    create_action: add_partner
    create_label: Add partner
    search:
      label: Search partners
      placeholder: 'Find code, name, tax code, or phone number...'
    filters:
      - field: partner_type
        label: Type
        placeholder: All types
        options:
          - { id: Carrier, label: Garage }
          - { id: Supplier, label: Supplier }
          - { id: ShippingLine, label: Shipping company }
          - { id: Warehouse, label: Warehouse }
          - { id: Depot, label: Depot }
          - { id: Other, label: Other }
      - field: visibility
        label: Visibility
        placeholder: All visibility
        options:
          - { id: Public, label: Public }
          - { id: Private, label: Private }
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Working }
          - { id: Inactive, label: Shut down }
    actions: [{ id: partners.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      new: Add partner
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all partners
      select_row: Select partner
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: partner_type
        card:
          title: name
          subtitle: code
          fields:
            - { field: partner_type_label, label: Type }
            - { field: owner_name, label: Sales owner }
            - { field: phone, label: Phone }
            - { field: visibility_label, label: Visibility }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_partner
    row_actions: menu
    empty_state:
      title: No object
      description: Try changing your filters or creating a new audience.
    columns:
      - { field: system_code, label: HT code, sortable: true }
      - { field: code, label: Code/name, type: PrimaryEntityCell, secondary: name }
      - { field: tax_code, label: Tax code }
      - field: partner_type_label
        label: Type
        type: StatusChip
        colors: { Nhà xe: blue, Nhà cung cấp: amber, Hãng tàu: teal, 'Kho / bãi': violet, Depot: indigo, Khác: slate }
      - { field: owner_name, label: Sales is in charge }
      - { field: phone, label: Main contact, type: PrimaryEntityCell, secondary: email }
      - { field: visibility_label, label: Visibility, optional: hide }
      - { field: status_label, label: Status, type: StatusChip, colors: { Hoạt động: green, Ngưng hoạt động: red }, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - id: view_partner
            label: Detail
            variant: secondary
            permission: crm.read
          - id: edit_partner
            label: Edit
            variant: ghost
            permission: crm.write
          - id: delete_partner
            label: Delete
            variant: danger
            permission: crm.write

actions:
  - { id: view_partner, type: navigate, permission: crm.read, navigate_to: /crm/entities/detail, params: { id: '{row.id}', kind: partner, back: /partners } }
  - id: add_partner
    type: form
    permission: crm.write
    title: Add objects
    table: partners
    operation: insert
    refresh: [partners]
    fields:
      - { field: code, label: Object code, type: text, required: true }
      - { field: name, label: Object name, type: text, required: true }
      - { field: tax_code, label: Tax code, type: text }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: partner_type, label: Object type, type: select, options: [{ id: Carrier, label: Carrier }, { id: Supplier, label: Supplier }, { id: ShippingLine, label: Shipping company }, { id: Warehouse, label: Warehouse }, { id: Depot, label: Depot }, { id: Other, label: Other }], default: Supplier }
      - { field: owner_name, label: Sales is in charge, type: select, options_source: partner_owner_lookup }
      - { field: visibility, label: Show, type: select, options: [{ id: Public, label: Public }, { id: Private, label: Private }], default: Public }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }], default: Active }
  - id: edit_partner
    type: form
    permission: crm.write
    title: Update object
    table: partners
    operation: update
    prefill: row
    refresh: [partners]
    fields:
      - { field: code, label: Object code, type: text, required: true }
      - { field: name, label: Object name, type: text, required: true }
      - { field: tax_code, label: Tax code, type: text }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: partner_type, label: Object type, type: select, options: [{ id: Carrier, label: Carrier }, { id: Supplier, label: Supplier }, { id: ShippingLine, label: Shipping company }, { id: Warehouse, label: Warehouse }, { id: Depot, label: Depot }, { id: Other, label: Other }] }
      - { field: owner_name, label: Sales is in charge, type: select, options_source: partner_owner_lookup }
      - { field: visibility, label: Show, type: select, options: [{ id: Public, label: Public }, { id: Private, label: Private }] }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }
  - id: delete_partner
    type: delete
    permission: crm.write
    confirm: 'Delete object {{row.name}}?'
    table: partners
    refresh: [partners]
