title: Vehicle details
page: { id: vehicle-detail, breadcrumb: [Manage, Vehicle, Detail], auth: { require: [fleet.read] } }
datasources:
  - id: vehicle_detail
    single: true
    permission: fleet.read
    query: |
      SELECT t.id, t.plate, t.model, t.type, t.status, t.capacity_kg, t.mileage, t.last_service, t.next_service,
        b.name AS branch_name, d.name AS driver_name, d.license_number,
        CASE WHEN t.status = 'Out of Service' THEN 'Ngưng hoạt động' WHEN t.status = 'Maintenance' THEN 'Bảo dưỡng' ELSE 'Sẵn sàng' END AS status_label
      FROM trucks t LEFT JOIN branches b ON b.id = t.branch_id LEFT JOIN drivers d ON d.id = t.driver_id
      WHERE t.id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)
  - id: vehicle_maintenance
    single: false
    permission: fleet.read
    query: "SELECT m.id, m.service_type, m.status, CAST(m.scheduled_date AS VARCHAR) AS scheduled_date, CAST(m.completed_date AS VARCHAR) AS completed_date, m.cost, m.notes FROM maintenance m JOIN trucks t ON t.id = m.truck_id WHERE m.truck_id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY m.scheduled_date DESC"
  - id: vehicle_trips
    single: false
    permission: fleet.read
    query: "SELECT tr.id, tr.trip_number, tr.origin, tr.destination, tr.status, CAST(tr.departure_time AS VARCHAR) AS departure_time FROM trips tr JOIN trucks t ON t.id = tr.truck_id WHERE tr.truck_id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY tr.departure_time DESC"
  - id: vehicle_detail_branch_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
  - id: vehicle_detail_type_lookup
    single: false
    permission: fleet.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'vehicle_type' AND status = 'Active' UNION SELECT DISTINCT type AS value, type AS label FROM trucks WHERE type IS NOT NULL AND type <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
  - id: vehicle_detail_driver_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM drivers WHERE status = 'Active' ORDER BY name"
components:
  - type: OdooFormView
    source: vehicle_detail
    title_field: plate
    subtitle_field: model
    status_field: status
    status_label_field: status_label
    status_colors: { Sẵn sàng: green, Bảo dưỡng: amber, Ngưng hoạt động: red }
    statusbar:
      - { value: Active, label: Ready }
      - { value: Maintenance, label: Maintenance }
      - { value: 'Out of Service', label: Shut down }
    header_actions:
      - { id: edit_vehicle_detail, label: Edit vehicle, variant: secondary }
    groups:
      - title: Vehicle details
        fields:
          - { field: type, label: Vehicle type }
          - { field: branch_name, label: Branch }
          - { field: capacity_kg, label: Load }
          - { field: mileage, label: Mileage }
          - { field: last_service, label: Last service }
          - { field: next_service, label: Next service }
          - { field: driver_name, label: Driver in charge }
          - { field: license_number, label: License }
    content_slot: true
  - type: DataGrid
    source: vehicle_maintenance
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: There is no maintenance schedule yet }
    columns: [{ field: service_type, label: Category }, { field: status, label: Status }, { field: scheduled_date, label: Expected }, { field: completed_date, label: Complete }, { field: cost, label: Expense, align: right }, { field: notes, label: Note }]
  - type: DataGrid
    source: vehicle_trips
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: There is no bus yet }
    columns: [{ field: trip_number, label: Trip }, { field: origin, label: Point go }, { field: destination, label: Destination }, { field: departure_time, label: Depart }, { field: status, label: Status }]
toolbar:
  - { id: back_vehicles, label: 'Media list', icon: arrow-left, variant: secondary, action: back_vehicles }
actions:
  - { id: back_vehicles, type: navigate, navigate_to: /vehicles }
  - id: edit_vehicle_detail
    type: form
    permission: fleet.write
    title: Media updates
    table: trucks
    operation: update
    prefill: source
    prefill_source: vehicle_detail
    refresh: [vehicle_detail, vehicle_maintenance, vehicle_trips]
    fields:
      - { field: plate, label: License plate / number, type: text, required: true }
      - { field: model, label: Vehicle make/model, type: text, required: true }
      - { field: type, label: Vehicle type, type: select, options_source: vehicle_detail_type_lookup }
      - { field: branch_id, label: Branch, type: select, options_source: vehicle_detail_branch_lookup }
      - { field: driver_id, label: Driver in charge, type: select, options_source: vehicle_detail_driver_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Ready }, { id: Maintenance, label: Maintenance }, { id: 'Out of Service', label: Shut down }] }
      - { field: capacity_kg, label: Load (kg), type: number }
      - { field: mileage, label: Number of kilometers, type: number }
      - { field: last_service, label: Nearest maintenance, type: date }
      - { field: next_service, label: Next maintenance, type: date }
      - { field: notes, label: Note, type: textarea }
