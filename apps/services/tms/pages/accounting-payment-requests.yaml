title: Offer to pay
page: { id: accounting-payment-requests, breadcrumb: [Accountant, Offer to pay], auth: { require: [accounting.read] } }
datasources:
  - id: payment_requests
    single: false
    permission: accounting.read
    meta: { workflow: { table: accounting_entries, kind: payment_request, resource: accounting_entries, label: Financial document } }
    query: |
      SELECT id, code, name, counterparty, amount, currency,
        printf('%,.0f', COALESCE(amount, 0)) AS amount_display, status,
        CASE status WHEN 'Draft' THEN 'Nháp' WHEN 'Pending Approval' THEN 'Đang duyệt'
          WHEN 'Approved' THEN 'Đã duyệt' WHEN 'Paid' THEN 'Đã thanh toán'
          WHEN 'Cancelled' THEN 'Đã hủy' ELSE status END AS status_label,
        CAST(document_date AS VARCHAR) AS document_date, CAST(due_date AS VARCHAR) AS due_date, description, created_at
      FROM accounting_entries WHERE kind = 'payment_request' AND (:view_scope = 'all' OR branch_id = :current_branch_id) AND (:status IS NULL OR status = :status) AND (:from_date IS NULL OR document_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR document_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR counterparty ILIKE '%' || :q || '%')
      ORDER BY document_date DESC, code
  - id: payment_request_currency_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'currency' AND status = 'Active' UNION SELECT DISTINCT currency AS value, currency AS label FROM accounting_entries WHERE currency IS NOT NULL AND currency <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
toolbar:
  - { id: add_payment_request_btn, label: '+ Add more suggestions', variant: primary, permission: accounting.write, action: add_payment_request }
components:
  - type: ListView
    variant: odoo
    source: payment_requests
    create_action: add_payment_request
    create_label: Add payment request
    search:
      label: Search payment requests
      placeholder: 'Find document number, content, or partner...'
    date_range:
      label: Request date
      from_field: from_date
      to_field: to_date
      from_label: From date
      to_label: To date
      presets: [today, week, month, quarter, year, all]
      preset_labels:
        today: Today
        week: This week
        month: This month
        quarter: This quarter
        year: This year
        all: All dates
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Draft, label: Draft }
          - { id: Pending Approval, label: Pending approval }
          - { id: Approved, label: Approved }
          - { id: Paid, label: Paid }
          - { id: Cancelled, label: Cancelled }
    actions:
      - { id: payment_requests.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add payment request
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all payment requests
      select_row: Select payment request
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status_label
        card:
          title: code
          subtitle: name
          fields:
            - { field: counterparty, label: Partner }
            - { field: amount_display, label: Amount }
            - { field: due_date, label: Due date }
            - { field: status_label, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no payment offer }
    columns:
      - { field: code, label: Document number, sortable: true }
      - { field: name, label: Content, type: PrimaryEntityCell, secondary: counterparty }
      - { field: document_date, label: Recommended date }
      - { field: due_date, label: Payment deadline }
      - { field: amount_display, label: Value, align: right }
      - { field: currency, label: Money }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Nháp: neutral, Đang duyệt: amber, Đã duyệt: green, Đã thanh toán: blue, Đã hủy: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_payment_request, label: View, variant: secondary, permission: accounting.read }
          - { id: edit_payment_request, label: Edit, variant: ghost, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: submit_payment_request, label: Submit, variant: primary, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: approve_payment_request, label: Approve, variant: primary, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: reject_payment_request, label: Reject, variant: ghost, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: pay_payment_request, label: Mark paid, variant: primary, permission: accounting.pay, show_if: "row.status === 'Approved'" }
          - { id: cancel_payment_request, label: Cancel, variant: danger, permission: accounting.write, show_if: "['Draft', 'Pending Approval', 'Approved'].includes(row.status)" }
          - { id: delete_payment_request, label: Delete, variant: danger, permission: accounting.write, show_if: "row.status === 'Draft'" }
actions:
  - id: add_payment_request
    type: form
    permission: accounting.write
    title: Add payment request
    table: accounting_entries
    scope: payment_request
    operation: insert
    refresh: [payment_requests]
    fields: [{ field: code, label: Document number, type: text, required: true }, { field: name, label: Content, type: text, required: true }, { field: counterparty, label: Partner, type: text }, { field: currency, label: Money, type: select, options_source: payment_request_currency_lookup, default: VND }, { field: document_date, label: Recommended date, type: date }, { field: due_date, label: Payment deadline, type: date }, { field: description, label: Note, type: textarea }]
  - id: edit_payment_request
    type: form
    permission: accounting.write
    title: Update payment request
    table: accounting_entries
    scope: payment_request
    operation: update
    prefill: row
    refresh: [payment_requests]
    fields: [{ field: code, label: Document number, type: text, required: true }, { field: name, label: Content, type: text, required: true }, { field: counterparty, label: Partner, type: text }, { field: currency, label: Money, type: select, options_source: payment_request_currency_lookup }, { field: document_date, label: Recommended date, type: date }, { field: due_date, label: Payment deadline, type: date }, { field: description, label: Note, type: textarea }]
  - { id: view_payment_request, type: navigate, permission: accounting.read, navigate_to: /accounting/documents/detail, params: { id: '{row.id}', kind: payment_request, back: /accounting/payment-requests } }
  - { id: submit_payment_request, type: server, permission: accounting.write, action: accounting.payment_requests.submit_for_approval, datasource: payment_requests, confirm: 'Browser requests include {{row.code}}?', refresh: [payment_requests] , handler: financial_transition, operation: submit_for_approval, kind: payment_request, transition: { from: [Draft], to: Pending Approval } }
  - { id: approve_payment_request, type: server, permission: accounting.approve, action: accounting.payment_requests.approve, datasource: payment_requests, confirm: 'Browse suggestions for {{row.code}}?', refresh: [payment_requests] , handler: financial_transition, operation: approve, kind: payment_request, transition: { from: [Pending Approval], to: Approved } }
  - { id: reject_payment_request, type: server, permission: accounting.approve, action: accounting.payment_requests.reject, datasource: payment_requests, confirm: 'Reject offer to spend {{row.code}}?', refresh: [payment_requests] , handler: financial_transition, operation: reject, kind: payment_request, transition: { from: [Pending Approval], to: Draft } }
  - { id: pay_payment_request, type: server, permission: accounting.pay, action: accounting.payment_requests.mark_paid, datasource: payment_requests, confirm: 'Confirmation of payment request for {{row.code}}?', refresh: [payment_requests] , handler: financial_transition, operation: mark_paid, kind: payment_request, transition: { from: [Approved], to: Paid } }
  - { id: cancel_payment_request, type: server, permission: accounting.write, action: accounting.payment_requests.cancel, datasource: payment_requests, confirm: 'Cancel payment offer {{row.code}}?', refresh: [payment_requests] , handler: financial_transition, operation: cancel, kind: payment_request, transition: { from: [Draft, Pending Approval, Approved], to: Cancelled } }
  - { id: delete_payment_request, type: delete, permission: accounting.write, table: accounting_entries, scope: payment_request, confirm: 'Delete request for {{row.code}}?', refresh: [payment_requests] }
