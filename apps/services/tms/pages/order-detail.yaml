title: Order details
page: { id: order-detail, breadcrumb: [Management, Orders, Detail], auth: { require: [orders.read] } }

datasources:
  - id: order_detail
    single: true
    permission: orders.read
    query: |
      SELECT o.id, o.order_number, o.customer_name, o.customer_legal_name,
        CAST(o.order_date AS VARCHAR) AS order_date,
        COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) AS status,
        CASE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) WHEN 'Draft' THEN 'Draft'
          WHEN 'Pending Approval' THEN 'Pending approval'
          WHEN 'Approved' THEN 'Approved'
          WHEN 'Cancelled' THEN 'Cancelled' ELSE o.status END AS status_label,
        o.shipment_type, o.route, o.transport_method, o.trip_count,
        printf('%,.0f ₫', COALESCE(o.total_amount, 0)) AS total_amount_display,
        o.created_by, o.notes
      FROM orders o
      WHERE o.id = :id AND (:view_scope = 'all' OR o.branch_id = :current_branch_id)
  - id: order_detail_lines
    single: false
    permission: orders.read
    table: order_lines
    mutations:
      create: { permission: orders.write, parent: { parentTable: orders, lineTable: order_lines, parentKey: order_id, label: Order, hasCost: false, totalField: total_amount } }
      update: { permission: orders.write, parent: { parentTable: orders, lineTable: order_lines, parentKey: order_id, label: Order, hasCost: false, totalField: total_amount } }
      delete: { permission: orders.write, parent: { parentTable: orders, lineTable: order_lines, parentKey: order_id, label: Order, hasCost: false, totalField: total_amount } }
    query: |
      SELECT l.id, l.order_id AS document_id, l.sequence, l.description,
        CAST(l.quantity AS DOUBLE) AS quantity, l.unit,
        CAST(l.unit_price AS DOUBLE) AS unit_price,
        CAST(l.tax_rate AS DOUBLE) AS tax_rate,
        CAST(l.line_total AS DOUBLE) AS line_total,
        printf('%,.3f', l.quantity) AS quantity_display,
        printf('%,.0f ₫', l.unit_price) AS unit_price_display,
        printf('%.2f%%', l.tax_rate) AS tax_rate_display,
        printf('%,.0f ₫', l.line_total) AS line_total_display,
        COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) AS parent_status
      FROM order_lines l
      JOIN orders o ON o.id = l.order_id
      WHERE l.order_id = :id AND (:view_scope = 'all' OR o.branch_id = :current_branch_id)
      ORDER BY l.sequence
  - id: order_detail_timeline
    single: false
    permission: orders.read
    query: |
      SELECT actor_name, action,
        CASE action
          WHEN 'orders.submit_for_approval' THEN 'Submitted for approval'
          WHEN 'orders.approve' THEN 'Approved'
          WHEN 'orders.reject' THEN 'Rejected'
          WHEN 'orders.cancel' THEN 'Cancelled'
          WHEN 'orders.lines.create' THEN 'Added order line'
          WHEN 'orders.lines.update' THEN 'Updated order line'
          WHEN 'orders.lines.delete' THEN 'Deleted order line'
          WHEN 'orders.message' THEN 'Message'
          WHEN 'orders.note' THEN 'Note'
          WHEN 'orders.followers.add' THEN 'Added follower'
          WHEN 'orders.followers.remove' THEN 'Removed follower'
          WHEN 'orders.attachments.upload' THEN 'Uploaded attachment'
          ELSE action END AS action_label,
        detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity
      WHERE resource = 'orders' AND resource_id = :id
        AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM orders o WHERE o.id = :id AND o.branch_id = :current_branch_id))
      UNION ALL
      SELECT created_by, 'created', 'Created', 'Order created',
        CAST(created_at AS VARCHAR)
      FROM orders WHERE id = :id AND (:view_scope = 'all' OR branch_id = :current_branch_id)
      ORDER BY created_at DESC
  - id: order_detail_followers
    single: false
    permission: orders.read
    query: |
      SELECT u.id AS user_id, u.name, u.email, u.avatar_url,
        CAST(f.created_at AS VARCHAR) AS followed_at
      FROM order_followers f
      JOIN users u ON u.id = f.user_id
      JOIN orders o ON o.id = f.order_id
      WHERE f.order_id = :id
        AND (:view_scope = 'all' OR o.branch_id = :current_branch_id)
      ORDER BY lower(u.name), lower(u.email)
  - id: order_detail_follower_candidates
    single: false
    permission: orders.read
    query: |
      SELECT u.id AS user_id, u.name, u.email, u.avatar_url
      FROM users u
      WHERE u.enabled = true
        AND (:view_scope = 'all' OR u.branch_id = :current_branch_id)
      ORDER BY lower(u.name), lower(u.email)
  - id: order_detail_attachments
    single: false
    permission: orders.read
    query: |
      SELECT a.id, a.order_id, a.file_name, a.mime_type, a.size_bytes,
        u.name AS uploaded_by_name, CAST(a.created_at AS VARCHAR) AS created_at
      FROM order_attachments a
      JOIN orders o ON o.id = a.order_id
      LEFT JOIN users u ON u.id = a.uploaded_by
      WHERE a.order_id = :id
        AND (:view_scope = 'all' OR o.branch_id = :current_branch_id)
      ORDER BY a.created_at DESC
  - id: order_unit_lookup
    single: false
    permission: orders.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'unit' AND status = 'Active' UNION SELECT DISTINCT unit AS value, unit AS label FROM order_lines WHERE unit IS NOT NULL AND unit <> '' ORDER BY label"
  - id: order_customer_lookup_detail
    single: false
    permission: orders.read
    query: "SELECT name AS value, code || ' - ' || name AS label FROM customers WHERE status = 'Active' AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)) OR (:view_scope = 'own' AND owner_name = :current_user_name)) UNION SELECT DISTINCT customer_name AS value, customer_name AS label FROM orders WHERE customer_name IS NOT NULL AND customer_name <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
  - id: order_shipment_type_lookup_detail
    single: false
    permission: orders.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM system_configs WHERE kind = 'shipment_type' AND status = 'Active' UNION SELECT DISTINCT shipment_type AS value, shipment_type AS label FROM orders WHERE shipment_type IS NOT NULL AND shipment_type <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"

components:
  - type: OdooFormView
    source: order_detail
    title_field: order_number
    status_field: status
    status_label_field: status_label
    status_colors: { Draft: neutral, Pending approval: amber, Approved: green, Cancelled: red }
    status_badges:
      - { value: Cancelled, label: Cancelled, tone: red }
    statusbar:
      - { value: Draft, label: Draft }
      - { value: Pending Approval, label: Pending approval }
      - { value: Approved, label: Approved }
    header_actions:
      - { id: edit_order_detail, label: Edit, variant: secondary, show_if: "state.order_detail.status === 'Draft'" }
      - { id: submit_order_detail, label: Submit for approval, variant: primary, show_if: "state.order_detail.status === 'Draft'" }
      - { id: approve_order_detail, label: Approve, variant: primary, show_if: "state.order_detail.status === 'Pending Approval'" }
      - { id: reject_order_detail, label: Reject, variant: secondary, show_if: "state.order_detail.status === 'Pending Approval'" }
      - { id: cancel_order_detail, label: Cancel, variant: secondary, show_if: "state.order_detail.status !== 'Cancelled'" }
    message_source: order_detail_timeline
    follower_source: order_detail_followers
    follower_candidates_source: order_detail_follower_candidates
    follower_candidates_page_size: 100
    attachment_source: order_detail_attachments
    attachment_page_size: 100
    chatter_label: Messages and activities
    message_label: Send message
    note_label: Log note
    message_action: send_order_message
    note_action: log_order_note
    follower_label: Followers
    attachment_label: Attachments
    add_follower_label: Add Followers
    remove_follower_label: Remove follower
    no_followers_label: No followers
    follower_search_placeholder: Select a follower
    add_label: Add
    add_attachment_label: Attach files
    no_attachments_label: No attachments
    uploading_label: Uploading…
    upload_failed_label: Upload failed
    download_label: Download
    preview_label: Preview
    attachment_accept: image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip
    follower_add_action: add_order_follower
    follower_remove_action: remove_order_follower
    attachment_upload_action: upload_order_attachment
    attachment_download_action: download_order_attachment
    message_actor_field: actor_name
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
    message_action_labels:
      orders.submit_for_approval: Submitted for approval
      orders.approve: Approved
      orders.reject: Rejected
      orders.cancel: Cancelled
      orders.lines.create: Added order line
      orders.lines.update: Updated order line
      orders.lines.delete: Deleted order line
      orders.message: Message
      orders.note: Note
      orders.followers.add: Added follower
      orders.followers.remove: Removed follower
      orders.attachments.upload: Uploaded attachment
      created: Created
    message_detail_labels: { Order created: Order created }
    content_slot: true
    group_columns: 2
    groups:
      - title: Customer
        fields:
          - { field: customer_name, label: Customer }
          - { field: customer_legal_name, label: Legal name }
      - title: Order details
        fields:
          - { field: order_date, label: Order date }
          - { field: shipment_type, label: Shipment type }
          - { field: route, label: Route }
          - { field: transport_method, label: Transport method }
          - { field: trip_count, label: Trip count }
    notebook:
      active: order_lines
      tabs:
        - { id: order_lines, label: Order Lines, content_slot: true }
        - id: other_information
          label: Other Information
          groups:
            - title: Additional information
              fields:
                - { field: created_by, label: Created by }
                - { field: notes, label: Notes, type: textarea, wide: true }
  - type: LineItemGrid
    mount_in: previous-panel
    source: order_detail_lines
    variant: odoo_x2many
    page_size: 50
    row_key: id
    actions:
      - { id: add_order_line, label: Add a line, variant: primary, permission: orders.write, show_if: "state.order_detail.status === 'Draft'" }
    empty_state: { title: No order lines, description: Add a line to start calculating the order total. }
    footer:
      source: order_detail
      stats:
        - { label: Total amount, field: total_amount_display }
    columns:
      - { field: sequence, label: '#', align: right }
      - { field: description, label: Description }
      - { field: quantity_display, label: Quantity, align: right }
      - { field: unit, label: Unit }
      - { field: unit_price_display, label: Unit price, align: right }
      - { field: tax_rate_display, label: Tax, align: right }
      - { field: line_total_display, label: Amount, align: right }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_order_line, label: Edit, variant: ghost, permission: orders.write, show_if: "row.parent_status === 'Draft'" }
          - { id: delete_order_line, label: Delete, variant: danger, permission: orders.write, show_if: "row.parent_status === 'Draft'" }
actions:
  - id: send_order_message
    type: server_form
    permission: orders.write
    title: Send message
    action: orders.chatter.send
    handler: order_chatter
    operation: message
    params: { id: '{row.id}' }
    refresh: [order_detail_timeline]
    fields:
      - { field: content, label: Message, type: textarea, required: true }
  - id: log_order_note
    type: server_form
    permission: orders.write
    title: Log note
    action: orders.chatter.note
    handler: order_chatter
    operation: note
    params: { id: '{row.id}' }
    refresh: [order_detail_timeline]
    fields:
      - { field: content, label: Note, type: textarea, required: true }
  - id: add_order_follower
    type: server
    permission: orders.write
    action: orders.followers.add
    handler: order_chatter
    operation: follower_add
    params: { user_id: '{row.user_id}' }
    refresh: [order_detail_followers, order_detail_timeline]
  - id: remove_order_follower
    type: server
    permission: orders.write
    action: orders.followers.remove
    handler: order_chatter
    operation: follower_remove
    params: { user_id: '{row.user_id}' }
    refresh: [order_detail_followers, order_detail_timeline]
  - id: upload_order_attachment
    type: upload
    permission: orders.write
    kind: order_attachment
    params: { order_id: '{row.id}' }
    refresh: [order_detail_attachments, order_detail_timeline]
  - id: download_order_attachment
    type: download
    permission: orders.read
    kind: order_attachment
  - id: edit_order_detail
    type: form
    permission: orders.write
    title: Edit Order
    table: orders
    operation: update
    prefill: source
    prefill_source: order_detail
    refresh: [order_detail, order_detail_lines, order_detail_timeline]
    fields:
      - { field: order_number, label: Order number, type: text, required: true }
      - { field: customer_name, label: Customer, type: async-select, options_source: order_customer_lookup_detail, search_placeholder: 'Search customers...', required: true }
      - { field: customer_legal_name, label: Legal name, type: text }
      - { field: order_date, label: Order date, type: date, required: true }
      - { field: shipment_type, label: Shipment type, type: select, options_source: order_shipment_type_lookup_detail }
      - { field: route, label: Route, type: text }
      - { field: transport_method, label: Transport method, type: select, options: [Road, Sea, Rail, Air] }
      - { field: trip_count, label: Trip count, type: number }
      - { field: notes, label: Notes, type: textarea }
  - id: submit_order_detail
    type: server
    permission: orders.write
    datasource: orders
    action: orders.submit_for_approval
    handler: order_transition
    operation: submit_for_approval
    confirm: 'Submit order {{row.order_number}}?'
    refresh: [order_detail, order_detail_lines, order_detail_timeline]
  - id: approve_order_detail
    type: server
    permission: orders.approve
    datasource: orders
    action: orders.approve
    handler: order_transition
    operation: approve
    confirm: 'Approve order {{row.order_number}}?'
    refresh: [order_detail, order_detail_lines, order_detail_timeline]
  - id: reject_order_detail
    type: server
    permission: orders.approve
    datasource: orders
    action: orders.reject
    handler: order_transition
    operation: reject
    confirm: 'Reject and return order {{row.order_number}} to draft?'
    refresh: [order_detail, order_detail_lines, order_detail_timeline]
  - id: cancel_order_detail
    type: server
    permission: orders.write
    datasource: orders
    action: orders.cancel
    handler: order_transition
    operation: cancel
    confirm: 'Cancel order {{row.order_number}}?'
    refresh: [order_detail, order_detail_lines, order_detail_timeline]
  - id: add_order_line
    type: server_form
    permission: orders.write
    datasource: order_detail_lines
    title: Add a charge line
    action: orders.lines.create
    handler: line_item
    operation: create
    domain: order
    params: { id: '{state.id}' }
    refresh: [order_detail_lines, order_detail, order_detail_timeline]
    fields:
      - { field: description, label: Content, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, default: 1, required: true }
      - { field: unit, label: Unit, type: select, options_source: order_unit_lookup, default: Chuyến, required: true }
      - { field: unit_price, label: Unit price, type: money, currency: VND, default: 0, required: true }
      - { field: tax_rate, label: Tax rate (%), type: number, default: 0, required: true }
  - id: edit_order_line
    type: server_form
    permission: orders.write
    datasource: order_detail_lines
    title: Update freight lines
    action: orders.lines.update
    handler: line_item
    operation: update
    domain: order
    prefill: row
    params: { id: '{state.id}', line_id: '{row.id}' }
    refresh: [order_detail_lines, order_detail, order_detail_timeline]
    fields:
      - { field: description, label: Content, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true }
      - { field: unit, label: Unit, type: select, options_source: order_unit_lookup, required: true }
      - { field: unit_price, label: Unit price, type: money, currency: VND, required: true }
      - { field: tax_rate, label: Tax rate (%), type: number, required: true }
  - id: delete_order_line
    type: server
    permission: orders.write
    datasource: order_detail_lines
    action: orders.lines.delete
    handler: line_item
    operation: delete
    domain: order
    confirm: 'Delete charge line {{row.description}}?'
    params: { id: '{state.id}', line_id: '{row.id}' }
    refresh: [order_detail_lines, order_detail, order_detail_timeline]
