title: Vehicle

page:
  id: vehicles
  breadcrumb: [Manage, Vehicle]
  auth:
    require: [fleet.read]

datasources:
  - id: vehicles
    single: false
    permission: fleet.read
    query: |
      SELECT t.id, REPLACE(UPPER(t.id), 'TRUCK-', 'XE') AS system_code,
        t.plate, t.model, t.status, t.type AS vehicle_type,
        b.name AS owner_name, t.capacity_kg,
        CASE t.status
          WHEN 'Active' THEN 'Sẵn sàng'
          WHEN 'Maintenance' THEN 'Bảo dưỡng'
          WHEN 'Out of Service' THEN 'Ngưng hoạt động'
          ELSE t.status
        END AS availability,
        'Admin User' AS created_by, t.created_at
      FROM trucks t
      LEFT JOIN branches b ON b.id = t.branch_id
      WHERE (:status IS NULL OR t.status = :status)
        AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)
        AND (:q IS NULL OR t.plate ILIKE '%' || :q || '%' OR t.model ILIKE '%' || :q || '%' OR t.type ILIKE '%' || :q || '%')
      ORDER BY t.created_at DESC, t.plate
  - id: vehicle_branch_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
  - id: vehicle_type_lookup
    single: false
    permission: fleet.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'vehicle_type' AND status = 'Active' UNION SELECT DISTINCT type AS value, type AS label FROM trucks WHERE type IS NOT NULL AND type <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - id: add_vehicle_btn
    label: '+ Add vehicles'
    variant: primary
    permission: fleet.write
    action: add_vehicle

components:
  - type: ListView
    variant: odoo
    source: vehicles
    create_action: add_vehicle
    create_label: Add vehicle
    search:
      label: Search vehicles
      placeholder: 'Search by license plate, model, or type...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Ready }
          - { id: Maintenance, label: Maintenance }
          - { id: 'Out of Service', label: Shut down }
    actions: [{ id: vehicles.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      new: Add vehicle
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all vehicles
      select_row: Select vehicle
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: plate
          subtitle: model
          fields:
            - { field: vehicle_type, label: Vehicle type }
            - { field: owner_name, label: Garage }
            - { field: capacity_kg, label: Load }
            - { field: availability, label: Status }
    page_size: 50
    column_chooser: true
    row_key: id
    selectable: true
    empty_state:
      title: No vehicles
      description: Try changing the filter or create a new vehicle.
    row_open_action: view_vehicle
    row_actions: menu
    columns:
      - { field: system_code, label: HT code, sortable: true }
      - { field: plate, label: License plate / number, type: PrimaryEntityCell, secondary: model }
      - { field: vehicle_type, label: Vehicle type }
      - { field: owner_name, label: Garage }
      - { field: capacity_kg, label: Load, align: right }
      - field: availability
        label: Status
        type: StatusChip
        colors:
          Sẵn sàng: green
          Bảo dưỡng: amber
          Ngưng hoạt động: red
      - { field: created_by, label: Creator, optional: hide }
      - { field: created_at, label: Creation date and time, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_vehicle, label: Detail, variant: secondary, permission: fleet.read }
          - { id: edit_vehicle, label: Edit, variant: ghost, permission: fleet.write }
          - { id: delete_vehicle, label: Delete, variant: danger, permission: fleet.write }

actions:
  - { id: view_vehicle, type: navigate, permission: fleet.read, navigate_to: /vehicles/detail, params: { id: '{row.id}' } }
  - id: add_vehicle
    type: form
    permission: fleet.write
    title: Add media
    table: trucks
    operation: insert
    refresh: [vehicles]
    fields:
      - { field: plate, label: License plate / number, type: text, required: true }
      - { field: model, label: Vehicle make/model, type: text, required: true }
      - { field: type, label: Vehicle type, type: select, options_source: vehicle_type_lookup }
      - { field: branch_id, label: Branch, type: select, options_source: vehicle_branch_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Ready }, { id: Maintenance, label: Maintenance }, { id: 'Out of Service', label: Shut down }], default: Active }
      - { field: capacity_kg, label: Load (kg), type: number, default: 0 }
      - { field: notes, label: Note, type: textarea }
  - id: edit_vehicle
    type: form
    permission: fleet.write
    title: Media updates
    table: trucks
    operation: update
    prefill: row
    refresh: [vehicles]
    fields:
      - { field: plate, label: License plate / number, type: text, required: true }
      - { field: model, label: Vehicle make/model, type: text, required: true }
      - { field: type, label: Vehicle type, type: select, options_source: vehicle_type_lookup }
      - { field: branch_id, label: Branch, type: select, options_source: vehicle_branch_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Ready }, { id: Maintenance, label: Maintenance }, { id: 'Out of Service', label: Shut down }] }
      - { field: capacity_kg, label: Load (kg), type: number }
      - { field: notes, label: Note, type: textarea }
  - id: delete_vehicle
    type: delete
    permission: fleet.write
    confirm: 'Remove media {{row.plate}}?'
    table: trucks
    refresh: [vehicles]
