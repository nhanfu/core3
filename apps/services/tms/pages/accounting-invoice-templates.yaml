title: Invoice template
page: { id: accounting-invoice-templates, breadcrumb: [Accountant, Invoice template], auth: { require: [accounting.read] } }
datasources:
  - id: invoice_templates
    single: false
    permission: accounting.read
    query: |
      SELECT id, code, name, description, currency, status, sort_order, created_at FROM accounting_entries
      WHERE kind = 'invoice_template' AND (:view_scope = 'all' OR branch_id = :current_branch_id) AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%') ORDER BY sort_order, code
  - id: invoice_currency_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'currency' AND status = 'Active' UNION SELECT DISTINCT currency AS value, currency AS label FROM accounting_entries WHERE currency IS NOT NULL AND currency <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
toolbar: [{ id: add_invoice_template_btn, label: '+ Add invoice template', variant: primary, permission: accounting.write, action: add_invoice_template }]
components:
  - { type: ListToolbar, source: invoice_templates, filter_field: q, search: { label: Search for invoice templates, placeholder: 'Find code, name or description...' }, actions: [{ id: invoice_templates.export, label: 'Export CSV', icon: download }] }
  - { type: StatusTabs, source: invoice_templates, filter_field: status, tabs: [{ id: '', label: All }, { id: Active, label: In use }, { id: Inactive, label: Discontinue use }] }
  - type: DataGrid
    source: invoice_templates
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: There is no invoice template }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Invoice template, type: PrimaryEntityCell, secondary: description }
      - { field: currency, label: Money }
      - { field: sort_order, label: Order, align: right }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - field: actions
        label: ''
        sortable: false
        actions: [{ id: edit_invoice_template, label: Fix, variant: ghost, permission: accounting.write }, { id: delete_invoice_template, label: Erase, variant: danger, permission: accounting.write }]
actions:
  - id: add_invoice_template
    type: form
    permission: accounting.write
    title: Add invoice template
    table: accounting_entries
    scope: invoice_template
    operation: insert
    refresh: [invoice_templates]
    fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Model name, type: text, required: true }, { field: currency, label: Money, type: select, options_source: invoice_currency_lookup, default: VND }, { field: description, label: Sample content, type: richtext, tokens: [invoice.number, invoice.customer, invoice.total, invoice.tax] }, { field: sort_order, label: Order, type: number, default: 0 }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }]
  - id: edit_invoice_template
    type: form
    permission: accounting.write
    title: Update invoice template
    table: accounting_entries
    scope: invoice_template
    operation: update
    prefill: row
    refresh: [invoice_templates]
    fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Model name, type: text, required: true }, { field: currency, label: Money, type: select, options_source: invoice_currency_lookup }, { field: description, label: Sample content, type: richtext, tokens: [invoice.number, invoice.customer, invoice.total, invoice.tax] }, { field: sort_order, label: Order, type: number }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }]
  - { id: delete_invoice_template, type: delete, permission: accounting.write, table: accounting_entries, scope: invoice_template, confirm: 'Delete invoice template {{row.name}}?', refresh: [invoice_templates] }
