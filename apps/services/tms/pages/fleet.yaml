title: Vehicle overview

page:
  id: fleet
  auth:
    require: [fleet.read]

datasources:
  - id: trucks_kpis
    single: true
    permission: fleet.read
    query: |
      SELECT COUNT(*) AS total,
        COUNT(*) FILTER (WHERE status = 'Active') AS active,
        COUNT(*) FILTER (WHERE status = 'Maintenance') AS maintenance,
        COUNT(*) FILTER (WHERE status = 'Out of Service') AS out_of_service,
        COUNT(*) FILTER (WHERE next_service IS NOT NULL AND next_service < CURRENT_DATE) AS overdue_service
      FROM trucks
      WHERE (:view_scope = 'all' OR branch_id = :current_branch_id)
  - id: trucks
    single: false
    permission: fleet.read
    query: |
      SELECT t.*, d.name AS driver_name, d.phone AS driver_phone,
        (t.next_service IS NOT NULL AND t.next_service < CURRENT_DATE) AS overdue_next
      FROM trucks t LEFT JOIN drivers d ON d.id = t.driver_id
      WHERE (:view_scope = 'all' OR t.branch_id = :current_branch_id)
        AND (:status IS NULL OR t.status = :status)
        AND (:type IS NULL OR t.type = :type)
        AND (:q IS NULL OR t.plate ILIKE '%' || :q || '%' OR t.model ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%')
      ORDER BY t.plate
  - id: fleet_driver_lookup
    single: false
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM drivers WHERE status = 'Active' AND (:view_scope = 'all' OR assigned_truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id)) UNION SELECT DISTINCT d.id AS value, d.name AS label FROM trucks t JOIN drivers d ON d.id = t.driver_id WHERE t.driver_id IS NOT NULL AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY label"
  - id: fleet_type_lookup
    single: false
    permission: fleet.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'vehicle_type' AND status = 'Active' UNION SELECT DISTINCT type AS value, type AS label FROM trucks WHERE type IS NOT NULL AND type <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"

components:
  - type: StatRow
    source: trucks_kpis
    stats:
      - label: Total means
        field: total
        color: blue
      - label: Ready
        field: active
        color: green
      - label: Under maintenance
        field: maintenance
        color: amber
      - label: Shut down
        field: out_of_service
        color: red
      - label: Overdue maintenance
        field: overdue_service
        color: amber

  - type: ListView
    variant: odoo
    source: trucks
    create_action: add_truck
    create_label: '+ Add vehicle'
    search: { label: Search vehicles, placeholder: 'License plate, car model or driver...' }
    filters:
      - { field: status, label: Status, options: [{ id: Active, label: Ready }, { id: Maintenance, label: Maintenance }, { id: 'Out of Service', label: Shut down }] }
      - { field: type, label: Vehicle type, options_source: fleet_type_lookup }
    page_size: 8
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: No means, description: Try changing filters or adding new media. }
    columns:
      - { field: plate, label: Number plate, type: PrimaryEntityCell, secondary: model }
      - { field: driver_name, label: Driver, type: PrimaryEntityCell, secondary: driver_phone }
      - { field: status, label: Status, type: StatusChip, colors: { Active: green, Maintenance: amber, 'Out of Service': red } }
      - { field: type, label: Vehicle type }
      - { field: mileage, label: Number of kilometers, align: right }
      - { field: last_service, label: Nearest maintenance, type: DateCell }
      - { field: next_service, label: Subsequent maintenance, type: DateCell }
      - field: actions
        label: ''
        sortable: false
        actions:
          - id: edit_truck
            label: Fix
            variant: ghost
            permission: fleet.write
          - id: delete_truck
            label: Erase
            variant: danger
            permission: fleet.write

actions:
  - id: add_truck
    type: form
    permission: fleet.write
    title: Add media
    table: trucks
    operation: insert
    prefill: null
    refresh: [trucks, trucks_kpis]
    fields:
      - field: plate
        label: Number plate
        type: text
        required: true
      - field: model
        label: Car model
        type: text
        required: false
      - field: type
        label: Vehicle type
        type: select
        required: false
        options_source: fleet_type_lookup
      - field: status
        label: Status
        type: select
        required: false
        options: [{ id: Active, label: Ready }, { id: Maintenance, label: Maintenance }, { id: 'Out of Service', label: Shut down }]
        default: Active
      - field: mileage
        label: Number of kilometers
        type: number
        required: false
        default: 0
      - field: driver_id
        label: Driver code
        type: select
        options_source: fleet_driver_lookup
        required: false
      - field: last_service
        label: Nearest maintenance
        type: date
        required: false
      - field: next_service
        label: Subsequent maintenance
        type: date
        required: false
      - field: notes
        label: Note
        type: textarea
        required: false

  - id: edit_truck
    type: form
    permission: fleet.write
    title: Media updates
    table: trucks
    operation: update
    prefill: row
    refresh: [trucks, trucks_kpis]
    fields:
      - field: plate
        label: Number plate
        type: text
        required: true
      - field: model
        label: Car model
        type: text
        required: false
      - field: type
        label: Vehicle type
        type: select
        required: false
        options_source: fleet_type_lookup
      - field: status
        label: Status
        type: select
        required: false
        options: [{ id: Active, label: Ready }, { id: Maintenance, label: Maintenance }, { id: 'Out of Service', label: Shut down }]
        default: Active
      - field: mileage
        label: Number of kilometers
        type: number
        required: false
        default: 0
      - field: driver_id
        label: Driver code
        type: select
        options_source: fleet_driver_lookup
        required: false
      - field: last_service
        label: Nearest maintenance
        type: date
        required: false
      - field: next_service
        label: Subsequent maintenance
        type: date
        required: false
      - field: notes
        label: Note
        type: textarea
        required: false

  - id: delete_truck
    type: delete
    permission: fleet.write
    confirm: "Remove media {{row.plate}}?"
    table: trucks
    refresh: [trucks, trucks_kpis]
