title: Capacity management
page: { id: system-storage, breadcrumb: [System, Capacity management], auth: { require: [system.read] } }
datasources:
  - id: storage_usage
    single: true
    permission: system.read
    query: |
      SELECT
        (SELECT COUNT(*) FROM chat_attachments a JOIN chat_messages m ON m.id = a.message_id JOIN chat_participants cp ON cp.thread_id = m.thread_id WHERE (:view_scope = 'all' OR cp.user_id = :current_user_id)) +
        (SELECT COUNT(*) FROM employee_documents ed JOIN employees e ON e.id = ed.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)) +
        (SELECT COUNT(*) FROM contract_documents cd JOIN employment_contracts c ON c.id = cd.contract_id JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)) +
        (SELECT COUNT(*) FROM company_documents) +
        (SELECT COUNT(*) FROM order_attachments oa JOIN orders o ON o.id = oa.order_id WHERE (:view_scope = 'all' OR o.branch_id = :current_branch_id)) AS file_count,
        (SELECT COALESCE(SUM(a.size_bytes), 0) FROM chat_attachments a JOIN chat_messages m ON m.id = a.message_id JOIN chat_participants cp ON cp.thread_id = m.thread_id WHERE (:view_scope = 'all' OR cp.user_id = :current_user_id)) +
        (SELECT COALESCE(SUM(ed.size_bytes), 0) FROM employee_documents ed JOIN employees e ON e.id = ed.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)) +
        (SELECT COALESCE(SUM(cd.size_bytes), 0) FROM contract_documents cd JOIN employment_contracts c ON c.id = cd.contract_id JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)) +
        (SELECT COALESCE(SUM(size_bytes), 0) FROM company_documents) +
        (SELECT COALESCE(SUM(oa.size_bytes), 0) FROM order_attachments oa JOIN orders o ON o.id = oa.order_id WHERE (:view_scope = 'all' OR o.branch_id = :current_branch_id)) AS used_bytes,
        (SELECT config_value FROM system_configs WHERE kind = 'storage' AND code = 'LOCAL' LIMIT 1) AS storage_root
  - id: storage_configs
    single: false
    permission: system.read
    table: system_configs
    mutations:
      create: { permission: system.write, scope: storage, fields: [code, name, config_value, description, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] } } } }
      update: { permission: system.write, scope: storage, fields: [code, name, config_value, description, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] } } } }
      delete: { permission: system.write, scope: storage }
    query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'storage' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code"
toolbar: [{ id: add_storage_config, label: '+ Add warehouse configuration', variant: primary, permission: system.write, action: add_storage_config }]
components:
  - { type: StatRow, source: storage_usage, stats: [{ label: File number, field: file_count, color: blue }, { label: Used capacity (bytes), field: used_bytes, color: indigo }, { label: Storage folder, field: storage_root, color: blue }] }
  - type: ListView
    variant: odoo
    source: storage_configs
    create_action: add_storage_config
    create_label: Add storage configuration
    search:
      label: Search storage configurations
      placeholder: 'Find code or name...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Active }
          - { id: Inactive, label: Inactive }
    actions:
      - { id: storage_configs.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add storage configuration
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all storage configurations
      select_row: Select storage configuration
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: config_value, label: Value }
            - { field: description, label: Description }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: No warehouse configuration yet }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Storage configuration, type: PrimaryEntityCell, secondary: description }
      - { field: config_value, label: Value }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_storage_config, label: Edit, variant: ghost, permission: system.write }
          - { id: delete_storage_config, label: Delete, variant: danger, permission: system.write }
actions:
  - { id: add_storage_config, type: form, permission: system.write, datasource: storage_configs, title: Add warehouse configuration, table: system_configs, scope: storage, operation: insert, refresh: [storage_configs], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Value, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }] }
  - { id: edit_storage_config, type: form, permission: system.write, datasource: storage_configs, title: Update warehouse configuration, table: system_configs, scope: storage, operation: update, prefill: row, refresh: [storage_configs], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Value, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }] }
  - { id: delete_storage_config, type: delete, permission: system.write, datasource: storage_configs, table: system_configs, scope: storage, confirm: 'Delete configuration {{row.name}}?', refresh: [storage_configs] }
