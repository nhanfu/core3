title: Staff

page:
  id: employees
  breadcrumb: [Human resources, Staff]
  auth:
    require: [hr.read]

datasources:
  - id: employees
    single: false
    permission: hr.read
    query: |
      SELECT e.*,
        CASE e.status WHEN 'OnLeave' THEN 'Nghỉ phép' WHEN 'Inactive' THEN 'Ngưng làm việc' ELSE 'Đang làm việc' END AS status_label
      FROM employees e
      LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR e.status = :status)
        AND (:q IS NULL OR e.code ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%' OR e.phone ILIKE '%' || :q || '%' OR e.email ILIKE '%' || :q || '%')
      ORDER BY e.created_at DESC, e.name
  - id: employee_department_lookup
    single: false
    permission: hr.read
    query: "SELECT name AS value, code || ' - ' || name AS label FROM departments WHERE status = 'Active' AND (:view_scope = 'all' OR branch_id = :current_branch_id) UNION SELECT DISTINCT e.department AS value, e.department AS label FROM employees e JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.department IS NOT NULL AND e.department <> '' AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - id: add_employee_btn
    label: '+ Add employees'
    variant: primary
    permission: hr.write
    action: add_employee

components:
  - type: ListView
    variant: odoo
    source: employees
    create_action: add_employee
    create_label: Add employee
    search:
      label: Search employees
      placeholder: 'Find code, name, phone number, or email...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Working }
          - { id: OnLeave, label: On leave }
          - { id: Inactive, label: Stop working }
    actions: [{ id: employees.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      new: Add employee
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all employees
      select_row: Select employee
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: job_title
          fields:
            - { field: code, label: Employee code }
            - { field: department, label: Department }
            - { field: phone, label: Phone }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_employee
    row_actions: menu
    empty_state:
      title: No staff
      description: Try changing the filter or create a new employee.
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: name, label: Full name, type: PrimaryEntityCell, secondary: job_title }
      - { field: code, label: Employee code }
      - { field: phone, label: Phone, type: PrimaryEntityCell, secondary: email }
      - { field: start_date, label: Day of work }
      - { field: dependents, label: Dependents, align: right }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Đang làm việc: green, Nghỉ phép: amber, Ngưng làm việc: red }
      - { field: created_at, label: Creation date and time, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_employee, label: Detail, variant: secondary, permission: hr.read }
          - { id: edit_employee, label: Edit, variant: ghost, permission: hr.write }
          - { id: delete_employee, label: Delete, variant: danger, permission: hr.write }

actions:
  - { id: view_employee, type: navigate, permission: hr.read, navigate_to: /hr/employees/detail, params: { id: '{row.id}' } }
  - id: add_employee
    type: form
    permission: hr.write
    title: More staff
    table: employees
    operation: insert
    refresh: [employees]
    fields:
      - { field: code, label: Employee code, type: text, required: true }
      - { field: name, label: Full name, type: text, required: true }
      - { field: job_title, label: Title, type: text }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: department, label: Departments, type: select, options_source: employee_department_lookup }
      - { field: start_date, label: Day of work, type: date }
      - { field: dependents, label: Dependents, type: number, default: 0 }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Working }, { id: OnLeave, label: On leave }, { id: Inactive, label: Shut down }], default: Active }
  - id: edit_employee
    type: form
    permission: hr.write
    title: Update staff
    table: employees
    operation: update
    prefill: row
    refresh: [employees]
    fields:
      - { field: code, label: Employee code, type: text, required: true }
      - { field: name, label: Full name, type: text, required: true }
      - { field: job_title, label: Title, type: text }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: department, label: Departments, type: select, options_source: employee_department_lookup }
      - { field: start_date, label: Day of work, type: date }
      - { field: dependents, label: Dependents, type: number }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Working }, { id: OnLeave, label: On leave }, { id: Inactive, label: Shut down }] }
  - id: delete_employee
    type: delete
    permission: hr.write
    confirm: 'Delete employee {{row.name}}?'
    table: employees
    refresh: [employees]
