title: Trip status
page: { id: system-trip-statuses, breadcrumb: [System, Trip status], auth: { require: [system.read] } }
datasources:
  - { id: trip_statuses, single: false, permission: system.read, query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'trip_status' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code" }
toolbar: [{ id: add_trip_status, label: '+ Add status', variant: primary, permission: system.write, action: add_trip_status }]
components:
  - type: ListView
    variant: odoo
    source: trip_statuses
    create_action: add_trip_status
    create_label: Add trip status
    search:
      label: Search trip statuses
      placeholder: 'Find code or name...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Active }
          - { id: Inactive, label: Inactive }
    actions:
      - { id: trip_statuses.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add trip status
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all trip statuses
      select_row: Select trip status
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: config_value, label: Value }
            - { field: description, label: Description }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: No trip status yet }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Trip status, type: PrimaryEntityCell, secondary: description }
      - { field: config_value, label: Value }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_trip_status, label: Edit, variant: ghost, permission: system.write }
          - { id: delete_trip_status, label: Delete, variant: danger, permission: system.write }
actions:
  - { id: add_trip_status, type: form, permission: system.write, title: Add trip status, table: system_configs, scope: trip_status, operation: insert, refresh: [trip_statuses], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Value, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }] }
  - { id: edit_trip_status, type: form, permission: system.write, title: Update trip status, table: system_configs, scope: trip_status, operation: update, prefill: row, refresh: [trip_statuses], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Value, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }] }
  - { id: delete_trip_status, type: delete, permission: system.write, table: system_configs, scope: trip_status, confirm: 'Delete state {{row.name}}?', refresh: [trip_statuses] }
