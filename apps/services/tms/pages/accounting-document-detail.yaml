title: Document details
page: { id: accounting-document-detail, breadcrumb: [Accountant, Document details], auth: { require: [accounting.read] } }

datasources:
  - id: accounting_document_detail
    single: true
    permission: accounting.read
    query: |
      SELECT a.id, a.kind, a.code, a.name, a.counterparty, a.currency, a.status,
        CASE a.kind WHEN 'debit_note' THEN 'Giấy báo nợ'
          WHEN 'payment_request' THEN 'Đề nghị thanh toán'
          WHEN 'advance' THEN 'Tạm ứng'
          WHEN 'settlement' THEN 'Hoàn ứng' ELSE a.kind END AS kind_label,
        CASE a.status WHEN 'Draft' THEN 'Nháp'
          WHEN 'Pending Approval' THEN 'Đang duyệt'
          WHEN 'Approved' THEN 'Đã duyệt'
          WHEN 'Paid' THEN 'Đã thanh toán'
          WHEN 'Cancelled' THEN 'Đã hủy' ELSE a.status END AS status_label,
        CAST(a.document_date AS VARCHAR) AS document_date,
        CAST(a.due_date AS VARCHAR) AS due_date,
        printf('%,.0f %s', COALESCE(a.amount, 0), a.currency) AS amount_display,
        a.description
      FROM accounting_entries a
      WHERE a.id = :id AND a.kind = :kind
        AND (:view_scope = 'all' OR a.branch_id = :current_branch_id)
        AND a.kind IN ('debit_note', 'payment_request', 'advance', 'settlement')
  - id: accounting_document_lines
    single: false
    permission: accounting.read
    query: |
      SELECT l.id, l.entry_id AS document_id, l.sequence, l.description,
        CAST(l.quantity AS DOUBLE) AS quantity, l.unit,
        CAST(l.unit_price AS DOUBLE) AS unit_price,
        CAST(l.tax_rate AS DOUBLE) AS tax_rate,
        CAST(l.line_total AS DOUBLE) AS line_total,
        printf('%,.3f', l.quantity) AS quantity_display,
        printf('%,.0f %s', l.unit_price, a.currency) AS unit_price_display,
        printf('%.2f%%', l.tax_rate) AS tax_rate_display,
        printf('%,.0f %s', l.line_total, a.currency) AS line_total_display,
        a.status AS parent_status, a.kind AS parent_kind
      FROM accounting_entry_lines l
      JOIN accounting_entries a ON a.id = l.entry_id
      WHERE l.entry_id = :id AND a.kind = :kind
        AND (:view_scope = 'all' OR a.branch_id = :current_branch_id)
      ORDER BY l.sequence
  - id: accounting_document_timeline
    single: false
    permission: accounting.read
    query: |
      SELECT actor_name, action,
        CASE
          WHEN action LIKE '%.submit_for_approval' THEN 'Trình duyệt'
          WHEN action LIKE '%.approve' THEN 'Đã duyệt'
          WHEN action LIKE '%.reject' THEN 'Từ chối'
          WHEN action LIKE '%.mark_paid' THEN 'Đã thanh toán'
          WHEN action LIKE '%.cancel' THEN 'Đã hủy'
          WHEN action = 'accounting.documents.lines.create' THEN 'Thêm dòng chi tiết'
          WHEN action = 'accounting.documents.lines.update' THEN 'Cập nhật dòng chi tiết'
          WHEN action = 'accounting.documents.lines.delete' THEN 'Xóa dòng chi tiết'
          ELSE action END AS action_label,
        detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity
      WHERE resource = 'accounting_entries' AND resource_id = :id
        AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM accounting_entries a WHERE a.id = :id AND a.branch_id = :current_branch_id))
      UNION ALL
      SELECT 'Hệ thống', 'created', 'Đã tạo', 'Khởi tạo chứng từ',
        CAST(created_at AS VARCHAR)
      FROM accounting_entries WHERE id = :id AND kind = :kind
        AND (:view_scope = 'all' OR branch_id = :current_branch_id)
      ORDER BY created_at DESC
  - id: accounting_unit_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'unit' AND status = 'Active' UNION SELECT DISTINCT unit AS value, unit AS label FROM accounting_entry_lines WHERE unit IS NOT NULL AND unit <> '' ORDER BY label"

toolbar:
  - { id: back_accounting_btn, label: 'List of documents', icon: arrow-left, variant: secondary, action: back_accounting }
  - { id: edit_accounting_document, label: Edit documents, variant: primary, permission: accounting.write, show_if: "state.accounting_document_detail.status === 'Draft'", action: edit_accounting_document }

components:
  - type: DocumentSummary
    source: accounting_document_detail
    title_field: code
    subtitle_field: name
    status_field: status_label
    status_colors: { Nháp: neutral, Đang duyệt: amber, Đã duyệt: green, Đã thanh toán: blue, Đã hủy: red }
    columns:
      - { field: kind_label, label: Document type }
      - { field: counterparty, label: Partner/recipient }
      - { field: document_date, label: Document date }
      - { field: due_date, label: Payment/refund deadline }
      - { field: currency, label: Money }
      - { field: description, label: Note }
  - type: LineItemGrid
    source: accounting_document_lines
    title: Document details
    description: Document value is calculated directly from the detail lines.
    page_size: 50
    row_key: id
    actions:
      - { id: add_accounting_line, label: '+ Add lines', variant: primary, permission: accounting.write, show_if: "state.accounting_document_detail.status === 'Draft'" }
    empty_state: { title: No details yet }
    columns:
      - { field: sequence, label: No, align: right }
      - { field: description, label: Content }
      - { field: quantity_display, label: Quantity, align: right }
      - { field: unit, label: Unit }
      - { field: unit_price_display, label: Unit price, align: right }
      - { field: tax_rate_display, label: Tax, align: right }
      - { field: line_total_display, label: Make money, align: right }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_accounting_line, label: Fix, variant: ghost, permission: accounting.write, show_if: "row.parent_status === 'Draft'" }
          - { id: delete_accounting_line, label: Erase, variant: danger, permission: accounting.write, show_if: "row.parent_status === 'Draft'" }
  - type: MoneySummary
    source: accounting_document_detail
    title: Total
    stats:
      - { label: Document value, field: amount_display, color: blue }
  - type: ApprovalTimeline
    source: accounting_document_timeline
    title: Document history
    empty_state: { title: There is no document activity yet }
    actor_field: actor_name
    action_field: action_label
    detail_field: detail
    timestamp_field: created_at

actions:
  - { id: back_accounting, type: navigate, navigate_to: '{state.back}' }
  - id: edit_accounting_document
    type: server_form
    permission: accounting.write
    title: Update documents
    action: accounting.documents.update
    handler: accounting_document
    operation: update
    prefill: source
    prefill_source: accounting_document_detail
    params: { id: '{state.id}', kind: '{state.kind}' }
    refresh: [accounting_document_detail, accounting_document_lines, accounting_document_timeline]
    fields:
      - { field: code, label: Document number, type: text, required: true }
      - { field: name, label: Content, type: text, required: true }
      - { field: counterparty, label: Partner/recipient, type: text }
      - { field: currency, label: Money, type: text, required: true }
      - { field: document_date, label: Document date, type: date }
      - { field: due_date, label: Payment/refund deadline, type: date }
      - { field: description, label: Note, type: textarea }
  - id: add_accounting_line
    type: server_form
    permission: accounting.write
    title: Add detail lines
    action: accounting.documents.lines.create
    handler: line_item
    operation: create
    domain: accounting
    params: { id: '{state.id}' }
    refresh: [accounting_document_lines, accounting_document_detail, accounting_document_timeline]
    fields:
      - { field: description, label: Content, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, default: 1, required: true }
      - { field: unit, label: Unit, type: select, options_source: accounting_unit_lookup, default: Khoản, required: true }
      - { field: unit_price, label: Unit price, type: money, currency: VND, default: 0, required: true }
      - { field: tax_rate, label: Tax rate (%), type: number, default: 0, required: true }
  - id: edit_accounting_line
    type: server_form
    permission: accounting.write
    title: Update detail line
    action: accounting.documents.lines.update
    handler: line_item
    operation: update
    domain: accounting
    prefill: row
    params: { id: '{state.id}', line_id: '{row.id}' }
    refresh: [accounting_document_lines, accounting_document_detail, accounting_document_timeline]
    fields:
      - { field: description, label: Content, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true }
      - { field: unit, label: Unit, type: select, options_source: accounting_unit_lookup, required: true }
      - { field: unit_price, label: Unit price, type: money, currency: VND, required: true }
      - { field: tax_rate, label: Tax rate (%), type: number, required: true }
  - id: delete_accounting_line
    type: server
    permission: accounting.write
    action: accounting.documents.lines.delete
    handler: line_item
    operation: delete
    domain: accounting
    confirm: 'Remove detail line {{row.description}}?'
    params: { id: '{state.id}', line_id: '{row.id}' }
    refresh: [accounting_document_lines, accounting_document_detail, accounting_document_timeline]
