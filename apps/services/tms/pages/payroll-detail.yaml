title: Salary details
page: { id: payroll-detail, breadcrumb: [Human resources, Payroll, Detail], auth: { require: [hr.read] } }
datasources:
  - id: payroll_detail
    single: true
    permission: hr.read
    query: |
      SELECT p.id, p.code, p.employee_id, CAST(p.pay_month AS VARCHAR) AS pay_month,
        p.base_salary, p.allowance, p.deduction, p.net_salary, p.status,
        e.code AS employee_code, e.name AS employee_name, e.department,
        CASE p.status WHEN 'Draft' THEN 'Nháp' WHEN 'Approved' THEN 'Đã duyệt' ELSE 'Đã chi' END AS status_label
      FROM payrolls p JOIN employees e ON e.id = p.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE p.id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)
  - id: payroll_activity
    single: false
    permission: hr.read
    query: "SELECT actor_name, action, detail, CAST(created_at AS VARCHAR) AS created_at FROM system_activity WHERE resource = 'payrolls' AND resource_id = :id AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM payrolls p JOIN employees e ON e.id = p.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE p.id = :id AND d.branch_id = :current_branch_id)) ORDER BY created_at DESC"
  - id: payroll_detail_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
components:
  - { type: DocumentSummary, source: payroll_detail, title_field: code, subtitle_field: employee_name, status_field: status_label, status_colors: { Nháp: blue, Đã duyệt: amber, Đã chi: green }, columns: [{ field: employee_code, label: Employee code }, { field: department, label: Departments }, { field: pay_month, label: Monthly salary }, { field: base_salary, label: Basic salary }, { field: allowance, label: Allowances }, { field: deduction, label: Deduction }, { field: net_salary, label: Truly cool }] }
  - type: ApprovalTimeline
    source: payroll_activity
    title: Payroll history
    empty_state: { title: There is no payroll activity yet }
    action_labels: { create: Đã tạo, update: Cập nhật, approve: Đã duyệt, mark_paid: Đã thanh toán, reopen: Mở lại, delete: Xóa }
    actor_field: actor_name
    action_field: action
    detail_field: detail
    timestamp_field: created_at
toolbar:
  - { id: back_payroll, label: 'List of payroll', icon: arrow-left, variant: secondary, action: back_payroll }
  - { id: edit_payroll_detail, label: Edit payroll, variant: primary, permission: hr.write, show_if: "state.payroll_detail.status === 'Draft'", action: edit_payroll_detail }
actions:
  - { id: back_payroll, type: navigate, navigate_to: /hr/payroll }
  - id: edit_payroll_detail
    type: form
    permission: hr.write
    title: Update payroll
    table: payrolls
    operation: update
    prefill: source
    prefill_source: payroll_detail
    refresh: [payroll_detail, payroll_activity]
    fields: [{ field: code, label: Payroll number, type: text, required: true }, { field: employee_id, label: Staff, type: select, options_source: payroll_detail_employee_lookup, required: true }, { field: pay_month, label: Monthly salary, type: date, required: true }, { field: base_salary, label: Basic salary, type: money, currency: VND }, { field: allowance, label: Allowances, type: money, currency: VND }, { field: deduction, label: Deduction, type: money, currency: VND }, { field: net_salary, label: Truly cool, type: money, currency: VND }]
