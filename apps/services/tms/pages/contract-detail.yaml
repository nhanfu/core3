title: Contract details
page: { id: contract-detail, breadcrumb: [Human resources, Contract, Detail], auth: { require: [hr.read] } }
datasources:
  - id: contract_detail
    single: true
    permission: hr.read
    query: |
      SELECT c.id, c.code, c.employee_id, c.contract_type, c.start_date, c.end_date,
        c.base_salary, c.status, e.code AS employee_code, e.name AS employee_name,
        e.job_title, e.department,
        CASE c.contract_type WHEN 'Probation' THEN 'Thử việc' WHEN 'Indefinite' THEN 'Không xác định thời hạn' ELSE 'Xác định thời hạn' END AS contract_type_label,
        CASE c.status WHEN 'Expiring' THEN 'Sắp hết hạn' WHEN 'Expired' THEN 'Hết hạn' WHEN 'Terminated' THEN 'Đã chấm dứt' ELSE 'Hiệu lực' END AS status_label
      FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE c.id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)
  - id: contract_activity
    single: false
    permission: hr.read
    query: |
      SELECT actor_name, action, detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity WHERE resource = 'employment_contracts' AND resource_id = :id
        AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE c.id = :id AND d.branch_id = :current_branch_id))
      ORDER BY created_at DESC
  - id: contract_documents
    single: false
    permission: hr.read
    query: "SELECT id, contract_id, file_name, mime_type, size_bytes, CAST(created_at AS VARCHAR) AS created_at FROM contract_documents WHERE contract_id = :id AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE c.id = :id AND d.branch_id = :current_branch_id)) ORDER BY created_at DESC"
  - id: contract_detail_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
components:
  - type: OdooFormView
    source: contract_detail
    title_field: code
    subtitle_field: employee_name
    status_field: status
    status_label_field: status_label
    status_colors: { Hiệu lực: green, Sắp hết hạn: amber, Hết hạn: red, Đã chấm dứt: blue }
    statusbar:
      - { value: Active, label: Effect }
      - { value: Expiring, label: About to expire }
      - { value: Expired, label: Expired }
      - { value: Terminated, label: Terminated }
    header_actions:
      - { id: edit_contract_detail, label: Edit contract, variant: secondary }
    message_source: contract_activity
    attachment_source: contract_documents
    chatter_label: Contract history
    attachment_label: Documents
    message_actor_field: actor_name
    message_action_field: action
    message_detail_field: detail
    message_timestamp_field: created_at
    content_slot: true
    groups:
      - title: Contract details
        fields:
          - { field: employee_code, label: Employee code }
          - { field: job_title, label: Title }
          - { field: department, label: Department }
          - { field: contract_type_label, label: Contract type }
          - { field: start_date, label: Effective from }
          - { field: end_date, label: Effective until }
          - { field: base_salary, label: Basic salary, type: money }
  - type: DataGrid
    source: contract_documents
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: No contract documents yet }
    columns: [{ field: file_name, label: File name }, { field: mime_type, label: Type }, { field: size_bytes, label: Capacity, align: right }, { field: created_at, label: Upload date }, { field: actions, label: '', sortable: false, actions: [{ id: download_contract_document, label: Download, variant: ghost, permission: hr.read }] }]
toolbar:
  - { id: back_contracts, label: 'List of contracts', icon: arrow-left, variant: secondary, action: back_contracts }
  - { id: upload_contract_document, label: '+ Download documents', variant: secondary, permission: hr.write, action: upload_contract_document }
actions:
  - { id: back_contracts, type: navigate, navigate_to: /hr/contracts }
  - { id: upload_contract_document, type: upload, permission: hr.write, kind: contract_document, params: { contract_id: '{state.id}' }, refresh: [contract_documents, contract_activity] }
  - { id: download_contract_document, type: download, permission: hr.read, kind: contract_document }
  - id: edit_contract_detail
    type: form
    permission: hr.write
    title: Update contract
    table: employment_contracts
    operation: update
    prefill: source
    prefill_source: contract_detail
    refresh: [contract_detail, contract_activity]
    fields: [{ field: code, label: Contract code, type: text, required: true }, { field: employee_id, label: Staff, type: select, options_source: contract_detail_employee_lookup, required: true }, { field: contract_type, label: Contract type, type: select, options: [{ id: Probation, label: Try job }, { id: FixedTerm, label: Determine the deadline }, { id: Indefinite, label: No deadline specified }] }, { field: start_date, label: Magnetic effect, type: date, required: true }, { field: end_date, label: Effect arrives, type: date }, { field: base_salary, label: Basic salary, type: money, currency: VND }, { field: status, label: Status, type: select, options: [{ id: Active, label: Effect }, { id: Expiring, label: About to expire }, { id: Expired, label: Expired }, { id: Terminated, label: Terminated }] }]
