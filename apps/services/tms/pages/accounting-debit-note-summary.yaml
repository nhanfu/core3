title: Summary of debt notices
page: { id: accounting-debit-note-summary, breadcrumb: [Accountant, Summary of debt notices], auth: { require: [accounting.read] } }
datasources:
  - id: debit_note_totals
    single: true
    permission: accounting.read
    query: |
      SELECT COUNT(*) AS document_count,
        COALESCE(SUM(amount), 0) AS total_amount,
        COALESCE(SUM(CASE WHEN status IN ('Draft', 'Pending Approval', 'Approved') THEN amount ELSE 0 END), 0) AS outstanding_amount,
        COALESCE(SUM(CASE WHEN status = 'Paid' THEN amount ELSE 0 END), 0) AS paid_amount
      FROM accounting_entries
      WHERE kind = 'debit_note' AND (:view_scope = 'all' OR branch_id = :current_branch_id) AND (:from_date IS NULL OR document_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR document_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
  - id: debit_note_summary
    single: false
    permission: accounting.read
    query: |
      SELECT COALESCE(counterparty, 'Chưa xác định') AS counterparty, status,
        CASE status WHEN 'Draft' THEN 'Nháp' WHEN 'Pending Approval' THEN 'Đang duyệt'
          WHEN 'Approved' THEN 'Đã duyệt' WHEN 'Paid' THEN 'Đã thanh toán'
          WHEN 'Cancelled' THEN 'Đã hủy' ELSE status END AS status_label,
        currency, COUNT(*) AS document_count,
        printf('%,.0f', COALESCE(SUM(amount), 0)) AS total_amount_display,
        CAST(MAX(document_date) AS VARCHAR) AS latest_document_date
      FROM accounting_entries
      WHERE kind = 'debit_note' AND (:view_scope = 'all' OR branch_id = :current_branch_id) AND (:status IS NULL OR status = :status)
        AND (:from_date IS NULL OR document_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR document_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR counterparty ILIKE '%' || :q || '%' OR status ILIKE '%' || :q || '%')
      GROUP BY counterparty, status, currency
      ORDER BY SUM(amount) DESC, counterparty
  - id: debit_note_status_breakdown
    single: false
    permission: accounting.read
    query: |
      SELECT CASE status WHEN 'Draft' THEN 'Nháp' WHEN 'Pending Approval' THEN 'Đang duyệt'
        WHEN 'Approved' THEN 'Đã duyệt' WHEN 'Paid' THEN 'Đã thanh toán'
        WHEN 'Cancelled' THEN 'Đã hủy' ELSE status END AS label,
        COUNT(*) AS value
      FROM accounting_entries
      WHERE kind = 'debit_note' AND (:view_scope = 'all' OR branch_id = :current_branch_id)
        AND (:from_date IS NULL OR document_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR document_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
      GROUP BY status ORDER BY value DESC
components:
  - type: ListToolbar
    source: debit_note_summary
    filter_sources: [debit_note_summary, debit_note_totals, debit_note_status_breakdown]
    date_range: { from_field: from_date, to_field: to_date, from_label: 'From date', to_label: 'Come day', presets: [today, week, month, quarter, year, all] }
    search: { label: General search, placeholder: 'Find a partner or status...' }
    actions: [{ id: debit_note_summary.export, label: 'Export CSV', icon: download }]
  - type: StatRow
    source: debit_note_totals
    stats: [{ label: Document number, field: document_count, color: blue }, { label: Total value, field: total_amount, color: blue }, { label: Still have to collect, field: outstanding_amount, color: amber }, { label: Paid, field: paid_amount, color: green }]
  - { type: Chart, source: debit_note_status_breakdown, title: Documents by status, label_field: label, value_field: value, width: 560, height: 240, color: blue }
  - { type: StatusTabs, source: debit_note_summary, filter_field: status, tabs: [{ id: '', label: All }, { id: Draft, label: Draft }, { id: Pending Approval, label: Browsing }, { id: Approved, label: Approved }, { id: Paid, label: Paid }, { id: Cancelled, label: Canceled }] }
  - type: DataGrid
    source: debit_note_summary
    page_size: 20
    column_chooser: true
    row_key: counterparty
    empty_state: { title: No aggregate data available }
    columns:
      - { field: counterparty, label: Partner, sortable: true }
      - { field: status_label, label: Status, type: StatusChip, colors: { Draft: neutral, Browsing: amber, Approved: green, Paid: blue, Canceled: red } }
      - { field: document_count, label: Document number, align: right }
      - { field: total_amount_display, label: Total value, align: right }
      - { field: currency, label: Money }
      - { field: latest_document_date, label: Latest documents }
actions: []
