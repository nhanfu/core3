title: Driver details
page: { id: driver-detail, breadcrumb: [Category, Driver, Detail], auth: { require: [drivers.read] } }
datasources:
  - id: driver_detail
    single: true
    permission: drivers.read
    query: |
      SELECT d.id, d.name, d.phone, d.email, d.license_number, CAST(d.license_expiry AS VARCHAR) AS license_expiry,
        d.status, t.plate AS truck_plate,
        CASE WHEN d.license_expiry < CURRENT_DATE THEN 'Đã hết hạn' WHEN d.license_expiry <= CURRENT_DATE + INTERVAL 30 DAY THEN 'Sắp hết hạn' ELSE 'Còn hiệu lực' END AS compliance_label
      FROM drivers d LEFT JOIN trucks t ON t.id = d.assigned_truck_id WHERE d.id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)
  - id: driver_trips
    single: false
    permission: drivers.read
    query: |
      SELECT tr.id, tr.trip_number, tr.origin, tr.destination, tr.status, CAST(tr.departure_time AS VARCHAR) AS departure_time,
        CAST(tr.arrival_time AS VARCHAR) AS arrival_time
      FROM trips tr LEFT JOIN trucks t ON t.id = tr.truck_id WHERE tr.driver_id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY tr.departure_time DESC
  - id: driver_detail_vehicle_lookup
    single: false
    permission: drivers.read
    query: "SELECT id AS value, plate || ' - ' || model AS label FROM trucks WHERE (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY plate"
components:
  - type: OdooFormView
    source: driver_detail
    title_field: name
    subtitle_field: license_number
    status_field: compliance_label
    status_colors: { Còn hiệu lực: green, Sắp hết hạn: amber, Đã hết hạn: red }
    header_actions:
      - { id: edit_driver_detail, label: Edit driver, variant: secondary }
    groups:
      - title: Driver details
        fields:
          - { field: phone, label: Phone }
          - { field: email, label: Email }
          - { field: license_expiry, label: License expiry }
          - { field: truck_plate, label: Vehicle }
          - { field: status, label: Status }
    content_slot: true
  - type: ListView
    variant: odoo
    source: driver_trips
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: There is no bus yet }
    columns: [{ field: trip_number, label: Trip }, { field: origin, label: Point go }, { field: destination, label: Destination }, { field: departure_time, label: Depart }, { field: arrival_time, label: Complete }, { field: status, label: Status }]
toolbar:
  - { id: back_drivers, label: 'Driver list', icon: arrow-left, variant: secondary, action: back_drivers }
actions:
  - { id: back_drivers, type: navigate, navigate_to: /drivers }
  - id: edit_driver_detail
    type: form
    permission: drivers.write
    title: Update driver
    table: drivers
    operation: update
    prefill: source
    prefill_source: driver_detail
    refresh: [driver_detail, driver_trips]
    fields:
      - { field: name, label: Full name, type: text, required: true }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: license_number, label: License number, type: text, required: true }
      - { field: license_expiry, label: License term, type: date, required: true }
      - { field: assigned_truck_id, label: Vehicle in charge, type: select, options_source: driver_detail_vehicle_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Active }, { id: 'On Leave', label: On leave }, { id: Inactive, label: Shut down }] }
