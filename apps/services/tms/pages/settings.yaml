title: Setting

page:
  id: settings
  auth:
    require: [settings.read]

datasources:
  - id: branches
    single: false
    permission: settings.read
    query: |
      SELECT b.*, COUNT(t.id) AS truck_count
      FROM branches b LEFT JOIN trucks t ON t.branch_id = b.id
      GROUP BY b.id, b.name, b.city, b.region, b.status, b.created_at, b.updated_at
      ORDER BY b.name
  - id: users
    single: false
    permission: settings.read
    query: |
      SELECT u.id, u.email, u.name, u.avatar_url, u.preferred_lang, u.created_at,
        string_agg(r.name, ',') AS roles_csv
      FROM users u
      LEFT JOIN user_roles ur ON ur.user_id = u.id
      LEFT JOIN roles r ON r.id = ur.role_id
      GROUP BY u.id, u.email, u.name, u.avatar_url, u.preferred_lang, u.created_at
      ORDER BY u.name
  - id: roles
    single: false
    permission: settings.read
    query: |
      SELECT r.id, r.name, r.description, r.view_scope, COUNT(p.id) AS permission_count
      FROM roles r LEFT JOIN permissions p ON p.role_id = r.id
      GROUP BY r.id, r.name, r.description, r.view_scope
      ORDER BY r.name
  - id: settings_role_lookup
    single: false
    permission: settings.read
    query: "SELECT name AS value, name AS label FROM roles ORDER BY name"
toolbar:
  - id: add_branch_btn
    label: "+ Add branch"
    variant: secondary
    permission: settings.write
    action: add_branch
  - id: add_user_btn
    label: "+ Invite users"
    variant: primary
    permission: settings.write
    action: add_user

components:
  - type: TabGroup
    tabs:
      - id: branches-tab
        label: Branch
        permission: settings.read
        components:
          - type: GridView
            source: branches
            page_size: 20
            empty_state: { title: No branches }
            columns:
              - type: TextCell
                field: name
                label: Name
              - type: TextCell
                field: city
                label: City
                secondary: region
              - type: BadgeCell
                field: status
                label: Status
                colors:
                  Active: green
                  Inactive: red
              - type: NumberCell
                field: truck_count
                label: Vehicle
                format: "#,###"
              - type: ActionCell
                label: ""
                actions:
                  - id: edit_branch
                    label: Fix
                    variant: ghost
                    permission: settings.write
                  - id: delete_branch
                    label: Erase
                    variant: danger
                    permission: settings.write

      - id: users-tab
        label: User
        permission: settings.read
        components:
          - type: GridView
            source: users
            page_size: 20
            empty_state: { title: No users }
            columns:
              - type: TextCell
                field: name
                label: Name
              - type: TextCell
                field: email
                label: E-mail
              - type: TextCell
                field: roles_csv
                label: Role
              - type: TextCell
                field: preferred_lang
                label: Language
              - type: ActionCell
                label: ""
                actions:
                  - id: edit_user
                    label: Fix
                    variant: ghost
                    permission: settings.write

      - id: roles-tab
        label: Role
        permission: settings.read
        components:
          - type: GridView
            source: roles
            page_size: 20
            empty_state: { title: No role }
            columns:
              - type: TextCell
                field: name
                label: Role
              - type: TextCell
                field: description
                label: Describe
              - type: NumberCell
                field: permission_count
                label: Rights
                format: "#,###"

actions:
  - id: add_branch
    type: form
    permission: settings.write
    title: Add branch
    table: branches
    operation: insert
    prefill: null
    refresh: [branches]
    fields:
      - field: name
        label: Name
        type: text
        required: true
      - field: city
        label: City
        type: text
        required: true
      - field: region
        label: Area
        type: text
        required: false
      - field: status
        label: Status
        type: select
        required: false
        options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }]
        default: Active

  - id: edit_branch
    type: form
    permission: settings.write
    title: Branch update
    table: branches
    operation: update
    prefill: row
    refresh: [branches]
    fields:
      - field: name
        label: Name
        type: text
        required: true
      - field: city
        label: City
        type: text
        required: true
      - field: region
        label: Area
        type: text
        required: false
      - field: status
        label: Status
        type: select
        required: false
        options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }]
        default: Active

  - id: delete_branch
    type: delete
    permission: settings.write
    confirm: "Delete branch {{row.name}}?"
    table: branches
    refresh: [branches]

  - id: add_user
    type: form
    permission: settings.write
    title: Invite users
    table: users
    operation: insert
    prefill: null
    refresh: [users]
    fields:
      - field: name
        label: Name
        type: text
        required: true
      - field: email
        label: E-mail
        type: text
        required: true
      - field: password
        label: Initial password
        type: text
        required: true
      - field: roles
        label: Role
        type: multi-select
        options_source: settings_role_lookup
        search_placeholder: 'Find roles...'
        multiple: true
        required: false

  - id: edit_user
    type: form
    permission: settings.write
    title: Update users
    table: users
    operation: update
    prefill: row
    refresh: [users]
    fields:
      - field: name
        label: Name
        type: text
        required: false
      - field: email
        label: E-mail
        type: text
        required: false
      - field: roles
        label: Role
        type: multi-select
        options_source: settings_role_lookup
        search_placeholder: 'Find roles...'
        multiple: true
        required: false
