title: KPI targets
page: { id: crm-kpi, breadcrumb: [Business, KPI targets], auth: { require: [crm.read] } }
datasources:
  - id: crm_kpi_totals
    single: true
    permission: crm.read
    query: |
      SELECT
        (SELECT COUNT(*) FROM customers WHERE stage = 'Lead' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR (:view_scope = 'own' AND owner_name = :current_user_name) OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)))) AS lead_count,
        (SELECT COUNT(*) FROM customers WHERE status = 'Active' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR (:view_scope = 'own' AND owner_name = :current_user_name) OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)))) AS active_customer_count,
        (SELECT COUNT(*) FROM quotes WHERE status = 'Accepted' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS accepted_quote_count,
        ROUND(100.0 * (SELECT COUNT(*) FROM quotes WHERE status = 'Accepted' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) / NULLIF((SELECT COUNT(*) FROM customers WHERE stage = 'Lead' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR (:view_scope = 'own' AND owner_name = :current_user_name) OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)))), 0), 1) AS conversion_rate
  - id: crm_stage_kpis
    single: false
    permission: crm.read
    query: |
      SELECT stage AS metric, COUNT(*) AS customer_count,
        SUM(CASE WHEN status = 'Active' THEN 1 ELSE 0 END) AS active_count
      FROM customers WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR (:view_scope = 'own' AND owner_name = :current_user_name) OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name))) GROUP BY stage ORDER BY stage
  - id: crm_quote_kpis
    single: false
    permission: crm.read
    query: |
      SELECT status AS label, COUNT(*) AS value FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id) GROUP BY status ORDER BY status
components:
  - type: ListToolbar
    source: crm_stage_kpis
    filter_sources: [crm_kpi_totals, crm_stage_kpis, crm_quote_kpis]
    date_range: { from_field: from_date, to_field: to_date, from_label: 'From date', to_label: 'Come day', presets: [today, week, month, quarter, year, all] }
    actions: [{ id: crm_stage_kpis.export, label: 'Export CSV', icon: download }]
  - type: StatRow
    source: crm_kpi_totals
    stats: [{ label: Potential guests, field: lead_count, color: amber }, { label: Guest is active, field: active_customer_count, color: green }, { label: Quote accepted, field: accepted_quote_count, color: blue }, { label: Conversion rate, field: conversion_rate, color: indigo, format: percent }]
  - { type: Chart, source: crm_quote_kpis, title: Quote by status, label_field: label, value_field: value, width: 560, height: 240, color: teal }
  - type: DataGrid
    source: crm_stage_kpis
    page_size: 20
    column_chooser: true
    row_key: metric
    empty_state: { title: There are no targets by stage }
    columns:
      - { field: metric, label: Stage }
      - { field: customer_count, label: Total customers, align: right }
      - { field: active_count, label: Active, align: right }
actions: []
