title: Browsing process
page: { id: system-approval-flows, breadcrumb: [System, Browsing process], auth: { require: [system.read] } }
datasources:
  - id: approval_flows
    single: false
    permission: system.read
    query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'approval_flow' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code"
toolbar: [{ id: add_approval_flow, label: '+ Add process', variant: primary, permission: system.write, action: add_approval_flow }]
components:
  - type: ListView
    variant: odoo
    source: approval_flows
    create_action: add_approval_flow
    create_label: Add approval flow
    search:
      label: Search approval flows
      placeholder: 'Find code or name...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Active }
          - { id: Inactive, label: Inactive }
    actions:
      - { id: approval_flows.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add approval flow
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all approval flows
      select_row: Select approval flow
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: config_value, label: Configuration }
            - { field: description, label: Description }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no approval process yet }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Procedure, type: PrimaryEntityCell, secondary: description }
      - { field: config_value, label: Configuration }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_approval_flow, label: View details, variant: primary, permission: system.read }
          - { id: edit_approval_flow, label: Edit, variant: ghost, permission: system.write }
          - { id: delete_approval_flow, label: Delete, variant: danger, permission: system.write }
actions:
  - { id: view_approval_flow, type: navigate, permission: system.read, navigate_to: /system/approval-flows/detail, params: { id: '{row.id}' } }
  - { id: add_approval_flow, type: form, permission: system.write, title: Add browsing process, table: system_configs, scope: approval_flow, operation: insert, refresh: [approval_flows], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Old steps, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }] }
  - { id: edit_approval_flow, type: form, permission: system.write, title: Update approval process, table: system_configs, scope: approval_flow, operation: update, prefill: row, refresh: [approval_flows], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Old steps, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }] }
  - { id: delete_approval_flow, type: delete, permission: system.write, table: system_configs, scope: approval_flow, confirm: 'Delete process {{row.name}}?', refresh: [approval_flows] }
