title: Team
page:
  id: teams
  breadcrumb: [Organization & decentralization, Team]
  auth: { require: [settings.read] }
datasources:
  - id: teams
    single: false
    permission: settings.read
    query: |
      SELECT t.*, d.name AS department_name, e.name AS manager_name, CASE t.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label FROM teams t LEFT JOIN departments d ON d.id = t.department_id LEFT JOIN employees e ON e.id = t.manager_id
      WHERE (NULLIF(:status, '') IS NULL OR t.status = :status)
        AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (:q IS NULL OR t.code ILIKE '%' || :q || '%' OR t.name ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%')
      ORDER BY t.created_at DESC, t.name
  - id: team_department_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM departments WHERE status = 'Active' ORDER BY name"
  - id: team_manager_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name || ' (' || code || ')' AS label FROM employees WHERE status = 'Active' ORDER BY name"
toolbar:
  - { id: add_team_btn, label: '+ Add teams', variant: primary, permission: settings.write, action: add_team }
components:
  - type: ListToolbar
    source: teams
    filter_field: q
    search: { label: Search for teams, placeholder: 'Find code, name or department...' }
    actions: [{ id: teams.export, label: 'Export CSV', icon: download }]
  - type: StatusTabs
    source: teams
    filter_field: status
    variant: contained
    tabs: [{ id: '', label: All }, { id: Active, label: Work }, { id: Inactive, label: Shut down }]
  - type: DataGrid
    source: teams
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: There is no team, description: Try changing filters or creating new teams. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: code, label: Code/name, type: PrimaryEntityCell, secondary: name }
      - { field: department_name, label: Departments }
      - { field: manager_name, label: Person in charge }
      - { field: status_label, label: Status, type: StatusChip, colors: { Work: green, Shut down: red } }
      - { field: created_at, label: Creation date and time }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions: [{ id: edit_team, label: Fix, variant: ghost, permission: settings.write }, { id: delete_team, label: Erase, variant: danger, permission: settings.write }]
actions:
  - id: add_team
    type: form
    permission: settings.write
    title: Add teams
    table: teams
    operation: insert
    refresh: [teams]
    fields: [{ field: code, label: Team code, type: text, required: true }, { field: name, label: Team name, type: text, required: true }, { field: department_id, label: Departments, type: select, options_source: team_department_lookup }, { field: manager_id, label: Person in charge, type: select, options_source: team_manager_lookup }, { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }], default: Active }]
  - id: edit_team
    type: form
    permission: settings.write
    title: Update the team
    table: teams
    operation: update
    prefill: row
    refresh: [teams]
    fields: [{ field: code, label: Team code, type: text, required: true }, { field: name, label: Team name, type: text, required: true }, { field: department_id, label: Departments, type: select, options_source: team_department_lookup }, { field: manager_id, label: Person in charge, type: select, options_source: team_manager_lookup }, { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }]
  - { id: delete_team, type: delete, permission: settings.write, confirm: 'Delete team {{row.name}}?', table: teams, refresh: [teams] }
