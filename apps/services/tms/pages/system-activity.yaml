title: Operation history
page: { id: system-activity, breadcrumb: [System, Operation history], auth: { require: [system.read] } }
datasources:
  - id: system_activity
    single: false
    permission: system.read
    query: |
      SELECT id, actor_id, actor_name, action, resource, resource_id, detail,
        CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity
      WHERE (:q IS NULL OR actor_name ILIKE '%' || :q || '%' OR action ILIKE '%' || :q || '%' OR resource ILIKE '%' || :q || '%' OR resource_id ILIKE '%' || :q || '%')
        AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (
          :view_scope = 'all'
          OR (resource = 'branches' AND resource_id = :current_branch_id)
          OR (resource = 'trucks' AND EXISTS (SELECT 1 FROM trucks t WHERE t.id = resource_id AND t.branch_id = :current_branch_id))
          OR (resource = 'drivers' AND EXISTS (SELECT 1 FROM drivers d LEFT JOIN trucks t ON t.id = d.assigned_truck_id WHERE d.id = resource_id AND t.branch_id = :current_branch_id))
          OR (resource = 'trips' AND EXISTS (SELECT 1 FROM trips tr LEFT JOIN trucks t ON t.id = tr.truck_id WHERE tr.id = resource_id AND (tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id)))
          OR (resource = 'maintenance' AND EXISTS (SELECT 1 FROM maintenance m JOIN trucks t ON t.id = m.truck_id WHERE m.id = resource_id AND t.branch_id = :current_branch_id))
          OR (resource IN ('orders', 'quotes', 'accounting_entries', 'locations', 'containers') AND EXISTS (SELECT 1 FROM orders o WHERE resource = 'orders' AND o.id = resource_id AND o.branch_id = :current_branch_id))
          OR (resource IN ('orders', 'quotes', 'accounting_entries', 'locations', 'containers') AND EXISTS (SELECT 1 FROM quotes q WHERE resource = 'quotes' AND q.id = resource_id AND q.branch_id = :current_branch_id))
          OR (resource IN ('orders', 'quotes', 'accounting_entries', 'locations', 'containers') AND EXISTS (SELECT 1 FROM accounting_entries a WHERE resource = 'accounting_entries' AND a.id = resource_id AND a.branch_id = :current_branch_id))
          OR (resource IN ('orders', 'quotes', 'accounting_entries', 'locations', 'containers') AND EXISTS (SELECT 1 FROM locations l WHERE resource = 'locations' AND l.id = resource_id AND l.branch_id = :current_branch_id))
          OR (resource IN ('orders', 'quotes', 'accounting_entries', 'locations', 'containers') AND EXISTS (SELECT 1 FROM containers c WHERE resource = 'containers' AND c.id = resource_id AND c.branch_id = :current_branch_id))
          OR (resource = 'users' AND EXISTS (SELECT 1 FROM users u WHERE u.id = resource_id AND u.branch_id = :current_branch_id))
          OR (resource = 'employees' AND EXISTS (SELECT 1 FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.id = resource_id AND d.branch_id = :current_branch_id))
          OR (resource IN ('employment_contracts', 'timesheets', 'payrolls') AND EXISTS (SELECT 1 FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE resource = 'employment_contracts' AND c.id = resource_id AND d.branch_id = :current_branch_id))
          OR (resource IN ('employment_contracts', 'timesheets', 'payrolls') AND EXISTS (SELECT 1 FROM timesheets ts JOIN employees e ON e.id = ts.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE resource = 'timesheets' AND ts.id = resource_id AND d.branch_id = :current_branch_id))
          OR (resource IN ('employment_contracts', 'timesheets', 'payrolls') AND EXISTS (SELECT 1 FROM payrolls p JOIN employees e ON e.id = p.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE resource = 'payrolls' AND p.id = resource_id AND d.branch_id = :current_branch_id))
          OR (resource = 'departments' AND EXISTS (SELECT 1 FROM departments d WHERE d.id = resource_id AND d.branch_id = :current_branch_id))
          OR (resource = 'teams' AND EXISTS (SELECT 1 FROM teams t JOIN departments d ON d.id = t.department_id WHERE t.id = resource_id AND d.branch_id = :current_branch_id))
          OR (resource = 'customers' AND EXISTS (SELECT 1 FROM customers c WHERE c.id = resource_id AND ((:view_scope = 'branch' AND (c.visibility = 'Public' OR c.owner_name = :current_user_name)) OR (:view_scope = 'own' AND c.owner_name = :current_user_name))))
          OR (resource = 'partners' AND EXISTS (SELECT 1 FROM partners p WHERE p.id = resource_id AND ((:view_scope = 'branch' AND (p.visibility = 'Public' OR p.owner_name = :current_user_name)) OR (:view_scope = 'own' AND p.owner_name = :current_user_name))))
          OR (resource = 'chat_threads' AND EXISTS (SELECT 1 FROM chat_participants cp WHERE cp.thread_id = resource_id AND cp.user_id = :current_user_id))
          OR resource IN ('master_data', 'system_configs', 'approval_flow_steps', 'print_template_blocks', 'company_profiles')
        )
      ORDER BY created_at DESC
components:
  - type: ListToolbar
    source: system_activity
    filter_field: q
    date_range: { from_field: from_date, to_field: to_date, from_label: 'From date', to_label: 'Come day', presets: [today, week, month, quarter, year, last_12_months, all], default_preset: last_12_months }
    search: { label: Search history, placeholder: 'Find operators or resources...' }
    actions: [{ id: system_activity.export, label: 'Export CSV', icon: download }]
  - type: DataGrid
    source: system_activity
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: There is no operation history }
    columns: [{ field: actor_name, label: Operator }, { field: action, label: Act }, { field: resource, label: Resources }, { field: resource_id, label: Record code }, { field: detail, label: Detail }, { field: created_at, label: Time }]
actions: []
