title: Employee details
page: { id: employee-detail, breadcrumb: [Human resources, Staff, Detail], auth: { require: [hr.read] } }
datasources:
  - id: employee_detail
    single: true
    permission: hr.read
    query: |
      SELECT e.id, e.code, e.name, e.job_title, e.phone, e.email, e.department,
        CAST(e.start_date AS VARCHAR) AS start_date, e.dependents, e.status,
        CASE e.status WHEN 'OnLeave' THEN 'Nghỉ phép' WHEN 'Inactive' THEN 'Ngưng làm việc' ELSE 'Đang làm việc' END AS status_label
      FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE e.id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)
  - id: employee_contracts
    single: false
    permission: hr.read
    query: |
      SELECT c.id, c.code, c.contract_type, CAST(c.start_date AS VARCHAR) AS start_date,
        CAST(c.end_date AS VARCHAR) AS end_date, c.base_salary, c.status
      FROM employment_contracts c JOIN employees e ON e.id = c.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE c.employee_id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY c.start_date DESC
  - id: employee_activity
    single: false
    permission: hr.read
    query: |
      SELECT actor_name, action, detail, CAST(created_at AS VARCHAR) AS created_at
      FROM system_activity WHERE resource = 'employees' AND resource_id = :id
        AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.id = :id AND d.branch_id = :current_branch_id))
      ORDER BY created_at DESC
  - id: employee_detail_department_lookup
    single: false
    permission: hr.read
    query: "SELECT name AS value, code || ' - ' || name AS label FROM departments WHERE status = 'Active' AND (:view_scope = 'all' OR branch_id = :current_branch_id) UNION SELECT DISTINCT e.department AS value, e.department AS label FROM employees e JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.department IS NOT NULL AND e.department <> '' AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY label"
  - id: employee_documents
    single: false
    permission: hr.read
    query: "SELECT id, employee_id, file_name, mime_type, size_bytes, CAST(created_at AS VARCHAR) AS created_at FROM employee_documents WHERE employee_id = :id AND (:view_scope = 'all' OR EXISTS (SELECT 1 FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE e.id = :id AND d.branch_id = :current_branch_id)) ORDER BY created_at DESC"
components:
  - type: OdooFormView
    source: employee_detail
    title_field: name
    subtitle_field: code
    status_field: status
    status_label_field: status_label
    status_colors: { Đang làm việc: green, Nghỉ phép: amber, Ngưng làm việc: red }
    statusbar:
      - { value: Active, label: Working }
      - { value: OnLeave, label: On leave }
      - { value: Inactive, label: Stop working }
    header_actions:
      - { id: edit_employee_detail, label: Edit information, variant: secondary }
    message_source: employee_activity
    attachment_source: employee_documents
    chatter_label: Employee history
    attachment_label: Documents
    message_actor_field: actor_name
    message_action_field: action
    message_detail_field: detail
    message_timestamp_field: created_at
    content_slot: true
    groups:
      - title: Employee details
        fields:
          - { field: job_title, label: Title }
          - { field: department, label: Department }
          - { field: phone, label: Phone }
          - { field: email, label: Email }
          - { field: start_date, label: Start date }
          - { field: dependents, label: Dependents }
  - type: ListView
    variant: odoo
    source: employee_contracts
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: No contract yet }
    columns: [{ field: code, label: Contract }, { field: contract_type, label: Type }, { field: start_date, label: From date }, { field: end_date, label: Come day }, { field: base_salary, label: Basic salary, align: right }, { field: status, label: Status }]
  - type: ListView
    variant: odoo
    source: employee_documents
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: No personnel documents yet }
    columns: [{ field: file_name, label: File name }, { field: mime_type, label: Type }, { field: size_bytes, label: Capacity, align: right }, { field: created_at, label: Upload date }, { field: actions, label: '', sortable: false, actions: [{ id: download_employee_document, label: Download, variant: ghost, permission: hr.read }] }]
toolbar:
  - { id: back_employees, label: 'List of employees', icon: arrow-left, variant: secondary, action: back_employees }
  - { id: upload_employee_document, label: '+ Download documents', variant: secondary, permission: hr.write, action: upload_employee_document }
actions:
  - { id: back_employees, type: navigate, navigate_to: /hr/employees }
  - { id: upload_employee_document, type: upload, permission: hr.write, kind: employee_document, params: { employee_id: '{state.id}' }, refresh: [employee_documents, employee_activity] }
  - { id: download_employee_document, type: download, permission: hr.read, kind: employee_document }
  - id: edit_employee_detail
    type: form
    permission: hr.write
    title: Update staff
    table: employees
    operation: update
    prefill: source
    prefill_source: employee_detail
    refresh: [employee_detail, employee_activity]
    fields: [{ field: code, label: Employee code, type: text, required: true }, { field: name, label: Full name, type: text, required: true }, { field: job_title, label: Title, type: text }, { field: phone, label: Phone number, type: text }, { field: email, label: E-mail, type: text }, { field: department, label: Departments, type: select, options_source: employee_detail_department_lookup }, { field: start_date, label: Day of work, type: date }, { field: dependents, label: Dependents, type: number }, { field: status, label: Status, type: select, options: [{ id: Active, label: Working }, { id: OnLeave, label: On leave }, { id: Inactive, label: Shut down }] }]
