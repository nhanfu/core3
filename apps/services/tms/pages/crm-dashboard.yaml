title: Summary of CRM
page: { id: crm-dashboard, breadcrumb: [Business, Summary of CRM], auth: { require: [crm.read] } }
datasources:
  - id: crm_kpis
    single: true
    permission: crm.read
    query: |
      SELECT (SELECT COUNT(*) FROM customers WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR (:view_scope = 'own' AND owner_name = :current_user_name) OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)))) AS customer_count,
        (SELECT COUNT(*) FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:from_date IS NULL OR e.created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR e.created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)) AS employee_count,
        (SELECT COUNT(*) FROM teams t LEFT JOIN departments d ON d.id = t.department_id WHERE (:from_date IS NULL OR t.created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR t.created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)) AS team_count,
        (SELECT COUNT(*) FROM company_profiles) AS company_count,
        (SELECT COUNT(*) FROM customers WHERE stage = 'Lead' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR (:view_scope = 'own' AND owner_name = :current_user_name) OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)))) AS lead_count,
        (SELECT COUNT(*) FROM quotes WHERE status = 'Accepted' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS accepted_quote_count,
        (SELECT COALESCE(SUM(amount), 0) FROM quotes WHERE status = 'Accepted' AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)) AS accepted_quote_value,
        (SELECT COUNT(*) FROM orders o WHERE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) = 'Approved' AND (:from_date IS NULL OR o.created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR o.created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR o.branch_id = :current_branch_id)) AS approved_order_count
  - id: crm_quote_pipeline
    single: false
    permission: crm.read
    query: |
      SELECT status AS label, COUNT(*) AS value FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id) GROUP BY status ORDER BY status
  - id: crm_recent_quotes
    single: false
    permission: crm.read
    query: |
      SELECT code, title, customer_name, amount, status, CAST(valid_until AS VARCHAR) AS valid_until
      FROM quotes WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY created_at DESC
  - id: crm_customer_value
    single: false
    permission: crm.read
    query: |
      SELECT customer_name, COUNT(*) AS quote_count, COALESCE(SUM(amount), 0) AS quote_value
      FROM quotes
      WHERE (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR branch_id = :current_branch_id)
      GROUP BY customer_name ORDER BY quote_value DESC, customer_name
  - id: crm_employee_breakdown
    single: false
    permission: crm.read
    query: |
      SELECT e.department, COUNT(*) AS employee_count,
        SUM(CASE WHEN e.status = 'Active' THEN 1 ELSE 0 END) AS active_count
      FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:from_date IS NULL OR e.created_at >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR e.created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)
      GROUP BY e.department ORDER BY employee_count DESC, e.department
components:
  - type: ListToolbar
    source: crm_recent_quotes
    filter_sources: [crm_kpis, crm_quote_pipeline, crm_recent_quotes, crm_customer_value, crm_employee_breakdown]
    date_range: { from_field: from_date, to_field: to_date, from_label: 'From date', to_label: 'Come day', presets: [today, week, month, quarter, year, all] }
    actions: [{ id: crm_recent_quotes.export, label: 'Export CSV', icon: download }]
  - type: StatRow
    source: crm_kpis
    stats:
      - { label: Client, field: customer_count, color: blue }
      - { label: Staff, field: employee_count, color: indigo }
      - { label: Team, field: team_count, color: blue }
      - { label: Company, field: company_count, color: indigo }
      - { label: Potential guests, field: lead_count, color: amber }
      - { label: Quote accepted, field: accepted_quote_count, color: green }
      - { label: Quoted value, field: accepted_quote_value, color: blue }
      - { label: Application approved, field: approved_order_count, color: indigo }
  - { type: Chart, source: crm_quote_pipeline, title: Quote funnel, label_field: label, value_field: value, width: 560, height: 240, color: blue }
  - type: DataGrid
    source: crm_recent_quotes
    page_size: 10
    column_chooser: true
    row_key: code
    empty_state: { title: There are no recent quotes yet }
    columns:
      - { field: code, label: Code }
      - { field: title, label: Quote, type: PrimaryEntityCell, secondary: customer_name }
      - { field: amount, label: Value, align: right }
      - { field: valid_until, label: Effect arrives }
      - { field: status, label: Status, type: StatusChip, colors: { Draft: neutral, Sent: blue, Accepted: green } }
  - type: DataGrid
    source: crm_customer_value
    page_size: 10
    column_chooser: true
    row_key: customer_name
    empty_state: { title: There are no customer ratings yet }
    columns:
      - { field: customer_name, label: Client, sortable: true }
      - { field: quote_count, label: Quotation number, align: right }
      - { field: quote_value, label: Quoted value, align: right }
  - type: DataGrid
    source: crm_employee_breakdown
    page_size: 10
    column_chooser: true
    row_key: department
    empty_state: { title: There is no personnel allocation yet }
    columns:
      - { field: department, label: Part, sortable: true }
      - { field: employee_count, label: Human resources, align: right }
      - { field: active_count, label: Active, align: right }
actions: []
