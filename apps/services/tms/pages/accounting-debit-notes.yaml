title: Debt notice
page: { id: accounting-debit-notes, breadcrumb: [Accountant, Debt notice], auth: { require: [accounting.read] } }
datasources:
  - id: debit_notes
    single: false
    permission: accounting.read
    query: |
      SELECT id, code, name, counterparty, amount, currency,
        printf('%,.0f', COALESCE(amount, 0)) AS amount_display, status,
        CASE status WHEN 'Draft' THEN 'Nháp' WHEN 'Pending Approval' THEN 'Đang duyệt'
          WHEN 'Approved' THEN 'Đã duyệt' WHEN 'Paid' THEN 'Đã thanh toán'
          WHEN 'Cancelled' THEN 'Đã hủy' ELSE status END AS status_label,
        CAST(document_date AS VARCHAR) AS document_date, CAST(due_date AS VARCHAR) AS due_date, description, created_at
      FROM accounting_entries WHERE kind = 'debit_note' AND (:view_scope = 'all' OR branch_id = :current_branch_id) AND (:status IS NULL OR status = :status) AND (:from_date IS NULL OR document_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR document_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR counterparty ILIKE '%' || :q || '%')
      ORDER BY document_date DESC, code
  - id: debit_note_currency_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'currency' AND status = 'Active' UNION SELECT DISTINCT currency AS value, currency AS label FROM accounting_entries WHERE currency IS NOT NULL AND currency <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
toolbar:
  - { id: add_debit_note_btn, label: '+ Add debt notice', variant: primary, permission: accounting.write, action: add_debit_note }
components:
  - type: ListView
    variant: odoo
    source: debit_notes
    create_action: add_debit_note
    create_label: Add debit note
    search:
      label: Search debit notes
      placeholder: 'Find document number, content, or partner...'
    date_range:
      label: Document date
      from_field: from_date
      to_field: to_date
      from_label: From date
      to_label: To date
      presets: [today, week, month, quarter, year, all]
      preset_labels:
        today: Today
        week: This week
        month: This month
        quarter: This quarter
        year: This year
        all: All dates
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Draft, label: Draft }
          - { id: Pending Approval, label: Pending approval }
          - { id: Approved, label: Approved }
          - { id: Paid, label: Paid }
          - { id: Cancelled, label: Cancelled }
    actions:
      - { id: debit_notes.export, label: Export Excel, title: Export Excel, icon: download, params: { format: xlsx } }
    labels:
      new: Add debit note
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all debit notes
      select_row: Select debit note
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status_label
        card:
          title: code
          subtitle: name
          fields:
            - { field: counterparty, label: Partner }
            - { field: amount_display, label: Amount }
            - { field: due_date, label: Due date }
            - { field: status_label, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no debt notice }
    columns:
      - { field: code, label: Document number, sortable: true }
      - { field: name, label: Content, type: PrimaryEntityCell, secondary: counterparty }
      - { field: document_date, label: Document date }
      - { field: due_date, label: Payment deadline }
      - { field: amount_display, label: Value, align: right }
      - { field: currency, label: Money }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Nháp: neutral, Đang duyệt: amber, Đã duyệt: green, Đã thanh toán: blue, Đã hủy: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_debit_note, label: View, variant: secondary, permission: accounting.read }
          - { id: edit_debit_note, label: Edit, variant: ghost, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: submit_debit_note, label: Submit, variant: primary, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: approve_debit_note, label: Approve, variant: primary, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: reject_debit_note, label: Reject, variant: ghost, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: pay_debit_note, label: Mark paid, variant: primary, permission: accounting.pay, show_if: "row.status === 'Approved'" }
          - { id: cancel_debit_note, label: Cancel, variant: danger, permission: accounting.write, show_if: "['Draft', 'Pending Approval', 'Approved'].includes(row.status)" }
          - { id: delete_debit_note, label: Delete, variant: danger, permission: accounting.write, show_if: "row.status === 'Draft'" }
actions:
  - id: add_debit_note
    type: form
    permission: accounting.write
    title: Add debt notice
    table: accounting_entries
    scope: debit_note
    operation: insert
    refresh: [debit_notes]
    fields: [{ field: code, label: Document number, type: text, required: true }, { field: name, label: Content, type: text, required: true }, { field: counterparty, label: Partner, type: text }, { field: currency, label: Money, type: select, options_source: debit_note_currency_lookup, default: VND }, { field: document_date, label: Document date, type: date }, { field: due_date, label: Payment deadline, type: date }, { field: description, label: Note, type: textarea }]
  - id: edit_debit_note
    type: form
    permission: accounting.write
    title: Update debt notice
    table: accounting_entries
    scope: debit_note
    operation: update
    prefill: row
    refresh: [debit_notes]
    fields: [{ field: code, label: Document number, type: text, required: true }, { field: name, label: Content, type: text, required: true }, { field: counterparty, label: Partner, type: text }, { field: currency, label: Money, type: select, options_source: debit_note_currency_lookup }, { field: document_date, label: Document date, type: date }, { field: due_date, label: Payment deadline, type: date }, { field: description, label: Note, type: textarea }]
  - { id: view_debit_note, type: navigate, permission: accounting.read, navigate_to: /accounting/documents/detail, params: { id: '{row.id}', kind: debit_note, back: /accounting/debit-notes } }
  - { id: submit_debit_note, type: server, permission: accounting.write, action: accounting.debit_notes.submit_for_approval, confirm: 'Browse debit note {{row.code}}?', refresh: [debit_notes] , handler: financial_transition, operation: submit_for_approval, kind: debit_note, transition: { from: [Draft], to: Pending Approval } }
  - { id: approve_debit_note, type: server, permission: accounting.approve, action: accounting.debit_notes.approve, confirm: 'Browse debit note {{row.code}}?', refresh: [debit_notes] , handler: financial_transition, operation: approve, kind: debit_note, transition: { from: [Pending Approval], to: Approved } }
  - { id: reject_debit_note, type: server, permission: accounting.approve, action: accounting.debit_notes.reject, confirm: 'Reject debit note {{row.code}}?', refresh: [debit_notes] , handler: financial_transition, operation: reject, kind: debit_note, transition: { from: [Pending Approval], to: Draft } }
  - { id: pay_debit_note, type: server, permission: accounting.pay, action: accounting.debit_notes.mark_paid, confirm: 'Confirm payment of debit note {{row.code}}?', refresh: [debit_notes] , handler: financial_transition, operation: mark_paid, kind: debit_note, transition: { from: [Approved], to: Paid } }
  - { id: cancel_debit_note, type: server, permission: accounting.write, action: accounting.debit_notes.cancel, confirm: 'Cancel debit note {{row.code}}?', refresh: [debit_notes] , handler: financial_transition, operation: cancel, kind: debit_note, transition: { from: [Draft, Pending Approval, Approved], to: Cancelled } }
  - { id: delete_debit_note, type: delete, permission: accounting.write, table: accounting_entries, scope: debit_note, confirm: 'Delete debit note {{row.code}}?', refresh: [debit_notes] }
