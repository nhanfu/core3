title: Money

page:
  id: catalog-currencies
  breadcrumb: [Category, Money]
  auth:
    require: [catalog.read]

datasources:
  - id: currencies
    single: false
    permission: catalog.read
    query: |
      SELECT m.id, m.code, m.name, m.description, m.symbol, m.decimals, m.status, m.sort_order,
        COALESCE(r.rate_to_vnd, CASE WHEN m.code = 'VND' THEN 1 ELSE NULL END) AS rate_to_vnd,
        CAST(r.effective_date AS VARCHAR) AS rate_effective_date,
        r.source AS rate_source, r.synced_at AS rate_synced_at, m.created_at
      FROM master_data m
      LEFT JOIN currency_rates r ON r.currency_code = m.code
      WHERE m.kind = 'currency'
        AND (:status IS NULL OR m.status = :status)
        AND (:q IS NULL OR m.code ILIKE '%' || :q || '%' OR m.name ILIKE '%' || :q || '%' OR m.symbol ILIKE '%' || :q || '%')
      ORDER BY m.sort_order, m.code

toolbar:
  - { id: add_currency_btn, label: '+ Add currency', variant: primary, permission: catalog.write, action: add_currency }
  - { id: sync_currency_rates_btn, label: 'Synchronize exchange rates', variant: secondary, permission: catalog.write, action: sync_currency_rates }

components:
  - type: ListView
    variant: odoo
    source: currencies
    create_action: add_currency
    create_label: Add currency
    search:
      label: Currency search
      placeholder: 'Find code, name, or symbol...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: In use }
          - { id: Inactive, label: Discontinued }
    actions:
      - { id: sync_currency_rates, label: Synchronize exchange rates, title: Synchronize exchange rates, icon: refresh }
      - { id: currencies.export, label: Export CSV, title: Export CSV, icon: download }
      - { id: import_currencies, label: Import CSV, title: Import CSV, icon: upload }
    labels:
      new: Add currency
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all currencies
      select_row: Select currency
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: symbol, label: Symbol }
            - { field: rate_to_vnd, label: Exchange rate / VND }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: No currency, description: Create your first currency to use in quotes. }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Money, type: PrimaryEntityCell, secondary: description }
      - { field: symbol, label: Symbol, align: center }
      - { field: decimals, label: Odd, align: right }
      - { field: rate_to_vnd, label: Exchange rate / VND, align: right }
      - { field: rate_effective_date, label: Effective date }
      - { field: rate_source, label: Source }
      - { field: sort_order, label: Order, align: right }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Creation date }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_currency, label: Edit, variant: ghost, permission: catalog.write }
          - { id: delete_currency, label: Delete, variant: danger, permission: catalog.write }

actions:
  - { id: sync_currency_rates, type: server, permission: catalog.write, action: catalog.currencies.sync_rates, refresh: [currencies] , handler: currency_sync}
  - { id: import_currencies, type: upload, permission: catalog.write, kind: master_data_import, scope: currency, refresh: [currencies] }
  - id: add_currency
    type: form
    permission: catalog.write
    title: Add currency
    table: master_data
    scope: currency
    operation: insert
    refresh: [currencies]
    fields:
      - { field: code, label: ISO code, type: text, required: true }
      - { field: name, label: Currency name, type: text, required: true }
      - { field: symbol, label: Symbol, type: text }
      - { field: decimals, label: Odd number of digits, type: number, default: 2 }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number, default: 0 }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }
  - id: edit_currency
    type: form
    permission: catalog.write
    title: Currency update
    table: master_data
    scope: currency
    operation: update
    prefill: row
    refresh: [currencies]
    fields:
      - { field: code, label: ISO code, type: text, required: true }
      - { field: name, label: Currency name, type: text, required: true }
      - { field: symbol, label: Symbol, type: text }
      - { field: decimals, label: Odd number of digits, type: number }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }
  - { id: delete_currency, type: delete, permission: catalog.write, table: master_data, scope: currency, confirm: 'Delete currency {{row.name}}?', refresh: [currencies] }
