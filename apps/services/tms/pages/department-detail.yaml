title: Department details
page: { id: department-detail, breadcrumb: [Organization & decentralization, Departments, Detail], auth: { require: [settings.read] } }
datasources:
  - id: department_detail
    single: true
    permission: settings.read
    query: "SELECT d.id, d.code, d.name, d.branch_id, b.name AS branch_name, d.status FROM departments d LEFT JOIN branches b ON b.id = d.branch_id WHERE d.id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)"
  - id: department_teams
    single: false
    permission: settings.read
    query: "SELECT t.id, t.code, t.name, t.manager_id, e.name AS manager_name, t.status FROM teams t JOIN departments d ON d.id = t.department_id LEFT JOIN employees e ON e.id = t.manager_id WHERE t.department_id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY t.name"
  - id: department_employees
    single: false
    permission: settings.read
    query: "SELECT e.id, e.code, e.name, e.job_title, e.status FROM employees e JOIN departments d ON d.id = :id WHERE e.department ILIKE '%' || replace(d.name, 'Phòng ', '') || '%' AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
  - id: department_detail_parent_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM departments ORDER BY name"
  - id: department_detail_branch_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
components:
  - type: OdooFormView
    source: department_detail
    title_field: name
    subtitle_field: code
    status_field: status
    statusbar:
      - { value: Active, label: Working }
      - { value: Inactive, label: Shut down }
    header_actions:
      - { id: edit_department_detail, label: Edit department, variant: secondary }
    groups:
      - title: Department details
        fields:
          - { field: branch_name, label: Branch }
    content_slot: true
  - type: DataGrid
    source: department_teams
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: No team yet }
    columns: [{ field: code, label: Team code }, { field: name, label: Team }, { field: manager_name, label: Person in charge }, { field: status, label: Status }]
  - type: DataGrid
    source: department_employees
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: No staff yet }
    columns: [{ field: code, label: Employee code }, { field: name, label: Full name }, { field: job_title, label: Title }, { field: status, label: Status }]
toolbar:
  - { id: back_departments, label: 'List of departments', icon: arrow-left, variant: secondary, action: back_departments }
actions:
  - { id: back_departments, type: navigate, navigate_to: /org/departments }
  - id: edit_department_detail
    type: form
    permission: settings.write
    title: Update departments
    table: departments
    operation: update
    prefill: source
    prefill_source: department_detail
    refresh: [department_detail, department_teams, department_employees]
    fields: [{ field: code, label: Department code, type: text, required: true }, { field: name, label: Department name, type: text, required: true }, { field: parent_id, label: Father's department, type: select, options_source: department_detail_parent_lookup }, { field: branch_id, label: Branch, type: select, options_source: department_detail_branch_lookup }, { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }]
