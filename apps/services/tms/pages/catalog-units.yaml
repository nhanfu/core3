title: Unit of calculation

page:
  id: catalog-units
  breadcrumb: [Category, Unit of calculation]
  auth:
    require: [catalog.read]

datasources:
  - id: units
    single: false
    permission: catalog.read
    table: master_data
    mutations:
      create: { permission: catalog.write, scope: unit, fields: [code, name, description, sort_order, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] }, sort_order: { integer: true, min: 0 } } } }
      update: { permission: catalog.write, scope: unit, fields: [code, name, description, sort_order, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] }, sort_order: { integer: true, min: 0 } } } }
      delete: { permission: catalog.write, scope: unit }
    query: |
      SELECT id, code, name, description, status, sort_order, created_at
      FROM master_data
      WHERE kind = 'unit'
        AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%')
      ORDER BY sort_order, code

toolbar:
  - { id: add_unit_btn, label: '+ Add units of measurement', variant: primary, permission: catalog.write, action: add_unit }

components:
  - type: ListView
    variant: odoo
    source: units
    create_action: add_unit
    create_label: Add unit of calculation
    search:
      label: Search units of measure
      placeholder: 'Find code, name, or description...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: In use }
          - { id: Inactive, label: Discontinued }
    actions:
      - { id: units.export, label: Export CSV, title: Export CSV, icon: download }
      - { id: import_units, label: Import CSV, title: Import CSV, icon: upload }
    labels:
      new: Add unit of calculation
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all units
      select_row: Select unit
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: description, label: Description }
            - { field: sort_order, label: Order }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There are no units, description: Create the first unit of measure to use in the form. }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Unit of calculation, type: PrimaryEntityCell, secondary: description }
      - { field: sort_order, label: Order, align: right }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Creation date }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_unit, label: Edit, variant: ghost, permission: catalog.write }
          - { id: delete_unit, label: Delete, variant: danger, permission: catalog.write }

actions:
  - { id: import_units, type: upload, permission: catalog.write, kind: master_data_import, scope: unit, refresh: [units] }
  - id: add_unit
    type: form
    permission: catalog.write
    datasource: units
    title: Add units of measure
    table: master_data
    scope: unit
    operation: insert
    refresh: [units]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: name, label: Unit of calculation, type: text, required: true }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number, default: 0 }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }
  - id: edit_unit
    type: form
    permission: catalog.write
    datasource: units
    title: Update units of measure
    table: master_data
    scope: unit
    operation: update
    prefill: row
    refresh: [units]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: name, label: Unit of calculation, type: text, required: true }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }
  - { id: delete_unit, type: delete, permission: catalog.write, datasource: units, table: master_data, scope: unit, confirm: 'Delete unit {{row.name}}?', refresh: [units] }
