title: Type of goods

page:
  id: catalog-cargo-types
  breadcrumb: [Category, Type of goods]
  auth:
    require: [catalog.read]

datasources:
  - id: cargo_types
    single: false
    permission: catalog.read
    table: master_data
    import: { permission: catalog.write, table: master_data, scope: cargo_type }
    mutations:
      create: { permission: catalog.write, scope: cargo_type, fields: [code, name, description, sort_order, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] }, sort_order: { integer: true, min: 0 } } } }
      update: { permission: catalog.write, scope: cargo_type, fields: [code, name, description, sort_order, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] }, sort_order: { integer: true, min: 0 } } } }
      delete: { permission: catalog.write, scope: cargo_type }
    query: |
      SELECT id, code, name, description, status, sort_order, created_at
      FROM master_data
      WHERE kind = 'cargo_type'
        AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%')
      ORDER BY sort_order, code

toolbar:
  - { id: add_cargo_type_btn, label: '+ Add type of goods', variant: primary, permission: catalog.write, action: add_cargo_type }

components:
  - type: ListView
    variant: odoo
    source: cargo_types
    create_action: add_cargo_type
    create_label: Add type of goods
    search:
      label: Search cargo types
      placeholder: 'Find code, name, or description...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: In use }
          - { id: Inactive, label: Discontinued }
    actions:
      - { id: cargo_types.export, label: Export CSV, title: Export CSV, icon: download }
      - { id: import_cargo_types, label: Import CSV, title: Import CSV, icon: upload }
    labels:
      new: Add type of goods
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all cargo types
      select_row: Select cargo type
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: description, label: Description }
            - { field: sort_order, label: Order }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no commodity type, description: Create the first commodity type to use in the order. }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Type of goods, type: PrimaryEntityCell, secondary: description }
      - { field: sort_order, label: Order, align: right }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Creation date }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_cargo_type, label: Edit, variant: ghost, permission: catalog.write }
          - { id: delete_cargo_type, label: Delete, variant: danger, permission: catalog.write }

actions:
  - { id: import_cargo_types, type: upload, permission: catalog.write, kind: master_data_import, scope: cargo_type, refresh: [cargo_types] }
  - id: add_cargo_type
    type: form
    permission: catalog.write
    datasource: cargo_types
    title: Add product type
    table: master_data
    scope: cargo_type
    operation: insert
    refresh: [cargo_types]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: name, label: Type of goods, type: text, required: true }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number, default: 0 }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }
  - id: edit_cargo_type
    type: form
    permission: catalog.write
    datasource: cargo_types
    title: Update product type
    table: master_data
    scope: cargo_type
    operation: update
    prefill: row
    refresh: [cargo_types]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: name, label: Type of goods, type: text, required: true }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }
  - { id: delete_cargo_type, type: delete, permission: catalog.write, datasource: cargo_types, table: master_data, scope: cargo_type, confirm: 'Delete commodity type {{row.name}}?', refresh: [cargo_types] }
