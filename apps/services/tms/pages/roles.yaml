title: Role
page:
  id: roles
  breadcrumb: [Organization & decentralization, Role]
  auth: { require: [settings.read] }
datasources:
  - id: org_roles
    single: false
    permission: settings.read
    query: |
      SELECT r.id, r.name, r.description, r.view_scope, COUNT(DISTINCT p.id) AS permission_count,
        COUNT(DISTINCT CASE WHEN :view_scope = 'all' OR u.branch_id = :current_branch_id THEN ur.user_id END) AS user_count
      FROM roles r LEFT JOIN permissions p ON p.role_id = r.id
        LEFT JOIN user_roles ur ON ur.role_id = r.id
        LEFT JOIN users u ON u.id = ur.user_id
      WHERE (:q IS NULL OR r.name ILIKE '%' || :q || '%' OR r.description ILIKE '%' || :q || '%')
      GROUP BY r.id, r.name, r.description, r.view_scope
      ORDER BY r.name
components:
  - type: ListView
    variant: odoo
    source: org_roles
    search:
      label: Search roles
      placeholder: 'Find name or description...'
    actions: [{ id: org_roles.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all roles
      select_row: Select role
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: view_scope
        card:
          title: name
          subtitle: description
          fields:
            - { field: view_scope, label: View range }
            - { field: permission_count, label: Permissions }
            - { field: user_count, label: Users }
    page_size: 20
    column_chooser: true
    row_key: id
    row_open_action: view_role
    row_actions: menu
    empty_state: { title: No role }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: name, label: Role, type: PrimaryEntityCell, secondary: description }
      - { field: permission_count, label: Permission number, align: right }
      - { field: view_scope, label: View range, type: StatusChip, colors: { all: blue, branch: amber, own: neutral } }
      - { field: user_count, label: Number of users, align: right }
      - field: actions
        label: ''
        sortable: false
        actions: [{ id: view_role, label: Detail, variant: secondary, permission: settings.read }]
actions:
  - { id: view_role, type: navigate, permission: settings.read, navigate_to: /org/roles/detail, params: { id: '{row.id}' } }
