title: Maintenance

page:
  id: maintenance
  auth:
    require: [maintenance.read]

datasources:
  - id: maintenance_kpis
    single: true
    permission: maintenance.read
    query: |
      SELECT COUNT(*) FILTER (WHERE m.status = 'Overdue' OR (m.status = 'Scheduled' AND m.scheduled_date < CURRENT_DATE)) AS overdue,
        COUNT(*) FILTER (WHERE m.scheduled_date BETWEEN CURRENT_DATE AND CURRENT_DATE + INTERVAL '7 days' AND m.status = 'Scheduled') AS due_this_week,
        COUNT(*) FILTER (WHERE m.status = 'In Progress') AS in_progress,
        COUNT(*) FILTER (WHERE m.status = 'Completed' AND m.completed_date >= date_trunc('month', CURRENT_DATE)) AS completed_month
      FROM maintenance m JOIN trucks t ON t.id = m.truck_id
      WHERE (:view_scope = 'all' OR t.branch_id = :current_branch_id)
  - id: maintenance
    single: false
    permission: maintenance.read
    query: |
      SELECT m.*, t.plate AS truck_plate, t.model AS truck_model, u.name AS technician_name
      FROM maintenance m
      LEFT JOIN trucks t ON t.id = m.truck_id
      LEFT JOIN users u ON u.id = m.technician_id
      WHERE (:view_scope = 'all' OR t.branch_id = :current_branch_id)
        AND (:status IS NULL OR m.status = :status)
        AND (:service_type IS NULL OR m.service_type = :service_type)
        AND (:q IS NULL OR t.plate ILIKE '%' || :q || '%' OR m.service_type ILIKE '%' || :q || '%' OR m.notes ILIKE '%' || :q || '%')
      ORDER BY m.scheduled_date DESC
  - id: maintenance_truck_lookup
    single: false
    permission: maintenance.read
    query: "SELECT id AS value, plate || ' - ' || model AS label FROM trucks WHERE (:view_scope = 'all' OR branch_id = :current_branch_id) UNION SELECT DISTINCT t.id AS value, t.plate || ' - ' || t.model AS label FROM maintenance m JOIN trucks t ON t.id = m.truck_id WHERE m.truck_id IS NOT NULL AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY label"
  - id: maintenance_technician_lookup
    single: false
    permission: maintenance.read
    query: "SELECT id AS value, name AS label FROM users WHERE enabled = true AND (:view_scope = 'all' OR branch_id = :current_branch_id) UNION SELECT DISTINCT u.id AS value, u.name AS label FROM maintenance m JOIN trucks t ON t.id = m.truck_id JOIN users u ON u.id = m.technician_id WHERE m.technician_id IS NOT NULL AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY label"

components:
  - type: StatRow
    source: maintenance_kpis
    stats:
      - label: Overdue
        field: overdue
        color: red
      - label: Due this week
        field: due_this_week
        color: amber
      - label: Ongoing
        field: in_progress
        color: blue
      - label: Completed this month
        field: completed_month
        color: green

  - type: ListView
    variant: odoo
    source: maintenance
    create_action: add_maintenance
    create_label: '+ Schedule maintenance'
    search: { label: Search maintenance, placeholder: 'License plate or maintenance type...' }
    filters:
      - { field: status, label: Status, options: [{ id: Scheduled, label: Scheduled }, { id: 'In Progress', label: Ongoing }, { id: Completed, label: Complete }, { id: Overdue, label: Overdue }] }
      - field: service_type
        label: Maintenance type
        options: [{ id: 'Oil Change', label: Change the oil }, { id: 'Tire Rotation', label: Rotate tires }, { id: 'Brake Service', label: Brake maintenance }, { id: 'Engine Overhaul', label: Engine overhaul }, { id: 'Transmission Service', label: Gearbox maintenance }, { id: 'AC Repair', label: Repair air conditioner }, { id: Electrical, label: Electricity }, { id: 'Body Repair', label: Repair the body shell }, { id: 'Annual Inspection', label: Periodic inspection }, { id: Other, label: Other }]
    page_size: 8
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no maintenance schedule, description: Try changing the filter or schedule a new maintenance schedule. }
    columns:
      - { field: truck_plate, label: Vehicle, type: PrimaryEntityCell, secondary: truck_model }
      - { field: service_type, label: Maintenance type }
      - { field: status, label: Status, type: StatusChip, colors: { Scheduled: blue, 'In Progress': indigo, Completed: green, Overdue: red } }
      - { field: scheduled_date, label: Expected date, type: DateCell }
      - { field: completed_date, label: Completion date, type: DateCell }
      - { field: cost, label: Cost (VND), align: right }
      - { field: technician_name, label: Technician }
      - field: actions
        label: ''
        sortable: false
        actions:
          - id: edit_maintenance
            label: Fix
            variant: ghost
            permission: maintenance.write
          - id: mark_done
            label: Mark complete
            variant: secondary
            permission: maintenance.write
          - id: delete_maintenance
            label: Erase
            variant: danger
            permission: maintenance.write

actions:
  - id: add_maintenance
    type: form
    permission: maintenance.write
    title: Schedule maintenance
    table: maintenance
    operation: insert
    prefill: null
    refresh: [maintenance, maintenance_kpis]
    fields:
      - field: truck_id
        label: Media code
        type: select
        options_source: maintenance_truck_lookup
        required: true
      - field: service_type
        label: Maintenance type
        type: select
        required: true
        options:
          - Oil Change
          - Tire Rotation
          - Brake Service
          - Engine Overhaul
          - Transmission Service
          - AC Repair
          - Electrical
          - Body Repair
          - Annual Inspection
          - Other
      - field: status
        label: Status
        type: select
        required: false
        options: [{ id: Scheduled, label: Scheduled }, { id: 'In Progress', label: Ongoing }, { id: Completed, label: Complete }, { id: Overdue, label: Overdue }]
        default: Scheduled
      - field: scheduled_date
        label: Expected date
        type: date
        required: true
      - field: technician_id
        label: Technician code
        type: select
        options_source: maintenance_technician_lookup
        required: false
      - field: cost
        label: Cost (VND)
        type: number
        required: false
      - field: notes
        label: Note
        type: textarea
        required: false

  - id: edit_maintenance
    type: form
    permission: maintenance.write
    title: Maintenance update
    table: maintenance
    operation: update
    prefill: row
    refresh: [maintenance, maintenance_kpis]
    fields:
      - field: truck_id
        label: Media code
        type: select
        options_source: maintenance_truck_lookup
        required: true
      - field: service_type
        label: Maintenance type
        type: select
        required: true
        options:
          - Oil Change
          - Tire Rotation
          - Brake Service
          - Engine Overhaul
          - Transmission Service
          - AC Repair
          - Electrical
          - Body Repair
          - Annual Inspection
          - Other
      - field: status
        label: Status
        type: select
        required: false
        options: [{ id: Scheduled, label: Scheduled }, { id: 'In Progress', label: Ongoing }, { id: Completed, label: Complete }, { id: Overdue, label: Overdue }]
        default: Scheduled
      - field: scheduled_date
        label: Expected date
        type: date
        required: true
      - field: technician_id
        label: Technician code
        type: select
        options_source: maintenance_technician_lookup
        required: false
      - field: cost
        label: Cost (VND)
        type: number
        required: false
      - field: notes
        label: Note
        type: textarea
        required: false

  - id: mark_done
    type: patch
    permission: maintenance.write
    confirm: "Mark this task completed?"
    table: maintenance
    body:
      status: Completed
    refresh: [maintenance, maintenance_kpis]

  - id: delete_maintenance
    type: delete
    permission: maintenance.write
    confirm: "Delete this maintenance record?"
    table: maintenance
    refresh: [maintenance, maintenance_kpis]
