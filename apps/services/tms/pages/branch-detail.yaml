title: Branch details
page: { id: branch-detail, breadcrumb: [Organization & decentralization, Branch, Detail], auth: { require: [settings.read] } }
datasources:
  - id: branch_detail
    single: true
    permission: settings.read
    query: "SELECT id, name, city, region, status FROM branches WHERE id = :id AND (:view_scope = 'all' OR id = :current_branch_id)"
  - id: branch_departments
    single: false
    permission: settings.read
    query: "SELECT d.id, d.code, d.name, d.status, COUNT(t.id) AS team_count FROM departments d LEFT JOIN teams t ON t.department_id = d.id WHERE d.branch_id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) GROUP BY d.id, d.code, d.name, d.status ORDER BY d.name"
  - id: branch_trucks
    single: false
    permission: settings.read
    query: "SELECT t.id, t.plate, t.type, t.status FROM trucks t WHERE t.branch_id = :id AND (:view_scope = 'all' OR t.branch_id = :current_branch_id) ORDER BY t.plate"
  - id: branch_employees
    single: false
    permission: settings.read
    query: "SELECT e.id, e.code, e.name, e.job_title, e.status FROM employees e JOIN departments d ON e.department ILIKE '%' || replace(d.name, 'Phòng ', '') || '%' WHERE d.branch_id = :id AND (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
components:
  - type: OdooFormView
    source: branch_detail
    title_field: name
    subtitle_field: city
    status_field: status
    statusbar:
      - { value: Active, label: Working }
      - { value: Inactive, label: Shut down }
    header_actions:
      - { id: edit_branch_detail, label: Edit branch, variant: secondary }
    groups:
      - title: Branch details
        fields:
          - { field: region, label: Area }
    content_slot: true
  - type: ListView
    variant: odoo
    source: branch_departments
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: There are no departments }
    columns: [{ field: code, label: Department code }, { field: name, label: Departments }, { field: team_count, label: Number of teams, align: right }, { field: status, label: Status }]
  - type: ListView
    variant: odoo
    source: branch_trucks
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: No vehicle yet }
    columns: [{ field: plate, label: Number plate }, { field: type, label: Vehicle type }, { field: status, label: Status }]
  - type: ListView
    variant: odoo
    source: branch_employees
    page_size: 30
    column_chooser: true
    row_key: id
    empty_state: { title: No staff yet }
    columns: [{ field: code, label: Employee code }, { field: name, label: Full name }, { field: job_title, label: Title }, { field: status, label: Status }]
toolbar:
  - { id: back_branches, label: 'List of branches', icon: arrow-left, variant: secondary, action: back_branches }
actions:
  - { id: back_branches, type: navigate, navigate_to: /org/branches }
  - id: edit_branch_detail
    type: form
    permission: settings.write
    title: Update branch
    table: branches
    operation: update
    prefill: source
    prefill_source: branch_detail
    refresh: [branch_detail, branch_departments, branch_trucks, branch_employees]
    fields:
      - { field: name, label: Branch name, type: text, required: true }
      - { field: city, label: Province/city, type: text, required: true }
      - { field: region, label: Area, type: text }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }
