title: Print sample details
page: { id: system-print-template-detail, breadcrumb: [System, Print template, Detail], auth: { require: [system.read] } }
datasources:
  - id: print_template
    single: true
    permission: system.read
    query: "SELECT id, code, name, description, status, config_value FROM system_configs WHERE id = :id AND kind = 'print_template'"
  - id: template_blocks
    single: false
    permission: system.read
    meta: { relation: { parentTable: system_configs, parentKind: print_template, childTable: print_template_blocks, parentKey: template_id } }
    query: "SELECT id, template_id, sequence, block_type, label, token_key, content, status FROM print_template_blocks WHERE template_id = :id ORDER BY sequence, id"
components:
  - type: OdooFormView
    source: print_template
    title_field: name
    subtitle_field: code
    status_field: status
    statusbar:
      - { value: Active, label: Active }
      - { value: Inactive, label: Inactive }
    groups:
      - title: Template information
        fields:
          - { field: description, label: Description, wide: true }
          - { field: config_value, label: Sample code, wide: true }
    content_slot: true
  - { type: TemplatePreview, source: template_blocks, template_source: print_template }
  - type: ListView
    variant: odoo
    source: template_blocks
    page_size: 50
    column_chooser: true
    row_key: id
    empty_state: { title: The printed template does not have a content block, description: 'Add text, tokens, or tables to the template.' }
    columns:
      - { field: sequence, label: Order, align: right }
      - { field: block_type, label: Block type }
      - { field: label, label: Label }
      - { field: token_key, label: Tokens }
      - { field: content, label: Content }
      - { field: status, label: Status }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: move_block_up, label: Go up, variant: ghost, permission: system.write }
          - { id: move_block_down, label: Down, variant: ghost, permission: system.write }
          - { id: edit_block, label: Fix, variant: ghost, permission: system.write }
          - { id: delete_block, label: Erase, variant: danger, permission: system.write }
toolbar:
  - { id: back_print_templates, label: 'List of printing samples', icon: arrow-left, variant: secondary, action: back_print_templates }
  - { id: add_block, label: '+ Add blocks', variant: primary, permission: system.write, action: add_block }
actions:
  - { id: back_print_templates, type: navigate, navigate_to: /system/print-templates }
  - id: add_block
    type: server_form
    permission: system.write
    title: Add a print block
    action: system.print_blocks.create
    datasource: template_blocks
    handler: print_template
    operation: create
    params: { id: '{state.id}' }
    refresh: [template_blocks]
    fields: [{ field: block_type, label: Block type, type: select, options: [{ id: text, label: Document }, { id: token, label: Tokens }, { id: table, label: Board }, { id: spacer, label: Distance }], default: text, required: true }, { field: label, label: Label, type: text, required: true }, { field: token_key, label: Data tokens, type: select, options: [{ id: order.order_number, label: Order number }, { id: order.customer_name, label: Client }, { id: order.route, label: Route }, { id: order.lines, label: Line of goods }] }, { field: content, label: Text content, type: richtext, tokens: [order.order_number, order.customer_name, order.route, order.lines] }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }]
  - id: edit_block
    type: server_form
    permission: system.write
    title: Update the print template block
    action: system.print_blocks.update
    datasource: template_blocks
    handler: print_template
    operation: update
    params: { id: '{state.id}', block_id: '{row.id}' }
    refresh: [template_blocks]
    fields: [{ field: block_type, label: Block type, type: select, options: [{ id: text, label: Document }, { id: token, label: Tokens }, { id: table, label: Board }, { id: spacer, label: Distance }], required: true }, { field: label, label: Label, type: text, required: true }, { field: token_key, label: Data tokens, type: select, options: [{ id: order.order_number, label: Order number }, { id: order.customer_name, label: Client }, { id: order.route, label: Route }, { id: order.lines, label: Line of goods }] }, { field: content, label: Text content, type: richtext, tokens: [order.order_number, order.customer_name, order.route, order.lines] }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }]
  - { id: delete_block, type: server, permission: system.write, datasource: template_blocks, action: system.print_blocks.delete, confirm: 'Delete this block?', refresh: [template_blocks], params: { id: '{state.id}', block_id: '{row.id}' }, handler: print_template, operation: delete }
  - { id: move_block_up, type: server, permission: system.write, datasource: template_blocks, action: system.print_blocks.move_up, refresh: [template_blocks], params: { id: '{state.id}', block_id: '{row.id}' }, handler: print_template, operation: move_up }
  - { id: move_block_down, type: server, permission: system.write, datasource: template_blocks, action: system.print_blocks.move_down, refresh: [template_blocks], params: { id: '{state.id}', block_id: '{row.id}' }, handler: print_template, operation: move_down }
