title: Role details
page: { id: role-detail, breadcrumb: [Organization & decentralization, Role, Detail], auth: { require: [settings.read] } }
datasources:
  - id: role_detail
    single: true
    permission: settings.read
    query: "SELECT id, name, description, view_scope FROM roles WHERE id = :id"
  - id: role_permissions
    single: false
    permission: settings.read
    query: |
      SELECT catalog.permission_key, CASE WHEN p.id IS NULL THEN false ELSE true END AS enabled,
        CASE WHEN p.id IS NULL THEN 'Chưa cấp' ELSE 'Đã cấp' END AS status_label
      FROM (VALUES
        ('orders.read'), ('orders.write'), ('orders.approve'), ('crm.read'), ('crm.write'),
        ('accounting.read'), ('accounting.write'), ('accounting.approve'), ('accounting.pay'),
        ('hr.read'), ('hr.write'), ('hr.approve'), ('hr.pay'), ('fleet.read'), ('fleet.write'),
        ('dispatch.read'), ('dispatch.write'), ('system.read'), ('system.write'), ('settings.read'), ('settings.write'), ('chat.read'), ('chat.write')
      ) AS catalog(permission_key)
      LEFT JOIN permissions p ON p.permission_key = catalog.permission_key AND p.role_id = :id
      ORDER BY catalog.permission_key
  - id: role_users
    single: false
    permission: settings.read
    query: |
      SELECT u.id, u.name, u.email, COALESCE(u.enabled, true) AS enabled,
        b.name AS branch_name, d.name AS department_name
      FROM user_roles ur
      JOIN users u ON u.id = ur.user_id
      LEFT JOIN branches b ON b.id = u.branch_id
      LEFT JOIN departments d ON d.id = u.department_id
      WHERE ur.role_id = :id AND (:view_scope = 'all' OR u.branch_id = :current_branch_id)
      ORDER BY u.name
components:
  - type: OdooFormView
    source: role_detail
    title_field: name
    subtitle_field: description
    header_actions:
      - { id: edit_role_scope, label: Update view scope, variant: secondary }
    groups:
      - title: Role details
        fields:
          - { field: id, label: Role code }
          - { field: view_scope, label: View range }
    content_slot: true
  - type: ListView
    variant: odoo
    source: role_permissions
    page_size: 50
    column_chooser: true
    row_key: permission_key
    empty_state: { title: No permissions in the role yet }
    columns:
      - { field: permission_key, label: Rights }
      - { field: status_label, label: Status, type: StatusChip, colors: { 'Đã cấp': green, 'Chưa cấp': neutral } }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: grant_permission, label: Grant permissions, variant: primary, permission: settings.write, show_if: "!row.enabled" }
          - { id: revoke_permission, label: Recall, variant: danger, permission: settings.write, show_if: "row.enabled" }
  - type: ListView
    variant: odoo
    source: role_users
    page_size: 20
    column_chooser: true
    row_key: id
    empty_state: { title: No users have been assigned roles yet }
    columns:
      - { field: name, label: User, type: PrimaryEntityCell, secondary: email }
      - { field: branch_name, label: Branch }
      - { field: department_name, label: Departments }
      - { field: enabled, label: Activate, type: BooleanCell }
toolbar:
  - { id: back_roles, label: 'List of roles', icon: arrow-left, variant: secondary, action: back_roles }
actions:
  - { id: back_roles, type: navigate, navigate_to: /org/roles }
  - { id: edit_role_scope, type: form, permission: settings.write, title: Update role view scope, table: roles, operation: update, prefill: source, prefill_source: role_detail, refresh: [role_detail, role_permissions, role_users], fields: [{ field: view_scope, label: View range, type: select, options: [{ id: all, label: Whole company }, { id: branch, label: According to branch }, { id: own, label: Individual in charge }], required: true }] }
  - { id: grant_permission, type: server, permission: settings.write, action: settings.roles.grant_permission, refresh: [role_permissions], params: { id: '{state.id}', permission_key: '{row.permission_key}' } , handler: role_permission, operation: grant}
  - { id: revoke_permission, type: server, permission: settings.write, action: settings.roles.revoke_permission, refresh: [role_permissions], params: { id: '{state.id}', permission_key: '{row.permission_key}' } , handler: role_permission, operation: revoke}
