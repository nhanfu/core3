title: Trip fee formula
page: { id: system-fee-rules, breadcrumb: [System, Trip fee formula], auth: { require: [system.read] } }
datasources:
  - id: fee_rules
    single: false
    permission: system.read
    table: system_configs
    mutations:
      create: { permission: system.write, scope: fee_rule, fields: [code, name, config_value, description, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] } } } }
      update: { permission: system.write, scope: fee_rule, fields: [code, name, config_value, description, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] } } } }
      delete: { permission: system.write, scope: fee_rule }
    query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'fee_rule' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code"
toolbar: [{ id: add_fee_rule, label: '+ Add formula', variant: primary, permission: system.write, action: add_fee_rule }]
components:
  - type: ListView
    variant: odoo
    source: fee_rules
    create_action: add_fee_rule
    create_label: Add fee rule
    search:
      label: Search fee rules
      placeholder: 'Find code or name...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Active }
          - { id: Inactive, label: Inactive }
    actions:
      - { id: fee_rules.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add fee rule
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all fee rules
      select_row: Select fee rule
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: config_value, label: Expression }
            - { field: description, label: Description }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no fee formula yet }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Fee formula, type: PrimaryEntityCell, secondary: description }
      - { field: config_value, label: Expression }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_fee_rule, label: Edit, variant: ghost, permission: system.write }
          - { id: delete_fee_rule, label: Delete, variant: danger, permission: system.write }
actions:
  - { id: add_fee_rule, type: form, permission: system.write, datasource: fee_rules, title: Add fee formula, table: system_configs, scope: fee_rule, operation: insert, refresh: [fee_rules], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Expression, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }] }
  - { id: edit_fee_rule, type: form, permission: system.write, datasource: fee_rules, title: Update fee formula, table: system_configs, scope: fee_rule, operation: update, prefill: row, refresh: [fee_rules], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Expression, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }] }
  - { id: delete_fee_rule, type: delete, permission: system.write, datasource: fee_rules, table: system_configs, scope: fee_rule, confirm: 'Delete formula {{row.name}}?', refresh: [fee_rules] }
