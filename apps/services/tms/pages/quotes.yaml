title: Quote
page: { id: quotes, breadcrumb: [Business, Quote], auth: { require: [crm.read] } }

datasources:
  - id: quotes
    single: false
    permission: crm.read
    query: |
      SELECT id, code, customer_name, title,
        printf('%,.0f', COALESCE(amount, 0)) AS amount_display,
        printf('%,.0f', COALESCE(cost_amount, 0)) AS cost_amount_display,
        printf('%,.0f', COALESCE(profit_amount, amount - cost_amount)) AS profit_amount_display,
        status,
        CASE status WHEN 'Draft' THEN 'Nháp' WHEN 'Sent' THEN 'Đã gửi'
          WHEN 'Accepted' THEN 'Đã chấp nhận' WHEN 'Cancelled' THEN 'Đã hủy'
          ELSE status END AS status_label,
        CAST(valid_until AS VARCHAR) AS valid_until, created_at
      FROM quotes
      WHERE (:view_scope = 'all' OR branch_id = :current_branch_id)
        AND (:status IS NULL OR status = :status)
        AND (:from_date IS NULL OR created_at >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR created_at < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%'
          OR customer_name ILIKE '%' || :q || '%' OR title ILIKE '%' || :q || '%')
      ORDER BY created_at DESC
  - id: quote_customer_lookup
    single: false
    permission: crm.read
    query: "SELECT name AS value, code || ' - ' || name AS label FROM customers WHERE status = 'Active' AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)) OR (:view_scope = 'own' AND owner_name = :current_user_name)) UNION SELECT DISTINCT customer_name AS value, customer_name AS label FROM quotes WHERE customer_name IS NOT NULL AND customer_name <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - { id: add_quote, label: '+ Add quote', variant: primary, permission: crm.write, action: add_quote }

components:
  - type: ListView
    variant: odoo
    source: quotes
    create_action: add_quote
    create_label: Add quote
    search:
      label: Find quotes
      placeholder: 'Find codes, customers or content...'
    date_range:
      label: Created date
      from_field: from_date
      to_field: to_date
      from_label: From date
      to_label: To date
      presets: [today, week, month, quarter, year, all]
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Draft, label: Draft }
          - { id: Sent, label: Sent }
          - { id: Accepted, label: Accepted }
          - { id: Cancelled, label: Canceled }
    actions: [{ id: quotes.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      new: Add quote
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all quotes
      select_row: Select quote
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: code
          subtitle: customer_name
          fields:
            - { field: title, label: Quote }
            - { field: amount_display, label: Value }
            - { field: valid_until, label: Valid until }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_quote
    row_actions: menu
    empty_state:
      title: No price quote yet
      description: Try changing the filters or create a new quote.
    columns:
      - { field: code, label: Code, type: PrimaryEntityCell, sortable: true }
      - { field: title, label: Quote, secondary: customer_name }
      - { field: amount_display, label: Value, align: right }
      - { field: cost_amount_display, label: Capital price, align: right }
      - { field: profit_amount_display, label: Profit, align: right }
      - { field: valid_until, label: Valid until, sortable: true }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Nháp: neutral, 'Đã gửi': blue, 'Đã chấp nhận': green, 'Đã hủy': red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_quote, label: Detail, variant: secondary, permission: crm.read }
          - { id: edit_quote, label: Edit, variant: ghost, permission: crm.write, show_if: "row.status === 'Draft'" }
          - { id: send_quote, label: Send, variant: primary, permission: crm.write, show_if: "row.status === 'Draft'" }
          - { id: accept_quote, label: Accept, variant: primary, permission: crm.write, show_if: "row.status === 'Sent'" }
          - { id: revise_quote, label: Revise, variant: ghost, permission: crm.write, show_if: "row.status === 'Sent'" }
          - { id: cancel_quote, label: Cancel, variant: danger, permission: crm.write, show_if: "['Draft', 'Sent'].includes(row.status)" }
          - { id: delete_quote, label: Delete, variant: danger, permission: crm.write, show_if: "row.status === 'Draft'" }

actions:
  - id: add_quote
    type: form
    permission: crm.write
    title: Add quote
    table: quotes
    operation: insert
    refresh: [quotes]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: customer_name, label: Client, type: select, options_source: quote_customer_lookup, required: true }
      - { field: title, label: Content, type: text, required: true }
      - { field: valid_until, label: Effect arrives, type: date }
  - id: edit_quote
    type: form
    permission: crm.write
    title: Update quote
    table: quotes
    operation: update
    prefill: row
    refresh: [quotes]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: customer_name, label: Client, type: select, options_source: quote_customer_lookup, required: true }
      - { field: title, label: Content, type: text, required: true }
      - { field: valid_until, label: Effect arrives, type: date }
  - id: view_quote
    type: navigate
    permission: crm.read
    navigate_to: /quotes/detail
    params: { id: '{row.id}' }
  - { id: send_quote, type: server, permission: crm.write, action: quotes.send, confirm: 'Send quote {{row.code}}?', refresh: [quotes] , handler: business_transition, operation: send, domain: quote, transition: { from: [Draft], to: Sent } }
  - { id: accept_quote, type: server, permission: crm.write, action: quotes.accept, confirm: 'Confirm customer accepts {{row.code}}?', refresh: [quotes] , handler: business_transition, operation: accept, domain: quote, transition: { from: [Sent], to: Accepted } }
  - { id: revise_quote, type: server, permission: crm.write, action: quotes.revise, confirm: 'Send quote {{row.code}} to draft to edit?', refresh: [quotes] , handler: business_transition, operation: revise, domain: quote, transition: { from: [Sent], to: Draft } }
  - { id: cancel_quote, type: server, permission: crm.write, action: quotes.cancel, confirm: 'Cancel quote {{row.code}}?', refresh: [quotes] , handler: business_transition, operation: cancel, domain: quote, transition: { from: [Draft, Sent], to: Cancelled } }
  - { id: delete_quote, type: delete, permission: crm.write, table: quotes, confirm: 'Delete quote {{row.code}}?', refresh: [quotes] }
