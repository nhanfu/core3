title: Fee type

page:
  id: catalog-fee-types
  breadcrumb: [Category, Fee type]
  auth:
    require: [catalog.read]

datasources:
  - id: fee_types
    single: false
    permission: catalog.read
    table: master_data
    mutations:
      create: { permission: catalog.write, scope: fee_type, fields: [code, name, description, sort_order, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] }, sort_order: { integer: true, min: 0 } } } }
      update: { permission: catalog.write, scope: fee_type, fields: [code, name, description, sort_order, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] }, sort_order: { integer: true, min: 0 } } } }
      delete: { permission: catalog.write, scope: fee_type }
    query: |
      SELECT id, code, name, description, status, sort_order, created_at
      FROM master_data
      WHERE kind = 'fee_type'
        AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%')
      ORDER BY sort_order, code

toolbar:
  - { id: add_fee_type_btn, label: '+ Add fees', variant: primary, permission: catalog.write, action: add_fee_type }

components:
  - type: ListView
    variant: odoo
    source: fee_types
    create_action: add_fee_type
    create_label: Add fee type
    search:
      label: Search fee types
      placeholder: 'Find code, name, or description...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: In use }
          - { id: Inactive, label: Discontinued }
    actions:
      - { id: fee_types.export, label: Export CSV, title: Export CSV, icon: download }
      - { id: import_fee_types, label: Import CSV, title: Import CSV, icon: upload }
    labels:
      new: Add fee type
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all fee types
      select_row: Select fee type
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: description, label: Description }
            - { field: sort_order, label: Order }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There are no fees, description: Create your first fee type to use in quotes and payments. }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Fee type, type: PrimaryEntityCell, secondary: description }
      - { field: sort_order, label: Order, align: right }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Creation date }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_fee_type, label: Edit, variant: ghost, permission: catalog.write }
          - { id: delete_fee_type, label: Delete, variant: danger, permission: catalog.write }

actions:
  - { id: import_fee_types, type: upload, permission: catalog.write, kind: master_data_import, scope: fee_type, refresh: [fee_types] }
  - id: add_fee_type
    type: form
    permission: catalog.write
    datasource: fee_types
    title: Add fees
    table: master_data
    scope: fee_type
    operation: insert
    refresh: [fee_types]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: name, label: Fee type, type: text, required: true }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number, default: 0 }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }
  - id: edit_fee_type
    type: form
    permission: catalog.write
    datasource: fee_types
    title: Update fee types
    table: master_data
    scope: fee_type
    operation: update
    prefill: row
    refresh: [fee_types]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: name, label: Fee type, type: text, required: true }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }
  - { id: delete_fee_type, type: delete, permission: catalog.write, datasource: fee_types, table: master_data, scope: fee_type, confirm: 'Delete fee type {{row.name}}?', refresh: [fee_types] }
