title: Calendar thing

page:
  id: trips
  breadcrumb: [Executive, Calendar thing]
  auth:
    require: [trips.read]

datasources:
  - id: trips_stats
    single: true
    permission: trips.read
    query: |
      SELECT COUNT(*) FILTER (WHERE tr.status = 'Scheduled') AS scheduled_count,
        COUNT(*) FILTER (WHERE tr.status = 'In Transit') AS in_transit_count,
        COUNT(*) FILTER (WHERE tr.status = 'Completed' AND DATE(tr.arrival_time) = CURRENT_DATE) AS completed_today,
        COUNT(*) FILTER (WHERE tr.status = 'Cancelled') AS cancelled_count
      FROM trips tr LEFT JOIN trucks t ON t.id = tr.truck_id
      WHERE (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id)
  - id: trips
    single: false
    permission: trips.read
    query: |
      SELECT tr.*, t.plate AS truck_plate, d.name AS driver_name
      FROM trips tr
      LEFT JOIN trucks t ON t.id = tr.truck_id
      LEFT JOIN drivers d ON d.id = tr.driver_id
      WHERE (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id)
        AND (:status IS NULL OR tr.status = :status)
        AND (NULLIF(:unassigned, '') IS NULL OR (:unassigned = 'true' AND tr.truck_id IS NULL))
        AND (:q IS NULL OR tr.trip_number ILIKE '%' || :q || '%' OR tr.origin ILIKE '%' || :q || '%' OR tr.destination ILIKE '%' || :q || '%' OR t.plate ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%')
      ORDER BY tr.departure_time DESC
  - id: trip_truck_lookup
    single: false
    permission: trips.read
    query: "SELECT id AS value, plate || ' - ' || model AS label FROM trucks WHERE (:view_scope = 'all' OR branch_id = :current_branch_id) UNION SELECT DISTINCT t.id AS value, t.plate || ' - ' || t.model AS label FROM trips tr JOIN trucks t ON t.id = tr.truck_id WHERE tr.truck_id IS NOT NULL AND (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id) ORDER BY label"
  - id: trip_branch_lookup
    single: false
    permission: trips.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
  - id: trip_driver_lookup
    single: false
    permission: trips.read
    query: "SELECT id AS value, name AS label FROM drivers WHERE status = 'Active' AND (:view_scope = 'all' OR assigned_truck_id IN (SELECT id FROM trucks WHERE branch_id = :current_branch_id)) UNION SELECT DISTINCT d.id AS value, d.name AS label FROM trips tr JOIN trucks t ON t.id = tr.truck_id JOIN drivers d ON d.id = tr.driver_id WHERE tr.driver_id IS NOT NULL AND (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id) ORDER BY label"
  - id: trip_cargo_type_lookup
    single: false
    permission: trips.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'cargo_type' AND status = 'Active' UNION SELECT DISTINCT tr.cargo_type AS value, tr.cargo_type AS label FROM trips tr LEFT JOIN trucks t ON t.id = tr.truck_id WHERE tr.cargo_type IS NOT NULL AND tr.cargo_type <> '' AND (:view_scope = 'all' OR tr.branch_id = :current_branch_id OR t.branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - id: add_trip_btn
    label: '+ Create trip'
    variant: primary
    permission: trips.write
    action: add_trip

components:
  - type: ListView
    variant: odoo
    source: trips
    create_action: add_trip
    create_label: Create trip
    search:
      label: Search trips
      placeholder: 'Find trip code, origin, destination, vehicle, or driver...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Scheduled, label: Scheduled }
          - { id: 'In Transit', label: In transit }
          - { id: Completed, label: Completed }
          - { id: Cancelled, label: Cancelled }
    actions:
      - { id: trips.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Create trip
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all trips
      select_row: Select trip
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: trip_number
          subtitle: origin
          fields:
            - { field: destination, label: Destination }
            - { field: truck_plate, label: Vehicle }
            - { field: driver_name, label: Driver }
            - { field: status, label: Status }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state:
      title: There are no buses
      description: Try changing the filter or creating a new trip.
    columns:
      - { field: trip_number, label: Trip code, sortable: true }
      - { field: origin, label: Route, type: PrimaryEntityCell, secondary: destination }
      - { field: truck_plate, label: Vehicle, type: PrimaryEntityCell, secondary: driver_name }
      - field: status
        label: Status
        type: StatusChip
        colors:
          Scheduled: blue
          In Transit: amber
          Completed: green
          Cancelled: red
      - { field: departure_time, label: Depart, type: DateCell }
      - { field: arrival_time, label: Expected arrival, type: DateCell }
      - { field: distance_km, label: Distance (km), align: right }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - id: edit_trip
            label: Edit
            variant: ghost
            permission: trips.write
          - id: start_trip
            label: Start trip
            variant: primary
            permission: trips.write
            show_if: "row.status === 'Scheduled'"
          - id: complete_trip
            label: Complete
            variant: primary
            permission: trips.write
            show_if: "row.status === 'In Transit'"
          - id: cancel_trip
            label: Cancel
            variant: danger
            permission: trips.write
            show_if: "['Scheduled', 'In Transit'].includes(row.status)"

actions:
  - id: add_trip
    type: form
    permission: trips.write
    title: Create trip
    table: trips
    operation: insert
    prefill: null
    refresh: [trips, trips_stats]
    fields:
      - field: trip_number
        label: Trip code
        type: text
        required: false
      - field: origin
        label: Point go
        type: text
        required: true
      - field: destination
        label: Destination
        type: text
        required: true
      - field: branch_id
        label: Branch
        type: select
        options_source: trip_branch_lookup
        required: false
      - field: truck_id
        label: Vehicle
        type: select
        options_source: trip_truck_lookup
        required: false
      - field: driver_id
        label: Driver
        type: select
        options_source: trip_driver_lookup
        required: false
      - field: departure_time
        label: Departure time
        type: datetime
        required: false
      - field: arrival_time
        label: Estimated arrival time
        type: datetime
        required: false
      - field: distance_km
        label: Distance (km)
        type: number
        required: false
      - field: cargo_type
        label: Product type
        type: select
        options_source: trip_cargo_type_lookup
        required: false
      - field: cargo_weight
        label: Cargo weight (kg)
        type: number
        required: false
      - field: notes
        label: Note
        type: textarea
        required: false

  - id: edit_trip
    type: form
    permission: trips.write
    title: Trip update
    table: trips
    operation: update
    prefill: row
    refresh: [trips, trips_stats]
    fields:
      - field: trip_number
        label: Trip code
        type: text
        required: false
      - field: origin
        label: Point go
        type: text
        required: true
      - field: destination
        label: Destination
        type: text
        required: true
      - field: branch_id
        label: Branch
        type: select
        options_source: trip_branch_lookup
        required: false
      - field: truck_id
        label: Vehicle
        type: select
        options_source: trip_truck_lookup
        required: false
      - field: driver_id
        label: Driver
        type: select
        options_source: trip_driver_lookup
        required: false
      - field: departure_time
        label: Departure time
        type: datetime
        required: false
      - field: arrival_time
        label: Estimated arrival time
        type: datetime
        required: false
      - field: distance_km
        label: Distance (km)
        type: number
        required: false
      - field: cargo_type
        label: Product type
        type: select
        options_source: trip_cargo_type_lookup
        required: false
      - field: cargo_weight
        label: Cargo weight (kg)
        type: number
        required: false
      - field: notes
        label: Note
        type: textarea
        required: false

  - id: cancel_trip
    type: server
    permission: trips.write
    action: trips.cancel
    handler: trip_transition
    operation: cancel
    confirm: "Cancel trip {{row.trip_number}}?"
    params: { id: '{row.id}' }
    refresh: [trips, trips_stats]
  - id: start_trip
    type: server
    permission: trips.write
    action: trips.start
    handler: trip_transition
    operation: start
    confirm: "Departure confirmation for trip {{row.trip_number}}?"
    params: { id: '{row.id}' }
    refresh: [trips, trips_stats]
  - id: complete_trip
    type: server
    permission: trips.write
    action: trips.complete
    handler: trip_transition
    operation: complete
    confirm: "Confirmed completion of trip {{row.trip_number}}?"
    params: { id: '{row.id}' }
    refresh: [trips, trips_stats]
