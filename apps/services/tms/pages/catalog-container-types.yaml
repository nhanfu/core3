title: Container type

page:
  id: catalog-container-types
  breadcrumb: [Category, Container type]
  auth:
    require: [catalog.read]

datasources:
  - id: container_types
    single: false
    permission: catalog.read
    query: |
      SELECT id, code, name, description, status, sort_order, created_at
      FROM master_data
      WHERE kind = 'container_type'
        AND (:status IS NULL OR status = :status)
        AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%')
      ORDER BY sort_order, code

toolbar:
  - { id: add_container_type_btn, label: '+ Add container type', variant: primary, permission: catalog.write, action: add_container_type }

components:
  - type: ListView
    variant: odoo
    source: container_types
    create_action: add_container_type
    create_label: Add container type
    search:
      label: Search container types
      placeholder: 'Find code, name, or description...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: In use }
          - { id: Inactive, label: Discontinued }
    actions:
      - { id: container_types.export, label: Export Excel, title: Export Excel, icon: download, params: { format: xlsx } }
      - { id: import_container_types, label: Import Excel, title: Import Excel, icon: upload }
    labels:
      new: Add container type
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all container types
      select_row: Select container type
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: description, label: Description }
            - { field: sort_order, label: Order }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no container type, description: Create your first container type for operational use. }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Container type name, type: PrimaryEntityCell, secondary: description }
      - { field: sort_order, label: Order, align: right }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - { field: created_at, label: Creation date }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_container_type, label: Edit, variant: ghost, permission: catalog.write }
          - { id: delete_container_type, label: Delete, variant: danger, permission: catalog.write }

actions:
  - { id: import_container_types, type: upload, permission: catalog.write, kind: master_data_import, scope: container_type, refresh: [container_types] }
  - id: add_container_type
    type: form
    permission: catalog.write
    title: Add container type
    table: master_data
    scope: container_type
    operation: insert
    refresh: [container_types]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: name, label: Container type name, type: text, required: true }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number, default: 0 }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }
  - id: edit_container_type
    type: form
    permission: catalog.write
    title: Update container type
    table: master_data
    scope: container_type
    operation: update
    prefill: row
    refresh: [container_types]
    fields:
      - { field: code, label: Code, type: text, required: true }
      - { field: name, label: Container type name, type: text, required: true }
      - { field: description, label: Describe, type: textarea }
      - { field: sort_order, label: Order, type: number }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }
  - { id: delete_container_type, type: delete, permission: catalog.write, table: master_data, scope: container_type, confirm: 'Delete container type {{row.name}}?', refresh: [container_types] }
