title: Timekeeping

page:
  id: timesheets
  breadcrumb: [Human resources, Timekeeping]
  auth:
    require: [hr.read]

datasources:
  - id: timesheet_totals
    single: true
    permission: hr.read
    query: |
      SELECT COUNT(*) AS record_count,
        COALESCE(SUM(t.hours), 0) AS total_hours,
        SUM(CASE WHEN t.status = 'Present' THEN 1 ELSE 0 END) AS present_count,
        SUM(CASE WHEN t.status = 'Leave' THEN 1 ELSE 0 END) AS leave_count,
        SUM(CASE WHEN t.status = 'Absent' THEN 1 ELSE 0 END) AS absent_count
      FROM timesheets t JOIN employees e ON e.id = t.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (:from_date IS NULL OR t.work_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR t.work_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
  - id: timesheets
    single: false
    permission: hr.read
    query: |
      SELECT t.*, e.code AS employee_code, e.name AS employee_name, s.code AS shift_code, s.name AS shift_name,
        CASE t.status WHEN 'Present' THEN 'Có mặt' WHEN 'Leave' THEN 'Nghỉ phép' ELSE 'Vắng mặt' END AS status_label
      FROM timesheets t
      LEFT JOIN employees e ON e.id = t.employee_id
      LEFT JOIN work_shifts s ON s.id = t.shift_id
      LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR t.status = :status)
        AND (:from_date IS NULL OR t.work_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR t.work_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR e.code ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%' OR CAST(t.work_date AS VARCHAR) ILIKE '%' || :q || '%')
      ORDER BY t.work_date DESC, e.name
  - id: timesheet_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"
  - id: timesheet_shift_lookup
    single: false
    permission: hr.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM work_shifts ORDER BY name"

toolbar:
  - id: add_timesheet_btn
    label: '+ Timekeeping'
    variant: primary
    permission: hr.write
    action: add_timesheet

components:
  - type: StatRow
    source: timesheet_totals
    stats: [{ label: Record, field: record_count, color: blue }, { label: Total hours, field: total_hours, color: indigo }, { label: Present, field: present_count, color: green }, { label: On leave, field: leave_count, color: amber }, { label: Absent, field: absent_count, color: red }]
  - type: ListView
    variant: odoo
    source: timesheets
    create_action: add_timesheet
    create_label: Add timekeeping
    search:
      label: Search timekeeping
      placeholder: 'Find employee code, name, or work date...'
    date_range:
      label: Work date
      from_field: from_date
      to_field: to_date
      from_label: From date
      to_label: To date
      presets: [today, week, month, quarter, year, all]
      preset_labels:
        today: Today
        week: This week
        month: This month
        quarter: This quarter
        year: This year
        all: All dates
    filter_sources: [timesheets, timesheet_totals]
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Present, label: Present }
          - { id: Leave, label: On leave }
          - { id: Absent, label: Absent }
    actions:
      - { id: timesheets.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add timekeeping
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all timekeeping records
      select_row: Select timekeeping record
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status_label
        card:
          title: employee_name
          subtitle: work_date
          fields:
            - { field: employee_code, label: Employee code }
            - { field: shift_name, label: Shift }
            - { field: hours, label: Hours }
            - { field: status_label, label: Status }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: No timekeeping data available, description: Try changing the filter or creating a new timekeeping. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: employee_code, label: Staff, type: PrimaryEntityCell, secondary: employee_name }
      - { field: work_date, label: Work day }
      - { field: shift_code, label: Shift, type: PrimaryEntityCell, secondary: shift_name }
      - { field: hours, label: Number of hours, align: right }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Có mặt: green, Nghỉ phép: amber, Vắng mặt: red }
      - { field: notes, label: Note }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_timesheet, label: Edit, variant: ghost, permission: hr.write }
          - { id: delete_timesheet, label: Delete, variant: danger, permission: hr.write }

actions:
  - id: add_timesheet
    type: form
    permission: hr.write
    title: Timekeeping
    table: timesheets
    operation: insert
    refresh: [timesheets]
    fields:
      - { field: employee_id, label: Staff, type: select, options_source: timesheet_employee_lookup, required: true }
      - { field: work_date, label: Work day, type: date, required: true }
      - { field: shift_id, label: Shift, type: select, options_source: timesheet_shift_lookup }
      - { field: hours, label: Number of hours, type: number, default: 8 }
      - { field: status, label: Status, type: select, options: [{ id: Present, label: Present }, { id: Leave, label: On leave }, { id: Absent, label: Absent }], default: Present }
      - { field: notes, label: Note, type: textarea }
  - id: edit_timesheet
    type: form
    permission: hr.write
    title: Timekeeping update
    table: timesheets
    operation: update
    prefill: row
    refresh: [timesheets]
    fields:
      - { field: employee_id, label: Staff, type: select, options_source: timesheet_employee_lookup, required: true }
      - { field: work_date, label: Work day, type: date, required: true }
      - { field: shift_id, label: Shift, type: select, options_source: timesheet_shift_lookup }
      - { field: hours, label: Number of hours, type: number }
      - { field: status, label: Status, type: select, options: [{ id: Present, label: Present }, { id: Leave, label: On leave }, { id: Absent, label: Absent }] }
      - { field: notes, label: Note, type: textarea }
  - id: delete_timesheet
    type: delete
    permission: hr.write
    confirm: 'Delete attendance {{row.employee_name}}?'
    table: timesheets
    refresh: [timesheets]
