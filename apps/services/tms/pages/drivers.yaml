title: Driver

page:
  id: drivers
  breadcrumb: [Category, Driver]
  auth:
    require: [drivers.read]

datasources:
  - id: drivers
    single: false
    permission: drivers.read
    query: |
      SELECT d.id, d.name, d.phone, d.email, d.license_number, d.license_expiry, d.status,
        t.plate AS truck_plate,
        CASE d.status
          WHEN 'Active' THEN 'Đang hoạt động'
          WHEN 'On Leave' THEN 'Nghỉ phép'
          WHEN 'Inactive' THEN 'Ngưng hoạt động'
          ELSE d.status
        END AS availability,
        CASE
          WHEN d.license_expiry < CURRENT_DATE THEN 'Đã hết hạn'
          WHEN d.license_expiry <= CURRENT_DATE + INTERVAL 30 DAY THEN 'Sắp hết hạn'
          ELSE 'Còn hiệu lực'
        END AS compliance_label,
        'Admin User' AS created_by, d.created_at
      FROM drivers d
      LEFT JOIN trucks t ON t.id = d.assigned_truck_id
      WHERE (:status IS NULL OR d.status = :status)
        AND (:view_scope = 'all' OR t.branch_id = :current_branch_id)
        AND (:from_date IS NULL OR d.license_expiry >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR d.license_expiry < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR d.name ILIKE '%' || :q || '%' OR d.license_number ILIKE '%' || :q || '%' OR d.phone ILIKE '%' || :q || '%')
      ORDER BY d.name
  - id: driver_vehicle_lookup
    single: false
    permission: drivers.read
    query: "SELECT id AS value, plate || ' - ' || model AS label FROM trucks WHERE (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY plate"

toolbar:
  - id: add_driver_btn
    label: '+ Add driver'
    variant: primary
    permission: drivers.write
    action: add_driver

components:
  - type: ListView
    variant: odoo
    source: drivers
    create_action: add_driver
    create_label: Add driver
    search:
      label: Search drivers
      placeholder: 'Search by name, phone number, or license...'
    date_range:
      label: License expiry
      from_field: from_date
      to_field: to_date
      from_label: Expiry from
      to_label: Expiry until
      presets: [today, week, month, quarter, year, all]
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Active }
          - { id: 'On Leave', label: On leave }
          - { id: Inactive, label: Shut down }
    actions: [{ id: drivers.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      new: Add driver
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all drivers
      select_row: Select driver
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: license_number
          fields:
            - { field: truck_plate, label: Vehicle }
            - { field: compliance_label, label: License }
            - { field: availability, label: Status }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_driver
    row_actions: menu
    empty_state:
      title: There is no driver
      description: Try changing the filter or creating a new driver.
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: name, label: Full name, type: PrimaryEntityCell, secondary: phone }
      - { field: license_number, label: License number }
      - { field: truck_plate, label: Vehicle }
      - { field: license_expiry, label: License term, type: DateCell }
      - field: compliance_label
        label: Follow
        type: StatusChip
        colors: { Còn hiệu lực: green, Sắp hết hạn: amber, Đã hết hạn: red }
      - { field: availability, label: Status, type: StatusChip, colors: { Đang hoạt động: green, Nghỉ phép: amber, Ngưng hoạt động: red } }
      - { field: created_by, label: Creator, optional: hide }
      - { field: created_at, label: Creation date and time, type: DateCell, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_driver, label: Detail, variant: secondary, permission: drivers.read }
          - { id: edit_driver, label: Edit, variant: ghost, permission: drivers.write }
          - { id: delete_driver, label: Delete, variant: danger, permission: drivers.write }

actions:
  - { id: view_driver, type: navigate, permission: drivers.read, navigate_to: /drivers/detail, params: { id: '{row.id}' } }
  - id: add_driver
    type: form
    permission: drivers.write
    title: Add driver
    table: drivers
    operation: insert
    refresh: [drivers]
    fields:
      - { field: name, label: Full name, type: text, required: true }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: license_number, label: License number, type: text, required: true }
      - { field: license_expiry, label: License term, type: date, required: true }
      - { field: assigned_truck_id, label: Vehicle in charge, type: select, options_source: driver_vehicle_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Active }, { id: 'On Leave', label: On leave }, { id: Inactive, label: Shut down }], default: Active }
  - id: edit_driver
    type: form
    permission: drivers.write
    title: Update driver
    table: drivers
    operation: update
    prefill: row
    refresh: [drivers]
    fields:
      - { field: name, label: Full name, type: text, required: true }
      - { field: phone, label: Phone number, type: text }
      - { field: email, label: E-mail, type: text }
      - { field: license_number, label: License number, type: text, required: true }
      - { field: license_expiry, label: License term, type: date, required: true }
      - { field: assigned_truck_id, label: Vehicle in charge, type: select, options_source: driver_vehicle_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Active, label: Active }, { id: 'On Leave', label: On leave }, { id: Inactive, label: Shut down }] }
  - id: delete_driver
    type: delete
    permission: drivers.write
    confirm: 'Delete driver {{row.name}}?'
    table: drivers
    refresh: [drivers]
