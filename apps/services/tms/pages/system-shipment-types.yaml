title: Type of transportation
page: { id: system-shipment-types, breadcrumb: [System, Type of transportation], auth: { require: [system.read] } }
datasources:
  - id: shipment_types
    single: false
    permission: system.read
    table: system_configs
    mutations:
      create: { permission: system.write, scope: shipment_type, fields: [code, name, config_value, description, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] } } } }
      update: { permission: system.write, scope: shipment_type, fields: [code, name, config_value, description, status], timestamps: true, validate: { required: [code, name], fields: { status: { enum: [Active, Inactive] } } } }
      delete: { permission: system.write, scope: shipment_type }
    query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'shipment_type' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code"
toolbar: [{ id: add_shipment_type, label: '+ Add type', variant: primary, permission: system.write, action: add_shipment_type }]
components:
  - type: ListView
    variant: odoo
    source: shipment_types
    create_action: add_shipment_type
    create_label: Add shipment type
    search:
      label: Search shipment types
      placeholder: 'Find code or name...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Active }
          - { id: Inactive, label: Inactive }
    actions:
      - { id: shipment_types.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add shipment type
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all shipment types
      select_row: Select shipment type
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: config_value, label: Value }
            - { field: description, label: Description }
            - { field: status, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no shipping type yet }
    columns:
      - { field: code, label: Code, sortable: true }
      - { field: name, label: Type, type: PrimaryEntityCell, secondary: description }
      - { field: config_value, label: Value }
      - field: status
        label: Status
        type: StatusChip
        colors: { Active: green, Inactive: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: edit_shipment_type, label: Edit, variant: ghost, permission: system.write }
          - { id: delete_shipment_type, label: Delete, variant: danger, permission: system.write }
actions:
  - { id: add_shipment_type, type: form, permission: system.write, datasource: shipment_types, title: Add shipping type, table: system_configs, scope: shipment_type, operation: insert, refresh: [shipment_types], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Value, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }] }
  - { id: edit_shipment_type, type: form, permission: system.write, datasource: shipment_types, title: Update type, table: system_configs, scope: shipment_type, operation: update, prefill: row, refresh: [shipment_types], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Value, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }] }
  - { id: delete_shipment_type, type: delete, permission: system.write, datasource: shipment_types, table: system_configs, scope: shipment_type, confirm: 'Delete type {{row.name}}?', refresh: [shipment_types] }
