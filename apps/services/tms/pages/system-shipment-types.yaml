title: Type of transportation
page: { id: system-shipment-types, breadcrumb: [System, Type of transportation], auth: { require: [system.read] } }
datasources:
  - { id: shipment_types, single: false, permission: system.read, query: "SELECT id, code, name, config_value, description, status, sort_order, created_at FROM system_configs WHERE kind = 'shipment_type' AND (:status IS NULL OR status = :status) AND (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY sort_order, code" }
toolbar: [{ id: add_shipment_type, label: '+ Add type', variant: primary, permission: system.write, action: add_shipment_type }]
components: [{ type: ListToolbar, source: shipment_types, filter_field: q, search: { label: Find the type, placeholder: 'Find code or name...' }, actions: [{ id: shipment_types.export, label: 'Export CSV', icon: download }] }, { type: StatusTabs, source: shipment_types, filter_field: status, tabs: [{ id: '', label: All }, { id: Active, label: Using }, { id: Inactive, label: Stop using }] }, { type: DataGrid, source: shipment_types, page_size: 20, column_chooser: true, row_key: id, empty_state: { title: There is no shipping type yet }, columns: [{ field: code, label: Code }, { field: name, label: Type, type: PrimaryEntityCell, secondary: description }, { field: config_value, label: Value }, { field: status, label: Status, type: StatusChip, colors: { Active: green, Inactive: red } }, { field: actions, label: '', sortable: false, actions: [{ id: edit_shipment_type, label: Fix, variant: ghost, permission: system.write }, { id: delete_shipment_type, label: Erase, variant: danger, permission: system.write }] }] }]
actions:
  - { id: add_shipment_type, type: form, permission: system.write, title: Add shipping type, table: system_configs, scope: shipment_type, operation: insert, refresh: [shipment_types], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Value, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }], default: Active }] }
  - { id: edit_shipment_type, type: form, permission: system.write, title: Update type, table: system_configs, scope: shipment_type, operation: update, prefill: row, refresh: [shipment_types], fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Name, type: text, required: true }, { field: config_value, label: Value, type: text }, { field: description, label: Describe, type: textarea }, { field: status, label: Status, type: select, options: [{ id: Active, label: Using }, { id: Inactive, label: Stop using }] }] }
  - { id: delete_shipment_type, type: delete, permission: system.write, table: system_configs, scope: shipment_type, confirm: 'Delete type {{row.name}}?', refresh: [shipment_types] }
