title: Completion
page: { id: accounting-settlements, breadcrumb: [Accountant, Completion], auth: { require: [accounting.read] } }
datasources:
  - id: settlements
    single: false
    permission: accounting.read
    meta: { workflow: { table: accounting_entries, kind: settlement, resource: accounting_entries, label: Financial document } }
    query: |
      SELECT s.id, s.code, s.name, s.counterparty, s.amount, s.currency, s.linked_advance_id, a.code AS advance_code,
        printf('%,.0f', COALESCE(s.amount, 0)) AS amount_display, s.status,
        CASE s.status WHEN 'Draft' THEN 'Nháp' WHEN 'Pending Approval' THEN 'Đang duyệt'
          WHEN 'Approved' THEN 'Đã duyệt' WHEN 'Cancelled' THEN 'Đã hủy'
          ELSE s.status END AS status_label,
        CAST(s.document_date AS VARCHAR) AS document_date, s.description, s.created_at
      FROM accounting_entries s LEFT JOIN accounting_entries a ON a.id = s.linked_advance_id AND a.kind = 'advance' WHERE s.kind = 'settlement' AND (:view_scope = 'all' OR s.branch_id = :current_branch_id) AND (:status IS NULL OR s.status = :status) AND (:from_date IS NULL OR s.document_date >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR s.document_date < CAST(:to_date AS DATE) + INTERVAL 1 DAY) AND (:q IS NULL OR s.code ILIKE '%' || :q || '%' OR s.name ILIKE '%' || :q || '%' OR s.counterparty ILIKE '%' || :q || '%') ORDER BY s.document_date DESC, s.code
  - id: settlement_advance_lookup
    single: false
    permission: accounting.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM accounting_entries WHERE kind = 'advance' AND (:view_scope = 'all' OR branch_id = :current_branch_id) AND status <> 'Cancelled' ORDER BY document_date DESC, code"
  - id: settlement_currency_lookup
    single: false
    permission: accounting.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'currency' AND status = 'Active' UNION SELECT DISTINCT currency AS value, currency AS label FROM accounting_entries WHERE currency IS NOT NULL AND currency <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
toolbar: [{ id: add_settlement_btn, label: '+ Added completion', variant: primary, permission: accounting.write, action: add_settlement }]
components:
  - type: ListView
    variant: odoo
    source: settlements
    create_action: add_settlement
    create_label: Add settlement
    search:
      label: Search settlements
      placeholder: 'Find document number, content, or person...'
    date_range:
      label: Settlement date
      from_field: from_date
      to_field: to_date
      from_label: From date
      to_label: To date
      presets: [today, week, month, quarter, year, all]
      preset_labels:
        today: Today
        week: This week
        month: This month
        quarter: This quarter
        year: This year
        all: All dates
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Draft, label: Draft }
          - { id: Pending Approval, label: Pending approval }
          - { id: Approved, label: Approved }
          - { id: Cancelled, label: Cancelled }
    actions:
      - { id: settlements.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Add settlement
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all settlements
      select_row: Select settlement
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status_label
        card:
          title: code
          subtitle: name
          fields:
            - { field: counterparty, label: Completed by }
            - { field: advance_code, label: Linked advance }
            - { field: amount_display, label: Amount }
            - { field: status_label, label: Status }
    page_size: 20
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: There is no refund }
    columns:
      - { field: code, label: Document number, sortable: true }
      - { field: name, label: Content, type: PrimaryEntityCell, secondary: counterparty }
      - { field: document_date, label: Completion date }
      - { field: amount_display, label: Value, align: right }
      - { field: advance_code, label: Link advance }
      - { field: currency, label: Money }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Nháp: neutral, Đang duyệt: amber, Đã duyệt: green, Đã hủy: red }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: view_settlement, label: View, variant: secondary, permission: accounting.read }
          - { id: edit_settlement, label: Edit, variant: ghost, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: submit_settlement, label: Submit, variant: primary, permission: accounting.write, show_if: "row.status === 'Draft'" }
          - { id: approve_settlement, label: Approve, variant: primary, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: reject_settlement, label: Reject, variant: ghost, permission: accounting.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: cancel_settlement, label: Cancel, variant: danger, permission: accounting.write, show_if: "['Draft', 'Pending Approval', 'Approved'].includes(row.status)" }
          - { id: delete_settlement, label: Delete, variant: danger, permission: accounting.write, show_if: "row.status === 'Draft'" }
actions:
  - id: add_settlement
    type: form
    permission: accounting.write
    title: Add a refund
    table: accounting_entries
    scope: settlement
    operation: insert
    refresh: [settlements]
    fields: [{ field: code, label: Document number, type: text, required: true }, { field: name, label: Content, type: text, required: true }, { field: counterparty, label: Complete person, type: text }, { field: linked_advance_id, label: Link advance, type: select, options_source: settlement_advance_lookup }, { field: currency, label: Money, type: select, options_source: settlement_currency_lookup, default: VND }, { field: document_date, label: Completion date, type: date }, { field: description, label: Note, type: textarea }]
  - id: edit_settlement
    type: form
    permission: accounting.write
    title: Complete update
    table: accounting_entries
    scope: settlement
    operation: update
    prefill: row
    refresh: [settlements]
    fields: [{ field: code, label: Document number, type: text, required: true }, { field: name, label: Content, type: text, required: true }, { field: counterparty, label: Complete person, type: text }, { field: linked_advance_id, label: Link advance, type: select, options_source: settlement_advance_lookup }, { field: currency, label: Money, type: select, options_source: settlement_currency_lookup }, { field: document_date, label: Completion date, type: date }, { field: description, label: Note, type: textarea }]
  - { id: view_settlement, type: navigate, permission: accounting.read, navigate_to: /accounting/documents/detail, params: { id: '{row.id}', kind: settlement, back: /accounting/settlements } }
  - { id: submit_settlement, type: server, permission: accounting.write, action: accounting.settlements.submit_for_approval, datasource: settlements, confirm: 'Browser complete {{row.code}}?', refresh: [settlements] , handler: financial_transition, operation: submit_for_approval, kind: settlement, transition: { from: [Draft], to: Pending Approval } }
  - { id: approve_settlement, type: server, permission: accounting.approve, action: accounting.settlements.approve, datasource: settlements, confirm: 'Completely browse {{row.code}}?', refresh: [settlements] , handler: financial_transition, operation: approve, kind: settlement, transition: { from: [Pending Approval], to: Approved } }
  - { id: reject_settlement, type: server, permission: accounting.approve, action: accounting.settlements.reject, datasource: settlements, confirm: 'Refuse to complete {{row.code}}?', refresh: [settlements] , handler: financial_transition, operation: reject, kind: settlement, transition: { from: [Pending Approval], to: Draft } }
  - { id: cancel_settlement, type: server, permission: accounting.write, action: accounting.settlements.cancel, datasource: settlements, confirm: 'Undo {{row.code}}?', refresh: [settlements] , handler: financial_transition, operation: cancel, kind: settlement, transition: { from: [Draft, Pending Approval, Approved], to: Cancelled } }
  - { id: delete_settlement, type: delete, permission: accounting.write, table: accounting_entries, scope: settlement, confirm: 'Completely delete {{row.code}}?', refresh: [settlements] }
