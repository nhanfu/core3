title: Containers

page:
  id: containers
  breadcrumb: [Category, Containers]
  auth:
    require: [dispatch.read]

datasources:
  - id: containers
    single: false
    permission: dispatch.read
    query: |
      SELECT c.*, l.code AS location_code, l.name AS location_name,
        CASE c.status WHEN 'Available' THEN 'Sẵn sàng' WHEN 'InUse' THEN 'Đang sử dụng' WHEN 'Maintenance' THEN 'Bảo dưỡng' ELSE 'Ngưng hoạt động' END AS status_label
      FROM containers c
      LEFT JOIN locations l ON l.id = c.location_id
      WHERE (:view_scope = 'all' OR c.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR c.status = :status)
        AND (:q IS NULL OR c.container_number ILIKE '%' || :q || '%' OR c.container_type ILIKE '%' || :q || '%' OR c.owner_name ILIKE '%' || :q || '%')
      ORDER BY c.created_at DESC, c.container_number
  - id: container_location_lookup
    single: false
    permission: dispatch.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM locations WHERE (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY name"
  - id: container_type_lookup
    single: false
    permission: dispatch.read
    query: "SELECT code AS value, code || ' - ' || name AS label FROM master_data WHERE kind = 'container_type' AND status = 'Active' UNION SELECT DISTINCT container_type AS value, container_type AS label FROM containers WHERE container_type IS NOT NULL AND container_type <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"
  - id: container_owner_lookup
    single: false
    permission: dispatch.read
    query: "SELECT name AS value, name AS label FROM partners WHERE status = 'Active' AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)) OR (:view_scope = 'own' AND owner_name = :current_user_name)) UNION SELECT DISTINCT owner_name AS value, owner_name AS label FROM containers WHERE owner_name IS NOT NULL AND owner_name <> '' AND (:view_scope = 'all' OR branch_id = :current_branch_id) ORDER BY label"

toolbar:
  - id: add_container_btn
    label: '+ Add containers'
    variant: primary
    permission: dispatch.write
    action: add_container

components:
  - type: ListToolbar
    source: containers
    filter_field: q
    search: { label: Search for containers, placeholder: 'Find container number, type or owner...' }
    actions: [{ id: containers.export, label: 'Export CSV', icon: download }]
  - type: StatusTabs
    source: containers
    filter_field: status
    show_counts: false
    tabs:
      - { id: '', label: All }
      - { id: Available, label: Ready }
      - { id: InUse, label: In use }
      - { id: Maintenance, label: Maintenance }
      - { id: Inactive, label: Shut down }
  - type: DataGrid
    source: containers
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    empty_state: { title: No containers, description: Try changing the filter or creating a new container. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: container_number, label: Number of containers, type: PrimaryEntityCell, secondary: container_type }
      - { field: owner_name, label: Owner }
      - { field: location_code, label: Location, type: PrimaryEntityCell, secondary: location_name }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Ready: green, In use: blue, Maintenance: amber, Shut down: red }
      - { field: created_at, label: Creation date and time }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: edit_container, label: Fix, variant: ghost, permission: dispatch.write }
          - { id: delete_container, label: Erase, variant: danger, permission: dispatch.write }

actions:
  - id: add_container
    type: form
    permission: dispatch.write
    title: Add containers
    table: containers
    operation: insert
    refresh: [containers]
    fields:
      - { field: container_number, label: Number of containers, type: text, required: true }
      - { field: container_type, label: Containers type, type: select, options_source: container_type_lookup, default: 20DC }
      - { field: owner_name, label: Owner, type: select, options_source: container_owner_lookup }
      - { field: location_id, label: Location, type: select, options_source: container_location_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Available, label: Ready }, { id: InUse, label: In use }, { id: Maintenance, label: Maintenance }, { id: Inactive, label: Shut down }], default: Available }
      - { field: notes, label: Note, type: textarea }
  - id: edit_container
    type: form
    permission: dispatch.write
    title: Update containers
    table: containers
    operation: update
    prefill: row
    refresh: [containers]
    fields:
      - { field: container_number, label: Number of containers, type: text, required: true }
      - { field: container_type, label: Containers type, type: select, options_source: container_type_lookup }
      - { field: owner_name, label: Owner, type: select, options_source: container_owner_lookup }
      - { field: location_id, label: Location, type: select, options_source: container_location_lookup }
      - { field: status, label: Status, type: select, options: [{ id: Available, label: Ready }, { id: InUse, label: In use }, { id: Maintenance, label: Maintenance }, { id: Inactive, label: Shut down }] }
      - { field: notes, label: Note, type: textarea }
  - id: delete_container
    type: delete
    permission: dispatch.write
    confirm: 'Delete container {{row.container_number}}?'
    table: containers
    refresh: [containers]
