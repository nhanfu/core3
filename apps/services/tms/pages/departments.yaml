title: Departments
page:
  id: departments
  breadcrumb: [Organization & decentralization, Departments]
  auth: { require: [settings.read] }
datasources:
  - id: departments
    single: false
    permission: settings.read
    query: |
      SELECT d.*, b.name AS branch_name, p.name AS parent_name, CASE d.status WHEN 'Inactive' THEN 'Ngưng hoạt động' ELSE 'Hoạt động' END AS status_label FROM departments d LEFT JOIN branches b ON b.id = d.branch_id LEFT JOIN departments p ON p.id = d.parent_id
      WHERE (NULLIF(:status, '') IS NULL OR d.status = :status)
        AND (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (:q IS NULL OR d.code ILIKE '%' || :q || '%' OR d.name ILIKE '%' || :q || '%' OR b.name ILIKE '%' || :q || '%')
      ORDER BY d.created_at DESC, d.name
  - id: department_parent_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, code || ' - ' || name AS label FROM departments ORDER BY name"
  - id: department_branch_lookup
    single: false
    permission: settings.read
    query: "SELECT id AS value, name AS label FROM branches WHERE (:view_scope = 'all' OR id = :current_branch_id) ORDER BY name"
toolbar:
  - { id: add_department_btn, label: '+ Add departments', variant: primary, permission: settings.write, action: add_department }
components:
  - type: ListView
    variant: odoo
    source: departments
    create_action: add_department
    create_label: Add department
    search:
      label: Search departments
      placeholder: 'Find code, name, or branch...'
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Active, label: Working }
          - { id: Inactive, label: Shut down }
    actions: [{ id: departments.export, label: Export CSV, title: Export CSV, icon: download }]
    labels:
      new: Add department
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all departments
      select_row: Select department
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        card:
          title: name
          subtitle: code
          fields:
            - { field: branch_name, label: Branch }
            - { field: parent_name, label: Parent department }
            - { field: status_label, label: Status }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_department
    row_actions: menu
    empty_state: { title: There are no departments, description: Try changing filters or creating new departments. }
    columns:
      - { field: id, label: HT code, sortable: true }
      - { field: code, label: Code/name, type: PrimaryEntityCell, secondary: name }
      - { field: branch_name, label: Branch }
      - { field: parent_name, label: Parent department }
      - { field: status_label, label: Status, type: StatusChip, colors: { Hoạt động: green, Ngưng hoạt động: red } }
      - { field: created_at, label: Creation date and time, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions: [{ id: view_department, label: Detail, variant: secondary, permission: settings.read }, { id: edit_department, label: Edit, variant: ghost, permission: settings.write }, { id: delete_department, label: Delete, variant: danger, permission: settings.write }]
actions:
  - { id: view_department, type: navigate, permission: settings.read, navigate_to: /org/departments/detail, params: { id: '{row.id}' } }
  - id: add_department
    type: form
    permission: settings.write
    title: Add departments
    table: departments
    operation: insert
    refresh: [departments]
    fields: [{ field: code, label: Department code, type: text, required: true }, { field: name, label: Department name, type: text, required: true }, { field: parent_id, label: Father's department, type: select, options_source: department_parent_lookup }, { field: branch_id, label: Branch, type: select, options_source: department_branch_lookup }, { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }], default: Active }]
  - id: edit_department
    type: form
    permission: settings.write
    title: Update departments
    table: departments
    operation: update
    prefill: row
    refresh: [departments]
    fields: [{ field: code, label: Department code, type: text, required: true }, { field: name, label: Department name, type: text, required: true }, { field: parent_id, label: Father's department, type: select, options_source: department_parent_lookup }, { field: branch_id, label: Branch, type: select, options_source: department_branch_lookup }, { field: status, label: Status, type: select, options: [{ id: Active, label: Work }, { id: Inactive, label: Shut down }] }]
  - { id: delete_department, type: delete, permission: settings.write, confirm: 'Delete department {{row.name}}?', table: departments, refresh: [departments] }
