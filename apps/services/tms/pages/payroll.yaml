title: Payroll

page:
  id: payroll
  breadcrumb: [Human resources, Payroll]
  auth:
    require: [hr.read]

datasources:
  - id: payroll_totals
    single: true
    permission: hr.read
    query: |
      SELECT COUNT(*) AS payroll_count,
        COALESCE(SUM(p.net_salary), 0) AS net_total,
        COALESCE(SUM(CASE WHEN p.status = 'Paid' THEN p.net_salary ELSE 0 END), 0) AS paid_total,
        COALESCE(SUM(CASE WHEN p.status IN ('Draft', 'Approved') THEN p.net_salary ELSE 0 END), 0) AS pending_total
      FROM payrolls p JOIN employees e ON e.id = p.employee_id LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (:from_date IS NULL OR p.pay_month >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR p.pay_month < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
  - id: payroll
    single: false
    permission: hr.read
    meta: { workflow: { table: payrolls, label: Payroll } }
    query: |
      SELECT p.id, p.code, p.employee_id,
        CAST(p.pay_month AS VARCHAR) AS pay_month,
        p.base_salary, p.allowance, p.deduction, p.net_salary, p.status,
        p.created_at, p.updated_at,
        e.code AS employee_code, e.name AS employee_name,
        printf('%,.0f', COALESCE(p.base_salary, 0)) AS base_salary_display,
        printf('%,.0f', COALESCE(p.allowance, 0)) AS allowance_display,
        printf('%,.0f', COALESCE(p.deduction, 0)) AS deduction_display,
        printf('%,.0f', COALESCE(p.net_salary, 0)) AS net_salary_display,
        CASE p.status WHEN 'Draft' THEN 'Nháp' WHEN 'Approved' THEN 'Đã duyệt' ELSE 'Đã chi' END AS status_label
      FROM payrolls p
      LEFT JOIN employees e ON e.id = p.employee_id
      LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%'
      WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id)
        AND (NULLIF(:status, '') IS NULL OR p.status = :status)
        AND (:from_date IS NULL OR p.pay_month >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR p.pay_month < CAST(:to_date AS DATE) + INTERVAL 1 DAY)
        AND (:q IS NULL OR p.code ILIKE '%' || :q || '%' OR e.code ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%')
      ORDER BY p.pay_month DESC, p.created_at DESC
  - id: payroll_employee_lookup
    single: false
    permission: hr.read
    query: "SELECT e.id AS value, e.code || ' - ' || e.name AS label FROM employees e LEFT JOIN departments d ON d.name ILIKE '%' || e.department || '%' WHERE (:view_scope = 'all' OR d.branch_id = :current_branch_id) ORDER BY e.name"

toolbar:
  - id: add_payroll_btn
    label: '+ Prepare payroll'
    variant: primary
    permission: hr.write
    action: add_payroll

components:
  - type: StatRow
    source: payroll_totals
    stats: [{ label: Payroll, field: payroll_count, color: blue }, { label: General Consul, field: net_total, color: blue }, { label: Spent, field: paid_total, color: green }, { label: Waiting for processing, field: pending_total, color: amber }]
  - type: ListView
    variant: odoo
    source: payroll
    create_action: add_payroll
    create_label: Prepare payroll
    search:
      label: Search payroll
      placeholder: 'Find payroll code, employee code, or name...'
    date_range:
      label: Payroll month
      from_field: from_date
      to_field: to_date
      from_label: From month
      to_label: To month
      presets: [today, week, month, quarter, year, all]
      preset_labels:
        today: Today
        week: This week
        month: This month
        quarter: This quarter
        year: This year
        all: All dates
    filter_sources: [payroll, payroll_totals]
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Draft, label: Draft }
          - { id: Approved, label: Approved }
          - { id: Paid, label: Paid }
    actions:
      - { id: payroll.export, label: Export CSV, title: Export CSV, icon: download }
    labels:
      new: Prepare payroll
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all payroll records
      select_row: Select payroll record
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status_label
        card:
          title: code
          subtitle: employee_name
          fields:
            - { field: pay_month, label: Payroll month }
            - { field: net_salary_display, label: Net salary }
            - { field: status_label, label: Status }
    page_size: 10
    column_chooser: true
    row_key: id
    selectable: true
    row_actions: menu
    empty_state: { title: No payroll, description: Try changing your filters or creating a new payroll. }
    columns:
      - { field: code, label: Payroll number }
      - { field: employee_code, label: Staff, type: PrimaryEntityCell, secondary: employee_name }
      - { field: pay_month, label: Monthly salary }
      - { field: base_salary_display, label: Basic salary, align: right }
      - { field: allowance_display, label: Allowances, align: right }
      - { field: deduction_display, label: Deduction, align: right }
      - { field: net_salary_display, label: Truly cool, align: right }
      - field: status_label
        label: Status
        type: StatusChip
        colors: { Nháp: neutral, Đã duyệt: amber, Đã chi: green }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_payroll, label: View, variant: primary, permission: hr.read }
          - { id: edit_payroll, label: Edit, variant: ghost, permission: hr.write, show_if: "row.status === 'Draft'" }
          - { id: approve_payroll, label: Approve, variant: primary, permission: hr.approve, show_if: "row.status === 'Draft'" }
          - { id: reopen_payroll, label: Reopen, variant: ghost, permission: hr.approve, show_if: "row.status === 'Approved'" }
          - { id: pay_payroll, label: Mark paid, variant: primary, permission: hr.pay, show_if: "row.status === 'Approved'" }
          - { id: delete_payroll, label: Delete, variant: danger, permission: hr.write, show_if: "row.status === 'Draft'" }

actions:
  - { id: view_payroll, type: navigate, permission: hr.read, navigate_to: /hr/payroll/detail, params: { id: '{row.id}' } }
  - id: add_payroll
    type: form
    permission: hr.write
    title: Prepare payroll
    table: payrolls
    operation: insert
    refresh: [payroll]
    fields:
      - { field: code, label: Payroll number, type: text, required: true }
      - { field: employee_id, label: Staff, type: select, options_source: payroll_employee_lookup, required: true }
      - { field: pay_month, label: Monthly salary, type: date, required: true }
      - { field: base_salary, label: Basic salary, type: money, currency: VND, default: 0 }
      - { field: allowance, label: Allowances, type: money, currency: VND, default: 0 }
      - { field: deduction, label: Deduction, type: money, currency: VND, default: 0 }
      - { field: net_salary, label: Truly cool, type: money, currency: VND, default: 0 }
  - id: edit_payroll
    type: form
    permission: hr.write
    title: Update payroll
    table: payrolls
    operation: update
    prefill: row
    refresh: [payroll]
    fields:
      - { field: code, label: Payroll number, type: text, required: true }
      - { field: employee_id, label: Staff, type: select, options_source: payroll_employee_lookup, required: true }
      - { field: pay_month, label: Monthly salary, type: date, required: true }
      - { field: base_salary, label: Basic salary, type: money, currency: VND }
      - { field: allowance, label: Allowances, type: money, currency: VND }
      - { field: deduction, label: Deduction, type: money, currency: VND }
      - { field: net_salary, label: Truly cool, type: money, currency: VND }
  - { id: approve_payroll, type: server, permission: hr.approve, action: hr.payroll.approve, datasource: payroll, confirm: 'Browse payroll {{row.code}}?', refresh: [payroll] , handler: business_transition, operation: approve, domain: payroll, transition: { from: [Draft], to: Approved } }
  - { id: reopen_payroll, type: server, permission: hr.approve, action: hr.payroll.reopen, datasource: payroll, confirm: 'Reopen payroll {{row.code}} for editing?', refresh: [payroll] , handler: business_transition, operation: reopen, domain: payroll, transition: { from: [Approved], to: Draft } }
  - { id: pay_payroll, type: server, permission: hr.pay, action: hr.payroll.mark_paid, datasource: payroll, confirm: 'Confirm payment of payroll {{row.code}}?', refresh: [payroll] , handler: business_transition, operation: mark_paid, domain: payroll, transition: { from: [Approved], to: Paid } }
  - id: delete_payroll
    type: delete
    permission: hr.write
    confirm: 'Delete payroll {{row.code}}?'
    table: payrolls
    refresh: [payroll]
