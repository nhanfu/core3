# Auth permissions are declarative and can be consumed by any application
# module without importing the Auth implementation.
permissions:
  - auth.login
  - auth.logout
  - auth.profile.read
  - auth.profile.write
  - auth.users.manage
  - auth.roles.manage
  - auth.providers.manage
  - settings.read
  - settings.write

tables:
  branches:
    permission: settings.write
    timestamps: true
    fields: [name, city, region, status]
  departments:
    permission: settings.write
    timestamps: true
    fields: [code, name, parent_id, branch_id, status]
  teams:
    permission: settings.write
    timestamps: true
    fields: [code, name, department_id, manager_id, status]
  users:
    permission: settings.write
    timestamps: true
    fields: [email, name, avatar_url, preferred_lang, enabled, branch_id, department_id, roles, password]
  roles:
    permission: settings.write
    timestamps: false
    fields: [name, description, view_scope]
  company_profiles:
    permission: settings.write
    timestamps: true
    fields: [name, short_name, tax_code, address, invoice_address, phone, email, website, bank_name, bank_account, notes]

endpoints:
  org.company_document.download: settings.read
