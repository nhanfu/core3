resource:
  id: crm.leads
  entity_set: Leads
  path: /api/odata/Leads
  key: id
  roles: [salesperson, manager, system]
  fields:
    id: { type: string, readonly: true }
    name: { type: string }
    type: { type: string }
    stage_id: { type: string }
    partner_name: { type: string }
    salesperson: { type: string }
    team: { type: string }
    expected_revenue: { type: number }
    expected_closing: { type: date }
    active: { type: boolean }
    created_at: { type: datetime, sortable: true }
  list:
    datasource: crm.odata.leads.list
    search: [name, partner_name, salesperson]
    default_orderby: created_at desc
    max_page_size: 200
    group_by: [stage_id, salesperson, team]
  get: crm.lead
  crud:
    create: crm.save_lead
    update: crm.save_lead
    delete: { datasource: crm.mutateLeads, operation: delete, roles: [manager, system] }
  actions:
    convert: { method: POST, datasource: crm.convert_lead }
    lose: { method: POST, datasource: crm.lose_lead }
    move_stage: { method: POST, datasource: crm.move_stage }

datasources:
  - id: crm.odata.leads.list
    params:
      role: { type: string, default: salesperson }
      odata_top: { type: number, default: 200 }
      odata_skip: { type: number, default: 0 }
    query: |
      SELECT l.*, count(*) OVER() AS __odata_count
      FROM crm_lead l
      WHERE l.active = true {{where}}
      {{order}}
      LIMIT :odata_top OFFSET :odata_skip
