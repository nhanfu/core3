  - id: crm.activities
    params: { status: { type: string, default: '' }, role: { type: string, default: manager }, search: { type: string, default: '' } }
    query: |
      SELECT a.id, a.lead_id, a.activity_type, a.summary, a.due_date, a.done,
        l.name AS lead_name, l.type AS lead_type, l.salesperson
      FROM crm_activity a JOIN crm_lead l ON l.id = a.lead_id
      WHERE (:status = '' OR (:status = 'open' AND NOT a.done) OR (:status = 'done' AND a.done) OR (:status = 'overdue' AND NOT a.done AND a.due_date < current_date))
