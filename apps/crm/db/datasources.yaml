datasources:
  - id: crm.service
    params: { operation: { type: string }, payload: { type: json } }
    language: javascript
    entrypoint: crmService
    script: |
      //js
      async function crmService(ctx, params) {
        const p = params.payload || {};
        const exec = ctx.datasource.execute;
        const role = String(p.role || 'manager');
        const id = String(p.id || '');
        const rows = Array.isArray(p.rows) ? p.rows : [];
        const record = value => value && typeof value === 'object' && !Array.isArray(value) ? value : {};
        const error = (message, status = 400) => { throw Object.assign(new Error(message), { status }); };
        const leadExtras = async leadId => {
          const [messages, activities, followers, attachments] = await Promise.all([
            exec('crm.lead_messages', { id: leadId }), exec('crm.lead_activities', { id: leadId }),
            exec('crm.lead_followers', { id: leadId }), exec('crm.lead_attachments', { id: leadId }),
          ]);
          return { messages, activities, followers, attachments };
        };
        switch (String(params.operation || '')) {
          case 'pipeline': {
            const leads = await exec('crm.list_leads', { search: String(p.search || ''), type: 'opportunity', filter: String(p.filter || ''), sort: String(p.sort || ''), role });
            const stages = await exec('crm.stages');
            return stages.map(stage => ({ id: stage.id, title: stage.name, folded: Boolean(stage.folded), cards: leads.filter(row => row.stage_id === stage.id).map(row => ({ id: row.id, title: row.name, customer: row.partner_name, salesperson: row.salesperson, revenue: Number(row.expected_revenue || 0), priority: Number(row.priority || 0), tags: String(row.tags || '').split(',').filter(Boolean), activity: row.next_activity })) }));
          }
          case 'findDuplicates': {
            const current = (await exec('crm.lead_identity', { id }))[0];
            if (!current) return [];
            return exec('crm.duplicate_leads', { id, name: current.name, partner_name: current.partner_name || '', email: current.email || '', phone: current.phone || '' });
          }
          case 'mergePreview': {
            const unique = [...new Set(Array.isArray(p.ids) ? p.ids : [])].filter(Boolean);
            if (unique.length < 2) return { primary: null, duplicates: [] };
            const result = await exec('crm.merge_preview', { ids: unique });
            return { primary: result[0] || null, duplicates: result.slice(1) };
          }
          case 'crmLookups': {
            const term = `%${String(p.search || '').trim()}%`;
            const [partners, users, teams, tags, recurringPlans] = await Promise.all([
              exec('crm.lookup.partners', { search: term }), exec('crm.lookup.users', { search: term }), exec('crm.lookup.teams', { search: term }),
              exec('crm.lookup.tags'), exec('crm.lookup.recurring_plans'),
            ]);
            return { partners, users, teams, tags, recurringPlans };
          }
          case 'getLead': {
            const result = await exec('crm.lead', { id });
            const row = result[0];
            if (!row) return null;
            const relation = await exec('crm.lead_tags', { id });
            if (relation[0]) row.tag_ids = relation[0].tag_ids || '';
            return row;
          }
          case 'customerRelated': {
            const customer = (await exec('crm.customer', { id }))[0];
            if (!customer) return { leads: [], activities: [] };
            const [leads, activities] = await Promise.all([exec('crm.customer_leads', { id, name: customer.name }), exec('crm.customer_activities', { id, name: customer.name })]);
            return { leads, activities };
          }
          case 'saveCustomer': {
            const values = record(p.values); const customerId = String(values.id || `partner-${ctx.crypto.randomUUID().slice(0, 8)}`); const name = String(values.name || '').trim();
            if (!name) error('Customer name is required');
            await exec('crm.save_customer', { id: customerId, name, email: String(values.email || ''), phone: String(values.phone || '') });
            return (await exec('crm.customer', { id: customerId }))[0] || null;
          }
          case 'saveTeam': {
            const values = record(p.values); const teamId = String(values.id || `team-${ctx.crypto.randomUUID().slice(0, 8)}`); const name = String(values.name || '').trim();
            if (!name) error('Sales team name is required');
            await exec('crm.save_team', { id: teamId, name, quota: Number(values.quota || 0) }); await exec('crm.clear_team_members', { id: teamId });
            const members = Array.isArray(values.member_ids) ? values.member_ids.map(String) : String(values.member_ids || '').split(',');
            for (const userId of members.map(value => value.trim()).filter(Boolean)) await exec('crm.add_team_member', { team_id: teamId, user_id: userId });
            const result = await exec('crm.team', { id: teamId }); if (!result[0]) return null; result[0].member_ids = (await exec('crm.team_members', { id: teamId })).map(member => member.user_id).join(','); return result[0];
          }
          case 'getTeam': { const result = await exec('crm.team', { id }); if (!result[0]) return null; result[0].member_ids = (await exec('crm.team_members', { id })).map(member => member.user_id).join(','); return result[0]; }
          case 'reportSummary': { const [summary, byStage] = await Promise.all([exec('crm.report.summary', { role }), exec('crm.report.by_stage', { role })]); return { summary, byStage }; }
          case 'reportAnalysis': {
            const dimensions = { stage: 's.name', salesperson: "coalesce(l.salesperson, 'Unassigned')", team: "coalesce(l.team, 'Unassigned')", customer: "coalesce(l.partner_name, 'Unassigned')", closing_bucket: "CASE WHEN l.expected_closing IS NULL THEN 'Unscheduled' WHEN l.expected_closing < current_date THEN 'Overdue' ELSE strftime(l.expected_closing, '%Y-%m') END" };
            return exec('crm.report.analysis', { dimension: 'unused', role, from_date: String(p.from_date || ''), to_date: String(p.to_date || ''), search: String(p.search || '').trim() ? `%${String(p.search).trim()}%` : '' }, { dimension: dimensions[p.dimension] || dimensions.stage });
          }
          case 'reportDrilldown': {
            const dimensions = { stage: 's.name', salesperson: "coalesce(l.salesperson, 'Unassigned')", team: "coalesce(l.team, 'Unassigned')", customer: "coalesce(l.partner_name, 'Unassigned')", closing_bucket: "CASE WHEN l.expected_closing IS NULL THEN 'Unscheduled' WHEN l.expected_closing < current_date THEN 'Overdue' ELSE strftime(l.expected_closing, '%Y-%m') END" };
            const dimension = dimensions[p.dimension] || dimensions.stage; return exec('crm.report.drilldown', { dimension: 'unused', secondary_dimension: 'unused', value: String(p.value || ''), secondary_value: p.secondary_dimension ? String(p.secondary_value || '') : '', role }, { dimension, secondary_dimension: dimensions[p.secondary_dimension] || dimension });
          }
          case 'leadAnalysis': { const dimensions = { source: "coalesce(l.source, 'Unspecified')", campaign: "coalesce(l.campaign, 'Unspecified')", team: "coalesce(l.team, 'Unassigned')", salesperson: "coalesce(l.salesperson, 'Unassigned')", stage: 's.name' }; return exec('crm.lead.analysis', { dimension: 'unused', role, search: String(p.search || '').trim() ? `%${String(p.search).trim()}%` : '' }, { dimension: dimensions[p.dimension] || dimensions.source }); }
          case 'leadDrilldown': { const dimensions = { source: "coalesce(l.source, 'Unspecified')", campaign: "coalesce(l.campaign, 'Unspecified')", team: "coalesce(l.team, 'Unassigned')", salesperson: "coalesce(l.salesperson, 'Unassigned')", stage: 's.name' }; return exec('crm.lead.drilldown', { dimension: 'unused', value: String(p.value || ''), role }, { dimension: dimensions[p.dimension] || dimensions.source }); }
          case 'activityAnalysis': { const dimensions = { activity_type: 'a.activity_type', salesperson: "coalesce(l.salesperson, 'Unassigned')", due_date: "coalesce(cast(a.due_date AS VARCHAR), 'No due date')" }; return exec('crm.activity.analysis', { dimension: 'unused', role, search: String(p.search || '').trim() ? `%${String(p.search).trim()}%` : '' }, { dimension: dimensions[p.dimension] || dimensions.activity_type }); }
          case 'activityDrilldown': { const dimensions = { activity_type: 'a.activity_type', salesperson: "coalesce(l.salesperson, 'Unassigned')", due_date: "coalesce(cast(a.due_date AS VARCHAR), 'No due date')" }; return exec('crm.activity.drilldown', { dimension: 'unused', value: String(p.value || ''), role }, { dimension: dimensions[p.dimension] || dimensions.activity_type }); }
          case 'previewImportWithHistory': {
            const preview = await exec('crm.preview_import', { rows }); const invalid = preview.filter(item => item.errors.length);
            if (invalid.length) await exec('crm.import_error', { id: `import-${ctx.crypto.randomUUID().slice(0, 8)}`, imported_count: 0, error_count: invalid.length, errors: JSON.stringify(invalid) });
            return preview;
          }
          case 'commitImport': {
            const preview = await exec('crm.preview_import', { rows }); const invalid = preview.filter(item => item.errors.length);
            if (invalid.length) { await exec('crm.import_error', { id: `import-${ctx.crypto.randomUUID().slice(0, 8)}`, imported_count: 0, error_count: invalid.length, errors: JSON.stringify(invalid) }); error('Import contains invalid rows'); }
            return exec('crm.commit_import', { rows: preview.map(item => item.values) });
          }
          case 'mutateLeads': {
            const ids = Array.isArray(p.ids) ? p.ids : []; const operation = String(p.operation || ''); const value = String(p.value || ''); if (!ids.length) return { ok: true, count: 0 };
            if (operation === 'archive') await exec('crm.mutate.archive', { ids }); else if (operation === 'restore') await exec('crm.mutate.restore', { ids }); else if (operation === 'delete') return exec('crm.mutate.delete', { ids }); else if (operation === 'assign') await exec('crm.mutate.assign', { ids, salesperson: value || 'Mitchell Admin' }); else if (operation === 'stage') await exec('crm.mutate.stage', { ids, stage_id: value }); else if (operation === 'merge' && ids.length > 1) return exec('crm.merge_leads', { ids }); else return { ok: false, error: 'Unknown lead operation' }; return { ok: true, count: ids.length };
          }
          case 'mutateActivities': {
            const ids = Array.isArray(p.ids) ? p.ids : []; const operation = String(p.operation || ''); const value = String(p.value || ''); if (!ids.length) return { ok: true, count: 0 };
            if (operation === 'done') await exec('crm.activity.done', { ids }); else if (operation === 'reopen') await exec('crm.activity.reopen', { ids }); else if (operation === 'reschedule' && value) await exec('crm.activity.reschedule', { ids, due_date: value }); else return { ok: false, error: 'Unknown activity operation' }; return { ok: true, count: ids.length };
          }
          case 'leadExtras': return leadExtras(id);
          case 'addMessage': { const body = String(p.body || '').trim(); if (!body) error('Message body is required'); await exec('crm.add_message', { id: `message-${ctx.crypto.randomUUID().slice(0, 8)}`, lead_id: id, author: 'Mitchell Admin', body }); return leadExtras(id); }
          case 'addActivity': { const summary = String(p.summary || '').trim(); if (!summary) error('Activity summary is required'); await exec('crm.add_activity', { id: `activity-${ctx.crypto.randomUUID().slice(0, 8)}`, lead_id: id, activity_type: String(p.activity_type || 'To-do'), summary, due_date: String(p.due_date || '') || null }); return leadExtras(id); }
          case 'addFollower': { const name = String(p.name || '').trim(); if (!name) error('Follower name is required'); await exec('crm.add_follower', { id: `follower-${ctx.crypto.randomUUID().slice(0, 8)}`, lead_id: id, name }); return leadExtras(id); }
          case 'addAttachment': { const name = String(p.name || '').trim(); if (!name) error('Attachment name is required'); await exec('crm.add_attachment', { id: `attachment-${ctx.crypto.randomUUID().slice(0, 8)}`, lead_id: id, name }); return leadExtras(id); }
          case 'addAttachmentFile': {
            const file = p.file; if (!file?.name || !file?.size) error('Attachment file is required'); if (file.size > 10 * 1024 * 1024) error('Attachment file is too large', 413);
            const attachmentId = `attachment-${ctx.crypto.randomUUID().slice(0, 8)}`; const safeName = String(file.name).replace(/[^a-zA-Z0-9._-]/g, '_'); const storedPath = `${attachmentId}-${safeName}`; const root = String(p.upload_directory || '');
            await ctx.files.mkdir(root); await ctx.files.write(`${root}/${storedPath}`, file); await exec('crm.save_attachment_file', { id: attachmentId, lead_id: id, name: file.name, stored_path: storedPath, mime_type: file.type || 'application/octet-stream', file_size: file.size }); return leadExtras(id);
          }
          case 'saveStages': for (const input of rows) { const value = record(input); const stageId = String(value.id || '').trim(); const name = String(value.name || '').trim(); if (!stageId || !name) continue; const existing = (await exec('crm.stage_by_id', { id: stageId }))[0]; const sequence = existing ? 0 : Number((await exec('crm.next_stage_sequence'))[0]?.sequence || 1); await exec('crm.save_stage', { id: stageId, name, folded: String(value.folded) === 'true', requirements: String(value.requirements || ''), sequence }); } return exec('crm.stages');
          case 'saveLostReason': { const name = String(p.name || '').trim(); if (!id.trim() || !name) error('Lost reason id and name are required'); await exec('crm.save_lost_reason', { id: id.trim(), name }); return exec('crm.lost_reasons'); }
          case 'saveTag': { const name = String(p.name || '').trim(); if (!id.trim() || !name) error('Tag id and name are required'); await exec('crm.save_tag', { id: id.trim(), name, color: String(p.color || '').trim() }); return exec('crm.tags'); }
          case 'saveCatalog': { const value = record(p.values); const catalog = String(p.kind || ''); const catalogId = String(value.id || '').trim(); const name = String(value.name || '').trim(); if (!catalogId || !name) error('Catalog id and name are required'); if (catalog === 'activity_types') await exec('crm.save_activity_type', { id: catalogId, name, default_summary: String(value.default_summary || '') }); else if (catalog === 'activity_plans') await exec('crm.save_activity_plan', { id: catalogId, name }); else await exec('crm.save_recurring_plan', { id: catalogId, name, interval_number: Number(value.interval_number || 1), interval_unit: String(value.interval_unit || 'month') }); return exec(`crm.catalog.${catalog}`); }
          case 'saveConfig': { for (const [key, value] of Object.entries(record(p.values))) if (['use_leads', 'use_recurring_revenues', 'auto_assign_leads'].includes(key)) await exec('crm.save_config', { key, value: String(value) === 'true' ? 'true' : 'false' }); return exec('crm.config'); }
          default: error(`Unknown CRM datasource operation: ${params.operation}`, 400);
        }
      }
  - id: crm.stage_summary
    db: duckdb
    public: true
    endpoint: /api/crm/stage-summary
    protocol: http
    roles: [salesperson, manager, system]
    permission: crm.lead.read
    params:
      type: { type: string, default: opportunity }
      role: { type: string, default: salesperson }
    query: |
      SELECT stage_id, count(*) AS lead_count
      FROM crm_lead
      WHERE type = :type
        AND active = true
        AND (:role <> 'salesperson' OR salesperson = 'Mitchell Admin' OR coalesce(salesperson, '') = '')
      GROUP BY stage_id
      ORDER BY stage_id

  - id: crm.lost_reasons
    public: true
    endpoint: /api/crm/lost-reasons
    protocol: http
    roles: [manager, system]
    permission: crm.lost_reason.read
    query: SELECT id, name FROM crm_lost_reason ORDER BY name
  - id: crm.config
    public: true
    endpoint: /api/crm/config
    protocol: http
    roles: [manager, system]
    permission: crm.config.read
    query: SELECT key, value FROM crm_config ORDER BY key
  - id: crm.stages
    public: true
    endpoint: /api/crm/stages
    protocol: http
    roles: [manager, system]
    permission: crm.stage.read
    query: SELECT id, name, sequence, folded, requirements FROM crm_stage ORDER BY sequence
  - id: crm.tags
    public: true
    endpoint: /api/crm/tags
    protocol: http
    roles: [manager, system]
    permission: crm.tag.read
    query: SELECT id, name, color FROM crm_tag ORDER BY name
  - id: crm.catalog.activity_types
    public: true
    endpoint: /api/crm/catalog/activity_types
    protocol: http
    roles: [manager, system]
    permission: crm.catalog.read
    query: SELECT * FROM crm_activity_type ORDER BY name
  - id: crm.catalog.activity_plans
    public: true
    endpoint: /api/crm/catalog/activity_plans
    protocol: http
    roles: [manager, system]
    permission: crm.catalog.read
    query: SELECT * FROM crm_activity_plan ORDER BY name
  - id: crm.catalog.recurring_plans
    public: true
    endpoint: /api/crm/catalog/recurring_plans
    protocol: http
    roles: [manager, system]
    permission: crm.catalog.read
    query: SELECT * FROM crm_recurring_plan ORDER BY name
  - id: crm.import_history
    public: true
    endpoint: /api/crm/import/history
    protocol: http
    roles: [manager, system]
    permission: crm.import.read
    query: SELECT id, imported_count, error_count, errors, created_at FROM crm_import_history ORDER BY created_at DESC LIMIT 50
  - id: crm.preview_import
    params: { rows: { type: json } }
    language: javascript
    entrypoint: previewImport
    script: |
      //js
      const fields = ['name', 'type', 'stage_id', 'partner_name', 'contact_name', 'email', 'phone', 'team', 'salesperson', 'source', 'campaign', 'expected_revenue', 'recurring_revenue', 'recurring_plan_id', 'probability', 'expected_closing', 'priority', 'tags', 'next_activity', 'notes'];
      const numericFields = ['expected_revenue', 'recurring_revenue', 'probability', 'priority'];
      function previewImport(_ctx, params) {
        return (Array.isArray(params.rows) ? params.rows : []).map((input, index) => {
        const row = input && typeof input === 'object' && !Array.isArray(input) ? input : {};
        const errors = [];
        if (!String(row.name || '').trim()) errors.push('name is required');
        if (row.type && !['lead', 'opportunity'].includes(String(row.type))) errors.push('type must be lead or opportunity');
        if (row.stage_id && !['new', 'qualified', 'proposition', 'won', 'lost'].includes(String(row.stage_id))) errors.push('unknown stage_id');
        for (const field of numericFields) if (row[field] !== undefined && row[field] !== '' && !Number.isFinite(Number(row[field]))) errors.push(`${field} must be numeric`);
        if (row.expected_closing && !/^\d{4}-\d{2}-\d{2}$/.test(String(row.expected_closing))) errors.push('expected_closing must use YYYY-MM-DD');
        return { row: index + 1, values: Object.fromEntries(fields.map(field => [field, row[field] ?? ''])), errors };
        });
      }
  - id: crm.lead
    params: { id: { type: string } }
    query: SELECT * FROM crm_lead WHERE id = :id
  - id: crm.lead_tags
    params: { id: { type: string } }
    query: |
      SELECT coalesce(string_agg(tag.id, ',' ORDER BY tag.id), '') AS tag_ids
      FROM crm_lead l
      LEFT JOIN crm_lead_tag lt ON lt.lead_id = l.id
      LEFT JOIN crm_tag tag ON tag.id = lt.tag_id
      WHERE l.id = :id
  - id: crm.lead_access
    params: { id: { type: string } }
    query: |
      SELECT id FROM crm_lead
      WHERE id = :id AND (salesperson = 'Mitchell Admin' OR coalesce(salesperson, '') = '')
  - id: crm.lead_identity
    params: { id: { type: string } }
    query: SELECT name, partner_name, email, phone FROM crm_lead WHERE id = :id
  - id: crm.duplicate_leads
    params:
      id: { type: string }
      name: { type: string }
      partner_name: { type: string }
      email: { type: string }
      phone: { type: string }
    query: |
      SELECT id, name, type, partner_name, email, phone, expected_revenue, stage_id
      FROM crm_lead WHERE active AND id <> :id AND (
        lower(name) = lower(:name) OR
        (coalesce(partner_name, '') <> '' AND lower(partner_name) = lower(:partner_name)) OR
        (coalesce(email, '') <> '' AND lower(email) = lower(:email)) OR
        (coalesce(phone, '') <> '' AND phone = :phone)
      ) ORDER BY name
  - id: crm.partners
    params: { search: { type: string } }
    query: SELECT id, name, email, phone FROM crm_partner WHERE lower(name) LIKE lower(:search) ORDER BY name LIMIT 20
  - id: crm.lookup.partners
    params: { search: { type: string } }
    query: SELECT id, name, email, phone FROM crm_partner WHERE lower(name) LIKE lower(:search) ORDER BY name LIMIT 20
  - id: crm.lookup.users
    params: { search: { type: string } }
    query: SELECT id, name, email FROM res_user WHERE active AND lower(name) LIKE lower(:search) ORDER BY name
  - id: crm.lookup.teams
    params: { search: { type: string } }
    query: SELECT id, name FROM crm_team WHERE active AND lower(name) LIKE lower(:search) ORDER BY name
  - id: crm.lookup.tags
    query: SELECT id, name, color FROM crm_tag ORDER BY name
  - id: crm.lookup.recurring_plans
    query: SELECT id, name FROM crm_recurring_plan WHERE active ORDER BY name
  - id: crm.customers
    params: { search: { type: string } }
    query: |
      SELECT p.id, p.name, p.email, p.phone,
        count(l.id) AS opportunity_count,
        coalesce(sum(l.expected_revenue), 0) AS expected_revenue
      FROM crm_partner p
      LEFT JOIN crm_lead l ON l.partner_name = p.name AND l.active
      WHERE lower(p.name) LIKE lower(:search) OR lower(coalesce(p.email, '')) LIKE lower(:search)
      GROUP BY p.id, p.name, p.email, p.phone
      ORDER BY p.name
  - id: crm.teams
    query: |
      SELECT t.id, t.name, t.quota,
        (SELECT count(*) FROM crm_lead l WHERE l.active AND (l.team_id = t.id OR (l.team_id IS NULL AND l.team = t.name))) AS lead_count,
        (SELECT coalesce(sum(l.expected_revenue), 0) FROM crm_lead l WHERE l.active AND (l.team_id = t.id OR (l.team_id IS NULL AND l.team = t.name))) AS expected_revenue,
        (SELECT count(*) FROM crm_lead l WHERE l.active AND l.stage_id NOT IN ('won', 'lost') AND (l.team_id = t.id OR (l.team_id IS NULL AND l.team = t.name))) AS open_count,
        (SELECT count(*) FROM crm_team_member m WHERE m.team_id = t.id) AS member_count
      FROM crm_team t WHERE t.active ORDER BY t.name
  - id: crm.customer
    params: { id: { type: string } }
    query: SELECT id, name, email, phone FROM crm_partner WHERE id = :id
  - id: crm.customer_leads
    params: { id: { type: string }, name: { type: string } }
    query: |
      SELECT l.id, l.name, l.type, l.stage_id, s.name AS stage_name, l.expected_revenue
      FROM crm_lead l JOIN crm_stage s ON s.id = l.stage_id
      WHERE l.active AND (l.partner_id = :id OR (l.partner_id IS NULL AND l.partner_name = :name))
      ORDER BY l.created_at DESC
  - id: crm.customer_activities
    params: { id: { type: string }, name: { type: string } }
    query: |
      SELECT a.id, a.lead_id, a.summary, a.activity_type, a.due_date, a.done
      FROM crm_activity a JOIN crm_lead l ON l.id = a.lead_id
      WHERE l.active AND (l.partner_id = :id OR (l.partner_id IS NULL AND l.partner_name = :name))
      ORDER BY a.due_date NULLS LAST
  - id: crm.team
    params: { id: { type: string } }
    query: SELECT id, name, quota, active FROM crm_team WHERE id = :id
  - id: crm.team_members
    params: { id: { type: string } }
    query: SELECT user_id FROM crm_team_member WHERE team_id = :id ORDER BY user_id
  - id: crm.attachment
    params: { id: { type: string } }
    query: SELECT id, lead_id, name, stored_path, mime_type, file_size FROM crm_attachment WHERE id = :id
  - id: crm.lead_messages
    params: { id: { type: string } }
    query: SELECT id, author, body, created_at FROM crm_message WHERE lead_id = :id ORDER BY created_at DESC
  - id: crm.lead_activities
    params: { id: { type: string } }
    query: SELECT id, activity_type, summary, due_date, done FROM crm_activity WHERE lead_id = :id ORDER BY due_date NULLS LAST
  - id: crm.lead_followers
    params: { id: { type: string } }
    query: SELECT id, name FROM crm_follower WHERE lead_id = :id ORDER BY name
  - id: crm.lead_attachments
    params: { id: { type: string } }
    query: SELECT id, name, stored_path, mime_type, file_size, created_at FROM crm_attachment WHERE lead_id = :id ORDER BY created_at DESC

  - id: crm.move_stage
    params: { stage_id: { type: string }, id: { type: string } }
