  - id: crm.merge_leads
    params: { ids: { type: json } }
    language: javascript
    entrypoint: mergeLeads
    script: |
      // js
      async function mergeLeads(ctx, params) {
        const unique = [...new Set(params.ids || [])].filter(Boolean);
        if (unique.length < 2) throw Object.assign(new Error('At least two records are required to merge'), { status: 400 });
        const [primary, ...duplicates] = unique;
        await ctx.db.execute('BEGIN TRANSACTION');
        try {
          for (const table of ['crm_activity', 'crm_message', 'crm_follower', 'crm_attachment']) {
            await ctx.db.execute(`UPDATE ${table} SET lead_id = :primary WHERE lead_id IN (:duplicates)`, { primary, duplicates });
          }
          await ctx.db.execute('DELETE FROM crm_lead WHERE id IN (:duplicates)', { duplicates });
          await ctx.db.execute('COMMIT');
        } catch (error) {
          await ctx.db.execute('ROLLBACK');
          throw error;
        }
        return { ok: true, merged_into: primary, removed: duplicates.length };
      }

