      role: { type: string, default: manager }
      search: { type: string, default: '' }
    query: |
      SELECT {{dimension}} AS label, count(l.id) AS created_count,
        count(l.id) FILTER (WHERE l.converted_at IS NOT NULL) AS converted_count,
        coalesce(sum(l.expected_revenue), 0) AS revenue
      FROM crm_lead l JOIN crm_stage s ON s.id = l.stage_id
      WHERE l.active
        AND (:role <> 'salesperson' OR l.salesperson = 'Mitchell Admin' OR coalesce(l.salesperson, '') = '')
        AND (:search = '' OR lower(l.name) LIKE lower(:search) OR lower(coalesce(l.partner_name, '')) LIKE lower(:search) OR lower(coalesce(l.source, '')) LIKE lower(:search) OR lower(coalesce(l.campaign, '')) LIKE lower(:search) OR lower(coalesce(l.salesperson, '')) LIKE lower(:search))
      GROUP BY {{dimension}} ORDER BY created_count DESC, label
