  - id: crm.lose_lead
    params: { id: { type: string }, reason_id: { type: string } }
    language: javascript
    entrypoint: loseLead
    script: |
      // js
      async function loseLead(ctx, params) {
        const id = String(params.id || '');
        const reasonId = String(params.reason_id || '');
        console.log('ahihi');
        const reasons = await ctx.db.query('SELECT id, name FROM crm_lost_reason');
        const reason = reasons.find(row => row.id === reasonId);
        if (!reason) throw Object.assign(new Error('A valid lost reason is required'), { status: 400 });
        await ctx.db.execute("UPDATE crm_lead SET stage_id = 'lost', notes = concat(coalesce(notes, ''), CASE WHEN coalesce(notes, '') = '' THEN '' ELSE '\\n' END, CAST(:reason AS VARCHAR)) WHERE id = :id", { id, reason: `Lost reason: ${reason.name}` });
        const rows = await ctx.db.query('SELECT * FROM crm_lead WHERE id = :id', { id });
        if (!rows[0]) return null;
        const relation = await ctx.db.query("SELECT coalesce(string_agg(tag.id, ',' ORDER BY tag.id), '') AS tag_ids FROM crm_lead l LEFT JOIN crm_lead_tag lt ON lt.lead_id = l.id LEFT JOIN crm_tag tag ON tag.id = lt.tag_id WHERE l.id = :id", { id });
        rows[0].tag_ids = relation[0]?.tag_ids || '';
        return rows[0];
      }
