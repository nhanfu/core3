  - id: import.read
    params:
      id: { type: string, default: '' }
      odata_top: { type: number, default: 50 }
      odata_skip: { type: number, default: 0 }
    query: |
      SELECT id, state, imported_count, error_count, errors, created_at, count(*) OVER() AS __odata_count
