# This is the complete server-side definition of the lead-management slice.
# The HTTP router only matches OData resource metadata to these datasource IDs.
resources:
  - id: crm.leads
    entity_set: Leads
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      name: { type: string, selectable: true, filterable: true, sortable: true }
      company: { type: string, selectable: true, filterable: true, sortable: true }
      email: { type: string, selectable: true, filterable: true, sortable: true }
      phone: { type: string, selectable: true, filterable: true, sortable: true }
      source: { type: string, selectable: true, filterable: true, sortable: true }
      status: { type: string, selectable: true, filterable: true, sortable: true }
      expected_revenue: { type: number, selectable: true, filterable: true, sortable: true }
      notes: { type: string, selectable: true, filterable: true, sortable: false }
      active: { type: boolean, selectable: true, filterable: true, sortable: true }
      created_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
      updated_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
    list:
      search: [name, company, email, phone, source, status]
      default_orderby: created_at desc
      max_page_size: 200
      group_by: [company, source, status]
    operations:
      create: create
      read: read
      update: update
      delete: delete
    actions:
      archive: { method: POST, datasource: lead.archive, roles: [manager, system] }
      restore: { method: POST, datasource: lead.restore, roles: [manager, system] }
      moveStage: { method: POST, datasource: lead.move_stage }
      lose: { method: POST, datasource: lead.lose }
      convert: { method: POST, datasource: lead.convert }
      duplicates: { method: GET, datasource: lead.duplicates }
      merge: { method: POST, datasource: lead.merge, roles: [manager, system] }

  - id: crm.customers
    entity_set: Customers
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      name: { type: string, selectable: true, filterable: true, sortable: true }
      email: { type: string, selectable: true, filterable: true, sortable: true }
      phone: { type: string, selectable: true, filterable: true, sortable: true }
      active: { type: boolean, selectable: true, filterable: true, sortable: true }
      created_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
    list:
      search: [name, email, phone]
      default_orderby: name asc
      max_page_size: 200
      group_by: []
    operations:
      create: customer.create
      read: customer.read
      update: customer.update
      delete: customer.delete

  - id: crm.teams
    entity_set: Teams
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      name: { type: string, selectable: true, filterable: true, sortable: true }
      quota: { type: number, selectable: true, filterable: true, sortable: true }
      active: { type: boolean, selectable: true, filterable: true, sortable: true }
      created_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
    list:
      search: [name]
      default_orderby: name asc
      max_page_size: 200
      group_by: []
    operations:
      create: team.create
      read: team.read
      update: team.update
      delete: team.delete

  - id: crm.activities
    entity_set: Activities
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      lead_id: { type: string, selectable: true, filterable: true, sortable: true }
      summary: { type: string, selectable: true, filterable: true, sortable: true }
      activity_type: { type: string, selectable: true, filterable: true, sortable: true }
      due_date: { type: date, selectable: true, filterable: true, sortable: true }
      done: { type: boolean, selectable: true, filterable: true, sortable: true }
      created_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
    list:
      search: [summary, activity_type, lead_id]
      default_orderby: due_date asc
      max_page_size: 200
      group_by: [activity_type, done, due_date]
    operations:
      create: activity.create
      read: activity.read
      update: activity.update
      delete: activity.delete
    actions:
      complete: { method: POST, datasource: activity.complete }

  - id: crm.stages
    entity_set: Stages
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      name: { type: string, selectable: true, filterable: true, sortable: true }
      sequence: { type: number, selectable: true, filterable: true, sortable: true }
      active: { type: boolean, selectable: true, filterable: true, sortable: true }
    list:
      search: [id, name]
      default_orderby: sequence asc
      max_page_size: 200
      group_by: []
    operations:
      create: stage.create
      read: stage.read
      update: stage.update
      delete: stage.delete

  - id: crm.imports
    entity_set: Imports
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      state: { type: string, selectable: true, filterable: true, sortable: true }
      imported_count: { type: number, readonly: true, selectable: true, filterable: true, sortable: true }
      error_count: { type: number, readonly: true, selectable: true, filterable: true, sortable: true }
      errors: { type: string, readonly: true, selectable: true, filterable: false, sortable: false }
      created_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
    list:
      search: [state]
      default_orderby: created_at desc
      max_page_size: 50
      group_by: [state]
    operations:
      create: import.preview
      read: import.read
      update: import.unsupported
      delete: import.unsupported
    actions:
      commit: { method: POST, datasource: import.commit }

  - id: crm.messages
    entity_set: Messages
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      lead_id: { type: string, selectable: true, filterable: true, sortable: true }
      author: { type: string, selectable: true, filterable: true, sortable: true }
      body: { type: string, selectable: true, filterable: true, sortable: false }
      created_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
    list: { search: [author, body], default_orderby: created_at desc, max_page_size: 200, group_by: [author] }
    operations: { create: message.create, read: message.read, update: message.update, delete: message.delete }

  - id: crm.followers
    entity_set: Followers
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      lead_id: { type: string, selectable: true, filterable: true, sortable: true }
      name: { type: string, selectable: true, filterable: true, sortable: true }
      created_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
    list: { search: [name], default_orderby: name asc, max_page_size: 200, group_by: [] }
    operations: { create: follower.create, read: follower.read, update: follower.update, delete: follower.delete }

  - id: crm.attachments
    entity_set: Attachments
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      lead_id: { type: string, selectable: true, filterable: true, sortable: true }
      name: { type: string, selectable: true, filterable: true, sortable: true }
      mime_type: { type: string, selectable: true, filterable: true, sortable: true }
      content: { type: string, selectable: false, filterable: false, sortable: false }
      created_at: { type: datetime, readonly: true, selectable: true, filterable: true, sortable: true }
    list: { search: [name, mime_type], default_orderby: created_at desc, max_page_size: 200, group_by: [mime_type] }
    operations: { create: attachment.create, read: attachment.read, update: attachment.update, delete: attachment.delete }

  - id: crm.catalogs
    entity_set: Catalogs
    key: id
    roles: [salesperson, manager, system]
    fields:
      id: { type: string, readonly: true, selectable: true, filterable: true, sortable: true }
      kind: { type: string, selectable: true, filterable: true, sortable: true }
      name: { type: string, selectable: true, filterable: true, sortable: true }
      value: { type: string, selectable: true, filterable: true, sortable: false }
      active: { type: boolean, selectable: true, filterable: true, sortable: true }
    list: { search: [kind, name, value], default_orderby: kind asc, max_page_size: 200, group_by: [kind] }
    operations: { create: catalog.create, read: catalog.read, update: catalog.update, delete: catalog.delete }

datasources:
  - id: read
    params:
      id: { type: string, default: '' }
      odata_top: { type: number, default: 200 }
      odata_skip: { type: number, default: 0 }
    query: |
      SELECT id, name, company, email, phone, source, status, expected_revenue, notes, active, created_at, updated_at,
        count(*) OVER() AS __odata_count
      FROM crm_lead
      WHERE active = true AND (:id = '' OR id = :id)
      {{where}}
      {{order}}
      LIMIT :odata_top OFFSET :odata_skip

  - id: create
    params: { values: { type: json } }
    entrypoint: createLead
    script: |
      async function createLead(ctx, params) {
        const values = params.values || {};
        const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Lead name is required'), { status: 400 });
        const id = `lead-${ctx.crypto.randomUUID().slice(0, 8)}`;
        await ctx.db.execute(`
          INSERT INTO crm_lead(id, name, company, email, phone, source, status, expected_revenue, notes, active, created_at, updated_at)
          VALUES(:id, :name, :company, :email, :phone, :source, :status, :expected_revenue, :notes, true, current_timestamp, current_timestamp)
        `, {
          id, name, company: String(values.company || '').trim(), email: String(values.email || '').trim(),
          phone: String(values.phone || '').trim(), source: String(values.source || '').trim(), expected_revenue: Number(values.expected_revenue || 0),
          status: String(values.status || 'new').trim(), notes: String(values.notes || '').trim(),
        });
        return (await ctx.db.query('SELECT id, name, company, email, phone, source, status, expected_revenue, notes, active, created_at, updated_at FROM crm_lead WHERE id = :id', { id }))[0];
      }

  - id: update
    params: { values: { type: json } }
    entrypoint: updateLead
    script: |
      async function updateLead(ctx, params) {
        const values = params.values || {};
        const id = String(values.id || '');
        const existing = (await ctx.db.query('SELECT id FROM crm_lead WHERE id = :id AND active = true', { id }))[0];
        if (!existing) throw Object.assign(new Error('Lead not found'), { status: 404 });
        const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Lead name is required'), { status: 400 });
        await ctx.db.execute(`
          UPDATE crm_lead SET name = :name, company = :company, email = :email, phone = :phone,
            source = :source, status = :status, expected_revenue = :expected_revenue, notes = :notes, updated_at = current_timestamp
          WHERE id = :id
        `, {
          id, name, company: String(values.company || '').trim(), email: String(values.email || '').trim(),
          phone: String(values.phone || '').trim(), source: String(values.source || '').trim(), expected_revenue: Number(values.expected_revenue || 0),
          status: String(values.status || 'new').trim(), notes: String(values.notes || '').trim(),
        });
        return (await ctx.db.query('SELECT id, name, company, email, phone, source, status, expected_revenue, notes, active, created_at, updated_at FROM crm_lead WHERE id = :id', { id }))[0];
      }

  - id: delete
    params: { id: { type: string } }
    statement: UPDATE crm_lead SET active = false, updated_at = current_timestamp WHERE id = :id AND active = true

  - id: lead.archive
    params: { id: { type: string } }
    statement: UPDATE crm_lead SET active = false, updated_at = current_timestamp WHERE id = :id AND active = true

  - id: lead.restore
    params: { id: { type: string } }
    statement: UPDATE crm_lead SET active = true, updated_at = current_timestamp WHERE id = :id AND active = false

  - id: lead.move_stage
    params: { id: { type: string }, values: { type: json } }
    entrypoint: moveLeadStage
    script: |
      async function moveLeadStage(ctx, params) {
        const status = String((params.values || {}).status || '').trim();
        const stage = (await ctx.db.query('SELECT id FROM crm_stage WHERE id = :id AND active = true', { id: status }))[0];
        if (!stage) throw Object.assign(new Error('Unknown lead stage'), { status: 400 });
        await ctx.db.execute('UPDATE crm_lead SET status = :status, updated_at = current_timestamp WHERE id = :id AND active = true', { id: params.id, status });
        const row = (await ctx.db.query('SELECT id, name, company, email, phone, source, status, expected_revenue, notes, active, created_at, updated_at FROM crm_lead WHERE id = :id', { id: params.id }))[0];
        if (!row) throw Object.assign(new Error('Lead not found'), { status: 404 });
        return row;
      }

  - id: lead.lose
    params: { id: { type: string } }
    entrypoint: loseLead
    script: |
      async function loseLead(ctx, params) {
        await ctx.db.execute("UPDATE crm_lead SET status = 'lost', updated_at = current_timestamp WHERE id = :id AND active = true", { id: params.id });
        return (await ctx.db.query('SELECT id, status FROM crm_lead WHERE id = :id', { id: params.id }))[0] || null;
      }

  - id: lead.convert
    params: { id: { type: string }, values: { type: json } }
    entrypoint: convertLead
    script: |
      async function convertLead(ctx, params) {
        const lead = (await ctx.db.query('SELECT id, company, email, phone FROM crm_lead WHERE id = :id AND active = true', { id: params.id }))[0];
        if (!lead) throw Object.assign(new Error('Lead not found'), { status: 404 });
        const requested = String((params.values || {}).customer_name || lead.company || '').trim();
        if (!requested) throw Object.assign(new Error('A customer name is required to convert this lead'), { status: 400 });
        let customer = (await ctx.db.query('SELECT id, name FROM crm_customer WHERE lower(name) = lower(:name) AND active = true', { name: requested }))[0];
        if (!customer) {
          const id = `customer-${ctx.crypto.randomUUID().slice(0, 8)}`;
          await ctx.db.execute('INSERT INTO crm_customer(id, name, email, phone, active, created_at) VALUES(:id, :name, :email, :phone, true, current_timestamp)', { id, name: requested, email: lead.email || '', phone: lead.phone || '' });
          customer = { id, name: requested };
        }
        await ctx.db.execute("UPDATE crm_lead SET company = :company, status = 'won', updated_at = current_timestamp WHERE id = :id", { id: params.id, company: customer.name });
        return { lead_id: params.id, customer };
      }

  - id: lead.duplicates
    params: { id: { type: string } }
    entrypoint: findLeadDuplicates
    script: |
      async function findLeadDuplicates(ctx, params) {
        const lead = (await ctx.db.query('SELECT id, name, company, email, phone FROM crm_lead WHERE id = :id', { id: params.id }))[0];
        if (!lead) return [];
        return ctx.db.query(`SELECT id, name, company, email, phone FROM crm_lead
          WHERE active = true AND id <> :id AND ((:email <> '' AND lower(email) = lower(:email)) OR (:phone <> '' AND phone = :phone) OR (lower(name) = lower(:name) AND lower(company) = lower(:company)))
          ORDER BY name`, lead);
      }

  - id: lead.merge
    params: { id: { type: string }, values: { type: json } }
    entrypoint: mergeLeads
    script: |
      async function mergeLeads(ctx, params) {
        const ids = [...new Set([params.id, ...((params.values || {}).ids || [])].map(String).filter(Boolean))];
        if (ids.length < 2) throw Object.assign(new Error('Select at least two leads to merge'), { status: 400 });
        const primary = ids[0];
        const rows = await ctx.db.query('SELECT id FROM crm_lead WHERE id IN (:ids) AND active = true', { ids });
        if (rows.length !== ids.length) throw Object.assign(new Error('One or more leads were not found'), { status: 404 });
        await ctx.db.execute('UPDATE crm_lead SET active = false, updated_at = current_timestamp WHERE id IN (:ids) AND id <> :primary', { ids, primary });
        return { primary, merged_ids: ids.slice(1) };
      }

  - id: customer.read
    params:
      id: { type: string, default: '' }
      odata_top: { type: number, default: 200 }
      odata_skip: { type: number, default: 0 }
    query: |
      SELECT id, name, email, phone, active, created_at, count(*) OVER() AS __odata_count
      FROM crm_customer
      WHERE active = true AND (:id = '' OR id = :id)
      {{where}}
      {{order}}
      LIMIT :odata_top OFFSET :odata_skip

  - id: customer.create
    params: { values: { type: json } }
    entrypoint: createCustomer
    script: |
      async function createCustomer(ctx, params) {
        const values = params.values || {}; const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Customer name is required'), { status: 400 });
        const id = `customer-${ctx.crypto.randomUUID().slice(0, 8)}`;
        await ctx.db.execute('INSERT INTO crm_customer(id, name, email, phone, active, created_at) VALUES(:id, :name, :email, :phone, true, current_timestamp)', { id, name, email: String(values.email || '').trim(), phone: String(values.phone || '').trim() });
        return (await ctx.db.query('SELECT id, name, email, phone, active, created_at FROM crm_customer WHERE id = :id', { id }))[0];
      }

  - id: customer.update
    params: { values: { type: json } }
    entrypoint: updateCustomer
    script: |
      async function updateCustomer(ctx, params) {
        const values = params.values || {}; const id = String(values.id || ''); const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Customer name is required'), { status: 400 });
        const exists = (await ctx.db.query('SELECT id FROM crm_customer WHERE id = :id AND active = true', { id }))[0];
        if (!exists) throw Object.assign(new Error('Customer not found'), { status: 404 });
        await ctx.db.execute('UPDATE crm_customer SET name = :name, email = :email, phone = :phone WHERE id = :id', { id, name, email: String(values.email || '').trim(), phone: String(values.phone || '').trim() });
        return (await ctx.db.query('SELECT id, name, email, phone, active, created_at FROM crm_customer WHERE id = :id', { id }))[0];
      }

  - id: customer.delete
    params: { id: { type: string } }
    statement: UPDATE crm_customer SET active = false WHERE id = :id AND active = true

  - id: team.read
    params:
      id: { type: string, default: '' }
      odata_top: { type: number, default: 200 }
      odata_skip: { type: number, default: 0 }
    query: |
      SELECT id, name, quota, active, created_at, count(*) OVER() AS __odata_count
      FROM crm_team
      WHERE active = true AND (:id = '' OR id = :id)
      {{where}}
      {{order}}
      LIMIT :odata_top OFFSET :odata_skip

  - id: team.create
    params: { values: { type: json } }
    entrypoint: createTeam
    script: |
      async function createTeam(ctx, params) {
        const values = params.values || {}; const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Team name is required'), { status: 400 });
        const id = `team-${ctx.crypto.randomUUID().slice(0, 8)}`;
        await ctx.db.execute('INSERT INTO crm_team(id, name, quota, active, created_at) VALUES(:id, :name, :quota, true, current_timestamp)', { id, name, quota: Number(values.quota || 0) });
        return (await ctx.db.query('SELECT id, name, quota, active, created_at FROM crm_team WHERE id = :id', { id }))[0];
      }

  - id: team.update
    params: { values: { type: json } }
    entrypoint: updateTeam
    script: |
      async function updateTeam(ctx, params) {
        const values = params.values || {}; const id = String(values.id || ''); const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Team name is required'), { status: 400 });
        const exists = (await ctx.db.query('SELECT id FROM crm_team WHERE id = :id AND active = true', { id }))[0];
        if (!exists) throw Object.assign(new Error('Team not found'), { status: 404 });
        await ctx.db.execute('UPDATE crm_team SET name = :name, quota = :quota WHERE id = :id', { id, name, quota: Number(values.quota || 0) });
        return (await ctx.db.query('SELECT id, name, quota, active, created_at FROM crm_team WHERE id = :id', { id }))[0];
      }

  - id: team.delete
    params: { id: { type: string } }
    statement: UPDATE crm_team SET active = false WHERE id = :id AND active = true

  - id: activity.read
    params:
      id: { type: string, default: '' }
      odata_top: { type: number, default: 200 }
      odata_skip: { type: number, default: 0 }
    query: |
      SELECT id, lead_id, summary, activity_type, due_date, done, created_at, count(*) OVER() AS __odata_count
      FROM crm_activity
      WHERE (:id = '' OR id = :id)
      {{where}}
      {{order}}
      LIMIT :odata_top OFFSET :odata_skip

  - id: activity.create
    params: { values: { type: json } }
    entrypoint: createActivity
    script: |
      async function createActivity(ctx, params) {
        const values = params.values || {}; const summary = String(values.summary || '').trim(); const leadId = String(values.lead_id || '').trim();
        if (!summary || !leadId) throw Object.assign(new Error('Lead and activity summary are required'), { status: 400 });
        const lead = (await ctx.db.query('SELECT id FROM crm_lead WHERE id = :id AND active = true', { id: leadId }))[0];
        if (!lead) throw Object.assign(new Error('Lead not found'), { status: 404 });
        const id = `activity-${ctx.crypto.randomUUID().slice(0, 8)}`;
        await ctx.db.execute('INSERT INTO crm_activity(id, lead_id, summary, activity_type, due_date, done, created_at) VALUES(:id, :lead_id, :summary, :activity_type, :due_date, false, current_timestamp)', { id, lead_id: leadId, summary, activity_type: String(values.activity_type || 'todo'), due_date: String(values.due_date || '') || null });
        return (await ctx.db.query('SELECT id, lead_id, summary, activity_type, due_date, done, created_at FROM crm_activity WHERE id = :id', { id }))[0];
      }

  - id: activity.update
    params: { values: { type: json } }
    entrypoint: updateActivity
    script: |
      async function updateActivity(ctx, params) {
        const values = params.values || {}; const id = String(values.id || ''); const summary = String(values.summary || '').trim(); const leadId = String(values.lead_id || '').trim();
        if (!summary || !leadId) throw Object.assign(new Error('Lead and activity summary are required'), { status: 400 });
        const exists = (await ctx.db.query('SELECT id FROM crm_activity WHERE id = :id', { id }))[0];
        if (!exists) throw Object.assign(new Error('Activity not found'), { status: 404 });
        await ctx.db.execute('UPDATE crm_activity SET lead_id = :lead_id, summary = :summary, activity_type = :activity_type, due_date = :due_date, done = :done WHERE id = :id', { id, lead_id: leadId, summary, activity_type: String(values.activity_type || 'todo'), due_date: String(values.due_date || '') || null, done: values.done === true || values.done === 'true' });
        return (await ctx.db.query('SELECT id, lead_id, summary, activity_type, due_date, done, created_at FROM crm_activity WHERE id = :id', { id }))[0];
      }

  - id: activity.delete
    params: { id: { type: string } }
    statement: DELETE FROM crm_activity WHERE id = :id

  - id: activity.complete
    params: { id: { type: string } }
    entrypoint: completeActivity
    script: |
      async function completeActivity(ctx, params) {
        await ctx.db.execute('UPDATE crm_activity SET done = true WHERE id = :id', { id: params.id });
        return (await ctx.db.query('SELECT id, done FROM crm_activity WHERE id = :id', { id: params.id }))[0] || null;
      }

  - id: stage.read
    params:
      id: { type: string, default: '' }
      odata_top: { type: number, default: 200 }
      odata_skip: { type: number, default: 0 }
    query: |
      SELECT id, name, sequence, active, count(*) OVER() AS __odata_count
      FROM crm_stage
      WHERE active = true AND (:id = '' OR id = :id)
      {{where}}
      {{order}}
      LIMIT :odata_top OFFSET :odata_skip

  - id: stage.create
    params: { values: { type: json } }
    entrypoint: createStage
    script: |
      async function createStage(ctx, params) {
        const values = params.values || {}; const id = String(values.id || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); const name = String(values.name || '').trim();
        if (!id || !name) throw Object.assign(new Error('Stage ID and name are required'), { status: 400 });
        const exists = (await ctx.db.query('SELECT id FROM crm_stage WHERE id = :id', { id }))[0]; if (exists) throw Object.assign(new Error('Stage ID already exists'), { status: 409 });
        await ctx.db.execute('INSERT INTO crm_stage(id, name, sequence, active) VALUES(:id, :name, :sequence, true)', { id, name, sequence: Number(values.sequence || 0) });
        return (await ctx.db.query('SELECT id, name, sequence, active FROM crm_stage WHERE id = :id', { id }))[0];
      }

  - id: stage.update
    params: { values: { type: json } }
    entrypoint: updateStage
    script: |
      async function updateStage(ctx, params) {
        const values = params.values || {}; const id = String(values.id || ''); const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Stage name is required'), { status: 400 });
        const exists = (await ctx.db.query('SELECT id FROM crm_stage WHERE id = :id AND active = true', { id }))[0]; if (!exists) throw Object.assign(new Error('Stage not found'), { status: 404 });
        await ctx.db.execute('UPDATE crm_stage SET name = :name, sequence = :sequence WHERE id = :id', { id, name, sequence: Number(values.sequence || 0) });
        return (await ctx.db.query('SELECT id, name, sequence, active FROM crm_stage WHERE id = :id', { id }))[0];
      }

