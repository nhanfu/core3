datasources:
  - id: crm.pipeline
    params: { search: { type: string, default: '' }, filter: { type: string, default: '' }, sort: { type: string, default: '' }, role: { type: string, default: manager } }
    language: javascript
    entrypoint: pipeline
    script: |
      // js
      async function pipeline(ctx, params) {
        const leads = await ctx.datasource.execute('crm.list_leads', params);
        const stages = await ctx.datasource.execute('crm.stages');
        return stages.map(stage => ({
          id: stage.id, title: stage.name, folded: Boolean(stage.folded),
          cards: leads.filter(row => row.stage_id === stage.id).map(row => ({
            id: row.id, title: row.name, customer: row.partner_name, salesperson: row.salesperson,
            revenue: Number(row.expected_revenue || 0), priority: Number(row.priority || 0),
            tags: String(row.tags || '').split(',').filter(Boolean), activity: row.next_activity,
          })),
        }));
      }

  - id: crm.crmLookups
    params: { search: { type: string, default: '' } }
    language: javascript
    entrypoint: crmLookups
    script: |
      // js
      async function crmLookups(ctx, params) {
        const search = `%${String(params.search || '').trim()}%`;
        const [partners, users, teams, tags, recurringPlans] = await Promise.all([
          ctx.datasource.execute('crm.lookup.partners', { search }), ctx.datasource.execute('crm.lookup.users', { search }),
          ctx.datasource.execute('crm.lookup.teams', { search }), ctx.datasource.execute('crm.lookup.tags'),
          ctx.datasource.execute('crm.lookup.recurring_plans'),
        ]);
        return { partners, users, teams, tags, recurringPlans };
      }

  - id: crm.findDuplicates
    params: { id: { type: string } }
    language: javascript
    entrypoint: findDuplicates
    script: |
      // js
      async function findDuplicates(ctx, params) {
        const current = (await ctx.datasource.execute('crm.lead_identity', params))[0];
        if (!current) return [];
        return ctx.datasource.execute('crm.duplicate_leads', { ...params, name: current.name, partner_name: current.partner_name || '', email: current.email || '', phone: current.phone || '' });
      }

  - id: crm.mergePreview
    params: { ids: { type: json } }
    language: javascript
    entrypoint: mergePreview
    script: |
      // js
      async function mergePreview(ctx, params) {
        const ids = [...new Set(Array.isArray(params.ids) ? params.ids : [])].filter(Boolean);
        if (ids.length < 2) return { primary: null, duplicates: [] };
        const rows = await ctx.datasource.execute('crm.merge_preview', { ids });
        return { primary: rows[0] || null, duplicates: rows.slice(1) };
      }

  - id: crm.getLead
    params: { id: { type: string } }
    language: javascript
    entrypoint: getLead
    script: |
      // js
      async function getLead(ctx, params) {
        const row = (await ctx.datasource.execute('crm.lead', params))[0];
        if (!row) return null;
        const relation = (await ctx.datasource.execute('crm.lead_tags', params))[0];
        if (relation) row.tag_ids = relation.tag_ids || '';
        return row;
      }

  - id: crm.customerRelated
    params: { id: { type: string } }
    language: javascript
    entrypoint: customerRelated
    script: |
      // js
      async function customerRelated(ctx, params) {
        const customer = (await ctx.datasource.execute('crm.customer', params))[0];
        if (!customer) return { leads: [], activities: [] };
        const [leads, activities] = await Promise.all([
          ctx.datasource.execute('crm.customer_leads', { ...params, name: customer.name }),
          ctx.datasource.execute('crm.customer_activities', { ...params, name: customer.name }),
        ]);
        return { leads, activities };
      }

  - id: crm.getTeam
    params: { id: { type: string } }
    language: javascript
    entrypoint: getTeam
    script: |
      // js
      async function getTeam(ctx, params) {
        const row = (await ctx.datasource.execute('crm.team', params))[0];
        if (!row) return null;
        row.member_ids = (await ctx.datasource.execute('crm.team_members', params)).map(member => member.user_id).join(',');
        return row;
      }

  - id: crm.saveCustomer
    params: { values: { type: json } }
    language: javascript
    entrypoint: saveCustomer
    script: |
      // js
      async function saveCustomer(ctx, params) {
        const values = params.values || {}; const id = String(values.id || `partner-${ctx.crypto.randomUUID().slice(0, 8)}`); const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Customer name is required'), { status: 400 });
        await ctx.datasource.execute('crm.save_customer', { id, name, email: String(values.email || ''), phone: String(values.phone || '') });
        return (await ctx.datasource.execute('crm.customer', { id }))[0] || null;
      }

  - id: crm.saveTeam
    params: { values: { type: json } }
    language: javascript
    entrypoint: saveTeam
    script: |
      // js
      async function saveTeam(ctx, params) {
        const values = params.values || {}; const id = String(values.id || `team-${ctx.crypto.randomUUID().slice(0, 8)}`); const name = String(values.name || '').trim();
        if (!name) throw Object.assign(new Error('Sales team name is required'), { status: 400 });
        await ctx.datasource.execute('crm.save_team', { id, name, quota: Number(values.quota || 0) }); await ctx.datasource.execute('crm.clear_team_members', { id });
        const members = Array.isArray(values.member_ids) ? values.member_ids.map(String) : String(values.member_ids || '').split(',');
        for (const userId of members.map(value => value.trim()).filter(Boolean)) await ctx.datasource.execute('crm.add_team_member', { team_id: id, user_id: userId });
        return ctx.datasource.execute('crm.getTeam', { id });
      }

  - id: crm.reportSummary
    params: { role: { type: string, default: manager } }
    language: javascript
    entrypoint: reportSummary
    script: |
      // js
      async function reportSummary(ctx, params) {
        const [summary, byStage] = await Promise.all([ctx.datasource.execute('crm.report.summary', params), ctx.datasource.execute('crm.report.by_stage', params)]);
        return { summary, byStage };
      }

  - id: crm.reportAnalysis
    params: { dimension: { type: string, default: stage }, role: { type: string, default: manager }, from_date: { type: string, default: '' }, to_date: { type: string, default: '' }, search: { type: string, default: '' } }
    language: javascript
    entrypoint: reportAnalysis
    script: |
      // js
      async function reportAnalysis(ctx, params) {
        const dimensions = { stage: 's.name', salesperson: "coalesce(l.salesperson, 'Unassigned')", team: "coalesce(l.team, 'Unassigned')", customer: "coalesce(l.partner_name, 'Unassigned')", closing_bucket: "CASE WHEN l.expected_closing IS NULL THEN 'Unscheduled' WHEN l.expected_closing < current_date THEN 'Overdue' ELSE strftime(l.expected_closing, '%Y-%m') END" };
        const search = String(params.search || '').trim();
        return ctx.datasource.execute('crm.report.analysis', { ...params, dimension: 'unused', search: search ? `%${search}%` : '' }, { dimension: dimensions[params.dimension] || dimensions.stage });
      }

  - id: crm.reportDrilldown
    params: { dimension: { type: string, default: stage }, secondary_dimension: { type: string, default: '' }, value: { type: string, default: '' }, secondary_value: { type: string, default: '' }, role: { type: string, default: manager } }
    language: javascript
    entrypoint: reportDrilldown
    script: |
      // js
      async function reportDrilldown(ctx, params) {
        const dimensions = { stage: 's.name', salesperson: "coalesce(l.salesperson, 'Unassigned')", team: "coalesce(l.team, 'Unassigned')", customer: "coalesce(l.partner_name, 'Unassigned')", closing_bucket: "CASE WHEN l.expected_closing IS NULL THEN 'Unscheduled' WHEN l.expected_closing < current_date THEN 'Overdue' ELSE strftime(l.expected_closing, '%Y-%m') END" };
        const dimension = dimensions[params.dimension] || dimensions.stage;
        return ctx.datasource.execute('crm.report.drilldown', { ...params, dimension: 'unused', secondary_dimension: 'unused', secondary_value: params.secondary_dimension ? params.secondary_value : '' }, { dimension, secondary_dimension: dimensions[params.secondary_dimension] || dimension });
      }

  - id: crm.leadAnalysis
    params: { dimension: { type: string, default: source }, role: { type: string, default: manager }, search: { type: string, default: '' } }
    language: javascript
    entrypoint: leadAnalysis
    script: |
      // js
      async function leadAnalysis(ctx, params) {
        const dimensions = { source: "coalesce(l.source, 'Unspecified')", campaign: "coalesce(l.campaign, 'Unspecified')", team: "coalesce(l.team, 'Unassigned')", salesperson: "coalesce(l.salesperson, 'Unassigned')", stage: 's.name' };
        const search = String(params.search || '').trim();
        return ctx.datasource.execute('crm.lead.analysis', { ...params, dimension: 'unused', search: search ? `%${search}%` : '' }, { dimension: dimensions[params.dimension] || dimensions.source });
      }

  - id: crm.leadDrilldown
    params: { dimension: { type: string, default: source }, value: { type: string, default: '' }, role: { type: string, default: manager } }
    language: javascript
    entrypoint: leadDrilldown
    script: |
      // js
      async function leadDrilldown(ctx, params) {
        const dimensions = { source: "coalesce(l.source, 'Unspecified')", campaign: "coalesce(l.campaign, 'Unspecified')", team: "coalesce(l.team, 'Unassigned')", salesperson: "coalesce(l.salesperson, 'Unassigned')", stage: 's.name' };
        return ctx.datasource.execute('crm.lead.drilldown', { ...params, dimension: 'unused' }, { dimension: dimensions[params.dimension] || dimensions.source });
      }

  - id: crm.activityAnalysis
    params: { dimension: { type: string, default: activity_type }, role: { type: string, default: manager }, search: { type: string, default: '' } }
    language: javascript
    entrypoint: activityAnalysis
    script: |
      // js
      async function activityAnalysis(ctx, params) {
        const dimensions = { activity_type: 'a.activity_type', salesperson: "coalesce(l.salesperson, 'Unassigned')", due_date: "coalesce(cast(a.due_date AS VARCHAR), 'No due date')" };
        const search = String(params.search || '').trim();
        return ctx.datasource.execute('crm.activity.analysis', { ...params, dimension: 'unused', search: search ? `%${search}%` : '' }, { dimension: dimensions[params.dimension] || dimensions.activity_type });
      }

  - id: crm.activityDrilldown
    params: { dimension: { type: string, default: activity_type }, value: { type: string, default: '' }, role: { type: string, default: manager } }
    language: javascript
    entrypoint: activityDrilldown
    script: |
      // js
      async function activityDrilldown(ctx, params) {
        const dimensions = { activity_type: 'a.activity_type', salesperson: "coalesce(l.salesperson, 'Unassigned')", due_date: "coalesce(cast(a.due_date AS VARCHAR), 'No due date')" };
        return ctx.datasource.execute('crm.activity.drilldown', { ...params, dimension: 'unused' }, { dimension: dimensions[params.dimension] || dimensions.activity_type });
      }

  - id: crm.previewImportWithHistory
    params: { rows: { type: json } }
    language: javascript
    entrypoint: previewImportWithHistory
    script: |
      // js
      async function previewImportWithHistory(ctx, params) {
        const preview = await ctx.datasource.execute('crm.preview_import', params); const invalid = preview.filter(item => item.errors.length);
        if (invalid.length) await ctx.datasource.execute('crm.import_error', { id: `import-${ctx.crypto.randomUUID().slice(0, 8)}`, imported_count: 0, error_count: invalid.length, errors: JSON.stringify(invalid) });
        return preview;
      }

  - id: crm.commitImport
    params: { rows: { type: json } }
    language: javascript
    entrypoint: commitImport
    script: |
      // js
      async function commitImport(ctx, params) {
        const preview = await ctx.datasource.execute('crm.preview_import', params); const invalid = preview.filter(item => item.errors.length);
        if (invalid.length) { await ctx.datasource.execute('crm.import_error', { id: `import-${ctx.crypto.randomUUID().slice(0, 8)}`, imported_count: 0, error_count: invalid.length, errors: JSON.stringify(invalid) }); throw Object.assign(new Error('Import contains invalid rows'), { status: 400 }); }
        return ctx.datasource.execute('crm.commit_import', { rows: preview.map(item => item.values) });
      }

  - id: crm.mutateLeads
    params: { ids: { type: json }, operation: { type: string }, value: { type: string, default: '' } }
    language: javascript
    entrypoint: mutateLeads
    script: |
      // js
      async function mutateLeads(ctx, params) {
        const ids = params.ids || []; if (!ids.length) return { ok: true, count: 0 }; const value = String(params.value || '');
        if (params.operation === 'archive') await ctx.datasource.execute('crm.mutate.archive', { ids }); else if (params.operation === 'restore') await ctx.datasource.execute('crm.mutate.restore', { ids }); else if (params.operation === 'delete') return ctx.datasource.execute('crm.mutate.delete', { ids }); else if (params.operation === 'assign') await ctx.datasource.execute('crm.mutate.assign', { ids, salesperson: value || 'Mitchell Admin' }); else if (params.operation === 'stage') await ctx.datasource.execute('crm.mutate.stage', { ids, stage_id: value }); else if (params.operation === 'merge' && ids.length > 1) return ctx.datasource.execute('crm.merge_leads', { ids }); else return { ok: false, error: 'Unknown lead operation' };
        return { ok: true, count: ids.length };
      }

  - id: crm.mutateActivities
    params: { ids: { type: json }, operation: { type: string }, value: { type: string, default: '' } }
    language: javascript
    entrypoint: mutateActivities
    script: |
      // js
      async function mutateActivities(ctx, params) {
        const ids = params.ids || []; if (!ids.length) return { ok: true, count: 0 };
        if (params.operation === 'done') await ctx.datasource.execute('crm.activity.done', { ids }); else if (params.operation === 'reopen') await ctx.datasource.execute('crm.activity.reopen', { ids }); else if (params.operation === 'reschedule' && params.value) await ctx.datasource.execute('crm.activity.reschedule', { ids, due_date: params.value }); else return { ok: false, error: 'Unknown activity operation' };
        return { ok: true, count: ids.length };
      }

  - id: crm.leadExtras
    params: { id: { type: string } }
    language: javascript
    entrypoint: leadExtras
    script: |
      // js
      async function leadExtras(ctx, params) {
        const [messages, activities, followers, attachments] = await Promise.all([
          ctx.datasource.execute('crm.lead_messages', params), ctx.datasource.execute('crm.lead_activities', params),
          ctx.datasource.execute('crm.lead_followers', params), ctx.datasource.execute('crm.lead_attachments', params),
        ]);
        return { messages, activities, followers, attachments };
      }

  - id: crm.addMessage
    params: { id: { type: string }, body: { type: string } }
    language: javascript
    entrypoint: addMessage
    script: |
      // js
      async function addMessage(ctx, params) {
        const body = String(params.body || '').trim(); if (!body) throw Object.assign(new Error('Message body is required'), { status: 400 });
        await ctx.datasource.execute('crm.add_message', { id: `message-${ctx.crypto.randomUUID().slice(0, 8)}`, lead_id: params.id, author: 'Mitchell Admin', body });
        return ctx.datasource.execute('crm.leadExtras', { id: params.id });
      }

  - id: crm.addActivity
    params: { id: { type: string }, activity_type: { type: string }, summary: { type: string }, due_date: { type: string, default: '' } }
    language: javascript
    entrypoint: addActivity
    script: |
      // js
      async function addActivity(ctx, params) {
        const summary = String(params.summary || '').trim(); if (!summary) throw Object.assign(new Error('Activity summary is required'), { status: 400 });
        await ctx.datasource.execute('crm.add_activity', { id: `activity-${ctx.crypto.randomUUID().slice(0, 8)}`, lead_id: params.id, activity_type: params.activity_type || 'To-do', summary, due_date: params.due_date || null });
        return ctx.datasource.execute('crm.leadExtras', { id: params.id });
      }

  - id: crm.addFollower
    params: { id: { type: string }, name: { type: string } }
    language: javascript
    entrypoint: addFollower
    script: |
      // js
      async function addFollower(ctx, params) {
        const name = String(params.name || '').trim(); if (!name) throw Object.assign(new Error('Follower name is required'), { status: 400 });
        await ctx.datasource.execute('crm.add_follower', { id: `follower-${ctx.crypto.randomUUID().slice(0, 8)}`, lead_id: params.id, name });
        return ctx.datasource.execute('crm.leadExtras', { id: params.id });
      }

  - id: crm.addAttachment
    params: { id: { type: string }, name: { type: string } }
    language: javascript
    entrypoint: addAttachment
    script: |
      // js
      async function addAttachment(ctx, params) {
        const name = String(params.name || '').trim(); if (!name) throw Object.assign(new Error('Attachment name is required'), { status: 400 });
        await ctx.datasource.execute('crm.add_attachment', { id: `attachment-${ctx.crypto.randomUUID().slice(0, 8)}`, lead_id: params.id, name });
        return ctx.datasource.execute('crm.leadExtras', { id: params.id });
      }

  - id: crm.addAttachmentFile
    params: { id: { type: string }, file: { type: json }, upload_directory: { type: string } }
    language: javascript
    entrypoint: addAttachmentFile
    script: |
      // js
      async function addAttachmentFile(ctx, params) {
        const file = params.file; if (!file?.name || !file?.size) throw Object.assign(new Error('Attachment file is required'), { status: 400 }); if (file.size > 10 * 1024 * 1024) throw Object.assign(new Error('Attachment file is too large'), { status: 413 });
        const id = `attachment-${ctx.crypto.randomUUID().slice(0, 8)}`; const safeName = String(file.name).replace(/[^a-zA-Z0-9._-]/g, '_'); const storedPath = `${id}-${safeName}`;
        await ctx.files.mkdir(params.upload_directory); await ctx.files.write(`${params.upload_directory}/${storedPath}`, file);
        await ctx.datasource.execute('crm.save_attachment_file', { id, lead_id: params.id, name: file.name, stored_path: storedPath, mime_type: file.type || 'application/octet-stream', file_size: file.size });
        return ctx.datasource.execute('crm.leadExtras', { id: params.id });
      }

  - id: crm.saveStages
    params: { rows: { type: json } }
    language: javascript
    entrypoint: saveStages
    script: |
      // js
      async function saveStages(ctx, params) {
        for (const input of params.rows || []) { const row = input && typeof input === 'object' ? input : {}; const id = String(row.id || '').trim(); const name = String(row.name || '').trim(); if (!id || !name) continue; const existing = (await ctx.datasource.execute('crm.stage_by_id', { id }))[0]; const sequence = existing ? 0 : Number((await ctx.datasource.execute('crm.next_stage_sequence'))[0]?.sequence || 1); await ctx.datasource.execute('crm.save_stage', { id, name, folded: String(row.folded) === 'true', requirements: String(row.requirements || ''), sequence }); }
        return ctx.datasource.execute('crm.stages');
      }

  - id: crm.saveLostReason
    params: { id: { type: string }, name: { type: string } }
    language: javascript
    entrypoint: saveLostReason
    script: |
      // js
      async function saveLostReason(ctx, params) { const id = String(params.id || '').trim(); const name = String(params.name || '').trim(); if (!id || !name) throw Object.assign(new Error('Lost reason id and name are required'), { status: 400 }); await ctx.datasource.execute('crm.save_lost_reason', { id, name }); return ctx.datasource.execute('crm.lost_reasons'); }

  - id: crm.saveTag
    params: { id: { type: string }, name: { type: string }, color: { type: string, default: '' } }
    language: javascript
    entrypoint: saveTag
    script: |
      // js
      async function saveTag(ctx, params) { const id = String(params.id || '').trim(); const name = String(params.name || '').trim(); if (!id || !name) throw Object.assign(new Error('Tag id and name are required'), { status: 400 }); await ctx.datasource.execute('crm.save_tag', { id, name, color: String(params.color || '').trim() }); return ctx.datasource.execute('crm.tags'); }

  - id: crm.saveCatalog
    params: { kind: { type: string }, values: { type: json } }
    language: javascript
    entrypoint: saveCatalog
    script: |
      // js
      async function saveCatalog(ctx, params) { const values = params.values || {}; const id = String(values.id || '').trim(); const name = String(values.name || '').trim(); if (!id || !name) throw Object.assign(new Error('Catalog id and name are required'), { status: 400 }); if (params.kind === 'activity_types') await ctx.datasource.execute('crm.save_activity_type', { id, name, default_summary: String(values.default_summary || '') }); else if (params.kind === 'activity_plans') await ctx.datasource.execute('crm.save_activity_plan', { id, name }); else await ctx.datasource.execute('crm.save_recurring_plan', { id, name, interval_number: Number(values.interval_number || 1), interval_unit: String(values.interval_unit || 'month') }); return ctx.datasource.execute(`crm.catalog.${params.kind}`); }

  - id: crm.saveConfig
    params: { values: { type: json } }
    language: javascript
    entrypoint: saveConfig
    script: |
      // js
      async function saveConfig(ctx, params) { for (const [key, value] of Object.entries(params.values || {})) if (['use_leads', 'use_recurring_revenues', 'auto_assign_leads'].includes(key)) await ctx.datasource.execute('crm.save_config', { key, value: String(value) === 'true' ? 'true' : 'false' }); return ctx.datasource.execute('crm.config'); }
