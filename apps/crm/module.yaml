module:
  id: crm
  name: CRM
  depends_on: [base, mail, contacts, calendar]

security:
  roles:
    salesperson:
      can: [read, create, write, stage_change, activity, chatter]
    manager:
      can: [read, create, write, stage_change, activity, chatter, assign, archive, delete, merge]

models:
  crm.lead:
    table: crm_lead
    fields:
      name: { type: char, label: Opportunity, required: true }
      type: { type: selection, label: Type, options: [lead, opportunity] }
      partner_name: { type: many2one, label: Customer, relation: res.partner }
      contact_name: { type: char, label: Contact }
      email: { type: char, label: Email }
      phone: { type: char, label: Phone }
      team: { type: char, label: Sales Team }
      salesperson: { type: many2one, label: Salesperson, relation: res.users }
      stage_id: { type: many2one, label: Stage, relation: crm.stage, required: true }
      priority: { type: integer, label: Priority }
      tags: { type: many2many, label: Tags, relation: crm.tag }
      expected_revenue: { type: monetary, label: Expected Revenue }
      probability: { type: number, label: Probability }
      expected_closing: { type: date, label: Expected Closing }
      next_activity: { type: char, label: Next Activity }
      notes: { type: html, label: Notes }
      active: { type: boolean, label: Active }

views:
  crm.lead:
    kanban:
      source: crm.pipeline.kanban
      group_by: stage_id
      card_fields: [name, partner_name, salesperson, expected_revenue, priority, tags, next_activity]
    list:
      source: crm.lead.list
      columns: [name, partner_name, salesperson, team, stage_id, expected_revenue, priority, expected_closing]
    form:
      source: crm.lead.form
      fields: [type, name, partner_name, contact_name, email, phone, team, salesperson, stage_id, priority, tags, expected_revenue, probability, expected_closing, next_activity, notes]
    search:
      source: crm.lead.search
      filters: [assigned_to_me, unassigned, open, won, lost, overdue, activity_status]
      group_by: [stage_id, salesperson, team, partner_name, expected_closing]

actions:
  - id: crm.pipeline
    model: crm.lead
    domain: [[type, '=', opportunity]]
    context: { default_type: opportunity }
    views: [kanban, list, calendar, graph, pivot, form]
  - id: crm.leads
    model: crm.lead
    domain: []
    context: { default_type: lead }
    views: [list, kanban, form]

menus:
  - id: crm.root
    label: CRM
  - id: crm.sales
    parent: crm.root
    label: Sales
  - id: crm.pipeline
    parent: crm.sales
    label: My Pipeline
    action: crm.pipeline
  - id: crm.leads
    parent: crm.root
    label: Leads
    action: crm.leads
  - id: crm.activities
    parent: crm.sales
    label: My Activities
    icon: calendar
  - id: crm.reporting
    parent: crm.root
    label: Reporting
    icon: analytics
  - id: crm.settings
    parent: crm.root
    label: Configuration
    icon: settings
