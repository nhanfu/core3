module:
  id: crm
  name: CRM
  depends_on: [base, mail, contacts, calendar]

apps:
  - id: crm
    name: CRM
    icon: users
    status: available
    description: Leads, opportunities, and pipeline
    rootMenus: [crm.root]
    defaultAction: crm.pipeline
  - id: sales
    name: Sales
    icon: money
    status: coming_soon
    description: Quotations and orders
    rootMenus: [sales.root]
    defaultAction: sales.dashboard
  - id: inventory
    name: Inventory
    icon: truck
    status: coming_soon
    description: Products, warehouses, and deliveries
    rootMenus: [inventory.root]
    defaultAction: inventory.dashboard

security:
  roles:
    salesperson:
      can: [read, create, write, stage_change, activity, chatter]
    manager:
      can: [read, create, write, stage_change, activity, chatter, assign, archive, delete, merge]

# UI bindings refer to datasource IDs; transport and SQL stay in server-private CRM YAML files.
datasources:
  stage_summary: crm.stage_summary
  lost_reasons: crm.lost_reasons
  config: crm.config
  stages: crm.stages
  tags: crm.tags
  activity_types: crm.catalog.activity_types
  activity_plans: crm.catalog.activity_plans
  recurring_plans: crm.catalog.recurring_plans
  import_history: crm.import_history

models:
  crm.lead:
    table: crm_lead
    fields:
      name: { type: char, label: Opportunity, required: true }
      type: { type: selection, label: Type, options: [lead, opportunity] }
      partner_id: { type: many2one, label: Customer, relation: res.partner }
      partner_name: { type: char, label: Customer, readonly: true }
      contact_name: { type: char, label: Contact }
      email: { type: char, label: Email }
      phone: { type: char, label: Phone }
      source: { type: char, label: Source }
      campaign: { type: char, label: Campaign }
      team_id: { type: many2one, label: Sales Team, relation: crm.team }
      team: { type: char, label: Sales Team, readonly: true }
      salesperson_id: { type: many2one, label: Salesperson, relation: res.users }
      salesperson: { type: char, label: Salesperson, readonly: true }
      stage_id: { type: many2one, label: Stage, relation: crm.stage, required: true }
      priority: { type: integer, label: Priority }
      tag_ids: { type: many2many, label: Tags, relation: crm.tag }
      tags: { type: char, label: Tags, readonly: true }
      expected_revenue: { type: monetary, label: Expected Revenue }
      recurring_revenue: { type: monetary, label: Recurring Revenue }
      recurring_plan_id: { type: many2one, label: Recurring Plan, relation: crm.recurring_plan }
      probability: { type: number, label: Probability }
      expected_closing: { type: date, label: Expected Closing }
      next_activity: { type: char, label: Next Activity }
      notes: { type: html, label: Notes }
      active: { type: boolean, label: Active }

views:
  crm.lead:
    kanban:
      source: crm.pipeline.kanban
      group_by: stage_id
      card_fields: [name, partner_name, salesperson, expected_revenue, priority, tags, next_activity]
    list:
      source: crm.lead.list
      columns: [name, partner_name, salesperson, team, source, campaign, stage_id, expected_revenue, priority, expected_closing]
    form:
      source: crm.lead.form
      fields: [type, name, partner_id, contact_name, email, phone, source, campaign, team_id, salesperson_id, stage_id, priority, tag_ids, expected_revenue, recurring_revenue, recurring_plan_id, probability, expected_closing, next_activity, notes]
    search:
      source: crm.lead.search
      filters: [unassigned, open, won, lost, archived, overdue, activity_status]
      group_by: [stage_id, salesperson, team, partner_name, expected_closing]

actions:
  - id: crm.pipeline
    model: crm.lead
    domain: [[type, '=', opportunity]]
    context: { default_type: opportunity }
    views: [kanban, list, calendar, graph, pivot, form]
  - id: crm.leads
    model: crm.lead
    domain: []
    context: { default_type: lead }
    views: [list, kanban, form]
  - id: crm.activities
    model: crm.activity
    domain: []
    views: [list, calendar, form]
  - id: crm.customers
    model: res.partner
    domain: []
    views: [list, form]
  - id: crm.teams
    model: crm.team
    domain: []
    views: [list, kanban, form]
  - id: crm.reporting
    model: crm.lead
    domain: []
    views: [graph, pivot, list]
  - id: crm.forecast
    model: crm.lead
    domain: []
    views: [list, graph]
  - id: crm.import
    model: crm.lead
    domain: []
    views: [form]
  - id: crm.settings
    model: crm.config
    domain: []
    views: [form]

menus:
  - id: crm.root
    label: CRM
  - id: crm.sales
    parent: crm.root
    label: Sales
  - id: crm.pipeline
    parent: crm.sales
    label: My Pipeline
    action: crm.pipeline
  - id: crm.leads
    parent: crm.root
    label: Leads
    action: crm.leads
  - id: crm.activities
    parent: crm.sales
    label: My Activities
    icon: calendar
    action: crm.activities
  - id: crm.teams
    parent: crm.sales
    label: Teams
    icon: users
    action: crm.teams
  - id: crm.customers
    parent: crm.sales
    label: Customers
    icon: users
    action: crm.customers
  - id: crm.reporting
    parent: crm.root
    label: Reporting
    icon: analytics
    action: crm.reporting
  - id: crm.forecast
    parent: crm.reporting
    label: Forecast
    icon: analytics
    action: crm.forecast
  - id: crm.pipeline_analysis
    parent: crm.reporting
    label: Pipeline
    icon: analytics
    action: crm.reporting
  - id: crm.leads_analysis
    parent: crm.reporting
    label: Leads
    icon: analytics
    action: crm.reporting
  - id: crm.activity_analysis
    parent: crm.reporting
    label: Activities
    icon: analytics
    action: crm.activities
  - id: crm.settings
    parent: crm.root
    label: Configuration
    icon: settings
    action: crm.settings
    groups: [manager, system]
  - id: crm.stages
    parent: crm.settings
    label: Stages
    icon: settings
    action: crm.settings
    groups: [manager, system]
  - id: crm.tags
    parent: crm.settings
    label: Tags
    icon: settings
    action: crm.settings
    groups: [manager, system]
  - id: crm.lost_reasons
    parent: crm.settings
    label: Lost Reasons
    icon: settings
    action: crm.settings
    groups: [manager, system]
  - id: crm.activity_types
    parent: crm.settings
    label: Activity Types
    icon: settings
    action: crm.settings
    groups: [manager, system]
  - id: crm.activity_plans
    parent: crm.settings
    label: Activity Plans
    icon: settings
    action: crm.settings
    groups: [manager, system]
  - id: crm.recurring_plans
    parent: crm.settings
    label: Recurring Plans
    icon: settings
    action: crm.settings
    groups: [manager, system]
  - id: crm.import
    parent: crm.root
    label: Import & Synchronize
    icon: upload
    action: crm.import
    groups: [manager, system]
