datasources:
  read: { resource: Leads, method: GET, collection: true }
  create: { resource: Leads, method: POST }
  update: { resource: Leads, method: PUT }
  delete: { resource: Leads, method: DELETE }
  lead.archive: { resource: Leads, method: POST, action: archive }
  lead.restore: { resource: Leads, method: POST, action: restore }
  lead.move_stage: { resource: Leads, method: POST, action: moveStage }
  lead.lose: { resource: Leads, method: POST, action: lose }
  lead.convert: { resource: Leads, method: POST, action: convert }
  lead.duplicates: { resource: Leads, method: GET, action: duplicates }
  lead.merge: { resource: Leads, method: POST, action: merge }
  message.read: { resource: Messages, method: GET, collection: true }
  message.create: { resource: Messages, method: POST }
  follower.read: { resource: Followers, method: GET, collection: true }
  follower.create: { resource: Followers, method: POST }
  attachment.read: { resource: Attachments, method: GET, collection: true }
  attachment.create: { resource: Attachments, method: POST }

screens:
  - id: leads
    route: /
    title: Leads
    state: { search: '', orderby: 'created_at desc' }
    on_load: |
      await ctx.load('read', 'leads', { '$search': ctx.state.search, '$orderby': ctx.state.orderby, '$count': true });
      ctx.state.count = ctx.data.leads['@odata.count'];
    events:
      search: |
        await ctx.load('read', 'leads', { '$search': ctx.state.search, '$orderby': ctx.state.orderby, '$count': true });
        ctx.state.count = ctx.data.leads['@odata.count'];
      order: |
        await ctx.load('read', 'leads', { '$search': ctx.state.search, '$orderby': ctx.state.orderby, '$count': true });
        ctx.state.count = ctx.data.leads['@odata.count'];
      create: |
        ctx.navigate('/leads/new');
      open: |
        ctx.navigate('/leads/' + encodeURIComponent(ctx.event.row.id));
    components:
      - type: heading
        text: Lead management
      - type: text
        class: yaml-count
        text: $state.count
      - type: section
        class: yaml-toolbar
        children:
          - type: input
            binding: $state.search
            placeholder: Search leads
            on_change: search
          - type: select
            binding: $state.orderby
            on_change: order
            options:
              - { value: 'created_at desc', label: Newest first }
              - { value: 'name asc', label: Name A-Z }
              - { value: 'company asc', label: Company A-Z }
              - { value: 'status asc', label: Status }
          - type: button
            label: New lead
            event: create
      - type: table
        rows: $data.leads.value
        row_event: open
        columns:
          - { field: name, label: Lead }
          - { field: company, label: Company }
          - { field: email, label: Email }
          - { field: phone, label: Phone }
          - { field: source, label: Source }
          - { field: status, label: Status }
          - { field: expected_revenue, label: Expected revenue }

  - id: lead-form
    route: /leads/:id
    title: Lead
    on_load: |
      await ctx.load('stage.read', 'stages', { '$orderby': 'sequence asc' });
      if (ctx.route.id === 'new') ctx.data.record = { name: '', company: '', email: '', phone: '', source: '', status: 'new', expected_revenue: 0, notes: '' };
      else await ctx.load('read', 'record', {}, ctx.route.id);
    events:
      save: |
        const values = ctx.formValues();
        if (ctx.route.id === 'new') await ctx.request('create', values);
        else await ctx.request('update', values, ctx.route.id);
        ctx.navigate('/');
      move_stage: |
        const values = ctx.formValues();
        await ctx.request('lead.move_stage', { status: values.status }, ctx.route.id);
        ctx.navigate('/pipeline');
      lose: |
        await ctx.request('lead.lose', {}, ctx.route.id);
        ctx.navigate('/pipeline');
      convert: |
        const values = ctx.formValues();
        await ctx.request('lead.convert', { customer_name: values.company }, ctx.route.id);
        ctx.navigate('/customers');
      archive: |
        await ctx.request('lead.archive', {}, ctx.route.id);
        ctx.navigate('/');
      duplicates: |
        await ctx.load('lead.duplicates', 'duplicates', {}, ctx.route.id);
      collaboration: |
        ctx.navigate('/leads/' + encodeURIComponent(ctx.route.id) + '/collaboration');
      remove: |
        if (ctx.route.id !== 'new') { await ctx.request('delete', {}, ctx.route.id); ctx.navigate('/'); }
      cancel: |
        ctx.navigate('/');
    components:
      - type: heading
        text: Lead
      - type: form
        record: $data.record
        submit: save
        fields:
          - { name: name, label: Lead name, required: true }
          - { name: company, label: Company }
          - { name: email, label: Email, type: email }
          - { name: phone, label: Phone }
          - { name: source, label: Source }
          - { name: expected_revenue, label: Expected revenue, type: number }
          - name: status
            label: Status
            type: select
            options: $data.stages.value
            option_value: id
            option_label: name
          - { name: notes, label: Notes, type: textarea }
        actions:
          - { label: Cancel, event: cancel }
          - { label: Move stage, event: move_stage, visible_when: "ctx.route.id !== 'new'" }
          - { label: Mark lost, event: lose, visible_when: "ctx.route.id !== 'new'" }
          - { label: Convert, event: convert, visible_when: "ctx.route.id !== 'new'" }
          - { label: Collaboration, event: collaboration, visible_when: "ctx.route.id !== 'new'" }
          - { label: Archive, event: archive, visible_when: "ctx.route.id !== 'new'" }
          - { label: Delete, event: remove, visible_when: "ctx.route.id !== 'new'" }
          - { label: Save, submit: true }
      - { type: heading, text: Possible duplicates }
      - type: table
        rows: $data.duplicates
        columns:
          - { field: name, label: Lead }
          - { field: company, label: Company }
          - { field: email, label: Email }

  - id: pipeline
    route: /pipeline
    title: Pipeline
    on_load: |
      await ctx.load('read', 'leads', { '$orderby': 'created_at desc' });
      await ctx.load('stage.read', 'stages', { '$orderby': 'sequence asc' });
    events:
      open: |
        ctx.navigate('/leads/' + encodeURIComponent(ctx.event.row.id));
    components:
      - { type: heading, text: Sales pipeline }
      - type: kanban
        rows: $data.leads.value
        group_field: status
        title_field: name
        detail_fields: [company, source]
        row_event: open
        groups: $data.stages.value
        group_value: id
        group_label: name

  - id: lead-collaboration
    route: /leads/:leadId/collaboration
    title: Collaboration
    on_load: |
      await ctx.load('message.read', 'messages', { '$filter': "lead_id eq '" + ctx.route.leadId + "'" });
      await ctx.load('follower.read', 'followers', { '$filter': "lead_id eq '" + ctx.route.leadId + "'" });
      await ctx.load('attachment.read', 'attachments', { '$filter': "lead_id eq '" + ctx.route.leadId + "'" });
    events:
      add: |
        const values = ctx.formValues();
        if (values.kind === 'message') await ctx.request('message.create', { lead_id: ctx.route.leadId, author: values.author, body: values.value });
        else if (values.kind === 'follower') await ctx.request('follower.create', { lead_id: ctx.route.leadId, name: values.value });
        else await ctx.request('attachment.create', { lead_id: ctx.route.leadId, name: values.value, mime_type: values.mime_type, content: values.content });
        await ctx.load('message.read', 'messages', { '$filter': "lead_id eq '" + ctx.route.leadId + "'" });
        await ctx.load('follower.read', 'followers', { '$filter': "lead_id eq '" + ctx.route.leadId + "'" });
        await ctx.load('attachment.read', 'attachments', { '$filter': "lead_id eq '" + ctx.route.leadId + "'" });
      back: |
        ctx.navigate('/leads/' + encodeURIComponent(ctx.route.leadId));
    components:
      - { type: heading, text: Lead collaboration }
      - type: form
        record: { kind: message, author: Salesperson, value: '', mime_type: text/plain, content: '' }
        fields:
          - name: kind
            label: Add
            type: select
            options:
              - { value: message, label: Message }
              - { value: follower, label: Follower }
              - { value: attachment, label: Attachment }
          - { name: author, label: Author }
          - { name: value, label: Message, type: textarea, required: true }
          - { name: mime_type, label: Attachment mime type }
          - { name: content, label: Attachment content, type: textarea }
        actions:
          - { label: Add, event: add }
          - { label: Back to lead, event: back }
      - { type: heading, text: Messages }
      - type: table
        rows: $data.messages.value
        columns: [{ field: author, label: Author }, { field: body, label: Message }, { field: created_at, label: Created }]
      - { type: heading, text: Followers }
      - type: table
        rows: $data.followers.value
        columns: [{ field: name, label: Follower }, { field: created_at, label: Added }]
      - { type: heading, text: Attachments }
      - type: table
        rows: $data.attachments.value
        columns: [{ field: name, label: Attachment }, { field: mime_type, label: Type }, { field: created_at, label: Added }]
