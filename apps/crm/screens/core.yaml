shell:
  app_name: CRM
  app_icon: CRM
  company_name: My Company
  user_name: Administrator
  nav:
    - id: sales
      label: Sales
      icon: ▾
      children:
        - { id: pipeline, label: My Pipeline, to: /pipeline, icon: ◆ }
        - { id: activities, label: My Activities, to: /activities, icon: ✓ }
        - { id: teams, label: Teams, to: /teams, icon: ◈ }
        - { id: customers, label: Customers, to: /customers, icon: ◎ }
    - { id: leads, label: Leads, to: /, icon: ◇ }
    - id: reporting
      label: Reporting
      icon: ▾
      children:
        - { id: forecast, label: Forecast, to: /forecast }
        - { id: pipeline-report, label: Pipeline, to: /reporting }
        - { id: activity-report, label: Activities, to: /calendar }
    - id: configuration
      label: Configuration
      icon: ▾
      children:
        - { id: pipeline-config, label: Pipeline, to: /configuration }
        - { id: import, label: Import & Synchronize, to: /import }

datasources:
  customer.read: { resource: Customers, method: GET, collection: true }
  customer.create: { resource: Customers, method: POST }
  customer.update: { resource: Customers, method: PUT }
  customer.delete: { resource: Customers, method: DELETE }
  team.read: { resource: Teams, method: GET, collection: true }
  team.create: { resource: Teams, method: POST }
  team.update: { resource: Teams, method: PUT }
  team.delete: { resource: Teams, method: DELETE }
  activity.read: { resource: Activities, method: GET, collection: true }
  activity.create: { resource: Activities, method: POST }
  activity.update: { resource: Activities, method: PUT }
  activity.delete: { resource: Activities, method: DELETE }
  activity.complete: { resource: Activities, method: POST, action: complete }
  stage.read: { resource: Stages, method: GET, collection: true }
  stage.create: { resource: Stages, method: POST }
  stage.update: { resource: Stages, method: PUT }
  stage.delete: { resource: Stages, method: DELETE }
  import.read: { resource: Imports, method: GET, collection: true }
  import.preview: { resource: Imports, method: POST }
  import.commit: { resource: Imports, method: POST, action: commit }
  catalog.read: { resource: Catalogs, method: GET, collection: true }
  catalog.create: { resource: Catalogs, method: POST }
  catalog.update: { resource: Catalogs, method: PUT }
  catalog.delete: { resource: Catalogs, method: DELETE }

screens:
  - id: customers
    route: /customers
    title: Customers
    state: { search: '' }
    on_load: |
      await ctx.load('customer.read', 'customers', { '$search': ctx.state.search, '$orderby': 'name asc' });
    events:
      search: |
        await ctx.load('customer.read', 'customers', { '$search': ctx.state.search, '$orderby': 'name asc' });
      create: |
        ctx.navigate('/customers/new');
      open: |
        ctx.navigate('/customers/' + encodeURIComponent(ctx.event.row.id));
    components:
      - { type: heading, text: Customers }
      - type: section
        class: yaml-toolbar
        children:
          - { type: input, binding: $state.search, placeholder: Search customers, on_change: search }
          - { type: button, label: New customer, event: create }
      - type: table
        rows: $data.customers.value
        row_event: open
        columns:
          - { field: name, label: Customer }
          - { field: email, label: Email }
          - { field: phone, label: Phone }

  - id: customer-form
    route: /customers/:id
    title: Customer
    on_load: |
      if (ctx.route.id === 'new') ctx.data.record = { name: '', email: '', phone: '' };
      else await ctx.load('customer.read', 'record', {}, ctx.route.id);
    events:
      save: |
        const values = ctx.formValues();
        if (ctx.route.id === 'new') await ctx.request('customer.create', values);
        else await ctx.request('customer.update', values, ctx.route.id);
        ctx.navigate('/customers');
      remove: |
        if (ctx.route.id !== 'new') { await ctx.request('customer.delete', {}, ctx.route.id); ctx.navigate('/customers'); }
      cancel: |
        ctx.navigate('/customers');
    components:
      - { type: heading, text: Customer }
      - type: form
        record: $data.record
        submit: save
        fields:
          - { name: name, label: Customer name, required: true }
          - { name: email, label: Email, type: email }
          - { name: phone, label: Phone }
        actions:
          - { label: Cancel, event: cancel }
          - { label: Delete, event: remove, visible_when: "ctx.route.id !== 'new'" }
          - { label: Save, submit: true }

  - id: teams
    route: /teams
    title: Teams
    on_load: |
      await ctx.load('team.read', 'teams', { '$orderby': 'name asc' });
    events:
      create: |
        ctx.navigate('/teams/new');
      open: |
        ctx.navigate('/teams/' + encodeURIComponent(ctx.event.row.id));
    components:
      - { type: heading, text: Sales teams }
      - type: section
        class: yaml-toolbar
        children:
          - { type: button, label: New team, event: create }
      - type: table
        rows: $data.teams.value
        row_event: open
        columns:
          - { field: name, label: Team }
          - { field: quota, label: Quota }

  - id: team-form
    route: /teams/:id
    title: Team
    on_load: |
      if (ctx.route.id === 'new') ctx.data.record = { name: '', quota: 0 };
      else await ctx.load('team.read', 'record', {}, ctx.route.id);
    events:
      save: |
        const values = ctx.formValues();
        if (ctx.route.id === 'new') await ctx.request('team.create', values);
        else await ctx.request('team.update', values, ctx.route.id);
        ctx.navigate('/teams');
      remove: |
        if (ctx.route.id !== 'new') { await ctx.request('team.delete', {}, ctx.route.id); ctx.navigate('/teams'); }
      cancel: |
        ctx.navigate('/teams');
    components:
      - { type: heading, text: Sales team }
      - type: form
        record: $data.record
        submit: save
        fields:
          - { name: name, label: Team name, required: true }
          - { name: quota, label: Quarterly quota, type: number }
        actions:
          - { label: Cancel, event: cancel }
          - { label: Delete, event: remove, visible_when: "ctx.route.id !== 'new'" }
          - { label: Save, submit: true }

  - id: activities
    route: /activities
    title: Activities
    state: { search: '' }
    on_load: |
      await ctx.load('activity.read', 'activities', { '$search': ctx.state.search, '$orderby': 'due_date asc' });
    events:
      search: |
        await ctx.load('activity.read', 'activities', { '$search': ctx.state.search, '$orderby': 'due_date asc' });
      create: |
        ctx.navigate('/activities/new');
      open: |
        ctx.navigate('/activities/' + encodeURIComponent(ctx.event.row.id));
    components:
      - { type: heading, text: Activities }
      - type: section
        class: yaml-toolbar
        children:
          - { type: input, binding: $state.search, placeholder: Search activities, on_change: search }
          - { type: button, label: New activity, event: create }
      - type: table
        rows: $data.activities.value
        row_event: open
        columns:
          - { field: summary, label: Activity }
          - { field: lead_id, label: Lead }
          - { field: activity_type, label: Type }
          - { field: due_date, label: Due }
          - { field: done, label: Done }

  - id: activity-form
    route: /activities/:id
    title: Activity
    on_load: |
      if (ctx.route.id === 'new') ctx.data.record = { lead_id: ctx.query.lead_id || '', summary: '', activity_type: 'todo', due_date: '', done: false };
      else await ctx.load('activity.read', 'record', {}, ctx.route.id);
    events:
      save: |
        const values = ctx.formValues();
        if (ctx.route.id === 'new') await ctx.request('activity.create', values);
        else await ctx.request('activity.update', values, ctx.route.id);
        ctx.navigate('/activities');
      complete: |
        await ctx.request('activity.complete', {}, ctx.route.id);
        ctx.navigate('/activities');
      remove: |
        if (ctx.route.id !== 'new') { await ctx.request('activity.delete', {}, ctx.route.id); ctx.navigate('/activities'); }
      cancel: |
        ctx.navigate('/activities');
    components:
      - { type: heading, text: Activity }
      - type: form
        record: $data.record
        submit: save
        fields:
          - { name: lead_id, label: Lead ID, required: true }
          - { name: summary, label: Summary, required: true }
          - name: activity_type
            label: Type
            type: select
            options:
              - { value: todo, label: To do }
              - { value: call, label: Call }
              - { value: email, label: Email }
              - { value: meeting, label: Meeting }
          - { name: due_date, label: Due date, type: date }
        actions:
          - { label: Cancel, event: cancel }
          - { label: Complete, event: complete, visible_when: "ctx.route.id !== 'new'" }
          - { label: Delete, event: remove, visible_when: "ctx.route.id !== 'new'" }
          - { label: Save, submit: true }

  - id: configuration
    route: /configuration
    title: Configuration
    on_load: |
      await ctx.load('stage.read', 'stages', { '$orderby': 'sequence asc' });
    events:
      create: |
        ctx.navigate('/configuration/stages/new');
      open: |
        ctx.navigate('/configuration/stages/' + encodeURIComponent(ctx.event.row.id));
      catalogs: |
        ctx.navigate('/configuration/catalogs');
    components:
      - { type: heading, text: Pipeline stages }
      - type: section
        class: yaml-toolbar
        children:
          - { type: button, label: New stage, event: create }
          - { type: button, label: Manage catalogs, event: catalogs }
      - type: table
        rows: $data.stages.value
        row_event: open
        columns:
          - { field: name, label: Stage }
          - { field: sequence, label: Sequence }

  - id: stage-form
    route: /configuration/stages/:id
    title: Stage
    on_load: |
      if (ctx.route.id === 'new') ctx.data.record = { id: '', name: '', sequence: 0 };
      else await ctx.load('stage.read', 'record', {}, ctx.route.id);
    events:
      save: |
        const values = ctx.formValues();
        if (ctx.route.id === 'new') await ctx.request('stage.create', values);
        else await ctx.request('stage.update', values, ctx.route.id);
        ctx.navigate('/configuration');
      remove: |
        if (ctx.route.id !== 'new') { await ctx.request('stage.delete', {}, ctx.route.id); ctx.navigate('/configuration'); }
      cancel: |
        ctx.navigate('/configuration');
    components:
      - { type: heading, text: Pipeline stage }
      - type: form
        record: $data.record
        submit: save
        fields:
          - { name: id, label: Stage ID, required: true }
          - { name: name, label: Stage name, required: true }
          - { name: sequence, label: Sequence, type: number }
        actions:
          - { label: Cancel, event: cancel }
          - { label: Delete, event: remove, visible_when: "ctx.route.id !== 'new'" }
          - { label: Save, submit: true }

  - id: catalogs
    route: /configuration/catalogs
    title: Catalogs
    on_load: |
      await ctx.load('catalog.read', 'catalogs', { '$orderby': 'kind asc,name asc' });
    events:
      create: |
        ctx.navigate('/configuration/catalogs/new');
      open: |
        ctx.navigate('/configuration/catalogs/' + encodeURIComponent(ctx.event.row.id));
    components:
      - { type: heading, text: Configuration catalogs }
      - type: section
        class: yaml-toolbar
        children:
          - { type: button, label: New catalog item, event: create }
      - type: table
        rows: $data.catalogs.value
        row_event: open
        columns:
          - { field: kind, label: Kind }
          - { field: name, label: Name }
          - { field: value, label: Value }

  - id: catalog-form
    route: /configuration/catalogs/:id
    title: Catalog
    on_load: |
      if (ctx.route.id === 'new') ctx.data.record = { kind: 'tag', name: '', value: '' };
      else await ctx.load('catalog.read', 'record', {}, ctx.route.id);
    events:
      save: |
        const values = ctx.formValues();
        if (ctx.route.id === 'new') await ctx.request('catalog.create', values);
        else await ctx.request('catalog.update', values, ctx.route.id);
        ctx.navigate('/configuration/catalogs');
      remove: |
        if (ctx.route.id !== 'new') { await ctx.request('catalog.delete', {}, ctx.route.id); ctx.navigate('/configuration/catalogs'); }
      cancel: |
        ctx.navigate('/configuration/catalogs');
    components:
      - { type: heading, text: Catalog item }
      - type: form
        record: $data.record
        submit: save
        fields:
          - name: kind
            label: Kind
            type: select
            options:
              - { value: tag, label: Tag }
              - { value: lost_reason, label: Lost reason }
              - { value: activity_type, label: Activity type }
              - { value: activity_plan, label: Activity plan }
              - { value: recurring_plan, label: Recurring plan }
          - { name: name, label: Name, required: true }
          - { name: value, label: Value }
        actions:
          - { label: Cancel, event: cancel }
          - { label: Delete, event: remove, visible_when: "ctx.route.id !== 'new'" }
          - { label: Save, submit: true }

  - id: reporting
    route: /reporting
    title: Reporting
    on_load: |
      await ctx.load('read', 'leads', { '$orderby': 'status asc' });
      const groups = {};
      for (const lead of ctx.data.leads.value) {
        const row = groups[lead.status] ||= { status: lead.status, lead_count: 0, expected_revenue: 0 };
        row.lead_count += 1; row.expected_revenue += Number(lead.expected_revenue || 0);
      }
      ctx.data.status_summary = Object.values(groups);
    components:
      - { type: heading, text: Pipeline reporting }
      - type: chart
        rows: $data.status_summary
        label_field: status
        value_field: expected_revenue
      - type: table
        rows: $data.status_summary
        columns:
          - { field: status, label: Stage }
          - { field: lead_count, label: Leads }
          - { field: expected_revenue, label: Expected revenue }

  - id: forecast
    route: /forecast
    title: Forecast
    on_load: |
      await ctx.load('read', 'leads', { '$filter': "status ne 'lost'", '$orderby': 'expected_revenue desc' });
      const total = ctx.data.leads.value.reduce((sum, lead) => sum + Number(lead.expected_revenue || 0), 0);
      ctx.data.forecast = [{ label: 'Open pipeline', expected_revenue: total, lead_count: ctx.data.leads.value.length }];
    components:
      - { type: heading, text: Forecast }
      - type: chart
        rows: $data.forecast
        label_field: label
        value_field: expected_revenue
      - type: table
        rows: $data.forecast
        columns:
          - { field: label, label: Forecast }
          - { field: lead_count, label: Open leads }
          - { field: expected_revenue, label: Expected revenue }

  - id: lead-pivot
    route: /analysis/pivot
    title: Lead pivot
    on_load: |
      await ctx.load('read', 'leads', { '$orderby': 'company asc' });
    components:
      - { type: heading, text: Lead revenue pivot }
      - type: pivot
        rows: $data.leads.value
        row_field: company
        row_label: Company
        column_field: status
        value_field: expected_revenue

  - id: activity-calendar
    route: /calendar
    title: Activity calendar
    on_load: |
      await ctx.load('activity.read', 'activities', { '$orderby': 'due_date asc' });
    events:
      open: |
        ctx.navigate('/activities/' + encodeURIComponent(ctx.event.row.id));
    components:
      - { type: heading, text: Activity calendar }
      - type: calendar
        rows: $data.activities.value
        date_field: due_date
        title_field: summary
        row_event: open

  - id: import
    route: /import
    title: Import
    on_load: |
      await ctx.load('import.read', 'history', { '$orderby': 'created_at desc' });
      ctx.data.preview = null;
    events:
      preview: |
        ctx.data.preview = await ctx.request('import.preview', ctx.formValues());
      commit: |
        await ctx.request('import.commit', {}, ctx.data.preview.id);
        await ctx.load('import.read', 'history', { '$orderby': 'created_at desc' });
        ctx.data.preview = null;
    components:
      - { type: heading, text: Import leads }
      - type: text
        text: Paste CSV with name, company, email, phone, source, status, expected_revenue, and notes columns.
      - type: form
        record: { csv: "name,company,status,expected_revenue\nImported lead,Core3,new,5000" }
        fields:
          - { name: csv, label: CSV content, type: textarea, required: true }
        actions:
          - { label: Preview import, event: preview }
          - { label: Commit import, event: commit, visible_when: "Boolean(ctx.data.preview?.id) && !ctx.data.preview.error_count" }
      - { type: heading, text: Preview rows }
      - type: table
        rows: $data.preview.rows
        columns:
          - { field: row, label: Row }
          - { field: errors, label: Errors }
      - { type: heading, text: Import history }
      - type: table
        rows: $data.history.value
        columns:
          - { field: id, label: Import }
          - { field: state, label: State }
          - { field: imported_count, label: Imported }
          - { field: error_count, label: Errors }
