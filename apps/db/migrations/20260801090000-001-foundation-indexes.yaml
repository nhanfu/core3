  CREATE TABLE IF NOT EXISTS branches (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    name VARCHAR NOT NULL,
    city VARCHAR NOT NULL,
    region VARCHAR,
    status VARCHAR DEFAULT 'Active',
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS roles (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    name VARCHAR NOT NULL UNIQUE,
    description VARCHAR,
    view_scope VARCHAR NOT NULL DEFAULT 'all' CHECK (view_scope IN ('all', 'branch', 'own'))
  );

  CREATE TABLE IF NOT EXISTS users (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    email VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    password_hash VARCHAR NOT NULL,
    avatar_url VARCHAR,
    preferred_lang VARCHAR DEFAULT 'en',
    enabled BOOLEAN DEFAULT true,
    branch_id VARCHAR REFERENCES branches(id),
    department_id VARCHAR,
    last_login TIMESTAMP,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS user_roles (
    -- DuckDB treats updates to a referenced parent row as a delete/insert;
    -- user profile updates must remain valid while role membership exists.
    -- Repository authorization validates this membership relation explicitly.
    user_id VARCHAR NOT NULL,
    role_id VARCHAR NOT NULL REFERENCES roles(id),
    PRIMARY KEY (user_id, role_id)
  );

  CREATE TABLE IF NOT EXISTS permissions (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    role_id VARCHAR NOT NULL REFERENCES roles(id),
    permission_key VARCHAR NOT NULL
  );

  CREATE TABLE IF NOT EXISTS chat_threads (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    title VARCHAR NOT NULL,
    thread_type VARCHAR NOT NULL DEFAULT 'Group' CHECK (thread_type IN ('Direct', 'Group')),
    created_by VARCHAR NOT NULL REFERENCES users(id),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS chat_participants (
    thread_id VARCHAR NOT NULL REFERENCES chat_threads(id),
    user_id VARCHAR NOT NULL REFERENCES users(id),
    joined_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    last_read_at TIMESTAMP,
    PRIMARY KEY (thread_id, user_id)
  );
  CREATE INDEX IF NOT EXISTS idx_chat_participants_user ON chat_participants(user_id, thread_id);

  CREATE TABLE IF NOT EXISTS chat_messages (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    thread_id VARCHAR NOT NULL REFERENCES chat_threads(id),
    sender_id VARCHAR NOT NULL REFERENCES users(id),
    body VARCHAR NOT NULL CHECK (length(body) BETWEEN 1 AND 4000),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    edited_at TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_chat_messages_thread ON chat_messages(thread_id, created_at);

  CREATE TABLE IF NOT EXISTS chat_attachments (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    message_id VARCHAR NOT NULL REFERENCES chat_messages(id),
    file_name VARCHAR NOT NULL,
    mime_type VARCHAR,
    size_bytes BIGINT NOT NULL DEFAULT 0 CHECK (size_bytes >= 0),
    storage_key VARCHAR NOT NULL,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_chat_attachments_message ON chat_attachments(message_id);

  CREATE TABLE IF NOT EXISTS drivers (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    name VARCHAR NOT NULL,
    phone VARCHAR,
    email VARCHAR,
    license_number VARCHAR,
    license_expiry DATE,
    status VARCHAR DEFAULT 'Active',
    assigned_truck_id VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_drivers_assigned_truck ON drivers(assigned_truck_id);

  CREATE TABLE IF NOT EXISTS customers (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    tax_code VARCHAR,
    phone VARCHAR,
    email VARCHAR,
    stage VARCHAR DEFAULT 'Lead' CHECK (stage IN ('Lead', 'Contacting', 'Customer')),
    owner_name VARCHAR,
    visibility VARCHAR DEFAULT 'Public' CHECK (visibility IN ('Public', 'Private')),
    status VARCHAR DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_customers_visibility_owner ON customers(visibility, owner_name);
  CREATE INDEX IF NOT EXISTS idx_customers_stage_status ON customers(stage, status);
  CREATE TABLE IF NOT EXISTS customer_contacts (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    -- Repository validates this mutable parent link; DuckDB rejects any update
    -- to a referenced parent row, even when the primary key is unchanged.
    customer_id VARCHAR NOT NULL,
    name VARCHAR NOT NULL,
    role_title VARCHAR,
    phone VARCHAR,
    email VARCHAR,
    is_primary BOOLEAN NOT NULL DEFAULT false,
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_customer_contacts_customer ON customer_contacts(customer_id);

  CREATE TABLE IF NOT EXISTS quotes (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), code VARCHAR NOT NULL UNIQUE, customer_name VARCHAR NOT NULL,
    title VARCHAR NOT NULL, amount DECIMAL(18,2) NOT NULL DEFAULT 0,
    cost_amount DECIMAL(18,2) NOT NULL DEFAULT 0,
    profit_amount DECIMAL(18,2) NOT NULL DEFAULT 0,
    status VARCHAR NOT NULL DEFAULT 'Draft',
    branch_id VARCHAR,
    valid_until DATE, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_quotes_branch ON quotes(branch_id);
  CREATE TABLE IF NOT EXISTS quote_lines (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    quote_id VARCHAR NOT NULL REFERENCES quotes(id),
    sequence INTEGER NOT NULL DEFAULT 10,
    description VARCHAR NOT NULL,
    quantity DECIMAL(18,3) NOT NULL DEFAULT 1 CHECK (quantity > 0),
    unit VARCHAR NOT NULL DEFAULT 'Chuyến',
    unit_price DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (unit_price >= 0),
    cost_price DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (cost_price >= 0),
    tax_rate DECIMAL(5,2) NOT NULL DEFAULT 0 CHECK (tax_rate >= 0 AND tax_rate <= 100),
    line_total DECIMAL(18,2) NOT NULL DEFAULT 0,
    cost_total DECIMAL(18,2) NOT NULL DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(quote_id, sequence)
  );
  CREATE INDEX IF NOT EXISTS idx_quote_lines_quote ON quote_lines(quote_id);

  CREATE TABLE IF NOT EXISTS partners (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    tax_code VARCHAR,
    phone VARCHAR,
    email VARCHAR,
    partner_type VARCHAR DEFAULT 'Supplier' CHECK (partner_type IN ('Carrier', 'Supplier', 'ShippingLine', 'Warehouse', 'Depot', 'Other')),
    owner_name VARCHAR,
    visibility VARCHAR DEFAULT 'Public' CHECK (visibility IN ('Public', 'Private')),
    status VARCHAR DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_partners_visibility_owner ON partners(visibility, owner_name);
  CREATE INDEX IF NOT EXISTS idx_partners_type_status ON partners(partner_type, status);
  CREATE TABLE IF NOT EXISTS partner_contacts (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    -- Repository validates this mutable parent link; DuckDB rejects any update
    -- to a referenced parent row, even when the primary key is unchanged.
    partner_id VARCHAR NOT NULL,
    name VARCHAR NOT NULL,
    role_title VARCHAR,
    phone VARCHAR,
    email VARCHAR,
    is_primary BOOLEAN NOT NULL DEFAULT false,
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_partner_contacts_partner ON partner_contacts(partner_id);

  CREATE TABLE IF NOT EXISTS employees (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    job_title VARCHAR,
    phone VARCHAR,
    email VARCHAR,
    department VARCHAR,
    start_date DATE,
    dependents INTEGER NOT NULL DEFAULT 0 CHECK (dependents >= 0),
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'OnLeave', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS employment_contracts (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    employee_id VARCHAR NOT NULL REFERENCES employees(id),
    contract_type VARCHAR NOT NULL DEFAULT 'FixedTerm' CHECK (contract_type IN ('Probation', 'FixedTerm', 'Indefinite')),
    start_date DATE NOT NULL,
    end_date DATE,
    base_salary DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (base_salary >= 0),
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Expiring', 'Expired', 'Terminated')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE TABLE IF NOT EXISTS employee_documents (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    employee_id VARCHAR NOT NULL REFERENCES employees(id),
    file_name VARCHAR NOT NULL,
    mime_type VARCHAR,
    size_bytes BIGINT NOT NULL DEFAULT 0 CHECK (size_bytes > 0),
    storage_key VARCHAR NOT NULL,
    uploaded_by VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_employee_documents_employee ON employee_documents(employee_id, created_at);
  CREATE TABLE IF NOT EXISTS contract_documents (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    contract_id VARCHAR NOT NULL REFERENCES employment_contracts(id),
    file_name VARCHAR NOT NULL,
    mime_type VARCHAR,
    size_bytes BIGINT NOT NULL DEFAULT 0 CHECK (size_bytes > 0),
    storage_key VARCHAR NOT NULL,
    uploaded_by VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_contract_documents_contract ON contract_documents(contract_id, created_at);

  CREATE TABLE IF NOT EXISTS work_shifts (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    start_time VARCHAR NOT NULL,
    end_time VARCHAR NOT NULL,
    break_minutes INTEGER NOT NULL DEFAULT 0 CHECK (break_minutes >= 0),
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS timesheets (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    employee_id VARCHAR NOT NULL REFERENCES employees(id),
    work_date DATE NOT NULL,
    shift_id VARCHAR REFERENCES work_shifts(id),
    hours DECIMAL(5,2) NOT NULL DEFAULT 0 CHECK (hours >= 0 AND hours <= 24),
    status VARCHAR NOT NULL DEFAULT 'Present' CHECK (status IN ('Present', 'Absent', 'Leave')),
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(employee_id, work_date)
  );

  CREATE TABLE IF NOT EXISTS payrolls (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    employee_id VARCHAR NOT NULL REFERENCES employees(id),
    pay_month DATE NOT NULL,
    base_salary DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (base_salary >= 0),
    allowance DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (allowance >= 0),
    deduction DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (deduction >= 0),
    net_salary DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (net_salary >= 0),
    status VARCHAR NOT NULL DEFAULT 'Draft' CHECK (status IN ('Draft', 'Approved', 'Paid')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(employee_id, pay_month)
  );

  CREATE TABLE IF NOT EXISTS areas (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    -- Hierarchy changes are validated in the repository. DuckDB rejects updates
    -- to a parent row while descendants still reference it.
    parent_id VARCHAR,
    region VARCHAR,
    description VARCHAR,
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS company_profiles (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    name VARCHAR NOT NULL,
    short_name VARCHAR,
    tax_code VARCHAR,
    address VARCHAR,
    invoice_address VARCHAR,
    phone VARCHAR,
    email VARCHAR,
    website VARCHAR,
    bank_name VARCHAR,
    bank_account VARCHAR,
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE TABLE IF NOT EXISTS company_documents (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    company_id VARCHAR NOT NULL REFERENCES company_profiles(id),
    file_name VARCHAR NOT NULL,
    mime_type VARCHAR,
    size_bytes BIGINT NOT NULL DEFAULT 0 CHECK (size_bytes > 0),
    storage_key VARCHAR NOT NULL,
    uploaded_by VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_company_documents_company ON company_documents(company_id, created_at);

  CREATE TABLE IF NOT EXISTS departments (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    parent_id VARCHAR REFERENCES departments(id),
    branch_id VARCHAR REFERENCES branches(id),
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS teams (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    department_id VARCHAR REFERENCES departments(id),
    manager_id VARCHAR REFERENCES employees(id),
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS locations (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR NOT NULL UNIQUE,
    name VARCHAR NOT NULL,
    location_type VARCHAR NOT NULL DEFAULT 'Other' CHECK (location_type IN ('Port', 'Warehouse', 'Depot', 'Customer', 'Other')),
    address VARCHAR,
    city VARCHAR,
    -- Area assignment is scope- and cycle-validated by the repository so area
    -- hierarchy edits remain possible on DuckDB.
    area_id VARCHAR,
    branch_id VARCHAR REFERENCES branches(id),
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS containers (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    container_number VARCHAR NOT NULL UNIQUE,
    container_type VARCHAR NOT NULL DEFAULT '20DC',
    owner_name VARCHAR,
    location_id VARCHAR REFERENCES locations(id),
    branch_id VARCHAR REFERENCES branches(id),
    status VARCHAR NOT NULL DEFAULT 'Available' CHECK (status IN ('Available', 'InUse', 'Maintenance', 'Inactive')),
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS trucks (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    plate VARCHAR NOT NULL UNIQUE,
    model VARCHAR NOT NULL,
    type VARCHAR NOT NULL,
    status VARCHAR DEFAULT 'Active',
    capacity_kg INTEGER DEFAULT 0,
    mileage INTEGER DEFAULT 0,
    driver_id VARCHAR REFERENCES drivers(id),
    last_service DATE,
    next_service DATE,
    branch_id VARCHAR REFERENCES branches(id),
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS trips (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    trip_number VARCHAR NOT NULL UNIQUE,
    truck_id VARCHAR REFERENCES trucks(id),
    driver_id VARCHAR REFERENCES drivers(id),
    branch_id VARCHAR REFERENCES branches(id),
    origin VARCHAR NOT NULL,
    destination VARCHAR NOT NULL,
    status VARCHAR DEFAULT 'Scheduled',
    departure_time TIMESTAMP,
    arrival_time TIMESTAMP,
    distance_km DECIMAL(10,2),
    cargo_type VARCHAR,
    cargo_weight DECIMAL(10,2),
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );

  CREATE TABLE IF NOT EXISTS orders (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    order_number VARCHAR NOT NULL UNIQUE,
    customer_name VARCHAR NOT NULL,
    customer_legal_name VARCHAR,
    order_date DATE NOT NULL,
    status VARCHAR NOT NULL DEFAULT 'Draft',
    shipment_type VARCHAR,
    route VARCHAR,
    transport_method VARCHAR,
    trip_count INTEGER NOT NULL DEFAULT 0,
    total_amount DECIMAL(18,2) NOT NULL DEFAULT 0,
    branch_id VARCHAR REFERENCES branches(id),
    created_by VARCHAR NOT NULL DEFAULT 'Admin User',
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);
  CREATE INDEX IF NOT EXISTS idx_orders_order_date ON orders(order_date);
  CREATE INDEX IF NOT EXISTS idx_users_branch ON users(branch_id);
  CREATE INDEX IF NOT EXISTS idx_users_department ON users(department_id);
  CREATE INDEX IF NOT EXISTS idx_permissions_role ON permissions(role_id);
  CREATE INDEX IF NOT EXISTS idx_employment_contracts_employee ON employment_contracts(employee_id);
  CREATE INDEX IF NOT EXISTS idx_timesheets_employee ON timesheets(employee_id, work_date);
  CREATE INDEX IF NOT EXISTS idx_timesheets_shift ON timesheets(shift_id);
  CREATE INDEX IF NOT EXISTS idx_payrolls_employee ON payrolls(employee_id, pay_month);
  CREATE INDEX IF NOT EXISTS idx_areas_parent ON areas(parent_id);
  CREATE INDEX IF NOT EXISTS idx_departments_parent ON departments(parent_id);
  CREATE INDEX IF NOT EXISTS idx_departments_branch ON departments(branch_id);
  CREATE INDEX IF NOT EXISTS idx_teams_department ON teams(department_id);
  CREATE INDEX IF NOT EXISTS idx_teams_manager ON teams(manager_id);
  CREATE INDEX IF NOT EXISTS idx_locations_area ON locations(area_id);
  CREATE INDEX IF NOT EXISTS idx_locations_branch ON locations(branch_id);
  CREATE INDEX IF NOT EXISTS idx_containers_location ON containers(location_id);
  CREATE INDEX IF NOT EXISTS idx_containers_branch ON containers(branch_id);
  CREATE INDEX IF NOT EXISTS idx_trucks_driver ON trucks(driver_id);
  CREATE INDEX IF NOT EXISTS idx_trucks_branch ON trucks(branch_id);
  CREATE INDEX IF NOT EXISTS idx_trips_truck ON trips(truck_id);
  CREATE INDEX IF NOT EXISTS idx_trips_driver ON trips(driver_id);
  CREATE INDEX IF NOT EXISTS idx_trips_branch ON trips(branch_id);
  CREATE INDEX IF NOT EXISTS idx_orders_branch ON orders(branch_id);
  -- Workflow status is kept separately because DuckDB cannot update a parent
  -- row while foreign-key children reference it.
  CREATE TABLE IF NOT EXISTS order_workflow_states (
    order_id VARCHAR PRIMARY KEY REFERENCES orders(id),
    status VARCHAR NOT NULL CHECK (status IN ('Draft', 'Pending Approval', 'Approved', 'Cancelled')),
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE TABLE IF NOT EXISTS order_lines (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    order_id VARCHAR NOT NULL REFERENCES orders(id),
    sequence INTEGER NOT NULL DEFAULT 10,
    description VARCHAR NOT NULL,
    quantity DECIMAL(18,3) NOT NULL DEFAULT 1 CHECK (quantity > 0),
    unit VARCHAR NOT NULL DEFAULT 'Chuyến',
    unit_price DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (unit_price >= 0),
    tax_rate DECIMAL(5,2) NOT NULL DEFAULT 0 CHECK (tax_rate >= 0 AND tax_rate <= 100),
    line_total DECIMAL(18,2) NOT NULL DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(order_id, sequence)
  );
  CREATE INDEX IF NOT EXISTS idx_order_lines_order ON order_lines(order_id);

  CREATE TABLE IF NOT EXISTS master_data (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    kind VARCHAR NOT NULL CHECK (kind IN ('container_type', 'vehicle_type', 'unit', 'cargo_type', 'fee_type', 'currency')),
    code VARCHAR NOT NULL,
    name VARCHAR NOT NULL,
    description VARCHAR,
    symbol VARCHAR,
    decimals INTEGER,
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    sort_order INTEGER NOT NULL DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(kind, code)
  );

  CREATE TABLE IF NOT EXISTS currency_rates (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    currency_code VARCHAR NOT NULL UNIQUE,
    rate_to_vnd DECIMAL(18,6) NOT NULL CHECK (rate_to_vnd > 0),
    effective_date DATE NOT NULL DEFAULT CURRENT_DATE,
    source VARCHAR NOT NULL DEFAULT 'demo-config',
    synced_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_currency_rates_code ON currency_rates(currency_code);

  CREATE TABLE IF NOT EXISTS accounting_entries (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    kind VARCHAR NOT NULL CHECK (kind IN ('debit_note', 'payment_request', 'advance', 'settlement', 'invoice_template', 'ledger_account')),
    code VARCHAR NOT NULL,
    name VARCHAR NOT NULL,
    counterparty VARCHAR,
    amount DECIMAL(18,2) NOT NULL DEFAULT 0,
    currency VARCHAR NOT NULL DEFAULT 'VND',
    status VARCHAR NOT NULL DEFAULT 'Draft',
    document_date DATE,
    due_date DATE,
    description VARCHAR,
    branch_id VARCHAR,
    linked_advance_id VARCHAR,
    parent_id VARCHAR,
    sort_order INTEGER NOT NULL DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(kind, code)
  );
  CREATE INDEX IF NOT EXISTS idx_accounting_entries_branch ON accounting_entries(branch_id);
  CREATE INDEX IF NOT EXISTS idx_accounting_entries_linked_advance ON accounting_entries(linked_advance_id);
  CREATE INDEX IF NOT EXISTS idx_accounting_entries_parent ON accounting_entries(parent_id);
  CREATE TABLE IF NOT EXISTS accounting_entry_lines (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    -- Repository validates this mutable parent link; DuckDB rejects updates to
    -- a referenced parent row even when its primary key is unchanged.
    entry_id VARCHAR NOT NULL,
    sequence INTEGER NOT NULL DEFAULT 10,
    description VARCHAR NOT NULL,
    quantity DECIMAL(18,3) NOT NULL DEFAULT 1 CHECK (quantity > 0),
    unit VARCHAR NOT NULL DEFAULT 'Khoản',
    unit_price DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (unit_price >= 0),
    tax_rate DECIMAL(5,2) NOT NULL DEFAULT 0 CHECK (tax_rate >= 0 AND tax_rate <= 100),
    line_total DECIMAL(18,2) NOT NULL DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(entry_id, sequence)
  );
  CREATE INDEX IF NOT EXISTS idx_accounting_entry_lines_entry ON accounting_entry_lines(entry_id);

  CREATE TABLE IF NOT EXISTS system_configs (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    kind VARCHAR NOT NULL CHECK (kind IN ('code_rule', 'print_template', 'approval_flow', 'shipment_type', 'trip_status', 'fee_rule', 'storage', 'organization')),
    code VARCHAR NOT NULL, name VARCHAR NOT NULL, config_value VARCHAR, description VARCHAR,
    prefix VARCHAR, sequence_width INTEGER NOT NULL DEFAULT 4 CHECK (sequence_width BETWEEN 1 AND 12),
    reset_cadence VARCHAR NOT NULL DEFAULT 'never' CHECK (reset_cadence IN ('never', 'monthly', 'yearly')),
    next_sequence BIGINT NOT NULL DEFAULT 1 CHECK (next_sequence >= 1),
    status VARCHAR NOT NULL DEFAULT 'Active', sort_order INTEGER NOT NULL DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(kind, code)
  );
  CREATE TABLE IF NOT EXISTS approval_flow_steps (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    flow_id VARCHAR NOT NULL REFERENCES system_configs(id),
    sequence INTEGER NOT NULL,
    name VARCHAR NOT NULL,
    approver_role VARCHAR NOT NULL,
    min_amount DECIMAL(18,2) NOT NULL DEFAULT 0 CHECK (min_amount >= 0),
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(flow_id, sequence)
  );
  CREATE INDEX IF NOT EXISTS idx_approval_flow_steps_flow ON approval_flow_steps(flow_id, sequence);
  CREATE TABLE IF NOT EXISTS print_template_blocks (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    template_id VARCHAR NOT NULL REFERENCES system_configs(id),
    sequence INTEGER NOT NULL,
    block_type VARCHAR NOT NULL CHECK (block_type IN ('text', 'token', 'table', 'spacer')),
    label VARCHAR NOT NULL,
    token_key VARCHAR,
    content VARCHAR,
    status VARCHAR NOT NULL DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    UNIQUE(template_id, sequence)
  );
  CREATE INDEX IF NOT EXISTS idx_print_template_blocks_template ON print_template_blocks(template_id, sequence);
  CREATE TABLE IF NOT EXISTS system_activity (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    actor_id VARCHAR,
    actor_name VARCHAR NOT NULL,
    action VARCHAR NOT NULL,
    resource VARCHAR NOT NULL,
    resource_id VARCHAR,
    detail VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_system_activity_created_at ON system_activity(created_at);
  CREATE INDEX IF NOT EXISTS idx_system_activity_resource ON system_activity(resource, resource_id);

  CREATE TABLE IF NOT EXISTS maintenance (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    truck_id VARCHAR NOT NULL,
    service_type VARCHAR NOT NULL,
    status VARCHAR DEFAULT 'Scheduled',
    scheduled_date DATE NOT NULL,
    completed_date DATE,
    technician_id VARCHAR,
    cost DECIMAL(10,2),
    notes VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_maintenance_truck_date ON maintenance(truck_id, scheduled_date);
  CREATE INDEX IF NOT EXISTS idx_maintenance_technician ON maintenance(technician_id);

  CREATE TABLE IF NOT EXISTS notifications (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id VARCHAR NOT NULL,
    type VARCHAR NOT NULL,
    title VARCHAR NOT NULL,
    body VARCHAR,
    read BOOLEAN DEFAULT false,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_notifications_user_read_created ON notifications(user_id, read, created_at);

