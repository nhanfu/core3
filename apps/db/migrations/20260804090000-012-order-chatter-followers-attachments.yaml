up: |
  CREATE TABLE IF NOT EXISTS order_followers (
    order_id VARCHAR NOT NULL,
    user_id VARCHAR NOT NULL,
    added_by VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    PRIMARY KEY (order_id, user_id)
  );
  CREATE INDEX IF NOT EXISTS idx_order_followers_user ON order_followers(user_id, order_id);

  CREATE TABLE IF NOT EXISTS order_attachments (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
    order_id VARCHAR NOT NULL,
    file_name VARCHAR NOT NULL,
    mime_type VARCHAR,
    size_bytes BIGINT NOT NULL DEFAULT 0 CHECK (size_bytes >= 0),
    storage_key VARCHAR NOT NULL,
    uploaded_by VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_order_attachments_order ON order_attachments(order_id, created_at);

  INSERT INTO order_followers(order_id, user_id, added_by)
  SELECT o.id, u.id, u.id
  FROM orders o
  JOIN users u ON u.name = o.created_by
  ON CONFLICT(order_id, user_id) DO NOTHING;
down: |
  DROP TABLE IF EXISTS order_attachments;
  DROP TABLE IF EXISTS order_followers;
