# Application and module configuration consumed by the host.
# CORE3_ENV selects the database environment; paths can be overridden by env.
services:
  auth:
    database:
      driver: duckdb
      path:
        development: ${CORE3_DB_PATH:-:memory:}
        production: ${CORE3_DB_PATH:-./core3.duckdb}

  # Shared chat storage. This is intentionally independent of TMS storage so
  # other applications can use the same conversations and participants.
  chat:
    database:
      driver: duckdb
      path:
        development: ${CORE3_CHAT_DB_PATH:-./chat.duckdb}
        production: ${CORE3_CHAT_DB_PATH:-./chat.duckdb}

  # Shared durable event stream used by chat and future real-time features.
  event_store:
    database:
      driver: duckdb
      path:
        development: ${CORE3_EVENT_DB_PATH:-./events.duckdb}
        production: ${CORE3_EVENT_DB_PATH:-./events.duckdb}
    shard_count: ${CORE3_EVENT_SHARDS:-1}
    retention_ms: ${CORE3_EVENT_RETENTION_MS:-3600000}
    max_rows: ${CORE3_EVENT_MAX_ROWS:-1000}
    reader_connections: ${CORE3_EVENT_READER_CONNECTIONS:-2}

apps:
  - id: sales
    label: Sales
    description: Customers, leads, opportunities, and quotations
    icon: users
    route: /customers
    module: sales
    enabled: false
  - id: inventory
    label: Inventory
    description: Products, stock, warehouses, and movements
    icon: grid
    route: /inventory
    module: inventory
    enabled: false
  - id: purchase
    label: Purchase
    description: Vendors, purchase orders, and approvals
    icon: money
    route: /purchase
    module: purchase
    enabled: false
  - id: accounting
    label: Accounting
    description: Invoices, payments, and financial reporting
    icon: document
    route: /accounting
    module: accounting
    enabled: false
  - id: projects
    label: Projects
    description: Plans, tasks, milestones, and delivery
    icon: calendar
    route: /projects
    module: projects
    enabled: false
  - id: employees
    label: Employees
    description: People, time off, and workforce information
    icon: users
    route: /employees
    module: employees
    enabled: false
  - id: crm
    label: CRM
    description: Customer relationships and pipeline management
    icon: users
    route: /crm/dashboard
    module: crm
    enabled: false
  - id: tms
    label: TMS
    description: Fleet and transport management
    icon: truck
    route: /dashboard
    module: tms
    enabled: true
