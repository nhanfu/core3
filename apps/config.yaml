# Application and module configuration consumed by the host.
# CORE3_ENV selects the database environment; paths can be overridden by env.
services:
  auth:
    database:
      driver: duckdb
      path:
        development: ${AUTH_DB_PATH:-:memory:}
        production: ${AUTH_DB_PATH:-./auth.duckdb}
    organization:
      enabled: true
  tms:
    database:
      driver: duckdb
      path:
        development: ${TMS_DB_PATH:-:memory:}
        production: ${TMS_DB_PATH:-./tms.duckdb}

apps:
  - id: organization
    label: Organization & Access
    description: Companies, branches, users, roles, and permissions
    icon: users
    route: /org/own-company
    module: auth
    enabled: true
  - id: sales
    label: Sales
    description: Customers, leads, opportunities, and quotations
    icon: users
    route: /customers
    module: sales
    enabled: false
  - id: inventory
    label: Inventory
    description: Products, stock, warehouses, and movements
    icon: grid
    route: /inventory
    module: inventory
    enabled: false
  - id: purchase
    label: Purchase
    description: Vendors, purchase orders, and approvals
    icon: money
    route: /purchase
    module: purchase
    enabled: false
  - id: accounting
    label: Accounting
    description: Invoices, payments, and financial reporting
    icon: document
    route: /accounting
    module: accounting
    enabled: false
  - id: projects
    label: Projects
    description: Plans, tasks, milestones, and delivery
    icon: calendar
    route: /projects
    module: projects
    enabled: false
  - id: employees
    label: Employees
    description: People, time off, and workforce information
    icon: users
    route: /employees
    module: employees
    enabled: false
  - id: crm
    label: CRM
    description: Customer relationships and pipeline management
    icon: users
    route: /crm/dashboard
    module: crm
    enabled: false
  - id: tms
    label: TMS
    description: Fleet and transport management
    icon: truck
    route: /dashboard
    module: tms
    enabled: true
