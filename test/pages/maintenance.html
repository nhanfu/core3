<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Dashboard — TMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

<!-- ── Nav ── -->
<header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-14">
    <div class="flex items-center gap-6">
      <span class="font-bold text-indigo-600 text-lg">TMS</span>
      <nav class="flex gap-1 text-sm">
        <a href="truck-fleet.html"    class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Fleet</a>
        <a href="truck-detail.html"   class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Truck Detail</a>
        <a href="maintenance.html"    class="px-3 py-1 rounded-md bg-indigo-50 text-indigo-700 font-medium">Maintenance</a>
        <a href="../catalog/index.html" class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100">Catalog</a>
      </nav>
    </div>
    <div class="flex items-center gap-3 text-sm text-gray-500">
      <span>Admin User</span>
      <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold">AU</div>
    </div>
  </div>
</header>

<!-- ── Page header ── -->
<div class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Maintenance Dashboard</h1>
      <p class="text-sm text-gray-500 mt-0.5">Track scheduled and overdue service across the fleet</p>
    </div>
    <button onclick="alert('Schedule maintenance')" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm">
      + Schedule Service
    </button>
  </div>
</div>

<main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

  <!-- StatRow -->
  <div id="stat-row"></div>

  <!-- Progress bars -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div id="pb-health"></div>
    <div id="pb-inspect"></div>
    <div id="pb-oil"></div>
  </div>

  <!-- FilterBar -->
  <div id="filter-bar"></div>

  <!-- TabPanel with GridView per tab -->
  <div id="tab-panel"></div>

</main>

<script type="module">
import {
  StatRow, ProgressBar, FilterBar, TabPanel, GridView, ActionCell,
  TextCell, BadgeCell, CurrencyCell, DateCell, NumberCell,
} from '../lib/components.js';

// ─── Mock data ───────────────────────────────────────────────────────────────
const ALL_RECORDS = [
  // Overdue
  { id: 'MA001', plate: 'CA-102-DEF', model: 'Kenworth T680',        type: 'Oil Change',   dueDate: '2026-07-15', overdue: true,  technician: 'Alice Johnson', priority: 'High',     cost: 250,  status: 'Overdue' },
  { id: 'MA002', plate: 'IL-402-EFG', model: 'Western Star 5700',    type: 'Inspection',   dueDate: '2026-06-15', overdue: true,  technician: 'Bob Smith',    priority: 'Critical', cost: 400,  status: 'Overdue' },
  { id: 'MA003', plate: 'TX-202-MNO', model: 'International LT',     type: 'Brake Service',dueDate: '2026-07-01', overdue: true,  technician: 'Mike Brown',   priority: 'High',     cost: 850,  status: 'Overdue' },
  // Due this week (2026-07-25 is today)
  { id: 'MA004', plate: 'IL-401-STU', model: 'Mack Anthem',           type: 'Oil Change',   dueDate: '2026-07-28', overdue: false, technician: 'Alice Johnson', priority: 'Medium',   cost: 250,  status: 'Scheduled' },
  { id: 'MA005', plate: 'CA-101-ABC', model: 'Freightliner Cascadia', type: 'Inspection',   dueDate: '2026-07-30', overdue: false, technician: 'Bob Smith',    priority: 'Low',      cost: 175,  status: 'Scheduled' },
  { id: 'MA006', plate: 'CA-104-YZA', model: 'Kenworth T880',         type: 'Tire Rotation',dueDate: '2026-07-29', overdue: false, technician: 'Mike Brown',   priority: 'Low',      cost: 120,  status: 'Scheduled' },
  { id: 'MA007', plate: 'WA-502-HIJ', model: 'Peterbilt 567',          type: 'Oil Change',   dueDate: '2026-07-27', overdue: false, technician: 'Alice Johnson', priority: 'Medium',   cost: 250,  status: 'Scheduled' },
  { id: 'MA008', plate: 'FL-302-BCD', model: 'Freightliner M2',       type: 'Brake Check',  dueDate: '2026-07-26', overdue: false, technician: 'Bob Smith',    priority: 'High',     cost: 600,  status: 'Scheduled' },
  // Upcoming (next month)
  { id: 'MA009', plate: 'CA-103-PQR', model: 'Ford Transit',           type: 'Oil Change',   dueDate: '2026-08-05', overdue: false, technician: 'Alice Johnson', priority: 'Low',      cost: 150,  status: 'Scheduled' },
  { id: 'MA010', plate: 'TX-201-GHI', model: 'Peterbilt 579',           type: 'Inspection',   dueDate: '2026-08-10', overdue: false, technician: 'Bob Smith',    priority: 'Medium',   cost: 175,  status: 'Scheduled' },
  { id: 'MA011', plate: 'CA-102-DEF', model: 'Kenworth T680',          type: 'Brake Service',dueDate: '2026-08-15', overdue: false, technician: 'Mike Brown',   priority: 'High',     cost: 850,  status: 'Scheduled' },
  { id: 'MA012', plate: 'FL-301-JKL', model: 'Isuzu NPR',              type: 'Inspection',   dueDate: '2026-08-20', overdue: false, technician: 'Alice Johnson', priority: 'Low',      cost: 175,  status: 'Scheduled' },
  { id: 'MA013', plate: 'WA-501-VWX', model: 'Volvo VNL',               type: 'Oil Change',   dueDate: '2026-08-08', overdue: false, technician: 'Bob Smith',    priority: 'Medium',   cost: 250,  status: 'Scheduled' },
  // Completed this month
  { id: 'MA014', plate: 'CA-101-ABC', model: 'Freightliner Cascadia', type: 'Oil Change',   dueDate: '2026-07-01', overdue: false, technician: 'Bob Smith',    priority: 'Medium',   cost: 250,  status: 'Completed' },
  { id: 'MA015', plate: 'WA-502-HIJ', model: 'Peterbilt 567',          type: 'Inspection',   dueDate: '2026-07-03', overdue: false, technician: 'Alice Johnson', priority: 'Low',      cost: 175,  status: 'Completed' },
  { id: 'MA016', plate: 'TX-201-GHI', model: 'Peterbilt 579',           type: 'Tire Rotation',dueDate: '2026-07-07', overdue: false, technician: 'Mike Brown',   priority: 'Low',      cost: 120,  status: 'Completed' },
  { id: 'MA017', plate: 'CA-103-PQR', model: 'Ford Transit',            type: 'Oil Change',   dueDate: '2026-07-10', overdue: false, technician: 'Alice Johnson', priority: 'Medium',   cost: 150,  status: 'Completed' },
  { id: 'MA018', plate: 'FL-301-JKL', model: 'Isuzu NPR',               type: 'Brake Check',  dueDate: '2026-07-05', overdue: false, technician: 'Bob Smith',    priority: 'Low',      cost: 300,  status: 'Completed' },
  { id: 'MA019', plate: 'IL-401-STU', model: 'Mack Anthem',              type: 'Inspection',   dueDate: '2026-07-08', overdue: false, technician: 'Mike Brown',   priority: 'Medium',   cost: 175,  status: 'Completed' },
  { id: 'MA020', plate: 'FL-302-BCD', model: 'Freightliner M2',         type: 'Oil Change',   dueDate: '2026-07-12', overdue: false, technician: 'Alice Johnson', priority: 'Low',      cost: 150,  status: 'Completed' },
  { id: 'MA021', plate: 'CA-104-YZA', model: 'Kenworth T880',           type: 'Brake Service',dueDate: '2026-07-15', overdue: false, technician: 'Bob Smith',    priority: 'Medium',   cost: 850,  status: 'Completed' },
  { id: 'MA022', plate: 'WA-501-VWX', model: 'Volvo VNL',               type: 'Tire Rotation',dueDate: '2026-07-18', overdue: false, technician: 'Mike Brown',   priority: 'Low',      cost: 120,  status: 'Completed' },
];

const overdue    = ALL_RECORDS.filter(r => r.status === 'Overdue');
const thisWeek   = ALL_RECORDS.filter(r => r.status === 'Scheduled' && !r.overdue && ['MA004','MA005','MA006','MA007','MA008'].includes(r.id));
const scheduled  = ALL_RECORDS.filter(r => r.status === 'Scheduled');
const completed  = ALL_RECORDS.filter(r => r.status === 'Completed');

// ─── Column definitions ──────────────────────────────────────────────────────
const MAINT_DEFS = [
  { type: 'TextCell',   id: 'plate',      field: 'plate',      label: 'Truck',      secondary: 'model' },
  { type: 'BadgeCell',  id: 'type',       field: 'type',       label: 'Service Type' },
  { type: 'DateCell',   id: 'dueDate',    field: 'dueDate',    label: 'Due Date',   format: 'short', overdueField: 'overdue' },
  { type: 'TextCell',   id: 'tech',       field: 'technician', label: 'Technician' },
  { type: 'BadgeCell',  id: 'priority',   field: 'priority',   label: 'Priority' },
  { type: 'CurrencyCell', id: 'cost',     field: 'cost',       label: 'Est. Cost',  align: 'right' },
  { type: 'ActionCell', id: 'actions',    field: '',           label: '',
    actions: [
      { id: 'done',       label: 'Mark Done' },
      { id: 'reschedule', label: 'Reschedule', variant: 'ghost' },
    ]},
];

const COMPLETED_DEFS = [
  { type: 'TextCell',     id: 'plate',   field: 'plate',      label: 'Truck',    secondary: 'model' },
  { type: 'BadgeCell',    id: 'type',    field: 'type',       label: 'Service' },
  { type: 'DateCell',     id: 'dueDate', field: 'dueDate',    label: 'Date',     format: 'short' },
  { type: 'TextCell',     id: 'tech',    field: 'technician', label: 'Technician' },
  { type: 'BadgeCell',    id: 'status',  field: 'status',     label: 'Status' },
  { type: 'CurrencyCell', id: 'cost',    field: 'cost',       label: 'Cost',     align: 'right' },
];

// ─── Action handler ───────────────────────────────────────────────────────────
function makeGridActions(grid) {
  grid._onAction = (action, params) => {
    const row = params.row;
    if (action === 'done')       alert(`✓ Marked as done: ${row.type} for ${row.plate}`);
    else if (action === 'reschedule') alert(`↗ Reschedule: ${row.type} for ${row.plate}`);
  };
}

// ─── Filter state ─────────────────────────────────────────────────────────────
let activeFilters = { type: '', technician: '' };

function applyFilters(rows) {
  return rows.filter(r =>
    (!activeFilters.type      || r.type       === activeFilters.type) &&
    (!activeFilters.technician || r.technician === activeFilters.technician)
  );
}

// ─── StatRow ─────────────────────────────────────────────────────────────────
new StatRow('maint-stats', [
  { label: 'Overdue',          value: overdue.length,   color: 'red' },
  { label: 'Due This Week',    value: thisWeek.length,  color: 'amber' },
  { label: 'Scheduled',        value: scheduled.length, color: 'indigo' },
  { label: 'Completed (Jul)', value: completed.length, color: 'green' },
]).mount(document.getElementById('stat-row'));

// ─── Progress bars ────────────────────────────────────────────────────────────
new ProgressBar('pb1', { label: 'Fleet Health',            value: 74, max: 100, color: 'green' }).mount(document.getElementById('pb-health'));
new ProgressBar('pb2', { label: 'Inspection Compliance',   value: 91, max: 100, color: 'teal' }).mount(document.getElementById('pb-inspect'));
new ProgressBar('pb3', { label: 'Oil Change On-Time',      value: 60, max: 100, color: 'amber' }).mount(document.getElementById('pb-oil'));

// ─── FilterBar ────────────────────────────────────────────────────────────────
const technicians = [...new Set(ALL_RECORDS.map(r => r.technician))];
const serviceTypes = [...new Set(ALL_RECORDS.map(r => r.type))];

const filterBar = new FilterBar('maint-filter', { values: {} }, [
  { field: 'type',       label: 'Service Type', type: 'select',   options: serviceTypes },
  { field: 'technician', label: 'Technician',   type: 'select',   options: technicians },
  { field: 'dateRange',  label: 'Date Range',   type: 'date-range' },
]);
filterBar._onAction = (action, params) => {
  activeFilters = {
    type:       (params.values && params.values.type)       || '',
    technician: (params.values && params.values.technician) || '',
  };
  tabPanel.setState({ active: tabPanel.state.active }); // re-render current tab
};
filterBar.mount(document.getElementById('filter-bar'));

// ─── TabPanel + GridViews ─────────────────────────────────────────────────────
const tabPanel = new TabPanel('maint-tabs', { active: 0 }, [
  {
    label: `All (${ALL_RECORDS.length})`,
    render(el) {
      const rows = applyFilters(ALL_RECORDS);
      const g = new GridView('g-all', { rows, meta: { total: rows.length, page: 1, pageSize: 15 } }, MAINT_DEFS);
      makeGridActions(g); g.mount(el);
    },
  },
  {
    label: `Overdue (${overdue.length})`,
    render(el) {
      const rows = applyFilters(overdue);
      const g = new GridView('g-over', { rows, meta: { total: rows.length, page: 1, pageSize: 15 } }, MAINT_DEFS);
      makeGridActions(g); g.mount(el);
    },
  },
  {
    label: `This Week (${thisWeek.length})`,
    render(el) {
      const rows = applyFilters(thisWeek);
      const g = new GridView('g-week', { rows, meta: { total: rows.length, page: 1, pageSize: 15 } }, MAINT_DEFS);
      makeGridActions(g); g.mount(el);
    },
  },
  {
    label: `Completed (${completed.length})`,
    render(el) {
      const rows = applyFilters(completed);
      new GridView('g-done', { rows, meta: { total: rows.length, page: 1, pageSize: 15 } }, COMPLETED_DEFS).mount(el);
    },
  },
]);
tabPanel.mount(document.getElementById('tab-panel'));
</script>
</body>
</html>
