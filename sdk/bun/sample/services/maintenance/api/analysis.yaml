page: { id: maintenance-analysis }
datasources:
  - id: maintenance_analysis_totals
    single: true
    permission: maintenance.read
    query: "SELECT COUNT(*) AS request_count, COUNT(*) FILTER (WHERE state IN ('New Request', 'In Progress')) AS open_count, COUNT(*) FILTER (WHERE state = 'Repaired') AS repaired_count, COUNT(*) FILTER (WHERE state = 'Scrap') AS scrap_count, CAST(COALESCE(AVG(CASE WHEN scheduled_date IS NOT NULL THEN 1.0 ELSE 0.0 END), 0) AS DOUBLE) AS average_duration FROM maintenance_requests WHERE (:active IS NULL OR (:active = 'active' AND archived = FALSE) OR (:active = 'archived' AND archived = TRUE))"
  - id: maintenance_analysis_states
    single: false
    permission: maintenance.read
    query: "SELECT state AS category, COUNT(*) AS request_count FROM maintenance_requests WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:active IS NULL OR (:active = 'active' AND archived = FALSE) OR (:active = 'archived' AND archived = TRUE)) AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR equipment_name ILIKE '%' || :q || '%') GROUP BY state ORDER BY request_count DESC, state"
  - id: maintenance_analysis_requests
    single: false
    permission: maintenance.read
    pivot: { fields: [id, name, equipment_name, category, team, assigned_to, state, priority, request_date, duration, repeat_interval, record_count] }
    query: "SELECT id, name, equipment_name, category, team, COALESCE(NULLIF(assigned_to, ''), 'Unassigned') AS assigned_to, state, priority, CAST(request_date AS VARCHAR) AS request_date, COALESCE(duration, 0.0) AS duration, COALESCE(TRY_CAST(split_part(recurrence, ' ', 2) AS INTEGER), 1) AS repeat_interval, 1 AS record_count FROM maintenance_requests WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:active IS NULL OR (:active = 'active' AND archived = FALSE) OR (:active = 'archived' AND archived = TRUE)) AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR equipment_name ILIKE '%' || :q || '%' OR category ILIKE '%' || :q || '%') ORDER BY request_date DESC, name"
