page: { id: maintenance-requests }
datasources:
  - { id: maintenance_request_states, single: false, permission: maintenance.read, query: "SELECT id AS value, name AS label FROM maintenance_stages WHERE active = TRUE ORDER BY sequence" }
  - { id: maintenance_equipment_lookup, single: false, permission: maintenance.read, query: "SELECT id AS value, name AS label FROM maintenance_equipment WHERE archived = FALSE ORDER BY name" }
  - { id: maintenance_request_category_lookup, single: false, permission: maintenance.read, query: "SELECT id AS value, name AS label FROM maintenance_category_records WHERE active = TRUE ORDER BY name" }
  - id: maintenance_requests
    single: false
    permission: maintenance.read
    error_states: { transport_error: { status: 503, code: MAINTENANCE_REQUESTS_UNAVAILABLE, message: Maintenance requests are temporarily unavailable. } }
    workflow: maintenance_requests
    query: "SELECT r.id, r.row_version, r.name, r.equipment_id, r.equipment_name, r.category, r.category_id, r.team, r.request_type, r.description, r.priority, r.assigned_to, r.owner, r.stage, r.state, r.kanban_state, CAST(r.request_date AS VARCHAR) AS request_date, CAST(r.scheduled_date AS VARCHAR) AS scheduled_date, CAST(r.completed_date AS VARCHAR) AS completed_date, r.archived FROM maintenance_requests r WHERE CASE WHEN COALESCE(:fixture_state, '') = 'empty' THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR r.name ILIKE '%' || :q || '%' OR r.equipment_name ILIKE '%' || :q || '%' OR r.category ILIKE '%' || :q || '%' OR r.assigned_to ILIKE '%' || :q || '%') AND (:equipment_id IS NULL OR r.equipment_id = :equipment_id) AND (:category_id IS NULL OR r.category_id = :category_id) AND (:state IS NULL OR r.state = :state) AND (:priority IS NULL OR r.priority = :priority) AND (:archived IS NULL OR (:archived = 'active' AND r.archived = FALSE) OR (:archived = 'archived' AND r.archived = TRUE)) ORDER BY r.request_date DESC, r.name"
actions:
  - id: create_maintenance_request
    type: server_form
    permission: maintenance.write
    title: New maintenance request
    action: maintenance.requests.create
    handler: yaml_mutation
    operation: create
    refresh: [maintenance_requests]
    mutation: { operation: insert, table: maintenance_requests, fields: [name, equipment_id, equipment_name, category, team, request_type, description, instructions, priority, assigned_to, owner, request_date, scheduled_date, recurrence], required: [name, equipment_id, equipment_name, description], result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" } }
    fields:
      - { field: name, label: Request, type: text, required: true }
      - { field: equipment_id, label: Equipment, type: select, options_source: maintenance_equipment_lookup, required: true }
      - { field: equipment_name, label: Equipment name, type: text, required: true }
      - { field: request_type, label: Type, type: select, options: [{ value: Corrective, label: Corrective }, { value: Preventive, label: Preventive }], required: true }
      - { field: description, label: Description, type: text, required: true }
      - { field: priority, label: Priority, type: select, options: [Low, Normal, High], required: true }
      - { field: assigned_to, label: Assigned to, type: text }
      - { field: scheduled_date, label: Scheduled date, type: text }
      - { field: recurrence, label: Recurrence, type: text }
  - { id: assign_maintenance_request, type: server, permission: maintenance.write, action: maintenance.requests.assign, handler: order_transition, workflow: maintenance_requests, operation: assign, refresh: [maintenance_requests] }
  - { id: start_maintenance_request, type: server, permission: maintenance.write, action: maintenance.requests.start, handler: order_transition, workflow: maintenance_requests, operation: start, refresh: [maintenance_requests] }
  - { id: repair_maintenance_request, type: server, permission: maintenance.write, action: maintenance.requests.repair, handler: order_transition, workflow: maintenance_requests, operation: repair, refresh: [maintenance_requests] }
  - { id: cancel_maintenance_request, type: server, permission: maintenance.write, action: maintenance.requests.cancel, handler: order_transition, workflow: maintenance_requests, operation: cancel, refresh: [maintenance_requests] }
  - id: archive_maintenance_request
    type: server
    permission: maintenance.write
    action: maintenance.requests.archive
    handler: yaml_mutation
    operation: update
    refresh: [maintenance_requests]
    params: { values: { archived: true } }
    mutation:
      operation: update
      table: maintenance_requests
      fields: [archived]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Maintenance request was not found. }
      result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
  - id: reopen_maintenance_request
    type: server
    permission: maintenance.write
    action: maintenance.requests.reopen
    handler: yaml_mutation
    operation: update
    refresh: [maintenance_requests]
    params: { values: { archived: false } }
    mutation:
      operation: update
      table: maintenance_requests
      fields: [archived]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Maintenance request was not found. }
      result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
