page: { id: maintenance-request-detail }
datasources:
  - { id: maintenance_request_detail, single: true, permission: maintenance.read, query: "SELECT id, row_version, name, equipment_name, category, team, request_type, description, COALESCE(instruction_text, instructions) AS instructions, COALESCE(instruction_type, 'text') AS instruction_type, instruction_text, instruction_google_slide, instruction_pdf_file_name, instruction_pdf_mime_type, instruction_pdf_size_bytes, priority, assigned_to, owner, state, stage, kanban_state, archived, CAST(request_date AS VARCHAR) AS request_date, CAST(scheduled_date AS VARCHAR) AS scheduled_date, CAST(scheduled_end AS VARCHAR) AS scheduled_end, duration, CAST(completed_date AS VARCHAR) AS completed_date, recurrence, recurrence_parent_id, recurrence_sequence, recurrence_generated_id FROM maintenance_requests WHERE id = :id" }
  - id: maintenance_request_instruction_pdf
    permission: maintenance.read
    query: "SELECT id, id AS request_id, instruction_pdf_file_name AS file_name, instruction_pdf_mime_type AS mime_type, instruction_pdf_size_bytes AS size_bytes, instruction_pdf_uploaded_by AS uploaded_by, CAST(instruction_pdf_updated_at AS VARCHAR) AS created_at FROM maintenance_requests WHERE id = :id AND instruction_type = 'pdf' AND instruction_pdf_file_name IS NOT NULL"
  - id: maintenance_request_activity
    single: false
    permission: maintenance.read
    error_states: { transport_error: { status: 503, code: MAINTENANCE_REQUEST_CHATTER_UNAVAILABLE, message: Maintenance request messages are temporarily unavailable. } }
    query: "SELECT id, request_id, row_version, activity_type, summary, CAST(due_date AS VARCHAR) AS due_date, assigned_to, state, CAST(completed_at AS VARCHAR) AS completed_at, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM (SELECT id, request_id, row_version, CAST(NULL AS VARCHAR) AS activity_type, CAST(NULL AS VARCHAR) AS summary, CAST(NULL AS DATE) AS due_date, CAST(NULL AS VARCHAR) AS assigned_to, 'done' AS state, CAST(NULL AS TIMESTAMP) AS completed_at, actor_name, action, action_label, detail, created_at FROM maintenance_request_messages WHERE request_id = :id UNION ALL SELECT id, request_id, row_version, activity_type, summary, due_date, assigned_to, state, completed_at, actor_name, action, action_label, detail, created_at FROM maintenance_request_activities WHERE request_id = :id) timeline ORDER BY due_date NULLS LAST, created_at DESC, id"
actions:
  - id: upload_maintenance_request_instruction_pdf
    type: upload
    action: maintenance.requests.instructions.pdf.upload
    handler: attachment_metadata
    permission: maintenance.write
    kind: maintenance_request_instruction_pdf
    params: { id: '{state.maintenance_request_detail.id}', expected_row_version: '{state.maintenance_request_detail.row_version}' }
    refresh: [maintenance_request_detail, maintenance_request_instruction_pdf]
    mutation:
      guards:
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND archived = FALSE", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Active maintenance request was not found. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Maintenance request changed before the PDF instruction could be uploaded. }
        - { query: "SELECT 1 AS ok WHERE LOWER(TRIM(CAST(:mimeType AS VARCHAR))) = 'application/pdf' AND LOWER(TRIM(CAST(:fileName AS VARCHAR))) LIKE '%.pdf' AND LENGTH(TRIM(CAST(:fileName AS VARCHAR))) BETWEEN 1 AND 255 AND CAST(:sizeBytes AS BIGINT) > 0 AND CAST(:sizeBytes AS BIGINT) <= 10485760", status: 422, code: MAINTENANCE_INSTRUCTION_PDF_INVALID, message: Upload a non-empty PDF instruction up to 10 MB. }
      steps:
        - { query: "UPDATE maintenance_requests SET instruction_type = 'pdf', instruction_pdf_file_name = TRIM(CAST(:fileName AS VARCHAR)), instruction_pdf_mime_type = LOWER(TRIM(CAST(:mimeType AS VARCHAR))), instruction_pdf_size_bytes = CAST(:sizeBytes AS BIGINT), instruction_pdf_storage_key = :storageKey, instruction_pdf_uploaded_by = :current_user_id, instruction_pdf_updated_at = TIMESTAMP '2026-01-15 12:00:00', row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 12:00:00' WHERE id = :id AND archived = FALSE AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: Maintenance request changed before the PDF instruction could be uploaded. }
      result: { query: "SELECT id, row_version, instruction_type, instruction_pdf_file_name AS file_name, instruction_pdf_mime_type AS mime_type, instruction_pdf_size_bytes AS size_bytes, instruction_pdf_storage_key AS storage_key FROM maintenance_requests WHERE id = :id" }
  - id: download_maintenance_request_instruction_pdf
    type: download
    permission: maintenance.read
    kind: maintenance_request_instruction_pdf
  - id: send_maintenance_request_message
    type: server_form
    permission: maintenance.write
    title: Send message
    action: maintenance.requests.chatter.message
    handler: order_chatter
    operation: message
    params: { id: '{state.maintenance_request_detail.id}', expected_row_version: '{state.maintenance_request_detail.row_version}' }
    refresh: [maintenance_request_detail, maintenance_request_activity]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      before_steps:
        - { query: "SELECT 'maintenance-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM maintenance_request_messages WHERE request_id = :id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: MAINTENANCE_MESSAGE_ACTOR_REQUIRED, message: An authenticated Maintenance actor is required to send a message. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Maintenance request was not found. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND archived = FALSE AND row_version = :expected_row_version", status: 409, code: MAINTENANCE_MESSAGE_PARENT_CHANGED, message: This maintenance request changed or was cancelled. Reload before sending a message. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: MAINTENANCE_MESSAGE_CONTENT_INVALID, message: Message content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO maintenance_request_messages(id, request_id, row_version, actor_id, actor_name, action, action_label, detail, created_at) VALUES(:message_id, :id, 1, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Maintenance User'), 'maintenance.requests.chatter.message', 'Message', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-01-15 11:00:00')", expect_changed: true, status: 409, code: MAINTENANCE_MESSAGE_NOT_CREATED, message: The maintenance request message could not be sent. }
        - { query: "UPDATE maintenance_requests SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 11:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: MAINTENANCE_MESSAGE_PARENT_CHANGED, message: The maintenance request changed while sending the message. Reload before retrying. }
      result: { query: "SELECT * FROM maintenance_request_messages WHERE id = :message_id" }
  - id: log_maintenance_request_note
    type: server_form
    permission: maintenance.write
    title: Log note
    action: maintenance.requests.chatter.note
    handler: order_chatter
    operation: note
    params: { id: '{state.maintenance_request_detail.id}', expected_row_version: '{state.maintenance_request_detail.row_version}' }
    refresh: [maintenance_request_detail, maintenance_request_activity]
    fields: [{ field: content, label: Note, type: textarea, required: true }]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      before_steps:
        - { query: "SELECT 'maintenance-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM maintenance_request_messages WHERE request_id = :id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: MAINTENANCE_NOTE_ACTOR_REQUIRED, message: An authenticated Maintenance actor is required to log a note. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Maintenance request was not found. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND archived = FALSE AND row_version = :expected_row_version", status: 409, code: MAINTENANCE_NOTE_PARENT_CHANGED, message: This maintenance request changed or was cancelled. Reload before logging a note. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: MAINTENANCE_NOTE_CONTENT_INVALID, message: Note content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO maintenance_request_messages(id, request_id, row_version, actor_id, actor_name, action, action_label, detail, created_at) VALUES(:message_id, :id, 1, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Maintenance User'), 'maintenance.requests.chatter.note', 'Internal note', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-01-15 11:00:00')", expect_changed: true, status: 409, code: MAINTENANCE_NOTE_NOT_CREATED, message: The maintenance request note could not be logged. }
        - { query: "UPDATE maintenance_requests SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 11:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: MAINTENANCE_NOTE_PARENT_CHANGED, message: The maintenance request changed while logging the note. Reload before retrying. }
      result: { query: "SELECT * FROM maintenance_request_messages WHERE id = :message_id" }
  - id: schedule_maintenance_request_activity
    type: server_form
    permission: maintenance.write
    title: Schedule activity
    action: maintenance.requests.activity.schedule
    handler: yaml_mutation
    operation: create
    params: { request_id: '{row.id}' }
    refresh: [maintenance_request_activity, maintenance_request_detail]
    mutation:
      operation: insert
      table: maintenance_request_activities
      fields: [request_id, activity_type, summary, due_date, assigned_to, actor_name, action, action_label, detail]
      required: [request_id, activity_type, summary]
      defaults: { state: planned, actor_name: Maintenance User, action: maintenance.requests.activity.scheduled, action_label: Activity scheduled, created_at: '2026-01-15 09:00:00', updated_at: '2026-01-15 09:00:00' }
      before_steps: [{ query: "SELECT 'maintenance-activity-' || CAST(:request_id AS VARCHAR) || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS id FROM maintenance_request_activities WHERE request_id = :request_id", assign: true }]
      generated: [id]
      guards:
        - { query: "SELECT id FROM maintenance_requests WHERE id = :request_id AND archived = FALSE", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Active maintenance request was not found. }
        - { query: "SELECT 1 AS ok WHERE CAST(:activity_type AS VARCHAR) IN ('todo', 'email', 'call', 'meeting', 'document')", status: 422, code: MAINTENANCE_ACTIVITY_TYPE_INVALID, message: Choose a valid activity type. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:summary AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: MAINTENANCE_ACTIVITY_SUMMARY_REQUIRED, message: Activity summary is required. }
        - { query: "SELECT 1 AS ok WHERE :due_date IS NULL OR LENGTH(TRIM(CAST(:due_date AS VARCHAR))) = 0 OR TRY_CAST(:due_date AS DATE) IS NOT NULL", status: 422, code: MAINTENANCE_ACTIVITY_DATE_INVALID, message: Due date must be a valid ISO date. }
      result: { query: "SELECT * FROM maintenance_request_activities WHERE id = :id" }
    fields:
      - { field: activity_type, label: Activity type, type: select, options: [{ value: todo, label: To-Do }, { value: email, label: Email }, { value: call, label: Call }, { value: meeting, label: Meeting }, { value: document, label: Document }], required: true }
      - { field: summary, label: Summary, type: text, required: true }
      - { field: due_date, label: Due date, type: text }
      - { field: assigned_to, label: Assigned to, type: text }
  - id: complete_maintenance_request_activity
    type: server
    permission: maintenance.write
    action: maintenance.requests.activity.complete
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', values: { state: done, completed_at: '2026-01-15 10:00:00', action: maintenance.requests.activity.completed, action_label: Activity completed, detail: Completed from the Maintenance request. } }
    refresh: [maintenance_request_activity, maintenance_request_detail]
    mutation:
      operation: update
      table: maintenance_request_activities
      fields: [state, completed_at, action, action_label, detail]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM maintenance_request_activities WHERE id = :id AND state = 'planned'", status: 404, code: MAINTENANCE_ACTIVITY_NOT_FOUND, message: Planned activity was not found. }
      result: { query: "SELECT * FROM maintenance_request_activities WHERE id = :id" }
  - id: update_maintenance_request_kanban_state
    type: server_form
    permission: maintenance.write
    title: Update kanban state
    action: maintenance.requests.kanban_state.update
    handler: yaml_mutation
    operation: update
    prefill: state.maintenance_request_detail
    refresh: [maintenance_request_detail, maintenance_requests]
    mutation:
      operation: update
      table: maintenance_requests
      fields: [kanban_state]
      required: [kanban_state]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Maintenance request was not found. }
        - { query: "SELECT 1 AS ok WHERE CAST(:kanban_state AS VARCHAR) IN ('normal', 'blocked', 'done')", status: 422, code: MAINTENANCE_REQUEST_KANBAN_STATE_INVALID, message: Choose In Progress, Blocked, or Ready for next stage. }
      result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
    fields: [{ field: kanban_state, label: Kanban state, type: select, options: [{ value: normal, label: In Progress }, { value: blocked, label: Blocked }, { value: done, label: Ready for next stage }], required: true }]
  - id: edit_maintenance_request_detail
    type: server_form
    permission: maintenance.write
    title: Edit maintenance request
    action: maintenance.requests.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    prefill: state.maintenance_request_detail
    refresh: [maintenance_request_detail, maintenance_requests]
    mutation:
      operation: update
      table: maintenance_requests
      key: id
      fields: [name, request_type, description, instructions, priority, assigned_to, scheduled_date, scheduled_end, duration, recurrence]
      required: [name, description]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND archived = FALSE", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Active maintenance request was not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:description AS VARCHAR))) > 0", status: 422, code: MAINTENANCE_REQUEST_REQUIRED, message: Request and description are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM maintenance_requests WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: MAINTENANCE_REQUEST_NAME_EXISTS, message: A maintenance request with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE :scheduled_date IS NULL OR LENGTH(TRIM(CAST(:scheduled_date AS VARCHAR))) = 0 OR TRY_CAST(:scheduled_date AS DATE) IS NOT NULL", status: 422, code: MAINTENANCE_REQUEST_SCHEDULED_DATE_INVALID, message: Scheduled date must be a valid ISO date. }
        - { query: "SELECT 1 AS ok WHERE :scheduled_end IS NULL OR LENGTH(TRIM(CAST(:scheduled_end AS VARCHAR))) = 0 OR TRY_CAST(:scheduled_end AS TIMESTAMP) IS NOT NULL", status: 422, code: MAINTENANCE_REQUEST_SCHEDULED_END_INVALID, message: Scheduled end must be a valid ISO date or timestamp. }
        - { query: "SELECT 1 AS ok WHERE :scheduled_date IS NULL OR LENGTH(TRIM(CAST(:scheduled_date AS VARCHAR))) = 0 OR :scheduled_end IS NULL OR LENGTH(TRIM(CAST(:scheduled_end AS VARCHAR))) = 0 OR TRY_CAST(:scheduled_end AS TIMESTAMP) >= TRY_CAST(:scheduled_date AS TIMESTAMP)", status: 422, code: MAINTENANCE_REQUEST_SCHEDULE_WINDOW_INVALID, message: Scheduled end cannot be earlier than scheduled date. }
        - { query: "SELECT CASE WHEN :scheduled_date IS NULL OR LENGTH(TRIM(CAST(:scheduled_date AS VARCHAR))) = 0 THEN NULL ELSE COALESCE(TRY_CAST(:scheduled_end AS TIMESTAMP), TRY_CAST(:scheduled_date AS TIMESTAMP) + INTERVAL '1 hour') END AS scheduled_end, CASE WHEN :scheduled_date IS NULL OR LENGTH(TRIM(CAST(:scheduled_date AS VARCHAR))) = 0 THEN 0.0 ELSE EXTRACT(EPOCH FROM (COALESCE(TRY_CAST(:scheduled_end AS TIMESTAMP), TRY_CAST(:scheduled_date AS TIMESTAMP) + INTERVAL '1 hour') - TRY_CAST(:scheduled_date AS TIMESTAMP))) / 3600.0 END AS duration", status: 500, code: MAINTENANCE_REQUEST_SCHEDULE_WINDOW_COMPUTE_FAILED, message: The maintenance schedule window could not be calculated., assign: true }
      result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
    fields:
      - { field: name, label: Request, type: text, required: true }
      - { field: request_type, label: Type, type: select, options: [{ value: Corrective, label: Corrective }, { value: Preventive, label: Preventive }], required: true }
      - { field: description, label: Description, type: textarea, required: true }
      - { field: instructions, label: Instructions, type: textarea }
      - { field: priority, label: Priority, type: select, options: [Low, Normal, High], required: true }
      - { field: assigned_to, label: Assigned to, type: text }
      - { field: scheduled_date, label: Scheduled date, type: text }
      - { field: scheduled_end, label: Scheduled end, type: text }
      - { field: recurrence, label: Recurrence, type: text }
  - id: update_maintenance_request_instructions
    type: server_form
    permission: maintenance.write
    title: Edit instructions
    action: maintenance.requests.instructions.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.maintenance_request_detail.id}' }
    prefill: state.maintenance_request_detail
    refresh: [maintenance_request_detail, maintenance_requests]
    fields:
      - { field: instruction_type, label: Instruction type, type: select, options: [{ value: text, label: Text }, { value: google_slide, label: Google Slide }, { value: pdf, label: PDF }], required: true }
      - { field: instruction_text, label: Instructions, type: textarea, required: true, show_if: "instruction_type === 'text'" }
      - { field: instruction_google_slide, label: Google Slide link, type: text, required: true, show_if: "instruction_type === 'google_slide'" }
      - { field: instruction_pdf_file_name, label: PDF instruction, type: text, readonly: true, show_if: "instruction_type === 'pdf'" }
    mutation:
      operation: update
      table: maintenance_requests
      key: id
      fields: [instruction_type, instruction_text, instruction_google_slide]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND archived = FALSE", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Active maintenance request was not found. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Maintenance request changed before instructions could be saved. }
        - { query: "SELECT 1 AS ok WHERE CAST(:instruction_type AS VARCHAR) IN ('text', 'google_slide', 'pdf')", status: 422, code: MAINTENANCE_INSTRUCTION_TYPE_INVALID, message: Choose Text, Google Slide, or PDF instructions. }
        - { query: "SELECT 1 AS ok WHERE (CAST(:instruction_type AS VARCHAR) = 'text' AND LENGTH(TRIM(CAST(COALESCE(:instruction_text, '') AS VARCHAR))) BETWEEN 1 AND 10000 AND LENGTH(TRIM(CAST(COALESCE(:instruction_google_slide, '') AS VARCHAR))) = 0) OR (CAST(:instruction_type AS VARCHAR) = 'google_slide' AND LENGTH(TRIM(CAST(COALESCE(:instruction_google_slide, '') AS VARCHAR))) BETWEEN 1 AND 2048 AND (LOWER(TRIM(CAST(:instruction_google_slide AS VARCHAR))) LIKE 'https://%' OR LOWER(TRIM(CAST(:instruction_google_slide AS VARCHAR))) LIKE 'http://%') AND TRIM(CAST(:instruction_google_slide AS VARCHAR)) NOT LIKE '% %' AND LENGTH(TRIM(CAST(COALESCE(:instruction_text, '') AS VARCHAR))) = 0) OR (CAST(:instruction_type AS VARCHAR) = 'pdf' AND EXISTS (SELECT 1 FROM maintenance_requests WHERE id = :id AND instruction_pdf_file_name IS NOT NULL AND instruction_pdf_mime_type = 'application/pdf' AND instruction_pdf_size_bytes > 0))", status: 422, code: MAINTENANCE_INSTRUCTION_CONTENT_INVALID, message: Text instructions require content, Google Slide instructions require an absolute HTTP or HTTPS link, and PDF instructions require an uploaded PDF. }
      result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
  - id: generate_maintenance_request_recurrence
    type: server
    permission: maintenance.write
    action: maintenance.requests.recurrence.generate
    handler: yaml_mutation
    operation: create
    params: { id: '{state.id}' }
    refresh: [maintenance_request_detail, maintenance_request_activity]
    mutation:
      before_steps:
        - query: "SELECT COALESCE(NULLIF(recurrence_parent_id, ''), id) AS recurrence_root_id, COALESCE(recurrence_sequence, 0) + 1 AS next_recurrence_sequence, COALESCE(NULLIF(recurrence_parent_id, ''), id) || '-recurrence-' || CAST(COALESCE(recurrence_sequence, 0) + 1 AS VARCHAR) AS occurrence_id, name || ' / Recurrence ' || CAST(COALESCE(recurrence_sequence, 0) + 1 AS VARCHAR) AS occurrence_name, equipment_id, equipment_name, category, category_id, team, team_id, request_type, description, instructions, priority, assigned_to, owner, recurrence, company_name, CAST(CASE lower(split_part(trim(recurrence), ' ', 3)) WHEN 'day' THEN CAST(scheduled_date AS DATE) + CAST(split_part(trim(recurrence), ' ', 2) AS INTEGER) * INTERVAL '1 day' WHEN 'days' THEN CAST(scheduled_date AS DATE) + CAST(split_part(trim(recurrence), ' ', 2) AS INTEGER) * INTERVAL '1 day' WHEN 'week' THEN CAST(scheduled_date AS DATE) + CAST(split_part(trim(recurrence), ' ', 2) AS INTEGER) * INTERVAL '1 week' WHEN 'weeks' THEN CAST(scheduled_date AS DATE) + CAST(split_part(trim(recurrence), ' ', 2) AS INTEGER) * INTERVAL '1 week' WHEN 'month' THEN CAST(scheduled_date AS DATE) + CAST(split_part(trim(recurrence), ' ', 2) AS INTEGER) * INTERVAL '1 month' WHEN 'months' THEN CAST(scheduled_date AS DATE) + CAST(split_part(trim(recurrence), ' ', 2) AS INTEGER) * INTERVAL '1 month' WHEN 'year' THEN CAST(scheduled_date AS DATE) + CAST(split_part(trim(recurrence), ' ', 2) AS INTEGER) * INTERVAL '1 year' WHEN 'years' THEN CAST(scheduled_date AS DATE) + CAST(split_part(trim(recurrence), ' ', 2) AS INTEGER) * INTERVAL '1 year' END AS DATE) AS next_scheduled_date FROM maintenance_requests WHERE id = :id"
          assign: true
      guards:
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id", status: 404, code: MAINTENANCE_REQUEST_NOT_FOUND, message: Maintenance request was not found. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Maintenance request was changed before recurrence generation. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND archived = FALSE AND state = 'Repaired' AND request_type = 'Preventive'", status: 409, code: MAINTENANCE_RECURRENCE_NOT_ELIGIBLE, message: Only an active repaired preventive request can generate its next occurrence. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND recurrence_generated_id IS NULL", status: 409, code: MAINTENANCE_RECURRENCE_ALREADY_GENERATED, message: The next recurring occurrence has already been generated. }
        - { query: "SELECT id FROM maintenance_requests WHERE id = :id AND scheduled_date IS NOT NULL AND regexp_matches(trim(COALESCE(recurrence, '')), '^Every [1-9][0-9]* (day|days|week|weeks|month|months|year|years)$')", status: 422, code: MAINTENANCE_RECURRENCE_INVALID, message: Recurrence must use Every N days, weeks, months, or years. }
      steps:
        - query: "INSERT INTO maintenance_requests(id, name, equipment_id, equipment_name, category, category_id, team, team_id, request_type, description, instructions, priority, assigned_to, owner, request_date, scheduled_date, scheduled_end, duration, completed_date, stage, state, kanban_state, recurrence, company_name, archived, row_version, recurrence_parent_id, recurrence_sequence, recurrence_generated_id, created_at, updated_at) VALUES(:occurrence_id, :occurrence_name, :equipment_id, :equipment_name, :category, :category_id, :team, :team_id, :request_type, :description, :instructions, :priority, :assigned_to, :owner, DATE '2026-01-15', :next_scheduled_date, CAST(:next_scheduled_date AS TIMESTAMP) + INTERVAL '1 hour', 1.0, NULL, 'New Request', 'New Request', 'ready', :recurrence, :company_name, FALSE, 1, :recurrence_root_id, :next_recurrence_sequence, NULL, TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')"
        - query: "UPDATE maintenance_requests SET recurrence_generated_id = :occurrence_id, updated_at = TIMESTAMP '2026-01-15 09:00:00', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: Maintenance request was changed before recurrence generation.
      result: { query: "SELECT * FROM maintenance_requests WHERE id = :occurrence_id" }
  - { id: assign_maintenance_request_detail, type: server, permission: maintenance.write, action: maintenance.requests.assign, handler: order_transition, workflow: maintenance_requests, operation: assign, params: { id: '{state.id}' }, refresh: [maintenance_request_detail] }
