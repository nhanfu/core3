page: { id: maintenance-activity-types }
datasources:
  - id: maintenance_activity_types
    permission: maintenance.settings
    error_states: { transport_error: { status: 503, code: MAINTENANCE_ACTIVITY_TYPES_UNAVAILABLE, message: Maintenance activity types are temporarily unavailable. } }
    query: "SELECT id, row_version, name, sequence, active, summary, default_user_name, res_model, delay_count, delay_unit, CASE WHEN delay_count = 1 THEN '1 day' ELSE CAST(delay_count AS VARCHAR) || ' ' || delay_unit END AS planned_in, CASE delay_from WHEN 'current_date' THEN 'after previous activity completion date' ELSE 'after previous activity deadline' END AS delay_from_label, delay_from, chaining_type, suggested_next_summary, default_note FROM maintenance_activity_types WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND ((:active IS NULL AND active = TRUE) OR (:active = 'active' AND active = TRUE) OR (:active = 'archived' AND active = FALSE)) AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(summary, '') ILIKE '%' || :q || '%') ORDER BY sequence, id"
actions:
  - id: create_maintenance_activity_type
    type: server_form
    permission: maintenance.settings
    title: New Activity Type
    action: maintenance.activity_types.create
    handler: yaml_mutation
    operation: create
    refresh: [maintenance_activity_types]
    mutation:
      operation: insert
      table: maintenance_activity_types
      generated: [id]
      fields: [name, sequence, active, summary, default_user_name, res_model, delay_count, delay_unit, delay_from, chaining_type, suggested_next_summary, default_note]
      required: [name]
      defaults: { sequence: 10, active: true, delay_count: 0, delay_unit: days, delay_from: previous_activity, chaining_type: suggest }
      guards:
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM maintenance_activity_types WHERE LOWER(name) = LOWER(:name))", status: 409, code: MAINTENANCE_ACTIVITY_TYPE_NAME_EXISTS, message: An activity type with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:delay_count AS INTEGER), 0) >= 0", status: 422, code: MAINTENANCE_ACTIVITY_TYPE_DELAY_INVALID, message: Schedule must be zero or greater. }
      result: { query: "SELECT * FROM maintenance_activity_types WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: sequence, label: Sequence, type: number, default: 10 }
      - { field: summary, label: Default Summary, type: text }
      - { field: default_user_name, label: Default User, type: text }
      - { field: delay_count, label: Schedule, type: number, min: 0, default: 0 }
      - { field: delay_unit, label: Delay Units, type: select, options: [days, weeks, months], default: days }
      - { field: delay_from, label: Delay Type, type: select, options: [{ value: current_date, label: after previous activity completion date }, { value: previous_activity, label: after previous activity deadline }], default: previous_activity }
      - { field: chaining_type, label: Chaining Type, type: select, options: [{ value: suggest, label: Suggest Next Activity }, { value: trigger, label: Trigger Next Activity }], default: suggest }
      - { field: suggested_next_summary, label: Suggest, type: text }
      - { field: default_note, label: Default Note, type: textarea }
  - id: view_maintenance_activity_type
    type: navigate
    permission: maintenance.settings
    navigate_to: /maintenance-activity-types/detail
    params: { id: '{row.id}' }
  - id: edit_maintenance_activity_type
    type: navigate
    permission: maintenance.settings
    navigate_to: /maintenance-activity-types/detail
    params: { id: '{row.id}' }
  - id: archive_maintenance_activity_type
    type: server
    permission: maintenance.settings
    action: maintenance.activity_types.archive
    handler: yaml_mutation
    operation: update
    refresh: [maintenance_activity_types, maintenance_activity_type_detail]
    params: { values: { active: false } }
    mutation: { operation: update, table: maintenance_activity_types, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM maintenance_activity_types WHERE id = :id" } }
  - id: restore_maintenance_activity_type
    type: server
    permission: maintenance.settings
    action: maintenance.activity_types.restore
    handler: yaml_mutation
    operation: update
    refresh: [maintenance_activity_types, maintenance_activity_type_detail]
    params: { values: { active: true } }
    mutation: { operation: update, table: maintenance_activity_types, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM maintenance_activity_types WHERE id = :id" } }
  - id: delete_maintenance_activity_type
    type: server
    permission: maintenance.settings
    action: maintenance.activity_types.delete
    handler: yaml_mutation
    operation: delete
    refresh: [maintenance_activity_types]
    mutation:
      operation: delete
      table: maintenance_activity_types
      concurrency: { required: true }
      guards: [{ query: "SELECT 1 AS ok WHERE :id NOT IN ('maintenance-activity-type-todo', 'maintenance-activity-type-maintenance-request')", status: 422, code: MAINTENANCE_ACTIVITY_TYPE_PROTECTED, message: A standard maintenance activity type cannot be deleted. }]
