page: { id: equipment-detail }
datasources:
  - { id: maintenance_equipment_detail, single: true, permission: maintenance.read, query: "SELECT id, row_version, name, serial_number, model, vendor_reference, category, location, owner, technician, team, CAST(next_preventive_date AS VARCHAR) AS next_preventive_date, CAST(warranty_date AS VARCHAR) AS warranty_date, cost, description, state, archived FROM maintenance_equipment WHERE id = :id" }
