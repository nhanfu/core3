page: { id: maintenance-stage-detail }
datasources:
  - id: maintenance_stage_detail
    single: true
    permission: maintenance.manage
    error_states: { transport_error: { status: 503, code: MAINTENANCE_STAGE_DETAIL_UNAVAILABLE, message: Maintenance stage details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, sequence, fold, done FROM maintenance_stages WHERE active = TRUE AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
actions:
  - id: edit_maintenance_stage_detail
    type: server_form
    permission: maintenance.manage
    title: Edit Maintenance Stage
    action: maintenance.stages.update
    handler: yaml_mutation
    operation: update
    refresh: [maintenance_stage_detail]
    mutation:
      operation: update
      table: maintenance_stages
      fields: [name, sequence, fold, done]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM maintenance_stages WHERE id = :id AND active = TRUE", status: 404, code: MAINTENANCE_STAGE_NOT_FOUND, message: Active maintenance stage not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM maintenance_stages WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: MAINTENANCE_STAGE_NAME_EXISTS, message: A maintenance stage with this name already exists. }
      result: { query: "SELECT * FROM maintenance_stages WHERE id = :id" }
    fields: [{ field: name, label: Name, type: text, required: true }, { field: sequence, label: Sequence, type: number }, { field: fold, label: Folded, type: checkbox }, { field: done, label: Request Done, type: checkbox }]
