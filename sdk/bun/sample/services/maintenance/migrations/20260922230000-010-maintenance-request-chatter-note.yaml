version: 0.0.10
kind: schema
description: Durable Maintenance request Chatter notes
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS maintenance_request_messages (
        id VARCHAR PRIMARY KEY,
        request_id VARCHAR NOT NULL,
        row_version BIGINT NOT NULL DEFAULT 1,
        actor_id VARCHAR,
        actor_name VARCHAR NOT NULL,
        action VARCHAR NOT NULL,
        action_label VARCHAR NOT NULL,
        detail VARCHAR NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 11:00:00'
      );
      CREATE INDEX IF NOT EXISTS maintenance_request_messages_request_idx ON maintenance_request_messages(request_id, created_at, id);
      INSERT INTO maintenance_request_messages(id, request_id, row_version, actor_id, actor_name, action, action_label, detail, created_at)
      SELECT 'maintenance-message-' || r.id || '-1', r.id, 1, 'odoo-system', 'OdooBot', 'maintenance.requests.created', 'Maintenance Request created', 'Maintenance Request created', TIMESTAMP '2026-01-15 09:00:00'
      FROM maintenance_requests r
      WHERE NOT EXISTS (SELECT 1 FROM maintenance_request_messages m WHERE m.request_id = r.id);
    down: DROP TABLE IF EXISTS maintenance_request_messages;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
database: duckdb
