version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS maintenance_teams (id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, active BOOLEAN NOT NULL DEFAULT TRUE);
      CREATE TABLE IF NOT EXISTS maintenance_categories (id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, active BOOLEAN NOT NULL DEFAULT TRUE);
      CREATE TABLE IF NOT EXISTS maintenance_stages (id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, sequence INTEGER NOT NULL, active BOOLEAN NOT NULL DEFAULT TRUE);
      CREATE TABLE IF NOT EXISTS maintenance_equipment (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, serial_number VARCHAR, model VARCHAR, vendor_reference VARCHAR, category VARCHAR, category_id VARCHAR, location VARCHAR, owner VARCHAR, technician VARCHAR, team VARCHAR, team_id VARCHAR, preventive_interval_days INTEGER, next_preventive_date DATE, warranty_date DATE, cost DECIMAL(12,2), description VARCHAR, company_name VARCHAR NOT NULL DEFAULT 'My Company', state VARCHAR NOT NULL DEFAULT 'Active', archived BOOLEAN NOT NULL DEFAULT FALSE, row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00', updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
      CREATE TABLE IF NOT EXISTS maintenance_requests (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, equipment_id VARCHAR NOT NULL, equipment_name VARCHAR NOT NULL, category VARCHAR, category_id VARCHAR, team VARCHAR, team_id VARCHAR, request_type VARCHAR NOT NULL DEFAULT 'Corrective', description VARCHAR, instructions VARCHAR, priority VARCHAR NOT NULL DEFAULT 'Normal', assigned_to VARCHAR, owner VARCHAR, request_date DATE NOT NULL DEFAULT DATE '2026-01-15', scheduled_date DATE, completed_date DATE, stage VARCHAR NOT NULL DEFAULT 'New Request', state VARCHAR NOT NULL DEFAULT 'New Request', kanban_state VARCHAR NOT NULL DEFAULT 'ready', recurrence VARCHAR, company_name VARCHAR NOT NULL DEFAULT 'My Company', archived BOOLEAN NOT NULL DEFAULT FALSE, row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00', updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
      CREATE INDEX IF NOT EXISTS maintenance_requests_equipment_idx ON maintenance_requests(equipment_id);
      CREATE INDEX IF NOT EXISTS maintenance_requests_state_idx ON maintenance_requests(state);
      CREATE INDEX IF NOT EXISTS maintenance_equipment_state_idx ON maintenance_equipment(state);
    down: |
      DROP TABLE IF EXISTS maintenance_requests;
      DROP TABLE IF EXISTS maintenance_equipment;
      DROP TABLE IF EXISTS maintenance_stages;
      DROP TABLE IF EXISTS maintenance_categories;
      DROP TABLE IF EXISTS maintenance_teams;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
