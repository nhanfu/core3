version: 0.0.3
kind: schema
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS maintenance_team_records (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, active BOOLEAN NOT NULL DEFAULT TRUE,
        company_name VARCHAR NOT NULL DEFAULT 'My Company', member_names VARCHAR, color INTEGER NOT NULL DEFAULT 0,
        note VARCHAR, row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
      CREATE TABLE IF NOT EXISTS maintenance_category_records (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, active BOOLEAN NOT NULL DEFAULT TRUE,
        company_name VARCHAR NOT NULL DEFAULT 'My Company', technician VARCHAR, color INTEGER NOT NULL DEFAULT 0,
        note VARCHAR, row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
      CREATE TABLE IF NOT EXISTS maintenance_settings (
        id VARCHAR PRIMARY KEY, custom_worksheets BOOLEAN NOT NULL DEFAULT FALSE,
        company_name VARCHAR NOT NULL DEFAULT 'My Company', row_version BIGINT NOT NULL DEFAULT 1,
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
    down: |
      DROP TABLE IF EXISTS maintenance_settings;
      DROP TABLE IF EXISTS maintenance_category_records;
      DROP TABLE IF EXISTS maintenance_team_records;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
