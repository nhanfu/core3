title: Equipment
page: { id: equipment, route: /equipment, breadcrumb: [Supply Chain, Maintenance, Equipment], auth: { require: [maintenance.read] } }
components:
  - type: ListView
    variant: odoo
    source: maintenance_equipment
    create_action: create_maintenance_equipment
    create_label: New equipment
    search: { label: Search equipment, placeholder: 'Search name, model, serial, or vendor reference...' }
    filters: [{ field: state, label: Status, options: [Active, Archived] }]
    group_by: [{ field: technician, label: Technician }, { field: category, label: Category }, { field: owner, label: Owner }, { field: team, label: Team }]
    view_navigation: tabs
    views: [{ id: list, label: List, icon: table }, { id: kanban, label: Kanban, icon: dashboard, group_by: category, card: { title: name, subtitle: model, fields: [{ field: serial_number, label: Serial }, { field: technician, label: Technician }, { field: state, label: Status }] } }]
    page_size: 25
    column_chooser: true
    row_key: id
    row_open_action: view_maintenance_equipment
    row_double_click_action: view_maintenance_equipment
    form_view: { page: apps/services/maintenance/pages/maintenance-equipment-detail.yaml, side_panel: true }
    row_actions: menu
    empty_state: { title: No equipment, description: No equipment matches the current filters. }
    columns: [{ field: name, label: Equipment, type: PrimaryEntityCell, sortable: true }, { field: model, label: Model }, { field: serial_number, label: Serial number }, { field: category, label: Category }, { field: technician, label: Technician }, { field: team, label: Team }, { field: state, label: Status, type: StatusChip }]
actions:
  - { id: view_maintenance_equipment, type: navigate, permission: maintenance.read, navigate_to: /equipment/detail, params: { id: '{row.id}' } }
