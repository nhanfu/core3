title: Maintenance Request
page: { id: maintenance-request-detail, route: /maintenance-requests/detail, breadcrumb: [Supply Chain, Maintenance, Request], auth: { require: [maintenance.read] } }
components:
  - type: OdooFormView
    source: maintenance_request_detail
    attachment_source: maintenance_request_instruction_pdf
    attachment_accept: application/pdf,.pdf
    attachment_upload_action: upload_maintenance_request_instruction_pdf
    attachment_download_action: download_maintenance_request_instruction_pdf
    add_attachment_label: Upload PDF instruction
    no_attachments_label: No PDF instruction uploaded
    uploading_label: Uploading PDF instruction…
    upload_failed_label: PDF instruction upload failed
    title_field: name
    subtitle_field: equipment_name
    status_field: state
    status_colors: { New Request: neutral, In Progress: blue, Repaired: green, Scrap: red }
    statusbar: [{ value: New Request, label: New Request }, { value: In Progress, label: In Progress }, { value: Repaired, label: Repaired }, { value: Scrap, label: Scrap }]
    statusbar_actions: { In Progress: assign_maintenance_request_detail, Repaired: start_maintenance_request_detail, Scrap: repair_maintenance_request_detail }
    header_actions:
      - { id: archive_maintenance_request_detail, label: Cancel, variant: danger, permission: maintenance.write, show_if: "state.maintenance_request_detail.archived === false" }
      - { id: reopen_maintenance_request_detail, label: Reopen Request, variant: secondary, permission: maintenance.write, show_if: "state.maintenance_request_detail.archived === true" }
      - { id: update_maintenance_request_kanban_state, label: Update kanban state, variant: secondary, permission: maintenance.write, show_if: "state.maintenance_request_detail.archived === false" }
      - { id: schedule_maintenance_request_activity, label: Schedule activity, variant: secondary, permission: maintenance.write, show_if: "state.maintenance_request_detail.archived === false" }
      - { id: generate_maintenance_request_recurrence, label: Generate next occurrence, variant: secondary, permission: maintenance.write, show_if: "state.maintenance_request_detail.archived === false && state.maintenance_request_detail.state === 'Repaired' && state.maintenance_request_detail.recurrence && !state.maintenance_request_detail.recurrence_generated_id" }
      - { id: update_maintenance_request_instructions, label: Edit instructions, variant: secondary, permission: maintenance.write, show_if: "state.maintenance_request_detail.archived === false" }
    group_columns: 2
    groups: [{ title: Request, fields: [{ field: name, label: Request }, { field: state, label: Status }, { field: kanban_state, label: Kanban state }, { field: equipment_name, label: Equipment }, { field: category, label: Category }, { field: team, label: Team }, { field: request_type, label: Type }, { field: priority, label: Priority }] }, { title: Scheduling, fields: [{ field: assigned_to, label: Responsible }, { field: owner, label: Created by }, { field: request_date, label: Request date }, { field: scheduled_date, label: Scheduled date }, { field: scheduled_end, label: Scheduled end }, { field: duration, label: Duration (hours) }, { field: completed_date, label: Completed date }, { field: recurrence, label: Recurrence }, { field: recurrence_sequence, label: Occurrence number }, { field: instruction_type, label: Instruction type }, { field: instruction_text, label: Instructions }, { field: instruction_google_slide, label: Google Slide link }, { field: instruction_pdf_file_name, label: PDF instruction }, { field: description, label: Description }] }]
    notebook:
      active: instructions
      tabs:
        - id: instructions
          label: Instructions
          groups:
            - title: Maintenance instructions
              fields:
                - { field: instruction_type, label: Instruction type }
                - { field: instruction_text, label: Instructions, type: textarea, wide: true, show_if: "record.instruction_type === 'text'" }
                - { field: instruction_google_slide, label: Google Slide link, show_if: "record.instruction_type === 'google_slide'" }
                - { field: instruction_pdf_file_name, label: PDF instruction, readonly: true, show_if: "record.instruction_type === 'pdf'" }
    message_source: maintenance_request_activity
    activity_complete_action: complete_maintenance_request_activity
    message_action: send_maintenance_request_message
    message_label: Send message
    message_placeholder: Send a message to maintenance request followers…
    note_action: log_maintenance_request_note
    note_label: Log note
    note_placeholder: Log an internal note…
    log_label: Log note
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
    message_actor_field: actor_name
    chatter_label: Chatter
    chatter_empty: No messages or activities yet.
actions: []
