workflow:
  id: maintenance_requests
  entity: maintenance_requests
  handler: order_transition
  initial: New Request
  permission: maintenance.write
  mutable: true
  status_source: maintenance_request_states
  states:
    - { id: New Request, label: New Request, color: neutral }
    - { id: In Progress, label: In Progress, color: blue }
    - { id: Repaired, label: Repaired, color: green }
    - { id: Scrap, label: Scrap, color: red, terminal: true }
  transitions:
    - id: assign
      from: [New Request]
      to: In Progress
      permission: maintenance.write
      mutation:
        guards: [{ query: "SELECT id FROM maintenance_requests WHERE id = :id AND state = 'New Request'", status: 409, message: Only new maintenance requests can start }]
        steps: [{ query: "UPDATE maintenance_requests SET state = 'In Progress', stage = 'In Progress', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
    - id: start
      from: [In Progress]
      to: Repaired
      permission: maintenance.write
      mutation:
        guards: [{ query: "SELECT id FROM maintenance_requests WHERE id = :id AND state = 'In Progress'", status: 409, message: Only active maintenance requests can be repaired }]
        steps: [{ query: "UPDATE maintenance_requests SET state = 'Repaired', stage = 'Repaired', completed_date = DATE '2026-01-15', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
    - id: repair
      from: [Repaired]
      to: Scrap
      permission: maintenance.write
      mutation:
        guards: [{ query: "SELECT id FROM maintenance_requests WHERE id = :id AND state = 'Repaired'", status: 409, message: Only repaired maintenance requests can be scrapped }]
        steps: [{ query: "UPDATE maintenance_requests SET state = 'Scrap', stage = 'Scrap', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
    - id: cancel
      from: [New Request, In Progress]
      to: Scrap
      permission: maintenance.write
      mutation:
        guards: [{ query: "SELECT id FROM maintenance_requests WHERE id = :id AND state IN ('New Request', 'In Progress')", status: 409, message: Only open maintenance requests can be scrapped }]
        steps: [{ query: "UPDATE maintenance_requests SET state = 'Scrap', stage = 'Scrap', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM maintenance_requests WHERE id = :id" }
