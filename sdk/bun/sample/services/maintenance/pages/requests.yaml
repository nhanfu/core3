title: Maintenance Requests
page: { id: maintenance-requests, route: /maintenance-requests, breadcrumb: [Supply Chain, Maintenance, Requests], auth: { require: [maintenance.read] } }
components:
  - type: ListView
    variant: odoo
    source: maintenance_requests
    create_action: create_maintenance_request
    create_label: New request
    search: { label: Search maintenance requests, placeholder: 'Search requests, equipment, category, or assignee...' }
    filters: [{ field: state, label: Status, options_source: maintenance_request_states }, { field: priority, label: Priority, options: [Low, Normal, High] }, { field: archived, label: Archived, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    group_by: [{ field: stage, label: Stage }, { field: assigned_to, label: Responsible }, { field: category, label: Category }, { field: owner, label: Created by }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - { id: kanban, label: Kanban, icon: dashboard, group_by: state, groups_source: maintenance_request_states, card: { title: name, subtitle: equipment_name, fields: [{ field: priority, label: Priority }, { field: assigned_to, label: Responsible }, { field: scheduled_date, label: Scheduled }] } }
    page_size: 25
    column_chooser: true
    row_key: id
    row_open_action: view_maintenance_request
    row_double_click_action: view_maintenance_request
    form_view: { page: apps/services/maintenance/pages/maintenance-request-detail.yaml, side_panel: true }
    row_actions: menu
    empty_state: { title: No maintenance requests, description: No requests match the current filters. }
    columns: [{ field: name, label: Request, type: PrimaryEntityCell, sortable: true }, { field: equipment_name, label: Equipment }, { field: category, label: Category }, { field: request_type, label: Type }, { field: priority, label: Priority, type: StatusChip }, { field: assigned_to, label: Responsible }, { field: scheduled_date, label: Scheduled }, { field: state, label: Status, type: StatusChip }]
actions:
  - { id: view_maintenance_request, type: navigate, permission: maintenance.read, navigate_to: /maintenance-requests/detail, params: { id: '{row.id}' } }
