title: Equipment Category
page: { id: maintenance-category-detail, route: /equipement-categories/detail, breadcrumb: [Supply Chain, Maintenance, Configuration, Equipment Categories], auth: { require: [maintenance.manage] } }
components:
  - type: OdooFormView
    source: maintenance_category_detail
    title_field: name
    subtitle_field: company_name
    status_field: active
    status_colors: { true: green, false: neutral }
    group_columns: 2
    stat_buttons: [{ id: open_maintenance_equipment_from_category, label: Equipment, value_field: equipment_count, permission: maintenance.read }, { id: open_maintenance_requests_from_category, label: Maintenance, value_field: maintenance_open_count, permission: maintenance.read }]
    header_actions: [{ id: edit_maintenance_category, label: Edit, variant: primary, permission: maintenance.manage }, { id: delete_maintenance_category_detail, label: Delete, variant: danger, permission: maintenance.manage, confirm: Delete this equipment category? }]
    groups: [{ title: Equipment Category, fields: [{ field: name, label: Category Name }, { field: technician, label: Responsible }, { field: company_name, label: Company }, { field: color, label: Color }, { field: note, label: Note }] }]
