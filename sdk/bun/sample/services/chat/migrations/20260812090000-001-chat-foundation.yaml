up: |
  CREATE TABLE IF NOT EXISTS chat_users (
    id VARCHAR PRIMARY KEY, email VARCHAR NOT NULL UNIQUE, name VARCHAR NOT NULL, enabled BOOLEAN DEFAULT true
  );
  CREATE TABLE IF NOT EXISTS chat_threads (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), title VARCHAR NOT NULL,
    thread_type VARCHAR NOT NULL DEFAULT 'Group', created_by VARCHAR NOT NULL,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE TABLE IF NOT EXISTS chat_participants (
    thread_id VARCHAR NOT NULL REFERENCES chat_threads(id), user_id VARCHAR NOT NULL,
    joined_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, last_read_at TIMESTAMP,
    PRIMARY KEY(thread_id, user_id)
  );
  CREATE TABLE IF NOT EXISTS chat_messages (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), thread_id VARCHAR NOT NULL REFERENCES chat_threads(id),
    sender_id VARCHAR NOT NULL, body VARCHAR NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, edited_at TIMESTAMP
  );
  CREATE TABLE IF NOT EXISTS chat_attachments (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), message_id VARCHAR NOT NULL REFERENCES chat_messages(id),
    file_name VARCHAR NOT NULL, mime_type VARCHAR, size_bytes BIGINT NOT NULL DEFAULT 0,
    storage_key VARCHAR NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE TABLE IF NOT EXISTS system_activity (
    id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), actor_id VARCHAR, actor_name VARCHAR NOT NULL,
    action VARCHAR NOT NULL, resource VARCHAR NOT NULL, resource_id VARCHAR, detail VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
  );
  CREATE INDEX IF NOT EXISTS idx_chat_participants_user ON chat_participants(user_id, thread_id);
  CREATE INDEX IF NOT EXISTS idx_chat_messages_thread ON chat_messages(thread_id, created_at);
down: |
  DROP TABLE IF EXISTS chat_attachments;
  DROP TABLE IF EXISTS chat_messages;
  DROP TABLE IF EXISTS chat_participants;
  DROP TABLE IF EXISTS chat_threads;
  DROP TABLE IF EXISTS system_activity;
  DROP TABLE IF EXISTS chat_users;
