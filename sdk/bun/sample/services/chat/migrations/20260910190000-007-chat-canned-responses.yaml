version: 0.0.7
description: Add deterministic Discuss canned response fixtures
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS chat_canned_responses (
        id VARCHAR PRIMARY KEY,
        row_version INTEGER NOT NULL DEFAULT 1,
        source VARCHAR NOT NULL UNIQUE,
        substitution VARCHAR NOT NULL,
        authorized_groups VARCHAR NOT NULL DEFAULT '',
        is_shared BOOLEAN NOT NULL DEFAULT FALSE,
        is_editable BOOLEAN NOT NULL DEFAULT TRUE,
        created_by VARCHAR NOT NULL DEFAULT 'user-admin',
        last_used TIMESTAMP,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
      INSERT INTO chat_canned_responses(id, row_version, source, substitution, authorized_groups, is_shared, is_editable, created_by, last_used, created_at)
      VALUES
        ('chat-canned-hello', 1, 'hello', 'Hello, how may I help you?', 'Role / User', TRUE, TRUE, 'user-admin', NULL, TIMESTAMP '2026-01-15 08:00:00'),
        ('chat-canned-bye', 1, 'bye', 'Thanks for your feedback. Goodbye!', 'Role / User', TRUE, TRUE, 'user-admin', NULL, TIMESTAMP '2026-01-15 08:01:00')
      ON CONFLICT (id) DO NOTHING;
    down: |
      DROP TABLE IF EXISTS chat_canned_responses;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
