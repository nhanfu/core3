page: { id: chat-scheduled-messages }

datasources:
  - id: chat_scheduled_messages
    single: false
    permission: chat.technical
    error_states:
      forbidden: { status: 403, code: CHAT_SCHEDULED_MESSAGES_FORBIDDEN, message: You do not have permission to view scheduled messages. }
      transport_error: { status: 503, code: CHAT_SCHEDULED_MESSAGES_UNAVAILABLE, message: Scheduled messages are temporarily unavailable. }
    query: |
      SELECT s.id, s.row_version, s.message_id AS mail_message_id,
        COALESCE(m.body, '') AS message_label,
        CAST(s.scheduled_datetime AS VARCHAR) AS scheduled_datetime,
        s.notification_parameters,
        CASE WHEN s.scheduled_datetime <= CURRENT_TIMESTAMP THEN 'Due' ELSE 'Scheduled' END AS status
      FROM chat_message_schedules s
      JOIN chat_messages m ON m.id = s.message_id
      WHERE (:q IS NULL OR m.body ILIKE '%' || :q || '%' OR s.notification_parameters ILIKE '%' || :q || '%')
        AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'no_results', 'not_found') THEN FALSE ELSE TRUE END
      ORDER BY s.scheduled_datetime DESC, s.id DESC

actions:
  - id: edit_scheduled_message
    type: navigate
    permission: chat.technical
    navigate_to: /chat/scheduled-messages/detail
    params: { id: '{row.id}' }
  - id: force_send_scheduled_message
    type: server
    permission: chat.technical
    action: mail.message.schedule.force_send
    handler: yaml_mutation
    operation: delete
    event: chat.scheduled_message.sent
    refresh: [chat_scheduled_messages, chat_scheduled_message_detail]
    mutation:
      operation: delete
      table: chat_message_schedules
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM chat_message_schedules WHERE id = :id", status: 404, code: CHAT_SCHEDULED_MESSAGE_NOT_FOUND, message: Scheduled message not found. }
      steps:
        - { query: "INSERT INTO system_activity(id, actor_id, actor_name, action, resource, resource_id, detail) VALUES (CAST(gen_random_uuid() AS VARCHAR), :current_user_id, 'Technical User', 'force_send', 'mail.message.schedule', :id, 'Notification dispatch requested')" }
      result: { query: "SELECT :id AS id, TRUE AS sent" }
