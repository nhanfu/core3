page: { id: chat }

datasources:
  - id: chat_sidebar
    single: false
    permission: chat.read
    mock_data:
      default:
        - { id: inbox, kind: filter, label: Inbox, icon: inbox, count: 1 }
        - { id: starred, kind: filter, label: Starred, icon: star, count: 1 }
        - { id: history, kind: filter, label: History, icon: history, count: 0 }
        - { id: channels, kind: section, label: Channels, icon: hashtag }
        - { id: direct, kind: section, label: Direct Messages, icon: user }
      states:
        empty: []
        search_no_results: [{ id: inbox, kind: filter, label: Inbox, icon: inbox, count: 0 }]
        offline: [{ id: connection, kind: status, status: offline, label: Working offline, detail: Showing saved conversations }]

  - id: chat_threads
    single: false
    permission: chat.read
    mock_data:
      default:
        - { id: chat-demo-thread, row_version: 1, title: Event Store Demo, thread_type: Direct, participant_user_ids: user-disp, participant_names: Dispatcher User, preview: This message was seeded through the event bus., updated_at: '2026-08-14 08:01:00', unread_count: 1, starred: true, history: false }
        - { id: chat-team-thread, row_version: 1, title: Operations team, thread_type: Group, participant_user_ids: user-disp,user-ops, participant_names: Dispatcher User, Operations User, preview: The delivery schedule is ready., updated_at: '2026-08-13 16:30:00', unread_count: 0, starred: false, history: true }
      states:
        inbox:
          - { id: chat-demo-thread, row_version: 1, title: Event Store Demo, thread_type: Direct, participant_names: Dispatcher User, preview: This message was seeded through the event bus., updated_at: '2026-08-14 08:01:00', unread_count: 1, starred: true, history: false }
          - { id: chat-team-thread, row_version: 1, title: Operations team, thread_type: Group, participant_names: Dispatcher User, Operations User, preview: The delivery schedule is ready., updated_at: '2026-08-13 16:30:00', unread_count: 0, starred: false, history: true }
        starred:
          - { id: chat-demo-thread, row_version: 1, title: Event Store Demo, thread_type: Direct, participant_names: Dispatcher User, preview: This message was seeded through the event bus., updated_at: '2026-08-14 08:01:00', unread_count: 1, starred: true, history: false }
        history:
          - { id: chat-team-thread, row_version: 1, title: Operations team, thread_type: Group, participant_names: Dispatcher User, Operations User, preview: The delivery schedule is ready., updated_at: '2026-08-13 16:30:00', unread_count: 0, starred: false, history: true }
        empty: []
        search_no_results: []
        offline:
          - { id: chat-demo-thread, row_version: 1, title: Event Store Demo, thread_type: Direct, participant_names: Dispatcher User, preview: This message was seeded through the event bus., updated_at: '2026-08-14 08:01:00', unread_count: 1, starred: true, history: false }
    enrich:
      service: auth
      operation: users.resolve
      local_key: participant_user_ids
      split: ','
      ids_param: user_ids
      fields: [{ source: name, target: participant_names, join: ', ' }]

  - id: chat_messages
    single: false
    permission: chat.read
    mock_data:
      default:
        - { id: chat-demo-message-01, thread_id: chat-demo-thread, sender_id: user-admin, sender_name: Admin User, body: Welcome to the Core3 event store demo., created_at: '2026-08-14 08:00:00', is_own: true, attachment_names: '' }
        - { id: chat-demo-message-02, thread_id: chat-demo-thread, sender_id: user-disp, sender_name: Dispatcher User, body: This message was seeded through the event bus., created_at: '2026-08-14 08:01:00', is_own: false, attachment_names: handoff.pdf }
      states:
        empty: []
        offline: [{ id: chat-demo-message-01, thread_id: chat-demo-thread, sender_id: user-admin, sender_name: Admin User, body: Welcome to the Core3 event store demo., created_at: '2026-08-14 08:00:00', is_own: true, attachment_names: '' }]

  - id: chat_attachments
    single: false
    permission: chat.read
    mock_data:
      default: [{ id: chat-demo-attachment-01, message_id: chat-demo-message-02, thread_id: chat-demo-thread, file_name: handoff.pdf, mime_type: application/pdf, size_bytes: 24576 }]
      states: { empty: [], offline: [] }

actions:
  - id: create_thread
    type: server_form
    permission: chat.write
    title: Create a conversation
    action: chat.threads.create
    handler: chat
    topic: chat.thread.create
    topic_version: 1
    operation: create_thread
    fields:
      - { field: title, label: Name of the conversation, type: text, required: true }
      - { field: participant_emails, label: Participant email (separated by commas), type: text, required: true }
    mutation:
      generated: [thread_id]
      guards: [{ query: "SELECT 1 AS ok WHERE length(trim(CAST(:title AS VARCHAR))) BETWEEN 1 AND 160 AND length(trim(CAST(:participant_emails AS VARCHAR))) > 0", status: 400, message: A valid conversation title and participant list are required }]
      steps: [{ query: "INSERT INTO chat_threads(id, title, thread_type, created_by) VALUES(:thread_id, trim(CAST(:title AS VARCHAR)), 'Group', :current_user_id)" }]
      result: { query: "SELECT :thread_id AS id, trim(CAST(:title AS VARCHAR)) AS title" }
  - id: send_message
    type: server
    permission: chat.write
    action: chat.messages.send
    handler: chat
    event: chat.message.created
    operation: send_message
    params: { content: '{row.content}', client_message_id: '{row.client_message_id}' }
    mutation:
      guards: [{ query: "SELECT 1 AS ok WHERE length(trim(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 400, message: message content must be between 1 and 4000 characters }]
      steps:
        - { query: "SELECT CAST(gen_random_uuid() AS VARCHAR) AS message_id", assign: message_id }
        - { query: "INSERT INTO chat_messages(id, thread_id, sender_id, body) VALUES(:message_id, :thread_id, :current_user_id, trim(CAST(:content AS VARCHAR)))" }
        - { query: "UPDATE chat_threads SET updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :thread_id" }
      result: { query: "SELECT CAST(:message_id AS VARCHAR) AS id, CAST(:thread_id AS VARCHAR) AS thread_id, CAST(:current_user_id AS VARCHAR) AS sender_id, trim(CAST(:content AS VARCHAR)) AS body" }
  - id: mark_thread_read
    type: server
    permission: chat.write
    action: chat.threads.mark_read
    handler: chat
    operation: mark_read
    mutation:
      guards: [{ query: "SELECT id FROM chat_threads WHERE id = :thread_id", status: 404, code: CHAT_THREAD_NOT_FOUND, message: Conversation not found. }]
      steps: [{ query: "UPDATE chat_participants SET last_read_at = CURRENT_TIMESTAMP WHERE thread_id = :thread_id AND user_id = :current_user_id" }]
      result: { query: "SELECT true AS ok" }
  - id: mark_thread_unread
    type: server
    permission: chat.write
    action: chat.threads.mark_unread
    handler: chat
    operation: mark_unread
    mutation:
      guards: [{ query: "SELECT id FROM chat_threads WHERE id = :thread_id", status: 404, code: CHAT_THREAD_NOT_FOUND, message: Conversation not found. }]
      steps: [{ query: "UPDATE chat_participants SET last_read_at = TIMESTAMP '1970-01-01 00:00:00' WHERE thread_id = :thread_id AND user_id = COALESCE(:current_user_id, 'user-admin')" }]
      result: { query: "SELECT true AS ok" }
  - id: toggle_thread_star
    type: server
    permission: chat.write
    action: chat.threads.toggle_star
    handler: chat
    operation: toggle_star
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM chat_threads WHERE id = :thread_id", status: 404, code: CHAT_THREAD_NOT_FOUND, message: Conversation not found. }
        - { query: "SELECT id FROM chat_threads WHERE id = :thread_id AND row_version = :expected_row_version", status: 409, code: CHAT_THREAD_STALE, message: Conversation was changed by another user. Reload before saving. }
      steps: [{ query: "UPDATE chat_threads SET starred = NOT starred, row_version = row_version + 1 WHERE id = :thread_id" }]
      result: { query: "SELECT id, starred, row_version FROM chat_threads WHERE id = :thread_id" }
  - id: upload_attachment
    type: upload
    action: chat.attachments.send
    handler: chat_attachment
    topic: chat.attachment.send
    topic_version: 1
    permission: chat.write
    kind: chat_attachment
    mutation:
      generated: [message_id, attachment_id]
      steps:
        - { query: "INSERT INTO chat_messages(id, thread_id, sender_id, body) VALUES(:message_id, :thread_id, :current_user_id, COALESCE(NULLIF(trim(CAST(:content AS VARCHAR)), ''), 'File uploaded'))" }
        - { query: "INSERT INTO chat_attachments(id, message_id, file_name, mime_type, size_bytes, storage_key) VALUES(:attachment_id, :message_id, :fileName, :mimeType, :sizeBytes, :storageKey)" }
      result: { query: "SELECT :message_id AS id, :thread_id AS thread_id, :current_user_id AS sender_id, 'File uploaded' AS body" }
  - id: download_attachment
    type: download
    permission: chat.read
    kind: chat_attachment
