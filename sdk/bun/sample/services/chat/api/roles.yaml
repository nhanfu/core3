page: { id: chat-roles }
datasources:
  - id: chat_roles
    permission: chat.read
    error_states: { forbidden: { status: 403, code: CHAT_ROLES_FORBIDDEN, message: You do not have permission to view roles. }, transport_error: { status: 503, code: CHAT_ROLES_UNAVAILABLE, message: Roles are temporarily unavailable. } }
    query: "SELECT id, row_version, name, user_ids, user_names, CASE WHEN instr(',' || user_ids || ',', ',' || COALESCE(:current_user_id, 'user-admin') || ',') > 0 THEN TRUE ELSE FALSE END AS my_role FROM chat_roles WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'no_results', 'not_found') THEN FALSE ELSE TRUE END = TRUE AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR user_names ILIKE '%' || :q || '%') AND (COALESCE(:my_role, '') = '' OR (COALESCE(:my_role, '') = 'true' AND instr(',' || user_ids || ',', ',' || COALESCE(:current_user_id, 'user-admin') || ',') > 0)) ORDER BY name, id"
actions:
  - id: create_chat_role
    type: server_form
    permission: chat.write
    title: New Role
    action: mail.res_role.create
    handler: yaml_mutation
    operation: create
    refresh: [chat_roles]
    fields: [{ field: name, label: Role, type: text, required: true }, { field: user_names, label: Users, type: text }]
    mutation:
      operation: insert
      table: chat_roles
      generated: [id]
      fields: [name, user_ids, user_names]
      required: [name]
      defaults: { user_ids: '', user_names: '' }
      guards: [{ query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 128 AND NOT EXISTS (SELECT 1 FROM chat_roles WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))))", status: 409, code: CHAT_ROLE_NAME_EXISTS, message: A role with this name already exists. }]
      result: { query: "SELECT * FROM chat_roles WHERE id = :id" }
  - id: edit_chat_role
    type: navigate
    permission: chat.read
    navigate_to: /chat/roles/detail
    params: { id: '{row.id}' }
  - id: delete_chat_role
    type: server
    permission: chat.write
    action: mail.res_role.delete
    handler: yaml_mutation
    operation: delete
    refresh: [chat_roles]
    mutation:
      operation: delete
      table: chat_roles
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM chat_roles WHERE id = :id", status: 404, code: CHAT_ROLE_NOT_FOUND, message: Role not found. }]
      result: { query: "SELECT * FROM chat_roles WHERE id = :id" }
