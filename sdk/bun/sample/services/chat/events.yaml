    source: chat.seed
    operation: send_message
    status: success
    threadId: chat-demo-thread
    messageId: chat-demo-message-01
    message:
      thread_id: chat-demo-thread
      sender_id: user-admin
      body: Welcome to the Core3 event store demo.
      created_at: '2026-08-14T08:00:00.000Z'
  - key: chat.seed.message.02
    topic: chat.message.created
    source: chat.seed
    operation: send_message
    status: success
    threadId: chat-demo-thread
    messageId: chat-demo-message-02
