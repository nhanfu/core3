title: Canned Responses
page: { id: chat-canned-responses, route: /chat/canned-responses, breadcrumb: [Discuss, Configuration, Canned Responses], auth: { require: [chat.read] } }

components:
  - type: ListView
    variant: odoo
    source: chat_canned_responses
    create_action: create_canned_response
    create_label: New
    search: { label: Search canned responses, placeholder: Search shortcuts or substitutions... }
    filters: [{ field: visibility, label: Visibility, options: [{ id: shared, label: Shared }, { id: private, label: Private }] }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: true
        group_by: authorized_groups
        card: { title: shortcut, subtitle: substitution, fields: [{ field: authorized_groups, label: Authorized Groups }] }
      - { id: form, label: Form, icon: edit }
    form_view: { page: apps/services/chat/pages/canned-response-detail.yaml, side_panel: true }
    row_key: id
    row_open_action: edit_canned_response
    row_actions: menu
    empty_state: { title: No canned response found. Let's create one!, description: Use canned responses to quickly insert prewritten messages with ::shortcut. }
    columns:
      - { field: shortcut, label: Shortcut, type: PrimaryEntityCell, mobile: true }
      - { field: substitution, label: Substitution }
      - { field: authorized_groups, label: Authorized Groups, optional: hide }
      - { field: last_used, label: Last Used, optional: hide }
      - { field: id, label: '', sortable: false, actions: [{ id: edit_canned_response, label: Edit, icon: edit }, { id: delete_canned_response, label: Delete, icon: trash, variant: danger }] }
