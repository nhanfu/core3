title: Discuss
page: { id: chat, route: /chat, breadcrumb: [Discuss], auth: { require: [chat.read] } }

toolbar:
  - { id: new_thread_btn, label: New conversation, variant: primary, permission: chat.write, action: create_thread }

components:
  - type: ChatWorkspace
    source: chat_threads
    sidebar_source: chat_sidebar
    message_source: chat_messages
    attachment_source: chat_attachments
    page_size: 50
    message_page_size: 100
    send_action: send_message
    upload_action: upload_attachment
    download_action: download_attachment
    mark_read_action: mark_thread_read
    mark_unread_action: mark_thread_unread
    toggle_star_action: toggle_thread_star
    websocket: { endpoint: /api/events/chat, permission: chat.read, send_action: send_message }
    search_placeholder: Search conversations...
    empty_threads: No conversations found
    empty_messages: Select a conversation to start chatting
