title: Activity Types
page: { id: project-activity-types, route: /project-activity-types, breadcrumb: [Project, Configuration, Activity Types], auth: { require: [project.manage] } }
components:
  - type: ListView
    variant: odoo
    source: project_activity_types
    create_action: create_project_activity_type
    create_label: New
    search: { label: Search activity types, placeholder: 'Search activity types...' }
    filters: [{ field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: category
        card: { title: name, subtitle: summary, fields: [{ field: planned_in, label: Planned in }, { field: delay_from_label, label: Type }] }
      - id: card
        label: Kanban
        icon: dashboard
        mobile: true
        card: { title: name, subtitle: summary, fields: [{ field: planned_in, label: Planned in }, { field: delay_from_label, label: Type }] }
      - { id: form, label: Form, icon: edit }
    row_key: id
    row_open_action: view_project_activity_type
    row_double_click_action: view_project_activity_type
    row_actions: menu
    empty_state: { title: No activity types found. Let's create one!, description: Activity types categorize the work your project team needs to complete. }
    columns:
      - { field: sequence, label: ' ', type: HandleCell, mobile: false }
      - { field: name, label: Name, type: PrimaryEntityCell, mobile: true }
      - { field: summary, label: Default Summary }
      - { field: planned_in, label: Planned in }
      - { field: delay_from_label, label: Type }
      - { field: id, label: ' ', sortable: false, actions: [{ id: edit_project_activity_type, label: Edit, icon: edit }, { id: archive_project_activity_type, label: Archive, icon: archive, show_if: 'row.active === true && row.id !== "project-activity-type-todo"' }, { id: unarchive_project_activity_type, label: Unarchive, icon: archive, show_if: 'row.active === false' }, { id: delete_project_activity_type, label: Delete, icon: trash, variant: danger, show_if: 'row.id !== "project-activity-type-todo"' }] }
