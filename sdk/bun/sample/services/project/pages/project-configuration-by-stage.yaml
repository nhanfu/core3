title: Projects
page: { id: project-configuration-by-stage, route: /project-configuration-by-stage, breadcrumb: [Project, Configuration, Projects], auth: { require: [project.manage] } }
components:
  - type: ListView
    variant: odoo
    source: project_configuration_by_stage
    create_action: create_project_configuration_by_stage
    create_label: New
    search: { label: Search projects, placeholder: 'Search project, customer, or manager...' }
    filters:
      - { field: archived, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }
      - { field: state, label: Project status, options_source: project_configuration_by_stage_states }
      - { field: stage, label: Stage, options_source: project_configuration_by_stage_groups }
    group_by: [{ field: stage, label: Stage }, { field: project_manager, label: Project Manager }, { field: state, label: Status }]
    default_filters: { archived: active }
    default_group_by: stage
    view_navigation: tabs
    views:
      - id: list
        label: List
        icon: table
        mobile: false
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: stage
        groups_source: project_configuration_by_stage_groups
        card: { title: name, subtitle: customer_name, fields: [{ field: project_manager, label: Project Manager }, { field: stage, label: Stage }, { field: task_count, label: Tasks }, { field: progress, label: Progress }] }
      - { id: form, label: Form, icon: edit }
      - { id: calendar, label: Calendar, icon: calendar, date_field: start_date, end_date_field: end_date, mobile: false }
      - id: activity
        label: Activity
        icon: activity
        title_field: name
        subtitle_field: customer_name
        record_date_field: start_date
        activity_types: [{ id: todo, label: To-Do, icon: check }]
    form_view: { page: apps/services/project/pages/project-configuration-detail.yaml, side_panel: true }
    page_size: 25
    column_chooser: true
    selectable: true
    row_key: id
    row_open_action: edit_project_configuration_by_stage
    row_double_click_action: edit_project_configuration_by_stage
    row_actions: menu
    empty_state: { title: No projects found. Let's create one!, description: Create projects to organize your tasks and define a different workflow for each project. }
    columns:
      - { field: sequence, label: ' ', type: HandleCell, mobile: false }
      - { field: name, label: Project, type: PrimaryEntityCell, sortable: true, mobile: true }
      - { field: customer_name, label: Customer }
      - { field: project_manager, label: Project Manager }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: task_count, label: Tasks, align: right }
      - { field: progress, label: Progress, align: right }
      - { field: state, label: Status, type: StatusChip }
      - { field: archived, label: Archived, type: Boolean, optional: hide }
      - { field: id, label: ' ', sortable: false, actions: [{ id: edit_project_configuration_by_stage, label: Edit, icon: edit }, { id: archive_project_configuration_by_stage, label: Archive, icon: archive, show_if: 'row.archived === false' }, { id: unarchive_project_configuration_by_stage, label: Unarchive, icon: archive, show_if: 'row.archived === true' }, { id: delete_project_configuration_by_stage, label: Delete, icon: trash, variant: danger }] }
