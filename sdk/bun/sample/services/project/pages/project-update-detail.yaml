title: Project Update
page: { id: project-update-detail, route: /projects/detail/dashboard/update, breadcrumb: [Services, Project, Dashboard, Project Update], auth: { require: [project.read] } }
components:
  - type: OdooFormView
    source: project_update_detail
    title_field: name
    subtitle_field: project_name
    status_field: status
    status_colors: { on_track: green, at_risk: amber, off_track: red, on_hold: blue, done: purple }
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    header_actions:
      - { id: back_to_project_dashboard, label: Dashboard, icon: arrow-left, permission: project.read }
      - { id: edit_project_update, label: Edit, variant: primary, permission: project.write }
      - { id: delete_project_update, label: Delete, variant: danger, permission: project.write, confirm: Delete this project update? }
    group_columns: 2
    groups:
      - title: Project Update
        fields:
          - { field: project_name, label: Project, readonly: true }
          - { field: user_name, label: Author, readonly: true }
          - { field: status, label: Status, type: select, options: [{ value: on_track, label: On Track }, { value: at_risk, label: At Risk }, { value: off_track, label: Off Track }, { value: on_hold, label: On Hold }, { value: done, label: Complete }] }
          - { field: progress, label: Progress, type: number, min: 0, max: 100 }
          - { field: date, label: Date, type: text }
          - { field: task_summary, label: Tasks, readonly: true }
      - title: Description
        fields:
          - { field: description, label: Description, type: textarea, wide: true }
          - { field: row_version, label: Record version, readonly: true }
