title: Projects
page: { id: projects, route: /projects, breadcrumb: [Services, Project], auth: { require: [project.read] } }
components:
  - type: ListView
    variant: odoo
    source: projects
    search: { label: Search projects, placeholder: 'Search project or customer...' }
    filters: [{ field: state, label: Status, options_source: project_states }, { field: stage, label: Stage, options_source: project_stages }]
    group_by: [{ field: stage, label: Stage }, { field: state, label: Status }, { field: project_manager, label: Project manager }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: stage
        groups_source: project_stages
        card: { title: name, subtitle: customer_name, fields: [{ field: project_manager, label: Project manager }, { field: task_count, label: Tasks }, { field: progress, label: Progress }, { field: end_date, label: Deadline }] }
    page_size: 25
    column_chooser: true
    selectable: true
    row_key: id
    row_open_action: view_project
    row_double_click_action: view_project
    form_view: { page: apps/services/project/pages/project-detail.yaml, side_panel: true }
    row_actions: menu
    empty_state: { title: No projects, description: Create a project or adjust your filters. }
    columns:
      - { field: name, label: Project, type: PrimaryEntityCell, sortable: true }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: customer_name, label: Customer }
      - { field: project_manager, label: Project manager }
      - { field: task_count, label: Tasks, align: right }
      - { field: progress, label: Progress, align: right }
      - { field: end_date, label: Deadline, sortable: true }
      - { field: state, label: Status, type: StatusChip }
      - { field: favorite, label: Favorite, type: Boolean }
actions:
  - { id: view_project, type: navigate, permission: project.read, navigate_to: /projects/detail, params: { id: '{row.id}' } }
