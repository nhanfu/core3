title: Project
page: { id: project-detail, route: /projects/detail, breadcrumb: [Services, Project, Detail], auth: { require: [project.read] } }
components:
  - type: OdooFormView
    source: project_detail
    title_field: name
    subtitle_field: customer_name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: Active, label: Active }, { value: Completed, label: Completed }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, Active: blue, Completed: green, Cancelled: red }
    stat_buttons:
      - { id: open_project_dashboard, label: Dashboard, value_field: update_summary, permission: project.read }
    header_actions:
      - { id: preview_project_portal, label: Preview, variant: secondary, permission: project.read }
      - { id: share_project, label: Share Project, variant: primary, permission: project.manage }
    action_menu:
      label: Actions
      aria_label: Project actions
      actions:
        - { id: open_project_burndown, label: Burndown Chart, icon: chart, permission: project.read }
        - { id: open_project_timesheets, label: Timesheets, icon: clock, permission: timesheets.read }
        - { id: convert_project_to_template, label: Convert to Template, icon: copy, permission: project.manage, show_if: "state.project_detail.is_template !== true && state.project_detail.archived !== true" }
    group_columns: 2
    groups:
      - title: Project details
        fields: [{ field: name, label: Project }, { field: customer_name, label: Customer }, { field: project_manager, label: Project manager }, { field: stage, label: Stage }, { field: favorite, label: Favorite }]
      - title: Schedule and effort
        fields: [{ field: start_date, label: Start date }, { field: end_date, label: Deadline }, { field: planned_hours, label: Planned hours }, { field: spent_hours, label: Spent hours }, { field: progress, label: Progress }]
    notebook:
      active: tasks
      tabs: [{ id: tasks, label: Tasks, content_slot: true }, { id: milestones, label: Milestones, content_slot: true }, { id: updates, label: Updates, content_slot: true }]
  - type: ListView
    variant: odoo
    source: project_tasks_detail
    mount_in: previous-panel
    search: { label: Search project tasks, placeholder: 'Search task or assignee...' }
    row_key: id
    row_open_action: view_project_task
    row_actions: menu
    empty_state: { title: No tasks, description: Tasks for this project will appear here. }
    columns:
      - { field: name, label: Task, type: PrimaryEntityCell }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: assignee, label: Assignee }
      - { field: priority, label: Priority, type: StatusChip }
      - { field: due_date, label: Deadline }
      - { field: state, label: Status, type: StatusChip }
actions:
  - { id: view_project_task, type: navigate, permission: project.read, navigate_to: /tasks/detail, params: { id: '{row.id}' } }
  - id: project_add_hours
    type: server
    permission: project.write
    action: project.projects.add_hours
    handler: yaml_mutation
    mutation:
      guards:
        - { query: "SELECT id FROM projects WHERE id = :project_id", status: 404, code: PROJECT_NOT_FOUND, message: Project not found. }
        - { query: "SELECT 1 AS ok WHERE CAST(:hours AS DECIMAL(18,3)) > 0", status: 422, code: PROJECT_HOURS_INVALID, message: Hours must be greater than zero. }
      steps:
        - query: "UPDATE projects SET spent_hours = spent_hours + CAST(:hours AS DECIMAL(18,3)), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :project_id"
          expect_changed: true
      result: { query: "SELECT id, spent_hours, row_version FROM projects WHERE id = :project_id" }
