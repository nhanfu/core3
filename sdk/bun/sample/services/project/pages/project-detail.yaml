title: Project
page: { id: project-detail, route: /projects/detail, breadcrumb: [Services, Project, Detail], auth: { require: [project.read] } }
components:
  - type: OdooFormView
    source: project_detail
    title_field: name
    subtitle_field: customer_name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: Active, label: Active }, { value: Completed, label: Completed }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, Active: blue, Completed: green, Cancelled: red }
    group_columns: 2
    groups:
      - title: Project details
        fields: [{ field: name, label: Project }, { field: customer_name, label: Customer }, { field: project_manager, label: Project manager }, { field: stage, label: Stage }, { field: favorite, label: Favorite }]
      - title: Schedule and effort
        fields: [{ field: start_date, label: Start date }, { field: end_date, label: Deadline }, { field: planned_hours, label: Planned hours }, { field: spent_hours, label: Spent hours }, { field: progress, label: Progress }]
    notebook:
      active: tasks
      tabs: [{ id: tasks, label: Tasks, content_slot: true }, { id: milestones, label: Milestones, content_slot: true }, { id: updates, label: Updates, content_slot: true }]
