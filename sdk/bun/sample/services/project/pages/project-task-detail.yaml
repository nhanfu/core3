title: Task
page: { id: project-task-detail, route: /tasks/detail, breadcrumb: [Services, Project, Tasks, Detail], auth: { require: [project.read] } }
components:
  - type: OdooFormView
    source: project_task_detail
    attachment_source: project_task_attachments
    attachment_page_size: 100
    attachment_label: Attachments
    add_attachment_label: Add attachment
    no_attachments_label: No attachments yet
    attachment_upload_action: upload_project_task_attachment
    attachment_download_action: download_project_task_attachment
    editable: true
    title_field: name
    subtitle_field: project_name
    status_field: state
    statusbar: [{ value: Todo, label: To do }, { value: In Progress, label: In progress }, { value: Done, label: Done }, { value: Cancelled, label: Cancelled }]
    status_colors: { Todo: neutral, In Progress: blue, Done: green, Cancelled: red }
    labels: { save: Save, discard: Discard, editDetails: Edit task, workflowStatus: Task status }
    stat_buttons:
      - { id: open_task_timesheets, label: Timesheets, value_field: spent_hours, permission: timesheets.read }
      - { id: open_recurring_tasks, label: Recurring Tasks, value_field: recurring_count, permission: project.read, show_if: 'record.recurring_count > 0' }
      - { id: open_parent_task, label: Parent Task, value_field: parent_task_name, permission: project.read, show_if: 'record.parent_task_id !== null && record.parent_task_id !== ""' }
    header_actions:
      - { id: edit_task, label: Edit, variant: secondary, permission: project.write }
      - { id: start_task, label: Start, variant: primary, permission: project.write, show_if: "state.project_task_detail.state === 'Todo'" }
      - { id: complete_task, label: Mark done, variant: primary, permission: project.write, show_if: "state.project_task_detail.state === 'In Progress'" }
      - { id: cancel_task, label: Cancel, variant: danger, permission: project.manage, show_if: "state.project_task_detail.state === 'Todo' || state.project_task_detail.state === 'In Progress'" }
    action_menu:
      label: Actions
      aria_label: Task actions
      actions:
        - { id: share_project_task, label: Share Task, icon: share, permission: project.task.publish, show_if: "state.project_task_detail.active === true" }
        - { id: duplicate_project_task, label: Duplicate, icon: copy, permission: project.write, show_if: "state.project_task_detail.active === true" }
        - { id: convert_task_to_template, label: Convert to Template, icon: copy, permission: project.manage, show_if: "state.project_task_detail.active === true && state.project_task_detail.is_template !== true" }
        - { id: convert_task_to_subtask, label: Convert to Task/Sub-Task, icon: hierarchy, permission: project.write, show_if: "state.project_task_detail.active === true" }
    group_columns: 2
    groups:
      - title: Task details
        fields: [{ field: project_name, label: Project }, { field: milestone_name, label: Milestone }, { field: assignee, label: Assignees }, { field: tags, label: Tags }, { field: customer_name, label: Customer }]
      - title: Planning
        fields: [{ field: stage, label: Stage }, { field: priority, label: Priority }, { field: due_date, label: Deadline }, { field: planned_hours, label: Allocated Time }, { field: spent_hours, label: Spent Time }, { field: recurring_task, label: Recurrent, type: checkbox }, { field: repeat_interval, label: Repeat Every, type: number }, { field: repeat_unit, label: Repeat Unit }, { field: repeat_type, label: Until }, { field: repeat_until, label: End Date, show_if: "record.repeat_type === 'until'" }]
    notebook:
      active: description
      tabs:
        - id: description
          label: Description
          fields: [{ field: description, label: Description, type: textarea, wide: true }]
        - id: subtasks
          label: Sub-tasks
          content_slot: true
        - id: blocked_by
          label: Blocked By
          fields: [{ field: blocked_by_summary, label: Blocked By }, { field: blocked_by_names, label: Dependencies, type: textarea, wide: true }]
        - id: timesheets
          label: Timesheets
          content_slot: true
  - type: LineItemGrid
    mount_in: previous-panel
    source: project_task_subtasks
    parent_source: project_task_detail
    title: Sub-tasks
    description: Break this task into smaller pieces of work.
    variant: odoo_x2many
    page_size: 50
    row_key: id
    actions:
      - { id: add_project_task_subtask, label: Add a line, variant: primary, permission: project.write }
    empty_state: { title: No sub-tasks, description: Add a line to break this task into smaller pieces of work. }
    children:
      - { type: LineItemField, id: name, field: name, label: Title, readonly: true }
      - { type: LineItemField, id: assignee, field: assignee, label: Assignees, readonly: true }
      - { type: LineItemField, id: state, field: state, label: State, readonly: true }
      - { type: LineItemField, id: due_date, field: due_date, label: Deadline, readonly: true }
      - type: LineItemActions
        id: project_task_subtask_actions
        actions:
          - { id: edit_project_task_subtask, label: Edit, icon: edit, variant: ghost, permission: project.write }
          - { id: view_project_task_subtask, label: Open, icon: external-link, variant: ghost, permission: project.read }
          - { id: delete_project_task_subtask, label: Delete, icon: trash, variant: danger, permission: project.write }
    columns:
      - { field: name, label: Title, type: PrimaryEntityCell, mobile: true }
      - { field: assignee, label: Assignees, mobile: true }
      - { field: state, label: State, type: StatusChip, mobile: true }
      - { field: due_date, label: Deadline, mobile: false }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: edit_project_task_subtask, label: Edit, icon: edit, variant: ghost, permission: project.write }
          - { id: delete_project_task_subtask, label: Delete, icon: trash, variant: danger, permission: project.write }
  - type: LineItemGrid
    mount_in: previous-panel
    source: project_task_dependencies
    parent_source: project_task_detail
    title: Blocked By
    description: Tasks that must be completed before this task can proceed.
    variant: odoo_x2many
    page_size: 50
    actions:
      - { id: add_project_task_dependency, label: Add a dependency, variant: primary, permission: project.write }
    empty_state: { title: No blocked-by tasks, description: Add a task that must be completed before this task can proceed. }
    children:
      - { type: LineItemField, id: name, field: name, label: Title, readonly: true }
      - { type: LineItemField, id: assignee, field: assignee, label: Assignees, readonly: true }
      - { type: LineItemField, id: project_name, field: project_name, label: Project, readonly: true }
      - { type: LineItemField, id: state, field: state, label: Stage, readonly: true }
      - type: LineItemActions
        id: project_task_dependency_actions
        actions:
          - { id: remove_project_task_dependency, label: Remove, icon: trash, variant: danger, permission: project.write }
    columns:
      - { field: name, label: Title, type: PrimaryEntityCell, mobile: true }
      - { field: assignee, label: Assignees, mobile: true }
      - { field: project_name, label: Project, mobile: false }
      - { field: state, label: Stage, type: StatusChip, mobile: true }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: remove_project_task_dependency, label: Remove, icon: trash, variant: danger, permission: project.write }
  - type: LineItemGrid
    mount_in: previous-panel
    source: project_task_timesheets
    parent_source: project_task_detail
    variant: odoo_x2many
    page_size: 25
    row_key: id
    columns:
      - { field: work_date, label: Date }
      - { field: employee_name, label: Employee }
      - { field: name, label: Entry }
      - { field: description, label: Description }
      - { field: time_spent_display, label: Time Spent, align: right }
      - { field: state, label: Status, type: StatusChip }
    empty_state: { title: Record a new activity, description: Track your working hours by project every day. }
