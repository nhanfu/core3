workflow:
  id: project_tasks
  entity: project_tasks
  handler: order_transition
  initial: Todo
  permission: project.write
  mutable: true
  states:
    - { id: Todo, label: To do, color: neutral }
    - { id: In Progress, label: In progress, color: blue }
    - { id: Done, label: Done, color: green, terminal: true }
    - { id: Cancelled, label: Cancelled, color: red, terminal: true }
  transitions:
    - id: start
      from: [Todo]
      to: In Progress
      permission: project.write
      mutation: { steps: [{ query: "UPDATE project_tasks SET state = 'In Progress', row_version = row_version + 1 WHERE id = :id" }] }
    - id: complete
      from: [In Progress]
      to: Done
      permission: project.write
      mutation: { steps: [{ query: "UPDATE project_tasks SET state = 'Done', row_version = row_version + 1 WHERE id = :id" }] }
    - id: cancel
      from: [Todo, In Progress]
      to: Cancelled
      permission: project.manage
      mutation: { steps: [{ query: "UPDATE project_tasks SET state = 'Cancelled', row_version = row_version + 1 WHERE id = :id" }] }
