title: My Tasks
page: { id: project-tasks, route: /tasks, breadcrumb: [Services, Project, Tasks], auth: { require: [project.read] } }
components:
  - type: ListView
    variant: odoo
    source: project_tasks_all
    search: { label: Search tasks, placeholder: 'Search task, project, or assignee...' }
    filters: [{ field: state, label: Status, options_source: project_task_states }, { field: priority, label: Priority, options: [Low, Normal, High] }, { field: stage, label: Stage, options_source: project_stages }]
    group_by: [{ field: stage, label: Stage }, { field: project_name, label: Project }, { field: assignee, label: Assignee }, { field: state, label: Status }]
    view_navigation: tabs
    views:
      - id: list
        label: List
        icon: table
        mobile: false
      - id: card
        label: Cards
        icon: grid
        card:
          title: name
          subtitle: project_name
          fields:
            - { field: assignee, label: Assignee }
            - { field: priority, label: Priority }
            - { field: due_date, label: Deadline }
            - { field: state, label: Status }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: state
        groups_source: project_task_states
        card: { title: name, subtitle: project_name, fields: [{ field: assignee, label: Assignee }, { field: priority, label: Priority }, { field: due_date, label: Deadline }] }
    page_size: 25
    column_chooser: true
    selectable: true
    row_key: id
    row_open_action: view_task
    row_double_click_action: view_task
    form_view: { page: apps/services/project/pages/project-task-detail.yaml, side_panel: true }
    row_actions: menu
    empty_state: { title: No tasks, description: No tasks match the current filters. }
    columns:
      - { field: name, label: Task, type: PrimaryEntityCell, sortable: true }
      - { field: project_name, label: Project }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: assignee, label: Assignee }
      - { field: priority, label: Priority, type: StatusChip }
      - { field: due_date, label: Deadline, sortable: true }
      - { field: state, label: Status, type: StatusChip }
actions:
  - { id: view_task, type: navigate, permission: project.read, navigate_to: /tasks/detail, params: { id: '{row.id}' } }
