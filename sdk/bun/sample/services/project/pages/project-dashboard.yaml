title: Project Dashboard
page: { id: project-dashboard, route: /projects/detail/dashboard, breadcrumb: [Services, Project, Detail, Dashboard], auth: { require: [project.read] } }
components:
  - type: StatRow
    source: project_dashboard_stats
    title: Project Dashboard
    stats:
      - { field: task_summary, label: Tasks }
      - { field: hours, label: Hours }
      - { field: timesheets, label: Timesheets }
      - { field: sales_orders, label: Sales Orders }
      - { field: sales_order_items, label: Sales Order Items }
      - { field: purchase_orders, label: Purchase Orders }
  - type: ListView
    variant: odoo
    source: project_dashboard_updates
    create_action: create_project_update
    create_label: New
    search: { label: Search updates, placeholder: Search updates... }
    filters:
      - { field: status, label: Status, options: [{ id: on_track, label: On Track }, { id: at_risk, label: At Risk }, { id: off_track, label: Off Track }, { id: on_hold, label: On Hold }, { id: done, label: Complete }] }
    view_navigation: tabs
    views:
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: ''
        card:
          title: name
          subtitle: user_name
          fields:
            - { field: status, label: Status, type: StatusChip }
            - { field: progress_display, label: Progress }
            - { field: task_summary, label: Tasks }
            - { field: hours_display, label: Hours }
            - { field: date, label: Date }
      - { id: list, label: List, icon: table }
      - { id: form, label: Form, icon: edit }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell, mobile: true }
      - { field: user_name, label: Author, mobile: true }
      - { field: date, label: Date, type: DateCell, mobile: true }
      - { field: progress, label: Progress, mobile: false }
      - { field: status, label: Status, type: StatusChip, mobile: true }
      - { field: id, label: ' ', sortable: false, actions: [{ id: edit_project_update, label: Edit, icon: edit }, { id: delete_project_update, label: Delete, icon: trash, variant: danger }] }
    page_size: 50
    responsive_card: true
    row_key: id
    row_open_action: view_project_update
    row_double_click_action: view_project_update
    form_view: { page: apps/services/project/pages/project-update-detail.yaml, side_panel: true }
    empty_state: { title: No updates found. Let's create one!, description: Get a snapshot of the status of your project and share its progress with key stakeholders. }
  - type: ListView
    variant: odoo
    source: project_dashboard_milestones
    create_action: create_project_milestone
    create_label: New
    search: { label: Search milestones, placeholder: Search milestones... }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - { id: card, label: Kanban, icon: dashboard, mobile: true, card: { title: name, subtitle: due_date, fields: [{ field: state, label: Status, type: StatusChip }] } }
      - { id: form, label: Form, icon: edit }
    row_open_action: view_project_milestone
    row_double_click_action: view_project_milestone
    row_actions: menu
    form_view: { page: apps/services/project/pages/project-milestone-detail.yaml, side_panel: true }
    columns:
      - { field: sequence, label: ' ', type: HandleCell, mobile: false }
      - { field: name, label: Milestone, type: PrimaryEntityCell, mobile: true }
      - { field: due_date, label: Deadline, type: DateCell }
      - { field: state, label: Status, type: StatusChip }
      - { field: task_summary, label: Tasks }
      - { field: id, label: ' ', sortable: false, actions: [{ id: edit_project_milestone, label: Edit, icon: edit }, { id: mark_project_milestone, label: Mark reached, icon: check, show_if: 'row.is_reached !== true' }, { id: reopen_project_milestone, label: Reopen, icon: undo, show_if: 'row.is_reached === true' }, { id: delete_project_milestone, label: Delete, icon: trash, variant: danger }] }
    row_key: id
    empty_state: { title: No milestones found. Let's create one!, description: Track major progress points that must be reached to achieve success. }
