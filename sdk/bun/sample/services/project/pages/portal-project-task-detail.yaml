title: Task
page: { id: project-portal-project-task-detail, route: /my/projects/task/detail, breadcrumb: [Project, Projects, Task], auth: { require: [project.portal] } }
components:
  - type: Html
    tag: section
    class: project-portal-task-sidebar
    children:
      - { type: Html, tag: p, text: Task }
      - { type: Html, tag: p, text: History }
      - { type: Html, tag: p, text: Assignees }
      - { type: Html, tag: p, text: Customer }
  - type: OdooFormView
    source: portal_project_task_detail
    editable: false
    title_field: name
    subtitle_field: project_name
    status_field: stage
    labels: { back: Back to project }
    header_actions:
      - { id: back_to_portal_project, label: Back to project, variant: secondary, permission: project.portal }
    group_columns: 2
    groups:
      - title: Task
        fields:
          - { field: project_name, label: Project }
          - { field: milestone_name, label: Milestone }
          - { field: assignee, label: Assignees }
          - { field: customer_name, label: Customer }
      - title: Details
        fields:
          - { field: priority, label: Priority, type: StatusChip }
          - { field: due_date, label: Deadline }
          - { field: allocated_time, label: Allocated Time }
    notebook:
      active: description
      tabs:
        - id: description
          label: Description
          fields: [{ field: description, label: Description, type: textarea, wide: true }]
        - id: communication
          label: Communication history
          fields: [{ field: communication_summary, label: Communication history, type: textarea, wide: true }]
