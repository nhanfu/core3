title: Activity Type
page: { id: activity-type-detail, route: /project-activity-types/detail, breadcrumb: [Project, Configuration, Activity Types, Activity Type], auth: { require: [project.manage] } }
components:
  - type: OdooFormView
    source: project_activity_type_detail
    title_field: name
    status_field: active
    status_colors: { true: green, false: neutral }
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit, workflowStatus: Status }
    header_actions:
      - { id: back_to_project_activity_types, label: Activity Types, variant: secondary, permission: project.manage }
      - { id: edit_project_activity_type, label: Edit, variant: primary, permission: project.manage }
      - { id: archive_project_activity_type, label: Archive, variant: danger, permission: project.manage, show_if: 'record.active === true && record.id !== "project-activity-type-todo"' }
      - { id: unarchive_project_activity_type, label: Restore, variant: secondary, permission: project.manage, show_if: 'record.active === false' }
      - { id: delete_project_activity_type, label: Delete, variant: danger, permission: project.manage, confirm: Delete this activity type?, show_if: 'record.id !== "project-activity-type-todo"' }
    group_columns: 2
    groups:
      - title: Activity Settings
        fields:
          - { field: name, label: Name }
          - { field: category, label: Action }
          - { field: default_user_name, label: Default User }
          - { field: summary, label: Default Summary }
          - { field: delay_count, label: Schedule, type: number }
          - { field: delay_unit, label: Delay Units }
          - { field: delay_from, label: Delay Type }
      - title: Next Activity
        fields:
          - { field: chaining_type, label: Chaining Type }
          - { field: suggested_next_summary, label: Suggest }
          - { field: res_model, label: Model }
    notebook:
      active: note
      tabs:
        - { id: note, label: Default Note, fields: [{ field: default_note, label: Default Note, type: textarea, wide: true }] }
actions:
  - id: back_to_project_activity_types
    type: navigate
    permission: project.manage
    navigate_to: /project-activity-types
