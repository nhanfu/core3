version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS projects (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        customer_name VARCHAR, project_manager VARCHAR, description VARCHAR, planned_hours DECIMAL(18,3) NOT NULL DEFAULT 0,
        spent_hours DECIMAL(18,3) NOT NULL DEFAULT 0, start_date DATE, end_date DATE,
        state VARCHAR NOT NULL DEFAULT 'Draft', row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS project_milestones (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), project_id VARCHAR NOT NULL,
        name VARCHAR NOT NULL, due_date DATE, state VARCHAR NOT NULL DEFAULT 'Open'
      );
      CREATE TABLE IF NOT EXISTS project_tasks (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), project_id VARCHAR NOT NULL,
        project_name VARCHAR NOT NULL, name VARCHAR NOT NULL, assignee VARCHAR, milestone_name VARCHAR,
        priority VARCHAR NOT NULL DEFAULT 'Normal', planned_hours DECIMAL(18,3) NOT NULL DEFAULT 0,
        spent_hours DECIMAL(18,3) NOT NULL DEFAULT 0, state VARCHAR NOT NULL DEFAULT 'Todo',
        due_date DATE, row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS projects_state_idx ON projects(state);
      CREATE INDEX IF NOT EXISTS project_tasks_project_idx ON project_tasks(project_id);
      CREATE INDEX IF NOT EXISTS project_tasks_state_idx ON project_tasks(state);
    down: |
      DROP TABLE IF EXISTS project_tasks;
      DROP TABLE IF EXISTS project_milestones;
      DROP TABLE IF EXISTS projects;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
