      CREATE TABLE IF NOT EXISTS project_configuration_stages (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE, sequence INTEGER NOT NULL DEFAULT 10,
        active BOOLEAN NOT NULL DEFAULT TRUE, fold BOOLEAN NOT NULL DEFAULT FALSE,
        color INTEGER NOT NULL DEFAULT 0, company_name VARCHAR
      );
      CREATE TABLE IF NOT EXISTS project_configuration_tags (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE, color INTEGER NOT NULL DEFAULT 0
      );
      CREATE TABLE IF NOT EXISTS project_configuration_roles (
