version: 0.0.10
kind: schema
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS project_activity_plans (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE,
        res_model VARCHAR NOT NULL,
        company_name VARCHAR,
        active BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
      CREATE TABLE IF NOT EXISTS project_activity_plan_steps (
        id VARCHAR PRIMARY KEY,
        plan_id VARCHAR NOT NULL,
        row_version BIGINT NOT NULL DEFAULT 1,
        sequence INTEGER NOT NULL DEFAULT 10,
        activity_type_name VARCHAR NOT NULL,
        summary VARCHAR,
        responsible_type VARCHAR NOT NULL DEFAULT 'on_demand',
        responsible_name VARCHAR,
        delay_count INTEGER NOT NULL DEFAULT 0,
        delay_unit VARCHAR NOT NULL DEFAULT 'days',
        delay_from VARCHAR NOT NULL DEFAULT 'before_plan_date',
        next_activities VARCHAR
      );
      INSERT INTO project_activity_plans
        (id, name, res_model, company_name, active, created_at)
      VALUES
