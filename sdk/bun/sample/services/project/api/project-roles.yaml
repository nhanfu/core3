page: { id: project-roles }
datasources:
  - id: project_configuration_roles
    permission: project.manage
    error_states: { transport_error: { status: 503, code: PROJECT_ROLES_UNAVAILABLE, message: Project roles are temporarily unavailable. } }
    query: "SELECT id, row_version, name, sequence, active, color FROM project_configuration_roles WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND ((:active IS NULL AND active = TRUE) OR (:active = 'active' AND active = TRUE) OR (:active = 'archived' AND active = FALSE)) AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY sequence, name, id"
actions:
  - id: create_project_role
    type: server_form
    permission: project.manage
    title: New Project Role
    action: project.roles.create
    handler: yaml_mutation
    operation: create
    refresh: [project_configuration_roles]
    mutation: { operation: insert, table: project_configuration_roles, generated: [id], fields: [name, sequence, color, active], required: [name], defaults: { sequence: 50, color: 0, active: true }, guards: [{ query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM project_configuration_roles WHERE LOWER(name) = LOWER(:name))", status: 409, code: PROJECT_ROLE_NAME_EXISTS, message: A project role with this name already exists. }], result: { query: "SELECT * FROM project_configuration_roles WHERE id = :id" } }
    fields: [{ field: name, label: Name, type: text, required: true }, { field: sequence, label: Sequence, type: number, default: 50 }, { field: color, label: Color, type: number }]
  - id: edit_project_role
    type: server_form
    permission: project.manage
    title: Edit Project Role
    action: project.roles.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [project_configuration_roles]
    mutation: { operation: update, table: project_configuration_roles, fields: [name, sequence, color], required: [name], guards: [{ query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM project_configuration_roles WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: PROJECT_ROLE_NAME_EXISTS, message: A project role with this name already exists. }], result: { query: "SELECT * FROM project_configuration_roles WHERE id = :id" } }
    fields: [{ field: name, label: Name, type: text, required: true }, { field: sequence, label: Sequence, type: number }, { field: color, label: Color, type: number }]
  - id: archive_project_role
    type: server
    permission: project.manage
    action: project.roles.archive
    handler: yaml_mutation
    operation: update
    refresh: [project_configuration_roles]
    params: { values: { active: false } }
    mutation: { operation: update, table: project_configuration_roles, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM project_configuration_roles WHERE id = :id" } }
  - id: unarchive_project_role
    type: server
    permission: project.manage
    action: project.roles.unarchive
    handler: yaml_mutation
    operation: update
    refresh: [project_configuration_roles]
    params: { values: { active: true } }
    mutation: { operation: update, table: project_configuration_roles, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM project_configuration_roles WHERE id = :id" } }
  - id: delete_project_role
    type: server
    permission: project.manage
    action: project.roles.delete
    handler: yaml_mutation
    operation: delete
    refresh: [project_configuration_roles]
    mutation: { operation: delete, table: project_configuration_roles, concurrency: { required: true } }
