page: { id: project-all-tasks }
datasources:
  - id: project_all_task_states
    single: false
    permission: project.read
    query: "SELECT value, label FROM (VALUES ('Todo','To do'), ('In Progress','In progress'), ('Done','Done'), ('Cancelled','Cancelled')) states(value, label)"
  - id: project_all_tasks
    single: false
    permission: project.read
    workflow: project_tasks
    error_states: { transport_error: { status: 503, code: PROJECT_ALL_TASKS_UNAVAILABLE, message: All tasks are temporarily unavailable. } }
    query: "SELECT t.id, t.row_version, t.project_id, t.project_name, t.name, t.stage, COALESCE(t.assignee, 'Unassigned') AS assignee, t.milestone_name, t.priority, t.planned_hours, t.spent_hours, t.state, CAST(t.due_date AS VARCHAR) AS due_date FROM project_tasks t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR COALESCE(t.assignee, '') ILIKE '%' || :q || '%') AND (:state IS NULL OR :state = '' OR (:state = 'open' AND t.state IN ('Todo', 'In Progress')) OR t.state = :state) AND (:priority IS NULL OR :priority = '' OR t.priority = :priority) AND (:stage IS NULL OR :stage = '' OR t.stage = :stage) AND COALESCE(t.active, TRUE) = TRUE ORDER BY t.due_date NULLS LAST, t.id"
