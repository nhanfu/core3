page: { id: projects }
datasources:
  - id: project_states
    single: false
    permission: project.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Active','Active'), ('Completed','Completed'), ('Cancelled','Cancelled')) states(value, label)"
  - id: project_stages
    single: false
    permission: project.read
    query: "SELECT id AS value, name AS label FROM project_stages WHERE active = TRUE ORDER BY sequence, name"
  - id: projects
    single: false
    permission: project.read
    query: "SELECT p.id, p.row_version, p.name, p.customer_name, p.project_manager, COALESCE(p.stage, 'Planning') AS stage, p.planned_hours, p.spent_hours, p.state, CAST(p.start_date AS VARCHAR) AS start_date, CAST(p.end_date AS VARCHAR) AS end_date, COUNT(t.id) AS task_count, COALESCE(ROUND(100.0 * COUNT(t.id) FILTER (WHERE t.state = 'Done') / NULLIF(COUNT(t.id), 0)), 0) AS progress, COALESCE(p.favorite, FALSE) AS favorite FROM projects p LEFT JOIN project_tasks t ON t.project_id = p.id WHERE (:q IS NULL OR p.name ILIKE '%' || :q || '%' OR p.customer_name ILIKE '%' || :q || '%') AND (:state IS NULL OR p.state = :state) AND (:stage IS NULL OR p.stage = :stage) AND COALESCE(p.archived, FALSE) = FALSE AND COALESCE(p.is_template, FALSE) = FALSE GROUP BY p.id, p.row_version, p.name, p.customer_name, p.project_manager, p.stage, p.planned_hours, p.spent_hours, p.state, p.start_date, p.end_date, p.favorite ORDER BY p.favorite DESC, p.start_date DESC, p.id"
