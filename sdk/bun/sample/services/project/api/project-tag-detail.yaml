page: { id: project-tag-detail }
datasources:
  - id: project_configuration_tag_detail
    single: true
    permission: project.manage
    error_states: { transport_error: { status: 503, code: PROJECT_TAG_DETAIL_UNAVAILABLE, message: Project tag details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, color FROM project_configuration_tags WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
actions:
  - id: edit_project_tag
    type: server_form
    permission: project.manage
    title: Edit Tag
    action: project.tags.update
    handler: yaml_mutation
    operation: update
    refresh: [project_configuration_tag_detail]
    mutation: { operation: update, table: project_configuration_tags, fields: [name, color], required: [name], guards: [{ query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM project_configuration_tags WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: PROJECT_TAG_NAME_EXISTS, message: A tag with this name already exists. }], result: { query: "SELECT * FROM project_configuration_tags WHERE id = :id" } }
    fields: [{ field: name, label: Name, type: text, required: true }, { field: color, label: Color, type: number }]
