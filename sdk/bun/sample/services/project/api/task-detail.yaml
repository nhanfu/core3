page: { id: project-task-detail }
datasources:
  - id: project_task_detail
    single: true
    permission: project.read
    workflow: project_tasks
    error_states: { transport_error: { status: 503, code: PROJECT_TASK_DETAIL_UNAVAILABLE, message: Task details are temporarily unavailable. } }
    query: "SELECT t.id, t.row_version, t.project_id, t.project_name, t.name, t.stage, t.assignee, t.priority, t.description, t.milestone_name, COALESCE(t.customer_name, p.customer_name) AS customer_name, COALESCE(t.company_name, 'Core3 Demo Company') AS company_name, COALESCE(t.tags, '') AS tags, COALESCE(t.subtask_summary, '0 / 0 (0%)') AS subtask_summary, COALESCE(t.subtask_names, '') AS subtask_names, COALESCE(t.blocked_by_summary, 'None') AS blocked_by_summary, COALESCE(t.blocked_by_names, '') AS blocked_by_names, t.planned_hours, t.spent_hours, t.state, COALESCE(t.active, TRUE) AS active, CAST(t.due_date AS VARCHAR) AS due_date, CAST(t.created_at AS VARCHAR) AS created_at FROM project_tasks t LEFT JOIN projects p ON p.id = t.project_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.id = :id"
  - id: project_task_timesheets
    type: service
    service: yaml.service.timesheets
    operation: timesheets.entries.by_task
    service_params: { task_id: id, fixture_state: fixture_state }
    permission: timesheets.read
  - id: project_task_attachments
    permission: project.read
    query: "SELECT a.id, a.task_id, a.company_name, a.file_name, a.mime_type, a.size_bytes, a.uploaded_by, CAST(a.created_at AS VARCHAR) AS created_at FROM project_task_attachments a JOIN project_tasks t ON t.id = a.task_id WHERE t.id = :id AND t.company_name = :current_company_name ORDER BY a.created_at DESC, a.id"
  - id: project_task_dependencies
    permission: project.read
    error_states: { transport_error: { status: 503, code: PROJECT_TASK_DEPENDENCIES_UNAVAILABLE, message: Task dependencies are temporarily unavailable. } }
    query: "SELECT d.id, d.row_version, d.task_id, d.depends_on_id, t.name, COALESCE(t.assignee, 'Unassigned') AS assignee, t.project_name, COALESCE(t.stage, 'Planning') AS stage, t.state, t.priority, CAST(t.due_date AS VARCHAR) AS due_date FROM project_task_dependencies d JOIN project_tasks owner ON owner.id = d.task_id JOIN project_tasks t ON t.id = d.depends_on_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND d.task_id = :id AND COALESCE(owner.active, TRUE) = TRUE AND COALESCE(t.active, TRUE) = TRUE AND (COALESCE(:current_company_name, '') = '' OR COALESCE(owner.company_name, :current_company_name) = :current_company_name) AND (COALESCE(:current_company_name, '') = '' OR COALESCE(t.company_name, :current_company_name) = :current_company_name) AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.assignee ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.state ILIKE '%' || :q || '%') ORDER BY t.name, t.id"
  - id: project_task_dependency_lookup
    permission: project.read
    query: "SELECT t.id AS value, t.name || ' · ' || t.project_name AS label FROM project_tasks t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.id <> :id AND COALESCE(t.active, TRUE) = TRUE AND (COALESCE(:current_company_name, '') = '' OR COALESCE(t.company_name, :current_company_name) = :current_company_name) AND NOT EXISTS (SELECT 1 FROM project_task_dependencies d WHERE d.task_id = :id AND d.depends_on_id = t.id) ORDER BY t.name, t.id"
actions:
  - id: open_task_timesheets
    type: navigate
    permission: timesheets.read
    navigate_to: /task-timesheets
    params: { task_id: '{state.id}' }
  - id: edit_task
    type: server_form
    permission: project.write
    title: Edit Task
    action: project.tasks.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [project_task_detail, project_tasks_all, project_tasks_detail]
    mutation:
      operation: update
      table: project_tasks
      fields: [name, assignee, milestone_name, priority, description, due_date, planned_hours]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :id", status: 404, code: PROJECT_TASK_NOT_FOUND, message: Task was not found. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:planned_hours, 0) >= 0", status: 422, code: PROJECT_TASK_HOURS_INVALID, message: Allocated Time cannot be negative. }
      result: { query: "SELECT * FROM project_tasks WHERE id = :id" }
    fields:
      - { field: name, label: Title, type: text, required: true }
      - { field: assignee, label: Assignees, type: text }
      - { field: milestone_name, label: Milestone, type: text }
      - { field: priority, label: Priority, type: select, options: [{ value: Low, label: Low }, { value: Normal, label: Medium }, { value: High, label: High }, { value: Urgent, label: Urgent }] }
      - { field: description, label: Description, type: textarea, wide: true }
      - { field: due_date, label: Deadline, type: date }
      - { field: planned_hours, label: Allocated Time, type: number }
  - id: upload_project_task_attachment
    type: upload
    action: project.tasks.attachments.upload
    handler: attachment_metadata
    permission: project.write
    kind: project_task_attachment
    params: { task_id: '{state.project_task_detail.id}', expected_row_version: '{state.project_task_detail.row_version}' }
    refresh: [project_task_attachments]
    mutation:
      generated: [attachment_id]
      guards:
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :task_id", status: 404, code: PROJECT_TASK_NOT_FOUND, message: Task was not found. }
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :task_id AND company_name = :current_company_name", status: 403, code: PROJECT_TASK_COMPANY_SCOPE_REQUIRED, message: Task is outside the current company. }
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :task_id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Task was changed by another user. Reload it before uploading. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:fileName, '') <> '' AND COALESCE(:mimeType, '') <> '' AND COALESCE(:sizeBytes, -1) >= 0", status: 422, code: PROJECT_TASK_ATTACHMENT_INVALID, message: A valid attachment is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM project_task_attachments WHERE task_id = :task_id AND lower(file_name) = lower(:fileName))", status: 409, code: PROJECT_TASK_ATTACHMENT_DUPLICATE, message: This attachment already exists on the task. }
      steps:
        - { query: "INSERT INTO project_task_attachments(id, task_id, company_name, file_name, mime_type, size_bytes, storage_key, uploaded_by) SELECT :attachment_id, t.id, t.company_name, :fileName, :mimeType, :sizeBytes, :storageKey, :current_user_id FROM project_tasks t WHERE t.id = :task_id", expect_changed: true, status: 404, code: PROJECT_TASK_NOT_FOUND, message: Task was not found. }
      result: { query: "SELECT id, task_id, company_name, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM project_task_attachments WHERE id = :attachment_id" }
  - id: download_project_task_attachment
    type: download
    permission: project.read
    kind: project_task_attachment
  - id: add_project_task_dependency
    type: server_form
    permission: project.write
    title: Add Blocked By Task
    action: project.tasks.dependencies.add
    handler: line_item
    operation: create
    domain: project_task
    params: { id: '{state.project_task_detail.id}' }
    refresh: [project_task_detail, project_task_dependencies, project_task_dependency_lookup]
    fields:
      - { field: depends_on_id, label: Blocked By, type: select, options_source: project_task_dependency_lookup, required: true }
    mutation:
      generated: [relation_id]
      before_steps:
        - { query: "SELECT 'project-task-dependency-' || CAST(:id AS VARCHAR) || '-' || CAST(:depends_on_id AS VARCHAR) AS relation_id", assign: true }
      guards:
        - { query: "SELECT id FROM project_tasks WHERE id = :id AND row_version = :parent_expected_row_version AND COALESCE(active, TRUE) = TRUE", status: 409, code: STALE_RECORD, message: The task changed; reload before adding a dependency. }
        - { query: "SELECT id FROM project_tasks WHERE id = :depends_on_id AND COALESCE(active, TRUE) = TRUE AND (COALESCE(:current_company_name, '') = '' OR COALESCE(company_name, :current_company_name) = :current_company_name)", status: 422, code: PROJECT_TASK_DEPENDENCY_INVALID, message: Select an active task in the current company. }
        - { query: "SELECT 1 AS ok WHERE :id <> :depends_on_id", status: 422, code: PROJECT_TASK_DEPENDENCY_SELF, message: A task cannot depend on itself. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM project_task_dependencies WHERE task_id = :id AND depends_on_id = :depends_on_id)", status: 409, code: PROJECT_TASK_DEPENDENCY_EXISTS, message: This blocked-by task is already assigned. }
        - { query: "WITH RECURSIVE dependency_chain(task_id, depends_on_id) AS (SELECT task_id, depends_on_id FROM project_task_dependencies WHERE task_id = :depends_on_id UNION ALL SELECT d.task_id, d.depends_on_id FROM project_task_dependencies d JOIN dependency_chain c ON d.task_id = c.depends_on_id) SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM dependency_chain WHERE depends_on_id = :id)", status: 422, code: PROJECT_TASK_DEPENDENCY_CYCLE, message: This dependency would create a cycle. }
      steps:
        - { query: "INSERT INTO project_task_dependencies(id, task_id, depends_on_id, row_version, created_at) VALUES(:relation_id, :id, :depends_on_id, 1, TIMESTAMP '2026-01-15 00:00:00')" }
        - { query: "UPDATE project_tasks SET blocked_by_summary = CASE WHEN (SELECT COUNT(*) FROM project_task_dependencies WHERE task_id = :id) = 0 THEN 'None' ELSE CAST((SELECT COUNT(*) FROM project_task_dependencies WHERE task_id = :id) AS VARCHAR) || ' task(s)' END, blocked_by_names = COALESCE((SELECT STRING_AGG(t.name, ', ' ORDER BY t.name, t.id) FROM project_task_dependencies d JOIN project_tasks t ON t.id = d.depends_on_id WHERE d.task_id = :id), ''), row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The task changed while adding the dependency. Reload before continuing. }
      result: { query: "SELECT d.id, d.row_version, d.task_id, d.depends_on_id, t.name, COALESCE(t.assignee, 'Unassigned') AS assignee, t.project_name, COALESCE(t.stage, 'Planning') AS stage, t.state, t.priority, CAST(t.due_date AS VARCHAR) AS due_date FROM project_task_dependencies d JOIN project_tasks t ON t.id = d.depends_on_id WHERE d.id = :relation_id" }
  - id: remove_project_task_dependency
    type: server
    permission: project.write
    action: project.tasks.dependencies.remove
    handler: line_item
    operation: delete
    domain: project_task
    params: { id: '{state.project_task_detail.id}', line_id: '{row.id}' }
    confirm: Remove this blocked-by task?
    refresh: [project_task_detail, project_task_dependencies, project_task_dependency_lookup]
    mutation:
      guards:
        - { query: "SELECT id FROM project_tasks WHERE id = :id AND row_version = :parent_expected_row_version AND COALESCE(active, TRUE) = TRUE", status: 409, code: STALE_RECORD, message: The task changed; reload before removing a dependency. }
        - { query: "SELECT id FROM project_task_dependencies WHERE id = :line_id AND task_id = :id AND row_version = :expected_row_version", status: 409, code: PROJECT_TASK_DEPENDENCY_STALE, message: This dependency changed or was removed; reload before deleting. }
      steps:
        - { query: "DELETE FROM project_task_dependencies WHERE id = :line_id AND task_id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: PROJECT_TASK_DEPENDENCY_STALE, message: This dependency changed or was removed; reload before deleting. }
        - { query: "UPDATE project_tasks SET blocked_by_summary = CASE WHEN (SELECT COUNT(*) FROM project_task_dependencies WHERE task_id = :id) = 0 THEN 'None' ELSE CAST((SELECT COUNT(*) FROM project_task_dependencies WHERE task_id = :id) AS VARCHAR) || ' task(s)' END, blocked_by_names = COALESCE((SELECT STRING_AGG(t.name, ', ' ORDER BY t.name, t.id) FROM project_task_dependencies d JOIN project_tasks t ON t.id = d.depends_on_id WHERE d.task_id = :id), ''), row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The task changed while removing the dependency. Reload before continuing. }
      result: { query: "SELECT true AS deleted, :line_id AS id" }
  - id: start_task
    type: server
    permission: project.write
    action: project.tasks.start
    handler: yaml_mutation
    operation: start
    params: { state: In Progress }
    refresh: [project_task_detail, project_tasks_all, project_tasks_detail]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :id", status: 404, code: PROJECT_TASK_NOT_FOUND, message: Task was not found. }
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :id AND state = 'Todo'", status: 409, code: PROJECT_TASK_INVALID_TRANSITION, message: Only To do tasks can be started. }
      steps: [{ query: "UPDATE project_tasks SET state = 'In Progress', row_version = row_version + 1 WHERE id = :id AND state = 'Todo' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: Task was changed by another user. Reload it before starting. }]
      result: { query: "SELECT * FROM project_tasks WHERE id = :id" }
  - id: complete_task
    type: server
    permission: project.write
    action: project.tasks.complete
    handler: yaml_mutation
    operation: complete
    params: { state: Done }
    refresh: [project_task_detail, project_tasks_all, project_tasks_detail]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :id", status: 404, code: PROJECT_TASK_NOT_FOUND, message: Task was not found. }
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :id AND state = 'In Progress'", status: 409, code: PROJECT_TASK_INVALID_TRANSITION, message: Only In progress tasks can be marked done. }
      steps: [{ query: "UPDATE project_tasks SET state = 'Done', row_version = row_version + 1 WHERE id = :id AND state = 'In Progress' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: Task was changed by another user. Reload it before completing. }]
      result: { query: "SELECT * FROM project_tasks WHERE id = :id" }
  - id: cancel_task
    type: server
    permission: project.manage
    action: project.tasks.cancel
    handler: yaml_mutation
    operation: cancel
    params: { state: Cancelled }
    refresh: [project_task_detail, project_tasks_all, project_tasks_detail]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :id", status: 404, code: PROJECT_TASK_NOT_FOUND, message: Task was not found. }
        - { query: "SELECT 1 AS ok FROM project_tasks WHERE id = :id AND state IN ('Todo', 'In Progress')", status: 409, code: PROJECT_TASK_INVALID_TRANSITION, message: Only open tasks can be cancelled. }
      steps: [{ query: "UPDATE project_tasks SET state = 'Cancelled', row_version = row_version + 1 WHERE id = :id AND state IN ('Todo', 'In Progress') AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: Task was changed by another user. Reload it before cancelling. }]
      result: { query: "SELECT * FROM project_tasks WHERE id = :id" }
