id: time-off
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  time_off:
    path: /time-off
    label: Time Off
    icon: calendar
    permission: time_off.read
  groups:
    - id: requests
      label: Requests
      items:
        - { path: /leave-requests, label: Leave Requests, icon: calendar, permission: time_off.read }
        - { path: /leave-types, label: Leave Types, icon: settings, permission: time_off.manage }
    - id: reporting
      label: Reporting
      items:
        - { path: /time-off-reporting/by-employee, label: By Employee, icon: chart, permission: time_off.read }
        - { path: /time-off-analysis, label: Time Off Analysis, icon: chart, permission: time_off.read }
    - id: management
      label: Management
      items:
        - { path: /time-off-allocations, label: Allocations, icon: calendar, permission: time_off.read }
        - { path: /time-off-approval, label: All Time Off, icon: calendar, permission: time_off.manage }
        - { path: /time-off-overview, label: Overview, icon: calendar, permission: time_off.read }
    - id: my-time
      label: My Time
      items:
        - { path: /my-time-off, label: My Time Off, icon: calendar, permission: time_off.read }
        - { path: /my-allocations, label: My Allocations, icon: calendar, permission: time_off.read }
    - id: configuration
      label: Configuration
      items:
        - { path: /leave-types, label: Time Off Types, icon: settings, permission: time_off.manage }
        - { path: /accrual-plans, label: Accrual Plans, icon: chart, permission: time_off.manage }
        - { path: /public-holidays, label: Public Holidays, icon: calendar, permission: time_off.manage }
        - { path: /mandatory-days, label: Mandatory Days, icon: calendar, permission: time_off.manage }
