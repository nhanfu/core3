title: Allocations
page: { id: time-off-allocations, route: /time-off-allocations, breadcrumb: [Human Resources, Time Off, Allocations], auth: { require: [time_off.read] } }
toolbar:
  - { id: create_allocation, label: New, action: create_allocation, permission: time_off.manage, variant: primary }
components:
  - type: ListView
    variant: odoo
    source: time_off_allocations
    create_action: create_allocation
    create_label: New allocation
    search: { label: Search allocations, placeholder: Search employee or allocation... }
    views:
      - id: list
        label: List
        icon: table
      - id: card
        label: Cards
        icon: grid
        card: { title: name, subtitle: employee_name, fields: [{ field: leave_type_name, label: Type }, { field: days, label: Days }, { field: state, label: Status }] }
    columns:
      - { field: name, label: Allocation, type: PrimaryEntityCell }
      - { field: employee_name, label: Employee }
      - { field: leave_type_name, label: Time Off Type }
      - { field: days, label: Amount, align: right }
      - { field: date_from, label: Start }
      - { field: date_to, label: End }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
actions:
  - id: create_allocation
    type: server_form
    permission: time_off.manage
    title: New allocation
    action: time_off.allocations.create
    handler: yaml_mutation
    operation: create
    refresh: [time_off_allocations]
    mutation:
      operation: insert
      table: leave_allocations
      fields: [name, employee_id, employee_name, leave_type_id, leave_type_name, days, date_from, date_to, state, reason]
      required: [name, employee_id, employee_name, leave_type_id, leave_type_name, days, date_from, date_to]
      defaults: { state: Draft }
      result: { query: "SELECT * FROM leave_allocations WHERE id = :id" }
    fields:
      - { field: name, label: Allocation, type: text, required: true }
      - { field: employee_id, label: Employee ID, type: text, required: true }
      - { field: employee_name, label: Employee, type: text, required: true }
      - { field: leave_type_id, label: Time Off Type ID, type: text, required: true }
      - { field: leave_type_name, label: Time Off Type, type: text, required: true }
      - { field: days, label: Amount, type: number, required: true }
      - { field: date_from, label: Start date, type: date, required: true }
      - { field: date_to, label: End date, type: date }
      - { field: reason, label: Reason, type: text }
