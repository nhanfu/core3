title: Time Off Analysis
page: { id: time-off-analysis, breadcrumb: [Human Resources, Time Off, Analysis], auth: { require: [time_off.read] } }
components:
  - type: StatRow
    source: time_off_analysis_totals
    title: Leave overview
    stats: [{ label: Requests, field: request_count }, { label: Approved days, field: approved_days }, { label: Pending, field: pending_count }, { label: Employees, field: employee_count }]
  - type: Chart
    source: time_off_analysis_states
    title: Requests by status
    label_field: category
    value_field: request_count
    variant: bar
