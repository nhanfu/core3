title: Time Off Analysis
page: { id: time-off-analysis, breadcrumb: [Human Resources, Time Off, Analysis], auth: { require: [time_off.read] } }
components:
  - type: StatRow
    source: time_off_analysis_totals
    title: Leave overview
    stats: [{ label: Requests, field: request_count }, { label: Approved days, field: approved_days }, { label: Pending, field: pending_count }, { label: Employees, field: employee_count }]
  - type: Chart
    source: time_off_analysis_states
    title: Requests by status
    label_field: category
    value_field: request_count
    variant: bar
  - type: ListView
    variant: odoo
    source: time_off_analysis_states
    view_navigation: tabs
    views:
      - id: list
        label: List
        icon: table
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields: [{ field: category, column: Status }, { field: request_count, column: Requests }]
          default:
            rows: [category]
            measures: [{ field: request_count, aggregate: sum, label: Requests }]
    columns:
      - { field: category, label: Status, type: PrimaryEntityCell }
      - { field: request_count, label: Requests, align: right }
    page_size: 25
    row_key: category
