title: Time Off Types
page: { id: leave-types, route: /leave-types, breadcrumb: [Human Resources, Time Off, Time Off Types], auth: { require: [time_off.manage] } }
components:
  - type: ListView
    variant: odoo
    source: leave_types
    create_action: create_leave_type
    create_label: New leave type
    search: { label: Search leave types, placeholder: Search by name or code... }
    empty_state: { title: No time off types found, description: Create a time off type or adjust your search. }
    filters: [{ field: state, label: Status, options_source: leave_type_states }]
    view_navigation: tabs
    views:
      - id: list
        label: List
        icon: table
      - id: card
        label: Cards
        icon: grid
        card:
          title: name
          subtitle: code
          fields:
            - { field: allocation_days, label: Allocation days }
            - { field: state, label: Status }
    columns:
      - { field: name, label: Leave type, type: PrimaryEntityCell }
      - { field: code, label: Code }
      - { field: allocation_days, label: Allocation days, align: right }
      - { field: requires_approval, label: Approval required }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_open_action: view_leave_type
    row_double_click_action: view_leave_type
    row_actions: menu
actions:
  - id: create_leave_type
    type: server_form
    permission: time_off.manage
    title: New leave type
    action: time_off.types.create
    handler: yaml_mutation
    operation: create
    refresh: [leave_types]
    mutation:
      operation: insert
      table: leave_types
      fields: [name, code, allocation_days, requires_approval]
      required: [name, code]
      guards:
        - { query: "SELECT 1 AS ok WHERE CAST(CASE WHEN CAST(:allocation_days AS VARCHAR) = '' THEN '0' ELSE CAST(:allocation_days AS VARCHAR) END AS DECIMAL(18,3)) >= 0", status: 422, message: Allocation days must be zero or greater }
      result: { query: "SELECT * FROM leave_types WHERE id = :id" }
    fields:
      - { field: name, label: Leave type, type: text, required: true }
      - { field: code, label: Code, type: text, required: true }
      - { field: allocation_days, label: Allocation days, type: number }
      - { field: requires_approval, label: Approval required, type: checkbox }
