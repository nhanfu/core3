title: Accrual Plans
page: { id: accrual-plans, route: /accrual-plans, breadcrumb: [Human Resources, Time Off, Accrual Plans], auth: { require: [time_off.manage] } }
toolbar:
  - { id: create_accrual_plan, label: New, action: create_accrual_plan, permission: time_off.manage, variant: primary }
components:
  - type: ListView
    variant: odoo
    source: accrual_plans
    create_action: create_accrual_plan
    create_label: New accrual plan
    search: { label: Search accrual plans, placeholder: Search plans... }
    empty_state: { title: No accrual plans found, description: Create an accrual plan or adjust your search. }
    filters: [{ field: state, label: Status, options_source: accrual_plan_states }]
    view_navigation: tabs
    views:
      - id: list
        label: List
        icon: table
      - id: card
        label: Cards
        icon: grid
        card: { title: name, fields: [{ field: level_count, label: Levels }, { field: employee_count, label: Employees }, { field: state, label: Status }] }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell }
      - { field: level_count, label: Levels, align: right }
      - { field: employee_count, label: Employees, align: right }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_open_action: view_accrual_plan
    row_double_click_action: view_accrual_plan
actions:
  - id: create_accrual_plan
    type: server_form
    permission: time_off.manage
    title: New accrual plan
    action: time_off.accrual_plans.create
    handler: yaml_mutation
    operation: create
    refresh: [accrual_plans]
    mutation:
      operation: insert
      table: accrual_plans
      fields: [name, level_count, employee_count, state]
      required: [name]
      defaults: { level_count: 0, employee_count: 0, state: Active }
      guards:
        - { query: "SELECT 1 AS ok WHERE CAST(CASE WHEN CAST(:level_count AS VARCHAR) = '' THEN '0' ELSE CAST(:level_count AS VARCHAR) END AS INTEGER) >= 0 AND CAST(CASE WHEN CAST(:employee_count AS VARCHAR) = '' THEN '0' ELSE CAST(:employee_count AS VARCHAR) END AS INTEGER) >= 0 AND CAST(:state AS VARCHAR) IN ('Active', 'Archived')", status: 422, message: Levels and employees must be zero or greater and status must be valid }
      result: { query: "SELECT * FROM accrual_plans WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: level_count, label: Levels, type: number }
      - { field: employee_count, label: Employees, type: number }
      - { field: state, label: Status, type: select, options_source: accrual_plan_states }
