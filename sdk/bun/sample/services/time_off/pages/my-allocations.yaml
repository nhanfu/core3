title: My Allocations
page: { id: my-allocations, route: /my-allocations, breadcrumb: [Human Resources, Time Off, My Allocations], auth: { require: [time_off.read] } }
toolbar:
  - { id: create_my_allocation, label: New allocation, action: create_my_allocation, permission: time_off.write, variant: primary }
components:
  - type: ListView
    variant: odoo
    source: my_allocations
    create_action: create_my_allocation
    create_label: New allocation
    search: { label: Search allocations, placeholder: Search allocation or type... }
    empty_state: { title: Create a new allocation request, description: You can create a new allocation or follow the approval status of the current ones. }
    view_navigation: tabs
    views:
      - id: list
        label: List
        icon: table
      - id: card
        label: Cards
        icon: grid
        card: { title: name, subtitle: leave_type_name, fields: [{ field: days, label: Amount }, { field: state, label: Status }] }
      - id: activity
        label: Activity
        icon: activity
        mobile: false
        title_field: name
        subtitle_field: leave_type_name
        record_date_field: date_from
        record_end_date_field: date_to
        schedule_action: schedule_my_allocation_activity
        empty_cell_action: schedule_my_allocation_activity
        activity_types:
          - { id: todo, label: To-Do, icon: ✓ }
          - { id: email, label: Email, icon: ✉ }
          - { id: call, label: Call, icon: ☎ }
          - { id: meeting, label: Meeting, icon: ◉ }
          - { id: time_off_approval, label: Time Off Approval, icon: ✓ }
          - { id: time_off_second_approve, label: Time Off Second Approve, icon: ✓ }
          - { id: document, label: Document, icon: ▣ }
    columns:
      - { field: name, label: Allocation, type: PrimaryEntityCell }
      - { field: leave_type_name, label: Time Off Type }
      - { field: days, label: Amount, align: right }
      - { field: date_from, label: Start Date }
      - { field: date_to, label: End Date }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_open_action: view_my_allocation
