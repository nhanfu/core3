title: Leave Request
page: { id: leave-request-detail, breadcrumb: [Human Resources, Time Off, Detail], auth: { require: [time_off.read] } }
components:
  - type: OdooFormView
    source: leave_request_detail
    title_field: name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: Submitted, label: Submitted }, { value: Approved, label: Approved }, { value: Refused, label: Refused }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, Submitted: amber, Approved: green, Refused: red, Cancelled: violet }
    header_actions:
      - { id: submit_leave_request_detail, label: Submit, variant: primary, show_if: "row.state === 'Draft'" }
      - { id: approve_leave_request_detail, label: Approve, variant: primary, show_if: "row.state === 'Submitted'" }
      - { id: refuse_leave_request_detail, label: Refuse, variant: danger, show_if: "row.state === 'Submitted'" }
      - { id: cancel_leave_request_detail, label: Cancel, variant: danger, show_if: "row.state === 'Draft' || row.state === 'Submitted'" }
    group_columns: 2
    groups:
      - title: Leave
        fields: [{ field: name, label: Request }, { field: state, label: Status }, { field: employee_name, label: Employee }, { field: leave_type_name, label: Leave type }]
      - title: Dates and approval
        fields: [{ field: date_from, label: From }, { field: date_to, label: To }, { field: days, label: Days }, { field: approver, label: Approver }, { field: reason, label: Reason }]
