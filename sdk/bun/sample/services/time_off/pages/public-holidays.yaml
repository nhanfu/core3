title: Public Holidays
page: { id: public-holidays, route: /public-holidays, breadcrumb: [Human Resources, Time Off, Public Holidays], auth: { require: [time_off.manage] } }
toolbar:
  - { id: create_public_holiday, label: New, action: create_public_holiday, permission: time_off.manage, variant: primary }
components:
  - type: ListView
    variant: odoo
    source: public_holidays
    create_action: create_public_holiday
    create_label: New public holiday
    search: { label: Search public holidays, placeholder: Search holidays... }
    empty_state: { title: No public holidays found, description: Create a public holiday or adjust your search. }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell }
      - { field: date_from, label: Start date }
      - { field: date_to, label: End date }
      - { field: calendar_name, label: Working Hours }
    page_size: 50
    row_key: id
    row_open_action: view_public_holiday
    row_double_click_action: view_public_holiday
actions:
  - id: create_public_holiday
    type: server_form
    permission: time_off.manage
    title: New public holiday
    action: time_off.public_holidays.create
    handler: yaml_mutation
    operation: create
    refresh: [public_holidays]
    mutation:
      operation: insert
      table: public_holidays
      fields: [name, date_from, date_to, calendar_name]
      required: [name, date_from, date_to]
      defaults: { calendar_name: Standard 40 hours/week }
      guards:
        - { query: "SELECT 1 AS ok WHERE CAST(:date_to AS DATE) >= CAST(:date_from AS DATE)", status: 422, message: End date must be on or after start date }
      result: { query: "SELECT * FROM public_holidays WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: date_from, label: Start date, type: date, required: true }
      - { field: date_to, label: End date, type: date, required: true }
      - { field: calendar_name, label: Working Hours, type: text }
