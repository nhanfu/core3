title: Public Holidays
page: { id: public-holidays, route: /public-holidays, breadcrumb: [Human Resources, Time Off, Public Holidays], auth: { require: [time_off.manage] } }
toolbar:
  - { id: create_public_holiday, label: New, action: create_public_holiday, permission: time_off.manage, variant: primary }
components:
  - type: ListView
    variant: odoo
    source: public_holidays
    responsive_card: true
    create_action: create_public_holiday
    create_label: New public holiday
    search: { label: Search public holidays, placeholder: Search name or working hours... }
    date_range:
      label: Period
      from_field: date_from
      to_field: date_to
      presets: [year, last_12_months, all]
      default_preset: year
      preset_labels: { year: This year, last_12_months: Last 12 months, all: All dates }
      validation_messages:
        invalid: Enter valid dates in YYYY-MM-DD format.
        start_before_end: The start date must be before the end date.
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - { id: card, label: Cards, icon: dashboard, mobile: true, card: { title: name, subtitle: calendar_name, fields: [{ field: date_from, label: Start date }, { field: date_to, label: End date }] } }
    empty_state: { title: No public holidays found, description: Create a public holiday or adjust your search. }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell }
      - { field: date_from, label: Start date }
      - { field: date_to, label: End date }
      - { field: calendar_name, label: Working Hours }
    page_size: 50
    row_key: id
    row_open_action: view_public_holiday
    row_double_click_action: view_public_holiday
    row_actions: menu
    actions:
      - { id: delete_public_holiday, label: Delete, permission: time_off.manage, variant: danger }
    empty_state: { title: No public holidays found, description: Create a public holiday or adjust your search or period. }
