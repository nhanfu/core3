page: { id: my-time-off }
datasources:
  - id: my_time_off_requests
    permission: time_off.read
    query: "SELECT r.id, r.name, r.employee_name, r.leave_type_name, CAST(r.date_from AS VARCHAR) AS date_from, CAST(r.date_to AS VARCHAR) AS date_to, r.days, r.state, r.reason, CASE r.state WHEN 'Draft' THEN 'todo' WHEN 'Submitted' THEN 'email' WHEN 'Approved' THEN 'meeting' WHEN 'Refused' THEN 'call' ELSE 'todo' END AS activity_type, CASE r.state WHEN 'Draft' THEN 'Complete your time off request' WHEN 'Submitted' THEN 'Await approval' WHEN 'Approved' THEN 'Prepare for time off' WHEN 'Refused' THEN 'Review refused request' ELSE 'Review time off request' END AS activity_summary, CAST(r.date_from AS VARCHAR) AS activity_date, COALESCE(r.approver, r.employee_name) AS activity_user, CASE r.state WHEN 'Refused' THEN 'overdue' WHEN 'Approved' THEN 'done' WHEN 'Draft' THEN 'today' ELSE 'planned' END AS activity_state, 1 AS activity_count FROM leave_requests r WHERE r.employee_name = 'Admin User' AND (:q IS NULL OR r.name ILIKE '%' || :q || '%' OR r.leave_type_name ILIKE '%' || :q || '%') ORDER BY r.date_from DESC"
