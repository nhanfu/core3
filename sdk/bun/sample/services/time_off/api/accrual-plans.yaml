page: { id: accrual-plans }
datasources:
  - id: accrual_plan_states
    permission: time_off.manage
    single: false
    query: "SELECT value, label FROM (VALUES ('Active','Active'), ('Archived','Archived')) states(value, label)"
  - id: accrual_plans
    permission: time_off.manage
    query: "SELECT id, name, level_count, employee_count, state FROM accrual_plans WHERE (:q IS NULL OR name ILIKE '%' || :q || '%') AND (:state IS NULL OR state = :state) ORDER BY name"
actions:
  - id: view_accrual_plan
    type: navigate
    permission: time_off.manage
    navigate_to: /accrual-plans/detail
    params: { id: '{row.id}' }
