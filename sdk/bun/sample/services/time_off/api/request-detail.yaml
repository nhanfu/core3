page: { id: leave-request-detail }
datasources:
  - id: leave_request_detail
    single: true
    permission: time_off.read
    error_states: { transport_error: { status: 503, code: TIME_OFF_LEAVE_DETAIL_UNAVAILABLE, message: Leave request details are temporarily unavailable. } }
    query: "SELECT r.id, r.row_version, r.name, r.employee_name, r.leave_type_name, CAST(r.date_from AS VARCHAR) AS date_from, CAST(r.date_to AS VARCHAR) AS date_to, r.days, r.reason, r.refusal_reason, r.cancellation_reason, r.approver, r.state, COALESCE(v.validation_type, 'manager') AS validation_type, a.first_approver, a.second_approver FROM leave_requests r LEFT JOIN time_off_leave_validation_types v ON v.leave_type_id = r.leave_type_id LEFT JOIN time_off_leave_approvals a ON a.request_id = r.id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND r.id = :id"
  - id: leave_request_detail_states
    permission: time_off.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Submitted'), ('Approved','Approved'), ('Refused','Refused'), ('Cancelled','Cancelled')) states(value, label)"
  - id: leave_request_attachments
    permission: time_off.read
    single: false
    error_states: { transport_error: { status: 503, code: TIME_OFF_LEAVE_ATTACHMENTS_UNAVAILABLE, message: Supporting documents are temporarily unavailable. } }
    query: "SELECT id, request_id, row_version, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM time_off_request_attachments WHERE request_id = :id AND active = TRUE ORDER BY created_at DESC, id"
actions:
  - { id: submit_leave_request_detail, type: server, permission: time_off.write, action: time_off.requests.submit, handler: order_transition, workflow: leave_requests, operation: submit, params: { id: '{state.id}' }, refresh: [leave_request_detail] }
  - { id: approve_leave_request_detail, type: server, permission: time_off.manage, action: time_off.requests.approve, handler: order_transition, workflow: leave_requests, operation: approve, params: { id: '{state.id}' }, refresh: [leave_request_detail] }
  - { id: approve_first_leave_request_detail, type: server, permission: time_off.manage, action: time_off.requests.approve_first, handler: order_transition, workflow: leave_requests, operation: approve_first, params: { id: '{state.id}' }, refresh: [leave_request_detail] }
  - { id: validate_leave_request_detail, type: server, permission: time_off.manage, action: time_off.requests.validate, handler: order_transition, workflow: leave_requests, operation: validate, params: { id: '{state.id}' }, refresh: [leave_request_detail] }
  - id: back_to_approval_leave_request_detail
    type: server
    permission: time_off.manage
    action: time_off.requests.back_to_approval
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', expected_row_version: '{state.row_version}' }
    refresh: [leave_request_detail]
    mutation:
      steps:
        - query: "UPDATE leave_balances SET used_days = used_days - (SELECT days FROM leave_requests WHERE id = :id) WHERE employee_id = (SELECT employee_id FROM leave_requests WHERE id = :id) AND leave_type_id = (SELECT leave_type_id FROM leave_requests WHERE id = :id) AND year = EXTRACT(YEAR FROM (SELECT date_from FROM leave_requests WHERE id = :id))"
          expect_changed: true
        - query: "UPDATE leave_requests SET state = 'Submitted', approver = NULL, row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version AND state = 'Approved'"
          expect_changed: true
          status: 409
          message: Leave request was changed by another user. Reload it before moving it back to approval.
      guards:
        - { query: "SELECT id FROM leave_requests WHERE id = :id", status: 404, code: TIME_OFF_LEAVE_NOT_FOUND, message: Time off request not found. }
        - { query: "SELECT r.id FROM leave_requests r JOIN leave_balances b ON b.employee_id = r.employee_id AND b.leave_type_id = r.leave_type_id AND b.year = EXTRACT(YEAR FROM r.date_from) WHERE r.id = :id AND r.row_version = :expected_row_version AND r.state = 'Approved' AND b.used_days >= r.days", status: 409, code: TIME_OFF_LEAVE_BACK_TO_APPROVAL_INVALID, message: Only an unchanged approved request with recorded leave usage can return to approval. }
      result: { query: "SELECT * FROM leave_requests WHERE id = :id" }
  - id: refuse_leave_request_detail
    type: server_form
    permission: time_off.manage
    title: Refuse Time Off
    action: time_off.requests.refuse
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', expected_row_version: '{state.row_version}', values: { state: Refused } }
    prefill: state.leave_request_detail
    refresh: [leave_request_detail]
    submit_label: Refuse
    cancel_label: Discard
    mutation:
      operation: update
      table: leave_requests
      fields: [state, refusal_reason]
      required: [refusal_reason]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM leave_requests WHERE id = :id", status: 404, code: TIME_OFF_LEAVE_NOT_FOUND, message: Time off request not found. }
        - { query: "SELECT id FROM leave_requests WHERE id = :id AND row_version = :expected_row_version AND state IN ('Submitted', 'Second Approval')", status: 409, code: TIME_OFF_LEAVE_REFUSE_INVALID, message: Only an unchanged pending time off request can be refused. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(COALESCE(:refusal_reason, '') AS VARCHAR))) BETWEEN 1 AND 500", status: 422, code: TIME_OFF_LEAVE_REFUSAL_REASON_INVALID, message: Enter a refusal reason of 500 characters or fewer. }
      result: { query: "SELECT * FROM leave_requests WHERE id = :id" }
    fields:
      - { field: state, label: Status, type: hidden, default: Refused }
      - { field: refusal_reason, label: Reason, type: textarea, required: true, placeholder: Why is this time off refused? }
  - id: upload_leave_request_attachment
    type: upload
    action: time_off.requests.attachments.upload
    handler: attachment_metadata
    permission: time_off.write
    kind: time_off_request_attachment
    params: { request_id: '{state.leave_request_detail.id}', expected_row_version: '{state.leave_request_detail.row_version}' }
    refresh: [leave_request_detail, leave_request_attachments]
    mutation:
      generated: [attachment_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: TIME_OFF_ATTACHMENT_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM leave_requests WHERE id = :request_id", status: 404, code: TIME_OFF_LEAVE_NOT_FOUND, message: Time off request not found. }
        - { query: "SELECT id FROM leave_requests WHERE id = :request_id AND row_version = :expected_row_version AND state = 'Submitted'", status: 409, code: TIME_OFF_ATTACHMENT_STATE_INVALID, message: Supporting documents can only be added to an unchanged submitted request. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:fileName AS VARCHAR))) BETWEEN 1 AND 255 AND CAST(:sizeBytes AS BIGINT) > 0 AND CAST(:sizeBytes AS BIGINT) <= 5242880", status: 422, code: TIME_OFF_ATTACHMENT_INVALID, message: Upload a non-empty attachment up to 5 MB. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM time_off_request_attachments WHERE request_id = :request_id AND active = TRUE AND LOWER(file_name) = LOWER(TRIM(CAST(:fileName AS VARCHAR))))", status: 409, code: TIME_OFF_ATTACHMENT_DUPLICATE, message: This supporting document already exists for the request. }
      steps:
        - { query: "INSERT INTO time_off_request_attachments(id, request_id, file_name, mime_type, size_bytes, storage_key, uploaded_by) VALUES(:attachment_id, :request_id, TRIM(CAST(:fileName AS VARCHAR)), :mimeType, CAST(:sizeBytes AS BIGINT), :storageKey, :current_user_id)", expect_changed: true, status: 404, code: TIME_OFF_LEAVE_NOT_FOUND, message: Time off request not found. }
        - { query: "UPDATE leave_requests SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :request_id AND row_version = :expected_row_version AND state = 'Submitted'", expect_changed: true, status: 409, code: TIME_OFF_ATTACHMENT_STALE, message: The request changed before the attachment was uploaded. }
      result: { query: "SELECT id, request_id, row_version, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM time_off_request_attachments WHERE id = :attachment_id" }
  - id: download_leave_request_attachment
    type: download
    permission: time_off.read
    kind: time_off_request_attachment
  - id: remove_leave_request_attachment
    type: server
    permission: time_off.write
    action: time_off.requests.attachments.remove
    handler: line_item
    operation: delete
    domain: time_off_request_attachment
    params: { id: '{state.leave_request_detail.id}', line_id: '{row.id}', parent_expected_row_version: '{state.leave_request_detail.row_version}' }
    refresh: [leave_request_detail, leave_request_attachments]
    mutation:
      guards:
        - { query: "SELECT id FROM leave_requests WHERE id = :id AND row_version = :parent_expected_row_version AND state = 'Submitted'", status: 409, code: TIME_OFF_ATTACHMENT_STALE, message: The request changed before the document was removed. Reload and try again. }
        - { query: "SELECT id FROM time_off_request_attachments WHERE id = :line_id AND request_id = :id AND active = TRUE AND row_version = :expected_row_version", status: 409, code: TIME_OFF_ATTACHMENT_STALE, message: This supporting document changed before it was removed. Reload and try again. }
      steps:
        - { query: "UPDATE time_off_request_attachments SET active = FALSE, row_version = row_version + 1 WHERE id = :line_id AND request_id = :id AND active = TRUE AND row_version = :expected_row_version", expect_changed: true, status: 409, code: TIME_OFF_ATTACHMENT_STALE, message: This supporting document changed before it was removed. Reload and try again. }
        - { query: "UPDATE leave_requests SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :parent_expected_row_version AND state = 'Submitted'", expect_changed: true, status: 409, code: TIME_OFF_ATTACHMENT_STALE, message: The request changed before the document was removed. }
      result: { query: "SELECT TRUE AS deleted, :line_id AS id" }
  - { id: cancel_leave_request_detail, type: server, permission: time_off.write, action: time_off.requests.cancel, handler: order_transition, workflow: leave_requests, operation: cancel, params: { id: '{state.id}' }, refresh: [leave_request_detail] }
  - id: delete_leave_request_detail
    type: server
    permission: time_off.write
    action: time_off.requests.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete draft leave request?'
    params: { id: '{state.id}', expected_row_version: '{state.row_version}' }
    refresh: [leave_request_detail, leave_requests]
    mutation:
      operation: delete
      table: leave_requests
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM leave_requests WHERE id = :id", status: 404, code: TIME_OFF_LEAVE_NOT_FOUND, message: Leave request not found. }
        - { query: "SELECT id FROM leave_requests WHERE id = :id AND row_version = :expected_row_version AND state = 'Draft'", status: 409, code: TIME_OFF_LEAVE_DELETE_INVALID, message: Only an unchanged draft leave request can be deleted. }
  - id: cancel_approved_leave_request_detail
    type: server_form
    permission: time_off.write
    title: Cancel Time Off
    action: time_off.requests.cancel_approved
    handler: yaml_mutation
    operation: update
    prefill: state.leave_request_detail
    params: { values: { state: Cancelled } }
    refresh: [leave_request_detail]
    modal_style: time_off_cancel
    mutation:
      operation: update
      table: leave_requests
      key_field: id
      fields: [state, cancellation_reason]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM leave_requests WHERE id = :id", status: 404, code: TIME_OFF_LEAVE_NOT_FOUND, message: Time off request not found. }
        - { query: "SELECT id FROM leave_requests WHERE id = :id AND row_version = :expected_row_version AND state = 'Approved'", status: 409, code: TIME_OFF_LEAVE_CANCEL_STALE, message: Only an unchanged approved time off request can be cancelled. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:cancellation_reason, '') AS VARCHAR)) <= 500", status: 422, code: TIME_OFF_LEAVE_CANCEL_REASON_INVALID, message: The cancellation reason must be 500 characters or fewer. }
      result: { query: "SELECT * FROM leave_requests WHERE id = :id" }
    fields:
      - { field: state, label: Status, type: hidden, default: Cancelled }
      - { field: cancellation_reason, label: Reason, type: textarea, placeholder: Why do you want to cancel this approved time off ? }
    submit_label: Cancel Time Off
    cancel_label: Discard
