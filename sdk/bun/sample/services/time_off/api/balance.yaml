page: { id: time-off-balance }
datasources:
  - id: time_off_balance_employees
    permission: time_off.manage
    single: false
    query: "SELECT DISTINCT employee_id AS value, employee_name AS label FROM leave_balances WHERE year = 2026 ORDER BY employee_name"
  - id: time_off_balance_types
    permission: time_off.manage
    single: false
    query: "SELECT DISTINCT leave_type_id AS value, leave_type_name AS label FROM leave_balances WHERE year = 2026 ORDER BY leave_type_name"
  - id: time_off_balance_report
    permission: time_off.manage
    pivot:
      fields: [employee_id, employee_name, leave_type_id, leave_type_name, allocation_days, taken_days, planned_days, remaining_days, allocation_hours, taken_hours, planned_hours, remaining_hours, date_from, date_to, request_count]
    error_states:
      transport_error: { status: 503, code: TIME_OFF_BALANCE_UNAVAILABLE, message: Balance data is temporarily unavailable }
    query: |
      WITH planned AS (
        SELECT employee_id, leave_type_id,
          SUM(days) FILTER (WHERE state = 'Submitted') AS planned_days,
          COUNT(*) AS request_count
        FROM leave_requests
        WHERE date_from >= DATE '2026-01-01' AND date_from < DATE '2027-01-01'
        GROUP BY employee_id, leave_type_id
      )
      SELECT
        b.id,
        b.employee_id,
        b.employee_name,
        b.leave_type_id,
        b.leave_type_name,
        CAST(b.allocated_days AS DOUBLE) AS allocation_days,
        CAST(b.used_days AS DOUBLE) AS taken_days,
        CAST(COALESCE(p.planned_days, 0) AS DOUBLE) AS planned_days,
        CAST(b.allocated_days - b.used_days - COALESCE(p.planned_days, 0) AS DOUBLE) AS remaining_days,
        CAST(b.allocated_days * 7.6 AS DOUBLE) AS allocation_hours,
        CAST(b.used_days * 7.6 AS DOUBLE) AS taken_hours,
        CAST(COALESCE(p.planned_days, 0) * 7.6 AS DOUBLE) AS planned_hours,
        CAST((b.allocated_days - b.used_days - COALESCE(p.planned_days, 0)) * 7.6 AS DOUBLE) AS remaining_hours,
        CAST('2026-01-01' AS DATE) AS date_from,
        CAST('2026-12-31' AS DATE) AS date_to,
        COALESCE(p.request_count, 0) AS request_count
      FROM leave_balances b
      LEFT JOIN planned p ON p.employee_id = b.employee_id AND p.leave_type_id = b.leave_type_id
      WHERE b.year = 2026
        AND (:fixture_state IS NULL OR :fixture_state <> 'transport_error')
        AND (CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END) = 1
        AND (:q IS NULL OR b.employee_name ILIKE '%' || :q || '%' OR b.leave_type_name ILIKE '%' || :q || '%')
        AND (:employee_id IS NULL OR :employee_id = '' OR b.employee_id = :employee_id)
        AND (:leave_type_id IS NULL OR :leave_type_id = '' OR b.leave_type_id = :leave_type_id)
      ORDER BY b.employee_name, b.leave_type_name
