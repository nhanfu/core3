page: { id: allocation-detail }
datasources:
  - id: allocation_states_detail
    permission: time_off.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Waiting For Me'), ('Approved','Approved'), ('Refused','Refused'), ('Cancelled','Cancelled')) states(value, label)"
  - id: allocation_detail
    single: true
    permission: time_off.read
    query: "SELECT id, row_version, name, employee_name, leave_type_name, days, CAST(date_from AS VARCHAR) AS date_from, CAST(date_to AS VARCHAR) AS date_to, state, reason FROM leave_allocations WHERE id = :id"
actions:
  - id: edit_allocation_detail
    type: server_form
    permission: time_off.manage
    title: Edit Allocation
    action: time_off.allocations.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    prefill: row
    refresh: [allocation_detail, time_off_allocations]
    mutation:
      operation: update
      table: leave_allocations
      fields: [name, employee_id, employee_name, leave_type_id, leave_type_name, days, date_from, date_to, reason]
      required: [name, employee_id, employee_name, leave_type_id, leave_type_name, days, date_from, date_to]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM leave_allocations WHERE id = :id", status: 404, code: TIME_OFF_ALLOCATION_NOT_FOUND, message: Allocation request not found. }
        - { query: "SELECT id FROM leave_allocations WHERE id = :id AND row_version = :expected_row_version AND state = 'Draft' AND COALESCE(balance_applied, FALSE) = FALSE", status: 409, code: TIME_OFF_ALLOCATION_EDIT_INVALID, message: Only an unchanged draft allocation can be edited. }
        - { query: "SELECT 1 AS ok FROM leave_types WHERE id = :leave_type_id AND name = :leave_type_name AND state = 'Active'", status: 422, code: TIME_OFF_ALLOCATION_TYPE_INVALID, message: Select an active Time Off Type. }
        - { query: "SELECT 1 AS ok WHERE CAST(:days AS DECIMAL(18,3)) > 0 AND CAST(:date_to AS DATE) >= CAST(:date_from AS DATE)", status: 422, code: TIME_OFF_ALLOCATION_VALUES_INVALID, message: Allocation must have a positive amount and valid dates. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM leave_allocations WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: TIME_OFF_ALLOCATION_NAME_EXISTS, message: An allocation with this title already exists. }
      result: { query: "SELECT * FROM leave_allocations WHERE id = :id" }
    fields:
      - { field: name, label: Allocation, type: text, required: true }
      - { field: employee_id, label: Employee ID, type: text, required: true }
      - { field: employee_name, label: Employee, type: text, required: true }
      - { field: leave_type_id, label: Time Off Type ID, type: text, required: true }
      - { field: leave_type_name, label: Time Off Type, type: text, required: true }
      - { field: days, label: Amount, type: number, required: true }
      - { field: date_from, label: Start date, type: date, required: true }
      - { field: date_to, label: End date, type: date, required: true }
      - { field: reason, label: Reason, type: text }
  - { id: submit_allocation_detail, type: server, permission: time_off.write, action: time_off.allocations.submit, handler: order_transition, workflow: leave_allocations, operation: submit, refresh: [allocation_detail, time_off_allocations] }
  - { id: approve_allocation_detail, type: server, permission: time_off.manage, action: time_off.allocations.approve, handler: order_transition, workflow: leave_allocations, operation: approve, refresh: [allocation_detail, time_off_allocations] }
  - { id: refuse_allocation_detail, type: server, permission: time_off.manage, action: time_off.allocations.refuse, handler: order_transition, workflow: leave_allocations, operation: refuse, refresh: [allocation_detail, time_off_allocations] }
  - { id: cancel_allocation_detail, type: server, permission: time_off.write, action: time_off.allocations.cancel, handler: order_transition, workflow: leave_allocations, operation: cancel, refresh: [allocation_detail, time_off_allocations] }
