page: { id: leave-type-detail }
datasources:
  - id: leave_type_detail
    single: true
    permission: time_off.manage
    query: "SELECT id, name, code, allocation_days, requires_approval, state, COALESCE((SELECT SUM(r.days) FROM leave_requests r WHERE r.leave_type_id = leave_types.id AND r.state IN ('Submitted', 'Approved') AND r.date_from >= DATE '2026-01-01' AND r.date_from < DATE '2027-01-01'), 0) AS group_days_leave, (SELECT COUNT(*) FROM leave_allocations a WHERE a.leave_type_id = leave_types.id AND a.state IN ('Submitted', 'Approved') AND a.date_from >= DATE '2026-01-01' AND a.date_from < DATE '2027-01-01') AS allocation_count, (SELECT COUNT(*) FROM accrual_plans p WHERE p.time_off_type_id = leave_types.id) AS accrual_count FROM leave_types WHERE id = :id"
actions:
  - id: open_type_accrual_plans
    type: navigate
    permission: time_off.manage
    navigate_to: /accrual-plans
    params: { time_off_type_id: '{state.id}', default_time_off_type_id: '{state.id}' }
  - id: open_type_allocations
    type: navigate
    permission: time_off.manage
    navigate_to: /time-off-allocations
    params: { leave_type_id: '{state.id}', state: Approved, year: 2026, default_holiday_status_id: '{state.id}', search_default_approved_state: 1, search_default_year: 1 }
  - id: open_type_time_off
    type: navigate
    permission: time_off.manage
    navigate_to: /time-off-approval
    params: { leave_type_id: '{state.id}', default_holiday_status_id: '{state.id}' }
  - id: edit_leave_type
    type: server_form
    permission: time_off.manage
    title: Edit time off type
    action: time_off.types.update
    handler: yaml_mutation
    operation: update
    prefill: state.leave_type_detail
    refresh: [leave_type_detail, leave_types]
    mutation:
      operation: update
      table: leave_types
      key_field: id
      concurrency: false
      fields: [name, code, allocation_days, requires_approval, state]
      required: [name, code]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:code AS VARCHAR))) > 0 AND CAST(CASE WHEN CAST(:allocation_days AS VARCHAR) = '' THEN '0' ELSE CAST(:allocation_days AS VARCHAR) END AS DECIMAL(18,3)) >= 0 AND CAST(:state AS VARCHAR) IN ('Active', 'Archived')", status: 422, message: Name, code, and non-negative allocation days are required }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM leave_types other WHERE other.id <> :id AND (other.name = :name OR other.code = :code))", status: 409, message: Time off type name and code must be unique }
      result: { query: "SELECT * FROM leave_types WHERE id = :id" }
    fields:
      - { field: name, label: Time off type, type: text, required: true }
      - { field: code, label: Code, type: text, required: true }
      - { field: allocation_days, label: Allocation days, type: number }
      - { field: requires_approval, label: Approval required, type: checkbox }
      - { field: state, label: Status, type: select, options: [{ value: Active, label: Active }, { value: Archived, label: Archived }] }
