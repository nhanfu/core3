page: { id: time-off-overview-detail }
datasources:
  - id: time_off_overview_detail
    single: true
    permission: time_off.read
    error_states: { transport_error: { status: 503, code: TIME_OFF_OVERVIEW_DETAIL_UNAVAILABLE, message: Time Off calendar details are temporarily unavailable. } }
    query: "SELECT r.id, r.row_version, r.name, r.employee_name, r.leave_type_name, CAST(r.date_from AS VARCHAR) AS date_from, CAST(r.date_to AS VARCHAR) AS date_to, r.days, r.reason, r.state, COALESCE(v.validation_type, 'manager') AS validation_type FROM leave_requests r LEFT JOIN time_off_leave_validation_types v ON v.leave_type_id = r.leave_type_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND r.id = :id AND r.state IN ('Submitted', 'Second Approval', 'Approved', 'Refused', 'Cancelled')"
actions:
  - { id: approve_time_off_overview_detail, type: server, permission: time_off.manage, action: time_off.requests.approve, handler: order_transition, workflow: leave_requests, operation: approve, params: { id: '{state.id}' }, refresh: [time_off_overview_detail, time_off_overview_requests] }
  - { id: approve_first_time_off_overview_detail, type: server, permission: time_off.manage, action: time_off.requests.approve_first, handler: order_transition, workflow: leave_requests, operation: approve_first, params: { id: '{state.id}' }, refresh: [time_off_overview_detail, time_off_overview_requests] }
  - { id: validate_time_off_overview_detail, type: server, permission: time_off.manage, action: time_off.requests.validate, handler: order_transition, workflow: leave_requests, operation: validate, params: { id: '{state.id}' }, refresh: [time_off_overview_detail, time_off_overview_requests] }
  - { id: refuse_time_off_overview_detail, type: server, permission: time_off.manage, action: time_off.requests.refuse_overview, handler: order_transition, workflow: leave_requests, operation: refuse, params: { id: '{state.id}' }, refresh: [time_off_overview_detail, time_off_overview_requests] }
