page: { id: time-off-approval }
datasources:
  - id: time_off_approval_states
    permission: time_off.manage
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Waiting For Me'), ('Second Approval','Second Approval'), ('Approved','Approved'), ('Refused','Refused'), ('Cancelled','Cancelled')) states(value, label)"
  - id: time_off_approval_requests
    permission: time_off.manage
    query: "SELECT r.id, r.row_version, r.name, r.employee_name, r.leave_type_name, CAST(r.date_from AS VARCHAR) AS date_from, CAST(r.date_to AS VARCHAR) AS date_to, r.days, r.state, r.reason, r.refusal_reason, COALESCE(v.validation_type, 'manager') AS validation_type FROM leave_requests r LEFT JOIN time_off_leave_validation_types v ON v.leave_type_id = r.leave_type_id WHERE (:q IS NULL OR r.name ILIKE '%' || :q || '%' OR r.employee_name ILIKE '%' || :q || '%') AND (:state IS NULL OR r.state = :state) AND (:leave_type_id IS NULL OR r.leave_type_id = :leave_type_id) ORDER BY r.date_from DESC"
  - id: multiple_request_types
    permission: time_off.manage
    single: false
    query: "SELECT id AS value, name AS label FROM leave_types WHERE state = 'Active' AND requires_approval = TRUE ORDER BY name"
  - id: multiple_request_employees
    permission: time_off.manage
    single: false
    query: "SELECT id AS value, name AS label FROM time_off_multiple_request_employees WHERE active = TRUE ORDER BY name"
  - id: multiple_request_departments
    permission: time_off.manage
    single: false
    query: "SELECT d.id AS value, d.name || ' (' || CAST(COUNT(e.id) AS VARCHAR) || ')' AS label FROM time_off_multiple_request_departments d LEFT JOIN time_off_multiple_request_employees e ON e.department_name = d.name AND e.company_name = d.company_name AND e.active = TRUE WHERE d.active = TRUE GROUP BY d.id, d.name ORDER BY d.name"
  - id: multiple_request_modes
    permission: time_off.manage
    single: false
    query: "SELECT value, label FROM (VALUES ('employee','By Employee'), ('company','By Company'), ('department','By Department'), ('category','By Employee Tag')) modes(value, label)"
actions:
  - id: approve_selected_requests
    type: server
    permission: time_off.manage
    action: time_off.requests.bulk_approve
    handler: yaml_mutation
    operation: bulk_update
    refresh: [time_off_approval_requests]
    confirm: 'Approve {count} selected time off requests?'
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM leave_requests WHERE id IN :ids)", status: 400, code: TIME_OFF_REQUEST_SELECTION_REQUIRED, message: Select at least one time off request. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM leave_requests r WHERE r.id IN :ids AND r.state NOT IN ('Submitted', 'Second Approval'))", status: 409, code: TIME_OFF_REQUEST_BULK_STATE_INVALID, message: Only pending time off requests can be approved. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (WITH final_requests AS (SELECT r.employee_id, r.leave_type_id, EXTRACT(YEAR FROM r.date_from) AS year, SUM(r.days) AS days FROM leave_requests r LEFT JOIN time_off_leave_validation_types v ON v.leave_type_id = r.leave_type_id WHERE r.id IN :ids AND (r.state = 'Second Approval' OR (r.state = 'Submitted' AND COALESCE(v.validation_type, 'manager') <> 'both')) GROUP BY r.employee_id, r.leave_type_id, EXTRACT(YEAR FROM r.date_from)) SELECT 1 FROM final_requests f LEFT JOIN leave_balances b ON b.employee_id = f.employee_id AND b.leave_type_id = f.leave_type_id AND b.year = f.year WHERE b.id IS NULL OR b.allocated_days - b.used_days < f.days)", status: 409, code: TIME_OFF_REQUEST_BULK_BALANCE_INVALID, message: One or more requests do not have enough leave balance. }
      steps:
        - query: "UPDATE leave_balances SET used_days = used_days + (SELECT COALESCE(SUM(r.days), 0) FROM leave_requests r LEFT JOIN time_off_leave_validation_types v ON v.leave_type_id = r.leave_type_id WHERE r.id IN :ids AND (r.state = 'Second Approval' OR (r.state = 'Submitted' AND COALESCE(v.validation_type, 'manager') <> 'both')) AND r.employee_id = leave_balances.employee_id AND r.leave_type_id = leave_balances.leave_type_id AND EXTRACT(YEAR FROM r.date_from) = leave_balances.year) WHERE EXISTS (SELECT 1 FROM leave_requests r LEFT JOIN time_off_leave_validation_types v ON v.leave_type_id = r.leave_type_id WHERE r.id IN :ids AND (r.state = 'Second Approval' OR (r.state = 'Submitted' AND COALESCE(v.validation_type, 'manager') <> 'both')) AND r.employee_id = leave_balances.employee_id AND r.leave_type_id = leave_balances.leave_type_id AND EXTRACT(YEAR FROM r.date_from) = leave_balances.year)"
        - query: "UPDATE leave_requests SET state = CASE WHEN state = 'Submitted' AND COALESCE((SELECT validation_type FROM time_off_leave_validation_types v WHERE v.leave_type_id = leave_requests.leave_type_id), 'manager') = 'both' THEN 'Second Approval' ELSE 'Approved' END, approver = :current_user_name, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id IN :ids AND state IN ('Submitted', 'Second Approval')"
        - query: "INSERT INTO time_off_leave_approvals(request_id, first_approver, second_approver, row_version) SELECT r.id, :current_user_name, NULL, 1 FROM leave_requests r JOIN time_off_leave_validation_types v ON v.leave_type_id = r.leave_type_id WHERE r.id IN :ids AND r.state = 'Second Approval' ON CONFLICT(request_id) DO UPDATE SET first_approver = excluded.first_approver, row_version = time_off_leave_approvals.row_version + 1"
        - query: "UPDATE time_off_leave_approvals SET second_approver = :current_user_name, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE request_id IN :ids AND EXISTS (SELECT 1 FROM leave_requests r WHERE r.id = time_off_leave_approvals.request_id AND r.state = 'Approved')"
      result: { query: "SELECT TRUE AS approved" }
  - id: refuse_selected_requests
    type: server
    permission: time_off.manage
    action: time_off.requests.bulk_refuse
    handler: yaml_mutation
    operation: bulk_update
    refresh: [time_off_approval_requests]
    confirm: 'Refuse {count} selected time off requests?'
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM leave_requests WHERE id IN :ids)", status: 400, code: TIME_OFF_REQUEST_SELECTION_REQUIRED, message: Select at least one time off request. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM leave_requests WHERE id IN :ids AND state NOT IN ('Submitted', 'Second Approval'))", status: 409, code: TIME_OFF_REQUEST_BULK_STATE_INVALID, message: Only pending time off requests can be refused. }
      steps:
        - query: "UPDATE leave_requests SET state = 'Refused', approver = :current_user_name, refusal_reason = 'Bulk refusal', row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id IN :ids AND state IN ('Submitted', 'Second Approval')"
      result: { query: "SELECT TRUE AS refused" }
  - id: refuse_approval_request
    type: server_form
    permission: time_off.manage
    title: Refuse Time Off
    action: time_off.requests.refuse
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', expected_row_version: '{row.row_version}', values: { state: Refused } }
    prefill: row
    refresh: [time_off_approval_requests]
    submit_label: Refuse
    cancel_label: Discard
    mutation:
      operation: update
      table: leave_requests
      fields: [state, refusal_reason]
      required: [refusal_reason]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM leave_requests WHERE id = :id", status: 404, code: TIME_OFF_LEAVE_NOT_FOUND, message: Time off request not found. }
        - { query: "SELECT id FROM leave_requests WHERE id = :id AND row_version = :expected_row_version AND state IN ('Submitted', 'Second Approval')", status: 409, code: TIME_OFF_LEAVE_REFUSE_INVALID, message: Only an unchanged pending time off request can be refused. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(COALESCE(:refusal_reason, '') AS VARCHAR))) BETWEEN 1 AND 500", status: 422, code: TIME_OFF_LEAVE_REFUSAL_REASON_INVALID, message: Enter a refusal reason of 500 characters or fewer. }
      result: { query: "SELECT * FROM leave_requests WHERE id = :id" }
    fields:
      - { field: state, label: Status, type: hidden, default: Refused }
      - { field: refusal_reason, label: Reason, type: textarea, required: true, placeholder: Why is this time off refused? }
  - { id: approve_first_approval_request, type: server, permission: time_off.manage, action: time_off.requests.approve_first, handler: order_transition, workflow: leave_requests, operation: approve_first, refresh: [time_off_approval_requests] }
  - { id: validate_approval_request, type: server, permission: time_off.manage, action: time_off.requests.validate, handler: order_transition, workflow: leave_requests, operation: validate, refresh: [time_off_approval_requests] }
  - id: create_multiple_requests
    type: server_form
    permission: time_off.manage
    title: Multiple Requests
    modal_style: time_off_multiple
    submit_label: Generate Time Off
    cancel_label: Discard
    action: time_off.requests.generate_multiple
    handler: yaml_mutation
    refresh: [time_off_approval_requests, leave_requests]
    success_message: Time off generated for the selected employees.
    mutation:
      steps:
        - query: "INSERT INTO leave_requests(id, name, employee_id, employee_name, leave_type_id, leave_type_name, date_from, date_to, days, reason, approver, state) SELECT 'leave-request-group-' || e.id || '-' || CAST(:date_from AS DATE), 'LEAVE/GROUP/' || CAST(:date_from AS DATE) || '/' || e.id, e.id, e.name, t.id, t.name, CAST(:date_from AS DATE), CAST(:date_to AS DATE), CAST(CAST(:date_to AS DATE) - CAST(:date_from AS DATE) + 1 AS DECIMAL(18,3)), NULLIF(TRIM(CAST(:description AS VARCHAR)), ''), NULL, CASE WHEN t.requires_approval = FALSE THEN 'Approved' ELSE 'Submitted' END FROM time_off_multiple_request_employees e JOIN leave_types t ON t.id = :holiday_status_id WHERE e.active = TRUE AND e.id IN :employee_ids"
      guards:
        - { query: "SELECT 1 AS ok FROM leave_types WHERE id = :holiday_status_id AND state = 'Active' AND requires_approval = TRUE", status: 422, code: TIME_OFF_MULTI_TYPE_INVALID, message: Select an active Time Off Type. }
        - { query: "SELECT 1 AS ok FROM (VALUES ('employee'), ('company'), ('department'), ('category')) modes(value) WHERE value = :allocation_mode", status: 422, code: TIME_OFF_MULTI_MODE_INVALID, message: Select a valid mode. }
        - { query: "SELECT 1 AS ok WHERE CAST(:date_to AS DATE) >= CAST(:date_from AS DATE)", status: 422, code: TIME_OFF_MULTI_DATES_INVALID, message: Dates must be valid and the end date cannot be before the start date. }
        - { query: "SELECT 1 AS ok FROM time_off_multiple_request_employees WHERE active = TRUE AND id IN :employee_ids", status: 422, code: TIME_OFF_MULTI_EMPLOYEES_INVALID, message: Select at least one active employee. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM leave_requests r WHERE r.employee_id IN :employee_ids AND r.date_from <= CAST(:date_to AS DATE) AND r.date_to >= CAST(:date_from AS DATE) AND r.state NOT IN ('Refused', 'Cancelled'))", status: 409, code: TIME_OFF_MULTI_OVERLAP, message: One or more selected employees already have time off in the selected dates. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM leave_requests r WHERE r.name IN (SELECT 'LEAVE/GROUP/' || CAST(:date_from AS DATE) || '/' || e.id FROM time_off_multiple_request_employees e WHERE e.id IN :employee_ids))", status: 409, code: TIME_OFF_MULTI_EXISTS, message: These multiple requests have already been generated. }
      result: { query: "SELECT COUNT(*) AS generated_count FROM leave_requests WHERE name LIKE 'LEAVE/GROUP/' || CAST(:date_from AS DATE) || '/%'" }
    fields:
      - { field: holiday_status_id, label: Time Off Type, type: select, options_source: multiple_request_types, required: false }
      - { field: allocation_mode, label: Mode ?, type: select, options_source: multiple_request_modes, required: false, default: employee }
      - { field: employee_ids, label: Employees, type: multi-select, multiple: true, options_source: multiple_request_employees, placeholder: Everyone, required: true }
      - { field: date_from, label: Dates, type: date, required: false }
      - { field: date_to, label: Dates, type: date, required: false }
      - { field: description, label: Description, type: textarea, placeholder: 'e.g. Extra recuperation, Company unavailability, ...' }
  - id: create_department_requests
    type: server_form
    permission: time_off.manage
    title: Multiple Requests — By Department
    modal_style: time_off_multiple
    submit_label: Generate Time Off
    cancel_label: Discard
    action: time_off.requests.generate_multiple.department
    handler: yaml_mutation
    refresh: [time_off_approval_requests, leave_requests]
    success_message: Time off generated for the selected department.
    mutation:
      steps:
        - query: "INSERT INTO leave_requests(id, name, employee_id, employee_name, leave_type_id, leave_type_name, date_from, date_to, days, reason, approver, state) SELECT 'leave-request-group-' || e.id || '-' || CAST(:date_from AS DATE), 'LEAVE/GROUP/' || CAST(:date_from AS DATE) || '/' || e.id, e.id, e.name, t.id, t.name, CAST(:date_from AS DATE), CAST(:date_to AS DATE), CAST(CAST(:date_to AS DATE) - CAST(:date_from AS DATE) + 1 AS DECIMAL(18,3)), NULLIF(TRIM(CAST(:description AS VARCHAR)), ''), NULL, CASE WHEN t.requires_approval = FALSE THEN 'Approved' ELSE 'Submitted' END FROM time_off_multiple_request_employees e JOIN time_off_multiple_request_departments d ON d.name = e.department_name AND d.company_name = e.company_name AND d.id = :department_id JOIN leave_types t ON t.id = :holiday_status_id WHERE e.active = TRUE AND d.active = TRUE"
      guards:
        - { query: "SELECT 1 AS ok FROM leave_types WHERE id = :holiday_status_id AND state = 'Active' AND requires_approval = TRUE", status: 422, code: TIME_OFF_MULTI_TYPE_INVALID, message: Select an active Time Off Type. }
        - { query: "SELECT 1 AS ok FROM time_off_multiple_request_departments d JOIN time_off_multiple_request_employees e ON e.department_name = d.name AND e.company_name = d.company_name WHERE d.id = :department_id AND d.active = TRUE AND e.active = TRUE", status: 422, code: TIME_OFF_MULTI_DEPARTMENT_INVALID, message: Select an active department with employees. }
        - { query: "SELECT 1 AS ok WHERE CAST(:date_to AS DATE) >= CAST(:date_from AS DATE)", status: 422, code: TIME_OFF_MULTI_DATES_INVALID, message: Dates must be valid and the end date cannot be before the start date. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM leave_requests r JOIN time_off_multiple_request_employees e ON e.id = r.employee_id JOIN time_off_multiple_request_departments d ON d.id = :department_id AND d.active = TRUE AND d.name = e.department_name AND d.company_name = e.company_name WHERE e.active = TRUE AND r.date_from <= CAST(:date_to AS DATE) AND r.date_to >= CAST(:date_from AS DATE) AND r.state NOT IN ('Refused', 'Cancelled'))", status: 409, code: TIME_OFF_MULTI_OVERLAP, message: One or more department employees already have time off in the selected dates. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM leave_requests r JOIN time_off_multiple_request_employees e ON e.id = r.employee_id JOIN time_off_multiple_request_departments d ON d.id = :department_id AND d.active = TRUE AND d.name = e.department_name AND d.company_name = e.company_name WHERE e.active = TRUE AND r.name IN (SELECT 'LEAVE/GROUP/' || CAST(:date_from AS DATE) || '/' || selected.id FROM time_off_multiple_request_employees selected JOIN time_off_multiple_request_departments selected_d ON selected_d.id = :department_id AND selected_d.active = TRUE AND selected_d.name = selected.department_name AND selected_d.company_name = selected.company_name WHERE selected.active = TRUE))", status: 409, code: TIME_OFF_MULTI_EXISTS, message: These department requests have already been generated. }
      result: { query: "SELECT COUNT(*) AS generated_count FROM leave_requests WHERE name LIKE 'LEAVE/GROUP/' || CAST(:date_from AS DATE) || '/%'" }
    fields:
      - { field: holiday_status_id, label: Time Off Type, type: select, options_source: multiple_request_types, required: true }
      - { field: department_id, label: Department, type: select, options_source: multiple_request_departments, required: true }
      - { field: date_from, label: Dates, type: date, required: true }
      - { field: date_to, label: Dates, type: date, required: true }
      - { field: description, label: Description, type: textarea, placeholder: 'e.g. Extra recuperation, Company unavailability, ...' }
