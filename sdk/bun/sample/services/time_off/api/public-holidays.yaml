page: { id: public-holidays }
datasources:
  - id: public_holidays
    permission: time_off.manage
    error_states: { transport_error: { status: 503, code: TIME_OFF_PUBLIC_HOLIDAYS_UNAVAILABLE, message: Public holiday data is temporarily unavailable. } }
    query: "SELECT id, row_version, name, CAST(date_from AS VARCHAR) AS date_from, CAST(date_to AS VARCHAR) AS date_to, calendar_name FROM public_holidays WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR calendar_name ILIKE '%' || :q || '%') AND (:from_date IS NULL OR date_to >= CAST(:from_date AS DATE)) AND (:to_date IS NULL OR date_from <= CAST(:to_date AS DATE)) ORDER BY date_from, date_to, id"
actions:
  - id: view_public_holiday
    type: navigate
    permission: time_off.manage
    navigate_to: /public-holidays/detail
    params: { id: '{row.id}' }
  - id: create_public_holiday
    type: server_form
    permission: time_off.manage
    title: New public holiday
    action: time_off.public_holidays.create
    handler: yaml_mutation
    operation: create
    refresh: [public_holidays]
    mutation:
      operation: insert
      table: public_holidays
      fields: [name, date_from, date_to, calendar_name]
      required: [name, date_from, date_to]
      defaults: { calendar_name: Standard 40 hours/week, row_version: 1 }
      before_steps:
        - { query: "SELECT 'public-holiday-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-' || CAST(:date_from AS DATE) AS id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND CAST(:date_to AS DATE) >= CAST(:date_from AS DATE)", status: 422, code: TIME_OFF_PUBLIC_HOLIDAY_INVALID, message: A name and valid date range are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM public_holidays WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: TIME_OFF_PUBLIC_HOLIDAY_EXISTS, message: A public holiday with this name already exists. }
      result: { query: "SELECT * FROM public_holidays WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: date_from, label: Start date, type: date, required: true }
      - { field: date_to, label: End date, type: date, required: true }
      - { field: calendar_name, label: Working Hours, type: text }
  - id: delete_public_holiday
    type: server
    permission: time_off.manage
    action: time_off.public_holidays.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete public holiday {{row.name}}?'
    refresh: [public_holidays]
    mutation:
      operation: delete
      table: public_holidays
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM public_holidays WHERE id = :id", status: 404, code: TIME_OFF_PUBLIC_HOLIDAY_NOT_FOUND, message: Public holiday not found. }
