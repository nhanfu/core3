version: 0.0.23
description: Persisted My Allocations activity slots
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS time_off_my_allocation_activities (
        id VARCHAR PRIMARY KEY,
        allocation_id VARCHAR NOT NULL UNIQUE,
        activity_type VARCHAR,
        activity_summary VARCHAR,
        activity_date DATE,
        activity_user VARCHAR,
        activity_state VARCHAR NOT NULL DEFAULT 'planned',
        activity_count INTEGER NOT NULL DEFAULT 0,
        row_version INTEGER NOT NULL DEFAULT 1
      );
      CREATE INDEX IF NOT EXISTS time_off_my_allocation_activities_date_idx
        ON time_off_my_allocation_activities(activity_date, allocation_id);
      INSERT INTO time_off_my_allocation_activities(
        id, allocation_id, activity_type, activity_summary, activity_date,
        activity_user, activity_state, activity_count
      ) VALUES
        ('my-allocation-activity-allocation-demo-001', 'allocation-demo-001', 'time_off_second_approve', 'Review approved allocation', DATE '2026-01-01', 'Core3 Administrator', 'done', 1),
        ('my-allocation-activity-allocation-demo-004', 'allocation-demo-004', 'todo', 'Complete your allocation request', DATE '2026-01-01', 'Admin User', 'today', 1)
      ON CONFLICT(allocation_id) DO NOTHING;
    down: |
      DROP INDEX IF EXISTS time_off_my_allocation_activities_date_idx;
      DROP TABLE IF EXISTS time_off_my_allocation_activities;
