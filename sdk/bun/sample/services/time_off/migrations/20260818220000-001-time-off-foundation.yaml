version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS leave_types (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        code VARCHAR NOT NULL UNIQUE, allocation_days DECIMAL(18,3) NOT NULL DEFAULT 0,
        requires_approval BOOLEAN NOT NULL DEFAULT TRUE, state VARCHAR NOT NULL DEFAULT 'Active',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS leave_balances (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), employee_id VARCHAR NOT NULL,
        employee_name VARCHAR NOT NULL, leave_type_id VARCHAR NOT NULL, leave_type_name VARCHAR NOT NULL,
        year INTEGER NOT NULL, allocated_days DECIMAL(18,3) NOT NULL DEFAULT 0, used_days DECIMAL(18,3) NOT NULL DEFAULT 0,
        UNIQUE(employee_id, leave_type_id, year)
      );
      CREATE TABLE IF NOT EXISTS leave_requests (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        employee_id VARCHAR NOT NULL, employee_name VARCHAR NOT NULL, leave_type_id VARCHAR NOT NULL,
        leave_type_name VARCHAR NOT NULL, date_from DATE NOT NULL, date_to DATE NOT NULL,
        days DECIMAL(18,3) NOT NULL, reason VARCHAR, approver VARCHAR, state VARCHAR NOT NULL DEFAULT 'Draft',
        row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS leave_requests_state_idx ON leave_requests(state);
      CREATE INDEX IF NOT EXISTS leave_requests_employee_idx ON leave_requests(employee_id);
    down: |
      DROP TABLE IF EXISTS leave_requests;
      DROP TABLE IF EXISTS leave_balances;
      DROP TABLE IF EXISTS leave_types;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
