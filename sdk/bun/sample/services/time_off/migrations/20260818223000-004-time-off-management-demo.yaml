version: 0.0.4
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS leave_allocations (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, employee_id VARCHAR NOT NULL,
        employee_name VARCHAR NOT NULL, leave_type_id VARCHAR NOT NULL, leave_type_name VARCHAR NOT NULL,
        days DECIMAL(18,3) NOT NULL, date_from DATE NOT NULL, date_to DATE, state VARCHAR NOT NULL DEFAULT 'Draft',
        reason VARCHAR, row_version BIGINT NOT NULL DEFAULT 1
      );
      CREATE TABLE IF NOT EXISTS accrual_plans (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, level_count INTEGER NOT NULL DEFAULT 0,
        employee_count INTEGER NOT NULL DEFAULT 0, state VARCHAR NOT NULL DEFAULT 'Active'
      );
      CREATE TABLE IF NOT EXISTS public_holidays (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, date_from DATE NOT NULL, date_to DATE NOT NULL,
        calendar_name VARCHAR NOT NULL DEFAULT 'Standard 40 hours/week'
      );
      CREATE TABLE IF NOT EXISTS mandatory_days (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL UNIQUE, date_from DATE NOT NULL, date_to DATE NOT NULL,
        color VARCHAR NOT NULL DEFAULT 'violet', company VARCHAR NOT NULL DEFAULT 'YShip Demo Company'
      );
      INSERT OR IGNORE INTO leave_allocations(id, name, employee_id, employee_name, leave_type_id, leave_type_name, days, date_from, date_to, state, reason) VALUES
        ('allocation-demo-001', 'ALLOC/2026/0001', 'employee-demo-001', 'Admin User', 'leave-type-annual', 'Annual Leave', 20, '2026-01-01', '2026-12-31', 'Approved', 'Regular allocation'),
        ('allocation-demo-002', 'ALLOC/2026/0002', 'employee-demo-002', 'Marc Demo', 'leave-type-annual', 'Annual Leave', 15, '2026-01-01', '2026-12-31', 'Approved', 'Regular allocation'),
        ('allocation-demo-003', 'ALLOC/2026/0003', 'employee-demo-003', 'Mitchell Admin', 'leave-type-comp', 'Compensatory Days', 8, '2026-01-01', '2026-12-31', 'Submitted', 'Overtime recovery'),
        ('allocation-demo-004', 'ALLOC/2026/0004', 'employee-demo-001', 'Admin User', 'leave-type-training', 'Training Time Off', 7, '2026-01-01', '2026-12-31', 'Draft', 'Certification course');
      INSERT OR IGNORE INTO accrual_plans(id, name, level_count, employee_count, state) VALUES
        ('accrual-plan-demo-001', 'Seniority Plan', 3, 0, 'Active'),
        ('accrual-plan-demo-002', 'Legacy Plan', 1, 2, 'Archived');
      INSERT OR IGNORE INTO public_holidays(id, name, date_from, date_to, calendar_name) VALUES
        ('public-holiday-demo-001', 'Public Time Off', '2026-02-13', '2026-02-14', 'Standard 40 hours/week');
      INSERT OR IGNORE INTO mandatory_days(id, name, date_from, date_to, color, company) VALUES
        ('mandatory-day-demo-001', 'Company Celebration', '2026-09-16', '2026-09-16', 'violet', 'YShip Demo Company');
    down: |
      DROP TABLE IF EXISTS mandatory_days;
      DROP TABLE IF EXISTS public_holidays;
      DROP TABLE IF EXISTS accrual_plans;
      DROP TABLE IF EXISTS leave_allocations;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
