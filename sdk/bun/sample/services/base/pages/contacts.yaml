title: Contacts
page: { id: contacts, breadcrumb: [Contacts], auth: { require: [base.contacts.read] } }
datasources:
  - id: contacts
    permission: base.contacts.read
    mock_data:
      default:
        - { id: company-demo, row_version: 1, name: Core3 Demo Company, company_type: company, email: hello@core3.local, phone: '+1 555 0100', city: San Francisco, country_name: United States, is_company: true, active: true, category_count: 1 }
        - { id: contact-demo, row_version: 1, name: Demo Contact, company_type: person, email: demo@core3.local, phone: '+1 555 0101', city: San Francisco, country_name: United States, is_company: false, active: true, category_count: 1 }
        - { id: company-vietnam, row_version: 1, name: Core3 Vietnam Branch, company_type: company, email: vn@core3.local, phone: '+84 28 5555 0100', city: Ho Chi Minh City, country_name: Vietnam, is_company: true, active: true, category_count: 0 }
      states:
        empty: []
        filtered:
          - { id: contact-demo, row_version: 1, name: Demo Contact, company_type: person, email: demo@core3.local, phone: '+1 555 0101', city: San Francisco, country_name: United States, is_company: false, active: true, category_count: 1 }
  - id: contact_types
    permission: base.contacts.read
    mock_data:
      default: [{ value: person, label: Person }, { value: company, label: Company }, { value: other, label: Other }]
components:
  - type: ListView
    variant: odoo
    source: contacts
    create_action: create_contact
    create_label: New contact
    search: { label: Search contacts, placeholder: 'Search name, email, or phone...' }
    filters: [{ field: company_type, label: Type, options_source: contact_types }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        card:
          title: name
          subtitle: email
          fields:
            - { field: company_type, label: Type }
            - { field: phone, label: Phone }
            - { field: city, label: City }
            - { field: category_count, label: Tags }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell }
      - { field: company_type, label: Type }
      - { field: email, label: Email }
      - { field: phone, label: Phone }
      - { field: city, label: City }
      - { field: country_name, label: Country }
      - { field: category_count, label: Tags }
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_contact
    row_double_click_action: view_contact
    form_view: { page: apps/services/base/pages/contact-detail.yaml, side_panel: true }
    actions:
      - { id: edit_contact, label: Edit, permission: base.contacts.write, variant: ghost }
      - { id: duplicate_contact, label: Duplicate, permission: base.contacts.write, variant: secondary }
      - { id: archive_contact, label: Archive, permission: base.contacts.write, variant: danger }
actions:
  - id: create_contact
    type: server_form
    permission: base.contacts.write
    title: New contact
    action: base.contacts.create
    handler: yaml_mutation
    operation: create
    refresh: [contacts]
    mutation:
      operation: insert
      table: base_contacts
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, is_company, notes]
      required: [name]
      guards:
        - { query: "SELECT id FROM base_contacts WHERE active = true AND email IS NOT NULL AND lower(email) = lower(:email)", status: 409, message: A contact with this email already exists }
      result: { query: "SELECT * FROM base_contacts WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options_source: contact_types }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: street2, label: Street 2, type: text }
      - { field: city, label: City, type: text }
      - { field: state_name, label: State, type: text }
      - { field: zip, label: ZIP, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: is_company, label: Is a company, type: checkbox }
      - { field: notes, label: Notes, type: textarea }
  - id: edit_contact
    type: server_form
    permission: base.contacts.write
    title: Edit contact
    action: base.contacts.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [contacts]
    mutation:
      operation: update
      table: base_contacts
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, currency_code, is_company, notes]
      required: [name]
      timestamps: true
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true", status: 409, message: Archived contacts cannot be edited }
        - { query: "SELECT 1 AS ok WHERE :email IS NULL OR NOT EXISTS (SELECT 1 FROM base_contacts WHERE active = true AND email IS NOT NULL AND lower(email) = lower(:email) AND id <> :id)", status: 409, message: A contact with this email already exists }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options_source: contact_types }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: street2, label: Street 2, type: text }
      - { field: city, label: City, type: text }
      - { field: state_name, label: State, type: text }
      - { field: zip, label: ZIP, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: currency_code, label: Currency, type: text }
      - { field: is_company, label: Is a company, type: checkbox }
      - { field: notes, label: Notes, type: textarea }
  - id: duplicate_contact
    type: server_form
    permission: base.contacts.write
    title: Duplicate contact
    action: base.contacts.duplicate
    handler: yaml_mutation
    operation: create
    prefill: row
    refresh: [contacts]
    mutation:
      operation: insert
      table: base_contacts
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, currency_code, is_company, notes]
      required: [name]
      defaults: { active: true }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options_source: contact_types }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: city, label: City, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: notes, label: Notes, type: textarea }
  - id: view_contact
    type: navigate
    permission: base.contacts.read
    navigate_to: /contact-detail
    params: { id: '{row.id}' }
  - { id: archive_contact, type: server, permission: base.contacts.write, action: base.contacts.archive, handler: order_transition, workflow: base_contacts, operation: archive, refresh: [contacts] }
