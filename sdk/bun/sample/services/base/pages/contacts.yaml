title: Contacts
page: { id: contacts, route: /contacts, breadcrumb: [Contacts], auth: { require: [base.contacts.read] } }
components:
  - type: ListView
    variant: odoo
    source: contacts
    create_action: create_contact
    create_label: New contact
    search: { label: Search contacts, placeholder: 'Search name, email, or phone...' }
    filters:
      - { field: company_type, label: Type, options_source: contact_types }
      - { field: country_name, label: Country, options_source: contact_countries }
    group_by:
      - { field: company_type, label: Type }
      - { field: country_name, label: Country }
    favorites:
      - { id: companies, label: Companies, filters: { company_type: company }, group_by: country_name }
      - { id: people, label: People, filters: { company_type: person }, group_by: country_name }
    actions:
      - { id: contacts.export, label: Export, title: Export contacts, icon: download }
    tree: { parent_field: parent_company_id }
    selectable: true
    column_chooser: true
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: card
        label: Cards
        icon: grid
        card:
          title: name
          subtitle: email
          image_field: avatar_url
          fields:
            - { field: company_type, label: Type }
            - { field: phone, label: Phone }
            - { field: city, label: City }
            - { field: country_name, label: Country }
            - { field: parent_company_name, label: Company }
            - { field: category_count, label: Tags }
            - { field: activity_count, label: Activities }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: company_type
        card:
          title: name
          subtitle: email
          image_field: avatar_url
          fields:
            - { field: company_type, label: Type }
            - { field: phone, label: Phone }
            - { field: city, label: City }
            - { field: parent_company_name, label: Company }
            - { field: category_count, label: Tags }
            - { field: activity_count, label: Activities }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell }
      - { field: company_type, label: Type }
      - { field: email, label: Email }
      - { field: phone, label: Phone }
      - { field: city, label: City }
      - { field: country_name, label: Country }
      - { field: parent_company_name, label: Company, optional: hide }
      - { field: category_count, label: Tags }
      - { field: activity_count, label: Activities }
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_contact
    row_double_click_action: view_contact
    empty_state: { title: No contacts, description: No contacts match your search or filters. }
