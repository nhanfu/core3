workflow:
  id: base_activities
  entity: base_activities
  handler: order_transition
  initial: planned
  permission: base.activities.write
  mutable: true
  states: [{ id: planned, label: Planned, color: orange }, { id: done, label: Done, color: green, terminal: true }]
  transitions:
    - id: complete
      from: [planned]
      to: done
      permission: base.activities.write
      mutation:
        guards: [{ query: "SELECT id FROM base_activities WHERE id = :id AND state = 'planned'", status: 409, code: BASE_ACTIVITY_STALE, message: Only planned activities can be completed. }]
        steps: [{ query: "UPDATE base_activities SET state = 'done', completed_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND state = 'planned'" }]
        result: { query: "SELECT id, state, row_version FROM base_activities WHERE id = :id" }
