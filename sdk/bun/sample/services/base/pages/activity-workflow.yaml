workflow:
  id: base_contacts
  entity: base_contacts
  handler: order_transition
  initial: Active
  permission: base.contacts.write
  mutable: true
  states: [{ id: Active, label: Active, color: green }, { id: Archived, label: Archived, color: neutral, terminal: true }]
  transitions:
    - id: archive
      from: [Active]
      to: Archived
      permission: base.contacts.write
      mutation:
        guards: [{ query: "SELECT id FROM base_contacts WHERE id = :id AND active = true", status: 409, message: Only active contacts can be archived }]
        steps: [{ query: "UPDATE base_contacts SET active = false, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id" }]
        result: { query: "SELECT * FROM base_contacts WHERE id = :id" }
