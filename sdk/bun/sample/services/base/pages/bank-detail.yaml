title: Bank
page: { id: bank-detail, route: /base-bank-detail, breadcrumb: [Contacts, Configuration, Bank Accounts, Banks, Detail], auth: { require: [base.reference.read] } }
components:
  - type: OdooFormView
    source: bank_detail
    title_field: name
    status_field: active
    header_actions: [{ id: edit_bank_detail, label: Edit, variant: secondary, permission: base.reference.write }]
    groups:
      - title: Bank Details
        fields: [{ field: name, label: Bank Name }, { field: bic, label: BIC }]
      - title: Bank Address
        fields: [{ field: street, label: Street }, { field: street2, label: Street 2 }, { field: city, label: City }, { field: state, label: State }, { field: zip, label: ZIP }, { field: country, label: Country }]
      - title: Communication Details
        fields: [{ field: phone, label: Phone }, { field: email, label: Email }]
