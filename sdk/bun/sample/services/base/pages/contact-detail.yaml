title: Contact
page: { id: contact-detail, route: /contacts/detail, breadcrumb: [Contacts, Detail], auth: { require: [base.contacts.read] } }
components:
  - type: OdooFormView
    source: contact_detail
    title_field: name
    subtitle_field: email
    avatar_field: avatar_url
    avatar_initials_field: avatar_initials
    status_field: active
    status_label_field: active_label
    status_colors: { Active: green, Archived: neutral }
    status_badges: [{ value: true, label: Active, tone: green }, { value: false, label: Archived, tone: neutral }]
    editable: true
    content_slot: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    header_actions:
      - { id: edit_contact_detail, label: Edit, variant: secondary, permission: base.contacts.write }
    stat_buttons:
      - { id: open_contact_livechat, label: Live Chat, value_field: livechat_channel_count, permission: livechat.read, show_if: 'row.livechat_channel_count > 0' }
      - { id: open_contact_opportunities, label: Opportunities, value_field: opportunities_count, permission: base.contacts.read }
      - { id: open_contact_invoices, label: Invoiced, value_field: invoiced_amount_display, permission: base.contacts.read }
      - { id: open_contact_meetings, label: Meetings, value_field: meetings_count, permission: base.contacts.read }
      - { id: open_contact_tasks, label: Tasks, value_field: tasks_count, permission: base.contacts.read }
      - { id: open_contact_purchases, label: Purchases, value_field: purchases_count, permission: base.contacts.read }
      - { id: open_contact_lots, label: Lots/Serial Numbers, value_field: lots_count, permission: base.contacts.read }
    group_columns: 2
    groups:
      - title: Contact
        fields:
          - { field: name, label: Name }
          - { field: company_type, label: Type }
          - { field: email, label: Email }
          - { field: phone, label: Phone }
          - { field: parent_company_name, label: Company }
          - { field: website, label: Website }
          - { field: categories, label: Tags }
      - title: Address
        fields:
          - { field: street, label: Street }
          - { field: street2, label: Street 2 }
          - { field: city, label: City }
          - { field: state_name, label: State }
          - { field: zip, label: ZIP }
          - { field: country_name, label: Country }
          - { field: language_code, label: Language }
    notebook:
      tabs:
        - { id: contacts, label: Contacts, content_slot: true }
        - id: sales-purchase
          label: Sales & Purchase
          fields: [{ field: currency_code, label: Currency }, { field: is_company, label: Is a company }]
        - id: invoicing
          label: Invoicing
          fields: [{ field: invoiced_amount_display, label: Invoiced }]
        - id: notes
          label: Notes
          fields: [{ field: notes, label: Notes, type: textarea, wide: true }]
    message_source: contact_messages
    follower_source: contact_followers
    attachment_source: contact_attachments
    activity_action: schedule_activity
    chatter_label: Chatter
    chatter_empty: No messages or activities yet
    message_action_field: action
    message_detail_field: detail
    message_timestamp_field: created_at
    message_actor_field: actor_name
  - type: ListView
    variant: odoo
    source: contact_activities
    create_action: schedule_activity
    create_label: Schedule activity
    responsive_card: true
    mount_in: previous-panel
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        card:
          title: summary
          subtitle: activity_type
          fields: [{ field: state, label: Status }, { field: due_date, label: Due date }, { field: assigned_user_name, label: Assigned to }]
    columns: [{ field: summary, label: Summary }, { field: activity_type, label: Type }, { field: state, label: Status }, { field: due_date, label: Due date }, { field: assigned_user_name, label: Assigned to }]
    row_open_action: view_activity
    row_double_click_action: view_activity
    empty_state: { title: No scheduled activities, description: Schedule an activity to keep this contact moving. }
