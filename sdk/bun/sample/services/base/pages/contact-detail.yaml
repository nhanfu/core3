title: Contact
page: { id: contact-detail, route: /contacts/detail, breadcrumb: [Contacts, Detail], auth: { require: [base.contacts.read] } }
components:
  - type: OdooFormView
    source: contact_detail
    title_field: name
    subtitle_field: email
    avatar_field: avatar_url
    avatar_initials_field: avatar_initials
    status_field: active
    status_label_field: active_label
    status_colors: { Active: green, Archived: neutral }
    status_badges: [{ value: true, label: Active, tone: green }, { value: false, label: Archived, tone: neutral }]
    editable: true
    content_slot: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    header_actions:
      - { id: edit_contact_detail, label: Edit, variant: secondary, permission: base.contacts.write }
    action_menu:
      label: Actions
      aria_label: Actions menu
      icon: more-vertical
      actions:
        - { id: duplicate_contact_ui, label: Duplicate, icon: copy, permission: base.contacts.write }
    stat_buttons:
      - { id: open_contact_livechat, label: Live Chat, value_field: livechat_channel_count, permission: livechat.read, show_if: 'row.livechat_channel_count > 0' }
      - { id: open_contact_opportunities, label: Opportunities, value_field: opportunities_count, permission: base.contacts.read }
      - { id: open_contact_invoices, label: Invoiced, value_field: invoiced_amount_display, permission: base.contacts.read }
      - { id: open_contact_meetings, label: Meetings, value_field: meetings_count, permission: base.contacts.read }
      - { id: open_contact_tasks, label: Tasks, value_field: tasks_count, permission: base.contacts.read }
      - { id: open_contact_purchases, label: Purchases, value_field: purchases_count, permission: base.contacts.read }
      - { id: open_contact_lots, label: Lots/Serial Numbers, value_field: lots_count, permission: base.contacts.read }
    group_columns: 2
    groups:
      - title: Contact
        fields:
          - { field: name, label: Name }
          - { field: company_type, label: Type }
          - { field: email, label: Email }
          - { field: phone, label: Phone }
          - { field: parent_company_id, label: Company, options_source: contact_detail_parent_companies }
          - { field: website, label: Website }
          - { field: categories, label: Tags }
      - title: Address
        fields:
          - { field: street, label: Street }
          - { field: street2, label: Street 2 }
          - { field: city, label: City }
          - { field: state_name, label: State }
          - { field: zip, label: ZIP }
          - { field: country_name, label: Country }
          - { field: language_code, label: Language }
    notebook:
      tabs:
        - { id: contacts, label: Contacts, content_slot: true }
        - id: sales-purchase
          label: Sales & Purchase
          fields: [{ field: currency_code, label: Currency }, { field: is_company, label: Is a company }]
        - id: invoicing
          label: Invoicing
          fields: [{ field: invoiced_amount_display, label: Invoiced }]
        - id: notes
          label: Notes
          fields: [{ field: notes, label: Notes, type: textarea, wide: true }]
    message_source: contact_messages
    follower_source: contact_followers
    follower_candidates_source: contact_follower_candidates
    follower_candidates_page_size: 100
    follower_add_action: add_contact_follower
    follower_remove_action: remove_contact_follower
    follower_label: Followers
    add_follower_label: Add followers
    remove_follower_label: Remove follower
    no_followers_label: No followers
    follower_search_placeholder: Select a follower
    add_label: Add
    attachment_source: contact_attachments
    attachment_panel_open: true
    activity_action: schedule_activity
    attachment_label: Attachments
    add_attachment_label: Add attachment
    no_attachments_label: No attachments yet
    attachment_upload_action: upload_contact_attachment
    attachment_download_action: download_contact_attachment
    chatter_label: Chatter
    chatter_empty: No messages or activities yet
    message_action: send_contact_message
    note_action: log_contact_note
    message_label: Send message
    note_label: Log note
    message_placeholder: Write a message…
    note_placeholder: Log an internal note…
    send_label: Send
    log_label: Log note
    message_action_field: action
    message_action_labels: { base.contacts.message: Message, base.contacts.note: Internal note, base.contacts.followers.add: Added follower, base.contacts.followers.remove: Removed follower }
    message_detail_field: detail
    message_timestamp_field: created_at
    message_actor_field: actor_name
  - type: LineItemGrid
    mount_in: previous-panel
    source: contact_child_contacts
    parent_source: contact_detail
    title: Contacts
    description: Manage contacts and addresses related to this company.
    variant: odoo_x2many
    page_size: 50
    row_key: id
    actions:
      - { id: add_contact_child, label: Add a line, variant: primary, permission: base.contacts.write }
    empty_state: { title: No contacts, description: Add a contact or address related to this company. }
    children:
      - { type: LineItemField, id: name, field: name, label: Name, required: true }
      - { type: LineItemField, id: company_type, field: company_type, label: Type, readonly: true }
      - { type: LineItemField, id: email, field: email, label: Email, readonly: true }
      - { type: LineItemField, id: phone, field: phone, label: Phone, readonly: true }
      - { type: LineItemField, id: city, field: city, label: City, readonly: true }
      - type: LineItemActions
        id: contact_child_actions
        actions:
          - { id: edit_contact_child, label: Edit, icon: edit, variant: ghost, permission: base.contacts.write }
          - { id: delete_contact_child, label: Delete, icon: trash, variant: danger, permission: base.contacts.write }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell, mobile: true }
      - { field: company_type, label: Type, mobile: true }
      - { field: email, label: Email, mobile: false }
      - { field: phone, label: Phone, mobile: true }
      - { field: city, label: City, mobile: false }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: edit_contact_child, label: Edit, icon: edit, variant: ghost, permission: base.contacts.write }
          - { id: delete_contact_child, label: Delete, icon: trash, variant: danger, permission: base.contacts.write }
  - type: ListView
    variant: odoo
    source: contact_activities
    create_action: schedule_activity
    create_label: Schedule activity
    responsive_card: true
    mount_in: previous-panel
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        card:
          title: summary
          subtitle: activity_type
          fields: [{ field: state, label: Status }, { field: due_date, label: Due date }, { field: assigned_user_name, label: Assigned to }]
    columns: [{ field: summary, label: Summary }, { field: activity_type, label: Type }, { field: state, label: Status }, { field: due_date, label: Due date }, { field: assigned_user_name, label: Assigned to }]
    row_open_action: view_activity
    row_double_click_action: view_activity
    empty_state: { title: No scheduled activities, description: Schedule an activity to keep this contact moving. }
