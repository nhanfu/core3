title: Country
page: { id: country-detail, route: /base-country-detail, breadcrumb: [Contacts, Configuration, Localization, Countries, Detail], auth: { require: [base.reference.read] } }
components:
  - type: OdooFormView
    source: country_detail
    title_field: name
    header_actions: [{ id: edit_country_detail, label: Edit, variant: secondary, permission: base.reference.write }]
    groups:
      - title: Country
        fields: [{ field: name, label: Country }, { field: currency_code, label: Currency }, { field: code, label: Code }]
      - title: Phone and VAT
        fields: [{ field: phone_code, label: Phone Code }, { field: vat_label, label: VAT Label }, { field: zip_required, label: ZIP Required }, { field: state_required, label: State Required }]
      - title: States
        fields: [{ field: states, label: States }]
