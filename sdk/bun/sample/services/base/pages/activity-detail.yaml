title: Activity
page: { id: activity-detail, breadcrumb: [Contacts, Activity, Detail], auth: { require: [base.activities.read] } }
datasources:
  - id: activity_detail
    single: true
    permission: base.activities.read
    mock_data:
      default: { id: activity-demo, summary: Welcome call, activity_type: call, state: planned, due_date: '2026-09-09', assigned_user_name: Administrator, note: Confirm requirements }
components:
  - type: OdooFormView
    source: activity_detail
    title_field: summary
    status_field: state
    groups:
      - title: Activity
        fields: [{ field: summary, label: Summary }, { field: activity_type, label: Type }, { field: state, label: Status }, { field: due_date, label: Due date }, { field: assigned_user_name, label: Assigned to }, { field: note, label: Note }]
