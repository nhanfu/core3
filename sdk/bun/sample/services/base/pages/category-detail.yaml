title: Contact Category
page: { id: category-detail, breadcrumb: [Contacts, Configuration, Categories], auth: { require: [base.reference.read] } }
datasources:
  - { id: category_detail, single: true, permission: base.reference.read, query: "SELECT id, name, color FROM base_contact_categories WHERE id = :id" }
components:
  - type: OdooFormView
    source: category_detail
    title_field: name
    groups: [{ title: Category, fields: [{ field: id, label: ID }, { field: name, label: Category }, { field: color, label: Color }] }]
