title: Companies
page: { id: companies, breadcrumb: [Contacts, Companies], auth: { require: [base.companies.read] } }
components:
  - type: ListView
    variant: odoo
    source: companies
    create_action: create_company
    create_label: New company
    search: { label: Search companies, placeholder: 'Search company or email...' }
    filters: [{ field: active, label: Status, options_source: company_active_states }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        card:
          title: name
          subtitle: email
          fields:
            - { field: phone, label: Phone }
            - { field: city, label: City }
            - { field: country_name, label: Country }
            - { field: currency_code, label: Currency }
    columns: [{ field: name, label: Company, type: PrimaryEntityCell }, { field: email, label: Email }, { field: phone, label: Phone }, { field: city, label: City }, { field: country_name, label: Country }, { field: currency_code, label: Currency }, { field: id, label: ' ', sortable: false, actions: [{ id: archive_company, label: Archive, icon: archive, variant: danger, show_if: 'row.active === true' }, { id: unarchive_company, label: Unarchive, icon: refresh, show_if: 'row.active === false' }, { id: delete_company, label: Delete, icon: trash, variant: danger }] }]
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_company
    row_double_click_action: view_company
    form_view: { page: apps/services/base/pages/company-detail.yaml, side_panel: true }
    actions:
      - { id: edit_company, label: Edit, permission: base.companies.write, variant: ghost }
      - { id: archive_company, label: Archive, permission: base.companies.write, variant: danger }
