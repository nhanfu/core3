title: Companies
page: { id: companies, breadcrumb: [Contacts, Companies], auth: { require: [base.companies.read] } }
datasources:
  - id: companies
    permission: base.companies.read
    mock_data:
      default:
        - { id: company-demo, row_version: 1, name: Core3 Demo Company, email: hello@core3.local, phone: '+1 555 0100', street: 100 Main Street, city: San Francisco, state_name: California, zip: '94105', country_name: United States, currency_code: USD, active: true }
        - { id: company-vietnam, row_version: 1, name: Core3 Vietnam Branch, email: vn@core3.local, phone: '+84 28 5555 0100', street: 1 Nguyen Hue, city: Ho Chi Minh City, state_name: Ho Chi Minh City, zip: '700000', country_name: Vietnam, currency_code: VND, active: true }
      states:
        empty: []
        filtered:
          - { id: company-demo, row_version: 1, name: Core3 Demo Company, email: hello@core3.local, phone: '+1 555 0100', street: 100 Main Street, city: San Francisco, state_name: California, zip: '94105', country_name: United States, currency_code: USD, active: true }
components:
  - type: ListView
    variant: odoo
    source: companies
    create_action: create_company
    create_label: New company
    search: { label: Search companies, placeholder: 'Search company or email...' }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        card:
          title: name
          subtitle: email
          fields:
            - { field: phone, label: Phone }
            - { field: city, label: City }
            - { field: country_name, label: Country }
            - { field: currency_code, label: Currency }
    columns: [{ field: name, label: Company, type: PrimaryEntityCell }, { field: email, label: Email }, { field: phone, label: Phone }, { field: city, label: City }, { field: country_name, label: Country }, { field: currency_code, label: Currency }]
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_company
    row_double_click_action: view_company
    form_view: { page: apps/services/base/pages/company-detail.yaml, side_panel: true }
    actions:
      - { id: edit_company, label: Edit, permission: base.companies.write, variant: ghost }
      - { id: archive_company, label: Archive, permission: base.companies.write, variant: danger }
actions:
  - id: create_company
    type: server_form
    permission: base.companies.write
    title: New company
    action: base.companies.create
    handler: yaml_mutation
    operation: create
    refresh: [companies]
    mutation: { operation: insert, table: base_contacts, fields: [name, company_type, email, phone, street, city, state_name, zip, country_name, currency_code, is_company], required: [name], defaults: { company_type: company, is_company: true }, result: { query: "SELECT * FROM base_contacts WHERE id = :id" } }
    fields: [{ field: name, label: Company name, type: text, required: true }, { field: email, label: Email, type: text }, { field: phone, label: Phone, type: text }, { field: street, label: Street, type: text }, { field: city, label: City, type: text }, { field: state_name, label: State, type: text }, { field: zip, label: ZIP, type: text }, { field: country_name, label: Country, type: text }, { field: currency_code, label: Currency, type: text }]
  - id: edit_company
    type: server_form
    permission: base.companies.write
    title: Edit company
    action: base.companies.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [companies]
    mutation:
      operation: update
      table: base_contacts
      fields: [name, email, phone, street, city, state_name, zip, country_name, currency_code]
      required: [name]
      timestamps: true
      guards: [{ query: "SELECT id FROM base_contacts WHERE id = :id AND is_company = true AND active = true", status: 409, message: Only active companies can be edited }]
    fields: [{ field: name, label: Company name, type: text, required: true }, { field: email, label: Email, type: text }, { field: phone, label: Phone, type: text }, { field: street, label: Street, type: text }, { field: city, label: City, type: text }, { field: state_name, label: State, type: text }, { field: zip, label: ZIP, type: text }, { field: country_name, label: Country, type: text }, { field: currency_code, label: Currency, type: text }]
  - id: archive_company
    type: server
    permission: base.companies.write
    action: base.companies.archive
    handler: yaml_mutation
    mutation:
      guards: [{ query: "SELECT id FROM base_contacts WHERE id = :id AND is_company = true AND active = true", status: 409, message: Company is already archived or unavailable }]
      steps: [{ query: "UPDATE base_contacts SET active = false, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id" }]
    refresh: [companies]
  - id: view_company
    type: navigate
    permission: base.companies.read
    navigate_to: /company-detail
    params: { id: '{row.id}' }
