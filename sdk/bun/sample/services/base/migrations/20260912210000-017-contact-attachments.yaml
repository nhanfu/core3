    up: |
      CREATE TABLE IF NOT EXISTS base_contact_attachments (id VARCHAR PRIMARY KEY, contact_id VARCHAR NOT NULL, file_name VARCHAR NOT NULL, mime_type VARCHAR NOT NULL, size_bytes BIGINT NOT NULL DEFAULT 0, storage_key VARCHAR NOT NULL, uploaded_by VARCHAR, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
