      INSERT INTO base_contacts(id, name, company_type, email, phone, street, city, state_name, zip, country_name, currency_code, is_company, active, parent_company_id, website, language_code)
      VALUES
        ('company-northwind', 'Northwind Traders', 'company', 'hello@northwind.core3.local', '+1 555 0120', '20 Harbor Way', 'Seattle', 'Washington', '98101', 'United States', 'USD', true, true, NULL, 'https://northwind.core3.local', 'en_US'),
        ('company-archived', 'Archived Company', 'company', 'archived.company@core3.local', '+1 555 0121', 'Old Commerce Road', 'Portland', 'Oregon', '97201', 'United States', 'USD', true, false, NULL, NULL, 'en_US')
