version: 0.0.8
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS base_country_group_countries (
        code VARCHAR PRIMARY KEY,
        name VARCHAR NOT NULL UNIQUE,
        currency_code VARCHAR NOT NULL DEFAULT 'EUR'
      );
      CREATE TABLE IF NOT EXISTS base_country_groups (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        sequence INTEGER NOT NULL DEFAULT 999,
        name VARCHAR NOT NULL UNIQUE,
        code VARCHAR UNIQUE,
        country_codes VARCHAR NOT NULL DEFAULT '',
        country_names VARCHAR NOT NULL DEFAULT '',
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 11:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 11:00:00'
      );
