        WHEN 'country-group-eurasia' THEN 6
        WHEN 'country-group-ch-li' THEN 7
        WHEN 'country-group-dom-tom' THEN 8
        WHEN 'country-group-eu-vat' THEN 9
        WHEN 'country-group-intrastat' THEN 10
        ELSE sequence
      END;
      UPDATE base_country_groups g SET country_names = COALESCE((SELECT STRING_AGG(c.name, ', ' ORDER BY c.name) FROM base_country_group_countries c WHERE POSITION(',' || c.code || ',' IN ',' || g.country_codes || ',') > 0), '');
