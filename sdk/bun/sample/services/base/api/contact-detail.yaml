      steps:
        - { query: "UPDATE base_activities SET due_date = CURRENT_DATE, row_version = row_version + 1 WHERE id IN :selectedIds AND state = 'planned'", expect_changed: true, status: 409, code: BASE_CONTACT_ACTIVITY_STALE, message: A selected activity changed before it could be rescheduled. Reload before trying again. }
