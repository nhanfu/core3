page: { id: contact-detail }
datasources:
  - id: contact_detail
    single: true
    permission: base.contacts.read
    error_states: { transport_error: { status: 503, code: BASE_CONTACT_DETAIL_UNAVAILABLE, message: Contact details are temporarily unavailable } }
    query: "SELECT c.*, CASE WHEN c.active THEN 'Active' ELSE 'Archived' END AS active_label, (SELECT string_agg(r.category_name, ', ') FROM base_contact_categories_rel r WHERE r.contact_id = c.id) AS categories, CAST(NULL AS VARCHAR) AS avatar_url, upper(substr(c.name, 1, 1)) AS avatar_initials, parent.name AS parent_company_name, 0 AS opportunities_count, '$0.00' AS invoiced_amount_display, 0 AS meetings_count, 0 AS tasks_count, 0 AS purchases_count, 0 AS lots_count FROM base_contacts c LEFT JOIN base_contacts parent ON parent.id = c.parent_company_id AND (COALESCE(:current_company_id, '') = '' OR parent.company_id = :current_company_id) WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND c.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)"
  - id: contact_activities
    permission: base.activities.read
    error_states: { transport_error: { status: 503, code: BASE_CONTACT_DETAIL_UNAVAILABLE, message: Contact activities are temporarily unavailable } }
    query: "SELECT a.id, a.summary, a.activity_type, a.state, CAST(a.due_date AS VARCHAR) AS due_date, a.assigned_user_name FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND a.contact_id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) ORDER BY a.due_date DESC"
  - id: contact_messages
    permission: base.contacts.read
    query: "SELECT id, contact_id, actor_name, action, action_label, detail, created_at FROM (SELECT 'contact-message-created-' || c.id AS id, c.id AS contact_id, 'Administrator' AS actor_name, 'contact.created' AS action, 'Contact created' AS action_label, 'Created from the deterministic Core3 demo fixture for ' || c.name AS detail, TIMESTAMP '2026-09-01 09:00:00' AS created_at FROM base_contacts c WHERE c.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) UNION ALL SELECT 'contact-message-note-' || c.id AS id, c.id AS contact_id, 'Administrator' AS actor_name, 'contact.note' AS action, 'Internal note' AS action_label, 'Confirm contact details before the next outreach' AS detail, TIMESTAMP '2026-09-03 14:30:00' AS created_at FROM base_contacts c WHERE c.id = :id AND c.id = 'contact-demo' AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) UNION ALL SELECT m.id, m.contact_id, m.actor_name, m.action, m.action_label, m.detail, m.created_at FROM base_contact_messages m JOIN base_contacts c ON c.id = m.contact_id WHERE m.contact_id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)) messages WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 ORDER BY created_at DESC"
  - id: contact_followers
    permission: base.contacts.read
    query: "SELECT f.user_id, f.name, f.email, CAST(f.created_at AS VARCHAR) AS followed_at FROM base_contact_followers f JOIN base_contacts c ON c.id = f.contact_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND f.contact_id = :id AND c.active = true AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) ORDER BY f.created_at, f.user_id"
  - id: contact_follower_candidates
    permission: base.contacts.write
    query: "SELECT u.id AS value, u.name || ' · ' || u.email AS label FROM base_contact_follower_catalog u JOIN base_contacts c ON c.id = :id WHERE u.active = true AND c.active = true AND NOT EXISTS (SELECT 1 FROM base_contact_followers f WHERE f.contact_id = :id AND f.user_id = u.id) AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) ORDER BY u.name, u.id"
  - id: contact_detail_parent_companies
    permission: base.contacts.read
    query: "SELECT id AS value, name AS label FROM base_contacts WHERE is_company = true AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id) ORDER BY name, id"
  - id: contact_attachments
    permission: base.contacts.read
    query: "SELECT id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM (SELECT a.id, a.file_name, a.mime_type, a.size_bytes, a.uploaded_by, a.created_at FROM base_contact_attachments a JOIN base_contacts c ON c.id = a.contact_id WHERE a.contact_id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) UNION ALL SELECT 'contact-attachment-001', 'contact-brief.txt', 'text/plain', 128, 'Administrator', TIMESTAMP '2026-09-02 10:00:00' WHERE :id = 'contact-demo' AND (COALESCE(:current_company_id, '') = '' OR EXISTS (SELECT 1 FROM base_contacts c WHERE c.id = :id AND c.company_id = :current_company_id))) attachments WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 ORDER BY created_at DESC"
  - id: livechat_partner_capabilities
    single: true
    permission: livechat.read
    error_states:
      unauthorized: { status: 401, code: LIVECHAT_PARTNER_HISTORY_UNAUTHORIZED, message: Sign in to view Live Chat history for this contact. }
      forbidden: { status: 403, code: LIVECHAT_PARTNER_HISTORY_FORBIDDEN, message: You do not have permission to view this contact's Live Chat history. }
      transport_error: { status: 503, code: LIVECHAT_PARTNER_HISTORY_UNAVAILABLE, message: Contact Live Chat history is temporarily unavailable. }
    query: "SELECT id AS partner_id, COALESCE(livechat_channel_count, 0) AS livechat_channel_count, 0 AS livechat_session_count FROM base_contacts WHERE id = :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id) AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
actions:
  - id: edit_contact_detail
    type: server_form
    permission: base.contacts.write
    title: Edit contact
    action: base.contacts.update
    handler: yaml_mutation
    operation: update
    prefill: state.contact_detail
    refresh: [contact_detail, contact_activities, contact_messages]
    mutation:
      operation: update
      table: base_contacts
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, parent_company_id, currency_code, is_company, notes]
      required: [name]
      timestamps: true
      concurrency: { field: row_version, input: expected_row_version }
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true", status: 409, code: BASE_CONTACT_ARCHIVED, message: Archived contacts cannot be edited }
        - { query: "SELECT 1 AS ok WHERE :email IS NULL OR NOT EXISTS (SELECT 1 FROM base_contacts WHERE active = true AND email IS NOT NULL AND lower(email) = lower(:email) AND id <> :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id))", status: 409, code: BASE_CONTACT_EMAIL_EXISTS, message: A contact with this email already exists }
        - { query: "SELECT 1 WHERE :parent_company_id IS NULL OR (:parent_company_id <> :id AND EXISTS (SELECT 1 FROM base_contacts WHERE id = :parent_company_id AND is_company = true AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)))", status: 422, code: BASE_PARENT_COMPANY_INVALID, message: Parent must be an active company in the current company. }
        - { query: "WITH RECURSIVE ancestors(id, parent_company_id) AS (SELECT id, parent_company_id FROM base_contacts WHERE id = :parent_company_id UNION ALL SELECT c.id, c.parent_company_id FROM base_contacts c JOIN ancestors a ON c.id = a.parent_company_id WHERE a.parent_company_id IS NOT NULL) SELECT 1 WHERE :parent_company_id IS NULL OR NOT EXISTS (SELECT 1 FROM ancestors WHERE id = :id)", status: 422, code: BASE_PARENT_COMPANY_CYCLE, message: A contact cannot be assigned below one of its descendants. }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options: [{ value: person, label: Person }, { value: company, label: Company }, { value: other, label: Other }] }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: street2, label: Street 2, type: text }
      - { field: city, label: City, type: text }
      - { field: state_name, label: State, type: text }
      - { field: zip, label: ZIP, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: parent_company_id, label: Company, type: select, options_source: contact_detail_parent_companies }
      - { field: currency_code, label: Currency, type: text }
      - { field: is_company, label: Is a company, type: checkbox }
      - { field: notes, label: Notes, type: textarea }
  - id: schedule_activity
    type: server_form
    permission: base.activities.write
    title: Schedule activity
    action: base.activities.create
    handler: yaml_mutation
    operation: create
    refresh: [contact_activities]
    mutation: { operation: insert, table: base_activities, fields: [contact_id, summary, activity_type, due_date, assigned_user_id, assigned_user_name, note], required: [contact_id, summary, due_date], defaults: { state: planned } }
    fields: [{ field: contact_id, label: Contact, type: text, required: true }, { field: summary, label: Summary, type: text, required: true }, { field: activity_type, label: Type, type: select, options: [{ value: todo, label: To-do }, { value: call, label: Call }, { value: meeting, label: Meeting }, { value: email, label: Email }] }, { field: due_date, label: Due date, type: text, required: true }, { field: assigned_user_id, label: Assigned user ID, type: text }, { field: assigned_user_name, label: Assigned to, type: text }, { field: note, label: Note, type: textarea }]
  - id: send_contact_message
    type: server_form
    permission: base.contacts.write
    title: Send message
    action: base.contacts.chatter.message
    handler: order_chatter
    operation: message
    refresh: [contact_messages]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 400, code: BASE_CONTACT_MESSAGE_LENGTH, message: Message content must be between 1 and 4000 characters }
        - { query: "SELECT id FROM base_contacts WHERE id = :id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
      steps: [{ query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_id, :current_user_name, 'base.contacts.message', 'Message', TRIM(CAST(:content AS VARCHAR)))" }]
      result: { query: "SELECT id, contact_id, actor_name, action, action_label, detail, created_at FROM base_contact_messages WHERE id = :message_id" }
  - id: log_contact_note
    type: server_form
    permission: base.contacts.write
    title: Log note
    action: base.contacts.chatter.note
    handler: order_chatter
    operation: note
    refresh: [contact_messages]
    fields: [{ field: content, label: Note, type: textarea, required: true }]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 400, code: BASE_CONTACT_NOTE_LENGTH, message: Note content must be between 1 and 4000 characters }
        - { query: "SELECT id FROM base_contacts WHERE id = :id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
      steps: [{ query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_id, :current_user_name, 'base.contacts.note', 'Internal note', TRIM(CAST(:content AS VARCHAR)))" }]
      result: { query: "SELECT id, contact_id, actor_name, action, action_label, detail, created_at FROM base_contact_messages WHERE id = :message_id" }
  - id: add_contact_follower
    type: server
    permission: base.contacts.write
    action: base.contacts.followers.add
    handler: order_chatter
    operation: follower_add
    params: { user_id: '{row.user_id}', expected_row_version: '{state.contact_detail.row_version}' }
    refresh: [contact_detail, contact_followers, contact_follower_candidates, contact_messages]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: BASE_CONTACT_FOLLOWER_ACTOR_REQUIRED, message: An authenticated contact actor is required. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 404, code: BASE_CONTACT_FOLLOWER_CONTACT_NOT_FOUND, message: Active contact not found in the current company. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 409, code: STALE_RECORD, message: The contact changed before the follower was added. }
        - { query: "SELECT id FROM base_contact_follower_catalog WHERE id = :user_id AND active = true", status: 404, code: BASE_CONTACT_FOLLOWER_USER_NOT_FOUND, message: Select an enabled follower. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_contact_followers WHERE contact_id = :id AND user_id = :user_id)", status: 409, code: BASE_CONTACT_FOLLOWER_EXISTS, message: This user already follows the contact. }
      steps:
        - query: "INSERT INTO base_contact_followers(contact_id, user_id, name, email, added_by) SELECT :id, u.id, u.name, u.email, :current_user_id FROM base_contact_follower_catalog u WHERE u.id = :user_id AND u.active = true"
        - query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id, :id, :current_user_id, :current_user_name, 'base.contacts.followers.add', 'Added follower', u.name || ' now follows ' || c.name FROM base_contact_follower_catalog u JOIN base_contacts c ON c.id = :id WHERE u.id = :user_id"
        - query: "UPDATE base_contacts SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The contact changed before the follower was added.
      result: { query: "SELECT :user_id AS user_id, u.name, u.email, false AS removed FROM base_contact_follower_catalog u WHERE u.id = :user_id" }
  - id: remove_contact_follower
    type: server
    permission: base.contacts.write
    action: base.contacts.followers.remove
    handler: order_chatter
    operation: follower_remove
    params: { user_id: '{row.user_id}', expected_row_version: '{state.contact_detail.row_version}' }
    refresh: [contact_detail, contact_followers, contact_follower_candidates, contact_messages]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: BASE_CONTACT_FOLLOWER_ACTOR_REQUIRED, message: An authenticated contact actor is required. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 404, code: BASE_CONTACT_FOLLOWER_CONTACT_NOT_FOUND, message: Active contact not found in the current company. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 409, code: STALE_RECORD, message: The contact changed before the follower was removed. }
        - { query: "SELECT user_id FROM base_contact_followers WHERE contact_id = :id AND user_id = :user_id", status: 404, code: BASE_CONTACT_FOLLOWER_NOT_FOUND, message: Follower not found for this contact. }
      steps:
        - query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id, :id, :current_user_id, :current_user_name, 'base.contacts.followers.remove', 'Removed follower', f.name || ' no longer follows ' || c.name FROM base_contact_followers f JOIN base_contacts c ON c.id = :id WHERE f.contact_id = :id AND f.user_id = :user_id"
        - query: "DELETE FROM base_contact_followers WHERE contact_id = :id AND user_id = :user_id"
        - query: "UPDATE base_contacts SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The contact changed before the follower was removed.
      result: { query: "SELECT :user_id AS user_id, u.name, u.email, true AS removed FROM base_contact_follower_catalog u WHERE u.id = :user_id" }
  - { id: view_activity, type: navigate, permission: base.activities.read, navigate_to: /activity-detail, params: { id: '{row.id}' } }
  - { id: open_contact_opportunities, type: navigate, permission: base.contacts.read, navigate_to: /contacts, params: { contact_id: '{row.id}', stat: opportunities } }
  - { id: open_contact_invoices, type: navigate, permission: base.contacts.read, navigate_to: /contacts, params: { contact_id: '{row.id}', stat: invoices } }
  - { id: open_contact_meetings, type: navigate, permission: base.contacts.read, navigate_to: /contacts, params: { contact_id: '{row.id}', stat: meetings } }
  - { id: open_contact_tasks, type: navigate, permission: base.contacts.read, navigate_to: /contacts, params: { contact_id: '{row.id}', stat: tasks } }
  - { id: open_contact_purchases, type: navigate, permission: base.contacts.read, navigate_to: /contacts, params: { contact_id: '{row.id}', stat: purchases } }
  - { id: open_contact_lots, type: navigate, permission: base.contacts.read, navigate_to: /contacts, params: { contact_id: '{row.id}', stat: lots } }
  - id: open_contact_livechat
    type: navigate
    permission: livechat.read
    navigate_to: /livechat-sessions/all
    params: { partner_id: '{state.contact_detail.id}' }
  - id: delete_contact
    type: server
    permission: base.contacts.manage
    action: base.contacts.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{state.contact_detail.id}' }
    mutation:
      operation: delete
      table: base_contacts
      concurrency: { field: row_version, input: expected_row_version }
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
        - { query: "SELECT 1 AS ok FROM base_contacts WHERE id = :id AND NOT EXISTS (SELECT 1 FROM base_contacts child WHERE child.parent_company_id = base_contacts.id)", status: 409, code: BASE_CONTACT_HAS_CHILDREN, message: Contacts with child contacts cannot be deleted. Archive the contact instead. }
      result: { query: "SELECT :id AS id, true AS deleted" }
  - id: upload_contact_attachment
    type: upload
    action: base.contacts.attachments.upload
    handler: attachment_metadata
    permission: base.contacts.write
    kind: base_contact_attachment
    params: { contact_id: '{state.contact_detail.id}' }
    refresh: [contact_attachments, contact_messages]
    mutation:
      generated: [attachment_id]
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :contact_id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :contact_id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
      steps:
        - { query: "INSERT INTO base_contact_attachments(id, contact_id, file_name, mime_type, size_bytes, storage_key, uploaded_by) VALUES(:attachment_id, :contact_id, :fileName, :mimeType, :sizeBytes, :storageKey, :current_user_id)" }
      result: { query: "SELECT id, contact_id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM base_contact_attachments WHERE id = :attachment_id" }
  - id: download_contact_attachment
    type: download
    permission: base.contacts.read
    kind: base_contact_attachment
