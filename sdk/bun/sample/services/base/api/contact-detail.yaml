        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id IN :selectedIds AND (a.state <> 'planned' OR (COALESCE(:current_company_id, '') <> '' AND c.company_id <> :current_company_id)))", status: 403, code: BASE_CONTACT_ACTIVITY_SCOPE, message: All selected activities must be planned and in the current company. }
