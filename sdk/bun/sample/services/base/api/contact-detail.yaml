  - id: add_contact_follower
    type: server
    permission: base.contacts.write
    action: base.contacts.followers.add
    handler: order_chatter
    operation: follower_add
    params: { user_id: '{row.user_id}', expected_row_version: '{state.contact_detail.row_version}' }
    refresh: [contact_detail, contact_followers, contact_follower_candidates, contact_messages]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: BASE_CONTACT_FOLLOWER_ACTOR_REQUIRED, message: An authenticated contact actor is required. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 404, code: BASE_CONTACT_FOLLOWER_CONTACT_NOT_FOUND, message: Active contact not found in the current company. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 409, code: STALE_RECORD, message: The contact changed before the follower was added. }
        - { query: "SELECT id FROM base_contact_follower_catalog WHERE id = :user_id AND active = true", status: 404, code: BASE_CONTACT_FOLLOWER_USER_NOT_FOUND, message: Select an enabled follower. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_contact_followers WHERE contact_id = :id AND user_id = :user_id)", status: 409, code: BASE_CONTACT_FOLLOWER_EXISTS, message: This user already follows the contact. }
      steps:
        - query: "INSERT INTO base_contact_followers(contact_id, user_id, name, email, added_by) SELECT :id, u.id, u.name, u.email, :current_user_id FROM base_contact_follower_catalog u WHERE u.id = :user_id AND u.active = true"
        - query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id, :id, :current_user_id, :current_user_name, 'base.contacts.followers.add', 'Added follower', u.name || ' now follows ' || c.name FROM base_contact_follower_catalog u JOIN base_contacts c ON c.id = :id WHERE u.id = :user_id"
        - query: "UPDATE base_contacts SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The contact changed before the follower was added.
      result: { query: "SELECT :user_id AS user_id, u.name, u.email, false AS removed FROM base_contact_follower_catalog u WHERE u.id = :user_id" }
  - id: remove_contact_follower
    type: server
