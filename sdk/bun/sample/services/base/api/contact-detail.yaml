page: { id: contact-detail }
datasources:
  - id: contact_detail
    single: true
    permission: base.contacts.read
    error_states: { transport_error: { status: 503, code: BASE_CONTACT_DETAIL_UNAVAILABLE, message: Contact details are temporarily unavailable } }
    query: "SELECT c.*, CASE WHEN c.active THEN 'Active' ELSE 'Archived' END AS active_label, (SELECT string_agg(r.category_name, ', ') FROM base_contact_categories_rel r WHERE r.contact_id = c.id) AS categories, CAST(NULL AS VARCHAR) AS avatar_url, upper(substr(c.name, 1, 1)) AS avatar_initials, parent.name AS parent_company_name, 0 AS opportunities_count, '$0.00' AS invoiced_amount_display, 0 AS meetings_count, 0 AS tasks_count, 0 AS purchases_count, 0 AS lots_count FROM base_contacts c LEFT JOIN base_contacts parent ON parent.id = c.parent_company_id AND (COALESCE(:current_company_id, '') = '' OR parent.company_id = :current_company_id) WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND c.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)"
  - id: contact_activities
    permission: base.activities.read
    error_states: { transport_error: { status: 503, code: BASE_CONTACT_DETAIL_UNAVAILABLE, message: Contact activities are temporarily unavailable } }
    query: "SELECT a.id, a.row_version, a.summary, a.activity_type, a.state, CAST(a.due_date AS VARCHAR) AS due_date, CAST(a.completed_at AS VARCHAR) AS completed_at, a.assigned_user_name FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND a.contact_id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) ORDER BY a.due_date DESC"
  - id: contact_messages
    permission: base.contacts.read
    query: "SELECT id, contact_id, actor_name, action, action_label, detail, created_at FROM (SELECT 'contact-message-created-' || c.id AS id, c.id AS contact_id, 'Administrator' AS actor_name, 'contact.created' AS action, 'Contact created' AS action_label, 'Created from the deterministic Core3 demo fixture for ' || c.name AS detail, TIMESTAMP '2026-09-01 09:00:00' AS created_at FROM base_contacts c WHERE c.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) UNION ALL SELECT 'contact-message-note-' || c.id AS id, c.id AS contact_id, 'Administrator' AS actor_name, 'contact.note' AS action, 'Internal note' AS action_label, 'Confirm contact details before the next outreach' AS detail, TIMESTAMP '2026-09-03 14:30:00' AS created_at FROM base_contacts c WHERE c.id = :id AND c.id = 'contact-demo' AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) UNION ALL SELECT m.id, m.contact_id, m.actor_name, m.action, m.action_label, m.detail, m.created_at FROM base_contact_messages m JOIN base_contacts c ON c.id = m.contact_id WHERE m.contact_id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)) messages WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 ORDER BY created_at DESC"
  - id: contact_followers
    permission: base.contacts.read
    query: "SELECT f.user_id, f.name, f.email, CAST(f.created_at AS VARCHAR) AS followed_at FROM base_contact_followers f JOIN base_contacts c ON c.id = f.contact_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND f.contact_id = :id AND c.active = true AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) ORDER BY f.created_at, f.user_id"
  - id: contact_follower_candidates
    permission: base.contacts.write
    query: "SELECT u.id AS value, u.name || ' · ' || u.email AS label FROM base_contact_follower_catalog u JOIN base_contacts c ON c.id = :id WHERE u.active = true AND c.active = true AND NOT EXISTS (SELECT 1 FROM base_contact_followers f WHERE f.contact_id = :id AND f.user_id = u.id) AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) ORDER BY u.name, u.id"
  - id: contact_detail_parent_companies
    permission: base.contacts.read
    query: "SELECT id AS value, name AS label FROM base_contacts WHERE is_company = true AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id) ORDER BY name, id"
  - id: contact_child_contacts
    permission: base.contacts.read
    error_states: { transport_error: { status: 503, code: BASE_CONTACT_CHILDREN_UNAVAILABLE, message: Related contacts are temporarily unavailable. } }
    query: "SELECT child.id, child.row_version, child.parent_company_id, child.name, child.company_type, child.email, child.phone, child.city, child.country_name, child.is_company, child.active, upper(substr(child.name, 1, 1)) AS avatar_initials FROM base_contacts child JOIN base_contacts parent ON parent.id = child.parent_company_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND child.parent_company_id = :id AND child.active = true AND parent.active = true AND parent.is_company = true AND (COALESCE(:current_company_id, '') = '' OR child.company_id = :current_company_id) AND (COALESCE(:current_company_id, '') = '' OR parent.company_id = :current_company_id) AND (:q IS NULL OR child.name ILIKE '%' || :q || '%' OR child.email ILIKE '%' || :q || '%' OR child.phone ILIKE '%' || :q || '%') ORDER BY child.name, child.id"
  - id: contact_attachments
    permission: base.contacts.read
    query: "SELECT id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM (SELECT a.id, a.file_name, a.mime_type, a.size_bytes, a.uploaded_by, a.created_at FROM base_contact_attachments a JOIN base_contacts c ON c.id = a.contact_id WHERE a.contact_id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) UNION ALL SELECT 'contact-attachment-001', 'contact-brief.txt', 'text/plain', 128, 'Administrator', TIMESTAMP '2026-09-02 10:00:00' WHERE :id = 'contact-demo' AND (COALESCE(:current_company_id, '') = '' OR EXISTS (SELECT 1 FROM base_contacts c WHERE c.id = :id AND c.company_id = :current_company_id))) attachments WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 ORDER BY created_at DESC"
  - id: livechat_partner_capabilities
    single: true
    permission: livechat.read
    error_states:
      unauthorized: { status: 401, code: LIVECHAT_PARTNER_HISTORY_UNAUTHORIZED, message: Sign in to view Live Chat history for this contact. }
      forbidden: { status: 403, code: LIVECHAT_PARTNER_HISTORY_FORBIDDEN, message: You do not have permission to view this contact's Live Chat history. }
      transport_error: { status: 503, code: LIVECHAT_PARTNER_HISTORY_UNAVAILABLE, message: Contact Live Chat history is temporarily unavailable. }
    query: "SELECT id AS partner_id, COALESCE(livechat_channel_count, 0) AS livechat_channel_count, 0 AS livechat_session_count FROM base_contacts WHERE id = :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id) AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
actions:
  - id: edit_contact_detail
    type: server_form
    permission: base.contacts.write
    title: Edit contact
    action: base.contacts.update
    handler: yaml_mutation
    operation: update
    prefill: state.contact_detail
    refresh: [contact_detail, contact_activities, contact_messages]
    mutation:
      operation: update
      table: base_contacts
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, parent_company_id, currency_code, is_company, notes]
      required: [name]
      timestamps: true
      concurrency: { field: row_version, input: expected_row_version }
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true", status: 409, code: BASE_CONTACT_ARCHIVED, message: Archived contacts cannot be edited }
        - { query: "SELECT 1 AS ok WHERE :email IS NULL OR NOT EXISTS (SELECT 1 FROM base_contacts WHERE active = true AND email IS NOT NULL AND lower(email) = lower(:email) AND id <> :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id))", status: 409, code: BASE_CONTACT_EMAIL_EXISTS, message: A contact with this email already exists }
        - { query: "SELECT 1 WHERE :parent_company_id IS NULL OR (:parent_company_id <> :id AND EXISTS (SELECT 1 FROM base_contacts WHERE id = :parent_company_id AND is_company = true AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)))", status: 422, code: BASE_PARENT_COMPANY_INVALID, message: Parent must be an active company in the current company. }
        - { query: "WITH RECURSIVE ancestors(id, parent_company_id) AS (SELECT id, parent_company_id FROM base_contacts WHERE id = :parent_company_id UNION ALL SELECT c.id, c.parent_company_id FROM base_contacts c JOIN ancestors a ON c.id = a.parent_company_id WHERE a.parent_company_id IS NOT NULL) SELECT 1 WHERE :parent_company_id IS NULL OR NOT EXISTS (SELECT 1 FROM ancestors WHERE id = :id)", status: 422, code: BASE_PARENT_COMPANY_CYCLE, message: A contact cannot be assigned below one of its descendants. }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options: [{ value: person, label: Person }, { value: company, label: Company }, { value: other, label: Other }] }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: street2, label: Street 2, type: text }
      - { field: city, label: City, type: text }
      - { field: state_name, label: State, type: text }
      - { field: zip, label: ZIP, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: parent_company_id, label: Company, type: select, options_source: contact_detail_parent_companies }
      - { field: currency_code, label: Currency, type: text }
      - { field: is_company, label: Is a company, type: checkbox }
      - { field: notes, label: Notes, type: textarea }
  - id: add_contact_child
    type: server_form
    permission: base.contacts.write
    title: Add Contact
    action: base.contacts.children.create
    handler: line_item
    operation: create
    domain: contact_detail
    params: { parent_id: '{state.contact_detail.id}', parent_expected_row_version: '{state.contact_detail.row_version}' }
    refresh: [contact_detail, contact_child_contacts]
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options: [{ value: person, label: Person }, { value: company, label: Company }, { value: other, label: Other }] }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: street2, label: Street 2, type: text }
      - { field: city, label: City, type: text }
      - { field: state_name, label: State, type: text }
      - { field: zip, label: ZIP, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: is_company, label: Is a company, type: checkbox }
    mutation:
      operation: insert
      table: base_contacts
      id_input: child_id
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, company_id, parent_company_id, is_company, active]
      required: [name]
      defaults: { company_type: person, is_company: false, active: true, row_version: 1, created_at: '2026-01-15 09:30:00', updated_at: '2026-01-15 09:30:00' }
      before_steps:
        - { query: "SELECT 'base-contact-child-' || CAST(:parent_id AS VARCHAR) || '-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS child_id", assign: true }
      guards:
        - { query: "SELECT p.id AS parent_id, p.company_id AS company_id, p.id AS parent_company_id, p.row_version AS parent_row_version FROM base_contacts p WHERE p.id = :parent_id AND p.active = true AND p.is_company = true AND p.row_version = :parent_expected_row_version AND (COALESCE(:current_company_id, '') = '' OR p.company_id = :current_company_id)", status: 409, code: BASE_CONTACT_CHILD_PARENT_STALE, message: The company changed before the contact could be added., assign: true }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: BASE_CONTACT_CHILD_NAME_REQUIRED, message: A contact name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_contacts WHERE id = 'base-contact-child-' || CAST(:parent_id AS VARCHAR) || '-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g'))", status: 409, code: BASE_CONTACT_CHILD_EXISTS, message: A contact with this name is already related to the company. }
        - { query: "SELECT 1 AS ok WHERE :email IS NULL OR NOT EXISTS (SELECT 1 FROM base_contacts WHERE active = true AND email IS NOT NULL AND lower(email) = lower(:email) AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id))", status: 409, code: BASE_CONTACT_EMAIL_EXISTS, message: A contact with this email already exists. }
      steps:
        - { query: "UPDATE base_contacts SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :parent_id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: BASE_CONTACT_CHILD_PARENT_STALE, message: The company changed while adding the contact. Reload before saving. }
      result: { query: "SELECT * FROM base_contacts WHERE id = :id" }
  - id: edit_contact_child
    type: server_form
    permission: base.contacts.write
    title: Edit Contact
    action: base.contacts.children.update
    handler: line_item
    operation: update
    domain: contact_detail
    params: { id: '{row.id}', parent_id: '{state.contact_detail.id}', parent_expected_row_version: '{state.contact_detail.row_version}' }
    prefill: row
    refresh: [contact_detail, contact_child_contacts]
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options: [{ value: person, label: Person }, { value: company, label: Company }, { value: other, label: Other }] }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: street2, label: Street 2, type: text }
      - { field: city, label: City, type: text }
      - { field: state_name, label: State, type: text }
      - { field: zip, label: ZIP, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: is_company, label: Is a company, type: checkbox }
    mutation:
      operation: update
      table: base_contacts
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, is_company]
      required: [name]
      timestamps: true
      concurrency: { field: row_version, input: expected_row_version }
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :parent_id AND active = true AND is_company = true AND row_version = :parent_expected_row_version AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 409, code: BASE_CONTACT_CHILD_PARENT_STALE, message: The company changed before the contact could be saved. Reload before saving. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND parent_company_id = :parent_id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 404, code: BASE_CONTACT_CHILD_NOT_FOUND, message: Related contact not found. }
        - { query: "SELECT 1 AS ok WHERE :email IS NULL OR NOT EXISTS (SELECT 1 FROM base_contacts WHERE active = true AND email IS NOT NULL AND lower(email) = lower(:email) AND id <> :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id))", status: 409, code: BASE_CONTACT_EMAIL_EXISTS, message: A contact with this email already exists. }
      steps:
        - { query: "UPDATE base_contacts SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :parent_id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: BASE_CONTACT_CHILD_PARENT_STALE, message: The company changed while saving the contact. Reload before saving. }
      result: { query: "SELECT * FROM base_contacts WHERE id = :id" }
  - id: delete_contact_child
    type: server
    permission: base.contacts.write
    action: base.contacts.children.delete
    handler: line_item
    operation: delete
    domain: contact_detail
    params: { id: '{row.id}', parent_id: '{state.contact_detail.id}', parent_expected_row_version: '{state.contact_detail.row_version}' }
    confirm: Delete this related contact?
    refresh: [contact_detail, contact_child_contacts]
    mutation:
      operation: delete
      table: base_contacts
      concurrency: { field: row_version, input: expected_row_version }
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :parent_id AND active = true AND is_company = true AND row_version = :parent_expected_row_version AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 409, code: BASE_CONTACT_CHILD_PARENT_STALE, message: The company changed before the contact could be deleted. Reload before deleting. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND parent_company_id = :parent_id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 404, code: BASE_CONTACT_CHILD_NOT_FOUND, message: Related contact not found. }
      steps:
        - { query: "UPDATE base_contacts SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :parent_id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: BASE_CONTACT_CHILD_PARENT_STALE, message: The company changed while deleting the contact. Reload before deleting. }
  - id: duplicate_contact
    type: server
    permission: base.contacts.write
    action: base.contacts.duplicate
    handler: yaml_mutation
    operation: duplicate
    mutation:
      before_steps:
        - query: "SELECT COALESCE(NULLIF(CAST(:duplicate_id AS VARCHAR), ''), 'contact-copy-' || regexp_replace(lower(CAST(:source_id AS VARCHAR)), '[^a-z0-9]+', '-', 'g') || '-' || CAST((SELECT COUNT(*) + 1 FROM base_contacts existing WHERE existing.id LIKE 'contact-copy-' || regexp_replace(lower(CAST(:source_id AS VARCHAR)), '[^a-z0-9]+', '-', 'g') || '-%') AS VARCHAR)) AS duplicate_id, source.name || ' (copy)' AS duplicate_name FROM base_contacts source WHERE source.id = :source_id"
          assign: true
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :source_id", status: 404, code: BASE_CONTACT_DUPLICATE_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :source_id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company or archived. }
        - { query: "SELECT id FROM base_contacts WHERE id = :source_id AND row_version = :expected_row_version", status: 409, code: BASE_CONTACT_DUPLICATE_STALE, message: The contact changed before it could be duplicated. Reload it and try again. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_contacts WHERE id = COALESCE(NULLIF(CAST(:duplicate_id AS VARCHAR), ''), 'contact-copy-' || regexp_replace(lower(CAST(:source_id AS VARCHAR)), '[^a-z0-9]+', '-', 'g') || '-' || CAST((SELECT COUNT(*) + 1 FROM base_contacts existing WHERE existing.id LIKE 'contact-copy-' || regexp_replace(lower(CAST(:source_id AS VARCHAR)), '[^a-z0-9]+', '-', 'g') || '-%') AS VARCHAR)))", status: 409, code: BASE_CONTACT_DUPLICATE_EXISTS, message: The duplicate contact already exists. Retry with a fresh request. }
      steps:
        - query: "INSERT INTO base_contacts(id, row_version, name, company_type, email, phone, street, street2, city, state_name, zip, country_name, currency_code, is_company, active, notes, created_at, updated_at, parent_company_id, website, language_code, company_id) SELECT :duplicate_id, 1, :duplicate_name, source.company_type, source.email, source.phone, source.street, source.street2, source.city, source.state_name, source.zip, source.country_name, source.currency_code, source.is_company, true, source.notes, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, source.parent_company_id, source.website, source.language_code, source.company_id FROM base_contacts source WHERE source.id = :source_id"
          expect_changed: true
          status: 409
          code: BASE_CONTACT_DUPLICATE_FAILED
          message: The contact could not be duplicated.
        - query: "INSERT INTO base_contact_categories_rel(contact_id, category_id, category_name) SELECT :duplicate_id, category_id, category_name FROM base_contact_categories_rel WHERE contact_id = :source_id ON CONFLICT (contact_id, category_id) DO NOTHING"
      result: { query: "SELECT * FROM base_contacts WHERE id = :duplicate_id" }
  - id: duplicate_contact_ui
    type: client
    permission: base.contacts.write
    script: |
      // js
      async ({ row, request }) => {
        const result = await request('/api/actions/base.contacts.duplicate', {
          method: 'POST',
          body: { id: row.id, source_id: row.id, expected_row_version: row.row_version },
        });
        const app = await import('/app.ts');
        await app.navigate('/contacts/detail', { id: String(result.id) });
      }
  - id: schedule_activity
    type: server_form
    permission: base.activities.write
    title: Schedule activity
    action: base.activities.create
    handler: yaml_mutation
    operation: create
    refresh: [contact_activities]
    mutation: { operation: insert, table: base_activities, fields: [contact_id, summary, activity_type, due_date, assigned_user_id, assigned_user_name, note], required: [contact_id, summary, due_date], defaults: { state: planned } }
    fields: [{ field: contact_id, label: Contact, type: text, required: true }, { field: summary, label: Summary, type: text, required: true }, { field: activity_type, label: Type, type: select, options: [{ value: todo, label: To-do }, { value: call, label: Call }, { value: meeting, label: Meeting }, { value: email, label: Email }] }, { field: due_date, label: Due date, type: text, required: true }, { field: assigned_user_id, label: Assigned user ID, type: text }, { field: assigned_user_name, label: Assigned to, type: text }, { field: note, label: Note, type: textarea }]
  - id: complete_contact_activity
    type: server
    permission: base.activities.write
    action: base.activities.done
    handler: yaml_mutation
    operation: complete_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}', values: { state: done, completed_at: '2026-09-22 10:00:00' } }
    refresh: [contact_detail, contact_activities, contact_messages]
    mutation:
      generated: [message_id]
      operation: update
      table: base_activities
      fields: [state, completed_at]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM base_activities WHERE id = :id", status: 404, code: BASE_CONTACT_ACTIVITY_NOT_FOUND, message: Activity not found. }
        - { query: "SELECT a.id FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)", status: 403, code: BASE_CONTACT_ACTIVITY_COMPANY_FORBIDDEN, message: Activity is outside the current company. }
        - { query: "SELECT id FROM base_activities WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", status: 409, code: BASE_CONTACT_ACTIVITY_STALE, message: The activity is already completed or changed. Reload before completing it. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: BASE_CONTACT_ACTIVITY_ACTOR_REQUIRED, message: An authenticated contact actor is required to complete an activity. }
      steps:
        - { query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id, a.contact_id, :current_user_id, COALESCE(NULLIF(:current_user_name, ''), 'Administrator'), 'base.contacts.activity.done', 'Activity completed', a.summary FROM base_activities a WHERE a.id = :id" }
      result: { query: "SELECT id, contact_id, summary, activity_type, state, row_version, CAST(due_date AS VARCHAR) AS due_date, CAST(completed_at AS VARCHAR) AS completed_at, assigned_user_name FROM base_activities WHERE id = :id" }
  - id: cancel_contact_activity
    type: server
    permission: base.activities.write
    action: base.activities.cancel
    handler: yaml_mutation
    operation: cancel_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [contact_detail, contact_activities, contact_messages]
    mutation:
      generated: [message_id]
      operation: delete
      table: base_activities
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM base_activities WHERE id = :id", status: 404, code: BASE_CONTACT_ACTIVITY_NOT_FOUND, message: Activity not found. }
        - { query: "SELECT a.id FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)", status: 403, code: BASE_CONTACT_ACTIVITY_COMPANY_FORBIDDEN, message: Activity is outside the current company. }
        - { query: "SELECT id FROM base_activities WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", status: 409, code: BASE_CONTACT_ACTIVITY_STALE, message: The activity is already completed or changed. Reload before cancelling it. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: BASE_CONTACT_ACTIVITY_ACTOR_REQUIRED, message: An authenticated contact actor is required to cancel an activity. }
      before_steps:
        - { query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id, a.contact_id, :current_user_id, COALESCE(NULLIF(:current_user_name, ''), 'Administrator'), 'base.contacts.activity.cancel', 'Activity cancelled', a.summary FROM base_activities a WHERE a.id = :id" }
