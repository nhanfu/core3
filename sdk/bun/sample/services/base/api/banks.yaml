page: { id: banks }
datasources:
  - id: bank_active_states
    permission: base.reference.read
    query: "SELECT value, label FROM (VALUES ('active', 'Active'), ('archived', 'Archived')) states(value, label)"
  - id: banks
    permission: base.reference.read
    error_states: { transport_error: { status: 503, code: BASE_BANKS_UNAVAILABLE, message: Banks are temporarily unavailable. } }
    query: "SELECT id, row_version, name, bic, street, street2, city, state, zip, country, phone, email, active FROM base_banks WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND ((COALESCE(:active, '') IN ('', 'active') AND active = true) OR (:active = 'archived' AND active = false)) AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(bic, '') ILIKE '%' || :q || '%') ORDER BY name, id"
actions:
  - id: create_bank
    type: server_form
    permission: base.reference.write
    title: New bank
    action: base.reference.banks.create
    handler: yaml_mutation
    operation: create
    refresh: [banks]
    mutation:
      operation: insert
      table: base_banks
      generated: [id]
      fields: [name, bic, street, street2, city, state, zip, country, phone, email, active]
      required: [name]
      defaults: { active: true }
      guards: [{ query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_banks WHERE active = true AND LOWER(name) = LOWER(:name))", status: 409, code: BASE_BANK_NAME_EXISTS, message: A bank with this name already exists. }]
      result: { query: "SELECT * FROM base_banks WHERE id = :id" }
    fields: [{ field: name, label: Bank Name, type: text, required: true }, { field: bic, label: BIC, type: text }, { field: street, label: Street, type: text }, { field: street2, label: Street 2, type: text }, { field: city, label: City, type: text }, { field: state, label: State, type: text }, { field: zip, label: ZIP, type: text }, { field: country, label: Country, type: text }, { field: phone, label: Phone, type: text }, { field: email, label: Email, type: text }]
  - id: edit_bank
    type: server_form
    permission: base.reference.write
    title: Edit bank
    action: base.reference.banks.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [banks]
    mutation:
      operation: update
      table: base_banks
      fields: [name, bic, street, street2, city, state, zip, country, phone, email]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM base_banks WHERE id = :id AND active = true", status: 404, code: BASE_BANK_NOT_FOUND, message: Active bank not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_banks WHERE active = true AND LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: BASE_BANK_NAME_EXISTS, message: A bank with this name already exists. }
      result: { query: "SELECT * FROM base_banks WHERE id = :id" }
    fields: [{ field: name, label: Bank Name, type: text, required: true }, { field: bic, label: BIC, type: text }, { field: street, label: Street, type: text }, { field: street2, label: Street 2, type: text }, { field: city, label: City, type: text }, { field: state, label: State, type: text }, { field: zip, label: ZIP, type: text }, { field: country, label: Country, type: text }, { field: phone, label: Phone, type: text }, { field: email, label: Email, type: text }]
  - id: archive_bank
    type: server
    permission: base.reference.write
    action: base.reference.banks.archive
    handler: yaml_mutation
    operation: update
    refresh: [banks]
    params: { values: { active: false } }
    mutation: { operation: update, table: base_banks, fields: [active], concurrency: { required: true }, guards: [{ query: "SELECT id FROM base_banks WHERE id = :id AND active = true", status: 409, code: BASE_BANK_ALREADY_ARCHIVED, message: Bank is already archived or unavailable. }], result: { query: "SELECT * FROM base_banks WHERE id = :id" } }
  - id: unarchive_bank
    type: server
    permission: base.reference.write
    action: base.reference.banks.unarchive
    handler: yaml_mutation
    operation: update
    refresh: [banks]
    params: { values: { active: true } }
    mutation: { operation: update, table: base_banks, fields: [active], concurrency: { required: true }, guards: [{ query: "SELECT id FROM base_banks WHERE id = :id AND active = false", status: 409, code: BASE_BANK_ALREADY_ACTIVE, message: Bank is already active or unavailable. }], result: { query: "SELECT * FROM base_banks WHERE id = :id" } }
  - id: delete_bank
    type: server
    permission: base.reference.write
    action: base.reference.banks.delete
    handler: yaml_mutation
    operation: delete
    refresh: [banks]
    params: { id: '{row.id}' }
    mutation: { operation: delete, table: base_banks, concurrency: { required: true }, guards: [{ query: "SELECT id FROM base_banks WHERE id = :id", status: 404, code: BASE_BANK_NOT_FOUND, message: Bank not found. }] }
  - id: view_bank
    type: navigate
    permission: base.reference.read
    navigate_to: /base-bank-detail
    params: { id: '{row.id}' }
