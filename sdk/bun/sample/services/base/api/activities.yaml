page: { id: activities }
datasources:
  - id: activity_types
    permission: base.activities.read
    query: "SELECT value, label FROM (VALUES ('todo', 'To-do'), ('call', 'Call'), ('meeting', 'Meeting'), ('email', 'Email')) types(value, label)"
  - id: activity_states
    permission: base.activities.read
    query: "SELECT value, label FROM (VALUES ('planned', 'Planned'), ('done', 'Done')) states(value, label)"
  - id: activity_timing
    permission: base.activities.read
    query: "SELECT value, label FROM (VALUES ('overdue', 'Overdue'), ('today', 'Today'), ('future', 'Future'), ('done', 'Done')) timing(value, label)"
  - id: activity_contacts
    permission: base.activities.write
    query: "SELECT id AS value, name AS label FROM base_contacts WHERE active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id) ORDER BY name, id"
  - id: activities
    permission: base.activities.read
    workflow: base_activities
    error_states: { transport_error: { status: 503, code: BASE_ACTIVITIES_UNAVAILABLE, message: Activities are temporarily unavailable. } }
    query: >-
      WITH activity_rows AS (
        SELECT a.id, a.row_version, a.contact_id, c.name AS contact_name, c.company_id,
          a.summary, a.activity_type, a.state, a.feedback, a.assigned_user_id,
          a.assigned_user_name, CAST(a.due_date AS VARCHAR) AS due_date,
          CAST(a.completed_at AS VARCHAR) AS completed_at, a.note,
          CASE WHEN a.state = 'done' THEN 'done'
            WHEN a.due_date < CURRENT_DATE THEN 'overdue'
            WHEN a.due_date = CURRENT_DATE THEN 'today'
            ELSE 'future' END AS timing
        FROM base_activities a
        JOIN base_contacts c ON c.id = a.contact_id
        WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END
          AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)
          AND (:q IS NULL OR c.name ILIKE '%' || :q || '%' OR a.summary ILIKE '%' || :q || '%' OR a.activity_type ILIKE '%' || :q || '%')
          AND (:state IS NULL OR a.state = :state)
          AND (:activity_type IS NULL OR a.activity_type = :activity_type)
      )
      SELECT id, row_version, contact_id, contact_name, summary, activity_type, state,
        feedback, assigned_user_id, assigned_user_name, due_date, completed_at, note, timing
      FROM activity_rows
      WHERE (:timing IS NULL OR timing = :timing)
      ORDER BY due_date NULLS LAST, id
actions:
  - id: create_activity
    type: server_form
    permission: base.activities.write
    title: Schedule activity
    action: base.activities.create
    handler: yaml_mutation
    operation: create
    refresh: [activities]
    mutation:
      generated: [id]
      operation: insert
      table: base_activities
      fields: [contact_id, summary, activity_type, due_date, assigned_user_id, assigned_user_name, note]
      required: [contact_id, summary, due_date]
      defaults: { activity_type: todo, state: planned, row_version: 1 }
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :contact_id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_ACTIVITY_CONTACT_FORBIDDEN, message: Select an active contact in the current company. }
        - { query: "SELECT 1 AS ok WHERE :activity_type IN ('todo', 'call', 'meeting', 'email')", status: 422, code: BASE_ACTIVITY_TYPE_INVALID, message: Select a supported activity type. }
      result: { query: "SELECT a.id, a.contact_id, c.name AS contact_name, a.summary, a.activity_type, a.state, CAST(a.due_date AS VARCHAR) AS due_date, a.assigned_user_name, a.note FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :id" }
    fields:
      - { field: contact_id, label: Contact, type: select, options_source: activity_contacts, required: true }
      - { field: activity_type, label: Activity, type: select, options_source: activity_types, required: true }
      - { field: summary, label: Summary, type: text, required: true, placeholder: 'Discuss proposal' }
      - { field: due_date, label: Due date, type: text, required: true, placeholder: 'YYYY-MM-DD' }
      - { field: assigned_user_name, label: Assigned to, type: text }
      - { field: note, label: Note, type: textarea }
  - id: view_activity
    type: navigate
    permission: base.activities.read
    navigate_to: /activity-detail
    params: { id: '{row.id}' }
  - id: complete_activity
    type: server
    permission: base.activities.write
    action: base.activities.overview.done
    handler: yaml_mutation
    operation: complete_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}', values: { state: done } }
    refresh: [activities]
    mutation:
      generated: [message_id]
      operation: update
      table: base_activities
      fields: [state]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM base_activities WHERE id = :id", status: 404, code: BASE_ACTIVITY_NOT_FOUND, message: Activity not found. }
        - { query: "SELECT a.id FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)", status: 403, code: BASE_ACTIVITY_SCOPE, message: Activity is outside the current company. }
        - { query: "SELECT id FROM base_activities WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed; reload before completing it. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: BASE_ACTIVITY_ACTOR_REQUIRED, message: An authenticated actor is required to complete an activity. }
      steps:
        - { query: "UPDATE base_activities SET completed_at = CURRENT_TIMESTAMP WHERE id = :id AND state = 'done'", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed before it could be completed. }
        - { query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id, a.contact_id, :current_user_id, COALESCE(NULLIF(:current_user_name, ''), 'Administrator'), 'base.activities.done', 'Activity completed', a.summary FROM base_activities a WHERE a.id = :id" }
      result: { query: "SELECT id, state, row_version, CAST(completed_at AS VARCHAR) AS completed_at FROM base_activities WHERE id = :id" }
  - id: complete_activities
    type: server
    permission: base.activities.write
    action: base.activities.overview.bulk_done
    handler: yaml_mutation
    operation: complete_activities
    refresh: [activities]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND (SELECT COUNT(*) FROM base_activities WHERE id IN :selectedIds) > 0", status: 400, code: BASE_ACTIVITY_SELECTION_REQUIRED, message: Select at least one activity. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id IN :selectedIds AND (a.state <> 'planned' OR (COALESCE(:current_company_id, '') <> '' AND c.company_id <> :current_company_id)))", status: 403, code: BASE_ACTIVITY_SCOPE, message: All selected activities must be planned and in the current company. }
      steps:
        - { query: "UPDATE base_activities SET state = 'done', completed_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id IN :selectedIds AND state = 'planned'", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: A selected activity changed before it could be completed. }
        - { query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id || '-' || a.id, a.contact_id, :current_user_id, COALESCE(NULLIF(:current_user_name, ''), 'Administrator'), 'base.activities.done', 'Activity completed', a.summary FROM base_activities a WHERE a.id IN :selectedIds" }
      result: { query: "SELECT COUNT(*) AS completed_count FROM base_activities WHERE id IN :selectedIds AND state = 'done'" }
  - id: cancel_activity
    type: server
    permission: base.activities.write
    action: base.activities.overview.cancel
    handler: yaml_mutation
    operation: cancel_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [activities]
    mutation:
      generated: [message_id]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM base_activities WHERE id = :id", status: 404, code: BASE_ACTIVITY_NOT_FOUND, message: Activity not found. }
        - { query: "SELECT a.id FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)", status: 403, code: BASE_ACTIVITY_SCOPE, message: Activity is outside the current company. }
        - { query: "SELECT id FROM base_activities WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed; reload before cancelling it. }
      before_steps:
        - { query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id, a.contact_id, :current_user_id, COALESCE(NULLIF(:current_user_name, ''), 'Administrator'), 'base.activities.cancel', 'Activity cancelled', a.summary FROM base_activities a WHERE a.id = :id" }
      result: { query: "SELECT :id AS id, true AS cancelled" }
  - id: cancel_activities
    type: server
    permission: base.activities.write
    action: base.activities.overview.bulk_cancel
    handler: yaml_mutation
    operation: cancel_activities
    refresh: [activities]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND (SELECT COUNT(*) FROM base_activities WHERE id IN :selectedIds) > 0", status: 400, code: BASE_ACTIVITY_SELECTION_REQUIRED, message: Select at least one activity. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id IN :selectedIds AND (a.state <> 'planned' OR (COALESCE(:current_company_id, '') <> '' AND c.company_id <> :current_company_id)))", status: 403, code: BASE_ACTIVITY_SCOPE, message: All selected activities must be planned and in the current company. }
      steps:
        - { query: "INSERT INTO base_contact_messages(id, contact_id, actor_id, actor_name, action, action_label, detail) SELECT :message_id || '-' || a.id, a.contact_id, :current_user_id, COALESCE(NULLIF(:current_user_name, ''), 'Administrator'), 'base.activities.cancel', 'Activity cancelled', a.summary FROM base_activities a WHERE a.id IN :selectedIds" }
        - { query: "DELETE FROM base_activities WHERE id IN :selectedIds AND state = 'planned'", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: A selected activity changed before it could be cancelled. }
      result: { query: "SELECT COUNT(*) AS cancelled_count FROM base_contact_messages WHERE action = 'base.activities.cancel' AND id LIKE :message_id || '-%'" }
  - id: reschedule_activities_today
    type: server
    permission: base.activities.write
    action: base.activities.overview.reschedule_today
    handler: yaml_mutation
    operation: reschedule_activities
    refresh: [activities]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND (SELECT COUNT(*) FROM base_activities WHERE id IN :selectedIds) > 0", status: 400, code: BASE_ACTIVITY_SELECTION_REQUIRED, message: Select at least one activity. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id IN :selectedIds AND (a.state <> 'planned' OR (COALESCE(:current_company_id, '') <> '' AND c.company_id <> :current_company_id)))", status: 403, code: BASE_ACTIVITY_SCOPE, message: All selected activities must be planned and in the current company. }
      steps: [{ query: "UPDATE base_activities SET due_date = CURRENT_DATE, row_version = row_version + 1 WHERE id IN :selectedIds AND state = 'planned'", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: A selected activity changed before it could be rescheduled. }]
      result: { query: "SELECT COUNT(*) AS rescheduled_count FROM base_activities WHERE id IN :selectedIds AND due_date = CURRENT_DATE" }
  - id: reschedule_activities_tomorrow
    type: server
    permission: base.activities.write
    action: base.activities.overview.reschedule_tomorrow
    handler: yaml_mutation
    operation: reschedule_activities
    refresh: [activities]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND (SELECT COUNT(*) FROM base_activities WHERE id IN :selectedIds) > 0", status: 400, code: BASE_ACTIVITY_SELECTION_REQUIRED, message: Select at least one activity. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id IN :selectedIds AND (a.state <> 'planned' OR (COALESCE(:current_company_id, '') <> '' AND c.company_id <> :current_company_id)))", status: 403, code: BASE_ACTIVITY_SCOPE, message: All selected activities must be planned and in the current company. }
      steps: [{ query: "UPDATE base_activities SET due_date = CURRENT_DATE + INTERVAL '1 day', row_version = row_version + 1 WHERE id IN :selectedIds AND state = 'planned'", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: A selected activity changed before it could be rescheduled. }]
      result: { query: "SELECT COUNT(*) AS rescheduled_count FROM base_activities WHERE id IN :selectedIds" }
  - id: reschedule_activities_next_week
    type: server
    permission: base.activities.write
    action: base.activities.overview.reschedule_next_week
    handler: yaml_mutation
    operation: reschedule_activities
    refresh: [activities]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND (SELECT COUNT(*) FROM base_activities WHERE id IN :selectedIds) > 0", status: 400, code: BASE_ACTIVITY_SELECTION_REQUIRED, message: Select at least one activity. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id IN :selectedIds AND (a.state <> 'planned' OR (COALESCE(:current_company_id, '') <> '' AND c.company_id <> :current_company_id)))", status: 403, code: BASE_ACTIVITY_SCOPE, message: All selected activities must be planned and in the current company. }
      steps: [{ query: "UPDATE base_activities SET due_date = CAST(DATE_TRUNC('week', CURRENT_DATE) AS DATE) + INTERVAL '7 days', row_version = row_version + 1 WHERE id IN :selectedIds AND state = 'planned'", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: A selected activity changed before it could be rescheduled. }]
      result: { query: "SELECT COUNT(*) AS rescheduled_count FROM base_activities WHERE id IN :selectedIds" }
  - id: reschedule_activity_today
    type: server
    permission: base.activities.write
    action: base.activities.overview.row_reschedule_today
    handler: yaml_mutation
    operation: reschedule_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [activities]
    mutation:
      guards:
        - { query: "SELECT a.id FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)", status: 403, code: BASE_ACTIVITY_SCOPE, message: Activity is outside the current company. }
        - { query: "SELECT id FROM base_activities WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed; reload before rescheduling it. }
      steps: [{ query: "UPDATE base_activities SET due_date = CURRENT_DATE, row_version = row_version + 1 WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed before it could be rescheduled. }]
      result: { query: "SELECT id, CAST(due_date AS VARCHAR) AS due_date, row_version FROM base_activities WHERE id = :id" }
  - id: reschedule_activity_tomorrow
    type: server
    permission: base.activities.write
    action: base.activities.overview.row_reschedule_tomorrow
    handler: yaml_mutation
    operation: reschedule_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [activities]
    mutation:
      guards:
        - { query: "SELECT a.id FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)", status: 403, code: BASE_ACTIVITY_SCOPE, message: Activity is outside the current company. }
        - { query: "SELECT id FROM base_activities WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed; reload before rescheduling it. }
      steps: [{ query: "UPDATE base_activities SET due_date = CURRENT_DATE + INTERVAL '1 day', row_version = row_version + 1 WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed before it could be rescheduled. }]
      result: { query: "SELECT id, CAST(due_date AS VARCHAR) AS due_date, row_version FROM base_activities WHERE id = :id" }
  - id: reschedule_activity_next_week
    type: server
    permission: base.activities.write
    action: base.activities.overview.row_reschedule_next_week
    handler: yaml_mutation
    operation: reschedule_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [activities]
    mutation:
      guards:
        - { query: "SELECT a.id FROM base_activities a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)", status: 403, code: BASE_ACTIVITY_SCOPE, message: Activity is outside the current company. }
        - { query: "SELECT id FROM base_activities WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed; reload before rescheduling it. }
      steps: [{ query: "UPDATE base_activities SET due_date = CAST(DATE_TRUNC('week', CURRENT_DATE) AS DATE) + INTERVAL '7 days', row_version = row_version + 1 WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: BASE_ACTIVITY_STALE, message: The activity changed before it could be rescheduled. }]
      result: { query: "SELECT id, CAST(due_date AS VARCHAR) AS due_date, row_version FROM base_activities WHERE id = :id" }
