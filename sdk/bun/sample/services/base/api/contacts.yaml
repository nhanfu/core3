page: { id: contacts }
datasources:
  - id: contact_active_states
    permission: base.contacts.read
    query: "SELECT value, label FROM (VALUES ('active', 'Active'), ('archived', 'Archived')) states(value, label)"
  - id: contacts
    permission: base.contacts.read
    error_states: { transport_error: { status: 503, code: BASE_CONTACTS_DATA_UNAVAILABLE, message: Contacts data is temporarily unavailable } }
    query: "SELECT c.id, c.row_version, c.name, c.company_type, c.email, c.phone, c.city, c.country_name, c.is_company, c.active, c.created_at, c.company_id, c.parent_company_id, parent.name AS parent_company_name, c.website, c.language_code, CAST(NULL AS VARCHAR) AS avatar_url, upper(substr(c.name, 1, 1)) AS avatar_initials, (SELECT COUNT(*) FROM base_contact_categories_rel r WHERE r.contact_id = c.id) AS category_count, (SELECT COUNT(*) FROM base_activities a WHERE a.contact_id = c.id AND a.state = 'planned') AS activity_count FROM base_contacts c LEFT JOIN base_contacts parent ON parent.id = c.parent_company_id AND (COALESCE(:current_company_id, '') = '' OR parent.company_id = :current_company_id) WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id) AND ((COALESCE(:active, '') IN ('', 'active') AND c.active = true) OR (:active = 'archived' AND c.active = false)) AND (:q IS NULL OR c.name ILIKE '%' || :q || '%' OR c.email ILIKE '%' || :q || '%' OR c.phone ILIKE '%' || :q || '%') AND (:company_type IS NULL OR c.company_type = :company_type) AND (:country_name IS NULL OR c.country_name = :country_name) ORDER BY COALESCE(parent.name, c.name), c.name"
  - id: contact_types
    permission: base.contacts.read
    query: "SELECT value, label FROM (VALUES ('person','Person'), ('company','Company'), ('other','Other')) types(value, label)"
  - id: contact_countries
    permission: base.contacts.read
    query: "SELECT DISTINCT country_name AS value, country_name AS label FROM base_contacts WHERE active = true AND country_name IS NOT NULL ORDER BY country_name"
  - id: contact_parent_companies
    permission: base.contacts.read
    query: "SELECT id AS value, name AS label FROM base_contacts WHERE is_company = true AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id) ORDER BY name, id"
  - id: contact_merge_destinations
    permission: base.contacts.manage
    query: "SELECT id AS value, name || ' (' || COALESCE(email, 'no email') || ')' AS label FROM base_contacts WHERE active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id) ORDER BY name, id"
actions:
  - id: contacts.export
    type: client
    permission: base.contacts.read
    script: |
      async ({ request, state }) => {
        const filterKeys = ['q', 'active', 'company_type', 'country_name'];
        const params = Object.fromEntries(filterKeys
          .filter((key) => state && state[key] !== undefined && state[key] !== null && state[key] !== '')
          .map((key) => [key, String(state[key])]));
        const rows = [];
        let skip = 0;
        let total = 0;
        do {
          const payload = await request('/query', {
            method: 'POST',
            body: JSON.stringify({ sourceId: 'contacts', params, skip, top: 100 }),
          });
          const batch = Array.isArray(payload?.data) ? payload.data : [];
          rows.push(...batch);
          total = Number(payload?.meta?.total || rows.length);
          skip += batch.length;
          if (!batch.length) break;
        } while (rows.length < total);
        const columns = [
          ['name', 'Name'],
          ['company_type', 'Type'],
          ['email', 'Email'],
          ['phone', 'Phone'],
          ['city', 'City'],
          ['country_name', 'Country'],
          ['parent_company_name', 'Company'],
          ['active', 'Active'],
        ];
        const cell = (value) => `"${String(value ?? '').replaceAll('"', '""')}"`;
        const csv = [
          columns.map(([, label]) => cell(label)).join(','),
          ...rows.map((row) => columns.map(([field]) => cell(row[field])).join(',')),
        ].join('\r\n') + '\r\n';
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `contacts-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.append(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }
  - id: merge_contacts
    type: server_form
    title: Merge Contacts
    submit_label: Merge Contacts
    cancel_label: Cancel
    permission: base.contacts.manage
    action: base.contacts.merge
    handler: yaml_mutation
    operation: merge
    refresh: [contacts]
    fields:
      - { field: destination_id, label: Destination contact, type: select, options_source: contact_merge_destinations, required: true }
      - { field: expected_destination_row_version, label: Destination row version, type: hidden, default: 1, required: true }
    mutation:
      generated: [merge_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND (SELECT COUNT(*) FROM base_contacts WHERE id IN :selectedIds) BETWEEN 2 AND 3", status: 400, code: BASE_CONTACT_MERGE_SELECTION_REQUIRED, message: Select two or three contacts to merge. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_contacts WHERE id IN :selectedIds AND (active = false OR (COALESCE(:current_company_id, '') <> '' AND company_id <> :current_company_id)))", status: 403, code: BASE_CONTACT_MERGE_SCOPE, message: All selected contacts must be active and in the current company. }
        - { query: "SELECT 1 AS ok WHERE (SELECT COUNT(DISTINCT company_id) FROM base_contacts WHERE id IN :selectedIds) = 1", status: 403, code: BASE_CONTACT_MERGE_SCOPE, message: Contacts from different companies cannot be merged. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_contacts selected_contact JOIN base_contacts related ON related.id = selected_contact.parent_company_id WHERE selected_contact.id IN :selectedIds AND related.id IN :selectedIds) AND NOT EXISTS (SELECT 1 FROM base_contacts selected_contact JOIN base_contacts child ON child.parent_company_id = selected_contact.id WHERE selected_contact.id IN :selectedIds AND child.id IN :selectedIds)", status: 409, code: BASE_CONTACT_MERGE_HIERARCHY, message: A contact cannot be merged with its parent or child. }
        - { query: "SELECT 1 AS ok WHERE (SELECT COUNT(DISTINCT lower(COALESCE(email, ''))) FROM base_contacts WHERE id IN :selectedIds) = 1", status: 409, code: BASE_CONTACT_MERGE_EMAIL_MISMATCH, message: All contacts must have the same email to merge. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM base_contacts destination WHERE destination.id = :destination_id AND destination.id IN :selectedIds AND destination.active = true AND destination.row_version = :expected_destination_row_version)", status: 409, code: BASE_CONTACT_MERGE_DESTINATION_STALE, message: The destination contact changed. Reload and try again. }
      steps:
        - query: "UPDATE base_contacts AS child SET parent_company_id = :destination_id, updated_at = CURRENT_TIMESTAMP WHERE child.parent_company_id IN :selectedIds AND child.id NOT IN :selectedIds"
        - query: "INSERT INTO base_contact_categories_rel(contact_id, category_id, category_name) SELECT :destination_id, category_id, category_name FROM base_contact_categories_rel WHERE contact_id IN :selectedIds ON CONFLICT (contact_id, category_id) DO NOTHING"
        - query: "DELETE FROM base_contact_categories_rel WHERE contact_id IN :selectedIds AND contact_id <> :destination_id"
        - query: "UPDATE base_activities SET contact_id = :destination_id WHERE contact_id IN :selectedIds AND contact_id <> :destination_id"
        - query: "UPDATE base_contact_messages SET contact_id = :destination_id WHERE contact_id IN :selectedIds AND contact_id <> :destination_id"
        - query: "UPDATE base_contact_attachments SET contact_id = :destination_id WHERE contact_id IN :selectedIds AND contact_id <> :destination_id"
        - query: "INSERT INTO base_contact_followers(contact_id, user_id, name, email, added_by, created_at) SELECT :destination_id, user_id, name, email, added_by, created_at FROM base_contact_followers WHERE contact_id IN :selectedIds AND contact_id <> :destination_id ON CONFLICT (contact_id, user_id) DO NOTHING"
        - query: "DELETE FROM base_contact_followers WHERE contact_id IN :selectedIds AND contact_id <> :destination_id"
        - query: "UPDATE base_partner_bank_accounts SET partner_id = :destination_id, partner_name = (SELECT name FROM base_contacts WHERE id = :destination_id) WHERE partner_id IN :selectedIds AND partner_id <> :destination_id"
        - query: "UPDATE base_contacts AS destination SET name = COALESCE(NULLIF(destination.name, ''), (SELECT name FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), email = COALESCE(NULLIF(destination.email, ''), (SELECT email FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), phone = COALESCE(NULLIF(destination.phone, ''), (SELECT phone FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), street = COALESCE(NULLIF(destination.street, ''), (SELECT street FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), street2 = COALESCE(NULLIF(destination.street2, ''), (SELECT street2 FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), city = COALESCE(NULLIF(destination.city, ''), (SELECT city FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), state_name = COALESCE(NULLIF(destination.state_name, ''), (SELECT state_name FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), zip = COALESCE(NULLIF(destination.zip, ''), (SELECT zip FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), country_name = COALESCE(NULLIF(destination.country_name, ''), (SELECT country_name FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), notes = COALESCE(NULLIF(destination.notes, ''), (SELECT notes FROM base_contacts source WHERE source.id IN :selectedIds AND source.id <> :destination_id ORDER BY source.id LIMIT 1)), row_version = destination.row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE destination.id = :destination_id AND destination.row_version = :expected_destination_row_version"
          expect_changed: true
          status: 409
          code: BASE_CONTACT_MERGE_DESTINATION_STALE
          message: The destination contact changed. Reload and try again.
        - query: "INSERT INTO base_contact_merge_log(id, destination_id, source_ids, actor_id, actor_name, merged_at) SELECT :merge_id, :destination_id, string_agg(id, ',' ORDER BY id), :current_user_id, COALESCE(NULLIF(:current_user_name, ''), 'Administrator'), CURRENT_TIMESTAMP FROM base_contacts WHERE id IN :selectedIds AND id <> :destination_id"
        - query: "DELETE FROM base_contacts WHERE id IN :selectedIds AND id <> :destination_id AND active = true"
          expect_changed: true
          status: 409
          code: BASE_CONTACT_MERGE_STALE
          message: A selected contact changed before the merge completed. Reload and try again.
      result: { query: "SELECT destination.id, destination.name, destination.row_version, :merge_id AS merge_id, (SELECT COUNT(*) FROM base_contacts WHERE id IN :selectedIds AND id <> :destination_id) AS remaining_sources FROM base_contacts destination WHERE destination.id = :destination_id" }
  - id: create_contact
    type: server_form
    permission: base.contacts.write
    title: New contact
    action: base.contacts.create
    handler: yaml_mutation
    operation: create
    refresh: [contacts]
    mutation:
      operation: insert
      table: base_contacts
      id_input: contact_id
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, company_id, parent_company_id, is_company, notes]
      required: [name]
      guards:
        - { query: "SELECT CAST(NULLIF(:current_company_id, '') AS VARCHAR) AS company_id WHERE COALESCE(:current_company_id, '') = '' OR EXISTS (SELECT 1 FROM base_contacts WHERE id = :current_company_id AND is_company = true AND active = true)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact company is not available to the current user, assign: true }
        - { query: "SELECT 1 WHERE :email IS NULL OR NOT EXISTS (SELECT 1 FROM base_contacts WHERE active = true AND email IS NOT NULL AND lower(email) = lower(:email) AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id))", status: 409, code: BASE_CONTACT_EMAIL_EXISTS, message: A contact with this email already exists }
        - { query: "SELECT 1 WHERE :parent_company_id IS NULL OR EXISTS (SELECT 1 FROM base_contacts WHERE id = :parent_company_id AND is_company = true AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id))", status: 422, code: BASE_PARENT_COMPANY_INVALID, message: Parent must be an active company in the current company. }
        - { query: "WITH RECURSIVE ancestors(id, parent_company_id) AS (SELECT id, parent_company_id FROM base_contacts WHERE id = :parent_company_id UNION ALL SELECT c.id, c.parent_company_id FROM base_contacts c JOIN ancestors a ON c.id = a.parent_company_id WHERE a.parent_company_id IS NOT NULL) SELECT 1 WHERE :parent_company_id IS NULL OR NOT EXISTS (SELECT 1 FROM ancestors WHERE id = :id)", status: 422, code: BASE_PARENT_COMPANY_CYCLE, message: A contact cannot be assigned below one of its descendants. }
      result: { query: "SELECT * FROM base_contacts WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options_source: contact_types }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: street2, label: Street 2, type: text }
      - { field: city, label: City, type: text }
      - { field: state_name, label: State, type: text }
      - { field: zip, label: ZIP, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: parent_company_id, label: Company, type: select, options_source: contact_parent_companies }
      - { field: is_company, label: Is a company, type: checkbox }
      - { field: notes, label: Notes, type: textarea }
  - id: create_contact_from_crm
    type: server
    permission: base.contacts.write
    action: base.contacts.create_from_crm
    handler: yaml_mutation
    operation: create
    mutation:
      operation: insert
      table: base_contacts
      id_input: lead_id
      id_prefix: crm-lead-contact-
      fields: [name, email, phone]
      required: [name]
      guards: [{ query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_contacts WHERE id = 'crm-lead-contact-' || :lead_id OR (active = true AND email IS NOT NULL AND lower(email) = lower(:email)))", status: 409, code: BASE_CONTACT_EXISTS, message: A contact with this email or CRM link already exists }]
      result: { query: "SELECT * FROM base_contacts WHERE id = :id" }
  - id: delete_contact_from_crm
    type: server
    permission: base.contacts.write
    action: base.contacts.delete_from_crm
    handler: yaml_mutation
    operation: delete
    mutation:
      operation: delete
      table: base_contacts
      guards: [{ query: "SELECT id FROM base_contacts WHERE id = :id AND id = 'crm-lead-contact-' || :lead_id AND row_version = :expected_row_version", status: 409, code: BASE_CONTACT_COMPENSATION_STALE, message: CRM contact compensation could not verify the created contact }]
      result: { query: "SELECT COUNT(*) AS count FROM base_contacts WHERE id = :id" }
  - { id: view_contact, type: navigate, permission: base.contacts.read, navigate_to: /contacts/detail, params: { id: '{row.id}' } }
  - id: edit_contact
    type: server_form
    permission: base.contacts.write
    title: Edit contact
    action: base.contacts.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [contacts]
    mutation:
      operation: update
      table: base_contacts
      fields: [name, company_type, email, phone, street, street2, city, state_name, zip, country_name, parent_company_id, currency_code, is_company, notes]
      required: [name]
      timestamps: true
      concurrency: { field: row_version, input: expected_row_version }
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true", status: 409, code: BASE_CONTACT_ARCHIVED, message: Archived contacts cannot be edited }
        - { query: "SELECT 1 AS ok WHERE :email IS NULL OR NOT EXISTS (SELECT 1 FROM base_contacts WHERE active = true AND email IS NOT NULL AND lower(email) = lower(:email) AND id <> :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id))", status: 409, code: BASE_CONTACT_EMAIL_EXISTS, message: A contact with this email already exists }
        - { query: "SELECT 1 WHERE :parent_company_id IS NULL OR (:parent_company_id <> :id AND EXISTS (SELECT 1 FROM base_contacts WHERE id = :parent_company_id AND is_company = true AND active = true AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)))", status: 422, code: BASE_PARENT_COMPANY_INVALID, message: Parent must be an active company in the current company. }
        - { query: "WITH RECURSIVE ancestors(id, parent_company_id) AS (SELECT id, parent_company_id FROM base_contacts WHERE id = :parent_company_id UNION ALL SELECT c.id, c.parent_company_id FROM base_contacts c JOIN ancestors a ON c.id = a.parent_company_id WHERE a.parent_company_id IS NOT NULL) SELECT 1 WHERE :parent_company_id IS NULL OR NOT EXISTS (SELECT 1 FROM ancestors WHERE id = :id)", status: 422, code: BASE_PARENT_COMPANY_CYCLE, message: A contact cannot be assigned below one of its descendants. }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: company_type, label: Type, type: select, options_source: contact_types }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: street2, label: Street 2, type: text }
      - { field: city, label: City, type: text }
      - { field: state_name, label: State, type: text }
      - { field: zip, label: ZIP, type: text }
      - { field: country_name, label: Country, type: text }
      - { field: currency_code, label: Currency, type: text }
      - { field: parent_company_id, label: Company, type: select, options_source: contact_parent_companies }
      - { field: is_company, label: Is a company, type: checkbox }
      - { field: notes, label: Notes, type: textarea }
  - id: archive_contact
    type: server
    permission: base.contacts.write
    action: base.contacts.archive
    handler: yaml_mutation
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [contacts]
    mutation:
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = true AND row_version = :expected_row_version", status: 409, code: BASE_CONTACT_ALREADY_ARCHIVED, message: Contact is already archived or stale. }
      steps: [{ query: "UPDATE base_contacts SET active = false, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND active = true AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: Contact was changed by another user. Reload it before archiving. }]
      result: { query: "SELECT * FROM base_contacts WHERE id = :id" }
  - id: unarchive_contact
    type: server
    permission: base.contacts.write
    action: base.contacts.unarchive
    handler: yaml_mutation
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [contacts]
    mutation:
      guards:
        - { query: "SELECT id FROM base_contacts WHERE id = :id", status: 404, code: BASE_CONTACT_NOT_FOUND, message: Contact not found. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND (COALESCE(:current_company_id, '') = '' OR company_id = :current_company_id)", status: 403, code: BASE_CONTACT_COMPANY_FORBIDDEN, message: Contact is outside the current company. }
        - { query: "SELECT id FROM base_contacts WHERE id = :id AND active = false AND row_version = :expected_row_version", status: 409, code: BASE_CONTACT_ALREADY_ACTIVE, message: Contact is already active or stale. }
      steps: [{ query: "UPDATE base_contacts SET active = true, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND active = false AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: Contact was changed by another user. Reload it before restoring. }]
      result: { query: "SELECT * FROM base_contacts WHERE id = :id" }
