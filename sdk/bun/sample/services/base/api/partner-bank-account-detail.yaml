page: { id: partner-bank-account-detail }
datasources:
  - id: partner_bank_account_detail
    single: true
    permission: base.reference.read
    error_states: { transport_error: { status: 503, code: BASE_PARTNER_BANK_ACCOUNT_UNAVAILABLE, message: Bank account details are temporarily unavailable. } }
    query: "SELECT id, row_version, acc_number, clearing_number, partner_id, partner_name, bank_id, bank_name, acc_holder_name, company_name, currency_code, allow_out_payment, note, active FROM base_partner_bank_accounts WHERE id = :id AND CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN 0 ELSE 1 END = 1"
actions:
  - id: edit_partner_bank_account_detail
    type: server_form
    permission: base.reference.write
    title: Edit Bank Account
    action: base.reference.partner_bank_accounts.update
    handler: yaml_mutation
    operation: update
    prefill: state.partner_bank_account_detail
    refresh: [partner_bank_account_detail, partner_bank_accounts]
    mutation: { operation: update, table: base_partner_bank_accounts, fields: [acc_number, clearing_number, partner_id, partner_name, bank_id, bank_name, acc_holder_name, company_name, currency_code, allow_out_payment, note], required: [acc_number, partner_id], concurrency: { required: true }, guards: [{ query: "SELECT id FROM base_partner_bank_accounts WHERE id = :id AND active = true", status: 404, code: BASE_PARTNER_BANK_ACCOUNT_NOT_FOUND, message: Active bank account not found. }], result: { query: "SELECT * FROM base_partner_bank_accounts WHERE id = :id" } }
    fields: [{ field: acc_number, label: Account Number, type: text, required: true }, { field: clearing_number, label: Clearing Number, type: text }, { field: partner_id, label: Partner, type: text, required: true }, { field: acc_holder_name, label: Account Holder Name, type: text }, { field: bank_id, label: Bank, type: text }, { field: allow_out_payment, label: Send Money?, type: checkbox }, { field: company_name, label: Company, type: text }, { field: currency_code, label: Currency, type: text }, { field: note, label: Note, type: textarea }]
