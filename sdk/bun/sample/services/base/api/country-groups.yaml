page: { id: country-groups }
datasources:
  - id: country_group_countries
    permission: base.reference.read
    query: "SELECT name AS value, name AS label FROM base_country_group_countries ORDER BY name, code"
  - id: country_groups
    permission: base.reference.read
    error_states: { transport_error: { status: 503, code: BASE_COUNTRY_GROUPS_UNAVAILABLE, message: Country groups are temporarily unavailable. } }
    query: "SELECT g.id, g.row_version, g.name, g.code, g.country_codes, g.country_names FROM base_country_groups g WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR g.name ILIKE '%' || :q || '%' OR COALESCE(g.code, '') ILIKE '%' || :q || '%') ORDER BY g.sequence, g.id"
actions:
  - id: new_country_group
    type: navigate
    permission: base.reference.write
    navigate_to: /base-country-groups/new
  - id: view_country_group
    type: navigate
    permission: base.reference.read
    navigate_to: /base-country-group-detail
    params: { id: '{row.id}' }
  - id: create_country_group
    type: server_form
    permission: base.reference.write
    title: New Country Group
    action: base.reference.country_groups.create
    handler: yaml_mutation
    operation: insert
    refresh: [country_groups]
    mutation:
      operation: insert
      table: base_country_groups
      generated: [id]
      fields: [name, code, country_names]
      required: [name]
      defaults: { row_version: 1, sequence: 999, country_names: '', country_codes: '', created_at: '2026-01-15 11:30:00', updated_at: '2026-01-15 11:30:00' }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: BASE_COUNTRY_GROUP_NAME_REQUIRED, message: Group Name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM base_country_groups WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: BASE_COUNTRY_GROUP_NAME_EXISTS, message: A country group with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(NULLIF(TRIM(CAST(:code AS VARCHAR)), ''), '') = '' OR NOT EXISTS (SELECT 1 FROM base_country_groups WHERE LOWER(code) = LOWER(TRIM(CAST(:code AS VARCHAR))))", status: 409, code: BASE_COUNTRY_GROUP_CODE_EXISTS, message: A country group with this code already exists. }
      result: { query: "SELECT * FROM base_country_groups WHERE id = :id" }
    fields:
      - { field: name, label: Group Name, type: text, required: true, placeholder: 'e.g. Europe' }
      - { field: code, label: Code, type: text }
      - { field: country_names, label: Countries, type: multi-select, options_source: country_group_countries, wide: true }
