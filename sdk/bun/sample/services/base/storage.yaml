database:
  storage:
    driver: duckdb

files:
  driver: local
  path: ${BASE_UPLOAD_ROOT:-.data/uploads}
  credentials: {}

attachments:
  base_contact_attachment:
    download:
      route: /api/base/contacts/attachments
      permission: base.contacts.read
      query: SELECT a.id, a.contact_id, a.file_name, a.mime_type, a.size_bytes, a.storage_key, CAST(NULL AS VARCHAR) AS content_base64 FROM base_contact_attachments a JOIN base_contacts c ON c.id = a.contact_id WHERE a.id = :attachment_id AND (COALESCE(:current_company_id, '') = '' OR c.company_id = :current_company_id)
