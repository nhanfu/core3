page: { id: forum-forums }
datasources:
  - id: forum_forums
    permission: forum.read
    error_states:
      unauthorized: { status: 401, code: FORUM_FORUMS_UNAUTHORIZED, message: Sign in to view Forums. }
      forbidden: { status: 403, code: FORUM_FORUMS_FORBIDDEN, message: You do not have permission to view Forums. }
      transport_error: { status: 503, code: FORUM_FORUMS_UNAVAILABLE, message: Forums are temporarily unavailable. }
    query: |
      SELECT f.id, f.row_version,
        f.sequence, f.name, f.website_name, f.active,
        (SELECT COUNT(*) FROM forum_posts p WHERE p.forum_id = f.id) AS total_posts,
        COALESCE((SELECT SUM(p.views) FROM forum_posts p WHERE p.forum_id = f.id), 0) AS total_views,
        COALESCE((SELECT SUM(p.answer_count) FROM forum_posts p WHERE p.forum_id = f.id), 0) AS total_answers,
        0 AS total_favorites
      FROM forum_forums f
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END
        AND (:q IS NULL OR f.name ILIKE '%' || :q || '%')
        AND (:active IS NULL OR (:active = 'active' AND f.active = TRUE) OR (:active = 'archived' AND f.active = FALSE))
      ORDER BY f.name, f.id
actions:
  - id: create_forum
    type: server_form
    permission: forum.manage
    title: New Forum
    action: forum.forums.create
    handler: yaml_mutation
    operation: create
    refresh: [forum_forums]
    mutation:
      operation: insert
      table: forum_forums
      generated: [id]
      fields: [name, sequence, website_name, description, mode, privacy, default_order, active]
      required: [name]
      defaults: { sequence: 1, website_name: null, description: '', mode: Questions, privacy: Public, default_order: 'last_activity_date desc', active: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: FORUM_NAME_REQUIRED, message: A forum name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM forum_forums WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: FORUM_NAME_EXISTS, message: A forum with this name already exists. }
      result: { query: "SELECT * FROM forum_forums WHERE id = :id" }
    fields:
      - { field: name, label: Forum Name, type: text, required: true }
      - { field: mode, label: Forum Mode, type: select, options: [{ value: Questions, label: 'Questions (1 answer)' }, { value: Discussions, label: 'Discussions (multiple answers)' }], default: Questions }
      - { field: privacy, label: Privacy, type: select, options: [{ value: Public, label: Public }, { value: 'Signed In', label: 'Signed In' }, { value: 'Some users', label: 'Some users' }], default: Public }
      - { field: website_name, label: Website, type: text }
      - { field: description, label: Description, type: textarea }
      - { field: default_order, label: Default Sort, type: select, options: [{ value: 'create_date desc', label: Newest }, { value: 'last_activity_date desc', label: 'Last Updated' }, { value: 'vote_count desc', label: 'Most Voted' }, { value: 'child_count desc', label: Answered }], default: 'last_activity_date desc' }
      - { field: sequence, label: Sequence, type: number, default: 1 }
  - id: view_forum
    type: navigate
    permission: forum.read
    navigate_to: /forum-detail
    params: { id: '{row.id}' }
