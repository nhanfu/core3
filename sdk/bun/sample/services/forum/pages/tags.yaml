title: Forum Tags
page: { id: forum-tags, route: /forum-tags, breadcrumb: [Website, Forum, Tags], auth: { require: [forum.read] } }
components:
  - type: ListView
    variant: odoo
    source: forum_tags
    create_action: create_forum_tag
    create_label: New tag
    search: { label: Search tags, placeholder: 'Search tag name...' }
    columns:
      - { field: name, label: Tag, type: PrimaryEntityCell }
      - { field: forum_name, label: Forum }
      - { field: post_count, label: Posts, align: right }
      - { field: color, label: Color, align: right }
      - { field: id, label: '', sortable: false, actions: [{ id: edit_forum_tag, label: Edit, icon: edit }] }
    page_size: 50
    row_key: id
    row_open_action: edit_forum_tag
