title: Forums
page: { id: forum-forums, route: /forums, breadcrumb: [Website, Configuration, Forum, Forums], auth: { require: [forum.read] } }
components:
  - type: ListView
    variant: odoo
    source: forum_forums
    search: { label: Forum, placeholder: 'Search...' }
    filters:
      - { field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }
    columns:
      - { field: sequence, label: '', type: Handle, mobile: false }
      - { field: name, label: Forum, type: PrimaryEntityCell, mobile: true }
      - { field: website_name, label: Website, mobile: false }
      - { field: total_posts, label: Total Posts, align: right, mobile: true }
      - { field: total_views, label: Total Views, align: right, mobile: true }
    page_size: 50
    row_key: id
    empty_state: { title: No forums found, description: Create a forum or adjust your search and filters. }
