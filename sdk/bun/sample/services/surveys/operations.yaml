operations:
  survey.public.detail:
    result_key: survey
    query: "SELECT id, access_token, name, title, description, description_done, background_image_url, state FROM surveys WHERE access_token = :access_token AND state = 'Published' LIMIT 1"
  survey.public.background:
    result_key: background
    query: "SELECT id, access_token, background_image_url, background_image_content FROM surveys WHERE access_token = :access_token AND state = 'Published' AND background_image_url IS NOT NULL AND LENGTH(TRIM(background_image_url)) > 0 AND background_image_content IS NOT NULL LIMIT 1"
  survey.public.questions:
    result_key: questions
    query: "SELECT q.id, q.question_text, q.question_type, q.sequence, q.required, q.answer_options, COALESCE(q.validation_email, false) AS validation_email, COALESCE(q.validation_required, false) AS validation_required, q.validation_min_float_value, q.validation_max_float_value, q.validation_length_min, q.validation_length_max, q.validation_error_msg, (SELECT string_agg(CAST(sv.id AS VARCHAR) || '::' || COALESCE(sv.value, ''), '||' ORDER BY sv.sequence, sv.id) FROM survey_suggested_values sv WHERE sv.question_id = q.id AND sv.value_image_content IS NOT NULL) AS image_answers, COALESCE(q.save_as_email, false) AS save_as_email, COALESCE(q.save_as_nickname, false) AS save_as_nickname, (SELECT string_agg(matrix_row, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = q.id AND matrix_row IS NOT NULL) AS matrix_rows, (SELECT string_agg(matrix_column, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = q.id AND matrix_column IS NOT NULL) AS matrix_columns, CASE WHEN q.question_type = 'Matrix' THEN 'multiple' ELSE NULL END AS matrix_subtype, (SELECT source_question_id FROM survey_question_triggers WHERE question_id = q.id LIMIT 1) AS trigger_question_id, (SELECT source_answer FROM survey_question_triggers WHERE question_id = q.id LIMIT 1) AS trigger_answer FROM survey_questions q WHERE q.survey_id = :survey_id AND COALESCE(is_page, false) = false ORDER BY q.sequence, q.id"
  survey.public.question_image:
    result_key: question_image
    query: "SELECT sv.id, sv.question_id, sv.value_image_content FROM surveys s JOIN survey_responses r ON r.survey_id = s.id AND r.access_token = :answer_token AND r.state IN ('New', 'In Progress') JOIN survey_questions q ON q.survey_id = s.id AND q.id = :question_id JOIN survey_suggested_values sv ON sv.question_id = q.id AND sv.id = :suggested_answer_id WHERE s.access_token = :survey_token AND s.state = 'Published' AND sv.value_image_content IS NOT NULL LIMIT 1"
  survey.public.comment_settings:
    result_key: comment_settings
    query: "SELECT id, COALESCE(comments_allowed, false) AS comments_allowed, comments_message, COALESCE(comment_count_as_answer, false) AS comment_count_as_answer FROM survey_questions WHERE survey_id = :survey_id AND COALESCE(is_page, false) = false"
  survey.public.identity_settings:
    result_key: identity_settings
    query: "SELECT id, COALESCE(save_as_email, false) AS save_as_email, COALESCE(save_as_nickname, false) AS save_as_nickname FROM survey_questions WHERE survey_id = :survey_id AND COALESCE(is_page, false) = false"
  survey.public.scoring_answers:
    result_key: answers
    query: "SELECT q.id AS question_id, q.question_type, sv.value, COALESCE(sv.score, 0) AS score FROM survey_questions q LEFT JOIN survey_suggested_values sv ON sv.question_id = q.id WHERE q.survey_id = :survey_id AND COALESCE(q.is_page, false) = false ORDER BY q.sequence, q.id, sv.sequence, sv.id"
  survey.public.response:
    result_key: response
    query: "SELECT id, access_token, survey_id, state, answer_data, respondent_name, respondent_email, current_question_id, navigation_key, idempotency_key, score, quiz_passed, CAST(deadline AS VARCHAR) AS deadline, COALESCE(test_entry, false) AS test_entry FROM survey_responses WHERE access_token = :access_token AND survey_id = :survey_id LIMIT 1"
  survey.public.response_by_idempotency_key:
    result_key: response
    query: "SELECT id, access_token, survey_id, state, answer_data, respondent_name, respondent_email, current_question_id, navigation_key, idempotency_key, score, quiz_passed, CAST(deadline AS VARCHAR) AS deadline, COALESCE(test_entry, false) AS test_entry FROM survey_responses WHERE idempotency_key = :idempotency_key AND survey_id = :survey_id LIMIT 1"
  survey.public.first_question:
    result_key: question
    query: "SELECT q.id, q.question_text, q.question_type, q.sequence, q.required, q.answer_options, COALESCE(q.validation_email, false) AS validation_email, COALESCE(q.validation_required, false) AS validation_required, q.validation_min_float_value, q.validation_max_float_value, q.validation_length_min, q.validation_length_max, q.validation_error_msg, COALESCE(q.save_as_email, false) AS save_as_email, COALESCE(q.save_as_nickname, false) AS save_as_nickname, (SELECT string_agg(matrix_row, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = q.id AND matrix_row IS NOT NULL) AS matrix_rows, (SELECT string_agg(matrix_column, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = q.id AND matrix_column IS NOT NULL) AS matrix_columns, CASE WHEN q.question_type = 'Matrix' THEN 'multiple' ELSE NULL END AS matrix_subtype, (SELECT source_question_id FROM survey_question_triggers WHERE question_id = q.id LIMIT 1) AS trigger_question_id, (SELECT source_answer FROM survey_question_triggers WHERE question_id = q.id LIMIT 1) AS trigger_answer FROM survey_questions q WHERE q.survey_id = :survey_id AND COALESCE(is_page, false) = false AND NOT EXISTS (SELECT 1 FROM survey_question_triggers WHERE question_id = q.id) ORDER BY q.sequence, q.id LIMIT 1"
  survey.public.current_question:
    result_key: question
    query: "SELECT q.id, q.question_text, q.question_type, q.sequence, q.required, q.answer_options, COALESCE(q.validation_email, false) AS validation_email, COALESCE(q.validation_required, false) AS validation_required, q.validation_min_float_value, q.validation_max_float_value, q.validation_length_min, q.validation_length_max, q.validation_error_msg, COALESCE(q.save_as_email, false) AS save_as_email, COALESCE(q.save_as_nickname, false) AS save_as_nickname, (SELECT string_agg(matrix_row, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = q.id AND matrix_row IS NOT NULL) AS matrix_rows, (SELECT string_agg(matrix_column, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = q.id AND matrix_column IS NOT NULL) AS matrix_columns, CASE WHEN q.question_type = 'Matrix' THEN 'multiple' ELSE NULL END AS matrix_subtype, (SELECT source_question_id FROM survey_question_triggers WHERE question_id = q.id LIMIT 1) AS trigger_question_id, (SELECT source_answer FROM survey_question_triggers WHERE question_id = q.id LIMIT 1) AS trigger_answer FROM survey_questions q WHERE q.id = :question_id AND q.survey_id = :survey_id AND COALESCE(q.is_page, false) = false LIMIT 1"
  survey.public.next_question:
    result_key: question
    query: "SELECT next_question.id, next_question.question_text, next_question.question_type, next_question.sequence, next_question.required, next_question.answer_options, COALESCE(next_question.validation_email, false) AS validation_email, COALESCE(next_question.validation_required, false) AS validation_required, next_question.validation_min_float_value, next_question.validation_max_float_value, next_question.validation_length_min, next_question.validation_length_max, next_question.validation_error_msg, COALESCE(next_question.save_as_email, false) AS save_as_email, COALESCE(next_question.save_as_nickname, false) AS save_as_nickname, (SELECT string_agg(matrix_row, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = next_question.id AND matrix_row IS NOT NULL) AS matrix_rows, (SELECT string_agg(matrix_column, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = next_question.id AND matrix_column IS NOT NULL) AS matrix_columns, CASE WHEN next_question.question_type = 'Matrix' THEN 'multiple' ELSE NULL END AS matrix_subtype, (SELECT source_question_id FROM survey_question_triggers WHERE question_id = next_question.id LIMIT 1) AS trigger_question_id, (SELECT source_answer FROM survey_question_triggers WHERE question_id = next_question.id LIMIT 1) AS trigger_answer FROM survey_questions current_question JOIN survey_questions next_question ON next_question.survey_id = current_question.survey_id AND COALESCE(next_question.is_page, false) = false AND (next_question.sequence > current_question.sequence OR (next_question.sequence = current_question.sequence AND next_question.id > current_question.id)) WHERE current_question.id = :current_question_id AND current_question.survey_id = :survey_id AND COALESCE(current_question.is_page, false) = false ORDER BY next_question.sequence, next_question.id LIMIT 1"
  survey.public.previous_question:
    result_key: question
    query: "SELECT previous_question.id, previous_question.question_text, previous_question.question_type, previous_question.sequence, previous_question.required, previous_question.answer_options, COALESCE(previous_question.validation_email, false) AS validation_email, COALESCE(previous_question.validation_required, false) AS validation_required, previous_question.validation_min_float_value, previous_question.validation_max_float_value, previous_question.validation_length_min, previous_question.validation_length_max, previous_question.validation_error_msg, COALESCE(previous_question.save_as_email, false) AS save_as_email, COALESCE(previous_question.save_as_nickname, false) AS save_as_nickname, (SELECT string_agg(matrix_row, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = previous_question.id AND matrix_row IS NOT NULL) AS matrix_rows, (SELECT string_agg(matrix_column, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = previous_question.id AND matrix_column IS NOT NULL) AS matrix_columns, CASE WHEN previous_question.question_type = 'Matrix' THEN 'multiple' ELSE NULL END AS matrix_subtype, (SELECT source_question_id FROM survey_question_triggers WHERE question_id = previous_question.id LIMIT 1) AS trigger_question_id, (SELECT source_answer FROM survey_question_triggers WHERE question_id = previous_question.id LIMIT 1) AS trigger_answer FROM survey_questions current_question JOIN survey_questions previous_question ON previous_question.survey_id = current_question.survey_id AND COALESCE(previous_question.is_page, false) = false AND (previous_question.sequence < current_question.sequence OR (previous_question.sequence = current_question.sequence AND previous_question.id < current_question.id)) WHERE current_question.id = :current_question_id AND current_question.survey_id = :survey_id AND COALESCE(current_question.is_page, false) = false ORDER BY previous_question.sequence DESC, previous_question.id DESC LIMIT 1"
  survey.public.navigation_idempotency:
    result_key: response
    query: "SELECT id, access_token, survey_id, state, answer_data, current_question_id, navigation_key, idempotency_key, CAST(deadline AS VARCHAR) AS deadline, COALESCE(test_entry, false) AS test_entry FROM survey_responses WHERE access_token = :access_token AND survey_id = :survey_id AND navigation_key = :navigation_key LIMIT 1"
  survey.public.retry.source:
    result_key: response
    query: "SELECT id, access_token, survey_id, survey_name, state, respondent_name, respondent_email, CAST(deadline AS VARCHAR) AS deadline, COALESCE(test_entry, false) AS test_entry FROM survey_responses WHERE access_token = :access_token AND survey_id = :survey_id LIMIT 1"
  survey.public.retry.count:
    result_key: attempts
    query: "SELECT COUNT(*) AS count FROM survey_responses WHERE survey_id = :survey_id AND id LIKE 'retry-response-' || :source_id || '-%'"
  survey.public.retry.idempotency:
    result_key: response
    query: "SELECT id, access_token, survey_id, state, answer_data, current_question_id, respondent_name, respondent_email, idempotency_key, COALESCE(test_entry, false) AS test_entry FROM survey_responses WHERE idempotency_key = :idempotency_key AND survey_id = :survey_id LIMIT 1"
  survey.public.print.detail:
    result_key: survey
    query: "SELECT id, access_token, name, title, description, description_done, state FROM surveys WHERE access_token = :access_token AND state IN ('Published', 'Closed') LIMIT 1"
  survey.public.print.questions:
    result_key: questions
    query: "SELECT q.id, q.question_text, q.question_type, q.sequence, q.required, q.answer_options, (SELECT string_agg(matrix_row, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = q.id AND matrix_row IS NOT NULL) AS matrix_rows, (SELECT string_agg(matrix_column, '||' ORDER BY sequence, id) FROM survey_suggested_values WHERE question_id = q.id AND matrix_column IS NOT NULL) AS matrix_columns, CASE WHEN q.question_type = 'Matrix' THEN 'multiple' ELSE NULL END AS matrix_subtype FROM survey_questions q WHERE q.survey_id = :survey_id ORDER BY q.sequence, q.id"
  survey.public.print.response:
    result_key: response
    query: "SELECT id, access_token, survey_id, state, answer_data, respondent_name, respondent_email, CAST(submitted_at AS VARCHAR) AS submitted_at, COALESCE(test_entry, false) AS test_entry FROM survey_responses WHERE access_token = :access_token AND survey_id = :survey_id AND state = 'Submitted' LIMIT 1"
  # Odoo exposes the current question start and limit to the live-session
  # attendee timer; answer submission applies the same boundary in the paired
  # API mutation rather than trusting the browser clock.
  survey.public.session:
    result_key: session
    query: "SELECT ls.id, ls.survey_id, ls.survey_name, ls.state AS session_state, ls.session_code, ls.session_link, ls.current_question_id, COALESCE(ls.current_question_text, 'Waiting for the host to start the first question') AS current_question_text, CAST(ls.question_started_at AS VARCHAR) AS question_started_at, q.question_type AS current_question_type, q.required AS current_question_required, COALESCE(q.is_time_limited, false) AS current_question_time_limited, q.time_limit AS current_question_time_limit FROM survey_live_sessions ls JOIN surveys s ON s.id = ls.survey_id LEFT JOIN survey_questions q ON q.id = ls.current_question_id WHERE ls.session_code = :session_code AND COALESCE(s.title, '') NOT ILIKE '%certification%' LIMIT 1"
  survey.public.session.question:
    result_key: question
    query: "SELECT q.id, q.question_text, q.question_type, q.required, q.answer_options, q.sequence, COALESCE(q.is_time_limited, false) AS is_time_limited, q.time_limit, CAST(ls.question_started_at AS VARCHAR) AS question_started_at FROM survey_live_sessions ls JOIN survey_questions q ON q.id = ls.current_question_id WHERE ls.session_code = :session_code AND ls.state = 'In Progress' LIMIT 1"
  survey.public.session.attendee:
    result_key: attendee
    query: "SELECT id, session_id, attendee_name, attendee_token, state, row_version, CAST(joined_at AS VARCHAR) AS joined_at FROM survey_live_attendees WHERE join_key = :join_key LIMIT 1"
  survey.public.session.attendee_by_token:
    result_key: attendee
    query: "SELECT a.id, a.session_id, a.attendee_name, a.attendee_token, a.state, a.row_version, CAST(a.joined_at AS VARCHAR) AS joined_at FROM survey_live_attendees a JOIN survey_live_sessions ls ON ls.id = a.session_id WHERE ls.session_code = :session_code AND a.attendee_token = :attendee_token LIMIT 1"
  survey.public.session.answer:
    result_key: answer
    query: "SELECT a.id, a.session_id, a.attendee_id, a.question_id, a.answer_type, a.answer_value, a.score, CAST(a.submitted_at AS VARCHAR) AS submitted_at FROM survey_live_session_answers a JOIN survey_live_sessions ls ON ls.id = a.session_id WHERE ls.session_code = :session_code AND a.attendee_id = :attendee_id AND a.question_id = ls.current_question_id LIMIT 1"
