version: 0.0.9
description: Deterministic Odoo-style live survey session lifecycle fixtures
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS survey_live_sessions (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        survey_id VARCHAR NOT NULL UNIQUE,
        survey_name VARCHAR NOT NULL,
        state VARCHAR NOT NULL DEFAULT 'Closed',
        session_code VARCHAR NOT NULL,
        session_link VARCHAR NOT NULL,
        current_question_id VARCHAR,
        current_question_text VARCHAR,
        session_start_time TIMESTAMP,
        question_started_at TIMESTAMP,
        answer_count INTEGER NOT NULL DEFAULT 0,
        question_answer_count INTEGER NOT NULL DEFAULT 0,
        leaderboard_enabled BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
      INSERT INTO survey_live_sessions(id, survey_id, survey_name, state, session_code, session_link, leaderboard_enabled) VALUES
        ('live-session-feedback', 'survey-demo-feedback', 'Feedback Form', 'Closed', '5822', '/s/5822', false),
        ('live-session-certification', 'survey-demo-certification', 'MyCompany Vendor Certification', 'Closed', '3919', '/s/3919', true),
        ('live-session-burger', 'survey-demo-001', 'Burger Quiz', 'Closed', '4448', '/s/4448', true),
        ('live-session-conditional', 'survey-demo-conditional', 'Conditional Questions', 'Closed', '1826', '/s/1826', false)
      ON CONFLICT (id) DO NOTHING;
      UPDATE survey_live_sessions SET survey_name = (SELECT title FROM surveys WHERE surveys.id = survey_live_sessions.survey_id) WHERE survey_name = '' OR survey_name IS NULL;
    down: |
      DROP TABLE IF EXISTS survey_live_sessions;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
