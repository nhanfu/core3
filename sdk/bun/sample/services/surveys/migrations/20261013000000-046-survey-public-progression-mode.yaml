version: 0.0.46
description: Durable Odoo-style public survey progression mode
kind: data
type:
  postgres:
    up: |
      ALTER TABLE surveys ADD COLUMN IF NOT EXISTS progression_mode VARCHAR DEFAULT 'percent';
      UPDATE surveys SET progression_mode = CASE WHEN progression_mode = 'number' THEN 'number' ELSE 'percent' END;
      INSERT INTO surveys(id, name, title, description, description_done, owner, response_count, state, access_token, access_mode, questions_layout, progression_mode, users_can_go_back, published_at, created_at, updated_at)
      VALUES ('survey-demo-progression-number', 'SURVEY/PROGRESSION-NUMBER', 'Numbered Progress Survey', 'Answer each question while tracking the answered count.', 'Thanks for completing the numbered progress survey.', 'Mitchell Admin', 0, 'Published', 'progression-number-token-2026', 'public', 'page_per_question', 'number', true, TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')
      ON CONFLICT (id) DO UPDATE SET state = 'Published', access_token = 'progression-number-token-2026', access_mode = 'public', questions_layout = 'page_per_question', progression_mode = 'number', users_can_go_back = true;
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES
        ('question-progression-first', 'survey-demo-progression-number', 'How clear was the first step?', 'Choice', 1, true, 'Clear,Unclear'),
        ('question-progression-second', 'survey-demo-progression-number', 'How easy was the second step?', 'Choice', 2, true, 'Easy,Hard')
      ON CONFLICT (id) DO UPDATE SET survey_id = excluded.survey_id, sequence = excluded.sequence, required = excluded.required, answer_options = excluded.answer_options;
    down: |
      DELETE FROM survey_responses WHERE survey_id = 'survey-demo-progression-number';
      DELETE FROM survey_questions WHERE survey_id = 'survey-demo-progression-number';
      DELETE FROM surveys WHERE id = 'survey-demo-progression-number';
      -- Keep the nullable progression column during partial rollback for dependent databases.
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
