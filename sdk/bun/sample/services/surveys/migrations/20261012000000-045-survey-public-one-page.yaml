version: 0.0.45
description: Durable Odoo-style one-page public survey pagination
kind: data
type:
  postgres:
    up: |
      ALTER TABLE surveys ADD COLUMN IF NOT EXISTS questions_layout VARCHAR DEFAULT 'page_per_question';
      UPDATE surveys SET questions_layout = COALESCE(NULLIF(questions_layout, ''), 'page_per_question');
      INSERT INTO surveys(id, name, title, description, description_done, owner, response_count, state, access_token, access_mode, questions_layout, users_can_go_back, published_at, created_at, updated_at)
      VALUES ('survey-demo-one-page', 'SURVEY/ONE-PAGE', 'One Page Customer Survey', 'Answer the questions together on one page.', 'Thanks for completing the one-page survey.', 'Mitchell Admin', 0, 'Published', 'one-page-token-2026', 'public', 'one_page', true, TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')
      ON CONFLICT (id) DO UPDATE SET state = 'Published', access_token = 'one-page-token-2026', access_mode = 'public', questions_layout = 'one_page', users_can_go_back = true;
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES
        ('question-one-page-first', 'survey-demo-one-page', 'How helpful was the setup?', 'Choice', 1, true, 'Helpful,Neutral'),
        ('question-one-page-second', 'survey-demo-one-page', 'How did you hear about us?', 'Choice', 2, false, 'Email,Search')
      ON CONFLICT (id) DO UPDATE SET survey_id = excluded.survey_id, sequence = excluded.sequence, required = excluded.required, answer_options = excluded.answer_options;
    down: |
      DELETE FROM survey_responses WHERE survey_id = 'survey-demo-one-page';
      DELETE FROM survey_questions WHERE survey_id = 'survey-demo-one-page';
      DELETE FROM surveys WHERE id = 'survey-demo-one-page';
      -- Keep the nullable layout column during partial rollback for dependent databases.
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
