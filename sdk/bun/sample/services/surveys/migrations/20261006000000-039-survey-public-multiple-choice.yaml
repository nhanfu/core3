version: 0.0.39
description: Odoo-compatible public multiple-choice question fixture
kind: data
type:
  postgres:
    up: |
      INSERT INTO surveys(id, name, title, description, description_done, owner, response_count, state, access_token, published_at, created_at, updated_at)
      VALUES ('survey-demo-multiple-choice', 'SURVEY/MULTI', 'Product Preferences Survey', 'Choose every tool that helps your team work efficiently.', 'Thank you for sharing your preferences.', 'Mitchell Admin', 0, 'Published', 'multiple-choice-public-token-2026', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')
      ON CONFLICT (id) DO UPDATE SET title = excluded.title, description = excluded.description, description_done = excluded.description_done, state = excluded.state, access_token = excluded.access_token, published_at = excluded.published_at;
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES ('question-multi-choice-preferences', 'survey-demo-multiple-choice', 'Which tools help your team work efficiently?', 'Multiple Choice', 1, true, 'Desk,Chair,Monitor')
      ON CONFLICT (id) DO UPDATE SET survey_id = excluded.survey_id, question_text = excluded.question_text, question_type = excluded.question_type, sequence = excluded.sequence, required = excluded.required, answer_options = excluded.answer_options;
    down: |
      DELETE FROM survey_questions WHERE id = 'question-multi-choice-preferences';
      DELETE FROM surveys WHERE id = 'survey-demo-multiple-choice';
