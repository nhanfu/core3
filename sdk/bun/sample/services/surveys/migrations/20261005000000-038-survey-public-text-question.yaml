    down: |
      DELETE FROM survey_questions WHERE id = 'question-text-feedback';
      DELETE FROM surveys WHERE id = 'survey-demo-text';
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
