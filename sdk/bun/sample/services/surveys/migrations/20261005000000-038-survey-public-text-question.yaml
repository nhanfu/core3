version: 0.0.38
description: Odoo-compatible public text-box question fixture
kind: data
type:
  postgres:
    up: |
      INSERT INTO surveys(id, name, title, description, description_done, owner, response_count, state, access_token, published_at, created_at, updated_at)
      VALUES ('survey-demo-text', 'SURVEY/TEXT', 'Product Feedback Survey', 'Share detailed feedback in your own words.', 'Thank you for the detailed feedback.', 'Mitchell Admin', 0, 'Published', 'text-public-token-2026', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')
      ON CONFLICT (id) DO UPDATE SET title = excluded.title, description = excluded.description, description_done = excluded.description_done, state = excluded.state, access_token = excluded.access_token, published_at = excluded.published_at;
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES ('question-text-feedback', 'survey-demo-text', 'What should we improve in the next release?', 'Text', 1, true, '')
