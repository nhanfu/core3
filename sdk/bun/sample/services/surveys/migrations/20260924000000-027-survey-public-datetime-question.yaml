version: 0.0.27
description: Deterministic public datetime question fixture for the certification survey
kind: data
type:
  postgres:
    up: |
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES ('question-certification-datetime', 'survey-demo-certification', 'When did you complete the vendor training session?', 'Datetime', 16, false, '')
      ON CONFLICT (id) DO UPDATE SET question_text = excluded.question_text, question_type = excluded.question_type, sequence = excluded.sequence, required = excluded.required;
    down: |
      DELETE FROM survey_questions WHERE id = 'question-certification-datetime';
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
