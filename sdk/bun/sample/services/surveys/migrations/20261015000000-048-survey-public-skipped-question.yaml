version: 0.0.48
description: Durable Odoo-style skipped optional public survey questions
kind: data
type:
  postgres:
    up: |
      ALTER TABLE survey_responses ADD COLUMN IF NOT EXISTS skipped_questions VARCHAR;
      INSERT INTO surveys(id, name, title, description, description_done, owner, response_count, state, access_token, access_mode, questions_layout, progression_mode, users_can_go_back, published_at, created_at, updated_at)
      VALUES ('survey-demo-skipped-question', 'SURVEY/SKIPPED-QUESTION', 'Optional Product Survey', 'Skip optional questions or answer them before submitting.', 'Thanks for completing the optional product survey.', 'Mitchell Admin', 0, 'Published', 'skipped-question-token-2026', 'public', 'page_per_question', 'number', true, TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')
      ON CONFLICT (id) DO UPDATE SET state = 'Published', access_token = 'skipped-question-token-2026', access_mode = 'public', questions_layout = 'page_per_question', progression_mode = 'number', users_can_go_back = true;
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES
        ('question-skipped-required-first', 'survey-demo-skipped-question', 'Which plan do you use?', 'Choice', 1, true, 'Basic,Pro'),
        ('question-skipped-optional', 'survey-demo-skipped-question', 'Which feature should we improve?', 'Text', 2, false, ''),
        ('question-skipped-required-last', 'survey-demo-skipped-question', 'Would you recommend us?', 'Choice', 3, true, 'Yes,No')
      ON CONFLICT (id) DO UPDATE SET survey_id = excluded.survey_id, sequence = excluded.sequence, required = excluded.required, answer_options = excluded.answer_options;
    down: |
      DELETE FROM survey_responses WHERE survey_id = 'survey-demo-skipped-question';
      DELETE FROM survey_questions WHERE survey_id = 'survey-demo-skipped-question';
      DELETE FROM surveys WHERE id = 'survey-demo-skipped-question';
      -- Keep the nullable skipped-question column during partial rollback for dependent databases.
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
