version: 0.0.43
description: Durable Odoo-style public back-navigation setting and guard fixture
kind: data
type:
  postgres:
    up: |
      ALTER TABLE surveys ADD COLUMN IF NOT EXISTS users_can_go_back BOOLEAN DEFAULT false;
      UPDATE surveys SET users_can_go_back = COALESCE(users_can_go_back, false);
      UPDATE surveys SET users_can_go_back = true WHERE id <> 'survey-demo-no-back';
      INSERT INTO surveys(id, name, title, description, description_done, owner, response_count, state, access_token, users_can_go_back, published_at, created_at, updated_at)
      VALUES ('survey-demo-no-back', 'SURVEY/NO-BACK', 'No Back Customer Survey', 'Answer each question in order.', 'Thanks for completing the ordered survey.', 'Mitchell Admin', 0, 'Published', 'no-back-token-2026', false, TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')
      ON CONFLICT (id) DO UPDATE SET users_can_go_back = false, state = 'Published';
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES ('question-no-back-first', 'survey-demo-no-back', 'First ordered question', 'Choice', 1, true, 'One,Two'), ('question-no-back-second', 'survey-demo-no-back', 'Second ordered question', 'Choice', 2, true, 'Alpha,Beta')
      ON CONFLICT (id) DO UPDATE SET survey_id = excluded.survey_id, sequence = excluded.sequence, required = excluded.required, answer_options = excluded.answer_options;
    down: |
      DELETE FROM survey_responses WHERE survey_id = 'survey-demo-no-back';
      DELETE FROM survey_questions WHERE survey_id = 'survey-demo-no-back';
      DELETE FROM surveys WHERE id = 'survey-demo-no-back';
      ALTER TABLE surveys DROP COLUMN IF EXISTS users_can_go_back;
  duckdb:
    up: |
      ALTER TABLE surveys ADD COLUMN IF NOT EXISTS users_can_go_back BOOLEAN DEFAULT false;
      UPDATE surveys SET users_can_go_back = COALESCE(users_can_go_back, false);
      UPDATE surveys SET users_can_go_back = true WHERE id <> 'survey-demo-no-back';
      INSERT INTO surveys(id, name, title, description, description_done, owner, response_count, state, access_token, users_can_go_back, published_at, created_at, updated_at)
      VALUES ('survey-demo-no-back', 'SURVEY/NO-BACK', 'No Back Customer Survey', 'Answer each question in order.', 'Thanks for completing the ordered survey.', 'Mitchell Admin', 0, 'Published', 'no-back-token-2026', false, TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')
      ON CONFLICT (id) DO UPDATE SET users_can_go_back = false, state = 'Published';
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES ('question-no-back-first', 'survey-demo-no-back', 'First ordered question', 'Choice', 1, true, 'One,Two'), ('question-no-back-second', 'survey-demo-no-back', 'Second ordered question', 'Choice', 2, true, 'Alpha,Beta')
      ON CONFLICT (id) DO UPDATE SET survey_id = excluded.survey_id, sequence = excluded.sequence, required = excluded.required, answer_options = excluded.answer_options;
    down: |
      DELETE FROM survey_responses WHERE survey_id = 'survey-demo-no-back';
      DELETE FROM survey_questions WHERE survey_id = 'survey-demo-no-back';
      DELETE FROM surveys WHERE id = 'survey-demo-no-back';
      -- DuckDB retains this nullable parent column through partial rollback
      -- because the survey graph has dependent indexes and migrations remain replayable.
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
