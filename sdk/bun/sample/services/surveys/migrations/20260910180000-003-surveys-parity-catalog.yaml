version: 0.0.3
description: Survey participant and answer fixtures from the installed Odoo reference
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS survey_participants (id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, survey_id VARCHAR NOT NULL, survey_name VARCHAR NOT NULL, contact VARCHAR, email VARCHAR, attempt_no INTEGER NOT NULL DEFAULT 1, deadline DATE, quiz_passed BOOLEAN, score DECIMAL(8,2), state VARCHAR NOT NULL DEFAULT 'New', created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
      CREATE TABLE IF NOT EXISTS survey_suggested_values (id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, question_id VARCHAR NOT NULL, question_text VARCHAR NOT NULL, value VARCHAR NOT NULL, sequence INTEGER NOT NULL DEFAULT 1, score DECIMAL(8,2) NOT NULL DEFAULT 0, matrix_row VARCHAR, matrix_column VARCHAR);
      CREATE TABLE IF NOT EXISTS survey_detailed_answers (id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, participant_id VARCHAR NOT NULL, survey_name VARCHAR NOT NULL, question_text VARCHAR NOT NULL, answer_type VARCHAR NOT NULL, answer_value VARCHAR, skipped BOOLEAN NOT NULL DEFAULT false, score DECIMAL(8,2), submitted_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
      UPDATE surveys SET name = 'SURVEY/BURGER', title = 'Burger Quiz', description = 'A short quiz about burgers.', owner = 'Mitchell Admin', response_count = 0, state = 'Draft', published_at = NULL, closed_at = NULL WHERE id = 'survey-demo-001';
      INSERT INTO surveys(id,name,title,description,owner,response_count,state) VALUES ('survey-demo-feedback','SURVEY/FEEDBACK','Feedback Form','Tell us how we are doing.','Mitchell Admin',4,'Published'),('survey-demo-certification','SURVEY/CERTIFICATION','MyCompany Vendor Certification','Test your knowledge of our products.','Mitchell Admin',4,'Published'),('survey-demo-conditional','SURVEY/CONDITIONAL','Conditional Questions','Answer the questions that apply to you.','Mitchell Admin',0,'Draft') ON CONFLICT (id) DO NOTHING;
      INSERT INTO survey_questions(id,survey_id,question_text,question_type,sequence,required,answer_options) VALUES ('question-feedback-rating','survey-demo-feedback','How satisfied are you?','Rating',1,true,'1,2,3,4,5'),('question-feedback-comment','survey-demo-feedback','What can we improve?','Text',2,false,''),('question-certification-product','survey-demo-certification','Which product is certified?','Choice',1,true,'Desk,Laptop,Screen'),('question-certification-policy','survey-demo-certification','Do you accept the vendor policy?','Choice',2,true,'Yes,No'),('question-burger-main','survey-demo-001','Which ingredient belongs in a burger?','Choice',1,true,'Bread,Apple,Tea'),('question-conditional-role','survey-demo-conditional','Which team are you in?','Choice',1,true,'Sales,Support,Engineering') ON CONFLICT (id) DO NOTHING;
      INSERT INTO survey_participants(id,survey_id,survey_name,contact,email,attempt_no,deadline,quiz_passed,score,state) VALUES ('participant-feedback','survey-demo-feedback','Feedback Form','Azure Interior','azure@example.com',1,'2026-09-30',false,0,'Completed'),('participant-certification','survey-demo-certification','MyCompany Vendor Certification','Deco Addict','deco@example.com',1,'2026-09-30',true,100,'Completed') ON CONFLICT (id) DO NOTHING;
      INSERT INTO survey_suggested_values(id,question_id,question_text,value,sequence,score) VALUES ('answer-feedback-1','question-feedback-rating','How satisfied are you?','1',1,0),('answer-feedback-5','question-feedback-rating','How satisfied are you?','5',5,100),('answer-certification-desk','question-certification-product','Which product is certified?','Desk',1,100),('answer-certification-laptop','question-certification-product','Which product is certified?','Laptop',2,100),('answer-burger-bread','question-burger-main','Which ingredient belongs in a burger?','Bread',1,100) ON CONFLICT (id) DO NOTHING;
      INSERT INTO survey_detailed_answers(id,participant_id,survey_name,question_text,answer_type,answer_value,skipped,score) VALUES ('detail-feedback-rating','participant-feedback','Feedback Form','How satisfied are you?','number','5',false,100),('detail-feedback-comment','participant-feedback','Feedback Form','What can we improve?','text','More product examples',false,0),('detail-certification-product','participant-certification','MyCompany Vendor Certification','Which product is certified?','choice','Desk',false,100),('detail-certification-policy','participant-certification','MyCompany Vendor Certification','Do you accept the vendor policy?','choice','Yes',false,100) ON CONFLICT (id) DO NOTHING;
      UPDATE surveys SET published_at = COALESCE(published_at, TIMESTAMP '2026-09-01 09:00:00') WHERE state = 'Published';
    down: |
      DROP TABLE IF EXISTS survey_detailed_answers;
      DROP TABLE IF EXISTS survey_suggested_values;
      DROP TABLE IF EXISTS survey_participants;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
