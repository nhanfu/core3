      CREATE TABLE IF NOT EXISTS survey_participants (id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, survey_id VARCHAR NOT NULL, survey_name VARCHAR NOT NULL, contact VARCHAR, email VARCHAR, attempt_no INTEGER NOT NULL DEFAULT 1, deadline DATE, quiz_passed BOOLEAN, score DECIMAL(8,2), state VARCHAR NOT NULL DEFAULT 'New', created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-09-01 09:00:00');
