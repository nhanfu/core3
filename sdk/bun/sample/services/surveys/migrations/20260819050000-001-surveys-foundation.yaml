version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS surveys (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        title VARCHAR NOT NULL, description VARCHAR, owner VARCHAR, response_count INTEGER NOT NULL DEFAULT 0,
        state VARCHAR NOT NULL DEFAULT 'Draft', published_at TIMESTAMP, closed_at TIMESTAMP,
        row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS survey_questions (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), survey_id VARCHAR NOT NULL,
        question_text VARCHAR NOT NULL, question_type VARCHAR NOT NULL DEFAULT 'Text', sequence INTEGER NOT NULL DEFAULT 1,
        required BOOLEAN NOT NULL DEFAULT FALSE, answer_options VARCHAR
      );
      CREATE TABLE IF NOT EXISTS survey_responses (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), survey_id VARCHAR NOT NULL,
        survey_name VARCHAR NOT NULL, respondent_name VARCHAR, respondent_email VARCHAR,
        answer_data VARCHAR, submitted_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        state VARCHAR NOT NULL DEFAULT 'Submitted'
      );
      CREATE INDEX IF NOT EXISTS surveys_state_idx ON surveys(state);
      CREATE INDEX IF NOT EXISTS survey_questions_survey_idx ON survey_questions(survey_id);
      CREATE INDEX IF NOT EXISTS survey_responses_survey_idx ON survey_responses(survey_id);
    down: |
      DROP TABLE IF EXISTS survey_responses;
      DROP TABLE IF EXISTS survey_questions;
      DROP TABLE IF EXISTS surveys;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
