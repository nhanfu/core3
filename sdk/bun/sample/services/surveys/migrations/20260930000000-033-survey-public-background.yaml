version: 0.0.33
description: Odoo-compatible public survey background image contract
kind: data
type:
  postgres:
    up: |
      ALTER TABLE surveys ADD COLUMN IF NOT EXISTS background_image_url VARCHAR;
      ALTER TABLE surveys ADD COLUMN IF NOT EXISTS background_image_content VARCHAR;
      INSERT INTO surveys(id, name, title, description, owner, response_count, state, access_token, background_image_url, background_image_content, published_at, created_at, updated_at)
      VALUES ('survey-demo-background', 'SURVEY/BACKGROUND', 'Brand Survey', 'A survey with a durable public background.', 'Mitchell Admin', 0, 'Published', 'background-public-token-2026', '/api/public/surveys/background-public-token-2026/background', '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Survey background"><defs><linearGradient id="survey-background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1e8f0"/><stop offset="0.52" stop-color="#e5eef4"/><stop offset="1" stop-color="#f7e8dd"/></linearGradient></defs><rect width="1600" height="900" fill="url(#survey-background)"/><circle cx="1260" cy="160" r="260" fill="#ffffff" fill-opacity=".24"/><circle cx="240" cy="780" r="320" fill="#ffffff" fill-opacity=".2"/></svg>', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')
      ON CONFLICT (id) DO UPDATE SET title = excluded.title, description = excluded.description, state = excluded.state, access_token = excluded.access_token, background_image_url = excluded.background_image_url, background_image_content = excluded.background_image_content, published_at = excluded.published_at;
      INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options)
      VALUES ('question-background-feedback', 'survey-demo-background', 'What should we improve?', 'Text', 1, false, '')
      ON CONFLICT (id) DO UPDATE SET question_text = excluded.question_text, question_type = excluded.question_type, sequence = excluded.sequence, required = excluded.required;
      UPDATE surveys SET response_count = 0 WHERE id = 'survey-demo-background';
    down: |
      DELETE FROM survey_questions WHERE survey_id = 'survey-demo-background';
      DELETE FROM surveys WHERE id = 'survey-demo-background';
      ALTER TABLE surveys DROP COLUMN IF EXISTS background_image_content;
      ALTER TABLE surveys DROP COLUMN IF EXISTS background_image_url;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
