version: 0.0.60
description: Durable Odoo-style Survey follower relation
kind: schema
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS survey_followers (
        id VARCHAR PRIMARY KEY,
        survey_id VARCHAR NOT NULL,
        user_id VARCHAR NOT NULL,
        user_name VARCHAR NOT NULL,
        user_email VARCHAR,
        row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        UNIQUE (survey_id, user_id)
      );
      CREATE INDEX IF NOT EXISTS survey_followers_survey_idx ON survey_followers(survey_id, user_id);
    down: |
      DROP INDEX IF EXISTS survey_followers_survey_idx;
      DROP TABLE IF EXISTS survey_followers;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
