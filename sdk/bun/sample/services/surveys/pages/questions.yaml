title: Questions
page: { id: survey-questions, route: /surveys/questions, breadcrumb: [Marketing, Surveys, Questions & Answers, Questions], auth: { require: [surveys.read] } }
components:
  - type: ListView
    variant: odoo
    source: survey_questions_catalog
    create_action: create_survey_question
    create_label: New
    search: { label: Search questions, placeholder: 'Search question or survey...' }
    group_by: [{ field: survey_name, label: Survey }, { field: question_type, label: Question Type }]
    columns:
      - { field: question_text, label: Question, type: PrimaryEntityCell }
      - { field: survey_name, label: Survey }
      - { field: question_type, label: Type }
      - { field: sequence, label: Sequence, align: right }
      - { field: required, label: Required }
      - { field: answer_options, label: Suggested Answers }
    page_size: 50
    row_key: id
