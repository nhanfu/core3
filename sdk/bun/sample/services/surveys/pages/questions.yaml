title: Questions
page: { id: survey-questions, route: /surveys/questions, breadcrumb: [Marketing, Surveys, Questions & Answers, Questions], auth: { require: [surveys.read] } }
components:
  - type: ListView
    variant: odoo
    source: survey_questions_catalog
    create_action: create_survey_question
    create_label: New
    search: { label: Search questions, placeholder: 'Search question or survey...' }
    group_by: [{ field: survey_name, label: Survey }, { field: question_type, label: Question Type }]
    columns:
      - { field: question_text, label: Question, type: PrimaryEntityCell }
      - { field: survey_name, label: Survey }
      - { field: question_type, label: Type }
      - { field: sequence, label: Sequence, align: right }
      - { field: required, label: Required }
      - { field: answer_options, label: Suggested Answers }
    page_size: 50
    row_key: id
    row_double_click_action: view_survey_question
actions:
  - id: view_survey_question
    type: navigate
    permission: surveys.read
    navigate_to: /surveys/question-detail
    params: { id: '{row.id}' }
  - id: create_survey_question
    type: server_form
    permission: surveys.write
    title: Add survey question
    action: surveys.questions.create
    handler: yaml_mutation
    operation: create_question
    refresh: [survey_questions_catalog]
    mutation:
      operation: insert
      table: survey_questions
      fields: [survey_id, question_text, question_type, sequence, required, answer_options]
      required: [survey_id, question_text]
      result: { query: "SELECT * FROM survey_questions WHERE id = :id" }
    fields:
      - { field: survey_id, label: Survey ID, type: text, required: true }
      - { field: question_text, label: Question, type: text, required: true }
      - { field: question_type, label: Type, type: select, options: [{ value: Text, label: Text }, { value: Rating, label: Rating }, { value: Choice, label: Choice }] }
      - { field: sequence, label: Sequence, type: number }
      - { field: required, label: Required, type: checkbox }
      - { field: answer_options, label: Options, type: text }
