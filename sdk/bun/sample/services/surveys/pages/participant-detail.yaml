title: Participant
page: { id: survey-participant-detail, route: /surveys/participant-detail, breadcrumb: [Marketing, Surveys, Participants, Participant], auth: { require: [surveys.read] } }
components:
  - type: OdooFormView
    source: survey_participant_detail
    title_field: contact
    subtitle_field: survey_name
    status_field: state
    editable: false
    labels: { workflowStatus: Status }
    header_actions:
      - { id: complete_survey_participant, label: Mark completed, permission: surveys.write, variant: primary, show_if: "record.state === 'In Progress'" }
    statusbar: [{ value: New, label: New }, { value: In Progress, label: In Progress }, { value: Completed, label: Completed }]
    status_colors: { New: neutral, 'In Progress': blue, Completed: green }
    group_columns: 2
    groups:
      - title: Participant
        fields: [{ field: contact, label: Contact }, { field: email, label: Email }, { field: survey_name, label: Survey }, { field: attempt_no, label: Attempt }, { field: deadline, label: Deadline }, { field: state, label: Status }]
      - title: Result
        fields: [{ field: quiz_passed, label: Quiz Passed }, { field: score, label: Score (%) }, { field: created_at, label: Created on }]
  - type: ContactGrid
    source: participant_answer_lines
    row_key: id
    columns:
      - { field: question_text, label: Question, type: PrimaryEntityCell }
      - { field: answer_type, label: Answer Type }
      - { field: answer_value, label: Answer }
      - { field: skipped, label: Answer State, type: StatusChip }
      - { field: score, label: Score, align: right }
      - { field: submitted_at, label: Submitted at }
    empty_state: { title: No answer lines, description: This participant has not submitted any answers. }
actions:
  - id: complete_survey_participant
    type: server
    permission: surveys.write
    action: surveys.participants.complete
    handler: yaml_mutation
    params: { id: '{row.id}' }
    refresh: [survey_participant_detail, participant_answer_lines]
    mutation:
      guards:
        - { query: "SELECT id FROM survey_participants WHERE id = :id AND state = 'In Progress' AND row_version = :expected_row_version AND EXISTS (SELECT 1 FROM survey_detailed_answers WHERE participant_id = :id AND skipped = false)", status: 409, message: Only in-progress participants with an answer can be completed. }
      steps:
        - { query: "UPDATE survey_participants SET state = 'Completed', score = COALESCE(score, 0), quiz_passed = COALESCE(quiz_passed, false), row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, message: The participant changed before completion. }
      result: { query: "SELECT * FROM survey_participants WHERE id = :id" }
