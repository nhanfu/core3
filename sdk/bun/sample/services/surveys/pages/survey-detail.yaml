title: Survey
page: { id: survey-detail, route: /surveys/detail, breadcrumb: [Marketing, Surveys, Detail], auth: { require: [surveys.read] } }
components:
  - type: OdooFormView
    source: survey_detail
    title_field: title
    subtitle_field: name
    status_field: state
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    header_actions:
      - { id: see_survey_results_detail, label: See results, variant: secondary, permission: surveys.read }
      - { id: test_survey_detail, label: Test, variant: secondary, permission: surveys.write, show_if: "record.state !== 'Archived'" }
      - { id: share_survey_detail, label: Share, variant: secondary, permission: surveys.write, show_if: "record.state !== 'Archived'" }
      - { id: start_live_session_detail, label: Create Live Session, variant: primary, permission: surveys.manage, show_if: "!record.session_state" }
      - { id: open_live_session_detail, label: Open Session Manager, variant: secondary, permission: surveys.manage, show_if: "record.session_state === 'Ready' || record.session_state === 'In Progress'" }
      - { id: end_live_session_detail, label: Close Live Session, variant: danger, permission: surveys.manage, show_if: "record.session_state === 'Ready' || record.session_state === 'In Progress'" }
      - { id: publish_survey_detail, label: Publish, variant: primary, permission: surveys.write, show_if: "state.survey_detail.state === 'Draft'" }
      - { id: close_survey_detail, label: Close, variant: secondary, permission: surveys.manage, show_if: "state.survey_detail.state === 'Published'" }
      - { id: cancel_survey_detail, label: Cancel, variant: danger, permission: surveys.manage, show_if: "state.survey_detail.state === 'Draft' || state.survey_detail.state === 'Published'" }
      - { id: archive_survey_detail, label: Archive, variant: secondary, permission: surveys.manage, show_if: "state.survey_detail.state === 'Draft' || state.survey_detail.state === 'Published' || state.survey_detail.state === 'Closed'" }
      - { id: reopen_survey_detail, label: Reopen, variant: primary, permission: surveys.manage, show_if: "state.survey_detail.state === 'Archived'" }
    action_menu:
      label: Actions
      aria_label: Actions menu
      icon: more-vertical
      actions:
        - { id: duplicate_survey_detail, label: Duplicate, icon: copy, permission: surveys.write }
        - { id: delete_survey_detail, label: Delete, icon: trash, variant: danger, permission: surveys.write }
        - { id: print_survey_detail, label: Print Survey, permission: surveys.read }
        - { id: archive_survey_detail, label: Archive, icon: archive, permission: surveys.manage, show_if: "state.survey_detail.state === 'Draft' || state.survey_detail.state === 'Published' || state.survey_detail.state === 'Closed'" }
    stat_buttons:
      - { id: survey_certified_stats_detail, label: Certified, value_field: certified_count, permission: surveys.read }
      - { id: survey_registered_stats_detail, label: Registered, value_field: registered_count, permission: surveys.read }
      - { id: survey_participant_stats_detail, label: Participants, value_field: completed_count, permission: surveys.read }
    statusbar: [{ value: Draft, label: Draft }, { value: Published, label: Published }, { value: Closed, label: Closed }, { value: Cancelled, label: Cancelled }, { value: Archived, label: Archived }]
    status_colors: { Draft: neutral, Published: blue, Closed: green, Cancelled: red, Archived: neutral }
    group_columns: 2
    groups:
      - title: Survey
        fields: [{ field: name, label: Survey }, { field: state, label: Status }, { field: title, label: Title }, { field: owner, label: Owner }, { field: response_count, label: Responses }]
      - title: Description
        fields: [{ field: description, label: Description }, { field: published_at, label: Published at }, { field: closed_at, label: Closed at }]
  - type: ContactGrid
    source: survey_questions
    row_key: id
    columns:
      - { field: sequence, label: '#', align: right }
      - { field: question_text, label: Question, type: PrimaryEntityCell }
      - { field: question_type, label: Type }
      - { field: required, label: Required }
      - { field: answer_options, label: Options }
  - type: ContactGrid
    source: survey_responses
    row_key: id
    columns:
      - { field: respondent_name, label: Respondent, type: PrimaryEntityCell }
      - { field: respondent_email, label: Email }
      - { field: answer_data, label: Answers }
      - { field: submitted_at, label: Submitted at }
      - { field: state, label: Status, type: StatusChip }
    empty_state: { title: No responses, description: Responses will appear here after publication. }
actions:
  - id: duplicate_survey_detail
    type: client
    permission: surveys.write
    script: |
      // js
      async ({ row, request }) => {
        const result = await request('/api/actions/surveys.records.duplicate', {
          method: 'POST',
          body: {
            id: row.id,
            source_id: row.id,
            expected_row_version: row.row_version,
          },
        });
        const app = await import('/app.ts');
        await app.navigate('/surveys/detail', { id: String(result.id) });
      }
  - id: print_survey_detail
    type: client
    permission: surveys.read
    script: |
      // js
      async ({ row }) => {
        if (!row.access_token) throw new Error('This survey does not have a printable link.');
        window.open(`/survey/print/${encodeURIComponent(row.access_token)}`, '_blank', 'noopener');
      }
  - id: delete_survey_detail
    type: client
    permission: surveys.write
    script: |
      // js
      async ({ row, request }) => {
        const title = String(row.title || row.name || 'this survey');
        if (!window.confirm(`Delete survey ${title}?\nIt will be removed permanently.`)) return;
        await request('/api/actions/surveys.records.delete', {
          method: 'POST',
          body: {
            id: row.id,
            expected_row_version: row.row_version,
          },
        });
        const app = await import('/app.ts');
        await app.navigate('/surveys');
      }
  - id: test_survey_detail
    type: navigate
    permission: surveys.write
    navigate_to: /surveys/test
    params: { survey_id: '{row.id}' }
  - { id: see_survey_results_detail, type: navigate, permission: surveys.read, navigate_to: /surveys/results, params: { survey_id: '{row.id}' } }
  - { id: open_live_session_detail, type: navigate, permission: surveys.manage, navigate_to: /surveys/live-session, params: { survey_id: '{row.id}' } }
  - { id: survey_certified_stats_detail, type: navigate, permission: surveys.read, navigate_to: /surveys/participants, params: { survey_id: '{row.id}', quiz_status: Passed } }
  - { id: survey_participant_stats_detail, type: navigate, permission: surveys.read, navigate_to: /surveys/participants, params: { survey_id: '{row.id}', state: Completed } }
  - { id: survey_registered_stats_detail, type: navigate, permission: surveys.read, navigate_to: /surveys/participants, params: { survey_id: '{row.id}' } }
  - { id: publish_survey_detail, type: server, permission: surveys.write, action: surveys.records.publish, handler: order_transition, workflow: surveys, operation: publish, params: { id: '{state.id}' }, refresh: [survey_detail] }
  - { id: close_survey_detail, type: server, permission: surveys.manage, action: surveys.records.close, handler: order_transition, workflow: surveys, operation: close, params: { id: '{state.id}' }, refresh: [survey_detail] }
  - { id: cancel_survey_detail, type: server, permission: surveys.manage, action: surveys.records.cancel, handler: order_transition, workflow: surveys, operation: cancel, params: { id: '{state.id}' }, refresh: [survey_detail] }
  - { id: archive_survey_detail, type: server, permission: surveys.manage, action: surveys.records.archive, handler: order_transition, workflow: surveys, operation: archive, params: { id: '{state.id}' }, refresh: [survey_detail] }
  - { id: reopen_survey_detail, type: server, permission: surveys.manage, action: surveys.records.reopen, handler: order_transition, workflow: surveys, operation: reopen, params: { id: '{state.id}' }, refresh: [survey_detail] }
