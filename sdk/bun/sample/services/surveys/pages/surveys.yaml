title: Surveys
# The public /survey/start/<access_token> renderer is intentionally outside
# this authenticated admin layout. Its API contract lives in api/surveys.yaml
# and joins this page fragment through page.id: surveys.
page: { id: surveys, route: /surveys, breadcrumb: [Marketing, Surveys], auth: { require: [surveys.read] } }
# Public submission score/pass results are returned by the paired API action
# and persisted on the response; the renderer remains joined through page.id.
# The public completion message is likewise sourced from the survey record and
# consumed by the token-scoped renderer after submit/resume.
# Public Date, Datetime, Scale, Matrix, conditional, and choice-comment questions are rendered by the same
# token-scoped page binding; their answer contracts are defined by the paired
# API fragment. Matrix answers use a row-to-column map and preserve the
# source-defined row/column labels. Conditional follow-ups are returned and
# navigated only when their durable trigger answer is present. Choice comments
# use a question-scoped answer-data entry and can satisfy a required choice when
# the source question enables comment_count_as_answer.
# Text questions with save_as_email/save_as_nickname retain the answer in the
# durable response identity fields, matching Odoo's respondent capture flags.
# The public survey frame also consumes the persisted background_image_url from
# the paired API contract; its token-scoped asset route stays outside this
# authenticated admin layout.
# Numerical questions consume the paired API validation_required/min/max fields
# in the same token-scoped renderer; the page remains layout-only.
# Char questions consume validation_email and validation_length_min/max from
# the paired API contract; no validation state is owned by this page fragment.
# Text Box questions consume the paired question_type and render a three-row
# textarea; answer persistence and mandatory guards remain API-owned.
# Multiple Choice questions render the paired option list as checkbox controls;
# option ownership, duplicate rejection, and required completion remain guarded
# by the token-scoped API mutation.
# Survey-level time limits consume the paired API's is_time_limited/time_limit
# and response start_datetime; the public renderer owns only the visible
# countdown while the API remains authoritative for expiry and mutation guards.
# Odoo attempt-limited surveys expose access_mode/users_login_required and
# require a respondent email at the public start screen; the paired API owns
# completed non-test attempt counting and start/retry/submit guards.
# Odoo users_can_go_back is projected by the API and consumed by the public
# renderer; the cursor mutation remains server-guarded for direct callers.
# Odoo token-mode surveys require a pre-created answer token from the invite
# flow; the public renderer remains layout-only while the paired API validates
# the answer token before returning questions or beginning the response.
# Odoo survey.survey.lang_ids and survey.user_input.lang_id are projected by
# the paired API as languages/language_code; the public renderer only collects
# the supported respondent choice and does not claim translation-catalog parity.
components:
  - type: ListView
    variant: odoo
    source: surveys
    create_action: create_survey
    create_label: New survey
    search: { label: Search surveys, placeholder: 'Search survey or title...' }
    filters: [{ field: state, label: Status, options_source: survey_states }]
    view_navigation: tabs
    views:
      - id: card
        label: Cards
        icon: grid
        card:
          title: title
          subtitle: owner
          fields:
            - { field: question_count, label: Questions }
            - { field: registered_count, label: Registered }
            - { field: completed_count, label: Completed }
            - { field: certified_count, label: Certified }
            - { field: published_at, label: Published at }
            - { field: state, label: Status }
          actions:
            - { id: open_survey_registered_cards, label: Registered, label_field: registered_count, permission: surveys.read, show_if: 'row.registered_count > 0' }
            - { id: open_survey_completed_cards, label: Completed, label_field: completed_count, permission: surveys.read, show_if: 'row.completed_count > 0' }
            - { id: open_survey_certified_cards, label: Certified, label_field: certified_count, permission: surveys.read, show_if: 'row.certified_count > 0' }
            - { id: start_live_session_card, label: Start Live Session, permission: surveys.manage, show_if: "(row.state === 'Draft' || row.state === 'Published') && row.question_count > 0 && !row.session_state" }
      - id: list
        label: List
        icon: table
        mobile: false
    columns:
      - { field: name, label: Survey, type: PrimaryEntityCell }
      - { field: title, label: Title }
      - { field: owner, label: Owner }
      - { field: responsible_user_name, label: Responsible }
      - { field: restricted_user_names, label: Restricted users }
      - { field: response_count, label: Responses, align: right }
      - { field: published_at, label: Published at }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    row_double_click_action: view_survey_detail
    actions:
      - { id: edit_survey, label: Edit Survey, permission: surveys.write }
      - { id: delete_survey_card, label: Delete, icon: trash, variant: danger, permission: surveys.write }
      - { id: set_survey_card_color, label: Color, icon: palette, permission: surveys.write }
      - { id: share_survey, label: Share, permission: surveys.write, variant: secondary, show_if: "row.state !== 'Archived'" }
      - { id: manage_survey_invite_attachments, label: Invite attachments, permission: surveys.write, variant: secondary, show_if: "row.state !== 'Archived'" }
      - { id: test_survey, label: Test, permission: surveys.write, variant: secondary, show_if: "row.state !== 'Archived'" }
      - { id: publish_survey, label: Publish, permission: surveys.write, variant: primary, show_if: "row.state === 'Draft'" }
      - { id: close_survey, label: Close, permission: surveys.manage, variant: secondary, show_if: "row.state === 'Published'" }
      - { id: cancel_survey, label: Cancel, permission: surveys.manage, variant: danger, show_if: "row.state === 'Draft' || row.state === 'Published'" }
      - { id: archive_survey, label: Archive, permission: surveys.manage, variant: secondary, show_if: "row.state === 'Draft' || row.state === 'Published' || row.state === 'Closed'" }
      - { id: reopen_survey, label: Reopen, permission: surveys.manage, variant: primary, show_if: "row.state === 'Archived'" }
actions:
  - id: edit_survey
    type: navigate
    permission: surveys.write
    navigate_to: /surveys/detail
    params: { id: '{row.id}' }
  - id: open_survey_registered_cards
    type: navigate
    permission: surveys.read
    navigate_to: /surveys/participants
    params: { survey_id: '{row.id}' }
  - id: open_survey_completed_cards
    type: navigate
    permission: surveys.read
    navigate_to: /surveys/participants
    params: { survey_id: '{row.id}', state: Completed }
  - id: open_survey_certified_cards
    type: navigate
    permission: surveys.read
    navigate_to: /surveys/participants
    params: { survey_id: '{row.id}', quiz_status: Passed }
  - id: delete_survey_card
    type: client
    permission: surveys.write
    script: |
      // js
      async ({ row, request }) => {
        const title = String(row.title || row.name || 'this survey');
        if (!window.confirm(`Delete survey ${title}?\nIt will be removed permanently.`)) return;
        await request('/api/actions/surveys.records.delete', {
          method: 'POST',
          body: {
            id: row.id,
            expected_row_version: row.row_version,
          },
        });
        const app = await import('/app.ts');
        await app.navigate('/surveys');
      }
  - id: manage_survey_invite_attachments
    type: navigate
    permission: surveys.write
    navigate_to: /surveys/invite
    params: { survey_id: '{row.id}' }
  - id: view_survey_detail
    type: navigate
    permission: surveys.read
    navigate_to: /surveys/detail
    params: { id: '{row.id}' }
  - id: test_survey
    type: navigate
    permission: surveys.write
    navigate_to: /surveys/test
    params: { survey_id: '{row.id}' }
  - id: create_survey
    type: server_form
    permission: surveys.write
    title: New survey
    action: surveys.records.create
    handler: yaml_mutation
    operation: create
    refresh: [surveys]
    mutation:
      operation: insert
      table: surveys
      fields: [name, title, description, owner, languages]
      required: [name, title]
      result: { query: "SELECT * FROM surveys WHERE id = :id" }
    fields:
      - { field: name, label: Survey, type: text, required: true }
      - { field: title, label: Title, type: text, required: true }
      - { field: description, label: Description, type: text }
      - { field: owner, label: Owner, type: text }
      - { field: languages, label: Languages, type: text, placeholder: 'e.g. en_US||fr_FR' }
  - id: create_survey_question
    type: server_form
    permission: surveys.write
    title: Add survey question
    action: surveys.questions.create
    handler: yaml_mutation
    operation: create_question
    refresh: [surveys, survey_questions_catalog]
    mutation:
      operation: insert
      table: survey_questions
      fields: [survey_id, question_text, question_type, sequence, required, answer_options]
      required: [survey_id, question_text]
      result: { query: "SELECT * FROM survey_questions WHERE id = :id" }
    fields:
      - { field: survey_id, label: Survey ID, type: text, required: true }
      - { field: question_text, label: Question, type: text, required: true }
      - { field: question_type, label: Type, type: select, options: [{ value: Text, label: Text }, { value: Rating, label: Rating }, { value: Choice, label: Choice }] }
      - { field: sequence, label: Sequence, type: number }
      - { field: required, label: Required, type: checkbox }
      - { field: answer_options, label: Options, type: text }
  - id: submit_survey_response
    type: server_form
    permission: surveys.write
    title: Submit response
    action: surveys.responses.create
    handler: yaml_mutation
    operation: submit_response
    refresh: [surveys]
    mutation:
      operation: insert
      table: survey_responses
      fields: [survey_id, survey_name, respondent_name, respondent_email, answer_data]
      required: [survey_id, survey_name, answer_data]
      guards: [{ query: "SELECT 1 AS ok FROM surveys WHERE id = :survey_id AND state = 'Published'", status: 409, message: Only published surveys accept responses }]
      steps: [{ query: "UPDATE surveys SET response_count = response_count + 1, row_version = row_version + 1 WHERE id = :survey_id" }]
      result: { query: "SELECT * FROM survey_responses WHERE id = :id" }
    fields:
      - { field: survey_id, label: Survey ID, type: text, required: true }
      - { field: survey_name, label: Survey, type: text, required: true }
      - { field: respondent_name, label: Respondent, type: text }
      - { field: respondent_email, label: Email, type: text }
      - { field: answer_data, label: Answers, type: text, required: true }
  - { id: publish_survey, type: server, permission: surveys.write, action: surveys.records.publish, handler: order_transition, workflow: surveys, operation: publish, refresh: [surveys] }
  - { id: close_survey, type: server, permission: surveys.manage, action: surveys.records.close, handler: order_transition, workflow: surveys, operation: close, refresh: [surveys] }
  - { id: cancel_survey, type: server, permission: surveys.manage, action: surveys.records.cancel, handler: order_transition, workflow: surveys, operation: cancel, refresh: [surveys] }
  - { id: archive_survey, type: server, permission: surveys.manage, action: surveys.records.archive, handler: order_transition, workflow: surveys, operation: archive, refresh: [surveys] }
  - { id: reopen_survey, type: server, permission: surveys.manage, action: surveys.records.reopen, handler: order_transition, workflow: surveys, operation: reopen, refresh: [surveys] }
