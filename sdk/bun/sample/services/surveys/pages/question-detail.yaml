title: Question
page: { id: survey-question-detail, route: /surveys/question-detail, breadcrumb: [Marketing, Surveys, Questions & Answers, Question], auth: { require: [surveys.read] } }
components:
  - type: OdooFormView
    source: survey_question_detail
    title_field: question_text
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Question type }
    header_actions:
      - { id: edit_survey_question, label: Edit, variant: secondary, permission: surveys.write }
    action_menu:
      label: Actions
      aria_label: Actions menu
      icon: more-vertical
      actions:
        - { id: duplicate_survey_question, label: Duplicate, icon: copy, permission: surveys.write }
    group_columns: 2
    groups:
      - title: Question
        fields: [{ field: question_text, label: Question }, { field: survey_name, label: Survey }, { field: question_type, label: Type }, { field: sequence, label: Sequence }, { field: required, label: Required }]
      - title: Answers
        fields: [{ field: answer_options, label: Suggested Answers, wide: true }]
  - type: ContactGrid
    source: question_suggested_values
    row_key: id
    columns:
      - { field: value, label: Answer, type: PrimaryEntityCell }
      - { field: sequence, label: Sequence, align: right }
      - { field: score, label: Score, align: right }
      - { field: matrix_row, label: Matrix Row, optional: hide }
      - { field: matrix_column, label: Matrix Column, optional: hide }
    empty_state: { title: No suggested values, description: Add suggested answers for choice and matrix questions. }
actions:
  - id: duplicate_survey_question
    type: client
    permission: surveys.write
    script: |
      // js
      async ({ row, request }) => {
        const result = await request('/api/actions/surveys.questions.duplicate', {
          method: 'POST',
          body: {
            id: row.id,
            source_id: row.id,
            expected_survey_row_version: row.survey_row_version,
          },
        });
        const app = await import('/app.ts');
        await app.navigate('/surveys/question-detail', { id: String(result.id) });
      }
