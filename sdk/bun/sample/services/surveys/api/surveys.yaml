page: { id: surveys }
datasources:
  - id: survey_states
    permission: surveys.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Published','Published'), ('Closed','Closed'), ('Cancelled','Cancelled'), ('Archived','Archived')) states(value, label)"
  - id: surveys
    permission: surveys.read
    workflow: surveys
    query: "SELECT s.id, s.row_version, s.name, s.title, s.owner, s.response_count, s.state, s.access_token, COALESCE(s.access_mode, 'public') AS access_mode, COALESCE(s.questions_layout, 'page_per_question') AS questions_layout, COALESCE(s.questions_selection, 'all') AS questions_selection, COALESCE(s.progression_mode, 'percent') AS progression_mode, COALESCE(s.users_login_required, false) AS users_login_required, COALESCE(s.is_attempts_limited, false) AS is_attempts_limited, COALESCE(s.attempts_limit, 1) AS attempts_limit, COALESCE(s.users_can_go_back, false) AS users_can_go_back, s.languages, CASE WHEN s.access_token IS NULL OR s.access_token = '' THEN NULL ELSE '/survey/start/' || s.access_token END AS share_url, 'Participate to ' || s.title || ' survey' AS invite_subject, CASE WHEN s.title ILIKE '%certification%' THEN 'Dear participant\n\nYou have been invited to take a new certification.\n\nStart Certification\n\nWe wish you good luck!' ELSE 'Dear participant\n\nWe are conducting a survey and your response would be appreciated.\n\nStart Survey\n\nThank you in advance for your participation.' END AS invite_body, CAST(s.published_at AS VARCHAR) AS published_at, CAST(s.closed_at AS VARCHAR) AS closed_at FROM surveys s WHERE (:q IS NULL OR s.name ILIKE '%' || :q || '%' OR s.title ILIKE '%' || :q || '%') AND (:state IS NULL OR s.state = :state) ORDER BY s.created_at DESC, s.id"
actions:
  - id: share_survey
    type: server_form
    permission: surveys.write
    title: Share a Survey
    action: surveys.invites.send
    handler: yaml_mutation
    operation: create
    params: { id: '', survey_id: '{row.id}', survey_name: '{row.title}', survey_link: '{row.share_url}' }
    prefill: { survey_link: '{row.share_url}', subject: '{row.invite_subject}', body: '{row.invite_body}' }
    refresh: [surveys]
    mutation:
      operation: insert
      table: survey_invites
      generated: [id]
      fields: [survey_link, send_email, recipients, additional_emails, subject, body, attachment_names, deadline, mail_template]
      required: [survey_link, send_email]
      defaults: { state: Link ready, attachment_names: '', deadline: '', mail_template: 'Survey: Invite', created_at: '2026-01-15 09:00:00' }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :survey_id AND row_version = :expected_row_version AND state <> 'Archived'", status: 409, code: SURVEY_INVITE_SURVEY_CHANGED, message: This survey changed or is archived. Reload it before sharing. }
        - { query: "SELECT id FROM surveys WHERE id = :survey_id AND access_token IS NOT NULL AND LENGTH(TRIM(access_token)) > 0", status: 422, code: SURVEY_INVITE_TOKEN_REQUIRED, message: This survey does not have a share link yet. }
        - { query: "SELECT 1 AS ok WHERE CAST(:send_email AS BOOLEAN) = FALSE OR LENGTH(TRIM(COALESCE(CAST(:recipients AS VARCHAR), ''))) > 0 OR LENGTH(TRIM(COALESCE(CAST(:additional_emails AS VARCHAR), ''))) > 0", status: 422, code: SURVEY_INVITE_RECIPIENTS_REQUIRED, message: Add at least one recipient or additional email before sending. }
        - { query: "SELECT 1 AS ok WHERE CAST(:send_email AS BOOLEAN) = FALSE OR (LENGTH(TRIM(COALESCE(CAST(:subject AS VARCHAR), ''))) > 0 AND LENGTH(TRIM(COALESCE(CAST(:body AS VARCHAR), ''))) > 0)", status: 422, code: SURVEY_INVITE_MESSAGE_REQUIRED, message: Subject and message are required when sending by email. }
      steps:
        - { query: "UPDATE survey_invites SET survey_id = :survey_id, survey_name = :survey_name, state = CASE WHEN CAST(:send_email AS BOOLEAN) THEN 'Sent' ELSE 'Link ready' END, sent_at = CASE WHEN CAST(:send_email AS BOOLEAN) THEN TIMESTAMP '2026-01-15 09:05:00' ELSE NULL END WHERE id = :id" }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :survey_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_INVITE_SURVEY_CHANGED, message: This survey changed before the share was saved. Reload it before sharing. }
      result: { query: "SELECT CASE WHEN send_email THEN 'Invitation sent' ELSE 'Survey link ready' END AS message, id, survey_id, survey_name, state, send_email, recipients, additional_emails, subject, deadline, mail_template FROM survey_invites WHERE id = :id" }
    fields:
      - { field: survey_link, label: Survey Link, type: text, required: true }
      - { field: send_email, label: Send by Email, type: checkbox, default: false }
      - { field: recipients, label: Recipients, type: text }
      - { field: additional_emails, label: Additional emails, type: textarea, placeholder: "e.g. 'Rick Sanchez' <rick_sanchez@example.com>, hictor_vugo@example.com" }
      - { field: subject, label: Subject, type: text, required: false }
      - { field: body, label: Message, type: textarea }
      - { field: attachment_names, label: Attachments, type: text }
      - { field: deadline, label: Answer deadline, type: text, placeholder: 'YYYY-MM-DD' }
      - { field: mail_template, label: Mail Template, type: select, default: 'Survey: Invite', options: [{ value: 'Survey: Invite', label: 'Survey: Invite' }] }

  # Public-token actions are kept in the API fragment rather than the page
  # layout. The Surveys module controller authenticates the survey and answer
  # tokens before dispatching them. A public start may also resume the answer
  # token carried by the Odoo-compatible survey_<survey_token> cookie; the
  # page renderer remains bound to this API fragment through page.id: surveys.
  # Date and Datetime questions use Odoo-compatible ISO values inside
  # answer_data; Multiple Choice values are a source-aligned option array
  # (Odoo normalizes a single submitted choice to the same list shape);
  # duplicate or foreign options are rejected before answer_data changes.
  # Scale values use the deterministic question option range;
  # Matrix values use a row-to-column JSON map; mandatory matrix questions
  # require every source-defined row to be covered. Conditional follow-ups
  # carry their durable trigger relation through the public question contract.
  # Choice comments are returned by the public question metadata operation and
  # persist as <question_id>__comment in answer_data; comment_count_as_answer
  # mirrors Odoo's required-choice behavior.
  # Odoo char_box questions can persist an answer as the respondent email or
  # nickname. The public identity operation supplies these flags to the paired
  # page binding, and the controller writes the derived identity on progress
  # and submit while retaining the original answer_data.
  # Odoo survey background_image_url is exposed through the token-scoped public
  # asset handler below; the page renderer consumes the paired survey field.
  # Odoo numerical_box validation metadata is projected by the public question
  # operation and enforced before progress/submit mutates answer_data.
  # Odoo char_box email and length validation uses the same durable public
  # question metadata and remains enforced before progress/submit mutation.
  # Odoo text_box answers are scalar multi-line values; the paired public
  # route preserves them in answer_data before progress/submit mutation.
  # Module validation runs before progress or submit mutates rows. Odoo's
  # survey-level timer is separate from an externally assigned answer
  # deadline and starts when the attempt enters progress.
  # Odoo counts only completed non-test attempts for the respondent identity
  # when login is required or the survey uses invited access. Anonymous public
  # surveys keep their source behavior and do not consume a global attempt.
  # Odoo token-mode surveys require an existing survey.user_input answer token;
  # the paired public route validates that durable answer before exposing the
  # question graph or allowing the New response to begin.
  - id: public_survey_start
    type: server_form
    permission: surveys.public
    title: Start public survey response
    action: surveys.public.start
    handler: yaml_mutation
    mutation:
      operation: insert
      table: survey_responses
      fields: [survey_id, survey_name, respondent_email, language_code, answer_data, access_token, current_question_id, question_order, skipped_questions, idempotency_key, start_datetime]
      required: [survey_id, survey_name, answer_data]
      defaults: { state: In Progress }
      generated: [access_token]
      guards:
        - { query: "SELECT 1 AS ok FROM surveys WHERE id = :survey_id AND (COALESCE(users_login_required, false) = false OR LENGTH(TRIM(COALESCE(CAST(:respondent_email AS VARCHAR), ''))) > 0)", status: 401, code: SURVEY_PUBLIC_LOGIN_REQUIRED, message: Enter an email address before starting this survey. }
        - { query: "SELECT 1 AS ok FROM surveys WHERE id = :survey_id AND (COALESCE(languages, '') = '' OR :language_code IS NULL OR POSITION('||' || CAST(:language_code AS VARCHAR) || '||' IN '||' || languages || '||') > 0)", status: 422, code: SURVEY_PUBLIC_LANGUAGE_INVALID, message: Choose a language supported by this survey. }
        - { query: "SELECT 1 AS ok FROM surveys s WHERE s.id = :survey_id AND (COALESCE(s.access_mode, 'public') <> 'token' OR EXISTS (SELECT 1 FROM survey_responses r WHERE r.survey_id = s.id AND r.access_token = :answer_token AND r.state = 'New'))", status: 403, code: SURVEY_PUBLIC_TOKEN_REQUIRED, message: An invitation answer token is required to start this survey. }
        - { query: "SELECT 1 AS ok FROM surveys s WHERE s.id = :survey_id AND (COALESCE(s.is_attempts_limited, false) = false OR (s.access_mode = 'public' AND COALESCE(s.users_login_required, false) = false) OR (SELECT COUNT(*) FROM survey_responses r WHERE r.survey_id = s.id AND r.state = 'Submitted' AND COALESCE(r.test_entry, false) = false AND LOWER(TRIM(COALESCE(r.respondent_email, ''))) = LOWER(TRIM(COALESCE(CAST(:respondent_email AS VARCHAR), '')))) < COALESCE(s.attempts_limit, 1))", status: 409, code: SURVEY_PUBLIC_ATTEMPTS_EXHAUSTED, message: You have no attempts left for this survey. }
      result: { query: "SELECT id, access_token, survey_id, state, answer_data, respondent_name, respondent_email, language_code, current_question_id, question_order, skipped_questions, CAST(start_datetime AS VARCHAR) AS start_datetime FROM survey_responses WHERE id = :id" }
    fields:
      - { field: survey_id, label: Survey ID, type: text, required: true }
      - { field: survey_name, label: Survey, type: text, required: true }
      - { field: respondent_email, label: Email, type: email }
      - { field: language_code, label: Respondent language, type: text }
      - { field: answer_data, label: 'Answers (Date/Datetime: ISO)', type: text, required: true }
      - { field: answer_token, label: Existing response token, type: text }
      - { field: question_order, label: Persisted question order, type: text }
      - { field: skipped_questions, label: Skipped optional questions, type: text }
      - { field: idempotency_key, label: Idempotency key, type: text }
  - id: public_survey_background
    type: server_form
    permission: surveys.public
    title: Load public survey background
    action: surveys.public.background
    handler: public_asset
    params: { access_token: '{token}' }
    fields:
      - { field: access_token, label: Survey token, type: text, required: true }
  - id: public_survey_question_image
    type: server_form
    permission: surveys.public
    title: Load public suggested-answer image
    action: surveys.public.question_image
    handler: public_asset
    fields:
      - { field: survey_token, label: Survey token, type: text, required: true }
      - { field: answer_token, label: Answer token, type: text, required: true }
      - { field: question_id, label: Question, type: text, required: true }
      - { field: suggested_answer_id, label: Suggested answer, type: text, required: true }
  - id: public_survey_begin
    type: server_form
    permission: surveys.public
    title: Begin public survey response
    action: surveys.public.begin
    handler: yaml_mutation
    mutation:
      operation: update
      table: survey_responses
      fields: [state, current_question_id, question_order, skipped_questions, language_code, start_datetime]
      required: [current_question_id]
      concurrency: false
      guards:
        - { query: "SELECT id FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND state = 'New'", status: 409, code: SURVEY_PUBLIC_BEGIN_STATE, message: This survey response has already begun or is no longer available. }
        - { query: "SELECT 1 AS ok FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND (deadline IS NULL OR deadline > CURRENT_TIMESTAMP)", status: 410, code: SURVEY_PUBLIC_RESPONSE_EXPIRED, message: This survey response has expired }
        - { query: "SELECT 1 AS ok FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND (COALESCE(s.is_time_limited, false) = false OR r.start_datetime IS NULL OR CURRENT_TIMESTAMP < r.start_datetime + s.time_limit * INTERVAL '1 minute')", status: 410, code: SURVEY_PUBLIC_TIME_LIMIT_EXPIRED, message: "This survey's time limit has expired." }
        - { query: "SELECT id FROM survey_questions WHERE id = :current_question_id AND survey_id = :survey_id", status: 422, code: SURVEY_PUBLIC_BEGIN_QUESTION, message: The first survey question is unavailable. }
      result: { query: "SELECT id, access_token, survey_id, state, answer_data, respondent_name, respondent_email, language_code, current_question_id, question_order, skipped_questions, CAST(start_datetime AS VARCHAR) AS start_datetime FROM survey_responses WHERE id = :id" }
    fields:
      - { field: current_question_id, label: First question, type: text, required: true }
      - { field: question_order, label: Persisted question order, type: text }
      - { field: skipped_questions, label: Skipped optional questions, type: text }
      - { field: language_code, label: Respondent language, type: text }
  - id: public_survey_submit
    type: server_form
    permission: surveys.public
    title: Submit public survey response
    action: surveys.public.submit
    handler: yaml_mutation
    mutation:
      operation: update
      table: survey_responses
      fields: [answer_data, respondent_name, respondent_email, skipped_questions, language_code, idempotency_key, score, quiz_passed]
      required: [answer_data]
      concurrency: false
      guards:
        - { query: "SELECT 1 AS ok FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND state = 'In Progress'", status: 409, code: SURVEY_PUBLIC_RESPONSE_NOT_IN_PROGRESS, message: This survey response is no longer available for editing }
        - { query: "SELECT 1 AS ok FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND (COALESCE(s.is_attempts_limited, false) = false OR (s.access_mode = 'public' AND COALESCE(s.users_login_required, false) = false) OR (SELECT COUNT(*) FROM survey_responses completed WHERE completed.survey_id = r.survey_id AND completed.state = 'Submitted' AND COALESCE(completed.test_entry, false) = false AND completed.id <> r.id AND LOWER(TRIM(COALESCE(completed.respondent_email, ''))) = LOWER(TRIM(COALESCE(r.respondent_email, '')))) < COALESCE(s.attempts_limit, 1))", status: 409, code: SURVEY_PUBLIC_ATTEMPTS_EXHAUSTED, message: You have no attempts left for this survey. }
        - { query: "SELECT 1 AS ok FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND (deadline IS NULL OR deadline > CURRENT_TIMESTAMP)", status: 410, code: SURVEY_PUBLIC_RESPONSE_EXPIRED, message: This survey response has expired }
        - { query: "SELECT 1 AS ok FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND (COALESCE(s.is_time_limited, false) = false OR r.start_datetime IS NULL OR CURRENT_TIMESTAMP < r.start_datetime + s.time_limit * INTERVAL '1 minute')", status: 410, code: SURVEY_PUBLIC_TIME_LIMIT_EXPIRED, message: "This survey's time limit has expired." }
      steps:
        - { query: "UPDATE survey_responses SET state = 'Submitted', submitted_at = TIMESTAMP '2026-01-15 09:30:00' WHERE id = :id" }
        - { query: "UPDATE surveys SET response_count = response_count + 1, row_version = row_version + 1 WHERE id = :survey_id" }
      result: { query: "SELECT r.id, r.access_token, r.survey_id, r.state, r.answer_data, r.skipped_questions, r.language_code, r.score, r.quiz_passed, s.description_done, CAST(r.submitted_at AS VARCHAR) AS submitted_at FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id" }
    fields:
      - { field: answer_data, label: 'Answers (Date/Datetime: ISO)', type: text, required: true }
      - { field: respondent_name, label: Respondent, type: text }
      - { field: respondent_email, label: Email, type: text }
      - { field: language_code, label: Respondent language, type: text }
      - { field: idempotency_key, label: Idempotency key, type: text }
      - { field: score, label: Score percentage, type: number }
      - { field: quiz_passed, label: Passed, type: checkbox }
  - id: public_survey_progress
    type: server_form
    permission: surveys.public
    title: Save public survey progress
    action: surveys.public.progress
    handler: yaml_mutation
    mutation:
      operation: update
      table: survey_responses
      fields: [answer_data, respondent_name, respondent_email, skipped_questions]
      required: [answer_data]
      concurrency: false
      guards:
        - { query: "SELECT 1 AS ok FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND state = 'In Progress'", status: 409, code: SURVEY_PUBLIC_RESPONSE_NOT_IN_PROGRESS, message: This survey response is no longer available for editing }
        - { query: "SELECT 1 AS ok FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND (deadline IS NULL OR deadline > CURRENT_TIMESTAMP)", status: 410, code: SURVEY_PUBLIC_RESPONSE_EXPIRED, message: This survey response has expired }
        - { query: "SELECT 1 AS ok FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND (COALESCE(s.is_time_limited, false) = false OR r.start_datetime IS NULL OR CURRENT_TIMESTAMP < r.start_datetime + s.time_limit * INTERVAL '1 minute')", status: 410, code: SURVEY_PUBLIC_TIME_LIMIT_EXPIRED, message: "This survey's time limit has expired." }
      result: { query: "SELECT id, access_token, survey_id, state, answer_data, respondent_name, respondent_email, language_code, current_question_id, skipped_questions FROM survey_responses WHERE id = :id" }
    fields:
      - { field: answer_data, label: Answers, type: text, required: true }
      - { field: respondent_name, label: Respondent, type: text }
      - { field: respondent_email, label: Email, type: text }
      - { field: skipped_questions, label: Skipped optional questions, type: text }
  - id: public_survey_next_question
    type: server_form
    permission: surveys.public
    title: Advance public survey question
    action: surveys.public.next_question
    handler: yaml_mutation
    mutation:
      operation: update
      table: survey_responses
      fields: [current_question_id, question_order, navigation_key]
      required: [current_question_id, navigation_key]
      concurrency: false
      guards:
        - { query: "SELECT id FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND state = 'In Progress' AND current_question_id = :expected_question_id", status: 409, code: SURVEY_PUBLIC_NEXT_STALE, message: This survey question changed before navigation. Reload before continuing. }
        - { query: "SELECT id FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND (deadline IS NULL OR deadline > CURRENT_TIMESTAMP)", status: 410, code: SURVEY_PUBLIC_RESPONSE_EXPIRED, message: This survey response has expired }
        - { query: "SELECT 1 AS ok FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND (COALESCE(s.is_time_limited, false) = false OR r.start_datetime IS NULL OR CURRENT_TIMESTAMP < r.start_datetime + s.time_limit * INTERVAL '1 minute')", status: 410, code: SURVEY_PUBLIC_TIME_LIMIT_EXPIRED, message: "This survey's time limit has expired." }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND COALESCE(s.questions_selection, 'all') = 'random' AND POSITION('|' || :expected_question_id || '|' IN '|' || r.question_order || '|') < POSITION('|' || :current_question_id || '|' IN '|' || r.question_order || '|')) OR EXISTS (SELECT next_question.id FROM survey_questions current_question JOIN survey_questions next_question ON next_question.survey_id = current_question.survey_id AND (next_question.sequence > current_question.sequence OR (next_question.sequence = current_question.sequence AND next_question.id > current_question.id)) WHERE current_question.id = :expected_question_id AND next_question.id = :current_question_id AND current_question.survey_id = :survey_id)", status: 422, code: SURVEY_PUBLIC_NEXT_INVALID, message: The requested next question is not part of this survey. }
      result: { query: "SELECT r.id, r.access_token, r.survey_id, r.state, r.answer_data, r.current_question_id, r.question_order, r.navigation_key, q.question_text, q.question_type, q.sequence AS current_question_sequence FROM survey_responses r JOIN survey_questions q ON q.id = r.current_question_id WHERE r.id = :id" }
    fields:
      - { field: expected_question_id, label: Current question, type: text, required: true }
      - { field: current_question_id, label: Next question, type: text, required: true }
      - { field: navigation_key, label: Navigation key, type: text, required: true }
  - id: public_survey_previous_question
    type: server_form
    permission: surveys.public
    title: Return to previous public survey question
    action: surveys.public.previous_question
    handler: yaml_mutation
    mutation:
      operation: update
      table: survey_responses
      fields: [current_question_id, question_order, navigation_key]
      required: [current_question_id, navigation_key]
      concurrency: false
      guards:
        - { query: "SELECT 1 AS ok FROM surveys s JOIN survey_responses r ON r.survey_id = s.id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND COALESCE(s.users_can_go_back, false) = true", status: 409, code: SURVEY_PUBLIC_PREVIOUS_DISABLED, message: This survey does not allow returning to previous questions. }
        - { query: "SELECT id FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND state = 'In Progress' AND current_question_id = :expected_question_id", status: 409, code: SURVEY_PUBLIC_PREVIOUS_STALE, message: This survey question changed before going back. Reload before continuing. }
        - { query: "SELECT id FROM survey_responses WHERE id = :id AND survey_id = :survey_id AND access_token = :access_token AND (deadline IS NULL OR deadline > CURRENT_TIMESTAMP)", status: 410, code: SURVEY_PUBLIC_RESPONSE_EXPIRED, message: This survey response has expired }
        - { query: "SELECT 1 AS ok FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND (COALESCE(s.is_time_limited, false) = false OR r.start_datetime IS NULL OR CURRENT_TIMESTAMP < r.start_datetime + s.time_limit * INTERVAL '1 minute')", status: 410, code: SURVEY_PUBLIC_TIME_LIMIT_EXPIRED, message: "This survey's time limit has expired." }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM survey_responses r JOIN surveys s ON s.id = r.survey_id WHERE r.id = :id AND r.survey_id = :survey_id AND r.access_token = :access_token AND COALESCE(s.questions_selection, 'all') = 'random' AND POSITION('|' || :expected_question_id || '|' IN '|' || r.question_order || '|') > POSITION('|' || :current_question_id || '|' IN '|' || r.question_order || '|')) OR EXISTS (SELECT previous_question.id FROM survey_questions current_question JOIN survey_questions previous_question ON previous_question.survey_id = current_question.survey_id AND (previous_question.sequence < current_question.sequence OR (previous_question.sequence = current_question.sequence AND previous_question.id < current_question.id)) WHERE current_question.id = :expected_question_id AND previous_question.id = :current_question_id AND current_question.survey_id = :survey_id)", status: 422, code: SURVEY_PUBLIC_PREVIOUS_INVALID, message: The requested previous question is not part of this survey. }
      result: { query: "SELECT r.id, r.access_token, r.survey_id, r.state, r.answer_data, r.current_question_id, r.question_order, r.navigation_key, q.question_text, q.question_type, q.sequence AS current_question_sequence FROM survey_responses r JOIN survey_questions q ON q.id = r.current_question_id WHERE r.id = :id" }
    fields:
      - { field: expected_question_id, label: Current question, type: text, required: true }
      - { field: current_question_id, label: Previous question, type: text, required: true }
      - { field: navigation_key, label: Navigation key, type: text, required: true }
  - id: public_survey_retry
    type: server_form
    permission: surveys.public
    title: Retry public survey response
    action: surveys.public.retry
    handler: yaml_mutation
    mutation:
      operation: insert
      table: survey_responses
      fields: [survey_id, survey_name, respondent_name, respondent_email, language_code, answer_data, access_token, current_question_id, question_order, test_entry, idempotency_key, start_datetime]
      required: [id, survey_id, survey_name, answer_data, access_token]
      defaults: { state: In Progress, submitted_at: '2026-01-15 09:30:00', test_entry: false }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :survey_id AND access_token = :survey_token AND state = 'Published'", status: 404, code: SURVEY_PUBLIC_RETRY_UNAVAILABLE, message: This survey is no longer available for another attempt. }
        - { query: "SELECT id FROM survey_responses WHERE id = :source_id AND survey_id = :survey_id AND access_token = :source_access_token AND state = 'Submitted'", status: 409, code: SURVEY_PUBLIC_RETRY_SOURCE_STATE, message: Only a submitted survey response can be retried. }
        - { query: "SELECT 1 AS ok FROM surveys s WHERE s.id = :survey_id AND (COALESCE(s.is_attempts_limited, false) = false OR (s.access_mode = 'public' AND COALESCE(s.users_login_required, false) = false) OR (SELECT COUNT(*) FROM survey_responses r WHERE r.survey_id = s.id AND r.state = 'Submitted' AND COALESCE(r.test_entry, false) = false AND LOWER(TRIM(COALESCE(r.respondent_email, ''))) = LOWER(TRIM(COALESCE(CAST(:respondent_email AS VARCHAR), '')))) < COALESCE(s.attempts_limit, 1))", status: 409, code: SURVEY_PUBLIC_ATTEMPTS_EXHAUSTED, message: You have no attempts left for this survey. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM survey_responses WHERE access_token = :access_token)", status: 409, code: SURVEY_PUBLIC_RETRY_TOKEN_EXISTS, message: This retry attempt already exists. }
      result: { query: "SELECT id, access_token, survey_id, state, answer_data, current_question_id, question_order, respondent_name, respondent_email, language_code, COALESCE(test_entry, false) AS test_entry, idempotency_key, CAST(start_datetime AS VARCHAR) AS start_datetime FROM survey_responses WHERE id = :id" }
    fields:
      - { field: source_id, label: Submitted response, type: text, required: true }
      - { field: source_access_token, label: Response token, type: text, required: true }
      - { field: survey_token, label: Survey token, type: text, required: true }
      - { field: id, label: Retry response ID, type: text, required: true }
      - { field: survey_id, label: Survey ID, type: text, required: true }
      - { field: survey_name, label: Survey, type: text, required: true }
      - { field: answer_data, label: Answers, type: text, required: true }
      - { field: access_token, label: Retry token, type: text, required: true }
      - { field: question_order, label: Persisted question order, type: text }
      - { field: respondent_name, label: Respondent, type: text }
      - { field: respondent_email, label: Email, type: text }
      - { field: language_code, label: Respondent language, type: text }
      - { field: idempotency_key, label: Idempotency key, type: text }
