page: { id: survey-questions }
datasources:
  - id: survey_questions_catalog
    permission: surveys.read
    query: "SELECT q.id, q.question_text, q.question_type, q.sequence, q.required, q.answer_options, s.title AS survey_name FROM survey_questions q JOIN surveys s ON s.id = q.survey_id WHERE (:q IS NULL OR q.question_text ILIKE '%' || :q || '%' OR s.title ILIKE '%' || :q || '%') ORDER BY s.title, q.sequence, q.id"
