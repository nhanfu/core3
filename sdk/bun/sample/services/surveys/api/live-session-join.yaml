page: { id: survey-live-session-join }
# The public renderer calls the paired `survey.public.session.poll` operation
# through `/api/public/surveys/session/<code>/poll`; its durable poll_revision
# is the live-session row_version, and the attendee token remains mandatory.
# Odoo's attendee form exposes the current question timer from the host's
# question start timestamp. The browser display is advisory; the answer
# mutation below repeats the expiry guard against durable session state.
datasources:
  - id: survey_live_session_join
    single: true
    permission: surveys.read
    error_states: { transport_error: { status: 503, code: SURVEY_LIVE_SESSION_JOIN_UNAVAILABLE, message: Live session access is temporarily unavailable. } }
    query: "SELECT ls.session_code AS id, ls.session_code, ls.id AS session_id, ls.survey_id, ls.survey_name, ls.state AS session_state, ls.session_link, CAST(ls.question_started_at AS VARCHAR) AS question_started_at, COALESCE(ls.current_question_text, 'Waiting for the host to start the first question') AS current_question_text, CASE WHEN ls.state = 'In Progress' THEN 'Join now' WHEN ls.state = 'Ready' THEN 'Waiting for host' ELSE 'Unavailable' END AS join_state, COALESCE(attendee.attendee_name, '') AS attendee_name, attendee.attendee_token, q.id AS question_id, q.question_type, q.answer_options, COALESCE(q.is_time_limited, false) AS is_time_limited, q.time_limit, COALESCE(s.session_speed_rating, false) AS speed_rating, COALESCE(s.session_speed_rating_time_limit, 0) AS speed_rating_time_limit, COALESCE(existing_answer.answer_value, '') AS answer_value, CASE WHEN existing_answer.id IS NULL THEN 'Not answered' ELSE 'Answered' END AS answer_state FROM survey_live_sessions ls JOIN surveys s ON s.id = ls.survey_id LEFT JOIN survey_live_attendees attendee ON attendee.session_id = ls.id AND attendee.attendee_token = COALESCE(:attendee_token, '') LEFT JOIN survey_questions q ON q.id = ls.current_question_id LEFT JOIN survey_live_session_answers existing_answer ON existing_answer.session_id = ls.id AND existing_answer.attendee_id = attendee.id AND existing_answer.question_id = ls.current_question_id WHERE ls.session_code = :id AND COALESCE(s.title, '') NOT ILIKE '%certification%'"
actions:
  - id: join_live_session_public
    type: server
    permission: surveys.public
    action: surveys.sessions.join
    handler: yaml_mutation
    operation: insert
    mutation:
      operation: insert
      table: survey_live_attendees
      fields: [session_id, attendee_name, attendee_token, join_key, state, row_version, joined_at]
      required: [session_id, attendee_name, attendee_token]
      generated: [id]
      defaults: { row_version: 1, joined_at: '2026-01-15 10:01:00' }
      before_steps:
        - query: "SELECT ls.id AS session_id, 'live-attendee-' || regexp_replace(lower(trim(CAST(:attendee_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-' || ls.session_code AS id, 'live-token-' || regexp_replace(lower(trim(CAST(:attendee_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-' || ls.session_code AS attendee_token, 'session' || chr(58) || ls.id || chr(58) || 'name' || chr(58) || regexp_replace(lower(trim(CAST(:attendee_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS join_key, CASE WHEN ls.state = 'Ready' THEN 'Waiting' ELSE 'In Progress' END AS state FROM survey_live_sessions ls JOIN surveys s ON s.id = ls.survey_id WHERE ls.session_code = :session_code AND COALESCE(s.title, '') NOT ILIKE '%certification%' LIMIT 1"
          assign: true
      guards:
        - { query: "SELECT ls.id FROM survey_live_sessions ls JOIN surveys s ON s.id = ls.survey_id WHERE ls.session_code = :session_code AND ls.state IN ('Ready', 'In Progress') AND COALESCE(s.title, '') NOT ILIKE '%certification%'", status: 404, code: SURVEY_SESSION_NOT_FOUND, message: The live session is unavailable. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:attendee_name AS VARCHAR))) BETWEEN 1 AND 120", status: 422, code: SURVEY_SESSION_ATTENDEE_NAME_REQUIRED, message: Enter a name to join the live session. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM survey_live_attendees WHERE join_key = 'session' || chr(58) || (SELECT id FROM survey_live_sessions WHERE session_code = :session_code LIMIT 1) || chr(58) || 'name' || chr(58) || regexp_replace(lower(trim(CAST(:attendee_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g'))", status: 409, code: SURVEY_SESSION_ATTENDEE_ALREADY_JOINED, message: This attendee has already joined the live session. }
      result: { query: "SELECT id, session_id, attendee_name, attendee_token, join_key, state, row_version, CAST(joined_at AS VARCHAR) AS joined_at FROM survey_live_attendees WHERE id = :id" }
  - id: submit_live_session_answer_public
    type: server
    permission: surveys.public
    action: surveys.sessions.answer
    handler: yaml_mutation
    operation: insert
    mutation:
      operation: insert
      table: survey_live_session_answers
      fields: [session_id, attendee_id, question_id, answer_type, answer_value, score, submitted_at]
      required: [session_id, attendee_id, question_id, answer_value]
      generated: [id]
      defaults: { submitted_at: '2026-01-15 10:07:00' }
      before_steps:
        - query: "WITH raw AS (SELECT ls.id AS session_id, a.id AS attendee_id, q.id AS question_id, 'live-answer-' || a.id || '-' || q.id AS id, CASE WHEN q.question_type IN ('Choice', 'Multiple Choice', 'Rating') THEN 'choice' WHEN q.question_type IN ('Numerical', 'Number') THEN 'number' ELSE 'text' END AS answer_type, COALESCE((SELECT sv.score FROM survey_suggested_values sv WHERE sv.question_id = q.id AND sv.value = TRIM(CAST(:answer_value AS VARCHAR)) LIMIT 1), CASE WHEN q.question_type = 'Rating' THEN CAST(TRIM(CAST(:answer_value AS VARCHAR)) AS DECIMAL(8,2)) * 20 ELSE 0 END) AS base_score, COALESCE(s.session_speed_rating, false) AS speed_rating, COALESCE(s.session_speed_rating_time_limit, 0) AS speed_limit, COALESCE(q.is_time_limited, false) AS question_time_limited, q.time_limit, ls.question_started_at FROM survey_live_sessions ls JOIN surveys s ON s.id = ls.survey_id JOIN survey_live_attendees a ON a.session_id = ls.id AND a.attendee_token = :attendee_token JOIN survey_questions q ON q.id = ls.current_question_id WHERE ls.session_code = :session_code AND ls.state = 'In Progress' LIMIT 1) SELECT session_id, attendee_id, question_id, id, answer_type, CASE WHEN speed_rating AND question_time_limited AND speed_limit > 0 AND question_started_at IS NOT NULL AND base_score > 0 THEN CASE WHEN EXTRACT(EPOCH FROM (TRY_CAST(:submitted_at AS TIMESTAMP) - question_started_at)) < 2 THEN base_score ELSE ROUND(base_score * (0.5 + 0.5 * GREATEST(0, LEAST(1, (speed_limit - EXTRACT(EPOCH FROM (TRY_CAST(:submitted_at AS TIMESTAMP) - question_started_at))) / speed_limit))), 2) END ELSE base_score END AS score FROM raw"
          assign: true
      guards:
        - { query: "SELECT ls.id FROM survey_live_sessions ls WHERE ls.session_code = :session_code AND ls.state = 'In Progress' AND ls.current_question_id IS NOT NULL", status: 409, code: SURVEY_SESSION_NOT_IN_PROGRESS, message: The live session is not accepting answers. Wait for the host to start the current question. }
        - { query: "SELECT a.id FROM survey_live_attendees a JOIN survey_live_sessions ls ON ls.id = a.session_id WHERE ls.session_code = :session_code AND a.attendee_token = :attendee_token", status: 404, code: SURVEY_SESSION_ATTENDEE_NOT_FOUND, message: This attendee session is no longer available. Rejoin the live session. }
        - { query: "SELECT ls.id FROM survey_live_sessions ls JOIN survey_questions q ON q.id = ls.current_question_id WHERE ls.session_code = :session_code AND (COALESCE(q.is_time_limited, false) = false OR ls.question_started_at IS NULL OR q.time_limit IS NULL OR COALESCE(TRY_CAST(:submitted_at AS TIMESTAMP), CURRENT_TIMESTAMP) < ls.question_started_at + q.time_limit * INTERVAL '1 second')", status: 409, code: SURVEY_SESSION_QUESTION_TIME_EXPIRED, message: "Sorry, you have not been fast enough. Wait for the host to start the next question." }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:answer_value AS VARCHAR))) BETWEEN 1 AND 2000", status: 422, code: SURVEY_SESSION_ANSWER_REQUIRED, message: Select or enter an answer before submitting. }
        - { query: "SELECT 1 AS ok FROM survey_live_sessions ls JOIN survey_questions q ON q.id = ls.current_question_id WHERE ls.session_code = :session_code AND (COALESCE(q.answer_options, '') = '' OR STRPOS(',' || q.answer_options || ',', ',' || TRIM(CAST(:answer_value AS VARCHAR)) || ',') > 0) LIMIT 1", status: 422, code: SURVEY_SESSION_ANSWER_INVALID, message: That answer is not available for the current question. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM survey_live_session_answers existing JOIN survey_live_attendees a ON a.id = existing.attendee_id JOIN survey_live_sessions ls ON ls.id = existing.session_id WHERE ls.session_code = :session_code AND a.attendee_token = :attendee_token AND existing.question_id = ls.current_question_id)", status: 409, code: SURVEY_SESSION_ANSWER_ALREADY_SUBMITTED, message: This answer was already submitted for the current question. }
      steps:
        - { query: "UPDATE survey_live_attendees SET score = score + COALESCE(:score, 0), row_version = row_version + 1 WHERE id = :attendee_id", expect_changed: true, status: 409, code: SURVEY_SESSION_ATTENDEE_CHANGED, message: The attendee changed before the answer was recorded. Reload the session and try again. }
        - { query: "UPDATE survey_live_sessions SET answer_count = answer_count + 1, question_answer_count = question_answer_count + 1, updated_at = TIMESTAMP '2026-01-15 10:07:00' WHERE id = :session_id AND state = 'In Progress' AND current_question_id = :question_id", expect_changed: true, status: 409, code: SURVEY_SESSION_CHANGED, message: The live session changed before the answer was recorded. Reload the session and try again. }
      result: { query: "SELECT id, session_id, attendee_id, question_id, answer_type, answer_value, score, CAST(submitted_at AS VARCHAR) AS submitted_at FROM survey_live_session_answers WHERE id = :id" }
