page: { id: survey-suggested-values }
datasources:
  - id: survey_suggested_values
    permission: surveys.read
    query: "SELECT sv.id, sv.row_version, sv.updated_at, sv.question_id, sv.question_text, q.question_type, q.row_version AS question_row_version, q.survey_id, s.row_version AS survey_row_version, sv.value, sv.sequence, sv.score, sv.matrix_row, sv.matrix_column FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id JOIN surveys s ON s.id = q.survey_id WHERE (:q IS NULL OR sv.question_text ILIKE '%' || :q || '%' OR sv.value ILIKE '%' || :q || '%') ORDER BY sv.question_text, sv.sequence, sv.id"
  - id: survey_question_options
    permission: surveys.read
    query: "SELECT id AS value, question_text AS label FROM survey_questions ORDER BY question_text, id"
actions:
  - id: edit_survey_suggested_value
    type: server_form
    permission: surveys.write
    title: Edit Suggested Value
    action: surveys.suggested_values.update
    handler: yaml_mutation
    operation: update
    params:
      id: '{row.id}'
      expected_row_version: '{row.row_version}'
      expected_question_row_version: '{row.question_row_version}'
      expected_survey_row_version: '{row.survey_row_version}'
    prefill: row
    refresh: [survey_suggested_values]
    fields:
      - { field: value, label: Suggested value, type: text, required: true }
      - { field: sequence, label: Sequence, type: number, required: true }
      - { field: score, label: Score, type: number, required: true }
      - { field: matrix_row, label: Matrix row, type: text }
      - { field: matrix_column, label: Matrix column, type: text }
    mutation:
      before_steps:
        - query: "SELECT q.survey_id AS survey_id FROM survey_questions q JOIN survey_suggested_values sv ON sv.question_id = q.id WHERE sv.id = :id"
          assign: true
      guards:
        - { query: "SELECT sv.id FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id JOIN surveys s ON s.id = q.survey_id WHERE sv.id = :id", status: 404, code: SURVEY_SUGGESTED_VALUE_NOT_FOUND, message: Suggested value not found. }
        - { query: "SELECT s.id FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id JOIN surveys s ON s.id = q.survey_id WHERE sv.id = :id AND s.state <> 'Archived' AND s.row_version = :expected_survey_row_version", status: 409, code: SURVEY_SUGGESTED_VALUE_PARENT_CHANGED, message: This survey changed or is archived. Reload before editing the suggested value. }
        - { query: "SELECT q.id FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id WHERE sv.id = :id AND q.row_version = :expected_question_row_version", status: 409, code: SURVEY_SUGGESTED_VALUE_QUESTION_CHANGED, message: This question changed before the suggested value was saved. Reload it and try again. }
        - { query: "SELECT id FROM survey_suggested_values WHERE id = :id AND row_version = :expected_row_version", status: 409, code: SURVEY_SUGGESTED_VALUE_STALE, message: This suggested value changed before it was saved. Reload it and try again. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_SUGGESTED_VALUE_ACTOR_REQUIRED, message: An authenticated survey actor is required to edit a suggested value. }
        - { query: "SELECT 1 AS ok FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id WHERE sv.id = :id AND q.question_type IN ('Choice', 'Multiple Choice', 'Matrix')", status: 409, code: SURVEY_SUGGESTED_VALUE_TYPE_INVALID, message: Suggested values can only be edited for choice or matrix questions. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(CAST(:value AS VARCHAR), ''))) BETWEEN 1 AND 90", status: 422, code: SURVEY_SUGGESTED_VALUE_INVALID, message: Suggested value must be between 1 and 90 characters. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:sequence AS INTEGER) BETWEEN 1 AND 100000", status: 422, code: SURVEY_SUGGESTED_VALUE_SEQUENCE_INVALID, message: Sequence must be a positive integer. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:score AS DECIMAL(8,2)) IS NOT NULL", status: 422, code: SURVEY_SUGGESTED_VALUE_SCORE_INVALID, message: Score must be a number. }
      steps:
        - { query: "UPDATE survey_suggested_values SET value = TRIM(CAST(:value AS VARCHAR)), sequence = CAST(:sequence AS INTEGER), score = CAST(:score AS DECIMAL(8,2)), matrix_row = NULLIF(TRIM(CAST(:matrix_row AS VARCHAR)), ''), matrix_column = NULLIF(TRIM(CAST(:matrix_column AS VARCHAR)), ''), updated_at = TIMESTAMP '2026-01-15 09:00:00', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_SUGGESTED_VALUE_STALE, message: This suggested value changed before it was saved. Reload it and try again. }
        - { query: "UPDATE survey_questions SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :question_id AND row_version = :expected_question_row_version", expect_changed: true, status: 409, code: SURVEY_SUGGESTED_VALUE_QUESTION_CHANGED, message: This question changed while the suggested value was being edited. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :survey_id AND row_version = :expected_survey_row_version", expect_changed: true, status: 409, code: SURVEY_SUGGESTED_VALUE_PARENT_CHANGED, message: This survey changed while the suggested value was being edited. }
      result:
        query: "SELECT sv.id, sv.row_version, sv.updated_at, sv.question_id, sv.question_text, q.question_type, q.row_version AS question_row_version, q.survey_id, s.row_version AS survey_row_version, sv.value, sv.sequence, sv.score, sv.matrix_row, sv.matrix_column FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id JOIN surveys s ON s.id = q.survey_id WHERE sv.id = :id"
  - id: delete_survey_suggested_value
    type: server
    permission: surveys.write
    action: surveys.suggested_values.delete
    handler: yaml_mutation
    operation: delete
    params:
      id: '{row.id}'
      expected_row_version: '{row.row_version}'
      expected_question_row_version: '{row.question_row_version}'
      expected_survey_row_version: '{row.survey_row_version}'
    refresh: [survey_suggested_values]
    mutation:
      before_steps:
        - query: "SELECT sv.question_id AS question_id, q.survey_id AS survey_id FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id WHERE sv.id = :id"
          assign: true
      guards:
        - { query: "SELECT sv.id FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id JOIN surveys s ON s.id = q.survey_id WHERE sv.id = :id", status: 404, code: SURVEY_SUGGESTED_VALUE_DELETE_NOT_FOUND, message: Suggested value not found. }
        - { query: "SELECT s.id FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id JOIN surveys s ON s.id = q.survey_id WHERE sv.id = :id AND s.state <> 'Archived' AND s.row_version = :expected_survey_row_version", status: 409, code: SURVEY_SUGGESTED_VALUE_DELETE_PARENT_CHANGED, message: This survey changed or is archived. Reload before deleting the suggested value. }
        - { query: "SELECT q.id FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id WHERE sv.id = :id AND q.row_version = :expected_question_row_version", status: 409, code: SURVEY_SUGGESTED_VALUE_DELETE_QUESTION_CHANGED, message: This question changed before the suggested value could be deleted. Reload it and try again. }
        - { query: "SELECT id FROM survey_suggested_values WHERE id = :id AND row_version = :expected_row_version", status: 409, code: SURVEY_SUGGESTED_VALUE_DELETE_STALE, message: This suggested value changed or was removed. Reload it and try again. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_SUGGESTED_VALUE_DELETE_ACTOR_REQUIRED, message: An authenticated survey actor is required to delete a suggested value. }
        - { query: "SELECT 1 AS ok FROM survey_suggested_values sv JOIN survey_questions q ON q.id = sv.question_id WHERE sv.id = :id AND q.question_type IN ('Choice', 'Multiple Choice', 'Matrix')", status: 409, code: SURVEY_SUGGESTED_VALUE_DELETE_TYPE_INVALID, message: Suggested values can only be deleted from choice or matrix questions. }
      steps:
        - { query: "DELETE FROM survey_suggested_values WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_SUGGESTED_VALUE_DELETE_STALE, message: This suggested value changed or was removed. Reload it and try again. }
        - { query: "UPDATE survey_questions SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :question_id AND row_version = :expected_question_row_version", expect_changed: true, status: 409, code: SURVEY_SUGGESTED_VALUE_DELETE_QUESTION_CHANGED, message: This question changed while the suggested value was being deleted. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :survey_id AND row_version = :expected_survey_row_version", expect_changed: true, status: 409, code: SURVEY_SUGGESTED_VALUE_DELETE_PARENT_CHANGED, message: This survey changed while the suggested value was being deleted. }
      result: { query: "SELECT true AS deleted, :id AS id" }
