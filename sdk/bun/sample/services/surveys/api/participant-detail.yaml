page: { id: survey-participant-detail }
datasources:
  - id: survey_participant_detail
    single: true
    permission: surveys.read
    query: "SELECT id, row_version, survey_id, survey_name, contact, email, attempt_no, CAST(deadline AS VARCHAR) AS deadline, quiz_passed, score, state, CAST(created_at AS VARCHAR) AS created_at FROM survey_participants WHERE id = :id"
  - id: participant_answer_lines
    permission: surveys.read
    query: "SELECT id, question_text, answer_type, answer_value, CASE WHEN skipped THEN 'Skipped' ELSE 'Answered' END AS skipped, score, CAST(submitted_at AS VARCHAR) AS submitted_at FROM survey_detailed_answers WHERE participant_id = :id ORDER BY submitted_at, id"
