        - { query: "SELECT id FROM survey_restricted_users WHERE id = :line_id AND survey_id = :id AND row_version = :expected_row_version", status: 409, code: SURVEY_RESTRICTION_STALE, message: This restricted user entry changed or was removed. Reload before deleting it. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_RESTRICTION_ACTOR_REQUIRED, message: An authenticated survey actor is required to change restricted users. }
      steps:
        - { query: "DELETE FROM survey_restricted_users WHERE id = :line_id AND survey_id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_RESTRICTION_STALE, message: This restricted user entry changed or was removed. Reload before deleting it. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: SURVEY_RESTRICTION_PARENT_CHANGED, message: This survey changed while access was being updated. Reload before retrying. }
      result: { query: "SELECT true AS deleted, :line_id AS id" }
  - id: add_survey_question
    type: server_form
    permission: surveys.write
    title: Add a question
    action: surveys.questions.create_inline
    handler: line_item
    operation: create
    domain: survey_detail
    params: { id: '{state.id}' }
    refresh: [survey_detail, survey_questions]
    mutation:
      generated: [question_id]
      before_steps:
        - query: |
            SELECT
              CAST(COALESCE(NULLIF(CAST(:question_id AS VARCHAR), ''), CAST(gen_random_uuid() AS VARCHAR)) AS VARCHAR) AS question_id,
              COALESCE(MAX(sequence), 0) + 1 AS next_sequence
            FROM survey_questions
            WHERE survey_id = :id
          assign: true
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :parent_expected_row_version", status: 409, code: SURVEY_QUESTION_PARENT_CHANGED, message: This survey changed or is archived. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(CAST(:question_text AS VARCHAR), ''))) > 0", status: 422, code: SURVEY_QUESTION_TITLE_REQUIRED, message: A question title is required. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:question_type AS VARCHAR), 'Text') IN ('Text', 'Choice', 'Multiple Choice', 'Rating', 'Numerical')", status: 422, code: SURVEY_QUESTION_TYPE_INVALID, message: Select a supported question type. }
      steps:
        - { query: "INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options, is_page) VALUES(:question_id, :id, TRIM(:question_text), COALESCE(NULLIF(TRIM(CAST(:question_type AS VARCHAR)), ''), 'Text'), CAST(:next_sequence AS INTEGER), COALESCE(CAST(:required AS BOOLEAN), false), COALESCE(CAST(:answer_options AS VARCHAR), ''), false)", expect_changed: true, status: 409, code: SURVEY_QUESTION_CREATE_FAILED, message: The question could not be added. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: SURVEY_QUESTION_PARENT_CHANGED, message: This survey changed while the question was being added. Reload and try again. }
      result: { query: "SELECT * FROM survey_questions WHERE id = :question_id" }
    fields:
      - { field: question_text, label: Question, type: text, required: true, placeholder: 'e.g. How did you hear about us?' }
      - { field: question_type, label: Type, type: select, default: Text, options: [{ value: Text, label: Text }, { value: Choice, label: Choice }, { value: Multiple Choice, label: Multiple Choice }, { value: Rating, label: Rating }, { value: Numerical, label: Numerical }] }
      - { field: required, label: Required, type: checkbox, default: false }
      - { field: answer_options, label: Suggested Answers, type: text, placeholder: 'e.g. Email,Phone,Chat' }
  - id: add_survey_section
    type: server_form
    permission: surveys.write
    title: Add a section
    action: surveys.questions.add_section
    handler: line_item
    operation: create
    params: { id: '{state.id}' }
    refresh: [survey_detail, survey_questions]
    mutation:
      generated: [line_id]
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :parent_expected_row_version", status: 409, code: SURVEY_SECTION_PARENT_CHANGED, message: This survey changed or is archived. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(CAST(:question_text AS VARCHAR), ''))) > 0", status: 422, code: SURVEY_SECTION_TITLE_REQUIRED, message: A section title is required. }
      before_steps:
        - { query: "SELECT COALESCE(MAX(sequence), 0) + 1 AS next_sequence, :id || '-section-' || CAST(COALESCE(MAX(sequence), 0) + 1 AS VARCHAR) AS line_id FROM survey_questions WHERE survey_id = :id", assign: true }
      steps:
        - { query: "INSERT INTO survey_questions(id, survey_id, question_text, question_type, sequence, required, answer_options, is_page) VALUES(:line_id, :id, :question_text, 'Section', :next_sequence, false, '', true)", expect_changed: true, status: 409, code: SURVEY_SECTION_CREATE_FAILED, message: The section could not be added. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: SURVEY_SECTION_PARENT_CHANGED, message: This survey changed before the section was added. Reload and try again. }
      result: { query: "SELECT * FROM survey_questions WHERE id = :line_id" }
    fields:
      - { field: question_text, label: Section title, type: text, required: true, placeholder: 'e.g. About you' }
  - id: reorder_survey_question
    type: server_form
    permission: surveys.write
    title: Reorder question or section
    action: surveys.questions.reorder
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', expected_row_version: '{state.survey_detail.row_version}' }
    refresh: [survey_detail, survey_questions]
    fields:
      - { field: question_id, label: Question or section ID, type: text, required: true }
      - { field: new_sequence, label: New position, type: number, required: true, min: 1 }
    mutation:
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id", status: 404, code: SURVEY_QUESTION_REORDER_NOT_FOUND, message: Survey not found. }
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :expected_row_version", status: 409, code: SURVEY_QUESTION_REORDER_PARENT_CHANGED, message: This survey changed or is archived. Reload before reordering questions. }
        - { query: "SELECT id FROM survey_questions WHERE id = :question_id AND survey_id = :id", status: 404, code: SURVEY_QUESTION_REORDER_LINE_NOT_FOUND, message: Question or section not found in this survey. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_QUESTION_REORDER_ACTOR_REQUIRED, message: An authenticated survey actor is required to reorder questions. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:new_sequence AS INTEGER) BETWEEN 1 AND (SELECT COUNT(*) FROM survey_questions WHERE survey_id = :id)", status: 422, code: SURVEY_QUESTION_REORDER_SEQUENCE_INVALID, message: Choose a position within the survey question order. }
      steps:
        - query: |
            UPDATE survey_questions AS question
            SET sequence = ordered.new_sequence
            FROM (
              SELECT id,
                ROW_NUMBER() OVER (
                  ORDER BY CASE
                    WHEN id = :question_id THEN CAST(:new_sequence AS INTEGER)
                    WHEN CAST(:new_sequence AS INTEGER) < (SELECT sequence FROM survey_questions WHERE id = :question_id)
                      AND sequence >= CAST(:new_sequence AS INTEGER)
                      AND sequence < (SELECT sequence FROM survey_questions WHERE id = :question_id) THEN sequence + 1
                    WHEN CAST(:new_sequence AS INTEGER) > (SELECT sequence FROM survey_questions WHERE id = :question_id)
                      AND sequence > (SELECT sequence FROM survey_questions WHERE id = :question_id)
                      AND sequence <= CAST(:new_sequence AS INTEGER) THEN sequence - 1
                    ELSE sequence
                  END, id
                ) AS new_sequence
              FROM survey_questions
              WHERE survey_id = :id
            ) AS ordered
            WHERE question.id = ordered.id AND question.survey_id = :id
          expect_changed: true
          status: 409
          code: SURVEY_QUESTION_REORDER_FAILED
          message: The question order could not be saved.
        - query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: SURVEY_QUESTION_REORDER_PARENT_CHANGED
          message: This survey changed while its questions were being reordered. Reload and try again.
      result: { query: "SELECT id, survey_id, question_text, question_type, sequence, is_page FROM survey_questions WHERE survey_id = :id ORDER BY sequence, id" }
  - id: configure_survey_section_random_count
    type: server_form
    permission: surveys.write
    title: Configure random questions for section
    action: surveys.sections.random_count.update
    handler: yaml_mutation
    operation: update
    params:
      id: '{row.id}'
      survey_id: '{row.survey_id}'
      expected_row_version: '{row.row_version}'
      expected_survey_row_version: '{row.survey_row_version}'
    refresh: [survey_detail, survey_questions, surveys]
    fields:
      - { field: random_questions_count, label: Questions randomly picked, type: number, required: true, min: 0 }
    mutation:
      guards:
        - { query: "SELECT q.id FROM survey_questions q JOIN surveys s ON s.id = q.survey_id WHERE q.id = :id AND q.survey_id = :survey_id", status: 404, code: SURVEY_SECTION_RANDOM_NOT_FOUND, message: Section not found. }
        - { query: "SELECT q.id FROM survey_questions q WHERE q.id = :id AND q.survey_id = :survey_id AND COALESCE(q.is_page, false) = true", status: 409, code: SURVEY_SECTION_RANDOM_NOT_SECTION, message: Random question counts can only be configured on sections. }
        - { query: "SELECT s.id FROM survey_questions q JOIN surveys s ON s.id = q.survey_id WHERE q.id = :id AND s.state <> 'Archived' AND s.row_version = :expected_survey_row_version", status: 409, code: SURVEY_SECTION_RANDOM_PARENT_CHANGED, message: This survey changed or is archived. Reload before changing section randomization. }
        - { query: "SELECT q.id FROM survey_questions q WHERE q.id = :id AND q.row_version = :expected_row_version", status: 409, code: SURVEY_SECTION_RANDOM_STALE, message: This section changed before its random count could be saved. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_SECTION_RANDOM_ACTOR_REQUIRED, message: An authenticated survey actor is required to configure section randomization. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:random_questions_count AS INTEGER) BETWEEN 0 AND 100", status: 422, code: SURVEY_SECTION_RANDOM_COUNT_INVALID, message: Choose a random question count between 0 and 100. }
      steps:
        - { query: "UPDATE survey_questions SET random_questions_count = CAST(:random_questions_count AS INTEGER), row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND survey_id = :survey_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_SECTION_RANDOM_STALE, message: This section changed before its random count could be saved. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :survey_id AND row_version = :expected_survey_row_version", expect_changed: true, status: 409, code: SURVEY_SECTION_RANDOM_PARENT_CHANGED, message: This survey changed while its section randomization was being saved. }
      result: { query: "SELECT q.id, q.survey_id, q.random_questions_count, q.row_version, s.row_version AS survey_row_version FROM survey_questions q JOIN surveys s ON s.id = q.survey_id WHERE q.id = :id" }
  - id: duplicate_survey
    type: server
    permission: surveys.write
    action: surveys.records.duplicate
    handler: yaml_mutation
    operation: duplicate
    mutation:
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :source_id", status: 404, code: SURVEY_DUPLICATE_NOT_FOUND, message: Survey not found. }
        - { query: "SELECT id FROM surveys WHERE id = :source_id AND state <> 'Archived'", status: 409, code: SURVEY_DUPLICATE_ARCHIVED, message: Archived surveys cannot be duplicated. }
        - { query: "SELECT id FROM surveys WHERE id = :source_id AND row_version = :expected_row_version", status: 409, code: SURVEY_DUPLICATE_STALE, message: This survey changed before it could be duplicated. Reload it and try again. }
      before_steps:
        - query: |
            SELECT
              CAST(COALESCE(NULLIF(CAST(:duplicate_id AS VARCHAR), ''), CAST(gen_random_uuid() AS VARCHAR)) AS VARCHAR) AS duplicate_id,
              CAST(COALESCE(NULLIF(CAST(:duplicate_access_token AS VARCHAR), ''), CAST(gen_random_uuid() AS VARCHAR)) AS VARCHAR) AS duplicate_access_token,
              s.name || '-COPY-' || CAST((SELECT COUNT(*) + 1 FROM surveys existing WHERE existing.name LIKE s.name || '-COPY-%') AS VARCHAR) AS duplicate_name,
              s.title || ' (copy)' AS duplicate_title
            FROM surveys s
            WHERE s.id = :source_id
          assign: true
        - query: |
            INSERT INTO surveys(
              id, name, title, description, owner, responsible_user_id, responsible_user_name, response_count, state,
              published_at, closed_at, row_version, created_at, updated_at, access_token, languages
            )
            SELECT
              :duplicate_id, :duplicate_name, :duplicate_title, s.description,
              s.owner, s.responsible_user_id, s.responsible_user_name, 0, 'Draft', NULL, NULL, 1,
              TIMESTAMP '2026-01-15 12:00:00', TIMESTAMP '2026-01-15 12:00:00',
              :duplicate_access_token, s.languages
            FROM surveys s
            WHERE s.id = :source_id
        - query: |
            INSERT INTO survey_questions(
              id, survey_id, question_text, question_type, sequence, required, answer_options
            )
            SELECT
              :duplicate_id || '-question-' || CAST(q.id AS VARCHAR),
              :duplicate_id, q.question_text, q.question_type, q.sequence,
              q.required, q.answer_options
            FROM survey_questions q
            WHERE q.survey_id = :source_id
            ORDER BY q.sequence, q.id
        - query: |
            INSERT INTO survey_suggested_values(
              id, row_version, question_id, question_text, value, sequence,
              score, matrix_row, matrix_column
            )
            SELECT
              :duplicate_id || '-answer-' || CAST(a.id AS VARCHAR), 1,
              :duplicate_id || '-question-' || CAST(a.question_id AS VARCHAR),
              a.question_text, a.value, a.sequence, a.score, a.matrix_row,
              a.matrix_column
            FROM survey_suggested_values a
            JOIN survey_questions q ON q.id = a.question_id
            WHERE q.survey_id = :source_id
            ORDER BY a.sequence, a.id
      result:
        query: "SELECT id, row_version, name, title, description, owner, response_count, access_token, state, CAST(published_at AS VARCHAR) AS published_at, CAST(closed_at AS VARCHAR) AS closed_at FROM surveys WHERE id = :duplicate_id"
  - id: delete_survey
    type: server
    permission: surveys.write
    action: surveys.records.delete
    handler: yaml_mutation
    operation: delete
    mutation:
      operation: delete
      table: surveys
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id", status: 404, code: SURVEY_DELETE_NOT_FOUND, message: Survey not found. }
        - { query: "SELECT id FROM surveys WHERE id = :id AND row_version = :expected_row_version", status: 409, code: SURVEY_DELETE_STALE, message: This survey changed before it could be deleted. Reload it and try again. }
      before_steps:
        - { query: "DELETE FROM survey_detailed_answers WHERE participant_id IN (SELECT id FROM survey_participants WHERE survey_id = :id)" }
        - { query: "DELETE FROM survey_suggested_values WHERE question_id IN (SELECT id FROM survey_questions WHERE survey_id = :id)" }
        - { query: "DELETE FROM survey_invites WHERE survey_id = :id" }
        - { query: "DELETE FROM survey_restricted_users WHERE survey_id = :id" }
        - { query: "DELETE FROM survey_responses WHERE survey_id = :id" }
        - { query: "DELETE FROM survey_participants WHERE survey_id = :id" }
        - { query: "DELETE FROM survey_live_sessions WHERE survey_id = :id" }
        - { query: "DELETE FROM survey_questions WHERE survey_id = :id" }
  - id: share_survey_detail
    type: server_form
    permission: surveys.write
    title: Share a Survey
    action: surveys.invites.send
    handler: yaml_mutation
    operation: create
    params: { id: '', survey_id: '{row.id}', survey_name: '{row.title}', survey_link: '{row.share_url}' }
    prefill: { survey_link: '{row.share_url}', subject: '{row.invite_subject}', body: '{row.invite_body}' }
    mutation:
      operation: insert
      table: survey_invites
      generated: [id]
      fields: [survey_link, send_email, recipients, additional_emails, subject, body, attachment_names, deadline, mail_template]
      required: [survey_link, send_email]
      defaults: { state: Link ready, attachment_names: '', deadline: '', mail_template: 'Survey: Invite', created_at: '2026-01-15 09:00:00' }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :survey_id AND row_version = :expected_row_version AND state <> 'Archived'", status: 409, code: SURVEY_INVITE_SURVEY_CHANGED, message: This survey changed or is archived. Reload it before sharing. }
        - { query: "SELECT id FROM surveys WHERE id = :survey_id AND access_token IS NOT NULL AND LENGTH(TRIM(access_token)) > 0", status: 422, code: SURVEY_INVITE_TOKEN_REQUIRED, message: This survey does not have a share link yet. }
        - { query: "SELECT 1 AS ok WHERE CAST(:send_email AS BOOLEAN) = FALSE OR LENGTH(TRIM(COALESCE(CAST(:recipients AS VARCHAR), ''))) > 0 OR LENGTH(TRIM(COALESCE(CAST(:additional_emails AS VARCHAR), ''))) > 0", status: 422, code: SURVEY_INVITE_RECIPIENTS_REQUIRED, message: Add at least one recipient or additional email before sending. }
        - { query: "SELECT 1 AS ok WHERE CAST(:send_email AS BOOLEAN) = FALSE OR (LENGTH(TRIM(COALESCE(CAST(:subject AS VARCHAR), ''))) > 0 AND LENGTH(TRIM(COALESCE(CAST(:body AS VARCHAR), ''))) > 0)", status: 422, code: SURVEY_INVITE_MESSAGE_REQUIRED, message: Subject and message are required when sending by email. }
      steps:
        - { query: "UPDATE survey_invites SET survey_id = :survey_id, survey_name = :survey_name, state = CASE WHEN CAST(:send_email AS BOOLEAN) THEN 'Sent' ELSE 'Link ready' END, sent_at = CASE WHEN CAST(:send_email AS BOOLEAN) THEN TIMESTAMP '2026-01-15 09:05:00' ELSE NULL END WHERE id = :id" }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :survey_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_INVITE_SURVEY_CHANGED, message: This survey changed before the share was saved. Reload it before sharing. }
      result: { query: "SELECT CASE WHEN send_email THEN 'Invitation sent' ELSE 'Survey link ready' END AS message, id, survey_id, survey_name, state, send_email, recipients, additional_emails, subject, deadline, mail_template FROM survey_invites WHERE id = :id" }
    fields:
      - { field: survey_link, label: Survey Link, type: text, required: true }
      - { field: send_email, label: Send by Email, type: checkbox, default: false }
      - { field: recipients, label: Recipients, type: text }
      - { field: additional_emails, label: Additional emails, type: textarea, placeholder: "e.g. 'Rick Sanchez' <rick_sanchez@example.com>, hictor_vugo@example.com" }
      - { field: subject, label: Subject, type: text }
      - { field: body, label: Message, type: textarea }
      - { field: attachment_names, label: Attachments, type: text }
      - { field: deadline, label: Answer deadline, type: text, placeholder: 'YYYY-MM-DD' }
      - { field: mail_template, label: Mail Template, type: select, default: 'Survey: Invite', options: [{ value: 'Survey: Invite', label: 'Survey: Invite' }] }
  - id: start_live_session_detail
    type: server
    permission: surveys.manage
    action: surveys.sessions.start
    handler: yaml_mutation
    params: { expected_session_row_version: '{row.session_row_version}' }
    result: alert
    refresh: [survey_detail]
    mutation:
      guards:
        - { query: "SELECT s.id FROM surveys s WHERE s.id = :id AND s.state IN ('Draft', 'Published') AND EXISTS (SELECT 1 FROM survey_questions q WHERE q.survey_id = s.id)", status: 409, message: Only an open survey with at least one question can start a live session. }
        - { query: "SELECT id FROM survey_live_sessions WHERE survey_id = :id AND state = 'Closed' AND row_version = :expected_session_row_version", status: 409, message: This survey already has an active live session or has changed. Reload before starting it. }
      steps:
        - { query: "UPDATE survey_live_sessions SET state = 'Ready', session_start_time = TIMESTAMP '2026-01-15 10:00:00', question_started_at = NULL, current_question_id = NULL, current_question_text = NULL, answer_count = 0, question_answer_count = 0, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:00:00' WHERE survey_id = :id AND state = 'Closed' AND row_version = :expected_session_row_version", expect_changed: true, status: 409, message: This survey already has an active live session or has changed. }
      result: { query: "SELECT 'Live session ready' AS message, state, session_code FROM survey_live_sessions WHERE survey_id = :id" }
  - id: end_live_session_detail
    type: server
    permission: surveys.manage
    action: surveys.sessions.end
    handler: yaml_mutation
    params: { id: '{row.session_id}', expected_row_version: '{row.session_row_version}' }
    result: alert
    refresh: [survey_detail]
    mutation:
      guards:
        - { query: "SELECT id FROM survey_live_sessions WHERE id = :id AND state IN ('Ready', 'In Progress') AND row_version = :expected_row_version", status: 409, message: Only an active live session can be closed. Reload before closing it. }
      steps:
        - { query: "UPDATE survey_live_sessions SET state = 'Closed', current_question_id = NULL, current_question_text = NULL, question_started_at = NULL, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:00:00' WHERE id = :id AND state IN ('Ready', 'In Progress') AND row_version = :expected_row_version", expect_changed: true, status: 409, message: Only an active live session can be closed. }
      result: { query: "SELECT 'Live session closed' AS message, state FROM survey_live_sessions WHERE id = :id" }
