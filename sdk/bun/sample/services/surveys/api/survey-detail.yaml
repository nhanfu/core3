page: { id: survey-detail }
datasources:
  - id: survey_detail
    single: true
    permission: surveys.read
    query: "SELECT s.id, s.row_version, s.name, s.title, s.description, s.owner, s.response_count, s.access_token, CASE WHEN s.access_token IS NULL OR s.access_token = '' THEN NULL ELSE '/survey/start/' || s.access_token END AS share_url, 'Participate to ' || s.title || ' survey' AS invite_subject, CASE WHEN s.title ILIKE '%certification%' THEN 'Dear participant\n\nYou have been invited to take a new certification.\n\nStart Certification\n\nWe wish you good luck!' ELSE 'Dear participant\n\nWe are conducting a survey and your response would be appreciated.\n\nStart Survey\n\nThank you in advance for your participation.' END AS invite_body, (SELECT COUNT(*) FROM survey_participants p WHERE p.survey_id = s.id) AS participant_count, (SELECT COUNT(*) FROM survey_participants p WHERE p.survey_id = s.id AND p.quiz_passed = true) AS certified_count, s.state, CAST(s.published_at AS VARCHAR) AS published_at, CAST(s.closed_at AS VARCHAR) AS closed_at, ls.id AS session_id, ls.row_version AS session_row_version, CASE WHEN ls.state IN ('Ready', 'In Progress') THEN ls.state ELSE NULL END AS session_state, ls.session_code, ls.session_link, ls.current_question_text, CAST(ls.session_start_time AS VARCHAR) AS session_start_time, ls.answer_count AS session_answer_count, ls.question_answer_count AS session_question_answer_count FROM surveys s LEFT JOIN survey_live_sessions ls ON ls.survey_id = s.id WHERE s.id = :id"
  - id: survey_questions
    permission: surveys.read
    query: "SELECT id, question_text, question_type, sequence, required, answer_options FROM survey_questions WHERE survey_id = :id ORDER BY sequence, id"
  - id: survey_responses
    permission: surveys.read
    query: "SELECT id, respondent_name, respondent_email, answer_data, state, CAST(submitted_at AS VARCHAR) AS submitted_at FROM survey_responses WHERE survey_id = :id ORDER BY submitted_at DESC, id"
actions:
  - id: share_survey_detail
    type: server_form
    permission: surveys.write
    title: Share a Survey
    action: surveys.invites.send
    handler: yaml_mutation
    operation: create
    params: { id: '', survey_id: '{row.id}', survey_name: '{row.title}', survey_link: '{row.share_url}' }
    prefill: { survey_link: '{row.share_url}', subject: '{row.invite_subject}', body: '{row.invite_body}' }
    mutation:
      operation: insert
      table: survey_invites
      generated: [id]
      fields: [survey_link, send_email, recipients, additional_emails, subject, body, attachment_names, deadline, mail_template]
      required: [survey_link, send_email]
      defaults: { state: Link ready, attachment_names: '', deadline: '', mail_template: 'Survey: Invite', created_at: '2026-01-15 09:00:00' }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :survey_id AND row_version = :expected_row_version AND state <> 'Archived'", status: 409, code: SURVEY_INVITE_SURVEY_CHANGED, message: This survey changed or is archived. Reload it before sharing. }
        - { query: "SELECT id FROM surveys WHERE id = :survey_id AND access_token IS NOT NULL AND LENGTH(TRIM(access_token)) > 0", status: 422, code: SURVEY_INVITE_TOKEN_REQUIRED, message: This survey does not have a share link yet. }
        - { query: "SELECT 1 AS ok WHERE CAST(:send_email AS BOOLEAN) = FALSE OR LENGTH(TRIM(COALESCE(CAST(:recipients AS VARCHAR), ''))) > 0 OR LENGTH(TRIM(COALESCE(CAST(:additional_emails AS VARCHAR), ''))) > 0", status: 422, code: SURVEY_INVITE_RECIPIENTS_REQUIRED, message: Add at least one recipient or additional email before sending. }
        - { query: "SELECT 1 AS ok WHERE CAST(:send_email AS BOOLEAN) = FALSE OR (LENGTH(TRIM(COALESCE(CAST(:subject AS VARCHAR), ''))) > 0 AND LENGTH(TRIM(COALESCE(CAST(:body AS VARCHAR), ''))) > 0)", status: 422, code: SURVEY_INVITE_MESSAGE_REQUIRED, message: Subject and message are required when sending by email. }
      steps:
        - { query: "UPDATE survey_invites SET survey_id = :survey_id, survey_name = :survey_name, state = CASE WHEN CAST(:send_email AS BOOLEAN) THEN 'Sent' ELSE 'Link ready' END, sent_at = CASE WHEN CAST(:send_email AS BOOLEAN) THEN TIMESTAMP '2026-01-15 09:05:00' ELSE NULL END WHERE id = :id" }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :survey_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_INVITE_SURVEY_CHANGED, message: This survey changed before the share was saved. Reload it before sharing. }
      result: { query: "SELECT CASE WHEN send_email THEN 'Invitation sent' ELSE 'Survey link ready' END AS message, id, survey_id, survey_name, state, send_email, recipients, additional_emails, subject, deadline, mail_template FROM survey_invites WHERE id = :id" }
    fields:
      - { field: survey_link, label: Survey Link, type: text, required: true }
      - { field: send_email, label: Send by Email, type: checkbox, default: false }
      - { field: recipients, label: Recipients, type: text }
      - { field: additional_emails, label: Additional emails, type: textarea, placeholder: "e.g. 'Rick Sanchez' <rick_sanchez@example.com>, hictor_vugo@example.com" }
      - { field: subject, label: Subject, type: text }
      - { field: body, label: Message, type: textarea }
      - { field: attachment_names, label: Attachments, type: text }
      - { field: deadline, label: Answer deadline, type: text, placeholder: 'YYYY-MM-DD' }
      - { field: mail_template, label: Mail Template, type: select, default: 'Survey: Invite', options: [{ value: 'Survey: Invite', label: 'Survey: Invite' }] }
  - id: start_live_session_detail
    type: server
    permission: surveys.manage
    action: surveys.sessions.start
    handler: yaml_mutation
    params: { expected_session_row_version: '{row.session_row_version}' }
    result: alert
    refresh: [survey_detail]
    mutation:
      guards:
        - { query: "SELECT s.id FROM surveys s WHERE s.id = :id AND s.state IN ('Draft', 'Published') AND EXISTS (SELECT 1 FROM survey_questions q WHERE q.survey_id = s.id)", status: 409, message: Only an open survey with at least one question can start a live session. }
        - { query: "SELECT id FROM survey_live_sessions WHERE survey_id = :id AND state = 'Closed' AND row_version = :expected_session_row_version", status: 409, message: This survey already has an active live session or has changed. Reload before starting it. }
      steps:
        - { query: "UPDATE survey_live_sessions SET state = 'Ready', session_start_time = TIMESTAMP '2026-01-15 10:00:00', question_started_at = NULL, current_question_id = NULL, current_question_text = NULL, answer_count = 0, question_answer_count = 0, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:00:00' WHERE survey_id = :id AND state = 'Closed' AND row_version = :expected_session_row_version", expect_changed: true, status: 409, message: This survey already has an active live session or has changed. }
      result: { query: "SELECT 'Live session ready' AS message, state, session_code FROM survey_live_sessions WHERE survey_id = :id" }
  - id: end_live_session_detail
    type: server
    permission: surveys.manage
    action: surveys.sessions.end
    handler: yaml_mutation
    params: { id: '{row.session_id}', expected_row_version: '{row.session_row_version}' }
    result: alert
    refresh: [survey_detail]
    mutation:
      guards:
        - { query: "SELECT id FROM survey_live_sessions WHERE id = :id AND state IN ('Ready', 'In Progress') AND row_version = :expected_row_version", status: 409, message: Only an active live session can be closed. Reload before closing it. }
      steps:
        - { query: "UPDATE survey_live_sessions SET state = 'Closed', current_question_id = NULL, current_question_text = NULL, question_started_at = NULL, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:00:00' WHERE id = :id AND state IN ('Ready', 'In Progress') AND row_version = :expected_row_version", expect_changed: true, status: 409, message: Only an active live session can be closed. }
      result: { query: "SELECT 'Live session closed' AS message, state FROM survey_live_sessions WHERE id = :id" }
