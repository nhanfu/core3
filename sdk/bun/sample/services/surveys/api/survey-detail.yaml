page: { id: survey-detail }
datasources:
  - id: survey_detail
    single: true
    permission: surveys.read
    error_states:
      unauthorized: { status: 401, code: SURVEY_DETAIL_UNAUTHORIZED, message: Sign in to view this survey. }
      forbidden: { status: 403, code: SURVEY_DETAIL_FORBIDDEN, message: You do not have permission to view this survey. }
      missing_record: { status: 404, code: SURVEY_DETAIL_NOT_FOUND, message: Survey not found. }
      transport_error: { status: 503, code: SURVEY_DETAIL_UNAVAILABLE, message: This survey is temporarily unavailable. }
    query: "SELECT s.id, s.row_version, s.name, s.title, s.description, s.owner, s.responsible_user_id, s.responsible_user_name, COALESCE((SELECT string_agg(r.user_name, '||' ORDER BY r.user_name, r.user_id) FROM survey_restricted_users r WHERE r.survey_id = s.id), '') AS restricted_user_names, s.response_count, s.access_token, COALESCE(s.access_mode, 'public') AS access_mode, COALESCE(s.questions_selection, 'all') AS questions_selection, COALESCE(s.users_login_required, false) AS users_login_required, COALESCE(s.is_attempts_limited, false) AS is_attempts_limited, COALESCE(s.attempts_limit, 1) AS attempts_limit, COALESCE(s.users_can_go_back, false) AS users_can_go_back, COALESCE(s.session_speed_rating, false) AS session_speed_rating, COALESCE(s.session_speed_rating_time_limit, 0) AS session_speed_rating_time_limit, COALESCE(s.scoring_type, 'no_scoring') AS scoring_type, COALESCE(s.scoring_success_min, 80) AS scoring_success_min, COALESCE(s.certification, false) AS certification, COALESCE(s.certification_report_layout, 'modern_purple') AS certification_report_layout, s.languages, CASE WHEN s.access_token IS NULL OR s.access_token = '' THEN NULL ELSE '/survey/start/' || s.access_token END AS share_url, 'Participate to ' || s.title || ' survey' AS invite_subject, CASE WHEN s.title ILIKE '%certification%' THEN 'Dear participant\n\nYou have been invited to take a new certification.\n\nStart Certification\n\nWe wish you good luck!' ELSE 'Dear participant\n\nWe are conducting a survey and your response would be appreciated.\n\nStart Survey\n\nThank you in advance for your participation.' END AS invite_body, (SELECT COUNT(*) FROM survey_participants p WHERE p.survey_id = s.id) AS registered_count, (SELECT COUNT(*) FROM survey_participants p WHERE p.survey_id = s.id) AS participant_count, (SELECT COUNT(*) FROM survey_participants p WHERE p.survey_id = s.id AND p.state = 'Completed') AS completed_count, (SELECT COUNT(*) FROM survey_participants p WHERE p.survey_id = s.id AND p.quiz_passed = true) AS certified_count, s.state, CAST(s.published_at AS VARCHAR) AS published_at, CAST(s.closed_at AS VARCHAR) AS closed_at, ls.id AS session_id, ls.row_version AS session_row_version, CASE WHEN ls.state IN ('Ready', 'In Progress') THEN ls.state ELSE NULL END AS session_state, ls.session_code, ls.session_link, ls.current_question_text, CAST(ls.session_start_time AS VARCHAR) AS session_start_time, ls.answer_count AS session_answer_count, ls.question_answer_count AS session_question_answer_count FROM surveys s LEFT JOIN survey_live_sessions ls ON ls.survey_id = s.id WHERE s.id = :id AND (NOT EXISTS (SELECT 1 FROM survey_restricted_users restricted WHERE restricted.survey_id = s.id) OR COALESCE(NULLIF(:current_user_id, ''), 'user-admin') IN (SELECT allowed.user_id FROM survey_restricted_users allowed WHERE allowed.survey_id = s.id))"
  - id: survey_restricted_users
    permission: surveys.read
    query: "SELECT r.id, r.survey_id, r.user_id, r.user_name, r.row_version, CAST(r.created_at AS VARCHAR) AS created_at FROM survey_restricted_users r JOIN surveys s ON s.id = r.survey_id WHERE r.survey_id = :id AND (NOT EXISTS (SELECT 1 FROM survey_restricted_users restricted WHERE restricted.survey_id = s.id) OR COALESCE(NULLIF(:current_user_id, ''), 'user-admin') IN (SELECT allowed.user_id FROM survey_restricted_users allowed WHERE allowed.survey_id = s.id)) ORDER BY r.user_name, r.user_id"
  - id: survey_questions
    permission: surveys.read
    query: "SELECT q.id, q.survey_id, q.row_version, s.row_version AS survey_row_version, q.question_text, q.question_type, q.sequence, q.required, q.answer_options, q.is_page, COALESCE(q.random_questions_count, 1) AS random_questions_count FROM survey_questions q JOIN surveys s ON s.id = q.survey_id WHERE q.survey_id = :id ORDER BY q.sequence, q.id"
  - id: survey_responses
    permission: surveys.read
    query: "SELECT id, respondent_name, respondent_email, language_code, answer_data, skipped_questions, state, CAST(submitted_at AS VARCHAR) AS submitted_at FROM survey_responses WHERE survey_id = :id ORDER BY submitted_at DESC, id"
  - id: survey_activities
    permission: surveys.read
    error_states: { transport_error: { status: 503, code: SURVEY_ACTIVITIES_UNAVAILABLE, message: Survey activities are temporarily unavailable. } }
    query: "SELECT id, row_version, survey_id, activity_type, summary, CAST(due_date AS VARCHAR) AS due_date, assigned_user_id, assigned_user_name, state, CAST(completed_at AS VARCHAR) AS completed_at, actor_name, CAST(created_at AS VARCHAR) AS created_at FROM survey_activities WHERE survey_id = :id UNION ALL SELECT id, row_version, survey_id, 'note' AS activity_type, 'Internal note' AS summary, NULL AS due_date, NULL AS assigned_user_id, NULL AS assigned_user_name, 'done' AS state, NULL AS completed_at, actor_name, CAST(created_at AS VARCHAR) AS created_at FROM survey_messages WHERE survey_id = :id ORDER BY due_date NULLS LAST, created_at DESC, id"
  - id: survey_followers
    permission: surveys.read
    error_states: { transport_error: { status: 503, code: SURVEY_FOLLOWERS_UNAVAILABLE, message: Survey followers are temporarily unavailable. } }
    query: "SELECT id, survey_id, user_id, user_name, user_email, row_version, CAST(created_at AS VARCHAR) AS created_at FROM survey_followers WHERE survey_id = :id ORDER BY user_name, user_id"
  - id: survey_follower_candidates
    permission: surveys.write
    query: "SELECT candidate.user_id AS value, candidate.user_name || ' · ' || candidate.user_email AS label FROM (VALUES ('user-demo', 'Demo Survey Officer', 'demo@core3.local'), ('user-manager', 'Survey Manager', 'manager@core3.local'), ('user-outsider', 'Outside User', 'outside@core3.local')) candidate(user_id, user_name, user_email) WHERE NOT EXISTS (SELECT 1 FROM survey_followers f WHERE f.survey_id = :id AND f.user_id = candidate.user_id) ORDER BY candidate.user_name, candidate.user_id"
actions:
  - id: add_survey_follower
    type: server_form
    permission: surveys.write
    title: Add follower
    action: surveys.followers.add
    handler: line_item
    operation: create
    domain: survey_detail
    params: { id: '{state.survey_detail.id}' }
    refresh: [survey_detail, survey_followers, survey_follower_candidates]
    fields:
      - { field: user_id, label: Follower, type: select, options_source: survey_follower_candidates, required: true }
    mutation:
      generated: [relation_id]
      before_steps:
        - query: "SELECT :id || '-follower-' || candidate.user_id AS relation_id, candidate.user_name, candidate.user_email FROM (VALUES ('user-demo', 'Demo Survey Officer', 'demo@core3.local'), ('user-manager', 'Survey Manager', 'manager@core3.local'), ('user-outsider', 'Outside User', 'outside@core3.local')) candidate(user_id, user_name, user_email) WHERE candidate.user_id = :user_id"
          assign: true
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :parent_expected_row_version", status: 409, code: SURVEY_FOLLOWER_PARENT_CHANGED, message: This survey changed or is archived. Reload before changing followers. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_FOLLOWER_ACTOR_REQUIRED, message: An authenticated survey actor is required to change followers. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:user_id, '')), '') IS NOT NULL", status: 422, code: SURVEY_FOLLOWER_REQUIRED, message: Select a follower. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM survey_followers WHERE survey_id = :id AND user_id = :user_id)", status: 409, code: SURVEY_FOLLOWER_ALREADY_EXISTS, message: This user already follows the survey. }
      steps:
        - { query: "INSERT INTO survey_followers(id, survey_id, user_id, user_name, user_email, row_version) VALUES(:relation_id, :id, :user_id, :user_name, :user_email, 1)", expect_changed: true, status: 409, code: SURVEY_FOLLOWER_CREATE_FAILED, message: The follower could not be added. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: SURVEY_FOLLOWER_PARENT_CHANGED, message: This survey changed while the follower was being added. }
      result: { query: "SELECT id, survey_id, user_id, user_name, user_email, row_version FROM survey_followers WHERE id = :relation_id" }
  - id: remove_survey_follower
    type: server
    permission: surveys.write
    action: surveys.followers.remove
    handler: line_item
    operation: delete
    domain: survey_detail
    params: { id: '{state.survey_detail.id}', line_id: '{row.id}' }
    refresh: [survey_detail, survey_followers, survey_follower_candidates]
    mutation:
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :parent_expected_row_version", status: 409, code: SURVEY_FOLLOWER_PARENT_CHANGED, message: This survey changed or is archived. Reload before changing followers. }
        - { query: "SELECT id FROM survey_followers WHERE id = :line_id AND survey_id = :id AND row_version = :expected_row_version", status: 409, code: SURVEY_FOLLOWER_STALE, message: This follower changed or was removed. Reload before deleting it. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_FOLLOWER_ACTOR_REQUIRED, message: An authenticated survey actor is required to change followers. }
      steps:
        - { query: "DELETE FROM survey_followers WHERE id = :line_id AND survey_id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_FOLLOWER_STALE, message: This follower changed or was removed. Reload before deleting it. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: SURVEY_FOLLOWER_PARENT_CHANGED, message: This survey changed while the follower was being removed. }
      result: { query: "SELECT true AS deleted, :line_id AS id" }
  - id: log_survey_note
    type: server_form
    permission: surveys.write
    title: Log note
    action: surveys.records.chatter.note
    handler: order_chatter
    operation: note
    params: { id: '{state.survey_detail.id}', expected_row_version: '{state.survey_detail.row_version}' }
    refresh: [survey_detail, survey_activities]
    fields:
      - { field: content, label: Note, type: textarea, required: true, placeholder: Write an internal note… }
    mutation:
      generated: [message_id]
      before_steps:
        - query: "SELECT :id || '-message-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM survey_messages WHERE survey_id = :id"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_NOTE_ACTOR_REQUIRED, message: An authenticated survey actor is required to log a note. }
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :expected_row_version", status: 409, code: SURVEY_NOTE_STALE, message: This survey changed or is archived. Reload before logging a note. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(CAST(:content AS VARCHAR), ''))) BETWEEN 1 AND 4000", status: 422, code: SURVEY_NOTE_INVALID, message: Note content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO survey_messages(id, row_version, survey_id, actor_id, actor_name, action, action_label, detail) VALUES(:message_id, 1, :id, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Admin User'), 'surveys.chatter.note', 'Internal note', TRIM(CAST(:content AS VARCHAR)))", expect_changed: true, status: 409, code: SURVEY_NOTE_EXISTS, message: The note could not be recorded. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_NOTE_STALE, message: This survey changed while the note was being logged. }
      result: { query: "SELECT id, survey_id, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM survey_messages WHERE id = :message_id" }
  - id: schedule_survey_activity
    type: server_form
    permission: surveys.write
    title: Schedule activity
    action: surveys.records.activity.schedule
    handler: yaml_mutation
    operation: create
    params: { survey_id: '{state.survey_detail.id}', expected_row_version: '{state.survey_detail.row_version}' }
    refresh: [survey_detail, survey_activities]
    mutation:
      operation: insert
      table: survey_activities
      fields: [survey_id, activity_type, summary, due_date, assigned_user_id, assigned_user_name, actor_name]
      required: [survey_id, activity_type, summary]
      defaults: { state: planned, actor_name: Admin User, created_at: '2026-01-15 09:00:00', updated_at: '2026-01-15 09:00:00' }
      generated: [id]
      before_steps:
        - query: "SELECT :survey_id || '-activity-' || CAST(COUNT(*) + 1 AS VARCHAR) AS id FROM survey_activities WHERE survey_id = :survey_id"
          assign: true
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :survey_id AND state <> 'Archived' AND row_version = :expected_row_version", status: 409, code: SURVEY_ACTIVITY_PARENT_CHANGED, message: This survey changed or is archived. Reload before scheduling an activity. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_ACTIVITY_ACTOR_REQUIRED, message: An authenticated survey actor is required to schedule an activity. }
        - { query: "SELECT 1 AS ok WHERE CAST(:activity_type AS VARCHAR) IN ('todo', 'email', 'call', 'meeting', 'document')", status: 422, code: SURVEY_ACTIVITY_TYPE_INVALID, message: Choose a valid activity type. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(CAST(:summary AS VARCHAR), ''))) BETWEEN 1 AND 4000", status: 422, code: SURVEY_ACTIVITY_SUMMARY_REQUIRED, message: Activity summary is required. }
        - { query: "SELECT 1 AS ok WHERE :due_date IS NULL OR LENGTH(TRIM(CAST(:due_date AS VARCHAR))) = 0 OR TRY_CAST(:due_date AS DATE) IS NOT NULL", status: 422, code: SURVEY_ACTIVITY_DATE_INVALID, message: Due date must be a valid ISO date. }
      steps:
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :survey_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_ACTIVITY_PARENT_CHANGED, message: This survey changed while the activity was being scheduled. }
      result: { query: "SELECT * FROM survey_activities WHERE id = :id" }
    fields:
      - { field: activity_type, label: Activity type, type: select, options: [{ value: todo, label: To-Do }, { value: email, label: Email }, { value: call, label: Call }, { value: meeting, label: Meeting }, { value: document, label: Document }], required: true }
      - { field: summary, label: Summary, type: text, required: true }
      - { field: due_date, label: Due date, type: text, placeholder: YYYY-MM-DD }
      - { field: assigned_user_id, label: Assigned user ID, type: text }
      - { field: assigned_user_name, label: Assigned to, type: text }
  - id: complete_survey_activity
    type: server
    permission: surveys.write
    action: surveys.records.activity.complete
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', values: { state: done, completed_at: '2026-01-15 10:00:00' } }
    refresh: [survey_detail, survey_activities]
    mutation:
      operation: update
      table: survey_activities
      fields: [state, completed_at]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM survey_activities WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", status: 409, code: SURVEY_ACTIVITY_STALE, message: This activity is already complete or changed. Reload before completing it. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_ACTIVITY_ACTOR_REQUIRED, message: An authenticated survey actor is required to complete an activity. }
      result: { query: "SELECT * FROM survey_activities WHERE id = :id" }
  - id: update_survey_responsible_user
    type: server_form
    permission: surveys.write
    title: Change responsible user
    action: surveys.records.responsible.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.survey_detail.id}' }
    prefill: { responsible_user_id: '{state.survey_detail.responsible_user_id}', responsible_user_name: '{state.survey_detail.responsible_user_name}' }
    fields:
      - { field: responsible_user_id, label: User ID, type: text, required: true, placeholder: 'e.g. user-demo' }
      - { field: responsible_user_name, label: Responsible user, type: text, required: true, placeholder: 'e.g. Demo Survey Officer' }
    refresh: [survey_detail, surveys]
    mutation:
      operation: update
      table: surveys
      fields: [responsible_user_id, responsible_user_name]
      required: [responsible_user_id, responsible_user_name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :expected_row_version", status: 409, code: SURVEY_RESPONSIBLE_STALE, message: This survey changed or is archived. Reload before changing the responsible user. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_RESPONSIBLE_ACTOR_REQUIRED, message: An authenticated survey actor is required to change the responsible user. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(CAST(:responsible_user_id AS VARCHAR), ''))) BETWEEN 1 AND 120 AND LENGTH(TRIM(COALESCE(CAST(:responsible_user_name AS VARCHAR), ''))) BETWEEN 1 AND 200", status: 422, code: SURVEY_RESPONSIBLE_REQUIRED, message: A responsible user ID and display name are required. }
        - { query: "SELECT 1 AS ok FROM surveys s WHERE s.id = :id AND (NOT EXISTS (SELECT 1 FROM survey_restricted_users r WHERE r.survey_id = s.id) OR EXISTS (SELECT 1 FROM survey_restricted_users r WHERE r.survey_id = s.id AND r.user_id = :responsible_user_id))", status: 422, code: SURVEY_RESPONSIBLE_RESTRICTED, message: The responsible user must be allowed to access this restricted survey. }
      result: { query: "SELECT id, row_version, responsible_user_id, responsible_user_name FROM surveys WHERE id = :id" }
  - id: update_survey_speed_rating
    type: server_form
    permission: surveys.write
    title: Configure quick-answer rewards
    action: surveys.records.live_speed_rating.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.survey_detail.id}', expected_row_version: '{state.survey_detail.row_version}' }
    prefill: { session_speed_rating: '{state.survey_detail.session_speed_rating}', session_speed_rating_time_limit: '{state.survey_detail.session_speed_rating_time_limit}' }
    refresh: [survey_detail, surveys, survey_questions]
    fields:
      - { field: session_speed_rating, label: Reward quick answers, type: checkbox }
      - { field: session_speed_rating_time_limit, label: Reward window (seconds), type: number }
    mutation:
      operation: update
      table: surveys
      fields: [session_speed_rating, session_speed_rating_time_limit]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id", status: 404, code: SURVEY_SPEED_RATING_NOT_FOUND, message: Survey not found. }
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :expected_row_version", status: 409, code: SURVEY_SPEED_RATING_STALE, message: This survey changed or is archived. Reload before changing quick-answer rewards. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_SPEED_RATING_ACTOR_REQUIRED, message: An authenticated survey actor is required to change quick-answer rewards. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:session_speed_rating AS BOOLEAN), false) = false OR COALESCE(CAST(:session_speed_rating_time_limit AS INTEGER), 0) BETWEEN 1 AND 3600", status: 422, code: SURVEY_SPEED_RATING_LIMIT_INVALID, message: Enter a speed-reward time limit from 1 to 3600 seconds when rewards are enabled. }
      result: { query: "SELECT id, row_version, session_speed_rating, session_speed_rating_time_limit FROM surveys WHERE id = :id" }
  - id: update_survey_certification_template
    type: server_form
    permission: surveys.write
    title: Configure certification template
    action: surveys.records.certification_template.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.survey_detail.id}', expected_row_version: '{state.survey_detail.row_version}' }
    prefill: { certification: '{state.survey_detail.certification}', certification_report_layout: '{state.survey_detail.certification_report_layout}' }
    refresh: [survey_detail, surveys]
    fields:
      - { field: certification, label: Certification, type: checkbox }
      - { field: certification_report_layout, label: Certification template, type: select, default: modern_purple, options: [{ value: modern_purple, label: Modern Purple }, { value: modern_blue, label: Modern Blue }, { value: modern_gold, label: Modern Gold }, { value: classic_purple, label: Classic Purple }, { value: classic_blue, label: Classic Blue }, { value: classic_gold, label: Classic Gold }] }
    mutation:
      operation: update
      table: surveys
      fields: [certification, certification_report_layout]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id", status: 404, code: SURVEY_CERTIFICATION_TEMPLATE_NOT_FOUND, message: Survey not found. }
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :expected_row_version", status: 409, code: SURVEY_CERTIFICATION_TEMPLATE_STALE, message: This survey changed or is archived. Reload before changing its certification template. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_CERTIFICATION_TEMPLATE_ACTOR_REQUIRED, message: An authenticated survey actor is required to change the certification template. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:certification_report_layout AS VARCHAR), '') IN ('modern_purple', 'modern_blue', 'modern_gold', 'classic_purple', 'classic_blue', 'classic_gold')", status: 422, code: SURVEY_CERTIFICATION_TEMPLATE_INVALID, message: Select a supported certification template. }
        - { query: "SELECT 1 AS ok FROM surveys WHERE id = :id AND (COALESCE(CAST(:certification AS BOOLEAN), false) = false OR COALESCE(scoring_type, 'no_scoring') <> 'no_scoring')", status: 422, code: SURVEY_CERTIFICATION_TEMPLATE_SCORING_REQUIRED, message: A certification needs a scoring mechanism. }
      result: { query: "SELECT id, row_version, certification, certification_report_layout FROM surveys WHERE id = :id" }
  - id: update_survey_scoring
    type: server_form
    permission: surveys.write
    title: Configure scoring
    action: surveys.records.scoring.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.survey_detail.id}', expected_row_version: '{state.survey_detail.row_version}' }
    prefill: { scoring_type: '{state.survey_detail.scoring_type}', scoring_success_min: '{state.survey_detail.scoring_success_min}' }
    refresh: [survey_detail, surveys]
    fields:
      - { field: scoring_type, label: Scoring, type: select, required: true, options: [{ value: no_scoring, label: No scoring }, { value: scoring_with_answers_after_page, label: Scoring with answers after each page }, { value: scoring_with_answers, label: Scoring with answers at the end }, { value: scoring_without_answers, label: Scoring without answers }] }
      - { field: scoring_success_min, label: 'Required Score (%)', type: number, required: true, default: 80, min: 0, max: 100 }
    mutation:
      operation: update
      table: surveys
      fields: [scoring_type, scoring_success_min]
      timestamps: true
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id", status: 404, code: SURVEY_SCORING_NOT_FOUND, message: Survey not found. }
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :expected_row_version", status: 409, code: SURVEY_SCORING_STALE, message: This survey changed or is archived. Reload before changing scoring. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_SCORING_ACTOR_REQUIRED, message: An authenticated survey actor is required to change scoring. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:scoring_type AS VARCHAR), '') IN ('no_scoring', 'scoring_with_answers_after_page', 'scoring_with_answers', 'scoring_without_answers')", status: 422, code: SURVEY_SCORING_TYPE_INVALID, message: Select a supported scoring mode. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:scoring_success_min AS DECIMAL(8,2)) BETWEEN 0 AND 100", status: 422, code: SURVEY_SCORING_THRESHOLD_INVALID, message: The required score must be between 0 and 100 percent. }
        - { query: "SELECT 1 AS ok FROM surveys WHERE id = :id AND (COALESCE(CAST(:scoring_type AS VARCHAR), '') <> 'no_scoring' OR COALESCE(certification, false) = false)", status: 422, code: SURVEY_SCORING_CERTIFICATION_REQUIRED, message: A certification needs a scoring mechanism. }
        - { query: "SELECT 1 AS ok FROM surveys WHERE id = :id AND (COALESCE(CAST(:scoring_type AS VARCHAR), '') <> 'scoring_with_answers_after_page' OR COALESCE(users_can_go_back, false) = false)", status: 422, code: SURVEY_SCORING_ROAMING_CONFLICT, message: Scoring with answers after each page cannot be combined with roaming. }
      result: { query: "SELECT id, row_version, scoring_type, scoring_success_min FROM surveys WHERE id = :id" }
  - id: add_survey_restricted_user
    type: server_form
    permission: surveys.write
    title: Add restricted user
    action: surveys.restrictions.add
    handler: line_item
    operation: create
    domain: survey_detail
    params: { id: '{state.id}' }
    refresh: [survey_detail, survey_restricted_users, surveys]
    fields:
      - { field: user_id, label: User ID, type: text, required: true, placeholder: 'e.g. user-demo' }
      - { field: user_name, label: User, type: text, required: true, placeholder: 'e.g. Demo Survey Officer' }
    mutation:
      generated: [relation_id]
      before_steps:
        - query: "SELECT :id || '-restricted-' || TRIM(CAST(:user_id AS VARCHAR)) AS relation_id"
          assign: true
      guards:
        - { query: "SELECT id FROM surveys WHERE id = :id AND state <> 'Archived' AND row_version = :parent_expected_row_version", status: 409, code: SURVEY_RESTRICTION_PARENT_CHANGED, message: This survey changed or is archived. Reload before changing access. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: SURVEY_RESTRICTION_ACTOR_REQUIRED, message: An authenticated survey actor is required to change restricted users. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(CAST(:user_id AS VARCHAR), ''))) BETWEEN 1 AND 120 AND LENGTH(TRIM(COALESCE(CAST(:user_name AS VARCHAR), ''))) BETWEEN 1 AND 200", status: 422, code: SURVEY_RESTRICTION_USER_REQUIRED, message: A user ID and display name are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM survey_restricted_users WHERE survey_id = :id AND user_id = :user_id)", status: 409, code: SURVEY_RESTRICTION_ALREADY_ALLOWED, message: This user already has access to the survey. }
      steps:
        - { query: "INSERT INTO survey_restricted_users(id, survey_id, user_id, user_name, row_version) VALUES(:relation_id, :id, TRIM(CAST(:user_id AS VARCHAR)), TRIM(CAST(:user_name AS VARCHAR)), 1)", expect_changed: true, status: 409, code: SURVEY_RESTRICTION_CREATE_FAILED, message: The restricted user could not be added. }
        - { query: "UPDATE surveys SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: SURVEY_RESTRICTION_PARENT_CHANGED, message: This survey changed while access was being updated. Reload before retrying. }
      result: { query: "SELECT id, survey_id, user_id, user_name, row_version, CAST(created_at AS VARCHAR) AS created_at FROM survey_restricted_users WHERE id = :relation_id" }
  - id: remove_survey_restricted_user
