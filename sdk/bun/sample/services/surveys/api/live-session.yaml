page: { id: survey-live-session }
datasources:
  - id: survey_live_session
    single: true
    permission: surveys.read
    error_states: { transport_error: { status: 503, code: SURVEY_LIVE_SESSION_UNAVAILABLE, message: Live session details are temporarily unavailable. } }
    query: "SELECT ls.id, ls.row_version, ls.survey_id, ls.survey_name, ls.state AS session_state, ls.session_code, ls.session_link, ls.current_question_id, q.question_type AS current_question_type, q.sequence AS current_question_sequence, COALESCE(ls.current_question_text, 'Waiting for the host to start the first question') AS current_question_text, CAST(ls.session_start_time AS VARCHAR) AS session_start_time, ls.answer_count, ls.question_answer_count, CASE WHEN ls.leaderboard_enabled THEN 'Enabled' ELSE 'Disabled' END AS leaderboard, s.description FROM survey_live_sessions ls JOIN surveys s ON s.id = ls.survey_id LEFT JOIN survey_questions q ON q.id = ls.current_question_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND ls.survey_id = :survey_id"
  - id: survey_live_session_questions
    permission: surveys.read
    error_states: { transport_error: { status: 503, code: SURVEY_LIVE_SESSION_QUESTIONS_UNAVAILABLE, message: Live session questions are temporarily unavailable. } }
    query: "SELECT q.id, q.sequence, q.question_text, q.question_type, CASE WHEN q.id = ls.current_question_id THEN 'Current' ELSE 'Upcoming' END AS question_state, CASE WHEN q.required THEN 'Required' ELSE 'Optional' END AS requirement FROM survey_questions q JOIN survey_live_sessions ls ON ls.survey_id = q.survey_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND ls.survey_id = :survey_id ORDER BY q.sequence, q.id"
actions:
  - id: start_live_session_question
    type: server
    permission: surveys.manage
    action: surveys.sessions.start_question
    handler: yaml_mutation
    params: { expected_row_version: '{row.row_version}' }
    result: alert
    refresh: [survey_live_session, survey_live_session_questions]
    mutation:
      guards:
        - { query: "SELECT id FROM survey_live_sessions WHERE id = :id AND state = 'Ready' AND row_version = :expected_row_version", status: 409, code: SURVEY_LIVE_SESSION_NOT_READY, message: Only a ready live session can start its first question. Reload before starting it. }
        - { query: "SELECT q.id FROM survey_questions q JOIN survey_live_sessions ls ON ls.survey_id = q.survey_id WHERE ls.id = :id ORDER BY q.sequence, q.id LIMIT 1", status: 409, code: SURVEY_LIVE_SESSION_NO_QUESTIONS, message: Add at least one question before starting the live session. }
      steps:
        - { query: "UPDATE survey_live_sessions SET state = 'In Progress', current_question_id = (SELECT q.id FROM survey_questions q JOIN survey_live_sessions ls ON ls.survey_id = q.survey_id WHERE ls.id = :id ORDER BY q.sequence, q.id LIMIT 1), current_question_text = (SELECT q.question_text FROM survey_questions q JOIN survey_live_sessions ls ON ls.survey_id = q.survey_id WHERE ls.id = :id ORDER BY q.sequence, q.id LIMIT 1), question_started_at = TIMESTAMP '2026-01-15 10:05:00', row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:05:00' WHERE id = :id AND state = 'Ready' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SURVEY_LIVE_SESSION_NOT_READY, message: The live session changed before its first question started. Reload and try again. }
      result: { query: "SELECT 'First question started' AS message, state, current_question_id, current_question_text FROM survey_live_sessions WHERE id = :id" }
  - id: end_live_session
    type: server
    permission: surveys.manage
    action: surveys.sessions.end
    handler: yaml_mutation
    result: alert
    refresh: [survey_live_session]
    mutation:
      guards:
        - { query: "SELECT id FROM survey_live_sessions WHERE id = :id AND state IN ('Ready', 'In Progress') AND row_version = :expected_row_version", status: 409, message: Only an active live session can be closed. Reload before closing it. }
      steps:
        - { query: "UPDATE survey_live_sessions SET state = 'Closed', current_question_id = NULL, current_question_text = NULL, question_started_at = NULL, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:00:00' WHERE id = :id AND state IN ('Ready', 'In Progress') AND row_version = :expected_row_version", expect_changed: true, status: 409, message: Only an active live session can be closed. }
      result: { query: "SELECT 'Live session closed' AS message, state FROM survey_live_sessions WHERE id = :id" }
