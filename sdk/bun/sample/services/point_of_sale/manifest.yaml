id: point-of-sale
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  sessions:
    path: /point-of-sale/sessions
    label: Point of Sale
    icon: cart
    permission: pos.read
  groups:
    - id: cashier
      label: Cashier
      items:
        - path: /point-of-sale/cashier
          label: Cashier
          icon: receipt
          permission: pos.write
    - id: operations
      label: Operations
      items:
        - path: /point-of-sale/orders
          label: Orders
          icon: cart
          permission: pos.read
        - path: /point-of-sale/payments
          label: Payments
          icon: bank
          permission: pos.read
        - path: /point-of-sale/invoices
          label: POS Invoices
          icon: invoice
          permission: pos.read
        - path: /point-of-sale/cash-movements
          label: Cash Movements
          icon: money
          permission: pos.read
    - id: configuration-reporting
      label: Configuration & Reporting
      items:
        - path: /point-of-sale/configs
          label: Configuration
          icon: settings
          permission: pos.read
        - path: /point-of-sale/analysis
          label: Sales Analysis
          icon: chart
          permission: pos.read
