        id VARCHAR PRIMARY KEY,
        category VARCHAR NOT NULL,
        state VARCHAR NOT NULL DEFAULT 'Paid',
        total_price DECIMAL(18,2) NOT NULL DEFAULT 0,
        order_date TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
