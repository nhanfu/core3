version: 0.0.30
kind: data
description: Odoo Point of Sale configuration action fields and deterministic fixtures
type:
  postgres:
    up: |
      ALTER TABLE pos_configs ADD COLUMN IF NOT EXISTS row_version BIGINT;
      ALTER TABLE pos_configs ADD COLUMN IF NOT EXISTS login_with_employees BOOLEAN;
      ALTER TABLE pos_configs ADD COLUMN IF NOT EXISTS epos_printer BOOLEAN;
      ALTER TABLE pos_configs ADD COLUMN IF NOT EXISTS iot_box BOOLEAN;
      ALTER TABLE pos_configs ADD COLUMN IF NOT EXISTS closing VARCHAR;
      ALTER TABLE pos_configs ADD COLUMN IF NOT EXISTS closing_balance DECIMAL(18,2);
      UPDATE pos_configs SET name = 'Furniture Shop' WHERE id = 'pos-config-main' AND name = 'Main Shop';
      UPDATE pos_sessions SET config = 'Furniture Shop' WHERE config = 'Main Shop';
      UPDATE pos_configs SET row_version = COALESCE(row_version, 1), login_with_employees = COALESCE(login_with_employees, false), epos_printer = COALESCE(epos_printer, false), iot_box = COALESCE(iot_box, false), closing_balance = COALESCE(closing_balance, 0);
      UPDATE pos_configs SET company = COALESCE(company, 'My Company (San Francisco)'), currency = COALESCE(currency, 'USD') WHERE id = 'pos-config-main';
      UPDATE pos_configs SET closing = 'Sep 10', closing_balance = 2243.57 WHERE id = 'pos-config-main';
      UPDATE pos_configs SET company = 'My Company (San Francisco)', closing = NULL, closing_balance = 0 WHERE id IN ('pos-config-clothes', 'pos-config-bakery');
      INSERT INTO pos_configs(id, row_version, name, company, currency, receipt_header, receipt_footer, active, login_with_employees, epos_printer, iot_box, closing, closing_balance)
      VALUES
        ('pos-config-restaurant', 1, 'Restaurant', 'My Company (San Francisco)', 'USD', 'Thank you for your purchase', 'Visit again soon', true, false, false, false, 'Sep 9', 0),
        ('pos-config-bar', 1, 'Bar', 'My Company (San Francisco)', 'USD', 'Thank you for your purchase', 'Visit again soon', false, false, false, false, NULL, 0),
        ('pos-config-kiosk', 1, 'Kiosk', 'My Company (San Francisco)', 'USD', 'Thank you for your purchase', 'Visit again soon', false, false, false, false, NULL, 0)
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM pos_configs WHERE id IN ('pos-config-restaurant', 'pos-config-bar', 'pos-config-kiosk');
      UPDATE pos_sessions SET config = 'Main Shop' WHERE config = 'Furniture Shop';
      UPDATE pos_configs SET name = 'Main Shop' WHERE id = 'pos-config-main' AND name = 'Furniture Shop';
      ALTER TABLE pos_configs DROP COLUMN IF EXISTS closing_balance;
      ALTER TABLE pos_configs DROP COLUMN IF EXISTS closing;
      ALTER TABLE pos_configs DROP COLUMN IF EXISTS iot_box;
      ALTER TABLE pos_configs DROP COLUMN IF EXISTS epos_printer;
      ALTER TABLE pos_configs DROP COLUMN IF EXISTS login_with_employees;
      ALTER TABLE pos_configs DROP COLUMN IF EXISTS row_version;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
