      ALTER TABLE pos_attributes ADD COLUMN IF NOT EXISTS row_version BIGINT;
      ALTER TABLE pos_attributes ADD COLUMN IF NOT EXISTS sequence INTEGER;
      UPDATE pos_attributes
      SET row_version = COALESCE(row_version, 1), sequence = CASE id
        WHEN 'pos-attr-size' THEN 20
        WHEN 'pos-attr-color' THEN 40
        WHEN 'pos-attr-milk' THEN 60
        WHEN 'pos-attr-roast' THEN 50
        WHEN 'pos-attr-archived' THEN 130
        ELSE COALESCE(sequence, 100)
      END;
      CREATE TABLE IF NOT EXISTS pos_attribute_values (
        id VARCHAR PRIMARY KEY,
        attribute_id VARCHAR NOT NULL,
        row_version BIGINT NOT NULL DEFAULT 1,
        sequence INTEGER NOT NULL DEFAULT 10,
        name VARCHAR NOT NULL,
        is_custom BOOLEAN NOT NULL DEFAULT false,
        default_extra_price DECIMAL(18,2) NOT NULL DEFAULT 0,
        active BOOLEAN NOT NULL DEFAULT true
      );
