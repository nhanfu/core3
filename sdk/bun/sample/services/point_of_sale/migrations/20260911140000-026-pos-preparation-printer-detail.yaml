version: 0.0.27
kind: data
description: Preparation printer detail, CRUD concurrency, and deterministic connection fixtures
type:
  postgres:
    up: |
      ALTER TABLE pos_preparation_printers ADD COLUMN IF NOT EXISTS row_version BIGINT DEFAULT 1;
      UPDATE pos_preparation_printers SET row_version = COALESCE(row_version, 1), last_seen = CASE id
        WHEN 'pos-printer-kitchen' THEN TIMESTAMP '2026-01-15 11:30:00'
        WHEN 'pos-printer-bar' THEN TIMESTAMP '2026-01-15 11:35:00'
        WHEN 'pos-printer-receipt' THEN TIMESTAMP '2026-01-15 11:40:00'
        ELSE last_seen
      END;
    down: |
      ALTER TABLE pos_preparation_printers DROP COLUMN IF EXISTS row_version;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
