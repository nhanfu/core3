        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL,
        start_date TIMESTAMP NOT NULL,
        end_date TIMESTAMP NOT NULL,
        state VARCHAR NOT NULL DEFAULT 'Draft',
        generated_at TIMESTAMP
