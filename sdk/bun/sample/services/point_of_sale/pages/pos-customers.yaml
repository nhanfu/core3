title: POS Customers
page: { id: pos-customers, route: /point-of-sale/customers, breadcrumb: [Sales, Point of Sale, Customers], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_customer_directory
    row_open_action: view_pos_customer
    row_double_click_action: view_pos_customer
    search: { label: Search customers, placeholder: Search customer... }
    columns:
      - { field: partner_name, label: Customer, type: PrimaryEntityCell }
      - { field: order_count, label: Orders, align: right }
      - { field: total_sales, label: Total sales, align: right }
      - { field: last_order, label: Last order }
    page_size: 50
    row_key: id
