title: POS Product Tags
page: { id: pos-product-tags, route: /point-of-sale/product-tags, breadcrumb: [Sales, Point of Sale, Products, Tags], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_product_tags
    create_action: new_pos_product_tag
    create_label: New
    search: { label: Search product tags, placeholder: 'Search...' }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell }
      - { field: visible_to_customers, label: Visible to customers? }
      - { field: product_templates, label: Product Templates }
      - { field: product_variants, label: Product Variant }
    page_size: 50
    row_key: id
    row_open_action: view_pos_product_tag
    row_double_click_action: view_pos_product_tag
    empty_state: { title: Define a new tag, description: Tags are used to search product for a given theme. }
