title: Point of Sale
page:
  id: pos-touch
  route: /point-of-sale/touch
  breadcrumb: [Sales, Point of Sale]
  auth: { require: [pos.read] }

toolbar:
  - { id: touch_open_cashier, label: Open cashier, action: touch_open_cashier, permission: pos.write, variant: primary }
  - { id: touch_sessions, label: Active sessions, action: touch_sessions, permission: pos.read, variant: secondary }

components:
  - type: ListView
    variant: odoo
    source: pos_touch_sessions
    empty_state:
      title: No open registers
      description: Open a register to start selling.
    views:
      - id: card
        label: Registers
        icon: grid
        card:
          title: name
          subtitle: config
          fields:
            - { field: state, label: Status }
            - { field: opening_counted, label: Opening cash }
      - { id: list, label: List, icon: table }
    columns:
      - { field: name, label: Session, type: PrimaryEntityCell }
      - { field: config, label: Point of Sale }
      - { field: state, label: Status, type: StatusChip }
      - { field: opening_counted, label: Opening cash, align: right }
    page_size: 12
    row_key: id

  - type: ListView
    variant: odoo
    source: pos_touch_products
    search: { label: Products, placeholder: Search products or scan barcode... }
    view_navigation: tabs
    views:
      - id: card
        label: Products
        icon: grid
        card:
          title: name
          subtitle: category
          fields:
            - { field: price, label: Price }
            - { field: tax_rate, label: Tax }
      - { id: list, label: List, icon: table }
    columns:
      - { field: name, label: Product, type: PrimaryEntityCell }
      - { field: category, label: Category }
      - { field: price, label: Price, align: right }
      - { field: tax_rate, label: Tax %, align: right }
    page_size: 48
    row_key: id

  - type: ListView
    variant: odoo
    source: pos_touch_open_orders
    empty_state:
      title: No open orders
      description: New tickets will appear here while they are being prepared.
    views:
      - id: card
        label: Open tickets
        icon: grid
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: amount_total, label: Total }
            - { field: state, label: Status }
      - { id: list, label: List, icon: table }
    columns:
      - { field: name, label: Ticket, type: PrimaryEntityCell }
      - { field: partner_name, label: Customer }
      - { field: amount_total, label: Total, align: right }
      - { field: state, label: Status, type: StatusChip }
    page_size: 12
    row_key: id

actions:
  - id: touch_open_cashier
    type: navigate
    permission: pos.write
    navigate_to: /point-of-sale/cashier

  - id: touch_sessions
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/sessions
