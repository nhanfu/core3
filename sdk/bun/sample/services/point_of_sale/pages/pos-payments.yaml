title: POS Payments
page: { id: pos-payments, route: /point-of-sale/payments, breadcrumb: [Sales, Point of Sale, Payments], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_payments
    columns:
      - { field: order_name, label: Order, type: PrimaryEntityCell }
      - { field: method, label: Payment method }
      - { field: amount, label: Amount, align: right }
      - { field: state, label: Status, type: StatusChip }
      - { field: payment_date, label: Payment date }
    page_size: 50
    row_key: id
