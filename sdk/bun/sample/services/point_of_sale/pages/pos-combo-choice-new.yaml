title: New POS Combo Choice
page: { id: pos-combo-choice-new, route: /point-of-sale/combo-choices/new, breadcrumb: [Sales, Point of Sale, Products, Combo Choices, New], auth: { require: [pos.read] } }
components:
  - type: OdooFormView
    source: pos_combo_choice_new
    title_field: name
    editable: true
    initial_editing: true
    labels: { save: Save, discard: Discard, editDetails: Edit details }
    header_actions:
      - { id: back_to_pos_combo_choices, label: Combo Choices, variant: secondary, permission: pos.read }
      - { id: create_pos_combo_choice, label: Save, variant: primary, permission: pos.manage }
    group_columns: 2
    groups:
      - title: Combo Choice
        fields:
          - { field: name, label: Combo Choice, type: text, required: true }
          - { field: maximum_items, label: Maximum items?, type: number, required: true, default: 1, min: 1 }
          - { field: included_items, label: Includes items?, type: number, required: true, default: 1, min: 0 }
      - title: Details
        fields:
          - { field: combo_price, label: Combo Price?, type: number, required: true, default: 0, min: 0 }
          - { field: company, label: Company, type: text, default: 'Visible to all' }

  - type: LineItemGrid
    mount_in: previous-panel
    source: pos_combo_choice_new_items
    parent_source: pos_combo_choice_new
    title: Options
    variant: odoo_x2many
    page_size: 100
    row_key: id
    actions:
      - { id: add_pos_combo_choice_item, label: Add a line, variant: primary, permission: pos.manage, disabled: true }
    empty_state: { title: No options, description: Save the combo choice before adding products. }
    children:
      - { type: LineItemField, id: product, field: product, label: Product, input_type: text, required: true }
      - { type: LineItemField, id: original_price, field: original_price, label: Original Price, input_type: money, decimals: 2 }
      - { type: LineItemField, id: extra_price, field: extra_price, label: Extra Price, input_type: money, decimals: 2 }
    columns:
      - { field: product, label: Options, width: 120 }
      - { field: original_price, label: Original Price, align: right, width: 90 }
      - { field: extra_price, label: Extra Price, align: right, width: 90 }
      - { field: actions, label: '', sortable: false, width: 40 }
