title: POS Pricelists
page: { id: pos-pricelists, route: /point-of-sale/pricelists, breadcrumb: [Sales, Point of Sale, Products, Pricelists], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_pricelists
    search: { label: Search pricelists, placeholder: 'Search pricelist or country group...' }
    filters: [{ field: active, label: Status, options_source: pos_pricelist_active }]
    row_open_action: view_pos_pricelist
    row_double_click_action: view_pos_pricelist
    form_view: { page: apps/services/point_of_sale/pages/pos-pricelist-detail.yaml, side_panel: false }
    columns:
      - { field: name, label: Pricelist Name, type: PrimaryEntityCell }
      - { field: country_groups, label: Country Groups }
      - { field: company, label: Company }
      - { field: currency, label: Currency }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
actions:
  - id: view_pos_pricelist
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/pricelist-detail
    params: { id: '{row.id}' }
