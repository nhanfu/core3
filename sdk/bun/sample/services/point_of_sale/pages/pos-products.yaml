title: POS Products
page: { id: pos-products, route: /point-of-sale/products, breadcrumb: [Sales, Point of Sale, Products], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_product_catalog
    row_open_action: view_pos_product
    row_double_click_action: view_pos_product
    view_navigation: tabs
    views:
      - { id: card, label: Kanban, icon: dashboard, card: { title: name, subtitle: barcode, fields: [{ field: price, label: Price }, { field: on_hand, label: On hand }] } }
      - { id: list, label: List, icon: table, mobile: false }
      - id: activity
        label: Activity
        icon: activity
        mobile: false
        title_field: name
        subtitle_field: barcode
        activity_types:
          - { id: todo, label: To-Do, icon: ✓ }
          - { id: email, label: Email, icon: ✉ }
          - { id: call, label: Call, icon: ☎ }
          - { id: meeting, label: Meeting, icon: ◉ }
          - { id: document, label: Document, icon: ▣ }
        schedule_action: schedule_pos_product_activity
    search: { label: Search products, placeholder: Search product or barcode... }
    columns:
      - { field: name, label: Product, type: PrimaryEntityCell }
      - { field: barcode, label: Barcode }
      - { field: category, label: Category }
      - { field: price, label: Price, align: right }
      - { field: tax_rate, label: Tax %, align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
