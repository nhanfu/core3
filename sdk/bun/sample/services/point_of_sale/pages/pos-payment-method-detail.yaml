title: POS Payment Method
page: { id: pos-payment-method-detail, route: /point-of-sale/payment-method-detail, breadcrumb: [Sales, Point of Sale, Configuration, Payment Methods, Payment Method], auth: { require: [pos.read] } }
components:
  - type: OdooFormView
    source: pos_payment_method_detail
    title_field: name
    editable: true
    header_actions:
      - { id: edit_pos_payment_method, label: Edit, variant: secondary, permission: pos.manage }
    group_columns: 2
    groups:
      - title: Payment Method
        fields:
          - { field: name, label: Method }
          - { field: sequence, label: Sequence }
          - { field: split_transactions, label: Split Transactions }
          - { field: journal, label: Journal }
          - { field: account, label: Account }
          - { field: receivable_account, label: Receivable Account }
          - { field: company, label: Company }
          - { field: point_of_sale, label: Point of Sale }
          - { field: payment_method_type, label: Payment Method Type }
          - { field: use_payment_terminal, label: Integrate with }
          - { field: active, label: Active }
