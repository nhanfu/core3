workflow:
  id: pos_sessions
  entity: pos_sessions
  handler: pos_session_status
  initial: Opening Control
  permission: pos.write
  mutable: true
  status_source: pos_session_states
  status_query: SELECT state AS status FROM pos_sessions WHERE id = ?
  default_mutation:
    guards:
      - query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL"
        status: 401
        code: POS_SESSION_UNAUTHENTICATED
        message: Sign in before changing a POS session.
      - query: "SELECT id FROM pos_sessions WHERE id = :id"
        status: 404
        code: POS_SESSION_NOT_FOUND
        message: POS session not found.
      - query: "SELECT id FROM pos_sessions WHERE id = :id AND company = :current_company_name"
        status: 403
        code: POS_SESSION_COMPANY_FORBIDDEN
        message: POS session belongs to another company.
      - query: "SELECT id FROM pos_sessions WHERE id = :id AND row_version = :expected_row_version"
        status: 409
        code: POS_SESSION_STALE
        message: POS session changed; reload before changing status.
      - query: "SELECT id FROM pos_sessions WHERE id = :id AND state = :current_status"
        status: 409
        message: POS session changed; refresh and try again
    steps:
      - query: "UPDATE pos_sessions SET state = :target_status, actor_id = :current_user_id, row_version = row_version + 1 WHERE id = :id AND company = :current_company_name"
    result: { query: "SELECT * FROM pos_sessions WHERE id = :id" }
  states:
    - { id: Opening Control, label: Opening Control, color: neutral }
    - { id: In Progress, label: In Progress, color: blue }
    - { id: Closing Control, label: Closing Control, color: amber }
    - { id: Closed & Posted, label: Closed & Posted, color: green, terminal: true }
  transitions:
    - id: open
      from: [Opening Control]
      to: In Progress
      permission: pos.write
      mutation:
        guards:
          - { query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL", status: 401, code: POS_SESSION_UNAUTHENTICATED, message: Sign in before changing a POS session. }
          - { query: "SELECT id FROM pos_sessions WHERE id = :id", status: 404, code: POS_SESSION_NOT_FOUND, message: POS session not found. }
          - { query: "SELECT id FROM pos_sessions WHERE id = :id AND company = :current_company_name", status: 403, code: POS_SESSION_COMPANY_FORBIDDEN, message: POS session belongs to another company. }
          - { query: "SELECT id FROM pos_sessions WHERE id = :id AND row_version = :expected_row_version", status: 409, code: POS_SESSION_STALE, message: POS session changed; reload before opening. }
        steps:
          - query: "UPDATE pos_sessions SET state = 'In Progress', opened_at = COALESCE(opened_at, CURRENT_TIMESTAMP), actor_id = :current_user_id, row_version = row_version + 1 WHERE id = :id AND company = :current_company_name"
        result: { query: "SELECT * FROM pos_sessions WHERE id = :id" }
    - id: start_closing
      from: [In Progress]
      to: Closing Control
      permission: pos.write
      mutation:
        guards:
          - { query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL", status: 401, code: POS_SESSION_UNAUTHENTICATED, message: Sign in before changing a POS session. }
          - { query: "SELECT id FROM pos_sessions WHERE id = :id", status: 404, code: POS_SESSION_NOT_FOUND, message: POS session not found. }
          - { query: "SELECT id FROM pos_sessions WHERE id = :id AND company = :current_company_name", status: 403, code: POS_SESSION_COMPANY_FORBIDDEN, message: POS session belongs to another company. }
          - { query: "SELECT id FROM pos_sessions WHERE id = :id AND row_version = :expected_row_version", status: 409, code: POS_SESSION_STALE, message: POS session changed; reload before closing. }
        steps:
          - query: "UPDATE pos_sessions SET state = 'Closing Control', actor_id = :current_user_id, row_version = row_version + 1 WHERE id = :id AND company = :current_company_name"
        result: { query: "SELECT * FROM pos_sessions WHERE id = :id" }
    - id: close
      from: [Closing Control]
      to: Closed & Posted
      permission: pos.manage
      mutation:
        guards:
          - { query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL", status: 401, code: POS_SESSION_UNAUTHENTICATED, message: Sign in before changing a POS session. }
          - { query: "SELECT id FROM pos_sessions WHERE id = :id", status: 404, code: POS_SESSION_NOT_FOUND, message: POS session not found. }
          - { query: "SELECT id FROM pos_sessions WHERE id = :id AND company = :current_company_name", status: 403, code: POS_SESSION_COMPANY_FORBIDDEN, message: POS session belongs to another company. }
          - query: "SELECT id FROM pos_sessions WHERE id = :id AND state = 'Closing Control'"
            status: 409
            message: Only closing sessions can be posted
          - query: "SELECT 1 AS ok WHERE :balance_end IS NOT NULL AND CAST(:balance_end AS DECIMAL(18,2)) >= 0"
            status: 400
            message: Closing balance is required and cannot be negative
        steps:
          - query: |
              UPDATE pos_sessions SET
                state = 'Closed & Posted',
                balance_end = CAST(:balance_end AS DECIMAL(18,2)),
                closing_counted = COALESCE(CAST(NULLIF(:closing_counted, '') AS DECIMAL(18,2)), CAST(:balance_end AS DECIMAL(18,2))),
                expected_cash = COALESCE(expected_cash, balance_start + COALESCE((SELECT SUM(CASE WHEN movement_type = 'Cash In' THEN amount ELSE -amount END) FROM pos_cash_movements WHERE session_id = :id), 0)),
                cash_difference = COALESCE(CAST(NULLIF(:closing_counted, '') AS DECIMAL(18,2)), CAST(:balance_end AS DECIMAL(18,2))) - COALESCE(expected_cash, balance_start),
                discrepancy_reason = :discrepancy_reason,
                closed_at = CURRENT_TIMESTAMP,
                actor_id = :current_user_id,
                row_version = row_version + 1
              WHERE id = :id AND company = :current_company_name
        result: { query: "SELECT * FROM pos_sessions WHERE id = :id" }
