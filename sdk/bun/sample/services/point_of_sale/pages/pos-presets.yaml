title: POS Presets
page: { id: pos-presets, route: /point-of-sale/presets, breadcrumb: [Sales, Point of Sale, Configuration, Presets], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_order_presets
    create_action: create_pos_order_preset
    create_label: New
    row_open_action: view_pos_order_preset
    row_double_click_action: view_pos_order_preset
    search: { label: Search presets, placeholder: Search preset or service mode... }
    empty_state: { title: No presets, description: Create a preset to control service modes and self-order options. }
    columns:
      - { field: name, label: Preset, type: PrimaryEntityCell }
      - { field: use_timing, label: Manage orders by time }
      - { field: identification, label: Identification }
      - { field: color, label: Color }
      - { field: service_mode, label: Service mode }
      - { field: preparation_minutes, label: Preparation (min), align: right }
      - { field: guest_count, label: Guests, align: right }
      - { field: active, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
