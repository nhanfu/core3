title: POS Presets
page: { id: pos-presets, route: /point-of-sale/presets, breadcrumb: [Sales, Point of Sale, Configuration, Presets], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_order_presets
    create_action: create_pos_order_preset
    create_label: New
    search: { label: Search presets, placeholder: Search preset or service mode... }
    columns:
      - { field: name, label: Preset, type: PrimaryEntityCell }
      - { field: service_mode, label: Service mode }
      - { field: preparation_minutes, label: Preparation (min), align: right }
      - { field: guest_count, label: Guests, align: right }
      - { field: note, label: Default note }
      - { field: active, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
actions:
  - id: create_pos_order_preset
    type: server_form
    permission: pos.manage
    title: New POS preset
    action: pos.order_presets.create
    handler: yaml_mutation
    operation: create
    refresh: [pos_order_presets]
    mutation:
      operation: insert
      table: pos_order_presets
      fields: [name, service_mode, preparation_minutes, guest_count, note, active]
      required: [name, service_mode]
      defaults: { preparation_minutes: 0, guest_count: 1, active: true }
      result: { query: "SELECT * FROM pos_order_presets WHERE id = :id" }
    fields:
      - { field: name, label: Preset, type: text, required: true }
      - { field: service_mode, label: Service mode, type: select, options: [Takeaway, Dine in, Delivery], default: Takeaway }
      - { field: preparation_minutes, label: Preparation (min), type: number, default: 0 }
      - { field: guest_count, label: Guests, type: number, default: 1 }
      - { field: note, label: Default note, type: textarea }
      - { field: active, label: Active, type: checkbox, default: true }
