title: POS Cashier
page:
  id: pos-cashier
  route: /point-of-sale/cashier
  breadcrumb: [Sales, Point of Sale, Cashier]
  auth: { require: [pos.write] }
toolbar:
  - { id: start_cashier_ticket, label: New ticket, action: start_cashier_ticket, permission: pos.write, variant: primary }
components:
  - type: StatRow
    source: pos_cashier_session_stats
    stats:
      - { field: session_name, label: Active session }
      - { field: open_orders, label: Open tickets }
      - { field: total_paid, label: Paid today }
      - { field: cashier_state, label: Session status }

  - type: ListView
    variant: odoo
    source: pos_cashier_products
    search:
      label: Find product
      placeholder: Search by name or scan barcode...
    view_navigation: tabs
    views:
      - id: card
        label: Products
        icon: grid
        card:
          title: name
          subtitle: category
          fields:
            - { field: price, label: Price }
            - { field: tax_rate, label: Tax % }
      - { id: list, label: List, icon: table }
    columns:
      - { field: name, label: Product, type: PrimaryEntityCell }
      - { field: barcode, label: Barcode }
      - { field: category, label: Category }
      - { field: price, label: Price, align: right }
      - { field: tax_rate, label: Tax %, align: right }
      - field: actions
        label: ''
        align: right
        actions:
          - { id: add_product_to_ticket, label: Add to ticket, variant: primary, permission: pos.write }
    page_size: 48
    row_key: id
    row_actions: buttons

  - type: ListView
    variant: odoo
    source: pos_open_tickets
    create_action: start_cashier_ticket
    create_label: New ticket
    page_size: 20
    row_key: id
    row_open_action: view_ticket
    row_actions: menu
    form_view: { page: apps/services/point_of_sale/pages/pos-order-detail.yaml, side_panel: true }
    columns:
      - { field: name, label: Ticket, type: PrimaryEntityCell }
      - { field: session_name, label: Session }
      - { field: partner_name, label: Customer }
      - { field: amount_total, label: Total, align: right }
      - { field: amount_paid, label: Paid, align: right }
      - { field: state, label: Status, type: StatusChip }
      - { field: date_order, label: Opened }
      - field: actions
        label: ''
        align: right
        actions:
          - { id: view_ticket, label: Open, variant: secondary, permission: pos.read }
          - { id: pay_cashier_ticket, label: Payment, variant: primary, permission: pos.write, show_if: "row.state === 'New'" }
          - { id: cancel_cashier_ticket, label: Cancel, variant: danger, permission: pos.write, show_if: "row.state === 'New'" }
    empty_state:
      title: No open tickets
      description: Start a new ticket to begin selling.

actions:
  - id: start_cashier_ticket
    type: server_form
    permission: pos.write
    title: Start cashier ticket
    action: pos.cashier.ticket.create
    handler: yaml_mutation
    operation: create
    refresh: [pos_open_tickets, pos_cashier_session_stats]
    mutation:
      operation: insert
      table: pos_orders
      fields: [name, session_id, partner_name, state, amount_total, amount_tax, amount_paid]
      required: [name, session_id]
      defaults: { state: New, amount_total: 0, amount_tax: 0, amount_paid: 0 }
      guards:
        - query: "SELECT id FROM pos_sessions WHERE id = :session_id AND state = 'In Progress'"
          status: 409
          message: Select an open POS session before starting a ticket
      result: { query: "SELECT * FROM pos_orders WHERE id = :id" }
    fields:
      - { field: name, label: Ticket reference, type: text, required: true }
      - { field: session_id, label: Open session, type: select, options_source: pos_cashier_sessions, required: true }
      - { field: partner_name, label: Customer, type: text }

  - id: add_product_to_ticket
    type: server_form
    permission: pos.write
    title: Add to ticket
    action: pos.cashier.ticket.add_product
    handler: yaml_mutation
    operation: create
    refresh: [pos_open_tickets, pos_cashier_session_stats]
    mutation:
      generated: [line_id]
      guards:
        - query: "SELECT id FROM pos_orders WHERE id = :ticket_id AND state = 'New'"
          status: 409
          message: Select an open ticket before adding products
        - query: "SELECT id FROM pos_products WHERE id = :product_id AND active = true"
          status: 404
          message: Product not found or inactive
        - query: "SELECT 1 AS ok WHERE CAST(:quantity AS DECIMAL(18,3)) > 0"
          status: 400
          message: Quantity must be positive
        - query: "SELECT 1 AS ok WHERE CAST(:discount AS DECIMAL(9,4)) BETWEEN 0 AND 100"
          status: 400
          message: Discount must be between 0 and 100 percent
      steps:
        - query: |
            INSERT INTO pos_order_lines(id, order_id, product_name, quantity, price_unit, tax_rate, discount, price_subtotal, price_tax, price_total)
            SELECT :line_id, :ticket_id, p.name,
              CAST(:quantity AS DECIMAL(18,3)),
              CAST(p.price AS DECIMAL(18,2)),
              CAST(p.tax_rate AS DECIMAL(9,4)),
              CAST(:discount AS DECIMAL(9,4)),
              ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(p.price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100), 2),
              ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(p.price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100) * CAST(p.tax_rate AS DECIMAL(9,4)) / 100, 2),
              ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(p.price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100) * (1 + CAST(p.tax_rate AS DECIMAL(9,4)) / 100), 2)
            FROM pos_products p WHERE p.id = :product_id
        - query: |
            UPDATE pos_orders SET
              amount_tax   = (SELECT COALESCE(SUM(price_tax),   0) FROM pos_order_lines WHERE order_id = :ticket_id),
              amount_total = (SELECT COALESCE(SUM(price_total), 0) FROM pos_order_lines WHERE order_id = :ticket_id),
              row_version  = row_version + 1
            WHERE id = :ticket_id
      result: { query: "SELECT * FROM pos_orders WHERE id = :ticket_id" }
    fields:
      - { field: ticket_id, label: Ticket, type: select, options_source: pos_open_ticket_options, required: true }
      - { field: product_id, label: Product ID, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, default: 1, required: true }
      - { field: discount, label: Discount (%), type: number, default: 0 }

  - id: view_ticket
    type: navigate
    permission: pos.read
    navigate_to: /order-detail
    params: { id: '{row.id}' }

  - id: pay_cashier_ticket
    type: server_form
    permission: pos.write
    title: Register payment
    action: pos.cashier.ticket.pay
    handler: yaml_mutation
    operation: pay
    prefill: { ticket_id: '{row.id}' }
    refresh: [pos_open_tickets, pos_cashier_session_stats]
    mutation:
      generated: [payment_id]
      guards:
        - query: "SELECT id FROM pos_orders WHERE id = :ticket_id AND state = 'New'"
          status: 409
          message: Ticket must be in New state to register payment
        - query: "SELECT 1 AS ok WHERE CAST(:amount AS DECIMAL(18,2)) > 0"
          status: 400
          message: Payment amount must be positive
        - query: |
            SELECT 1 AS ok WHERE CAST(:amount AS DECIMAL(18,2)) <=
              (SELECT amount_total - amount_paid FROM pos_orders WHERE id = :ticket_id)
          status: 400
          message: Payment exceeds remaining balance
      steps:
        - query: "INSERT INTO pos_payments(id, order_id, method, amount) VALUES(:payment_id, :ticket_id, COALESCE(:method, 'Cash'), CAST(:amount AS DECIMAL(18,2)))"
        - query: |
            UPDATE pos_orders SET
              amount_paid    = amount_paid + CAST(:amount AS DECIMAL(18,2)),
              payment_method = COALESCE(:method, 'Cash'),
              state          = CASE WHEN amount_paid + CAST(:amount AS DECIMAL(18,2)) >= amount_total THEN 'Paid' ELSE 'New' END,
              row_version    = row_version + 1
            WHERE id = :ticket_id
      result: { query: "SELECT * FROM pos_orders WHERE id = :ticket_id" }
    fields:
      - { field: ticket_id, label: Ticket, type: select, options_source: pos_open_ticket_options, required: true }
      - { field: amount, label: Amount, type: money, required: true }
      - { field: method, label: Method, type: select, options: [Cash, Card, Bank, Other], required: true }

  - id: cancel_cashier_ticket
    type: server
    permission: pos.write
    action: pos.cashier.ticket.cancel
    handler: order_transition
    workflow: pos_orders
    operation: cancel
    params: { id: '{row.id}' }
    refresh: [pos_open_tickets, pos_cashier_session_stats]
