title: New POS Attribute
page: { id: pos-attribute-new, route: /point-of-sale/attributes/new, breadcrumb: [Sales, Point of Sale, Products, Attributes, New], auth: { require: [pos.read] } }
components:
  - type: OdooFormView
    source: pos_attribute_new
    title_field: name
    initial_editing: true
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_pos_attributes, label: Attributes, variant: secondary, permission: pos.read }
      - { id: create_pos_attribute, label: Save, variant: primary, permission: pos.manage }
    group_columns: 2
    groups:
      - title: Attribute
        wide: true
        fields:
          - { field: name, label: Attribute Name }
          - { field: display_type, label: Display Type?, type: radio, options: [Radio, Pills, Select, Color, Multi-checkbox, Image] }
          - { field: variant_creation, label: Variant Creation?, type: radio, options: [Instantly, Dynamically, Never] }
