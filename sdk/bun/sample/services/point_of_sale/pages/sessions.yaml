title: Point of Sale
page: { id: sessions, route: /point-of-sale/sessions, breadcrumb: [Sales, Point of Sale, Sessions], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_sessions
    create_action: create_pos_session
    create_label: New session
    page_size: 50
    row_key: id
    row_open_action: view_pos_session
    row_double_click_action: view_pos_session
    form_view: { page: apps/services/point_of_sale/pages/pos-session-detail.yaml, side_panel: true }
    row_actions: menu
    filters: [{ field: state, label: Status, options_source: pos_session_states }]
    columns:
      - { field: name, label: Session, type: PrimaryEntityCell }
      - { field: config, label: Point of Sale }
      - { field: user_name, label: Responsible }
      - { field: state, label: Status, type: StatusChip }
      - { field: order_count, label: Orders, align: right }
      - { field: balance_start, label: Opening balance, align: right }
      - { field: balance_end, label: Closing balance, align: right }
      - { field: opened_at, label: Opened }
      - field: actions
        label: ''
        align: right
        actions:
          - { id: open_pos_session, label: Open, variant: primary, permission: pos.write, show_if: "row.state === 'Opening Control'" }
          - { id: start_closing_pos_session, label: Start Closing, variant: secondary, permission: pos.write, show_if: "row.state === 'In Progress'" }
          - { id: close_pos_session, label: Close & Post, variant: primary, permission: pos.manage, show_if: "row.state === 'Closing Control'" }
