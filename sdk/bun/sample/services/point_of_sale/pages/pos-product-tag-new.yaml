title: New
page: { id: pos-product-tag-new, route: /point-of-sale/product-tags/new, breadcrumb: [Sales, Point of Sale, Products, Product Tags, New], auth: { require: [pos.read] } }
components:
  - type: OdooFormView
    source: pos_product_tag_new
    title_field: name
    editable: true
    initial_editing: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_pos_product_tags, label: Product Tags, variant: secondary, permission: pos.read }
      - { id: create_pos_product_tag, label: Save, variant: primary, permission: pos.write }
    group_columns: 2
    groups:
      - title: Tag
        fields:
          - { field: name, label: Tag, type: text, required: true }
          - { field: visible_to_customers, label: Visible to customers?, type: checkbox, default: true }
          - { field: color, label: Color, type: text, default: Gray }
      - title: Point of Sale
        fields:
          - { field: description, label: Description, type: textarea }
