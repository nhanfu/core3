title: Session Report
page: { id: pos-session-report, route: /point-of-sale/session-report, breadcrumb: [Sales, Point of Sale, Reporting, Session Report], auth: { require: [pos.read] } }
components:
  - type: OdooFormView
    source: pos_session_report_wizard
    title_field: name
    editable: true
    initial_editing: true
    group_columns: 1
    labels: { save: Print, discard: Cancel }
    header_actions:
      - { id: print_pos_session_report, label: Print, permission: pos.read, variant: primary }
      - { id: cancel_pos_session_report, label: Cancel, permission: pos.read, variant: secondary }
    groups:
      - title: Session Report
        fields:
          - { field: session_id, label: Pos Session, type: select, options_source: pos_session_report_sessions }
          - { field: add_per_employee, label: Add a report per each employee, type: checkbox }
