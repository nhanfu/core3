title: POS Invoices
page: { id: pos-invoices, breadcrumb: [Sales, Point of Sale, Invoices], auth: { require: [pos.read] } }
datasources:
  - id: pos_invoices
    single: false
    permission: pos.read
    query: |
      SELECT i.id, i.invoice_number, i.order_id, o.name AS order_name,
        o.partner_name, i.state, i.amount, CAST(i.invoice_date AS VARCHAR) AS invoice_date
      FROM pos_invoices i LEFT JOIN pos_orders o ON o.id = i.order_id
      WHERE (:q IS NULL OR i.invoice_number ILIKE '%' || :q || '%' OR o.name ILIKE '%' || :q || '%')
      ORDER BY i.created_at DESC
components:
  - type: ListView
    variant: odoo
    source: pos_invoices
    search: { label: Search POS invoices, placeholder: Search invoice or POS order... }
    columns:
      - { field: invoice_number, label: Invoice, type: PrimaryEntityCell }
      - { field: order_name, label: POS order }
      - { field: partner_name, label: Customer }
      - { field: state, label: Status, type: StatusChip }
      - { field: amount, label: Amount, align: right }
      - { field: invoice_date, label: Invoice date }
    page_size: 50
    row_key: id
