title: Note Models
page: { id: pos-note-models, route: /point-of-sale/note-models, breadcrumb: [Sales, Point of Sale, Configuration, Note Models], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_note_models
    search: { label: Search..., placeholder: Search... }
    selectable: true
    column_chooser: true
    inline_edit:
      create_action: create_pos_note_model_inline
      update_action: update_pos_note_model_inline
      save_label: Save
      discard_label: Discard
      fields:
        - { field: sequence, type: number, default: 10 }
        - { field: name, type: text, required: true, placeholder: Note model }
        - { field: color, type: color, palette: odoo, default: 0 }
    columns:
      - { field: sequence, label: ' ', type: HandleCell, mobile: true }
      - { field: name, label: Name, type: PrimaryEntityCell, mobile: true, sortable: true }
      - { field: color, label: Color, type: ColorCell, palette: odoo, mobile: true }
    page_size: 50
    row_key: id
