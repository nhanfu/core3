title: New
page: { id: pos-floor-plan-new, route: /point-of-sale/floor-plans/new, breadcrumb: [Sales, Point of Sale, Configuration, Floor Plans, New], auth: { require: [pos.read] } }
components:
  - type: OdooFormView
    source: pos_floor_plan_new
    title_field: name
    editable: true
    initial_editing: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_pos_floor_plans_new, label: Floor Plans, variant: secondary, permission: pos.read }
      - { id: create_pos_floor_plan_new, label: Save, variant: primary, permission: pos.manage }
    group_columns: 2
    groups:
      - title: Floor Plan
        wide: true
        fields:
          - { field: name, label: Floor Name, type: text, required: true }
          - { field: point_of_sale_names, label: Point of Sales, type: text }

  - type: LineItemGrid
    mount_in: previous-panel
    source: pos_floor_plan_new_tables
    parent_source: pos_floor_plan_new
    title: Tables
    description: Configure the tables available on this floor plan.
    variant: odoo_x2many
    page_size: 100
    row_key: id
    actions:
      - { id: add_pos_floor_plan_table_new, label: Add a line, variant: primary, permission: pos.manage, show_if: state.pos_floor_plan_new.id }
    empty_state: { title: No tables, description: Save the floor plan before adding tables. }
    columns:
      - { field: table_number, label: Table Number, width: 150 }
      - { field: seats, label: Seats, align: right, width: 120 }
      - { field: shape, label: Shape, width: 140 }
