title: Point of Sale Orders
page: { id: pos-orders, route: /point-of-sale/orders, breadcrumb: [Sales, Point of Sale, Orders], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_orders
    create_action: create_pos_order
    create_label: New order
    search: { label: Search POS orders, placeholder: Search order number or customer... }
    filters: [{ field: state, label: Status, options_source: pos_order_states }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        group_by: state
        groups_source: pos_order_states
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: session_name, label: Session }
            - { field: amount_total, label: Total }
            - { field: state, label: Status }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: state
        groups_source: pos_order_states
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: session_name, label: Session }
            - { field: amount_total, label: Total }
            - { field: payment_method, label: Payment method }
      - id: calendar
        label: Calendar
        icon: calendar
        date_field: date_order
        card:
          title: name
          subtitle: partner_name
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields:
            - { field: state, column: Status }
            - { field: session_name, column: Session }
            - { field: payment_method, column: Payment method }
            - { field: date_order, column: Order date, type: date }
            - { field: amount_total, column: Total }
            - { field: amount_tax, column: Tax }
            - { field: amount_paid, column: Paid }
          default:
            rows: [state]
            columns: [payment_method]
            measures:
              - { field: amount_total, aggregate: sum, column: Total }
              - { field: amount_paid, aggregate: sum, column: Paid }
          date_ranges: { date_order: month }
      - id: graph
        label: Graph
        icon: graph
        category_field: state
        measure_field: amount_total
      - id: map
        label: Map
        icon: map
        label_field: name
        subtitle_field: partner_name
    columns:
      - { field: name, label: Order, type: PrimaryEntityCell }
      - { field: session_name, label: Session }
      - { field: partner_name, label: Customer }
      - { field: state, label: Status, type: StatusChip }
      - { field: amount_total, label: Total, align: right }
      - { field: amount_tax, label: Tax, align: right }
      - { field: amount_paid, label: Paid, align: right }
      - { field: to_invoice, label: To invoice, type: StatusChip }
      - { field: payment_method, label: Payment method }
      - { field: date_order, label: Order date }
    page_size: 50
    row_key: id
    row_open_action: view_pos_order
    row_double_click_action: view_pos_order
    form_view: { page: apps/services/point_of_sale/pages/pos-order-detail.yaml, side_panel: true }
    row_actions: menu
    actions:
      - { id: pay_pos_order, label: Register payment, permission: pos.write, variant: primary }
      - { id: invoice_pos_order, label: Create invoice, permission: pos.write, variant: secondary, show_if: "row.state === 'Paid' && row.to_invoice === true && !row.invoice_id" }
      - { id: cancel_pos_order, label: Cancel, permission: pos.write, variant: danger }
