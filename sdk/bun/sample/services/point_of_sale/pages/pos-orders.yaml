title: Point of Sale Orders
page: { id: pos-orders, breadcrumb: [Sales, Point of Sale, Orders], auth: { require: [pos.read] } }
datasources:
  - id: pos_order_states
    single: false
    permission: pos.read
    query: "SELECT value, label FROM (VALUES ('New','New'), ('Paid','Paid'), ('Invoiced','Invoiced'), ('Cancelled','Cancelled')) states(value, label)"
  - id: pos_orders
    single: false
    permission: pos.read
    workflow: pos_orders
    query: |
      SELECT o.id, o.row_version, o.name, o.session_id, s.name AS session_name,
        o.partner_name, o.state, o.amount_total, COALESCE(o.amount_tax, 0) AS amount_tax, o.amount_paid,
        COALESCE(o.to_invoice, false) AS to_invoice,
        o.payment_method, CAST(o.date_order AS VARCHAR) AS date_order
      FROM pos_orders o JOIN pos_sessions s ON s.id = o.session_id
      WHERE (:q IS NULL OR o.name ILIKE '%' || :q || '%' OR o.partner_name ILIKE '%' || :q || '%')
        AND (:state IS NULL OR o.state = :state)
      ORDER BY o.date_order DESC
components:
  - type: ListView
    variant: odoo
    source: pos_orders
    create_action: create_pos_order
    create_label: New order
    search: { label: Search POS orders, placeholder: Search order number or customer... }
    filters: [{ field: state, label: Status, options_source: pos_order_states }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        group_by: state
        groups_source: pos_order_states
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: session_name, label: Session }
            - { field: amount_total, label: Total }
            - { field: state, label: Status }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: state
        groups_source: pos_order_states
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: session_name, label: Session }
            - { field: amount_total, label: Total }
            - { field: payment_method, label: Payment method }
      - id: calendar
        label: Calendar
        icon: calendar
        date_field: date_order
        card:
          title: name
          subtitle: partner_name
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields:
            - { field: state, column: Status }
            - { field: session_name, column: Session }
            - { field: payment_method, column: Payment method }
            - { field: date_order, column: Order date, type: date }
            - { field: amount_total, column: Total }
            - { field: amount_tax, column: Tax }
            - { field: amount_paid, column: Paid }
          default:
            rows: [state]
            columns: [payment_method]
            measures:
              - { field: amount_total, aggregate: sum, column: Total }
              - { field: amount_paid, aggregate: sum, column: Paid }
          date_ranges: { date_order: month }
      - id: graph
        label: Graph
        icon: graph
        category_field: state
        measure_field: amount_total
      - id: map
        label: Map
        icon: map
        label_field: name
        subtitle_field: partner_name
    columns:
      - { field: name, label: Order, type: PrimaryEntityCell }
      - { field: session_name, label: Session }
      - { field: partner_name, label: Customer }
      - { field: state, label: Status, type: StatusChip }
      - { field: amount_total, label: Total, align: right }
      - { field: amount_tax, label: Tax, align: right }
      - { field: amount_paid, label: Paid, align: right }
      - { field: to_invoice, label: To invoice, type: StatusChip }
      - { field: payment_method, label: Payment method }
      - { field: date_order, label: Order date }
    page_size: 50
    row_key: id
    row_open_action: view_pos_order
    row_double_click_action: view_pos_order
    form_view: { page: apps/services/point_of_sale/pages/pos-order-detail.yaml, side_panel: true }
    row_actions: menu
    actions:
      - { id: pay_pos_order, label: Register payment, permission: pos.write, variant: primary }
      - { id: invoice_pos_order, label: Create invoice, permission: pos.write, variant: secondary, show_if: "row.state === 'Paid' && row.to_invoice === true && !row.invoice_id" }
      - { id: cancel_pos_order, label: Cancel, permission: pos.write, variant: danger }
actions:
  - id: view_pos_order
    type: navigate
    permission: pos.read
    navigate_to: /order-detail
    params: { id: '{row.id}' }
  - id: create_pos_order
    type: server_form
    permission: pos.write
    title: New POS order
    action: pos.orders.create
    handler: yaml_mutation
    operation: create
    mutation:
      operation: insert
      table: pos_orders
      fields: [name, session_id, partner_name, state, to_invoice, payment_method]
      required: [name, session_id]
      defaults: { state: New, amount_total: 0, amount_tax: 0, amount_paid: 0, to_invoice: false }
      guards:
        - query: "SELECT id FROM pos_sessions WHERE id = :session_id AND state = 'In Progress'"
          status: 409
          message: POS orders require an open session
      result: { query: "SELECT * FROM pos_orders WHERE id = :id" }
    fields:
      - { field: name, label: Order, type: text, required: true }
      - { field: session_id, label: Session, type: text, required: true }
      - { field: partner_name, label: Customer, type: text }
      - { field: to_invoice, label: To invoice, type: checkbox }
      - { field: payment_method, label: Payment method, type: select, options: [Cash, Bank, Card, Other] }
  - id: pay_pos_order
    type: server_form
    permission: pos.write
    title: Register POS payment
    action: pos.orders.pay
    handler: yaml_mutation
    operation: pay
    refresh: [pos_orders]
    mutation:
      generated: [payment_id]
      guards:
        - query: "SELECT id FROM pos_orders WHERE id = :id AND state IN ('New', 'Paid')"
          status: 409
          message: This POS order cannot receive a payment
        - query: "SELECT 1 AS ok WHERE CAST(:payment_amount AS DECIMAL(18,2)) > 0 AND CAST(:payment_amount AS DECIMAL(18,2)) <= (SELECT amount_total - amount_paid FROM pos_orders WHERE id = :id)"
          status: 400
          message: Payment must be positive and cannot exceed the remaining balance
      steps:
        - query: "INSERT INTO pos_payments(id, order_id, method, amount) VALUES(:payment_id, :id, COALESCE(:payment_method, 'Cash'), :payment_amount)"
        - query: "UPDATE pos_orders SET amount_paid = amount_paid + CAST(:payment_amount AS DECIMAL(18,2)), payment_method = :payment_method, state = CASE WHEN amount_paid + CAST(:payment_amount AS DECIMAL(18,2)) >= amount_total THEN 'Paid' ELSE 'New' END, row_version = row_version + 1 WHERE id = :id"
      result: { query: "SELECT * FROM pos_orders WHERE id = :id" }
    fields:
      - { field: payment_amount, label: Payment amount, type: number, required: true }
      - { field: payment_method, label: Payment method, type: select, options: [Cash, Bank, Card, Other], required: true }
  - id: invoice_pos_order
    type: server
    permission: pos.write
    action: pos.orders.invoice
    handler: pos_invoice
    operation: invoice
    params: { id: '{row.id}' }
    refresh: [pos_orders]
    mutation:
      generated: [invoice_id]
      guards:
        - query: "SELECT id FROM pos_orders WHERE id = :id AND state = 'Paid' AND to_invoice = true AND invoice_id IS NULL"
          status: 409
          message: Only paid POS orders marked for invoicing can be invoiced
      steps:
        - query: "INSERT INTO pos_invoices(id, order_id, invoice_number, amount) VALUES(:invoice_id, :id, 'POS-' || :id, (SELECT amount_total FROM pos_orders WHERE id = :id))"
        - query: "UPDATE pos_orders SET state = 'Invoiced', invoice_id = :invoice_id, row_version = row_version + 1 WHERE id = :id"
      result: { query: "SELECT * FROM pos_orders WHERE id = :id" }
  - id: cancel_pos_order
    type: server
    permission: pos.write
    action: pos.orders.cancel
    handler: order_transition
    workflow: pos_orders
    operation: cancel
    refresh: [pos_orders]
