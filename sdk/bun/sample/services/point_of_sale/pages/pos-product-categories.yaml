title: POS Product Categories
page: { id: pos-product-categories, route: /point-of-sale/product-categories, breadcrumb: [Sales, Point of Sale, Products, Categories], auth: { require: [pos.read] } }
components:
  - type: ListView
    variant: odoo
    source: pos_product_categories
    responsive_card: true
    create_action: new_pos_product_category
    create_label: New
    row_open_action: view_pos_product_category
    row_double_click_action: view_pos_product_category
    search: { label: Search categories, placeholder: 'Search category or parent...' }
    filters: [{ field: active, label: Status, options_source: pos_category_active }]
    columns:
      - { field: name, label: Category, type: PrimaryEntityCell }
      - { field: parent_category, label: Parent Category }
      - { field: sequence, label: Sequence, align: right }
      - { field: color, label: Color }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    empty_state: { title: Define a new category, description: Categories are used to browse your products through the touchscreen interface. }
