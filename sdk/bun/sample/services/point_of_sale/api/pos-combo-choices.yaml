page: { id: pos-combo-choices }
datasources:
  - id: pos_combo_choices
    permission: pos.read
    error_states: { transport_error: { status: 503, code: POS_COMBO_CHOICES_UNAVAILABLE, message: Combo choices are temporarily unavailable. } }
    query: "SELECT id, row_version, name, CAST(combo_price AS DOUBLE) AS combo_price, (SELECT COUNT(*) FROM pos_combo_choice_items i WHERE i.combo_choice_id = c.id) AS combo_item_count, active FROM pos_combo_choices c WHERE (:q IS NULL OR name ILIKE '%' || :q || '%') AND CASE WHEN COALESCE(:fixture_state, '') = 'empty' THEN 0 ELSE 1 END = 1 ORDER BY name"
actions:
  - id: new_pos_combo_choice
    type: navigate
    permission: pos.manage
    navigate_to: /point-of-sale/combo-choices/new

  - id: view_pos_combo_choice
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/combo-choice-detail
    params: { id: '{row.id}' }
