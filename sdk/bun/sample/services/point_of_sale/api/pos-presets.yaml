page: { id: pos-presets }
datasources:
  - id: pos_order_presets
    permission: pos.read
    query: "SELECT id, row_version, name, service_mode, use_timing, identification, color, preparation_minutes, guest_count, note, active FROM pos_order_presets WHERE (:q IS NULL OR name ILIKE '%' || :q || '%' OR service_mode ILIKE '%' || :q || '%' OR identification ILIKE '%' || :q || '%') ORDER BY name"
actions:
  - id: view_pos_order_preset
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/preset-detail
    params: { id: '{row.id}' }
  - id: create_pos_order_preset
    type: server_form
    permission: pos.manage
    title: New POS preset
    action: pos.order_presets.create
    handler: yaml_mutation
    operation: create
    refresh: [pos_order_presets]
    mutation:
      operation: insert
      table: pos_order_presets
      fields: [name, service_mode, preparation_minutes, guest_count, note, active]
      required: [name, service_mode]
      defaults: { service_mode: Takeout, preparation_minutes: 0, guest_count: 1, active: true }
      result: { query: "SELECT * FROM pos_order_presets WHERE id = :id" }
    fields:
      - { field: name, label: Preset, type: text, required: true }
      - { field: service_mode, label: Service mode, type: select, options: [Takeout, Dine In, Delivery], default: Takeout }
      - { field: preparation_minutes, label: Preparation (min), type: number, default: 0 }
      - { field: guest_count, label: Guests, type: number, default: 1 }
      - { field: note, label: Default note, type: textarea }
      - { field: active, label: Active, type: checkbox, default: true }
