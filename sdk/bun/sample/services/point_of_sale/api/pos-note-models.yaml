page: { id: pos-note-models }
datasources:
  - id: pos_note_models
    permission: pos.read
    error_states:
      unauthorized: { status: 401, code: POS_NOTE_MODELS_UNAUTHORIZED, message: Sign in to view note models. }
      forbidden: { status: 403, code: POS_NOTE_MODELS_FORBIDDEN, message: You do not have permission to view note models. }
      transport_error: { status: 503, code: POS_NOTE_MODELS_UNAVAILABLE, message: Note models are temporarily unavailable. }
    query: "SELECT id, row_version, sequence, name, color FROM pos_note_models WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY sequence, id"
actions:
  - id: create_pos_note_model_inline
    type: server_form
    permission: pos.manage
    title: New Note Model
    action: pos.note_models.create
    handler: yaml_mutation
    operation: create
    refresh: [pos_note_models]
    mutation:
      operation: insert
      table: pos_note_models
      fields: [row_version, sequence, name, color, note_type, position, note_text, usage_count, active]
      required: [name]
      defaults: { row_version: 1, sequence: 10, color: 0, note_type: Customer note, position: On receipt, note_text: '', usage_count: 0, active: true }
      generated: [id]
      before_steps: [{ query: "SELECT 'pos-note-custom-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: POS_NOTE_MODEL_NAME_REQUIRED, message: Note model name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:color, 0) AS INTEGER) BETWEEN 0 AND 11", status: 422, code: POS_NOTE_MODEL_COLOR_INVALID, message: Note model color must be between 0 and 11. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_note_models WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: POS_NOTE_MODEL_EXISTS, message: A note model with this name already exists. }
      result: { query: "SELECT * FROM pos_note_models WHERE id = :id" }
    fields:
      - { field: sequence, label: Sequence, type: number, default: 10 }
      - { field: name, label: Name, type: text, required: true }
      - { field: color, label: Color, type: color, palette: odoo, default: 0 }
  - id: update_pos_note_model_inline
    type: server_form
    permission: pos.manage
    title: Edit Note Model
    action: pos.note_models.update
    handler: yaml_mutation
    operation: update
    refresh: [pos_note_models]
    mutation:
      operation: update
      table: pos_note_models
      fields: [sequence, name, color]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM pos_note_models WHERE id = :id", status: 404, code: POS_NOTE_MODEL_NOT_FOUND, message: Note model was not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: POS_NOTE_MODEL_NAME_REQUIRED, message: Note model name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:color, 0) AS INTEGER) BETWEEN 0 AND 11", status: 422, code: POS_NOTE_MODEL_COLOR_INVALID, message: Note model color must be between 0 and 11. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_note_models WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: POS_NOTE_MODEL_EXISTS, message: A note model with this name already exists. }
      result: { query: "SELECT * FROM pos_note_models WHERE id = :id" }
    fields:
      - { field: sequence, label: Sequence, type: number }
      - { field: name, label: Name, type: text, required: true }
      - { field: color, label: Color, type: color, palette: odoo }
