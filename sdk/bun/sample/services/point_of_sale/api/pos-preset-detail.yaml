page: { id: pos-preset-detail }
datasources:
  - id: pos_preset_detail
    single: true
    permission: pos.read
    query: "SELECT id, row_version, name, service_mode, pricelist, fiscal_position, use_timing, schedule, slots_per_interval, interval_time, identification, is_return, color, available_in_self, service_at, email_confirmation, preparation_minutes, guest_count, note, active FROM pos_order_presets WHERE id = :id"
actions:
  - id: edit_pos_order_preset
    type: server_form
    permission: pos.manage
    title: Edit POS preset
    action: pos.order_presets.update
    handler: yaml_mutation
    operation: update
    refresh: [pos_preset_detail]
    mutation:
      operation: update
      table: pos_order_presets
      fields: [name, service_mode, pricelist, fiscal_position, use_timing, schedule, slots_per_interval, interval_time, identification, is_return, color, available_in_self, service_at, email_confirmation, preparation_minutes, guest_count, note, active]
      required: [name, service_mode]
      timestamps: true
      result: { query: "SELECT id, row_version, name, service_mode, pricelist, fiscal_position, use_timing, schedule, slots_per_interval, interval_time, identification, is_return, color, available_in_self, service_at, email_confirmation, preparation_minutes, guest_count, note, active FROM pos_order_presets WHERE id = :id" }
    fields:
      - { field: name, label: Label, type: text, required: true }
      - { field: service_mode, label: Service mode, type: select, options: [Takeaway, Dine in, Delivery], required: true }
      - { field: pricelist, label: Pricelist, type: text }
      - { field: fiscal_position, label: Fiscal Position, type: text }
      - { field: use_timing, label: Manage orders by time, type: checkbox }
      - { field: schedule, label: Schedule based on, type: text }
      - { field: slots_per_interval, label: Preparation capacity, type: number }
      - { field: interval_time, label: Interval time (min), type: number }
      - { field: identification, label: Identification, type: select, options: [Not required, Name, Address] }
      - { field: is_return, label: Return mode, type: checkbox }
      - { field: color, label: Color, type: number }
      - { field: available_in_self, label: Available in self, type: checkbox }
      - { field: service_at, label: Service at, type: select, options: [Table, Counter, Delivery] }
      - { field: email_confirmation, label: Email Confirmation, type: checkbox }
      - { field: preparation_minutes, label: Default preparation (min), type: number }
      - { field: guest_count, label: Default guests, type: number }
      - { field: note, label: Default note, type: textarea }
      - { field: active, label: Active, type: checkbox }
