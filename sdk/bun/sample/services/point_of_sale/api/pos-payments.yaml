page: { id: pos-payments }
datasources:
  - id: pos_payments
    single: false
    permission: pos.read
    query: "SELECT p.id, p.order_id, o.name AS order_name, p.method, p.amount, p.state, CAST(p.payment_date AS VARCHAR) AS payment_date FROM pos_payments p JOIN pos_orders o ON o.id = p.order_id ORDER BY p.payment_date DESC"
