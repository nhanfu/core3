page: { id: pos-floor-plan-new }
datasources:
  - id: pos_floor_plan_new
    single: true
    permission: pos.read
    query: "SELECT NULL AS id, 1 AS row_version, '' AS name, '' AS point_of_sale_names, 10 AS sequence"
  - id: pos_floor_plan_new_tables
    permission: pos.read
    query: "SELECT id, row_version, floor_plan_id, sequence, table_number, seats, shape FROM pos_floor_plan_tables WHERE 1 = 0"
actions:
  - id: back_to_pos_floor_plans_new
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/floor-plans

  - id: create_pos_floor_plan_new
    type: server_form
    permission: pos.manage
    title: New Floor Plan
    action: pos.floor_plans.create_new
    handler: yaml_mutation
    operation: insert
    refresh: [pos_floor_plans]
    mutation:
      operation: insert
      table: pos_floor_plans
      generated: [id]
      fields: [row_version, name, point_of_sale_names, sequence]
      required: [name]
      defaults: { row_version: 1, point_of_sale_names: '', sequence: 10 }
      guards:
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: POS_FLOOR_PLAN_NAME_REQUIRED, message: Floor Name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_floor_plans WHERE LOWER(name) = LOWER(trim(CAST(:name AS VARCHAR))))", status: 409, code: POS_FLOOR_PLAN_NAME_EXISTS, message: A floor plan with this name already exists. }
      result: { query: "SELECT * FROM pos_floor_plans WHERE id = :id" }
    fields:
      - { field: name, label: Floor Name, type: text, required: true }
      - { field: point_of_sale_names, label: Point of Sales, type: text }
      - { field: sequence, label: Sequence, type: number, default: 10 }
