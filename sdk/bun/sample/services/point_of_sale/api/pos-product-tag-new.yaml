page: { id: pos-product-tag-new }
datasources:
  - id: pos_product_tag_new
    single: true
    permission: pos.read
    query: "SELECT NULL AS id, 1 AS row_version, NULL AS name, true AS visible_to_customers, 'Gray' AS color, '' AS description, 0 AS product_templates, 0 AS product_variants, 0 AS product_count, true AS active WHERE 1 = 0"
actions:
  - id: back_to_pos_product_tags
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/product-tags

  - id: create_pos_product_tag
    type: server_form
    permission: pos.write
    title: New Product Tag
    action: pos.product_tags.create
    handler: yaml_mutation
    operation: create
    params: { id: '{state.id}' }
    refresh: [pos_product_tags]
    mutation:
      operation: insert
      table: pos_product_tags
      generated: [id]
      fields: [row_version, name, visible_to_customers, color, description, product_templates, product_variants, product_count, active]
      required: [name]
      defaults: { row_version: 1, visible_to_customers: true, color: Gray, description: '', product_templates: 0, product_variants: 0, product_count: 0, active: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE length(trim(:name)) BETWEEN 1 AND 80", status: 422, code: POS_PRODUCT_TAG_NAME_REQUIRED, message: Tag name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_product_tags WHERE LOWER(name) = LOWER(:name))", status: 409, code: POS_PRODUCT_TAG_NAME_EXISTS, message: A product tag with this name already exists. }
      result: { query: "SELECT * FROM pos_product_tags WHERE id = :id" }
    fields:
      - { field: name, label: Tag, type: text, required: true }
      - { field: visible_to_customers, label: Visible to customers?, type: checkbox, default: true }
      - { field: color, label: Color, type: text, default: Gray }
      - { field: description, label: Description, type: textarea }
