page: { id: pos-customers }
datasources:
  - id: pos_customer_directory
    permission: pos.read
    query: "SELECT MIN(o.partner_name) AS id, o.partner_name AS partner_name, COUNT(*) AS order_count, CAST(COALESCE(SUM(o.amount_total), 0) AS DOUBLE) AS total_sales, MAX(CAST(o.date_order AS VARCHAR)) AS last_order FROM pos_orders o WHERE o.partner_name IS NOT NULL AND (:q IS NULL OR o.partner_name ILIKE '%' || :q || '%') GROUP BY o.partner_name ORDER BY o.partner_name"
actions:
  - id: view_pos_customer
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/customer-detail
    params: { id: '{row.id}' }
