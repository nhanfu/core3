page: { id: pos-preparation-printers }
datasources:
  - id: pos_preparation_printers
    permission: pos.read
    query: "SELECT id, name, printer_type, proxy_ip, categories, state, CAST(last_seen AS VARCHAR) AS last_seen, CASE WHEN active THEN 'Active' ELSE 'Archived' END AS active FROM pos_preparation_printers WHERE (:q IS NULL OR name ILIKE '%' || :q || '%' OR printer_type ILIKE '%' || :q || '%' OR categories ILIKE '%' || :q || '%') ORDER BY name"
