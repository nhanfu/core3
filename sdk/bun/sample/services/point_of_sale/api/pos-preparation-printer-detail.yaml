page: { id: pos-preparation-printer-detail }
datasources:
  - id: pos_preparation_printer_detail
    single: true
    permission: pos.read
    error_states: { transport_error: { status: 503, code: POS_PREPARATION_PRINTER_DETAIL_UNAVAILABLE, message: Preparation printer details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, printer_type, proxy_ip, categories, state, CAST(last_seen AS VARCHAR) AS last_seen, active FROM pos_preparation_printers WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
actions:
  - id: back_to_pos_preparation_printers
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/preparation-printers

  - id: edit_pos_preparation_printer
    type: server_form
    permission: pos.manage
    title: Edit preparation printer
    action: pos.preparation_printers.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    prefill: state.pos_preparation_printer_detail
    refresh: [pos_preparation_printer_detail, pos_preparation_printers]
    mutation:
      operation: update
      table: pos_preparation_printers
      key_field: id
      concurrency: { required: true }
      fields: [name, printer_type, proxy_ip, categories, state, active]
      required: [name, printer_type]
      guards:
        - { query: "SELECT id FROM pos_preparation_printers WHERE id = :id", status: 404, code: POS_PREPARATION_PRINTER_NOT_FOUND, message: Preparation printer not found. }
        - { query: "SELECT 1 AS ok WHERE length(trim(:name)) BETWEEN 1 AND 80", status: 422, code: POS_PREPARATION_PRINTER_NAME_REQUIRED, message: Printer name is required. }
        - { query: "SELECT 1 AS ok WHERE length(trim(:printer_type)) BETWEEN 1 AND 80", status: 422, code: POS_PREPARATION_PRINTER_TYPE_REQUIRED, message: Device is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_preparation_printers WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: POS_PREPARATION_PRINTER_NAME_EXISTS, message: A preparation printer with this name already exists. }
      result: { query: "SELECT * FROM pos_preparation_printers WHERE id = :id" }
    fields:
      - { field: name, label: Printer, type: text, required: true }
      - { field: printer_type, label: Device, type: text, required: true }
      - { field: proxy_ip, label: Proxy address, type: text }
      - { field: categories, label: Product categories, type: text }
      - { field: state, label: Status, type: select, options: [Connected, Paused, Disconnected] }
      - { field: active, label: Active, type: checkbox }

  - id: delete_pos_preparation_printer
    type: server
    permission: pos.manage
    action: pos.preparation_printers.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{state.id}' }
    refresh: [pos_preparation_printers]
    mutation:
      operation: delete
      table: pos_preparation_printers
      key_field: id
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM pos_preparation_printers WHERE id = :id", status: 404, code: POS_PREPARATION_PRINTER_NOT_FOUND, message: Preparation printer not found. }

  - id: connect_pos_preparation_printer
    type: server
    permission: pos.manage
    action: pos.preparation_printers.connect
    handler: order_transition
    workflow: pos_preparation_printers
    operation: connect
    params: { id: '{state.id}' }
    refresh: [pos_preparation_printer_detail, pos_preparation_printers]

  - id: pause_pos_preparation_printer
    type: server
    permission: pos.manage
    action: pos.preparation_printers.pause
    handler: order_transition
    workflow: pos_preparation_printers
    operation: pause
    params: { id: '{state.id}' }
    refresh: [pos_preparation_printer_detail, pos_preparation_printers]

  - id: disconnect_pos_preparation_printer
    type: server
    permission: pos.manage
    action: pos.preparation_printers.disconnect
    handler: order_transition
    workflow: pos_preparation_printers
    operation: disconnect
    params: { id: '{state.id}' }
    refresh: [pos_preparation_printer_detail, pos_preparation_printers]
