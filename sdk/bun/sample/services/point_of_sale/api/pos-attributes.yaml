page: { id: pos-attributes }
datasources:
  - id: pos_attributes
    permission: pos.read
    error_states: { transport_error: { status: 503, code: POS_ATTRIBUTES_UNAVAILABLE, message: Attributes are temporarily unavailable. } }
    query: "SELECT id, row_version, sequence, name, display_type, variant_creation, values_count, active FROM pos_attributes WHERE active = true AND CASE WHEN COALESCE(:fixture_state, '') = 'empty' THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR display_type ILIKE '%' || :q || '%') ORDER BY sequence, id"
actions:
  - id: new_pos_attribute
    type: navigate
    permission: pos.manage
    navigate_to: /point-of-sale/attributes/new

  - id: view_pos_attribute
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/attribute-detail
    params: { id: '{row.id}' }
