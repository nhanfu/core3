page: { id: pos-orders }
datasources:
  - id: pos_order_states
    single: false
    permission: pos.read
    query: "SELECT value, label FROM (VALUES ('New','New'), ('Paid','Paid'), ('Invoiced','Invoiced'), ('Cancelled','Cancelled')) states(value, label)"
  - id: pos_orders
    single: false
    permission: pos.read
    workflow: pos_orders
    error_states:
      unauthorized: { status: 401, code: POS_ORDERS_UNAUTHORIZED, message: Sign in to view POS orders. }
      forbidden: { status: 403, code: POS_ORDERS_FORBIDDEN, message: You do not have access to POS orders. }
      transport_error: { status: 503, code: POS_ORDERS_UNAVAILABLE, message: POS orders are temporarily unavailable. }
    query: |
      SELECT o.id, o.row_version, o.name, o.session_id, s.name AS session_name,
        o.partner_name, o.customer_email, o.state, o.amount_total, COALESCE(o.amount_tax, 0) AS amount_tax, o.amount_paid,
        COALESCE(o.to_invoice, false) AS to_invoice, o.invoice_id, o.payment_method,
        o.cashier_id, o.actor_id, o.company, o.receipt_number, COALESCE(o.is_refund, false) AS is_refund, o.original_order_id, CAST(o.date_order AS VARCHAR) AS date_order
      FROM pos_orders o JOIN pos_sessions s ON s.id = o.session_id
      WHERE (:q IS NULL OR o.name ILIKE '%' || :q || '%' OR o.partner_name ILIKE '%' || :q || '%')
        AND (:state IS NULL OR o.state = :state)
        AND o.company = :current_company_name AND s.company = :current_company_name
      ORDER BY o.date_order DESC
actions:
  - id: create_pos_invoices
    type: server_form
    permission: pos.write
    title: Create Invoice(s)
    action: pos.orders.create_invoices
    handler: yaml_mutation
    operation: bulk_create_invoices
    submit_label: Create
    refresh: [pos_orders]
    success_message: POS invoices created.
    mutation:
      generated: [invoice_run_id]
      before_steps:
        - assign: true
          query: "SELECT 'pos-invoice-run-' || CAST(gen_random_uuid() AS VARCHAR) AS invoice_run_id"
        - query: "DROP TABLE IF EXISTS pos_invoice_selected"
        - query: "CREATE TEMP TABLE pos_invoice_selected(order_id VARCHAR)"
        - for_each:
            input: selectedIds
            as: selected_order_id
            steps:
              - query: "INSERT INTO pos_invoice_selected(order_id) VALUES (:selected_order_id)"
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL", status: 400, code: POS_INVOICE_SELECTION_REQUIRED, message: Select at least one POS order. }
      steps:
        - query: "INSERT INTO pos_invoice_runs(id, row_version, company, consolidated_billing, selected_count, invoice_count, state, created_by, created_at) SELECT :invoice_run_id, 1, :current_company_name, COALESCE(CAST(:consolidated_billing AS BOOLEAN), true), COUNT(*), 0, 'Creating', COALESCE(NULLIF(:current_user_name, ''), 'POS Operator'), TIMESTAMP '2026-01-15 08:00:00' FROM pos_orders o WHERE o.id IN (SELECT order_id FROM pos_invoice_selected) HAVING COUNT(*) = (SELECT COUNT(*) FROM pos_invoice_selected) AND SUM(CASE WHEN o.company <> :current_company_name THEN 1 ELSE 0 END) = 0 AND SUM(CASE WHEN o.state <> 'Paid' OR COALESCE(o.to_invoice, false) = false OR o.invoice_id IS NOT NULL THEN 1 ELSE 0 END) = 0 AND (COALESCE(CAST(:consolidated_billing AS BOOLEAN), true) = false OR COUNT(*) = 1 OR SUM(CASE WHEN NULLIF(TRIM(COALESCE(o.partner_name, '')), '') IS NULL THEN 1 ELSE 0 END) = 0)"
          expect_changed: true
          status: 409
          code: POS_INVOICE_SELECTION_INVALID
          message: Selected POS orders are missing, outside the current company, already invoiced, or not ready for invoicing.
        - query: |
            WITH grouped AS (
              SELECT CASE WHEN COALESCE(CAST(:consolidated_billing AS BOOLEAN), true)
                THEN COALESCE(config_id, '') || '|' || COALESCE(partner_name, '') || '|' || COALESCE(cashier_id, '')
                ELSE id END AS group_key,
                MIN(id) AS order_id, SUM(amount_total) AS amount
              FROM pos_orders
              WHERE id IN (SELECT order_id FROM pos_invoice_selected) AND company = :current_company_name
              GROUP BY group_key
            ), ranked AS (
              SELECT group_key, order_id, amount, ROW_NUMBER() OVER (ORDER BY group_key) AS group_number
              FROM grouped
            )
            INSERT INTO pos_invoices(id, order_id, invoice_number, state, amount, invoice_date)
            SELECT :invoice_run_id || '-invoice-' || CAST(group_number AS VARCHAR), order_id,
              'POS-BULK-' || :invoice_run_id || '-' || CAST(group_number AS VARCHAR), 'Posted', amount, DATE '2026-01-15'
            FROM ranked
        - query: |
            WITH grouped AS (
              SELECT CASE WHEN COALESCE(CAST(:consolidated_billing AS BOOLEAN), true)
                THEN COALESCE(config_id, '') || '|' || COALESCE(partner_name, '') || '|' || COALESCE(cashier_id, '')
                ELSE id END AS group_key
              FROM pos_orders
              WHERE id IN (SELECT order_id FROM pos_invoice_selected) AND company = :current_company_name
              GROUP BY group_key
            ), ranked AS (
              SELECT group_key, ROW_NUMBER() OVER (ORDER BY group_key) AS group_number
              FROM grouped
            )
            INSERT INTO pos_invoice_run_orders(run_id, order_id, invoice_id)
            SELECT :invoice_run_id, o.id, :invoice_run_id || '-invoice-' || CAST(r.group_number AS VARCHAR)
            FROM pos_orders o
            JOIN ranked r ON r.group_key = CASE WHEN COALESCE(CAST(:consolidated_billing AS BOOLEAN), true)
              THEN COALESCE(o.config_id, '') || '|' || COALESCE(o.partner_name, '') || '|' || COALESCE(o.cashier_id, '')
              ELSE o.id END
            WHERE o.id IN (SELECT order_id FROM pos_invoice_selected) AND o.company = :current_company_name
        - query: "UPDATE pos_orders SET state = 'Invoiced', invoice_id = (SELECT invoice_id FROM pos_invoice_run_orders WHERE run_id = :invoice_run_id AND order_id = pos_orders.id), actor_id = :current_user_id, row_version = row_version + 1 WHERE id IN (SELECT order_id FROM pos_invoice_run_orders WHERE run_id = :invoice_run_id) AND company = :current_company_name"
        - query: "UPDATE pos_invoice_runs SET invoice_count = (SELECT COUNT(DISTINCT invoice_id) FROM pos_invoice_run_orders WHERE run_id = :invoice_run_id), state = 'Created' WHERE id = :invoice_run_id"
        - query: "DROP TABLE IF EXISTS pos_invoice_selected"
      result: { query: "SELECT id, row_version, company, consolidated_billing, selected_count, invoice_count, state, created_by, CAST(created_at AS VARCHAR) AS created_at FROM pos_invoice_runs WHERE id = :invoice_run_id" }
    fields:
      - { field: consolidated_billing, label: Consolidated Billing, type: checkbox, default: true }
  - id: view_pos_order
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/order-detail
    params: { id: '{row.id}' }
  - id: create_pos_order
    type: server_form
    permission: pos.write
    title: New POS order
    action: pos.orders.create
    handler: yaml_mutation
    operation: create
    refresh: [pos_orders]
    mutation:
      operation: insert
      table: pos_orders
      fields: [name, session_id, partner_name, state, to_invoice, payment_method, client_operation_id]
      required: [name, session_id]
      defaults: { state: New, amount_total: 0, amount_tax: 0, amount_paid: 0, to_invoice: false }
      guards:
        - query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL"
          status: 401
          code: POS_ORDER_UNAUTHENTICATED
          message: Sign in before creating a POS order.
        - query: "SELECT id FROM pos_sessions WHERE id = :session_id"
          status: 404
          code: POS_SESSION_NOT_FOUND
          message: POS session not found.
        - query: "SELECT id FROM pos_sessions WHERE id = :session_id AND company = :current_company_name"
          status: 403
          code: POS_ORDER_COMPANY_FORBIDDEN
          message: POS session belongs to another company.
        - query: "SELECT id FROM pos_sessions WHERE id = :session_id AND state = 'In Progress'"
          status: 409
          message: POS orders require an open session
        - query: "SELECT 1 AS ok WHERE :client_operation_id IS NULL OR NOT EXISTS (SELECT 1 FROM pos_orders WHERE client_operation_id = :client_operation_id)"
          status: 409
          message: This cashier operation was already submitted
      steps:
        - query: "UPDATE pos_orders SET company = :current_company_name, actor_id = :current_user_id WHERE id = :id"
      result: { query: "SELECT * FROM pos_orders WHERE id = :id" }
    fields:
      - { field: name, label: Order, type: text, required: true }
      - { field: session_id, label: Session, type: text, required: true }
      - { field: partner_name, label: Customer, type: text }
      - { field: to_invoice, label: To invoice, type: checkbox }
      - { field: payment_method, label: Payment method, type: select, options: [Cash, Bank, Card, Other] }
      - { field: client_operation_id, label: Client operation ID, type: text }
  - id: pay_pos_order
    type: server_form
    permission: pos.write
    title: Register POS payment
    action: pos.orders.pay
    handler: yaml_mutation
    operation: pay
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [pos_orders]
    mutation:
      generated: [payment_id]
      guards:
        - query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL"
          status: 401
          code: POS_ORDER_UNAUTHENTICATED
          message: Sign in before registering a POS payment.
        - query: "SELECT id FROM pos_orders WHERE id = :id"
          status: 404
          code: POS_ORDER_NOT_FOUND
          message: POS order not found.
        - query: "SELECT id FROM pos_orders WHERE id = :id AND company = :current_company_name"
          status: 403
          code: POS_ORDER_COMPANY_FORBIDDEN
          message: POS order belongs to another company.
        - query: "SELECT id FROM pos_orders WHERE id = :id AND row_version = :expected_row_version"
          status: 409
          code: POS_ORDER_STALE
          message: POS order changed; reload before registering a payment.
        - query: "SELECT id FROM pos_orders WHERE id = :id AND state IN ('New', 'Paid')"
          status: 409
          message: This POS order cannot receive a payment
        - query: "SELECT 1 AS ok WHERE CAST(:payment_amount AS DECIMAL(18,2)) > 0 AND CAST(:payment_amount AS DECIMAL(18,2)) <= (SELECT amount_total - amount_paid FROM pos_orders WHERE id = :id)"
          status: 400
          message: Payment must be positive and cannot exceed the remaining balance
      steps:
        - query: "INSERT INTO pos_payments(id, order_id, method, amount, company, actor_id) SELECT :payment_id, :id, COALESCE(:payment_method, 'Cash'), CAST(:payment_amount AS DECIMAL(18,2)), company, :current_user_id FROM pos_orders WHERE id = :id AND company = :current_company_name"
        - query: "UPDATE pos_orders SET amount_paid = amount_paid + CAST(:payment_amount AS DECIMAL(18,2)), payment_method = :payment_method, actor_id = :current_user_id, state = CASE WHEN amount_paid + CAST(:payment_amount AS DECIMAL(18,2)) >= amount_total THEN 'Paid' ELSE 'New' END, row_version = row_version + 1 WHERE id = :id AND company = :current_company_name"
          expect_changed: true
          status: 409
          code: POS_ORDER_STALE
          message: POS order changed; reload before registering a payment.
      result: { query: "SELECT * FROM pos_orders WHERE id = :id" }
    fields:
      - { field: payment_amount, label: Payment amount, type: money, decimals: 2, required: true }
      - { field: payment_method, label: Payment method, type: select, options: [Cash, Bank, Card, Other], required: true }
  - id: invoice_pos_order
    type: server
    permission: pos.write
    action: pos.orders.invoice
    handler: pos_invoice
    operation: invoice
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [pos_orders]
    mutation:
      generated: [invoice_id]
      guards:
        - query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL"
          status: 401
          code: POS_ORDER_UNAUTHENTICATED
          message: Sign in before invoicing a POS order.
        - query: "SELECT id FROM pos_orders WHERE id = :id"
          status: 404
          code: POS_ORDER_NOT_FOUND
          message: POS order not found.
        - query: "SELECT id FROM pos_orders WHERE id = :id AND company = :current_company_name"
          status: 403
          code: POS_ORDER_COMPANY_FORBIDDEN
          message: POS order belongs to another company.
        - query: "SELECT id FROM pos_orders WHERE id = :id AND row_version = :expected_row_version"
          status: 409
          code: POS_ORDER_STALE
          message: POS order changed; reload before invoicing.
        - query: "SELECT id FROM pos_orders WHERE id = :id AND state = 'Paid' AND to_invoice = true AND invoice_id IS NULL"
          status: 409
          message: Only paid POS orders marked for invoicing can be invoiced
      steps:
        - query: "INSERT INTO pos_invoices(id, order_id, invoice_number, amount) VALUES(:invoice_id, :id, 'POS-' || :id, (SELECT amount_total FROM pos_orders WHERE id = :id))"
        - query: "UPDATE pos_orders SET state = 'Invoiced', invoice_id = :invoice_id, row_version = row_version + 1 WHERE id = :id AND company = :current_company_name"
          expect_changed: true
          status: 409
          code: POS_ORDER_STALE
          message: POS order changed; reload before invoicing.
      result: { query: "SELECT * FROM pos_orders WHERE id = :id" }
  - id: cancel_pos_order
    type: server
    permission: pos.write
    action: pos.orders.cancel
    handler: order_transition
    workflow: pos_orders
    operation: cancel
    refresh: [pos_orders]
  - id: send_pos_order_email
    type: server_form
    permission: pos.write
    title: Send Email
    action: pos.orders.send_email
    handler: yaml_mutation
    operation: queue_email
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    prefill: { recipient_email: '{row.customer_email}', subject: 'POS Order {row.name}', body: 'Thank you for your order, {row.partner_name}.' }
    refresh: [pos_orders]
    success_message: Email queued for delivery.
    mutation:
      generated: [email_run_id, operation_id]
      concurrency: { required: true }
      before_steps:
        - assign: true
          query: "SELECT 'pos-order-email-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS email_run_id, 'pos-order-email-op-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS operation_id FROM pos_order_email_runs WHERE order_id = :id"
      guards:
        - { query: "SELECT id FROM pos_orders WHERE id = :id", status: 404, code: POS_ORDER_NOT_FOUND, message: POS order not found. }
        - { query: "SELECT id FROM pos_orders WHERE id = :id AND company = :current_company_name", status: 403, code: POS_ORDER_COMPANY_FORBIDDEN, message: POS order belongs to another company. }
        - { query: "SELECT id FROM pos_orders WHERE id = :id AND row_version = :expected_row_version", status: 409, code: POS_ORDER_EMAIL_STALE, message: POS order changed; reload before sending email. }
        - { query: "SELECT id FROM pos_orders WHERE id = :id AND NULLIF(TRIM(COALESCE(customer_email, '')), '') IS NOT NULL", status: 409, code: POS_ORDER_EMAIL_RECIPIENT_REQUIRED, message: Add a customer email before sending this order. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_name, '')), '') IS NOT NULL", status: 403, code: POS_ORDER_EMAIL_ACTOR_REQUIRED, message: A signed-in POS operator is required to send email. }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(TRIM(CAST(:recipient_email AS VARCHAR)), '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')", status: 422, code: POS_ORDER_EMAIL_INVALID, message: Enter a valid recipient email address. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:subject AS VARCHAR))) BETWEEN 1 AND 160 AND LENGTH(TRIM(CAST(:body AS VARCHAR))) BETWEEN 1 AND 10000", status: 422, code: POS_ORDER_EMAIL_CONTENT_INVALID, message: Subject and message are required. }
      steps:
        - { query: "INSERT INTO pos_order_email_runs(id, order_id, company, recipient_email, subject, body, queued_by, state, queued_at, row_version) SELECT :email_run_id, o.id, o.company, TRIM(CAST(:recipient_email AS VARCHAR)), TRIM(CAST(:subject AS VARCHAR)), CAST(:body AS VARCHAR), :current_user_name, 'Queued', TIMESTAMP '2026-01-15 08:00:00', 1 FROM pos_orders o WHERE o.id = :id AND o.row_version = :expected_row_version", expect_changed: true, status: 409, code: POS_ORDER_EMAIL_FAILED, message: The order email could not be queued. }
        - { query: "INSERT INTO pos_operations(id, session_id, order_id, operation_id, operation_type, expected_row_version, result_payload, actor_id) SELECT :email_run_id, o.session_id, o.id, :operation_id, 'email_queued', :expected_row_version, :email_run_id, :current_user_id FROM pos_orders o WHERE o.id = :id" }
      result: { query: "SELECT id, order_id, company, recipient_email, subject, body, queued_by, state, queued_at, row_version FROM pos_order_email_runs WHERE id = :email_run_id" }
    fields:
      - { field: recipient_email, label: To, type: text, required: true, placeholder: customer@example.com }
      - { field: subject, label: Subject, type: text, required: true }
      - { field: body, label: Message, type: textarea, required: true }
