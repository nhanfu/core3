page: { id: pos-product-detail }
datasources:
  - id: pos_product_detail
    single: true
    permission: pos.read
    error_states: { forbidden: { status: 403, code: POS_PRODUCT_FORBIDDEN, message: You do not have access to this product. }, not_found: { status: 404, code: POS_PRODUCT_NOT_FOUND, message: Product not found. }, transport_error: { status: 503, code: POS_PRODUCT_UNAVAILABLE, message: POS product is temporarily unavailable. } }
    query: "SELECT id, row_version, name, barcode, category, CAST(price AS DOUBLE) AS price, CAST(tax_rate AS DOUBLE) AS tax_rate, active FROM pos_products WHERE id = :id AND CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN false ELSE true END"
actions:
  - id: edit_pos_product
    type: server_form
    permission: pos.manage
    title: Edit Product
    action: pos.products.update
    handler: yaml_mutation
    operation: update
    refresh: [pos_product_detail, pos_product_catalog]
    mutation:
      operation: update
      table: pos_products
      key_field: id
      concurrency: { required: true }
      fields: [name, barcode, category, price, tax_rate, active]
      required: [name]
      result: { query: "SELECT id, row_version, name, barcode, category, CAST(price AS DOUBLE) AS price, CAST(tax_rate AS DOUBLE) AS tax_rate, active FROM pos_products WHERE id = :id" }
      guards:
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 160", status: 422, code: POS_PRODUCT_NAME_REQUIRED, message: Product name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:price, 0) AS DECIMAL(18,2)) >= 0", status: 422, code: POS_PRODUCT_PRICE_INVALID, message: Sales Price must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:tax_rate, 0) AS DECIMAL(9,4)) BETWEEN 0 AND 100", status: 422, code: POS_PRODUCT_TAX_INVALID, message: Customer Taxes must be between 0 and 100. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_products WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: POS_PRODUCT_NAME_EXISTS, message: A product with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE :expected_row_version IS NULL OR EXISTS (SELECT 1 FROM pos_products WHERE id = :id AND row_version = TRY_CAST(:expected_row_version AS BIGINT))", status: 409, code: POS_PRODUCT_STALE, message: The product changed. Reload it before saving. }
    fields:
      - { field: name, label: Product, type: text, required: true }
      - { field: barcode, label: Barcode, type: text }
      - { field: category, label: Category, type: text }
      - { field: price, label: Sales Price, type: number }
      - { field: tax_rate, label: Customer Taxes, type: number }
      - { field: active, label: Available in Point of Sale, type: checkbox }
