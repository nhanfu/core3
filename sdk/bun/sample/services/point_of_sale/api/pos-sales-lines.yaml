page: { id: pos-sales-lines }
datasources:
  - id: pos_sales_lines
    permission: pos.read
    error_states: { transport_error: { status: 503, code: POS_SALES_LINES_UNAVAILABLE, message: Sales lines are temporarily unavailable. } }
    query: |
      SELECT l.id, l.row_version, o.name AS order_name,
        CAST(l.created_at AS VARCHAR) AS created_on, l.product_name,
        CAST(l.quantity AS DOUBLE) AS quantity,
        CAST(l.price_unit AS DOUBLE) AS unit_price,
        CAST(l.discount AS DOUBLE) AS discount,
        CAST(l.price_total AS DOUBLE) AS total,
        s.currency AS currency
      FROM pos_order_lines l
      JOIN pos_orders o ON o.id = l.order_id
      JOIN pos_sessions s ON s.id = o.session_id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
        AND (:q IS NULL OR o.name ILIKE '%' || :q || '%' OR l.product_name ILIKE '%' || :q || '%')
      ORDER BY l.created_at DESC, l.id
actions:
  - id: view_pos_sales_line
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/sales-line-detail
    params: { id: '{row.id}' }
  - id: create_pos_sales_line
    type: server_form
    permission: pos.manage
    title: New sales line
    action: pos.sales_lines.create
    handler: yaml_mutation
    operation: create
    refresh: [pos_sales_lines]
    mutation:
      generated: [line_id]
      guards:
        - { query: "SELECT id FROM pos_orders WHERE id = :order_id AND state <> 'Cancelled'", status: 409, code: POS_SALES_LINE_ORDER, message: Sales lines require an active POS order. }
        - { query: "SELECT 1 AS ok WHERE CAST(:quantity AS DECIMAL(18,3)) > 0 AND CAST(:unit_price AS DECIMAL(18,2)) >= 0 AND CAST(:discount AS DECIMAL(9,4)) BETWEEN 0 AND 100", status: 422, code: POS_SALES_LINE_VALUES, message: Quantity, price, and discount values are invalid. }
      steps:
        - { query: "INSERT INTO pos_order_lines(id, order_id, product_name, quantity, price_unit, discount, tax_rate, price_subtotal, price_tax, price_total, row_version, created_at) VALUES(:line_id, :order_id, :product_name, CAST(:quantity AS DECIMAL(18,3)), CAST(:unit_price AS DECIMAL(18,2)), CAST(:discount AS DECIMAL(9,4)), 0, ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100), 2), 0, ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100), 2), 1, TIMESTAMP '2026-01-15 00:00:00')" }
      result: { query: "SELECT * FROM pos_order_lines WHERE id = :line_id" }
    fields:
      - { field: order_id, label: Order ID, type: text, required: true }
      - { field: product_name, label: Product, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true, min: 0.001 }
      - { field: unit_price, label: Unit Price, type: number, required: true, min: 0 }
      - { field: discount, label: Discount (%), type: number, default: 0, min: 0, max: 100 }
  - id: delete_pos_sales_line
    type: server
    permission: pos.manage
    action: pos.sales_lines.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete sales line {{row.product_name}}?'
    params: { id: '{row.id}' }
    refresh: [pos_sales_lines]
    mutation:
      guards:
        - { query: "SELECT id FROM pos_order_lines WHERE id = :id", status: 404, code: POS_SALES_LINE_NOT_FOUND, message: Sales line not found. }
        - { query: "SELECT 1 AS ok FROM pos_order_lines WHERE id = :id AND row_version = :expected_row_version", status: 409, code: POS_SALES_LINE_STALE, message: Sales line changed; reload before deleting. }
      steps:
        - { query: "DELETE FROM pos_order_lines WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, code: POS_SALES_LINE_STALE }
