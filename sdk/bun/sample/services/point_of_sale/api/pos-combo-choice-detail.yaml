page: { id: pos-combo-choice-detail }
datasources:
  - id: pos_combo_choice_detail
    single: true
    permission: pos.read
    error_states: { transport_error: { status: 503, code: POS_COMBO_CHOICE_DETAIL_UNAVAILABLE, message: Combo choice details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, maximum_items, included_items, CAST(combo_price AS DOUBLE) AS combo_price, company, active FROM pos_combo_choices WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
  - id: pos_combo_choice_items
    permission: pos.read
    error_states: { transport_error: { status: 503, code: POS_COMBO_CHOICE_ITEMS_UNAVAILABLE, message: Combo choice options are temporarily unavailable. } }
    query: "SELECT id, row_version, combo_choice_id, sequence, product, CAST(original_price AS DOUBLE) AS original_price, CAST(extra_price AS DOUBLE) AS extra_price FROM pos_combo_choice_items WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND combo_choice_id = :id ORDER BY sequence, id"
actions:
  - id: back_to_pos_combo_choices
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/combo-choices

  - id: new_pos_combo_choice
    type: navigate
    permission: pos.manage
    navigate_to: /point-of-sale/combo-choices/new

  - id: edit_pos_combo_choice
    type: server_form
    permission: pos.manage
    title: Edit Combo Choice
    action: pos.combo_choices.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    prefill: state.pos_combo_choice_detail
    refresh: [pos_combo_choice_detail, pos_combo_choices, pos_combo_choice_items]
    mutation:
      operation: update
      table: pos_combo_choices
      key_field: id
      concurrency: { required: true }
      fields: [name, maximum_items, included_items, combo_price, company, active]
      required: [name, maximum_items, included_items]
      guards:
        - { query: "SELECT id FROM pos_combo_choices WHERE id = :id", status: 404, code: POS_COMBO_CHOICE_NOT_FOUND, message: Combo choice not found. }
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 120", status: 422, code: POS_COMBO_CHOICE_NAME_REQUIRED, message: Combo Choice is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(:maximum_items AS INTEGER) >= 1 AND CAST(:included_items AS INTEGER) >= 0 AND CAST(:included_items AS INTEGER) <= CAST(:maximum_items AS INTEGER) AND CAST(:combo_price AS DECIMAL(18,2)) >= 0", status: 422, code: POS_COMBO_CHOICE_VALUES_INVALID, message: Enter valid item counts and a non-negative combo price. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_combo_choices WHERE LOWER(name) = LOWER(trim(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: POS_COMBO_CHOICE_NAME_EXISTS, message: A combo choice with this name already exists. }
      result: { query: "SELECT * FROM pos_combo_choices WHERE id = :id" }
    fields:
      - { field: name, label: Combo Choice, type: text, required: true }
      - { field: maximum_items, label: Maximum items?, type: number, required: true, min: 1 }
      - { field: included_items, label: Includes items?, type: number, required: true, min: 0 }
      - { field: combo_price, label: Combo Price?, type: number, required: true, min: 0 }
      - { field: company, label: Company, type: text }
      - { field: active, label: Active, type: checkbox, default: true }

  - id: delete_pos_combo_choice
    type: server
    permission: pos.manage
    action: pos.combo_choices.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{state.id}' }
    refresh: [pos_combo_choices]
    mutation:
      operation: delete
      table: pos_combo_choices
      key_field: id
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM pos_combo_choices WHERE id = :id", status: 404, code: POS_COMBO_CHOICE_NOT_FOUND, message: Combo choice not found. }
        - { query: "SELECT 1 AS ok FROM pos_combo_choices c WHERE c.id = :id AND NOT EXISTS (SELECT 1 FROM pos_combo_choice_items i WHERE i.combo_choice_id = c.id)", status: 409, code: POS_COMBO_CHOICE_IN_USE, message: Remove combo options before deleting this combo choice. }

  - id: add_pos_combo_choice_item
    type: server_form
    permission: pos.manage
    title: Add an option
    action: pos.combo_choices.items.create
    handler: line_item
    operation: create
    domain: pos_combo_choice
    params: { id: '{state.id}' }
    refresh: [pos_combo_choice_detail, pos_combo_choices, pos_combo_choice_items]
    fields:
      - { field: product, label: Product, type: text, required: true }
      - { field: original_price, label: Original Price, type: number, default: 0, min: 0 }
      - { field: extra_price, label: Extra Price, type: number, default: 0, min: 0 }
    mutation:
      generated: [line_id]
      before_steps:
        - { query: "SELECT COALESCE(MAX(sequence), 0) + 10 AS next_sequence, 'pos-combo-choice-item-' || :id || '-' || CAST(COALESCE(MAX(sequence), 0) + 10 AS VARCHAR) AS line_id FROM pos_combo_choice_items WHERE combo_choice_id = :id", assign: true }
      guards:
        - { query: "SELECT id FROM pos_combo_choices WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The combo choice changed. Reload it before adding an option. }
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:product AS VARCHAR))) BETWEEN 1 AND 160 AND CAST(:original_price AS DECIMAL(18,2)) >= 0 AND CAST(:extra_price AS DECIMAL(18,2)) >= 0", status: 422, code: POS_COMBO_CHOICE_ITEM_INVALID, message: Enter a product and non-negative prices. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_combo_choice_items WHERE combo_choice_id = :id AND LOWER(product) = LOWER(trim(CAST(:product AS VARCHAR))))", status: 409, code: POS_COMBO_CHOICE_ITEM_EXISTS, message: This product is already an option. }
      steps:
        - { query: "INSERT INTO pos_combo_choice_items(id, combo_choice_id, row_version, sequence, product, original_price, extra_price) VALUES(:line_id, :id, 1, :next_sequence, trim(CAST(:product AS VARCHAR)), CAST(:original_price AS DECIMAL(18,2)), CAST(:extra_price AS DECIMAL(18,2)))" }
        - { query: "UPDATE pos_combo_choices SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The combo choice changed while adding an option. Reload it before saving. }
      result: { query: "SELECT * FROM pos_combo_choice_items WHERE id = :line_id" }

  - id: edit_pos_combo_choice_item
    type: server_form
    permission: pos.manage
    title: Edit option
    action: pos.combo_choices.items.update
    handler: line_item
    operation: update
    domain: pos_combo_choice
    params: { id: '{state.id}', line_id: '{row.id}' }
    prefill: row
    refresh: [pos_combo_choice_detail, pos_combo_choices, pos_combo_choice_items]
    fields:
      - { field: product, label: Product, type: text, required: true }
      - { field: original_price, label: Original Price, type: number, default: 0, min: 0 }
      - { field: extra_price, label: Extra Price, type: number, default: 0, min: 0 }
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM pos_combo_choices WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The combo choice changed. Reload before saving. }
        - { query: "SELECT id FROM pos_combo_choice_items WHERE id = :line_id AND combo_choice_id = :id AND row_version = :expected_row_version", status: 409, code: POS_COMBO_CHOICE_ITEM_STALE, message: This option changed or was deleted. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:product AS VARCHAR))) BETWEEN 1 AND 160 AND CAST(:original_price AS DECIMAL(18,2)) >= 0 AND CAST(:extra_price AS DECIMAL(18,2)) >= 0", status: 422, code: POS_COMBO_CHOICE_ITEM_INVALID, message: Enter a product and non-negative prices. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM pos_combo_choice_items WHERE combo_choice_id = :id AND LOWER(product) = LOWER(trim(CAST(:product AS VARCHAR))) AND id <> :line_id)", status: 409, code: POS_COMBO_CHOICE_ITEM_EXISTS, message: This product is already an option. }
      steps:
        - { query: "UPDATE pos_combo_choice_items SET row_version = row_version + 1, product = trim(CAST(:product AS VARCHAR)), original_price = CAST(:original_price AS DECIMAL(18,2)), extra_price = CAST(:extra_price AS DECIMAL(18,2)) WHERE id = :line_id AND combo_choice_id = :id AND row_version = :expected_row_version", expect_changed: true, code: POS_COMBO_CHOICE_ITEM_STALE, message: This option changed or was deleted. Reload before saving. }
        - { query: "UPDATE pos_combo_choices SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The combo choice changed while saving an option. Reload before saving. }
      result: { query: "SELECT * FROM pos_combo_choice_items WHERE id = :line_id" }

  - id: delete_pos_combo_choice_item
    type: server
    permission: pos.manage
    action: pos.combo_choices.items.delete
    handler: line_item
    operation: delete
    domain: pos_combo_choice
    params: { id: '{state.id}', line_id: '{row.id}' }
    confirm: 'Delete option {{row.product}}?'
    refresh: [pos_combo_choice_detail, pos_combo_choices, pos_combo_choice_items]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM pos_combo_choices WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The combo choice changed. Reload before deleting. }
        - { query: "SELECT id FROM pos_combo_choice_items WHERE id = :line_id AND combo_choice_id = :id AND row_version = :expected_row_version", status: 409, code: POS_COMBO_CHOICE_ITEM_STALE, message: This option changed or was deleted. Reload before deleting. }
      steps:
        - { query: "DELETE FROM pos_combo_choice_items WHERE id = :line_id AND combo_choice_id = :id AND row_version = :expected_row_version", expect_changed: true, code: POS_COMBO_CHOICE_ITEM_STALE, message: This option changed or was deleted. Reload before deleting. }
        - { query: "UPDATE pos_combo_choices SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The combo choice changed while deleting an option. Reload before saving. }
      result: { query: "SELECT true AS deleted, :line_id AS id" }
