page: { id: pos-cashier }
datasources:
  - id: pos_cashier_products
    single: false
    permission: pos.read
    query: |
      SELECT id, name, barcode, category,
        CAST(price AS DOUBLE) AS price,
        CAST(tax_rate AS DOUBLE) AS tax_rate
      FROM pos_products WHERE active = true
        AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR barcode ILIKE '%' || :q || '%')
      ORDER BY category, name

  - id: pos_cashier_sessions
    single: false
    permission: pos.read
    query: |
      SELECT id AS value, name || ' — ' || config AS label
      FROM pos_sessions WHERE state = 'In Progress'
      ORDER BY opened_at DESC

  - id: pos_cashier_session_stats
    single: true
    permission: pos.read
    query: |
      SELECT
        COALESCE((SELECT name FROM pos_sessions WHERE state = 'In Progress' ORDER BY opened_at DESC LIMIT 1), 'None') AS session_name,
        (SELECT COUNT(*) FROM pos_orders WHERE state = 'New' AND session_id IN (SELECT id FROM pos_sessions WHERE state = 'In Progress')) AS open_orders,
        CAST((SELECT COALESCE(SUM(amount_total), 0) FROM pos_orders WHERE state = 'Paid' AND DATE(date_order) = CURRENT_DATE) AS DOUBLE) AS total_paid,
        COALESCE((SELECT state FROM pos_sessions WHERE state = 'In Progress' ORDER BY opened_at DESC LIMIT 1), 'No active session') AS cashier_state

  - id: pos_open_tickets
    single: false
    permission: pos.write
    query: |
      SELECT o.id, o.name, o.session_id, s.name AS session_name,
        o.partner_name, o.state,
        CAST(o.amount_total AS DOUBLE) AS amount_total,
        CAST(o.amount_paid AS DOUBLE) AS amount_paid,
        o.payment_method, o.cashier_id,
        CAST(o.date_order AS VARCHAR) AS date_order
      FROM pos_orders o
      JOIN pos_sessions s ON s.id = o.session_id
      WHERE o.state = 'New' AND s.state = 'In Progress'
      ORDER BY o.date_order DESC

  - id: pos_open_ticket_options
    single: false
    permission: pos.write
    query: |
      SELECT o.id AS value, o.name || COALESCE(' — ' || o.partner_name, '') AS label
      FROM pos_orders o
      JOIN pos_sessions s ON s.id = o.session_id
      WHERE o.state = 'New' AND s.state = 'In Progress'
      ORDER BY o.date_order DESC
