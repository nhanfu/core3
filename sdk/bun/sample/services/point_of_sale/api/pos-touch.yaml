page: { id: pos-touch }

datasources:
  - id: pos_touch_session
    single: true
    permission: pos.read
    query: |
      SELECT s.id, s.name, s.state, s.config,
        CAST(s.balance_start AS DOUBLE) AS balance_start,
        CAST(COALESCE(s.opening_counted, 0) AS DOUBLE) AS opening_counted
      FROM pos_sessions s
      WHERE s.state = 'In Progress'
      ORDER BY s.opened_at DESC
      LIMIT 1

  - id: pos_touch_products
    single: false
    permission: pos.read
    query: |
      SELECT id, name, barcode, category,
        CAST(price AS DOUBLE) AS price,
        CAST(tax_rate AS DOUBLE) AS tax_rate
      FROM pos_products
      WHERE active = true
        AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR barcode ILIKE '%' || :q || '%')
      ORDER BY category, name

  - id: pos_touch_sessions
    single: false
    permission: pos.read
    query: |
      SELECT id, name, config, state,
        CAST(balance_start AS DOUBLE) AS balance_start,
        CAST(COALESCE(opening_counted, 0) AS DOUBLE) AS opening_counted
      FROM pos_sessions
      WHERE state = 'In Progress'
      ORDER BY opened_at DESC

  - id: pos_touch_open_orders
    single: false
    permission: pos.read
    query: |
      SELECT o.id, o.name, o.partner_name, o.state,
        CAST(o.amount_total AS DOUBLE) AS amount_total,
        CAST(o.amount_paid AS DOUBLE) AS amount_paid,
        (SELECT l.product_name FROM pos_order_lines l WHERE l.order_id = o.id ORDER BY l.id LIMIT 1) AS line_product_name,
        (SELECT p.id FROM pos_products p WHERE p.name = (SELECT l.product_name FROM pos_order_lines l WHERE l.order_id = o.id ORDER BY l.id LIMIT 1) LIMIT 1) AS line_product_id,
        (SELECT CAST(l.quantity AS DOUBLE) FROM pos_order_lines l WHERE l.order_id = o.id ORDER BY l.id LIMIT 1) AS line_quantity,
        (SELECT CAST(l.price_unit AS DOUBLE) FROM pos_order_lines l WHERE l.order_id = o.id ORDER BY l.id LIMIT 1) AS line_price_unit,
        (SELECT CAST(COALESCE(l.tax_rate, 0) AS DOUBLE) FROM pos_order_lines l WHERE l.order_id = o.id ORDER BY l.id LIMIT 1) AS line_tax_rate,
        (SELECT CAST(COALESCE(l.price_total, l.price_subtotal) AS DOUBLE) FROM pos_order_lines l WHERE l.order_id = o.id ORDER BY l.id LIMIT 1) AS line_total
      FROM pos_orders o
      JOIN pos_sessions s ON s.id = o.session_id
      WHERE o.state = 'New' AND s.state = 'In Progress'
      ORDER BY o.date_order DESC

  - id: pos_touch_payment_methods
    single: false
    permission: pos.read
    query: |
      SELECT name AS value, name AS label
      FROM pos_payment_methods
      WHERE active = true
      GROUP BY name
      ORDER BY CASE WHEN name = 'Cash' THEN 0 ELSE 1 END, name
