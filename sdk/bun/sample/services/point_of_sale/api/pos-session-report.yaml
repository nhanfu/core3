page: { id: pos-session-report }
datasources:
  - id: pos_session_report_sessions
    permission: pos.read
    query: "SELECT id AS value, name || ' — ' || config AS label FROM pos_sessions ORDER BY opened_at DESC, name"
  - id: pos_session_report_wizard
    single: true
    permission: pos.read
    error_states: { transport_error: { status: 503, code: POS_SESSION_REPORT_UNAVAILABLE, message: Session report options are temporarily unavailable. } }
    query: "SELECT id, 'Session Report' AS name, session_id, add_per_employee, state, CAST(generated_at AS VARCHAR) AS generated_at FROM pos_session_report_wizards WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = COALESCE(:id, 'pos-session-report-demo-001')"
actions:
  - id: print_pos_session_report
    type: client
    permission: pos.read
    script: |
      // js
      async () => {
        window.print()
      }
  - id: cancel_pos_session_report
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale
