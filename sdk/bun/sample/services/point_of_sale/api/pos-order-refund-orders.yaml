page: { id: pos-order-refund-orders }
datasources:
  - id: pos_refund_order_states
    single: false
    permission: pos.read
    query: "SELECT value, label FROM (VALUES ('New', 'New'), ('Paid', 'Paid'), ('Invoiced', 'Invoiced'), ('Cancelled', 'Cancelled')) states(value, label)"
  - id: pos_order_refund_orders
    single: false
    permission: pos.read
    error_states:
      unauthorized: { status: 401, code: POS_REFUND_ORDERS_UNAUTHORIZED, message: Sign in to view refund orders. }
      forbidden: { status: 403, code: POS_REFUND_ORDERS_FORBIDDEN, message: You do not have access to these refund orders. }
      transport_error: { status: 503, code: POS_REFUND_ORDERS_UNAVAILABLE, message: Refund orders are temporarily unavailable. }
    query: "SELECT o.id, o.row_version, o.original_order_id, o.name, o.session_id, s.name AS session_name, o.partner_name, o.state, o.amount_total, COALESCE(o.amount_tax, 0) AS amount_tax, o.amount_paid, o.payment_method, o.company, o.receipt_number, CAST(o.date_order AS VARCHAR) AS date_order FROM pos_orders o JOIN pos_sessions s ON s.id = o.session_id WHERE o.original_order_id = :order_id AND o.company = :current_company_name AND s.company = :current_company_name AND EXISTS (SELECT 1 FROM pos_orders source WHERE source.id = :order_id AND source.company = :current_company_name) AND (:q IS NULL OR o.name ILIKE '%' || :q || '%' OR COALESCE(o.partner_name, '') ILIKE '%' || :q || '%') AND (:state IS NULL OR o.state = :state) ORDER BY o.date_order DESC, o.id"
actions:
  - id: view_pos_refund_order
    type: navigate
    permission: pos.read
    navigate_to: /point-of-sale/order-detail
    params: { id: '{row.id}' }
