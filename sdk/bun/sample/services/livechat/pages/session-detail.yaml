title: Livechat Session
page: { id: livechat-session-detail, route: /livechat-session-detail, breadcrumb: [Website, Live Chat, Sessions, Session], auth: { require: [livechat.read] } }

components:
  - type: OdooFormView
    source: livechat_session_detail
    title_field: visitor_display
    header_actions:
      - { id: wait_livechat_session_detail, label: Wait, variant: secondary, show_if: "record.status === 'In Progress'" }
      - { id: resume_livechat_session_detail, label: Resume, variant: secondary, show_if: "record.status === 'Waiting for Customer'" }
      - { id: help_livechat_session_detail, label: Need Help, variant: secondary, show_if: "record.status === 'In Progress' || record.status === 'Waiting for Customer'" }
      - { id: join_livechat_session_detail, label: Join, variant: primary, show_if: "record.status === 'Looking for Help'" }
      - { id: close_livechat_session_detail, label: Close, variant: danger, show_if: "record.status === 'In Progress' || record.status === 'Waiting for Customer' || record.status === 'Looking for Help'" }
      - { id: email_livechat_session_transcript, label: Email transcript, variant: secondary, show_if: "record.status === 'Closed'" }
      - { id: add_livechat_session_tag, label: Add Tag, variant: secondary }
      - { id: remove_livechat_session_tag, label: Remove Tag, variant: secondary }
    fields:
      - { field: visitor_display, label: Visitor }
      - { field: channel_name, label: Channel }
      - { field: operator_name, label: Operator }
      - { field: status_label, label: Status, type: StatusChip }
      - { field: outcome, label: Outcome }
      - { field: tag_names, label: Conversation Tags }
      - { field: duration_label, label: Duration }
      - { field: message_count, label: Messages }
      - { field: country_name, label: Country }
      - { field: rating, label: Satisfaction rating }
      - { field: started_label, label: Started }
      - { field: ended_at, label: Ended }
      - { field: transcript_last_sent_to, label: Last transcript recipient }
      - { field: transcript_last_sent_at, label: Last transcript sent }
    message_source: livechat_session_messages
    chatter_label: Conversation
    chatter_empty: No messages in this conversation yet.
    message_label: Send message
    message_action: send_livechat_session_message
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at

actions:
  - { id: wait_livechat_session_detail, type: server, permission: livechat.write, action: livechat.sessions.wait, handler: order_transition, workflow: livechat_sessions, operation: wait, params: { id: '{state.id}' }, refresh: [livechat_session_detail, livechat_session_messages] }
  - { id: resume_livechat_session_detail, type: server, permission: livechat.write, action: livechat.sessions.resume, handler: order_transition, workflow: livechat_sessions, operation: resume, params: { id: '{state.id}' }, refresh: [livechat_session_detail, livechat_session_messages] }
  - { id: help_livechat_session_detail, type: server, permission: livechat.write, action: livechat.sessions.help, handler: order_transition, workflow: livechat_sessions, operation: help, params: { id: '{state.id}' }, refresh: [livechat_session_detail, livechat_session_messages] }
  - { id: join_livechat_session_detail, type: server, permission: livechat.write, action: livechat.help_sessions.join, handler: order_transition, workflow: livechat_sessions, operation: join, params: { id: '{state.id}' }, refresh: [livechat_session_detail, livechat_session_messages] }
  - { id: close_livechat_session_detail, type: server, permission: livechat.write, action: livechat.sessions.close, handler: order_transition, workflow: livechat_sessions, operation: close, params: { id: '{state.id}' }, refresh: [livechat_session_detail, livechat_session_messages] }
