title: Sessions
page: { id: livechat-analysis, route: /livechat-analysis, breadcrumb: [Website, Live Chat, Reporting, Sessions], auth: { require: [livechat.read] } }

components:
  - type: ListView
    variant: odoo
    source: livechat_report_sessions
    search: { label: Search Report, placeholder: 'Search agents, channels, countries, or visitors...' }
    date_range:
      label: Date
      from_field: from_date
      to_field: to_date
      default_preset: last_month
      presets: [last_month, week, month, year]
      preset_labels: { last_month: 'Date: Last month', week: 'Date: Last week', month: 'Date: This month', year: 'Date: This year' }
    filters:
      - { field: rating_text, label: Rating, options: [Happy, None, Neutral, Unhappy] }
      - { field: session_outcome, label: Status, options: [Success, Escalated, 'Never Answered', 'No one Available'] }
      - { field: channel_name, label: Channel, options: [Website Support] }
      - { field: country_name, label: Country, options: ['United States', Belgium, France] }
    group_by:
      - { field: channel_name, label: Channel }
      - { field: agent_name, label: Agent }
      - { field: rating_text, label: Rating }
      - { field: country_name, label: Country }
      - { field: session_outcome, label: Status }
      - { field: start_hour, label: 'Hour of Day' }
      - { field: day_name, label: 'Day of Week' }
      - { field: start_date_month, label: Date }
    view_navigation: tabs
    views:
      - id: graph
        label: Graph
        icon: graph
        category_field: start_date_label
        date_field: start_date
        measure_field: session_count
        measure_label: Sessions
        series_field: rating_text
        series:
          - { value: Happy, label: Happy, color: blue }
          - { value: None, label: None, color: red }
          - { value: Unhappy, label: Unhappy, color: teal }
          - { value: Neutral, label: Neutral, color: amber }
        measures:
          - { field: session_count, label: Sessions, aggregate: sum }
          - { field: time_to_answer, label: 'Response Time (hh:mm:ss)', aggregate: avg }
          - { field: duration, label: 'Duration (min)', aggregate: avg }
          - { field: rating, label: 'Rating (%)', aggregate: avg }
          - { field: number_of_calls, label: '# of calls', aggregate: sum }
          - { field: call_duration_hour, label: 'Call Duration', aggregate: avg }
        type: line
      - id: pivot
        label: Pivot
        icon: pivot
        show_leaf_rows: false
        pivot:
          fields:
            - { field: channel_name, column: Channel }
            - { field: agent_name, column: Agent }
            - { field: start_date, column: 'Start Date of session', type: date }
            - { field: start_date_month, column: Date }
            - { field: start_hour, column: 'Hour of start Date of session' }
            - { field: day_name, column: 'Day of the Week' }
            - { field: country_name, column: 'Country of the visitor' }
            - { field: language_name, column: Language }
            - { field: rating_text, column: 'Satisfaction Rate' }
            - { field: session_outcome, column: 'Session Outcome' }
            - { field: session_count, column: Sessions }
            - { field: time_to_answer, column: 'Response Time (hh:mm:ss)' }
            - { field: duration, column: 'Duration (min)' }
            - { field: rating, column: 'Rating (%)' }
            - { field: number_of_calls, column: '# of calls' }
            - { field: call_duration_hour, column: 'Call Duration' }
            - { field: nbr_message, column: 'Messages per Session' }
          default:
            rows: [agent_name]
            columns: [rating_text]
            measures:
              - { field: session_count, aggregate: sum, column: Sessions }
              - { field: time_to_answer, aggregate: avg, column: 'Response Time (hh:mm:ss)' }
              - { field: duration, aggregate: avg, column: 'Duration (min)' }
              - { field: rating, aggregate: avg, column: 'Rating (%)' }
              - { field: number_of_calls, aggregate: sum, column: '# of calls' }
              - { field: call_duration_hour, aggregate: avg, column: 'Call Duration' }
    show_pager: false
    empty_state:
      title: No data yet!
      description: 'Track and improve live chat performance with insights on session activity, response times, customer ratings, and call interactions.'
