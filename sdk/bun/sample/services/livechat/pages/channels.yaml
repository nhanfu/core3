title: Live Chat Channels
page: { id: livechat, route: /livechat, breadcrumb: [Website, Live Chat, Channels], auth: { require: [livechat.read] } }

components:
  - type: ListView
    variant: odoo
    source: livechat_channels
    create_action: create_livechat_channel
    create_label: New
    search: { label: Search channels, placeholder: Search... }
    view_navigation: tabs
    views:
      - id: card
        label: Kanban
        icon: dashboard
        mobile: true
        group_by: active_label
        card:
          title: name
          subtitle: session_summary
          fields:
            - { field: join_label, label: '' }
            - { field: rating_summary, label: '' }
      - { id: form, label: Form, icon: form, mobile: false }
    form_view: { page: apps/services/livechat/pages/channel-detail.yaml, side_panel: false }
    row_key: id
    row_open_action: view_livechat_channel
    row_double_click_action: view_livechat_channel
    row_actions: menu
    columns:
      - { field: name, label: Channel, type: PrimaryEntityCell, mobile: true }
      - { field: session_summary, label: Sessions, mobile: true }
      - { field: join_label, label: '', mobile: true }
      - { field: rating_summary, label: '', mobile: true }
      - { field: active_label, label: Active, optional: hide }
      - { field: id, label: '', sortable: false, actions: [{ id: view_livechat_channel, label: Configure, icon: settings }, { id: join_livechat_channel, label: Join, icon: user-plus, show_if: 'row.joined === false' }, { id: leave_livechat_channel, label: Leave, icon: user-minus, show_if: 'row.joined === true' }] }
    page_size: 50
    empty_state: { title: No live chat channels found, description: Create a channel to start chatting with website visitors. }
