title: Livechat Sessions
page: { id: livechat-sessions, route: /livechat-sessions, breadcrumb: [Website, Live Chat, Sessions], auth: { require: [livechat.read] } }

components:
  - type: ListView
    variant: odoo
    source: livechat_sessions
    search: { label: Search sessions, placeholder: 'Search visitor, operator, or channel...' }
    filters: [{ field: session_date, label: Session Date, options: [{ id: last_30_days, label: Last 30 Days }, { id: all, label: All Sessions }] }]
    view_navigation: tabs
    views:
      - id: card
        label: Kanban
        icon: dashboard
        card:
          title: visitor_display
          subtitle: session_date_label
          image_field: avatar_url
          fields:
            - { field: duration_label, label: Duration }
            - { field: message_label, label: Messages }
            - { field: status_label, label: Status }
            - { field: country_name, label: Country }
      - { id: list, label: List, icon: table, mobile: false }
    page_size: 50
    row_key: id
    row_open_action: view_livechat_session
    row_double_click_action: view_livechat_session
    form_view: { page: apps/services/livechat/pages/session-detail.yaml, side_panel: true }
    row_actions: menu
    empty_state: { title: No live chat sessions, description: Conversations from the selected period will appear here. }
    columns:
      - { field: visitor_display, label: Visitor, type: PrimaryEntityCell }
      - { field: started_label, label: Date }
      - { field: duration_label, label: Duration }
      - { field: message_count, label: Messages, align: right }
      - { field: status_label, label: Status, type: StatusChip }
      - { field: country_name, label: Country }
      - { field: channel_name, label: Channel }
