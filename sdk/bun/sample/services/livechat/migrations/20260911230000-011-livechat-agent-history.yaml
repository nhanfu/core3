      CREATE TABLE IF NOT EXISTS livechat_agent_history (
        id VARCHAR PRIMARY KEY,
        agent_name VARCHAR NOT NULL,
        session_date TIMESTAMP NOT NULL,
        session_start_hour VARCHAR NOT NULL,
        session_week_day VARCHAR NOT NULL,
        channel_name VARCHAR NOT NULL,
        country_name VARCHAR NOT NULL,
        expertise_names VARCHAR NOT NULL DEFAULT '',
        tag_names VARCHAR NOT NULL DEFAULT '',
        session_outcome VARCHAR NOT NULL,
        help_status VARCHAR,
        rating_text VARCHAR,
        session_count INTEGER NOT NULL DEFAULT 1,
        response_time_hour DOUBLE NOT NULL DEFAULT 0,
        session_duration_hour DOUBLE NOT NULL DEFAULT 0,
        rating DOUBLE,
        call_count INTEGER NOT NULL DEFAULT 0,
        call_percentage DOUBLE NOT NULL DEFAULT 0,
        call_duration_hour DOUBLE NOT NULL DEFAULT 0
      );
