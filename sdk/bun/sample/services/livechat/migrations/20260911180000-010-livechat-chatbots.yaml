version: 0.0.10
kind: data
description: Add deterministic Odoo Live Chat chatbot scripts, steps, and answers
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS livechat_chatbots (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        title VARCHAR NOT NULL UNIQUE,
        active BOOLEAN NOT NULL DEFAULT TRUE,
        operator_name VARCHAR NOT NULL DEFAULT '',
        livechat_channel_count INTEGER NOT NULL DEFAULT 0,
        first_step_warning VARCHAR NOT NULL DEFAULT '',
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
      CREATE TABLE IF NOT EXISTS livechat_bot_steps (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        chatbot_id VARCHAR NOT NULL REFERENCES livechat_chatbots(id),
        sequence INTEGER NOT NULL,
        title VARCHAR NOT NULL,
        message VARCHAR NOT NULL DEFAULT '',
        step_type VARCHAR NOT NULL,
        operator_expertise_names VARCHAR NOT NULL DEFAULT '',
        triggering_answer_names VARCHAR NOT NULL DEFAULT '',
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        UNIQUE(chatbot_id, sequence)
      );
      CREATE TABLE IF NOT EXISTS livechat_bot_answers (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        step_id VARCHAR NOT NULL REFERENCES livechat_bot_steps(id),
        sequence INTEGER NOT NULL,
        name VARCHAR NOT NULL,
        redirect_link VARCHAR NOT NULL DEFAULT '',
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        UNIQUE(step_id, sequence)
      );
