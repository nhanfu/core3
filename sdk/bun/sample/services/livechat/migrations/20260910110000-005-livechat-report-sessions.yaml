      CREATE TABLE IF NOT EXISTS livechat_report_sessions (
        id VARCHAR PRIMARY KEY,
        channel_id VARCHAR NOT NULL,
        channel_name VARCHAR NOT NULL,
        visitor_name VARCHAR,
        agent_name VARCHAR,
        start_date TIMESTAMP NOT NULL,
        start_hour VARCHAR NOT NULL,
        day_name VARCHAR NOT NULL,
        country_name VARCHAR,
        language_name VARCHAR,
        rating INTEGER,
        rating_text VARCHAR,
        session_outcome VARCHAR NOT NULL,
        session_count INTEGER NOT NULL DEFAULT 1,
        response_time DECIMAL(18,6) NOT NULL DEFAULT 0,
        duration DECIMAL(18,2) NOT NULL DEFAULT 0,
        number_of_calls INTEGER NOT NULL DEFAULT 0,
        call_duration_hour DECIMAL(18,2) NOT NULL DEFAULT 0,
        nbr_message INTEGER NOT NULL DEFAULT 0,
        handled_by_agent INTEGER NOT NULL DEFAULT 0,
        handled_by_bot INTEGER NOT NULL DEFAULT 0
      );
