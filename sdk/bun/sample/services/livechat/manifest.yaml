id: livechat
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  livechat:
    path: /livechat
    label: Live Chat
    icon: message
    permission: livechat.read
  groups:
    - id: conversations
      label: Conversations
      items:
        - { path: /livechat, label: Channels, icon: message, permission: livechat.read }
        - { path: /livechat-sessions, label: Sessions, icon: users, permission: livechat.read }
        - { path: /livechat-sessions/help, label: Looking for Help, icon: help, permission: livechat.read }
    - id: reporting
      label: Reporting
      items:
        - { path: /livechat/agent-analysis, label: Agents, icon: users, permission: livechat.read }
        - { path: /livechat-analysis, label: Sessions, icon: chart, permission: livechat.read }
    - id: configuration
      label: Configuration
      items:
        - { path: /livechat/canned-responses, label: Canned Responses, icon: message, permission: livechat.read }
        - { path: /livechat/tags, label: Tags, icon: tag, permission: livechat.read }
        - { path: /livechat/expertise, label: Expertise, icon: users, permission: livechat.read }
        - { path: /livechat/chatbots, label: Chatbots, icon: bot, permission: livechat.manage }
    - id: technical
      label: Technical
      items:
        - { path: /livechat/member-history, label: Member History, icon: history, permission: livechat.technical }
        - { path: /livechat/technical/ongoing-sessions, label: Ongoing Sessions, icon: message, permission: livechat.manage }
        - { path: /livechat/technical/escalated-sessions, label: Escalated Sessions, icon: message, permission: livechat.manage }
