page: { id: livechat-technical-handled-by-bot-session-detail }

datasources:
  - id: livechat_technical_handled_by_bot_session_detail
    single: true
    permission: livechat.read
    error_states:
      unauthorized: { status: 401, code: LIVECHAT_HANDLED_BY_BOT_SESSION_DETAIL_UNAUTHORIZED, message: Sign in to view this session. }
      forbidden: { status: 403, code: LIVECHAT_HANDLED_BY_BOT_SESSION_DETAIL_FORBIDDEN, message: You do not have permission to view this session. }
      transport_error: { status: 503, code: LIVECHAT_HANDLED_BY_BOT_SESSION_DETAIL_UNAVAILABLE, message: This session is temporarily unavailable. }
    query: |
      SELECT id, row_version, CAST(session_date AS VARCHAR) AS session_date,
        customer_name, participant_name, rating_text, rating_feedback
      FROM livechat_technical_handled_by_bot_sessions
      WHERE status = 'ongoing' AND handled_by_bot = TRUE
        AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END
        AND id = :id
