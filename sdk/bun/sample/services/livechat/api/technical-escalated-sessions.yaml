page: { id: livechat-technical-escalated-sessions }

datasources:
  - id: livechat_technical_escalated_sessions
    single: false
    permission: livechat.read
    error_states:
      unauthorized: { status: 401, code: LIVECHAT_ESCALATED_SESSIONS_UNAUTHORIZED, message: Sign in to view escalated Live Chat sessions. }
      forbidden: { status: 403, code: LIVECHAT_ESCALATED_SESSIONS_FORBIDDEN, message: You do not have permission to view escalated Live Chat sessions. }
      transport_error: { status: 503, code: LIVECHAT_ESCALATED_SESSIONS_UNAVAILABLE, message: Escalated Live Chat sessions are temporarily unavailable. }
    query: |
      SELECT id, row_version, CAST(session_date AS VARCHAR) AS session_date,
        strftime(session_date, '%Y-%m') AS session_date_month,
        customer_name, participant_name, agents_name, requesting_agent_name,
        providing_agent_name, chatbot_name, country_name, language_name,
        expertise_name, tag_names, channel_name,
        CAST(FLOOR(CAST(ROUND(duration_hour * 3600) AS INTEGER) / 3600.0) AS INTEGER) || ':' ||
          LPAD(CAST(CAST(FLOOR((CAST(ROUND(duration_hour * 3600) AS INTEGER) % 3600) / 60.0) AS INTEGER) AS VARCHAR), 2, '0') || ':' ||
          LPAD(CAST(CAST(ROUND(duration_hour * 3600) AS INTEGER) % 60 AS VARCHAR), 2, '0') AS duration_display,
        message_count, rating_text, rating_feedback, status, is_escalated
      FROM livechat_technical_escalated_sessions
      WHERE status = 'ongoing'
        AND is_escalated = TRUE
        AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found', 'no_results') THEN FALSE ELSE TRUE END
        AND (:q IS NULL OR customer_name ILIKE '%' || :q || '%' OR agents_name ILIKE '%' || :q || '%'
          OR requesting_agent_name ILIKE '%' || :q || '%' OR providing_agent_name ILIKE '%' || :q || '%'
          OR country_name ILIKE '%' || :q || '%' OR language_name ILIKE '%' || :q || '%'
          OR expertise_name ILIKE '%' || :q || '%' OR channel_name ILIKE '%' || :q || '%')
        AND (:status IS NULL OR status = :status)
        AND (:escalated IS NULL OR is_escalated = CAST(:escalated AS BOOLEAN))
        AND (:country_name IS NULL OR country_name = :country_name)
        AND (:rating_text IS NULL OR (:rating_text = 'Unrated' AND rating_text = '') OR rating_text = :rating_text)
        AND (:session_date IS NULL OR :session_date = 'all' OR (
          (:session_date = 'last_24_hours' AND session_date >= CURRENT_TIMESTAMP - INTERVAL '24' HOUR)
          OR (:session_date = 'last_7_days' AND session_date >= CURRENT_TIMESTAMP - INTERVAL '7' DAY)
          OR (:session_date = 'last_30_days' AND session_date >= CURRENT_TIMESTAMP - INTERVAL '30' DAY)
          OR (:session_date = 'last_365_days' AND session_date >= CURRENT_TIMESTAMP - INTERVAL '365' DAY)))
      ORDER BY session_date DESC, id DESC

actions:
  - id: view_livechat_technical_escalated_session
    type: navigate
    permission: livechat.manage
    navigate_to: /livechat/technical/escalated-sessions/detail
    params: { id: '{row.id}' }
