page: { id: livechat-technical-handled-by-agent-sessions }

datasources:
  - id: livechat_technical_handled_by_agent_sessions
    single: false
    permission: livechat.read
    error_states:
      unauthorized: { status: 401, code: LIVECHAT_HANDLED_BY_AGENT_SESSIONS_UNAUTHORIZED, message: Sign in to view sessions handled by an agent. }
      forbidden: { status: 403, code: LIVECHAT_HANDLED_BY_AGENT_SESSIONS_FORBIDDEN, message: You do not have permission to view sessions handled by an agent. }
      transport_error: { status: 503, code: LIVECHAT_HANDLED_BY_AGENT_SESSIONS_UNAVAILABLE, message: Sessions handled by an agent are temporarily unavailable. }
    query: |
      SELECT id, row_version, CAST(session_date AS VARCHAR) AS session_date,
        customer_name, participant_name, agents_name, country_name, language_name,
        expertise_name,
        CAST(FLOOR(CAST(ROUND(duration_hour * 3600) AS INTEGER) / 3600.0) AS INTEGER) || ':' ||
          LPAD(CAST(CAST(FLOOR((CAST(ROUND(duration_hour * 3600) AS INTEGER) % 3600) / 60.0) AS INTEGER) AS VARCHAR), 2, '0') || ':' ||
          LPAD(CAST(CAST(ROUND(duration_hour * 3600) AS INTEGER) % 60 AS VARCHAR), 2, '0') AS duration_display,
        message_count, rating_text, status, handled_by_agent
      FROM livechat_technical_handled_by_agent_sessions
      WHERE status = 'ongoing' AND handled_by_agent = TRUE
        AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'no_results', 'not_found') THEN FALSE ELSE TRUE END
        AND (:q IS NULL OR customer_name ILIKE '%' || :q || '%' OR agents_name ILIKE '%' || :q || '%'
          OR country_name ILIKE '%' || :q || '%' OR language_name ILIKE '%' || :q || '%'
          OR expertise_name ILIKE '%' || :q || '%')
        AND (:country_name IS NULL OR country_name = :country_name)
        AND (:rating_text IS NULL OR (:rating_text = 'Unrated' AND rating_text = '') OR rating_text = :rating_text)
      ORDER BY session_date DESC, id

actions:
  - id: view_livechat_technical_handled_by_agent_session
    type: navigate
    permission: livechat.manage
    navigate_to: /livechat/technical/ongoing-sessions/handled-by-agent/detail
    params: { id: '{row.id}' }
