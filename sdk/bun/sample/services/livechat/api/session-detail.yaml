page: { id: livechat-session-detail }

datasources:
  - id: livechat_session_detail
    permission: livechat.read
    single: true
    error_states: { transport_error: { status: 503, code: LIVECHAT_SESSION_DETAIL_UNAVAILABLE, message: Live chat session details are temporarily unavailable. } }
    query: |
      SELECT id, row_version, channel_id, channel_name, visitor_name,
        COALESCE(NULLIF(visitor_name, ''), 'Visitor') AS visitor_display,
        operator_name, status, outcome, duration_minutes, rating, COALESCE(message_count, 0) AS message_count,
        country_name, avatar_url,
        COALESCE((SELECT string_agg(t.name, ', ' ORDER BY t.name)
          FROM livechat_session_tag_rel rel
          JOIN livechat_tags t ON t.id = rel.tag_id
          WHERE rel.session_id = livechat_sessions.id), '') AS tag_names,
        COALESCE((SELECT string_agg(m.member_name, ', ' ORDER BY m.member_type, m.member_name)
          FROM livechat_session_members m
          WHERE m.session_id = livechat_sessions.id), '') AS member_names,
        COALESCE((SELECT COUNT(*) FROM livechat_session_members m
          WHERE m.session_id = livechat_sessions.id), 0) AS member_count,
        CAST(started_at AS VARCHAR) AS started_label,
        CAST(duration_minutes AS VARCHAR) AS duration_label,
        CASE
          WHEN status = 'Closed' THEN COALESCE(outcome, 'Success')
          WHEN status = 'Looking for Help' THEN 'Escalated'
          WHEN status = 'Waiting for Customer' THEN 'Waiting'
          ELSE 'Never Answered'
        END AS status_label,
        CAST(started_at AS VARCHAR) AS started_at, CAST(ended_at AS VARCHAR) AS ended_at,
        COALESCE((SELECT d.recipient_email FROM livechat_transcript_deliveries d
          WHERE d.session_id = livechat_sessions.id ORDER BY d.requested_at DESC, d.id DESC LIMIT 1), '') AS transcript_last_sent_to,
        COALESCE((SELECT CAST(d.requested_at AS VARCHAR) FROM livechat_transcript_deliveries d
          WHERE d.session_id = livechat_sessions.id ORDER BY d.requested_at DESC, d.id DESC LIMIT 1), '') AS transcript_last_sent_at,
        COALESCE((SELECT COUNT(*) FROM livechat_transcript_deliveries d WHERE d.session_id = livechat_sessions.id), 0) AS transcript_delivery_count
      FROM livechat_sessions
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END = TRUE
        AND (COALESCE(:view_scope, 'all') = 'all' OR operator_id = :current_user_id)
        AND id = :id
  - id: livechat_session_tag_options
    single: false
    permission: livechat.read
    error_states:
      transport_error: { status: 503, code: LIVECHAT_SESSION_TAGS_UNAVAILABLE, message: Conversation tags are temporarily unavailable. }
    query: |
      SELECT t.id AS value, t.id, t.name AS label, t.name, t.color,
        CASE WHEN rel.tag_id IS NULL THEN FALSE ELSE TRUE END AS selected
      FROM livechat_tags t
      LEFT JOIN livechat_session_tag_rel rel ON rel.tag_id = t.id AND rel.session_id = :id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found', 'no_results') THEN FALSE ELSE TRUE END = TRUE
      ORDER BY t.name, t.id
  - id: livechat_session_tags
    single: false
    permission: livechat.read
    query: |
      SELECT t.id, t.name, t.color,
        CASE WHEN rel.tag_id IS NULL THEN FALSE ELSE TRUE END AS selected
      FROM livechat_tags t
      LEFT JOIN livechat_session_tag_rel rel ON rel.tag_id = t.id AND rel.session_id = :id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found', 'no_results') THEN FALSE ELSE TRUE END = TRUE
      ORDER BY t.name, t.id
  - id: livechat_session_messages
    single: false
    permission: livechat.read
    query: |
      SELECT m.id, m.session_id, m.author_name, m.author_type, m.body AS detail,
        m.action, m.action_label, CAST(m.created_at AS VARCHAR) AS created_at
      FROM livechat_session_messages m
      JOIN livechat_sessions s ON s.id = m.session_id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END
        AND m.session_id = :id
        AND (COALESCE(:view_scope, 'all') = 'all' OR s.operator_id = :current_user_id)
      ORDER BY m.created_at, m.id
  - id: livechat_session_members
    single: false
    permission: livechat.read
    error_states:
      transport_error: { status: 503, code: LIVECHAT_SESSION_MEMBERS_UNAVAILABLE, message: Conversation members are temporarily unavailable. }
    query: |
      SELECT m.id, m.session_id, m.member_id, m.member_name, m.member_type,
        m.email, m.language_names, m.expertise_names, m.invited_by,
        CAST(m.joined_at AS VARCHAR) AS joined_at
      FROM livechat_session_members m
      JOIN livechat_sessions s ON s.id = m.session_id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END
        AND m.session_id = :id
        AND (COALESCE(:view_scope, 'all') = 'all' OR s.operator_id = :current_user_id)
      ORDER BY m.member_type, m.member_name, m.id
  - id: livechat_session_invite_options
    single: false
    permission: livechat.write
    error_states:
      transport_error: { status: 503, code: LIVECHAT_SESSION_INVITE_OPTIONS_UNAVAILABLE, message: Available operators are temporarily unavailable. }
    query: |
      SELECT u.id AS value, u.id, u.livechat_name AS label, u.livechat_name AS member_name,
        u.spoken_languages AS language_names, u.expertise_names,
        u.livechat_name || ' · ' || COALESCE(NULLIF(u.spoken_languages, ''), 'No languages') AS option_label
      FROM livechat_user_settings u
      WHERE u.livechat_enabled = TRUE
        AND u.id <> COALESCE(:current_user_id, '')
        AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found', 'no_results') THEN FALSE ELSE TRUE END
        AND NOT EXISTS (
          SELECT 1 FROM livechat_session_members m
          WHERE m.session_id = :id AND m.member_id = u.id
        )
      ORDER BY u.livechat_name, u.id

actions:
  - id: send_livechat_session_history
    type: server_form
    permission: livechat.write
    title: Send Page History
    description: Sends the visitor page history through Odoo's /im_livechat/history route; embedded clients use /im_livechat/cors/history.
    action: /im_livechat/history
    handler: yaml_mutation
    operation: history
    params: { id: '{state.id}' }
    success_message: Page history sent to the visitor.
    refresh: [livechat_session_messages]
    fields:
      - { field: partner_id, label: Visitor Partner, type: text, required: true, placeholder: visitor-demo-a }
      - { field: page_history, label: Pages Visited, type: textarea, required: false, placeholder: '[/shop, /contactus]' }
    mutation:
      generated: [history_id]
      guards:
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id", status: 404, code: LIVECHAT_SESSION_NOT_FOUND, message: Live Chat session was not found. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND (COALESCE(:view_scope, 'all') = 'all' OR operator_id = :current_user_id)", status: 403, code: LIVECHAT_SESSION_OUTSIDE_OPERATOR_SCOPE, message: This Live Chat session is assigned to another operator. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND visitor_id = TRIM(CAST(:partner_id AS VARCHAR))", status: 403, code: LIVECHAT_HISTORY_PARTNER_NOT_MEMBER, message: The selected visitor partner is not a member of this Live Chat conversation. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(COALESCE(CAST(:page_history AS VARCHAR), '')) <= 6000", status: 422, code: LIVECHAT_HISTORY_TOO_LARGE, message: Page history must be 6000 characters or fewer. }
      steps:
        - query: |
            INSERT INTO livechat_session_messages
              (id, session_id, author_id, author_name, author_type, body, action, action_label, created_at)
            VALUES(
              :history_id,
              :id,
              :current_user_id,
              COALESCE(NULLIF(:current_user_name, ''), 'Live Chat operator'),
              'system',
              CASE
                WHEN LENGTH(TRIM(COALESCE(CAST(:page_history AS VARCHAR), ''))) = 0 THEN 'No history found'
                ELSE 'Page history: ' || TRIM(CAST(:page_history AS VARCHAR))
              END,
              'history',
              'Page History',
              CURRENT_TIMESTAMP
            )
          expect_changed: true
          status: 409
          code: LIVECHAT_HISTORY_NOT_SENT
          message: The visitor page history could not be sent.
      result:
        query: |
          SELECT id, session_id, author_name, author_type, body AS detail,
            action, action_label, CAST(created_at AS VARCHAR) AS created_at
          FROM livechat_session_messages
          WHERE id = :history_id
  - id: email_livechat_session_transcript
    type: server_form
    permission: livechat.write
    title: Email conversation transcript
    action: /im_livechat/email_livechat_transcript
    handler: yaml_mutation
    operation: transcript
    params: { id: '{state.id}' }
    success_message: Conversation transcript queued for delivery.
    refresh: [livechat_session_detail]
    fields:
      - { field: email, label: Email, type: email, required: true, placeholder: 'mail@example.com' }
    mutation:
      generated: [delivery_id]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id", status: 404, code: LIVECHAT_SESSION_NOT_FOUND, message: Live Chat session was not found. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND status = 'Closed'", status: 409, code: LIVECHAT_TRANSCRIPT_SESSION_OPEN, message: A transcript is available after the Live Chat session is closed. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND (COALESCE(:view_scope, 'all') = 'all' OR operator_id = :current_user_id)", status: 403, code: LIVECHAT_SESSION_OUTSIDE_OPERATOR_SCOPE, message: This Live Chat session is assigned to another operator. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND row_version = :expected_row_version", status: 409, code: LIVECHAT_TRANSCRIPT_STALE, message: This Live Chat session changed before the transcript was requested. Reload before trying again. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: LIVECHAT_TRANSCRIPT_ACTOR_REQUIRED, message: An authenticated Live Chat operator is required to email a transcript. }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(TRIM(CAST(:email AS VARCHAR)), '^[^@ ]+@[^@ ]+\\.[^@ ]+$')", status: 422, code: LIVECHAT_TRANSCRIPT_EMAIL_INVALID, message: Enter a valid email address for the transcript. }
      steps:
        - { query: "INSERT INTO livechat_transcript_deliveries(id, session_id, recipient_email, requested_by, state, requested_at) VALUES(:delivery_id, :id, TRIM(CAST(:email AS VARCHAR)), :current_user_id, 'Queued', CURRENT_TIMESTAMP)", expect_changed: true, status: 409, code: LIVECHAT_TRANSCRIPT_NOT_QUEUED, message: The conversation transcript could not be queued. }
        - { query: "UPDATE livechat_sessions SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: LIVECHAT_TRANSCRIPT_STALE, message: This Live Chat session changed before the transcript was requested. Reload before trying again. }
      result: { query: "SELECT d.id, d.session_id, d.recipient_email, d.requested_by, d.state, CAST(d.requested_at AS VARCHAR) AS requested_at, 'Conversation transcript queued for delivery.' AS message FROM livechat_transcript_deliveries d WHERE d.id = :delivery_id" }
  - id: send_livechat_session_message
    type: server_form
    permission: livechat.write
    title: Send message
    action: livechat.sessions.message
    handler: yaml_mutation
    operation: message
    params: { id: '{state.id}' }
    refresh: [livechat_session_messages, livechat_session_detail]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      guards:
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id", status: 404, code: LIVECHAT_SESSION_NOT_FOUND, message: Live Chat session was not found. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND (COALESCE(:view_scope, 'all') = 'all' OR operator_id = :current_user_id)", status: 403, code: LIVECHAT_SESSION_OUTSIDE_OPERATOR_SCOPE, message: This Live Chat session is assigned to another operator. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: LIVECHAT_SESSION_MESSAGE_INVALID, message: Message content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO livechat_session_messages(id, session_id, author_id, author_name, author_type, body, action, action_label, created_at) VALUES(gen_random_uuid(), :id, :current_user_id, :current_user_name, 'operator', TRIM(CAST(:content AS VARCHAR)), 'message', 'Message', CURRENT_TIMESTAMP)" }
        - { query: "UPDATE livechat_sessions SET message_count = COALESCE(message_count, 0) + 1, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id" }
      result: { query: "SELECT id, session_id, author_name, author_type, body AS detail, action, action_label, CAST(created_at AS VARCHAR) AS created_at FROM livechat_session_messages WHERE session_id = :id ORDER BY created_at DESC, id DESC LIMIT 1" }
  - id: invite_livechat_session_member
    type: server_form
    permission: livechat.write
    title: Invite People
    action: discuss.channel.add_members
    handler: yaml_mutation
    operation: invite_member
    params: { id: '{state.id}' }
    refresh: [livechat_session_detail, livechat_session_members, livechat_session_messages, livechat_session_invite_options]
    success_message: The operator was invited to the conversation.
    fields:
      - { field: member_id, label: Person, type: select, options_source: livechat_session_invite_options, required: true }
      - { field: expected_row_version, label: Session version, type: number, readonly: true }
    mutation:
      concurrency: { required: true }
      before_steps:
        - query: |
            SELECT 'livechat-session-member-' || CAST(:id AS VARCHAR) || '-' || CAST(:member_id AS VARCHAR) AS member_record_id,
              'livechat-session-invite-' || CAST(:id AS VARCHAR) || '-' || CAST(:member_id AS VARCHAR) AS notification_id
            FROM livechat_sessions
            WHERE id = :id
          assign: true
      guards:
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id", status: 404, code: LIVECHAT_SESSION_NOT_FOUND, message: Live Chat session was not found. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND (COALESCE(:view_scope, 'all') = 'all' OR operator_id = :current_user_id)", status: 403, code: LIVECHAT_SESSION_OUTSIDE_OPERATOR_SCOPE, message: This Live Chat session is assigned to another operator. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND status <> 'Closed'", status: 409, code: LIVECHAT_SESSION_INVITE_CLOSED, message: Closed Live Chat conversations cannot receive new members. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND row_version = :expected_row_version", status: 409, code: LIVECHAT_SESSION_INVITE_STALE, message: This conversation changed before the invitation was sent. Reload and try again. }
        - { query: "SELECT id FROM livechat_user_settings WHERE id = :member_id AND livechat_enabled = TRUE", status: 404, code: LIVECHAT_INVITEE_NOT_FOUND, message: The selected Live Chat operator is not available. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM livechat_session_members WHERE session_id = :id AND member_id = :member_id)", status: 409, code: LIVECHAT_MEMBER_ALREADY_INVITED, message: This operator is already a member of the conversation. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: LIVECHAT_INVITE_ACTOR_REQUIRED, message: An authenticated Live Chat operator is required to invite a person. }
      steps:
        - query: |
            INSERT INTO livechat_session_members
              (id, session_id, member_id, member_name, member_type, email, language_names, expertise_names, invited_by, joined_at)
            SELECT :member_record_id, s.id, u.id, u.livechat_name, 'agent', '',
              u.spoken_languages, u.expertise_names, :current_user_id, CURRENT_TIMESTAMP
            FROM livechat_sessions s
            JOIN livechat_user_settings u ON u.id = :member_id AND u.livechat_enabled = TRUE
            WHERE s.id = :id AND s.row_version = :expected_row_version
          expect_changed: true
          status: 409
          code: LIVECHAT_SESSION_INVITE_STALE
          message: This conversation changed before the invitation was sent. Reload and try again.
        - query: |
            INSERT INTO livechat_session_messages
              (id, session_id, author_id, author_name, author_type, body, action, action_label, created_at)
            SELECT :notification_id, :id, :current_user_id, COALESCE(:current_user_name, 'Live Chat operator'),
              'system', 'invited ' || u.livechat_name || ' to the conversation', 'invite', 'Invite', CURRENT_TIMESTAMP
            FROM livechat_user_settings u
            WHERE u.id = :member_id
        - query: |
            UPDATE livechat_sessions
            SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP
            WHERE id = :id AND row_version = :expected_row_version
          expect_changed: true
          status: 409
          code: LIVECHAT_SESSION_INVITE_STALE
          message: This conversation changed before the invitation was completed. Reload and try again.
      result:
        query: |
          SELECT m.id, m.session_id, m.member_id, m.member_name, m.member_type,
            m.language_names, m.expertise_names, m.invited_by,
            'The operator was invited to the conversation.' AS message
          FROM livechat_session_members m
          WHERE m.id = :member_record_id
  - id: add_livechat_session_tag
    type: server_form
    permission: livechat.write
    title: Add conversation tag
    action: /im_livechat/conversation/update_tags
    handler: yaml_mutation
    operation: tag
    params: { id: '{state.id}', method: ADD }
    refresh: [livechat_session_detail, livechat_session_tags, livechat_session_tag_options]
    fields: [{ field: tag_id, label: Tag, type: select, options_source: livechat_session_tag_options, required: true }]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id", status: 404, code: LIVECHAT_SESSION_NOT_FOUND, message: Live Chat session was not found. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND (COALESCE(:view_scope, 'all') = 'all' OR operator_id = :current_user_id)", status: 403, code: LIVECHAT_SESSION_OUTSIDE_OPERATOR_SCOPE, message: This Live Chat session is assigned to another operator. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND row_version = :expected_row_version", status: 409, code: LIVECHAT_SESSION_TAG_STALE, message: This conversation changed before its tags were updated. Reload before trying again. }
        - { query: "SELECT id FROM livechat_tags WHERE id = :tag_id", status: 404, code: LIVECHAT_TAG_NOT_FOUND, message: Live Chat tag not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM livechat_session_tag_rel WHERE session_id = :id AND tag_id = :tag_id)", status: 409, code: LIVECHAT_SESSION_TAG_ALREADY_ADDED, message: This tag is already assigned to the conversation. }
      steps:
        - { query: "INSERT INTO livechat_session_tag_rel(session_id, tag_id) VALUES(:id, :tag_id)" }
        - { query: "UPDATE livechat_sessions SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: LIVECHAT_SESSION_TAG_STALE, message: This conversation changed before its tags were updated. Reload before trying again. }
      result: { query: "SELECT * FROM livechat_sessions WHERE id = :id" }
  - id: remove_livechat_session_tag
    type: server_form
    permission: livechat.write
    title: Remove conversation tag
    action: /im_livechat/conversation/update_tags
    handler: yaml_mutation
    operation: tag
    params: { id: '{state.id}', method: DELETE }
    refresh: [livechat_session_detail, livechat_session_tags, livechat_session_tag_options]
    fields: [{ field: tag_id, label: Tag, type: select, options_source: livechat_session_tag_options, required: true }]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id", status: 404, code: LIVECHAT_SESSION_NOT_FOUND, message: Live Chat session was not found. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND (COALESCE(:view_scope, 'all') = 'all' OR operator_id = :current_user_id)", status: 403, code: LIVECHAT_SESSION_OUTSIDE_OPERATOR_SCOPE, message: This Live Chat session is assigned to another operator. }
        - { query: "SELECT id FROM livechat_sessions WHERE id = :id AND row_version = :expected_row_version", status: 409, code: LIVECHAT_SESSION_TAG_STALE, message: This conversation changed before its tags were updated. Reload before trying again. }
        - { query: "SELECT id FROM livechat_tags WHERE id = :tag_id", status: 404, code: LIVECHAT_TAG_NOT_FOUND, message: Live Chat tag not found. }
        - { query: "SELECT session_id FROM livechat_session_tag_rel WHERE session_id = :id AND tag_id = :tag_id", status: 409, code: LIVECHAT_SESSION_TAG_NOT_ASSIGNED, message: This tag is not assigned to the conversation. }
      steps:
        - { query: "DELETE FROM livechat_session_tag_rel WHERE session_id = :id AND tag_id = :tag_id" }
        - { query: "UPDATE livechat_sessions SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: LIVECHAT_SESSION_TAG_STALE, message: This conversation changed before its tags were updated. Reload before trying again. }
      result: { query: "SELECT * FROM livechat_sessions WHERE id = :id" }
