page: { id: livechat-canned-response-detail }

datasources:
  - id: livechat_canned_response_detail
    single: true
    permission: livechat.read
    error_states:
      forbidden: { status: 403, code: LIVECHAT_CANNED_RESPONSE_DETAIL_FORBIDDEN, message: You do not have permission to view this canned response. }
      transport_error: { status: 503, code: LIVECHAT_CANNED_RESPONSE_DETAIL_UNAVAILABLE, message: This canned response is temporarily unavailable. }
    query: |
      SELECT id, row_version, source, '::' || source AS shortcut, substitution,
        authorized_groups, is_shared, is_editable, created_by,
        CAST(last_used AS VARCHAR) AS last_used
      FROM livechat_canned_responses
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END = TRUE
        AND id = :id

actions:
  - id: edit_livechat_canned_response
    type: server_form
    permission: livechat.write
    title: Edit Canned Response
    action: im_livechat.canned_responses.update
    handler: yaml_mutation
    operation: update
    refresh: [livechat_canned_response_detail, livechat_canned_responses]
    mutation:
      operation: update
      table: livechat_canned_responses
      fields: [source, substitution, authorized_groups, is_shared]
      required: [source, substitution]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM livechat_canned_responses WHERE id = :id", status: 404, code: LIVECHAT_CANNED_RESPONSE_NOT_FOUND, message: Canned response not found. }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(trim(CAST(:source AS VARCHAR)), '^[a-z0-9_-]{1,64}$')", status: 422, code: LIVECHAT_CANNED_RESPONSE_SHORTCUT_INVALID, message: Shortcut must use lowercase letters, numbers, underscores, or hyphens. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:substitution AS VARCHAR))) > 0", status: 422, code: LIVECHAT_CANNED_RESPONSE_SUBSTITUTION_REQUIRED, message: Substitution is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM livechat_canned_responses WHERE LOWER(source) = LOWER(TRIM(CAST(:source AS VARCHAR))) AND id <> :id)", status: 409, code: LIVECHAT_CANNED_RESPONSE_SHORTCUT_EXISTS, message: A canned response with this shortcut already exists. }
      result: { query: "SELECT * FROM livechat_canned_responses WHERE id = :id" }
    fields:
      - { field: source, label: Shortcut, type: text, required: true }
      - { field: substitution, label: Substitution, type: textarea, required: true }
      - { field: authorized_groups, label: Authorized Groups, type: text }
      - { field: is_shared, label: Shared, type: checkbox }
