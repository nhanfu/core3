title: Referral
page: { id: referral-detail, route: /referral-detail, breadcrumb: [Human Resources, Referrals, Detail], auth: { require: [referrals.read] } }
components:
  - type: OdooFormView
    source: referral_detail
    title_field: name
    status_field: state
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    statusbar: [{ value: Draft, label: Draft }, { value: Submitted, label: Submitted }, { value: Hired, label: Hired }, { value: Rewarded, label: Rewarded }, { value: Rejected, label: Rejected }]
    status_colors: { Draft: neutral, Submitted: amber, Hired: blue, Rewarded: green, Rejected: red }
    header_actions:
      - { id: edit_referral_detail, label: Edit, variant: secondary, permission: referrals.write }
      - { id: delete_referral_detail, label: Delete, variant: danger, permission: referrals.manage, confirm: Delete this referral? }
      - { id: submit_referral_detail, label: Submit, variant: primary, permission: referrals.write, show_if: "record.state === 'Draft'" }
      - { id: hire_referral_detail, label: Mark hired, variant: secondary, permission: referrals.manage, show_if: "record.state === 'Submitted'" }
      - { id: reward_referral_detail, label: Issue reward, variant: primary, permission: referrals.manage, show_if: "record.state === 'Hired'" }
      - { id: reject_referral_detail, label: Reject, variant: danger, permission: referrals.manage, show_if: "record.state === 'Draft' || record.state === 'Submitted'" }
    group_columns: 2
    groups:
      - title: Referral
        fields: [{ field: name, label: Referral }, { field: state, label: Status }, { field: referrer_name, label: Referrer }, { field: candidate_name, label: Candidate }, { field: candidate_email, label: Email }, { field: opening_name, label: Opening }]
      - title: Reward
        fields: [{ field: relationship, label: Relationship }, { field: reward_amount, label: Reward amount }, { field: reward_currency, label: Currency }, { field: submitted_date, label: Submitted date }, { field: hired_date, label: Hired date }, { field: rewarded_date, label: Rewarded date }, { field: notes, label: Notes }]
