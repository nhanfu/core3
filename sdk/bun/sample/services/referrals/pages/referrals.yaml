title: Referrals
page: { id: referrals, breadcrumb: [Human Resources, Referrals], auth: { require: [referrals.read] } }
components:
  - type: ListView
    variant: odoo
    source: referrals
    create_action: create_referral
    create_label: New referral
    search: { label: Search referrals, placeholder: 'Search referrer or candidate...' }
    filters: [{ field: state, label: Status, options_source: referral_states }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - { id: kanban, label: Kanban, icon: dashboard, group_by: state, groups_source: referral_states, card: { title: candidate_name, subtitle: name, fields: [{ field: referrer_name, label: Referrer }, { field: opening_name, label: Opening }, { field: state, label: Status }] } }
      - { id: pivot, label: Pivot, icon: pivot, pivot: { fields: [{ field: state, column: Status }, { field: opening_name, column: Opening }, { field: reward_amount, column: Reward }], default: { rows: [state], columns: [opening_name], measures: [{ field: reward_amount, aggregate: sum, column: Reward }] } } }
      - { id: graph, label: Graph, icon: graph, category_field: state, measure_field: reward_amount, type: bar }
    columns:
      - { field: name, label: Referral, type: PrimaryEntityCell }
      - { field: referrer_name, label: Referrer }
      - { field: candidate_name, label: Candidate }
      - { field: opening_name, label: Opening }
      - { field: relationship, label: Relationship }
      - { field: reward_amount, label: Reward, align: right }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    row_double_click_action: view_referral_detail
    empty_state: { title: No referrals, description: No referrals match the current search or filters. }
    actions:
      - { id: submit_referral, label: Submit, permission: referrals.write, variant: primary, show_if: "row.state === 'Draft'" }
      - { id: hire_referral, label: Mark hired, permission: referrals.manage, variant: secondary, show_if: "row.state === 'Submitted'" }
      - { id: reward_referral, label: Issue reward, permission: referrals.manage, variant: primary, show_if: "row.state === 'Hired'" }
      - { id: reject_referral, label: Reject, permission: referrals.manage, variant: danger, show_if: "row.state === 'Draft' || row.state === 'Submitted'" }
