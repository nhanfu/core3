version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS referrals (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        referrer_employee_id VARCHAR NOT NULL, referrer_name VARCHAR NOT NULL,
        candidate_name VARCHAR NOT NULL, candidate_email VARCHAR, candidate_phone VARCHAR,
        opening_id VARCHAR, opening_name VARCHAR, relationship VARCHAR, source VARCHAR,
        reward_amount DECIMAL(18,2) NOT NULL DEFAULT 0, reward_currency VARCHAR NOT NULL DEFAULT 'USD',
        state VARCHAR NOT NULL DEFAULT 'Draft', submitted_date DATE, hired_date DATE, rewarded_date DATE,
        notes VARCHAR, row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS referrals_state_idx ON referrals(state);
      CREATE INDEX IF NOT EXISTS referrals_referrer_idx ON referrals(referrer_employee_id);
    down: |
      DROP TABLE IF EXISTS referrals;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
