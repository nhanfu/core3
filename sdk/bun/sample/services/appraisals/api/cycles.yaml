page: { id: appraisal-cycles }
datasources:
  - id: appraisal_cycles
    permission: appraisals.read
    query: "SELECT id, row_version, name, year, description, state, CAST(start_date AS VARCHAR) AS start_date, CAST(end_date AS VARCHAR) AS end_date FROM appraisal_cycles ORDER BY year DESC, id"
    error_states:
      forbidden: { status: 403, code: APPRAISAL_CYCLES_FORBIDDEN, message: You do not have permission to manage appraisal cycles. }
      transport_error: { status: 503, code: APPRAISAL_CYCLES_UNAVAILABLE, message: Appraisal cycles are temporarily unavailable. }
actions:
  - id: create_appraisal_cycle
    type: server_form
    permission: appraisals.manage
    title: New appraisal cycle
    action: appraisals.cycles.create
    handler: yaml_mutation
    operation: create
    refresh: [appraisal_cycles, appraisal_cycles_lookup]
    mutation:
      operation: insert
      table: appraisal_cycles
      generated: [id]
      before_steps: [{ query: "SELECT 'appraisal-cycle-custom-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      fields: [name, year, description, state, start_date, end_date]
      required: [name, year]
      defaults: { state: Draft }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND TRY_CAST(:year AS INTEGER) BETWEEN 2000 AND 2200", status: 422, code: APPRAISAL_CYCLE_VALUES_INVALID, message: Cycle name and a valid year are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM appraisal_cycles WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: APPRAISAL_CYCLE_NAME_EXISTS, message: An appraisal cycle with this name already exists. }
      result: { query: "SELECT * FROM appraisal_cycles WHERE id = :id" }
    fields:
      - { field: name, label: Cycle, type: text, required: true }
      - { field: year, label: Year, type: number, required: true, min: 2000, max: 2200 }
      - { field: description, label: Description, type: textarea }
      - { field: start_date, label: Start date, type: text }
      - { field: end_date, label: End date, type: text }
  - id: edit_appraisal_cycle
    type: server_form
    permission: appraisals.manage
    title: Edit appraisal cycle
    action: appraisals.cycles.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [appraisal_cycles, appraisal_cycles_lookup]
    mutation:
      operation: update
      table: appraisal_cycles
      fields: [name, year, description, state, start_date, end_date]
      required: [name, year]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM appraisal_cycles WHERE id = :id", status: 404, code: APPRAISAL_CYCLE_NOT_FOUND, message: Appraisal cycle not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND TRY_CAST(:year AS INTEGER) BETWEEN 2000 AND 2200", status: 422, code: APPRAISAL_CYCLE_VALUES_INVALID, message: Cycle name and a valid year are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM appraisal_cycles WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: APPRAISAL_CYCLE_NAME_EXISTS, message: An appraisal cycle with this name already exists. }
      result: { query: "SELECT * FROM appraisal_cycles WHERE id = :id" }
    fields:
      - { field: name, label: Cycle, type: text, required: true }
      - { field: year, label: Year, type: number, required: true, min: 2000, max: 2200 }
      - { field: description, label: Description, type: textarea }
      - { field: state, label: Status, type: select, options: [{ value: Draft, label: Draft }, { value: Open, label: Open }, { value: Closed, label: Closed }] }
      - { field: start_date, label: Start date, type: text }
      - { field: end_date, label: End date, type: text }
  - id: delete_appraisal_cycle
    type: server
    permission: appraisals.manage
    action: appraisals.cycles.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete cycle {{row.name}}?'
    refresh: [appraisal_cycles, appraisal_cycles_lookup]
    mutation:
      operation: delete
      table: appraisal_cycles
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM appraisal_cycles WHERE id = :id AND state <> 'Open'", status: 409, code: APPRAISAL_CYCLE_OPEN, message: Close an open cycle before deleting it. }
        - { query: "SELECT id FROM appraisal_cycles WHERE id = :id", status: 404, code: APPRAISAL_CYCLE_NOT_FOUND, message: Appraisal cycle not found. }
