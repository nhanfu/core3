version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS appraisal_cycles (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        year INTEGER NOT NULL, description VARCHAR, state VARCHAR NOT NULL DEFAULT 'Draft',
        start_date DATE, end_date DATE, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS appraisals (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        cycle_id VARCHAR NOT NULL, cycle_name VARCHAR NOT NULL, employee_id VARCHAR NOT NULL,
        employee_name VARCHAR NOT NULL, manager_name VARCHAR, job_title VARCHAR, summary VARCHAR,
        self_rating VARCHAR, manager_rating VARCHAR, goals VARCHAR, feedback VARCHAR,
        state VARCHAR NOT NULL DEFAULT 'Draft', due_date DATE, completed_date DATE,
        row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS appraisals_cycle_idx ON appraisals(cycle_id);
      CREATE INDEX IF NOT EXISTS appraisals_state_idx ON appraisals(state);
    down: |
      DROP TABLE IF EXISTS appraisals;
      DROP TABLE IF EXISTS appraisal_cycles;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
