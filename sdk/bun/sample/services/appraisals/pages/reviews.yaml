title: Appraisals
page: { id: appraisals, breadcrumb: [Human Resources, Appraisals], auth: { require: [appraisals.read] } }
datasources:
  - id: appraisal_states
    permission: appraisals.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('In Progress','In Progress'), ('Manager Review','Manager Review'), ('Completed','Completed'), ('Cancelled','Cancelled')) states(value, label)"
  - id: appraisal_cycles_lookup
    permission: appraisals.read
    single: false
    query: "SELECT id AS value, name AS label FROM appraisal_cycles WHERE state IN ('Draft', 'Open') ORDER BY year DESC"
  - id: appraisals
    permission: appraisals.read
    workflow: appraisals
    query: "SELECT a.id, a.row_version, a.name, a.cycle_name, a.employee_name, a.manager_name, a.job_title, a.self_rating, a.manager_rating, a.state, CAST(a.due_date AS VARCHAR) AS due_date, CAST(a.completed_date AS VARCHAR) AS completed_date FROM appraisals a WHERE (:q IS NULL OR a.name ILIKE '%' || :q || '%' OR a.employee_name ILIKE '%' || :q || '%') AND (:state IS NULL OR a.state = :state) ORDER BY a.due_date DESC"
components:
  - type: ListView
    variant: odoo
    source: appraisals
    create_action: create_appraisal
    create_label: New appraisal
    search: { label: Search appraisals, placeholder: 'Search employee or appraisal...' }
    filters: [{ field: state, label: Status, options_source: appraisal_states }]
    columns:
      - { field: name, label: Appraisal, type: PrimaryEntityCell }
      - { field: cycle_name, label: Cycle }
      - { field: employee_name, label: Employee }
      - { field: manager_name, label: Manager }
      - { field: job_title, label: Job title }
      - { field: self_rating, label: Self rating, type: StatusChip }
      - { field: manager_rating, label: Manager rating, type: StatusChip }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: start_appraisal, label: Start, permission: appraisals.write, variant: primary, show_if: "row.state === 'Draft'" }
      - { id: submit_appraisal, label: Submit, permission: appraisals.write, variant: secondary, show_if: "row.state === 'In Progress'" }
      - { id: complete_appraisal, label: Complete, permission: appraisals.manage, variant: primary, show_if: "row.state === 'Manager Review'" }
      - { id: cancel_appraisal, label: Cancel, permission: appraisals.manage, variant: danger, show_if: "row.state !== 'Completed' && row.state !== 'Cancelled'" }
actions:
  - id: create_appraisal
    type: server_form
    permission: appraisals.write
    title: New appraisal
    action: appraisals.records.create
    handler: yaml_mutation
    operation: create
    refresh: [appraisals]
    mutation:
      operation: insert
      table: appraisals
      fields: [name, cycle_id, cycle_name, employee_id, employee_name, manager_name, job_title, goals, self_rating, manager_rating, summary, feedback, due_date]
      required: [name, cycle_id, cycle_name, employee_id, employee_name]
      result: { query: "SELECT * FROM appraisals WHERE id = :id" }
    fields:
      - { field: name, label: Appraisal, type: text, required: true }
      - { field: cycle_id, label: Cycle, type: select, options_source: appraisal_cycles_lookup, required: true }
      - { field: cycle_name, label: Cycle name, type: text, required: true }
      - { field: employee_id, label: Employee ID, type: text, required: true }
      - { field: employee_name, label: Employee, type: text, required: true }
      - { field: manager_name, label: Manager, type: text }
      - { field: job_title, label: Job title, type: text }
      - { field: goals, label: Goals, type: text }
      - { field: self_rating, label: Self rating, type: select, options: [{ value: Exceeds, label: Exceeds }, { value: Meets, label: Meets }, { value: Needs improvement, label: Needs improvement }] }
      - { field: manager_rating, label: Manager rating, type: select, options: [{ value: Exceeds, label: Exceeds }, { value: Meets, label: Meets }, { value: Needs improvement, label: Needs improvement }] }
      - { field: summary, label: Summary, type: text }
      - { field: feedback, label: Feedback, type: text }
      - { field: due_date, label: Due date, type: text }
  - { id: start_appraisal, type: server, permission: appraisals.write, action: appraisals.records.start, handler: order_transition, workflow: appraisals, operation: start, refresh: [appraisals] }
  - { id: submit_appraisal, type: server, permission: appraisals.write, action: appraisals.records.submit, handler: order_transition, workflow: appraisals, operation: submit, refresh: [appraisals] }
  - { id: complete_appraisal, type: server, permission: appraisals.manage, action: appraisals.records.complete, handler: order_transition, workflow: appraisals, operation: complete, refresh: [appraisals] }
  - { id: cancel_appraisal, type: server, permission: appraisals.manage, action: appraisals.records.cancel, handler: order_transition, workflow: appraisals, operation: cancel, refresh: [appraisals] }
