title: Appraisals
page: { id: appraisals, breadcrumb: [Human Resources, Appraisals], auth: { require: [appraisals.read] } }
components:
  - type: ListView
    variant: odoo
    source: appraisals
    create_action: create_appraisal
    create_label: New appraisal
    search: { label: Search appraisals, placeholder: 'Search employee or appraisal...' }
    filters: [{ field: state, label: Status, options_source: appraisal_states }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: state
        groups_source: appraisal_states
        card: { title: name, subtitle: employee_name, fields: [{ field: cycle_name, label: Cycle }, { field: manager_name, label: Manager }, { field: state, label: Status }] }
    row_key: id
    row_open_action: view_appraisal
    row_double_click_action: view_appraisal
    row_actions: menu
    columns:
      - { field: name, label: Appraisal, type: PrimaryEntityCell }
      - { field: cycle_name, label: Cycle }
      - { field: employee_name, label: Employee }
      - { field: manager_name, label: Manager }
      - { field: job_title, label: Job title }
      - { field: self_rating, label: Self rating, type: StatusChip }
      - { field: manager_rating, label: Manager rating, type: StatusChip }
      - { field: state, label: Status, type: StatusChip }
      - { field: actions, label: '', align: right, actions: [{ id: edit_appraisal, label: Edit, icon: edit }, { id: delete_appraisal, label: Delete, icon: delete, variant: danger }, { id: start_appraisal, label: Start, variant: primary, show_if: "row.state === 'Draft'" }, { id: submit_appraisal, label: Submit, variant: secondary, show_if: "row.state === 'In Progress'" }, { id: complete_appraisal, label: Complete, variant: primary, show_if: "row.state === 'Manager Review'" }, { id: cancel_appraisal, label: Cancel, variant: danger, show_if: "row.state !== 'Completed' && row.state !== 'Cancelled'" }] }
    page_size: 50
