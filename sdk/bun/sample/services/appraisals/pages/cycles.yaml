title: Appraisal Cycles
page: { id: appraisal-cycles, breadcrumb: [Human Resources, Appraisals, Cycles], auth: { require: [appraisals.manage] } }
components:
  - type: ListView
    variant: odoo
    source: appraisal_cycles
    create_action: create_appraisal_cycle
    create_label: New appraisal cycle
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
    row_key: id
    row_open_action: edit_appraisal_cycle
    row_double_click_action: edit_appraisal_cycle
    row_actions: menu
    columns:
      - { field: name, label: Cycle, type: PrimaryEntityCell }
      - { field: year, label: Year }
      - { field: description, label: Description }
      - { field: start_date, label: Start date }
      - { field: end_date, label: End date }
      - { field: state, label: Status, type: StatusChip }
      - { field: actions, label: '', align: right, actions: [{ id: edit_appraisal_cycle, label: Edit, icon: edit }, { id: delete_appraisal_cycle, label: Delete, icon: delete, variant: danger }] }
    page_size: 50
