title: Appraisal
page: { id: appraisal-detail, breadcrumb: [Human Resources, Appraisals, Detail], auth: { require: [appraisals.read] } }
components:
  - type: OdooFormView
    source: appraisal_detail
    title_field: name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: In Progress, label: In Progress }, { value: Manager Review, label: Manager Review }, { value: Completed, label: Completed }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, In Progress: blue, Manager Review: amber, Completed: green, Cancelled: red }
    editable: true
    header_actions:
      - { id: edit_appraisal_detail, label: Edit, permission: appraisals.write, show_if: "record.state !== 'Completed' && record.state !== 'Cancelled'" }
      - { id: start_appraisal_detail, label: Start, variant: primary, permission: appraisals.write, show_if: "record.state === 'Draft'" }
      - { id: submit_appraisal_detail, label: Submit, variant: secondary, permission: appraisals.write, show_if: "record.state === 'In Progress'" }
      - { id: complete_appraisal_detail, label: Complete, variant: primary, permission: appraisals.manage, show_if: "record.state === 'Manager Review'" }
      - { id: cancel_appraisal_detail, label: Cancel, variant: danger, permission: appraisals.manage, show_if: "record.state !== 'Completed' && record.state !== 'Cancelled'" }
    group_columns: 2
    groups:
      - title: Review
        fields: [{ field: name, label: Appraisal }, { field: state, label: Status }, { field: cycle_name, label: Cycle }, { field: employee_name, label: Employee }, { field: manager_name, label: Manager }, { field: job_title, label: Job title }]
      - title: Feedback
        fields: [{ field: goals, label: Goals }, { field: self_rating, label: Self rating }, { field: manager_rating, label: Manager rating }, { field: summary, label: Summary }, { field: feedback, label: Feedback }, { field: due_date, label: Due date }, { field: completed_date, label: Completed date }]
