        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE,
        saved_by VARCHAR NOT NULL,
        recipient_model VARCHAR NOT NULL,
        recipient_model_label VARCHAR NOT NULL,
        mailing_domain VARCHAR NOT NULL,
        saved_by_me BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
