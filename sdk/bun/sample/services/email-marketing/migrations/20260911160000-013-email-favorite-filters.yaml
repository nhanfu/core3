        ('email-filter-active-newsletter', 1, 'Active newsletter subscribers', 'admin@core3.local', 'res.partner', 'Contacts', 'Active newsletter subscribers', true, TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00'),
        ('email-filter-vip-contacts', 1, 'VIP customer contacts', 'admin@core3.local', 'res.partner', 'Contacts', 'Customer rank is greater than zero', true, TIMESTAMP '2026-01-15 09:01:00', TIMESTAMP '2026-01-15 09:01:00'),
