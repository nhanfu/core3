version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS mailing_lists (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        description VARCHAR, subscriber_count INTEGER NOT NULL DEFAULT 0, state VARCHAR NOT NULL DEFAULT 'Active',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS email_campaigns (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        subject VARCHAR NOT NULL, sender_name VARCHAR, sender_email VARCHAR, list_id VARCHAR NOT NULL,
        list_name VARCHAR NOT NULL, body VARCHAR, scheduled_at TIMESTAMP, sent_at TIMESTAMP,
        recipient_count INTEGER NOT NULL DEFAULT 0, delivered_count INTEGER NOT NULL DEFAULT 0,
        opened_count INTEGER NOT NULL DEFAULT 0, clicked_count INTEGER NOT NULL DEFAULT 0,
        state VARCHAR NOT NULL DEFAULT 'Draft', row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS email_campaigns_state_idx ON email_campaigns(state);
    down: |
      DROP TABLE IF EXISTS email_campaigns;
      DROP TABLE IF EXISTS mailing_lists;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
