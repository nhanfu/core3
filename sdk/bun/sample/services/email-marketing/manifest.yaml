id: email-marketing
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  email-marketing:
    path: /email-campaigns
    label: Email Marketing
    icon: mail
    permission: email_marketing.read
    groups:
    - id: mailings
      label: Mailings
      items:
        - { path: /email-mailings, label: Mailings, icon: mail, permission: email_marketing.read }
    - id: campaigns
      label: Campaigns
      items:
        - { path: /email-campaigns, label: Campaigns, icon: mail, permission: email_marketing.read }
        - { path: /mailing-lists, label: Mailing Lists, icon: users, permission: email_marketing.read }
        - { path: /mailing-contacts, label: Mailing List Contacts, icon: users, permission: email_marketing.read }
    - id: reporting
      label: Reporting
      items:
        - { path: /email-analysis, label: Mass Mailing Analysis, icon: chart, permission: email_marketing.read }
        - { path: /email-opt-out-report, label: Opt-Out Report, icon: chart, permission: email_marketing.read }
    - id: configuration
      label: Configuration
      items:
        - { path: /email-settings, label: Settings, icon: settings, permission: email_marketing.settings }
        - { path: /email-campaign-stages, label: Campaign Stages, icon: workflow, permission: email_marketing.manage }
        - { path: /email-campaign-tags, label: Tags, icon: tag, permission: email_marketing.manage }
        - { path: /email-link-trackers, label: Link Tracker, icon: link, permission: email_marketing.read }
        - { path: /email-blacklist, label: Blacklisted Email Addresses, icon: ban, permission: email_marketing.read }
        - { path: /email-optout-reasons, label: Optout Reasons, icon: settings, permission: email_marketing.manage }
        - { path: /email-favorite-filters, label: Favorite Filters, icon: filter, permission: email_marketing.read }
    - id: technical
      label: Technical
      items:
        - { path: /email-traces, label: Mailing Traces, icon: history, permission: email_marketing.settings }
