title: Email Campaigns
page: { id: email-campaigns, route: /email-campaigns, breadcrumb: [Marketing, Email Marketing, Campaigns], auth: { require: [email_marketing.read] } }

components:
  - type: ListView
    variant: odoo
    source: email_campaigns
    create_action: create_email_campaign
    create_label: New mailing
    search: { label: Search campaigns, placeholder: Search campaign or subject... }
    filters:
      - { field: state, label: Status, options_source: email_campaign_states }
      - { field: active, label: Records, options: [{ id: 'true', label: Active }, { id: 'false', label: Archived }] }
    view_navigation: tabs
    views:
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: true
        group_by: ''
        card:
          compact: true
          title: name
          subtitle: subject
          company_field: sender_name
          primary_metric: recipient_count
          primary_metric_label: Recipients
          fields:
            - { field: list_name, label: Audience }
            - { field: delivered_count, label: Delivered }
          footer:
            - { field: state, label: Status }
      - { id: list, label: List, icon: table, mobile: true }
    columns:
      - { field: name, label: Campaign, type: PrimaryEntityCell }
      - { field: subject, label: Subject }
      - { field: sender_name, label: Sender }
      - { field: list_name, label: Audience }
      - { field: recipient_count, label: Recipients, align: right }
      - { field: delivered_count, label: Delivered, align: right }
      - { field: state, label: Status, type: StatusChip }
      - { field: active, label: Active, type: StatusChip, optional: true }
    page_size: 50
    row_key: id
    row_open_action: view_email_campaign
    row_double_click_action: view_email_campaign
    row_actions: menu
    empty_state: { title: No email campaigns found, description: Create a mailing or adjust your search and filters. }
