title: Campaign Tags
page: { id: email-campaign-tags, route: /email-campaign-tags, breadcrumb: [Marketing, Email Marketing, Configuration, Tags], auth: { require: [email_marketing.manage] } }

components:
  - type: ListView
    variant: odoo
    source: email_campaign_tags
    create_action: create_email_campaign_tag
    create_label: New
    search: { label: Search campaign tags, placeholder: Search tags... }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: true }
    inline_edit:
      create_action: create_email_campaign_tag
      update_action: update_email_campaign_tag
      save_label: Save
      discard_label: Discard
      fields:
        - { field: name, type: text, required: true, placeholder: 'e.g. "Newsletter"' }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell, mobile: true }
      - { field: id, label: ' ', sortable: false, actions: [{ id: delete_email_campaign_tag, label: Delete, icon: trash, variant: danger }] }
    page_size: 50
    row_key: id
    row_actions: menu
    empty_state: { title: Create a Tag, description: 'Assign tags to your campaigns to organize, filter and track them.' }
