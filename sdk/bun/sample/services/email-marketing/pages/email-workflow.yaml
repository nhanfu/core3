workflow:
  id: email_campaigns
  entity: email_campaigns
  handler: order_transition
  initial: Draft
  permission: email_marketing.write
  mutable: true
  status_source: email_campaign_states
  states:
    - { id: Draft, label: Draft, color: neutral }
    - { id: Scheduled, label: Scheduled, color: amber }
    - { id: Sending, label: Sending, color: blue }
    - { id: Sent, label: Sent, color: green, terminal: true }
    - { id: Cancelled, label: Cancelled, color: red, terminal: true }
  transitions:
    - id: schedule
      from: [Draft]
      to: Scheduled
      permission: email_marketing.write
      mutation:
        guards:
          - { query: "SELECT id FROM email_campaigns WHERE id = :id AND state = 'Draft' AND active = true AND subject <> '' AND body <> '' AND sender_name <> '' AND regexp_matches(sender_email, '^[^@ ]+@[^@ ]+\\.[^@ ]+$') AND recipient_count > 0", status: 409, code: EMAIL_CAMPAIGN_NOT_READY, message: A campaign needs a valid sender, subject, body, and recipients before scheduling }
          - { query: "SELECT 1 AS ok FROM mailing_lists l JOIN email_campaigns c ON c.list_id = l.id WHERE c.id = :id AND l.active = true", status: 409, code: EMAIL_CAMPAIGN_AUDIENCE_UNAVAILABLE, message: The selected mailing list is not active. }
        steps: [{ query: "UPDATE email_campaigns SET state = 'Scheduled', scheduled_at = COALESCE(scheduled_at, TIMESTAMP '2026-01-16 08:00:00'), row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM email_campaigns WHERE id = :id" }
    - id: send
      from: [Scheduled]
      to: Sending
      permission: email_marketing.write
      mutation:
        guards:
          - { query: "SELECT id FROM email_campaigns WHERE id = :id AND state = 'Scheduled' AND active = true", status: 409, code: EMAIL_CAMPAIGN_NOT_SCHEDULED, message: Only active scheduled campaigns can start sending }
          - { query: "SELECT id FROM email_campaigns WHERE id = :id AND mail_server_available = true AND recipient_count > 0 AND body <> ''", status: 409, code: EMAIL_CAMPAIGN_SEND_BLOCKED, message: Sending requires an available mail server, body, and recipients. }
        steps: [{ query: "UPDATE email_campaigns SET state = 'Sending', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM email_campaigns WHERE id = :id" }
    - id: complete
      from: [Sending]
      to: Sent
      permission: email_marketing.manage
      mutation:
        guards: [{ query: "SELECT id FROM email_campaigns WHERE id = :id AND state = 'Sending'", status: 409, code: EMAIL_CAMPAIGN_NOT_SENDING, message: Only sending campaigns can be completed }]
        steps: [{ query: "UPDATE email_campaigns SET state = 'Sent', sent_at = TIMESTAMP '2026-01-15 10:15:00', delivered_count = recipient_count - failed_count, row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM email_campaigns WHERE id = :id" }
    - id: cancel
      from: [Draft, Scheduled]
      to: Cancelled
      permission: email_marketing.manage
      mutation:
        guards: [{ query: "SELECT id FROM email_campaigns WHERE id = :id AND state IN ('Draft', 'Scheduled')", status: 409, code: EMAIL_CAMPAIGN_CANCEL_BLOCKED, message: Only draft or scheduled campaigns can be cancelled }]
        steps: [{ query: "UPDATE email_campaigns SET state = 'Cancelled', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM email_campaigns WHERE id = :id" }
