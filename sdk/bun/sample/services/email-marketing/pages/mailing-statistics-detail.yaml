title: Mail Statistics
page: { id: email-mailing-statistics-detail, route: /email-mailings/statistics/detail, breadcrumb: [Marketing, Email Marketing, Mailings, Mail Statistics, Trace], auth: { require: [email_marketing.read] } }

components:
  - type: OdooFormView
    source: email_mailing_statistics_detail
    title_field: email
    editable: false
    labels: { save: Save, discard: Close, editDetails: Details, workflowStatus: Status }
    header_actions:
      - { id: open_email_mailing_statistic_recipient, label: Open Recipient, variant: secondary, permission: email_marketing.read }
    statusbar: { field: trace_status, visible: [outgoing, sent, error] }
    groups:
      - title: Status
        fields:
          - { field: failure_type, label: Failure Type, type: text }
          - { field: sent_datetime, label: Sent Date, type: datetime }
          - { field: links_click_datetime, label: Click Date, type: datetime }
          - { field: open_datetime, label: Open Date, type: datetime }
          - { field: failure_reason, label: Failure Reason, type: textarea }
          - { field: reply_datetime, label: Reply Date, type: datetime }
      - title: Mailing
        fields:
          - { field: email, label: Recipient Address, type: email }
          - { field: mass_mailing_name, label: Mailing, type: text }
          - { field: message_id, label: Message ID, type: text }
      - title: Marketing
        fields:
          - { field: campaign_name, label: Campaign, type: text }
          - { field: medium_name, label: Medium, type: text }
          - { field: source_name, label: Source, type: text }
