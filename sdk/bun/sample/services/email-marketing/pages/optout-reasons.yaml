title: Optout Reasons
page: { id: email-optout-reasons, route: /email-optout-reasons, breadcrumb: [Marketing, Email Marketing, Configuration, Optout Reasons], auth: { require: [email_marketing.manage] } }

components:
  - type: ListView
    variant: odoo
    source: email_optout_reasons
    create_action: create_email_optout_reason
    create_label: New
    search: { label: Search opt-out reasons, placeholder: Search reasons... }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - { id: form, label: Form, icon: edit }
    form_view: { page: apps/services/email-marketing/pages/email-optout-reason-detail.yaml, side_panel: true }
    inline_edit:
      create_action: create_email_optout_reason_inline
      update_action: update_email_optout_reason_inline
      save_label: Save
      discard_label: Discard
      fields:
        - { field: sequence, type: number, default: 10 }
        - { field: name, type: text, required: true, placeholder: Opt-out reason }
        - { field: is_feedback, type: checkbox }
    columns:
      - { field: sequence, label: ' ', type: HandleCell, sortable: false, mobile: false }
      - { field: name, label: Reason, type: PrimaryEntityCell, mobile: true }
      - { field: is_feedback, label: Allow Feedback, type: StatusChip }
      - { field: id, label: ' ', sortable: false, actions: [{ id: edit_email_optout_reason, label: Edit, icon: edit }, { id: delete_email_optout_reason, label: Delete, icon: trash, variant: danger }] }
    row_key: id
    row_open_action: edit_email_optout_reason
    row_double_click_action: edit_email_optout_reason
    row_actions: menu
    empty_state: { title: No opt-out reasons found, description: Add a reason or adjust your search. }
