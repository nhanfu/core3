page: { id: email-campaign-stage-detail }
datasources:
  - id: email_campaign_stage_detail
    single: true
    permission: email_marketing.manage
    error_states: { transport_error: { status: 503, code: EMAIL_CAMPAIGN_STAGE_DETAIL_UNAVAILABLE, message: Campaign stage details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, sequence FROM email_marketing_campaign_stages WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
actions:
  - id: edit_email_campaign_stage
    type: server_form
    permission: email_marketing.manage
    title: Edit Campaign Stage
    action: email_marketing.campaign_stages.update
    handler: yaml_mutation
    operation: update
    refresh: [email_campaign_stage_detail, email_campaign_stages]
    mutation: { operation: update, table: email_marketing_campaign_stages, fields: [name, sequence], required: [name], concurrency: { required: true }, guards: [{ query: "SELECT id FROM email_marketing_campaign_stages WHERE id = :id", status: 404, code: EMAIL_CAMPAIGN_STAGE_NOT_FOUND, message: Campaign stage not found. }, { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: EMAIL_CAMPAIGN_STAGE_NAME_REQUIRED, message: A campaign stage name is required. }, { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM email_marketing_campaign_stages WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: EMAIL_CAMPAIGN_STAGE_EXISTS, message: A campaign stage with this name already exists. }], result: { query: "SELECT * FROM email_marketing_campaign_stages WHERE id = :id" } }
    fields: [{ field: name, label: Name, type: text, required: true }, { field: sequence, label: Sequence, type: number }]
