page: { id: mailing-list-detail }
datasources:
  - id: mailing_list_detail
    single: true
    permission: email_marketing.read
    error_states: { transport_error: { status: 503, code: EMAIL_MAILING_LIST_DETAIL_UNAVAILABLE, message: This mailing list is temporarily unavailable. } }
    query: "SELECT l.id, l.row_version, l.name, l.description, l.subscriber_count, l.contact_count, l.mailing_count, l.bounce_count, l.optout_count, l.blacklist_count, l.company_name, l.is_public, l.favorite, l.active, l.state FROM mailing_lists l WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND l.id = :id"
actions:
  - { id: new_mailing_list_detail, type: navigate, permission: email_marketing.manage, navigate_to: /mailing-lists }
  - { id: edit_mailing_list_detail, type: server_form, permission: email_marketing.manage, title: Edit mailing list, action: email_marketing.lists.update, handler: yaml_mutation, operation: update, prefill: state.mailing_list_detail, refresh: [mailing_list_detail, mailing_lists], mutation: { operation: update, table: mailing_lists, fields: [name, description, company_name, is_public, favorite], required: [name], concurrency: { required: true }, guards: [{ query: "SELECT id FROM mailing_lists WHERE id = :id", status: 404, code: EMAIL_MAILING_LIST_NOT_FOUND, message: Mailing list not found. }, { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM mailing_lists WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: EMAIL_MAILING_LIST_EXISTS, message: A mailing list with this name already exists. }], result: { query: "SELECT * FROM mailing_lists WHERE id = :id" } }, fields: [{ field: name, label: Mailing list, type: text, required: true }, { field: description, label: Description, type: textarea }, { field: company_name, label: Company, type: text }, { field: is_public, label: Public list, type: checkbox }] }
  - { id: archive_mailing_list_detail, type: server, permission: email_marketing.manage, action: email_marketing.lists.archive, handler: yaml_mutation, operation: update, refresh: [mailing_list_detail, mailing_lists], mutation: { operation: update, table: mailing_lists, fields: [active, state], defaults: { active: false, state: Archived }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM mailing_lists WHERE id = :id AND active = true", status: 404, code: EMAIL_MAILING_LIST_NOT_FOUND, message: Active mailing list not found. }] } }
  - { id: restore_mailing_list_detail, type: server, permission: email_marketing.manage, action: email_marketing.lists.restore, handler: yaml_mutation, operation: update, refresh: [mailing_list_detail, mailing_lists], mutation: { operation: update, table: mailing_lists, fields: [active, state], defaults: { active: true, state: Active }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM mailing_lists WHERE id = :id AND active = false", status: 404, code: EMAIL_MAILING_LIST_NOT_FOUND, message: Archived mailing list not found. }] } }
  - { id: delete_mailing_list_detail, type: server, permission: email_marketing.manage, action: email_marketing.lists.delete, handler: yaml_mutation, operation: delete, refresh: [mailing_lists], mutation: { operation: delete, table: mailing_lists, concurrency: { required: true }, guards: [{ query: "SELECT id FROM mailing_lists WHERE id = :id", status: 404, code: EMAIL_MAILING_LIST_NOT_FOUND, message: Mailing list not found. }, { query: "SELECT id FROM mailing_lists WHERE id = :id AND subscriber_count = 0 AND contact_count = 0 AND mailing_count = 0", status: 409, code: EMAIL_MAILING_LIST_IN_USE, message: A mailing list with audience or mailings cannot be deleted; archive it instead. }] } }
  - { id: mailing_list_subscribers, type: navigate, permission: email_marketing.read, navigate_to: /mailing-lists, params: { id: '{state.mailing_list_detail.id}', metric: subscribers } }
  - { id: mailing_list_contacts, type: navigate, permission: email_marketing.read, navigate_to: /mailing-lists, params: { id: '{state.mailing_list_detail.id}', metric: contacts } }
  - { id: mailing_list_mailings, type: navigate, permission: email_marketing.read, navigate_to: /email-campaigns, params: { list_id: '{state.mailing_list_detail.id}' } }
  - { id: mailing_list_bounces, type: navigate, permission: email_marketing.read, navigate_to: /mailing-lists, params: { id: '{state.mailing_list_detail.id}', metric: bounces } }
