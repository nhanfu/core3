page: { id: email-utm-campaign-detail }
datasources:
  - id: email_utm_campaign_detail_stages
    permission: email_marketing.manage
    query: "SELECT id AS value, name AS label FROM email_marketing_campaign_stages ORDER BY sequence, id"
  - id: email_utm_campaign_detail
    single: true
    permission: email_marketing.manage
    error_states: { transport_error: { status: 503, code: EMAIL_UTM_CAMPAIGN_DETAIL_UNAVAILABLE, message: Campaign details are temporarily unavailable. } }
    query: "SELECT c.id, c.row_version, c.title, c.name, c.user_name, c.stage_id, c.stage_name, c.tag_names, c.active, c.color, c.mailing_mail_count, c.is_auto_campaign, c.company_name FROM email_marketing_utm_campaigns c WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND c.id = :id AND c.is_auto_campaign = false"
actions:
  - id: new_utm_campaign_detail
    type: navigate
    permission: email_marketing.manage
    navigate_to: /email-marketing/campaigns
  - id: edit_utm_campaign_detail
    type: server_form
    permission: email_marketing.manage
    title: Edit Campaign
    action: mass_mailing.action_view_utm_campaigns.update
    handler: yaml_mutation
    operation: update
    prefill: state.email_utm_campaign_detail
    refresh: [email_utm_campaign_detail, email_utm_campaigns]
    mutation:
      operation: update
      table: email_marketing_utm_campaigns
      fields: [title, name, user_name, stage_id, stage_name, tag_names, color]
      required: [title, stage_id]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM email_marketing_utm_campaigns WHERE id = :id AND is_auto_campaign = false", status: 404, code: EMAIL_UTM_CAMPAIGN_NOT_FOUND, message: Campaign not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:title AS VARCHAR))) > 0", status: 422, code: EMAIL_UTM_CAMPAIGN_TITLE_REQUIRED, message: A campaign name is required. }
        - { query: "SELECT id AS stage_id, name AS stage_name FROM email_marketing_campaign_stages WHERE id = :stage_id", status: 422, code: EMAIL_UTM_CAMPAIGN_STAGE_REQUIRED, message: Select a valid campaign stage., assign: true }
        - { query: "SELECT regexp_replace(lower(trim(CAST(:title AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS name", assign: true }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM email_marketing_utm_campaigns WHERE name = :name AND id <> :id)", status: 409, code: EMAIL_UTM_CAMPAIGN_EXISTS, message: A campaign with this name already exists. }
      result: { query: "SELECT * FROM email_marketing_utm_campaigns WHERE id = :id" }
    fields:
      - { field: title, label: Campaign Name, type: text, required: true }
      - { field: user_name, label: Responsible, type: text, required: true }
      - { field: stage_id, label: Stage, type: select, options_source: email_utm_campaign_detail_stages, required: true }
      - { field: tag_names, label: Tags, type: text }
      - { field: color, label: Color Index, type: number, min: 0, max: 11 }
  - id: archive_utm_campaign_detail
    type: server
    permission: email_marketing.manage
    action: mass_mailing.action_view_utm_campaigns.archive
    handler: yaml_mutation
    operation: update
    refresh: [email_utm_campaign_detail, email_utm_campaigns]
    mutation:
      operation: update
      table: email_marketing_utm_campaigns
      fields: [active]
      defaults: { active: false }
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM email_marketing_utm_campaigns WHERE id = :id AND active = true AND is_auto_campaign = false", status: 404, code: EMAIL_UTM_CAMPAIGN_NOT_FOUND, message: Active campaign not found. }
  - id: restore_utm_campaign_detail
    type: server
    permission: email_marketing.manage
    action: mass_mailing.action_view_utm_campaigns.restore
    handler: yaml_mutation
    operation: update
    refresh: [email_utm_campaign_detail, email_utm_campaigns]
    mutation:
      operation: update
      table: email_marketing_utm_campaigns
      fields: [active]
      defaults: { active: true }
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM email_marketing_utm_campaigns WHERE id = :id AND active = false AND is_auto_campaign = false", status: 404, code: EMAIL_UTM_CAMPAIGN_NOT_FOUND, message: Archived campaign not found. }
  - id: utm_campaign_mailings
    type: navigate
    permission: email_marketing.manage
    navigate_to: /email-mailings
    params: { campaign_name: '{state.email_utm_campaign_detail.title}' }
