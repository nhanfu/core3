page: { id: email-campaign-detail }
datasources:
  - id: email_campaign_detail
    single: true
    permission: email_marketing.read
    error_states: { transport_error: { status: 503, code: EMAIL_CAMPAIGN_DETAIL_UNAVAILABLE, message: This email campaign is temporarily unavailable. } }
    query: "SELECT c.id, c.row_version, c.name, c.subject, c.sender_name, c.sender_email, c.reply_to, c.list_id, c.list_name, c.recipient_model, c.recipient_domain, c.body, c.recipient_count, c.delivered_count, c.opened_count, c.clicked_count, c.failed_count, c.retriable_count, c.state, c.active, c.favorite, CAST(c.scheduled_at AS VARCHAR) AS scheduled_at, CAST(c.sent_at AS VARCHAR) AS sent_at FROM email_campaigns c WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND c.id = :id"
actions:
  - { id: new_email_campaign_detail, type: navigate, permission: email_marketing.write, navigate_to: /email-campaigns }
  - { id: edit_email_campaign_detail, type: server_form, permission: email_marketing.write, title: Edit email campaign, action: email_marketing.campaigns.update, handler: yaml_mutation, operation: update, prefill: state.email_campaign_detail, refresh: [email_campaign_detail, email_campaigns], mutation: { operation: update, table: email_campaigns, fields: [name, subject, sender_name, sender_email, reply_to, list_id, list_name, body, recipient_model, recipient_domain, scheduled_at, recipient_count], required: [name, subject, sender_name, sender_email, list_id, list_name, body, recipient_count], concurrency: { required: true }, guards: [{ query: "SELECT id FROM email_campaigns WHERE id = :id", status: 404, code: EMAIL_CAMPAIGN_NOT_FOUND, message: Email campaign not found. }, { query: "SELECT 1 AS ok FROM email_campaigns WHERE id = :id AND state NOT IN ('Sent', 'Sending')", status: 409, code: EMAIL_CAMPAIGN_IMMUTABLE, message: Sent or sending campaigns cannot be edited. }, { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:body AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:sender_name AS VARCHAR))) > 0 AND regexp_matches(TRIM(CAST(:sender_email AS VARCHAR)), '^[^@ ]+@[^@ ]+\\.[^@ ]+$') AND CAST(:recipient_count AS INTEGER) > 0", status: 422, code: EMAIL_CAMPAIGN_REQUIRED_FIELDS, message: Sender, body, valid email, and recipients are required. }, { query: "SELECT 1 AS ok FROM mailing_lists WHERE id = :list_id AND active = true", status: 409, code: EMAIL_CAMPAIGN_AUDIENCE_UNAVAILABLE, message: Select an active mailing list. }], result: { query: "SELECT * FROM email_campaigns WHERE id = :id" } }, fields: [{ field: name, label: Campaign, type: text, required: true }, { field: subject, label: Subject, type: text, required: true }, { field: sender_name, label: Sender name, type: text, required: true }, { field: sender_email, label: Sender email, type: text, required: true }, { field: reply_to, label: Reply-to, type: text }, { field: list_id, label: Audience, type: select, options_source: mailing_list_lookup, required: true }, { field: list_name, label: Audience name, type: text, required: true }, { field: body, label: HTML body, type: textarea, required: true }, { field: recipient_model, label: Recipient model, type: text }, { field: recipient_domain, label: Recipient domain, type: textarea }, { field: scheduled_at, label: Scheduled at, type: text }, { field: recipient_count, label: Recipients, type: number, required: true }] }
  - { id: schedule_email_campaign_detail, type: server, permission: email_marketing.write, action: email_marketing.campaigns.schedule, handler: order_transition, workflow: email_campaigns, operation: schedule, params: { id: '{state.id}' }, refresh: [email_campaign_detail, email_campaigns] }
  - { id: send_email_campaign_detail, type: server, permission: email_marketing.write, action: email_marketing.campaigns.send, handler: order_transition, workflow: email_campaigns, operation: send, params: { id: '{state.id}' }, refresh: [email_campaign_detail, email_campaigns] }
  - { id: complete_email_campaign_detail, type: server, permission: email_marketing.manage, action: email_marketing.campaigns.complete, handler: order_transition, workflow: email_campaigns, operation: complete, params: { id: '{state.id}' }, refresh: [email_campaign_detail, email_campaigns] }
  - { id: cancel_email_campaign_detail, type: server, permission: email_marketing.manage, action: email_marketing.campaigns.cancel, handler: order_transition, workflow: email_campaigns, operation: cancel, params: { id: '{state.id}' }, refresh: [email_campaign_detail, email_campaigns] }
  - { id: archive_email_campaign_detail, type: server, permission: email_marketing.manage, action: email_marketing.campaigns.archive, handler: yaml_mutation, operation: update, refresh: [email_campaign_detail, email_campaigns], mutation: { operation: update, table: email_campaigns, fields: [active], defaults: { active: false }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM email_campaigns WHERE id = :id AND active = true AND state <> 'Sending'", status: 409, code: EMAIL_CAMPAIGN_ARCHIVE_BLOCKED, message: Sending campaigns cannot be archived. }] } }
  - { id: restore_email_campaign_detail, type: server, permission: email_marketing.manage, action: email_marketing.campaigns.restore, handler: yaml_mutation, operation: update, refresh: [email_campaign_detail, email_campaigns], mutation: { operation: update, table: email_campaigns, fields: [active], defaults: { active: true }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM email_campaigns WHERE id = :id AND active = false", status: 404, code: EMAIL_CAMPAIGN_NOT_FOUND, message: Archived campaign not found. }] } }
  - { id: campaign_recipients, type: navigate, permission: email_marketing.read, navigate_to: /email-campaigns, params: { id: '{state.email_campaign_detail.id}' } }
  - { id: campaign_delivered, type: navigate, permission: email_marketing.read, navigate_to: /email-campaigns, params: { id: '{state.email_campaign_detail.id}', metric: delivered } }
  - { id: campaign_opened, type: navigate, permission: email_marketing.read, navigate_to: /email-campaigns, params: { id: '{state.email_campaign_detail.id}', metric: opened } }
  - { id: campaign_clicked, type: navigate, permission: email_marketing.read, navigate_to: /email-campaigns, params: { id: '{state.email_campaign_detail.id}', metric: clicked } }
