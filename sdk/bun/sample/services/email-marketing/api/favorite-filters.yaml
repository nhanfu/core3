page: { id: email-favorite-filters }
datasources:
  - id: email_favorite_filter_models
    permission: email_marketing.read
    query: "SELECT value, label FROM (VALUES ('res.partner', 'Contacts'), ('mailing.contact', 'Mailing Contacts'), ('res.users', 'Users')) models(value, label) ORDER BY label"
  - id: email_favorite_filters
    permission: email_marketing.read
    error_states: { transport_error: { status: 503, code: EMAIL_FAVORITE_FILTERS_UNAVAILABLE, message: Favorite filters are temporarily unavailable. } }
    query: "SELECT f.id, f.row_version, f.name, f.saved_by, f.recipient_model, f.recipient_model_label, f.mailing_domain, f.saved_by_me, CAST(f.created_at AS VARCHAR) AS created_at FROM email_marketing_favorite_filters f WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR f.name ILIKE '%' || :q || '%' OR f.mailing_domain ILIKE '%' || :q || '%' OR f.recipient_model_label ILIKE '%' || :q || '%') AND (:saved_by_me IS NULL OR f.saved_by_me = CAST(:saved_by_me AS BOOLEAN)) AND (:recipient_model IS NULL OR f.recipient_model = :recipient_model) ORDER BY f.name, f.id"
actions:
  - id: create_email_favorite_filter
    type: server_form
    permission: email_marketing.write
    title: New Favorite Filter
    action: email_marketing.favorite_filters.create
    handler: yaml_mutation
    operation: create
    refresh: [email_favorite_filters]
    mutation:
      operation: insert
      table: email_marketing_favorite_filters
      fields: [name, recipient_model, recipient_model_label, mailing_domain, saved_by, saved_by_me]
      required: [name, recipient_model, mailing_domain]
      defaults: { recipient_model_label: Contacts, saved_by: admin@core3.local, saved_by_me: true, row_version: 1, created_at: '2026-01-15 09:30:00', updated_at: '2026-01-15 09:30:00' }
      generated: [id]
      before_steps: [{ query: "SELECT 'email-filter-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:recipient_model AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:mailing_domain AS VARCHAR))) > 0", status: 422, code: EMAIL_FAVORITE_FILTER_REQUIRED_FIELDS, message: Filter name, recipients model, and domain are required. }
        - { query: "SELECT 1 AS ok WHERE CAST(:recipient_model AS VARCHAR) IN ('res.partner', 'mailing.contact', 'res.users')", status: 422, code: EMAIL_FAVORITE_FILTER_MODEL_UNSUPPORTED, message: Select a supported recipients model. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM email_marketing_favorite_filters WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))))", status: 409, code: EMAIL_FAVORITE_FILTER_EXISTS, message: A favorite filter with this name already exists. }
      result: { query: "SELECT * FROM email_marketing_favorite_filters WHERE id = :id" }
    fields:
      - { field: name, label: Filter Name, type: text, required: true }
      - { field: recipient_model, label: Recipients Model, type: select, options_source: email_favorite_filter_models, required: true }
      - { field: recipient_model_label, label: Recipients Model Name, type: text }
      - { field: mailing_domain, label: Filter Domain, type: textarea, required: true }
  - id: edit_email_favorite_filter
    type: server_form
    permission: email_marketing.write
    title: Edit Favorite Filter
    action: email_marketing.favorite_filters.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [email_favorite_filters, email_favorite_filter_detail]
    mutation:
      operation: update
      table: email_marketing_favorite_filters
      fields: [name, recipient_model, recipient_model_label, mailing_domain]
      required: [name, recipient_model, mailing_domain]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM email_marketing_favorite_filters WHERE id = :id", status: 404, code: EMAIL_FAVORITE_FILTER_NOT_FOUND, message: Favorite filter not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:recipient_model AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:mailing_domain AS VARCHAR))) > 0", status: 422, code: EMAIL_FAVORITE_FILTER_REQUIRED_FIELDS, message: Filter name, recipients model, and domain are required. }
        - { query: "SELECT 1 AS ok WHERE CAST(:recipient_model AS VARCHAR) IN ('res.partner', 'mailing.contact', 'res.users')", status: 422, code: EMAIL_FAVORITE_FILTER_MODEL_UNSUPPORTED, message: Select a supported recipients model. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM email_marketing_favorite_filters WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: EMAIL_FAVORITE_FILTER_EXISTS, message: A favorite filter with this name already exists. }
      result: { query: "SELECT * FROM email_marketing_favorite_filters WHERE id = :id" }
    fields:
      - { field: name, label: Filter Name, type: text, required: true }
      - { field: recipient_model, label: Recipients Model, type: select, options_source: email_favorite_filter_models, required: true }
      - { field: recipient_model_label, label: Recipients Model Name, type: text }
      - { field: mailing_domain, label: Filter Domain, type: textarea, required: true }
  - id: delete_email_favorite_filter
    type: server
    permission: email_marketing.write
    action: email_marketing.favorite_filters.delete
    handler: yaml_mutation
    operation: delete
    refresh: [email_favorite_filters]
    mutation:
      operation: delete
      table: email_marketing_favorite_filters
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM email_marketing_favorite_filters WHERE id = :id", status: 404, code: EMAIL_FAVORITE_FILTER_NOT_FOUND, message: Favorite filter not found. }]
