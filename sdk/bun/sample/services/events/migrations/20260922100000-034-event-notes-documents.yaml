version: 0.0.34
kind: schema
description: Durable Odoo Events Notes and Documents fields and badge background metadata
type:
  postgres:
    up: |
      ALTER TABLE events ADD COLUMN IF NOT EXISTS badge_format VARCHAR;
      ALTER TABLE events ADD COLUMN IF NOT EXISTS badge_image_file_name VARCHAR;
      ALTER TABLE events ADD COLUMN IF NOT EXISTS badge_image_mime_type VARCHAR;
      ALTER TABLE events ADD COLUMN IF NOT EXISTS badge_image_size_bytes BIGINT;
      ALTER TABLE events ADD COLUMN IF NOT EXISTS badge_image_storage_key VARCHAR;
      ALTER TABLE events ADD COLUMN IF NOT EXISTS badge_image_uploaded_by VARCHAR;
      ALTER TABLE events ADD COLUMN IF NOT EXISTS badge_image_updated_at TIMESTAMP;
      ALTER TABLE events ADD COLUMN IF NOT EXISTS ticket_instructions VARCHAR;
      ALTER TABLE events ADD COLUMN IF NOT EXISTS note VARCHAR;
      UPDATE events SET badge_format = COALESCE(NULLIF(badge_format, ''), 'A6'), ticket_instructions = COALESCE(ticket_instructions, '<p>Bring this ticket to the registration desk.</p>') WHERE id = 'event-demo-001';
    down: |
      ALTER TABLE events DROP COLUMN IF EXISTS note;
      ALTER TABLE events DROP COLUMN IF EXISTS ticket_instructions;
      ALTER TABLE events DROP COLUMN IF EXISTS badge_image_updated_at;
      ALTER TABLE events DROP COLUMN IF EXISTS badge_image_uploaded_by;
      ALTER TABLE events DROP COLUMN IF EXISTS badge_image_storage_key;
      ALTER TABLE events DROP COLUMN IF EXISTS badge_image_size_bytes;
      ALTER TABLE events DROP COLUMN IF EXISTS badge_image_mime_type;
      ALTER TABLE events DROP COLUMN IF EXISTS badge_image_file_name;
      ALTER TABLE events DROP COLUMN IF EXISTS badge_format;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
