      CREATE TABLE IF NOT EXISTS event_mail_schedulers (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        event_id VARCHAR NOT NULL,
        event_name VARCHAR NOT NULL,
        sequence INTEGER NOT NULL DEFAULT 0,
        template_ref VARCHAR NOT NULL,
        interval_nbr INTEGER NOT NULL DEFAULT 1,
        interval_unit VARCHAR NOT NULL,
        interval_type VARCHAR NOT NULL,
        scheduled_date TIMESTAMP NOT NULL,
        mail_count_done INTEGER NOT NULL DEFAULT 0,
        mail_state VARCHAR NOT NULL DEFAULT 'scheduled',
        notification_type VARCHAR NOT NULL DEFAULT 'mail',
        mail_done BOOLEAN NOT NULL DEFAULT FALSE,
        error_datetime TIMESTAMP,
        last_registration_id VARCHAR,
        registration_mail_count INTEGER NOT NULL DEFAULT 0
      );
      CREATE TABLE IF NOT EXISTS event_mail_scheduler_registrations (
        id VARCHAR PRIMARY KEY,
        scheduler_id VARCHAR NOT NULL,
        attendee_name VARCHAR NOT NULL,
        scheduled_date TIMESTAMP NOT NULL,
        mail_sent BOOLEAN NOT NULL DEFAULT FALSE
