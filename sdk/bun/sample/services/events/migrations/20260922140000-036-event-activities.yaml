version: 0.0.36
kind: schema
description: Durable Odoo Events activity scheduling and completion records
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS event_activities (
        id VARCHAR PRIMARY KEY,
        event_id VARCHAR NOT NULL,
        row_version BIGINT NOT NULL DEFAULT 1,
        activity_type VARCHAR NOT NULL DEFAULT 'todo',
        summary VARCHAR NOT NULL,
        due_date DATE,
        assigned_user_id VARCHAR,
        assigned_user_name VARCHAR,
        state VARCHAR NOT NULL DEFAULT 'planned',
        completed_at TIMESTAMP,
        actor_id VARCHAR,
        actor_name VARCHAR,
        action VARCHAR,
        action_label VARCHAR,
        detail VARCHAR,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00'
      );
      CREATE INDEX IF NOT EXISTS event_activities_event_idx ON event_activities(event_id, due_date, id);
      INSERT INTO event_activities(
        id, event_id, row_version, activity_type, summary, due_date,
        assigned_user_id, assigned_user_name, state, actor_id, actor_name,
        action, action_label, detail, created_at, updated_at
      )
      SELECT
        'event-activity-demo-001', e.id, 1, 'todo', 'Confirm event details', DATE '2026-01-16',
        'user-admin', 'Admin User', 'planned', 'user-admin', 'Admin User',
        'events.records.activity.schedule', 'Activity scheduled', 'Confirm event details',
        TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00'
      FROM events e
      WHERE e.id = 'event-demo-001'
      ON CONFLICT (id) DO NOTHING;
    down: |
      DROP TABLE IF EXISTS event_activities;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
database: duckdb
