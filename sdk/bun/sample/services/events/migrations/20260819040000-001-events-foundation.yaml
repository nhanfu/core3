version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS events (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        event_type VARCHAR, organizer VARCHAR, venue VARCHAR, description VARCHAR,
        capacity INTEGER NOT NULL DEFAULT 0, registration_count INTEGER NOT NULL DEFAULT 0,
        start_at TIMESTAMP, end_at TIMESTAMP, state VARCHAR NOT NULL DEFAULT 'Draft',
        row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS event_registrations (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), event_id VARCHAR NOT NULL,
        event_name VARCHAR NOT NULL, attendee_name VARCHAR NOT NULL, attendee_email VARCHAR,
        ticket_type VARCHAR, state VARCHAR NOT NULL DEFAULT 'Registered', registered_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS events_state_idx ON events(state);
      CREATE INDEX IF NOT EXISTS event_registrations_event_idx ON event_registrations(event_id);
    down: |
      DROP TABLE IF EXISTS event_registrations;
      DROP TABLE IF EXISTS events;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
