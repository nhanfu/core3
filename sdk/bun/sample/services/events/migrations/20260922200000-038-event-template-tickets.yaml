version: 0.0.38
kind: schema
description: Durable Odoo Events template ticket relation
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS event_template_tickets (
        id VARCHAR PRIMARY KEY,
        template_id VARCHAR NOT NULL,
        sequence INTEGER NOT NULL DEFAULT 10,
        name VARCHAR NOT NULL,
        description VARCHAR,
        seats_limited BOOLEAN NOT NULL DEFAULT false,
        seats_max INTEGER NOT NULL DEFAULT 0,
        row_version BIGINT NOT NULL DEFAULT 1
      );
      CREATE INDEX IF NOT EXISTS event_template_tickets_template_idx ON event_template_tickets(template_id, sequence, id);
      INSERT INTO event_template_tickets(id, template_id, sequence, name, description, seats_limited, seats_max, row_version) VALUES
        ('event-template-ticket-exhibition-free', 'template-exhibition', 10, 'Free', 'Free entrance, no food!', false, 0, 1),
        ('event-template-ticket-exhibition-standard', 'template-exhibition', 20, 'Standard', 'Access to catering.', true, 50, 1),
        ('event-template-ticket-exhibition-vip', 'template-exhibition', 30, 'VIP', 'Priority access and premium seating.', true, 20, 1)
      ON CONFLICT (id) DO NOTHING;
    down: |
      DROP TABLE IF EXISTS event_template_tickets;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
