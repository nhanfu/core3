version: 0.0.42
kind: schema
description: Durable Odoo Events event.type tag_ids relation
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS event_template_tags (
        id VARCHAR PRIMARY KEY,
        template_id VARCHAR NOT NULL,
        tag_id VARCHAR NOT NULL,
        sequence INTEGER NOT NULL DEFAULT 10,
        row_version BIGINT NOT NULL DEFAULT 1,
        UNIQUE (template_id, tag_id)
      );
      CREATE INDEX IF NOT EXISTS event_template_tags_template_idx ON event_template_tags(template_id, sequence, id);
      CREATE INDEX IF NOT EXISTS event_template_tags_tag_idx ON event_template_tags(tag_id, template_id);
      INSERT INTO event_template_tags(id, template_id, tag_id, sequence, row_version)
      SELECT 'event-template-tag-exhibition-music', 'template-exhibition', t.id, 10, 1
      FROM event_tags t
      WHERE t.id = 'event-tag-culture-music'
        AND EXISTS (SELECT 1 FROM event_templates WHERE id = 'template-exhibition')
      ON CONFLICT (id) DO NOTHING;
      INSERT INTO event_template_tags(id, template_id, tag_id, sequence, row_version)
      SELECT 'event-template-tag-exhibition-conference', 'template-exhibition', t.id, 20, 1
      FROM event_tags t
      WHERE t.id = 'event-tag-activity-conference'
        AND EXISTS (SELECT 1 FROM event_templates WHERE id = 'template-exhibition')
      ON CONFLICT (id) DO NOTHING;
    down: |
      DROP TABLE IF EXISTS event_template_tags;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
