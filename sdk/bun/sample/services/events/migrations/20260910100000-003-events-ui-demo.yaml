      CREATE TABLE IF NOT EXISTS event_questions (id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), title VARCHAR NOT NULL, question_type VARCHAR NOT NULL, mandatory BOOLEAN NOT NULL DEFAULT false, once_per_order BOOLEAN NOT NULL DEFAULT false, answers VARCHAR);
