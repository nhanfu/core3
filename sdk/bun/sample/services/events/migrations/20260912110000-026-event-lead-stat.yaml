version: 0.0.26
description: Deterministic event-scoped CRM leads for the event form Leads stat action
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS event_linked_leads (
        id VARCHAR PRIMARY KEY,
        event_id VARCHAR NOT NULL,
        crm_lead_id VARCHAR NOT NULL,
        name VARCHAR NOT NULL,
        partner_name VARCHAR NOT NULL,
        stage VARCHAR NOT NULL,
        salesperson VARCHAR NOT NULL,
        expected_revenue DECIMAL(18, 2) NOT NULL DEFAULT 0,
        probability INTEGER NOT NULL DEFAULT 10,
        expected_closing DATE NOT NULL
      );
