version: 0.0.6
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS event_tickets (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
        event_id VARCHAR NOT NULL,
        name VARCHAR NOT NULL,
        price DECIMAL(12,2) NOT NULL DEFAULT 0,
        registration_start TIMESTAMP,
        registration_end TIMESTAMP,
        maximum INTEGER NOT NULL DEFAULT 0,
        registration_count INTEGER NOT NULL DEFAULT 0,
        row_version BIGINT NOT NULL DEFAULT 1
      );
      CREATE TABLE IF NOT EXISTS event_event_questions (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
        event_id VARCHAR NOT NULL,
        question VARCHAR NOT NULL,
        question_type VARCHAR NOT NULL,
        mandatory BOOLEAN NOT NULL DEFAULT false,
        once_per_order BOOLEAN NOT NULL DEFAULT false,
        answers VARCHAR,
        row_version BIGINT NOT NULL DEFAULT 1
      );
      CREATE TABLE IF NOT EXISTS event_slots (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
        event_id VARCHAR NOT NULL,
        name VARCHAR NOT NULL,
        start_at TIMESTAMP NOT NULL,
        end_at TIMESTAMP NOT NULL,
        seats INTEGER NOT NULL DEFAULT 0,
        registration_count INTEGER NOT NULL DEFAULT 0,
        state VARCHAR NOT NULL DEFAULT 'Open',
        row_version BIGINT NOT NULL DEFAULT 1,
        date_tz VARCHAR NOT NULL DEFAULT 'Europe/Brussels',
        color VARCHAR NOT NULL DEFAULT '#875A7B'
      );
      INSERT INTO event_tickets(id, event_id, name, price, registration_end, maximum, registration_count) VALUES
        ('ticket-event-007-standard', 'event-demo-007', 'Standard', 0, TIMESTAMP '2026-09-11 22:00:00', 0, 2),
        ('ticket-event-007-vip', 'event-demo-007', 'VIP', 0, TIMESTAMP '2026-09-11 22:00:00', 10, 2)
      ON CONFLICT (id) DO NOTHING;
      INSERT INTO event_event_questions(id, event_id, question, question_type, mandatory, once_per_order, answers) VALUES
        ('event-question-007-name', 'event-demo-007', 'Name', 'Name', true, false, ''),
        ('event-question-007-email', 'event-demo-007', 'Email', 'Email', true, false, ''),
        ('event-question-007-company', 'event-demo-007', 'Company', 'Text', false, false, '')
      ON CONFLICT (id) DO NOTHING;
      INSERT INTO event_slots(id, event_id, name, start_at, end_at, seats, registration_count, state) VALUES
        ('slot-event-007-main', 'event-demo-007', 'Main session', TIMESTAMP '2026-09-28 16:00:00', TIMESTAMP '2026-09-28 17:30:00', 0, 1, 'Open')
      ON CONFLICT (id) DO NOTHING;
    down: |
      DROP TABLE IF EXISTS event_slots;
      DROP TABLE IF EXISTS event_event_questions;
      DROP TABLE IF EXISTS event_tickets;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
