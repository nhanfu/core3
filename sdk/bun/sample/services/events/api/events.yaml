page: { id: events }
datasources:
  - id: event_states
    permission: events.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Published','Published'), ('In Progress','In Progress'), ('Completed','Completed'), ('Cancelled','Cancelled')) states(value, label)"
  - id: events
    permission: events.read
    workflow: events
    pivot:
      fields: [state, event_type, start_at, capacity, registration_count]
    query: "SELECT e.id, e.row_version, e.name, e.event_type, e.organizer, e.venue, e.capacity, e.registration_count, CAST(e.start_at AS VARCHAR) AS start_at, CAST(e.end_at AS VARCHAR) AS end_at, e.state, CASE e.state WHEN 'Draft' THEN 'todo' WHEN 'Published' THEN 'email' WHEN 'In Progress' THEN 'call' WHEN 'Completed' THEN 'meeting' ELSE 'todo' END AS activity_type, CASE e.state WHEN 'Draft' THEN 'Confirm event details' WHEN 'Published' THEN 'Send event reminder' WHEN 'In Progress' THEN 'Check registrations' WHEN 'Completed' THEN 'Review event results' ELSE 'Review event' END AS activity_summary, CAST(e.start_at AS VARCHAR) AS activity_date, e.organizer AS activity_user, CASE e.state WHEN 'Completed' THEN 'done' WHEN 'Draft' THEN 'overdue' WHEN 'Published' THEN 'today' ELSE 'planned' END AS activity_state, 1 AS activity_count FROM events e WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR e.name ILIKE '%' || :q || '%' OR e.event_type ILIKE '%' || :q || '%') AND (:state IS NULL OR e.state = :state) ORDER BY e.start_at DESC"
