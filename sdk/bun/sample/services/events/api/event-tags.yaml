page: { id: event-tags }
datasources:
  - id: event_tag_categories
    permission: events.read
    query: "SELECT c.id, c.name, COALESCE((SELECT string_agg(t.name, ', ' ORDER BY t.sequence, t.id) FROM event_tags t WHERE t.category_id = c.id), c.tags, '') AS tags, c.activity, c.age FROM event_tag_categories c WHERE (:q IS NULL OR c.name ILIKE '%' || :q || '%') ORDER BY c.name"
