page: { id: event-template-detail }
datasources:
  - id: event_template_detail
    single: true
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_TEMPLATE_DETAIL_UNAVAILABLE, message: Event template details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, seats, active, 'Event Template' AS template_label FROM event_templates WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
  - id: event_template_tags
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_TEMPLATE_TAGS_UNAVAILABLE, message: Template tags are temporarily unavailable. } }
    query: "SELECT l.id, l.row_version, l.template_id, l.tag_id, t.name, t.color, c.name AS category FROM event_template_tags l JOIN event_tags t ON t.id = l.tag_id JOIN event_tag_categories c ON c.id = t.category_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND l.template_id = :id ORDER BY l.sequence, t.name, t.id"
  - id: event_template_tag_options
    permission: events.read
    query: "SELECT t.id AS value, t.name || ' · ' || c.name AS label FROM event_tags t JOIN event_tag_categories c ON c.id = t.category_id WHERE NOT EXISTS (SELECT 1 FROM event_template_tags l WHERE l.template_id = :id AND l.tag_id = t.id) ORDER BY t.name, t.id"
  - id: event_template_communications
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_TEMPLATE_COMMUNICATIONS_UNAVAILABLE, message: Template communication schedules are temporarily unavailable. } }
    query: "SELECT id, row_version, template_id, sequence, template_name, interval_nbr, CASE interval_unit WHEN 'now' THEN 'Immediately' WHEN 'hours' THEN 'Hours' WHEN 'days' THEN 'Days' WHEN 'weeks' THEN 'Weeks' WHEN 'months' THEN 'Months' ELSE interval_unit END AS interval_unit, CASE interval_type WHEN 'after_sub' THEN 'After each registration' WHEN 'before_event' THEN 'Before the event starts' WHEN 'after_event_start' THEN 'After the event started' WHEN 'after_event' THEN 'After the event ended' WHEN 'before_event_end' THEN 'Before the event ends' ELSE interval_type END AS interval_type FROM event_template_communications WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND template_id = :id ORDER BY sequence, id"
  - id: event_template_questions
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_TEMPLATE_QUESTIONS_UNAVAILABLE, message: Template questions are temporarily unavailable. } }
    query: "SELECT l.id, l.row_version, l.template_id, l.question_id, l.sequence, q.title, q.mandatory, q.once_per_order, q.question_type, COALESCE(q.answers, '') AS answers FROM event_template_questions l JOIN event_questions q ON q.id = l.question_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND l.template_id = :id ORDER BY l.sequence, l.id"
  - id: event_template_question_options
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_TEMPLATE_QUESTION_OPTIONS_UNAVAILABLE, message: Reusable event questions are temporarily unavailable. } }
    query: "SELECT q.id AS value, q.title AS label FROM event_questions q WHERE NOT EXISTS (SELECT 1 FROM event_template_questions l WHERE l.template_id = :id AND l.question_id = q.id) ORDER BY q.title, q.id"
actions:
  - id: add_event_template_tag
    type: server_form
    permission: events.write
    title: Add a tag
    action: events.templates.tags.create
    handler: line_item
    operation: create
    domain: event_template
    params: { id: '{state.id}' }
    refresh: [event_template_detail, event_template_tags, event_template_tag_options, event_templates]
    fields:
      - { field: tag_id, label: Tag, type: select, options_source: event_template_tag_options, required: true }
    mutation:
      generated: [line_id, next_sequence]
      before_steps:
        - { query: "SELECT 'event-template-tag-' || :id || '-' || CAST(:tag_id AS VARCHAR) AS line_id, COALESCE(MAX(sequence), 0) + 10 AS next_sequence FROM event_template_tags WHERE template_id = :id", assign: true }
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event template changed. Reload before adding a tag. }
        - { query: "SELECT id FROM event_tags WHERE id = :tag_id", status: 422, code: EVENT_TEMPLATE_TAG_INVALID, message: Select a valid event tag. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_template_tags WHERE template_id = :id AND tag_id = :tag_id)", status: 409, code: EVENT_TEMPLATE_TAG_EXISTS, message: This tag is already linked to the template. }
      steps:
        - { query: "INSERT INTO event_template_tags(id, template_id, tag_id, sequence, row_version) VALUES(:line_id, :id, :tag_id, :next_sequence, 1)", expect_changed: true, status: 409, code: EVENT_TEMPLATE_TAG_NOT_CREATED, message: The template tag could not be added. }
        - { query: "UPDATE event_templates SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event template changed while adding a tag. }
      result: { query: "SELECT l.*, t.name, t.color, c.name AS category FROM event_template_tags l JOIN event_tags t ON t.id = l.tag_id JOIN event_tag_categories c ON c.id = t.category_id WHERE l.id = :line_id" }
  - id: remove_event_template_tag
    type: server
    permission: events.write
    action: events.templates.tags.delete
    handler: line_item
    operation: delete
    domain: event_template
    params: { id: '{state.id}', line_id: '{row.id}' }
    confirm: 'Remove this tag from the template?'
    refresh: [event_template_detail, event_template_tags, event_template_tag_options, event_templates]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event template changed. Reload before removing the tag. }
        - { query: "SELECT id FROM event_template_tags WHERE id = :line_id AND template_id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_TEMPLATE_TAG_STALE, message: This template tag changed or was removed. Reload before removing. }
      steps:
        - { query: "DELETE FROM event_template_tags WHERE id = :line_id AND template_id = :id AND row_version = :expected_row_version", expect_changed: true, code: EVENT_TEMPLATE_TAG_STALE, message: This template tag changed or was removed. Reload before removing. }
        - { query: "UPDATE event_templates SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event template changed while removing a tag. Reload before saving. }
      result: { query: "SELECT true AS deleted, :line_id AS id" }
  - id: add_event_template_communication
    type: server_form
    permission: events.write
    title: Add a line
    action: events.templates.communications.create
    handler: line_item
    operation: create
    domain: event_template
    params: { id: '{state.id}' }
    refresh: [event_template_detail, event_template_communications]
    fields:
      - { field: template_name, label: Template, type: select, options: ['Event: Registration Confirmation', 'Event: Reminder'], required: true }
      - { field: interval_nbr, label: Interval, type: number, min: 0, required: true }
      - { field: interval_unit, label: Unit, type: select, options: [Immediately, Hours, Days, Weeks, Months], required: true }
      - { field: interval_type, label: Trigger, type: select, options: ['After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends'], required: true }
    mutation:
      generated: [line_id]
      before_steps:
        - { query: "SELECT 'event-template-mail-' || :id || '-' || CAST(COALESCE(MAX(sequence), 0) + 10 AS VARCHAR) AS line_id, COALESCE(MAX(sequence), 0) + 10 AS next_sequence FROM event_template_communications WHERE template_id = :id", assign: true }
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event template changed. Reload before adding a communication schedule. }
        - { query: "SELECT 1 AS ok WHERE CAST(:template_name AS VARCHAR) IN ('Event: Registration Confirmation', 'Event: Reminder') AND CAST(:interval_unit AS VARCHAR) IN ('Immediately', 'Hours', 'Days', 'Weeks', 'Months') AND CAST(:interval_type AS VARCHAR) IN ('After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends') AND CAST(:interval_nbr AS INTEGER) >= 0 AND (CAST(:interval_unit AS VARCHAR) <> 'Immediately' OR CAST(:interval_nbr AS INTEGER) = 0) AND (CAST(:interval_unit AS VARCHAR) = 'Immediately' OR CAST(:interval_nbr AS INTEGER) > 0)", status: 422, code: EVENT_TEMPLATE_COMMUNICATION_INVALID, message: Enter a valid template, interval, unit, and trigger. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_template_communications WHERE template_id = :id AND template_name = :template_name AND interval_nbr = CAST(:interval_nbr AS INTEGER) AND interval_unit = CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END AND interval_type = CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END)", status: 409, code: EVENT_TEMPLATE_COMMUNICATION_EXISTS, message: This communication schedule already exists for the template. }
      steps:
        - { query: "INSERT INTO event_template_communications(id, template_id, sequence, template_name, interval_nbr, interval_unit, interval_type, row_version) VALUES(:line_id, :id, :next_sequence, :template_name, CAST(:interval_nbr AS INTEGER), CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END, CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END, 1)" }
        - { query: "UPDATE event_templates SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event template changed while adding a communication schedule. Reload before saving. }
      result: { query: "SELECT * FROM event_template_communications WHERE id = :line_id" }
  - id: edit_event_template_communication
    type: server_form
    permission: events.write
    title: Edit communication schedule
    action: events.templates.communications.update
    handler: line_item
    operation: update
    domain: event_template
    params: { id: '{state.id}', line_id: '{row.id}' }
    prefill: row
    refresh: [event_template_detail, event_template_communications]
    fields:
      - { field: template_name, label: Template, type: select, options: ['Event: Registration Confirmation', 'Event: Reminder'], required: true }
      - { field: interval_nbr, label: Interval, type: number, min: 0, required: true }
      - { field: interval_unit, label: Unit, type: select, options: [Immediately, Hours, Days, Weeks, Months], required: true }
      - { field: interval_type, label: Trigger, type: select, options: ['After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends'], required: true }
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event template changed. Reload before saving the communication schedule. }
        - { query: "SELECT id FROM event_template_communications WHERE id = :line_id AND template_id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_TEMPLATE_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE CAST(:template_name AS VARCHAR) IN ('Event: Registration Confirmation', 'Event: Reminder') AND CAST(:interval_unit AS VARCHAR) IN ('Immediately', 'Hours', 'Days', 'Weeks', 'Months') AND CAST(:interval_type AS VARCHAR) IN ('After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends') AND CAST(:interval_nbr AS INTEGER) >= 0 AND (CAST(:interval_unit AS VARCHAR) <> 'Immediately' OR CAST(:interval_nbr AS INTEGER) = 0) AND (CAST(:interval_unit AS VARCHAR) = 'Immediately' OR CAST(:interval_nbr AS INTEGER) > 0)", status: 422, code: EVENT_TEMPLATE_COMMUNICATION_INVALID, message: Enter a valid template, interval, unit, and trigger. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_template_communications WHERE template_id = :id AND template_name = :template_name AND interval_nbr = CAST(:interval_nbr AS INTEGER) AND interval_unit = CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END AND interval_type = CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END AND id <> :line_id)", status: 409, code: EVENT_TEMPLATE_COMMUNICATION_EXISTS, message: This communication schedule already exists for the template. }
      steps:
        - { query: "UPDATE event_template_communications SET template_name = :template_name, interval_nbr = CAST(:interval_nbr AS INTEGER), interval_unit = CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END, interval_type = CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END, row_version = row_version + 1 WHERE id = :line_id AND template_id = :id AND row_version = :expected_row_version", expect_changed: true, code: EVENT_TEMPLATE_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. Reload before saving. }
        - { query: "UPDATE event_templates SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event template changed while saving the communication schedule. Reload before saving. }
      result: { query: "SELECT * FROM event_template_communications WHERE id = :line_id" }
  - id: delete_event_template_communication
    type: server
    permission: events.write
    action: events.templates.communications.delete
    handler: line_item
    operation: delete
    domain: event_template
    params: { id: '{state.id}', line_id: '{row.id}' }
    confirm: 'Delete this communication schedule?'
    refresh: [event_template_detail, event_template_communications]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event template changed. Reload before deleting the communication schedule. }
        - { query: "SELECT id FROM event_template_communications WHERE id = :line_id AND template_id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_TEMPLATE_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. Reload before deleting. }
      steps:
        - { query: "DELETE FROM event_template_communications WHERE id = :line_id AND template_id = :id AND row_version = :expected_row_version", expect_changed: true, code: EVENT_TEMPLATE_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. Reload before deleting. }
        - { query: "UPDATE event_templates SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event template changed while deleting the communication schedule. Reload before saving. }
      result: { query: "SELECT true AS deleted, :line_id AS id" }
  - id: add_event_template_question
    type: server_form
    permission: events.write
    title: Add a line
    action: events.templates.questions.create
    handler: line_item
    operation: create
    domain: event_template
    params: { id: '{state.id}' }
    refresh: [event_template_detail, event_template_questions, event_template_question_options]
    fields:
      - { field: question_id, label: Question, type: select, options_source: event_template_question_options, required: true }
    mutation:
      generated: [line_id, next_sequence]
      before_steps:
        - { query: "SELECT 'event-template-question-' || :id || '-' || CAST(:question_id AS VARCHAR) AS line_id, COALESCE(MAX(sequence), 0) + 10 AS next_sequence FROM event_template_questions WHERE template_id = :id", assign: true }
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event template changed. Reload before adding a question. }
        - { query: "SELECT id FROM event_questions WHERE id = :question_id", status: 422, code: EVENT_TEMPLATE_QUESTION_INVALID, message: Select a valid reusable event question. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_template_questions WHERE template_id = :id AND question_id = :question_id)", status: 409, code: EVENT_TEMPLATE_QUESTION_EXISTS, message: This question is already linked to the template. }
      steps:
        - { query: "INSERT INTO event_template_questions(id, template_id, question_id, sequence, row_version) VALUES(:line_id, :id, :question_id, :next_sequence, 1)", expect_changed: true, status: 409, code: EVENT_TEMPLATE_QUESTION_NOT_CREATED, message: The template question could not be added. }
        - { query: "UPDATE event_templates SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event template changed while adding a question. Reload before saving. }
      result: { query: "SELECT l.*, q.title, q.mandatory, q.once_per_order, q.question_type, COALESCE(q.answers, '') AS answers FROM event_template_questions l JOIN event_questions q ON q.id = l.question_id WHERE l.id = :line_id" }
  - id: remove_event_template_question
    type: server
    permission: events.write
    action: events.templates.questions.delete
    handler: line_item
    operation: delete
    domain: event_template
    params: { id: '{state.id}', line_id: '{row.id}' }
    confirm: 'Remove this question from the template?'
    refresh: [event_template_detail, event_template_questions, event_template_question_options]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event template changed. Reload before removing the question. }
        - { query: "SELECT id FROM event_template_questions WHERE id = :line_id AND template_id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_TEMPLATE_QUESTION_STALE, message: This template question changed or was removed. Reload before removing. }
      steps:
        - { query: "DELETE FROM event_template_questions WHERE id = :line_id AND template_id = :id AND row_version = :expected_row_version", expect_changed: true, code: EVENT_TEMPLATE_QUESTION_STALE, message: This template question changed or was removed. Reload before removing. }
        - { query: "UPDATE event_templates SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event template changed while removing a question. Reload before saving. }
      result: { query: "SELECT true AS deleted, :line_id AS id" }
