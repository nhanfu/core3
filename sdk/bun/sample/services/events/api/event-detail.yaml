page: { id: event-detail }
datasources:
  - id: event_detail
    single: true
    permission: events.read
    query: "SELECT e.id, e.row_version, e.name, e.event_type, e.organizer, e.venue, e.description, e.capacity, e.registration_count, (SELECT COUNT(DISTINCT attendee_name) FROM event_registrations r WHERE r.event_id = e.id) AS attendee_count, (SELECT COUNT(*) FROM event_linked_leads l WHERE l.event_id = e.id) AS lead_count, COALESCE((SELECT SUM(total) FROM event_sales_orders s WHERE s.event_id = e.id), 0) AS sale_price_total, printf('$ %,.2f', CAST(COALESCE((SELECT SUM(total) FROM event_sales_orders s WHERE s.event_id = e.id), 0) AS DOUBLE)) AS sale_price_total_display, CAST(e.start_at AS VARCHAR) AS start_at, CAST(e.end_at AS VARCHAR) AS end_at, 'Europe/Brussels' AS display_timezone, 'Exhibition' AS template, 'Online' AS tags, 'YourCompany' AS company, '' AS online_url, false AS multiple_slots, false AS limit_registrations, e.state FROM events e WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND e.id = :id"
  - id: event_registrations
    permission: events.read
    query: "SELECT id, attendee_name, attendee_email, ticket_type, state, CAST(registered_at AS VARCHAR) AS registered_at FROM event_registrations WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY registered_at DESC"
  - id: event_tickets
    permission: events.read
    query: "SELECT id, row_version, name, CAST(price AS DECIMAL(12,2)) AS price, CAST(registration_start AS VARCHAR) AS registration_start, CAST(registration_end AS VARCHAR) AS registration_end, maximum, registration_count, CASE WHEN maximum = 0 THEN NULL ELSE GREATEST(maximum - registration_count, 0) END AS seats_available, CASE WHEN maximum > 0 AND registration_count >= maximum THEN 'Sold out' ELSE 'Available' END AS availability FROM event_tickets WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY name"
  - id: event_detail_questions
    permission: events.read
    query: "SELECT id, question, question_type, mandatory, once_per_order, answers FROM event_event_questions WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY id"
  - id: event_detail_slots
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_SLOTS_UNAVAILABLE, message: Event slots are temporarily unavailable. } }
    query: "SELECT id, row_version, event_id, name, CAST(start_at AS VARCHAR) AS start_at, CAST(end_at AS VARCHAR) AS end_at, seats, registration_count, state, date_tz, color FROM event_slots WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY start_at, id"
  - id: event_detail_communications
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_COMMUNICATIONS_UNAVAILABLE, message: Event communications are temporarily unavailable. } }
    query: "SELECT id, row_version, event_id, event_name, template_ref, interval_nbr, CASE interval_unit WHEN 'now' THEN 'Immediately' WHEN 'hours' THEN 'Hours' WHEN 'days' THEN 'Days' WHEN 'weeks' THEN 'Weeks' WHEN 'months' THEN 'Months' ELSE interval_unit END AS interval_unit, CASE interval_type WHEN 'after_sub' THEN 'After each registration' WHEN 'before_event' THEN 'Before the event starts' WHEN 'after_event_start' THEN 'After the event started' WHEN 'after_event' THEN 'After the event ended' WHEN 'before_event_end' THEN 'Before the event ends' ELSE interval_type END AS interval_type, CAST(scheduled_date AS VARCHAR) AS scheduled_date, mail_count_done, CASE mail_state WHEN 'running' THEN 'Running' WHEN 'scheduled' THEN 'Scheduled' WHEN 'sent' THEN 'Sent' WHEN 'error' THEN 'Error' WHEN 'cancelled' THEN 'Cancelled' ELSE mail_state END AS mail_state_label FROM event_mail_schedulers WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY sequence, id"
actions:
  - { id: event_sales_orders_detail, type: navigate, permission: events.read, navigate_to: /events/sales-orders, params: { event_id: '{row.id}' } }
  - id: add_event_detail_communication
    type: server_form
    permission: events.write
    title: Add event communication
    action: events.communications.create
    handler: line_item
    operation: create
    domain: event
    params: { id: '{state.id}' }
    refresh: [event_detail, event_detail_communications]
    fields:
      - { field: template_ref, label: Template, type: select, options: ['Event: Registration Confirmation', 'Event: Reminder'], required: true }
      - { field: interval_nbr, label: Interval, type: number, min: 0, required: true }
      - { field: interval_unit, label: Unit, type: select, options: [Immediately, Hours, Days, Weeks, Months], required: true }
      - { field: interval_type, label: Trigger, type: select, options: ['After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends'], required: true }
    mutation:
      generated: [line_id, event_name, next_sequence]
      before_steps:
        - { query: "SELECT e.name AS event_name, 'event-mail-' || :id || '-custom-' || CAST(COALESCE(MAX(s.sequence), 0) + 10 AS VARCHAR) AS line_id, COALESCE(MAX(s.sequence), 0) + 10 AS next_sequence FROM events e LEFT JOIN event_mail_schedulers s ON s.event_id = e.id WHERE e.id = :id GROUP BY e.id, e.name", assign: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event changed. Reload before adding communication. }
        - { query: "SELECT 1 AS ok WHERE CAST(:template_ref AS VARCHAR) IN ('Event: Registration Confirmation', 'Event: Reminder') AND CAST(:interval_unit AS VARCHAR) IN ('Immediately', 'Hours', 'Days', 'Weeks', 'Months') AND CAST(:interval_type AS VARCHAR) IN ('After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends') AND CAST(:interval_nbr AS INTEGER) >= 0 AND (CAST(:interval_unit AS VARCHAR) <> 'Immediately' OR CAST(:interval_nbr AS INTEGER) = 0) AND (CAST(:interval_unit AS VARCHAR) = 'Immediately' OR CAST(:interval_nbr AS INTEGER) > 0)", status: 422, code: EVENT_COMMUNICATION_INVALID, message: Enter a valid template, interval, unit, and trigger. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_mail_schedulers WHERE event_id = :id AND template_ref = :template_ref AND interval_nbr = CAST(:interval_nbr AS INTEGER) AND interval_unit = CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END AND interval_type = CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END)", status: 409, code: EVENT_COMMUNICATION_EXISTS, message: This communication schedule already exists for the event. }
      steps:
        - { query: "INSERT INTO event_mail_schedulers (id, row_version, event_id, event_name, sequence, template_ref, interval_nbr, interval_unit, interval_type, scheduled_date, mail_count_done, mail_state, notification_type, mail_done, registration_mail_count) SELECT :line_id, 1, e.id, :event_name, :next_sequence, :template_ref, CAST(:interval_nbr AS INTEGER), CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END, CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END, CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN e.start_at WHEN 'Before the event starts' THEN e.start_at - (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) WHEN 'After the event started' THEN e.start_at + (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) WHEN 'After the event ended' THEN e.end_at + (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) ELSE e.end_at - (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) END, 0, 'scheduled', 'mail', FALSE, 0 FROM events e WHERE e.id = :id", expect_changed: true, code: EVENT_COMMUNICATION_NOT_CREATED, message: Event communication could not be created. }
        - { query: "UPDATE events SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event changed while adding communication. Reload before saving. }
      result: { query: "SELECT * FROM event_mail_schedulers WHERE id = :line_id" }
  - id: edit_event_detail_communication
    type: server_form
    permission: events.write
    title: Edit event communication
    action: events.communications.update
    handler: line_item
    operation: update
    domain: event
    params: { id: '{state.id}', line_id: '{row.id}' }
    prefill: row
    refresh: [event_detail, event_detail_communications]
    fields:
      - { field: template_ref, label: Template, type: select, options: ['Event: Registration Confirmation', 'Event: Reminder'], required: true }
      - { field: interval_nbr, label: Interval, type: number, min: 0, required: true }
      - { field: interval_unit, label: Unit, type: select, options: [Immediately, Hours, Days, Weeks, Months], required: true }
      - { field: interval_type, label: Trigger, type: select, options: ['After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends'], required: true }
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event changed. Reload before saving communication. }
        - { query: "SELECT id FROM event_mail_schedulers WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE CAST(:template_ref AS VARCHAR) IN ('Event: Registration Confirmation', 'Event: Reminder') AND CAST(:interval_unit AS VARCHAR) IN ('Immediately', 'Hours', 'Days', 'Weeks', 'Months') AND CAST(:interval_type AS VARCHAR) IN ('After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends') AND CAST(:interval_nbr AS INTEGER) >= 0 AND (CAST(:interval_unit AS VARCHAR) <> 'Immediately' OR CAST(:interval_nbr AS INTEGER) = 0) AND (CAST(:interval_unit AS VARCHAR) = 'Immediately' OR CAST(:interval_nbr AS VARCHAR) <> '0')", status: 422, code: EVENT_COMMUNICATION_INVALID, message: Enter a valid template, interval, unit, and trigger. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_mail_schedulers WHERE event_id = :id AND template_ref = :template_ref AND interval_nbr = CAST(:interval_nbr AS INTEGER) AND interval_unit = CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END AND interval_type = CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END AND id <> :line_id)", status: 409, code: EVENT_COMMUNICATION_EXISTS, message: This communication schedule already exists for the event. }
      steps:
        - { query: "UPDATE event_mail_schedulers SET template_ref = :template_ref, interval_nbr = CAST(:interval_nbr AS INTEGER), interval_unit = CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END, interval_type = CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END, scheduled_date = CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN (SELECT start_at FROM events WHERE id = :id) WHEN 'Before the event starts' THEN (SELECT start_at FROM events WHERE id = :id) - (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) WHEN 'After the event started' THEN (SELECT start_at FROM events WHERE id = :id) + (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) WHEN 'After the event ended' THEN (SELECT end_at FROM events WHERE id = :id) + (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) ELSE (SELECT end_at FROM events WHERE id = :id) - (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) END, row_version = row_version + 1 WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", expect_changed: true, code: EVENT_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. }
        - { query: "UPDATE events SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event changed while saving communication. Reload before saving. }
      result: { query: "SELECT * FROM event_mail_schedulers WHERE id = :line_id" }
  - id: delete_event_detail_communication
    type: server
    permission: events.write
    action: events.communications.delete
    handler: line_item
    operation: delete
    domain: event
    params: { id: '{state.id}', line_id: '{row.id}' }
    confirm: 'Delete this communication schedule?'
    refresh: [event_detail, event_detail_communications]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event changed. Reload before deleting communication. }
        - { query: "SELECT id FROM event_mail_schedulers WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. Reload before deleting. }
      steps:
        - { query: "DELETE FROM event_mail_schedulers WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", expect_changed: true, code: EVENT_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. }
        - { query: "UPDATE events SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event changed while deleting communication. Reload before saving. }
      result: { query: "SELECT TRUE AS deleted, :line_id AS id" }
