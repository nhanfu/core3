    fields:
      - { field: template_ref, label: Template, type: select, options: ['Event: Registration Confirmation', 'Event: Reminder'], required: true }
      - { field: interval_nbr, label: Interval, type: number, min: 0, required: true }
      - { field: interval_unit, label: Unit, type: select, options: [Immediately, Hours, Days, Weeks, Months], required: true }
      - { field: interval_type, label: Trigger, type: select, options: ['After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends'], required: true }
    mutation:
      generated: [line_id, event_name, next_sequence]
      before_steps:
        - { query: "SELECT e.name AS event_name, 'event-mail-' || :id || '-custom-' || CAST(COALESCE(MAX(s.sequence), 0) + 10 AS VARCHAR) AS line_id, COALESCE(MAX(s.sequence), 0) + 10 AS next_sequence FROM events e LEFT JOIN event_mail_schedulers s ON s.event_id = e.id WHERE e.id = :id GROUP BY e.id, e.name", assign: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id AND row_version = :parent_expected_row_version", status: 409, code: STALE_RECORD, message: The event changed. Reload before adding communication. }
        - { query: "SELECT 1 AS ok WHERE CAST(:template_ref AS VARCHAR) IN ('Event: Registration Confirmation', 'Event: Reminder') AND CAST(:interval_unit AS VARCHAR) IN ('Immediately', 'Hours', 'Days', 'Weeks', 'Months') AND CAST(:interval_type AS VARCHAR) IN ('After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends') AND CAST(:interval_nbr AS INTEGER) >= 0 AND (CAST(:interval_unit AS VARCHAR) <> 'Immediately' OR CAST(:interval_nbr AS INTEGER) = 0) AND (CAST(:interval_unit AS VARCHAR) = 'Immediately' OR CAST(:interval_nbr AS INTEGER) > 0)", status: 422, code: EVENT_COMMUNICATION_INVALID, message: Enter a valid template, interval, unit, and trigger. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_mail_schedulers WHERE event_id = :id AND template_ref = :template_ref AND interval_nbr = CAST(:interval_nbr AS INTEGER) AND interval_unit = CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END AND interval_type = CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END)", status: 409, code: EVENT_COMMUNICATION_EXISTS, message: This communication schedule already exists for the event. }
      steps:
        - { query: "INSERT INTO event_mail_schedulers (id, row_version, event_id, event_name, sequence, template_ref, interval_nbr, interval_unit, interval_type, scheduled_date, mail_count_done, mail_state, notification_type, mail_done, registration_mail_count) SELECT :line_id, 1, e.id, :event_name, :next_sequence, :template_ref, CAST(:interval_nbr AS INTEGER), CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN 'now' ELSE lower(CAST(:interval_unit AS VARCHAR)) END, CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN 'after_sub' WHEN 'Before the event starts' THEN 'before_event' WHEN 'After the event started' THEN 'after_event_start' WHEN 'After the event ended' THEN 'after_event' WHEN 'Before the event ends' THEN 'before_event_end' END, CASE CAST(:interval_type AS VARCHAR) WHEN 'After each registration' THEN e.start_at WHEN 'Before the event starts' THEN e.start_at - (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) WHEN 'After the event started' THEN e.start_at + (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) WHEN 'After the event ended' THEN e.end_at + (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) ELSE e.end_at - (CASE CAST(:interval_unit AS VARCHAR) WHEN 'Immediately' THEN INTERVAL '0 days' WHEN 'Hours' THEN INTERVAL '1 hour' WHEN 'Days' THEN INTERVAL '1 day' WHEN 'Weeks' THEN INTERVAL '1 week' WHEN 'Months' THEN INTERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) END, 0, 'scheduled', 'mail', FALSE, 0 FROM events e WHERE e.id = :id", expect_changed: true, code: EVENT_COMMUNICATION_NOT_CREATED, message: Event communication could not be created. }
        - { query: "UPDATE events SET row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: STALE_RECORD, message: The event changed while adding communication. Reload before saving. }
