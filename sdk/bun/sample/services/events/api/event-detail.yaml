    action: events.records.unarchive
    handler: yaml_mutation
    params: { id: '{state.id}', expected_row_version: '{state.event_detail.row_version}' }
    confirm: Restore this event?
    refresh: [event_detail]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id", status: 404, code: EVENT_NOT_FOUND, message: Event not found. }
        - { query: "SELECT id FROM events WHERE id = :id AND active = FALSE AND row_version = :expected_row_version", status: 409, code: EVENT_ARCHIVE_STALE, message: This event is active or changed. Reload before restoring. }
      steps:
        - { query: "UPDATE events SET active = TRUE, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 12:00:00' WHERE id = :id AND active = FALSE AND row_version = :expected_row_version", expect_changed: true, status: 409, code: EVENT_ARCHIVE_STALE, message: This event changed before it could be restored. }
      result: { query: "SELECT * FROM events WHERE id = :id" }
