page: { id: event-detail }
datasources:
  - id: event_detail
    single: true
    permission: events.read
    query: "SELECT e.id, e.row_version, e.name, e.event_type, e.organizer, e.venue, e.description, e.capacity, e.registration_count, (SELECT COUNT(DISTINCT attendee_name) FROM event_registrations r WHERE r.event_id = e.id) AS attendee_count, (SELECT COUNT(*) FROM event_linked_leads l WHERE l.event_id = e.id) AS lead_count, COALESCE((SELECT SUM(total) FROM event_sales_orders s WHERE s.event_id = e.id), 0) AS sale_price_total, printf('$ %,.2f', CAST(COALESCE((SELECT SUM(total) FROM event_sales_orders s WHERE s.event_id = e.id), 0) AS DOUBLE)) AS sale_price_total_display, CAST(e.start_at AS VARCHAR) AS start_at, CAST(e.end_at AS VARCHAR) AS end_at, 'Europe/Brussels' AS display_timezone, 'Exhibition' AS template, COALESCE((SELECT string_agg(t.name, ', ' ORDER BY r.sequence, t.name, t.id) FROM event_event_tags r JOIN event_tags t ON t.id = r.tag_id WHERE r.event_id = e.id), 'Online') AS tags, 'YourCompany' AS company, '' AS online_url, (SELECT COUNT(*) FROM event_slots WHERE event_id = e.id) > 1 AS multiple_slots, (SELECT COUNT(*) FROM event_slots WHERE event_id = e.id) AS slot_count, false AS limit_registrations, COALESCE(e.badge_format, 'A6') AS badge_format, e.badge_image_file_name, e.badge_image_mime_type, e.badge_image_size_bytes, e.badge_image_uploaded_by, CAST(e.badge_image_updated_at AS VARCHAR) AS badge_image_updated_at, e.ticket_instructions, e.note, e.active, e.state FROM events e WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND e.id = :id"
  - id: event_registrations
    permission: events.read
    query: "SELECT id, attendee_name, attendee_email, ticket_type, state, CAST(registered_at AS VARCHAR) AS registered_at FROM event_registrations WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY registered_at DESC"
  - id: event_detail_tags
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_TAGS_UNAVAILABLE, message: Event tags are temporarily unavailable. } }
    query: "SELECT r.id, r.row_version, r.event_id, r.tag_id, t.name, t.color, c.name AS category FROM event_event_tags r JOIN event_tags t ON t.id = r.tag_id JOIN event_tag_categories c ON c.id = t.category_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND r.event_id = :id ORDER BY r.sequence, t.name, t.id"
  - id: event_detail_tag_options
    permission: events.read
    query: "SELECT t.id AS value, t.name || ' · ' || c.name AS label FROM event_tags t JOIN event_tag_categories c ON c.id = t.category_id WHERE NOT EXISTS (SELECT 1 FROM event_event_tags r WHERE r.event_id = :id AND r.tag_id = t.id) ORDER BY t.name, t.id"
  - id: event_tickets
    permission: events.read
    query: "SELECT id, row_version, name, CAST(price AS DECIMAL(12,2)) AS price, CAST(registration_start AS VARCHAR) AS registration_start, CAST(registration_end AS VARCHAR) AS registration_end, maximum, registration_count, CASE WHEN maximum = 0 THEN NULL ELSE GREATEST(maximum - registration_count, 0) END AS seats_available, CASE WHEN maximum > 0 AND registration_count >= maximum THEN 'Sold out' ELSE 'Available' END AS availability FROM event_tickets WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY name"
  - id: event_detail_questions
    permission: events.read
    query: "SELECT l.id, l.row_version, l.event_id, l.question_id, COALESCE(q.title, l.question) AS question, COALESCE(q.question_type, l.question_type) AS question_type, l.mandatory, l.once_per_order, COALESCE(q.answers, l.answers, '') AS answers, COALESCE(l.sequence, 10) AS sequence FROM event_event_questions l LEFT JOIN event_questions q ON q.id = l.question_id WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND l.event_id = :id ORDER BY sequence, id"
  - id: event_detail_question_options
    permission: events.read
    query: "SELECT q.id AS value, q.title AS label FROM event_questions q WHERE NOT EXISTS (SELECT 1 FROM event_event_questions l WHERE l.event_id = :id AND l.question_id = q.id) ORDER BY q.title, q.id"
  - id: event_detail_slots
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_SLOTS_UNAVAILABLE, message: Event slots are temporarily unavailable. } }
    query: "SELECT id, row_version, event_id, name, CAST(start_at AS VARCHAR) AS start_at, CAST(end_at AS VARCHAR) AS end_at, seats, registration_count, state, date_tz, color FROM event_slots WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY start_at, id"
  - id: event_detail_communications
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_COMMUNICATIONS_UNAVAILABLE, message: Event communications are temporarily unavailable. } }
    query: "SELECT id, row_version, event_id, event_name, template_ref, interval_nbr, CASE interval_unit WHEN 'now' THEN 'Immediately' WHEN 'hours' THEN 'Hours' WHEN 'days' THEN 'Days' WHEN 'weeks' THEN 'Weeks' WHEN 'months' THEN 'Months' ELSE interval_unit END AS interval_unit, CASE interval_type WHEN 'after_sub' THEN 'After each registration' WHEN 'before_event' THEN 'Before the event starts' WHEN 'after_event_start' THEN 'After the event started' WHEN 'after_event' THEN 'After the event ended' WHEN 'before_event_end' THEN 'Before the event ends' ELSE interval_type END AS interval_type, CAST(scheduled_date AS VARCHAR) AS scheduled_date, mail_count_done, CASE mail_state WHEN 'running' THEN 'Running' WHEN 'scheduled' THEN 'Scheduled' WHEN 'sent' THEN 'Sent' WHEN 'error' THEN 'Error' WHEN 'cancelled' THEN 'Cancelled' ELSE mail_state END AS mail_state_label FROM event_mail_schedulers WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY sequence, id"
  - id: event_badge_background
    permission: events.read
    query: "SELECT id, id AS event_id, badge_image_file_name AS file_name, badge_image_mime_type AS mime_type, badge_image_size_bytes AS size_bytes, badge_image_uploaded_by AS uploaded_by, CAST(badge_image_updated_at AS VARCHAR) AS updated_at, row_version FROM events WHERE id = :id AND badge_image_file_name IS NOT NULL"
  - id: event_detail_activities
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_ACTIVITIES_UNAVAILABLE, message: Event activities are temporarily unavailable. } }
    query: "SELECT id, row_version, event_id, activity_type, summary, CAST(due_date AS VARCHAR) AS due_date, assigned_user_id, assigned_user_name, state, CAST(completed_at AS VARCHAR) AS completed_at, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM event_activities WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY due_date NULLS LAST, created_at DESC, id"
  - id: event_detail_chatter
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_CHATTER_UNAVAILABLE, message: Event messages are temporarily unavailable. } }
    query: "SELECT id, row_version, event_id, state, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM (SELECT id, row_version, event_id, 'done' AS state, actor_name, action, action_label, detail, created_at FROM event_messages UNION ALL SELECT id, row_version, event_id, state, actor_name, action, action_label, detail, created_at FROM event_activities) timeline WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND event_id = :id ORDER BY created_at DESC, id"
  - id: event_followers
    permission: events.read
    error_states: { transport_error: { status: 503, code: EVENT_FOLLOWERS_UNAVAILABLE, message: Event followers are temporarily unavailable. } }
    query: "SELECT f.user_id, f.name, f.email, CAST(f.created_at AS VARCHAR) AS followed_at FROM event_followers f JOIN events e ON e.id = f.event_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND f.event_id = :id ORDER BY f.created_at, f.user_id"
  - id: event_follower_candidates
    permission: events.read
    query: "SELECT u.id AS value, u.name || ' · ' || u.email AS label FROM event_follower_catalog u JOIN events e ON e.id = :id WHERE u.active = TRUE AND NOT EXISTS (SELECT 1 FROM event_followers f WHERE f.event_id = :id AND f.user_id = u.id) ORDER BY u.name, u.id"
actions:
  - id: send_event_detail_message
    type: server_form
    permission: events.write
    title: Send message
    action: events.records.chatter.message
    handler: order_chatter
    operation: message
    params: { id: '{state.event_detail.id}', expected_row_version: '{state.event_detail.row_version}' }
    refresh: [event_detail, event_detail_chatter, event_detail_activities]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      before_steps:
        - { query: "SELECT 'event-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM event_messages WHERE event_id = :id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EVENT_CHATTER_ACTOR_REQUIRED, message: An authenticated Events actor is required to send a message. }
        - { query: "SELECT id FROM events WHERE id = :id AND state <> 'Cancelled' AND row_version = :expected_row_version", status: 409, code: EVENT_CHATTER_PARENT_CHANGED, message: This event changed or is cancelled. Reload before sending a message. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: EVENT_CHATTER_CONTENT_INVALID, message: Message content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO event_messages(id, event_id, row_version, actor_id, actor_name, action, action_label, detail, created_at) VALUES(:message_id, :id, 1, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Events User'), 'events.records.chatter.message', 'Message', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-01-15 11:00:00')", expect_changed: true, status: 409, code: EVENT_CHATTER_NOT_CREATED, message: The event message could not be sent. }
        - { query: "UPDATE events SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 11:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: EVENT_CHATTER_PARENT_CHANGED, message: The event changed while sending the message. Reload before retrying. }
      result: { query: "SELECT * FROM event_messages WHERE id = :message_id" }
  - id: log_event_detail_note
    type: server_form
    permission: events.write
    title: Log note
    action: events.records.chatter.note
    handler: order_chatter
    operation: note
    params: { id: '{state.event_detail.id}', expected_row_version: '{state.event_detail.row_version}' }
    refresh: [event_detail, event_detail_chatter, event_detail_activities]
    fields: [{ field: content, label: Note, type: textarea, required: true }]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      before_steps:
        - { query: "SELECT 'event-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM event_messages WHERE event_id = :id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EVENT_CHATTER_ACTOR_REQUIRED, message: An authenticated Events actor is required to log a note. }
        - { query: "SELECT id FROM events WHERE id = :id AND state <> 'Cancelled' AND row_version = :expected_row_version", status: 409, code: EVENT_CHATTER_PARENT_CHANGED, message: This event changed or is cancelled. Reload before logging a note. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: EVENT_CHATTER_CONTENT_INVALID, message: Note content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO event_messages(id, event_id, row_version, actor_id, actor_name, action, action_label, detail, created_at) VALUES(:message_id, :id, 1, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Events User'), 'events.records.chatter.note', 'Note', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-01-15 11:00:00')", expect_changed: true, status: 409, code: EVENT_CHATTER_NOT_CREATED, message: The event note could not be logged. }
        - { query: "UPDATE events SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 11:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: EVENT_CHATTER_PARENT_CHANGED, message: The event changed while logging the note. Reload before retrying. }
      result: { query: "SELECT * FROM event_messages WHERE id = :message_id" }
  - id: schedule_event_detail_activity
    type: server_form
    permission: events.write
    title: Schedule activity
    action: events.records.activity.schedule
    handler: yaml_mutation
    operation: activity
    params: { id: '{state.event_detail.id}', expected_row_version: '{state.event_detail.row_version}' }
    refresh: [event_detail, event_detail_activities]
    mutation:
      generated: [activity_id]
      before_steps:
        - { query: "SELECT :id || '-activity-' || CAST(COUNT(*) + 1 AS VARCHAR) AS activity_id FROM event_activities WHERE event_id = :id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EVENT_ACTIVITY_ACTOR_REQUIRED, message: An authenticated Events actor is required to schedule an activity. }
        - { query: "SELECT id FROM events WHERE id = :id AND state <> 'Cancelled' AND row_version = :expected_row_version", status: 409, code: EVENT_ACTIVITY_PARENT_CHANGED, message: This event changed or is cancelled. Reload before scheduling an activity. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(NULLIF(TRIM(CAST(:activity_type AS VARCHAR)), ''), 'todo') IN ('todo', 'email', 'call', 'meeting', 'document')", status: 422, code: EVENT_ACTIVITY_TYPE_INVALID, message: Choose a valid activity type. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: EVENT_ACTIVITY_SUMMARY_REQUIRED, message: Activity summary is required. }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(CAST(COALESCE(NULLIF(TRIM(CAST(:activity_date AS VARCHAR)), ''), '2026-01-15') AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 422, code: EVENT_ACTIVITY_DATE_INVALID, message: Due date must be a valid ISO date. }
      steps:
        - { query: "INSERT INTO event_activities(id, event_id, row_version, activity_type, summary, due_date, assigned_user_id, assigned_user_name, state, actor_id, actor_name, action, action_label, detail, created_at, updated_at) VALUES(:activity_id, :id, 1, COALESCE(NULLIF(TRIM(CAST(:activity_type AS VARCHAR)), ''), 'todo'), TRIM(CAST(:content AS VARCHAR)), CAST(COALESCE(NULLIF(TRIM(CAST(:activity_date AS VARCHAR)), ''), '2026-01-15') AS DATE), NULL, NULLIF(TRIM(CAST(:activity_user AS VARCHAR)), ''), 'planned', :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Events User'), 'events.records.activity.schedule', 'Activity scheduled', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')", expect_changed: true, status: 409, code: EVENT_ACTIVITY_NOT_CREATED, message: The event activity could not be scheduled. }
        - { query: "UPDATE events SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: EVENT_ACTIVITY_PARENT_CHANGED, message: This event changed while the activity was being scheduled. }
      result: { query: "SELECT * FROM event_activities WHERE id = :activity_id" }
    fields:
      - { field: content, label: Summary, type: textarea, required: true, placeholder: 'e.g. Discuss event logistics' }
      - { field: activity_type, label: Activity type, type: select, options: [{ value: todo, label: To-Do }, { value: email, label: Email }, { value: call, label: Call }, { value: meeting, label: Meeting }, { value: document, label: Document }], default: todo }
      - { field: activity_date, label: Due Date, type: text, placeholder: YYYY-MM-DD, default: '2026-01-15' }
      - { field: activity_user, label: Assigned to, type: text, placeholder: 'e.g. Admin User' }
  - id: complete_event_detail_activity
    type: server
    permission: events.write
    action: events.records.activity.complete
    handler: yaml_mutation
    operation: complete_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [event_detail, event_detail_activities]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT a.id FROM event_activities a JOIN events e ON e.id = a.event_id WHERE a.id = :id AND a.state = 'planned' AND a.row_version = :expected_row_version AND e.state <> 'Cancelled'", status: 409, code: EVENT_ACTIVITY_STALE, message: This activity is already complete, cancelled, or changed. Reload before completing it. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: EVENT_ACTIVITY_ACTOR_REQUIRED, message: An authenticated Events actor is required to complete an activity. }
      steps:
        - { query: "UPDATE event_activities SET state = 'done', completed_at = TIMESTAMP '2026-01-15 10:00:00', action = 'events.records.activity.complete', action_label = 'Activity completed', detail = summary, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:00:00' WHERE id = :id AND state = 'planned' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: EVENT_ACTIVITY_STALE, message: This activity is already complete or changed. Reload before completing it. }
        - { query: "UPDATE events SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:00:00' WHERE id = (SELECT event_id FROM event_activities WHERE id = :id)", expect_changed: true, status: 409, code: EVENT_ACTIVITY_PARENT_CHANGED, message: The event changed while completing the activity. Reload before retrying. }
      result: { query: "SELECT * FROM event_activities WHERE id = :id" }
  - id: view_event_question_answers_from_event
    type: navigate
    permission: events.read
    navigate_to: /events/answer-breakdown
    params: { question_id: '{row.question_id}', event_id: '{row.event_id}' }
  - id: add_event_detail_question
    type: server_form
    permission: events.write
    title: Add event question
    action: events.event_questions.attach
    handler: line_item
    operation: create
    domain: event
    params: { id: '{state.id}' }
    refresh: [event_detail, event_detail_questions, event_detail_question_options]
    fields:
      - { field: question_id, label: Question, type: select, options_source: event_detail_question_options, required: true }
    mutation:
      generated: [link_id, question, question_type, question_answers, next_sequence]
      before_steps:
        - { query: "SELECT q.title AS question, q.question_type AS question_type, COALESCE(q.answers, '') AS question_answers, 'event-question-link-' || CAST(:id AS VARCHAR) || '-' || CAST(:question_id AS VARCHAR) AS link_id, COALESCE(MAX(l.sequence), 0) + 10 AS next_sequence FROM event_questions q LEFT JOIN event_event_questions l ON l.event_id = :id WHERE q.id = :question_id GROUP BY q.id, q.title, q.question_type, q.answers", assign: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id AND row_version = :parent_expected_row_version AND state NOT IN ('Completed', 'Cancelled')", status: 409, code: EVENT_QUESTION_EVENT_CLOSED, message: Questions cannot be changed after the event is completed or cancelled, or after it has changed. }
        - { query: "SELECT id FROM event_questions WHERE id = :question_id", status: 422, code: EVENT_EVENT_QUESTION_INVALID, message: Select a valid reusable event question. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_event_questions WHERE event_id = :id AND question_id = :question_id)", status: 409, code: EVENT_EVENT_QUESTION_EXISTS, message: This question is already linked to the event. }
      steps:
        - { query: "INSERT INTO event_event_questions(id, event_id, question_id, question, question_type, mandatory, once_per_order, answers, sequence, row_version) SELECT :link_id, :id, q.id, q.title, q.question_type, q.mandatory, q.once_per_order, COALESCE(q.answers, ''), :next_sequence, 1 FROM event_questions q WHERE q.id = :question_id", expect_changed: true, status: 422, code: EVENT_EVENT_QUESTION_INVALID, message: The event question could not be linked. }
        - { query: "UPDATE events SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The event changed while linking the question. Reload before saving. }
      result: { query: "SELECT * FROM event_event_questions WHERE id = :link_id" }
  - id: edit_event_detail_question
    type: server_form
    permission: events.write
    title: Edit event question settings
    action: events.event_questions.update
    handler: line_item
    operation: update
    domain: event
    params: { id: '{state.id}', line_id: '{row.id}' }
    prefill: row
    refresh: [event_detail, event_detail_questions]
    fields:
      - { field: mandatory, label: Mandatory, type: checkbox }
      - { field: once_per_order, label: Once per Order, type: checkbox }
      - { field: sequence, label: Sequence, type: number, min: 1, required: true }
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id AND row_version = :parent_expected_row_version AND state NOT IN ('Completed', 'Cancelled')", status: 409, code: EVENT_QUESTION_EVENT_CLOSED, message: Questions cannot be changed after the event is completed or cancelled, or after it has changed. }
        - { query: "SELECT id FROM event_event_questions WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_EVENT_QUESTION_STALE, message: This event question changed or was removed. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:sequence AS INTEGER), 0) > 0", status: 422, code: EVENT_EVENT_QUESTION_SEQUENCE_INVALID, message: Sequence must be greater than zero. }
      steps:
        - { query: "UPDATE event_event_questions SET mandatory = COALESCE(CAST(:mandatory AS BOOLEAN), false), once_per_order = COALESCE(CAST(:once_per_order AS BOOLEAN), false), sequence = CAST(:sequence AS INTEGER), row_version = row_version + 1 WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: EVENT_EVENT_QUESTION_STALE, message: This event question changed or was removed. Reload before saving. }
        - { query: "UPDATE events SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The event changed while saving the question. Reload before retrying. }
      result: { query: "SELECT * FROM event_event_questions WHERE id = :line_id" }
  - id: remove_event_detail_question
    type: server
    permission: events.write
    action: events.event_questions.detach
    handler: line_item
    operation: delete
    domain: event
    params: { id: '{state.id}', line_id: '{row.id}' }
    confirm: 'Remove question {{row.question}} from this event?'
    refresh: [event_detail, event_detail_questions, event_detail_question_options]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id AND row_version = :parent_expected_row_version AND state NOT IN ('Completed', 'Cancelled')", status: 409, code: EVENT_QUESTION_EVENT_CLOSED, message: Questions cannot be changed after the event is completed or cancelled, or after it has changed. }
        - { query: "SELECT id FROM event_event_questions WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_EVENT_QUESTION_STALE, message: This event question changed or was removed. Reload before deleting. }
      steps:
        - { query: "DELETE FROM event_event_questions WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: EVENT_EVENT_QUESTION_STALE, message: This event question changed or was removed. Reload before deleting. }
        - { query: "UPDATE events SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The event changed while deleting the question. Reload before retrying. }
      result: { query: "SELECT TRUE AS deleted, :line_id AS id" }
  - id: add_event_detail_tag
    type: server_form
    permission: events.write
    title: Add event tag
    action: events.records.tags.add
    handler: line_item
