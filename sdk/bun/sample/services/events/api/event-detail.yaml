ERVAL '1 month' END * CAST(:interval_nbr AS INTEGER)) END, row_version = row_version + 1 WHERE id = :line_id AND event_id = :id AND row_version = :expected_row_version", expect_changed: true, code: EVENT_COMMUNICATION_STALE, message: This communication schedule changed or was deleted. }
