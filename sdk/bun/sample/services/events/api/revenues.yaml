page: { id: events-revenues }
datasources:
  - id: event_revenues
    permission: events.read
    pivot:
      fields: [event_name, event_start_date, event_start_month, ticket_name, unit_price, sold_quantity, revenue, state]
    query: "SELECT t.id, e.name AS event_name, strftime(e.start_at, '%d %b %Y') AS event_start_date, strftime(e.start_at, '%Y-%m') AS event_start_month, t.name AS ticket_name, CAST(t.price AS DOUBLE) AS unit_price, CAST(t.registration_count AS DOUBLE) AS sold_quantity, CAST(t.price * t.registration_count AS DOUBLE) AS revenue, e.state FROM event_tickets t JOIN events e ON e.id = t.event_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.price > 0 AND (:q IS NULL OR e.name ILIKE '%' || :q || '%' OR t.name ILIKE '%' || :q || '%') AND (:state IS NULL OR e.state = :state) ORDER BY e.start_at, t.name"
