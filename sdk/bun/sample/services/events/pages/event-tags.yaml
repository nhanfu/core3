title: Event Tags Categories
page: { id: event-tags, route: /events/tags, breadcrumb: [Marketing, Events, Configuration, Event Tags Categories], auth: { require: [events.read] } }
components:
  - type: ListView
    variant: odoo
    source: event_tag_categories
    create_label: New tag category
    search: { label: Search tag categories, placeholder: Search categories... }
    columns: [{ field: name, label: Name, type: PrimaryEntityCell }, { field: tags, label: Tags }, { field: activity, label: Activity }, { field: age, label: Age }]
    page_size: 50
    row_key: id
    create_action: create_event_tag_category
actions:
  - id: create_event_tag_category
    type: server_form
    permission: events.write
    title: New tag category
    action: events.tag_categories.create
    handler: yaml_mutation
    operation: create
    refresh: [event_tag_categories]
    mutation: { operation: insert, table: event_tag_categories, fields: [name, tags, activity, age], required: [name], result: { query: "SELECT * FROM event_tag_categories WHERE id = :id" } }
    fields: [{ field: name, label: Name, type: text, required: true }, { field: tags, label: Tags, type: text }, { field: activity, label: Activity, type: text }, { field: age, label: Age, type: text }]
