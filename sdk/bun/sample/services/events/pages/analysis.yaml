title: Event Analysis
page: { id: events-analysis, route: /events-analysis, breadcrumb: [Marketing, Events, Analysis], auth: { require: [events.read] } }
components:
  - type: StatRow
    source: event_analysis_totals
    title: Event performance
    stats: [{ label: Events, field: event_count }, { label: Capacity, field: capacity }, { label: Registrations, field: registrations }, { label: Completed, field: completed_count }]
  - type: Chart
    source: event_analysis_states
    title: Events by status
    label_field: category
    value_field: event_count
    variant: bar
  - type: ListView
    variant: odoo
    source: event_analysis_states
    search: { label: Search event analysis, placeholder: Search event or type... }
    empty_state: { title: No event analysis data, description: Events matching the current search or fixture are shown here. }
    columns: [{ field: category, label: Status, type: PrimaryEntityCell }, { field: event_count, label: Events, align: right }]
    page_size: 25
    row_key: category
