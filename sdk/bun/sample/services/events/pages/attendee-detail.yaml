title: Attendee
page: { id: event-attendee-detail, route: /events/attendees/detail, breadcrumb: [Marketing, Events, Reporting, Attendees, Attendee], auth: { require: [events.read] } }
components:
  - type: OdooFormView
    source: event_attendee_detail
    title_field: attendee_name
    subtitle_field: event_name
    status_field: state
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    header_actions:
      - { id: print_attendee_badge, label: Print Badge, variant: secondary, permission: events.read, show_if: "record.state === 'Registered' || record.state === 'Attended'" }
      - { id: print_attendee_full_page_ticket, label: Full Page Ticket, variant: secondary, permission: events.read }
      - { id: send_attendee_email, label: Send by Email, variant: primary, permission: events.write }
      - { id: edit_event_attendee, label: Edit, variant: primary, permission: events.write }
      - { id: confirm_attendee_detail, label: Registered, variant: primary, permission: events.write, show_if: "record.state === 'Unconfirmed'" }
      - { id: mark_attendee_attended_detail, label: Attended, variant: primary, permission: events.write, show_if: "record.state === 'Registered'" }
      - { id: cancel_event_attendee_detail, label: Cancel Registration, variant: secondary, permission: events.write, show_if: "record.state !== 'Cancelled'" }
      - { id: reopen_event_attendee_detail, label: Reopen Registration, variant: secondary, permission: events.write, show_if: "record.state === 'Cancelled'" }
    statusbar: [{ value: Unconfirmed, label: Unconfirmed }, { value: Registered, label: Registered }, { value: Attended, label: Attended }, { value: Cancelled, label: Cancelled }]
    status_colors: { Unconfirmed: neutral, Registered: blue, Attended: green, Cancelled: red }
    group_columns: 2
    groups:
      - title: Attendee
        fields: [{ field: attendee_name, label: Attendee Name }, { field: attendee_email, label: Email }, { field: attendee_phone, label: Phone }, { field: company_name, label: Company Name }]
      - title: Event Information
        fields: [{ field: event_name, label: Event }, { field: ticket_type, label: Ticket Type }, { field: booked_by, label: Booked by }, { field: registered_at, label: Registration Date }]
  - type: LineItemGrid
    variant: odoo_x2many
    source: event_attendee_answers
    parent_source: event_attendee_detail
    title: Questions
    description: Registration questions and answers
    row_key: id
    actions:
      - { id: add_event_attendee_answer, label: Add a question, variant: primary, permission: events.write }
    empty_state: { title: No questions, description: Registration questions and answers will appear here. }
    children:
      - { type: LineItemField, id: question_id, field: question_id, label: Question, input_type: select, required: true }
      - { type: LineItemField, id: question_type, field: question_type, label: Type, readonly: true }
      - { type: LineItemField, id: suggested_answer, field: suggested_answer, label: Suggested answer, input_type: text }
      - { type: LineItemField, id: text_answer, field: text_answer, label: Text answer, input_type: text }
      - type: LineItemActions
        id: attendee_answer_actions
        edit_action: edit_event_attendee_answer
        create_action: add_event_attendee_answer
        actions:
          - { id: edit_event_attendee_answer, label: Edit, icon: edit, variant: ghost, permission: events.write }
          - { id: delete_event_attendee_answer, label: Delete, icon: trash, variant: danger, permission: events.write }
    columns:
      - { field: question, label: Question, type: PrimaryEntityCell }
      - { field: question_type, label: Type }
      - { field: suggested_answer, label: Suggested answer }
      - { field: text_answer, label: Text answer }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: edit_event_attendee_answer, label: Edit, icon: edit, variant: ghost, permission: events.write }
          - { id: delete_event_attendee_answer, label: Delete, icon: trash, variant: danger, permission: events.write }
