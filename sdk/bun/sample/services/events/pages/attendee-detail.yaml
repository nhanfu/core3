title: Attendee
page: { id: event-attendee-detail, route: /events/attendees/detail, breadcrumb: [Marketing, Events, Reporting, Attendees, Attendee], auth: { require: [events.read] } }
components:
  - type: OdooFormView
    source: event_attendee_detail
    title_field: attendee_name
    subtitle_field: event_name
    status_field: state
    editable: false
    labels: { workflowStatus: Status }
    header_actions:
      - { id: send_attendee_email, label: Send by Email, variant: primary, permission: events.write }
      - { id: confirm_attendee_detail, label: Registered, variant: primary, permission: events.write, show_if: "record.state === 'Unconfirmed'" }
      - { id: mark_attendee_attended_detail, label: Attended, variant: primary, permission: events.write, show_if: "record.state === 'Registered'" }
      - { id: cancel_event_attendee_detail, label: Cancel Registration, variant: secondary, permission: events.write, show_if: "record.state !== 'Cancelled'" }
    statusbar: [{ value: Unconfirmed, label: Unconfirmed }, { value: Registered, label: Registered }, { value: Attended, label: Attended }, { value: Cancelled, label: Cancelled }]
    status_colors: { Unconfirmed: neutral, Registered: blue, Attended: green, Cancelled: red }
    group_columns: 2
    groups:
      - title: Attendee
        fields: [{ field: attendee_name, label: Attendee Name }, { field: attendee_email, label: Email }, { field: attendee_phone, label: Phone }, { field: company_name, label: Company Name }]
      - title: Event Information
        fields: [{ field: event_name, label: Event }, { field: ticket_type, label: Ticket Type }, { field: booked_by, label: Booked by }, { field: registered_at, label: Registration Date }]
  - type: ContactGrid
    source: event_attendee_answers
    row_key: id
    columns:
      - { field: question, label: Question, type: PrimaryEntityCell }
      - { field: question_type, label: Type }
      - { field: suggested_answer, label: Suggested answer }
      - { field: text_answer, label: Text answer }
    empty_state: { title: No questions, description: Registration questions and answers will appear here. }
