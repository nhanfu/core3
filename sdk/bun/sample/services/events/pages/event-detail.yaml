title: Event
page: { id: event-detail, route: /event-detail, breadcrumb: [Marketing, Events, Detail], auth: { require: [events.read] } }
components:
  - type: OdooFormView
    source: event_detail
    title_field: name
    status_field: state
    editable: true
    content_slot: true
    attachment_source: event_badge_background
    attachment_label: Badge Background
    add_attachment_label: Upload your file
    no_attachments_label: Upload your file
    uploading_label: Uploading badge background…
    upload_failed_label: Badge background upload failed
    attachment_accept: image/*
    attachment_upload_action: upload_event_badge_background
    attachment_actions:
      - { id: remove_event_badge_background, label: Remove, variant: danger, permission: events.write }
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    header_actions:
      - { id: registration_desk_event_detail, label: Registration Desk, variant: primary, permission: events.read }
      - { id: print_event_attendee_list, label: Attendee List, variant: secondary, permission: events.read }
      - { id: print_event_badge_example, label: Badge Example, variant: secondary, permission: events.read }
      - { id: print_event_full_page_ticket_example, label: Full Page Ticket Example, variant: secondary, permission: events.read }
      - { id: edit_event_detail, label: Edit, variant: secondary, permission: events.write }
      - { id: schedule_event_detail_activity, label: Schedule activity, variant: secondary, permission: events.write, show_if: "record.state !== 'Cancelled'" }
      - { id: delete_event_detail, label: Delete, variant: danger, permission: events.write, confirm: Delete this event? }
      - { id: publish_event_detail, label: Publish, variant: primary, permission: events.write, show_if: "record.state === 'Draft'" }
      - { id: start_event_detail, label: Start, variant: secondary, permission: events.write, show_if: "record.state === 'Published'" }
      - { id: complete_event_detail, label: Complete, variant: primary, permission: events.manage, show_if: "record.state === 'In Progress'" }
      - { id: cancel_event_detail, label: Cancel, variant: danger, permission: events.manage, show_if: "record.state !== 'Completed' && record.state !== 'Cancelled'" }
      - { id: archive_event_detail, label: Archive, variant: danger, permission: events.write, show_if: 'record.active === true' }
      - { id: unarchive_event_detail, label: Restore, variant: secondary, permission: events.write, show_if: 'record.active === false' }
      - { id: event_slots_detail, label: Slots, variant: secondary, permission: events.read, show_if: "record.multiple_slots" }
    stat_buttons:
      - { id: event_registration_stats_detail, label: Registration, value_field: registration_count, permission: events.read }
      - { id: event_attendee_stats_detail, label: Attendees, value_field: attendee_count, permission: events.read }
      - { id: event_leads_detail, label: Leads, value_field: lead_count, permission: events.read, show_if: "record.lead_count > 0" }
      - { id: event_sales_orders_detail, label: Sales, value_field: sale_price_total_display, permission: events.read, show_if: "record.sale_price_total > 0" }
    statusbar: [{ value: Draft, label: Draft }, { value: Published, label: Published }, { value: In Progress, label: In Progress }, { value: Completed, label: Completed }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, Published: blue, In Progress: amber, Completed: green, Cancelled: red }
    group_columns: 2
    notebook:
      active: notes
      tabs:
        - id: notes
          label: Notes & Documents
          fields:
            - { field: badge_format, label: Badge Dimension, type: select, options: [{ value: A4_french_fold, label: A4 foldable }, { value: A6, label: A6 }, { value: four_per_sheet, label: 4 per sheet }] }
            - { field: badge_image_file_name, label: Badge Background, readonly: true }
            - { field: ticket_instructions, label: Ticket Instructions, type: richtext, wide: true }
            - { field: note, label: Note, type: textarea, wide: true, placeholder: 'Add some internal notes (to do lists, contact info, ...)' }
    groups:
      - title: Event
        fields:
          - { field: name, label: Event Name }
          - { field: start_at, label: Date }
          - { field: display_timezone, label: Display Timezone }
          - { field: multiple_slots, label: Multiple Slots, type: checkbox }
          - { field: template, label: Template }
          - { field: tags, label: Tags }
      - title: Organization
        fields:
          - { field: event_type, label: Type }
          - { field: organizer, label: Organizer }
          - { field: company, label: Company }
          - { field: venue, label: Venue }
          - { field: online_url, label: Online Event URL }
          - { field: limit_registrations, label: Limit Registrations, type: checkbox }
          - { field: active, label: Active, type: checkbox, readonly: true }
      - title: Schedule and attendance
        wide: true
        fields: [{ field: end_at, label: Ends at }, { field: capacity, label: Capacity }, { field: registration_count, label: Registered }, { field: description, label: Description }]
    message_source: event_detail_chatter
    chatter_label: Messages and activities
    message_label: Send message
    note_label: Log note
    message_action: send_event_detail_message
    note_action: log_event_detail_note
    message_placeholder: Send a message to event followers…
    note_placeholder: Log an internal note…
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
    activity_action: schedule_event_detail_activity
    activity_complete_action: complete_event_detail_activity
    activity_complete_label: Mark Done
    activity_label: Activity
    activity_placeholder: Describe the activity…
    chatter_label: Activities
    chatter_empty: No activities yet.
    message_actor_field: actor_name
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
  - type: TabGroup
    mount_in: previous-panel
    tabs:
      - id: tickets
        label: Tickets
        components:
          - type: ListView
            variant: odoo
            scroll: body
            source: event_tickets
            create_label: New ticket
            create_action: create_event_ticket
            columns:
              - { field: name, label: Name, type: PrimaryEntityCell }
              - { field: price, label: Price, align: right }
              - { field: registration_start, label: Registration Start }
              - { field: registration_end, label: Registration End }
              - { field: maximum, label: Maximum, align: right }
              - { field: registration_count, label: Registration, align: right }
            row_key: id
            page_size: 50
            row_open_action: view_event_ticket
            row_double_click_action: view_event_ticket
            empty_state: { title: No tickets, description: Tickets will appear here when they are configured. }
      - id: communication
        label: Communication
        components:
          - type: LineItemGrid
            source: event_detail_communications
            parent_source: event_detail
            title: Communication
            description: Automated emails and reminders for this event.
            variant: odoo_x2many
            page_size: 50
            row_key: id
            actions:
              - { id: add_event_detail_communication, label: Add a line, variant: primary, permission: events.write }
            empty_state: { title: No communication schedules, description: Add an email schedule for registrations and event reminders. }
            children:
              - { type: LineItemField, id: template_ref, field: template_ref, label: Template, input_type: select, options: ['Event: Registration Confirmation', 'Event: Reminder'], required: true }
              - { type: LineItemField, id: interval_nbr, field: interval_nbr, label: Interval, input_type: number, required: true, min: 0 }
              - { type: LineItemField, id: interval_unit, field: interval_unit, label: Unit, input_type: select, options: [Immediately, Hours, Days, Weeks, Months], required: true }
              - { type: LineItemField, id: interval_type, field: interval_type, label: Trigger, input_type: select, options: ['After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends'], required: true }
              - { type: LineItemField, id: scheduled_date, field: scheduled_date, label: Schedule Date, readonly: true }
              - { type: LineItemField, id: mail_count_done, field: mail_count_done, label: '# Sent', readonly: true }
              - { type: LineItemField, id: mail_state_label, field: mail_state_label, label: Status, readonly: true }
              - type: LineItemActions
                id: event_detail_communication_actions
                edit_action: edit_event_detail_communication
                create_action: add_event_detail_communication
                actions:
                  - { id: edit_event_detail_communication, label: Edit, icon: edit, variant: ghost, permission: events.write }
                  - { id: delete_event_detail_communication, label: Delete, icon: trash, variant: danger, permission: events.write }
      - id: questions
        label: Questions
        components:
          - type: ListView
            variant: odoo
            scroll: body
            source: event_detail_questions
            create_label: Add a line
            create_action: add_event_detail_question
            columns:
              - { field: sequence, label: '#', align: right }
              - { field: question, label: Title, type: PrimaryEntityCell }
              - { field: question_type, label: Type }
              - { field: mandatory, label: Mandatory, type: StatusChip }
              - { field: once_per_order, label: Once per Order, type: StatusChip }
              - { field: answers, label: Answers }
              - { field: id, label: '', sortable: false, actions: [{ id: view_event_question_answers_from_event, label: Attendee answers, icon: chart }, { id: edit_event_detail_question, label: Edit, icon: edit }, { id: remove_event_detail_question, label: Delete, icon: trash, variant: danger }] }
            row_key: id
            page_size: 50
            row_actions: menu
            empty_state: { title: No questions, description: Registration questions will appear here. }
      - id: tags
        label: Tags
        components:
          - type: LineItemGrid
            source: event_detail_tags
            parent_source: event_detail
            title: Tags
            description: Assign the reusable event tags defined in Event Tags Categories.
            variant: odoo_x2many
            page_size: 50
            row_key: id
            actions:
              - { id: add_event_detail_tag, label: Add a tag, variant: primary, permission: events.write }
            empty_state: { title: No tags, description: Add a tag to classify this event. }
            children:
              - { type: LineItemField, id: name, field: name, label: Tag, readonly: true }
              - { type: LineItemField, id: category, field: category, label: Category, readonly: true }
              - { type: LineItemField, id: color, field: color, label: Color, readonly: true }
              - type: LineItemActions
                id: event_detail_tag_actions
                actions:
                  - { id: remove_event_detail_tag, label: Remove, icon: trash, variant: danger, permission: events.write }
      - id: slots
        label: Slots
        components:
          - type: ListView
            variant: odoo
            scroll: body
            source: event_detail_slots
            search: { label: Search slots, placeholder: Search slots... }
            create_label: New slot
            create_action: create_event_slot
            columns:
              - { field: name, label: Slot, type: PrimaryEntityCell }
              - { field: start_at, label: Starts at }
              - { field: end_at, label: Ends at }
              - { field: seats, label: Seats, align: right }
              - { field: registration_count, label: Registration, align: right }
              - { field: state, label: Status, type: StatusChip }
            row_key: id
            page_size: 50
            row_open_action: view_event_slot
            row_double_click_action: view_event_slot
            empty_state: { title: No slots, description: Event slots will appear here when multiple slots are enabled. }
  - type: ContactGrid
    source: event_registrations
    row_key: id
    columns:
      - { field: attendee_name, label: Attendee, type: PrimaryEntityCell }
      - { field: attendee_email, label: Email }
      - { field: ticket_type, label: Ticket type }
      - { field: registered_at, label: Registered at }
      - { field: state, label: Status, type: StatusChip }
    empty_state: { title: No registrations, description: Attendees will appear here after registration. }
actions:
  - { id: registration_desk_event_detail, type: navigate, permission: events.read, navigate_to: /events/registration-desk }
  - { id: print_event_attendee_list, type: navigate, permission: events.read, navigate_to: /events/attendee-list, params: { id: '{row.id}' } }
  - { id: print_event_badge_example, type: navigate, permission: events.read, navigate_to: /events/badge-example, params: { id: '{row.id}' } }
  - { id: print_event_full_page_ticket_example, type: navigate, permission: events.read, navigate_to: /events/full-page-ticket, params: { id: '{row.id}' } }
  - { id: event_registration_stats_detail, type: navigate, permission: events.read, navigate_to: /events/registration-statistics, params: { event_id: '{row.id}' } }
  - { id: event_attendee_stats_detail, type: navigate, permission: events.read, navigate_to: /events/attendees, params: { event_id: '{row.id}' } }
  - { id: event_leads_detail, type: navigate, permission: events.read, navigate_to: /events/leads, params: { event_id: '{row.id}' } }
  - { id: event_slots_detail, type: navigate, permission: events.read, navigate_to: /events/slots, params: { event_id: '{row.id}' } }
  - id: view_event_ticket
    type: navigate
    permission: events.read
    navigate_to: /events/tickets/detail
    params: { id: '{row.id}' }
  - id: view_event_slot
    type: navigate
    permission: events.read
    navigate_to: /events/slots/detail
    params: { id: '{row.id}' }
  - id: create_event_slot
    type: server_form
    permission: events.write
    title: New event slot
    action: events.slots.create
    handler: yaml_mutation
    operation: insert
    params: { event_id: '{state.id}' }
    refresh: [event_detail_slots]
    mutation:
      operation: insert
      table: event_slots
      fields: [event_id, name, start_at, end_at, seats, date_tz, color]
      required: [event_id, name, start_at, end_at]
      defaults: { seats: 0, date_tz: Europe/Brussels, color: '#875A7B' }
      guards:
        - { query: "SELECT id FROM events WHERE id = :event_id", status: 404, code: EVENT_NOT_FOUND, message: Event not found. }
        - { query: "SELECT 1 AS ok WHERE CAST(:start_at AS TIMESTAMP) < CAST(:end_at AS TIMESTAMP)", status: 422, code: EVENT_SLOT_TIME_RANGE_INVALID, message: Slot end must be later than slot start. }
        - { query: "SELECT 1 AS ok FROM events WHERE id = :event_id AND CAST(:start_at AS TIMESTAMP) >= start_at AND CAST(:end_at AS TIMESTAMP) <= end_at", status: 422, code: EVENT_SLOT_OUTSIDE_EVENT, message: Slot must be within the event time range. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:seats, 0) >= 0", status: 422, code: EVENT_SLOT_SEATS_INVALID, message: Seats must be zero or greater. }
      result: { query: "SELECT * FROM event_slots WHERE id = :id" }
    fields:
      - { field: event_id, label: Event ID, type: text, required: true }
      - { field: name, label: Slot, type: text, required: true }
      - { field: start_at, label: Starts at, type: text, required: true }
      - { field: end_at, label: Ends at, type: text, required: true }
      - { field: date_tz, label: Timezone, type: text, default: Europe/Brussels }
      - { field: seats, label: Seats per slot, type: number, min: 0, default: 0 }
      - { field: color, label: Color, type: text, default: '#875A7B' }
  - id: create_event_ticket
    type: server_form
    permission: events.write
    title: New event ticket
    action: events.tickets.create
    handler: yaml_mutation
    operation: insert
    params: { event_id: '{state.id}' }
    refresh: [event_tickets]
    mutation:
      operation: insert
      table: event_tickets
      fields: [event_id, name, description, price, registration_start, registration_end, maximum, limit_max_per_order, color]
      required: [event_id, name]
      defaults: { price: 0, maximum: 0, limit_max_per_order: 0, color: '#875A7B' }
      guards:
        - { query: "SELECT id FROM events WHERE id = :event_id", status: 404, message: Event not found }
        - { query: "SELECT 1 WHERE :registration_start IS NULL OR :registration_end IS NULL OR CAST(:registration_start AS TIMESTAMP) <= CAST(:registration_end AS TIMESTAMP)", status: 422, message: Registration end must be on or after registration start }
        - { query: "SELECT 1 WHERE COALESCE(:maximum, 0) >= 0 AND COALESCE(:limit_max_per_order, 0) >= 0 AND (COALESCE(:maximum, 0) = 0 OR COALESCE(:limit_max_per_order, 0) <= COALESCE(:maximum, 0))", status: 422, message: Ticket order limit must not exceed the maximum seats }
      result: { query: "SELECT * FROM event_tickets WHERE id = :id" }
    fields:
      - { field: event_id, label: Event ID, type: text, required: true }
      - { field: name, label: Ticket Type, type: text, required: true }
      - { field: description, label: Description, type: textarea }
      - { field: price, label: Price, type: number, min: 0, default: 0 }
      - { field: registration_start, label: Registration Start, type: text }
      - { field: registration_end, label: Registration End, type: text }
      - { field: maximum, label: Maximum Attendees, type: number, min: 0, default: 0 }
      - { field: limit_max_per_order, label: Limit per Order, type: number, min: 0, default: 0 }
      - { field: color, label: Color, type: text, default: '#875A7B' }
  - id: edit_event_detail
    type: server_form
    permission: events.write
    title: Edit event
    action: events.records.update
    handler: yaml_mutation
    operation: update
    prefill: state.event_detail
    refresh: [event_detail]
    mutation:
      operation: update
      table: events
      fields: [name, event_type, organizer, venue, description, capacity, start_at, end_at, badge_format, ticket_instructions, note]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM events WHERE id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_NOTES_STALE, message: This event changed before its notes and documents could be saved. Reload before retrying. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:badge_format, 'A6') IN ('A4_french_fold', 'A6', 'four_per_sheet')", status: 422, code: EVENT_BADGE_FORMAT_INVALID, message: Choose a valid badge dimension. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:ticket_instructions, '') AS VARCHAR)) <= 10000 AND LOWER(CAST(COALESCE(:ticket_instructions, '') AS VARCHAR)) NOT LIKE '%<script%'", status: 422, code: EVENT_TICKET_INSTRUCTIONS_INVALID, message: Ticket Instructions must be safe HTML up to 10000 characters. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:note, '') AS VARCHAR)) <= 10000 AND LOWER(CAST(COALESCE(:note, '') AS VARCHAR)) NOT LIKE '%<script%'", status: 422, code: EVENT_NOTE_INVALID, message: Note must be safe HTML up to 10000 characters. }
      result: { query: "SELECT * FROM events WHERE id = :id" }
      timestamps: true
    fields:
      - { field: name, label: Event, type: text, required: true }
      - { field: event_type, label: Type, type: text }
      - { field: organizer, label: Organizer, type: text }
      - { field: venue, label: Venue, type: text }
      - { field: description, label: Description, type: textarea }
      - { field: capacity, label: Capacity, type: number }
      - { field: start_at, label: Starts at, type: datetime }
      - { field: end_at, label: Ends at, type: datetime }
      - { field: badge_format, label: Badge Dimension, type: select, options: [{ value: A4_french_fold, label: A4 foldable }, { value: A6, label: A6 }, { value: four_per_sheet, label: 4 per sheet }] }
      - { field: ticket_instructions, label: Ticket Instructions, type: richtext, wide: true }
      - { field: note, label: Note, type: textarea, wide: true }
  - id: delete_event_detail
    type: server
    permission: events.write
    action: events.records.delete
    handler: yaml_mutation
    params: { id: '{state.id}' }
    refresh: [event_detail, events]
    mutation:
      operation: delete
      table: events
      guards:
        - { query: "SELECT id FROM events WHERE id = :id", status: 404, code: EVENT_NOT_FOUND, message: Event not found. }
        - { query: "SELECT id FROM events WHERE id = :id AND state = 'Draft'", status: 409, code: EVENT_NOT_DRAFT, message: Only draft events can be deleted. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_registrations WHERE event_id = :id)", status: 409, code: EVENT_HAS_REGISTRATIONS, message: Events with registrations cannot be deleted. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_tickets WHERE event_id = :id)", status: 409, code: EVENT_HAS_TICKETS, message: Events with tickets cannot be deleted. }
  - { id: publish_event_detail, type: server, permission: events.write, action: events.records.publish, handler: order_transition, workflow: events, operation: publish, params: { id: '{state.id}' }, refresh: [event_detail] }
  - { id: start_event_detail, type: server, permission: events.write, action: events.records.start, handler: order_transition, workflow: events, operation: start, params: { id: '{state.id}' }, refresh: [event_detail] }
  - { id: complete_event_detail, type: server, permission: events.manage, action: events.records.complete, handler: order_transition, workflow: events, operation: complete, params: { id: '{state.id}' }, refresh: [event_detail] }
  - { id: cancel_event_detail, type: server, permission: events.manage, action: events.records.cancel, handler: order_transition, workflow: events, operation: cancel, params: { id: '{state.id}' }, refresh: [event_detail] }
