title: Event Stages
page: { id: event-stages, route: /events/stages, breadcrumb: [Marketing, Events, Configuration, Event Stages], auth: { require: [events.read] } }
components:
  - type: ListView
    variant: odoo
    source: event_stages
    create_label: New stage
    search: { label: Search stages, placeholder: Search stages... }
    columns: [{ field: name, label: Stage Name, type: PrimaryEntityCell }, { field: sequence, label: Sequence, align: right }, { field: fold, label: Folded, type: StatusChip }]
    page_size: 50
    row_key: id
    create_action: create_event_stage
actions:
  - id: create_event_stage
    type: server_form
    permission: events.write
    title: New event stage
    action: events.stages.create
    handler: yaml_mutation
    operation: create
    refresh: [event_stages]
    mutation: { operation: insert, table: event_stages, fields: [name, sequence, fold], required: [name], defaults: { sequence: 10, fold: false }, result: { query: "SELECT * FROM event_stages WHERE id = :id" } }
    fields: [{ field: name, label: Stage Name, type: text, required: true }, { field: sequence, label: Sequence, type: number, default: 10 }, { field: fold, label: Folded, type: checkbox, default: false }]
