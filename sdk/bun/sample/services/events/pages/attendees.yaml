title: Attendees
page: { id: attendees, route: /events/attendees, breadcrumb: [Marketing, Events, Reporting, Attendees], auth: { require: [events.read] } }
components:
  - type: ListView
    variant: odoo
    source: event_attendees
    search: { label: Search attendees, placeholder: Search attendees or events... }
    filters: [{ field: state, label: Status, options: [{ id: Registered, label: Registered }, { id: Attended, label: Attended }]}]
    columns: [{ field: attendee_name, label: Attendee, type: PrimaryEntityCell }, { field: event_name, label: Event }, { field: ticket_type, label: Ticket Type }, { field: registered_at, label: Registration Date }, { field: state, label: Status, type: StatusChip }]
    page_size: 50
    row_key: id
