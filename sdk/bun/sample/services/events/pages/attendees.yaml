title: Attendees
page: { id: attendees, route: /events/attendees, breadcrumb: [Marketing, Events, Reporting, Attendees], auth: { require: [events.read] } }
components:
  - type: ListView
    variant: odoo
    source: event_attendees
    search: { label: Search attendees, placeholder: Search attendees or events... }
    filters: [{ field: state, label: Status, options: [{ id: Unconfirmed, label: Unconfirmed }, { id: Registered, label: Registered }, { id: Attended, label: Attended }, { id: Cancelled, label: Cancelled }]}]
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_event_attendee
    row_double_click_action: view_event_attendee
    columns:
      - { field: attendee_name, label: Attendee, type: PrimaryEntityCell }
      - { field: event_name, label: Event }
      - { field: ticket_type, label: Ticket Type }
      - { field: registered_at, label: Registration Date }
      - { field: state, label: Status, type: StatusChip }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: confirm_event_attendee, label: Registered, variant: primary, permission: events.write, show_if: "row.state === 'Unconfirmed'" }
          - { id: mark_attendee_attended, label: Mark attended, variant: primary, permission: events.write, show_if: "row.state === 'Registered'" }
          - { id: cancel_event_attendee, label: Cancel registration, variant: danger, permission: events.write, show_if: "row.state !== 'Cancelled'" }
