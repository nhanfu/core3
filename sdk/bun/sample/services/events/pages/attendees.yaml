title: Attendees
page: { id: attendees, route: /events/attendees, breadcrumb: [Marketing, Events, Reporting, Attendees], auth: { require: [events.read] } }
components:
  - type: ListView
    variant: odoo
    source: event_attendees
    search: { label: Search attendees, placeholder: Search attendees or events... }
    filters: [{ field: state, label: Status, options: [{ id: Registered, label: Registered }, { id: Attended, label: Attended }, { id: Cancelled, label: Cancelled }]}]
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_event_attendee
    row_double_click_action: view_event_attendee
    columns:
      - { field: attendee_name, label: Attendee, type: PrimaryEntityCell }
      - { field: event_name, label: Event }
      - { field: ticket_type, label: Ticket Type }
      - { field: registered_at, label: Registration Date }
      - { field: state, label: Status, type: StatusChip }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: mark_attendee_attended, label: Mark attended, variant: primary, permission: events.write, show_if: "row.state === 'Registered'" }
          - { id: cancel_event_attendee, label: Cancel registration, variant: danger, permission: events.write, show_if: "row.state !== 'Cancelled'" }
actions:
  - id: view_event_attendee
    type: navigate
    permission: events.read
    navigate_to: /events/attendees/detail
    params: { id: '{row.id}' }
  - id: mark_attendee_attended
    type: server
    permission: events.write
    action: events.registrations.check_in
    handler: yaml_mutation
    params: { id: '{row.id}' }
    refresh: [event_attendees]
    mutation:
      guards: [{ query: "SELECT id FROM event_registrations WHERE id = :id AND state = 'Registered'", status: 409, message: Only registered attendees can be marked attended }]
      steps: [{ query: "UPDATE event_registrations SET state = 'Attended' WHERE id = :id" }]
      result: { query: "SELECT * FROM event_registrations WHERE id = :id" }
  - id: cancel_event_attendee
    type: server
    permission: events.write
    action: events.registrations.cancel
    handler: yaml_mutation
    params: { id: '{row.id}' }
    refresh: [event_attendees]
    mutation:
      guards: [{ query: "SELECT id FROM event_registrations WHERE id = :id AND state <> 'Cancelled'", status: 409, message: Only active registrations can be cancelled }]
      steps: [{ query: "UPDATE event_registrations SET state = 'Cancelled' WHERE id = :id" }]
      result: { query: "SELECT * FROM event_registrations WHERE id = :id" }
