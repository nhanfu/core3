title: Event Template
page: { id: event-template-detail, route: /events/templates/detail, breadcrumb: [Marketing, Events, Configuration, Event Templates], auth: { require: [events.read] } }
components:
  - type: OdooFormView
    source: event_template_detail
    title_field: name
    subtitle_field: template_label
    editable: true
    content_slot: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    header_actions:
      - { id: back_to_event_templates, label: Back to event templates, variant: secondary, permission: events.read }
      - { id: manage_event_template_tickets, label: Tickets, variant: secondary, permission: events.read }
      - { id: edit_event_template, label: Edit, variant: primary, permission: events.write }
      - { id: edit_event_template_notes, label: Edit notes, variant: secondary, permission: events.write }
      - { id: delete_event_template, label: Delete, variant: danger, permission: events.write, confirm: Delete this event template? }
    groups:
      - title: Event Template
        fields:
          - { field: name, label: Event Template }
          - { field: seats, label: Seats }
          - { field: active, label: Active }
    notebook:
      active: communication
      tabs:
        - { id: tickets, label: Tickets }
        - { id: communication, label: Communication, content_slot: true }
        - { id: questions, label: Questions, content_slot: true }
        - id: notes
          label: Notes
          fields:
            - { field: ticket_instructions, label: Ticket Instructions, type: richtext, wide: true }
            - { field: note, label: Note, type: textarea, wide: true, placeholder: 'Add some internal notes (to do lists, contact info, ...)' }

  - type: LineItemGrid
    mount_in: previous-panel
    source: event_template_communications
    parent_source: event_template_detail
    title: Communication
    description: Schedule the emails copied to each event created from this template.
    variant: odoo_x2many
    page_size: 50
    row_key: id
    actions:
      - { id: add_event_template_communication, label: Add a line, variant: primary, permission: events.write }
    empty_state: { title: No communication schedules, description: Add an email schedule for registrations and event reminders. }
    children:
      - { type: LineItemField, id: template_name, field: template_name, label: Template, input_type: select, options: ['Event: Registration Confirmation', 'Event: Reminder'], required: true }
      - { type: LineItemField, id: interval_nbr, field: interval_nbr, label: Interval, input_type: number, required: true, min: 0 }
      - { type: LineItemField, id: interval_unit, field: interval_unit, label: Unit, input_type: select, options: [Immediately, Hours, Days, Weeks, Months], required: true }
      - { type: LineItemField, id: interval_type, field: interval_type, label: Trigger, input_type: select, options: ['After each registration', 'Before the event starts', 'After the event started', 'After the event ended', 'Before the event ends'], required: true }
      - type: LineItemActions
        id: event_template_communication_actions
        edit_action: edit_event_template_communication
        create_action: add_event_template_communication
        actions:
          - { id: edit_event_template_communication, label: Edit, icon: edit, variant: ghost, permission: events.write }
          - { id: delete_event_template_communication, label: Delete, icon: trash, variant: danger, permission: events.write }
    columns:
      - { field: template_name, label: Template, width: 360 }
      - { field: interval_nbr, label: Interval, align: right, width: 120 }
      - { field: interval_unit, label: Unit, width: 180 }
      - { field: interval_type, label: Trigger, width: 260 }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: edit_event_template_communication, label: Edit, icon: edit, variant: ghost, permission: events.write }
          - { id: delete_event_template_communication, label: Delete, icon: trash, variant: danger, permission: events.write }

  - type: LineItemGrid
    mount_in: previous-panel
    source: event_template_questions
    parent_source: event_template_detail
    title: Questions
    description: Reuse attendee questions on every event created from this template.
    variant: odoo_x2many
    page_size: 50
    row_key: id
    actions:
      - { id: add_event_template_question, label: Add a line, variant: primary, permission: events.write }
    empty_state: { title: No template questions, description: Add a line to reuse a question on this template. }
    children:
      - { type: LineItemField, id: title, field: title, label: Title, type: PrimaryEntityCell, readonly: true }
      - { type: LineItemField, id: mandatory, field: mandatory, label: Mandatory, type: StatusChip, readonly: true }
      - { type: LineItemField, id: once_per_order, field: once_per_order, label: Once per Order, type: StatusChip, readonly: true }
      - { type: LineItemField, id: question_type, field: question_type, label: Type, readonly: true }
      - { type: LineItemField, id: answers, field: answers, label: Answers, readonly: true }
      - type: LineItemActions
        id: event_template_question_actions
        create_action: add_event_template_question
        actions:
          - { id: remove_event_template_question, label: Remove, icon: trash, variant: danger, permission: events.write }
    columns:
      - { field: title, label: Title, width: 320 }
      - { field: mandatory, label: Mandatory, width: 140 }
      - { field: once_per_order, label: Once per Order, width: 160 }
      - { field: question_type, label: Type, width: 150 }
      - { field: answers, label: Answers, width: 300 }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: remove_event_template_question, label: Remove, icon: trash, variant: danger, permission: events.write }

  - type: LineItemGrid
    mount_in: previous-panel
    source: event_template_tags
    parent_source: event_template_detail
    title: Tags
    description: Apply reusable event tags to every event created from this template.
    variant: odoo_x2many
    page_size: 50
    row_key: id
    actions:
      - { id: add_event_template_tag, label: Add a tag, variant: primary, permission: events.write }
    empty_state: { title: No template tags, description: Add a tag to classify events created from this template. }
    children:
      - { type: LineItemField, id: name, field: name, label: Tag, readonly: true }
      - { type: LineItemField, id: category, field: category, label: Category, readonly: true }
      - { type: LineItemField, id: color, field: color, label: Color, readonly: true }
      - type: LineItemActions
        id: event_template_tag_actions
        actions:
          - { id: remove_event_template_tag, label: Remove, icon: trash, variant: danger, permission: events.write }
    columns:
      - { field: name, label: Tag, width: 320 }
      - { field: category, label: Category, width: 220 }
      - { field: color, label: Color, width: 120 }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: remove_event_template_tag, label: Remove, icon: trash, variant: danger, permission: events.write }
actions:
  - id: back_to_event_templates
    type: navigate
    permission: events.read
    navigate_to: /events/templates
  - id: manage_event_template_tickets
    type: navigate
    permission: events.read
    navigate_to: /events/templates/tickets
    params: { id: '{state.id}' }
  - id: edit_event_template
    type: server_form
    permission: events.write
    title: Edit event template
    action: events.templates.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    prefill: state.event_template_detail
    refresh: [event_template_detail, event_templates]
    mutation:
      operation: update
      table: event_templates
      fields: [name, seats, active]
      required: [name]
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id", status: 404, message: Event template not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM event_templates WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: EVENT_TEMPLATE_NAME_EXISTS, message: An event template with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:seats, 0) >= 0", status: 422, code: EVENT_TEMPLATE_SEATS_INVALID, message: Seats must be zero or greater. }
      result: { query: "SELECT * FROM event_templates WHERE id = :id" }
    fields:
      - { field: name, label: Event Template, type: text, required: true }
      - { field: seats, label: Seats, type: number, min: 0 }
      - { field: active, label: Active, type: checkbox }
  - id: edit_event_template_notes
    type: server_form
    permission: events.write
    title: Edit event template notes
    action: events.templates.notes.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    prefill: state.event_template_detail
    refresh: [event_template_detail, event_templates]
    mutation:
      operation: update
      table: event_templates
      fields: [ticket_instructions, note]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM event_templates WHERE id = :id AND row_version = :expected_row_version", status: 409, code: EVENT_TEMPLATE_NOTES_STALE, message: This event template changed before its notes could be saved. Reload before retrying. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:ticket_instructions, '') AS VARCHAR)) <= 10000 AND LOWER(CAST(COALESCE(:ticket_instructions, '') AS VARCHAR)) NOT LIKE '%<script%'", status: 422, code: EVENT_TEMPLATE_TICKET_INSTRUCTIONS_INVALID, message: Ticket Instructions must be safe HTML up to 10000 characters. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:note, '') AS VARCHAR)) <= 10000 AND LOWER(CAST(COALESCE(:note, '') AS VARCHAR)) NOT LIKE '%<script%'", status: 422, code: EVENT_TEMPLATE_NOTE_INVALID, message: Note must be safe HTML up to 10000 characters. }
      result: { query: "SELECT * FROM event_templates WHERE id = :id" }
    fields:
      - { field: ticket_instructions, label: Ticket Instructions, type: richtext, wide: true }
      - { field: note, label: Note, type: textarea, wide: true, placeholder: 'Add some internal notes (to do lists, contact info, ...)' }
  - id: delete_event_template
    type: server
    permission: events.write
    action: events.templates.delete
    handler: yaml_mutation
    params: { id: '{state.id}' }
    refresh: [event_templates]
    mutation:
      operation: delete
      table: event_templates
      guards: [{ query: "SELECT id FROM event_templates WHERE id = :id", status: 404, message: Event template not found. }]
