title: Subscription
page: { id: subscription-detail, breadcrumb: [Sales, Subscriptions, Detail], auth: { require: [subscriptions.read] } }
components:
  - type: OdooFormView
    source: subscription_detail
    title_field: name
    status_field: state
    statusbar:
      - { value: Quotation, label: Quotation }
      - { value: In Progress, label: In progress }
      - { value: Paused, label: Paused }
      - { value: Closed, label: Closed }
      - { value: Churned, label: Churned }
    status_colors: { Quotation: neutral, In Progress: green, Paused: amber, Closed: blue, Churned: red }
    header_actions:
      - { id: edit_subscription_detail, label: Edit, variant: secondary, permission: subscriptions.write, show_if: "state.subscription_detail.state === 'Quotation' || state.subscription_detail.state === 'Paused'" }
      - { id: activate_subscription_detail, label: Confirm, variant: primary, permission: subscriptions.write, show_if: "state.subscription_detail.state === 'Quotation' || state.subscription_detail.state === 'Paused'" }
      - { id: pause_subscription_detail, label: Pause, variant: secondary, permission: subscriptions.write, show_if: "state.subscription_detail.state === 'In Progress'" }
      - { id: close_subscription_detail, label: Close, variant: danger, permission: subscriptions.write, show_if: "state.subscription_detail.state === 'In Progress' || state.subscription_detail.state === 'Paused'" }
      - { id: churn_subscription_detail, label: Churn, variant: danger, permission: subscriptions.write, show_if: "state.subscription_detail.state === 'In Progress' || state.subscription_detail.state === 'Paused'" }
      - { id: generate_subscription_invoice, label: Generate invoice, variant: secondary, permission: subscriptions.write, show_if: "state.subscription_detail.state === 'In Progress'" }
    group_columns: 2
    groups:
      - title: Subscription
        fields:
          - { field: name, label: Subscription }
          - { field: state, label: Status }
          - { field: plan, label: Plan }
          - { field: recurring_period, label: Recurrence }
          - { field: recurring_revenue, label: Recurring revenue }
      - title: Customer and dates
        fields:
          - { field: partner_name, label: Customer }
          - { field: start_date, label: Start date }
          - { field: next_invoice_date, label: Next invoice }
          - { field: salesperson, label: Salesperson }
  - type: ContactGrid
    source: subscription_detail_invoices
    row_key: id
    columns:
      - { field: invoice_number, label: Invoice, type: PrimaryEntityCell }
      - { field: invoice_date, label: Invoice date }
      - { field: due_date, label: Due date }
      - { field: amount, label: Amount, align: right }
      - { field: state, label: Status, type: StatusChip }
