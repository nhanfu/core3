title: Subscription Plans
page: { id: subscription-plans, breadcrumb: [Sales, Subscriptions, Plans], auth: { require: [subscriptions.read] } }
datasources:
  - id: subscription_plans
    single: false
    permission: subscriptions.read
    query: "SELECT id, name, recurring_period, recurring_price, trial_days, active FROM sale_subscription_plans ORDER BY name"
components:
  - type: ListView
    variant: odoo
    source: subscription_plans
    create_action: create_subscription_plan
    create_label: New plan
    columns:
      - { field: name, label: Plan, type: PrimaryEntityCell }
      - { field: recurring_period, label: Recurrence }
      - { field: recurring_price, label: Recurring price, align: right }
      - { field: trial_days, label: Trial days, align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: archive_subscription_plan, label: Archive, permission: subscriptions.manage, variant: danger, show_if: "row.active === true" }
actions:
  - id: create_subscription_plan
    type: server_form
    permission: subscriptions.manage
    title: New subscription plan
    action: subscriptions.plans.create
    handler: yaml_mutation
    operation: create
    refresh: [subscription_plans]
    mutation:
      operation: insert
      table: sale_subscription_plans
      fields: [name, recurring_period, recurring_price, trial_days, active]
      required: [name]
      defaults: { recurring_period: Monthly, recurring_price: 0, trial_days: 0, active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM sale_subscription_plans WHERE name = :name)"
          status: 409
          message: Subscription plan already exists
      result: { query: "SELECT * FROM sale_subscription_plans WHERE id = :id" }
    fields:
      - { field: name, label: Plan, type: text, required: true }
      - { field: recurring_period, label: Recurrence, type: select, options: [Daily, Weekly, Monthly, Yearly] }
      - { field: recurring_price, label: Recurring price, type: number }
      - { field: trial_days, label: Trial days, type: number }
  - id: archive_subscription_plan
    type: server
    permission: subscriptions.manage
    action: subscriptions.plans.archive
    handler: plan_status
    operation: archive
    params: { id: '{row.id}' }
    refresh: [subscription_plans]
    mutation:
      guards:
        - query: "SELECT id FROM sale_subscription_plans WHERE id = :id AND active = true"
          status: 409
          message: Subscription plan is already archived
      steps:
        - query: "UPDATE sale_subscription_plans SET active = false WHERE id = :id"
      result: { query: "SELECT * FROM sale_subscription_plans WHERE id = :id" }
