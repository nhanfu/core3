page: { id: transfer-detail }
datasources:
  - id: inventory_transfer_detail
    single: true
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_TRANSFER_DATA_UNAVAILABLE, message: Transfer data is temporarily unavailable. } }
    query: "SELECT p.id, p.row_version, p.name, t.name AS operation_type_name, t.operation_kind, p.contact_name, p.company_name, CAST(p.scheduled_date AS VARCHAR) AS scheduled_date, p.source_document, sl.name AS source_location, dl.name AS destination_location, p.state, (SELECT COUNT(*) FROM inventory_picking_moves m WHERE m.picking_id = p.id) AS move_count, (SELECT COUNT(*) FROM inventory_transfer_returns r WHERE r.source_picking_id = p.id) AS return_count, CASE WHEN t.operation_kind = 'delivery' AND EXISTS (SELECT 1 FROM inventory_picking_moves m WHERE m.picking_id = p.id) AND NOT EXISTS (SELECT 1 FROM inventory_picking_moves m WHERE m.picking_id = p.id AND COALESCE((SELECT SUM(r.quantity) FROM inventory_transfer_reservations r WHERE r.move_id = m.id AND r.state = 'Reserved'), 0) < m.quantity) THEN 'Available' WHEN t.operation_kind = 'delivery' THEN 'Waiting' ELSE NULL END AS product_availability, '' AS note FROM inventory_pickings p JOIN inventory_operation_types t ON t.id = p.operation_type_id JOIN inventory_locations sl ON sl.id = p.source_location_id JOIN inventory_locations dl ON dl.id = p.destination_location_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND p.id = :id"
  - id: inventory_transfer_lines
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_TRANSFER_DATA_UNAVAILABLE, message: Transfer lines are temporarily unavailable. } }
    query: "SELECT m.id, m.picking_id, m.product_name, CAST(m.quantity AS DOUBLE) AS demand, CAST(m.done_quantity AS DOUBLE) AS quantity, CAST(COALESCE((SELECT SUM(r.quantity) FROM inventory_transfer_reservations r WHERE r.move_id = m.id AND r.state = 'Reserved'), 0) AS DOUBLE) AS reserved_quantity, 'Unit(s)' AS uom, CASE WHEN m.done_quantity >= m.quantity THEN 'Available' WHEN COALESCE((SELECT SUM(r.quantity) FROM inventory_transfer_reservations r WHERE r.move_id = m.id AND r.state = 'Reserved'), 0) >= m.quantity THEN 'Available' WHEN COALESCE((SELECT SUM(r.quantity) FROM inventory_transfer_reservations r WHERE r.move_id = m.id AND r.state = 'Reserved'), 0) > 0 THEN 'Partially Available' WHEN p.state IN ('Ready', 'Done') THEN 'Available' ELSE 'Waiting' END AS availability, p.state AS parent_state FROM inventory_picking_moves m JOIN inventory_pickings p ON p.id = m.picking_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND m.picking_id = :id ORDER BY m.id"
  - id: inventory_transfer_timeline
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_TRANSFER_DATA_UNAVAILABLE, message: Transfer history is temporarily unavailable. } }
    query: "SELECT actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM inventory_transfer_messages WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND picking_id = :id UNION ALL SELECT 'OdooBot', 'inventory.transfer.created', 'Transfer created', 'Transfer created', CAST(p.scheduled_date AS VARCHAR) FROM inventory_pickings p WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND p.id = :id AND NOT EXISTS (SELECT 1 FROM inventory_transfer_messages m WHERE m.picking_id = p.id) ORDER BY created_at DESC"
  - id: inventory_transfer_attachments
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_TRANSFER_ATTACHMENTS_UNAVAILABLE, message: Transfer documents are temporarily unavailable. } }
    query: "SELECT a.id, a.picking_id, a.file_name, a.mime_type, a.size_bytes, a.uploaded_by, CAST(a.created_at AS VARCHAR) AS created_at FROM inventory_transfer_attachments a JOIN inventory_pickings p ON p.id = a.picking_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND a.picking_id = :id AND p.company_name = :current_company_name ORDER BY a.created_at DESC, a.id"
  - id: inventory_transfer_returns
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_TRANSFER_RETURNS_UNAVAILABLE, message: Transfer returns are temporarily unavailable. } }
    query: "SELECT r.id, r.source_picking_id, r.return_picking_id, rp.name AS return_name, CAST(r.return_quantity AS DOUBLE) AS return_quantity, r.company_name, r.returned_by, CAST(r.returned_at AS VARCHAR) AS returned_at, r.reason, r.state, r.row_version FROM inventory_transfer_returns r JOIN inventory_pickings p ON p.id = r.source_picking_id JOIN inventory_pickings rp ON rp.id = r.return_picking_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND r.source_picking_id = :id AND (COALESCE(:current_company_name, '') = '' OR r.company_name = :current_company_name) ORDER BY r.returned_at DESC, r.id"

actions:
  - id: upload_inventory_transfer_attachment
    type: upload
    action: inventory.transfers.attachments.upload
    handler: attachment_metadata
    permission: inventory.write
    kind: inventory_transfer_attachment
    params: { picking_id: '{state.inventory_transfer_detail.id}', expected_row_version: '{state.inventory_transfer_detail.row_version}' }
    refresh: [inventory_transfer_attachments, inventory_transfer_timeline, inventory_transfer_detail]
    mutation:
      generated: [attachment_id]
      scope: { table: inventory_pickings, field: company_name, message: Transfer is outside the current company scope, message_key: errors.inventory_transfer_outside_company }
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :picking_id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :picking_id AND company_name = :current_company_name", status: 403, code: INVENTORY_TRANSFER_COMPANY_SCOPE_REQUIRED, message: Transfer is outside the current company scope. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :picking_id AND company_name = :current_company_name AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: The transfer changed before the document could be uploaded. Reload it before retrying. }
        - { query: "SELECT 1 AS ok WHERE length(trim(:fileName)) BETWEEN 1 AND 255 AND :sizeBytes > 0", status: 422, code: INVENTORY_TRANSFER_ATTACHMENT_INVALID, message: A non-empty document is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_transfer_attachments WHERE picking_id = :picking_id AND file_name = :fileName)", status: 409, code: INVENTORY_TRANSFER_ATTACHMENT_DUPLICATE, message: This document is already attached to the transfer. }
      steps:
        - { query: "INSERT INTO inventory_transfer_attachments(id, picking_id, company_name, file_name, mime_type, size_bytes, storage_key, uploaded_by) VALUES(:attachment_id, :picking_id, :current_company_name, :fileName, :mimeType, :sizeBytes, :storageKey, :current_user_id)" }
        - { query: "UPDATE inventory_pickings SET row_version = row_version + 1 WHERE id = :picking_id AND company_name = :current_company_name AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before the document could be uploaded. }
      result: { query: "SELECT id, picking_id, company_name, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM inventory_transfer_attachments WHERE id = :attachment_id" }
  - id: download_inventory_transfer_attachment
    type: download
    permission: inventory.read
    kind: inventory_transfer_attachment
  - id: delete_inventory_transfer
    type: server
    permission: inventory.write
    action: inventory.pickings.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [inventory_receipts, inventory_deliveries, inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline]
    mutation:
      operation: delete
      table: inventory_pickings
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state = 'Draft' AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_DELETE_NOT_ALLOWED, message: Only draft transfers can be deleted. }
      steps:
        - { query: "DELETE FROM inventory_picking_moves WHERE picking_id = :id" }
        - { query: "DELETE FROM inventory_transfer_messages WHERE picking_id = :id" }

  - id: edit_inventory_transfer
    type: server_form
    permission: inventory.write
    title: Edit transfer
    action: inventory.pickings.update
    handler: yaml_mutation
    operation: update
    fields: [{ field: contact_name, label: Contact, type: text }, { field: scheduled_date, label: Scheduled Date, type: text }, { field: source_document, label: Source Document, type: text }]
    refresh: [inventory_transfer_detail, inventory_transfer_lines]
    mutation: { operation: update, table: inventory_pickings, fields: [contact_name, scheduled_date, source_document], concurrency: { required: true }, guards: [{ query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }], result: { query: "SELECT * FROM inventory_pickings WHERE id = :id" } }
  - id: put_inventory_transfer_in_pack
    type: server_form
    permission: inventory.write
    title: Put in Pack
    action: stock.picking.put_in_pack
    handler: yaml_mutation
    operation: put_in_pack
    params: { id: '{state.inventory_transfer_detail.id}', expected_row_version: '{state.inventory_transfer_detail.row_version}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline, inventory_transfer_attachments]
    mutation:
      generated: [package_id, message_id]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state IN ('Waiting', 'Ready') AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_PACK_NOT_ALLOWED, message: Only a current waiting or ready transfer can be packed. }
        - { query: "SELECT id FROM inventory_picking_moves WHERE picking_id = :id", status: 422, code: INVENTORY_TRANSFER_PACK_NO_LINES, message: Add at least one move line before packing this transfer. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_package_move_lines l JOIN inventory_picking_moves m ON m.id = l.move_id WHERE m.picking_id = :id AND l.relation_type = 'result')", status: 409, code: INVENTORY_TRANSFER_ALREADY_PACKED, message: This transfer already has a result package. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:package_name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: INVENTORY_PACKAGE_NAME_REQUIRED, message: A package reference is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_packages WHERE LOWER(name) = LOWER(TRIM(CAST(:package_name AS VARCHAR))))", status: 409, code: INVENTORY_PACKAGE_EXISTS, message: A package with this reference already exists. }
      steps:
        - { query: "INSERT INTO inventory_packages(id, row_version, name, package_type_name, location_name, owner_name, company_name, pack_date, state, content_count) SELECT :package_id, 1, TRIM(CAST(:package_name AS VARCHAR)), NULLIF(TRIM(CAST(COALESCE(:package_type_name, '') AS VARCHAR)), ''), dl.name, '', p.company_name, DATE '2026-01-15', CASE WHEN dl.usage = 'Customer' THEN 'Customer location' ELSE 'In internal locations' END, 0 FROM inventory_pickings p JOIN inventory_locations dl ON dl.id = p.destination_location_id WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "INSERT INTO inventory_package_move_lines(id, package_id, move_id, relation_type) SELECT :package_id || '-move-' || m.id, :package_id, m.id, 'result' FROM inventory_picking_moves m WHERE m.picking_id = :id" }
        - { query: "INSERT INTO inventory_package_contents(id, package_id, product_name, lot_name, quantity, unit_name) SELECT :package_id || '-content-' || m.id, :package_id, m.product_name, NULL, m.quantity, 'Unit(s)' FROM inventory_picking_moves m WHERE m.picking_id = :id" }
        - { query: "UPDATE inventory_packages SET content_count = (SELECT COUNT(*) FROM inventory_package_contents WHERE package_id = :package_id), row_version = row_version + 1 WHERE id = :package_id", expect_changed: true, status: 409, code: INVENTORY_TRANSFER_PACK_FAILED, message: The package could not be populated. }
        - { query: "UPDATE inventory_pickings SET row_version = row_version + 1 WHERE id = :id AND state IN ('Waiting', 'Ready') AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before it could be packed. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.packed', 'Put in Pack', 'Transfer packed into a package')" }
      result: { query: "SELECT * FROM inventory_packages WHERE id = :package_id" }
    fields:
      - { field: package_name, label: Package Reference, type: text, required: true, placeholder: 'e.g. PACK0000007' }
      - { field: package_type_name, label: Package Type, type: text, placeholder: 'e.g. Box' }
  - id: return_inventory_transfer
    type: server_form
    permission: inventory.write
    title: Return transfer
    action: stock.picking.return
    handler: yaml_mutation
    operation: return
    params: { id: '{state.inventory_transfer_detail.id}', expected_row_version: '{state.inventory_transfer_detail.row_version}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline, inventory_transfer_returns]
    mutation:
      generated: [return_id, return_move_id, return_run_id, message_id]
      concurrency: { required: true }
      before_steps:
        - assign: true
          query: "SELECT 'return-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS return_id, 'return-move-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS return_move_id, 'return-run-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS return_run_id, 'return-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM inventory_transfer_returns WHERE source_picking_id = :id"
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND company_name = :current_company_name", status: 403, code: INVENTORY_TRANSFER_COMPANY_SCOPE_REQUIRED, message: Transfer is outside the current company scope. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state = 'Done' AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_RETURN_NOT_ALLOWED, message: Only a current completed transfer can be returned. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND length(trim(COALESCE(:current_user_name, ''))) > 0", status: 403, code: INVENTORY_TRANSFER_ACTOR_REQUIRED, message: A signed-in inventory operator is required to create a return. }
        - { query: "SELECT p.id FROM inventory_pickings p JOIN inventory_picking_moves m ON m.picking_id = p.id WHERE p.id = :id AND m.done_quantity > 0 GROUP BY p.id HAVING COUNT(*) = 1", status: 422, code: INVENTORY_TRANSFER_RETURN_LINES_UNSUPPORTED, message: This bounded return flow requires exactly one completed move line. }
        - { query: "SELECT 1 AS ok WHERE CAST(:return_quantity AS DECIMAL(18,3)) > 0 AND CAST(:return_quantity AS DECIMAL(18,3)) <= (SELECT m.done_quantity - COALESCE((SELECT SUM(r.return_quantity) FROM inventory_transfer_returns r WHERE r.source_picking_id = :id), 0) FROM inventory_picking_moves m WHERE m.picking_id = :id AND m.done_quantity > 0)", status: 422, code: INVENTORY_TRANSFER_RETURN_QUANTITY_INVALID, message: Return quantity must be greater than zero and no greater than the remaining delivered quantity. }
      steps:
        - { query: "INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state) SELECT :return_id, 'operation-receipts', 'RET/' || p.name || '/' || :return_id, p.contact_name, p.scheduled_date, 'Return of ' || p.name, p.company_name, p.destination_location_id, p.source_location_id, 'Waiting' FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity) SELECT :return_move_id, :return_id, m.product_name, CAST(:return_quantity AS DECIMAL(18,3)), 0 FROM inventory_picking_moves m WHERE m.picking_id = :id AND m.done_quantity > 0" }
        - { query: "INSERT INTO inventory_transfer_returns(id, source_picking_id, return_picking_id, company_name, return_quantity, returned_by, reason, state) SELECT :return_run_id, p.id, :return_id, p.company_name, CAST(:return_quantity AS DECIMAL(18,3)), :current_user_name, COALESCE(:reason, ''), 'Waiting' FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "UPDATE inventory_pickings SET row_version = row_version + 1 WHERE id = :id AND state = 'Done' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before its return could be created. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.return_created', 'Return created', 'Return transfer ' || :return_id || ' created')" }
      result: { query: "SELECT r.id, r.source_picking_id, r.return_picking_id, rp.name AS return_name, r.return_quantity, r.company_name, r.returned_by, r.reason, r.state, r.row_version FROM inventory_transfer_returns r JOIN inventory_pickings rp ON rp.id = r.return_picking_id WHERE r.id = :return_run_id" }
    fields:
      - { field: return_quantity, label: Return Quantity, type: number, required: true, min: 0.001 }
      - { field: reason, label: Reason, type: textarea, placeholder: 'Optional return reason' }
  - id: mark_inventory_transfer_todo
    type: server
    permission: inventory.write
    action: inventory.pickings.confirm
    handler: yaml_mutation
    operation: confirm
    params: { id: '{state.id}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline]
    mutation:
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state = 'Draft' AND row_version = :expected_row_version", status: 409, message: Only draft transfers can be marked as todo }
      steps:
        - { query: "UPDATE inventory_pickings SET state = 'Waiting', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version" }
      result: { query: "SELECT * FROM inventory_pickings WHERE id = :id" }
  - id: check_inventory_transfer_availability
    type: server
    permission: inventory.write
    action: inventory.pickings.check_availability
    handler: yaml_mutation
    operation: check_availability
    params: { id: '{state.id}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: INVENTORY_TRANSFER_COMPANY_SCOPE_REQUIRED, message: Transfer is outside the current company scope. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state IN ('Waiting', 'Draft') AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_CHECK_AVAILABILITY_NOT_ALLOWED, message: Only a current draft or waiting transfer can check availability. }
        - { query: "SELECT id FROM inventory_picking_moves WHERE picking_id = :id", status: 422, code: INVENTORY_TRANSFER_NO_MOVE_LINES, message: Add at least one move line before checking availability. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_transfer_reservations WHERE picking_id = :id AND state = 'Reserved')", status: 409, code: INVENTORY_TRANSFER_ALREADY_RESERVED, message: This transfer already has reserved quantities. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT m.id FROM inventory_picking_moves m JOIN inventory_pickings p ON p.id = m.picking_id WHERE p.id = :id AND NOT EXISTS (SELECT 1 FROM inventory_quants q WHERE q.product_name = m.product_name AND q.location_id = p.source_location_id AND COALESCE(q.company_name, 'Core3 Demo Company') = p.company_name AND q.quantity - q.reserved_quantity >= m.quantity))", status: 409, code: INVENTORY_TRANSFER_NOT_AVAILABLE, message: Not enough available stock exists for one or more move lines. }
      steps:
        - { query: "INSERT INTO inventory_transfer_reservations(id, picking_id, move_id, quant_id, company_name, quantity, reserved_by, reserved_at) SELECT :id || '-reservation-' || m.id || '-' || q.id, :id, m.id, q.id, p.company_name, m.quantity, COALESCE(NULLIF(:current_user_name, ''), 'Admin User'), TIMESTAMP '2026-01-15 08:00:00' FROM inventory_picking_moves m JOIN inventory_pickings p ON p.id = m.picking_id JOIN inventory_quants q ON q.product_name = m.product_name AND q.location_id = p.source_location_id AND COALESCE(q.company_name, 'Core3 Demo Company') = p.company_name WHERE p.id = :id AND q.quantity - q.reserved_quantity >= m.quantity" }
        - { query: "UPDATE inventory_quants q SET reserved_quantity = q.reserved_quantity + r.quantity, row_version = q.row_version + 1, updated_at = TIMESTAMP '2026-01-15 08:00:00' FROM inventory_transfer_reservations r WHERE r.quant_id = q.id AND r.picking_id = :id AND r.state = 'Reserved'", expect_changed: true, status: 409, code: INVENTORY_TRANSFER_RESERVATION_FAILED, message: Stock could not be reserved. }
        - { query: "UPDATE inventory_pickings SET state = 'Ready', row_version = row_version + 1 WHERE id = :id AND state IN ('Waiting', 'Draft') AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before availability could be checked. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, COALESCE(NULLIF(:current_user_name, ''), 'Admin User'), 'inventory.transfer.availability_checked', 'Availability checked', 'Reserved available quantities for this transfer')" }
      result: { query: "SELECT * FROM inventory_pickings WHERE id = :id" }
  - id: validate_inventory_transfer
    type: server
    permission: inventory.write
    action: inventory.pickings.validate
    handler: yaml_mutation
    operation: validate
    params: { id: '{state.id}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline]
    mutation:
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state = 'Ready' AND row_version = :expected_row_version", status: 409, message: Only ready transfers can be validated }
        - { query: "SELECT p.id FROM inventory_pickings p JOIN inventory_picking_moves m ON m.picking_id = p.id WHERE p.id = :id AND m.quantity > 0 AND m.done_quantity <= m.quantity", status: 422, message: A transfer needs at least one valid move line }
      generated: [message_id]
      steps:
        - { query: "UPDATE inventory_picking_moves SET done_quantity = quantity WHERE picking_id = :id" }
        - { query: "UPDATE inventory_pickings SET state = 'Done', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version" }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.validated', 'Validated', 'Transfer validated')" }
      result: { query: "SELECT * FROM inventory_pickings WHERE id = :id" }
  - id: unreserve_inventory_transfer
    type: server
    permission: inventory.write
    action: inventory.pickings.unreserve
    handler: yaml_mutation
    operation: unreserve
    params: { id: '{state.id}', expected_row_version: '{state.inventory_transfer_detail.row_version}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: INVENTORY_TRANSFER_COMPANY_SCOPE_REQUIRED, message: Transfer is outside the current company scope. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state = 'Ready' AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_UNRESERVE_NOT_ALLOWED, message: Only a current ready transfer can be unreserved. }
      steps:
        - { query: "UPDATE inventory_quants q SET reserved_quantity = GREATEST(0, q.reserved_quantity - r.quantity), row_version = q.row_version + 1, updated_at = TIMESTAMP '2026-01-15 08:00:00' FROM inventory_transfer_reservations r WHERE r.quant_id = q.id AND r.picking_id = :id AND r.state = 'Reserved'" }
        - { query: "DELETE FROM inventory_transfer_reservations WHERE picking_id = :id AND state = 'Reserved'" }
        - { query: "UPDATE inventory_pickings SET state = 'Waiting', row_version = row_version + 1 WHERE id = :id AND state = 'Ready' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before it could be unreserved. Reload it before retrying. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.unreserved', 'Unreserved', 'Transfer reservations released')" }
      result: { query: "SELECT * FROM inventory_pickings WHERE id = :id" }
  - id: cancel_inventory_transfer
    type: server
    permission: inventory.write
    action: inventory.pickings.cancel
    handler: yaml_mutation
    operation: cancel
    params: { id: '{state.id}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline]
    mutation:
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state IN ('Draft', 'Waiting', 'Ready') AND row_version = :expected_row_version", status: 409, message: Only open transfers can be cancelled }
      steps:
        - { query: "UPDATE inventory_pickings SET state = 'Cancelled', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version" }
      result: { query: "SELECT * FROM inventory_pickings WHERE id = :id" }
  - id: send_inventory_transfer_message
    type: server_form
    permission: inventory.write
    title: Send message
    action: inventory.pickings.message
    handler: yaml_mutation
    operation: message
    params: { id: '{state.id}' }
    refresh: [inventory_transfer_timeline]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE length(trim(:content)) BETWEEN 1 AND 4000", status: 422, message: Message content must be between 1 and 4000 characters }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, message: Transfer not found }
      steps:
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.message', 'Message', :content)" }
  - id: log_inventory_transfer_note
    type: server_form
    permission: inventory.write
    title: Log note
    action: inventory.pickings.note
    handler: yaml_mutation
    operation: note
    params: { id: '{state.id}' }
    refresh: [inventory_transfer_timeline]
    fields: [{ field: content, label: Note, type: textarea, required: true }]
    mutation:
      generated: [message_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE length(trim(:content)) BETWEEN 1 AND 4000", status: 422, message: Note content must be between 1 and 4000 characters }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, message: Transfer not found }
      steps:
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.note', 'Note', :content)" }
