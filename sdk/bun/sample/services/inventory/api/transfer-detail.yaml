        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state <> 'Cancelled' AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_LOCK_NOT_ALLOWED, message: Cancelled transfers cannot be locked or unlocked, or the transfer is stale. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND length(trim(COALESCE(:current_user_name, ''))) > 0", status: 403, code: INVENTORY_TRANSFER_ACTOR_REQUIRED, message: A signed-in inventory manager is required to lock or unlock a transfer. }
