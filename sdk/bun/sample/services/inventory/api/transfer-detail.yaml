        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND length(trim(COALESCE(:current_user_name, ''))) > 0", status: 403, code: INVENTORY_TRANSFER_PRINT_ACTOR_REQUIRED, message: A signed-in inventory operator is required to print the transfer. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM inventory_picking_moves WHERE picking_id = :id AND quantity > 0)", status: 422, code: INVENTORY_TRANSFER_PRINT_NO_LINES, message: Add a move line before printing this transfer. }
      steps:
        - { query: "INSERT INTO inventory_transfer_print_runs(id, picking_id, company_name, report_name, report_action, output_format, printed_by, printed_at, row_version) SELECT :print_run_id, p.id, p.company_name, 'Picking Operations', 'stock.action_report_picking', 'PDF', :current_user_name, TIMESTAMP '2026-01-15 08:00:00', 1 FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version", expect_changed: true, status: 409, code: INVENTORY_TRANSFER_PRINT_FAILED, message: Picking Operations could not be prepared. }
        - { query: "UPDATE inventory_pickings SET printed = TRUE, row_version = row_version + 1 WHERE id = :id AND company_name = :current_company_name AND state = 'Ready' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before Picking Operations could be prepared. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.printed', 'Print prepared', 'Picking Operations report prepared as PDF')" }
      result: { query: "SELECT r.id, r.picking_id, r.company_name, r.report_name, r.report_action, r.output_format, r.printed_by, r.row_version FROM inventory_transfer_print_runs r WHERE r.id = :print_run_id" }
