  - id: print_inventory_transfer_labels
    type: server_form
    permission: inventory.write
    title: Print Labels
    action: stock.picking.action_print_labels
    handler: yaml_mutation
    operation: print_labels
    params: { id: '{state.inventory_transfer_detail.id}', expected_row_version: '{state.inventory_transfer_detail.row_version}' }
    refresh: [inventory_transfer_detail, inventory_transfer_timeline, inventory_transfer_label_runs]
    success_message: Product labels prepared for printing.
    mutation:
      generated: [label_run_id, message_id]
      concurrency: { required: true }
      before_steps:
        - assign: true
          query: "SELECT 'transfer-labels-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS label_run_id, 'label-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM inventory_transfer_label_runs WHERE picking_id = :id"
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND company_name = :current_company_name", status: 403, code: INVENTORY_TRANSFER_COMPANY_SCOPE_REQUIRED, message: Transfer is outside the current company scope. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state <> 'Cancelled' AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_LABELS_NOT_ALLOWED, message: Only a current non-cancelled transfer can print labels. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND length(trim(COALESCE(:current_user_name, ''))) > 0", status: 403, code: INVENTORY_TRANSFER_ACTOR_REQUIRED, message: A signed-in inventory operator is required to print labels. }
        - { query: "SELECT 1 AS ok WHERE CAST(:label_type AS VARCHAR) IN ('products', 'lots')", status: 422, code: INVENTORY_TRANSFER_LABEL_TYPE_UNSUPPORTED, message: Choose Product Labels or Lot/SN Labels. }
        - { query: "SELECT 1 AS ok WHERE (CAST(:label_type AS VARCHAR) = 'products' AND CAST(:output_format AS VARCHAR) = 'PDF') OR (CAST(:label_type AS VARCHAR) = 'lots' AND CAST(:label_quantity AS VARCHAR) IN ('lots', 'units') AND CAST(:print_format AS VARCHAR) IN ('4x12', 'zpl'))", status: 422, code: INVENTORY_TRANSFER_LABEL_FORMAT_UNSUPPORTED, message: Product Labels use PDF; Lot/SN Labels use 4 x 12 or ZPL with a valid quantity mode. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM inventory_picking_moves WHERE picking_id = :id AND quantity > 0)", status: 422, code: INVENTORY_TRANSFER_LABELS_NO_LINES, message: Add a positive move quantity before printing labels. }
        - { query: "SELECT 1 AS ok WHERE CAST(:label_type AS VARCHAR) <> 'lots' OR EXISTS (SELECT 1 FROM inventory_transfer_label_lot_lines WHERE picking_id = :id AND company_name = :current_company_name AND quantity > 0)", status: 422, code: INVENTORY_TRANSFER_LOT_LABELS_NO_LOTS, message: Add a tracked lot or serial move line before printing Lot/SN Labels. }
      steps:
        - { query: "INSERT INTO inventory_transfer_label_runs(id, picking_id, company_name, label_type, output_format, label_count, requested_by, created_at, row_version) SELECT :label_run_id, p.id, p.company_name, :label_type, CASE WHEN :label_type = 'lots' THEN UPPER(CAST(:print_format AS VARCHAR)) ELSE CAST(:output_format AS VARCHAR) END, CASE WHEN :label_type = 'lots' AND :label_quantity = 'units' THEN (SELECT SUM(l.quantity) FROM inventory_transfer_label_lot_lines l WHERE l.picking_id = p.id AND l.company_name = p.company_name AND l.quantity > 0) WHEN :label_type = 'lots' THEN (SELECT COUNT(DISTINCT l.lot_id) FROM inventory_transfer_label_lot_lines l WHERE l.picking_id = p.id AND l.company_name = p.company_name AND l.quantity > 0) ELSE (SELECT SUM(m.quantity) FROM inventory_picking_moves m WHERE m.picking_id = p.id) END, :current_user_name, TIMESTAMP '2026-01-15 08:00:00', 1 FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version", expect_changed: true, status: 409, code: INVENTORY_TRANSFER_LABELS_FAILED, message: Labels could not be prepared. }
        - { query: "UPDATE inventory_pickings SET row_version = row_version + 1 WHERE id = :id AND company_name = :current_company_name AND state <> 'Cancelled' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before labels could be prepared. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.labels_printed', 'Labels prepared', CASE WHEN :label_type = 'lots' THEN 'Lot/SN labels prepared for printing' ELSE 'Product labels prepared for printing' END)" }
      result: { query: "SELECT r.id, r.picking_id, r.company_name, r.label_type, r.output_format, r.label_count, r.requested_by, r.row_version FROM inventory_transfer_label_runs r WHERE r.id = :label_run_id" }
    fields:
      - { field: label_type, label: Labels to print, type: select, options: [{ value: products, label: Product Labels }, { value: lots, label: Lot/SN Labels }], default: products, required: true }
      - { field: output_format, label: Output, type: select, options: [{ value: PDF, label: PDF }], default: PDF, required: true }
      - { field: label_quantity, label: Quantity to print, type: select, options: [{ value: lots, label: One per lot/SN }, { value: units, label: One per unit }], default: lots, required: true }
      - { field: print_format, label: Format, type: select, options: [{ value: 4x12, label: 4 x 12 }, { value: zpl, label: ZPL Labels }], default: 4x12, required: true }
  - id: print_inventory_transfer_operations
