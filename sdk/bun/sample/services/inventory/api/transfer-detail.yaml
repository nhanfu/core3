          query: "SELECT 'return-all-' || :id || '-' || CAST((SELECT COUNT(*) + 1 FROM inventory_transfer_returns WHERE source_picking_id = :id) AS VARCHAR) AS return_id, 'return-all-run-' || :id || '-' || CAST((SELECT COUNT(*) + 1 FROM inventory_transfer_returns WHERE source_picking_id = :id) AS VARCHAR) AS return_run_id, 'return-all-message-' || :id || '-' || CAST((SELECT COUNT(*) + 1 FROM inventory_transfer_returns WHERE source_picking_id = :id) AS VARCHAR) AS message_id, COALESCE(SUM(m.done_quantity), 0) AS return_quantity FROM inventory_picking_moves m WHERE m.picking_id = :id AND m.done_quantity > 0"
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND company_name = :current_company_name", status: 403, code: INVENTORY_TRANSFER_COMPANY_SCOPE_REQUIRED, message: Transfer is outside the current company scope. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state = 'Done' AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_RETURN_ALL_NOT_ALLOWED, message: Only a current completed transfer can return all products. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND length(trim(COALESCE(:current_user_name, ''))) > 0", status: 403, code: INVENTORY_TRANSFER_ACTOR_REQUIRED, message: A signed-in inventory operator is required to return all products. }
        - { query: "SELECT 1 AS ok FROM inventory_picking_moves WHERE picking_id = :id AND done_quantity > 0 GROUP BY picking_id HAVING COUNT(*) >= 2", status: 422, code: INVENTORY_TRANSFER_RETURN_ALL_LINES_REQUIRED, message: Return All requires at least two completed move lines. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_transfer_returns WHERE source_picking_id = :id)", status: 409, code: INVENTORY_TRANSFER_RETURN_ALL_ALREADY_RETURNED, message: This transfer already has a return. Use the remaining-line return workflow. }
      steps:
        - { query: "INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state) SELECT :return_id, 'operation-receipts', 'RET/' || p.name || '/' || :return_id, p.contact_name, p.scheduled_date, 'Return of ' || p.name, p.company_name, p.destination_location_id, p.source_location_id, 'Waiting' FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity) SELECT :return_id || '-move-' || m.id, :return_id, m.product_name, m.done_quantity, 0 FROM inventory_picking_moves m WHERE m.picking_id = :id AND m.done_quantity > 0" }
        - { query: "INSERT INTO inventory_transfer_return_lines(id, return_run_id, source_picking_id, source_move_id, return_move_id, product_name, return_quantity, company_name) SELECT :return_run_id || '-' || m.id, :return_run_id, :id, m.id, :return_id || '-move-' || m.id, m.product_name, m.done_quantity, p.company_name FROM inventory_picking_moves m JOIN inventory_pickings p ON p.id = :id WHERE m.picking_id = :id AND m.done_quantity > 0" }
        - { query: "INSERT INTO inventory_transfer_returns(id, source_picking_id, return_picking_id, company_name, return_quantity, returned_by, reason, state) SELECT :return_run_id, p.id, :return_id, p.company_name, :return_quantity, :current_user_name, COALESCE(:reason, ''), 'Waiting' FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "UPDATE inventory_pickings SET row_version = row_version + 1 WHERE id = :id AND state = 'Done' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before Return All could be created. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.return_all_created', 'Return All created', 'Return All transfer ' || :return_id || ' created')" }
      result: { query: "SELECT r.id, r.source_picking_id, r.return_picking_id, rp.name AS return_name, r.return_quantity, r.company_name, r.returned_by, r.reason, r.state, r.row_version FROM inventory_transfer_returns r JOIN inventory_pickings rp ON rp.id = r.return_picking_id WHERE r.id = :return_run_id" }
    fields:
      - { field: reason, label: Reason, type: textarea, placeholder: 'Optional return reason' }
  - id: exchange_inventory_transfer
    type: server_form
    permission: inventory.write
    title: Return for Exchange
    action: stock.picking.return.exchange
    handler: yaml_mutation
    operation: exchange
    params: { id: '{state.inventory_transfer_detail.id}', expected_row_version: '{state.inventory_transfer_detail.row_version}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline, inventory_transfer_returns, inventory_transfer_exchanges]
    mutation:
      generated: [return_id, return_move_id, exchange_id, exchange_move_id, exchange_run_id, message_id]
      concurrency: { required: true }
      before_steps:
        - assign: true
          query: "SELECT 'exchange-return-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS return_id, 'exchange-return-move-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS return_move_id, 'exchange-picking-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS exchange_id, 'exchange-move-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS exchange_move_id, 'exchange-run-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS exchange_run_id, 'exchange-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM inventory_transfer_exchanges WHERE source_picking_id = :id"
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_EXCHANGE_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND company_name = :current_company_name", status: 403, code: INVENTORY_TRANSFER_EXCHANGE_COMPANY, message: Transfer is outside the current company scope. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state = 'Done' AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_EXCHANGE_STALE, message: Only a current completed transfer can be exchanged. Reload and try again. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND length(trim(COALESCE(:current_user_name, ''))) > 0", status: 403, code: INVENTORY_TRANSFER_EXCHANGE_ACTOR_REQUIRED, message: A signed-in inventory operator is required to create an exchange. }
        - { query: "SELECT p.id FROM inventory_pickings p JOIN inventory_picking_moves m ON m.picking_id = p.id WHERE p.id = :id AND m.done_quantity > 0 GROUP BY p.id HAVING COUNT(*) = 1", status: 422, code: INVENTORY_TRANSFER_EXCHANGE_LINES_UNSUPPORTED, message: This bounded exchange flow requires exactly one completed move line. }
        - { query: "SELECT 1 AS ok WHERE CAST(:exchange_quantity AS DECIMAL(18,3)) > 0 AND CAST(:exchange_quantity AS DECIMAL(18,3)) <= (SELECT m.done_quantity FROM inventory_picking_moves m WHERE m.picking_id = :id AND m.done_quantity > 0)", status: 422, code: INVENTORY_TRANSFER_EXCHANGE_QUANTITY_INVALID, message: Exchange quantity must be greater than zero and no greater than the delivered quantity. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_transfer_exchanges WHERE source_picking_id = :id)", status: 409, code: INVENTORY_TRANSFER_EXCHANGE_ALREADY_CREATED, message: This transfer already has an exchange. }
      steps:
        - { query: "INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state) SELECT :return_id, 'operation-receipts', 'EXR/' || p.name || '/' || :return_id, p.contact_name, p.scheduled_date, 'Exchange return of ' || p.name, p.company_name, p.destination_location_id, p.source_location_id, 'Waiting' FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity) SELECT :return_move_id, :return_id, m.product_name, CAST(:exchange_quantity AS DECIMAL(18,3)), 0 FROM inventory_picking_moves m WHERE m.picking_id = :id AND m.done_quantity > 0" }
        - { query: "INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state) SELECT :exchange_id, 'operation-deliveries', 'EXC/' || p.name || '/' || :exchange_id, p.contact_name, p.scheduled_date, 'Exchange for ' || p.name, p.company_name, p.source_location_id, p.destination_location_id, 'Waiting' FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity) SELECT :exchange_move_id, :exchange_id, m.product_name, CAST(:exchange_quantity AS DECIMAL(18,3)), 0 FROM inventory_picking_moves m WHERE m.picking_id = :id AND m.done_quantity > 0" }
        - { query: "INSERT INTO inventory_transfer_exchanges(id, source_picking_id, return_picking_id, exchange_picking_id, company_name, product_name, exchange_quantity, exchanged_by, exchanged_at, reason, state) SELECT :exchange_run_id, p.id, :return_id, :exchange_id, p.company_name, m.product_name, CAST(:exchange_quantity AS DECIMAL(18,3)), :current_user_name, TIMESTAMP '2026-01-15 10:00:00', COALESCE(:reason, ''), 'Waiting' FROM inventory_pickings p JOIN inventory_picking_moves m ON m.picking_id = p.id AND m.done_quantity > 0 WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "UPDATE inventory_pickings SET row_version = row_version + 1 WHERE id = :id AND state = 'Done' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before its exchange could be created. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, 'inventory.transfer.exchange_created', 'Exchange created', 'Return and replacement transfer ' || :exchange_id || ' created')" }
      result: { query: "SELECT e.id, e.source_picking_id, e.return_picking_id, rp.name AS return_name, e.exchange_picking_id, ep.name AS exchange_name, e.product_name, e.exchange_quantity, e.company_name, e.exchanged_by, e.reason, e.state, e.row_version FROM inventory_transfer_exchanges e JOIN inventory_pickings rp ON rp.id = e.return_picking_id JOIN inventory_pickings ep ON ep.id = e.exchange_picking_id WHERE e.id = :exchange_run_id" }
    fields:
      - { field: exchange_quantity, label: Exchange Quantity, type: number, required: true, min: 0.001 }
      - { field: reason, label: Reason, type: textarea, placeholder: 'Optional exchange reason' }
  - id: create_inventory_backorder
    type: server_form
    permission: inventory.write
    title: Backorder confirmation
    action: stock.backorder.confirmation.process
    handler: yaml_mutation
    operation: backorder
    params: { id: '{state.inventory_transfer_detail.id}', expected_row_version: '{state.inventory_transfer_detail.row_version}' }
    refresh: [inventory_transfer_detail, inventory_transfer_lines, inventory_transfer_timeline, inventory_transfer_backorders]
    mutation:
      generated: [backorder_id, backorder_move_id, backorder_run_id, message_id]
      concurrency: { required: true }
      before_steps:
        - assign: true
          query: "SELECT 'backorder-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS backorder_id, 'backorder-move-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS backorder_move_id, 'backorder-run-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS backorder_run_id, 'backorder-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM inventory_transfer_backorders WHERE source_picking_id = :id"
      guards:
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id", status: 404, code: INVENTORY_TRANSFER_NOT_FOUND, message: Transfer not found. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND company_name = :current_company_name", status: 403, code: INVENTORY_TRANSFER_COMPANY_SCOPE_REQUIRED, message: Transfer is outside the current company scope. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND state = 'Ready' AND row_version = :expected_row_version", status: 409, code: INVENTORY_TRANSFER_BACKORDER_NOT_ALLOWED, message: Only a current ready transfer can be confirmed for backorder. }
        - { query: "SELECT id FROM inventory_pickings WHERE id = :id AND length(trim(COALESCE(:current_user_name, ''))) > 0", status: 403, code: INVENTORY_TRANSFER_ACTOR_REQUIRED, message: A signed-in inventory operator is required to confirm a backorder. }
        - { query: "SELECT p.id FROM inventory_pickings p JOIN inventory_picking_moves m ON m.picking_id = p.id WHERE p.id = :id AND m.done_quantity > 0 AND m.done_quantity < m.quantity GROUP BY p.id HAVING COUNT(*) = 1", status: 422, code: INVENTORY_TRANSFER_BACKORDER_LINES_UNSUPPORTED, message: This bounded backorder flow requires exactly one partially completed move line. }
        - { query: "SELECT 1 AS ok WHERE CAST(:decision AS VARCHAR) IN ('create', 'none')", status: 422, code: INVENTORY_TRANSFER_BACKORDER_DECISION_INVALID, message: Choose Create Backorder or No Backorder. }
      steps:
        - { query: "INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state, backorder_of_id) SELECT :backorder_id, p.operation_type_id, 'BACKORDER/' || p.name || '/' || :backorder_id, p.contact_name, p.scheduled_date, p.source_document, p.company_name, p.source_location_id, p.destination_location_id, 'Waiting', p.id FROM inventory_pickings p WHERE :decision = 'create' AND p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity) SELECT :backorder_move_id, :backorder_id, m.product_name, m.quantity - m.done_quantity, 0 FROM inventory_picking_moves m WHERE :decision = 'create' AND m.picking_id = :id AND m.done_quantity > 0 AND m.done_quantity < m.quantity" }
        - { query: "INSERT INTO inventory_transfer_backorders(id, source_picking_id, backorder_picking_id, company_name, decision, processed_by, state) SELECT :backorder_run_id, p.id, CASE WHEN :decision = 'create' THEN :backorder_id ELSE NULL END, p.company_name, :decision, :current_user_name, CASE WHEN :decision = 'create' THEN 'Created' ELSE 'Skipped' END FROM inventory_pickings p WHERE p.id = :id AND p.row_version = :expected_row_version" }
        - { query: "UPDATE inventory_picking_moves SET quantity = done_quantity WHERE picking_id = :id AND done_quantity > 0 AND done_quantity < quantity" }
        - { query: "UPDATE inventory_pickings SET state = 'Done', row_version = row_version + 1 WHERE id = :id AND state = 'Ready' AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The transfer changed before its backorder could be confirmed. }
        - { query: "INSERT INTO inventory_transfer_messages(id, picking_id, actor_name, action, action_label, detail) VALUES(:message_id, :id, :current_user_name, CASE WHEN :decision = 'create' THEN 'inventory.transfer.backorder_created' ELSE 'inventory.transfer.backorder_skipped' END, CASE WHEN :decision = 'create' THEN 'Backorder created' ELSE 'No backorder' END, CASE WHEN :decision = 'create' THEN 'Backorder transfer ' || :backorder_id || ' created' ELSE 'Transfer validated without a backorder' END)" }
      result: { query: "SELECT b.id, b.source_picking_id, b.backorder_picking_id, bp.name AS backorder_name, b.company_name, b.decision, b.processed_by, b.state, b.row_version FROM inventory_transfer_backorders b LEFT JOIN inventory_pickings bp ON bp.id = b.backorder_picking_id WHERE b.id = :backorder_run_id" }
    fields:
      - { field: decision, label: Backorder decision, type: select, required: true, options: [{ value: create, label: Create Backorder }, { value: none, label: No Backorder }], default: create }
  - id: toggle_inventory_transfer_lock
