page: { id: reordering-rule-detail }
datasources:
  - id: inventory_reordering_rule_detail
    single: true
    permission: inventory.read
    error_states:
      missing_record: { status: 404, code: INVENTORY_REORDERING_RULE_NOT_FOUND, message: Reordering rule not found in the current company. }
      transport_error: { status: 503, code: INVENTORY_REORDERING_RULE_DETAIL_UNAVAILABLE, message: Reordering rule details are temporarily unavailable. }
    query: |
      SELECT o.id, o.row_version, o.rule_name, o.product_id, o.product_name, o.category_name,
        o.location_name, o.warehouse_name, CAST(o.on_hand AS DOUBLE) AS on_hand,
        CAST(o.forecast AS DOUBLE) AS forecast, CAST(o.min_qty AS DOUBLE) AS min_qty,
        CAST(o.max_qty AS DOUBLE) AS max_qty, CAST(o.to_order AS DOUBLE) AS to_order,
        o.unit_name, o.trigger, o.active, o.route, o.state, o.company_name, o.lead_days,
        (SELECT COUNT(*) FROM inventory_replenishment_info_demand d WHERE d.orderpoint_id = o.id) AS demand_count,
        (SELECT COUNT(*) FROM inventory_replenishment_info_runs r WHERE r.orderpoint_id = o.id) AS replenishment_info_count
      FROM inventory_orderpoints o
      WHERE o.id = :id
        AND (COALESCE(:current_company_name, '') = ''
          OR o.company_name = :current_company_name
          OR (:current_company_name = 'Core3 Demo Company' AND o.company_name = 'My Company (San Francisco)'))
  - id: inventory_reordering_rule_detail_products
    single: false
    permission: inventory.read
    query: "SELECT DISTINCT product_name AS value, product_name AS label FROM inventory_stock_report WHERE active = TRUE ORDER BY product_name"
  - id: inventory_reordering_rule_detail_locations
    single: false
    permission: inventory.read
    query: "SELECT DISTINCT CASE WHEN l.parent_location_id IS NULL THEN w.code || '/' || l.name ELSE w.code || '/Stock/' || l.name END AS value, CASE WHEN l.parent_location_id IS NULL THEN w.code || '/' || l.name ELSE w.code || '/Stock/' || l.name END AS label FROM inventory_locations l JOIN inventory_warehouses w ON w.id = l.warehouse_id WHERE l.active = TRUE AND l.usage IN ('Internal', 'View') ORDER BY label"
  - id: inventory_reordering_rule_detail_warehouses
    single: false
    permission: inventory.read
    query: "SELECT code AS value, code AS label FROM inventory_warehouses WHERE state = 'Active' ORDER BY code"
actions:
  - id: back_to_inventory_reordering_rules
    type: navigate
    permission: inventory.read
    navigate_to: /reordering-rules
  - id: edit_inventory_reordering_rule
    type: server_form
    permission: inventory.manage
    title: Edit Reordering Rule
    action: inventory.reordering_rules.update
    handler: yaml_mutation
    operation: update
    prefill: state.inventory_reordering_rule_detail
    refresh: [inventory_reordering_rule_detail, inventory_reordering_rules]
    success_message: Reordering rule saved.
    mutation:
      operation: update
      table: inventory_orderpoints
      fields: [product_id, product_name, category_name, location_name, warehouse_name, min_qty, max_qty, route, trigger]
      required: [product_name, location_name, warehouse_name, min_qty, max_qty]
      concurrency: { required: true }
      before_steps:
        - query: "SELECT r.id AS product_id, r.category_name, r.unit_name FROM inventory_stock_report r WHERE r.product_name = :product_name AND r.active = TRUE LIMIT 1"
          assign: true
      guards:
        - { query: "SELECT id FROM inventory_orderpoints WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name OR (:current_company_name = 'Core3 Demo Company' AND company_name = 'My Company (San Francisco)'))", status: 404, code: INVENTORY_REORDERING_RULE_NOT_FOUND, message: Reordering rule not found in the current company. }
        - { query: "SELECT r.id AS product_id, r.category_name, r.unit_name FROM inventory_stock_report r WHERE r.product_name = :product_name AND r.active = TRUE", status: 422, code: INVENTORY_REORDERING_RULE_PRODUCT_INVALID, message: Select an active storable product., assign: true }
        - { query: "SELECT l.id FROM inventory_locations l JOIN inventory_warehouses w ON w.id = l.warehouse_id WHERE l.active = TRUE AND l.usage IN ('Internal', 'View') AND (w.code || '/' || l.name = :location_name OR w.code || '/Stock/' || l.name = :location_name)", status: 422, code: INVENTORY_REORDERING_RULE_LOCATION_INVALID, message: Select an active internal or virtual location. }
        - { query: "SELECT id FROM inventory_warehouses WHERE code = :warehouse_name AND state = 'Active'", status: 422, code: INVENTORY_REORDERING_RULE_WAREHOUSE_INVALID, message: Select an active warehouse. }
        - { query: "SELECT 1 AS ok WHERE CAST(:min_qty AS DECIMAL(18,3)) >= 0 AND CAST(:max_qty AS DECIMAL(18,3)) >= CAST(:min_qty AS DECIMAL(18,3)) AND :trigger IN ('auto', 'manual') AND :route IN ('Buy', 'Manufacture', 'MTO')", status: 422, code: INVENTORY_REORDERING_RULE_FIELDS_INVALID, message: Enter valid quantities, trigger, and route. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_orderpoints WHERE product_name = :product_name AND location_name = :location_name AND company_name = (SELECT company_name FROM inventory_orderpoints WHERE id = :id) AND id <> :id)", status: 409, code: INVENTORY_REORDERING_RULE_EXISTS, message: A reordering rule already exists for this product and location. }
      result: { query: "SELECT * FROM inventory_orderpoints WHERE id = :id" }
    fields:
      - { field: product_name, label: Product, type: select, options_source: inventory_reordering_rule_products, required: true }
      - { field: location_name, label: Location, type: select, options_source: inventory_reordering_rule_locations, required: true }
      - { field: warehouse_name, label: Warehouse, type: select, options_source: inventory_reordering_rule_warehouses, required: true }
      - { field: min_qty, label: Minimum Quantity, type: number, required: true, min: 0 }
      - { field: max_qty, label: Maximum Quantity, type: number, required: true, min: 0 }
      - { field: trigger, label: Trigger, type: select, options: [{ value: auto, label: Automatic }, { value: manual, label: Manual }] }
      - { field: route, label: Route, type: select, options: [{ value: Buy, label: Buy }, { value: Manufacture, label: Manufacture }, { value: MTO, label: Make To Order }] }
  - id: archive_inventory_reordering_rule
    type: server
    permission: inventory.manage
    action: inventory.reordering_rules.archive
    handler: yaml_mutation
    operation: update
    params: { values: { active: false } }
    refresh: [inventory_reordering_rule_detail, inventory_reordering_rules]
    mutation:
      operation: update
      table: inventory_orderpoints
      fields: [active]
      defaults: { active: false }
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM inventory_orderpoints WHERE id = :id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name OR (:current_company_name = 'Core3 Demo Company' AND company_name = 'My Company (San Francisco)'))", status: 404, code: INVENTORY_REORDERING_RULE_NOT_FOUND, message: Active reordering rule not found. }]
      result: { query: "SELECT * FROM inventory_orderpoints WHERE id = :id" }
  - id: restore_inventory_reordering_rule
    type: server
    permission: inventory.manage
    action: inventory.reordering_rules.restore
    handler: yaml_mutation
    operation: update
    params: { values: { active: true } }
    refresh: [inventory_reordering_rule_detail, inventory_reordering_rules]
    mutation:
      operation: update
      table: inventory_orderpoints
      fields: [active]
      defaults: { active: true }
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM inventory_orderpoints WHERE id = :id AND active = FALSE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name OR (:current_company_name = 'Core3 Demo Company' AND company_name = 'My Company (San Francisco)'))", status: 404, code: INVENTORY_REORDERING_RULE_NOT_FOUND, message: Archived reordering rule not found. }]
      result: { query: "SELECT * FROM inventory_orderpoints WHERE id = :id" }
  - id: delete_inventory_reordering_rule
    type: server
    permission: inventory.manage
    action: inventory.reordering_rules.delete
    handler: yaml_mutation
    operation: delete
    refresh: [inventory_reordering_rules]
    mutation:
      operation: delete
      table: inventory_orderpoints
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM inventory_orderpoints WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name OR (:current_company_name = 'Core3 Demo Company' AND company_name = 'My Company (San Francisco)'))", status: 404, code: INVENTORY_REORDERING_RULE_NOT_FOUND, message: Reordering rule not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_replenishment_info_demand WHERE orderpoint_id = :id) AND NOT EXISTS (SELECT 1 FROM inventory_replenishment_info_runs WHERE orderpoint_id = :id)", status: 409, code: INVENTORY_REORDERING_RULE_IN_USE, message: This reordering rule has replenishment history and must be archived instead. }
