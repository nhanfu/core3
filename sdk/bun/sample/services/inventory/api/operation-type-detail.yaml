page: { id: operation-type-detail }
datasources:
  - id: inventory_operation_type_detail
    single: true
    permission: inventory.manage
    error_states: { transport_error: { status: 503, code: INVENTORY_OPERATION_TYPE_DETAIL_UNAVAILABLE, message: Operation type details are temporarily unavailable. } }
    query: "SELECT p.id, p.row_version, p.name, p.code, p.sequence_number, p.company_name, p.active, p.warehouse_id, COALESCE(w.name, '') AS warehouse_name, p.operation_kind, p.sequence_code, p.reservation_method, p.create_backorder, p.move_type, p.use_create_lots, p.use_existing_lots, p.set_package_type, COALESCE(src.name, '') AS default_location_src_name, COALESCE(dest.name, '') AS default_location_dest_name, p.auto_print_delivery_slip, p.auto_print_return_slip FROM inventory_operation_types p LEFT JOIN inventory_warehouses w ON w.id = p.warehouse_id LEFT JOIN inventory_locations src ON src.id = p.default_location_src_id LEFT JOIN inventory_locations dest ON dest.id = p.default_location_dest_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND p.id = :id"
actions:
  - id: back_to_inventory_operation_types
    type: navigate
    permission: inventory.manage
    navigate_to: /operation-types
  - id: edit_inventory_operation_type
    type: server_form
    permission: inventory.manage
    title: Edit operation type
    action: inventory.operation_types.update
    handler: yaml_mutation
    operation: update
    prefill: state.inventory_operation_type_detail
    refresh: [inventory_operation_types, inventory_operation_type_detail]
    mutation: { operation: update, table: inventory_operation_types, fields: [name, code, sequence_number, company_name, sequence_code, reservation_method, create_backorder, move_type, use_create_lots, use_existing_lots, set_package_type, auto_print_delivery_slip, auto_print_return_slip], required: [name, code], concurrency: { required: true }, guards: [{ query: "SELECT id FROM inventory_operation_types WHERE id = :id", status: 404, code: INVENTORY_OPERATION_TYPE_NOT_FOUND, message: Operation type not found. }, { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:code AS VARCHAR))) > 0", status: 422, code: INVENTORY_OPERATION_TYPE_FIELDS_REQUIRED, message: Operation type name and code are required. }, { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_operation_types WHERE LOWER(code) = LOWER(TRIM(CAST(:code AS VARCHAR))) AND id <> :id)", status: 409, code: INVENTORY_OPERATION_TYPE_CODE_EXISTS, message: An operation type with this code already exists. }], result: { query: "SELECT * FROM inventory_operation_types WHERE id = :id" } }
    fields: [{ field: name, label: Operation Type, type: text, required: true }, { field: code, label: Type of Operation, type: text, required: true }]
  - id: archive_inventory_operation_type
    type: server
    permission: inventory.manage
    action: inventory.operation_types.archive
    handler: yaml_mutation
    operation: update
    refresh: [inventory_operation_types, inventory_operation_type_detail]
    mutation: { operation: update, table: inventory_operation_types, fields: [active], defaults: { active: false }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM inventory_operation_types WHERE id = :id AND active = TRUE", status: 404, code: INVENTORY_OPERATION_TYPE_NOT_FOUND, message: Active operation type not found. }, { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_pickings WHERE operation_type_id = :id AND state NOT IN ('Done', 'Cancelled'))", status: 409, code: INVENTORY_OPERATION_TYPE_HAS_OPEN_TRANSFERS, message: An operation type with open transfers cannot be archived. }], result: { query: "SELECT * FROM inventory_operation_types WHERE id = :id" } }
  - id: restore_inventory_operation_type
    type: server
    permission: inventory.manage
    action: inventory.operation_types.restore
    handler: yaml_mutation
    operation: update
    refresh: [inventory_operation_types, inventory_operation_type_detail]
    mutation: { operation: update, table: inventory_operation_types, fields: [active], defaults: { active: true }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM inventory_operation_types WHERE id = :id AND active = FALSE", status: 404, code: INVENTORY_OPERATION_TYPE_NOT_FOUND, message: Archived operation type not found. }], result: { query: "SELECT * FROM inventory_operation_types WHERE id = :id" } }
