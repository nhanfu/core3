page: { id: inventory-analysis }

datasources:
  - id: inventory_analysis_totals
    single: true
    permission: inventory.read
    error_states:
      forbidden: { status: 403, code: INVENTORY_ANALYSIS_FORBIDDEN, message: You do not have permission to view Inventory Analysis. }
      transport_error: { status: 503, code: INVENTORY_ANALYSIS_UNAVAILABLE, message: Inventory analysis is temporarily unavailable. }
    query: "SELECT COUNT(*) AS product_locations, COALESCE(SUM(quantity), 0) AS units_on_hand, COALESCE(SUM(quantity - reserved_quantity), 0) AS units_available, COALESCE(SUM(quantity * unit_cost), 0) AS stock_value FROM inventory_quants WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
  - id: inventory_analysis_locations
    single: false
    permission: inventory.read
    error_states:
      forbidden: { status: 403, code: INVENTORY_ANALYSIS_FORBIDDEN, message: You do not have permission to view Inventory Analysis. }
      transport_error: { status: 503, code: INVENTORY_ANALYSIS_UNAVAILABLE, message: Inventory analysis is temporarily unavailable. }
    query: "SELECT l.name AS category, COALESCE(SUM(q.quantity), 0) AS units FROM inventory_locations l LEFT JOIN inventory_quants q ON q.location_id = l.id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END GROUP BY l.name ORDER BY units DESC"
