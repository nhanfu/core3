page: { id: physical-inventory }
datasources:
  - id: inventory_physical_locations
    single: false
    permission: inventory.read
    query: "SELECT id AS value, name || ' (' || code || ')' AS label FROM inventory_locations WHERE state = 'Active' AND usage IN ('Internal', 'Transit') ORDER BY usage, name"
  - id: inventory_count_assignees
    single: false
    permission: inventory.read
    query: "SELECT value, label FROM (VALUES ('', 'Anyone'), ('Inventory User', 'Inventory User'), ('Mitchell Admin', 'Mitchell Admin')) AS assignees(value, label) ORDER BY CASE WHEN value = '' THEN 0 ELSE 1 END, label"
  - id: inventory_count_requests
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_COUNT_REQUESTS_UNAVAILABLE, message: Inventory count requests are temporarily unavailable. } }
    query: "SELECT r.id, r.row_version, CAST(r.inventory_date AS VARCHAR) AS inventory_date, COALESCE(r.assigned_user, 'Anyone') AS assigned_user, r.show_expected_quantity, r.requested_by, r.quant_count, CAST(r.created_at AS VARCHAR) AS created_at FROM inventory_count_requests r ORDER BY r.created_at DESC, r.id DESC"
  - id: inventory_reset_runs
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_RESETS_UNAVAILABLE, message: Inventory reset history is temporarily unavailable. } }
    query: "SELECT r.id, r.row_version, r.reset_count, r.requested_by, CAST(r.created_at AS VARCHAR) AS created_at FROM inventory_count_resets r ORDER BY r.created_at DESC, r.id DESC"
  - id: inventory_count_conflicts
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_CONFLICTS_UNAVAILABLE, message: Inventory conflicts are temporarily unavailable. } }
    query: |
      SELECT c.id, c.row_version, c.quant_id, q.product_name, q.location_id, l.name AS location_name, c.original_quantity, c.counted_quantity, CAST(q.quantity AS DOUBLE) AS current_quantity, c.company_name, c.state, COALESCE(c.decision, '') AS decision, COALESCE(c.resolved_by, '') AS resolved_by, CAST(c.resolved_at AS VARCHAR) AS resolved_at FROM inventory_count_conflicts c JOIN inventory_quants q ON q.id = c.quant_id JOIN inventory_locations l ON l.id = q.location_id WHERE (COALESCE(:current_company_name, '') = '' OR c.company_name = :current_company_name) ORDER BY c.created_at DESC, c.id
  - id: inventory_adjustment_runs
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_ADJUSTMENTS_UNAVAILABLE, message: Inventory adjustment history is temporarily unavailable. } }
    query: "SELECT id, row_version, inventory_adjustment_name, CAST(counting_date AS VARCHAR) AS counting_date, requested_by, quant_count, applied_count, CAST(created_at AS VARCHAR) AS created_at FROM inventory_adjustments ORDER BY created_at DESC, id DESC"
  - id: inventory_physical_inventory
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_PHYSICAL_DATA_UNAVAILABLE, message: Physical inventory data is temporarily unavailable. } }
    query: "SELECT q.id, q.row_version, q.product_name, COALESCE(q.lot_serial_number, '') AS lot_serial_number, CAST(q.inventory_date AS VARCHAR) AS scheduled, COALESCE(q.inventory_user, '') AS inventory_user, CAST(q.quantity AS DOUBLE) AS on_hand, CASE WHEN q.inventory_quantity_set THEN CAST(q.counted_quantity AS DOUBLE) ELSE NULL END AS counted, CASE WHEN q.inventory_quantity_set THEN CAST(q.counted_quantity - q.quantity AS DOUBLE) ELSE NULL END AS difference, COALESCE(q.unit_name, 'Units') AS unit_name, l.name AS location_name, l.usage AS location_usage, COALESCE(q.company_name, 'Core3 Demo Company') AS company_name, q.inventory_quantity_set, q.is_outdated FROM inventory_quants q JOIN inventory_locations l ON l.id = q.location_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND l.usage IN ('Internal', 'Transit') AND (:q IS NULL OR q.product_name ILIKE '%' || :q || '%' OR COALESCE(q.lot_serial_number, '') ILIKE '%' || :q || '%' OR l.name ILIKE '%' || :q || '%') AND (:count_filter IS NULL OR (:count_filter = 'my_count' AND COALESCE(q.inventory_user, '') = :current_user_name) OR (:count_filter = 'internal' AND l.usage = 'Internal') OR (:count_filter = 'transit' AND l.usage = 'Transit') OR (:count_filter = 'to_count' AND q.inventory_date <= DATE '2026-01-15') OR (:count_filter = 'to_apply' AND q.inventory_quantity_set) OR (:count_filter = 'conflicts' AND q.is_outdated) OR (:count_filter = 'negative' AND q.quantity < 0)) ORDER BY l.usage, l.name, q.product_name, q.id"
actions:
  - id: reset_inventory_counts
    type: server
    permission: inventory.manage
    action: inventory.quants.reset
    handler: yaml_mutation
    operation: reset_counts
    refresh: [inventory_physical_inventory, inventory_reset_runs]
    confirm: 'This will discard all unapplied counts for the selected quantities. Continue?'
    mutation:
      generated: [id]
      before_steps:
        - query: "SELECT 'inventory-reset-' || LPAD(CAST((SELECT COUNT(*) + 1 FROM inventory_count_resets) AS VARCHAR), 4, '0') AS id"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL", status: 400, code: INVENTORY_RESET_SELECTION_REQUIRED, message: Select at least one quantity to clear. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_quants q WHERE q.id IN :selectedIds AND (COALESCE(:current_company_name, '') = '' OR COALESCE(q.company_name, 'Core3 Demo Company') <> :current_company_name))", status: 403, code: INVENTORY_RESET_COMPANY_FORBIDDEN, message: One or more selected quantities belong to another company. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_quants q WHERE q.id IN :selectedIds AND q.location_id NOT IN (SELECT id FROM inventory_locations WHERE usage IN ('Internal', 'Transit')))", status: 409, code: INVENTORY_RESET_SELECTION_INVALID, message: One or more selected quantities are no longer available for clearing. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:expected_row_version, 0) = 0 OR (SELECT COUNT(*) FROM inventory_quants q WHERE q.id IN :selectedIds AND q.row_version = :expected_row_version) = 1", status: 409, code: INVENTORY_RESET_STALE, message: The selected quantity changed before it could be cleared. Reload and try again. }
      steps:
        - for_each:
            input: selectedIds
            as: quant_id
            steps:
              - query: "INSERT INTO inventory_count_reset_lines(reset_id, quant_id, row_version) SELECT :id, q.id, q.row_version FROM inventory_quants q WHERE q.id = :quant_id AND q.location_id IN (SELECT id FROM inventory_locations WHERE usage IN ('Internal', 'Transit')) AND (COALESCE(:current_company_name, '') = '' OR COALESCE(q.company_name, 'Core3 Demo Company') = :current_company_name) AND (COALESCE(:expected_row_version, 0) = 0 OR q.row_version = :expected_row_version)"
                expect_changed: true
                status: 409
                code: INVENTORY_RESET_STALE
                message: One or more selected quantities changed before it could be cleared.
              - query: "UPDATE inventory_quants SET counted_quantity = NULL, inventory_quantity_set = FALSE, inventory_user = NULL, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :quant_id AND row_version = (SELECT l.row_version FROM inventory_count_reset_lines l WHERE l.reset_id = :id AND l.quant_id = :quant_id)"
                expect_changed: true
                status: 409
                code: INVENTORY_RESET_STALE
                message: One or more selected quantities changed before it could be cleared.
        - query: "INSERT INTO inventory_count_resets(id, row_version, reset_count, requested_by, created_at) SELECT :id, 1, COUNT(*), COALESCE(NULLIF(:current_user_name, ''), 'Admin User'), TIMESTAMP '2026-01-15 08:00:00' FROM inventory_count_reset_lines WHERE reset_id = :id"
          expect_changed: true
          status: 409
          code: INVENTORY_RESET_EMPTY
          message: None of the selected quantities has an unapplied count to clear.
      result: { query: "SELECT id, row_version, reset_count, requested_by, CAST(created_at AS VARCHAR) AS created_at FROM inventory_count_resets WHERE id = :id" }
  - id: request_inventory_count
    type: server_form
    permission: inventory.manage
    title: Inventory Request
    action: inventory.quants.request_count
    handler: yaml_mutation
    operation: request_count
    refresh: [inventory_physical_inventory, inventory_count_requests]
    success_message: Inventory count requested.
    mutation:
      generated: [id]
      before_steps:
        - query: "SELECT 'inventory-count-request-' || LPAD(CAST((SELECT COUNT(*) + 1 FROM inventory_count_requests) AS VARCHAR), 4, '0') AS id"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:inventory_date AS DATE) IS NOT NULL", status: 422, code: INVENTORY_COUNT_REQUEST_DATE_INVALID, message: Choose a valid scheduled count date. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:user_id, '') IN ('', 'Inventory User', 'Mitchell Admin')", status: 422, code: INVENTORY_COUNT_REQUEST_USER_INVALID, message: Choose a valid inventory user. }
      steps:
        - for_each:
            input: selectedIds
            as: quant_id
            steps:
              - query: "UPDATE inventory_quants SET inventory_date = CAST(:inventory_date AS DATE), inventory_user = NULLIF(:user_id, ''), row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :quant_id AND location_id IN (SELECT id FROM inventory_locations WHERE usage IN ('Internal', 'Transit'))"
                expect_changed: true
                status: 409
                code: INVENTORY_COUNT_REQUEST_QUANT_INVALID
                message: One or more selected quantities are no longer available for counting.
              - query: "INSERT INTO inventory_count_request_lines(request_id, quant_id) VALUES (:id, :quant_id)"
        - query: "INSERT INTO inventory_count_requests(id, inventory_date, assigned_user, show_expected_quantity, requested_by, quant_count, created_at) SELECT :id, CAST(:inventory_date AS DATE), NULLIF(:user_id, ''), COALESCE(:show_expected_quantity, FALSE), COALESCE(NULLIF(:current_user_name, ''), 'Admin User'), COUNT(*), TIMESTAMP '2026-01-15 00:00:00' FROM inventory_count_request_lines WHERE request_id = :id GROUP BY request_id"
      result: { query: "SELECT id, row_version, CAST(inventory_date AS VARCHAR) AS inventory_date, COALESCE(assigned_user, 'Anyone') AS assigned_user, show_expected_quantity, requested_by, quant_count FROM inventory_count_requests WHERE id = :id" }
    fields:
      - { field: inventory_date, label: Scheduled at, type: date, default: '2026-01-15', required: true }
      - { field: user_id, label: Assign to, type: select, options_source: inventory_count_assignees, default: '' }
      - { field: show_expected_quantity, label: Show expected quantity, type: checkbox, default: false }
  - id: resolve_inventory_conflict
    type: server_form
    permission: inventory.write
    title: Resolve Inventory Conflict
    action: stock.inventory.conflict.resolve
    handler: yaml_mutation
    operation: resolve_conflict
    refresh: [inventory_physical_inventory, inventory_count_conflicts]
    mutation:
      generated: [resolution_id]
      concurrency: { required: true }
      before_steps:
        - assign: true
          query: "SELECT 'inventory-conflict-resolution-' || CAST(c.quant_id AS VARCHAR) || '-' || CAST(COUNT(r.id) + 1 AS VARCHAR) AS resolution_id, c.id AS conflict_id, c.quant_id, c.original_quantity, c.counted_quantity, q.quantity AS current_quantity, c.company_name, q.row_version AS current_row_version FROM inventory_count_conflicts c JOIN inventory_quants q ON q.id = c.quant_id LEFT JOIN inventory_count_conflict_resolutions r ON r.conflict_id = c.id WHERE c.quant_id IN :selectedIds AND c.state = 'Open' GROUP BY c.id, c.quant_id, c.original_quantity, c.counted_quantity, q.quantity, c.company_name, q.row_version"
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND CAST(:selectedIds AS VARCHAR) NOT LIKE '%,%' AND CAST(:selectedIds AS VARCHAR) NOT LIKE '[]'", status: 400, code: INVENTORY_CONFLICT_SELECTION_REQUIRED, message: Select exactly one open conflict to resolve. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:decision, '') IN ('keep_counted', 'keep_difference')", status: 422, code: INVENTORY_CONFLICT_DECISION_INVALID, message: Choose Keep Counted Quantity or Keep Difference. }
        - { query: "SELECT c.id FROM inventory_count_conflicts c WHERE c.quant_id IN :selectedIds", status: 404, code: INVENTORY_CONFLICT_NOT_FOUND, message: Inventory conflict not found. }
        - { query: "SELECT c.id FROM inventory_count_conflicts c WHERE c.quant_id IN :selectedIds AND (COALESCE(:current_company_name, '') = '' OR c.company_name = :current_company_name)", status: 403, code: INVENTORY_CONFLICT_COMPANY_FORBIDDEN, message: The conflict is outside the current company scope. }
        - { query: "SELECT c.id FROM inventory_count_conflicts c JOIN inventory_quants q ON q.id = c.quant_id WHERE c.quant_id IN :selectedIds AND c.state = 'Open' AND q.is_outdated = TRUE AND q.inventory_quantity_set = TRUE AND q.row_version = :expected_row_version", status: 409, code: INVENTORY_CONFLICT_STALE, message: The counted quantity changed before this conflict could be resolved. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_name, '')), '') IS NOT NULL", status: 403, code: INVENTORY_CONFLICT_ACTOR_REQUIRED, message: A signed-in inventory operator is required to resolve a conflict. }
      steps:
        - query: "INSERT INTO inventory_count_conflict_resolutions(id, conflict_id, quant_id, company_name, decision, resolved_by, resolved_at, row_version) VALUES(:resolution_id, :conflict_id, :quant_id, :company_name, :decision, :current_user_name, TIMESTAMP '2026-01-15 10:30:00', 1)"
          expect_changed: true
          status: 409
          code: INVENTORY_CONFLICT_RESOLUTION_FAILED
          message: The inventory conflict resolution could not be recorded.
        - query: "UPDATE inventory_quants q SET quantity = CASE WHEN :decision = 'keep_counted' THEN c.counted_quantity ELSE q.quantity END, counted_quantity = CASE WHEN :decision = 'keep_counted' THEN NULL ELSE q.quantity + (c.counted_quantity - c.original_quantity) END, inventory_quantity_set = CASE WHEN :decision = 'keep_counted' THEN FALSE ELSE TRUE END, is_outdated = FALSE, inventory_user = :current_user_name, row_version = q.row_version + 1, updated_at = TIMESTAMP '2026-01-15 10:30:00' FROM inventory_count_conflicts c WHERE c.quant_id = q.id AND c.id = :conflict_id AND c.state = 'Open' AND q.row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: INVENTORY_CONFLICT_STALE
          message: The counted quantity changed before this conflict could be resolved.
        - query: "UPDATE inventory_count_conflicts SET state = 'Resolved', decision = :decision, resolved_by = :current_user_name, resolved_at = TIMESTAMP '2026-01-15 10:30:00', row_version = row_version + 1 WHERE id = :conflict_id AND state = 'Open'"
          expect_changed: true
          status: 409
          code: INVENTORY_CONFLICT_STALE
          message: The conflict changed before it could be resolved.
      result: { query: "SELECT r.id, r.conflict_id, r.quant_id, r.company_name, r.decision, r.resolved_by, CAST(r.resolved_at AS VARCHAR) AS resolved_at, r.row_version FROM inventory_count_conflict_resolutions r WHERE r.id = :resolution_id" }
    fields:
      - { field: decision, label: Resolution, type: select, options: [{ value: keep_counted, label: Keep Counted Quantity }, { value: keep_difference, label: Keep Difference }], required: true }
  - id: create_inventory_quant
    type: server_form
    permission: inventory.write
    title: New inventory quantity
    action: inventory.quants.create
    handler: yaml_mutation
    operation: create
    refresh: [inventory_physical_inventory]
    success_message: Inventory quantity created.
    mutation:
      operation: insert
      table: inventory_quants
      fields: [product_id, product_name, location_id, quantity, unit_name, lot_serial_number, inventory_date, inventory_quantity_set, is_outdated, company_name]
      required: [product_id, product_name, location_id, quantity]
      defaults: { unit_name: Units, inventory_date: '2026-01-15', inventory_quantity_set: false, is_outdated: false, company_name: Core3 Demo Company, reserved_quantity: 0, unit_cost: 0 }
      guards:
        - { query: "SELECT 1 AS ok FROM inventory_locations WHERE id = :location_id AND usage IN ('Internal', 'Transit') AND state = 'Active'", status: 422, code: INVENTORY_LOCATION_NOT_ALLOWED, message: Physical inventory is limited to active internal or transit locations. }
        - { query: "SELECT 1 AS ok WHERE CAST(:quantity AS DECIMAL(18,3)) >= 0", status: 422, code: INVENTORY_QUANTITY_INVALID, message: Quantity must be zero or greater. }
      result: { query: "SELECT * FROM inventory_quants WHERE id = :id" }
    fields:
      - { field: product_id, label: Product ID, type: text, required: true }
      - { field: product_name, label: Product, type: text, required: true }
      - { field: location_id, label: Location, type: select, options_source: inventory_physical_locations, required: true }
      - { field: quantity, label: On Hand, type: number, min: 0, required: true }
      - { field: lot_serial_number, label: Lot/Serial Number, type: text }
      - { field: unit_name, label: Unit, type: text, default: Units }
  - id: apply_all_inventory_quantities
    type: server_form
    permission: inventory.write
    title: Inventory Adjustment
    action: inventory.quants.apply_all
    handler: yaml_mutation
    operation: apply_all
    refresh: [inventory_physical_inventory, inventory_adjustment_runs]
    success_message: Inventory quantities applied.
    fields:
      - { field: inventory_adjustment_name, label: Inventory Reason, type: text, default: Physical Inventory, required: true }
      - { field: counting_date, label: Counting Date, type: date, default: '2026-01-15', required: true }
    mutation:
      operation: insert
      table: inventory_adjustments
      generated: [id]
      fields: [inventory_adjustment_name, counting_date, requested_by, quant_count, applied_count]
      defaults: { requested_by: Admin User, quant_count: 0, applied_count: 0, created_at: '2026-01-15 00:00:00', row_version: 1 }
      before_steps:
        - query: "SELECT 'inventory-adjustment-' || LPAD(CAST((SELECT COUNT(*) + 1 FROM inventory_adjustments) AS VARCHAR), 6, '0') AS id, COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AS requested_by, COUNT(*) FILTER (WHERE q.inventory_quantity_set AND q.counted_quantity IS NOT NULL) AS quant_count, COUNT(*) FILTER (WHERE q.inventory_quantity_set AND q.counted_quantity IS NOT NULL AND q.counted_quantity <> q.quantity) AS applied_count FROM inventory_quants q JOIN inventory_locations l ON l.id = q.location_id WHERE l.usage IN ('Internal', 'Transit')"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:inventory_adjustment_name AS VARCHAR))) BETWEEN 1 AND 120 AND TRY_CAST(:counting_date AS DATE) IS NOT NULL", status: 422, code: INVENTORY_ADJUSTMENT_INVALID, message: Enter an inventory reason and a valid counting date. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM inventory_quants q JOIN inventory_locations l ON l.id = q.location_id WHERE l.usage IN ('Internal', 'Transit') AND q.inventory_quantity_set AND q.counted_quantity IS NOT NULL)", status: 409, code: INVENTORY_ADJUSTMENT_EMPTY, message: Count at least one quantity before applying the inventory adjustment. }
      steps:
        - query: "INSERT INTO inventory_move_lines(id,date,reference,product_id,product_name,product_category_name,lot_serial_number,source_package,result_package,source_location_id,destination_location_id,picking_partner_name,company_name,quantity,quantity_product_uom,unit_name,state,done_by,origin,movement_type,created_at) SELECT :id || '-move-' || q.id, CAST(:counting_date AS TIMESTAMP), :inventory_adjustment_name, q.product_id, q.product_name, CASE WHEN q.product_name ILIKE '%box%' OR q.product_name ILIKE '%chair%' THEN 'Office Supplies' ELSE 'Furniture' END, q.lot_serial_number, NULL, NULL, CASE WHEN q.counted_quantity < q.quantity THEN q.location_id ELSE 'location-loss' END, CASE WHEN q.counted_quantity < q.quantity THEN 'location-loss' ELSE q.location_id END, NULL, COALESCE(q.company_name, 'Core3 Demo Company'), ABS(q.counted_quantity - q.quantity), ABS(q.counted_quantity - q.quantity), COALESCE(q.unit_name, 'Units'), 'Done', COALESCE(:current_user_name, 'Admin User'), :inventory_adjustment_name, 'internal', TIMESTAMP '2026-01-15 00:00:00' FROM inventory_quants q JOIN inventory_locations l ON l.id = q.location_id WHERE l.usage IN ('Internal', 'Transit') AND q.inventory_quantity_set AND q.counted_quantity IS NOT NULL AND q.counted_quantity <> q.quantity"
        - query: "UPDATE inventory_quants SET quantity = counted_quantity, counted_quantity = NULL, inventory_quantity_set = FALSE, inventory_user = :current_user_name, inventory_adjustment_name = :inventory_adjustment_name, counting_date = CAST(:counting_date AS DATE), row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE location_id IN (SELECT id FROM inventory_locations WHERE usage IN ('Internal', 'Transit')) AND inventory_quantity_set AND counted_quantity IS NOT NULL"
      result: { query: "SELECT id, inventory_adjustment_name AS message, counting_date, requested_by, quant_count, applied_count, row_version FROM inventory_adjustments WHERE id = :id" }
  - id: set_inventory_quantity
    type: server
    permission: inventory.write
    action: inventory.quants.set_on_hand
    handler: yaml_mutation
    operation: set_on_hand
    refresh: [inventory_physical_inventory]
    mutation:
      guards: [{ query: "SELECT 1 AS ok FROM inventory_quants WHERE id = :id AND inventory_quantity_set = FALSE AND row_version = :expected_row_version", status: 409, code: INVENTORY_QUANT_STALE, message: This quantity was already counted or changed. Reload before setting it. }]
      steps: [{ query: "UPDATE inventory_quants SET counted_quantity = quantity, inventory_quantity_set = TRUE, inventory_user = :current_user_name, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: INVENTORY_QUANT_STALE, message: This quantity was changed by another user. Reload before setting it. }]
  - id: set_inventory_quantity_zero
    type: server
    permission: inventory.manage
    action: inventory.quants.set_zero
    handler: yaml_mutation
    operation: set_zero
    confirm: Set the counted quantity to zero?
    refresh: [inventory_physical_inventory]
    mutation:
      guards: [{ query: "SELECT 1 AS ok FROM inventory_quants WHERE id = :id AND inventory_quantity_set = FALSE AND row_version = :expected_row_version", status: 409, code: INVENTORY_QUANT_STALE, message: This quantity was already counted or changed. Reload before setting it. }]
      steps: [{ query: "UPDATE inventory_quants SET counted_quantity = 0, inventory_quantity_set = TRUE, inventory_user = :current_user_name, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: INVENTORY_QUANT_STALE, message: This quantity was changed by another user. Reload before setting it. }]
  - id: apply_inventory_quantity
    type: server
    permission: inventory.write
    action: inventory.quants.apply
    handler: yaml_mutation
    operation: apply
    refresh: [inventory_physical_inventory]
    mutation:
      guards: [{ query: "SELECT 1 AS ok FROM inventory_quants WHERE id = :id AND inventory_quantity_set = TRUE AND counted_quantity IS NOT NULL AND counted_quantity >= 0 AND row_version = :expected_row_version", status: 422, code: INVENTORY_COUNT_INVALID, message: Enter a non-negative counted quantity before applying it. }]
      steps: [{ query: "UPDATE inventory_quants SET quantity = counted_quantity, counted_quantity = NULL, inventory_quantity_set = FALSE, inventory_user = NULL, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: INVENTORY_QUANT_STALE, message: This quantity was changed before applying it. Reload before applying it. }]
  - id: clear_inventory_quantity
    type: server
    permission: inventory.manage
    action: inventory.quants.clear_count
    handler: yaml_mutation
    operation: clear_count
    refresh: [inventory_physical_inventory]
    mutation:
      guards: [{ query: "SELECT 1 AS ok FROM inventory_quants WHERE id = :id AND inventory_quantity_set = TRUE AND row_version = :expected_row_version", status: 409, code: INVENTORY_QUANT_STALE, message: This quantity was changed before clearing it. Reload before clearing it. }]
      steps: [{ query: "UPDATE inventory_quants SET counted_quantity = NULL, inventory_quantity_set = FALSE, inventory_user = NULL, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: INVENTORY_QUANT_STALE, message: This quantity was changed before clearing it. Reload before clearing it. }]
  - id: view_inventory_history
    type: navigate
    permission: inventory.read
    navigate_to: /moves
    params: { q: '{row.product_name}' }
