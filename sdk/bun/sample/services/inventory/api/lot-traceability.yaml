page: { id: lot-traceability }
datasources:
  - id: inventory_lot_traceability_context
    single: true
    permission: inventory.tracking
    error_states:
      missing_record: { status: 404, code: INVENTORY_TRACEABILITY_LOT_NOT_FOUND, message: The lot or serial number is not available in the current company. }
      transport_error: { status: 503, code: INVENTORY_TRACEABILITY_CONTEXT_UNAVAILABLE, message: Traceability context is temporarily unavailable. }
    query: "SELECT l.id, l.row_version, l.name AS lot_name, l.product_id, l.product_name, COALESCE(l.company_name, 'Visible to all companies') AS company_name, COUNT(m.id) AS line_count, 'Traceability Report' AS report_name FROM inventory_lots l LEFT JOIN inventory_move_lines m ON m.lot_serial_number = l.name AND m.state = 'Done' AND (COALESCE(:current_company_name, '') = '' OR m.company_name = :current_company_name) WHERE l.id = :id AND (COALESCE(:current_company_name, '') = '' OR l.company_name = :current_company_name) GROUP BY l.id, l.row_version, l.name, l.product_id, l.product_name, l.company_name"
  - id: inventory_lot_traceability_lines
    single: false
    permission: inventory.tracking
    error_states:
      transport_error: { status: 503, code: INVENTORY_TRACEABILITY_LINES_UNAVAILABLE, message: Traceability movements are temporarily unavailable. }
    query: "SELECT m.id, m.row_version, m.reference, m.product_name, CAST(m.date AS VARCHAR) AS date, m.lot_serial_number AS lot_name, COALESCE(src.name, m.source_location_id) AS source_location, COALESCE(dest.name, m.destination_location_id) AS destination_location, CAST(m.quantity_product_uom AS DOUBLE) AS quantity, m.unit_name, m.state, m.company_name, m.movement_type FROM inventory_move_lines m JOIN inventory_lots l ON l.id = :id AND m.lot_serial_number = l.name LEFT JOIN inventory_locations src ON src.id = m.source_location_id LEFT JOIN inventory_locations dest ON dest.id = m.destination_location_id WHERE m.state = 'Done' AND (COALESCE(:current_company_name, '') = '' OR l.company_name = :current_company_name) AND (COALESCE(:current_company_name, '') = '' OR m.company_name = :current_company_name) ORDER BY m.date, m.id"
  - id: inventory_lot_traceability_runs
    single: false
    permission: inventory.tracking
    error_states: { transport_error: { status: 503, code: INVENTORY_TRACEABILITY_RUNS_UNAVAILABLE, message: Traceability report history is temporarily unavailable. } }
    query: "SELECT id, lot_id, lot_name, report_name, requested_by, company_name, line_count, output_format, CAST(generated_at AS VARCHAR) AS generated_at, row_version FROM inventory_lot_traceability_runs WHERE lot_id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name) ORDER BY generated_at DESC, id DESC"
actions:
  - id: print_inventory_lot_traceability
    type: client
    permission: inventory.tracking
    script: |
      // js
      async ({ state, request }) => {
        const context = state.inventory_lot_traceability_context;
        if (!context?.id) throw new Error('Traceability context is unavailable');
        await request('/api/actions/inventory.lots.print_traceability', {
          method: 'POST',
          body: { lot_id: context.id, expected_row_version: context.row_version, company_name: context.company_name },
        });
        window.print();
      }
  - id: record_inventory_lot_traceability
    type: server
    permission: inventory.tracking
    action: inventory.lots.print_traceability
    handler: yaml_mutation
    operation: report
    refresh: [inventory_lot_traceability_context, inventory_lot_traceability_lines, inventory_lot_traceability_runs]
    mutation:
      before_steps:
        - query: "SELECT 'lot-traceability-' || CAST(:lot_id AS VARCHAR) || '-' || CAST((SELECT COUNT(*) + 1 FROM inventory_lot_traceability_runs WHERE lot_id = :lot_id) AS VARCHAR) AS id, l.name AS lot_name, 'Traceability Report' AS report_name, COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AS requested_by, COALESCE(NULLIF(:company_name, ''), NULLIF(:current_company_name, ''), l.company_name, 'Core3 Demo Company') AS company_name, COUNT(m.id) AS line_count, 'PDF' AS output_format FROM inventory_lots l LEFT JOIN inventory_move_lines m ON m.lot_serial_number = l.name AND m.state = 'Done' WHERE l.id = :lot_id GROUP BY l.id, l.name, l.company_name"
          assign: true
      guards:
        - { query: "SELECT id FROM inventory_lots WHERE id = :lot_id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: INVENTORY_TRACEABILITY_LOT_NOT_FOUND, message: The lot or serial number is not available in the current company. }
        - { query: "SELECT 1 AS ok FROM inventory_lots l WHERE l.id = :lot_id AND l.row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR l.company_name = :current_company_name)", status: 409, code: INVENTORY_TRACEABILITY_STALE, message: The lot changed before the report was requested. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM inventory_move_lines m JOIN inventory_lots l ON l.id = :lot_id AND m.lot_serial_number = l.name WHERE m.state = 'Done' AND (COALESCE(:current_company_name, '') = '' OR m.company_name = :current_company_name))", status: 404, code: INVENTORY_TRACEABILITY_EMPTY, message: This lot or serial number has no completed movements to report. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_id, '')), '') IS NOT NULL", status: 403, code: INVENTORY_TRACEABILITY_ACTOR_REQUIRED, message: An authenticated inventory actor is required to print the report. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:company_name, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')", status: 403, code: INVENTORY_TRACEABILITY_COMPANY, message: The report company must match the current company. }
      steps:
        - query: "INSERT INTO inventory_lot_traceability_runs(id, lot_id, lot_name, report_name, requested_by, company_name, line_count, output_format, generated_at, row_version) VALUES(:id, :lot_id, :lot_name, :report_name, :requested_by, :company_name, :line_count, :output_format, TIMESTAMP '2026-01-15 08:45:00', 1)"
      result: { query: "SELECT id, lot_id, lot_name, report_name, requested_by, company_name, line_count, output_format, CAST(generated_at AS VARCHAR) AS generated_at, row_version FROM inventory_lot_traceability_runs WHERE id = :id" }
