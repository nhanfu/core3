page: { id: location-detail }
datasources:
  - id: inventory_location_detail
    single: true
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_LOCATION_DETAIL_UNAVAILABLE, message: Location details are temporarily unavailable. } }
    query: "SELECT l.id, l.row_version, l.warehouse_id, l.parent_location_id, l.name, l.code, CASE WHEN parent.name IS NULL THEN l.name ELSE parent.name || '/' || l.name END AS complete_name, COALESCE(parent.name, '') AS parent_location_name, w.name AS warehouse_name, l.usage, l.state, l.active, COALESCE(l.company_name, 'My Company (San Francisco)') AS company_name, l.replenish_location, l.cyclic_inventory_frequency, CAST(l.last_inventory_date AS VARCHAR) AS last_inventory_date, CAST(l.next_inventory_date AS VARCHAR) AS next_inventory_date, COALESCE(l.removal_strategy, '') AS removal_strategy, COALESCE(q.product_count, 0) AS product_count FROM inventory_locations l JOIN inventory_warehouses w ON w.id = l.warehouse_id LEFT JOIN inventory_locations parent ON parent.id = l.parent_location_id LEFT JOIN (SELECT location_id, COUNT(DISTINCT product_id) AS product_count FROM inventory_quants GROUP BY location_id) q ON q.location_id = l.id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND l.id = :id"
actions:
  - id: save_inventory_location
    type: server_form
    permission: inventory.manage
    title: Save Location
    action: inventory.locations.update
    handler: yaml_mutation
    operation: update
    refresh: [inventory_location_detail, inventory_locations]
    mutation:
      operation: update
      table: inventory_locations
      fields: [warehouse_id, parent_location_id, name, code, usage, company_name, replenish_location, cyclic_inventory_frequency, removal_strategy]
      required: [warehouse_id, name, code, usage]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM inventory_locations WHERE id = :id", status: 404, code: INVENTORY_LOCATION_NOT_FOUND, message: Location not found. }
        - { query: "SELECT 1 AS ok WHERE length(trim(:name)) > 0 AND length(trim(:code)) > 0", status: 422, code: INVENTORY_LOCATION_FIELDS_REQUIRED, message: Location name and barcode are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_locations WHERE warehouse_id = :warehouse_id AND code = :code AND id <> :id)", status: 409, code: INVENTORY_LOCATION_CODE_EXISTS, message: A location with this barcode already exists in this warehouse. }
      result: { query: "SELECT * FROM inventory_locations WHERE id = :id" }
    fields:
      - { field: warehouse_id, label: Warehouse, type: select, options_source: inventory_location_warehouses, required: true }
      - { field: parent_location_id, label: Parent Location, type: select, options_source: inventory_locations }
      - { field: name, label: Location Name, type: text, required: true }
      - { field: code, label: Barcode, type: text, required: true }
      - { field: usage, label: Location Type, type: select, options_source: inventory_location_usage_options, required: true }
      - { field: company_name, label: Company, type: text }
      - { field: replenish_location, label: Replenishments, type: checkbox }
      - { field: cyclic_inventory_frequency, label: Inventory Frequency, type: number }
      - { field: removal_strategy, label: Removal Strategy, type: radio, options: [{ value: '', label: No Removal Strategy }, { value: FIFO, label: First In First Out (FIFO) }, { value: LIFO, label: Last In First Out (LIFO) }, { value: Closest, label: Closest Location }, { value: Least Packages, label: Least Packages }] }
  - id: view_inventory_location_products
    type: navigate
    permission: inventory.read
    navigate_to: /stock
