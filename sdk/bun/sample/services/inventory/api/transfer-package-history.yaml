page: { id: transfer-package-history }
datasources:
  - id: inventory_transfer_package_history_context
    single: true
    permission: inventory.read
    error_states:
      not_found: { status: 404, code: INVENTORY_PACKAGE_HISTORY_TRANSFER_NOT_FOUND, message: Transfer package history was not found. }
      forbidden: { status: 403, code: INVENTORY_PACKAGE_HISTORY_FORBIDDEN, message: You do not have permission to view package history. }
      transport_error: { status: 503, code: INVENTORY_PACKAGE_HISTORY_UNAVAILABLE, message: Package history context is temporarily unavailable. }
    query: "SELECT p.id AS source_picking_id, p.name AS source_transfer_name, p.state AS source_state, p.company_name, p.row_version, CAST(COUNT(h.id) AS BIGINT) AS package_count FROM inventory_pickings p LEFT JOIN inventory_package_histories h ON h.picking_id = p.id AND (NULLIF(:current_company_name, '') IS NULL OR h.company_name = :current_company_name) WHERE p.id = :picking_id AND p.state = 'Done' AND (NULLIF(:current_company_name, '') IS NULL OR p.company_name = :current_company_name) GROUP BY p.id, p.name, p.state, p.company_name, p.row_version"
  - id: inventory_transfer_package_histories
    single: false
    permission: inventory.read
    error_states:
      forbidden: { status: 403, code: INVENTORY_PACKAGE_HISTORY_FORBIDDEN, message: You do not have permission to view package history. }
      transport_error: { status: 503, code: INVENTORY_PACKAGE_HISTORY_UNAVAILABLE, message: Transfer package history is temporarily unavailable. }
    query: "SELECT h.id, h.row_version, h.picking_id, h.package_id, h.package_name, COALESCE(h.package_type_name, '') AS package_type_name, COALESCE(h.location_name, '') AS location_name, COALESCE(h.parent_orig_name, '') AS parent_orig_name, COALESCE(h.location_dest_name, '') AS location_dest_name, COALESCE(h.parent_dest_name, '') AS parent_dest_name, h.company_name, h.move_count, CAST(h.created_at AS VARCHAR) AS created_at FROM inventory_package_histories h JOIN inventory_pickings p ON p.id = h.picking_id WHERE h.picking_id = :picking_id AND p.state = 'Done' AND (NULLIF(:current_company_name, '') IS NULL OR h.company_name = :current_company_name) AND (:q IS NULL OR h.package_name ILIKE '%' || :q || '%' OR COALESCE(h.location_name, '') ILIKE '%' || :q || '%' OR COALESCE(h.parent_orig_name, '') ILIKE '%' || :q || '%' OR COALESCE(h.location_dest_name, '') ILIKE '%' || :q || '%' OR COALESCE(h.parent_dest_name, '') ILIKE '%' || :q || '%') AND (:main_packages IS NULL OR :main_packages <> 'main' OR (COALESCE(h.parent_dest_name, '') = '' AND COALESCE(h.parent_orig_name, '') = '')) ORDER BY h.package_name, h.id"
actions:
  - id: back_to_inventory_transfer_from_package_history
    type: navigate
    permission: inventory.read
    navigate_to: /inventory/transfer/detail
    params: { id: '{query.picking_id}' }
  - id: view_inventory_transfer_package_history_package
    type: navigate
    permission: inventory.read
    navigate_to: /packages/detail
    params: { id: '{row.package_id}' }
