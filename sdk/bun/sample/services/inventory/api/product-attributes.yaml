page: { id: product-attributes }
datasources:
  - id: inventory_product_attributes
    single: false
    permission: inventory.read
    error_states: { transport_error: { status: 503, code: INVENTORY_PRODUCT_ATTRIBUTES_UNAVAILABLE, message: Product attributes are temporarily unavailable. } }
    query: |
      SELECT a.id, a.row_version, a.sequence, a.name, a.display_type, a.create_variant,
        a.active, a.company_name, a.related_product_count,
        COUNT(v.id) AS value_count
      FROM inventory_product_attributes a
      LEFT JOIN inventory_product_attribute_values v ON v.attribute_id = a.id AND v.active = TRUE
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
        AND (COALESCE(:active, 'active') = 'all' OR (COALESCE(:active, 'active') = 'active' AND a.active = TRUE) OR (COALESCE(:active, 'active') = 'archived' AND a.active = FALSE))
        AND (:q IS NULL OR a.name ILIKE '%' || :q || '%' OR a.display_type ILIKE '%' || :q || '%')
      GROUP BY a.id, a.row_version, a.sequence, a.name, a.display_type, a.create_variant, a.active, a.company_name, a.related_product_count
      ORDER BY a.sequence, a.name, a.id
actions:
  - id: view_inventory_product_attribute
    type: navigate
    permission: inventory.read
    navigate_to: /attributes/detail
    params: { id: '{row.id}' }
  - id: create_inventory_product_attribute
    type: server_form
    permission: inventory.manage
    title: New Product Attribute
    action: inventory.product_attributes.create
    handler: yaml_mutation
    operation: create
    refresh: [inventory_product_attributes]
    mutation:
      operation: insert
      table: inventory_product_attributes
      generated: [id]
      fields: [sequence, name, display_type, create_variant, active, company_name, related_product_count, row_version]
      required: [name, display_type, create_variant, company_name]
      defaults: { sequence: 100, display_type: radio, create_variant: always, active: true, company_name: Shared, related_product_count: 0, row_version: 1 }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: INVENTORY_ATTRIBUTE_NAME_REQUIRED, message: An attribute name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(:display_type AS VARCHAR) IN ('radio', 'pills', 'select', 'color', 'multi', 'image')", status: 422, code: INVENTORY_ATTRIBUTE_DISPLAY_INVALID, message: Choose a supported display type. }
        - { query: "SELECT 1 AS ok WHERE CAST(:create_variant AS VARCHAR) IN ('always', 'dynamic', 'no_variant')", status: 422, code: INVENTORY_ATTRIBUTE_VARIANT_INVALID, message: Choose a supported variant creation policy. }
        - { query: "SELECT 1 AS ok WHERE CAST(:display_type AS VARCHAR) <> 'multi' OR CAST(:create_variant AS VARCHAR) = 'no_variant'", status: 422, code: INVENTORY_ATTRIBUTE_MULTI_VARIANT_INVALID, message: Multi-checkbox attributes cannot create variants. }
        - { query: "SELECT 1 AS ok WHERE CAST(:company_name AS VARCHAR) = 'Shared'", status: 403, code: INVENTORY_ATTRIBUTE_COMPANY_FORBIDDEN, message: Product attributes are global and must use the shared company scope. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM inventory_product_attributes WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: INVENTORY_ATTRIBUTE_EXISTS, message: An attribute with this name already exists. }
      result: { query: "SELECT * FROM inventory_product_attributes WHERE id = :id" }
    fields:
      - { field: sequence, label: Sequence, type: number, default: 100 }
      - { field: name, label: Attribute Name, type: text, required: true, placeholder: 'e.g. Finish' }
      - { field: display_type, label: Display Type, type: select, options: [{ value: radio, label: Radio }, { value: pills, label: Pills }, { value: select, label: Select }, { value: color, label: Color }, { value: multi, label: Multi Checkbox }, { value: image, label: Image }], required: true }
      - { field: create_variant, label: Create Variants, type: select, options: [{ value: always, label: Always }, { value: dynamic, label: Dynamically }, { value: no_variant, label: Never }], required: true }
      - { field: company_name, label: Company, type: text, required: true }
