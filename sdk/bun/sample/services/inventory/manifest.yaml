        - path: /operation-types
          label: Operations Types
          icon: settings
          permission: inventory.manage
        - path: /units-packagings
          label: Units & Packagings
          icon: ruler
          permission: inventory.read
        - path: /package-types
          label: Package Types
          icon: package
          permission: inventory.read
        - path: /product-categories
          label: Categories
          icon: folder
          permission: inventory.read
        - path: /attributes
          label: Attributes
          icon: sliders
          permission: inventory.read
        - path: /inventory-analysis
          label: Inventory Analysis
          icon: chart
          permission: inventory.read
