      label: Overview
      items:
        - path: /inventory/overview
          label: Overview
          icon: dashboard
          permission: inventory.read
    - id: transfers
      label: Transfers
      items:
        - path: /receipts
          label: Receipts
          icon: inbox
          permission: inventory.read
        - path: /deliveries
          label: Deliveries
          icon: truck
          permission: inventory.read
        - path: /internal
          label: Internal
          icon: transfer
          permission: inventory.multi_location
        - path: /physical-inventory
          label: Physical Inventory
          icon: clipboard
          permission: inventory.read
    - id: adjustments
      label: Adjustments
      items:
        - path: /inventory/scraps
          label: Scrap Orders
          icon: delete
          permission: inventory.read
    - id: procurement
      label: Procurement
      items:
        - path: /reordering-rules
          label: Reordering Rules
          icon: refresh
          permission: inventory.read
        - path: /replenishment
          label: Replenishment
          icon: refresh
          permission: inventory.manage
    - id: reporting
      label: Reporting
      items:
        - path: /stock-report
          label: Stock
          icon: boxes
          permission: inventory.read
        - path: /moves
          label: Moves History
          icon: transfer
          permission: inventory.read
        - path: /moves-analysis
          label: Moves Analysis
          icon: chart
          permission: inventory.read
    - id: products
