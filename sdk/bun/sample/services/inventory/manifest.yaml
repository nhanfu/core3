id: inventory
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  stock:
    path: /stock
    label: Inventory
    icon: warehouse
    permission: inventory.read
  groups:
    - id: transfers
      label: Transfers
      items:
        - path: /receipts
          label: Receipts
          icon: inbox
          permission: inventory.read
        - path: /deliveries
          label: Deliveries
          icon: truck
          permission: inventory.read
        - path: /physical-inventory
          label: Physical Inventory
          icon: clipboard
          permission: inventory.read
    - id: adjustments
      label: Adjustments
      items:
        - path: /inventory/scraps
          label: Scrap Orders
          icon: delete
          permission: inventory.read
    - id: procurement
      label: Procurement
      items:
        - path: /replenishment
          label: Replenishment
          icon: refresh
          permission: inventory.manage
    - id: reporting
      label: Reporting
      items:
        - path: /stock-report
          label: Stock
          icon: boxes
          permission: inventory.read
        - path: /moves
          label: Moves History
          icon: transfer
          permission: inventory.read
    - id: products
      label: Products
      items:
        - path: /lots
          label: Lots / Serial Numbers
          icon: tag
          permission: inventory.tracking
    - id: configuration
      label: Configuration
      items:
        - path: /warehouses
          label: Warehouses
          icon: warehouse
          permission: inventory.read
        - path: /locations
          label: Locations
          icon: location
          permission: inventory.read
        - path: /inventory-analysis
          label: Inventory Analysis
          icon: chart
          permission: inventory.read
