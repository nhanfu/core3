        - path: /packages
          label: Packages
          icon: package
          permission: inventory.tracking
    - id: configuration
      label: Configuration
      items:
        - path: /inventory/settings
          label: Settings
          icon: settings
          permission: inventory.manage
        - path: /warehouses
          label: Warehouses
          icon: warehouse
          permission: inventory.read
        - path: /locations
          label: Locations
          icon: location
          permission: inventory.read
        - path: /routes
          label: Routes
          icon: route
          permission: inventory.manage
        - path: /rules
