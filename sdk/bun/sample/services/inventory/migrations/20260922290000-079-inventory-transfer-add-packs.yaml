version: 0.0.79
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_transfer_package_additions (
        id VARCHAR PRIMARY KEY,
        picking_id VARCHAR NOT NULL,
        package_id VARCHAR NOT NULL,
        package_name VARCHAR NOT NULL,
        company_name VARCHAR NOT NULL,
        content_count INTEGER NOT NULL,
        added_by VARCHAR NOT NULL,
        state VARCHAR NOT NULL DEFAULT 'Added',
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        row_version BIGINT NOT NULL DEFAULT 1,
        UNIQUE(picking_id, package_id)
