        ('location-stock-shelf-1', 'warehouse-main', 'location-stock', 'Shelf 1', 'SHELF-1', 'Internal', 'Active', TRUE, 'My Company (San Francisco)', FALSE, 30, 'FIFO'),
        ('location-stock-shelf-2', 'warehouse-main', 'location-stock', 'Shelf 2', 'SHELF-2', 'Internal', 'Active', TRUE, 'My Company (San Francisco)', TRUE, 60, 'LIFO'),
