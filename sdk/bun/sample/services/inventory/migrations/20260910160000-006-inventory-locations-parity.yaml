      ALTER TABLE inventory_locations ADD COLUMN IF NOT EXISTS company_name VARCHAR;
      ALTER TABLE inventory_locations ADD COLUMN IF NOT EXISTS replenish_location BOOLEAN DEFAULT FALSE;
      ALTER TABLE inventory_locations ADD COLUMN IF NOT EXISTS cyclic_inventory_frequency INTEGER DEFAULT 0;
