version: 0.0.32
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_transfer_reservations (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        picking_id VARCHAR NOT NULL,
        move_id VARCHAR NOT NULL,
        quant_id VARCHAR NOT NULL,
        company_name VARCHAR NOT NULL,
        quantity DECIMAL(18,3) NOT NULL,
        reserved_by VARCHAR NOT NULL,
        reserved_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        state VARCHAR NOT NULL DEFAULT 'Reserved',
        UNIQUE(picking_id, move_id, quant_id)
      );
      CREATE INDEX IF NOT EXISTS inventory_transfer_reservations_picking_idx
        ON inventory_transfer_reservations(picking_id, state, reserved_at);
      CREATE INDEX IF NOT EXISTS inventory_transfer_reservations_quant_idx
        ON inventory_transfer_reservations(quant_id, state);
      INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state)
      VALUES ('delivery-reserve-0001', 'operation-deliveries', 'WH/OUT/RESERVE/0001', 'Core3 Demo Customer', DATE '2026-01-15', 'SO/RESERVE/0001', 'Core3 Demo Company', 'location-stock', 'location-customer', 'Waiting')
      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity)
      VALUES ('delivery-reserve-0001-move-001', 'delivery-reserve-0001', '[E-COM08] Storage Box', 4, 0)
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_transfer_reservations WHERE picking_id = 'delivery-reserve-0001';
      DELETE FROM inventory_picking_moves WHERE picking_id = 'delivery-reserve-0001';
      DELETE FROM inventory_pickings WHERE id = 'delivery-reserve-0001';
      DROP TABLE IF EXISTS inventory_transfer_reservations;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
