        picking_id VARCHAR, picking_name VARCHAR, source_location_id VARCHAR NOT NULL,
        destination_location_id VARCHAR NOT NULL, partner_name VARCHAR,
        company_name VARCHAR NOT NULL, product_uom_qty DECIMAL(18,3) NOT NULL,
        quantity DECIMAL(18,3) NOT NULL, unit_name VARCHAR NOT NULL,
        state VARCHAR NOT NULL, origin VARCHAR, movement_type VARCHAR NOT NULL,
        is_inventory BOOLEAN NOT NULL DEFAULT FALSE, created_at TIMESTAMP NOT NULL
      );
