        ('product-orderpoint-storage-box-auto-0001', 'orderpoint-storage-box-auto', 'inventory-variant-storage-box', 'inventory-template-storage-box', 'My Company (San Francisco)', TIMESTAMP '2026-01-15 08:00:00'),
        ('product-orderpoint-quant-storage-box-0001', 'orderpoint-quant-replenish-0001', 'inventory-variant-storage-box', 'inventory-template-storage-box', 'Core3 Demo Company', TIMESTAMP '2026-01-15 08:01:00'),
        ('product-orderpoint-corner-desk-0001', 'orderpoint-desk-right', 'inventory-variant-corner-desk', 'inventory-template-corner-desk', 'My Company (San Francisco)', TIMESTAMP '2026-01-15 08:02:00')
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_product_orderpoint_links
      WHERE id IN (
        'product-orderpoint-storage-box-auto-0001',
        'product-orderpoint-quant-storage-box-0001',
        'product-orderpoint-corner-desk-0001'
      );
      DROP TABLE IF EXISTS inventory_product_orderpoint_links;
