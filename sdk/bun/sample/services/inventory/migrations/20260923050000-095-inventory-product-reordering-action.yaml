version: 0.0.95
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_product_orderpoint_links (
        id VARCHAR PRIMARY KEY,
        orderpoint_id VARCHAR NOT NULL,
        product_id VARCHAR NOT NULL,
        template_id VARCHAR NOT NULL,
        company_name VARCHAR NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        UNIQUE(orderpoint_id)
      );
      CREATE INDEX IF NOT EXISTS inventory_product_orderpoint_links_product_idx
        ON inventory_product_orderpoint_links(product_id, company_name, orderpoint_id);
      CREATE INDEX IF NOT EXISTS inventory_product_orderpoint_links_template_idx
        ON inventory_product_orderpoint_links(template_id, company_name, orderpoint_id);
      INSERT INTO inventory_product_orderpoint_links
        (id, orderpoint_id, product_id, template_id, company_name, created_at)
