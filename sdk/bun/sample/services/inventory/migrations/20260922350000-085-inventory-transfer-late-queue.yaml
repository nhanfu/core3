version: 0.0.85
description: Inventory late transfer queue context, deadline fields, and fixture
type:
  postgres:
    up: |
      ALTER TABLE inventory_pickings ADD COLUMN IF NOT EXISTS date_deadline DATE;
      ALTER TABLE inventory_pickings ADD COLUMN IF NOT EXISTS has_deadline_issue BOOLEAN;
      UPDATE inventory_pickings SET has_deadline_issue = COALESCE(has_deadline_issue, FALSE);
      CREATE TABLE IF NOT EXISTS inventory_transfer_late_queue_context (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00'
      );
      CREATE TABLE IF NOT EXISTS inventory_transfer_late_queue_runs (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        refreshed_by VARCHAR NOT NULL,
        refreshed_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00'
      );
      INSERT INTO inventory_transfer_late_queue_context(id, row_version, company_name)
      VALUES ('late-queue', 1, 'Core3 Demo Company')
      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, date_deadline, has_deadline_issue, source_document, company_name, source_location_id, destination_location_id, state, row_version)
      VALUES
        ('delivery-late-queue-0001', 'operation-deliveries', 'WH/OUT/LATEQUEUE/0001', 'Late Queue Customer', DATE '2026-01-12', DATE '2026-01-13', FALSE, 'SO/LATEQUEUE/0001', 'Core3 Demo Company', 'location-stock', 'location-customer', 'Ready', 1),
        ('receipt-late-queue-0002', 'operation-receipts', 'WH/IN/LATEQUEUE/0002', 'Late Queue Supplier', DATE '2026-01-15', DATE '2026-01-14', TRUE, 'PO/LATEQUEUE/0002', 'Core3 Demo Company', 'location-supplier', 'location-stock', 'Waiting', 1)
      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity)
      VALUES
        ('delivery-late-queue-0001-move-001', 'delivery-late-queue-0001', '[E-COM08] Storage Box', 3, 0),
        ('receipt-late-queue-0002-move-001', 'receipt-late-queue-0002', '[E-COM08] Storage Box', 4, 0)
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_picking_moves WHERE id IN ('delivery-late-queue-0001-move-001', 'receipt-late-queue-0002-move-001');
      DELETE FROM inventory_pickings WHERE id IN ('delivery-late-queue-0001', 'receipt-late-queue-0002');
      DELETE FROM inventory_transfer_late_queue_runs WHERE company_name = 'Core3 Demo Company';
      DELETE FROM inventory_transfer_late_queue_context WHERE id = 'late-queue';
      DROP TABLE IF EXISTS inventory_transfer_late_queue_runs;
      DROP TABLE IF EXISTS inventory_transfer_late_queue_context;
      ALTER TABLE inventory_pickings DROP COLUMN IF EXISTS has_deadline_issue;
      ALTER TABLE inventory_pickings DROP COLUMN IF EXISTS date_deadline;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
