      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity)
      VALUES ('delivery-email-0001-move-001', 'delivery-email-0001', '[E-COM08] Storage Box', 2, 0)
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_transfer_email_runs WHERE picking_id = 'delivery-email-0001';
      DELETE FROM inventory_transfer_messages WHERE picking_id = 'delivery-email-0001';
      DELETE FROM inventory_picking_moves WHERE picking_id = 'delivery-email-0001';
      DELETE FROM inventory_pickings WHERE id = 'delivery-email-0001';
      DROP TABLE IF EXISTS inventory_transfer_email_runs;
