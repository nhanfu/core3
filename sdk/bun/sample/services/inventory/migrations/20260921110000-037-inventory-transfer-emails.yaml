version: 0.0.37
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_transfer_email_runs (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        picking_id VARCHAR NOT NULL,
        company_name VARCHAR NOT NULL,
        recipient_email VARCHAR NOT NULL,
        subject VARCHAR NOT NULL,
        body VARCHAR NOT NULL,
        queued_by VARCHAR NOT NULL,
        state VARCHAR NOT NULL,
        queued_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        UNIQUE(picking_id, id)
      );
      CREATE INDEX IF NOT EXISTS inventory_transfer_email_runs_picking_idx
        ON inventory_transfer_email_runs(picking_id, queued_at, id);
