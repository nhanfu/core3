version: 0.0.3
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_operation_types (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL, code VARCHAR NOT NULL UNIQUE,
        operation_kind VARCHAR NOT NULL, source_location_id VARCHAR NOT NULL,
        destination_location_id VARCHAR NOT NULL, state VARCHAR NOT NULL DEFAULT 'Active'
      );
      CREATE TABLE IF NOT EXISTS inventory_pickings (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, operation_type_id VARCHAR NOT NULL,
        name VARCHAR NOT NULL UNIQUE, contact_name VARCHAR, scheduled_date DATE NOT NULL,
        source_document VARCHAR, company_name VARCHAR NOT NULL, source_location_id VARCHAR NOT NULL,
        destination_location_id VARCHAR NOT NULL, state VARCHAR NOT NULL DEFAULT 'Draft'
      );
      CREATE TABLE IF NOT EXISTS inventory_picking_moves (
        id VARCHAR PRIMARY KEY, picking_id VARCHAR NOT NULL, product_name VARCHAR NOT NULL,
        quantity DECIMAL(18,3) NOT NULL, done_quantity DECIMAL(18,3) NOT NULL DEFAULT 0
      );
