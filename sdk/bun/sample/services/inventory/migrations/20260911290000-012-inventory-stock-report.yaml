      CREATE TABLE IF NOT EXISTS inventory_stock_report (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        default_code VARCHAR NOT NULL, product_name VARCHAR NOT NULL,
        category_name VARCHAR NOT NULL, unit_cost DECIMAL(18,2) NOT NULL DEFAULT 0,
        total_value DECIMAL(18,2) NOT NULL DEFAULT 0, on_hand DECIMAL(18,3) NOT NULL DEFAULT 0,
        free_to_use DECIMAL(18,3) NOT NULL DEFAULT 0, incoming_qty DECIMAL(18,3) NOT NULL DEFAULT 0,
        outgoing_qty DECIMAL(18,3) NOT NULL DEFAULT 0, forecasted DECIMAL(18,3) NOT NULL DEFAULT 0,
        unit_name VARCHAR NOT NULL DEFAULT 'Units', active BOOLEAN NOT NULL DEFAULT TRUE,
        stock_date DATE NOT NULL DEFAULT DATE '2026-01-15', created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        UNIQUE(default_code)
      );
      CREATE INDEX IF NOT EXISTS idx_inventory_stock_report_category ON inventory_stock_report(category_name, default_code);
