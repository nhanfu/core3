        ('orderpoint-desk-right', 'Replenishment Report', 'product-e-com06', '[E-COM06] Corner Desk Right Sit', 'Furniture / Office', 'WH/Stock', 'WH', 0, -10, 'Buy', 0, 0, 10, 'Units', 'manual', 'Open', NULL, TRUE, 'My Company (San Francisco)', 14, TIMESTAMP '2026-01-15 08:01:00', TIMESTAMP '2026-01-15 08:01:00'),
        ('orderpoint-desk-left', 'Replenishment Report', 'product-furn-1118', '[FURN_1118] Corner Desk Left Sit', 'Furniture / Office', 'WH/Stock', 'WH', 2, -1, 'Buy', 0, 0, 1, 'Units', 'manual', 'Open', NULL, TRUE, 'My Company (San Francisco)', 3, TIMESTAMP '2026-01-15 08:02:00', TIMESTAMP '2026-01-15 08:02:00'),
