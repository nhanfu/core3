      VALUES
        ('package-relocate-content-0001','package-relocate-0005','[E-COM08] Storage Box',NULL,2,'Units'),
        ('package-relocate-content-0002','package-relocate-0005','[FURN_8855] Drawer','TRACE-PACK-0005',1,'Units')
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_package_contents WHERE package_id = 'package-relocate-0005';
