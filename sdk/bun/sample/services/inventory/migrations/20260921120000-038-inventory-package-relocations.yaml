version: 0.0.38
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_package_relocations (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        package_id VARCHAR NOT NULL,
        from_location_name VARCHAR NOT NULL,
        to_location_name VARCHAR NOT NULL,
        moved_quantity DECIMAL(18,3) NOT NULL DEFAULT 0,
        reason VARCHAR NOT NULL DEFAULT 'Package manually relocated',
        company_name VARCHAR,
        relocated_by VARCHAR NOT NULL,
        relocated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        UNIQUE(package_id, id)
      );
      CREATE INDEX IF NOT EXISTS inventory_package_relocations_package_idx
        ON inventory_package_relocations(package_id, relocated_at, id);
