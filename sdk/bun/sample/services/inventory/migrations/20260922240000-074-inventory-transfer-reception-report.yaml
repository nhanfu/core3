      CREATE TABLE IF NOT EXISTS inventory_reception_report_lines (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        picking_id VARCHAR NOT NULL,
        demand_picking_id VARCHAR NOT NULL,
        demand_move_id VARCHAR NOT NULL,
        incoming_move_id VARCHAR NOT NULL,
        source_reference VARCHAR NOT NULL,
        source_document VARCHAR,
        source_contact VARCHAR,
        scheduled_date DATE NOT NULL,
        product_id VARCHAR NOT NULL,
        product_name VARCHAR NOT NULL,
        quantity DECIMAL(18,3) NOT NULL,
        assigned_quantity DECIMAL(18,3) NOT NULL DEFAULT 0,
        uom VARCHAR NOT NULL,
        is_qty_assignable BOOLEAN NOT NULL DEFAULT TRUE,
        is_assigned BOOLEAN NOT NULL DEFAULT FALSE,
        state VARCHAR NOT NULL DEFAULT 'Waiting',
        assigned_by VARCHAR,
        assigned_at TIMESTAMP,
        company_name VARCHAR NOT NULL,
        created_at TIMESTAMP NOT NULL
      );
      CREATE INDEX IF NOT EXISTS idx_inventory_reception_report_lines_picking
        ON inventory_reception_report_lines(picking_id, scheduled_date, id);
      CREATE TABLE IF NOT EXISTS inventory_reception_report_runs (
