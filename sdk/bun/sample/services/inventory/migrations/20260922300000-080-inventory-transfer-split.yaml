version: 0.0.80
kind: data
type:
  postgres:
    up: |
      ALTER TABLE inventory_pickings ADD COLUMN IF NOT EXISTS split_of_id VARCHAR;
      CREATE TABLE IF NOT EXISTS inventory_transfer_splits (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        source_picking_id VARCHAR NOT NULL,
        split_picking_id VARCHAR NOT NULL,
        company_name VARCHAR NOT NULL,
        line_count INTEGER NOT NULL,
        split_quantity DECIMAL(18,3) NOT NULL,
        split_by VARCHAR NOT NULL,
        state VARCHAR NOT NULL DEFAULT 'Created',
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        UNIQUE(source_picking_id, id)
      );
      CREATE INDEX IF NOT EXISTS inventory_transfer_splits_source_idx
        ON inventory_transfer_splits(source_picking_id, created_at, id);
      INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state)
      VALUES ('delivery-split-0001', 'operation-deliveries', 'WH/OUT/SPLIT/0001', 'Split Transfer Customer', DATE '2026-01-15', 'SO/SPLIT/0001', 'Core3 Demo Company', 'location-stock', 'location-customer', 'Ready')
      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity)
      VALUES ('delivery-split-0001-move-001', 'delivery-split-0001', '[E-COM08] Storage Box', 10, 4)
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_transfer_splits WHERE source_picking_id = 'delivery-split-0001';
      DELETE FROM inventory_picking_moves WHERE picking_id = 'delivery-split-0001' OR picking_id LIKE 'split-delivery-split-0001-%';
      DELETE FROM inventory_pickings WHERE id = 'delivery-split-0001' OR id LIKE 'split-delivery-split-0001-%';
      DROP INDEX IF EXISTS inventory_transfer_splits_source_idx;
      DROP TABLE IF EXISTS inventory_transfer_splits;
      ALTER TABLE inventory_pickings DROP COLUMN IF EXISTS split_of_id;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
