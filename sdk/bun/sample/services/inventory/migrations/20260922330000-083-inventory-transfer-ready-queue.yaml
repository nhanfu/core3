version: 0.0.83
description: Inventory ready transfer queue context and fixture
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_transfer_ready_queue_context (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00'
      );
      CREATE TABLE IF NOT EXISTS inventory_transfer_ready_queue_runs (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        refreshed_by VARCHAR NOT NULL,
        refreshed_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00'
      );
      INSERT INTO inventory_transfer_ready_queue_context(id, row_version, company_name)
      VALUES ('ready-queue', 1, 'Core3 Demo Company')
      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state, row_version)
      VALUES ('delivery-ready-queue-0001', 'operation-deliveries', 'WH/OUT/READYQUEUE/0001', 'Ready Queue Customer', DATE '2026-01-15', 'SO/READYQUEUE/0001', 'Core3 Demo Company', 'location-stock', 'location-customer', 'Ready', 1)
      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity)
      VALUES ('delivery-ready-queue-0001-move-001', 'delivery-ready-queue-0001', '[E-COM08] Storage Box', 3, 0)
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_picking_moves WHERE id = 'delivery-ready-queue-0001-move-001';
      DELETE FROM inventory_pickings WHERE id = 'delivery-ready-queue-0001';
      DELETE FROM inventory_transfer_ready_queue_runs WHERE company_name = 'Core3 Demo Company';
      DELETE FROM inventory_transfer_ready_queue_context WHERE id = 'ready-queue';
      DROP TABLE IF EXISTS inventory_transfer_ready_queue_runs;
      DROP TABLE IF EXISTS inventory_transfer_ready_queue_context;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
