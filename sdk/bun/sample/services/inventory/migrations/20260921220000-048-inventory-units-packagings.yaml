    up: |
      CREATE TABLE IF NOT EXISTS inventory_units_packagings (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        sequence INTEGER NOT NULL DEFAULT 1000,
        name VARCHAR NOT NULL,
        relative_factor DECIMAL(18,6) NOT NULL DEFAULT 1,
        reference_unit_id VARCHAR,
        reference_unit_name VARCHAR NOT NULL DEFAULT '',
        active BOOLEAN NOT NULL DEFAULT TRUE,
        company_name VARCHAR NOT NULL DEFAULT 'Core3 Demo Company',
        usage_count INTEGER NOT NULL DEFAULT 0,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        UNIQUE(name, company_name)
      );
      CREATE INDEX IF NOT EXISTS idx_inventory_units_packagings_order
        ON inventory_units_packagings(active, sequence, reference_unit_id, id);
