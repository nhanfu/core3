version: 0.0.88
description: Inventory All Transfers queue context and refresh history
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_transfer_all_queue_context (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00'
      );
      CREATE TABLE IF NOT EXISTS inventory_transfer_all_queue_runs (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        operation_type_id VARCHAR NOT NULL DEFAULT '',
        refreshed_by VARCHAR NOT NULL,
        refreshed_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00'
      );
      INSERT INTO inventory_transfer_all_queue_context(id, row_version, company_name)
      VALUES ('all-transfer-queue', 1, 'My Company (San Francisco)')
      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_transfer_all_queue_runs(id, company_name, operation_type_id, refreshed_by)
      VALUES ('all-transfer-queue-run-0001', 'My Company (San Francisco)', '', 'Seeded Inventory')
      ON CONFLICT(id) DO NOTHING;
    down: |
      DROP TABLE IF EXISTS inventory_transfer_all_queue_runs;
      DROP TABLE IF EXISTS inventory_transfer_all_queue_context;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
