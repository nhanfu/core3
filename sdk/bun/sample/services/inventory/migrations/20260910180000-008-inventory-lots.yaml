        unit_name VARCHAR NOT NULL DEFAULT 'Units', tracking VARCHAR NOT NULL DEFAULT 'lot',
        company_name VARCHAR, partner_name VARCHAR, note VARCHAR,
        transfer_count INTEGER NOT NULL DEFAULT 0,
        create_date TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        UNIQUE(product_id, name, company_name)
