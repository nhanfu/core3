      CREATE TABLE IF NOT EXISTS inventory_move_lines (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        date TIMESTAMP NOT NULL, reference VARCHAR NOT NULL, product_id VARCHAR,
        product_name VARCHAR NOT NULL, product_category_name VARCHAR NOT NULL,
        lot_serial_number VARCHAR, source_package VARCHAR, result_package VARCHAR,
        source_location_id VARCHAR NOT NULL, destination_location_id VARCHAR NOT NULL,
        picking_partner_name VARCHAR, company_name VARCHAR NOT NULL,
        quantity DECIMAL(18,3) NOT NULL, quantity_product_uom DECIMAL(18,3) NOT NULL,
        unit_name VARCHAR NOT NULL, state VARCHAR NOT NULL, done_by VARCHAR,
        origin VARCHAR, movement_type VARCHAR NOT NULL, created_at TIMESTAMP NOT NULL
      );
