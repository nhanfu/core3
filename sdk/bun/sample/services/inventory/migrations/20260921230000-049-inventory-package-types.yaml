version: 0.0.49
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_package_types (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        sequence INTEGER NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL,
        package_use VARCHAR NOT NULL DEFAULT 'disposable',
        barcode VARCHAR,
        packaging_length DECIMAL(18,3) NOT NULL DEFAULT 0,
        width DECIMAL(18,3) NOT NULL DEFAULT 0,
        height DECIMAL(18,3) NOT NULL DEFAULT 0,
        base_weight DECIMAL(18,3) NOT NULL DEFAULT 0,
        max_weight DECIMAL(18,3) NOT NULL DEFAULT 0,
        has_quants BOOLEAN NOT NULL DEFAULT FALSE,
        route_count INTEGER NOT NULL DEFAULT 0,
        company_name VARCHAR NOT NULL DEFAULT 'Core3 Demo Company',
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        UNIQUE(name, company_name)
      );
      CREATE INDEX IF NOT EXISTS idx_inventory_package_types_order
        ON inventory_package_types(sequence, name, id);
      INSERT INTO inventory_package_types
        (id, sequence, name, package_use, barcode, packaging_length, width, height, base_weight, max_weight, has_quants, route_count, company_name)
      VALUES
        ('package-type-pallet', 10, 'Pallet', 'reusable', 'PACK-PALLET', 120, 80, 15, 15, 1000, TRUE, 1, 'Core3 Demo Company'),
        ('package-type-box', 20, 'Box', 'reusable', 'PACK-BOX', 40, 30, 20, 1.5, 25, FALSE, 0, 'Core3 Demo Company'),
        ('package-type-disposable', 30, 'Shipping Box', 'disposable', 'PACK-SHIP', 30, 20, 15, 0.3, 10, FALSE, 0, 'My Company (San Francisco)'),
        ('package-type-shared', 40, 'Shared Tote', 'reusable', 'PACK-SHARED', 60, 40, 35, 2, 80, FALSE, 0, 'Shared'),
        ('package-type-empty', 90, 'QA Empty Package Type', 'disposable', 'PACK-QA-EMPTY', 10, 10, 10, 0, 5, FALSE, 0, 'Core3 Demo Company')
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_package_types WHERE id IN ('package-type-pallet', 'package-type-box', 'package-type-disposable', 'package-type-shared', 'package-type-empty');
      DROP TABLE IF EXISTS inventory_package_types;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
database: duckdb
