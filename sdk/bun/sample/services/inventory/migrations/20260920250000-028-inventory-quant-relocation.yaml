version: 0.0.28
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS inventory_quant_relocations (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        quant_id VARCHAR NOT NULL, product_id VARCHAR, product_name VARCHAR NOT NULL, lot_serial_number VARCHAR,
        source_location_id VARCHAR NOT NULL, destination_location_id VARCHAR NOT NULL,
        quantity DECIMAL(18,3) NOT NULL, unit_name VARCHAR NOT NULL,
        message VARCHAR, company_name VARCHAR NOT NULL, relocated_by VARCHAR NOT NULL,
        relocated_at TIMESTAMP NOT NULL
      );
      CREATE INDEX IF NOT EXISTS idx_inventory_quant_relocations_quant ON inventory_quant_relocations(quant_id, relocated_at DESC);
