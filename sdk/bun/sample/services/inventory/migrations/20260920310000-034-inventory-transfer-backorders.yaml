version: 0.0.34
kind: data
type:
  postgres:
    up: |
      ALTER TABLE inventory_pickings ADD COLUMN IF NOT EXISTS backorder_of_id VARCHAR;
      CREATE TABLE IF NOT EXISTS inventory_transfer_backorders (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        source_picking_id VARCHAR NOT NULL,
        backorder_picking_id VARCHAR,
        company_name VARCHAR NOT NULL,
        decision VARCHAR NOT NULL,
        processed_by VARCHAR NOT NULL,
        processed_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00',
        state VARCHAR NOT NULL,
        UNIQUE(source_picking_id, id)
      );
      CREATE INDEX IF NOT EXISTS inventory_transfer_backorders_source_idx
        ON inventory_transfer_backorders(source_picking_id, processed_at, id);
      INSERT INTO inventory_pickings(id, operation_type_id, name, contact_name, scheduled_date, source_document, company_name, source_location_id, destination_location_id, state)
      VALUES ('delivery-backorder-0001', 'operation-deliveries', 'WH/OUT/BACKORDER/0001', 'Core3 Demo Customer', DATE '2026-01-15', 'SO/BACKORDER/0001', 'Core3 Demo Company', 'location-stock', 'location-customer', 'Ready')
      ON CONFLICT(id) DO NOTHING;
      INSERT INTO inventory_picking_moves(id, picking_id, product_name, quantity, done_quantity)
      VALUES ('delivery-backorder-0001-move-001', 'delivery-backorder-0001', '[E-COM08] Storage Box', 6, 2)
      ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM inventory_transfer_backorders WHERE source_picking_id = 'delivery-backorder-0001';
      DELETE FROM inventory_picking_moves WHERE picking_id = 'delivery-backorder-0001' OR picking_id LIKE 'backorder-delivery-backorder-0001-%';
      DELETE FROM inventory_pickings WHERE id = 'delivery-backorder-0001' OR id LIKE 'backorder-delivery-backorder-0001-%';
      DROP TABLE IF EXISTS inventory_transfer_backorders;
      ALTER TABLE inventory_pickings DROP COLUMN IF EXISTS backorder_of_id;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
