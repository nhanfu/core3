title: All Transfers
page: { id: transfer-all, route: /inventory/transfer/all, breadcrumb: [Supply Chain, Inventory, Operations, Transfers, All Transfers], auth: { require: [inventory.read] } }
components:
  - type: StatRow
    source: inventory_transfer_all_queue_context
    title: All Transfers
    stats:
      - { label: Queue, field: title }
      - { label: Transfers, field: transfer_count }
      - { label: Company, field: company_name }
  - type: ListView
    variant: odoo
    source: inventory_transfer_all_transfers
    header_actions:
      - { id: refresh_inventory_transfer_all_queue, label: Refresh, variant: secondary, permission: inventory.read }
    search: { label: Search transfers, placeholder: 'Search references, contacts, or source documents...' }
    filters:
      - { field: state, label: Status, options: [{ id: Draft, label: Draft }, { id: Waiting, label: Waiting }, { id: Ready, label: Ready }, { id: Done, label: Done }, { id: Cancelled, label: Cancelled }] }
      - { field: operation_kind, label: Operation, options: [{ id: receipt, label: Receipts }, { id: delivery, label: Deliveries }, { id: internal, label: Internal }] }
    group_by:
      - { field: operation_type_name, label: Operation Type }
      - { field: state, label: Status }
      - { field: scheduled_date, label: Scheduled Date }
      - { field: company_name, label: Company }
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: kanban
        label: Cards
        icon: dashboard
        mobile: true
        group_by: operation_type_name
        card:
          title: name
          subtitle: operation_type_name
          fields:
            - { field: scheduled_date, label: Scheduled Date }
            - { field: state, label: Status }
            - { field: move_count, label: Operations }
    columns:
      - { field: name, label: Reference, type: PrimaryEntityCell, mobile: true, sortable: true }
      - { field: operation_type_name, label: Operation Type, mobile: true }
      - { field: contact_name, label: Contact, mobile: false }
      - { field: scheduled_date, label: Scheduled Date, mobile: true, sortable: true }
      - { field: source_document, label: Source Document, mobile: false }
      - { field: move_count, label: Operations, mobile: true }
      - { field: state, label: Status, type: StatusChip, mobile: true }
      - { field: company_name, label: Company, mobile: false }
    page_size: 50
    row_key: id
    selectable: false
    row_open_action: view_inventory_all_transfer
    row_double_click_action: view_inventory_all_transfer
    empty_state: { title: No transfers, description: 'Receipts, deliveries, and internal transfers will appear here.' }
