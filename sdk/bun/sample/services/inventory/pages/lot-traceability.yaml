title: Lot Traceability
page: { id: lot-traceability, route: /lots/traceability, breadcrumb: [Supply Chain, Inventory, Products, Lots / Serial Numbers, Traceability], auth: { require: [inventory.tracking] } }
components:
  - type: StatRow
    source: inventory_lot_traceability_context
    title: Traceability Report
    stats:
      - { label: Lot/Serial Number, field: lot_name }
      - { label: Product, field: product_name }
      - { label: Lines, field: line_count }
  - type: ListView
    variant: odoo
    source: inventory_lot_traceability_lines
    header_actions:
      - { id: print_inventory_lot_traceability, label: Print, variant: secondary, permission: inventory.tracking }
    columns:
      - { field: reference, label: Reference, type: PrimaryEntityCell, sortable: true }
      - { field: product_name, label: Product }
      - { field: date, label: Date, sortable: true }
      - { field: lot_name, label: Lot/Serial Number }
      - { field: source_location, label: From }
      - { field: destination_location, label: To }
      - { field: quantity, label: Quantity, align: right }
      - { field: unit_name, label: Unit }
    page_size: 50
    row_key: id
    selectable: false
    row_actions: menu
    empty_state: { title: No traceability movements, description: This lot or serial number has no completed inventory movements. }
