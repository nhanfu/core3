title: Route
page: { id: route-detail, route: /routes/detail, breadcrumb: [Supply Chain, Inventory, Configuration, Warehouse Management, Routes, Route], auth: { require: [inventory.manage] } }
components:
  - type: OdooFormView
    source: inventory_route_detail
    title_field: name
    status_field: active
    status_badges: [{ value: true, label: Active, tone: green }, { value: false, label: Archived, tone: neutral }]
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_inventory_routes, label: Back to Routes, icon: arrow-left, permission: inventory.manage }
      - { id: edit_inventory_route, label: Edit, variant: primary, permission: inventory.manage }
      - { id: archive_inventory_route, label: Archive, variant: secondary, permission: inventory.manage, show_if: "record.active === true" }
      - { id: restore_inventory_route, label: Restore, variant: secondary, permission: inventory.manage, show_if: "record.active === false" }
      - { id: delete_inventory_route, label: Delete, variant: danger, permission: inventory.manage }
    group_columns: 2
    groups:
      - title: Route
        wide: true
        fields:
          - { field: name, label: Route }
          - { field: sequence_number, label: Sequence, type: number }
          - { field: company_name, label: Company }
          - { field: warehouse_name, label: Warehouse }
      - title: Applicable On
        fields:
          - { field: product_selectable, label: Products, type: checkbox }
          - { field: product_categ_selectable, label: Product Categories, type: checkbox }
          - { field: warehouse_selectable, label: Warehouses, type: checkbox }
          - { field: package_type_selectable, label: Package Type, type: checkbox }
    stat_buttons: [{ id: view_inventory_route_rules, label: Rules, icon: list, value_field: rule_count }]
  - type: ListView
    variant: odoo
    source: inventory_route_rules
    columns:
      - { field: sequence_number, label: Sequence }
      - { field: action, label: Action, type: StatusChip }
      - { field: source_location_name, label: Source Location }
      - { field: destination_location_name, label: Destination Location }
      - { field: company_name, label: Company }
    row_key: id
    page_size: 20
