title: To Do Transfers
page: { id: transfer-ready-queue, route: /inventory/transfer/ready, breadcrumb: [Supply Chain, Inventory, Operations, Transfers, To Do], auth: { require: [inventory.read] } }
components:
  - type: StatRow
    source: inventory_transfer_ready_queue_context
    title: To Do
    stats:
      - { label: Queue, field: title }
      - { label: Ready Transfers, field: transfer_count }
      - { label: Company, field: company_name }
  - type: ListView
    variant: odoo
    source: inventory_transfer_ready_transfers
    header_actions:
      - { id: refresh_inventory_transfer_ready_queue, label: Refresh, variant: secondary, permission: inventory.read }
    search: { label: Search ready transfers, placeholder: 'Search references, contacts, or source documents...' }
    filters:
      - { field: operation_kind, label: Operation, options: [{ id: receipt, label: Receipts }, { id: delivery, label: Deliveries }, { id: internal, label: Internal }] }
    group_by:
      - { field: operation_type_name, label: Operation Type }
      - { field: scheduled_date, label: Scheduled Date }
      - { field: company_name, label: Company }
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: kanban
        label: Cards
        icon: dashboard
        mobile: true
        group_by: operation_type_name
        card:
          title: name
          subtitle: contact_name
          fields:
            - { field: scheduled_date, label: Scheduled Date }
            - { field: move_count, label: Operations }
    columns:
      - { field: name, label: Reference, type: PrimaryEntityCell, mobile: true, sortable: true }
      - { field: operation_type_name, label: Operation Type, mobile: true }
      - { field: contact_name, label: Contact, mobile: false }
      - { field: scheduled_date, label: Scheduled Date, mobile: true, sortable: true }
      - { field: source_document, label: Source Document, mobile: false }
      - { field: move_count, label: Operations, mobile: true }
      - { field: company_name, label: Company, mobile: false }
      - { field: state, label: Status, type: StatusChip, mobile: true }
    page_size: 50
    row_key: id
    selectable: false
    row_open_action: view_inventory_ready_transfer
    row_double_click_action: view_inventory_ready_transfer
    empty_state: { title: No ready transfers, description: Transfers available to process will appear here. }
