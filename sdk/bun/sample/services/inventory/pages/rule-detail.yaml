title: Rule
page: { id: rule-detail, route: /rules/detail, breadcrumb: [Supply Chain, Inventory, Configuration, Warehouse Management, Rules, Rule], auth: { require: [inventory.multi_location] } }
components:
  - type: OdooFormView
    source: inventory_rule_detail
    title_field: name
    status_field: active
    status_badges: [{ value: true, label: Active, tone: green }, { value: false, label: Archived, tone: neutral }]
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_inventory_rules, label: Back to Rules, icon: arrow-left, permission: inventory.multi_location }
      - { id: edit_inventory_rule, label: Edit, variant: primary, permission: inventory.manage }
      - { id: archive_inventory_rule, label: Archive, variant: secondary, permission: inventory.manage, show_if: "record.active === true" }
      - { id: restore_inventory_rule, label: Restore, variant: secondary, permission: inventory.manage, show_if: "record.active === false" }
      - { id: delete_inventory_rule, label: Delete, variant: danger, permission: inventory.manage }
    group_columns: 2
    groups:
      - title: Rule
        wide: true
        fields:
          - { field: name, label: Rule }
          - { field: action, label: Action }
          - { field: route_name, label: Route }
          - { field: sequence_number, label: Sequence, type: number }
      - title: Locations
        fields:
          - { field: source_location_name, label: Source Location }
          - { field: destination_location_name, label: Destination Location }
          - { field: picking_type_name, label: Operation Type }
      - title: Options
        fields:
          - { field: procure_method, label: Supply Method }
          - { field: auto, label: Trigger }
          - { field: delay_days, label: Delay (days), type: number }
          - { field: company_name, label: Company }
