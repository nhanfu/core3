title: Warehouse
page: { id: warehouse-detail, route: /warehouses/detail, breadcrumb: [Supply Chain, Inventory, Configuration, Warehouses, Warehouse], auth: { require: [inventory.read] } }
components:
  - type: OdooFormView
    source: inventory_warehouse_detail
    title_field: name
    subtitle_field: code
    status_field: state
    status_badges: [{ value: Active, label: Active, tone: green }, { value: Archived, label: Archived, tone: neutral }]
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_inventory_warehouses, label: Back to Warehouses, icon: arrow-left, permission: inventory.read }
      - { id: edit_inventory_warehouse, label: Edit, variant: primary, permission: inventory.manage }
      - { id: archive_inventory_warehouse, label: Archive, variant: secondary, permission: inventory.manage, show_if: "record.state === 'Active'" }
      - { id: restore_inventory_warehouse, label: Restore, variant: secondary, permission: inventory.manage, show_if: "record.state === 'Archived'" }
      - { id: delete_inventory_warehouse, label: Delete, variant: danger, permission: inventory.manage }
    group_columns: 2
    groups:
      - title: Warehouse
        fields:
          - { field: name, label: Warehouse }
          - { field: code, label: Short Name }
          - { field: company_name, label: Company }
          - { field: address, label: Address }
      - title: Warehouse Configuration
        fields:
          - { field: reception_steps, label: Incoming Shipments }
          - { field: delivery_steps, label: Outgoing Shipments }
          - { field: location_count, label: Active Locations }
          - { field: resupply_count, label: Resupply From }
  - type: ListView
    variant: odoo
    source: inventory_warehouse_resupply_warehouses
    header_actions:
      - { id: add_inventory_warehouse_resupply, label: Add warehouse, variant: primary, permission: inventory.manage }
    columns:
      - { field: supplier_name, label: Warehouse, type: PrimaryEntityCell, mobile: true }
      - { field: supplier_code, label: Short Name, mobile: true }
      - { field: company_name, label: Company, mobile: false }
      - field: actions
        label: ''
        sortable: false
        actions:
          - { id: remove_inventory_warehouse_resupply, label: Remove, icon: trash, variant: danger, permission: inventory.manage }
    row_key: id
    row_actions: buttons
    selectable: false
    empty_state: { title: No resupply warehouses, description: Select another warehouse in this company to resupply the current warehouse. }
