title: Putaway Rule
page: { id: putaway-rule-detail, route: /putaway-rules/detail, breadcrumb: [Supply Chain, Inventory, Configuration, Warehouse Management, Putaway Rules, Putaway Rule], auth: { require: [inventory.multi_location] } }
components:
  - type: OdooFormView
    source: inventory_putaway_rule_detail
    title_field: product_name
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_inventory_putaway_rules, label: Back to Putaway Rules, icon: arrow-left, permission: inventory.multi_location }
      - { id: edit_inventory_putaway_rule, label: Edit, variant: primary, permission: inventory.manage }
      - { id: archive_inventory_putaway_rule, label: Archive, variant: secondary, permission: inventory.manage, show_if: "record.active === true" }
      - { id: restore_inventory_putaway_rule, label: Restore, variant: secondary, permission: inventory.manage, show_if: "record.active === false" }
      - { id: delete_inventory_putaway_rule, label: Delete, variant: danger, permission: inventory.manage }
    group_columns: 2
    groups:
      - title: Putaway Rule
        wide: true
        fields:
          - { field: sequence_number, label: Priority, type: number }
          - { field: product_name, label: Product }
          - { field: category_name, label: Product Category }
          - { field: location_in_name, label: When product arrives in }
          - { field: location_out_name, label: Store to }
      - title: Strategy
        fields:
          - { field: sublocation, label: Sublocation }
          - { field: storage_category_name, label: Having Category }
          - { field: package_type_name, label: Package Type }
          - { field: company_name, label: Company }
