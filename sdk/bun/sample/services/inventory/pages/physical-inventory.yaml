title: Physical Inventory
page: { id: physical-inventory, route: /physical-inventory, breadcrumb: [Supply Chain, Inventory, Operations, Physical Inventory], auth: { require: [inventory.read] } }
components:
  - type: ListView
    variant: odoo
    source: inventory_physical_inventory
    view_navigation: tabs
    create_action: create_inventory_quant
    create_label: New
    header_actions:
      - { id: apply_all_inventory_quantities, label: Apply All, variant: primary, permission: inventory.write }
    selectable: true
    bulk_actions:
      - { id: reset_inventory_counts, label: Clear, permission: inventory.manage }
      - { id: request_inventory_count, label: Request a Count, permission: inventory.manage }
      - { id: resolve_inventory_conflict, label: Resolve Conflict, permission: inventory.write }
    search: { label: Search physical inventory, placeholder: 'Search products, lots, or locations...' }
    filters:
      - field: count_filter
        label: Filters
        options:
          - { id: my_count, label: My Counts }
          - { id: internal, label: Internal Locations }
          - { id: transit, label: Transit Locations }
          - { id: to_count, label: To Count }
          - { id: to_apply, label: To Apply }
          - { id: conflicts, label: Conflicts }
          - { id: negative, label: Negative Stock }
    group_by:
      - { field: product_name, label: Product }
      - { field: location_name, label: Location }
      - { field: inventory_user, label: User }
    columns:
      - { field: product_name, label: Product, type: PrimaryEntityCell, sortable: true }
      - { field: lot_serial_number, label: Lot/Serial Number }
      - { field: scheduled, label: Scheduled }
      - { field: inventory_user, label: User }
      - { field: on_hand, label: On Hand, align: right }
      - { field: counted, label: Counted, align: right }
      - { field: difference, label: Difference, align: right }
      - { field: unit_name, label: Unit }
      - field: actions
        label: Actions
        sortable: false
        actions:
          - { id: set_inventory_quantity, label: Set to On Hand, icon: check, variant: secondary, show_if: "row.inventory_quantity_set !== true" }
          - { id: set_inventory_quantity_zero, label: Set to 0, icon: x, variant: danger, show_if: "row.inventory_quantity_set !== true" }
          - { id: apply_inventory_quantity, label: Apply, icon: save, variant: primary, show_if: "row.inventory_quantity_set === true" }
          - { id: clear_inventory_quantity, label: Clear, icon: x, variant: danger, show_if: "row.inventory_quantity_set === true" }
          - { id: view_inventory_history, label: History, icon: history }
    page_size: 50
    row_key: id
    row_actions: menu
    selectable: true
    column_chooser: true
    empty_state: { title: Your stock is currently empty, description: Press New to define the quantity for a product in your stock or use the Apply All action to confirm counted quantities. }
  - type: ListView
    variant: odoo
    source: inventory_count_conflicts
    columns:
      - { field: product_name, label: Product }
      - { field: location_name, label: Location }
      - { field: original_quantity, label: Original Quantity, align: right }
      - { field: counted_quantity, label: Counted Quantity, align: right }
      - { field: current_quantity, label: Current Quantity, align: right }
      - { field: state, label: State }
      - { field: decision, label: Resolution }
      - { field: resolved_by, label: Resolved by }
    page_size: 10
    row_key: id
    selectable: false
    empty_state: { title: No inventory conflicts, description: Conflicts caused by stock moves during counting will appear here. }
