title: Transfer Packages
page: { id: transfer-packages, route: /inventory/transfer/packages, breadcrumb: [Supply Chain, Inventory, Operations, Transfers, Transfer, Packages], auth: { require: [inventory.tracking] } }
components:
  - type: StatRow
    source: inventory_transfer_package_context
    title: Packages
    stats:
      - { label: Transfer, field: transfer_name }
      - { label: State, field: state }
      - { label: Packages, field: package_count }
      - { label: Company, field: company_name }
  - type: ListView
    variant: odoo
    source: inventory_transfer_packages
    header_actions:
      - { id: back_to_inventory_transfer_from_packages, label: Back to Transfer, variant: secondary, permission: inventory.tracking }
    search: { label: Search packages, placeholder: 'Search package names, types, or locations...' }
    filters:
      - { field: main_packages, label: Main Packages, options: [{ id: main, label: Main Packages }] }
    group_by:
      - { field: location_name, label: Location }
      - { field: package_type_name, label: Package Type }
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: card
        label: Cards
        icon: grid
        mobile: true
        card:
          title: name
          subtitle: package_type_name
          fields:
            - { field: location_name, label: Location }
            - { field: move_count, label: Move Lines }
    columns:
      - { field: name, label: Package, type: PrimaryEntityCell, mobile: true, sortable: true }
      - { field: package_type_name, label: Package Type, mobile: true }
      - { field: location_name, label: Location, mobile: true }
      - { field: parent_package_name, label: Container, mobile: false }
      - { field: owner_name, label: Owner, mobile: false }
      - { field: company_name, label: Company, mobile: false }
      - { field: move_count, label: Move Lines, mobile: false }
    page_size: 50
    row_key: id
    selectable: false
    row_open_action: view_inventory_transfer_package
    row_double_click_action: view_inventory_transfer_package
    empty_state: { title: No packages on this transfer, description: Packages linked to this open transfer will appear here. }
