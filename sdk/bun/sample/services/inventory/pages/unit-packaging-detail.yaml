title: Unit & Packaging
page: { id: unit-packaging-detail, route: /units-packagings/detail, breadcrumb: [Supply Chain, Inventory, Configuration, Products, Units & Packagings], auth: { require: [inventory.read] } }
components:
  - type: OdooFormView
    source: inventory_unit_packaging_detail
    title_field: name
    status_field: active
    status_badges: [{ value: true, label: Active, tone: green }, { value: false, label: Archived, tone: neutral }]
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_inventory_units_packagings, label: Back to Units & Packagings, icon: arrow-left, permission: inventory.read }
      - { id: edit_inventory_unit_packaging, label: Edit, variant: primary, permission: inventory.manage }
      - { id: archive_inventory_unit_packaging, label: Archive, variant: secondary, permission: inventory.manage, show_if: "record.active === true" }
      - { id: restore_inventory_unit_packaging, label: Restore, variant: secondary, permission: inventory.manage, show_if: "record.active === false" }
      - { id: delete_inventory_unit_packaging, label: Delete, icon: trash, variant: danger, permission: inventory.manage, show_if: "record.usage_count === 0 && record.is_reference_unit === false" }
    group_columns: 2
    groups:
      - title: Unit of Measure
        fields:
          - { field: name, label: Unit Name }
          - { field: relative_factor, label: Quantity, type: Number }
          - { field: reference_unit_name, label: Reference Unit }
          - { field: sequence, label: Sequence, type: Number }
          - { field: company_name, label: Company }
          - { field: usage_count, label: Used By, type: Number }
