title: Moves History
page: { id: moves, route: /moves, breadcrumb: [Supply Chain, Inventory, Reporting, Moves History], auth: { require: [inventory.read] } }
components:
  - type: ListView
    variant: odoo
    source: inventory_move_lines
    default_filters: { state: done }
    search: { label: Search stock moves, placeholder: 'Search products, transfers, locations, or lots...' }
    filters:
      - { field: state, label: Status, options_source: inventory_move_history_states }
      - { field: movement_type, label: Operation, options_source: inventory_move_history_types }
    group_by:
      - { field: product_name, label: Product }
      - { field: state, label: Status }
      - { field: date, label: Date }
      - { field: reference, label: Transfers }
      - { field: source_location, label: Location }
      - { field: product_category_name, label: Category }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: true
        group_by: movement_type
        card: { title: reference, subtitle: product_name, fields: [{ field: date, label: Date }, { field: quantity, label: Quantity }, { field: unit_name, label: Unit }, { field: state, label: Status }] }
      - id: pivot
        label: Pivot
        icon: pivot
        mobile: false
        pivot:
          fields:
            - { field: product_category_name, column: Category }
            - { field: product_name, column: Product }
            - { field: date, column: Date, type: date }
            - { field: movement_type, column: Operation }
            - { field: quantity_product_uom, column: Quantity }
            - { field: state, column: Status }
          default:
            rows: [date]
            columns: [product_category_name]
            measures:
              - { field: quantity_product_uom, aggregate: sum, column: Quantity }
              - { field: quantity_product_uom, aggregate: count, column: Moves }
          date_ranges: { date: month }
      - { id: form, label: Form, icon: form, mobile: false }
    columns:
      - { field: date, label: Date, mobile: true, sortable: true }
      - { field: reference, label: Reference, type: PrimaryEntityCell, mobile: true, mobile_secondary: product_name, sortable: true }
      - { field: product_name, label: Product, mobile: false, sortable: true }
      - { field: lot_serial_number, label: Lot/Serial Number, optional: hide, mobile: false }
      - { field: source_location, label: From, mobile: false }
      - { field: destination_location, label: To, mobile: false }
      - { field: quantity, label: Quantity, align: right, mobile: true }
      - { field: unit_name, label: Unit, mobile: false }
      - { field: state, label: Status, type: StatusChip, mobile: true }
      - { field: done_by, label: Done By, optional: hide, mobile: false }
    page_size: 50
    row_key: id
    row_open_action: view_inventory_move_line
    row_double_click_action: view_inventory_move_line
    row_actions: menu
    form_view: { page: apps/services/inventory/pages/move-line-detail.yaml, side_panel: false }
    empty_state: { title: No product moves yet, description: This report gives you the full traceability of inventory operations. Adjust the filters to find past movements. }
