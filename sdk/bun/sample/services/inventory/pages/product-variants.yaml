title: Product Variants
page: { id: product-variants, route: /product-variants, breadcrumb: [Supply Chain, Inventory, Products, Product Variants], auth: { require: [inventory.read] } }
components:
  - type: ListView
    variant: odoo
    source: inventory_product_variants
    create_action: create_inventory_product_variant
    create_label: New
    search: { label: Product Variants, placeholder: 'Search references, names, templates...' }
    filters:
      - { field: is_favorite, label: Favorites, options: [{ id: favorite, label: Favorites }] }
      - { field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }, { id: all, label: All }] }
      - { field: product_type, label: Product Type, options_source: inventory_product_variant_types }
      - { field: tracking, label: Tracking, options_source: inventory_product_variant_tracking }
    group_by:
      - { field: category_name, label: Category }
      - { field: template_name, label: Product Template }
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: kanban
        label: Kanban
        icon: grid
        mobile: true
        group_by: category_name
        card:
          title: name
          subtitle: default_code
          fields:
            - { field: variant_values, label: Variant Values }
            - { field: on_hand, label: On Hand }
            - { field: forecasted, label: Forecasted }
            - { field: tracking, label: Tracking }
    columns:
      - { field: default_code, label: Internal Reference, sortable: true, optional: show }
      - { field: name, label: Product Variant, type: PrimaryEntityCell, sortable: true }
      - { field: variant_values, label: Variant Values }
      - { field: category_name, label: Category, optional: hide }
      - { field: sales_price, label: Sales Price, align: right, sortable: true }
      - { field: standard_price, label: Cost, align: right, optional: hide }
      - { field: on_hand, label: On Hand, align: right, sortable: true }
      - { field: forecasted, label: Forecasted, align: right, sortable: true }
      - { field: unit_name, label: Unit, optional: hide }
      - { field: active, label: Active, type: BooleanToggle, optional: hide }
      - { field: company_name, label: Company, optional: hide }
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_inventory_product_variant
    row_double_click_action: view_inventory_product_variant
    form_view: { page: apps/services/inventory/pages/product-variant-detail.yaml, side_panel: false }
    empty_state: { title: No product variants found, description: Create a variant or adjust your search and status filters. }
