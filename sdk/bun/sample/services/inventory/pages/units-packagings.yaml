title: Units & Packagings
page: { id: units-packagings, route: /units-packagings, breadcrumb: [Supply Chain, Inventory, Configuration, Products, Units & Packagings], auth: { require: [inventory.read] } }
components:
  - type: ListView
    variant: odoo
    source: inventory_units_packagings
    responsive_card: true
    create_action: create_inventory_unit_packaging
    create_label: New
    search: { label: Search units and packagings, placeholder: 'Search units or reference units...' }
    filters:
      - { field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }, { id: all, label: All }] }
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: card
        label: Cards
        icon: grid
        mobile: true
        card:
          title: name
          subtitle: reference_unit_name
          fields: [{ field: relative_factor_display, label: Contains }, { field: sequence, label: Sequence }, { field: active, label: Active }]
    columns:
      - { field: sequence, label: ' ', type: HandleCell, mobile: false }
      - { field: name, label: Unit Name, type: PrimaryEntityCell, sortable: true }
      - { field: relative_factor_display, label: Contains, align: right }
      - { field: reference_unit_name, label: Reference Unit }
      - { field: company_name, label: Company, optional: hide }
      - { field: active, label: Active, type: BooleanToggle, optional: hide }
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_inventory_unit_packaging
    row_double_click_action: view_inventory_unit_packaging
    form_view: { page: apps/services/inventory/pages/unit-packaging-detail.yaml, side_panel: false }
    empty_state: { title: No units or packagings, description: Create a unit of measure or packaging to use with Inventory products. }
