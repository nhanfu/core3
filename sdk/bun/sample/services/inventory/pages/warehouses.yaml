title: Warehouses
page: { id: warehouses, route: /warehouses, breadcrumb: [Supply Chain, Inventory, Configuration, Warehouses], auth: { require: [inventory.read] } }
components:
  - type: ListView
    variant: odoo
    source: inventory_warehouses
    create_action: create_inventory_warehouse
    create_label: New warehouse
    search: { label: Search warehouses, placeholder: Search warehouses or codes... }
    filters:
      - { field: state, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }, { id: all, label: All }] }
    views:
      - { id: list, label: List, icon: table }
    columns:
      - { field: name, label: Warehouse, type: PrimaryEntityCell }
      - { field: code, label: Code }
      - { field: address, label: Address }
      - { field: company_name, label: Company, optional: hide }
      - { field: location_count, label: Locations, align: right, optional: hide }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_inventory_warehouse
    row_double_click_action: view_inventory_warehouse
    form_view: { page: apps/services/inventory/pages/warehouse-detail.yaml, side_panel: false }
    empty_state: { title: No warehouses found, description: Define a warehouse or adjust your search and status filter. }
