title: Locations
page: { id: locations, route: /locations, breadcrumb: [Supply Chain, Inventory, Configuration, Locations], auth: { require: [inventory.read] } }
components:
  - type: ListView
    variant: odoo
    source: inventory_locations
    create_action: create_inventory_location
    create_label: New
    search: { label: Stock Locations, placeholder: Search locations... }
    filters:
      - { field: usage, label: Location Type, options_source: inventory_location_usage_options }
      - { field: warehouse_id, label: Warehouse, options_source: inventory_location_warehouses }
      - { field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }, { id: all, label: All }] }
      - { field: is_empty, label: Stock, options: [{ id: empty, label: Empty Locations }, { id: occupied, label: Occupied Locations }] }
    group_by:
      - { field: warehouse_name, label: Warehouse }
      - { field: usage, label: Location Type }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: usage
        card: { title: complete_name, subtitle: usage, fields: [{ field: warehouse_name, label: Warehouse }, { field: company_name, label: Company }, { field: active, label: Active }] }
      - id: card
        label: Cards
        icon: grid
        card: { title: complete_name, subtitle: usage, fields: [{ field: warehouse_name, label: Warehouse }, { field: company_name, label: Company }, { field: active, label: Active }] }
      - { id: form, label: Form, icon: edit }
    form_view: { page: apps/services/inventory/pages/location-detail.yaml, side_panel: true }
    row_key: id
    row_open_action: edit_inventory_location
    row_double_click_action: edit_inventory_location
    row_actions: menu
    empty_state: { title: No locations found, description: Add a location or adjust your search and filters. }
    columns:
      - { field: complete_name, label: Location, type: PrimaryEntityCell }
      - { field: usage, label: Location Type, type: StatusChip }
      - { field: company_name, label: Company }
      - { field: warehouse_name, label: Warehouse, optional: hide }
      - { field: is_empty, label: Empty, type: BooleanToggle, optional: hide }
      - { field: active, label: Active, type: BooleanToggle, optional: hide }
      - { field: id, label: ' ', sortable: false, actions: [{ id: edit_inventory_location, label: Edit, icon: edit }, { id: archive_inventory_location, label: Archive, icon: archive }, { id: delete_inventory_location, label: Delete, icon: trash, variant: danger }] }
