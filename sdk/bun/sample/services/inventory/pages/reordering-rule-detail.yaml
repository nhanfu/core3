title: Reordering Rule
page: { id: reordering-rule-detail, route: /reordering-rules/detail, breadcrumb: [Supply Chain, Inventory, Configuration, Reordering Rules, Reordering Rule], auth: { require: [inventory.read] } }
components:
  - type: OdooFormView
    source: inventory_reordering_rule_detail
    title_field: rule_name
    status_field: active
    status_badges: [{ value: true, label: Active, tone: green }, { value: false, label: Archived, tone: neutral }]
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: back_to_inventory_reordering_rules, label: Back to Reordering Rules, icon: arrow-left, permission: inventory.read }
      - { id: edit_inventory_reordering_rule, label: Edit, variant: primary, permission: inventory.manage }
      - { id: archive_inventory_reordering_rule, label: Archive, variant: secondary, permission: inventory.manage, show_if: "record.active === true" }
      - { id: restore_inventory_reordering_rule, label: Restore, variant: secondary, permission: inventory.manage, show_if: "record.active === false" }
      - { id: delete_inventory_reordering_rule, label: Delete, variant: danger, permission: inventory.manage, show_if: "record.demand_count === 0 && record.replenishment_info_count === 0" }
    group_columns: 2
    groups:
      - title: Reordering Rule
        wide: true
        fields:
          - { field: rule_name, label: Reordering Rule, readonly: true }
          - { field: product_name, label: Product, type: select, options_source: inventory_reordering_rule_detail_products, required: true }
          - { field: location_name, label: Location, type: select, options_source: inventory_reordering_rule_detail_locations, required: true }
          - { field: warehouse_name, label: Warehouse, type: select, options_source: inventory_reordering_rule_detail_warehouses, required: true }
          - { field: company_name, label: Company, readonly: true }
      - title: Quantities
        fields:
          - { field: min_qty, label: Minimum Quantity, type: number, min: 0 }
          - { field: max_qty, label: Maximum Quantity, type: number, min: 0 }
          - { field: unit_name, label: Unit, readonly: true }
          - { field: on_hand, label: On Hand, type: number, readonly: true }
          - { field: forecast, label: Forecast, type: number, readonly: true }
      - title: Procurement
        fields:
          - { field: trigger, label: Trigger, type: select, options: [{ value: auto, label: Automatic }, { value: manual, label: Manual }] }
          - { field: route, label: Route, type: select, options: [{ value: Buy, label: Buy }, { value: Manufacture, label: Manufacture }, { value: MTO, label: Make To Order }] }
          - { field: lead_days, label: Lead Time (days), type: number, readonly: true }
          - { field: to_order, label: To Order, type: number, readonly: true }
          - { field: state, label: State, readonly: true }
