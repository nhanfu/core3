title: Scrap Order
page: { id: inventory-scrap-detail, route: /inventory/scraps/detail, breadcrumb: [Inventory, Operations, Adjustments, Scrap Orders], auth: { require: [inventory.read] } }
components:
  - type: OdooFormView
    source: inventory_scrap_order_detail
    title_field: name
    subtitle_field: product_name
    status_field: state
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit, workflowStatus: Status }
    header_actions:
      - { id: back_to_inventory_scraps, label: Back to Scrap Orders, icon: arrow-left, permission: inventory.read }
      - { id: validate_inventory_scrap, label: Validate, variant: primary, permission: inventory.write, show_if: "record.state === 'Draft'" }
      - { id: edit_inventory_scrap, label: Edit, variant: secondary, permission: inventory.write, show_if: "record.state === 'Draft'" }
      - { id: delete_inventory_scrap_detail, label: Delete, variant: danger, permission: inventory.write, show_if: "record.state === 'Draft'", confirm: Delete this Scrap Order? }
    statusbar: [{ value: Draft, label: Draft }, { value: Done, label: Done }]
    status_colors: { Draft: neutral, Done: green }
    group_columns: 2
    groups:
      - title: Scrap
        fields: [{ field: name, label: Reference }, { field: date_done, label: Date }, { field: product_name, label: Product }, { field: scrap_qty, label: Quantity }, { field: product_uom, label: Unit }, { field: lot_name, label: Lot/Serial Number }, { field: should_replenish, label: Replenish Quantities }]
      - title: Locations
        fields: [{ field: source_location, label: Source Location }, { field: scrap_location, label: Scrap Location }, { field: package_name, label: Package }, { field: owner_name, label: Owner }, { field: company_name, label: Company }, { field: origin, label: Source Document }, { field: picking_name, label: Picking }]
    notebook: { active: details, tabs: [{ id: details, label: Additional Information, groups: [{ title: Notes, fields: [{ field: note, label: Notes }, { field: row_version, label: Revision }] }] }] }
page: { id: inventory-scrap-detail }
