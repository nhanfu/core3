title: Transfer
page: { id: transfer-detail, route: /inventory/transfer/detail, breadcrumb: [Supply Chain, Inventory, Operations, Transfers, Transfer], auth: { require: [inventory.read] } }
components:
  - type: OdooFormView
    source: inventory_transfer_detail
    attachment_source: inventory_transfer_attachments
    attachment_panel_open: true
    attachment_label: Documents
    add_attachment_label: Add document
    no_attachments_label: No documents attached
    attachment_upload_action: upload_inventory_transfer_attachment
    attachment_download_action: download_inventory_transfer_attachment
    title_field: name
    subtitle_field: operation_type_name
    status_field: state
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    status_colors: { Ready: teal, Draft: neutral, Waiting: amber, Done: green, Cancelled: red }
    statusbar: [{ value: Draft, label: Draft }, { value: Waiting, label: Waiting }, { value: Ready, label: Ready }, { value: Done, label: Done }, { value: Cancelled, label: Cancelled }]
    header_actions:
      - { id: edit_inventory_transfer, label: Edit details, variant: secondary, permission: inventory.write }
      - { id: delete_inventory_transfer, label: Delete, variant: danger, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Draft'" }
      - { id: mark_inventory_transfer_todo, label: Mark as Todo, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Draft'" }
      - { id: check_inventory_transfer_availability, label: Check Availability, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Waiting' || state.inventory_transfer_detail.state === 'Draft'" }
      - { id: put_inventory_transfer_in_pack, label: Put in Pack, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Waiting' || state.inventory_transfer_detail.state === 'Ready'" }
      - { id: unreserve_inventory_transfer, label: Unreserve, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Ready'" }
      - { id: validate_inventory_transfer, label: Validate, variant: primary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Ready'" }
      - { id: create_inventory_backorder, label: Create Backorder, variant: primary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Ready' && state.inventory_transfer_detail.has_partial === true" }
      - { id: toggle_inventory_transfer_lock, label: Lock / Unlock, variant: secondary, permission: inventory.manage, show_if: "state.inventory_transfer_detail.state !== 'Cancelled'" }
      - { id: print_inventory_transfer_labels, label: Labels, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state !== 'Cancelled'" }
      - { id: print_inventory_transfer_operations, label: Print, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Ready'" }
      - { id: print_inventory_transfer_delivery_slip, label: Print, variant: secondary, permission: inventory.read, show_if: "state.inventory_transfer_detail.state === 'Done'" }
      - { id: scrap_inventory_transfer, label: Scrap, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state !== 'Done' && state.inventory_transfer_detail.state !== 'Cancelled'" }
      - { id: return_inventory_transfer, label: Return, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state === 'Done'" }
      - { id: cancel_inventory_transfer, label: Cancel, variant: secondary, permission: inventory.write, show_if: "state.inventory_transfer_detail.state !== 'Done' && state.inventory_transfer_detail.state !== 'Cancelled'" }
    stat_buttons:
      - { id: view_inventory_transfer_detailed_operations, label: Moves, icon: list, value_field: move_count, permission: inventory.read }
    message_source: inventory_transfer_timeline
    chatter_label: Messages and activities
    message_label: Send message
    note_label: Log note
    message_action: send_inventory_transfer_message
    note_action: log_inventory_transfer_note
    message_actor_field: actor_name
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
    message_action_labels:
      inventory.transfer.created: Transfer created
      inventory.transfer.validated: Validated
      inventory.transfer.message: Message
      inventory.transfer.note: Note
      inventory.transfer.availability_checked: Availability checked
      inventory.transfer.unreserved: Unreserved
      inventory.transfer.return_created: Return created
      inventory.transfer.backorder_created: Backorder created
      inventory.transfer.backorder_skipped: No backorder
      inventory.transfer.lock_toggled: Lock state changed
      inventory.transfer.labels_printed: Labels prepared
      inventory.transfer.email_queued: Email queued
      inventory.transfer.printed: Print prepared
      inventory.transfer.scrapped: Scrap order created
    content_slot: true
    group_columns: 2
    groups:
      - title: Transfer
        fields: [{ field: name, label: Reference }, { field: operation_type_name, label: Operation Type }, { field: contact_name, label: Contact }, { field: company_name, label: Company }]
      - title: Scheduling
        fields: [{ field: scheduled_date, label: Scheduled Date }, { field: source_document, label: Source Document }, { field: source_location, label: Source Location }, { field: destination_location, label: Destination Location }, { field: product_availability, label: Product Availability }]
    notebook:
      active: operations
      tabs:
        - { id: operations, label: Operations, content_slot: true }
        - id: additional_information
          label: Additional Info
          groups:
            - title: Additional information
              fields: [{ field: operation_kind, label: Operation kind }, { field: move_count, label: Move lines }, { field: return_count, label: Returns }, { field: backorder_count, label: Backorders }, { field: is_locked, label: Locked }]
        - id: note
          label: Note
          groups:
            - title: Note
              fields: [{ field: note, label: Note, type: textarea, wide: true }]
  - type: LineItemGrid
    mount_in: previous-panel
    source: inventory_transfer_lines
    parent_source: inventory_transfer_detail
    variant: odoo_x2many
    page_size: 50
    row_key: id
    empty_state: { title: No move lines, description: Add a product to define the demand and quantity for this transfer. }
    columns:
      - { field: product_name, label: Product, width: 260 }
      - { field: demand, label: Demand, align: right, width: 120 }
      - { field: quantity, label: Quantity, align: right, width: 120 }
      - { field: reserved_quantity, label: Reserved, align: right, width: 120 }
      - { field: uom, label: Unit of Measure, width: 140 }
      - { field: availability, label: Availability, width: 150 }
  - type: ListView
    source: inventory_transfer_label_runs
    variant: odoo
    columns:
      - { field: label_type, label: Labels }
      - { field: output_format, label: Output }
      - { field: label_count, label: Quantity, align: right }
      - { field: requested_by, label: Requested by }
      - { field: created_at, label: Created at }
    page_size: 10
    row_key: id
    selectable: false
    empty_state: { title: No labels prepared, description: Use Labels to prepare Product Labels for this transfer. }
  - type: ListView
    source: inventory_transfer_email_runs
    variant: odoo
    columns:
      - { field: recipient_email, label: To }
      - { field: subject, label: Subject }
      - { field: state, label: Status }
      - { field: queued_by, label: Queued by }
      - { field: queued_at, label: Queued at }
    page_size: 10
    row_key: id
    selectable: false
    empty_state: { title: No email history, description: Messages queued from this transfer will appear here. }
  - type: ListView
    source: inventory_transfer_scrap_runs
    variant: odoo
    columns:
      - { field: product_name, label: Product }
      - { field: scrap_qty, label: Quantity, align: right }
      - { field: source_location, label: Source }
      - { field: scrap_location, label: Scrap Location }
      - { field: requested_by, label: Requested by }
      - { field: created_at, label: Created at }
    page_size: 10
    row_key: id
    selectable: false
    empty_state: { title: No scrap orders, description: Scrap orders created from this transfer will appear here. }
  - type: ListView
    source: inventory_transfer_print_runs
    variant: odoo
    columns:
      - { field: report_name, label: Report }
      - { field: output_format, label: Output }
      - { field: printed_by, label: Printed by }
      - { field: printed_at, label: Printed at }
    page_size: 10
    row_key: id
    selectable: false
    empty_state: { title: No print history, description: Printed transfer reports will appear here. }
