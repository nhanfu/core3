title: Transfer
page: { id: inventory-transfer-detail, route: /inventory/transfer/detail, breadcrumb: [Supply Chain, Inventory, Transfer], auth: { require: [inventory.read] } }
components:
  - type: OdooFormView
    source: inventory_transfer_detail
    title_field: name
    subtitle_field: operation_type_name
    status_field: state
    status_colors: { Ready: teal, Draft: neutral, Waiting: amber, Done: green, Cancelled: red }
    statusbar: [{ value: Draft, label: Draft }, { value: Waiting, label: Waiting }, { value: Ready, label: Ready }, { value: Done, label: Done }, { value: Cancelled, label: Cancelled }]
    group_columns: 2
    groups:
      - title: Transfer
        fields: [{ field: name, label: Reference }, { field: operation_type_name, label: Operation type }, { field: contact_name, label: Contact }, { field: company_name, label: Company }]
      - title: Scheduling
        fields: [{ field: scheduled_date, label: Scheduled date }, { field: source_document, label: Source document }, { field: source_location, label: Source location }, { field: destination_location, label: Destination location }]
actions: []
