title: Field Task
page: { id: field-service-task-detail, breadcrumb: [Services, Field Service, Task], auth: { require: [field-service.read] } }
datasources:
  - id: field_service_task
    permission: field-service.read
    single: true
    query: "SELECT * FROM field_service_tasks WHERE id = :id"
components:
  - type: OdooFormView
    source: field_service_task
    title_field: name
    fields:
      - { field: name, label: Task }
      - { field: customer_name, label: Customer }
      - { field: address, label: Address }
      - { field: assigned_to, label: Technician }
      - { field: description, label: Description }
      - { field: priority, label: Priority }
      - { field: scheduled_date, label: Scheduled date }
      - { field: duration_hours, label: Duration hours }
      - { field: state, label: Status, type: StatusChip }
