version: 0.0.126
kind: schema
description: durable eCommerce product page image layout policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_product_page_image_layout_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        image_layout VARCHAR NOT NULL DEFAULT 'carousel',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name),
        CHECK (image_layout IN ('carousel', 'grid'))
      );
      CREATE INDEX IF NOT EXISTS ecommerce_product_page_image_layout_company_idx
        ON ecommerce_product_page_image_layout_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_product_page_image_layout_company_idx;
      DROP TABLE IF EXISTS ecommerce_product_page_image_layout_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
