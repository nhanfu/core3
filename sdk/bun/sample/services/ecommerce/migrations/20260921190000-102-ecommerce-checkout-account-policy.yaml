version: 0.0.102
kind: schema
description: durable Website Sale checkout customer-account policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_checkout_account_policies (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        account_on_checkout VARCHAR NOT NULL DEFAULT 'optional',
        auth_signup_uninvited VARCHAR NOT NULL DEFAULT 'b2c',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (company_name),
        CHECK (account_on_checkout IN ('optional', 'disabled', 'mandatory')),
        CHECK (auth_signup_uninvited IN ('b2b', 'b2c'))
      );
      CREATE INDEX IF NOT EXISTS ecommerce_checkout_account_policies_scope_idx
        ON ecommerce_checkout_account_policies(company_name, account_on_checkout);
    down: DROP TABLE IF EXISTS ecommerce_checkout_account_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
