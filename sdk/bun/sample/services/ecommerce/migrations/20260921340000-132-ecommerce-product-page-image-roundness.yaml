version: 0.0.132
kind: schema
description: durable eCommerce product page image roundness policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_product_page_image_roundness_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        image_roundness VARCHAR NOT NULL DEFAULT 'none',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name),
        CHECK (image_roundness IN ('none', 'small', 'medium', 'big'))
      );
      CREATE INDEX IF NOT EXISTS ecommerce_product_page_image_roundness_company_idx
        ON ecommerce_product_page_image_roundness_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_product_page_image_roundness_company_idx;
      DROP TABLE IF EXISTS ecommerce_product_page_image_roundness_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
