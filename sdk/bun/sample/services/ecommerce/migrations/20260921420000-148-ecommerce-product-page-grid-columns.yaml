version: 0.0.148
kind: schema
description: durable eCommerce product page image grid columns policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_product_page_grid_columns_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        grid_columns INTEGER NOT NULL DEFAULT 2,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name),
        CHECK (grid_columns IN (1, 2, 3))
      );
      CREATE INDEX IF NOT EXISTS ecommerce_product_page_grid_columns_company_idx
        ON ecommerce_product_page_grid_columns_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_product_page_grid_columns_company_idx;
      DROP TABLE IF EXISTS ecommerce_product_page_grid_columns_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
