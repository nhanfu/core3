version: 0.0.2
kind: data
type:
  postgres:
    up: |
      INSERT INTO ecommerce_categories (id, name, sequence)
      SELECT 'ecommerce-category-demo-001', 'Hardware', 10
      WHERE NOT EXISTS (SELECT 1 FROM ecommerce_categories WHERE id = 'ecommerce-category-demo-001');
      INSERT INTO ecommerce_products (id, name, category_name, list_price, state, publish_date)
      SELECT 'ecommerce-product-demo-001', 'Core3 Gateway Router', 'Hardware', 249.00, 'Published', CURRENT_TIMESTAMP - INTERVAL '5' DAY
      WHERE NOT EXISTS (SELECT 1 FROM ecommerce_products WHERE id = 'ecommerce-product-demo-001');
      INSERT INTO ecommerce_products (id, name, category_name, list_price, state)
      SELECT 'ecommerce-product-demo-002', 'Core3 Sensor Kit', 'Hardware', 59.50, 'Unpublished'
      WHERE NOT EXISTS (SELECT 1 FROM ecommerce_products WHERE id = 'ecommerce-product-demo-002');
      INSERT INTO ecommerce_orders (id, order_ref, customer_name, website_name, cart_quantity, amount_total, state, order_date)
      SELECT 'ecommerce-order-demo-001', 'WEBSO001', 'Acme Retail', 'Core3 Storefront', 2, 308.50, 'Confirmed', CURRENT_TIMESTAMP - INTERVAL '1' DAY
      WHERE NOT EXISTS (SELECT 1 FROM ecommerce_orders WHERE id = 'ecommerce-order-demo-001');
      INSERT INTO ecommerce_orders (id, order_ref, customer_name, website_name, cart_quantity, amount_total, state)
      SELECT 'ecommerce-order-demo-002', 'WEBSO002', 'Northwind Traders', 'Core3 Storefront', 1, 249.00, 'Cart'
      WHERE NOT EXISTS (SELECT 1 FROM ecommerce_orders WHERE id = 'ecommerce-order-demo-002');
    down: |
      DELETE FROM ecommerce_orders WHERE id IN ('ecommerce-order-demo-001', 'ecommerce-order-demo-002');
      DELETE FROM ecommerce_products WHERE id IN ('ecommerce-product-demo-001', 'ecommerce-product-demo-002');
      DELETE FROM ecommerce_categories WHERE id = 'ecommerce-category-demo-001';
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
