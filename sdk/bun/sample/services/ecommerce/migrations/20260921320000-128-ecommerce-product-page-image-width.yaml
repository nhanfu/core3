version: 0.0.128
kind: schema
description: durable eCommerce product page image width policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_product_page_image_width_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        image_width VARCHAR NOT NULL DEFAULT '50_pc',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name),
        CHECK (image_width IN ('none', '33_pc', '50_pc', '66_pc', '100_pc'))
      );
      CREATE INDEX IF NOT EXISTS ecommerce_product_page_image_width_company_idx
        ON ecommerce_product_page_image_width_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_product_page_image_width_company_idx;
      DROP TABLE IF EXISTS ecommerce_product_page_image_width_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
