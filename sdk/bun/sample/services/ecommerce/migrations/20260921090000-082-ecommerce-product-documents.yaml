version: 0.0.82
kind: schema
description: durable Website Sale product documents published on product pages
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_product_documents (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        product_id VARCHAR NOT NULL,
        name VARCHAR NOT NULL,
        file_name VARCHAR NOT NULL,
        mime_type VARCHAR NOT NULL,
        size_bytes BIGINT NOT NULL,
        storage_key VARCHAR NOT NULL,
        sequence INTEGER NOT NULL DEFAULT 10,
        active BOOLEAN NOT NULL DEFAULT TRUE,
        shown_on_product_page BOOLEAN NOT NULL DEFAULT FALSE,
        company_name VARCHAR,
        uploaded_by VARCHAR,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(product_id, file_name)
      );
      CREATE INDEX IF NOT EXISTS ecommerce_product_documents_product_idx ON ecommerce_product_documents(product_id, sequence, id);
    down: |
      DROP INDEX IF EXISTS ecommerce_product_documents_product_idx;
      DROP TABLE IF EXISTS ecommerce_product_documents;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
database: duckdb
