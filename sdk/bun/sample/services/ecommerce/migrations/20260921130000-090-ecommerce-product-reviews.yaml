version: 0.0.90
kind: schema
description: durable Website Sale product review lifecycle
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_product_reviews (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        product_id VARCHAR NOT NULL,
        reviewer_name VARCHAR NOT NULL,
        reviewer_email VARCHAR,
        rating INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5),
        title VARCHAR NOT NULL,
        review_body VARCHAR NOT NULL,
        state VARCHAR NOT NULL DEFAULT 'pending' CHECK (state IN ('pending', 'published', 'rejected')),
        company_name VARCHAR NOT NULL DEFAULT 'My Company',
        active BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS ecommerce_product_reviews_product_idx
        ON ecommerce_product_reviews(product_id, state, active, created_at, id);
      CREATE INDEX IF NOT EXISTS ecommerce_product_reviews_company_idx
        ON ecommerce_product_reviews(company_name, state, active, product_id);
    down: |
      DROP TABLE IF EXISTS ecommerce_product_reviews;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
