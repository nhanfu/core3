version: 0.0.158
kind: schema
description: durable Website Sale Shop product-card ratings visibility policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_shop_product_rating_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        show_ratings BOOLEAN NOT NULL DEFAULT FALSE,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name)
      );
      CREATE INDEX IF NOT EXISTS ecommerce_shop_product_ratings_company_idx
        ON ecommerce_shop_product_rating_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_shop_product_ratings_company_idx;
      DROP TABLE IF EXISTS ecommerce_shop_product_rating_policies;
