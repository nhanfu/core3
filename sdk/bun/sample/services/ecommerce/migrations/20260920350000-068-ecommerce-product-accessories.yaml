version: 0.0.68
kind: schema
description: durable eCommerce accessory product recommendations
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_product_accessories (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        source_product_id VARCHAR NOT NULL,
        accessory_product_id VARCHAR NOT NULL,
        sequence INTEGER NOT NULL DEFAULT 10,
        company_name VARCHAR NOT NULL DEFAULT 'My Company',
        active BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(source_product_id, accessory_product_id)
      );
      CREATE INDEX IF NOT EXISTS ecommerce_product_accessories_source_idx
        ON ecommerce_product_accessories(source_product_id, active, sequence, id);
    down: |
      DROP INDEX IF EXISTS ecommerce_product_accessories_source_idx;
      DROP TABLE IF EXISTS ecommerce_product_accessories;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
