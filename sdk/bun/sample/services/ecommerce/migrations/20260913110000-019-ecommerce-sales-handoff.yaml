version: 0.0.32
kind: schema
description: eCommerce to Sales order handoff outbox
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_sales_handoffs (
        id VARCHAR PRIMARY KEY,
        ecommerce_order_id VARCHAR NOT NULL UNIQUE,
        order_number VARCHAR NOT NULL,
        customer_name VARCHAR NOT NULL,
        customer_email VARCHAR,
        amount_total DECIMAL(12,2) NOT NULL DEFAULT 0,
        currency VARCHAR NOT NULL DEFAULT 'USD',
        company_name VARCHAR NOT NULL DEFAULT 'My Company',
        state VARCHAR NOT NULL DEFAULT 'Pending',
        sales_order_id VARCHAR,
        attempt_count INTEGER NOT NULL DEFAULT 0,
        last_error VARCHAR,
        row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS ecommerce_sales_handoffs_state_idx ON ecommerce_sales_handoffs(state, created_at);
    down: DROP TABLE IF EXISTS ecommerce_sales_handoffs;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
