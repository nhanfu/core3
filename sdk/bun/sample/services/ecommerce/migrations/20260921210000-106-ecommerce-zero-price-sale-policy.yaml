version: 0.0.106
kind: schema
description: durable Website Sale zero-price sale policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_zero_price_sale_policies (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        prevent_zero_price_sale BOOLEAN NOT NULL DEFAULT FALSE,
        contact_us_button_url VARCHAR NOT NULL DEFAULT '/contactus',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (company_name)
      );
      CREATE INDEX IF NOT EXISTS ecommerce_zero_price_sale_policies_scope_idx
        ON ecommerce_zero_price_sale_policies(company_name, prevent_zero_price_sale);
    down: DROP TABLE IF EXISTS ecommerce_zero_price_sale_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
