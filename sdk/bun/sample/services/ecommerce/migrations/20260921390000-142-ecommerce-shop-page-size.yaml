version: 0.0.142
kind: schema
description: durable eCommerce shop page size policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_shop_page_size_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        page_size INTEGER NOT NULL DEFAULT 21,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name),
        CHECK (page_size BETWEEN 1 AND 10000)
      );
      CREATE INDEX IF NOT EXISTS ecommerce_shop_page_size_company_idx
        ON ecommerce_shop_page_size_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_shop_page_size_company_idx;
      DROP TABLE IF EXISTS ecommerce_shop_page_size_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
