version: 0.0.154
kind: schema
description: durable Website Sale Shop product-card action placement policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_shop_product_action_placement_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        action_placement VARCHAR NOT NULL DEFAULT 'onhover',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name),
        CHECK (action_placement IN ('inline', 'onhover'))
      );
      CREATE INDEX IF NOT EXISTS ecommerce_shop_product_action_placement_company_idx
        ON ecommerce_shop_product_action_placement_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_shop_product_action_placement_company_idx;
      DROP TABLE IF EXISTS ecommerce_shop_product_action_placement_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
