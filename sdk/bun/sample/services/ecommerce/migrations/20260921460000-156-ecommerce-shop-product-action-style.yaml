version: 0.0.156
kind: schema
description: durable Website Sale Shop product-card action style policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_shop_product_action_style_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        action_style VARCHAR NOT NULL DEFAULT 'subtle',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name),
        CHECK (action_style IN ('subtle', 'promote', 'theme'))
      );
      CREATE INDEX IF NOT EXISTS ecommerce_shop_product_action_style_company_idx
        ON ecommerce_shop_product_action_style_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_shop_product_action_style_company_idx;
      DROP TABLE IF EXISTS ecommerce_shop_product_action_style_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
