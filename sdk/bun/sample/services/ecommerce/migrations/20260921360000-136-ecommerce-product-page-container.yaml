version: 0.0.136
kind: schema
description: durable eCommerce product page container policy
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_product_page_container_policies (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL,
        page_container VARCHAR NOT NULL DEFAULT 'unset',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name),
        CHECK (page_container IN ('unset', 'regular', 'fluid'))
      );
      CREATE INDEX IF NOT EXISTS ecommerce_product_page_container_company_idx
        ON ecommerce_product_page_container_policies(company_name);
    down: |
      DROP INDEX IF EXISTS ecommerce_product_page_container_company_idx;
      DROP TABLE IF EXISTS ecommerce_product_page_container_policies;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
