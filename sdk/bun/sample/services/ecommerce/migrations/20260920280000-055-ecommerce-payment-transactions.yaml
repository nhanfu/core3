version: 0.0.55
kind: schema
description: durable eCommerce payment transactions
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_payment_transactions (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        order_id VARCHAR NOT NULL,
        reference VARCHAR NOT NULL UNIQUE,
        idempotency_key VARCHAR NOT NULL UNIQUE,
        payment_method VARCHAR NOT NULL,
        provider_name VARCHAR NOT NULL DEFAULT 'Core3 Offline',
        provider_reference VARCHAR,
        amount DECIMAL(12,2) NOT NULL,
        currency VARCHAR NOT NULL DEFAULT 'USD',
        state VARCHAR NOT NULL DEFAULT 'draft',
        state_message VARCHAR,
        operation VARCHAR NOT NULL DEFAULT 'offline',
        is_live BOOLEAN NOT NULL DEFAULT FALSE,
        customer_id VARCHAR,
        customer_name VARCHAR NOT NULL,
        customer_email VARCHAR,
        company_name VARCHAR NOT NULL DEFAULT 'My Company',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        last_state_change TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(order_id)
      );
      CREATE INDEX IF NOT EXISTS ecommerce_payment_transactions_state_idx
        ON ecommerce_payment_transactions(state, created_at, id);
      CREATE INDEX IF NOT EXISTS ecommerce_payment_transactions_company_idx
        ON ecommerce_payment_transactions(company_name, created_at, id);
    down: DROP INDEX IF EXISTS ecommerce_payment_transactions_company_idx; DROP INDEX IF EXISTS ecommerce_payment_transactions_state_idx; DROP TABLE IF EXISTS ecommerce_payment_transactions;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
