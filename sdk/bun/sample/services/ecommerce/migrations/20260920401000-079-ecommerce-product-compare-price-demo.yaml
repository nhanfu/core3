version: 0.0.79
kind: data
description: deterministic Website Sale compare-at price fixtures
type:
  postgres:
    up: |
      UPDATE ecommerce_products
      SET compare_list_price = 24.00
      WHERE id = 'ecommerce-product-mug';
      UPDATE ecommerce_product_variants
      SET compare_list_price = 25.50
      WHERE id = 'ecommerce-variant-mug-blue';
    down: |
      UPDATE ecommerce_products
      SET compare_list_price = 0
      WHERE id = 'ecommerce-product-mug';
      UPDATE ecommerce_product_variants
      SET compare_list_price = 0
      WHERE id = 'ecommerce-variant-mug-blue';
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
