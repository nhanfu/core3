version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS ecommerce_categories (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE, parent_name VARCHAR, sequence INTEGER NOT NULL DEFAULT 10,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS ecommerce_products (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL, category_name VARCHAR, list_price DECIMAL(18,2) NOT NULL DEFAULT 0,
        website_sequence INTEGER NOT NULL DEFAULT 10, publish_date TIMESTAMP,
        state VARCHAR NOT NULL DEFAULT 'Unpublished',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS ecommerce_products_state_idx ON ecommerce_products(state);
      CREATE TABLE IF NOT EXISTS ecommerce_orders (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), row_version BIGINT NOT NULL DEFAULT 1,
        order_ref VARCHAR NOT NULL UNIQUE, customer_name VARCHAR NOT NULL, website_name VARCHAR,
        cart_quantity INTEGER NOT NULL DEFAULT 0, amount_total DECIMAL(18,2) NOT NULL DEFAULT 0,
        order_date TIMESTAMP, state VARCHAR NOT NULL DEFAULT 'Cart',
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS ecommerce_orders_state_idx ON ecommerce_orders(state);
    down: |
      DROP TABLE IF EXISTS ecommerce_orders;
      DROP TABLE IF EXISTS ecommerce_products;
      DROP TABLE IF EXISTS ecommerce_categories;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
