page: { id: ecommerce-wishlist-page-layout-policy }
datasources:
  - id: ecommerce_wishlist_page_layout_policy
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_WISHLIST_LAYOUT_UNAUTHENTICATED, message: Sign in to view Wishlist Page settings. }
      forbidden: { status: 403, code: ECOMMERCE_WISHLIST_LAYOUT_FORBIDDEN, message: You do not have permission to view Wishlist Page settings. }
      missing_record: { status: 404, code: ECOMMERCE_WISHLIST_LAYOUT_NOT_FOUND, message: Wishlist Page settings were not found for this company. }
      transport_error: { status: 503, code: ECOMMERCE_WISHLIST_LAYOUT_UNAVAILABLE, message: Wishlist Page settings are temporarily unavailable. }
    query: "SELECT id, row_version, company_name, wishlist_grid_columns, wishlist_mobile_columns, wishlist_gap, CAST(wishlist_grid_columns AS VARCHAR) || ' desktop columns' AS desktop_columns_label, CAST(wishlist_mobile_columns AS VARCHAR) || ' mobile columns' AS mobile_columns_label, CAST(wishlist_gap AS VARCHAR) AS gap_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_wishlist_page_layout_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company') AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
  - id: ecommerce_wishlist_page_layout_desktop_options
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES (2, '2 Columns'), (3, '3 Columns'), (4, '4 Columns'), (5, '5 Columns'), (6, '6 Columns')) columns(value, label)"
  - id: ecommerce_wishlist_page_layout_mobile_options
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES (1, '1 Column'), (2, '2 Columns')) columns(value, label)"
  - id: ecommerce_wishlist_page_layout_gap_options
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('0px', '0 px'), ('4px', '4 px'), ('8px', '8 px'), ('16px', '16 px'), ('24px', '24 px'), ('28px', '28 px')) gaps(value, label)"
actions:
  - id: edit_ecommerce_wishlist_page_layout_policy
    type: server_form
    permission: ecommerce.write
    title: Save Wishlist Page Layout
    action: ecommerce.wishlist.page_layout.update
    handler: yaml_mutation
    operation: update
    prefill: row
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_wishlist_page_layout_policy]
    mutation:
      required: [id, expected_row_version, wishlist_grid_columns, wishlist_mobile_columns, wishlist_gap]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_wishlist_page_layout_policies WHERE id = :id AND row_version = :expected_row_version AND company_name = COALESCE(NULLIF(:current_company_name, ''), company_name)", status: 409, code: ECOMMERCE_WISHLIST_LAYOUT_STALE, message: These Wishlist Page settings changed or belong to another company. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE CAST(:wishlist_grid_columns AS INTEGER) IN (2, 3, 4, 5, 6)", status: 422, code: ECOMMERCE_WISHLIST_LAYOUT_DESKTOP_INVALID, message: Choose between 2 and 6 desktop columns. }
        - { query: "SELECT 1 AS ok WHERE CAST(:wishlist_mobile_columns AS INTEGER) IN (1, 2)", status: 422, code: ECOMMERCE_WISHLIST_LAYOUT_MOBILE_INVALID, message: Choose 1 or 2 mobile columns. }
        - { query: "SELECT 1 AS ok WHERE CAST(:wishlist_gap AS VARCHAR) ~ '^(0|[1-9]|1[0-9]|2[0-8])px$'", status: 422, code: ECOMMERCE_WISHLIST_LAYOUT_GAP_INVALID, message: Wishlist Page gap must be between 0px and 28px. }
      steps:
        - { query: "UPDATE ecommerce_wishlist_page_layout_policies SET wishlist_grid_columns = CAST(:wishlist_grid_columns AS INTEGER), wishlist_mobile_columns = CAST(:wishlist_mobile_columns AS INTEGER), wishlist_gap = CAST(:wishlist_gap AS VARCHAR), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_WISHLIST_LAYOUT_STALE, message: These Wishlist Page settings changed before saving. Reload before retrying. }
      result: { query: "SELECT id, row_version, company_name, wishlist_grid_columns, wishlist_mobile_columns, wishlist_gap, CAST(wishlist_grid_columns AS VARCHAR) || ' desktop columns' AS desktop_columns_label, CAST(wishlist_mobile_columns AS VARCHAR) || ' mobile columns' AS mobile_columns_label, CAST(wishlist_gap AS VARCHAR) AS gap_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_wishlist_page_layout_policies WHERE id = :id" }
    fields:
      - { field: wishlist_grid_columns, label: Desktop Columns, type: select, options_source: ecommerce_wishlist_page_layout_desktop_options, required: true }
      - { field: wishlist_mobile_columns, label: Mobile Columns, type: select, options_source: ecommerce_wishlist_page_layout_mobile_options, required: true }
      - { field: wishlist_gap, label: Grid Gap, type: select, options_source: ecommerce_wishlist_page_layout_gap_options, required: true }
