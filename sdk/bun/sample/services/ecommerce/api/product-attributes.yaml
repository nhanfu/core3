page: { id: ecommerce-product-attributes }
datasources:
  - id: ecommerce_product_attributes
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_ATTRIBUTES_UNAUTHENTICATED, message: Sign in to view product attributes. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_ATTRIBUTES_FORBIDDEN, message: You do not have permission to view product attributes. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_ATTRIBUTES_UNAVAILABLE, message: Product attributes are temporarily unavailable. }
    query: "SELECT a.id, a.row_version, a.name, a.active, a.create_variant, a.display_type, a.sequence, a.visibility, a.preview_variants, a.is_thumbnail_visible, COUNT(v.id) AS value_count, COALESCE(STRING_AGG(v.name || '|' || CAST(v.default_extra_price AS VARCHAR) || '|' || COALESCE(v.html_color, ''), chr(10) ORDER BY v.sequence, v.id), '') AS value_list FROM ecommerce_product_attributes a LEFT JOIN ecommerce_product_attribute_values v ON v.attribute_id = a.id AND v.active = TRUE WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND (:q IS NULL OR a.name ILIKE '%' || :q || '%' OR COALESCE(v.name, '') ILIKE '%' || :q || '%') AND (:active IS NULL OR a.active = :active) GROUP BY a.id, a.row_version, a.name, a.active, a.create_variant, a.display_type, a.sequence, a.visibility, a.preview_variants, a.is_thumbnail_visible ORDER BY a.sequence, a.id"
  - id: ecommerce_product_attribute_create_variants
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('always', 'Instantly'), ('dynamic', 'Dynamically'), ('no_variant', 'Never')) modes(value, label)"
  - id: ecommerce_product_attribute_display_types
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('radio', 'Radio'), ('pills', 'Pills'), ('select', 'Select'), ('color', 'Color'), ('multi', 'Multi-checkbox'), ('image', 'Image')) modes(value, label)"
  - id: ecommerce_product_attribute_visibility
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('visible', 'Visible'), ('hidden', 'Hidden')) states(value, label)"
  - id: ecommerce_product_attribute_preview_variants
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('visible', 'Visible'), ('hidden', 'Hidden'), ('hover', 'Hover')) modes(value, label)"
actions:
  - id: create_ecommerce_product_attribute
    type: server_form
    permission: ecommerce.write
    title: New Product Attribute
    action: ecommerce.product_attributes.create
    handler: yaml_mutation
    operation: create
    refresh: [ecommerce_product_attributes]
    mutation:
      operation: insert
      table: ecommerce_product_attributes
      fields: [name, active, create_variant, display_type, sequence, visibility, preview_variants, is_thumbnail_visible]
      required: [name]
      boolean_fields: [active, is_thumbnail_visible]
      defaults: { active: true, create_variant: always, display_type: radio, sequence: 20, visibility: visible, preview_variants: hidden, is_thumbnail_visible: false }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: ECOMMERCE_PRODUCT_ATTRIBUTE_NAME_INVALID, message: Attribute name must be between 1 and 80 characters. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_attributes WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: ECOMMERCE_PRODUCT_ATTRIBUTE_NAME_EXISTS, message: An attribute with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE CAST(:create_variant AS VARCHAR) IN ('always', 'dynamic', 'no_variant') AND CAST(:display_type AS VARCHAR) IN ('radio', 'pills', 'select', 'color', 'multi', 'image') AND CAST(:visibility AS VARCHAR) IN ('visible', 'hidden') AND CAST(:preview_variants AS VARCHAR) IN ('visible', 'hidden', 'hover')", status: 422, code: ECOMMERCE_PRODUCT_ATTRIBUTE_OPTION_INVALID, message: Choose valid attribute options. }
        - { query: "SELECT 1 AS ok WHERE CAST(:display_type AS VARCHAR) <> 'multi' OR CAST(:create_variant AS VARCHAR) = 'no_variant'", status: 422, code: ECOMMERCE_PRODUCT_ATTRIBUTE_MULTI_VARIANT_INVALID, message: Multi-checkbox attributes cannot create variants. }
        - { query: "SELECT 1 AS ok WHERE CAST(:create_variant AS VARCHAR) = 'always' AND CAST(:display_type AS VARCHAR) <> 'multi' OR (CAST(:preview_variants AS VARCHAR) = 'hidden' AND CAST(:is_thumbnail_visible AS BOOLEAN) = FALSE)", status: 422, code: ECOMMERCE_PRODUCT_ATTRIBUTE_PREVIEW_INVALID, message: Preview variants require instantly created non-multi variants. }
      steps:
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(COALESCE(CAST(:value_list AS VARCHAR), ''), chr(10)))) AS line), parsed AS (SELECT row_number() OVER () * 10 AS sequence, trim(split_part(line, '|', 1)) AS name, COALESCE(NULLIF(trim(split_part(line, '|', 2)), ''), '0') AS extra_price, NULLIF(trim(split_part(line, '|', 3)), '') AS html_color FROM lines WHERE line <> '') INSERT INTO ecommerce_product_attribute_values(id, attribute_id, name, sequence, default_extra_price, html_color) SELECT :id || '-value-' || CAST(sequence AS VARCHAR), :id, name, sequence, CAST(extra_price AS DECIMAL(12,2)), html_color FROM parsed WHERE name <> '' ON CONFLICT (id) DO NOTHING" }
      result: { query: "SELECT * FROM ecommerce_product_attributes WHERE id = :id" }
    fields:
      - { field: name, label: Attribute Name, type: text, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
      - { field: create_variant, label: Variant Creation, type: select, options_source: ecommerce_product_attribute_create_variants, required: true, default: always }
      - { field: display_type, label: Display Type, type: select, options_source: ecommerce_product_attribute_display_types, required: true, default: radio }
      - { field: sequence, label: Sequence, type: number, default: 20, min: 0 }
      - { field: visibility, label: eCommerce Filter, type: select, options_source: ecommerce_product_attribute_visibility, required: true, default: visible }
      - { field: preview_variants, label: On Product Cards, type: select, options_source: ecommerce_product_attribute_preview_variants, required: true, default: hidden }
      - { field: is_thumbnail_visible, label: Show Thumbnails, type: checkbox, default: false }
      - { field: value_list, label: Attribute Values, type: textarea, placeholder: 'Red|0|#D9534F\nBlue|2.50|#0275D8' }
  - id: edit_ecommerce_product_attribute
    type: server_form
    permission: ecommerce.write
    title: Edit Product Attribute
    action: ecommerce.product_attributes.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [ecommerce_product_attributes]
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    mutation:
      operation: update
      table: ecommerce_product_attributes
      fields: [name, active, create_variant, display_type, sequence, visibility, preview_variants, is_thumbnail_visible]
      required: [name]
      boolean_fields: [active, is_thumbnail_visible]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_product_attributes WHERE id = :id", status: 404, code: ECOMMERCE_PRODUCT_ATTRIBUTE_NOT_FOUND, message: Product attribute not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: ECOMMERCE_PRODUCT_ATTRIBUTE_NAME_INVALID, message: Attribute name must be between 1 and 80 characters. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_attributes WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: ECOMMERCE_PRODUCT_ATTRIBUTE_NAME_EXISTS, message: An attribute with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE CAST(:create_variant AS VARCHAR) IN ('always', 'dynamic', 'no_variant') AND CAST(:display_type AS VARCHAR) IN ('radio', 'pills', 'select', 'color', 'multi', 'image') AND CAST(:visibility AS VARCHAR) IN ('visible', 'hidden') AND CAST(:preview_variants AS VARCHAR) IN ('visible', 'hidden', 'hover')", status: 422, code: ECOMMERCE_PRODUCT_ATTRIBUTE_OPTION_INVALID, message: Choose valid attribute options. }
        - { query: "SELECT 1 AS ok WHERE CAST(:display_type AS VARCHAR) <> 'multi' OR CAST(:create_variant AS VARCHAR) = 'no_variant'", status: 422, code: ECOMMERCE_PRODUCT_ATTRIBUTE_MULTI_VARIANT_INVALID, message: Multi-checkbox attributes cannot create variants. }
        - { query: "SELECT 1 AS ok WHERE CAST(:create_variant AS VARCHAR) = 'always' AND CAST(:display_type AS VARCHAR) <> 'multi' OR (CAST(:preview_variants AS VARCHAR) = 'hidden' AND CAST(:is_thumbnail_visible AS BOOLEAN) = FALSE)", status: 422, code: ECOMMERCE_PRODUCT_ATTRIBUTE_PREVIEW_INVALID, message: Preview variants require instantly created non-multi variants. }
      before_steps:
        - { query: "DELETE FROM ecommerce_product_attribute_values WHERE attribute_id = :id" }
      steps:
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(COALESCE(CAST(:value_list AS VARCHAR), ''), chr(10)))) AS line), parsed AS (SELECT row_number() OVER () * 10 AS sequence, trim(split_part(line, '|', 1)) AS name, COALESCE(NULLIF(trim(split_part(line, '|', 2)), ''), '0') AS extra_price, NULLIF(trim(split_part(line, '|', 3)), '') AS html_color FROM lines WHERE line <> '') INSERT INTO ecommerce_product_attribute_values(id, attribute_id, name, sequence, default_extra_price, html_color) SELECT :id || '-value-' || CAST(sequence AS VARCHAR), :id, name, sequence, CAST(extra_price AS DECIMAL(12,2)), html_color FROM parsed WHERE name <> '' ON CONFLICT (id) DO NOTHING" }
      result: { query: "SELECT * FROM ecommerce_product_attributes WHERE id = :id" }
    fields:
      - { field: name, label: Attribute Name, type: text, required: true }
      - { field: active, label: Active, type: checkbox }
      - { field: create_variant, label: Variant Creation, type: select, options_source: ecommerce_product_attribute_create_variants, required: true }
      - { field: display_type, label: Display Type, type: select, options_source: ecommerce_product_attribute_display_types, required: true }
      - { field: sequence, label: Sequence, type: number, min: 0 }
      - { field: visibility, label: eCommerce Filter, type: select, options_source: ecommerce_product_attribute_visibility, required: true }
      - { field: preview_variants, label: On Product Cards, type: select, options_source: ecommerce_product_attribute_preview_variants, required: true }
      - { field: is_thumbnail_visible, label: Show Thumbnails, type: checkbox }
      - { field: value_list, label: Attribute Values, type: textarea, placeholder: 'Red|0|#D9534F\nBlue|2.50|#0275D8' }
  - id: delete_ecommerce_product_attribute
    type: server
    permission: ecommerce.write
    action: ecommerce.product_attributes.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete attribute {{row.name}}?'
    refresh: [ecommerce_product_attributes]
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    mutation:
      operation: delete
      table: ecommerce_product_attributes
      concurrency: { required: true }
      before_steps:
        - { query: "DELETE FROM ecommerce_product_attribute_values WHERE attribute_id = :id" }
      guards:
        - { query: "SELECT id FROM ecommerce_product_attributes WHERE id = :id", status: 404, code: ECOMMERCE_PRODUCT_ATTRIBUTE_NOT_FOUND, message: Product attribute not found. }
      result: { query: "SELECT TRUE AS deleted" }
