page: { id: ecommerce-product-reference-price-policy }
datasources:
  - id: ecommerce_product_reference_price_policy
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_REFERENCE_PRICE_UNAUTHENTICATED, message: Sign in to view Product Reference Price settings. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_REFERENCE_PRICE_FORBIDDEN, message: You do not have permission to view Product Reference Price settings. }
      missing_record: { status: 404, code: ECOMMERCE_PRODUCT_REFERENCE_PRICE_NOT_FOUND, message: Product Reference Price settings were not found for this company. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_REFERENCE_PRICE_UNAVAILABLE, message: Product Reference Price settings are temporarily unavailable. }
    query: "SELECT id, row_version, company_name, show_reference_price, CASE WHEN show_reference_price THEN 'Show reference price' ELSE 'Hide reference price' END AS reference_price_behavior, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_reference_price_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company') AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
actions:
  - id: edit_ecommerce_product_reference_price_policy
    type: server_form
    permission: ecommerce.write
    title: Save Product Reference Price
    action: ecommerce.products.reference_price_visibility.update
    handler: yaml_mutation
    operation: update
    prefill: row
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_reference_price_policy, ecommerce_product_detail, ecommerce_product_variant_detail]
    mutation:
      required: [id, expected_row_version, show_reference_price]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_product_reference_price_policies WHERE id = :id AND row_version = :expected_row_version AND company_name = COALESCE(NULLIF(:current_company_name, ''), company_name)", status: 409, code: ECOMMERCE_PRODUCT_REFERENCE_PRICE_STALE, message: These Product Reference Price settings changed or belong to another company. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE LOWER(CAST(:show_reference_price AS VARCHAR)) IN ('true', 'false')", status: 422, code: ECOMMERCE_PRODUCT_REFERENCE_PRICE_INVALID, message: Product Reference Price visibility must be enabled or disabled. }
      steps:
        - { query: "UPDATE ecommerce_product_reference_price_policies SET show_reference_price = CAST(:show_reference_price AS BOOLEAN), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_REFERENCE_PRICE_STALE, message: These Product Reference Price settings changed before saving. Reload before retrying. }
      result: { query: "SELECT id, row_version, company_name, show_reference_price, CASE WHEN show_reference_price THEN 'Show reference price' ELSE 'Hide reference price' END AS reference_price_behavior, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_reference_price_policies WHERE id = :id" }
    fields:
      - { field: show_reference_price, label: Product Reference Price, type: checkbox, required: true }
