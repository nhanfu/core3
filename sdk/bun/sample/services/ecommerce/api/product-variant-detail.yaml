page: { id: ecommerce-product-variant-detail }
datasources:
  - id: ecommerce_product_variant_detail
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_VARIANT_UNAUTHENTICATED, message: Sign in to view this product variant. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_VARIANT_FORBIDDEN, message: You do not have access to this product variant. }
      missing_record: { status: 404, code: ECOMMERCE_PRODUCT_VARIANT_NOT_FOUND, message: Product variant not found. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_VARIANT_UNAVAILABLE, message: Product variant details are temporarily unavailable. }
    query: "SELECT v.id, v.row_version, v.product_id, v.name, v.internal_reference, v.combination_key, v.attribute_values, v.sales_price, v.compare_list_price, CASE WHEN v.compare_list_price > v.sales_price THEN v.compare_list_price ELSE NULL END AS compare_at_price, v.base_unit_count, v.base_unit_name, CASE WHEN v.base_unit_count > 0 THEN CAST(v.sales_price / v.base_unit_count AS DECIMAL(20,8)) ELSE NULL END AS base_unit_price, v.active, v.company_name, p.name AS product_name, p.is_published AS product_is_published, CAST(p.publish_date AS VARCHAR) AS product_publish_date, p.active AS product_active FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN FALSE ELSE TRUE END AND v.id = :id AND (:company_name IS NULL OR v.company_name = :company_name OR v.company_name IS NULL)"
  - id: ecommerce_product_variant_images
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_VARIANT_IMAGES_UNAUTHENTICATED, message: Sign in to view variant media. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_VARIANT_IMAGES_FORBIDDEN, message: You do not have permission to view variant media. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_VARIANT_IMAGES_UNAVAILABLE, message: Variant media is temporarily unavailable. }
    query: "SELECT i.id, i.row_version, i.variant_id, i.product_id, i.name, i.file_name, i.mime_type, i.size_bytes, i.sequence, i.uploaded_by, CAST(i.created_at AS VARCHAR) AS created_at FROM ecommerce_product_variant_images i JOIN ecommerce_product_variants v ON v.id = i.variant_id JOIN ecommerce_products p ON p.id = v.product_id WHERE i.variant_id = :id AND v.active = TRUE AND p.active = TRUE AND (:company_name IS NULL OR v.company_name = :company_name OR v.company_name IS NULL) ORDER BY i.sequence, i.id"
actions:
  - id: back_to_ecommerce_product_detail_from_variant
    type: navigate
    permission: ecommerce.read
    navigate_to: /ecommerce/products/detail
    params: { id: '{state.ecommerce_product_variant_detail.product_id}' }
  - id: update_ecommerce_product_variant_base_unit
    type: server_form
    permission: ecommerce.write
    title: Configure Base Unit Pricing
    action: ecommerce.product_variants.base_unit.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.ecommerce_product_variant_detail.id}', expected_row_version: '{state.ecommerce_product_variant_detail.row_version}' }
    refresh: [ecommerce_product_variant_detail, ecommerce_product_variant_images]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT v.id FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :id AND v.row_version = :expected_row_version AND v.active = TRUE AND p.active = TRUE AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_STALE, message: This product variant changed before base-unit pricing could be saved. Reload before retrying. }
        - { query: "SELECT v.id FROM ecommerce_product_variants v WHERE v.id = :id AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_VARIANT_COMPANY_SCOPE_REQUIRED, message: This product variant belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:base_unit_count, 0) AS DECIMAL(20,8)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_COUNT_INVALID, message: Base unit count must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:base_unit_name, '') = '' OR LENGTH(TRIM(CAST(:base_unit_name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_NAME_INVALID, message: Base unit name must be between 1 and 80 characters. }
      steps:
        - { query: "UPDATE ecommerce_product_variants SET row_version = row_version + 1, base_unit_count = CAST(COALESCE(:base_unit_count, 0) AS DECIMAL(20,8)), base_unit_name = NULLIF(TRIM(CAST(:base_unit_name AS VARCHAR)), ''), updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_STALE, message: This product variant changed before base-unit pricing could be saved. }
      result: { query: "SELECT v.*, CASE WHEN v.base_unit_count > 0 THEN CAST(v.sales_price / v.base_unit_count AS DECIMAL(20,8)) ELSE NULL END AS base_unit_price FROM ecommerce_product_variants v WHERE v.id = :id" }
    fields:
      - { field: base_unit_count, label: Base Unit Count, type: number, min: 0, default: 0 }
      - { field: base_unit_name, label: Base Unit Name, type: text, placeholder: 'piece' }
  - id: update_ecommerce_product_variant_compare_price
    type: server_form
    permission: ecommerce.write
    title: Configure Compare to Price
    action: ecommerce.product_variants.compare_price.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.ecommerce_product_variant_detail.id}', expected_row_version: '{state.ecommerce_product_variant_detail.row_version}' }
    refresh: [ecommerce_product_variant_detail, ecommerce_product_variant_images]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT v.id FROM ecommerce_product_variants v WHERE v.id = :id AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_VARIANT_COMPANY_SCOPE_REQUIRED, message: This product variant belongs to another company. }
        - { query: "SELECT v.id FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :id AND v.row_version = :expected_row_version AND v.active = TRUE AND p.active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_COMPARE_PRICE_STALE, message: This product variant changed before Compare to Price could be saved. Reload before retrying. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_COMPARE_PRICE_INVALID, message: Compare to Price must be zero or greater. }
      steps:
        - { query: "UPDATE ecommerce_product_variants SET row_version = row_version + 1, compare_list_price = CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)), updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_VARIANT_COMPARE_PRICE_STALE, message: This product variant changed before Compare to Price could be saved. }
      result: { query: "SELECT v.*, CASE WHEN v.compare_list_price > v.sales_price THEN v.compare_list_price ELSE NULL END AS compare_at_price FROM ecommerce_product_variants v WHERE v.id = :id" }
    fields:
      - { field: compare_list_price, label: Compare to Price, type: number, min: 0, default: 0 }
  - id: upload_ecommerce_product_variant_image
    type: upload
    action: ecommerce.product_variants.images.upload
    handler: attachment_metadata
    permission: ecommerce.write
    kind: ecommerce_product_variant_image
    params: { variant_id: '{state.ecommerce_product_variant_detail.id}', expected_row_version: '{state.ecommerce_product_variant_detail.row_version}' }
    refresh: [ecommerce_product_variant_detail, ecommerce_product_variant_images]
    mutation:
      generated: [attachment_id]
      guards:
        - { query: "SELECT v.id FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :variant_id AND v.active = TRUE AND p.active = TRUE", status: 404, code: ECOMMERCE_PRODUCT_VARIANT_NOT_FOUND, message: Product variant not found. }
        - { query: "SELECT v.id FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :variant_id AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name) AND (COALESCE(:current_company_name, '') = '' OR p.company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_VARIANT_COMPANY_SCOPE_REQUIRED, message: This product variant belongs to another company. }
        - { query: "SELECT v.id FROM ecommerce_product_variants v WHERE v.id = :variant_id AND v.row_version = :expected_row_version", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_STALE, message: This product variant changed before media could be uploaded. Reload it before retrying. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:fileName AS VARCHAR))) BETWEEN 1 AND 255 AND LOWER(CAST(:mimeType AS VARCHAR)) LIKE 'image/%' AND CAST(:sizeBytes AS BIGINT) > 0 AND CAST(:sizeBytes AS BIGINT) <= 5242880", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_IMAGE_INVALID, message: Upload a non-empty image up to 5 MB. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_variant_images WHERE variant_id = :variant_id AND file_name = :fileName)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_IMAGE_DUPLICATE, message: This image is already attached to the product variant. }
      steps:
        - { query: "INSERT INTO ecommerce_product_variant_images(id, variant_id, product_id, name, file_name, mime_type, size_bytes, storage_key, sequence, uploaded_by) SELECT :attachment_id, v.id, v.product_id, :fileName, :fileName, :mimeType, :sizeBytes, :storageKey, COALESCE(:sequence, 10), :current_user_id FROM ecommerce_product_variants v WHERE v.id = :variant_id" }
        - { query: "UPDATE ecommerce_product_variants SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :variant_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_VARIANT_STALE, message: This product variant changed before media could be uploaded. }
      result: { query: "SELECT id, variant_id, product_id, name, file_name, mime_type, size_bytes, sequence, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM ecommerce_product_variant_images WHERE id = :attachment_id" }
  - id: download_ecommerce_product_variant_image
    type: download
    permission: ecommerce.read
    kind: ecommerce_product_variant_image
  - id: remove_ecommerce_product_variant_image
    type: server
    permission: ecommerce.write
    action: ecommerce.product_variants.images.remove
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_variant_detail, ecommerce_product_variant_images]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT i.id FROM ecommerce_product_variant_images i JOIN ecommerce_product_variants v ON v.id = i.variant_id JOIN ecommerce_products p ON p.id = v.product_id WHERE i.id = :id AND i.row_version = :expected_row_version AND v.active = TRUE AND p.active = TRUE AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_IMAGE_STALE, message: This variant image changed or was removed. Reload before removing. }
      steps:
        - { query: "DELETE FROM ecommerce_product_variant_images WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_VARIANT_IMAGE_STALE, message: This variant image changed before removal. }
      result: { query: "SELECT TRUE AS deleted, :id AS id" }
