page: { id: ecommerce-product-detail }
datasources:
  - id: ecommerce_product_detail
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_UNAUTHENTICATED, message: Sign in to view this product. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_FORBIDDEN, message: You do not have access to this product. }
      missing_record: { status: 404, code: ECOMMERCE_PRODUCT_NOT_FOUND, message: Product not found. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_UNAVAILABLE, message: Product details are temporarily unavailable. }
    query: "SELECT id, row_version, name, internal_reference, product_type, category, sales_price, compare_list_price, CASE WHEN compare_list_price > sales_price THEN compare_list_price ELSE NULL END AS compare_at_price, website_description, website_size_x, website_size_y, website_meta_title, website_meta_description, website_meta_keywords, website_meta_og_img, (NULLIF(website_meta_title, '') IS NOT NULL AND NULLIF(website_meta_description, '') IS NOT NULL AND NULLIF(website_meta_keywords, '') IS NOT NULL) AS is_seo_optimized, (SELECT COUNT(*) FROM ecommerce_product_reviews r WHERE r.product_id = ecommerce_products.id AND r.state = 'published' AND r.active = TRUE) AS review_count, COALESCE((SELECT ROUND(AVG(r.rating), 2) FROM ecommerce_product_reviews r WHERE r.product_id = ecommerce_products.id AND r.state = 'published' AND r.active = TRUE), 0) AS rating_average, website_sequence, is_published, CAST(publish_date AS VARCHAR) AS publish_date, active, company_name FROM ecommerce_products WHERE CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN FALSE ELSE TRUE END AND id = :id AND (:company_name IS NULL OR company_name = :company_name)"
  - id: ecommerce_product_images
    permission: ecommerce.read
    query: "SELECT id, product_id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM ecommerce_product_images WHERE product_id = :id ORDER BY created_at DESC, id"
  - id: ecommerce_product_extra_field_values
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_EXTRA_FIELDS_UNAUTHENTICATED, message: Sign in to view product page extra information. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_EXTRA_FIELDS_FORBIDDEN, message: You do not have permission to view product page extra information. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_EXTRA_FIELDS_UNAVAILABLE, message: Product page extra information is temporarily unavailable. }
    query: "SELECT f.id, f.row_version, f.field_name, CASE f.field_name WHEN 'name' THEN 'Product Name' WHEN 'internal_reference' THEN 'Internal Reference' ELSE 'eCommerce Category' END AS field_label, 'char' AS field_type, f.sequence, CASE f.field_name WHEN 'name' THEN p.name WHEN 'internal_reference' THEN p.internal_reference WHEN 'category' THEN p.category ELSE NULL END AS value FROM ecommerce_product_extra_fields f JOIN ecommerce_products p ON p.id = :id AND p.company_name = f.company_name WHERE f.company_name = COALESCE(NULLIF(:company_name, ''), p.company_name) AND f.active = TRUE ORDER BY f.sequence, f.id"
  - id: ecommerce_product_page_image_ratio
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_RATIO_UNAUTHENTICATED, message: Sign in to view product page image ratios. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_RATIO_FORBIDDEN, message: You do not have permission to view product page image ratios. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_RATIO_UNAVAILABLE, message: Product page image ratios are temporarily unavailable. }
    query: "SELECT r.id, r.row_version, r.company_name, r.desktop_ratio, r.mobile_ratio, CASE r.desktop_ratio WHEN 'auto' THEN 'Auto' WHEN '21_9' THEN 'Wider (21/9)' WHEN '16_9' THEN 'Wide (16/9)' WHEN '4_3' THEN 'Landscape (4/3)' WHEN '6_5' THEN 'Horizontal (6/5)' WHEN '1_1' THEN 'Default (1/1)' WHEN '4_5' THEN 'Portrait (4/5)' ELSE 'Vertical (2/3)' END AS desktop_ratio_label, CASE r.mobile_ratio WHEN 'auto' THEN 'Auto' WHEN '21_9' THEN 'Wider (21/9)' WHEN '16_9' THEN 'Wide (16/9)' WHEN '4_3' THEN 'Landscape (4/3)' WHEN '6_5' THEN 'Horizontal (6/5)' WHEN '1_1' THEN 'Default (1/1)' WHEN '4_5' THEN 'Portrait (4/5)' ELSE 'Vertical (2/3)' END AS mobile_ratio_label FROM ecommerce_product_page_image_ratio_policies r JOIN ecommerce_products p ON p.company_name = r.company_name WHERE p.id = :id AND (:company_name IS NULL OR r.company_name = :company_name)"
  - id: ecommerce_product_page_image_layout
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_UNAUTHENTICATED, message: Sign in to view product page image layout. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_FORBIDDEN, message: You do not have permission to view product page image layout. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_UNAVAILABLE, message: Product page image layout is temporarily unavailable. }
    query: "SELECT l.id, l.row_version, l.company_name, l.image_layout, CASE l.image_layout WHEN 'grid' THEN 'Grid' ELSE 'Carousel' END AS image_layout_label FROM ecommerce_product_page_image_layout_policies l JOIN ecommerce_products p ON p.company_name = l.company_name WHERE p.id = :id AND (:company_name IS NULL OR l.company_name = :company_name)"
  - id: ecommerce_product_page_image_width
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_UNAUTHENTICATED, message: Sign in to view product page image width. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_FORBIDDEN, message: You do not have permission to view product page image width. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_UNAVAILABLE, message: Product page image width is temporarily unavailable. }
    query: "SELECT w.id, w.row_version, w.company_name, w.image_width, CASE w.image_width WHEN 'none' THEN 'Hidden' WHEN '33_pc' THEN '33 %' WHEN '50_pc' THEN '50 %' WHEN '66_pc' THEN '66 %' ELSE '100 %' END AS image_width_label FROM ecommerce_product_page_image_width_policies w JOIN ecommerce_products p ON p.company_name = w.company_name WHERE p.id = :id AND (:company_name IS NULL OR w.company_name = :company_name)"
  - id: ecommerce_product_page_image_spacing
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_SPACING_UNAUTHENTICATED, message: Sign in to view product page image spacing. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_SPACING_FORBIDDEN, message: You do not have permission to view product page image spacing. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_SPACING_UNAVAILABLE, message: Product page image spacing is temporarily unavailable. }
    query: "SELECT s.id, s.row_version, s.company_name, s.image_spacing, CASE s.image_spacing WHEN 'none' THEN 'None' WHEN 'small' THEN 'Small' WHEN 'medium' THEN 'Medium' ELSE 'Big' END AS image_spacing_label FROM ecommerce_product_page_image_spacing_policies s JOIN ecommerce_products p ON p.company_name = s.company_name WHERE p.id = :id AND (:company_name IS NULL OR s.company_name = :company_name)"
  - id: ecommerce_product_page_image_roundness
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_UNAUTHENTICATED, message: Sign in to view product page image roundness. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_FORBIDDEN, message: You do not have permission to view product page image roundness. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_UNAVAILABLE, message: Product page image roundness is temporarily unavailable. }
    query: "SELECT r.id, r.row_version, r.company_name, r.image_roundness, CASE r.image_roundness WHEN 'none' THEN 'None' WHEN 'small' THEN 'Small' WHEN 'medium' THEN 'Medium' ELSE 'Big' END AS image_roundness_label FROM ecommerce_product_page_image_roundness_policies r JOIN ecommerce_products p ON p.company_name = r.company_name WHERE p.id = :id AND (:company_name IS NULL OR r.company_name = :company_name)"
  - id: ecommerce_product_page_columns_order
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_COLUMNS_ORDER_UNAUTHENTICATED, message: Sign in to view product page columns order. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_COLUMNS_ORDER_FORBIDDEN, message: You do not have permission to view product page columns order. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_COLUMNS_ORDER_UNAVAILABLE, message: Product page columns order is temporarily unavailable. }
    query: "SELECT c.id, c.row_version, c.company_name, c.columns_order, CASE c.columns_order WHEN 'inverse' THEN 'Inverse order' ELSE 'Regular order' END AS columns_order_label FROM ecommerce_product_page_columns_order_policies c JOIN ecommerce_products p ON p.company_name = c.company_name WHERE p.id = :id AND (:company_name IS NULL OR c.company_name = :company_name)"
  - id: ecommerce_product_page_container
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_CONTAINER_UNAUTHENTICATED, message: Sign in to view product page container. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_CONTAINER_FORBIDDEN, message: You do not have permission to view product page container. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_CONTAINER_UNAVAILABLE, message: Product page container is temporarily unavailable. }
    query: "SELECT c.id, c.row_version, c.company_name, c.page_container, CASE c.page_container WHEN 'regular' THEN 'Regular' WHEN 'fluid' THEN 'Full-width' ELSE 'Unset' END AS page_container_label FROM ecommerce_product_page_container_policies c JOIN ecommerce_products p ON p.company_name = c.company_name WHERE p.id = :id AND (:company_name IS NULL OR c.company_name = :company_name)"
  - id: ecommerce_product_page_grid_columns
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_GRID_COLUMNS_UNAUTHENTICATED, message: Sign in to view product page grid columns. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_GRID_COLUMNS_FORBIDDEN, message: You do not have permission to view product page grid columns. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_GRID_COLUMNS_UNAVAILABLE, message: Product page grid columns are temporarily unavailable. }
    query: "SELECT g.id, g.row_version, g.company_name, g.grid_columns, CASE g.grid_columns WHEN 1 THEN '1 column' WHEN 2 THEN '2 columns' ELSE '3 columns' END AS grid_columns_label FROM ecommerce_product_page_grid_columns_policies g JOIN ecommerce_products p ON p.company_name = g.company_name WHERE p.id = :id AND (:company_name IS NULL OR g.company_name = :company_name)"
  - id: ecommerce_product_categories
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_CATEGORIES_UNAUTHENTICATED, message: Sign in to view product categories. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_CATEGORIES_FORBIDDEN, message: You do not have permission to view product categories. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_CATEGORIES_UNAVAILABLE, message: Product categories are temporarily unavailable. }
    query: "SELECT a.id, a.row_version, a.product_id, a.category_id, c.name AS category_name, c.parent_name, a.sequence, a.active, a.company_name FROM ecommerce_product_category_assignments a JOIN ecommerce_products p ON p.id = a.product_id JOIN ecommerce_categories c ON c.id = a.category_id WHERE a.product_id = :id AND p.active = TRUE AND a.active = TRUE AND c.active = TRUE AND (COALESCE(:company_name, '') = '' OR a.company_name = :company_name OR a.company_name IS NULL) ORDER BY a.sequence, c.sequence, c.name, a.id"
  - id: ecommerce_product_category_options
    permission: ecommerce.read
    query: "SELECT c.id AS value, c.name AS label FROM ecommerce_categories c JOIN ecommerce_products p ON p.id = :product_id WHERE c.active = TRUE AND (c.company_name IS NULL OR c.company_name = p.company_name) AND NOT EXISTS (SELECT 1 FROM ecommerce_product_category_assignments a WHERE a.product_id = p.id AND a.category_id = c.id AND a.active = TRUE) ORDER BY c.sequence, c.name, c.id"
  - id: ecommerce_product_reviews
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_REVIEWS_UNAUTHENTICATED, message: Sign in to view product reviews. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_REVIEWS_FORBIDDEN, message: You do not have permission to view product reviews. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_REVIEWS_UNAVAILABLE, message: Product reviews are temporarily unavailable. }
    query: "SELECT r.id, r.row_version, r.product_id, r.reviewer_name, r.reviewer_email, r.rating, r.title, r.review_body, r.state, r.company_name, r.active, CAST(r.created_at AS VARCHAR) AS created_at, CAST(r.updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_reviews r JOIN ecommerce_products p ON p.id = r.product_id WHERE r.product_id = :id AND p.active = TRUE AND r.active = TRUE AND (:company_name IS NULL OR r.company_name = :company_name OR r.company_name IS NULL) ORDER BY r.created_at DESC, r.id"
  - id: ecommerce_product_documents
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_DOCUMENTS_UNAUTHENTICATED, message: Sign in to view product documents. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_DOCUMENTS_FORBIDDEN, message: You do not have permission to view product documents. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_DOCUMENTS_UNAVAILABLE, message: Product documents are temporarily unavailable. }
    query: "SELECT d.id, d.row_version, d.product_id, d.name, d.file_name, d.mime_type, d.size_bytes, d.sequence, d.active, d.shown_on_product_page, d.company_name, d.uploaded_by, COALESCE(d.document_type, 'file') AS document_type, d.external_url, CAST(d.created_at AS VARCHAR) AS created_at FROM ecommerce_product_documents d JOIN ecommerce_products p ON p.id = d.product_id WHERE d.product_id = :id AND p.active = TRUE AND d.active = TRUE AND (:company_name IS NULL OR d.company_name = :company_name OR d.company_name IS NULL) ORDER BY d.sequence, d.id"
  - id: ecommerce_product_variants
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_VARIANTS_UNAUTHENTICATED, message: Sign in to view product variants. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_VARIANTS_FORBIDDEN, message: You do not have permission to view product variants. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_VARIANTS_UNAVAILABLE, message: Product variants are temporarily unavailable. }
    query: "SELECT v.id, v.row_version, v.product_id, v.name, v.internal_reference, v.combination_key, v.attribute_values, v.sales_price, v.compare_list_price, CASE WHEN v.compare_list_price > v.sales_price THEN v.compare_list_price ELSE NULL END AS compare_at_price, v.base_unit_count, v.base_unit_name, CASE WHEN v.base_unit_count > 0 THEN CAST(v.sales_price / v.base_unit_count AS DECIMAL(20,8)) ELSE NULL END AS base_unit_price, v.active, v.company_name FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.product_id = :id AND (:company_name IS NULL OR v.company_name = :company_name OR v.company_name IS NULL) ORDER BY v.name, v.id"
  - id: ecommerce_product_alternatives
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_ALTERNATIVES_UNAUTHENTICATED, message: Sign in to view alternative products. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_ALTERNATIVES_FORBIDDEN, message: You do not have permission to view alternative products. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_ALTERNATIVES_UNAVAILABLE, message: Alternative products are temporarily unavailable. }
    query: "SELECT a.id, a.row_version, a.source_product_id, a.destination_product_id, p.name, p.internal_reference, p.product_type, p.category, p.sales_price, p.website_sequence, p.company_name, a.sequence FROM ecommerce_product_alternatives a JOIN ecommerce_products source ON source.id = a.source_product_id JOIN ecommerce_products p ON p.id = a.destination_product_id WHERE a.source_product_id = :id AND a.active = TRUE AND source.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND source.company_name = p.company_name AND (:company_name IS NULL OR source.company_name = :company_name) ORDER BY a.sequence, p.website_sequence, p.name, a.id"
  - id: ecommerce_product_alternative_options
    permission: ecommerce.read
    query: "SELECT p.id AS value, p.name AS label FROM ecommerce_products p JOIN ecommerce_products source ON source.id = :source_product_id WHERE p.id <> :source_product_id AND p.active = TRUE AND p.is_published = TRUE AND p.company_name = source.company_name AND (:company_name IS NULL OR p.company_name = :company_name) ORDER BY p.website_sequence, p.name, p.id"
  - id: ecommerce_product_accessories
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_ACCESSORIES_UNAUTHENTICATED, message: Sign in to view accessory products. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_ACCESSORIES_FORBIDDEN, message: You do not have permission to view accessory products. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_ACCESSORIES_UNAVAILABLE, message: Accessory products are temporarily unavailable. }
    query: "SELECT a.id, a.row_version, a.source_product_id, a.accessory_product_id, p.name, p.internal_reference, p.product_type, p.category, p.sales_price, p.website_sequence, p.company_name, a.sequence FROM ecommerce_product_accessories a JOIN ecommerce_products source ON source.id = a.source_product_id JOIN ecommerce_products p ON p.id = a.accessory_product_id WHERE a.source_product_id = :id AND a.active = TRUE AND source.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND source.company_name = p.company_name AND (:company_name IS NULL OR source.company_name = :company_name) ORDER BY a.sequence, p.website_sequence, p.name, a.id"
  - id: ecommerce_product_accessory_options
    permission: ecommerce.read
    query: "SELECT p.id AS value, p.name AS label FROM ecommerce_products p JOIN ecommerce_products source ON source.id = :source_product_id WHERE p.id <> :source_product_id AND p.active = TRUE AND p.is_published = TRUE AND p.company_name = source.company_name AND (:company_name IS NULL OR p.company_name = :company_name) ORDER BY p.website_sequence, p.name, p.id"
  - id: ecommerce_product_optionals
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_OPTIONALS_UNAUTHENTICATED, message: Sign in to view optional products. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_OPTIONALS_FORBIDDEN, message: You do not have permission to view optional products. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_OPTIONALS_UNAVAILABLE, message: Optional products are temporarily unavailable. }
    query: "SELECT o.id, o.row_version, o.source_product_id, o.optional_product_id, p.name, p.internal_reference, p.product_type, p.category, p.sales_price, p.website_sequence, p.company_name, o.sequence FROM ecommerce_product_optionals o JOIN ecommerce_products source ON source.id = o.source_product_id JOIN ecommerce_products p ON p.id = o.optional_product_id WHERE o.source_product_id = :id AND o.active = TRUE AND source.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND source.company_name = p.company_name AND (:company_name IS NULL OR source.company_name = :company_name) ORDER BY o.sequence, p.website_sequence, p.name, o.id"
  - id: ecommerce_product_optional_options
    permission: ecommerce.read
    query: "SELECT p.id AS value, p.name AS label FROM ecommerce_products p JOIN ecommerce_products source ON source.id = :source_product_id WHERE p.id <> :source_product_id AND p.active = TRUE AND p.is_published = TRUE AND p.company_name = source.company_name AND (:company_name IS NULL OR p.company_name = :company_name) ORDER BY p.website_sequence, p.name, p.id"
actions:
  - { id: back_to_ecommerce_products, type: navigate, permission: ecommerce.read, navigate_to: /ecommerce/products, params: {} }
  - { id: add_ecommerce_product_to_cart, type: navigate, permission: ecommerce.write, navigate_to: /ecommerce/cart, params: { product_id: '{row.id}' } }
  - id: update_ecommerce_product_seo
    type: server_form
    permission: ecommerce.write
    title: Edit SEO Metadata
    action: ecommerce.products.seo.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.ecommerce_product_detail.id}', expected_row_version: '{state.ecommerce_product_detail.row_version}' }
    refresh: [ecommerce_product_detail]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_SEO_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_SEO_STALE, message: This product changed before its SEO metadata could be saved. Reload before retrying. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:website_meta_title, '') AS VARCHAR)) <= 160 AND LENGTH(CAST(COALESCE(:website_meta_description, '') AS VARCHAR)) <= 320 AND LENGTH(CAST(COALESCE(:website_meta_keywords, '') AS VARCHAR)) <= 255 AND LENGTH(CAST(COALESCE(:website_meta_og_img, '') AS VARCHAR)) <= 2048 AND LOWER(CAST(COALESCE(:website_meta_og_img, '') AS VARCHAR)) NOT LIKE 'javascript:%'", status: 422, code: ECOMMERCE_PRODUCT_SEO_INVALID, message: SEO metadata exceeds its supported length or contains an unsafe OpenGraph URL. }
      steps:
        - { query: "UPDATE ecommerce_products SET row_version = row_version + 1, website_meta_title = NULLIF(TRIM(CAST(COALESCE(:website_meta_title, '') AS VARCHAR)), ''), website_meta_description = NULLIF(TRIM(CAST(COALESCE(:website_meta_description, '') AS VARCHAR)), ''), website_meta_keywords = NULLIF(TRIM(CAST(COALESCE(:website_meta_keywords, '') AS VARCHAR)), ''), website_meta_og_img = NULLIF(TRIM(CAST(COALESCE(:website_meta_og_img, '') AS VARCHAR)), ''), updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_SEO_STALE, message: This product changed before its SEO metadata could be saved. }
      result: { query: "SELECT id, row_version, name, website_meta_title, website_meta_description, website_meta_keywords, website_meta_og_img, (NULLIF(website_meta_title, '') IS NOT NULL AND NULLIF(website_meta_description, '') IS NOT NULL AND NULLIF(website_meta_keywords, '') IS NOT NULL) AS is_seo_optimized FROM ecommerce_products WHERE id = :id" }
    fields:
      - { field: website_meta_title, label: Website Meta Title, type: text }
      - { field: website_meta_description, label: Website Meta Description, type: textarea }
      - { field: website_meta_keywords, label: Website Meta Keywords, type: text }
      - { field: website_meta_og_img, label: Website OpenGraph Image, type: text }
  - id: publish_ecommerce_product
    type: server
    permission: ecommerce.write
    action: ecommerce.products.publish
    handler: yaml_mutation
    operation: update
    params: { id: '{state.ecommerce_product_detail.id}', expected_row_version: '{state.ecommerce_product_detail.row_version}' }
    refresh: [ecommerce_product_detail, ecommerce_products, ecommerce_shop_products]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_PUBLICATION_STALE, message: This product changed before it could be published. Reload before retrying. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
      steps:
        - { query: "UPDATE ecommerce_products SET is_published = TRUE, publish_date = COALESCE(publish_date, CURRENT_TIMESTAMP), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_PUBLICATION_STALE, message: This product changed before it could be published. }
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
  - id: unpublish_ecommerce_product
