  - id: create_ecommerce_product_variant
    type: server_form
    permission: ecommerce.write
    title: New Product Variant
    action: ecommerce.product_variants.create
    handler: yaml_mutation
    operation: create
    params: { product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_variants, ecommerce_product_detail]
    mutation:
      generated: [id]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_VARIANT_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 120", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_NAME_INVALID, message: Variant name must be between 1 and 120 characters. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:combination_key AS VARCHAR))) BETWEEN 1 AND 200", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_COMBINATION_INVALID, message: Add a stable attribute combination. }
        - { query: "SELECT 1 AS ok WHERE CAST(:sales_price AS DECIMAL(12,2)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_PRICE_INVALID, message: Variant price must be non-negative. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_COMPARE_PRICE_INVALID, message: Compare to Price must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:base_unit_count, 0) AS DECIMAL(20,8)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_COUNT_INVALID, message: Base unit count must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:base_unit_name, '') = '' OR LENGTH(TRIM(CAST(:base_unit_name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_NAME_INVALID, message: Base unit name must be between 1 and 80 characters. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_variants WHERE product_id = :product_id AND combination_key = :combination_key)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_COMBINATION_EXISTS, message: This attribute combination already exists. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:internal_reference, '') = '' OR NOT EXISTS (SELECT 1 FROM ecommerce_product_variants WHERE product_id = :product_id AND internal_reference = :internal_reference)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_REFERENCE_EXISTS, message: This variant reference already exists. }
      steps:
        - { query: "INSERT INTO ecommerce_product_variants(id, row_version, product_id, name, internal_reference, combination_key, attribute_values, sales_price, compare_list_price, base_unit_count, base_unit_name, active, company_name) SELECT :id, 1, :product_id, :name, NULLIF(:internal_reference, ''), :combination_key, COALESCE(:attribute_values, ''), CAST(:sales_price AS DECIMAL(12,2)), CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)), CAST(COALESCE(:base_unit_count, 0) AS DECIMAL(20,8)), NULLIF(TRIM(CAST(:base_unit_name AS VARCHAR)), ''), COALESCE(CAST(:active AS BOOLEAN), TRUE), p.company_name FROM ecommerce_products p WHERE p.id = :product_id" }
      result: { query: "SELECT * FROM ecommerce_product_variants WHERE id = :id" }
    fields:
      - { field: name, label: Variant Name, type: text, required: true }
      - { field: internal_reference, label: Internal Reference, type: text }
      - { field: combination_key, label: Combination Key, type: text, required: true, placeholder: 'color=blue,size=large' }
      - { field: attribute_values, label: Attribute Values, type: text, placeholder: 'Color: Blue, Size: Large' }
      - { field: sales_price, label: Sales Price, type: number, min: 0, required: true }
      - { field: compare_list_price, label: Compare to Price, type: number, min: 0, default: 0 }
      - { field: base_unit_count, label: Base Unit Count, type: number, min: 0, default: 0 }
      - { field: base_unit_name, label: Base Unit Name, type: text, placeholder: 'piece' }
      - { field: active, label: Active, type: checkbox, default: true }
