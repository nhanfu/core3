    title: New Product Review
    action: ecommerce.products.reviews.create
    handler: yaml_mutation
    operation: create
    params: { product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_reviews, ecommerce_product_detail]
    mutation:
      generated: [id]
      required: [product_id, reviewer_name, rating, title, review_body]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_REVIEW_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:reviewer_name AS VARCHAR))) BETWEEN 1 AND 120 AND LENGTH(TRIM(CAST(:title AS VARCHAR))) BETWEEN 1 AND 160 AND LENGTH(TRIM(CAST(:review_body AS VARCHAR))) BETWEEN 1 AND 4000 AND CAST(:rating AS INTEGER) BETWEEN 1 AND 5", status: 422, code: ECOMMERCE_PRODUCT_REVIEW_INVALID, message: Review name, title, body, and rating are invalid. }
      steps:
        - { query: "INSERT INTO ecommerce_product_reviews(id, row_version, product_id, reviewer_name, reviewer_email, rating, title, review_body, state, company_name, active) SELECT :id, 1, p.id, TRIM(CAST(:reviewer_name AS VARCHAR)), NULLIF(TRIM(CAST(COALESCE(:reviewer_email, '') AS VARCHAR)), ''), CAST(:rating AS INTEGER), TRIM(CAST(:title AS VARCHAR)), TRIM(CAST(:review_body AS VARCHAR)), 'pending', p.company_name, TRUE FROM ecommerce_products p WHERE p.id = :product_id", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_REVIEW_CREATE_FAILED, message: The review could not be created. }
      result: { query: "SELECT * FROM ecommerce_product_reviews WHERE id = :id" }
    fields:
      - { field: reviewer_name, label: Reviewer Name, type: text, required: true }
      - { field: reviewer_email, label: Reviewer Email, type: email }
      - { field: rating, label: Rating, type: number, min: 1, max: 5, required: true }
      - { field: title, label: Review Title, type: text, required: true }
      - { field: review_body, label: Review, type: textarea, required: true }
