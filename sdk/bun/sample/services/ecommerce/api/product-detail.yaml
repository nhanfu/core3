  - id: create_ecommerce_product_category
    type: server_form
    permission: ecommerce.write
    title: Add Product Category
    action: ecommerce.products.categories.assign
    handler: yaml_mutation
    operation: create
    params: { product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_categories, ecommerce_product_detail]
    mutation:
      generated: [id]
      required: [product_id, category_id]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_CATEGORY_PRODUCT_SCOPE_REQUIRED, message: This product belongs to another company or is inactive. }
        - { query: "SELECT c.id FROM ecommerce_categories c JOIN ecommerce_products p ON p.id = :product_id WHERE c.id = :category_id AND c.active = TRUE AND (c.company_name IS NULL OR c.company_name = p.company_name)", status: 422, code: ECOMMERCE_PRODUCT_CATEGORY_CATEGORY_INVALID, message: Choose an active category in the product company. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_category_assignments WHERE product_id = :product_id AND category_id = :category_id AND active = TRUE)", status: 409, code: ECOMMERCE_PRODUCT_CATEGORY_EXISTS, message: This product is already assigned to that category. }
      steps:
        - { query: "INSERT INTO ecommerce_product_category_assignments(id, row_version, product_id, category_id, sequence, active, company_name) SELECT :id, 1, p.id, c.id, CAST(COALESCE(:sequence, 10) AS INTEGER), TRUE, p.company_name FROM ecommerce_products p JOIN ecommerce_categories c ON c.id = :category_id WHERE p.id = :product_id", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_CATEGORY_CREATE_FAILED, message: The product category assignment could not be created. }
      result: { query: "SELECT a.*, c.name AS category_name, c.parent_name FROM ecommerce_product_category_assignments a JOIN ecommerce_categories c ON c.id = a.category_id WHERE a.id = :id" }
    fields:
      - { field: category_id, label: Website Category, type: select, options_source: ecommerce_product_category_options, required: true }
      - { field: sequence, label: Sequence, type: number, min: 0, default: 10 }
