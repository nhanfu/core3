        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:sequence, 10) AS INTEGER) >= 0", status: 422, code: ECOMMERCE_PRODUCT_CATEGORY_SEQUENCE_INVALID, message: Category sequence must be zero or greater. }
      result: { query: "SELECT a.*, c.name AS category_name, c.parent_name FROM ecommerce_product_category_assignments a JOIN ecommerce_categories c ON c.id = a.category_id WHERE a.id = :id" }
