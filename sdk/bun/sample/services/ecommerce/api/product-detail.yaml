        - { query: "SELECT v.id FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :variant_id AND v.product_id = :product_id AND v.row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR p.company_name = :current_company_name)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_STALE, message: This product variant changed or was deleted. Reload before deleting. }
      steps:
        - { query: "DELETE FROM ecommerce_product_variants WHERE id = :variant_id AND product_id = :product_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_VARIANT_STALE, message: This product variant changed or was deleted. Reload before deleting. }
