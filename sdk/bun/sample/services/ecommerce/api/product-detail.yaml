page: { id: ecommerce-product-detail }
datasources:
  - id: ecommerce_product_detail
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_UNAUTHENTICATED, message: Sign in to view this product. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_FORBIDDEN, message: You do not have access to this product. }
      missing_record: { status: 404, code: ECOMMERCE_PRODUCT_NOT_FOUND, message: Product not found. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_UNAVAILABLE, message: Product details are temporarily unavailable. }
    query: "SELECT id, row_version, name, internal_reference, product_type, category, sales_price, compare_list_price, CASE WHEN compare_list_price > sales_price THEN compare_list_price ELSE NULL END AS compare_at_price, website_description, website_sequence, is_published, active, company_name FROM ecommerce_products WHERE CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN FALSE ELSE TRUE END AND id = :id AND (:company_name IS NULL OR company_name = :company_name)"
  - id: ecommerce_product_images
    permission: ecommerce.read
    query: "SELECT id, product_id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM ecommerce_product_images WHERE product_id = :id ORDER BY created_at DESC, id"
  - id: ecommerce_product_documents
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_DOCUMENTS_UNAUTHENTICATED, message: Sign in to view product documents. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_DOCUMENTS_FORBIDDEN, message: You do not have permission to view product documents. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_DOCUMENTS_UNAVAILABLE, message: Product documents are temporarily unavailable. }
    query: "SELECT d.id, d.row_version, d.product_id, d.name, d.file_name, d.mime_type, d.size_bytes, d.sequence, d.active, d.shown_on_product_page, d.company_name, d.uploaded_by, CAST(d.created_at AS VARCHAR) AS created_at FROM ecommerce_product_documents d JOIN ecommerce_products p ON p.id = d.product_id WHERE d.product_id = :id AND p.active = TRUE AND d.active = TRUE AND (:company_name IS NULL OR d.company_name = :company_name OR d.company_name IS NULL) ORDER BY d.sequence, d.id"
  - id: ecommerce_product_variants
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_VARIANTS_UNAUTHENTICATED, message: Sign in to view product variants. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_VARIANTS_FORBIDDEN, message: You do not have permission to view product variants. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_VARIANTS_UNAVAILABLE, message: Product variants are temporarily unavailable. }
    query: "SELECT v.id, v.row_version, v.product_id, v.name, v.internal_reference, v.combination_key, v.attribute_values, v.sales_price, v.compare_list_price, CASE WHEN v.compare_list_price > v.sales_price THEN v.compare_list_price ELSE NULL END AS compare_at_price, v.base_unit_count, v.base_unit_name, CASE WHEN v.base_unit_count > 0 THEN CAST(v.sales_price / v.base_unit_count AS DECIMAL(20,8)) ELSE NULL END AS base_unit_price, v.active, v.company_name FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.product_id = :id AND (:company_name IS NULL OR v.company_name = :company_name OR v.company_name IS NULL) ORDER BY v.name, v.id"
  - id: ecommerce_product_alternatives
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_ALTERNATIVES_UNAUTHENTICATED, message: Sign in to view alternative products. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_ALTERNATIVES_FORBIDDEN, message: You do not have permission to view alternative products. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_ALTERNATIVES_UNAVAILABLE, message: Alternative products are temporarily unavailable. }
    query: "SELECT a.id, a.row_version, a.source_product_id, a.destination_product_id, p.name, p.internal_reference, p.product_type, p.category, p.sales_price, p.website_sequence, p.company_name, a.sequence FROM ecommerce_product_alternatives a JOIN ecommerce_products source ON source.id = a.source_product_id JOIN ecommerce_products p ON p.id = a.destination_product_id WHERE a.source_product_id = :id AND a.active = TRUE AND source.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND source.company_name = p.company_name AND (:company_name IS NULL OR source.company_name = :company_name) ORDER BY a.sequence, p.website_sequence, p.name, a.id"
  - id: ecommerce_product_alternative_options
    permission: ecommerce.read
    query: "SELECT p.id AS value, p.name AS label FROM ecommerce_products p JOIN ecommerce_products source ON source.id = :source_product_id WHERE p.id <> :source_product_id AND p.active = TRUE AND p.is_published = TRUE AND p.company_name = source.company_name AND (:company_name IS NULL OR p.company_name = :company_name) ORDER BY p.website_sequence, p.name, p.id"
  - id: ecommerce_product_accessories
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_ACCESSORIES_UNAUTHENTICATED, message: Sign in to view accessory products. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_ACCESSORIES_FORBIDDEN, message: You do not have permission to view accessory products. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_ACCESSORIES_UNAVAILABLE, message: Accessory products are temporarily unavailable. }
    query: "SELECT a.id, a.row_version, a.source_product_id, a.accessory_product_id, p.name, p.internal_reference, p.product_type, p.category, p.sales_price, p.website_sequence, p.company_name, a.sequence FROM ecommerce_product_accessories a JOIN ecommerce_products source ON source.id = a.source_product_id JOIN ecommerce_products p ON p.id = a.accessory_product_id WHERE a.source_product_id = :id AND a.active = TRUE AND source.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND source.company_name = p.company_name AND (:company_name IS NULL OR source.company_name = :company_name) ORDER BY a.sequence, p.website_sequence, p.name, a.id"
  - id: ecommerce_product_accessory_options
    permission: ecommerce.read
    query: "SELECT p.id AS value, p.name AS label FROM ecommerce_products p JOIN ecommerce_products source ON source.id = :source_product_id WHERE p.id <> :source_product_id AND p.active = TRUE AND p.is_published = TRUE AND p.company_name = source.company_name AND (:company_name IS NULL OR p.company_name = :company_name) ORDER BY p.website_sequence, p.name, p.id"
  - id: ecommerce_product_optionals
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_OPTIONALS_UNAUTHENTICATED, message: Sign in to view optional products. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_OPTIONALS_FORBIDDEN, message: You do not have permission to view optional products. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_OPTIONALS_UNAVAILABLE, message: Optional products are temporarily unavailable. }
    query: "SELECT o.id, o.row_version, o.source_product_id, o.optional_product_id, p.name, p.internal_reference, p.product_type, p.category, p.sales_price, p.website_sequence, p.company_name, o.sequence FROM ecommerce_product_optionals o JOIN ecommerce_products source ON source.id = o.source_product_id JOIN ecommerce_products p ON p.id = o.optional_product_id WHERE o.source_product_id = :id AND o.active = TRUE AND source.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND source.company_name = p.company_name AND (:company_name IS NULL OR source.company_name = :company_name) ORDER BY o.sequence, p.website_sequence, p.name, o.id"
  - id: ecommerce_product_optional_options
    permission: ecommerce.read
    query: "SELECT p.id AS value, p.name AS label FROM ecommerce_products p JOIN ecommerce_products source ON source.id = :source_product_id WHERE p.id <> :source_product_id AND p.active = TRUE AND p.is_published = TRUE AND p.company_name = source.company_name AND (:company_name IS NULL OR p.company_name = :company_name) ORDER BY p.website_sequence, p.name, p.id"
actions:
  - { id: back_to_ecommerce_products, type: navigate, permission: ecommerce.read, navigate_to: /ecommerce/products, params: {} }
  - { id: add_ecommerce_product_to_cart, type: navigate, permission: ecommerce.write, navigate_to: /ecommerce/cart, params: { product_id: '{row.id}' } }
  - id: view_ecommerce_product_document
    type: navigate
    permission: ecommerce.read
    navigate_to: /ecommerce/products/documents/detail
    params: { id: '{row.id}' }
  - id: create_ecommerce_product_document
    type: server_form
    permission: ecommerce.write
    title: New Product Document
    action: ecommerce.products.documents.create
    handler: yaml_mutation
    operation: create
    params: { product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_documents, ecommerce_product_detail]
    mutation:
      generated: [id]
      required: [name]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_DOCUMENT_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 255", status: 422, code: ECOMMERCE_PRODUCT_DOCUMENT_NAME_INVALID, message: Document name must be between 1 and 255 characters. }
      steps:
        - { query: "INSERT INTO ecommerce_product_documents(id, row_version, product_id, name, file_name, mime_type, size_bytes, storage_key, sequence, active, shown_on_product_page, company_name) SELECT :id, 1, :product_id, :name, 'pending-upload', 'application/octet-stream', 0, 'pending/' || :id, COALESCE(:sequence, 10), FALSE, FALSE, company_name FROM ecommerce_products WHERE id = :product_id" }
      result: { query: "SELECT * FROM ecommerce_product_documents WHERE id = :id" }
    fields:
      - { field: name, label: Document Name, type: text, required: true }
      - { field: sequence, label: Sequence, type: number, min: 0, default: 10 }
  - id: delete_ecommerce_product_document_from_product
    type: server
    permission: ecommerce.write
    action: ecommerce.products.documents.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_documents, ecommerce_product_detail]
    mutation:
      guards:
        - { query: "SELECT d.id FROM ecommerce_product_documents d WHERE d.id = :id AND d.row_version = :expected_row_version AND d.active = TRUE AND (COALESCE(:current_company_name, '') = '' OR d.company_name = :current_company_name OR d.company_name IS NULL)", status: 409, code: ECOMMERCE_PRODUCT_DOCUMENT_STALE, message: This product document changed before deletion. Reload before retrying. }
      steps:
        - { query: "DELETE FROM ecommerce_product_documents WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_DOCUMENT_STALE, message: This product document changed before deletion. }
      result: { query: "SELECT TRUE AS deleted, :id AS id" }
  - id: view_ecommerce_product_variant_detail
    type: navigate
    permission: ecommerce.read
    navigate_to: /ecommerce/products/variants/detail
    params: { id: '{row.id}' }
  - id: create_ecommerce_product_alternative
    type: server_form
    permission: ecommerce.write
    title: Add Alternative Product
    action: ecommerce.products.alternatives.add
    handler: yaml_mutation
    operation: create
    params: { source_product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_alternatives, ecommerce_product_detail]
    mutation:
      generated: [id]
      required: [destination_product_id]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :source_product_id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_ALTERNATIVE_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok FROM ecommerce_products source JOIN ecommerce_products destination ON destination.id = :destination_product_id WHERE source.id = :source_product_id AND destination.id <> source.id AND destination.active = TRUE AND destination.is_published = TRUE AND destination.company_name = source.company_name AND (COALESCE(:current_company_name, '') = '' OR destination.company_name = :current_company_name)", status: 422, code: ECOMMERCE_PRODUCT_ALTERNATIVE_TARGET_INVALID, message: Choose another active published product from the current company. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_alternatives WHERE source_product_id = :source_product_id AND destination_product_id = :destination_product_id)", status: 409, code: ECOMMERCE_PRODUCT_ALTERNATIVE_EXISTS, message: This alternative product is already assigned. }
      steps:
        - { query: "INSERT INTO ecommerce_product_alternatives(id, source_product_id, destination_product_id, sequence, company_name, active) SELECT :id, :source_product_id, :destination_product_id, COALESCE(:sequence, 10), source.company_name, TRUE FROM ecommerce_products source WHERE source.id = :source_product_id" }
      result: { query: "SELECT a.*, p.name AS destination_name, p.sales_price AS destination_price FROM ecommerce_product_alternatives a JOIN ecommerce_products p ON p.id = a.destination_product_id WHERE a.id = :id" }
    fields:
      - { field: destination_product_id, label: Alternative Product, type: select, options_source: ecommerce_product_alternative_options, required: true }
      - { field: sequence, label: Sequence, type: number, default: 10, min: 0 }
  - id: create_ecommerce_product_accessory
    type: server_form
    permission: ecommerce.write
    title: Add Accessory Product
    action: ecommerce.products.accessories.add
    handler: yaml_mutation
    operation: create
    params: { source_product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_accessories, ecommerce_product_detail]
    mutation:
      generated: [id]
      required: [accessory_product_id]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :source_product_id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_ACCESSORY_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok FROM ecommerce_products source JOIN ecommerce_products accessory ON accessory.id = :accessory_product_id WHERE source.id = :source_product_id AND accessory.id <> source.id AND accessory.active = TRUE AND accessory.is_published = TRUE AND accessory.company_name = source.company_name AND (COALESCE(:current_company_name, '') = '' OR accessory.company_name = :current_company_name)", status: 422, code: ECOMMERCE_PRODUCT_ACCESSORY_TARGET_INVALID, message: Choose another active published product from the current company. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_accessories WHERE source_product_id = :source_product_id AND accessory_product_id = :accessory_product_id)", status: 409, code: ECOMMERCE_PRODUCT_ACCESSORY_EXISTS, message: This accessory product is already assigned. }
      steps:
        - { query: "INSERT INTO ecommerce_product_accessories(id, source_product_id, accessory_product_id, sequence, company_name, active) SELECT :id, :source_product_id, :accessory_product_id, COALESCE(:sequence, 10), source.company_name, TRUE FROM ecommerce_products source WHERE source.id = :source_product_id" }
      result: { query: "SELECT a.*, p.name AS accessory_name, p.sales_price AS accessory_price FROM ecommerce_product_accessories a JOIN ecommerce_products p ON p.id = a.accessory_product_id WHERE a.id = :id" }
    fields:
      - { field: accessory_product_id, label: Accessory Product, type: select, options_source: ecommerce_product_accessory_options, required: true }
      - { field: sequence, label: Sequence, type: number, default: 10, min: 0 }
  - id: create_ecommerce_product_optional
    type: server_form
    permission: ecommerce.write
    title: Add Optional Product
    action: ecommerce.products.optionals.add
    handler: yaml_mutation
    operation: create
    params: { source_product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_optionals, ecommerce_product_detail]
    mutation:
      generated: [id]
      required: [optional_product_id]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :source_product_id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_OPTIONAL_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok FROM ecommerce_products source JOIN ecommerce_products optional_product ON optional_product.id = :optional_product_id WHERE source.id = :source_product_id AND optional_product.id <> source.id AND optional_product.active = TRUE AND optional_product.is_published = TRUE AND optional_product.company_name = source.company_name AND (COALESCE(:current_company_name, '') = '' OR optional_product.company_name = :current_company_name)", status: 422, code: ECOMMERCE_PRODUCT_OPTIONAL_TARGET_INVALID, message: Choose another active published product from the current company. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_optionals WHERE source_product_id = :source_product_id AND optional_product_id = :optional_product_id)", status: 409, code: ECOMMERCE_PRODUCT_OPTIONAL_EXISTS, message: This optional product is already assigned. }
      steps:
        - { query: "INSERT INTO ecommerce_product_optionals(id, source_product_id, optional_product_id, sequence, company_name, active) SELECT :id, :source_product_id, :optional_product_id, COALESCE(:sequence, 10), source.company_name, TRUE FROM ecommerce_products source WHERE source.id = :source_product_id" }
      result: { query: "SELECT o.*, p.name AS optional_name, p.sales_price AS optional_price FROM ecommerce_product_optionals o JOIN ecommerce_products p ON p.id = o.optional_product_id WHERE o.id = :id" }
    fields:
      - { field: optional_product_id, label: Optional Product, type: select, options_source: ecommerce_product_optional_options, required: true }
      - { field: sequence, label: Sequence, type: number, default: 10, min: 0 }
  - id: remove_ecommerce_product_alternative
    type: server
    permission: ecommerce.write
    action: ecommerce.products.alternatives.remove
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_alternatives, ecommerce_product_detail]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT a.id FROM ecommerce_product_alternatives a JOIN ecommerce_products source ON source.id = a.source_product_id WHERE a.id = :id AND a.row_version = :expected_row_version AND a.active = TRUE AND (COALESCE(:current_company_name, '') = '' OR source.company_name = :current_company_name)", status: 409, code: ECOMMERCE_PRODUCT_ALTERNATIVE_STALE, message: This alternative assignment changed or was removed. Reload before removing. }
      steps:
        - { query: "DELETE FROM ecommerce_product_alternatives WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_ALTERNATIVE_STALE, message: This alternative assignment changed before removal. }
      result: { query: "SELECT TRUE AS deleted, :id AS id" }
  - id: remove_ecommerce_product_accessory
    type: server
    permission: ecommerce.write
    action: ecommerce.products.accessories.remove
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_accessories, ecommerce_product_detail]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT a.id FROM ecommerce_product_accessories a JOIN ecommerce_products source ON source.id = a.source_product_id WHERE a.id = :id AND a.row_version = :expected_row_version AND a.active = TRUE AND (COALESCE(:current_company_name, '') = '' OR source.company_name = :current_company_name)", status: 409, code: ECOMMERCE_PRODUCT_ACCESSORY_STALE, message: This accessory assignment changed or was removed. Reload before removing. }
      steps:
        - { query: "DELETE FROM ecommerce_product_accessories WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_ACCESSORY_STALE, message: This accessory assignment changed before removal. }
      result: { query: "SELECT TRUE AS deleted, :id AS id" }
  - id: remove_ecommerce_product_optional
    type: server
    permission: ecommerce.write
    action: ecommerce.products.optionals.remove
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_optionals, ecommerce_product_detail]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT o.id FROM ecommerce_product_optionals o JOIN ecommerce_products source ON source.id = o.source_product_id WHERE o.id = :id AND o.row_version = :expected_row_version AND o.active = TRUE AND (COALESCE(:current_company_name, '') = '' OR source.company_name = :current_company_name)", status: 409, code: ECOMMERCE_PRODUCT_OPTIONAL_STALE, message: This optional assignment changed or was removed. Reload before removing. }
      steps:
        - { query: "DELETE FROM ecommerce_product_optionals WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_OPTIONAL_STALE, message: This optional assignment changed before removal. }
      result: { query: "SELECT TRUE AS deleted, :id AS id" }
  - id: add_ecommerce_product_optional_to_cart
    type: server
    permission: ecommerce.write
    action: ecommerce.cart.add_optional
    handler: yaml_mutation
    operation: create
    params: { source_product_id: '{state.ecommerce_product_detail.id}', product_id: '{row.optional_product_id}' }
    refresh: [ecommerce_product_optionals, ecommerce_cart, ecommerce_cart_lines]
    mutation:
      guards:
        - { query: "SELECT COALESCE((SELECT 'ecommerce-cart-' || id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)), 'ecommerce-cart-open-001') AS cart_id, 'ecommerce-cart-line-' || COALESCE((SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)), 'admin') || '-' || :product_id AS line_id", assign: true }
        - { query: "SELECT id FROM ecommerce_carts WHERE id = :cart_id AND state = 'Open' AND (COALESCE(:customer_scope, 'all') = 'all' OR customer_id = (SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)))", status: 403, code: ECOMMERCE_CART_OWNERSHIP_REQUIRED, message: This cart belongs to another customer or is no longer open. }
        - { query: "SELECT 1 AS ok FROM ecommerce_product_optionals o JOIN ecommerce_products source ON source.id = o.source_product_id JOIN ecommerce_products p ON p.id = o.optional_product_id WHERE o.source_product_id = :source_product_id AND o.optional_product_id = :product_id AND o.active = TRUE AND source.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND source.company_name = p.company_name AND (COALESCE(:current_company_name, '') = '' OR source.company_name = :current_company_name)", status: 422, code: ECOMMERCE_PRODUCT_OPTIONAL_UNAVAILABLE, message: This optional product is no longer available for the current product. }
      steps:
        - { query: "INSERT INTO ecommerce_cart_lines(id, cart_id, product_id, variant_id, variant_name, product_name, unit_price, quantity) SELECT :line_id, :cart_id, p.id, NULL, NULL, p.name, p.sales_price, 1 FROM ecommerce_products p WHERE p.id = :product_id ON CONFLICT (id) DO UPDATE SET quantity = ecommerce_cart_lines.quantity + 1, row_version = ecommerce_cart_lines.row_version + 1" }
        - { query: "UPDATE ecommerce_carts SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-09-21 10:00:00' WHERE id = :cart_id" }
      result: { query: "SELECT * FROM ecommerce_cart_lines WHERE cart_id = :cart_id AND product_id = :product_id" }
  - id: add_ecommerce_product_variant_to_cart
    type: server
    permission: ecommerce.write
    action: ecommerce.cart.add_variant
    handler: yaml_mutation
    operation: create
    params: { product_id: '{state.ecommerce_product_detail.id}', variant_id: '{row.id}' }
    refresh: [ecommerce_product_variants, ecommerce_cart, ecommerce_cart_lines]
    mutation:
      guards:
        - { query: "SELECT COALESCE((SELECT 'ecommerce-cart-' || id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)), 'ecommerce-cart-open-001') AS cart_id, 'ecommerce-cart-line-' || COALESCE((SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)), 'admin') || '-variant-' || :variant_id AS line_id", assign: true }
        - { query: "SELECT v.id FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :variant_id AND v.product_id = :product_id AND v.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND (COALESCE(:current_company_name, '') = '' OR p.company_name = :current_company_name)", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_UNAVAILABLE, message: Select an active variant from the current company. }
        - { query: "SELECT id FROM ecommerce_carts WHERE id = :cart_id AND state = 'Open' AND (COALESCE(:customer_scope, 'all') = 'all' OR customer_id = (SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)))", status: 403, code: ECOMMERCE_CART_OWNERSHIP_REQUIRED, message: This cart belongs to another customer or is no longer open. }
      steps:
        - { query: "INSERT INTO ecommerce_carts(id, customer_id, customer_name, currency, state, company_name) SELECT :cart_id, id, name, currency, 'Open', company_name FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email) ON CONFLICT (id) DO NOTHING" }
        - { query: "INSERT INTO ecommerce_cart_lines(id, cart_id, product_id, variant_id, variant_name, product_name, unit_price, quantity) SELECT :line_id, :cart_id, p.id, v.id, v.name, p.name, v.sales_price, 1 FROM ecommerce_products p JOIN ecommerce_product_variants v ON v.id = :variant_id AND v.product_id = p.id WHERE p.id = :product_id ON CONFLICT (id) DO UPDATE SET quantity = ecommerce_cart_lines.quantity + 1, row_version = ecommerce_cart_lines.row_version + 1" }
        - { query: "UPDATE ecommerce_carts SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-09-13 10:00:00' WHERE id = :cart_id" }
      result: { query: "SELECT * FROM ecommerce_cart_lines WHERE cart_id = :cart_id AND variant_id = :variant_id" }
  - id: upload_ecommerce_product_image
    type: upload
    action: ecommerce.products.images.upload
    handler: attachment_metadata
    permission: ecommerce.write
    kind: ecommerce_product_image
    params: { product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_images]
    mutation:
      generated: [attachment_id]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND active = TRUE", status: 404, code: ECOMMERCE_PRODUCT_NOT_FOUND, message: Product not found. }
      steps:
        - { query: "INSERT INTO ecommerce_product_images(id, product_id, file_name, mime_type, size_bytes, storage_key, uploaded_by) VALUES(:attachment_id, :product_id, :fileName, :mimeType, :sizeBytes, :storageKey, :current_user_id)" }
      result: { query: "SELECT id, product_id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM ecommerce_product_images WHERE id = :attachment_id" }
  - id: download_ecommerce_product_image
    type: download
    permission: ecommerce.read
    kind: ecommerce_product_image
  - id: create_ecommerce_product_variant
    type: server_form
    permission: ecommerce.write
    title: New Product Variant
    action: ecommerce.product_variants.create
    handler: yaml_mutation
    operation: create
    params: { product_id: '{state.ecommerce_product_detail.id}' }
    refresh: [ecommerce_product_variants, ecommerce_product_detail]
    mutation:
      generated: [id]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND active = TRUE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_VARIANT_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 120", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_NAME_INVALID, message: Variant name must be between 1 and 120 characters. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:combination_key AS VARCHAR))) BETWEEN 1 AND 200", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_COMBINATION_INVALID, message: Add a stable attribute combination. }
        - { query: "SELECT 1 AS ok WHERE CAST(:sales_price AS DECIMAL(12,2)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_PRICE_INVALID, message: Variant price must be non-negative. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_COMPARE_PRICE_INVALID, message: Compare to Price must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:base_unit_count, 0) AS DECIMAL(20,8)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_COUNT_INVALID, message: Base unit count must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:base_unit_name, '') = '' OR LENGTH(TRIM(CAST(:base_unit_name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_NAME_INVALID, message: Base unit name must be between 1 and 80 characters. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_variants WHERE product_id = :product_id AND combination_key = :combination_key)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_COMBINATION_EXISTS, message: This attribute combination already exists. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:internal_reference, '') = '' OR NOT EXISTS (SELECT 1 FROM ecommerce_product_variants WHERE product_id = :product_id AND internal_reference = :internal_reference)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_REFERENCE_EXISTS, message: This variant reference already exists. }
      steps:
        - { query: "INSERT INTO ecommerce_product_variants(id, row_version, product_id, name, internal_reference, combination_key, attribute_values, sales_price, compare_list_price, base_unit_count, base_unit_name, active, company_name) SELECT :id, 1, :product_id, :name, NULLIF(:internal_reference, ''), :combination_key, COALESCE(:attribute_values, ''), CAST(:sales_price AS DECIMAL(12,2)), CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)), CAST(COALESCE(:base_unit_count, 0) AS DECIMAL(20,8)), NULLIF(TRIM(CAST(:base_unit_name AS VARCHAR)), ''), COALESCE(CAST(:active AS BOOLEAN), TRUE), p.company_name FROM ecommerce_products p WHERE p.id = :product_id" }
      result: { query: "SELECT * FROM ecommerce_product_variants WHERE id = :id" }
    fields:
      - { field: name, label: Variant Name, type: text, required: true }
      - { field: internal_reference, label: Internal Reference, type: text }
      - { field: combination_key, label: Combination Key, type: text, required: true, placeholder: 'color=blue,size=large' }
      - { field: attribute_values, label: Attribute Values, type: text, placeholder: 'Color: Blue, Size: Large' }
      - { field: sales_price, label: Sales Price, type: number, min: 0, required: true }
      - { field: compare_list_price, label: Compare to Price, type: number, min: 0, default: 0 }
      - { field: base_unit_count, label: Base Unit Count, type: number, min: 0, default: 0 }
      - { field: base_unit_name, label: Base Unit Name, type: text, placeholder: 'piece' }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: edit_ecommerce_product_variant
    type: server_form
    permission: ecommerce.write
    title: Edit Product Variant
    action: ecommerce.product_variants.update
    handler: yaml_mutation
    operation: update
    prefill: row
    params: { product_id: '{state.ecommerce_product_detail.id}', variant_id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_variants, ecommerce_product_detail]
    mutation:
      guards:
        - { query: "SELECT v.id FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :variant_id AND v.product_id = :product_id AND v.row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR p.company_name = :current_company_name)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_STALE, message: This product variant changed or was deleted. Reload before saving. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_VARIANT_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 120", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_NAME_INVALID, message: Variant name must be between 1 and 120 characters. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:combination_key AS VARCHAR))) BETWEEN 1 AND 200", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_COMBINATION_INVALID, message: Add a stable attribute combination. }
        - { query: "SELECT 1 AS ok WHERE CAST(:sales_price AS DECIMAL(12,2)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_PRICE_INVALID, message: Variant price must be non-negative. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_COMPARE_PRICE_INVALID, message: Compare to Price must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:base_unit_count, 0) AS DECIMAL(20,8)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_COUNT_INVALID, message: Base unit count must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:base_unit_name, '') = '' OR LENGTH(TRIM(CAST(:base_unit_name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: ECOMMERCE_PRODUCT_VARIANT_BASE_UNIT_NAME_INVALID, message: Base unit name must be between 1 and 80 characters. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_product_variants WHERE product_id = :product_id AND combination_key = :combination_key AND id <> :variant_id)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_COMBINATION_EXISTS, message: This attribute combination already exists. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:internal_reference, '') = '' OR NOT EXISTS (SELECT 1 FROM ecommerce_product_variants WHERE product_id = :product_id AND internal_reference = :internal_reference AND id <> :variant_id)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_REFERENCE_EXISTS, message: This variant reference already exists. }
      steps:
        - { query: "UPDATE ecommerce_product_variants SET row_version = row_version + 1, name = :name, internal_reference = NULLIF(:internal_reference, ''), combination_key = :combination_key, attribute_values = COALESCE(:attribute_values, ''), sales_price = CAST(:sales_price AS DECIMAL(12,2)), compare_list_price = CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)), base_unit_count = CAST(COALESCE(:base_unit_count, 0) AS DECIMAL(20,8)), base_unit_name = NULLIF(TRIM(CAST(:base_unit_name AS VARCHAR)), ''), active = CAST(:active AS BOOLEAN), updated_at = CURRENT_TIMESTAMP WHERE id = :variant_id AND product_id = :product_id AND row_version = :expected_row_version" , expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_VARIANT_STALE, message: This product variant changed or was deleted. Reload before saving. }
      result: { query: "SELECT * FROM ecommerce_product_variants WHERE id = :variant_id" }
    fields:
      - { field: name, label: Variant Name, type: text, required: true }
      - { field: internal_reference, label: Internal Reference, type: text }
      - { field: combination_key, label: Combination Key, type: text, required: true }
      - { field: attribute_values, label: Attribute Values, type: text }
      - { field: sales_price, label: Sales Price, type: number, min: 0, required: true }
      - { field: compare_list_price, label: Compare to Price, type: number, min: 0 }
      - { field: base_unit_count, label: Base Unit Count, type: number, min: 0 }
      - { field: base_unit_name, label: Base Unit Name, type: text, placeholder: 'piece' }
      - { field: active, label: Active, type: checkbox }
  - id: delete_ecommerce_product_variant
    type: server
    permission: ecommerce.write
    action: ecommerce.product_variants.delete
    handler: yaml_mutation
    operation: delete
    params: { product_id: '{state.ecommerce_product_detail.id}', variant_id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_variants, ecommerce_product_detail]
    mutation:
      guards:
        - { query: "SELECT v.id FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :variant_id AND v.product_id = :product_id AND v.row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR p.company_name = :current_company_name)", status: 409, code: ECOMMERCE_PRODUCT_VARIANT_STALE, message: This product variant changed or was deleted. Reload before deleting. }
      steps:
        - { query: "DELETE FROM ecommerce_product_variants WHERE id = :variant_id AND product_id = :product_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_VARIANT_STALE, message: This product variant changed or was deleted. Reload before deleting. }
      result: { query: "SELECT TRUE AS deleted, :variant_id AS id" }
  - id: edit_ecommerce_product
    type: server_form
    permission: ecommerce.write
    title: Edit product
    action: ecommerce.products.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [ecommerce_product_detail, ecommerce_products, ecommerce_shop_products]
    mutation:
      operation: update
      table: ecommerce_products
      fields: [name, internal_reference, product_type, category, sales_price, compare_list_price, website_description, website_sequence, is_published]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id", status: 404, code: ECOMMERCE_PRODUCT_NOT_FOUND, message: Product not found. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE :internal_reference IS NULL OR NOT EXISTS (SELECT 1 FROM ecommerce_products WHERE internal_reference = :internal_reference AND id <> :id)", status: 409, code: ECOMMERCE_PRODUCT_REFERENCE_EXISTS, message: Internal reference already exists. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)) >= 0", status: 422, code: ECOMMERCE_PRODUCT_COMPARE_PRICE_INVALID, message: Compare to Price must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:website_description, '') AS VARCHAR)) <= 10000 AND LOWER(CAST(COALESCE(:website_description, '') AS VARCHAR)) NOT LIKE '%<script%'", status: 422, code: ECOMMERCE_PRODUCT_WEBSITE_DESCRIPTION_INVALID, message: Website description must be safe text up to 10000 characters. }
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
    fields:
      - { field: name, label: Product Name, type: text, required: true }
      - { field: internal_reference, label: Internal Reference, type: text }
      - { field: product_type, label: Product Type, type: select, options: [Goods, Service] }
      - { field: category, label: eCommerce Category, type: text }
      - { field: sales_price, label: Sales Price, type: number }
      - { field: compare_list_price, label: Compare to Price, type: number, min: 0 }
      - { field: website_description, label: Website Description, type: richtext }
      - { field: website_sequence, label: Website Sequence, type: number }
      - { field: is_published, label: Published, type: checkbox }
