page: { id: ecommerce-pricelists }
datasources:
  - id: ecommerce_pricelists
    single: false
    permission: ecommerce.read
    error_states: { forbidden: { status: 403, code: ECOMMERCE_PRICELISTS_FORBIDDEN, message: You do not have access to eCommerce pricelists. }, transport_error: { status: 503, code: ECOMMERCE_PRICELISTS_UNAVAILABLE, message: eCommerce pricelists are temporarily unavailable. } }
    query: "SELECT id, row_version, sequence, name, country_groups, currency, company, active FROM ecommerce_pricelists WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(country_groups, '') ILIKE '%' || :q || '%') AND (:active IS NULL OR active = :active) ORDER BY sequence, name"
  - id: ecommerce_pricelist_active
    single: false
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES (true, 'Active'), (false, 'Archived')) statuses(value, label)"
actions:
  - id: view_ecommerce_pricelist
    type: navigate
    permission: ecommerce.read
    navigate_to: /ecommerce/pricelists/detail
    params: { id: '{row.id}' }
  - id: create_ecommerce_pricelist
    type: server_form
    permission: ecommerce.write
    title: New pricelist
    action: ecommerce.pricelists.create
    handler: yaml_mutation
    operation: create
    refresh: [ecommerce_pricelists]
    mutation:
      operation: insert
      table: ecommerce_pricelists
      fields: [sequence, name, country_groups, currency, company, active]
      required: [name]
      defaults: { sequence: 10, currency: USD, active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_pricelists WHERE name = :name)"
          status: 409
          code: ECOMMERCE_PRICELIST_NAME_EXISTS
          message: Pricelist name already exists
      result: { query: "SELECT * FROM ecommerce_pricelists WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: currency, label: Currency, type: text, default: USD }
      - { field: company, label: Company, type: text }
      - { field: country_groups, label: Country Groups, type: text, placeholder: All countries }
      - { field: sequence, label: Sequence, type: number, default: 10 }
  - id: archive_ecommerce_pricelist
    type: server
    permission: ecommerce.write
    action: ecommerce.pricelists.archive
    handler: pricelist_status
    operation: archive
    params: { id: '{row.id}' }
    refresh: [ecommerce_pricelists]
    mutation:
      guards:
        - query: "SELECT id FROM ecommerce_pricelists WHERE id = :id AND active = true"
          status: 409
          code: ECOMMERCE_PRICELIST_ALREADY_ARCHIVED
          message: Pricelist is already archived
      steps:
        - query: "UPDATE ecommerce_pricelists SET active = false, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id"
      result: { query: "SELECT * FROM ecommerce_pricelists WHERE id = :id" }
