page: { id: ecommerce-shop-product-cta-policy }
datasources:
  - id: ecommerce_shop_product_cta_policy
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_SHOP_PRODUCT_CTA_UNAUTHENTICATED, message: Sign in to view Shop Add to Cart settings. }
      forbidden: { status: 403, code: ECOMMERCE_SHOP_PRODUCT_CTA_FORBIDDEN, message: You do not have permission to view Shop Add to Cart settings. }
      missing_record: { status: 404, code: ECOMMERCE_SHOP_PRODUCT_CTA_NOT_FOUND, message: Shop Add to Cart settings were not found for this company. }
      transport_error: { status: 503, code: ECOMMERCE_SHOP_PRODUCT_CTA_UNAVAILABLE, message: Shop Add to Cart settings are temporarily unavailable. }
    query: "SELECT id, row_version, company_name, show_cta, CASE WHEN show_cta THEN 'Show Add to Cart' ELSE 'Hide Add to Cart' END AS cta_behavior, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_shop_product_cta_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company') AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
actions:
  - id: edit_ecommerce_shop_product_cta_policy
    type: server_form
    permission: ecommerce.write
    title: Save Shop Add to Cart
    action: ecommerce.shop.product_cta.update
    handler: yaml_mutation
    operation: update
    prefill: row
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_shop_product_cta_policy, ecommerce_shop_products]
    mutation:
      required: [id, expected_row_version, show_cta]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_shop_product_cta_policies WHERE id = :id AND row_version = :expected_row_version AND company_name = COALESCE(NULLIF(:current_company_name, ''), company_name)", status: 409, code: ECOMMERCE_SHOP_PRODUCT_CTA_STALE, message: These Shop Add to Cart settings changed or belong to another company. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE LOWER(CAST(:show_cta AS VARCHAR)) IN ('true', 'false')", status: 422, code: ECOMMERCE_SHOP_PRODUCT_CTA_INVALID, message: Show Add to Cart must be true or false. }
      steps:
        - { query: "UPDATE ecommerce_shop_product_cta_policies SET show_cta = CAST(:show_cta AS BOOLEAN), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_SHOP_PRODUCT_CTA_STALE, message: These Shop Add to Cart settings changed before saving. Reload before retrying. }
      result: { query: "SELECT id, row_version, company_name, show_cta, CASE WHEN show_cta THEN 'Show Add to Cart' ELSE 'Hide Add to Cart' END AS cta_behavior, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_shop_product_cta_policies WHERE id = :id" }
    fields:
      - { field: show_cta, label: Show Add to Cart, type: checkbox, required: true }
