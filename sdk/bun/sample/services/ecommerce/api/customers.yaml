page: { id: ecommerce-customers }
datasources:
  - id: ecommerce_customers
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_CUSTOMERS_UNAUTHENTICATED, message: Sign in to view eCommerce customers. }
      forbidden: { status: 403, code: ECOMMERCE_CUSTOMERS_FORBIDDEN, message: You do not have permission to view eCommerce customers. }
      transport_error: { status: 503, code: ECOMMERCE_CUSTOMERS_UNAVAILABLE, message: eCommerce customers are temporarily unavailable. }
    query: "SELECT id, row_version, name, email, order_count, total_spent, currency, active, company_name FROM ecommerce_customers WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(email, '') ILIKE '%' || :q || '%') AND (:active IS NULL OR active = :active) AND (:company_name IS NULL OR company_name = :company_name) ORDER BY name, id"
  - id: ecommerce_customer_active
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES (true, 'Active'), (false, 'Archived')) states(value, label)"
actions:
  - { id: view_ecommerce_customer_orders, type: navigate, permission: ecommerce.read, navigate_to: /ecommerce/orders, params: { customer_id: '{row.id}' } }
