page: { id: ecommerce-product-page-image-layout-policy }
datasources:
  - id: ecommerce_product_page_image_layout_policy
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_UNAUTHENTICATED, message: Sign in to view product page image layout settings. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_FORBIDDEN, message: You do not have permission to view product page image layout settings. }
      missing_record: { status: 404, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_NOT_FOUND, message: Product page image layout settings were not found for this company. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_UNAVAILABLE, message: Product page image layout settings are temporarily unavailable. }
    query: "SELECT id, row_version, company_name, image_layout, CASE image_layout WHEN 'grid' THEN 'Grid' ELSE 'Carousel' END AS image_layout_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_page_image_layout_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company') AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
  - id: ecommerce_product_page_image_layout_options
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('carousel', 'Carousel'), ('grid', 'Grid')) layouts(value, label)"
actions:
  - id: edit_ecommerce_product_page_image_layout_policy
    type: server_form
    permission: ecommerce.write
    title: Save Product Page Image Layout
    action: ecommerce.products.page_image_layout.update
    handler: yaml_mutation
    operation: update
    prefill: row
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_page_image_layout_policy, ecommerce_product_detail]
    mutation:
      required: [id, expected_row_version, image_layout]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_product_page_image_layout_policies WHERE id = :id AND row_version = :expected_row_version AND company_name = COALESCE(NULLIF(:current_company_name, ''), company_name)", status: 409, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_STALE, message: These product page image layout settings changed or belong to another company. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE :image_layout IN ('carousel', 'grid')", status: 422, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_INVALID, message: Choose Carousel or Grid. }
      steps:
        - { query: "UPDATE ecommerce_product_page_image_layout_policies SET image_layout = :image_layout, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_LAYOUT_STALE, message: These product page image layout settings changed before saving. Reload before retrying. }
      result: { query: "SELECT id, row_version, company_name, image_layout, CASE image_layout WHEN 'grid' THEN 'Grid' ELSE 'Carousel' END AS image_layout_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_page_image_layout_policies WHERE id = :id" }
    fields:
      - { field: image_layout, label: Product Page Image Layout, type: select, options_source: ecommerce_product_page_image_layout_options, required: true }
