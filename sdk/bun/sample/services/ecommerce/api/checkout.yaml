page: { id: ecommerce-checkout }
datasources:
  - id: ecommerce_checkout_cart
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_CHECKOUT_UNAUTHENTICATED, message: Sign in to check out. }
      forbidden: { status: 403, code: ECOMMERCE_CHECKOUT_FORBIDDEN, message: You do not have permission to check out this cart. }
      missing_record: { status: 404, code: ECOMMERCE_CHECKOUT_CART_NOT_FOUND, message: Cart not found. }
      transport_error: { status: 503, code: ECOMMERCE_CHECKOUT_UNAVAILABLE, message: Checkout is temporarily unavailable. }
    query: "SELECT c.id, c.row_version, c.customer_id, c.customer_name, c.currency, c.state, c.company_name, COALESCE(SUM(l.quantity), 0) AS item_count, COALESCE(SUM(l.quantity * l.unit_price), 0) AS amount_total FROM ecommerce_carts c LEFT JOIN ecommerce_cart_lines l ON l.cart_id = c.id WHERE CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN FALSE ELSE TRUE END AND c.id = COALESCE(:cart_id, 'ecommerce-cart-open-001') AND (:company_name IS NULL OR c.company_name = :company_name) AND (:customer_id IS NULL OR c.customer_id = :customer_id) AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(c.customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email))) GROUP BY c.id, c.row_version, c.customer_id, c.customer_name, c.currency, c.state, c.company_name"
  - id: ecommerce_delivery_methods
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('Standard Delivery', 'Standard Delivery'), ('Express Delivery', 'Express Delivery')) methods(value, label)"
  - id: ecommerce_payment_methods
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('Wire Transfer', 'Wire Transfer'), ('Cash on Delivery', 'Cash on Delivery')) methods(value, label)"
actions:
  - { id: back_to_ecommerce_cart, type: navigate, permission: ecommerce.read, navigate_to: /ecommerce/cart, params: {} }
  - id: confirm_ecommerce_checkout
    type: server_form
    permission: ecommerce.write
    title: Confirm order
    action: ecommerce.checkout.confirm
    handler: yaml_mutation
    operation: create
    params: { cart_id: '{state.ecommerce_checkout_cart.id}' }
    refresh: [ecommerce_checkout_cart, ecommerce_orders]
    mutation:
      required: [customer_name, customer_email, shipping_address, delivery_method, payment_method]
      before_steps:
        - { query: "SELECT COALESCE(:cart_id, 'ecommerce-cart-open-001') AS cart_id, 'ecommerce-order-checkout-' || COALESCE(:cart_id, 'ecommerce-cart-open-001') AS id", assign: true }
      guards:
        - { query: "SELECT id FROM ecommerce_carts WHERE id = :cart_id AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email)))", status: 403, code: ECOMMERCE_CHECKOUT_OWNERSHIP_REQUIRED, message: This cart belongs to another customer. }
        - { query: "SELECT id FROM ecommerce_carts WHERE id = :cart_id AND state = 'Open'", status: 409, code: ECOMMERCE_CHECKOUT_CART_CLOSED, message: This cart is no longer available for checkout. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM ecommerce_cart_lines WHERE cart_id = :cart_id)", status: 422, code: ECOMMERCE_CHECKOUT_CART_EMPTY, message: Add a product before checking out. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:customer_email AS VARCHAR))) > 3 AND POSITION('@' IN CAST(:customer_email AS VARCHAR)) > 1", status: 422, code: ECOMMERCE_CHECKOUT_EMAIL_INVALID, message: Enter a valid customer email. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:delivery_method, '') IN ('Standard Delivery', 'Express Delivery')", status: 422, code: ECOMMERCE_CHECKOUT_DELIVERY_INVALID, message: Choose a valid delivery method. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:payment_method, '') IN ('Wire Transfer', 'Cash on Delivery')", status: 422, code: ECOMMERCE_CHECKOUT_PAYMENT_INVALID, message: Choose a valid payment method. }
      steps:
        - { query: "INSERT INTO ecommerce_orders (id, order_number, customer_id, customer_name, customer_email, amount_total, currency, state, date_order, company_name, cart_id, shipping_address, delivery_method, payment_method) SELECT :id, 'WEB/2026/' || LPAD(CAST((SELECT COUNT(*) + 1 FROM ecommerce_orders) AS VARCHAR), 4, '0'), c.customer_id, :customer_name, :customer_email, COALESCE((SELECT SUM(quantity * unit_price) FROM ecommerce_cart_lines WHERE cart_id = :cart_id), 0), c.currency, 'Quotation', TIMESTAMP '2026-09-13 09:00:00', c.company_name, c.id, :shipping_address, :delivery_method, :payment_method FROM ecommerce_carts c WHERE c.id = :cart_id AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(c.customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email)))" }
        - { query: "INSERT INTO ecommerce_order_lines (id, order_id, product_id, product_name, unit_price, quantity, line_total) SELECT 'ecommerce-order-line-' || CAST(l.id AS VARCHAR), :id, l.product_id, l.product_name, l.unit_price, l.quantity, l.quantity * l.unit_price FROM ecommerce_cart_lines l WHERE l.cart_id = :cart_id" }
        - { query: "UPDATE ecommerce_carts SET state = 'Converted', row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :cart_id AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email)))" }
      result: { query: "SELECT * FROM ecommerce_orders WHERE id = :id" }
    fields:
      - { field: cart_id, label: Cart, type: hidden }
      - { field: customer_name, label: Customer Name, type: text, required: true }
      - { field: customer_email, label: Customer Email, type: text, required: true }
      - { field: shipping_address, label: Shipping Address, type: textarea, required: true }
      - { field: delivery_method, label: Delivery Method, type: select, options_source: ecommerce_delivery_methods, required: true }
      - { field: payment_method, label: Payment Method, type: select, options_source: ecommerce_payment_methods, required: true }
