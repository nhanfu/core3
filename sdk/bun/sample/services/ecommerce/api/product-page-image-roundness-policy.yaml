page: { id: ecommerce-product-page-image-roundness-policy }
datasources:
  - id: ecommerce_product_page_image_roundness_policy
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_UNAUTHENTICATED, message: Sign in to view product page image roundness settings. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_FORBIDDEN, message: You do not have permission to view product page image roundness settings. }
      missing_record: { status: 404, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_NOT_FOUND, message: Product page image roundness settings were not found for this company. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_UNAVAILABLE, message: Product page image roundness settings are temporarily unavailable. }
    query: "SELECT id, row_version, company_name, image_roundness, CASE image_roundness WHEN 'none' THEN 'None' WHEN 'small' THEN 'Small' WHEN 'medium' THEN 'Medium' ELSE 'Big' END AS image_roundness_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_page_image_roundness_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company') AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
  - id: ecommerce_product_page_image_roundness_options
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('none', 'None'), ('small', 'Small'), ('medium', 'Medium'), ('big', 'Big')) roundness(value, label)"
actions:
  - id: edit_ecommerce_product_page_image_roundness_policy
    type: server_form
    permission: ecommerce.write
    title: Save Product Page Image Roundness
    action: ecommerce.products.page_image_roundness.update
    handler: yaml_mutation
    operation: update
    prefill: row
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_page_image_roundness_policy, ecommerce_product_detail]
    mutation:
      required: [id, expected_row_version, image_roundness]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_product_page_image_roundness_policies WHERE id = :id AND row_version = :expected_row_version AND company_name = COALESCE(NULLIF(:current_company_name, ''), company_name)", status: 409, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_STALE, message: These product page image roundness settings changed or belong to another company. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE :image_roundness IN ('none', 'small', 'medium', 'big')", status: 422, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_INVALID, message: Choose a supported product image roundness. }
      steps:
        - { query: "UPDATE ecommerce_product_page_image_roundness_policies SET image_roundness = :image_roundness, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_ROUNDNESS_STALE, message: These product page image roundness settings changed before saving. Reload before retrying. }
      result: { query: "SELECT id, row_version, company_name, image_roundness, CASE image_roundness WHEN 'none' THEN 'None' WHEN 'small' THEN 'Small' WHEN 'medium' THEN 'Medium' ELSE 'Big' END AS image_roundness_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_page_image_roundness_policies WHERE id = :id" }
    fields:
      - { field: image_roundness, label: Product Page Image Roundness, type: select, options_source: ecommerce_product_page_image_roundness_options, required: true }
