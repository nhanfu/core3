page: { id: ecommerce-shop }
datasources:
  - id: ecommerce_shop_products
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_SHOP_UNAUTHENTICATED, message: Sign in to browse the shop. }
      forbidden: { status: 403, code: ECOMMERCE_SHOP_FORBIDDEN, message: You do not have permission to browse the shop. }
      transport_error: { status: 503, code: ECOMMERCE_SHOP_UNAVAILABLE, message: The shop is temporarily unavailable. }
    query: "SELECT id, row_version, name, internal_reference, product_type, category, sales_price, compare_list_price, CASE WHEN compare_list_price > sales_price THEN compare_list_price ELSE NULL END AS compare_at_price, website_description, website_size_x, website_size_y, website_sequence, is_published, CAST(publish_date AS VARCHAR) AS publish_date, active, company_name, COALESCE((SELECT page_container FROM ecommerce_shop_page_container_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')), 'regular') AS shop_page_container, COALESCE((SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')), 'website_sequence asc') AS default_sort, COALESCE((SELECT prevent_zero_price_sale FROM ecommerce_zero_price_sale_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')), FALSE) AS prevent_zero_price_sale, COALESCE((SELECT add_to_cart_action FROM ecommerce_add_to_cart_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')), 'stay') AS add_to_cart_action, CASE COALESCE((SELECT add_to_cart_action FROM ecommerce_add_to_cart_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')), 'stay') WHEN 'go_to_cart' THEN '/ecommerce/cart' ELSE '/ecommerce/shop' END AS redirect_path, NOT (COALESCE((SELECT prevent_zero_price_sale FROM ecommerce_zero_price_sale_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')), FALSE) AND sales_price <= 0) AS add_to_cart_allowed, CASE WHEN COALESCE((SELECT prevent_zero_price_sale FROM ecommerce_zero_price_sale_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')), FALSE) AND sales_price <= 0 THEN (SELECT contact_us_button_url FROM ecommerce_zero_price_sale_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')) ELSE NULL END AS contact_us_button_url FROM ecommerce_products WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND active = TRUE AND is_published = TRUE AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(category, '') ILIKE '%' || :q || '%' OR COALESCE(website_description, '') ILIKE '%' || :q || '%') AND (:company_name IS NULL OR company_name = :company_name) ORDER BY CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')) WHEN 'website_sequence asc' THEN website_sequence END ASC, CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')) WHEN 'publish_date desc' THEN publish_date END DESC, CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')) WHEN 'name asc' THEN name END ASC, CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')) WHEN 'list_price asc' THEN sales_price END ASC, CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')) WHEN 'list_price desc' THEN sales_price END DESC, name, id"
  - id: ecommerce_shop_page_container
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_SHOP_PAGE_CONTAINER_UNAUTHENTICATED, message: Sign in to view shop page container. }
      forbidden: { status: 403, code: ECOMMERCE_SHOP_PAGE_CONTAINER_FORBIDDEN, message: You do not have permission to view shop page container. }
      transport_error: { status: 503, code: ECOMMERCE_SHOP_PAGE_CONTAINER_UNAVAILABLE, message: Shop page container is temporarily unavailable. }
    query: "SELECT id, row_version, company_name, page_container, CASE page_container WHEN 'fluid' THEN 'Full-width' ELSE 'Regular' END AS page_container_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_shop_page_container_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company')"
actions:
  - id: shop_add_to_cart
    type: server
    permission: ecommerce.write
    action: ecommerce.cart.add
    handler: yaml_mutation
    operation: create
    params: { product_id: '{row.id}' }
    refresh: [ecommerce_shop_products]
    mutation:
      guards:
        - { query: "SELECT COALESCE((SELECT 'ecommerce-cart-' || id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)), 'ecommerce-cart-open-001') AS cart_id, 'ecommerce-cart-line-' || COALESCE((SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)), 'admin') || '-' || :product_id AS line_id", assign: true }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND active = TRUE AND is_published = TRUE", status: 404, code: ECOMMERCE_SHOP_PRODUCT_UNAVAILABLE, message: This product is no longer available. }
        - { query: "SELECT p.id FROM ecommerce_products p WHERE p.id = :product_id AND (COALESCE((SELECT prevent_zero_price_sale FROM ecommerce_zero_price_sale_policies WHERE company_name = p.company_name), FALSE) = FALSE OR p.sales_price > 0)", status: 422, code: ECOMMERCE_SHOP_ZERO_PRICE_UNAVAILABLE, message: This product is contact-only because its price is zero. }
        - { query: "SELECT id FROM ecommerce_carts WHERE id = :cart_id AND state = 'Open' AND (COALESCE(:customer_scope, 'all') = 'all' OR customer_id = (SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)))", status: 403, code: ECOMMERCE_CART_OWNERSHIP_REQUIRED, message: This cart belongs to another customer. }
      steps:
        - { query: "INSERT INTO ecommerce_carts(id, customer_id, customer_name, currency, state, company_name) SELECT :cart_id, id, name, currency, 'Open', company_name FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email) ON CONFLICT (id) DO NOTHING" }
        - { query: "UPDATE ecommerce_carts SET company_name = COALESCE(company_name, (SELECT company_name FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email))) WHERE id = :cart_id" }
        - { query: "INSERT INTO ecommerce_cart_lines(id, cart_id, product_id, variant_id, variant_name, product_name, unit_price, quantity) SELECT :line_id, :cart_id, id, NULL, NULL, name, sales_price, 1 FROM ecommerce_products WHERE id = :product_id ON CONFLICT (id) DO UPDATE SET quantity = ecommerce_cart_lines.quantity + 1, row_version = ecommerce_cart_lines.row_version + 1" }
        - { query: "UPDATE ecommerce_carts SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-09-13 10:00:00' WHERE id = :cart_id" }
      result: { query: "SELECT l.*, COALESCE((SELECT add_to_cart_action FROM ecommerce_add_to_cart_policies p JOIN ecommerce_carts c ON p.company_name = COALESCE(c.company_name, 'My Company') WHERE c.id = l.cart_id), 'stay') AS add_to_cart_action, CASE COALESCE((SELECT add_to_cart_action FROM ecommerce_add_to_cart_policies p JOIN ecommerce_carts c ON p.company_name = COALESCE(c.company_name, 'My Company') WHERE c.id = l.cart_id), 'stay') WHEN 'go_to_cart' THEN '/ecommerce/cart' ELSE '/ecommerce/shop' END AS redirect_path FROM ecommerce_cart_lines l WHERE l.cart_id = :cart_id AND l.product_id = :product_id" }
  - { id: shop_view_cart, type: navigate, permission: ecommerce.read, navigate_to: /ecommerce/cart, params: {} }
  - id: anonymous_shop_add_to_cart
    type: server
    permission: ecommerce.read
    action: ecommerce.cart.anonymous_add
    handler: yaml_mutation
    operation: create
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE COALESCE((SELECT access_mode FROM ecommerce_access_policies WHERE company_name = 'My Company'), 'everyone') = 'everyone' OR COALESCE(:authenticated, FALSE) = TRUE", status: 401, code: ECOMMERCE_ACCESS_AUTHENTICATION_REQUIRED, message: Sign in to browse this eCommerce shop. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :product_id AND active = TRUE AND is_published = TRUE AND company_name = 'My Company'", status: 404, code: ECOMMERCE_SHOP_PRODUCT_UNAVAILABLE, message: This product is no longer available. }
        - { query: "SELECT p.id FROM ecommerce_products p WHERE p.id = :product_id AND (COALESCE((SELECT prevent_zero_price_sale FROM ecommerce_zero_price_sale_policies WHERE company_name = p.company_name), FALSE) = FALSE OR COALESCE((SELECT v.sales_price FROM ecommerce_product_variants v WHERE v.id = NULLIF(:variant_id, '') AND v.product_id = p.id), p.sales_price) > 0)", status: 422, code: ECOMMERCE_SHOP_ZERO_PRICE_UNAVAILABLE, message: This product is contact-only because its price is zero. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:variant_id, '') = '' OR EXISTS (SELECT 1 FROM ecommerce_product_variants v JOIN ecommerce_products p ON p.id = v.product_id WHERE v.id = :variant_id AND v.product_id = :product_id AND v.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND p.company_name = 'My Company')", status: 422, code: ECOMMERCE_SHOP_VARIANT_UNAVAILABLE, message: Select an active variant for this product. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM ecommerce_carts WHERE id = :cart_id) OR EXISTS (SELECT 1 FROM ecommerce_carts WHERE id = :cart_id AND state = 'Open' AND customer_id IS NULL AND id LIKE 'ecommerce-cart-anon-%')", status: 403, code: ECOMMERCE_PUBLIC_CART_INVALID, message: This anonymous cart is no longer available. }
      steps:
        - { query: "INSERT INTO ecommerce_carts(id, customer_id, customer_name, currency, state, company_name) VALUES (:cart_id, NULL, 'Guest Cart', 'USD', 'Open', 'My Company') ON CONFLICT (id) DO NOTHING" }
        - { query: "INSERT INTO ecommerce_cart_lines(id, cart_id, product_id, variant_id, variant_name, product_name, unit_price, quantity) SELECT :line_id, :cart_id, p.id, v.id, v.name, p.name, COALESCE(v.sales_price, p.sales_price), 1 FROM ecommerce_products p LEFT JOIN ecommerce_product_variants v ON v.id = NULLIF(:variant_id, '') AND v.product_id = p.id WHERE p.id = :product_id ON CONFLICT (id) DO UPDATE SET quantity = ecommerce_cart_lines.quantity + 1, row_version = ecommerce_cart_lines.row_version + 1" }
        - { query: "UPDATE ecommerce_carts SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-09-13 10:00:00' WHERE id = :cart_id" }
      result: { query: "SELECT l.*, COALESCE((SELECT add_to_cart_action FROM ecommerce_add_to_cart_policies p JOIN ecommerce_carts c ON p.company_name = COALESCE(c.company_name, 'My Company') WHERE c.id = l.cart_id), 'stay') AS add_to_cart_action, CASE COALESCE((SELECT add_to_cart_action FROM ecommerce_add_to_cart_policies p JOIN ecommerce_carts c ON p.company_name = COALESCE(c.company_name, 'My Company') WHERE c.id = l.cart_id), 'stay') WHEN 'go_to_cart' THEN '/ecommerce/cart' ELSE '/ecommerce/shop' END AS redirect_path FROM ecommerce_cart_lines l WHERE l.cart_id = :cart_id AND l.product_id = :product_id" }
