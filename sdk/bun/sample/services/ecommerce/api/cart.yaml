page: { id: ecommerce-cart }
datasources:
  - id: ecommerce_cart
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_CART_UNAUTHENTICATED, message: Sign in to view your cart. }
      forbidden: { status: 403, code: ECOMMERCE_CART_FORBIDDEN, message: You do not have permission to view this cart. }
      transport_error: { status: 503, code: ECOMMERCE_CART_UNAVAILABLE, message: Cart details are temporarily unavailable. }
    query: "SELECT c.id, c.row_version, c.customer_id, c.customer_name, c.currency, c.state, c.company_name, c.pricelist_id, COALESCE(SUM(l.quantity), 0) AS item_count, COALESCE(SUM(l.quantity * l.unit_price), 0) AS amount_total FROM ecommerce_carts c LEFT JOIN ecommerce_cart_lines l ON l.cart_id = c.id WHERE CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN FALSE ELSE TRUE END AND c.id = COALESCE(:id, 'ecommerce-cart-open-001') AND (:company_name IS NULL OR c.company_name = :company_name) AND (:customer_id IS NULL OR c.customer_id = :customer_id) AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(c.customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email))) GROUP BY c.id, c.row_version, c.customer_id, c.customer_name, c.currency, c.state, c.company_name, c.pricelist_id"
  - id: ecommerce_cart_lines
    permission: ecommerce.read
    query: "SELECT l.id, l.row_version, l.cart_id, l.product_id, l.variant_id, l.variant_name, l.product_name, l.unit_price, l.quantity, l.quantity * l.unit_price AS line_total FROM ecommerce_cart_lines l JOIN ecommerce_carts c ON c.id = l.cart_id WHERE l.cart_id = COALESCE(:cart_id, 'ecommerce-cart-open-001') AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(c.customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email))) ORDER BY l.id"
  - id: ecommerce_cart_accessories
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_CART_ACCESSORIES_UNAUTHENTICATED, message: Sign in to view cart accessory products. }
      forbidden: { status: 403, code: ECOMMERCE_CART_ACCESSORIES_FORBIDDEN, message: You do not have permission to view cart accessory products. }
      transport_error: { status: 503, code: ECOMMERCE_CART_ACCESSORIES_UNAVAILABLE, message: Cart accessory products are temporarily unavailable. }
    query: "SELECT DISTINCT a.id, a.row_version, a.source_product_id, a.accessory_product_id AS product_id, p.name, p.internal_reference, p.product_type, p.category, p.sales_price, p.website_sequence, p.company_name, a.sequence FROM ecommerce_product_accessories a JOIN ecommerce_cart_lines l ON l.product_id = a.source_product_id JOIN ecommerce_carts c ON c.id = l.cart_id JOIN ecommerce_products source ON source.id = a.source_product_id JOIN ecommerce_products p ON p.id = a.accessory_product_id LEFT JOIN ecommerce_cart_lines carted ON carted.cart_id = c.id AND carted.product_id = p.id WHERE c.id = COALESCE(:cart_id, 'ecommerce-cart-open-001') AND c.state = 'Open' AND carted.id IS NULL AND a.active = TRUE AND source.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND source.company_name = p.company_name AND (COALESCE(:company_name, '') = '' OR c.company_name = :company_name) AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(c.customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email))) ORDER BY a.sequence, p.website_sequence, p.name, a.id"
  - id: ecommerce_cart_pricelists
    permission: ecommerce.read
    query: "SELECT id AS value, name AS label FROM ecommerce_pricelists WHERE active = TRUE AND (company IS NULL OR company = COALESCE(:company_name, 'My Company')) ORDER BY sequence, name"
actions:
  - { id: continue_ecommerce_shopping, type: navigate, permission: ecommerce.read, navigate_to: /ecommerce/products, params: {} }
  - { id: checkout_ecommerce_cart, type: navigate, permission: ecommerce.write, navigate_to: /ecommerce/checkout, params: { cart_id: '{state.ecommerce_cart.id}' } }
  - id: update_ecommerce_cart_line
    type: server_form
    permission: ecommerce.write
    title: Update Cart Line
    action: ecommerce.cart_lines.update
    handler: yaml_mutation
    operation: update
    refresh: [ecommerce_cart, ecommerce_cart_lines]
    mutation: { operation: update, table: ecommerce_cart_lines, fields: [quantity], required: [quantity], concurrency: { required: true }, guards: [{ query: "SELECT 1 AS ok WHERE CAST(:quantity AS INTEGER) > 0", status: 422, code: ECOMMERCE_CART_QUANTITY_INVALID, message: Quantity must be positive. }, { query: "SELECT 1 AS ok WHERE COALESCE(:customer_scope, 'all') = 'all' OR EXISTS (SELECT 1 FROM ecommerce_cart_lines l JOIN ecommerce_carts c ON c.id = l.cart_id JOIN ecommerce_customers ec ON ec.id = c.customer_id WHERE l.id = :id AND (:current_company_name IS NULL OR :current_company_name = '' OR c.company_name = :current_company_name) AND lower(COALESCE(ec.email, '')) = lower(:current_user_email))", status: 403, code: ECOMMERCE_CART_OWNERSHIP_REQUIRED, message: This cart line belongs to another customer or company. }], result: { query: "SELECT * FROM ecommerce_cart_lines WHERE id = :id" } }
    fields: [{ field: quantity, label: Quantity, type: number, required: true, min: 1 }]
  - id: remove_ecommerce_cart_line
    type: server
    permission: ecommerce.write
    action: ecommerce.cart_lines.remove
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_cart, ecommerce_cart_lines]
    mutation:
      operation: delete
      table: ecommerce_cart_lines
      concurrency: { required: true }
      guards:
        - { query: "SELECT id, cart_id FROM ecommerce_cart_lines WHERE id = :id AND row_version = :expected_row_version", status: 409, code: ECOMMERCE_CART_LINE_STALE, message: This cart line has changed. Reload your cart., assign: true }
        - { query: "SELECT 1 AS ok FROM ecommerce_cart_lines l JOIN ecommerce_carts c ON c.id = l.cart_id JOIN ecommerce_customers ec ON ec.id = c.customer_id WHERE l.id = :id AND (COALESCE(:customer_scope, 'all') = 'all' OR ((:current_company_name IS NULL OR :current_company_name = '' OR c.company_name = :current_company_name) AND lower(COALESCE(ec.email, '')) = lower(:current_user_email)))", status: 403, code: ECOMMERCE_CART_OWNERSHIP_REQUIRED, message: This cart line belongs to another customer or company. }
      steps:
        - { query: "UPDATE ecommerce_carts SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-09-13 10:00:00' WHERE id = :cart_id" }
  - id: apply_ecommerce_cart_pricelist
    type: server_form
    permission: ecommerce.write
    title: Change cart pricelist
    action: ecommerce.carts.apply_pricelist
    handler: yaml_mutation
    operation: update
    params: { id: '{state.ecommerce_cart.id}', expected_row_version: '{state.ecommerce_cart.row_version}' }
    refresh: [ecommerce_cart, ecommerce_cart_lines]
    mutation:
      operation: update
      table: ecommerce_carts
      fields: [pricelist_id]
      required: [pricelist_id]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_carts WHERE id = :id AND state = 'Open' AND row_version = :expected_row_version AND (COALESCE(:customer_scope, 'all') = 'all' OR customer_id = (SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)))", status: 403, code: ECOMMERCE_CART_OWNERSHIP_REQUIRED, message: This cart belongs to another customer or is no longer open. }
        - { query: "SELECT id FROM ecommerce_pricelists WHERE id = :pricelist_id AND active = TRUE AND (company IS NULL OR COALESCE(:current_company_name, '') = '' OR company = :current_company_name)", status: 422, code: ECOMMERCE_PRICELIST_INVALID, message: Select an active pricelist. }
      steps:
        - { query: "UPDATE ecommerce_cart_lines l SET unit_price = COALESCE((SELECT CASE r.compute_price WHEN 'percentage' THEN COALESCE((SELECT sales_price FROM ecommerce_product_variants v WHERE v.id = l.variant_id), p.sales_price) * (1 - r.percent_price / 100) WHEN 'formula' THEN (CASE WHEN r.price_round > 0 THEN ROUND((COALESCE((SELECT sales_price FROM ecommerce_product_variants v WHERE v.id = l.variant_id), p.sales_price) * (1 - r.price_discount / 100)) / r.price_round) * r.price_round ELSE COALESCE((SELECT sales_price FROM ecommerce_product_variants v WHERE v.id = l.variant_id), p.sales_price) * (1 - r.price_discount / 100) END) + r.price_surcharge ELSE COALESCE(r.fixed_price, r.price) END FROM ecommerce_pricelist_rules r JOIN ecommerce_products p ON p.id = l.product_id WHERE r.pricelist_id = :pricelist_id AND (r.applied_on = '3_global' OR (r.applied_on = '1_product' AND r.product_id = p.id AND r.variant_id IS NULL) OR (r.applied_on = '0_product_variant' AND r.variant_id = l.variant_id) OR (r.applied_on = '2_product_category' AND r.category_name = p.category)) AND r.min_quantity <= l.quantity AND (r.date_start IS NULL OR r.date_start <= DATE '2026-09-13') AND (r.date_end IS NULL OR r.date_end >= DATE '2026-09-13') ORDER BY CASE r.applied_on WHEN '0_product_variant' THEN 0 WHEN '1_product' THEN 1 WHEN '2_product_category' THEN 2 ELSE 3 END, r.min_quantity DESC, r.id LIMIT 1), (SELECT COALESCE((SELECT sales_price FROM ecommerce_product_variants v WHERE v.id = l.variant_id), p.sales_price) FROM ecommerce_products p WHERE p.id = l.product_id)), row_version = l.row_version + 1 WHERE l.cart_id = :id" }
      result: { query: "SELECT * FROM ecommerce_carts WHERE id = :id" }
    fields: [{ field: pricelist_id, label: Pricelist, type: select, options_source: ecommerce_cart_pricelists, required: true }]
  - id: add_ecommerce_cart_accessory
    type: server
    permission: ecommerce.write
    action: ecommerce.cart.add_accessory
    handler: yaml_mutation
    operation: create
    params: { product_id: '{row.product_id}' }
    refresh: [ecommerce_cart, ecommerce_cart_lines, ecommerce_cart_accessories]
    mutation:
      guards:
        - { query: "SELECT COALESCE((SELECT 'ecommerce-cart-' || id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)), 'ecommerce-cart-open-001') AS cart_id, 'ecommerce-cart-line-' || COALESCE((SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)), 'admin') || '-' || :product_id AS line_id", assign: true }
        - { query: "SELECT 1 AS ok FROM ecommerce_carts c WHERE c.id = :cart_id AND c.state = 'Open' AND (COALESCE(:customer_scope, 'all') = 'all' OR c.customer_id = (SELECT id FROM ecommerce_customers WHERE lower(email) = lower(:current_user_email)))", status: 403, code: ECOMMERCE_CART_OWNERSHIP_REQUIRED, message: This cart belongs to another customer or is no longer open. }
        - { query: "SELECT 1 AS ok FROM ecommerce_product_accessories a JOIN ecommerce_cart_lines l ON l.product_id = a.source_product_id AND l.cart_id = :cart_id JOIN ecommerce_products p ON p.id = a.accessory_product_id WHERE a.accessory_product_id = :product_id AND a.active = TRUE AND p.active = TRUE AND p.is_published = TRUE AND (COALESCE(:current_company_name, '') = '' OR p.company_name = :current_company_name)", status: 422, code: ECOMMERCE_CART_ACCESSORY_UNAVAILABLE, message: This accessory is no longer available for this cart. }
      steps:
        - { query: "INSERT INTO ecommerce_cart_lines(id, cart_id, product_id, variant_id, variant_name, product_name, unit_price, quantity) SELECT :line_id, :cart_id, p.id, NULL, NULL, p.name, p.sales_price, 1 FROM ecommerce_products p WHERE p.id = :product_id ON CONFLICT (id) DO UPDATE SET quantity = ecommerce_cart_lines.quantity + 1, row_version = ecommerce_cart_lines.row_version + 1" }
        - { query: "UPDATE ecommerce_carts SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-09-21 10:00:00' WHERE id = :cart_id" }
      result: { query: "SELECT * FROM ecommerce_cart_lines WHERE cart_id = :cart_id AND product_id = :product_id" }
