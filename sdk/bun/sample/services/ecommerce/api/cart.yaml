page: { id: ecommerce-cart }
datasources:
  - id: ecommerce_cart
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_CART_UNAUTHENTICATED, message: Sign in to view your cart. }
      forbidden: { status: 403, code: ECOMMERCE_CART_FORBIDDEN, message: You do not have permission to view this cart. }
      transport_error: { status: 503, code: ECOMMERCE_CART_UNAVAILABLE, message: Cart details are temporarily unavailable. }
    query: "SELECT c.id, c.row_version, c.customer_id, c.customer_name, c.currency, c.state, c.company_name, COALESCE(SUM(l.quantity), 0) AS item_count, COALESCE(SUM(l.quantity * l.unit_price), 0) AS amount_total FROM ecommerce_carts c LEFT JOIN ecommerce_cart_lines l ON l.cart_id = c.id WHERE CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN FALSE ELSE TRUE END AND c.id = COALESCE(:id, 'ecommerce-cart-open-001') AND (:company_name IS NULL OR c.company_name = :company_name) AND (:customer_id IS NULL OR c.customer_id = :customer_id) AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(c.customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email))) GROUP BY c.id, c.row_version, c.customer_id, c.customer_name, c.currency, c.state, c.company_name"
  - id: ecommerce_cart_lines
    permission: ecommerce.read
    query: "SELECT l.id, l.row_version, l.cart_id, l.product_id, l.product_name, l.unit_price, l.quantity, l.quantity * l.unit_price AS line_total FROM ecommerce_cart_lines l JOIN ecommerce_carts c ON c.id = l.cart_id WHERE l.cart_id = COALESCE(:cart_id, 'ecommerce-cart-open-001') AND (COALESCE(:customer_scope, 'all') = 'all' OR lower(COALESCE(c.customer_id, '')) IN (SELECT lower(id) FROM ecommerce_customers WHERE lower(COALESCE(email, '')) = lower(:current_user_email))) ORDER BY l.id"
actions:
  - { id: continue_ecommerce_shopping, type: navigate, permission: ecommerce.read, navigate_to: /ecommerce/products, params: {} }
  - { id: checkout_ecommerce_cart, type: navigate, permission: ecommerce.write, navigate_to: /ecommerce/checkout, params: { cart_id: '{state.ecommerce_cart.id}' } }
  - id: update_ecommerce_cart_line
    type: server_form
    permission: ecommerce.write
    title: Update Cart Line
    action: ecommerce.cart_lines.update
    handler: yaml_mutation
    operation: update
    refresh: [ecommerce_cart, ecommerce_cart_lines]
    mutation: { operation: update, table: ecommerce_cart_lines, fields: [quantity], required: [quantity], concurrency: { required: true }, guards: [{ query: "SELECT 1 AS ok WHERE CAST(:quantity AS INTEGER) > 0", status: 422, code: ECOMMERCE_CART_QUANTITY_INVALID, message: Quantity must be positive. }, { query: "SELECT 1 AS ok WHERE COALESCE(:customer_scope, 'all') = 'all' OR EXISTS (SELECT 1 FROM ecommerce_cart_lines l JOIN ecommerce_carts c ON c.id = l.cart_id JOIN ecommerce_customers ec ON ec.id = c.customer_id WHERE l.id = :id AND lower(COALESCE(ec.email, '')) = lower(:current_user_email))", status: 403, code: ECOMMERCE_CART_OWNERSHIP_REQUIRED, message: This cart line belongs to another customer. }], result: { query: "SELECT * FROM ecommerce_cart_lines WHERE id = :id" } }
    fields: [{ field: quantity, label: Quantity, type: number, required: true, min: 1 }]
