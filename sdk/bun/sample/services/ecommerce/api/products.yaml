page: { id: ecommerce-products }
datasources:
  - id: ecommerce_products
    single: false
    permission: ecommerce.read
    error_states: { unauthorized: { status: 401, code: ECOMMERCE_PRODUCTS_UNAUTHENTICATED, message: Sign in to view eCommerce products. }, forbidden: { status: 403, code: ECOMMERCE_PRODUCTS_FORBIDDEN, message: You do not have access to eCommerce products. }, transport_error: { status: 503, code: ECOMMERCE_PRODUCTS_UNAVAILABLE, message: eCommerce products are temporarily unavailable. } }
    query: "SELECT id, row_version, name, internal_reference, product_type, category, sales_price, compare_list_price, CASE WHEN compare_list_price > sales_price THEN compare_list_price ELSE NULL END AS compare_at_price, website_description, website_size_x, website_size_y, website_sequence, is_published, CAST(publish_date AS VARCHAR) AS publish_date, active, company_name FROM ecommerce_products WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(internal_reference, '') ILIKE '%' || :q || '%' OR COALESCE(category, '') ILIKE '%' || :q || '%' OR COALESCE(website_description, '') ILIKE '%' || :q || '%') AND (:published IS NULL OR is_published = :published) AND (:company_name IS NULL OR company_name = :company_name) ORDER BY website_sequence, name"
  - id: ecommerce_product_published
    single: false
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES (true, 'Published'), (false, 'Unpublished')) statuses(value, label)"
actions:
  - id: export_ecommerce_products
    type: client
    permission: ecommerce.read
    script: |
      // js
      ({ state }) => {
        const rows = Array.isArray(state.ecommerce_products) ? state.ecommerce_products : [];
        const columns = ['name', 'internal_reference', 'product_type', 'category', 'sales_price', 'compare_list_price', 'compare_at_price', 'website_sequence', 'is_published', 'active', 'company_name'];
        const escape = (value) => JSON.stringify(String(value ?? ''));
        const csv = [columns.join(','), ...rows.map((row) => columns.map((column) => escape(row[column])).join(','))].join('\\n');
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const anchor = document.createElement('a'); anchor.href = url; anchor.download = 'ecommerce-products.csv'; anchor.click(); URL.revokeObjectURL(url);
      }
  - id: import_ecommerce_products
    type: server_form
    permission: ecommerce.write
    title: Import products
    action: ecommerce.products.import
    handler: yaml_mutation
    operation: create
    submit_label: Import
    refresh: [ecommerce_products]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:product_list AS VARCHAR))) > 0", status: 422, code: ECOMMERCE_PRODUCT_IMPORT_REQUIRED, message: Add at least one product row. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM (SELECT trim(unnest(string_split(CAST(:product_list AS VARCHAR), chr(10)))) AS line) lines WHERE line <> '' AND NOT regexp_matches(line, '^[^|]+\\|[^|]+\\|[0-9]+(\\.[0-9]+)?$'))", status: 422, code: ECOMMERCE_PRODUCT_IMPORT_INVALID, message: Each row must use Name|Internal Reference|Sales Price format. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR COALESCE(:company_name, :current_company_name) = :current_company_name", status: 403, code: ECOMMERCE_COMPANY_SCOPE_REQUIRED, message: Products must belong to the current company. }
      steps:
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(CAST(:product_list AS VARCHAR), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS name, trim(split_part(line, '|', 2)) AS internal_reference, CAST(trim(split_part(line, '|', 3)) AS DECIMAL(12,2)) AS sales_price FROM lines WHERE line <> '') INSERT INTO ecommerce_products(id, row_version, name, internal_reference, product_type, category, sales_price, compare_list_price, website_sequence, is_published, active, company_name) SELECT 'ecommerce-product-import-' || regexp_replace(lower(internal_reference), '[^a-z0-9]+', '-', 'g'), 1, name, internal_reference, 'Goods', 'All Products', sales_price, 0, 10, false, true, COALESCE(:company_name, :current_company_name, 'My Company') FROM parsed ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name, sales_price = EXCLUDED.sales_price, compare_list_price = 0, company_name = EXCLUDED.company_name, updated_at = TIMESTAMP '2026-09-13 10:00:00'" }
      result: { query: "SELECT COUNT(*) AS imported FROM ecommerce_products WHERE id LIKE 'ecommerce-product-import-%'" }
    fields: [{ field: product_list, label: Product List, type: textarea, required: true, placeholder: 'Travel Mug|ECOM-IMP-001|25.50\nDesk Lamp|ECOM-IMP-002|44.00' }]
  - id: create_ecommerce_product
    type: server_form
    permission: ecommerce.write
    title: New product
    action: ecommerce.products.create
    handler: yaml_mutation
    operation: create
    refresh: [ecommerce_products]
    mutation:
      operation: insert
      table: ecommerce_products
      fields: [name, internal_reference, product_type, category, sales_price, compare_list_price, website_description, website_size_x, website_size_y, website_sequence, is_published, company_name]
      required: [name]
      defaults: { product_type: Goods, sales_price: 0, compare_list_price: 0, website_description: '', website_size_x: 1, website_size_y: 1, website_sequence: 10, is_published: false, company_name: My Company }
      guards:
        - query: "SELECT 1 AS ok WHERE :internal_reference IS NULL OR NOT EXISTS (SELECT 1 FROM ecommerce_products WHERE internal_reference = :internal_reference)"
          status: 409
          code: ECOMMERCE_PRODUCT_REFERENCE_EXISTS
          message: Internal reference already exists
        - query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR COALESCE(:company_name, :current_company_name) = :current_company_name"
          status: 403
          code: ECOMMERCE_COMPANY_SCOPE_REQUIRED
          message: Products must belong to the current company.
        - query: "SELECT 1 AS ok WHERE CAST(COALESCE(:compare_list_price, 0) AS DECIMAL(12,2)) >= 0"
          status: 422
          code: ECOMMERCE_PRODUCT_COMPARE_PRICE_INVALID
          message: Compare to Price must be zero or greater.
        - query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:website_description, '') AS VARCHAR)) <= 10000 AND LOWER(CAST(COALESCE(:website_description, '') AS VARCHAR)) NOT LIKE '%<script%'"
          status: 422
          code: ECOMMERCE_PRODUCT_WEBSITE_DESCRIPTION_INVALID
          message: Website description must be safe text up to 10000 characters.
        - query: "SELECT 1 AS ok WHERE CAST(COALESCE(:website_size_x, 1) AS INTEGER) BETWEEN 1 AND 12 AND CAST(COALESCE(:website_size_y, 1) AS INTEGER) BETWEEN 1 AND 12"
          status: 422
          code: ECOMMERCE_PRODUCT_DISPLAY_DIMENSIONS_INVALID
          message: Product display dimensions must be between 1 and 12.
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
    fields:
      - { field: name, label: Product Name, type: text, required: true }
      - { field: internal_reference, label: Internal Reference, type: text }
      - { field: product_type, label: Product Type, type: select, options: [Goods, Service] }
      - { field: category, label: eCommerce Category, type: text }
      - { field: sales_price, label: Sales Price, type: number }
      - { field: compare_list_price, label: Compare to Price, type: number, min: 0 }
      - { field: website_description, label: Website Description, type: richtext }
      - { field: website_size_x, label: Display Width, type: number, min: 1, max: 12, default: 1 }
      - { field: website_size_y, label: Display Height, type: number, min: 1, max: 12, default: 1 }
      - { field: website_sequence, label: Website Sequence, type: number }
      - { field: is_published, label: Published, type: checkbox }
      - { field: company_name, label: Company, type: text, default: My Company }
  - id: archive_ecommerce_product
    type: server
    permission: ecommerce.write
    action: ecommerce.products.archive
    handler: product_status
    operation: archive
    params: { id: '{row.id}' }
    refresh: [ecommerce_products]
    mutation:
      guards:
        - query: "SELECT id FROM ecommerce_products WHERE id = :id AND active = true"
          status: 409
          code: ECOMMERCE_PRODUCT_ALREADY_ARCHIVED
          message: Product is already archived
      steps:
        - query: "UPDATE ecommerce_products SET active = false, is_published = false, publish_date = NULL, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id"
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
  - id: publish_ecommerce_product
    type: server
    permission: ecommerce.write
    action: ecommerce.products.publish
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_products, ecommerce_product_detail, ecommerce_shop_products]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_PUBLICATION_STALE, message: This product changed before it could be published. Reload before retrying. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
      steps:
        - { query: "UPDATE ecommerce_products SET is_published = TRUE, publish_date = COALESCE(publish_date, CURRENT_TIMESTAMP), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_PUBLICATION_STALE, message: This product changed before it could be published. }
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
  - id: unpublish_ecommerce_product
    type: server
    permission: ecommerce.write
    action: ecommerce.products.unpublish
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_products, ecommerce_product_detail, ecommerce_shop_products]
    mutation:
      required: [id, expected_row_version]
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_PUBLICATION_STALE, message: This product changed before it could be unpublished. Reload before retrying. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
      steps:
        - { query: "UPDATE ecommerce_products SET is_published = FALSE, publish_date = NULL, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_PUBLICATION_STALE, message: This product changed before it could be unpublished. }
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
  - id: move_ecommerce_product_top
    type: server
    permission: ecommerce.write
    action: ecommerce.products.sequence.top
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_products, ecommerce_product_detail, ecommerce_shop_products]
    mutation:
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_SEQUENCE_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_STALE, message: This product changed before it could be reordered. }
      steps:
        - { query: "UPDATE ecommerce_products SET website_sequence = COALESCE((SELECT MIN(other_product.website_sequence) - 5 FROM ecommerce_products other_product WHERE other_product.active = TRUE AND other_product.company_name = ecommerce_products.company_name AND other_product.is_published = ecommerce_products.is_published AND other_product.id <> ecommerce_products.id), 0), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_STALE, message: This product changed before it could be moved. }
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
  - id: move_ecommerce_product_bottom
    type: server
    permission: ecommerce.write
    action: ecommerce.products.sequence.bottom
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_products, ecommerce_product_detail, ecommerce_shop_products]
    mutation:
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_SEQUENCE_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_STALE, message: This product changed before it could be reordered. }
      steps:
        - { query: "UPDATE ecommerce_products SET website_sequence = COALESCE((SELECT MAX(other_product.website_sequence) + 5 FROM ecommerce_products other_product WHERE other_product.active = TRUE AND other_product.company_name = ecommerce_products.company_name AND other_product.is_published = ecommerce_products.is_published AND other_product.id <> ecommerce_products.id), 10), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_STALE, message: This product changed before it could be moved. }
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
  - id: move_ecommerce_product_up
    type: server
    permission: ecommerce.write
    action: ecommerce.products.sequence.up
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_products, ecommerce_product_detail, ecommerce_shop_products]
    mutation:
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_SEQUENCE_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_STALE, message: This product changed before it could be reordered. }
        - { query: "SELECT previous_product.id FROM ecommerce_products current_product JOIN ecommerce_products previous_product ON previous_product.active = TRUE AND previous_product.company_name = current_product.company_name AND previous_product.is_published = current_product.is_published AND previous_product.website_sequence < current_product.website_sequence WHERE current_product.id = :id ORDER BY previous_product.website_sequence DESC, previous_product.name DESC LIMIT 1", status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_EDGE, message: This product is already at the top of its published state. }
      steps:
        - { query: "WITH current_product AS (SELECT id, website_sequence, is_published, company_name FROM ecommerce_products WHERE id = :id), previous_product AS (SELECT p.id, p.website_sequence FROM ecommerce_products p JOIN current_product c ON p.active = TRUE AND p.company_name = c.company_name AND p.is_published = c.is_published AND p.website_sequence < c.website_sequence ORDER BY p.website_sequence DESC, p.name DESC LIMIT 1) UPDATE ecommerce_products AS product SET website_sequence = CASE WHEN product.id = current_product.id THEN previous_product.website_sequence ELSE current_product.website_sequence END, row_version = product.row_version + 1, updated_at = CURRENT_TIMESTAMP FROM current_product, previous_product WHERE product.id IN (current_product.id, previous_product.id)", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_STALE, message: This product changed before it could be moved. }
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
  - id: move_ecommerce_product_down
    type: server
    permission: ecommerce.write
    action: ecommerce.products.sequence.down
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_products, ecommerce_product_detail, ecommerce_shop_products]
    mutation:
      guards:
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: ECOMMERCE_PRODUCT_SEQUENCE_COMPANY_SCOPE_REQUIRED, message: This product belongs to another company. }
        - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND row_version = :expected_row_version AND active = TRUE", status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_STALE, message: This product changed before it could be reordered. }
        - { query: "SELECT next_product.id FROM ecommerce_products current_product JOIN ecommerce_products next_product ON next_product.active = TRUE AND next_product.company_name = current_product.company_name AND next_product.is_published = current_product.is_published AND next_product.website_sequence > current_product.website_sequence WHERE current_product.id = :id ORDER BY next_product.website_sequence ASC, next_product.name ASC LIMIT 1", status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_EDGE, message: This product is already at the bottom of its published state. }
      steps:
        - { query: "WITH current_product AS (SELECT id, website_sequence, is_published, company_name FROM ecommerce_products WHERE id = :id), next_product AS (SELECT p.id, p.website_sequence FROM ecommerce_products p JOIN current_product c ON p.active = TRUE AND p.company_name = c.company_name AND p.is_published = c.is_published AND p.website_sequence > c.website_sequence ORDER BY p.website_sequence ASC, p.name ASC LIMIT 1) UPDATE ecommerce_products AS product SET website_sequence = CASE WHEN product.id = current_product.id THEN next_product.website_sequence ELSE current_product.website_sequence END, row_version = product.row_version + 1, updated_at = CURRENT_TIMESTAMP FROM current_product, next_product WHERE product.id IN (current_product.id, next_product.id)", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_SEQUENCE_STALE, message: This product changed before it could be moved. }
      result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
