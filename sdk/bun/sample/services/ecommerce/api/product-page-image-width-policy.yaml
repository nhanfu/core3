page: { id: ecommerce-product-page-image-width-policy }
datasources:
  - id: ecommerce_product_page_image_width_policy
    single: true
    permission: ecommerce.read
    error_states:
      unauthorized: { status: 401, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_UNAUTHENTICATED, message: Sign in to view product page image width settings. }
      forbidden: { status: 403, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_FORBIDDEN, message: You do not have permission to view product page image width settings. }
      missing_record: { status: 404, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_NOT_FOUND, message: Product page image width settings were not found for this company. }
      transport_error: { status: 503, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_UNAVAILABLE, message: Product page image width settings are temporarily unavailable. }
    query: "SELECT id, row_version, company_name, image_width, CASE image_width WHEN 'none' THEN 'Hidden' WHEN '33_pc' THEN '33 %' WHEN '50_pc' THEN '50 %' WHEN '66_pc' THEN '66 %' ELSE '100 %' END AS image_width_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_page_image_width_policies WHERE company_name = COALESCE(NULLIF(:company_name, ''), 'My Company') AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END"
  - id: ecommerce_product_page_image_width_options
    permission: ecommerce.read
    query: "SELECT value, label FROM (VALUES ('none', 'Hidden'), ('33_pc', '33 %'), ('50_pc', '50 %'), ('66_pc', '66 %'), ('100_pc', '100 %')) widths(value, label)"
actions:
  - id: edit_ecommerce_product_page_image_width_policy
    type: server_form
    permission: ecommerce.write
    title: Save Product Page Image Width
    action: ecommerce.products.page_image_width.update
    handler: yaml_mutation
    operation: update
    prefill: row
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [ecommerce_product_page_image_width_policy, ecommerce_product_detail]
    mutation:
      required: [id, expected_row_version, image_width]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM ecommerce_product_page_image_width_policies WHERE id = :id AND row_version = :expected_row_version AND company_name = COALESCE(NULLIF(:current_company_name, ''), company_name)", status: 409, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_STALE, message: These product page image width settings changed or belong to another company. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE :image_width IN ('none', '33_pc', '50_pc', '66_pc', '100_pc')", status: 422, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_INVALID, message: Choose a supported product image width. }
      steps:
        - { query: "UPDATE ecommerce_product_page_image_width_policies SET image_width = :image_width, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ECOMMERCE_PRODUCT_PAGE_IMAGE_WIDTH_STALE, message: These product page image width settings changed before saving. Reload before retrying. }
      result: { query: "SELECT id, row_version, company_name, image_width, CASE image_width WHEN 'none' THEN 'Hidden' WHEN '33_pc' THEN '33 %' WHEN '50_pc' THEN '50 %' WHEN '66_pc' THEN '66 %' ELSE '100 %' END AS image_width_label, CAST(updated_at AS VARCHAR) AS updated_at FROM ecommerce_product_page_image_width_policies WHERE id = :id" }
    fields:
      - { field: image_width, label: Product Page Image Width, type: select, options_source: ecommerce_product_page_image_width_options, required: true }
