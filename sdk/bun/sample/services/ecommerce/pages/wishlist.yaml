title: Wishlist
page: { id: ecommerce-wishlist, route: /ecommerce/wishlist, breadcrumb: [eCommerce, Shop, Wishlist], auth: { require: [ecommerce.read] } }
components:
  - type: ListView
    variant: odoo
    source: ecommerce_wishlist_items
    responsive_card: true
    search: { label: Search wishlist, placeholder: 'Search saved products or variants...' }
    columns:
      - { field: product_name, label: Product, type: PrimaryEntityCell }
      - { field: variant_name, label: Variant }
      - { field: price, label: Saved Price, align: right }
      - { field: customer_name, label: Customer }
      - { field: added_at, label: Added }
    row_actions: menu
    actions:
      - { id: add_to_cart_ecommerce_wishlist_item, label: Add to Cart, permission: ecommerce.write, variant: primary }
      - { id: remove_ecommerce_wishlist_item, label: Remove, permission: ecommerce.write, variant: danger }
    page_size: 50
    row_key: id
    empty_state: { title: Your wishlist is empty, description: Save a published product to find it here later. }
  - type: OdooFormView
    source: ecommerce_wishlist_page_layout
    editable: false
    title_field: company_name
    groups:
      - { title: Wishlist Page Layout, columns: 2, fields: [{ field: company_name, label: Company }, { field: desktop_columns_label, label: Desktop, type: StatusChip }, { field: mobile_columns_label, label: Mobile, type: StatusChip }, { field: gap_label, label: Grid Gap, type: StatusChip }] }
