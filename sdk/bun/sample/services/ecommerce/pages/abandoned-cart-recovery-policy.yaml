title: Abandoned Cart Recovery Policy
page: { id: ecommerce-abandoned-cart-recovery-policy, route: /ecommerce/abandoned-cart-recovery-policy, breadcrumb: [eCommerce, Configuration, Abandoned Cart Recovery], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_abandoned_cart_recovery_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_abandoned_cart_recovery_policy, label: Save Recovery Policy, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Follow up Abandoned Carts, columns: 2, fields: [{ field: company_name, label: Company }, { field: recovery_status, label: Status, type: StatusChip }, { field: send_abandoned_cart_email, label: Send Abandoned Cart Email, type: checkbox }, { field: cart_abandoned_delay_hours, label: Send After Hours, type: number }, { field: recovery_template_id, label: Recovery Email Template, type: select, options_source: ecommerce_abandoned_cart_recovery_template_options }] }
