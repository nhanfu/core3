title: Product Page Image Layout
page: { id: ecommerce-product-page-image-layout-policy, route: /ecommerce/product-page-image-layout, breadcrumb: [eCommerce, Configuration, Product Page Image Layout], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_product_page_image_layout_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_product_page_image_layout_policy, label: Save Image Layout, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Product Page Images, columns: 2, fields: [{ field: company_name, label: Company }, { field: image_layout, label: Product Page Image Layout, type: select, options_source: ecommerce_product_page_image_layout_options }, { field: image_layout_label, label: Current Layout, type: StatusChip }, { field: updated_at, label: Last Updated }] }
