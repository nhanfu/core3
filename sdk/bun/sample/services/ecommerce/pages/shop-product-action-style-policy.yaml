      - { title: Shop Product Cards, columns: 2, fields: [{ field: company_name, label: Company }, { field: action_style, label: Product Action Style, type: select, options_source: ecommerce_shop_product_action_style_options, required: true }, { field: action_style_label, label: Current Style, type: StatusChip }, { field: updated_at, label: Last Updated }] }
