title: Shop Product Action Style
page: { id: ecommerce-shop-product-action-style-policy, route: /ecommerce/shop-product-action-style, breadcrumb: [eCommerce, Configuration, Shop Product Action Style], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_shop_product_action_style_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_shop_product_action_style_policy, label: Save Action Style, variant: primary, permission: ecommerce.write }
