title: Tax Display Policy
page: { id: ecommerce-tax-display-policy, route: /ecommerce/tax-display-policy, breadcrumb: [eCommerce, Configuration, Tax Display Policy], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_tax_display_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_tax_display_policy, label: Save Policy, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Checkout Pricing, columns: 2, fields: [{ field: company_name, label: Company }, { field: tax_display_label, label: Current Display, type: StatusChip }, { field: subtotal_label, label: Subtotal Contract }, { field: show_line_subtotals_tax_selection, label: Line Subtotals Tax Display, type: select, options_source: ecommerce_tax_display_policy_options }] }
