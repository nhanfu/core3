page: { id: ecommerce-checkout, route: /ecommerce/checkout, breadcrumb: [eCommerce, Orders, Checkout], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_checkout_cart
    editable: false
    title_field: customer_name
    header_actions: [{ id: back_to_ecommerce_cart, label: Back to Cart, variant: secondary }]
    groups:
      - { title: Order Summary, columns: 2, fields: [{ field: customer_name, label: Customer }, { field: state, label: Status, type: StatusChip }, { field: item_count, label: Items }, { field: amount_total, label: Total }] }
      - { title: Checkout, columns: 1, fields: [{ field: customer_name, label: Customer Name, type: text }, { field: customer_email, label: Customer Email, type: text }, { field: shipping_address, label: Shipping Address, type: textarea }, { field: delivery_method, label: Delivery Method, type: select, options_source: ecommerce_delivery_methods }, { field: payment_method, label: Payment Method, type: select, options_source: ecommerce_payment_methods }] }
