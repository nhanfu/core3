title: Shop Page Container
page: { id: ecommerce-shop-page-container-policy, route: /ecommerce/shop-page-container, breadcrumb: [eCommerce, Configuration, Shop Page Container], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_shop_page_container_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_shop_page_container_policy, label: Save Shop Container, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Shop Layout, columns: 2, fields: [{ field: company_name, label: Company }, { field: page_container, label: Shop Page Container, type: select, options_source: ecommerce_shop_page_container_options }, { field: page_container_label, label: Current Container, type: StatusChip }, { field: updated_at, label: Last Updated }] }
