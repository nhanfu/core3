title: Add to Cart Redirect
page: { id: ecommerce-add-to-cart-policy, route: /ecommerce/add-to-cart-policy, breadcrumb: [eCommerce, Configuration, Add to Cart Redirect], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_add_to_cart_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_add_to_cart_policy, label: Save Redirect, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Add to Cart, columns: 2, fields: [{ field: company_name, label: Company }, { field: action_label, label: Current Action, type: StatusChip }, { field: add_to_cart_action, label: Add to Cart Action, type: select, options_source: ecommerce_add_to_cart_policy_options }, { field: redirect_path, label: Redirect Path }] }
