title: Shop Product Wishlist
page: { id: ecommerce-shop-product-wishlist-policy, route: /ecommerce/shop-product-wishlist, breadcrumb: [eCommerce, Configuration, Shop Product Wishlist], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_shop_product_wishlist_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_shop_product_wishlist_policy, label: Save Product Wishlist, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Shop Product Cards, columns: 2, fields: [{ field: company_name, label: Company }, { field: show_wishlist, label: Show Product Wishlist, type: checkbox, required: true }, { field: wishlist_behavior, label: Current Behavior, type: StatusChip }, { field: updated_at, label: Last Updated }] }
