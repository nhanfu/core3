title: Product Page Columns Order
page: { id: ecommerce-product-page-columns-order-policy, route: /ecommerce/product-page-columns-order, breadcrumb: [eCommerce, Configuration, Product Page Columns Order], auth: { require: [ecommerce.read] } }
components:
