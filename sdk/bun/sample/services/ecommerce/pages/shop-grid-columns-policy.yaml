title: Shop Grid Columns
page: { id: ecommerce-shop-grid-columns-policy, route: /ecommerce/shop-grid-columns, breadcrumb: [eCommerce, Configuration, Shop Grid Columns], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_shop_grid_columns_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_shop_grid_columns_policy, label: Save Grid Columns, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Shop Grid, columns: 2, fields: [{ field: company_name, label: Company }, { field: grid_columns, label: Grid Columns, type: select, options_source: ecommerce_shop_grid_columns_options, required: true }, { field: updated_at, label: Last Updated }] }
