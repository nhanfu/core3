workflow:
  id: ecommerce_products
  entity: ecommerce_products
  handler: order_transition
  initial: Unpublished
  permission: ecommerce.write
  mutable: true
  status_source: ecommerce_product_states
  states:
    - { id: Unpublished, label: Unpublished, color: neutral }
    - { id: Published, label: Published, color: green }
  transitions:
    - id: publish
      from: [Unpublished]
      to: Published
      permission: ecommerce.write
      mutation:
        guards:
          - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND state = 'Unpublished'", status: 409, message: Only unpublished products can be published }
          - { query: "SELECT id FROM ecommerce_products WHERE id = :id AND list_price > 0", status: 409, message: A product needs a price before it can go on sale }
        steps: [{ query: "UPDATE ecommerce_products SET state = 'Published', publish_date = COALESCE(publish_date, CURRENT_TIMESTAMP), row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
    - id: unpublish
      from: [Published]
      to: Unpublished
      permission: ecommerce.write
      mutation:
        guards: [{ query: "SELECT id FROM ecommerce_products WHERE id = :id AND state = 'Published'", status: 409, message: Only published products can be unpublished }]
        steps: [{ query: "UPDATE ecommerce_products SET state = 'Unpublished', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM ecommerce_products WHERE id = :id" }
