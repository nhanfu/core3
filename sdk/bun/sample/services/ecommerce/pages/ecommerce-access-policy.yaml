title: eCommerce Access
page: { id: ecommerce-access-policy, route: /ecommerce/access-policy, breadcrumb: [eCommerce, Configuration, Shop Visibility], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_access_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_access_policy, label: Save Visibility, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Shop, columns: 2, fields: [{ field: company_name, label: Company }, { field: access_label, label: Current Visibility, type: StatusChip }, { field: access_mode, label: Shop, type: select, options_source: ecommerce_access_modes }] }
