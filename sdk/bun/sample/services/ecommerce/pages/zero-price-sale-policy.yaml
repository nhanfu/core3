title: Zero-Price Sale Policy
page: { id: ecommerce-zero-price-sale-policy, route: /ecommerce/zero-price-sale-policy, breadcrumb: [eCommerce, Configuration, Zero-Price Sale Policy], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_zero_price_sale_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_zero_price_sale_policy, label: Save Policy, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Zero-Price Products, columns: 2, fields: [{ field: company_name, label: Company }, { field: sale_behavior, label: Current Behavior, type: StatusChip }, { field: prevent_zero_price_sale, label: Prevent Zero-Price Sale, type: checkbox }, { field: contact_us_button_url, label: Contact Us URL, type: text }] }
