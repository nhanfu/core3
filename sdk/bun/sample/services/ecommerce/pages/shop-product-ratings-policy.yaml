title: Shop Product Ratings
page: { id: ecommerce-shop-product-ratings-policy, route: /ecommerce/shop-product-ratings, breadcrumb: [eCommerce, Configuration, Shop Product Ratings], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_shop_product_ratings_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_shop_product_ratings_policy, label: Save Product Ratings, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Shop Product Cards, columns: 2, fields: [{ field: company_name, label: Company }, { field: show_ratings, label: Show Product Ratings, type: checkbox, required: true }, { field: rating_behavior, label: Current Behavior, type: StatusChip }, { field: updated_at, label: Last Updated }] }
