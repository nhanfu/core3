page: { id: ecommerce-cart, route: /ecommerce/cart, breadcrumb: [eCommerce, Orders, Cart], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_cart
    editable: false
    title_field: customer_name
    header_actions:
      - { id: continue_ecommerce_shopping, label: Continue Shopping, variant: secondary }
      - { id: apply_ecommerce_cart_pricelist, label: Change Pricelist, variant: secondary, permission: ecommerce.write }
      - { id: checkout_ecommerce_cart, label: Checkout, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Cart Summary, columns: 2, fields: [{ field: customer_name, label: Customer }, { field: state, label: Status, type: StatusChip }, { field: item_count, label: Items }, { field: amount_total, label: Total }] }
    notebook:
      active: cart_lines
      tabs:
        - id: cart_lines
          label: Cart Lines
          component:
            type: ListView
            source: ecommerce_cart_lines
            columns: [{ field: product_name, label: Product, type: PrimaryEntityCell }, { field: unit_price, label: Unit Price }, { field: quantity, label: Quantity }, { field: line_total, label: Total }]
            row_actions: menu
            empty_state: { title: Your cart is empty, description: Add products to begin checkout. }
