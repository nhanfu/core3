page: { id: ecommerce-order-detail, route: /ecommerce/orders/detail, breadcrumb: [eCommerce, Orders, Orders, Order], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_order_detail
    editable: false
    title_field: order_number
    header_actions:
      - { id: back_to_ecommerce_orders, label: Back, variant: secondary }
      - { id: print_ecommerce_order, label: Print, variant: secondary }
    sections:
      - title: Order
        columns: 2
        fields:
          - { field: order_number, label: Order }
          - { field: state, label: Status, type: StatusChip }
          - { field: date_order, label: Order Date }
          - { field: company_name, label: Company }
      - title: Customer
        columns: 2
        fields:
          - { field: customer_name, label: Customer }
          - { field: customer_email, label: Email }
      - title: Total
        columns: 2
        fields:
          - { field: amount_total, label: Total }
          - { field: currency, label: Currency }
