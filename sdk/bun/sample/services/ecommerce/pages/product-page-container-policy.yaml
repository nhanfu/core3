title: Product Page Container
page: { id: ecommerce-product-page-container-policy, route: /ecommerce/product-page-container, breadcrumb: [eCommerce, Configuration, Product Page Container], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_product_page_container_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_product_page_container_policy, label: Save Page Container, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Product Page Layout, columns: 2, fields: [{ field: company_name, label: Company }, { field: page_container, label: Product Page Container, type: select, options_source: ecommerce_product_page_container_options }, { field: page_container_label, label: Current Container, type: StatusChip }, { field: updated_at, label: Last Updated }] }
