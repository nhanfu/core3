title: Shop Product Descriptions
page: { id: ecommerce-shop-product-descriptions-policy, route: /ecommerce/shop-product-descriptions, breadcrumb: [eCommerce, Configuration, Shop Product Descriptions], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_shop_product_descriptions_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_shop_product_descriptions_policy, label: Save Product Descriptions, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Shop Product Cards, columns: 2, fields: [{ field: company_name, label: Company }, { field: show_descriptions, label: Show Product Descriptions, type: checkbox, required: true }, { field: description_behavior, label: Current Behavior, type: StatusChip }, { field: updated_at, label: Last Updated }] }
