workflow:
  id: ecommerce_orders
  entity: ecommerce_orders
  handler: order_transition
  initial: Cart
  permission: ecommerce.write
  mutable: true
  status_source: ecommerce_order_states
  states:
    - { id: Cart, label: Cart, color: neutral }
    - { id: Confirmed, label: Confirmed, color: blue }
    - { id: Done, label: Done, color: green, terminal: true }
    - { id: Abandoned, label: Abandoned, color: red, terminal: true }
  transitions:
    - id: confirm
      from: [Cart]
      to: Confirmed
      permission: ecommerce.write
      mutation:
        guards:
          - { query: "SELECT id FROM ecommerce_orders WHERE id = :id AND state = 'Cart'", status: 409, message: Only carts can be confirmed }
          - { query: "SELECT id FROM ecommerce_orders WHERE id = :id AND cart_quantity > 0 AND amount_total > 0", status: 409, message: A cart needs items and a total before payment can be confirmed }
        steps: [{ query: "UPDATE ecommerce_orders SET state = 'Confirmed', order_date = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM ecommerce_orders WHERE id = :id" }
    - id: lock
      from: [Confirmed]
      to: Done
      permission: ecommerce.write
      mutation:
        guards: [{ query: "SELECT id FROM ecommerce_orders WHERE id = :id AND state = 'Confirmed'", status: 409, message: Only confirmed online orders can be locked }]
        steps: [{ query: "UPDATE ecommerce_orders SET state = 'Done', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM ecommerce_orders WHERE id = :id" }
    - id: abandon
      from: [Cart]
      to: Abandoned
      permission: ecommerce.manage
      mutation:
        guards: [{ query: "SELECT id FROM ecommerce_orders WHERE id = :id AND state = 'Cart'", status: 409, message: Only carts can be marked abandoned }]
        steps: [{ query: "UPDATE ecommerce_orders SET state = 'Abandoned', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM ecommerce_orders WHERE id = :id" }
