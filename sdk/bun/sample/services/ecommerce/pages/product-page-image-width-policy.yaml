title: Product Page Image Width
page: { id: ecommerce-product-page-image-width-policy, route: /ecommerce/product-page-image-width, breadcrumb: [eCommerce, Configuration, Product Page Image Width], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_product_page_image_width_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_product_page_image_width_policy, label: Save Image Width, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Product Page Images, columns: 2, fields: [{ field: company_name, label: Company }, { field: image_width, label: Product Page Image Width, type: select, options_source: ecommerce_product_page_image_width_options }, { field: image_width_label, label: Current Width, type: StatusChip }, { field: updated_at, label: Last Updated }] }
