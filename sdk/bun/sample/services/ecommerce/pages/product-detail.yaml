page: { id: ecommerce-product-detail, route: /ecommerce/products/detail, breadcrumb: [eCommerce, Products, Products, Product], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_product_detail
    editable: false
    title_field: name
    attachment_source: ecommerce_product_images
    attachment_page_size: 100
    attachment_label: Product images
    add_attachment_label: Add product image
    no_attachments_label: No product images
    uploading_label: Uploading image…
    upload_failed_label: Image upload failed
    download_label: Download image
    attachment_accept: image/*
    attachment_upload_action: upload_ecommerce_product_image
    attachment_download_action: download_ecommerce_product_image
    header_actions:
      - { id: back_to_ecommerce_products, label: Back, variant: secondary }
      - { id: add_ecommerce_product_to_cart, label: Add to Cart, variant: primary, permission: ecommerce.write }
      - { id: edit_ecommerce_product, label: Edit Product, variant: secondary, permission: ecommerce.write }
      - { id: update_ecommerce_product_seo, label: Edit SEO Metadata, variant: secondary, permission: ecommerce.write }
      - { id: publish_ecommerce_product, label: Publish, variant: secondary, permission: ecommerce.write, show_if: "state.ecommerce_product_detail.is_published !== true" }
      - { id: unpublish_ecommerce_product, label: Unpublish, variant: secondary, permission: ecommerce.write, show_if: "state.ecommerce_product_detail.is_published === true" }
    groups:
      - { title: Product, columns: 2, fields: [{ field: name, label: Product Name }, { field: internal_reference, label: Internal Reference }, { field: product_type, label: Product Type }, { field: category, label: Category }] }
      - { title: Website, columns: 2, fields: [{ field: sales_price, label: Sales Price }, { field: compare_at_price, label: Compare to Price }, { field: website_size_x, label: Display Width }, { field: website_size_y, label: Display Height }, { field: website_sequence, label: Website Sequence }, { field: is_published, label: Published, type: StatusChip }, { field: publish_date, label: Published At }, { field: review_count, label: Published Reviews }, { field: rating_average, label: Average Rating }, { field: active, label: Active, type: StatusChip }] }
      - { title: Website Description, columns: 1, fields: [{ field: website_description, label: Description, type: richtext, wide: true }] }
      - { title: SEO Metadata, columns: 2, fields: [{ field: website_meta_title, label: Website Meta Title }, { field: website_meta_description, label: Website Meta Description, wide: true }, { field: website_meta_keywords, label: Website Meta Keywords }, { field: website_meta_og_img, label: Website OpenGraph Image }, { field: is_seo_optimized, label: SEO Optimized, type: StatusChip }] }
  - type: ListView
    variant: odoo
    source: ecommerce_product_categories
    create_action: create_ecommerce_product_category
    create_label: Add Category
    page_size: 20
    row_key: id
    row_actions: menu
    empty_state: { title: No website categories, description: Assign this product to one or more eCommerce categories. }
    columns:
      - { field: category_name, label: Website Category, type: PrimaryEntityCell }
      - { field: parent_name, label: Parent Category }
      - { field: sequence, label: Sequence, align: right }
      - field: actions
        label: ''
        sortable: false
        width: 150
        actions:
          - { id: edit_ecommerce_product_category, label: Edit, icon: edit, variant: secondary, permission: ecommerce.write }
          - { id: delete_ecommerce_product_category, label: Remove, icon: trash, variant: danger, permission: ecommerce.write }
    actions:
      - { id: edit_ecommerce_product_category, label: Edit, permission: ecommerce.write, show_if: 'row.id != null' }
      - { id: delete_ecommerce_product_category, label: Remove, permission: ecommerce.write, variant: danger, show_if: 'row.id != null' }
  - type: OdooFormView
    source: ecommerce_product_page_image_ratio
    editable: false
    title_field: company_name
    groups:
      - { title: Product Page Image Ratios, columns: 2, fields: [{ field: company_name, label: Company }, { field: desktop_ratio_label, label: Desktop Image Ratio }, { field: mobile_ratio_label, label: Mobile Image Ratio }] }
  - type: OdooFormView
    source: ecommerce_product_page_image_layout
    editable: false
    title_field: company_name
    groups:
      - { title: Product Page Image Layout, columns: 2, fields: [{ field: company_name, label: Company }, { field: image_layout_label, label: Current Layout, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_product_page_image_width
    editable: false
    title_field: company_name
    groups:
      - { title: Product Page Image Width, columns: 2, fields: [{ field: company_name, label: Company }, { field: image_width_label, label: Current Width, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_product_page_image_spacing
    editable: false
    title_field: company_name
    groups:
      - { title: Product Page Image Spacing, columns: 2, fields: [{ field: company_name, label: Company }, { field: image_spacing_label, label: Current Spacing, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_product_page_image_roundness
    editable: false
    title_field: company_name
    groups:
      - { title: Product Page Image Roundness, columns: 2, fields: [{ field: company_name, label: Company }, { field: image_roundness_label, label: Current Roundness, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_product_page_columns_order
    editable: false
    title_field: company_name
    groups:
      - { title: Product Page Columns Order, columns: 2, fields: [{ field: company_name, label: Company }, { field: columns_order_label, label: Current Order, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_product_page_container
    editable: false
    title_field: company_name
    groups:
      - { title: Product Page Container, columns: 2, fields: [{ field: company_name, label: Company }, { field: page_container_label, label: Current Container, type: StatusChip }] }
  - type: ListView
    variant: odoo
    source: ecommerce_product_variants
    create_action: create_ecommerce_product_variant
    create_label: New Variant
    search: { label: Search variants, placeholder: Search variant or combination... }
    page_size: 50
    row_key: id
    row_actions: menu
    empty_state: { title: No product variants, description: Create a variant from an attribute combination. }
    columns:
      - { field: name, label: Variant, type: PrimaryEntityCell }
      - { field: internal_reference, label: Internal Reference }
      - { field: attribute_values, label: Attributes }
      - { field: sales_price, label: Sales Price, align: right }
      - { field: compare_at_price, label: Compare to Price, align: right }
      - { field: base_unit_name, label: Unit }
      - { field: base_unit_price, label: Price Per Unit, align: right }
      - { field: active, label: Active, type: StatusChip }
      - field: actions
        label: ''
        sortable: false
        width: 120
        actions:
          - { id: view_ecommerce_product_variant_detail, label: View Variant, icon: cube, variant: secondary, permission: ecommerce.read }
          - { id: edit_ecommerce_product_variant, label: Edit, icon: edit, variant: secondary, permission: ecommerce.write }
          - { id: add_ecommerce_product_variant_to_cart, label: Add to Cart, icon: cart, variant: primary, permission: ecommerce.write }
          - { id: delete_ecommerce_product_variant, label: Delete, icon: trash, variant: danger, permission: ecommerce.write }
    actions:
      - { id: edit_ecommerce_product_variant, label: Edit, permission: ecommerce.write, show_if: 'row.id != null' }
      - { id: add_ecommerce_product_variant_to_cart, label: Add to Cart, permission: ecommerce.write, show_if: 'row.id != null' }
      - { id: delete_ecommerce_product_variant, label: Delete, permission: ecommerce.write, variant: danger, show_if: 'row.id != null' }
  - type: ListView
    variant: odoo
    source: ecommerce_product_alternatives
    create_action: create_ecommerce_product_alternative
    create_label: Add Alternative
    page_size: 16
    row_key: id
    row_actions: menu
    empty_state: { title: No alternative products, description: Recommend other published products on this product page. }
    columns:
      - { field: name, label: Product, type: PrimaryEntityCell }
      - { field: internal_reference, label: Internal Reference }
      - { field: sales_price, label: Sales Price, align: right }
      - { field: sequence, label: Sequence }
      - field: actions
        label: ''
        sortable: false
        width: 120
        actions:
          - { id: remove_ecommerce_product_alternative, label: Remove, icon: trash, variant: danger, permission: ecommerce.write }
  - type: ListView
    variant: odoo
    source: ecommerce_product_accessories
    create_action: create_ecommerce_product_accessory
    create_label: Add Accessory
    page_size: 16
    row_key: id
    row_actions: menu
    empty_state: { title: No accessory products, description: Suggest products before payment when this product is in the cart. }
    columns:
      - { field: name, label: Product, type: PrimaryEntityCell }
      - { field: internal_reference, label: Internal Reference }
      - { field: sales_price, label: Sales Price, align: right }
      - { field: sequence, label: Sequence }
      - field: actions
        label: ''
        sortable: false
        width: 120
        actions:
          - { id: remove_ecommerce_product_accessory, label: Remove, icon: trash, variant: danger, permission: ecommerce.write }
  - type: ListView
    variant: odoo
    source: ecommerce_product_optionals
    create_action: create_ecommerce_product_optional
    create_label: Add Optional
    page_size: 16
    row_key: id
    row_actions: menu
    empty_state: { title: No optional products, description: Recommend products when this product is added to the cart. }
    columns:
      - { field: name, label: Product, type: PrimaryEntityCell }
      - { field: internal_reference, label: Internal Reference }
      - { field: sales_price, label: Sales Price, align: right }
      - { field: sequence, label: Sequence }
      - field: actions
        label: ''
        sortable: false
        width: 150
        actions:
          - { id: add_ecommerce_product_optional_to_cart, label: Add to Cart, icon: cart, variant: primary, permission: ecommerce.write }
          - { id: remove_ecommerce_product_optional, label: Remove, icon: trash, variant: danger, permission: ecommerce.write }
  - type: ListView
    variant: odoo
    source: ecommerce_product_documents
    create_action: create_ecommerce_product_document
    create_label: New Product Document
    page_size: 50
    row_key: id
    row_actions: menu
    empty_state: { title: No product documents, description: Upload a document and choose whether it is published on the product page. }
    columns:
      - { field: name, label: Document, type: PrimaryEntityCell }
      - { field: file_name, label: File }
      - { field: mime_type, label: Type }
      - { field: size_bytes, label: Size, align: right }
      - { field: sequence, label: Sequence, align: right }
      - { field: shown_on_product_page, label: Published, type: StatusChip }
      - field: actions
        label: ''
        sortable: false
        width: 150
        actions:
          - { id: view_ecommerce_product_document, label: View, icon: document, variant: secondary, permission: ecommerce.read }
          - { id: delete_ecommerce_product_document_from_product, label: Delete, icon: trash, variant: danger, permission: ecommerce.write }
  - type: ListView
    variant: odoo
    source: ecommerce_product_reviews
    create_action: create_ecommerce_product_review
    create_label: New Product Review
    page_size: 50
    row_key: id
    row_actions: menu
    empty_state: { title: No product reviews, description: Customer ratings and discussion for this product will appear here. }
    columns:
      - { field: title, label: Review, type: PrimaryEntityCell }
      - { field: reviewer_name, label: Reviewer }
      - { field: rating, label: Rating, align: right }
      - { field: state, label: State, type: StatusChip }
      - { field: created_at, label: Submitted }
      - field: actions
        label: ''
        sortable: false
        width: 180
        actions:
          - { id: edit_ecommerce_product_review, label: Edit, icon: edit, variant: secondary, permission: ecommerce.write }
          - { id: publish_ecommerce_product_review, label: Publish, icon: check, variant: primary, permission: ecommerce.write }
          - { id: reject_ecommerce_product_review, label: Reject, icon: close, variant: secondary, permission: ecommerce.write }
          - { id: delete_ecommerce_product_review, label: Delete, icon: trash, variant: danger, permission: ecommerce.write }
