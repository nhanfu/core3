title: Product Page Grid Columns
page: { id: ecommerce-product-page-grid-columns-policy, route: /ecommerce/product-page-grid-columns, breadcrumb: [eCommerce, Configuration, Product Page Grid Columns], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_product_page_grid_columns_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_product_page_grid_columns_policy, label: Save Grid Columns, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Product Page Image Grid, columns: 2, fields: [{ field: company_name, label: Company }, { field: grid_columns, label: Image Columns, type: select, options_source: ecommerce_product_page_grid_columns_options, required: true }, { field: grid_columns_label, label: Current Columns, type: StatusChip }, { field: updated_at, label: Last Updated }] }
