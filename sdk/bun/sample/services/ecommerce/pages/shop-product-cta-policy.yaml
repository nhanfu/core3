title: Shop Add to Cart
page: { id: ecommerce-shop-product-cta-policy, route: /ecommerce/shop-product-cta, breadcrumb: [eCommerce, Configuration, Shop Add to Cart], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_shop_product_cta_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_shop_product_cta_policy, label: Save Add to Cart, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Shop Product Cards, columns: 2, fields: [{ field: company_name, label: Company }, { field: show_cta, label: Show Add to Cart, type: checkbox, required: true }, { field: cta_behavior, label: Current Behavior, type: StatusChip }, { field: updated_at, label: Last Updated }] }
