title: Wishlist Page Layout
page: { id: ecommerce-wishlist-page-layout-policy, route: /ecommerce/wishlist-page-layout, breadcrumb: [eCommerce, Configuration, Wishlist Page Layout], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_wishlist_page_layout_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_wishlist_page_layout_policy, label: Save Wishlist Layout, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Wishlist Page, columns: 2, fields: [{ field: company_name, label: Company }, { field: wishlist_grid_columns, label: Desktop Columns, type: select, options_source: ecommerce_wishlist_page_layout_desktop_options, required: true }, { field: wishlist_mobile_columns, label: Mobile Columns, type: select, options_source: ecommerce_wishlist_page_layout_mobile_options, required: true }, { field: wishlist_gap, label: Grid Gap, type: select, options_source: ecommerce_wishlist_page_layout_gap_options, required: true }, { field: desktop_columns_label, label: Current Desktop Layout, type: StatusChip }, { field: mobile_columns_label, label: Current Mobile Layout, type: StatusChip }, { field: gap_label, label: Current Gap, type: StatusChip }, { field: updated_at, label: Last Updated }] }
