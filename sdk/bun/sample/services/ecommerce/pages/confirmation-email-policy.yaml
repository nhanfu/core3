title: Confirmation Email Policy
page: { id: ecommerce-confirmation-email-policy, route: /ecommerce/confirmation-email-policy, breadcrumb: [eCommerce, Configuration, Confirmation Email], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_confirmation_email_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_confirmation_email_policy, label: Save Email, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Order Confirmation, columns: 2, fields: [{ field: company_name, label: Company }, { field: template_status, label: Template Status, type: StatusChip }, { field: template_name, label: Current Template }, { field: template_id, label: Confirmation Email, type: select, options_source: ecommerce_confirmation_email_template_options }] }
