page: { id: ecommerce-shop, route: /ecommerce/shop, breadcrumb: [eCommerce, Shop], auth: { require: [ecommerce.read] } }
components:
  - type: ListView
    variant: odoo
    source: ecommerce_shop_products
    responsive_card: true
    search: { label: Search products, placeholder: Search products or categories... }
    views:
      - { id: kanban, label: Products, icon: grid, mobile: true, group_by: '', card: { title: name, subtitle: category, fields: [{ field: sales_price, label: Price }, { field: compare_at_price, label: Compare to Price }, { field: website_description, label: Description }, { field: product_type, label: Type }, { field: show_cta, label: Add to Cart CTA, type: Boolean }, { field: add_to_cart_allowed, label: Cart Available, type: Boolean }, { field: contact_us_button_url, label: Contact Us URL }] } }
      - { id: list, label: List, icon: table, mobile: false }
    columns:
      - { field: name, label: Product, type: PrimaryEntityCell }
      - { field: category, label: Category }
      - { field: sales_price, label: Price, align: right }
      - { field: compare_at_price, label: Compare to Price, align: right }
      - { field: website_size_x, label: Display Width, align: right }
      - { field: website_size_y, label: Display Height, align: right }
      - { field: website_description, label: Description }
      - { field: product_type, label: Type }
      - { field: show_cta, label: Add to Cart CTA, type: Boolean }
      - { field: add_to_cart_allowed, label: Cart Available, type: Boolean }
      - { field: contact_us_button_url, label: Contact Us URL }
    row_actions: menu
    header_actions: [{ id: shop_view_cart, label: View Cart, permission: ecommerce.read, variant: secondary }]
    page_size: 50
    row_key: id
    empty_state: { title: No products available, description: Published products will appear here. }
  - type: OdooFormView
    source: ecommerce_shop_page_container
    editable: false
    title_field: company_name
    groups:
      - { title: Shop Layout, columns: 2, fields: [{ field: company_name, label: Company }, { field: page_container_label, label: Current Container, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_shop_grid_columns
    editable: false
    title_field: company_name
    groups:
      - { title: Shop Grid, columns: 2, fields: [{ field: company_name, label: Company }, { field: grid_columns, label: Grid Columns, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_shop_page_size
    editable: false
    title_field: company_name
    groups:
      - { title: Shop Paging, columns: 2, fields: [{ field: company_name, label: Company }, { field: page_size, label: Products Per Shop Page, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_shop_grid_gap
    editable: false
    title_field: company_name
    groups:
      - { title: Shop Grid, columns: 2, fields: [{ field: company_name, label: Company }, { field: grid_gap, label: Shop Grid Gap, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_shop_product_descriptions
    editable: false
    title_field: company_name
    groups:
      - { title: Shop Product Cards, columns: 2, fields: [{ field: company_name, label: Company }, { field: show_descriptions, label: Show Product Descriptions, type: Boolean }, { field: description_behavior, label: Current Behavior, type: StatusChip }] }
  - type: OdooFormView
    source: ecommerce_shop_product_cta
    editable: false
    title_field: company_name
    groups:
      - { title: Shop Product Cards, columns: 2, fields: [{ field: company_name, label: Company }, { field: show_cta, label: Show Add to Cart, type: Boolean }, { field: cta_behavior, label: Current Behavior, type: StatusChip }] }
