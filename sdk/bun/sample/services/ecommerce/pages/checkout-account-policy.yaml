title: Checkout Account Policy
page: { id: ecommerce-checkout-account-policy, route: /ecommerce/checkout-account-policy, breadcrumb: [eCommerce, Configuration, Checkout Account Policy], auth: { require: [ecommerce.read] } }
components:
  - type: OdooFormView
    source: ecommerce_checkout_account_policy
    editable: true
    title_field: company_name
    header_actions:
      - { id: edit_ecommerce_checkout_account_policy, label: Save Policy, variant: primary, permission: ecommerce.write }
    groups:
      - { title: Checkout Registration, columns: 2, fields: [{ field: company_name, label: Company }, { field: checkout_behavior, label: Current Behavior, type: StatusChip }, { field: account_on_checkout, label: Customer Accounts, type: select, options_source: ecommerce_checkout_account_policy_modes }, { field: auth_signup_uninvited, label: Signup Mode }] }
