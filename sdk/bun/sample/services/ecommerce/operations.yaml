operations:
  ecommerce.public.access:
    result_key: access
    query: "SELECT access_mode, CASE WHEN access_mode = 'everyone' OR COALESCE(:authenticated, FALSE) = TRUE THEN TRUE ELSE FALSE END AS allowed FROM ecommerce_access_policies WHERE company_name = 'My Company'"
  ecommerce.public.shop:
    result_key: products
    query: "SELECT id, name, internal_reference, product_type, category, sales_price, website_sequence, company_name FROM ecommerce_products WHERE active = TRUE AND is_published = TRUE AND company_name = 'My Company' AND (COALESCE((SELECT access_mode FROM ecommerce_access_policies WHERE company_name = 'My Company'), 'everyone') = 'everyone' OR COALESCE(:authenticated, FALSE) = TRUE) AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(category, '') ILIKE '%' || :q || '%') ORDER BY CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = 'My Company') WHEN 'website_sequence asc' THEN website_sequence END ASC, CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = 'My Company') WHEN 'publish_date desc' THEN publish_date END DESC, CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = 'My Company') WHEN 'name asc' THEN name END ASC, CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = 'My Company') WHEN 'list_price asc' THEN sales_price END ASC, CASE (SELECT default_sort FROM ecommerce_shop_default_sort_policies WHERE company_name = 'My Company') WHEN 'list_price desc' THEN sales_price END DESC, name, id"
  ecommerce.public.cart:
    result_key: lines
    query: "SELECT l.id, l.cart_id, l.product_id, l.variant_id, l.variant_name, l.product_name, l.unit_price, l.quantity, l.quantity * l.unit_price AS line_total, SUM(l.quantity * l.unit_price) OVER () AS amount_total, COALESCE((SELECT p.show_line_subtotals_tax_selection FROM ecommerce_tax_display_policies p WHERE p.company_name = COALESCE(c.company_name, 'My Company')), 'tax_excluded') AS tax_display_mode, CASE COALESCE((SELECT p.show_line_subtotals_tax_selection FROM ecommerce_tax_display_policies p WHERE p.company_name = COALESCE(c.company_name, 'My Company')), 'tax_excluded') WHEN 'tax_included' THEN 'Line subtotals include tax' ELSE 'Line subtotals exclude tax' END AS subtotal_label FROM ecommerce_cart_lines l JOIN ecommerce_carts c ON c.id = l.cart_id WHERE c.id = :cart_id AND c.state = 'Open' AND c.customer_id IS NULL AND c.id LIKE 'ecommerce-cart-anon-%' ORDER BY l.id"
  ecommerce.public.wishlist:
    result_key: items
    query: "SELECT i.id, i.row_version, i.wishlist_id, i.product_id, i.variant_id, i.variant_name, i.product_name, i.price, i.company_name, CAST(i.added_at AS VARCHAR) AS added_at FROM ecommerce_wishlist_items i JOIN ecommerce_wishlists w ON w.id = i.wishlist_id JOIN ecommerce_products p ON p.id = i.product_id WHERE w.id = :wishlist_id AND w.owner_type = 'anonymous' AND w.active = TRUE AND i.active = TRUE AND p.active = TRUE AND p.is_published = TRUE ORDER BY i.added_at DESC, i.id"
  ecommerce.public.product_feed:
    result_key: feed
    query: "SELECT id, name, target, cache_xml, CAST(cache_expiry AS VARCHAR) AS cache_expiry FROM ecommerce_product_feeds WHERE id = :feed_id AND access_token = :access_token AND active = TRUE AND cache_xml IS NOT NULL AND (cache_expiry IS NULL OR cache_expiry > CURRENT_TIMESTAMP) LIMIT 1"
  ecommerce.sales.handoffs.pending:
    result_key: handoffs
    query: "SELECT id, ecommerce_order_id, order_number, customer_name, customer_email, amount_total, currency, company_name, state, sales_order_id, attempt_count, last_error, row_version, CAST(created_at AS VARCHAR) AS created_at FROM ecommerce_sales_handoffs WHERE state IN ('Pending', 'Failed') AND attempt_count < 5 ORDER BY created_at, id"
  ecommerce.sales.handoff.order:
    result_key: order
    query: "SELECT o.id, o.order_number, o.customer_id, o.customer_name, o.customer_email, o.amount_total, o.currency, o.state, CAST(o.date_order AS VARCHAR) AS date_order, o.company_name, o.shipping_address, o.delivery_method, o.payment_method FROM ecommerce_orders o JOIN ecommerce_sales_handoffs h ON h.ecommerce_order_id = o.id WHERE h.id = :handoff_id"
  ecommerce.sales.handoff.lines:
    result_key: lines
    query: "SELECT l.id, l.order_id, l.product_id, l.product_name, l.unit_price, l.quantity, l.line_total FROM ecommerce_order_lines l JOIN ecommerce_sales_handoffs h ON h.ecommerce_order_id = l.order_id WHERE h.id = :handoff_id ORDER BY l.id"
