operations:
  ecommerce.public.shop:
    result_key: products
    query: "SELECT id, name, internal_reference, product_type, category, sales_price, website_sequence, company_name FROM ecommerce_products WHERE active = TRUE AND is_published = TRUE AND company_name = 'My Company' AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(category, '') ILIKE '%' || :q || '%') ORDER BY website_sequence, name"
  ecommerce.public.cart:
    result_key: lines
    query: "SELECT l.id, l.cart_id, l.product_id, l.product_name, l.unit_price, l.quantity, l.quantity * l.unit_price AS line_total, SUM(l.quantity * l.unit_price) OVER () AS amount_total FROM ecommerce_cart_lines l JOIN ecommerce_carts c ON c.id = l.cart_id WHERE c.id = :cart_id AND c.state = 'Open' AND c.customer_id IS NULL AND c.id LIKE 'ecommerce-cart-anon-%' ORDER BY l.id"
  ecommerce.sales.handoffs.pending:
    result_key: handoffs
    query: "SELECT id, ecommerce_order_id, order_number, customer_name, customer_email, amount_total, currency, company_name, state, sales_order_id, attempt_count, last_error, row_version, CAST(created_at AS VARCHAR) AS created_at FROM ecommerce_sales_handoffs WHERE state IN ('Pending', 'Failed') AND attempt_count < 5 ORDER BY created_at, id"
  ecommerce.sales.handoff.order:
    result_key: order
    query: "SELECT o.id, o.order_number, o.customer_id, o.customer_name, o.customer_email, o.amount_total, o.currency, o.state, CAST(o.date_order AS VARCHAR) AS date_order, o.company_name, o.shipping_address, o.delivery_method, o.payment_method FROM ecommerce_orders o JOIN ecommerce_sales_handoffs h ON h.ecommerce_order_id = o.id WHERE h.id = :handoff_id"
  ecommerce.sales.handoff.lines:
    result_key: lines
    query: "SELECT l.id, l.order_id, l.product_id, l.product_name, l.unit_price, l.quantity, l.line_total FROM ecommerce_order_lines l JOIN ecommerce_sales_handoffs h ON h.ecommerce_order_id = l.order_id WHERE h.id = :handoff_id ORDER BY l.id"
