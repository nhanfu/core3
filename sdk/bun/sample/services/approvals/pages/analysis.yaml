title: Approval Analysis
page: { id: approval-analysis, breadcrumb: [Productivity, Approvals, Analysis], auth: { require: [approvals.read] } }
datasources:
  - id: approval_analysis
    permission: approvals.read
    query: "SELECT state, COUNT(*) AS request_count, SUM(required_approvals) AS approvals_required, SUM(approved_count) AS approvals_received FROM approval_requests GROUP BY state ORDER BY request_count DESC"
components:
  - type: Chart
    source: approval_analysis
    title: Requests by status
    label_field: state
    value_field: request_count
    variant: bar
