version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS approval_types (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        description VARCHAR, responsible_name VARCHAR NOT NULL, approvers VARCHAR NOT NULL DEFAULT '', approver_ids VARCHAR NOT NULL DEFAULT '', required_approvals INTEGER NOT NULL DEFAULT 1,
        state VARCHAR NOT NULL DEFAULT 'Active', row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS approval_requests (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        approval_type_id VARCHAR NOT NULL, approval_type_name VARCHAR NOT NULL,
        requester_name VARCHAR NOT NULL DEFAULT '', date_requested DATE NOT NULL DEFAULT CURRENT_DATE,
        reason VARCHAR NOT NULL, approvers VARCHAR NOT NULL DEFAULT '', approver_ids VARCHAR NOT NULL DEFAULT '', required_approvals INTEGER NOT NULL DEFAULT 1,
        approved_count INTEGER NOT NULL DEFAULT 0, last_approver VARCHAR, state VARCHAR NOT NULL DEFAULT 'Draft',
        row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS approval_votes (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), request_id VARCHAR NOT NULL,
        approver_id VARCHAR NOT NULL, approver_name VARCHAR NOT NULL, voted_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(request_id, approver_id)
      );
      CREATE TABLE IF NOT EXISTS approval_attachments (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), request_id VARCHAR NOT NULL, file_name VARCHAR NOT NULL,
        mime_type VARCHAR, size_bytes BIGINT NOT NULL DEFAULT 0, storage_key VARCHAR NOT NULL,
        uploaded_by VARCHAR, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS approval_requests_state_idx ON approval_requests(state);
      CREATE INDEX IF NOT EXISTS approval_requests_type_idx ON approval_requests(approval_type_id);
      CREATE INDEX IF NOT EXISTS approval_votes_request_idx ON approval_votes(request_id);
      CREATE INDEX IF NOT EXISTS approval_attachments_request_idx ON approval_attachments(request_id);
    down: |
      DROP TABLE IF EXISTS approval_requests;
      DROP TABLE IF EXISTS approval_attachments;
      DROP TABLE IF EXISTS approval_votes;
      DROP TABLE IF EXISTS approval_types;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
