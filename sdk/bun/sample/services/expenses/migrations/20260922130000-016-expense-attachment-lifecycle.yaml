version: 0.0.16
description: Durable receipt attachment row versions for state-guarded removal
type:
  postgres:
    up: |
      ALTER TABLE expense_attachments ADD COLUMN IF NOT EXISTS row_version BIGINT;
      UPDATE expense_attachments SET row_version = 1 WHERE row_version IS NULL;
    down: |
      ALTER TABLE expense_attachments DROP COLUMN IF EXISTS row_version;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
