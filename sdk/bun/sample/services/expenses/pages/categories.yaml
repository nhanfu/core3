title: Expense Categories
page: { id: expense-categories, route: /expenses/categories, breadcrumb: [Expenses, Configuration, Expense Categories], auth: { require: [expenses.read] } }
components:
  - type: ListView
    variant: odoo
    source: expense_categories
    create_action: create_expense_category
    create_label: New
    search: { label: Search categories, placeholder: Search expense categories... }
    views:
      - { id: list, label: List, icon: table }
      - { id: kanban, label: Kanban, icon: dashboard, card: { title: name, subtitle: reference, fields: [{ field: cost_method, label: Cost Method }, { field: unit_cost, label: Unit Cost }, { field: active, label: Active }] } }
    columns:
      - { field: name, label: Category, type: PrimaryEntityCell, sortable: true }
      - { field: cost_method, label: Cost Method }
      - { field: unit_cost, label: Cost per Unit, align: right }
      - { field: reference, label: Reference }
      - { field: active, label: Active }
    page_size: 25
    row_key: id
actions:
  - id: create_expense_category
    type: server_form
    permission: expenses.write
    title: New Expense Category
    action: expenses.categories.create
    handler: yaml_mutation
    operation: create
    refresh: [expense_categories]
    mutation: { operation: insert, table: expense_categories, fields: [name, cost_method, unit_cost, reference, guideline, active], required: [name], defaults: { cost_method: fixed, unit_cost: 0, active: true }, result: { query: "SELECT * FROM expense_categories WHERE id = :id" } }
    fields: [{ field: name, label: Category, type: text, required: true }, { field: cost_method, label: Cost Method, type: select, options: [{ value: fixed, label: Fixed Cost }, { value: quantity, label: Per Unit }] }, { field: unit_cost, label: Cost per Unit, type: number }, { field: reference, label: Reference, type: text }, { field: guideline, label: Guideline, type: textarea }, { field: active, label: Active, type: checkbox, default: true }]
