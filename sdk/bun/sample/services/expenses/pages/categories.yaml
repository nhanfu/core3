title: Expense Categories
page: { id: expense-categories, route: /expenses/categories, breadcrumb: [Expenses, Configuration, Expense Categories], auth: { require: [expenses.manage] } }
components:
  - type: ListView
    variant: odoo
    source: expense_categories
    create_action: create_expense_category
    create_label: New
    search: { label: Search categories, placeholder: Search expense categories... }
    filters: [{ field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - { id: kanban, label: Kanban, icon: dashboard, group_by: cost_method, card: { title: name, subtitle: reference, fields: [{ field: cost_method, label: Cost Method }, { field: unit_cost, label: Unit Cost }, { field: active, label: Active }] } }
    row_key: id
    row_open_action: edit_expense_category
    row_actions: menu
    empty_state: { title: No expense categories, description: No expense categories match the current filters. }
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell, sortable: true, mobile: true }
      - { field: cost_method, label: Cost Method }
      - { field: unit_cost, label: Cost per Unit, align: right }
      - { field: reference, label: Reference }
      - { field: active, label: Active, optional: hide }
      - { field: id, label: '', sortable: false, actions: [{ id: edit_expense_category, label: Edit, icon: edit }, { id: archive_expense_category, label: Archive, icon: archive, show_if: 'row.active === true' }, { id: unarchive_expense_category, label: Unarchive, icon: archive, show_if: 'row.active === false' }] }
    page_size: 25
