title: Employee Expenses
page: { id: expenses-employee, route: /expenses/employee, breadcrumb: [Expenses, Employee Expenses], auth: { require: [expenses.read] } }
components:
  - type: ListView
    variant: odoo
    source: expenses_employee
    search: { label: Search employee expenses, placeholder: 'Search expense, employee, or category...' }
    default_filters: { employee_expense_scope: approved_to_pay }
    form_view: { page: pages/expense-detail.yaml, side_panel: false }
    filters:
      - { field: status, label: Status, options_source: expense_employee_statuses }
      - { field: payment_mode, label: Paid by, options_source: expense_employee_payment_modes }
    group_by:
      - { field: employee_name, label: Employee }
      - { field: category, label: Category }
      - { field: status, label: Status }
      - { field: expense_date, label: Expense Date }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - { id: kanban, label: Kanban, icon: dashboard, group_by: employee_name, card: { title: name, subtitle: employee_name, fields: [{ field: category, label: Category }, { field: amount_display, label: Total }, { field: status, label: Status }] } }
      - { id: form, label: Form, icon: form }
      - { id: pivot, label: Pivot, icon: pivot, pivot: { fields: [{ field: employee_name, column: Employee }, { field: expense_date, column: Expense Date }, { field: total_amount, column: Total Amount }, { field: tax_amount, column: Total Taxes }], default: { rows: [employee_name], columns: [expense_date], measures: [{ field: total_amount, aggregate: sum, column: Total Amount }, { field: tax_amount, aggregate: sum, column: Total Taxes }] } } }
      - { id: graph, label: Graph, icon: graph, category_field: employee_name, measure_field: total_amount }
    columns:
      - { field: name, label: Expense, type: PrimaryEntityCell, sortable: true }
      - { field: employee_name, label: Employee }
      - { field: category, label: Category }
      - { field: expense_date, label: Expense Date, sortable: true }
      - { field: amount_display, label: Total, align: right }
      - { field: tax_amount_display, label: Total Taxes, align: right, optional: hide }
      - { field: payment_mode_label, label: Paid by, optional: hide }
      - { field: company_name, label: Company, optional: hide }
      - { field: status, label: Status, type: StatusChip }
    page_size: 25
    selectable: true
    column_chooser: true
    row_key: id
    row_double_click_action: view_expense_detail
actions:
  - { id: view_expense_detail, type: navigate, permission: expenses.read, navigate_to: /expenses/detail, params: { id: '{row.id}' } }
