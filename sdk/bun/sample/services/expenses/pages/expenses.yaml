title: My Expenses
page: { id: expenses, route: /expenses, breadcrumb: [Expenses, My Expenses], auth: { require: [expenses.read] } }
components:
  - type: ListView
    variant: odoo
    source: expenses_my
    search: { label: Search expenses, placeholder: 'Search expense, employee, or category...' }
    filters:
      - { field: status, label: Status, options_source: expense_statuses }
      - { field: payment_mode, label: Paid by, options_source: expense_payment_modes }
    group_by:
      - { field: employee_name, label: Employee }
      - { field: category, label: Category }
      - { field: status, label: Status }
      - { field: expense_date, label: Expense Date }
      - { field: company_name, label: Company }
      - { field: department_name, label: Department }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        groups_source: expense_statuses
        card: { title: name, subtitle: employee_name, fields: [{ field: category, label: Category }, { field: amount_display, label: Total }, { field: status, label: Status }] }
    page_size: 25
    column_chooser: true
    selectable: true
    row_key: id
    row_actions: menu
    row_double_click_action: view_expense_detail
    empty_state: { title: No expenses, description: There are no expenses matching these filters. }
    labels: { selected: selected, filters: Filters, columns: Columns, clear_selection: Clear selection, select_all: Select all rows, select_row: Select row, previous_page: Previous page, next_page: Next page }
    columns:
      - { field: name, label: Expense, type: PrimaryEntityCell, sortable: true }
      - { field: employee_name, label: Employee }
      - { field: category, label: Category }
      - { field: expense_date, label: Expense Date, sortable: true }
      - { field: amount_display, label: Total, align: right }
      - { field: payment_mode, label: Paid by, optional: hide }
      - { field: receipt_label, label: Receipt, optional: hide }
      - { field: company_name, label: Company, optional: hide }
      - { field: status, label: Status, type: StatusChip }
      - { field: actions, label: '', align: right, actions: [{ id: submit_expense, label: Submit, variant: primary, permission: expenses.write, show_if: "row.status === 'Draft'" }, { id: reset_expense, label: Reset, variant: ghost, permission: expenses.write, show_if: "row.status === 'Refused'" }] }
actions:
  - { id: view_expense_detail, type: navigate, permission: expenses.read, navigate_to: /expenses/detail, params: { id: '{row.id}' } }
