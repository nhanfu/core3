page: { id: expenses }
datasources:
  - id: expense_states
    single: false
    permission: expenses.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Submitted'), ('Approved','Approved'), ('Posted','Posted'), ('Paid','Paid'), ('Refused','Refused')) states(value, label)"
  - id: expense_statuses
    single: false
    permission: expenses.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Submitted'), ('Approved','Approved'), ('Posted','Posted'), ('In Payment','In Payment'), ('Paid','Paid'), ('Refused','Refused')) states(value, label)"
  - id: expense_processing_statuses
    single: false
    permission: expenses.read
    query: "SELECT value, label FROM (VALUES ('Submitted','Submitted'), ('Approved','Approved')) states(value, label)"
  - id: expense_payment_modes
    single: false
    permission: expenses.read
    query: "SELECT value, label FROM (VALUES ('Company','Paid by Company'), ('Employee','Paid by Employee')) modes(value, label)"
  - id: expense_employees
    single: false
    permission: expenses.read
    query: "SELECT DISTINCT employee_name AS value, employee_name AS label FROM expenses ORDER BY employee_name"
  - id: expense_companies
    single: false
    permission: expenses.read
    query: "SELECT DISTINCT company_name AS value, company_name AS label FROM expenses ORDER BY company_name"
  - id: expenses_my
    single: false
    permission: expenses.read
    workflow: expense_items
    query: |
      SELECT e.id, e.row_version, e.name, e.employee_name, e.category,
        CAST(e.expense_date AS VARCHAR) AS expense_date, e.amount,
        printf('$%,.2f', e.amount) AS amount_display, e.payment_method AS payment_mode,
        e.receipt_label, e.company_name, e.department_name, e.state AS status
      FROM expenses e
      WHERE (:q IS NULL OR e.name ILIKE '%' || :q || '%' OR e.employee_name ILIKE '%' || :q || '%' OR e.category ILIKE '%' || :q || '%')
        AND (:status IS NULL OR e.state = :status)
        AND (:payment_mode IS NULL OR e.payment_method = :payment_mode)
      ORDER BY e.expense_date DESC, e.id
actions:
  - id: submit_expense
    type: server
    permission: expenses.write
    action: expenses.submit
    handler: order_transition
    workflow: expense_items
    operation: submit
    refresh: [expenses_my]
    mutation:
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state = 'Draft' AND NULLIF(TRIM(receipt_reference), '') IS NOT NULL", status: 409, message: Attach a receipt before submitting this expense }
      steps:
        - query: "UPDATE expenses SET state = 'Submitted', row_version = row_version + 1 WHERE id = :id"
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES(gen_random_uuid(), :id, :current_user_name, 'expenses.submit', 'Submitted', 'Submitted for manager approval')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
  - id: reset_expense
    type: server
    permission: expenses.write
    action: expenses.reset
    handler: order_transition
    workflow: expense_items
    operation: reset
    refresh: [expenses_my]
    mutation:
      guards: [{ query: "SELECT id FROM expenses WHERE id = :id AND state = 'Refused'", status: 409, message: Only refused expenses can be reset }]
      steps:
        - query: "UPDATE expenses SET state = 'Draft', refusal_reason = NULL, row_version = row_version + 1 WHERE id = :id"
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES(gen_random_uuid(), :id, :current_user_name, 'expenses.reset', 'Reset', 'Reset to draft')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
