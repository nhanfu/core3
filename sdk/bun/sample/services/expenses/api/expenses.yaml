page: { id: expenses }
datasources:
  - id: expense_states
    single: false
    permission: expenses.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Submitted'), ('Approved','Approved'), ('Posted','Posted'), ('Paid','Paid'), ('Refused','Refused')) states(value, label)"
  - id: expense_statuses
    single: false
    permission: expenses.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Submitted'), ('Approved','Approved'), ('Posted','Posted'), ('In Payment','In Payment'), ('Paid','Paid'), ('Refused','Refused')) states(value, label)"
  - id: expense_processing_statuses
    single: false
    permission: expenses.read
    query: "SELECT value, label FROM (VALUES ('Submitted','Submitted'), ('Approved','Approved')) states(value, label)"
  - id: expense_payment_modes
    single: false
    permission: expenses.read
    query: "SELECT value, label FROM (VALUES ('Company','Paid by Company'), ('Employee','Paid by Employee')) modes(value, label)"
  - id: expense_employees
    single: false
    permission: expenses.read
    query: "SELECT DISTINCT employee_name AS value, employee_name AS label FROM expenses ORDER BY employee_name"
  - id: expense_companies
    single: false
    permission: expenses.read
    query: "SELECT DISTINCT company_name AS value, company_name AS label FROM expenses ORDER BY company_name"
  - id: expenses_my
    single: false
    permission: expenses.read
    workflow: expense_items
    error_states: { transport_error: { status: 503, code: EXPENSES_ACTIVITY_UNAVAILABLE, message: Expense activity data is temporarily unavailable } }
    query: |
      SELECT e.id, e.row_version, e.name, e.employee_name, e.category,
        CAST(e.expense_date AS VARCHAR) AS expense_date, e.amount,
        printf('$%,.2f', e.amount) AS amount_display, e.payment_method AS payment_mode,
        e.receipt_label, e.company_name, e.department_name, e.state AS status,
        a.id AS activity_id, a.row_version AS activity_row_version,
        a.activity_type, a.summary AS activity_summary,
        CAST(a.due_date AS VARCHAR) AS activity_date, a.assigned_to AS activity_user,
        CASE
          WHEN a.state = 'Done' THEN 'done'
          WHEN a.due_date < DATE '2026-09-22' THEN 'overdue'
          WHEN a.due_date = DATE '2026-09-22' THEN 'today'
          ELSE 'planned'
        END AS activity_state,
        CASE WHEN a.id IS NULL THEN 0 ELSE 1 END AS activity_count
      FROM expenses e
      LEFT JOIN LATERAL (
        SELECT id, row_version, activity_type, summary, due_date, assigned_to, state
        FROM expense_scheduled_activities
        WHERE expense_id = e.id
        ORDER BY CASE WHEN state = 'Planned' THEN 0 ELSE 1 END, due_date NULLS LAST, id
        LIMIT 1
      ) a ON TRUE
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
        AND (:q IS NULL OR e.name ILIKE '%' || :q || '%' OR e.employee_name ILIKE '%' || :q || '%' OR e.category ILIKE '%' || :q || '%' OR COALESCE(a.summary, '') ILIKE '%' || :q || '%')
        AND (:status IS NULL OR e.state = :status)
        AND (:payment_mode IS NULL OR e.payment_method = :payment_mode)
      ORDER BY e.expense_date DESC, e.id
actions:
  - id: submit_expense
    type: server
    permission: expenses.write
    action: expenses.submit
    handler: order_transition
    workflow: expense_items
    operation: submit
    refresh: [expenses_my]
    mutation:
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state = 'Draft' AND NULLIF(TRIM(receipt_reference), '') IS NOT NULL", status: 409, message: Attach a receipt before submitting this expense }
      steps:
        - query: "UPDATE expenses SET state = 'Submitted', row_version = row_version + 1 WHERE id = :id"
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES(gen_random_uuid(), :id, :current_user_name, 'expenses.submit', 'Submitted', 'Submitted for manager approval')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
  - id: reset_expense
    type: server
    permission: expenses.write
    action: expenses.reset
    handler: order_transition
    workflow: expense_items
    operation: reset
    refresh: [expenses_my]
    mutation:
      guards: [{ query: "SELECT id FROM expenses WHERE id = :id AND state = 'Refused'", status: 409, message: Only refused expenses can be reset }]
      steps:
        - query: "UPDATE expenses SET state = 'Draft', refusal_reason = NULL, row_version = row_version + 1 WHERE id = :id"
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES(gen_random_uuid(), :id, :current_user_name, 'expenses.reset', 'Reset', 'Reset to draft')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
  - id: view_expense_detail
    type: navigate
    permission: expenses.read
    navigate_to: /expenses/detail
    params: { id: '{row.id}' }
  - id: import_expenses
    type: server_form
    permission: expenses.write
    title: Import expenses
    action: expenses.import
    handler: yaml_mutation
    operation: create
    submit_label: Import
    refresh: [expenses_my]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:expense_list AS VARCHAR))) > 0", status: 422, code: EXPENSE_IMPORT_REQUIRED, message: Add at least one expense row. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM (SELECT trim(unnest(string_split(CAST(:expense_list AS VARCHAR), chr(10)))) AS line) lines WHERE line <> '' AND NOT regexp_matches(line, '^[^|]+\\|[^|]+\\|[^|]+\\|[0-9]{4}-[0-9]{2}-[0-9]{2}\\|[0-9]+(\\.[0-9]{1,2})?\\|(Company|Employee)$'))", status: 422, code: EXPENSE_IMPORT_INVALID, message: "Each row must use Name|Employee|Category|YYYY-MM-DD|Amount|Company or Employee format." }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR COALESCE(:company_name, :current_company_name) = :current_company_name", status: 403, code: EXPENSE_COMPANY_SCOPE_REQUIRED, message: Imported expenses must belong to the current company. }
      steps:
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(CAST(:expense_list AS VARCHAR), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS name, trim(split_part(line, '|', 2)) AS employee_name, trim(split_part(line, '|', 3)) AS category, CAST(trim(split_part(line, '|', 4)) AS DATE) AS expense_date, CAST(trim(split_part(line, '|', 5)) AS DECIMAL(18,2)) AS amount, trim(split_part(line, '|', 6)) AS payment_method FROM lines WHERE line <> ''), keyed AS (SELECT *, 'expense-sheet-import-' || regexp_replace(lower(employee_name), '[^a-z0-9]+', '-', 'g') AS sheet_id FROM parsed) INSERT INTO expense_sheets(id, row_version, name, employee_name, manager_name, state, expense_date, amount_total, amount_reimbursed, note, created_at) SELECT DISTINCT sheet_id, 1, 'Imported expenses — ' || employee_name, employee_name, NULL, 'Draft', expense_date, 0, 0, 'Imported through Expenses', TIMESTAMP '2026-09-13 10:00:00' FROM keyed ON CONFLICT (id) DO NOTHING" }
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(CAST(:expense_list AS VARCHAR), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS name, trim(split_part(line, '|', 2)) AS employee_name, trim(split_part(line, '|', 3)) AS category, CAST(trim(split_part(line, '|', 4)) AS DATE) AS expense_date, CAST(trim(split_part(line, '|', 5)) AS DECIMAL(18,2)) AS amount, trim(split_part(line, '|', 6)) AS payment_method FROM lines WHERE line <> ''), keyed AS (SELECT *, 'expense-sheet-import-' || regexp_replace(lower(employee_name), '[^a-z0-9]+', '-', 'g') AS sheet_id, 'expense-import-' || regexp_replace(lower(employee_name || '-' || name), '[^a-z0-9]+', '-', 'g') AS expense_id FROM parsed) INSERT INTO expenses(id, row_version, sheet_id, name, category, expense_date, employee_name, amount, payment_method, description, receipt_reference, state, created_at) SELECT expense_id, 1, sheet_id, name, category, expense_date, employee_name, amount, payment_method, 'Imported through Expenses', NULL, 'Draft', TIMESTAMP '2026-09-13 10:00:00' FROM keyed ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name, category = EXCLUDED.category, expense_date = EXCLUDED.expense_date, employee_name = EXCLUDED.employee_name, amount = EXCLUDED.amount, payment_method = EXCLUDED.payment_method" }
        - { query: "UPDATE expense_sheets s SET amount_total = (SELECT COALESCE(SUM(e.amount), 0) FROM expenses e WHERE e.sheet_id = s.id) WHERE s.id LIKE 'expense-sheet-import-%'" }
      result: { query: "SELECT COUNT(*) AS imported FROM expenses WHERE id LIKE 'expense-import-%'" }
    fields:
      - { field: expense_list, label: Expense List, type: textarea, required: true, placeholder: "Team breakfast|Admin User|Meals|2026-09-13|24.50|Employee" }
      - { field: company_name, label: Company, type: text, default: My Company }
  - id: export_expenses
    type: client
    permission: expenses.read
    script: |
      // js
      ({ state }) => {
        const rows = Array.isArray(state.expenses_my) ? state.expenses_my : [];
        const columns = ['name', 'employee_name', 'category', 'expense_date', 'amount', 'payment_mode', 'status'];
        const csv = [columns.join(','), ...rows.map((row) => columns.map((column) => JSON.stringify(String(row[column] ?? ''))).join(','))].join('\\n');
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const anchor = document.createElement('a'); anchor.href = url; anchor.download = 'expenses.csv'; anchor.click(); URL.revokeObjectURL(url);
      }
  - id: print_expenses
    type: client
    permission: expenses.read
    script: |
      // js
      () => { window.print() }
