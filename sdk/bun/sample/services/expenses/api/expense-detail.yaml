page: { id: expense-detail }
datasources:
  - id: expense_detail
    single: true
    permission: expenses.read
    workflow: expense_items
    error_states: { transport_error: { status: 503, code: EXPENSE_DETAIL_UNAVAILABLE, message: Expense detail data is temporarily unavailable } }
    query: |
      SELECT e.id, e.row_version, e.name, e.employee_name, e.category,
        CAST(e.expense_date AS VARCHAR) AS expense_date, e.description,
        e.amount, printf('$%,.2f', e.amount) AS amount_display,
        printf('$%,.2f', COALESCE(e.tax_amount, 0)) AS tax_display,
        e.payment_method AS payment_mode,
        CASE e.payment_method WHEN 'Company' THEN 'Paid by Company' ELSE 'Paid by Employee' END AS payment_mode_label,
        e.product_name, e.quantity, e.unit_name,
        printf('%,.3f %s', COALESCE(e.quantity, 1), COALESCE(e.unit_name, 'Units')) AS quantity_display,
        e.manager_name, e.vendor_name, e.receipt_reference, e.receipt_label, e.receipt_checksum,
        e.company_name, e.department_name,
        e.analytic_distribution, e.journal_entry, e.duplicate_candidate,
        e.reimbursement_status, e.refusal_reason, e.state AS status
      FROM expenses e WHERE e.id = :id AND (:fixture_state IS NULL OR :fixture_state <> 'empty')
  - id: expense_detail_activity
    single: false
    permission: expenses.read
    query: |
      SELECT actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at
      FROM expense_activity WHERE expense_id = :id ORDER BY created_at DESC
  - id: expense_detail_attachments
    single: false
    permission: expenses.read
    error_states: { transport_error: { status: 503, code: EXPENSE_ATTACHMENTS_UNAVAILABLE, message: Expense receipt data is temporarily unavailable } }
    query: |
      SELECT id, expense_id, file_name, mime_type, size_bytes, uploaded_by,
        CAST(created_at AS VARCHAR) AS created_at
      FROM expense_attachments WHERE expense_id = :id ORDER BY created_at DESC, id
  - id: expense_duplicate_review
    single: true
    permission: expenses.read
    error_states: { transport_error: { status: 503, code: EXPENSE_DUPLICATE_REVIEW_UNAVAILABLE, message: Duplicate receipt review data is temporarily unavailable } }
    query: |
      SELECT e.id, e.row_version,
        'The following expenses have similar employee, amount, and category. Please verify this expense is not a duplicate.' AS review_message,
        COALESCE(string_agg(
          c.candidate_name || ' | ' || c.candidate_employee || ' | ' || c.candidate_category || ' | ' || printf('$%,.2f', c.candidate_amount) || ' | ' || CAST(c.candidate_date AS VARCHAR) || ' | Manager: ' || COALESCE(c.candidate_manager, '—'),
          chr(10) ORDER BY c.sequence, c.id
        ), 'No matching expense found') AS candidate_summary
      FROM expenses e
      LEFT JOIN expense_duplicate_candidates c ON c.expense_id = e.id
      WHERE e.id = :id
        AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
      GROUP BY e.id, e.row_version
actions:
  - { id: view_expense_detail, type: navigate, permission: expenses.read, navigate_to: /expenses/detail, params: { id: '{row.id}' } }
  - id: edit_expense_detail
    type: server_form
    permission: expenses.write
    title: Edit expense
    action: expenses.detail.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [expense_detail, expense_detail_activity]
    mutation:
      operation: update
      table: expenses
      concurrency: { field: row_version, input: expected_row_version, required: true }
      fields: [name, category, expense_date, description, amount, payment_method, receipt_reference, receipt_label, tax_amount, analytic_distribution]
      required: [name, category, expense_date, amount]
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state = 'Draft' AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Only the current draft can be edited }
        - { query: "SELECT 1 AS ok WHERE CAST(:amount AS DECIMAL(18,2)) > 0", status: 400, code: EXPENSE_AMOUNT_INVALID, message: Expense total must be greater than zero }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(CAST(:expense_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 400, code: EXPENSE_DATE_INVALID, message: Expense date must use YYYY-MM-DD }
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    fields:
      - { field: name, label: Expense, type: text, required: true }
      - { field: category, label: Category, type: text, required: true }
      - { field: expense_date, label: Expense date, type: text, required: true }
      - { field: description, label: Description, type: textarea }
      - { field: amount, label: Total, type: number, required: true }
      - { field: payment_method, label: Paid by, type: select, options: [{ value: Company, label: Paid by Company }, { value: Employee, label: Paid by Employee }] }
      - { field: receipt_reference, label: Receipt attachment, type: text }
      - { field: tax_amount, label: Taxes, type: number }
      - { field: analytic_distribution, label: Analytic distribution, type: text }
  - id: submit_expense_detail
    type: server
    permission: expenses.write
    action: expenses.detail.submit
    handler: order_transition
    workflow: expense_items
    operation: submit
    params: { id: '{state.id}' }
    mutation:
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state = 'Draft' AND row_version = :expected_row_version AND NULLIF(TRIM(receipt_reference), '') IS NOT NULL", status: 409, code: EXPENSE_SUBMIT_GUARD, message: Attach a receipt before submitting this expense }
      steps:
        - query: "UPDATE expenses SET state = 'Submitted', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          code: STALE_RECORD
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-submit-' || CAST(:expected_row_version AS VARCHAR), :id, :current_user_name, 'expenses.submit', 'Submitted', 'Submitted for manager approval')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    refresh: [expense_detail, expense_detail_activity]
  - id: approve_expense_detail
    type: server
    permission: expenses.manage
    action: expenses.detail.approve
    handler: yaml_mutation
    operation: approve
    params: { id: '{state.id}' }
    mutation:
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state = 'Submitted' AND row_version = :expected_row_version AND NULLIF(TRIM(receipt_reference), '') IS NOT NULL", status: 409, code: EXPENSE_APPROVE_GUARD, message: Attach a receipt before approving this expense }
      steps:
        - query: "UPDATE expenses SET state = 'Approved', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          code: STALE_RECORD
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-approve-' || CAST(:expected_row_version AS VARCHAR), :id, :current_user_name, 'expenses.approve', 'Approved', 'Approved for posting')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    refresh: [expense_detail, expense_detail_activity]
  - id: review_duplicate_expense
    type: server_form
    permission: expenses.manage
    title: Validate Duplicate Expenses
    submit_label: Apply decision
    cancel_label: Cancel
    action: expenses.detail.duplicate_review
    handler: yaml_mutation
    operation: update
    mutation:
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state = 'Submitted' AND row_version = :expected_row_version", status: 409, code: EXPENSE_DUPLICATE_REVIEW_STALE, message: This submitted expense changed before duplicate review. Reload it and try again. }
        - { query: "SELECT id FROM expense_duplicate_candidates WHERE expense_id = :id", status: 409, code: EXPENSE_DUPLICATE_REVIEW_EMPTY, message: No duplicate candidate is available for this expense. }
        - { query: "SELECT 1 AS ok WHERE :decision IN ('approve', 'refuse')", status: 400, code: EXPENSE_DUPLICATE_DECISION_INVALID, message: Choose Approve or Refuse before applying the review. }
      steps:
        - query: "UPDATE expenses SET state = CASE WHEN :decision = 'approve' THEN 'Approved' ELSE 'Refused' END, refusal_reason = CASE WHEN :decision = 'refuse' THEN 'Duplicate Expense' ELSE NULL END, row_version = row_version + 1 WHERE id = :id AND state = 'Submitted' AND row_version = :expected_row_version"
          expect_changed: true
          code: EXPENSE_DUPLICATE_REVIEW_STALE
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-duplicate-review-' || CAST(:expected_row_version AS VARCHAR), :id, :current_user_name, CASE WHEN :decision = 'approve' THEN 'expenses.duplicate_approve' ELSE 'expenses.duplicate_refuse' END, CASE WHEN :decision = 'approve' THEN 'Approved after duplicate review' ELSE 'Refused as duplicate' END, CASE WHEN :decision = 'approve' THEN 'Confirmed this expense is not a duplicate' ELSE 'Duplicate Expense' END)"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    refresh: [expense_detail, expense_detail_activity, expense_duplicate_review]
    prefill: source
    prefill_source: expense_duplicate_review
    params: { id: '{state.id}' }
    fields:
      - { field: review_message, label: Review, type: textarea, readonly: true }
      - { field: candidate_summary, label: Similar expenses, type: textarea, readonly: true }
      - { field: decision, label: Decision, type: select, required: true, options: [{ value: approve, label: Approve }, { value: refuse, label: Refuse }] }
  - id: post_expense_detail
    type: server
    permission: expenses.manage
    action: expenses.detail.post
    handler: yaml_mutation
    operation: post
    params: { id: '{state.id}' }
    mutation:
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state = 'Approved' AND row_version = :expected_row_version AND NULLIF(TRIM(receipt_reference), '') IS NOT NULL", status: 409, code: EXPENSE_POST_GUARD, message: Attach a receipt before posting this expense }
      steps:
        - query: "UPDATE expenses SET state = 'Posted', row_version = row_version + 1, journal_entry = COALESCE(journal_entry, 'MISC/2026/EXPENSE') WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          code: STALE_RECORD
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-post-' || CAST(:expected_row_version AS VARCHAR), :id, :current_user_name, 'expenses.post', 'Posted', 'Journal entry posted')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    refresh: [expense_detail, expense_detail_activity]
  - id: mark_expense_in_payment
    type: server
    permission: expenses.manage
    action: expenses.detail.in_payment
    handler: yaml_mutation
    operation: in_payment
    params: { id: '{state.id}' }
    mutation:
      guards: [{ query: "SELECT id FROM expenses WHERE id = :id AND state = 'Posted' AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Only the current posted expense can be registered for payment }]
      steps:
        - query: "UPDATE expenses SET state = 'In Payment', reimbursement_status = 'In payment', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          code: STALE_RECORD
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-in-payment-' || CAST(:expected_row_version AS VARCHAR), :id, :current_user_name, 'expenses.pay', 'In payment', 'Reimbursement payment initiated')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    refresh: [expense_detail, expense_detail_activity]
  - id: pay_expense_detail
    type: server
    permission: expenses.manage
    action: expenses.detail.pay
    handler: yaml_mutation
    operation: pay
    params: { id: '{state.id}' }
    mutation:
      guards: [{ query: "SELECT id FROM expenses WHERE id = :id AND state = 'In Payment' AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Only the current in-payment expense can be marked paid }]
      steps:
        - query: "UPDATE expenses SET state = 'Paid', reimbursement_status = 'Paid', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          code: STALE_RECORD
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-paid-' || CAST(:expected_row_version AS VARCHAR), :id, :current_user_name, 'expenses.pay', 'Paid', 'Reimbursement marked paid')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    refresh: [expense_detail, expense_detail_activity]
  - id: refuse_expense_detail
    type: server_form
    permission: expenses.manage
    action: expenses.detail.refuse
    handler: yaml_mutation
    operation: refuse
    title: Refuse Expense
    params: { id: '{state.id}' }
    fields: [{ field: reason, label: Reason, type: text, required: true, placeholder: Explain why this expense is being refused... }]
    mutation:
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state IN ('Submitted', 'Approved') AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Only the current submitted or approved expense can be refused }
        - { query: "SELECT 1 AS ok WHERE length(trim(:reason)) BETWEEN 3 AND 500", status: 400, code: EXPENSE_REFUSAL_REASON_INVALID, message: A refusal reason between 3 and 500 characters is required }
      steps:
        - query: "UPDATE expenses SET state = 'Refused', refusal_reason = :reason, row_version = row_version + 1 WHERE id = :id AND state IN ('Submitted', 'Approved') AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          message: Only submitted or approved expenses can be refused
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-refuse-' || CAST(:expected_row_version AS VARCHAR), :id, :current_user_name, 'expenses.refuse', 'Refused', :reason)"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    refresh: [expense_detail, expense_detail_activity]
  - id: reset_expense_detail
    type: server
    permission: expenses.write
    action: expenses.detail.reset
    handler: order_transition
    workflow: expense_items
    operation: reset
    params: { id: '{state.id}' }
    mutation:
      guards: [{ query: "SELECT id FROM expenses WHERE id = :id AND state = 'Refused' AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Only the current refused expense can be reset }]
      steps:
        - query: "UPDATE expenses SET state = 'Draft', refusal_reason = NULL, row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          code: STALE_RECORD
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-reset-' || CAST(:expected_row_version AS VARCHAR), :id, :current_user_name, 'expenses.reset', 'Reset', 'Reset to draft')"
      result: { query: "SELECT * FROM expenses WHERE id = :id" }
    refresh: [expense_detail, expense_detail_activity]
  - id: upload_expense_attachment
    type: upload
    action: expenses.detail.attach
    handler: attachment_metadata
    permission: expenses.write
    kind: expense_attachment
    params: { id: '{row.id}' }
    mutation:
      generated: [attachment_id]
      guards:
        - { query: "SELECT id FROM expenses WHERE id = :id AND state = 'Draft'", status: 409, message: Receipts can only be attached to draft expenses }
      steps:
        - query: "INSERT INTO expense_attachments(id, expense_id, file_name, mime_type, size_bytes, storage_key, uploaded_by) VALUES(:attachment_id, :id, :fileName, :mimeType, :sizeBytes, :storageKey, :current_user_id)"
        - query: "UPDATE expenses SET receipt_reference = :fileName, receipt_label = 'Receipt attached', receipt_checksum = 'uploaded:' || :attachment_id, row_version = row_version + 1 WHERE id = :id"
        - query: "INSERT INTO expense_activity(id, expense_id, actor_name, action, action_label, detail) VALUES('expense-activity-' || :id || '-attachment-' || :attachment_id, :id, :current_user_name, 'expenses.attachments.upload', 'Receipt attached', :fileName)"
      result: { query: "SELECT id, expense_id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM expense_attachments WHERE id = :attachment_id" }
  - id: download_expense_attachment
    type: download
    permission: expenses.read
    kind: expense_attachment
