page: { id: expense-categories }
datasources:
  - id: expense_categories
    permission: expenses.manage
    error_states: { transport_error: { status: 503, code: EXPENSE_CATEGORIES_UNAVAILABLE, message: Expense categories are temporarily unavailable. } }
    query: "SELECT c.id, c.row_version, c.name, c.cost_method, c.unit_cost, c.reference, c.guideline, c.active, COUNT(e.id) AS draft_expense_count, COALESCE(SUM(e.amount), 0) AS draft_expense_total, CASE WHEN COUNT(e.id) > 0 THEN 'There are unsubmitted expenses linked to this category. Updating the category cost will change expense amounts. Make sure it is what you want to do.' ELSE NULL END AS cost_update_warning FROM expense_categories c LEFT JOIN expenses e ON LOWER(e.category) = LOWER(c.name) AND e.state = 'Draft' AND (NULLIF(TRIM(CAST(:current_company_name AS VARCHAR)), '') IS NULL OR e.company_name = :current_company_name) WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND ((:active IS NULL AND c.active = TRUE) OR (:active = 'active' AND c.active = TRUE) OR (:active = 'archived' AND c.active = FALSE)) AND (:q IS NULL OR c.name ILIKE '%' || :q || '%' OR COALESCE(c.reference, '') ILIKE '%' || :q || '%') GROUP BY c.id, c.row_version, c.name, c.cost_method, c.unit_cost, c.reference, c.guideline, c.active ORDER BY c.name, c.id"
actions:
  - id: create_expense_category
    type: server_form
    permission: expenses.manage
    title: New Expense Category
    action: expenses.categories.create
    handler: yaml_mutation
    operation: create
    refresh: [expense_categories]
    mutation:
      operation: insert
      table: expense_categories
      generated: [id]
      fields: [name, cost_method, unit_cost, reference, guideline, active]
      required: [name]
      defaults: { cost_method: fixed, unit_cost: 0, active: true }
      guards: [{ query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM expense_categories WHERE LOWER(name) = LOWER(:name))", status: 409, code: EXPENSE_CATEGORY_NAME_EXISTS, message: An expense category with this name already exists. }]
      result: { query: "SELECT * FROM expense_categories WHERE id = :id" }
    fields: [{ field: name, label: Name, type: text, required: true }, { field: cost_method, label: Cost Method, type: select, options: [{ value: fixed, label: Fixed Cost }, { value: quantity, label: Per Unit }] }, { field: unit_cost, label: Cost per Unit, type: number }, { field: reference, label: Reference, type: text }, { field: guideline, label: Note, type: textarea }, { field: active, label: Active, type: checkbox, default: true }]
  - id: edit_expense_category
    type: server_form
    permission: expenses.manage
    title: Edit Expense Category
    action: expenses.categories.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [expense_categories]
    mutation:
      operation: update
      table: expense_categories
      fields: [name, cost_method, unit_cost, reference, guideline]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT name AS previous_name FROM expense_categories WHERE id = :id AND row_version = :expected_row_version", assign: true, status: 409, code: STALE_RECORD, message: This expense category was changed by another user. Reload it before saving. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM expense_categories WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: EXPENSE_CATEGORY_NAME_EXISTS, message: An expense category with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE CAST(:unit_cost AS DECIMAL(18,2)) >= 0", status: 422, code: EXPENSE_CATEGORY_COST_INVALID, message: Category cost cannot be negative. }
      steps:
        - query: "UPDATE expenses SET category = :name, product_name = :name, quantity = CASE WHEN state = 'Draft' AND CAST(:unit_cost AS DECIMAL(18,2)) = 0 THEN 1 ELSE quantity END, amount = CASE WHEN state = 'Draft' AND CAST(:unit_cost AS DECIMAL(18,2)) > 0 THEN ROUND(CAST(:unit_cost AS DECIMAL(18,2)) * COALESCE(quantity, 1), 2) ELSE amount END, row_version = row_version + 1 WHERE LOWER(category) = LOWER(:previous_name) AND (NULLIF(TRIM(CAST(:current_company_name AS VARCHAR)), '') IS NULL OR company_name = :current_company_name)"
        - query: "UPDATE expense_sheets SET amount_total = (SELECT COALESCE(SUM(e.amount), 0) FROM expenses e WHERE e.sheet_id = expense_sheets.id) WHERE id IN (SELECT DISTINCT sheet_id FROM expenses WHERE LOWER(category) = LOWER(:name) AND state = 'Draft')"
      result: { query: "SELECT * FROM expense_categories WHERE id = :id" }
    fields: [{ field: name, label: Name, type: text, required: true }, { field: cost_method, label: Cost Method, type: select, options: [{ value: fixed, label: Fixed Cost }, { value: quantity, label: Per Unit }] }, { field: unit_cost, label: Cost per Unit, type: number }, { field: reference, label: Reference, type: text }, { field: guideline, label: Note, type: textarea }, { field: draft_expense_count, label: Unsubmitted Expenses, type: number, readonly: true }, { field: cost_update_warning, label: Cost update warning, type: textarea, readonly: true }]
  - id: archive_expense_category
    type: server
    permission: expenses.manage
    action: expenses.categories.archive
    handler: yaml_mutation
    operation: update
    refresh: [expense_categories]
    params: { values: { active: false } }
    mutation: { operation: update, table: expense_categories, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM expense_categories WHERE id = :id" } }
  - id: unarchive_expense_category
    type: server
    permission: expenses.manage
    action: expenses.categories.unarchive
    handler: yaml_mutation
    operation: update
    refresh: [expense_categories]
    params: { values: { active: true } }
    mutation: { operation: update, table: expense_categories, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM expense_categories WHERE id = :id" } }
