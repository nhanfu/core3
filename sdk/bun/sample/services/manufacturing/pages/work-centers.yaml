title: Work Centers
page: { id: manufacturing-work-centers, route: /work-centers, breadcrumb: [Supply Chain, Manufacturing, Configuration, Work Centers], auth: { require: [manufacturing.read] } }
components:
  - type: ListView
    variant: odoo
    source: mrp_workcenters
    create_action: create_mrp_workcenter
    create_label: New
    search: { label: Search work centers, placeholder: Search work centers or codes... }
    filters: [{ field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: working_state
        card: { title: name, subtitle: code, fields: [{ field: time_efficiency, label: Time Efficiency }, { field: oee_target, label: OEE Target }] }
    form_view: { page: apps/services/manufacturing/pages/work-center-detail.yaml, side_panel: false }
    row_key: id
    row_open_action: view_mrp_workcenter
    row_double_click_action: view_mrp_workcenter
    row_actions: menu
    empty_state: { title: No work centers found, description: No work centers match the current filters. Try another search or create a new work center. }
    columns:
      - { field: name, label: Work Center, type: PrimaryEntityCell, mobile: true, sortable: true }
      - { field: sequence, label: Sequence, type: number, sortable: true, mobile: false }
      - { field: code, label: Code }
      - { field: tags, label: Tag }
      - { field: alternative_workcenters, label: Alternative Workcenters, optional: hide, mobile: false }
      - { field: productive_time, label: Productive Time, optional: hide, align: right, mobile: false }
      - { field: costs_hour, label: Cost per hour, align: right, mobile: false }
      - { field: time_efficiency, label: Time Efficiency, align: right, mobile: true }
      - { field: oee_target, label: OEE Target, align: right, mobile: true }
      - { field: company_name, label: Company, optional: hide, mobile: false }
      - { field: id, label: ' ', sortable: false, actions: [{ id: edit_mrp_workcenter, label: Edit, icon: edit }, { id: archive_mrp_workcenter, label: Archive, icon: archive, show_if: 'row.active === true' }, { id: unarchive_mrp_workcenter, label: Unarchive, icon: archive, show_if: 'row.active === false' }, { id: delete_mrp_workcenter, label: Delete, icon: trash, variant: danger }] }
    page_size: 25
