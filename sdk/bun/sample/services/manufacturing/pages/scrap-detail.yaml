title: Scrap Order
page: { id: manufacturing-scrap-detail, route: /scraps/detail, breadcrumb: [Supply Chain, Manufacturing, Operations, Scrap], auth: { require: [manufacturing.read] } }
components:
  - type: OdooFormView
    source: stock_scrap_detail
    title_field: name
    subtitle_field: product_name
    status_field: state
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit, workflowStatus: Status }
    header_actions:
      - { id: back_to_stock_scraps, label: Back to Scrap Orders, icon: arrow-left, permission: manufacturing.read }
      - { id: validate_stock_scrap, label: Validate, variant: primary, permission: manufacturing.write, show_if: "record.state === 'Draft'" }
      - { id: edit_stock_scrap, label: Edit, variant: secondary, permission: manufacturing.write, show_if: "record.state === 'Draft'" }
      - { id: delete_stock_scrap_detail, label: Delete, variant: danger, permission: manufacturing.write, show_if: "record.state === 'Draft'", confirm: Delete this Scrap Order? }
    statusbar: [{ value: Draft, label: Draft }, { value: Done, label: Done }]
    status_colors: { Draft: neutral, Done: green }
    group_columns: 2
    groups:
      - title: Scrap
        fields:
          - { field: name, label: Reference }
          - { field: date_done, label: Date }
          - { field: product_name, label: Product }
          - { field: scrap_qty, label: Quantity }
          - { field: product_uom, label: Unit }
          - { field: should_replenish, label: Replenish Quantities }
      - title: Traceability
        fields:
          - { field: source_location, label: Source Location }
          - { field: scrap_location, label: Scrap Location }
          - { field: company_name, label: Company }
          - { field: origin, label: Source Document }
          - { field: production_name, label: Manufacturing Order }
          - { field: lot_name, label: Lot/Serial Number }
    notebook:
      active: details
      tabs:
        - id: details
          label: Additional Information
          groups:
            - title: Notes
              fields:
                - { field: note, label: Notes }
                - { field: row_version, label: Revision }
