title: BoM Overview
page: { id: manufacturing-bom-overview, route: /boms/detail/overview, breadcrumb: [Supply Chain, Manufacturing, Products, Bills of Materials, BoM Overview], auth: { require: [manufacturing.read] } }
components:
  - type: OdooFormView
    source: mrp_bom_overview
    title_field: product_name
    subtitle_field: reference
    editable: false
    header_actions: [{ id: back_to_mrp_bom_detail, label: Back to Bill of Materials, icon: arrow-left, permission: manufacturing.read }]
    groups:
      - title: BoM Overview
        fields: [{ field: product_name, label: Product }, { field: product_quantity, label: Quantity }, { field: uom, label: Unit }, { field: bom_type, label: BoM Type }, { field: total_cost, label: BoM Cost }, { field: component_count, label: Components }]
    notebook:
      active: components
      tabs:
        - id: components
          label: Components
          component:
            type: ListView
            variant: odoo
            source: mrp_bom_overview_lines
            columns: [{ field: component_name, label: Component, type: PrimaryEntityCell }, { field: quantity, label: Quantity, align: right }, { field: availability_status, label: Availability }, { field: unit_cost, label: Unit Cost, align: right }, { field: total_cost, label: BoM Cost, align: right }]
            row_key: id
            empty_state: { title: No components, description: This bill of materials has no component lines. }
        - id: operations
          label: Operations
          component:
            type: ListView
            variant: odoo
            source: mrp_bom_overview_operations
            columns: [{ field: name, label: Operation, type: PrimaryEntityCell }, { field: workcenter, label: Work Center }, { field: time_cycle, label: Duration, align: right }]
            row_key: id
            empty_state: { title: No operations, description: No operations are configured for this bill of materials. }
