title: Manufacturing Order
page: { id: manufacturing-detail, route: /manufacturing-orders/detail, breadcrumb: [Supply Chain, Manufacturing, Manufacturing Orders, Detail], auth: { require: [manufacturing.read] } }
components:
  - type: OdooFormView
    source: mrp_production_detail
    title_field: name
    subtitle_field: product_name
    editable: true
    stat_buttons:
      - { id: open_mrp_production_overview, label: Overview, value_field: quantity, permission: manufacturing.read }
      - { id: open_mrp_production_moves, label: Product Moves, value_field: move_count, permission: manufacturing.read, show_if: "record.state === 'In Progress' || record.state === 'Done'" }
    labels: { save: Save, discard: Discard, editDetails: Edit, workflowStatus: Status }
    header_actions:
      - { id: back_to_mrp_productions, label: Back to Manufacturing Orders, icon: arrow-left, permission: manufacturing.read }
      - { id: edit_mrp_production, label: Edit, variant: primary, permission: manufacturing.write }
      - { id: confirm_mrp_production_detail, label: Confirm, variant: primary, permission: manufacturing.write, show_if: "record.state === 'Draft'" }
      - { id: start_mrp_production_detail, label: Start, variant: secondary, permission: manufacturing.write, show_if: "record.state === 'Confirmed'" }
      - { id: produce_mrp_production_detail, label: Mark produced, variant: primary, permission: manufacturing.write, show_if: "record.state === 'In Progress'" }
      - { id: close_mrp_production_detail, label: Close, variant: primary, permission: manufacturing.write, show_if: "record.state === 'To Close'" }
      - { id: cancel_mrp_production_detail, label: Cancel, variant: danger, permission: manufacturing.write, show_if: "record.state !== 'Done' && record.state !== 'Cancelled'" }
    group_columns: 2
    groups:
      - title: Production
        fields:
          - { field: name, label: Manufacturing order }
          - { field: state, label: Status }
          - { field: product_name, label: Product }
          - { field: bom_name, label: Bill of Materials }
          - { field: company_name, label: Company }
          - { field: warehouse_name, label: Warehouse }
      - title: Quantities and planning
        fields:
          - { field: quantity, label: To produce }
          - { field: qty_produced, label: Produced }
          - { field: planned_date, label: Planned date }
          - { field: priority, label: Priority }
          - { field: origin, label: Source document }
          - { field: reference, label: Reference }
    status_field: state
    statusbar:
      - { value: Draft, label: Draft }
      - { value: Confirmed, label: Confirmed }
      - { value: In Progress, label: In Progress }
      - { value: To Close, label: To Close }
      - { value: Done, label: Done }
      - { value: Cancelled, label: Cancelled }
    status_colors: { Draft: neutral, Confirmed: amber, In Progress: blue, To Close: purple, Done: green, Cancelled: red }
    notebook:
      active: components
      tabs:
        - id: components
          label: Components
          component:
            type: ListView
            variant: odoo
            scroll: body
            source: mrp_production_moves
            columns: [{ field: move_type, label: Move, type: StatusChip }, { field: product_name, label: Product, type: PrimaryEntityCell }, { field: quantity, label: Demand, align: right }, { field: reserved_quantity, label: Reserved, align: right }, { field: uom, label: Unit }, { field: lot_name, label: Lot / Serial }, { field: state, label: Status, type: StatusChip }]
            row_key: id
            empty_state: { title: No stock moves, description: Components and finished products will appear here when the order is planned. }
        - id: work-orders
          label: Work Orders
          component:
            type: ListView
            variant: odoo
            scroll: body
            source: mrp_production_workorders
            columns: [{ field: sequence, label: Sequence, align: right }, { field: name, label: Work order, type: PrimaryEntityCell }, { field: workcenter, label: Work center }, { field: expected_duration, label: Expected minutes, align: right }, { field: actual_duration, label: Actual minutes, align: right }, { field: state, label: Status, type: StatusChip }]
            row_key: id
            empty_state: { title: No work orders, description: This manufacturing order has no work orders yet. }
        - id: miscellaneous
          label: Miscellaneous
          groups:
            - title: Tracking
              fields: [{ field: reference, label: Reference }, { field: origin, label: Source document }, { field: locked, label: Locked, type: checkbox }, { field: availability, label: Availability }]
