title: Operations
page: { id: manufacturing-operations, route: /operations, breadcrumb: [Supply Chain, Manufacturing, Configuration, Operations], auth: { require: [manufacturing.read] } }
components:
  - type: ListView
    variant: odoo
    source: mrp_operations
    create_action: create_mrp_operation
    create_label: New
    search: { label: Search operations, placeholder: 'Search operations, bills of material, or work centers...' }
    filters:
      - { field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }
      - { field: time_mode, label: Duration Computation, options: [{ id: manual, label: Fixed }, { id: auto, label: Computed }] }
    group_by: [{ field: bom_name, label: Bill of Material }, { field: workcenter_name, label: Work Center }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: bom_name
        card: { title: name, subtitle: workcenter_name, fields: [{ field: bom_name, label: Bill of Material }, { field: time_cycle_display, label: Duration (minutes) }, { field: cost_mode_label, label: Cost based on }, { field: active_label, label: Active }] }
    form_view: { page: apps/services/manufacturing/pages/operation-detail.yaml, side_panel: false }
    row_key: id
    row_open_action: view_mrp_operation
    row_double_click_action: view_mrp_operation
    row_actions: menu
    empty_state: { title: No operations found, description: Define operations to route bills of material through work centers. }
    columns:
      - { field: name, label: Operation, type: PrimaryEntityCell, mobile: true, mobile_secondary: workcenter_name, sortable: true }
      - { field: bom_name, label: Bill of Material, mobile: false }
      - { field: workcenter_name, label: Work Center, mobile: true }
      - { field: time_cycle_display, label: Duration (minutes), align: right, mobile: true }
      - { field: time_total, label: Total Duration (minutes), align: right, optional: hide, mobile: false }
      - { field: company_name, label: Company, optional: hide, mobile: false }
      - { field: active, label: Status, type: StatusChip, optional: hide, mobile: false }
      - { field: id, label: ' ', sortable: false, mobile: false, actions: [{ id: view_mrp_operation, label: Open, icon: eye }, { id: edit_mrp_operation, label: Edit, icon: edit }, { id: archive_mrp_operation, label: Archive, icon: archive, show_if: 'row.active === true' }, { id: unarchive_mrp_operation, label: Restore, icon: archive, show_if: 'row.active === false' }, { id: delete_mrp_operation, label: Delete, icon: trash, variant: danger }] }
    page_size: 50
