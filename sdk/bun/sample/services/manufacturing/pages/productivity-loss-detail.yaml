title: Productivity Loss
page: { id: manufacturing-productivity-loss-detail, route: /manufacturing/productivity-losses/detail, breadcrumb: [Supply Chain, Manufacturing, Configuration, Work Centers, Productivity Losses, Detail], auth: { require: [manufacturing.read] } }
components:
  - type: OdooFormView
    source: mrp_productivity_loss_detail
    title_field: loss_reason
    subtitle_field: workcenter_name
    editable: true
    group_columns: 2
    groups:
      - fields:
          - { field: manufacturing_order_name, label: Manufacturing Order }
          - { field: workorder_name, label: Work Order }
          - { field: workcenter_name, label: Work Center }
          - { field: loss_reason, label: Loss Reason }
      - fields:
          - { field: date_start, label: Start Date }
          - { field: date_end, label: End Date }
          - { field: duration_minutes, label: Duration }
          - { field: company_name, label: Company }
    fields:
      - { field: description, label: Description, type: textarea, wide: true }
    header_actions:
      - { id: back_to_mrp_productivity_losses, label: Back to Productivity Losses, icon: arrow-left, permission: manufacturing.read }
      - { id: edit_mrp_productivity_loss, label: Edit, variant: primary, permission: manufacturing.write }
      - { id: delete_mrp_productivity_loss, label: Delete, variant: danger, permission: manufacturing.manage, confirm: Delete this productivity loss? }
