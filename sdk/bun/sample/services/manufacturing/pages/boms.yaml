title: Bills of Materials
page: { id: boms, route: /boms, breadcrumb: [Supply Chain, Manufacturing, Products, Bills of Materials], auth: { require: [manufacturing.read] } }
components:
  - type: ListView
    variant: odoo
    source: mrp_boms
    create_action: create_mrp_bom
    create_label: New
    search: { label: Search..., placeholder: Search... }
    filters:
      - { field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }
      - { field: bom_type, label: BoM Type, options: [{ id: Manufacture this product, label: Manufacture this product }, { id: Kit, label: Kit }] }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: bom_type
        card: { title: product_name, subtitle: reference, fields: [{ field: product_quantity, label: Quantity }, { field: uom, label: Unit }, { field: bom_type, label: BoM Type }, { field: company_name, label: Company }] }
    form_view: { page: apps/services/manufacturing/pages/bom-detail.yaml, side_panel: false }
    row_key: id
    row_open_action: view_mrp_bom
    row_double_click_action: view_mrp_bom
    row_actions: menu
    empty_state: { title: No bills of materials found, description: Create a bill of materials or change the current search and filters. }
    columns:
      - { field: product_name, label: Product, type: PrimaryEntityCell, mobile: true, mobile_secondary: reference, sortable: true }
      - { field: reference, label: Reference, mobile: false }
      - { field: bom_type, label: BoM Type, mobile: false }
      - { field: company_name, label: Company, mobile: false }
      - { field: product_quantity, label: Quantity, type: WeightCell, unit: Units, mobile: true, optional: hide, align: right }
      - { field: uom, label: Unit, optional: hide }
      - { field: version, label: Version, optional: hide, mobile: false }
      - { field: active, label: Status, type: StatusChip, optional: hide, mobile: false }
      - { field: id, label: ' ', sortable: false, mobile: false, actions: [{ id: view_mrp_bom, label: Open, icon: eye }] }
    page_size: 50
