    path: /manufacturing-orders
    label: Manufacturing
    icon: factory
    permission: manufacturing.read
  groups:
    - id: operations
      label: Operations
      items:
        - path: /manufacturing-orders
          label: Manufacturing Orders
          icon: factory
          permission: manufacturing.read
        - path: /workorders
          label: Work Orders
          icon: tools
          permission: manufacturing.read
        - path: /unbuild-orders
          label: Unbuild Orders
          icon: undo
          permission: manufacturing.read
        - path: /scraps
