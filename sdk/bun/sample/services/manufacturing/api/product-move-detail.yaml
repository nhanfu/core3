page: { id: manufacturing-product-move-detail }
datasources:
  - id: mrp_product_move_detail
    single: true
    permission: manufacturing.read
    error_states: { unauthorized: { status: 401, code: MRP_PRODUCT_MOVE_UNAUTHORIZED, message: Sign in to view this move line. }, forbidden: { status: 403, code: MRP_PRODUCT_MOVE_FORBIDDEN, message: You do not have permission to view this move line. }, missing_record: { status: 404, code: MRP_PRODUCT_MOVE_NOT_FOUND, message: Product Move not found. }, transport_error: { status: 503, code: MRP_PRODUCT_MOVE_UNAVAILABLE, message: This move line is temporarily unavailable. } }
    query: "SELECT m.id, CAST('2026-01-15' AS VARCHAR) AS date, p.name AS reference, p.name AS production_name, m.move_type, m.product_name, m.quantity, m.uom, COALESCE(m.lot_name, '') AS lot_name, CASE WHEN m.move_type = 'Finished product' THEN 'Production' ELSE 'WH/Stock' END AS location, CASE WHEN m.move_type = 'Finished product' THEN 'WH/Stock' ELSE 'Production' END AS location_dest, m.state FROM mrp_production_moves m JOIN mrp_productions p ON p.id = m.production_id WHERE m.id = :id AND COALESCE(:fixture_state, '') NOT IN ('empty', 'not_found')"
actions:
  - id: back_to_mrp_product_moves
    type: navigate
    permission: manufacturing.read
    navigate_to: /manufacturing-orders/detail/product-moves
    params: { id: '{state.mrp_product_move_detail.production_id}' }
