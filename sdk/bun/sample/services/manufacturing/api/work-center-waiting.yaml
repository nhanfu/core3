page: { id: manufacturing-work-center-waiting }
datasources:
  - id: mrp_workcenter_waiting_states
    single: false
    permission: manufacturing.read
    query: "SELECT 'Waiting' AS value, 'Waiting' AS label"
  - id: mrp_workcenter_waiting_workorders
    single: false
    permission: manufacturing.read
    workflow: mrp_workorders
    error_states:
      unauthorized: { status: 401, code: MRP_WORKCENTER_WAITING_UNAUTHORIZED, message: Sign in to view Waiting Availability. }
      forbidden: { status: 403, code: MRP_WORKCENTER_WAITING_FORBIDDEN, message: You do not have permission to view Waiting Availability. }
      transport_error: { status: 503, code: MRP_WORKCENTER_WAITING_UNAVAILABLE, message: Waiting Availability is temporarily unavailable. }
    query: |
      SELECT w.id, w.row_version, w.operation_name, w.name, w.workcenter,
        p.name AS production_name, p.product_name, p.state AS production_state,
        w.expected_duration, w.actual_duration, w.state, w.paused, w.planned, w.late,
        w.blocked_reason, CAST(w.planned_date AS VARCHAR) AS planned_date,
        CAST(w.date_start AS VARCHAR) AS date_start, CAST(w.date_finished AS VARCHAR) AS date_finished
      FROM mrp_workorders w
      JOIN mrp_productions p ON p.id = w.production_id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END
        AND w.state = 'Waiting'
        AND (:workcenter_id IS NULL OR w.workcenter = (SELECT name FROM mrp_workcenters WHERE id = :workcenter_id))
        AND (:workcenter IS NULL OR w.workcenter = :workcenter)
        AND (:q IS NULL OR w.operation_name ILIKE '%' || :q || '%' OR w.name ILIKE '%' || :q || '%'
          OR p.name ILIKE '%' || :q || '%' OR p.product_name ILIKE '%' || :q || '%')
        AND (:state IS NULL OR w.state = :state)
        AND (:late IS NULL OR w.late = CAST(:late AS BOOLEAN))
      ORDER BY w.planned_date, w.sequence, w.id
actions:
  - id: view_mrp_waiting_workorder
    type: navigate
    permission: manufacturing.read
    navigate_to: /workorders/detail
    params: { id: '{row.id}' }
  - { id: plan_mrp_waiting_workorder, type: server, permission: manufacturing.write, action: manufacturing.workorders.plan, handler: order_transition, workflow: mrp_workorders, operation: plan, params: { id: '{row.id}' }, refresh: [mrp_workcenter_waiting_workorders] }
