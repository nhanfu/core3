page: { id: manufacturing-work-orders-analysis }

datasources:
  - id: mrp_workorder_analysis_states
    single: false
    permission: manufacturing.read
    query: "SELECT * FROM (VALUES ('Ready', 'To Do'), ('Progress', 'In Progress'), ('Blocked', 'Blocked'), ('Finished', 'Finished'), ('Cancelled', 'Cancelled'), ('Waiting', 'Waiting')) AS states(value, label)"
  - id: mrp_workorder_analysis_workcenters
    single: false
    permission: manufacturing.read
    query: "SELECT DISTINCT workcenter AS value, workcenter AS label FROM mrp_workorder_analysis WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END ORDER BY workcenter"
  - id: mrp_workorder_analysis_productions
    single: false
    permission: manufacturing.read
    query: "SELECT DISTINCT production_name AS value, production_name AS label FROM mrp_workorder_analysis WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END ORDER BY production_name"
  - id: mrp_workorder_analysis
    single: false
    permission: manufacturing.read
    error_states:
      unauthorized: { status: 401, code: MRP_WORKORDER_ANALYSIS_UNAUTHORIZED, message: Sign in to view Work Orders Analysis. }
      forbidden: { status: 403, code: MRP_WORKORDER_ANALYSIS_FORBIDDEN, message: You do not have permission to view Work Orders Analysis. }
      transport_error: { status: 503, code: MRP_WORKORDER_ANALYSIS_UNAVAILABLE, message: Work Orders Analysis is temporarily unavailable. }
    pivot:
      fields: [id, row_version, operation_name, workcenter, production_name, product_name, quantity, expected_duration, duration, duration_per_unit, state, status_label, planned_date, date_start, date_finished, production_state, company_name, blocked_reason]
    query: |
      SELECT id, row_version, operation_name, workcenter, production_name, product_name,
        CAST(quantity AS DOUBLE) AS quantity,
        CAST(expected_duration AS DOUBLE) AS expected_duration,
        CAST(duration AS DOUBLE) AS duration,
        CAST(duration_per_unit AS DOUBLE) AS duration_per_unit,
        state,
        CASE state
          WHEN 'Ready' THEN 'To Do'
          WHEN 'Progress' THEN 'In Progress'
          WHEN 'Finished' THEN 'Finished'
          WHEN 'Blocked' THEN 'Blocked'
          WHEN 'Cancelled' THEN 'Cancelled'
          ELSE 'Waiting'
        END AS status_label,
        CAST(planned_date AS VARCHAR) AS planned_date,
        CAST(date_start AS VARCHAR) AS date_start,
        CAST(date_finished AS VARCHAR) AS date_finished,
        production_state, company_name, COALESCE(blocked_reason, '') AS blocked_reason
      FROM mrp_workorder_analysis
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found', 'no_results') THEN FALSE ELSE TRUE END
        AND (COALESCE(:report_scope, 'active') = 'all' OR state IN ('Ready', 'Progress', 'Blocked'))
        AND (:q IS NULL OR operation_name ILIKE '%' || :q || '%'
          OR workcenter ILIKE '%' || :q || '%'
          OR production_name ILIKE '%' || :q || '%'
          OR product_name ILIKE '%' || :q || '%'
          OR state ILIKE '%' || :q || '%')
        AND (:state IS NULL OR state = :state)
        AND (:workcenter IS NULL OR workcenter = :workcenter)
        AND (:production_name IS NULL OR production_name = :production_name)
        AND (:from_date IS NULL OR CAST(planned_date AS DATE) >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR CAST(planned_date AS DATE) <= CAST(:to_date AS DATE))
      ORDER BY workcenter, planned_date, sequence, id

actions:
  - id: view_mrp_workorder_analysis
    type: navigate
    permission: manufacturing.read
    navigate_to: /manufacturing/work-orders-analysis/detail
    params: { id: '{row.id}' }
