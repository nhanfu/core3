page: { id: manufacturing-unbuild-product-move-detail }
datasources:
  - id: mrp_unbuild_move_detail
    single: true
    permission: manufacturing.read
    error_states:
      unauthorized: { status: 401, code: MRP_UNBUILD_MOVE_UNAUTHORIZED, message: Sign in to view this move line. }
      forbidden: { status: 403, code: MRP_UNBUILD_MOVE_FORBIDDEN, message: You do not have permission to view this move line. }
      missing_record: { status: 404, code: MRP_UNBUILD_MOVE_NOT_FOUND, message: Unbuild Product Move not found. }
      transport_error: { status: 503, code: MRP_UNBUILD_MOVE_UNAVAILABLE, message: This move line is temporarily unavailable. }
    query: |
      SELECT m.id, CAST(m.move_date AS VARCHAR) AS move_date, m.reference, m.unbuild_id,
        u.name AS unbuild_name, m.move_type, m.product_name, CAST(m.quantity AS DOUBLE) AS quantity,
        m.uom, COALESCE(m.lot_name, '') AS lot_name, m.location, m.location_dest,
        m.state, m.company_name
      FROM mrp_unbuild_moves m
      INNER JOIN mrp_unbuild_orders u
        ON u.id = m.unbuild_id AND u.company_name = m.company_name
      WHERE m.id = :id AND u.id = :unbuild_id
        AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END
actions:
  - id: back_to_mrp_unbuild_moves
    type: navigate
    permission: manufacturing.read
    navigate_to: /unbuild-orders/detail/product-moves
    params: { id: '{state.mrp_unbuild_move_detail.unbuild_id}' }
