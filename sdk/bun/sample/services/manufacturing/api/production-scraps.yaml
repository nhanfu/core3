page: { id: manufacturing-production-scraps }
datasources:
  - id: mrp_production_scrap_states
    single: false
    permission: manufacturing.read
    query: "SELECT * FROM (VALUES ('Draft', 'Draft'), ('Done', 'Done')) AS states(value, label)"
  - id: mrp_production_scrap_products
    single: false
    permission: manufacturing.read
    query: "SELECT DISTINCT s.product_name AS value, s.product_name AS label FROM stock_scraps s INNER JOIN mrp_productions p ON p.id = s.production_id WHERE s.production_id = :id AND s.company_name = p.company_name ORDER BY s.product_name"
  - id: mrp_production_scraps
    single: false
    permission: manufacturing.read
    error_states:
      unauthorized: { status: 401, code: MRP_PRODUCTION_SCRAPS_UNAUTHORIZED, message: Sign in to view Manufacturing Order scraps. }
      forbidden: { status: 403, code: MRP_PRODUCTION_SCRAPS_FORBIDDEN, message: You do not have permission to view Manufacturing Order scraps. }
      missing_record: { status: 404, code: MRP_PRODUCTION_SCRAPS_PRODUCTION_NOT_FOUND, message: Manufacturing Order not found. }
      transport_error: { status: 503, code: MRP_PRODUCTION_SCRAPS_UNAVAILABLE, message: Manufacturing Order scraps are temporarily unavailable. }
    query: |
      SELECT s.id, s.row_version, s.name, CAST(s.date_done AS VARCHAR) AS date_done,
        s.product_id, s.product_name, CAST(s.scrap_qty AS DOUBLE) AS scrap_qty,
        s.product_uom, s.source_location, s.scrap_location, s.company_name, s.state,
        COALESCE(s.origin, '') AS origin, COALESCE(s.production_name, p.name, '') AS production_name,
        s.production_id, COALESCE(s.lot_name, '') AS lot_name, s.should_replenish,
        COALESCE(s.note, '') AS note
      FROM stock_scraps s
      INNER JOIN mrp_productions p ON p.id = s.production_id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
        AND p.id = :id
        AND s.company_name = p.company_name
        AND (:q IS NULL OR s.name ILIKE '%' || :q || '%' OR s.product_name ILIKE '%' || :q || '%'
          OR s.source_location ILIKE '%' || :q || '%' OR s.scrap_location ILIKE '%' || :q || '%'
          OR COALESCE(s.origin, '') ILIKE '%' || :q || '%')
        AND (:state IS NULL OR s.state = :state)
        AND (:product_name IS NULL OR s.product_name = :product_name)
      ORDER BY s.name ASC, s.id
actions:
  - id: view_mrp_production_scrap
    type: navigate
    permission: manufacturing.read
    navigate_to: /scraps/detail
    params: { id: '{row.id}' }
  - id: create_mrp_production_scrap
    type: server_form
    permission: manufacturing.write
    title: New Scrap Order
    action: manufacturing.scraps.create
    handler: yaml_mutation
    operation: create
    params: { production_id: '{state.id}' }
    refresh: [mrp_production_scraps, mrp_production_detail]
    mutation:
      operation: insert
      table: stock_scraps
      generated: [id]
      fields: [production_id, name, date_done, product_id, product_name, scrap_qty, product_uom, source_location, scrap_location, company_name, state, origin, production_name, lot_name, should_replenish, note]
      required: [production_id, name, product_name, scrap_qty, product_uom, company_name]
      defaults: { date_done: '2026-01-21', product_id: product-furn-9666, product_uom: Units, source_location: WH/Stock, scrap_location: Virtual Locations/Scrap, company_name: 'My Company (San Francisco)', state: Draft, should_replenish: false, row_version: 1, created_at: '2026-01-21 10:00:00' }
      before_steps: [{ query: "SELECT 'scrap-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      guards:
        - { query: "SELECT id FROM mrp_productions WHERE id = :production_id", status: 404, code: MRP_PRODUCTION_SCRAPS_PRODUCTION_NOT_FOUND, message: Manufacturing Order not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:product_name AS VARCHAR))) > 0 AND CAST(:scrap_qty AS DECIMAL(18,3)) > 0", status: 422, code: MRP_PRODUCTION_SCRAP_REQUIRED_FIELDS, message: Reference, product, and a positive quantity are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM stock_scraps WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: STOCK_SCRAP_REFERENCE_EXISTS, message: A Scrap Order with this reference already exists. }
      result: { query: "SELECT * FROM stock_scraps WHERE id = :id" }
    fields:
      - { field: name, label: Reference, type: text, required: true, default: 'SCRAP/2026/NEW' }
      - { field: date_done, label: Date, type: date, required: true, default: '2026-01-21' }
      - { field: product_name, label: Product, type: select, options_source: mrp_production_scrap_products, required: true }
      - { field: scrap_qty, label: Quantity, type: number, required: true, min: 0.001, default: 1 }
      - { field: product_uom, label: Unit, type: text, required: true, default: Units }
      - { field: source_location, label: Source Location, type: text, default: WH/Stock }
      - { field: scrap_location, label: Scrap Location, type: text, default: Virtual Locations/Scrap }
      - { field: company_name, label: Company, type: text, required: true, default: 'My Company (San Francisco)' }
      - { field: lot_name, label: Lot/Serial Number, type: text }
      - { field: should_replenish, label: Replenish Quantities, type: boolean }
      - { field: note, label: Notes, type: textarea }
  - id: delete_mrp_production_scrap
    type: server
    permission: manufacturing.write
    action: manufacturing.scraps.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}', production_id: '{state.id}', expected_row_version: '{row.row_version}' }
    refresh: [mrp_production_scraps, mrp_production_detail]
    mutation:
      operation: delete
      table: stock_scraps
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM stock_scraps WHERE id = :id AND production_id = :production_id", status: 404, code: MRP_PRODUCTION_SCRAP_NOT_FOUND, message: Manufacturing Order scrap not found. }
        - { query: "SELECT id FROM stock_scraps WHERE id = :id AND production_id = :production_id AND state = 'Draft'", status: 409, code: STOCK_SCRAP_DONE_DELETE, message: A Done Scrap Order cannot be deleted. }
