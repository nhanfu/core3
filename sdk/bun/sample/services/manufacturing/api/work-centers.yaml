page: { id: manufacturing-work-centers }
datasources:
  - id: mrp_workcenters
    permission: manufacturing.manage
    error_states: { transport_error: { status: 503, code: MRP_WORKCENTERS_UNAVAILABLE, message: Work center data is temporarily unavailable. } }
    query: "SELECT id, row_version, name, COALESCE(code, '') AS code, active, time_efficiency, oee_target, working_state, company_name, planned_workorders, ready_workorders, progress_workorders, blocked_workorders, color FROM mrp_workcenters WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND ((:active IS NULL AND active = TRUE) OR (:active = 'active' AND active = TRUE) OR (:active = 'archived' AND active = FALSE)) AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(code, '') ILIKE '%' || :q || '%') ORDER BY name, id"
actions:
  - id: create_mrp_workcenter
    type: server_form
    permission: manufacturing.manage
    title: New Work Center
    action: manufacturing.workcenters.create
    handler: yaml_mutation
    operation: create
    refresh: [mrp_workcenters]
    mutation:
      operation: insert
      table: mrp_workcenters
      generated: [id]
      fields: [name, code, active, time_efficiency, oee_target, working_state, company_name, color]
      required: [name]
      defaults: { active: true, time_efficiency: 100, oee_target: 90, working_state: normal, company_name: My Company, color: 0 }
      guards:
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM mrp_workcenters WHERE LOWER(name) = LOWER(:name) AND company_name = COALESCE(:company_name, 'My Company'))", status: 409, code: MRP_WORKCENTER_NAME_EXISTS, message: A work center with this name already exists for this company. }
        - { query: "SELECT 1 AS ok WHERE CAST(:time_efficiency AS DECIMAL(8,2)) >= 0 AND CAST(:time_efficiency AS DECIMAL(8,2)) <= 200 AND CAST(:oee_target AS DECIMAL(8,2)) >= 0 AND CAST(:oee_target AS DECIMAL(8,2)) <= 100", status: 422, code: MRP_WORKCENTER_METRICS_INVALID, message: Time efficiency must be between 0 and 200 and OEE target between 0 and 100. }
      result: { query: "SELECT * FROM mrp_workcenters WHERE id = :id" }
    fields: [{ field: name, label: Work Center, type: text, required: true }, { field: code, label: Code, type: text }, { field: company_name, label: Company, type: text }, { field: active, label: Active, type: checkbox, default: true }, { field: time_efficiency, label: Time Efficiency, type: number, default: 100 }, { field: oee_target, label: OEE Target, type: number, default: 90 }, { field: working_state, label: Workcenter Status, type: select, options: [{ value: normal, label: Normal }, { value: blocked, label: Blocked }] }, { field: color, label: Color, type: number, default: 0 }]
  - id: edit_mrp_workcenter
    type: server_form
    permission: manufacturing.manage
    title: Edit Work Center
    action: manufacturing.workcenters.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [mrp_workcenters]
    mutation:
      operation: update
      table: mrp_workcenters
      fields: [name, code, active, time_efficiency, oee_target, working_state, company_name, color]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM mrp_workcenters WHERE LOWER(name) = LOWER(:name) AND company_name = COALESCE(:company_name, 'My Company') AND id <> :id)", status: 409, code: MRP_WORKCENTER_NAME_EXISTS, message: A work center with this name already exists for this company. }
        - { query: "SELECT 1 AS ok WHERE CAST(:time_efficiency AS DECIMAL(8,2)) >= 0 AND CAST(:time_efficiency AS DECIMAL(8,2)) <= 200 AND CAST(:oee_target AS DECIMAL(8,2)) >= 0 AND CAST(:oee_target AS DECIMAL(8,2)) <= 100", status: 422, code: MRP_WORKCENTER_METRICS_INVALID, message: Time efficiency must be between 0 and 200 and OEE target between 0 and 100. }
      result: { query: "SELECT * FROM mrp_workcenters WHERE id = :id" }
    fields: [{ field: name, label: Work Center, type: text, required: true }, { field: code, label: Code, type: text }, { field: company_name, label: Company, type: text }, { field: active, label: Active, type: checkbox }, { field: time_efficiency, label: Time Efficiency, type: number }, { field: oee_target, label: OEE Target, type: number }, { field: working_state, label: Workcenter Status, type: select, options: [{ value: normal, label: Normal }, { value: blocked, label: Blocked }] }, { field: color, label: Color, type: number }]
  - id: archive_mrp_workcenter
    type: server
    permission: manufacturing.manage
    action: manufacturing.workcenters.archive
    handler: yaml_mutation
    operation: update
    refresh: [mrp_workcenters]
    params: { values: { active: false } }
    mutation: { operation: update, table: mrp_workcenters, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM mrp_workcenters WHERE id = :id" } }
  - id: unarchive_mrp_workcenter
    type: server
    permission: manufacturing.manage
    action: manufacturing.workcenters.unarchive
    handler: yaml_mutation
    operation: update
    refresh: [mrp_workcenters]
    params: { values: { active: true } }
    mutation: { operation: update, table: mrp_workcenters, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM mrp_workcenters WHERE id = :id" } }
  - id: delete_mrp_workcenter
    type: server
    permission: manufacturing.manage
    action: manufacturing.workcenters.delete
    handler: yaml_mutation
    operation: delete
    refresh: [mrp_workcenters]
    mutation: { operation: delete, table: mrp_workcenters, concurrency: { required: true } }
