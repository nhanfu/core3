page: { id: manufacturing-picking-dashboard }
datasources:
  - id: mrp_picking_bom_lookup
    single: false
    permission: manufacturing.read
    error_states:
      unauthorized: { status: 401, code: MRP_PICKING_BOM_LOOKUP_UNAUTHORIZED, message: Sign in to load Bills of Materials. }
      forbidden: { status: 403, code: MRP_PICKING_BOM_LOOKUP_FORBIDDEN, message: You do not have permission to load Bills of Materials. }
      transport_error: { status: 503, code: MRP_PICKING_BOM_LOOKUP_UNAVAILABLE, message: Bills of Materials are temporarily unavailable. }
    query: "SELECT id AS value, name || ' - ' || product_name AS label FROM mrp_boms WHERE active = TRUE ORDER BY product_name, name"
  - id: mrp_picking_manufacturings
    single: false
    permission: manufacturing.read
    workflow: mrp_productions
    meta:
      source_action:
        addon: mrp
        external_id: mrp_production_action_picking_deshboard
        model: mrp.production
        view_modes: [list, kanban, form]
        domain: "[('picking_type_id', '=', active_id)]"
        context: { default_picking_type_id: active_id }
        source_menu: Inventory / Operations / Transfers / Manufacturings
    error_states:
      unauthorized: { status: 401, code: MRP_PICKING_MANUFACTURINGS_UNAUTHORIZED, message: Sign in to view Manufacturings. }
      forbidden: { status: 403, code: MRP_PICKING_MANUFACTURINGS_FORBIDDEN, message: You do not have permission to view Manufacturings. }
      transport_error: { status: 503, code: MRP_PICKING_MANUFACTURINGS_UNAVAILABLE, message: Manufacturings are temporarily unavailable. }
    query: |
      SELECT p.id, p.row_version, p.name, p.product_id, p.product_name, b.name AS bom_name,
        p.quantity, p.qty_produced, p.state, CAST(p.planned_date AS VARCHAR) AS planned_date,
        p.reference, p.priority, p.company_name, p.warehouse_name, p.availability,
        p.picking_type_id, p.picking_type_name, COUNT(w.id) AS workorder_count
      FROM mrp_productions p
      LEFT JOIN mrp_boms b ON b.id = p.bom_id
      LEFT JOIN mrp_workorders w ON w.production_id = p.id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
        AND p.picking_type_id = :picking_type_id
        AND (COALESCE(:company_name, '') = '' OR p.company_name = :company_name)
        AND (:q IS NULL OR p.name ILIKE '%' || :q || '%' OR p.product_name ILIKE '%' || :q || '%' OR COALESCE(p.reference, '') ILIKE '%' || :q || '%')
        AND (:state IS NULL OR (:state = 'todo' AND p.state IN ('Draft', 'Confirmed', 'In Progress', 'To Close')) OR p.state = :state)
        AND (:priority IS NULL OR p.priority = :priority)
      GROUP BY p.id, p.row_version, p.name, p.product_id, p.product_name, b.name, p.quantity,
        p.qty_produced, p.state, p.planned_date, p.reference, p.priority, p.company_name,
        p.warehouse_name, p.availability, p.picking_type_id, p.picking_type_name, p.created_at
      ORDER BY p.planned_date DESC, p.created_at DESC, p.id
actions:
  - id: view_mrp_picking_manufacturing
    type: navigate
    permission: manufacturing.read
    navigate_to: /manufacturing-orders/detail
    params: { id: '{row.id}' }
  - id: create_mrp_picking_manufacturing
    type: server_form
    permission: manufacturing.write
    title: New Manufacturing Order
    action: manufacturing.productions.create_from_picking_type
    handler: yaml_mutation
    operation: create
    refresh: [mrp_picking_manufacturings]
    mutation:
      operation: insert
      table: mrp_productions
      generated: [id]
      fields: [name, product_id, product_name, bom_id, quantity, planned_date, reference, priority, company_name, warehouse_name, origin, availability, locked, picking_type_id, picking_type_name]
      required: [name, product_name, quantity, picking_type_id]
      defaults: { state: Draft, qty_produced: 0, planned_date: '2026-01-15', priority: Normal, company_name: 'My Company (San Francisco)', warehouse_name: WH/Stock, availability: Waiting, locked: false, picking_type_id: operation-type-mrp-001, picking_type_name: Manufacturing }
      guards:
        - { query: "SELECT 1 AS ok WHERE CAST(:quantity AS DECIMAL(18,3)) > 0", status: 422, code: MRP_PICKING_MANUFACTURING_QUANTITY_INVALID, message: Production quantity must be positive. }
        - { query: "SELECT 1 AS ok WHERE (:bom_id IS NULL OR EXISTS (SELECT 1 FROM mrp_boms WHERE id = :bom_id AND active = TRUE))", status: 422, code: MRP_PICKING_MANUFACTURING_BOM_INVALID, message: The selected Bill of Materials must be active. }
      result: { query: "SELECT * FROM mrp_productions WHERE id = :id" }
    fields:
      - { field: name, label: Manufacturing order, type: text, required: true }
      - { field: product_id, label: Product ID, type: text }
      - { field: product_name, label: Product, type: text, required: true }
      - { field: bom_id, label: Bill of Materials, type: select, options_source: mrp_picking_bom_lookup }
      - { field: quantity, label: To produce, type: number, required: true, min: 0.001 }
      - { field: planned_date, label: Planned date, type: text }
      - { field: priority, label: Priority, type: select, options: [Normal, Urgent] }
      - { field: reference, label: Reference, type: text }
      - { field: picking_type_id, label: Operation Type, type: text, required: true }
      - { field: picking_type_name, label: Operation Type Name, type: text }
  - { id: confirm_mrp_picking_manufacturing, type: server, permission: manufacturing.write, action: manufacturing.productions.confirm, handler: order_transition, workflow: mrp_productions, operation: confirm, params: { id: '{row.id}' }, refresh: [mrp_picking_manufacturings] }
  - { id: start_mrp_picking_manufacturing, type: server, permission: manufacturing.write, action: manufacturing.productions.start, handler: order_transition, workflow: mrp_productions, operation: start, params: { id: '{row.id}' }, refresh: [mrp_picking_manufacturings] }
  - { id: produce_mrp_picking_manufacturing, type: server, permission: manufacturing.write, action: manufacturing.productions.produce, handler: order_transition, workflow: mrp_productions, operation: produce, params: { id: '{row.id}' }, refresh: [mrp_picking_manufacturings] }
  - { id: close_mrp_picking_manufacturing, type: server, permission: manufacturing.write, action: manufacturing.productions.close, handler: order_transition, workflow: mrp_productions, operation: close, params: { id: '{row.id}' }, refresh: [mrp_picking_manufacturings] }
  - { id: cancel_mrp_picking_manufacturing, type: server, permission: manufacturing.write, action: manufacturing.productions.cancel, handler: order_transition, workflow: mrp_productions, operation: cancel, params: { id: '{row.id}' }, refresh: [mrp_picking_manufacturings] }
