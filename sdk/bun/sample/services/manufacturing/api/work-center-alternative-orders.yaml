page: { id: manufacturing-work-center-alternative-orders }
datasources:
  - id: mrp_workcenter_alternative_states
    single: false
    permission: manufacturing.read
    query: "SELECT * FROM (VALUES ('Waiting', 'Waiting'), ('Ready', 'Ready'), ('Progress', 'In Progress'), ('Finished', 'Finished'), ('Blocked', 'Blocked'), ('Cancelled', 'Cancelled')) AS states(value, label)"
  - id: mrp_workcenter_alternative_workorders
    single: false
    permission: manufacturing.read
    workflow: mrp_workorders
    error_states:
      unauthorized: { status: 401, code: MRP_WORKCENTER_ALTERNATIVES_UNAUTHORIZED, message: Sign in to view alternative Work Center Orders. }
      forbidden: { status: 403, code: MRP_WORKCENTER_ALTERNATIVES_FORBIDDEN, message: You do not have permission to view alternative Work Center Orders. }
      missing_record: { status: 404, code: MRP_WORKCENTER_ALTERNATIVES_WORKCENTER_NOT_FOUND, message: The selected Work Center was not found. }
      transport_error: { status: 503, code: MRP_WORKCENTER_ALTERNATIVES_UNAVAILABLE, message: Alternative Work Center Orders are temporarily unavailable. }
    meta:
      source_action: { external_id: mrp_workorder_todo, model: mrp.workorder, view_modes: [list, kanban, form, calendar, pivot, graph], domain: "['|', ('workcenter_id', 'in', alternative_workcenter_ids), ('workcenter_id.alternative_workcenter_ids', '=', active_id)]" }
      scope: alternative_workcenters
    query: |
      SELECT w.id, w.row_version, w.operation_name, w.name, w.workcenter,
        p.name AS production_name, p.product_name, p.state AS production_state,
        w.expected_duration, w.actual_duration, w.state, w.paused, w.planned, w.late,
        w.blocked_reason, CAST(w.planned_date AS VARCHAR) AS planned_date,
        CAST(w.date_start AS VARCHAR) AS date_start, CAST(w.date_finished AS VARCHAR) AS date_finished
      FROM mrp_workorders w
      JOIN mrp_productions p ON p.id = w.production_id
      JOIN mrp_workcenters candidate ON candidate.name = w.workcenter
      JOIN mrp_workcenters selected ON selected.id = :workcenter_id
        AND selected.company_name = candidate.company_name
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END
        AND (
          EXISTS (SELECT 1 FROM mrp_workcenter_alternatives a
            WHERE a.workcenter_id = selected.id AND a.alternative_workcenter_id = candidate.id
              AND a.company_name = selected.company_name)
          OR EXISTS (SELECT 1 FROM mrp_workcenter_alternatives a
            WHERE a.workcenter_id = candidate.id AND a.alternative_workcenter_id = selected.id
              AND a.company_name = selected.company_name)
        )
        AND (:q IS NULL OR w.operation_name ILIKE '%' || :q || '%' OR w.name ILIKE '%' || :q || '%'
          OR p.name ILIKE '%' || :q || '%' OR p.product_name ILIKE '%' || :q || '%')
        AND (:state IS NULL OR w.state = :state)
        AND (:late IS NULL OR w.late = CAST(:late AS BOOLEAN))
      ORDER BY w.planned_date, w.sequence, w.id
actions:
  - id: view_mrp_alternative_workorder
    type: navigate
    permission: manufacturing.read
    navigate_to: /workorders/detail
    params: { id: '{row.id}' }
  - { id: plan_mrp_alternative_workorder, type: server, permission: manufacturing.write, action: manufacturing.workorders.plan, handler: order_transition, workflow: mrp_workorders, operation: plan, params: { id: '{row.id}' }, refresh: [mrp_workcenter_alternative_workorders] }
  - { id: start_mrp_alternative_workorder, type: server, permission: manufacturing.write, action: manufacturing.workorders.start, handler: order_transition, workflow: mrp_workorders, operation: start, params: { id: '{row.id}' }, refresh: [mrp_workcenter_alternative_workorders] }
  - { id: pause_mrp_alternative_workorder, type: server, permission: manufacturing.write, action: manufacturing.workorders.pause, handler: order_transition, workflow: mrp_workorders, operation: pause, params: { id: '{row.id}' }, refresh: [mrp_workcenter_alternative_workorders] }
  - { id: continue_mrp_alternative_workorder, type: server, permission: manufacturing.write, action: manufacturing.workorders.continue, handler: order_transition, workflow: mrp_workorders, operation: continue, params: { id: '{row.id}' }, refresh: [mrp_workcenter_alternative_workorders] }
  - { id: block_mrp_alternative_workorder, type: server, permission: manufacturing.write, action: manufacturing.workorders.block, handler: order_transition, workflow: mrp_workorders, operation: block, params: { id: '{row.id}' }, refresh: [mrp_workcenter_alternative_workorders] }
  - { id: cancel_mrp_alternative_workorder, type: server, permission: manufacturing.write, action: manufacturing.workorders.cancel, handler: order_transition, workflow: mrp_workorders, operation: cancel, params: { id: '{row.id}' }, refresh: [mrp_workcenter_alternative_workorders] }
