page: { id: manufacturing-operation-detail }
datasources:
  - id: mrp_operation_detail
    single: true
    permission: manufacturing.read
    error_states: { transport_error: { status: 503, code: MRP_OPERATION_DETAIL_UNAVAILABLE, message: This operation is temporarily unavailable. } }
    query: "SELECT id, row_version, name, active, sequence, bom_id, bom_name, workcenter_id, workcenter_name, time_mode, time_mode_batch, time_cycle_manual, time_cycle, time_total, cost_mode, cost, apply_on_variants, blocked_by_operations, company_name, workorder_count FROM mrp_routing_workcenters WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
actions:
  - id: back_to_mrp_operations
    type: navigate
    permission: manufacturing.read
    navigate_to: /operations
  - id: edit_mrp_operation
    type: server_form
    permission: manufacturing.write
    title: Edit Operation
    action: manufacturing.operations.update
    handler: yaml_mutation
    operation: update
    prefill: state.mrp_operation_detail
    refresh: [mrp_operation_detail, mrp_operations]
    mutation:
      operation: update
      table: mrp_routing_workcenters
      fields: [name, active, sequence, bom_id, bom_name, workcenter_id, workcenter_name, time_mode, time_mode_batch, time_cycle_manual, time_cycle, time_total, cost_mode, cost, apply_on_variants, blocked_by_operations, company_name, workorder_count]
      required: [name, bom_name, workcenter_name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM mrp_routing_workcenters WHERE id = :id", status: 404, code: MRP_OPERATION_NOT_FOUND, message: Operation not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM mrp_routing_workcenters WHERE LOWER(name) = LOWER(:name) AND bom_id = COALESCE(:bom_id, '') AND id <> :id)", status: 409, code: MRP_OPERATION_NAME_EXISTS, message: An operation with this name already exists for this bill of material. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:time_cycle_manual, 0) AS DECIMAL(18,2)) >= 0 AND CAST(COALESCE(:time_mode_batch, 10) AS INTEGER) >= 1", status: 422, code: MRP_OPERATION_DURATION_INVALID, message: Duration must be zero or greater and the computed sample must be at least one work order. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:time_mode, 'manual') IN ('manual', 'auto') AND COALESCE(:cost_mode, 'actual') IN ('actual', 'estimated')", status: 422, code: MRP_OPERATION_MODE_INVALID, message: Select valid duration and cost modes. }
      result: { query: "SELECT * FROM mrp_routing_workcenters WHERE id = :id" }
    fields:
      - { field: name, label: Operation, type: text, required: true }
      - { field: bom_name, label: Bill of Material, type: text, required: true }
      - { field: bom_id, label: Bill of Material ID, type: text }
      - { field: workcenter_name, label: Work Center, type: text, required: true }
      - { field: workcenter_id, label: Work Center ID, type: text }
      - { field: sequence, label: Sequence, type: number }
      - { field: time_mode, label: Duration Computation, type: select, options: [{ value: manual, label: Fixed }, { value: auto, label: Computed }] }
      - { field: time_cycle_manual, label: Default Duration, type: number, required: true, min: 0 }
      - { field: time_mode_batch, label: Based on, type: number, min: 1 }
      - { field: cost_mode, label: Cost based on, type: select, options: [{ value: actual, label: Actual time }, { value: estimated, label: Theorical time }] }
      - { field: apply_on_variants, label: Apply on Variants?, type: text }
      - { field: blocked_by_operations, label: Blocked By, type: text }
      - { field: company_name, label: Company, type: text }
      - { field: active, label: Active, type: checkbox }
  - id: archive_mrp_operation
    type: server
    permission: manufacturing.manage
    action: manufacturing.operations.archive
    handler: yaml_mutation
    operation: update
    params: { values: { active: false } }
    refresh: [mrp_operation_detail, mrp_operations]
    mutation: { operation: update, table: mrp_routing_workcenters, fields: [active], concurrency: { required: true }, guards: [{ query: "SELECT id FROM mrp_routing_workcenters WHERE id = :id AND active = TRUE", status: 409, code: MRP_OPERATION_ALREADY_ARCHIVED, message: Operation is already archived. }], result: { query: "SELECT * FROM mrp_routing_workcenters WHERE id = :id" } }
  - id: unarchive_mrp_operation
    type: server
    permission: manufacturing.manage
    action: manufacturing.operations.unarchive
    handler: yaml_mutation
    operation: update
    params: { values: { active: true } }
    refresh: [mrp_operation_detail, mrp_operations]
    mutation: { operation: update, table: mrp_routing_workcenters, fields: [active], concurrency: { required: true }, guards: [{ query: "SELECT id FROM mrp_routing_workcenters WHERE id = :id AND active = FALSE", status: 409, code: MRP_OPERATION_ALREADY_ACTIVE, message: Operation is already active. }], result: { query: "SELECT * FROM mrp_routing_workcenters WHERE id = :id" } }
  - id: delete_mrp_operation
    type: server
    permission: manufacturing.manage
    action: manufacturing.operations.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{state.id}' }
    refresh: [mrp_operations]
    mutation:
      operation: delete
      table: mrp_routing_workcenters
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM mrp_routing_workcenters WHERE id = :id", status: 404, code: MRP_OPERATION_NOT_FOUND, message: Operation not found. }
        - { query: "SELECT 1 AS ok FROM mrp_routing_workcenters WHERE id = :id AND workorder_count = 0", status: 409, code: MRP_OPERATION_IN_USE, message: An operation with completed work orders cannot be deleted. Archive it instead. }
