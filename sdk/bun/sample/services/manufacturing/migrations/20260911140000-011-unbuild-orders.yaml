      CREATE TABLE IF NOT EXISTS mrp_unbuild_orders (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL,
        product_id VARCHAR NOT NULL,
        product_name VARCHAR NOT NULL,
        bom_id VARCHAR,
        bom_name VARCHAR,
        mo_id VARCHAR,
        mo_name VARCHAR,
        lot_id VARCHAR,
        lot_name VARCHAR,
        product_qty DECIMAL(18,3) NOT NULL DEFAULT 1,
        product_uom VARCHAR NOT NULL DEFAULT 'Units',
        source_location VARCHAR NOT NULL DEFAULT 'WH/Stock',
        destination_location VARCHAR NOT NULL DEFAULT 'WH/Stock',
        company_name VARCHAR NOT NULL DEFAULT 'My Company (San Francisco)',
        state VARCHAR NOT NULL DEFAULT 'Draft',
        activity_state VARCHAR NOT NULL DEFAULT 'planned',
        activity_date DATE,
        activity_user VARCHAR,
        move_count INTEGER NOT NULL DEFAULT 0,
        note VARCHAR,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
      CREATE INDEX IF NOT EXISTS idx_mrp_unbuild_orders_state ON mrp_unbuild_orders(state);
      CREATE INDEX IF NOT EXISTS idx_mrp_unbuild_orders_product ON mrp_unbuild_orders(product_name);
