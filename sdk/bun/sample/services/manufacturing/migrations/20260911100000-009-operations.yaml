version: 0.0.9
description: Deterministic Operations action fixtures aligned with Odoo mrp.routing.workcenter
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS mrp_routing_workcenters (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL,
        active BOOLEAN NOT NULL DEFAULT TRUE,
        sequence INTEGER NOT NULL DEFAULT 100,
        bom_id VARCHAR NOT NULL,
        bom_name VARCHAR NOT NULL,
        workcenter_id VARCHAR NOT NULL,
        workcenter_name VARCHAR NOT NULL,
        time_mode VARCHAR NOT NULL DEFAULT 'manual',
        time_mode_batch INTEGER NOT NULL DEFAULT 10,
        time_cycle_manual DECIMAL(18,2) NOT NULL DEFAULT 60,
        time_cycle DECIMAL(18,2) NOT NULL DEFAULT 60,
        time_total DECIMAL(18,2) NOT NULL DEFAULT 60,
        cost_mode VARCHAR NOT NULL DEFAULT 'actual',
        cost DECIMAL(18,2) NOT NULL DEFAULT 0,
        apply_on_variants VARCHAR NOT NULL DEFAULT '',
        blocked_by_operations VARCHAR NOT NULL DEFAULT '',
        company_name VARCHAR NOT NULL DEFAULT 'My Company (San Francisco)',
        workorder_count INTEGER NOT NULL DEFAULT 0,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        UNIQUE(name, bom_id)
      );
      INSERT INTO mrp_routing_workcenters (
        id, row_version, name, active, sequence, bom_id, bom_name, workcenter_id,
        workcenter_name, time_mode, time_mode_batch, time_cycle_manual, time_cycle,
