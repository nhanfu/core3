        ('operation-packing', 1, 'Packing', TRUE, 5, 'bom-drawer-secondary', 'SEC-ASSEM: [FURN_8855] Drawer', 'workcenter-drill-1', 'Drill 1', 'manual', 10, 30, 30, 30, 'actual', 0, '', '', 'My Company (San Francisco)', 0, TIMESTAMP '2026-01-15 08:01:00'),
        ('operation-testing', 1, 'Testing', TRUE, 10, 'bom-drawer-secondary', 'SEC-ASSEM: [FURN_8855] Drawer', 'workcenter-assembly-1', 'Assembly 1', 'manual', 10, 60, 60, 60, 'actual', 0, '', '', 'My Company (San Francisco)', 0, TIMESTAMP '2026-01-15 08:02:00'),
        ('operation-long-time-assembly', 1, 'Long time assembly', TRUE, 15, 'bom-drawer-secondary', 'SEC-ASSEM: [FURN_8855] Drawer', 'workcenter-assembly-1', 'Assembly 1', 'manual', 10, 180, 180, 180, 'actual', 0, '', '', 'My Company (San Francisco)', 0, TIMESTAMP '2026-01-15 08:03:00'),
