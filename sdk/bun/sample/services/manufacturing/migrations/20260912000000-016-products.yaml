version: 0.0.16
description: Deterministic Manufacturing Products action fixtures
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS mrp_products (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL, default_code VARCHAR, barcode VARCHAR, category VARCHAR,
        product_type VARCHAR NOT NULL DEFAULT 'Goods', uom VARCHAR NOT NULL DEFAULT 'Units',
        company_name VARCHAR NOT NULL DEFAULT 'My Company (San Francisco)',
        list_price DECIMAL(18,2) NOT NULL DEFAULT 0, cost_price DECIMAL(18,2) NOT NULL DEFAULT 0,
        on_hand DECIMAL(18,3) NOT NULL DEFAULT 0, forecasted_qty DECIMAL(18,3) NOT NULL DEFAULT 0,
        variant_count INTEGER NOT NULL DEFAULT 1, variant_values VARCHAR, bom_count INTEGER NOT NULL DEFAULT 0,
        document_count INTEGER NOT NULL DEFAULT 0, sold_qty DECIMAL(18,3) NOT NULL DEFAULT 0,
        purchased_qty DECIMAL(18,3) NOT NULL DEFAULT 0, reordering_rule_count INTEGER NOT NULL DEFAULT 0,
        manufactured BOOLEAN NOT NULL DEFAULT FALSE, bom_component BOOLEAN NOT NULL DEFAULT FALSE,
        active BOOLEAN NOT NULL DEFAULT TRUE, tracking VARCHAR NOT NULL DEFAULT 'No Tracking',
        invoicing_policy VARCHAR NOT NULL DEFAULT 'Ordered quantities', product_tags VARCHAR, note VARCHAR,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
      CREATE TABLE IF NOT EXISTS mrp_product_messages (
        id VARCHAR PRIMARY KEY, product_id VARCHAR NOT NULL, actor_name VARCHAR NOT NULL,
        action VARCHAR NOT NULL, action_label VARCHAR NOT NULL, detail VARCHAR NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
