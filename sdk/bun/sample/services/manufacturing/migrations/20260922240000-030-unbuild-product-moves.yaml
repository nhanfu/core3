version: 0.0.30
description: Durable product moves for the Odoo Unbuild Order stat action
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS mrp_unbuild_moves (
        id VARCHAR PRIMARY KEY,
        unbuild_id VARCHAR NOT NULL,
        sequence INTEGER NOT NULL DEFAULT 10,
        move_date DATE NOT NULL DEFAULT DATE '2026-01-15',
        reference VARCHAR NOT NULL,
        move_type VARCHAR NOT NULL,
        product_name VARCHAR NOT NULL,
        quantity DECIMAL(18,3) NOT NULL DEFAULT 0,
        uom VARCHAR NOT NULL DEFAULT 'Units',
        lot_name VARCHAR,
        location VARCHAR NOT NULL,
        location_dest VARCHAR NOT NULL,
        state VARCHAR NOT NULL DEFAULT 'Done',
        company_name VARCHAR NOT NULL DEFAULT 'My Company (San Francisco)',
        row_version BIGINT NOT NULL DEFAULT 1
      );
      CREATE INDEX IF NOT EXISTS idx_mrp_unbuild_moves_scope
        ON mrp_unbuild_moves(unbuild_id, company_name, sequence, id);
