version: 0.0.13
description: Deterministic Manufacturing settings action fixtures
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS mrp_settings (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        company_name VARCHAR NOT NULL DEFAULT 'My Company (San Francisco)',
        group_mrp_routings BOOLEAN NOT NULL DEFAULT TRUE,
        group_mrp_workorder_dependencies BOOLEAN NOT NULL DEFAULT FALSE,
        module_mrp_subcontracting BOOLEAN NOT NULL DEFAULT FALSE,
        module_stock_barcode BOOLEAN NOT NULL DEFAULT FALSE,
        module_quality_control BOOLEAN NOT NULL DEFAULT FALSE,
        group_unlocked_by_default BOOLEAN NOT NULL DEFAULT FALSE,
        group_mrp_byproducts BOOLEAN NOT NULL DEFAULT FALSE,
        group_mrp_reception_report BOOLEAN NOT NULL DEFAULT FALSE,
        module_mrp_mps BOOLEAN NOT NULL DEFAULT FALSE,
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
      INSERT INTO mrp_settings (
        id, row_version, company_name, group_mrp_routings, group_mrp_workorder_dependencies,
        module_mrp_subcontracting, module_stock_barcode, module_quality_control,
        group_unlocked_by_default, group_mrp_byproducts,
        group_mrp_reception_report, module_mrp_mps, updated_at
      ) VALUES (
        'manufacturing-settings-demo', 1, 'My Company (San Francisco)', TRUE, FALSE,
        FALSE, FALSE, FALSE, FALSE, FALSE, FALSE, FALSE,
        TIMESTAMP '2026-01-15 00:00:00'
      ) ON CONFLICT(id) DO NOTHING;
    down: |
      DELETE FROM mrp_settings WHERE id = 'manufacturing-settings-demo';
      DROP TABLE IF EXISTS mrp_settings;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
