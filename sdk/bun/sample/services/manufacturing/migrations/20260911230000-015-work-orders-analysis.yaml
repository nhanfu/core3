      CREATE TABLE IF NOT EXISTS mrp_workorder_analysis (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        operation_name VARCHAR NOT NULL,
        workcenter VARCHAR NOT NULL,
        production_name VARCHAR NOT NULL,
        product_name VARCHAR NOT NULL,
        quantity DECIMAL(18,2) NOT NULL DEFAULT 0,
        expected_duration DECIMAL(18,2) NOT NULL DEFAULT 0,
        duration DECIMAL(18,2) NOT NULL DEFAULT 0,
        duration_per_unit DECIMAL(18,2) NOT NULL DEFAULT 0,
        state VARCHAR NOT NULL,
        planned_date DATE NOT NULL,
        date_start TIMESTAMP,
        date_finished TIMESTAMP,
        production_state VARCHAR NOT NULL,
        company_name VARCHAR NOT NULL DEFAULT 'My Company (San Francisco)',
        blocked_reason VARCHAR,
        sequence INTEGER NOT NULL DEFAULT 10,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 08:00:00'
      );
