version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS plm_revisions (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        product_name VARCHAR NOT NULL, version VARCHAR NOT NULL, change_reason VARCHAR NOT NULL,
        source_type VARCHAR, source_id VARCHAR, owner VARCHAR, approver VARCHAR,
        effective_date DATE, state VARCHAR NOT NULL DEFAULT 'Draft', notes VARCHAR,
        row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS plm_revisions_state_idx ON plm_revisions(state);
      CREATE INDEX IF NOT EXISTS plm_revisions_product_idx ON plm_revisions(product_name);
    down: |
      DROP TABLE IF EXISTS plm_revisions;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
