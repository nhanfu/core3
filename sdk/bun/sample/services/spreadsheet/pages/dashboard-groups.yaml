title: Dashboards
page: { id: spreadsheet-dashboard-groups, route: /spreadsheet/dashboard-groups, breadcrumb: [Dashboards], auth: { require: [spreadsheet.manage] } }
components:
  - type: ListView
    variant: odoo
    source: spreadsheet_dashboard_groups_configuration
    reorder_action: reorder_dashboard_groups
    create_action: create_dashboard_group
    create_label: New
    selectable: true
    column_chooser: true
    columns:
      - { field: sequence, label: '', type: HandleCell, sortable: false }
      - { field: name, label: Name, type: PrimaryEntityCell }
    page_size: 50
    scroll: body
    row_key: id
    row_open_action: view_dashboard_group
    row_double_click_action: view_dashboard_group
    empty_state: { title: No dashboard groups, description: Create a dashboard group to organize dashboards. }
actions:
  - id: view_dashboard_group
    type: navigate
    permission: spreadsheet.manage
    navigate_to: /spreadsheet/dashboard-group
    params: { id: '{row.id}' }
