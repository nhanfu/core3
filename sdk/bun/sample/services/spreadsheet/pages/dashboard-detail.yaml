title: Dashboard
page: { id: dashboard-detail, route: /dashboard-detail, breadcrumb: [Dashboards, Dashboard], auth: { require: [spreadsheet.read] } }
components:
  - type: PageIntro
    title: Dashboard
    description: Read-only spreadsheet dashboard canvas.
  - type: StatRow
    source: spreadsheet_dashboard_summary
    title: Overview
    stats:
      - { label: Revenue, field: revenue }
      - { label: Orders, field: orders }
      - { label: Customers, field: customers }
  - type: TabGroup
    tabs:
      - { id: days, label: Days }
      - { id: weeks, label: Weeks }
      - { id: months, label: Months }
      - { id: quarters, label: Quarters }
  - type: Chart
    source: spreadsheet_dashboard_chart
    title: Revenue over time
    label_field: period
    value_field: revenue
    variant: line
    height: 280
  - type: ListView
    variant: odoo
    source: spreadsheet_dashboard_table
    date_range: { label: Date range, presets: [month, quarter, year] }
    actions:
      - { id: share_dashboard, label: Share, permission: spreadsheet.read, variant: ghost }
      - { id: download_dashboard, label: Download, permission: spreadsheet.read, variant: ghost }
    views:
      - { id: list, label: Table, icon: table }
      - id: pivot
        label: Pivot
        icon: pivot
        row_fields: [country]
        measures: [{ field: revenue, aggregate: sum, label: Revenue }]
    columns:
      - { field: country, label: Country, type: PrimaryEntityCell }
      - { field: category, label: Category }
      - { field: revenue, label: Revenue, type: Money }
      - { field: orders, label: Orders, align: right }
    page_size: 10
    row_key: id
    empty_state: { title: Empty workbook, description: This dashboard has no readable spreadsheet data. }
