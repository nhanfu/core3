workflow:
  id: spreadsheet_dashboards
  entity: spreadsheet_dashboards
  handler: yaml_mutation
  initial: Draft
  permission: spreadsheet.dashboard.write
  mutable: true
  states:
    - { id: Draft, label: Draft, color: neutral }
    - { id: Published, label: Published, color: green }
    - { id: Archived, label: Archived, color: blue, terminal: true }
  transitions:
    - { id: publish, from: [Draft], to: Published, permission: spreadsheet.dashboard.manage }
    - { id: archive, from: [Draft, Published], to: Archived, permission: spreadsheet.dashboard.manage }
