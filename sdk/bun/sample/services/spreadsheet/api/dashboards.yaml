page: { id: dashboards }
datasources:
  - id: spreadsheet_dashboard_groups_landing
    single: false
    permission: spreadsheet.read
    query: "SELECT id, row_version, name, company_name, official, dashboard_count FROM spreadsheet_dashboard_groups WHERE (company_name = 'Global' OR company_name = COALESCE(:company_name, '')) AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY sequence, name"
  - id: spreadsheet_dashboards_landing
    single: false
    permission: spreadsheet.read
    workflow: spreadsheet_dashboards
    query: "SELECT d.id, d.row_version, d.group_id, d.name, g.name AS group_name, d.state, d.favorite, d.company_name, d.published, d.snapshot_status FROM spreadsheet_dashboards d JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE (d.company_name = 'Global' OR d.company_name = COALESCE(:company_name, '')) AND (g.company_name = 'Global' OR g.company_name = COALESCE(:company_name, '')) AND d.state <> 'Archived' AND d.published = TRUE AND (:q IS NULL OR d.name ILIKE '%' || :q || '%' OR g.name ILIKE '%' || :q || '%') AND (:state IS NULL OR d.state = :state) AND (:favorite IS NULL OR d.favorite = CAST(:favorite AS BOOLEAN)) ORDER BY d.sequence, d.name"
    error_states:
      transport_error: { status: 503, code: SPREADSHEET_DASHBOARDS_UNAVAILABLE, message: Published dashboards are temporarily unavailable. }
  - id: spreadsheet_dashboard_workbooks
    single: false
    permission: spreadsheet.read
    query: "SELECT d.id, d.name, CASE WHEN d.workbook_id IS NOT NULL THEN 'ready' ELSE d.snapshot_status END AS snapshot_status, d.workbook_id, CASE WHEN d.workbook_id IS NULL THEN d.workbook_snapshot ELSE NULL END AS workbook_snapshot FROM spreadsheet_dashboards d JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE (d.company_name = 'Global' OR d.company_name = COALESCE(:company_name, '')) AND (g.company_name = 'Global' OR g.company_name = COALESCE(:company_name, '')) AND d.state <> 'Archived' AND d.published = TRUE ORDER BY d.sequence, d.name"
    error_states:
      transport_error: { status: 503, code: SPREADSHEET_DASHBOARD_WORKBOOKS_UNAVAILABLE, message: Dashboard workbooks are temporarily unavailable. }
  - id: spreadsheet_dashboard_summaries_landing
    single: false
    permission: spreadsheet.read
    query: "SELECT s.dashboard_id, s.revenue, s.orders, s.customers FROM spreadsheet_dashboard_summaries s JOIN spreadsheet_dashboards d ON d.id = s.dashboard_id JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE (d.company_name = 'Global' OR d.company_name = COALESCE(:company_name, '')) AND (g.company_name = 'Global' OR g.company_name = COALESCE(:company_name, '')) ORDER BY s.dashboard_id"
  - id: spreadsheet_dashboard_chart_landing
    single: false
    permission: spreadsheet.read
    query: "SELECT p.dashboard_id, p.sequence, p.period, p.revenue FROM spreadsheet_dashboard_chart_points p JOIN spreadsheet_dashboards d ON d.id = p.dashboard_id JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE (d.company_name = 'Global' OR d.company_name = COALESCE(:company_name, '')) AND (g.company_name = 'Global' OR g.company_name = COALESCE(:company_name, '')) ORDER BY p.dashboard_id, p.sequence"
  - id: spreadsheet_dashboard_rows_landing
    single: false
    permission: spreadsheet.read
    query: "SELECT r.dashboard_id, r.sequence, r.country, r.category, r.revenue, r.orders FROM spreadsheet_dashboard_rows r JOIN spreadsheet_dashboards d ON d.id = r.dashboard_id JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE (d.company_name = 'Global' OR d.company_name = COALESCE(:company_name, '')) AND (g.company_name = 'Global' OR g.company_name = COALESCE(:company_name, '')) ORDER BY r.dashboard_id, r.sequence"
  - id: spreadsheet_dashboard_filter_state
    single: true
    permission: spreadsheet.read
    query: "SELECT f.id, f.row_version, f.dashboard_id, f.user_id, f.date_range FROM spreadsheet_dashboard_filter_states f JOIN spreadsheet_dashboards d ON d.id = f.dashboard_id JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE (d.company_name = 'Global' OR d.company_name = COALESCE(:company_name, '')) AND (g.company_name = 'Global' OR g.company_name = COALESCE(:company_name, '')) AND f.dashboard_id = COALESCE(:dashboard_id, 'sdb-sales') AND f.user_id = :current_user_id"
    error_states:
      transport_error: { status: 503, code: SPREADSHEET_DASHBOARD_FILTER_UNAVAILABLE, message: Dashboard filters are temporarily unavailable. }
actions:
  - id: toggle_dashboard_favorite
    type: server
    permission: spreadsheet.read
    action: spreadsheet.dashboard.toggle_favorite
    handler: yaml_mutation
    operation: toggle_favorite
    params: { id: '{row.id}' }
    refresh: [spreadsheet_dashboards_landing]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM spreadsheet_dashboards WHERE id = :id AND state <> 'Archived' AND published = TRUE", status: 404, code: SPREADSHEET_DASHBOARD_NOT_FOUND, message: This dashboard is unavailable or has been unpublished. }
        - { query: "SELECT id FROM spreadsheet_dashboards WHERE id = :id AND snapshot_status <> 'error'", status: 503, code: SPREADSHEET_DASHBOARD_FAVORITE_UNAVAILABLE, message: Dashboard favorites are temporarily unavailable. }
        - { query: "SELECT id FROM spreadsheet_dashboards WHERE id = :id AND row_version = :expected_row_version", status: 409, code: SPREADSHEET_DASHBOARD_FAVORITE_STALE, message: This dashboard changed before its favorite state was updated. Reload before trying again. }
      steps:
        - { query: "UPDATE spreadsheet_dashboards SET favorite = NOT favorite, row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: SPREADSHEET_DASHBOARD_FAVORITE_STALE, message: This dashboard changed before its favorite state was updated. Reload before trying again. }
      result: { query: "SELECT id, favorite, row_version FROM spreadsheet_dashboards WHERE id = :id" }
  - id: save_dashboard_filter
    type: server_form
    permission: spreadsheet.read
    title: Dashboard filter
    action: spreadsheet.dashboard.filter.save
    handler: yaml_mutation
    operation: update
    params: { id: '{state.filter_state_id}', dashboard_id: '{state.dashboard_id}', expected_row_version: '{state.filter_row_version}', current_user_id: '{current_user_id}' }
    refresh: [spreadsheet_dashboard_filter_state]
    mutation:
      operation: update
      table: spreadsheet_dashboard_filter_states
      fields: [date_range]
      required: [date_range]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM spreadsheet_dashboard_filter_states WHERE id = :id AND dashboard_id = :dashboard_id AND user_id = :current_user_id", status: 403, code: SPREADSHEET_DASHBOARD_FILTER_FORBIDDEN, message: This dashboard filter belongs to another user. }
        - { query: "SELECT id FROM spreadsheet_dashboard_filter_states WHERE id = :id AND :date_range IN ('Today', 'This week', 'This month', 'This year')", status: 422, code: SPREADSHEET_DASHBOARD_FILTER_INVALID, message: Choose a supported dashboard date range. }
      result: { query: "SELECT id, row_version, dashboard_id, user_id, date_range FROM spreadsheet_dashboard_filter_states WHERE id = :id" }
    fields:
      - { field: date_range, label: Date range, type: select, options: [{ value: Today, label: Today }, { value: This week, label: This week }, { value: This month, label: This month }, { value: This year, label: This year }] }
