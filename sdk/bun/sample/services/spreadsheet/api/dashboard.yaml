page: { id: spreadsheet-dashboard }
datasources:
  - id: spreadsheet_linkable_workbooks
    single: false
    permission: spreadsheet.manage
    query: "SELECT id AS value, name AS label FROM spreadsheet_workbooks WHERE owner_id = :current_user_id AND company_name = :company_name AND archived = FALSE ORDER BY name, id"
  - id: spreadsheet_dashboard
    single: true
    permission: spreadsheet.manage
    query: "SELECT d.id, d.row_version, d.name, d.workbook_id, d.group_id, g.name AS dashboard_group_name, d.company_name, 'Internal Users' AS group_names, CASE d.snapshot_status WHEN 'ready' THEN 'Data available' WHEN 'empty' THEN 'No data' ELSE 'Data unavailable' END AS workbook_status FROM spreadsheet_dashboards d JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE d.id = :id AND (d.company_name = 'Global' OR d.company_name = :company_name) AND (g.company_name = 'Global' OR g.company_name = :company_name) AND (:fixture_state IS NULL OR :fixture_state NOT IN ('empty', 'not_found'))"
    error_states:
      transport_error: { status: 503, code: SPREADSHEET_DASHBOARD_UNAVAILABLE, message: Dashboard is temporarily unavailable. }
actions:
  - id: link_spreadsheet_dashboard_workbook
    type: server_form
    permission: spreadsheet.manage
    title: Choose dashboard workbook
    action: spreadsheet.dashboard.link-workbook
    handler: yaml_mutation
    operation: update
    refresh: [spreadsheet_dashboard]
    fields:
      - { field: workbook_id, label: Workbook, type: select, options_source: spreadsheet_linkable_workbooks, required: true }
    mutation:
      operation: update
      table: spreadsheet_dashboards
      fields: [workbook_id]
      required: [workbook_id]
      concurrency: { required: true }
      guards:
        - { query: "SELECT d.id FROM spreadsheet_dashboards d JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE d.id = :id AND d.company_name = :company_name AND (g.company_name = 'Global' OR g.company_name = :company_name) AND d.state <> 'Archived'", status: 403, code: SPREADSHEET_DASHBOARD_LINK_FORBIDDEN, message: This dashboard is unavailable in your company. }
        - { query: "SELECT id FROM spreadsheet_workbooks WHERE id = :workbook_id AND owner_id = :current_user_id AND company_name = :company_name AND archived = FALSE", status: 403, code: SPREADSHEET_WORKBOOK_LINK_FORBIDDEN, message: Choose an active workbook you own in this company. }
      result: { query: "SELECT id, row_version, workbook_id FROM spreadsheet_dashboards WHERE id = :id" }
  - id: edit_spreadsheet_dashboard
    type: server_form
    permission: spreadsheet.manage
    title: Edit Dashboard
    action: spreadsheet.dashboard.update
    handler: yaml_mutation
    operation: update
    fields:
      - { field: name, label: Name, type: text, required: true }
    mutation:
      operation: update
      table: spreadsheet_dashboards
      fields: [name]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT d.id FROM spreadsheet_dashboards d JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE d.id = :id AND (d.company_name = 'Global' OR d.company_name = :company_name) AND (g.company_name = 'Global' OR g.company_name = :company_name)", status: 403, code: SPREADSHEET_DASHBOARD_EDIT_FORBIDDEN, message: This dashboard is unavailable in your company. }
        - { query: "SELECT id FROM spreadsheet_dashboards WHERE id = :id AND row_version = :expected_row_version", status: 409, code: SPREADSHEET_DASHBOARD_STALE, message: This dashboard changed elsewhere. Reload before saving. }
        - { query: "SELECT id FROM spreadsheet_dashboards WHERE id = :id AND LENGTH(TRIM(:name)) > 0", status: 422, code: SPREADSHEET_DASHBOARD_NAME_REQUIRED, message: Dashboard name is required. }
      result: { query: "SELECT id, row_version, name FROM spreadsheet_dashboards WHERE id = :id" }
  - id: open_spreadsheet_dashboard
    type: navigate
    permission: spreadsheet.manage
    navigate_to: /dashboards
    params: { dashboard_id: '{state.id}' }
  - id: toggle_spreadsheet_dashboard_publication
    type: server
    permission: spreadsheet.dashboard.manage
    action: spreadsheet.dashboard.toggle-publication
    handler: yaml_mutation
    operation: update
    refresh: [spreadsheet_dashboard, spreadsheet_dashboards_landing, spreadsheet_dashboard_workbooks]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT d.id FROM spreadsheet_dashboards d JOIN spreadsheet_dashboard_groups g ON g.id = d.group_id WHERE d.id = :id AND (d.company_name = 'Global' OR d.company_name = :company_name) AND (g.company_name = 'Global' OR g.company_name = :company_name)", status: 403, code: SPREADSHEET_DASHBOARD_PUBLICATION_FORBIDDEN, message: This dashboard is unavailable in your company. }
        - { query: "SELECT id FROM spreadsheet_dashboards WHERE id = :id AND row_version = :expected_row_version", status: 409, code: SPREADSHEET_DASHBOARD_STALE, message: This dashboard changed elsewhere. Reload before publishing. }
        - { query: "SELECT id FROM spreadsheet_dashboards WHERE id = :id AND state IN ('Draft', 'Published')", status: 409, code: SPREADSHEET_DASHBOARD_PUBLICATION_ARCHIVED, message: Archived dashboards cannot change publication. }
      steps:
        - { query: "UPDATE spreadsheet_dashboards SET published = NOT published, state = CASE WHEN published THEN 'Draft' ELSE 'Published' END, row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version AND state IN ('Draft', 'Published')", expect_changed: true, status: 409, code: SPREADSHEET_DASHBOARD_STALE, message: This dashboard changed elsewhere. Reload before publishing. }
      result: { query: "SELECT id, row_version, published, state FROM spreadsheet_dashboards WHERE id = :id" }
