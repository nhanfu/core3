version: 0.0.2
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS spreadsheet_dashboard_groups (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, name VARCHAR NOT NULL,
        sequence INTEGER NOT NULL DEFAULT 10, company_name VARCHAR NOT NULL DEFAULT 'Global',
        official BOOLEAN NOT NULL DEFAULT false, dashboard_count INTEGER NOT NULL DEFAULT 0
      );
      CREATE UNIQUE INDEX IF NOT EXISTS uq_spreadsheet_dashboard_group_name ON spreadsheet_dashboard_groups(name, company_name);
      CREATE TABLE IF NOT EXISTS spreadsheet_dashboards (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, group_id VARCHAR NOT NULL,
        name VARCHAR NOT NULL, sequence INTEGER NOT NULL DEFAULT 10, state VARCHAR NOT NULL DEFAULT 'Draft',
        published BOOLEAN NOT NULL DEFAULT false, favorite BOOLEAN NOT NULL DEFAULT false,
        company_name VARCHAR NOT NULL DEFAULT 'Global', snapshot_status VARCHAR NOT NULL DEFAULT 'ready',
        workbook_snapshot VARCHAR NOT NULL DEFAULT '{}', created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
      CREATE TABLE IF NOT EXISTS spreadsheet_dashboard_summaries (
        dashboard_id VARCHAR PRIMARY KEY, revenue DECIMAL(18,2) NOT NULL, orders INTEGER NOT NULL, customers INTEGER NOT NULL
      );
      CREATE TABLE IF NOT EXISTS spreadsheet_dashboard_chart_points (
        id VARCHAR PRIMARY KEY, dashboard_id VARCHAR NOT NULL, sequence INTEGER NOT NULL, period VARCHAR NOT NULL, revenue DECIMAL(18,2) NOT NULL
      );
      CREATE TABLE IF NOT EXISTS spreadsheet_dashboard_rows (
        id VARCHAR PRIMARY KEY, dashboard_id VARCHAR NOT NULL, sequence INTEGER NOT NULL, country VARCHAR NOT NULL, category VARCHAR NOT NULL, revenue DECIMAL(18,2) NOT NULL, orders INTEGER NOT NULL
      );
