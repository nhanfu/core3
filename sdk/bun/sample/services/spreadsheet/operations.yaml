operations:
  spreadsheet.public.share:
    result_key: share
    query: "SELECT s.id, s.dashboard_id, s.token, s.revoked, s.dashboard_name, d.published, s.snapshot_status, s.workbook_snapshot FROM spreadsheet_dashboard_shares s JOIN spreadsheet_dashboards d ON d.id = s.dashboard_id WHERE (s.id = :share_id OR s.dashboard_id = :share_id) AND s.token = :token LIMIT 1"
  spreadsheet.public.export:
    result_key: share
    query: "SELECT s.id, s.dashboard_id, s.token, s.revoked, s.dashboard_name, d.published, s.snapshot_status, s.workbook_snapshot FROM spreadsheet_dashboard_shares s JOIN spreadsheet_dashboards d ON d.id = s.dashboard_id WHERE (s.id = :share_id OR s.dashboard_id = :share_id) AND s.token = :token LIMIT 1"
