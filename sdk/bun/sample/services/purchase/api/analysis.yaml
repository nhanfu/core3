page: { id: purchase-analysis }
datasources:
  - id: purchase_analysis
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ANALYSIS_UNAVAILABLE, message: Purchase analysis is temporarily unavailable. } }
    pivot:
      fields: [name, confirmation_date, confirmation_month, vendor_name, vendor_country, buyer_name, product_name, category_name, company_name, state, quantity, qty_received, qty_billed, untaxed_total, total_amount]
    query: "SELECT p.id, p.name, CAST(COALESCE(p.order_date, DATE '2026-01-15') AS VARCHAR) AS confirmation_date, strftime(COALESCE(p.order_date, DATE '2026-01-15'), '%Y-%m') AS confirmation_month, p.vendor_name, '' AS vendor_country, p.buyer_name, p.product_name, CASE WHEN p.product_name LIKE 'Ergonomic office%' THEN 'Furniture / Office' ELSE 'Goods' END AS category_name, 'Main Company (San Francisco)' AS company_name, p.state, CAST(p.quantity AS DOUBLE) AS quantity, CAST(p.qty_received AS DOUBLE) AS qty_received, CAST(0 AS DOUBLE) AS qty_billed, CAST(COALESCE(p.total_amount, p.quantity * p.unit_price) AS DOUBLE) AS untaxed_total, CAST(COALESCE(p.total_amount, p.quantity * p.unit_price) AS DOUBLE) AS total_amount FROM purchase_orders p WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR p.name ILIKE '%' || :q || '%' OR p.vendor_name ILIKE '%' || :q || '%' OR p.product_name ILIKE '%' || :q || '%' OR p.state ILIKE '%' || :q || '%') AND ((COALESCE(:report_scope, 'orders') = 'orders' AND p.state NOT IN ('Draft', 'Sent', 'Cancelled')) OR (:report_scope = 'rfq' AND p.state IN ('Draft', 'Sent'))) ORDER BY p.order_date, p.name"
