page: { id: purchase-product-category-detail }
datasources:
  - id: purchase_product_category_detail
    single: true
    permission: purchase.read
    query: "SELECT id, row_version, name, parent_name, force_removal_strategy, packaging_reserve_method, costing_method, inventory_valuation, product_count FROM purchase_product_categories WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
  - id: purchase_product_category_messages
    permission: purchase.read
    query: "SELECT id, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM purchase_product_category_messages WHERE category_id = :id ORDER BY created_at, id"
actions:
  - id: purchase_product_category_products
    type: navigate
    permission: purchase.read
    navigate_to: /purchase/products
    params: { category: '{row.name}' }
  - id: new_purchase_product_category
    type: server_form
    permission: purchase.write
    title: New Product Category
    action: purchase.product_categories.create
    handler: yaml_mutation
    operation: create
    refresh: [purchase_product_category_detail, purchase_product_categories]
    mutation:
      operation: insert
      table: purchase_product_categories
      fields: [name, parent_name, force_removal_strategy, packaging_reserve_method, costing_method, inventory_valuation]
      required: [name]
      defaults: { parent_name: '', force_removal_strategy: '', packaging_reserve_method: partial, costing_method: Standard Price, inventory_valuation: Periodic (at closing), product_count: 0 }
      guards: [{ query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM purchase_product_categories WHERE LOWER(name) = LOWER(:name))", status: 409, code: PURCHASE_PRODUCT_CATEGORY_EXISTS, message: A product category with this name already exists. }]
      result: { query: "SELECT * FROM purchase_product_categories WHERE id = :id" }
    fields:
      - { field: name, label: Category, type: text, required: true }
      - { field: parent_name, label: Parent Category, type: text }
      - { field: force_removal_strategy, label: Force Removal Strategy?, type: text }
      - { field: packaging_reserve_method, label: Reserve Packagings?, type: text }
      - { field: costing_method, label: Costing Method?, type: text }
      - { field: inventory_valuation, label: Inventory Valuation?, type: text }
  - id: edit_purchase_product_category
    type: server_form
    permission: purchase.write
    title: Edit Product Category
    action: purchase.product_categories.update
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    prefill: state.purchase_product_category_detail
    refresh: [purchase_product_category_detail, purchase_product_categories]
    mutation:
      operation: update
      table: purchase_product_categories
      key: id
      fields: [name, parent_name, force_removal_strategy, packaging_reserve_method, costing_method, inventory_valuation]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM purchase_product_categories WHERE id = :id", status: 404, message: Product category not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM purchase_product_categories WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: PURCHASE_PRODUCT_CATEGORY_EXISTS, message: A product category with this name already exists. }
      result: { query: "SELECT * FROM purchase_product_categories WHERE id = :id" }
    fields:
      - { field: name, label: Category, type: text, required: true }
      - { field: parent_name, label: Parent Category, type: text }
      - { field: force_removal_strategy, label: Force Removal Strategy?, type: text }
      - { field: packaging_reserve_method, label: Reserve Packagings?, type: text }
      - { field: costing_method, label: Costing Method?, type: text }
      - { field: inventory_valuation, label: Inventory Valuation?, type: text }
  - id: send_purchase_product_category_message
    type: server_form
    permission: purchase.write
    title: Send message
    action: purchase.product_categories.message
    handler: order_chatter
    operation: message
    params: { id: '{row.id}' }
    refresh: [purchase_product_category_messages]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      guards: [{ query: "SELECT id FROM purchase_product_categories WHERE id = :id", status: 404, message: Product category not found. }]
      steps: [{ query: "INSERT INTO purchase_product_category_messages(id, category_id, actor_name, action, action_label, detail) VALUES(gen_random_uuid(), :id, :current_user_name, 'purchase.product_categories.message', 'Message', :content)" }]
  - id: log_purchase_product_category_note
    type: server_form
    permission: purchase.write
    title: Log note
    action: purchase.product_categories.note
    handler: order_chatter
    operation: note
    params: { id: '{row.id}' }
    refresh: [purchase_product_category_messages]
    fields: [{ field: content, label: Note, type: textarea, required: true }]
    mutation:
      guards: [{ query: "SELECT id FROM purchase_product_categories WHERE id = :id", status: 404, message: Product category not found. }]
      steps: [{ query: "INSERT INTO purchase_product_category_messages(id, category_id, actor_name, action, action_label, detail) VALUES(gen_random_uuid(), :id, :current_user_name, 'purchase.product_categories.note', 'Note', :content)" }]
