page: { id: vendors }
datasources:
  - id: purchase_vendor_states
    permission: purchase.read
    query: "SELECT value, label FROM (VALUES ('all','All'), ('Active','Active'), ('Inactive','Inactive')) states(value, label) ORDER BY CASE value WHEN 'all' THEN 0 WHEN 'Active' THEN 1 ELSE 2 END"
  - id: purchase_vendors
    permission: purchase.read
    workflow: purchase_vendors
    error_states: { transport_error: { status: 503, code: PURCHASE_VENDORS_UNAVAILABLE, message: Vendor data is temporarily unavailable. } }
    query: "SELECT v.id, v.row_version, v.name, COALESCE(v.email, '') AS email, COALESCE(v.phone, '') AS phone, COALESCE(v.street, '') AS street, COALESCE(v.city, '') AS city, COALESCE(v.country, '') AS country, CASE WHEN COALESCE(v.city, '') = '' AND COALESCE(v.country, '') = '' THEN '' WHEN COALESCE(v.country, '') = '' THEN v.city WHEN COALESCE(v.city, '') = '' THEN v.country ELSE v.city || ', ' || v.country END AS location_display, COALESCE(v.vat, '') AS vat, COALESCE(v.payment_terms, '') AS payment_terms, v.state, (SELECT COUNT(*) FROM purchase_orders p WHERE p.vendor_id = v.id) AS purchase_order_count, (SELECT COUNT(*) FROM purchase_orders p WHERE p.vendor_id = v.id AND p.state <> 'Cancelled') AS open_purchase_order_count FROM purchase_vendors v WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (COALESCE(:state, 'Active') = 'all' OR v.state = COALESCE(:state, 'Active')) AND (:q IS NULL OR v.name ILIKE '%' || :q || '%' OR COALESCE(v.email, '') ILIKE '%' || :q || '%' OR COALESCE(v.city, '') ILIKE '%' || :q || '%' OR COALESCE(v.country, '') ILIKE '%' || :q || '%') ORDER BY v.name, v.id"
actions:
  - id: create_purchase_vendor
    type: server_form
    permission: purchase.manage
    title: New vendor
    action: purchase.vendors.create
    handler: yaml_mutation
    operation: create
    refresh: [purchase_vendors]
    mutation:
      operation: insert
      table: purchase_vendors
      generated: [id]
      fields: [name, email, phone, payment_terms, street, city, country, vat]
      required: [name]
      defaults: { state: Active }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: PURCHASE_VENDOR_NAME_REQUIRED, message: A vendor name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM purchase_vendors WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: PURCHASE_VENDOR_NAME_EXISTS, message: A vendor with this name already exists. }
      result: { query: "SELECT * FROM purchase_vendors WHERE id = :id" }
    fields:
      - { field: name, label: Vendor, type: text, required: true }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: payment_terms, label: Payment terms, type: text }
      - { field: street, label: Street, type: text }
      - { field: city, label: City, type: text }
      - { field: country, label: Country, type: text }
      - { field: vat, label: Tax ID, type: text }
  - id: archive_purchase_vendor
    type: server
    permission: purchase.manage
    action: purchase.vendors.archive
    handler: order_transition
    workflow: purchase_vendors
    operation: archive
    refresh: [purchase_vendors]
  - id: restore_purchase_vendor
    type: server
    permission: purchase.manage
    action: purchase.vendors.restore
    handler: order_transition
    workflow: purchase_vendors
    operation: restore
    refresh: [purchase_vendors]
  - id: delete_purchase_vendor
    type: server
    permission: purchase.manage
    action: purchase.vendors.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete vendor {{row.name}}?'
    refresh: [purchase_vendors]
    mutation:
      operation: delete
      table: purchase_vendors
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM purchase_vendors WHERE id = :id", status: 404, code: PURCHASE_VENDOR_NOT_FOUND, message: Vendor not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM purchase_orders WHERE vendor_id = :id)", status: 409, code: PURCHASE_VENDOR_IN_USE, message: A vendor with purchase orders cannot be deleted. }
