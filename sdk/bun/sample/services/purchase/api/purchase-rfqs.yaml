page: { id: purchase-rfqs }
datasources:
  - id: purchase_rfq_states
    permission: purchase.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Sent','Sent'), ('To Approve','To Approve'), ('Cancelled','Cancelled')) states(value, label)"
  - id: purchase_vendor_lookup_rfqs
    permission: purchase.read
    query: "SELECT id AS value, name AS label FROM purchase_vendors WHERE state = 'Active' ORDER BY name"
  - id: purchase_rfqs
    permission: purchase.read
    pivot:
      fields: [vendor_name, state, expected_date, quantity, qty_received, total_amount]
    query: "SELECT p.id, p.row_version, p.name, p.vendor_id, p.vendor_name, p.product_name, p.quantity, p.qty_received, p.unit_price, p.state, CAST(p.order_date AS VARCHAR) AS order_date, CAST(p.expected_date AS VARCHAR) AS expected_date, p.reference, p.currency, 'Main Company (San Francisco)' AS company_name, p.buyer_name, COALESCE(p.total_amount, p.quantity * p.unit_price) AS total_amount, printf('%s %,.2f', p.currency, CAST(COALESCE(p.total_amount, p.quantity * p.unit_price) AS DOUBLE)) AS total_amount_display, CASE p.state WHEN 'Draft' THEN 'todo' WHEN 'Sent' THEN 'email' WHEN 'To Approve' THEN 'todo' ELSE 'document' END AS activity_type, CASE p.state WHEN 'Draft' THEN 'Review supplier request' WHEN 'Sent' THEN 'Follow up with vendor' WHEN 'To Approve' THEN 'Approve quotation' ELSE 'Review cancelled request' END AS activity_summary, CAST(p.expected_date AS VARCHAR) AS activity_date, p.buyer_name AS activity_user, CASE p.state WHEN 'Cancelled' THEN 'done' WHEN 'Draft' THEN 'today' ELSE 'planned' END AS activity_state, 1 AS activity_count FROM purchase_orders p WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND p.order_type = 'rfq' AND (:q IS NULL OR p.name ILIKE '%' || :q || '%' OR p.vendor_name ILIKE '%' || :q || '%' OR p.product_name ILIKE '%' || :q || '%') AND (:state IS NULL OR p.state = :state) AND (:vendor_id IS NULL OR p.vendor_id = :vendor_id) ORDER BY p.order_date DESC, p.created_at DESC"
actions:
  - id: merge_purchase_rfqs
    type: server
    confirm: Merge the selected RFQs? The oldest RFQ will be kept and the others will be cancelled.
    permission: accounting.write
    action: purchase.rfqs.merge
    handler: yaml_mutation
    operation: merge
    refresh: [purchase_rfqs]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE (SELECT COUNT(*) FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false) >= 2", status: 409, code: PURCHASE_RFQ_MERGE_SELECTION_INVALID, message: Please select at least two unlocked RFQs in Draft or Sent state. }
        - { query: "SELECT 1 AS ok WHERE (SELECT COUNT(DISTINCT vendor_id) FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false) = 1", status: 409, code: PURCHASE_RFQ_MERGE_VENDOR_MISMATCH, message: Selected RFQs must have the same vendor, currency, and destination. }
      steps:
        - { query: "UPDATE purchase_order_lines survivor_line SET quantity = survivor_line.quantity + COALESCE((SELECT SUM(duplicate_line.quantity) FROM purchase_order_lines duplicate_line JOIN purchase_orders duplicate_order ON duplicate_order.id = duplicate_line.order_id WHERE duplicate_order.id IN :selectedIds AND duplicate_order.id <> (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1) AND duplicate_order.state IN ('Draft', 'Sent') AND duplicate_line.product_name = survivor_line.product_name AND duplicate_line.display_type = 'product'), 0), unit_price = LEAST(survivor_line.unit_price, COALESCE((SELECT MIN(duplicate_line.unit_price) FROM purchase_order_lines duplicate_line JOIN purchase_orders duplicate_order ON duplicate_order.id = duplicate_line.order_id WHERE duplicate_order.id IN :selectedIds AND duplicate_order.id <> survivor_line.order_id AND duplicate_order.state IN ('Draft', 'Sent') AND duplicate_line.product_name = survivor_line.product_name AND duplicate_line.display_type = 'product'), survivor_line.unit_price)), line_total = ROUND(survivor_line.quantity * LEAST(survivor_line.unit_price, COALESCE((SELECT MIN(duplicate_line.unit_price) FROM purchase_order_lines duplicate_line JOIN purchase_orders duplicate_order ON duplicate_order.id = duplicate_line.order_id WHERE duplicate_order.id IN :selectedIds AND duplicate_order.id <> survivor_line.order_id AND duplicate_order.state IN ('Draft', 'Sent') AND duplicate_line.product_name = survivor_line.product_name AND duplicate_line.display_type = 'product'), survivor_line.unit_price), 2)), row_version = survivor_line.row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE survivor_line.order_id = (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1) AND survivor_line.display_type = 'product' AND EXISTS (SELECT 1 FROM purchase_order_lines duplicate_line JOIN purchase_orders duplicate_order ON duplicate_line.order_id = duplicate_order.id WHERE duplicate_order.id IN :selectedIds AND duplicate_order.id <> survivor_line.order_id AND duplicate_order.state IN ('Draft', 'Sent') AND duplicate_line.product_name = survivor_line.product_name AND duplicate_line.display_type = 'product')" }
        - { query: "DELETE FROM purchase_order_lines AS duplicate_line WHERE duplicate_line.order_id IN :selectedIds AND duplicate_line.order_id <> (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1) AND duplicate_line.display_type = 'product' AND EXISTS (SELECT 1 FROM purchase_order_lines survivor_line WHERE survivor_line.order_id = (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1) AND survivor_line.product_name = duplicate_line.product_name AND survivor_line.display_type = 'product')" }
        - { query: "UPDATE purchase_order_lines SET order_id = (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE order_id IN :selectedIds AND order_id <> (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1)" }
        - { query: "UPDATE purchase_order_lines SET line_total = ROUND(quantity * unit_price, 2), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE order_id = (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1) AND display_type = 'product'" }
        - { query: "UPDATE purchase_orders AS survivor SET quantity = (SELECT COALESCE(SUM(quantity), 0) FROM purchase_order_lines WHERE order_id = survivor.id AND display_type = 'product'), total_amount = (SELECT COALESCE(SUM(line_total), 0) FROM purchase_order_lines WHERE order_id = survivor.id AND display_type = 'product'), reference = TRIM(BOTH ', ' FROM CONCAT(COALESCE(survivor.reference, ''), ', ', COALESCE((SELECT STRING_AGG(duplicate.reference, ', ' ORDER BY duplicate.order_date, duplicate.id) FROM purchase_orders duplicate WHERE duplicate.id IN :selectedIds AND duplicate.id <> survivor.id AND duplicate.state IN ('Draft', 'Sent')), ''))), row_version = survivor.row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE survivor.id = (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1)" }
        - { query: "UPDATE purchase_orders SET state = 'Cancelled', row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id IN :selectedIds AND id <> (SELECT id FROM purchase_orders WHERE id IN :selectedIds AND order_type = 'rfq' AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false ORDER BY order_date ASC, id ASC LIMIT 1) AND order_type = 'rfq' AND state IN ('Draft', 'Sent')", expect_changed: true, code: PURCHASE_RFQ_MERGE_STALE, message: These RFQs changed. Reload before merging. }
      result: { query: "SELECT * FROM purchase_orders WHERE id = (SELECT id FROM purchase_orders WHERE id IN :selectedIds ORDER BY order_date ASC, id ASC LIMIT 1)" }
  - id: create_purchase_order
    type: server_form
    permission: purchase.write
    title: New request for quotation
    action: purchase.orders.create
    handler: yaml_mutation
    operation: create
    refresh: [purchase_rfqs]
    mutation:
      operation: insert
      table: purchase_orders
      fields: [name, vendor_id, vendor_name, product_name, quantity, unit_price, order_date, expected_date, reference, order_type]
      required: [name, vendor_id, vendor_name, product_name, quantity]
      defaults: { state: Draft, qty_received: 0, order_type: rfq, currency: USD, buyer_name: Mitchell Admin }
      guards: [{ query: "SELECT 1 AS ok WHERE CAST(:quantity AS DECIMAL(18,3)) > 0 AND EXISTS (SELECT 1 FROM purchase_vendors WHERE id = :vendor_id AND state = 'Active')", status: 400, message: An RFQ needs an active vendor and a positive quantity }]
      result: { query: "SELECT * FROM purchase_orders WHERE id = :id" }
    fields:
      - { field: name, label: Reference, type: text, required: true }
      - { field: vendor_id, label: Vendor, type: select, options_source: purchase_vendor_lookup_rfqs, required: true }
      - { field: vendor_name, label: Vendor name, type: text, required: true }
      - { field: product_name, label: Product, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true }
      - { field: unit_price, label: Unit price, type: number }
      - { field: expected_date, label: Expected date, type: text }
      - { field: reference, label: Vendor reference, type: text }
