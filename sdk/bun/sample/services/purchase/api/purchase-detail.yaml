  - id: edit_purchase_order_line
    type: server_form
    permission: purchase.write
    title: Edit product line
    action: purchase.orders.lines.update
    handler: line_item
    operation: update
    domain: purchase_order
    params: { id: '{state.id}', line_id: '{row.id}' }
    prefill: row
    refresh: [purchase_order_detail, purchase_order_lines]
    fields:
      - { field: product_name, label: Product, type: text, required: true }
      - { field: description, label: Description, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true }
      - { field: uom, label: Unit, type: text, required: true }
      - { field: unit_price, label: Unit Price, type: number, required: true }
      - { field: tax_rate, label: Taxes, type: number }
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false AND row_version = :parent_expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed or is no longer editable. Reload before saving the line. }
        - { query: "SELECT id FROM purchase_order_lines WHERE id = :line_id AND order_id = :id AND display_type = 'product' AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_STALE, message: This product line changed or was deleted. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:product_name AS VARCHAR))) BETWEEN 1 AND 200 AND length(trim(COALESCE(NULLIF(CAST(:description AS VARCHAR), ''), CAST(:product_name AS VARCHAR)))) BETWEEN 1 AND 500 AND CAST(:quantity AS DECIMAL(18,3)) > 0 AND CAST(:unit_price AS DECIMAL(18,2)) >= 0 AND CAST(CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)) AS DECIMAL(9,4)) BETWEEN 0 AND 100", status: 422, code: PURCHASE_ORDER_LINE_INVALID, message: Product, description, quantity, price, and tax must be valid. }
      steps:
        - { query: "UPDATE purchase_order_lines SET row_version = row_version + 1, product_name = trim(CAST(:product_name AS VARCHAR)), description = COALESCE(NULLIF(trim(CAST(:description AS VARCHAR)), ''), trim(CAST(:product_name AS VARCHAR))), quantity = CAST(:quantity AS DECIMAL(18,3)), uom = COALESCE(NULLIF(trim(CAST(:uom AS VARCHAR)), ''), 'Units'), unit_price = CAST(:unit_price AS DECIMAL(18,2)), tax_rate = CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)), line_total = ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 + CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)) / 100), 2), updated_at = CURRENT_TIMESTAMP WHERE id = :line_id AND order_id = :id AND display_type = 'product' AND row_version = :expected_row_version", expect_changed: true, code: PURCHASE_ORDER_LINE_STALE, message: This product line was changed or was deleted. Reload before saving. }
        - { query: "UPDATE purchase_orders SET total_amount = (SELECT COALESCE(SUM(line_total), 0) FROM purchase_order_lines WHERE order_id = :id), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed while saving the line. Reload before saving. }
      result: { query: "SELECT * FROM purchase_order_lines WHERE id = :line_id" }
