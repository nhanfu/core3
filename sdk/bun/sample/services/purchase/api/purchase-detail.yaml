  - id: add_purchase_order_line
    type: server_form
    permission: purchase.write
    title: Add a product
    action: purchase.orders.lines.create
    handler: line_item
    operation: create
    domain: purchase_order
    params: { id: '{state.id}' }
    refresh: [purchase_order_detail, purchase_order_lines]
    fields:
      - { field: product_name, label: Product, type: text, required: true }
      - { field: description, label: Description, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true, default: 1 }
      - { field: uom, label: Unit, type: text, required: true, default: Units }
      - { field: unit_price, label: Unit Price, type: number, required: true, default: 0 }
      - { field: tax_rate, label: Taxes, type: number, default: 0 }
    mutation:
      generated: [line_id]
      before_steps:
        - { query: "SELECT COALESCE(MAX(sequence), 0) + 10 AS next_sequence, 'purchase-order-line-' || :id || '-' || CAST(COALESCE(MAX(sequence), 0) + 10 AS VARCHAR) AS line_id FROM purchase_order_lines WHERE order_id = :id", assign: true }
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false AND row_version = :parent_expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed or is no longer editable. Reload before adding a product. }
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:product_name AS VARCHAR))) BETWEEN 1 AND 200 AND length(trim(COALESCE(NULLIF(CAST(:description AS VARCHAR), ''), CAST(:product_name AS VARCHAR)))) BETWEEN 1 AND 500 AND CAST(:quantity AS DECIMAL(18,3)) > 0 AND CAST(:unit_price AS DECIMAL(18,2)) >= 0 AND CAST(CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)) AS DECIMAL(9,4)) BETWEEN 0 AND 100", status: 422, code: PURCHASE_ORDER_LINE_INVALID, message: Product, description, quantity, price, and tax must be valid. }
      steps:
        - { query: "INSERT INTO purchase_order_lines(id, order_id, row_version, sequence, display_type, product_name, description, quantity, qty_received, qty_billed, uom, unit_price, tax_rate, line_total) VALUES(:line_id, :id, 1, :next_sequence, 'product', trim(CAST(:product_name AS VARCHAR)), COALESCE(NULLIF(trim(CAST(:description AS VARCHAR)), ''), trim(CAST(:product_name AS VARCHAR))), CAST(:quantity AS DECIMAL(18,3)), 0, 0, COALESCE(NULLIF(trim(CAST(:uom AS VARCHAR)), ''), 'Units'), CAST(:unit_price AS DECIMAL(18,2)), CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)), ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 + CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)) / 100), 2))" }
        - { query: "UPDATE purchase_orders SET total_amount = (SELECT COALESCE(SUM(line_total), 0) FROM purchase_order_lines WHERE order_id = :id), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed while adding the product. Reload before saving. }
      result: { query: "SELECT * FROM purchase_order_lines WHERE id = :line_id" }
  - id: add_purchase_order_catalog
    type: server_form
    permission: purchase.write
    title: Add products from Catalog
    submit_label: Add products
    success_message: Products added to the purchase order.
    action: purchase.orders.catalog.add
    handler: yaml_mutation
    operation: update
    params: { id: '{state.purchase_order_detail.id}' }
    refresh: [purchase_order_detail, purchase_order_lines]
    fields:
      - { field: product_ids, label: Products, type: multi-select, options_source: purchase_order_catalog_products, multiple: true, required: true, placeholder: Select products }
      - { field: quantity, label: Quantity for each product, type: number, required: true, min: 0.001, step: 0.001, default: 1 }
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_CATALOG_INVALID, message: Only an unchanged unlocked RFQ can add products from the catalog. Reload before adding products. }
        - { query: "SELECT 1 AS ok WHERE :product_ids IS NOT NULL", status: 422, code: PURCHASE_ORDER_CATALOG_SELECTION_REQUIRED, message: Select at least one purchaseable product. }
        - { query: "SELECT 1 AS ok WHERE CAST(:quantity AS DECIMAL(18,3)) > 0", status: 422, code: PURCHASE_ORDER_CATALOG_QUANTITY_INVALID, message: Quantity must be greater than zero. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM purchase_products p WHERE p.id IN :product_ids AND p.active = true AND p.purchase_ok = true) AND NOT EXISTS (SELECT 1 FROM purchase_products p WHERE p.id IN :product_ids AND (p.active = false OR p.purchase_ok = false))", status: 422, code: PURCHASE_ORDER_CATALOG_PRODUCT_INVALID, message: Select only active products that can be purchased. }
      steps:
        - for_each:
            input: product_ids
            as: selected_product_id
            steps:
              - query: "UPDATE purchase_order_lines SET quantity = quantity + CAST(:quantity AS DECIMAL(18,3)), line_total = ROUND((quantity + CAST(:quantity AS DECIMAL(18,3))) * unit_price * (1 + tax_rate / 100), 2), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE order_id = :id AND product_id = :selected_product_id AND display_type = 'product'"
              - query: "INSERT INTO purchase_order_lines(id, order_id, product_id, row_version, sequence, display_type, product_name, description, quantity, qty_received, qty_billed, uom, unit_price, tax_rate, line_total) SELECT 'purchase-catalog-' || :id || '-' || p.id, :id, p.id, 1, COALESCE((SELECT MAX(sequence) FROM purchase_order_lines WHERE order_id = :id), 0) + 10, 'product', p.name, p.name, CAST(:quantity AS DECIMAL(18,3)), 0, 0, p.uom, p.cost_price, 0, ROUND(CAST(:quantity AS DECIMAL(18,3)) * p.cost_price, 2) FROM purchase_products p WHERE p.id = :selected_product_id AND NOT EXISTS (SELECT 1 FROM purchase_order_lines existing WHERE existing.order_id = :id AND existing.product_id = :selected_product_id AND existing.display_type = 'product')"
        - { query: "UPDATE purchase_orders SET quantity = (SELECT COALESCE(SUM(quantity), 0) FROM purchase_order_lines WHERE order_id = :id AND display_type = 'product'), total_amount = (SELECT COALESCE(SUM(line_total), 0) FROM purchase_order_lines WHERE order_id = :id), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, code: PURCHASE_ORDER_CATALOG_STALE, message: This purchase order changed while adding catalog products. Reload before saving. }
      result: { query: "SELECT id, order_id, product_id, quantity, line_total FROM purchase_order_lines WHERE order_id = :id AND product_id IN :product_ids ORDER BY sequence, id" }
