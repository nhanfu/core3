page: { id: purchase-detail }
datasources:
  - id: purchase_order_detail
    single: true
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_DETAIL_UNAVAILABLE, message: Purchase order details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, vendor_name, contact_name, product_name, quantity, qty_received, unit_price, state, CAST(order_date AS VARCHAR) AS order_date, CAST(order_date AS VARCHAR) AS confirmation_date, CAST(expected_date AS VARCHAR) AS expected_date, CAST(expected_date AS VARCHAR) AS expected_arrival, reference, currency, 'Main Company (San Francisco)' AS company_name, buyer_name, CASE WHEN state IN ('Confirmed', 'Received') THEN 'Nothing to Bill' ELSE 'To Bill' END AS billing_status, total_amount, printf('%s %,.2f', currency, CAST(total_amount AS DOUBLE)) AS total_amount_display, (SELECT COUNT(*) FROM purchase_order_lines l WHERE l.order_id = purchase_orders.id) AS line_count, (SELECT COUNT(*) FROM purchase_receipts r WHERE r.purchase_order_id = purchase_orders.id) AS receipt_count, (SELECT r.id FROM purchase_receipts r WHERE r.purchase_order_id = purchase_orders.id ORDER BY r.id LIMIT 1) AS receipt_id, locked, acknowledged, notes FROM purchase_orders WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
  - id: purchase_order_lines
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_LINES_UNAVAILABLE, message: Purchase order lines are temporarily unavailable. } }
    query: "SELECT l.id, l.row_version, l.order_id AS document_id, l.sequence, l.display_type, l.product_name, l.description, CAST(l.quantity AS DOUBLE) AS quantity, printf('%,.2f', CAST(l.quantity AS DOUBLE)) AS quantity_display, l.qty_received, l.qty_billed, l.uom, CAST(l.unit_price AS DOUBLE) AS unit_price, printf('%s %,.2f', p.currency, CAST(l.unit_price AS DOUBLE)) AS unit_price_display, CAST(l.tax_rate AS DOUBLE) AS tax_rate, printf('%.2f%%', CAST(l.tax_rate AS DOUBLE)) AS tax_rate_display, CAST(l.line_total AS DOUBLE) AS line_total, printf('%s %,.2f', p.currency, CAST(l.line_total AS DOUBLE)) AS line_total_display, p.state AS parent_state, p.row_version AS parent_row_version FROM purchase_order_lines l JOIN purchase_orders p ON p.id = l.order_id WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND l.order_id = :id ORDER BY l.sequence, l.id"
actions:
  - { id: open_purchase_bill_matching, type: navigate, permission: accounting.write, navigate_to: /purchase/bill-matching, params: { id: '{row.id}' } }
  - { id: open_purchase_receipt, type: navigate, permission: purchase.read, navigate_to: /purchase/receipt, params: { id: '{row.receipt_id}' } }
  - { id: send_purchase_order_detail, type: server, permission: purchase.write, action: purchase.orders.send, handler: order_transition, workflow: purchase_orders, operation: send, refresh: [purchase_order_detail] }
  - { id: confirm_purchase_order_detail, type: server, permission: purchase.write, action: purchase.orders.confirm, handler: order_transition, workflow: purchase_orders, operation: confirm, refresh: [purchase_order_detail] }
  - { id: receive_purchase_order_detail, type: server, permission: purchase.write, action: purchase.orders.receive, handler: order_transition, workflow: purchase_orders, operation: receive, refresh: [purchase_order_detail] }
  - { id: cancel_purchase_order_detail, type: server, permission: purchase.write, action: purchase.orders.cancel, handler: order_transition, workflow: purchase_orders, operation: cancel, refresh: [purchase_order_detail] }
  - id: add_purchase_order_line
    type: server_form
    permission: purchase.write
    title: Add a product
    action: purchase.orders.lines.create
    handler: line_item
    operation: create
    domain: purchase_order
    params: { id: '{state.id}' }
    refresh: [purchase_order_detail, purchase_order_lines]
    fields:
      - { field: product_name, label: Product, type: text, required: true }
      - { field: description, label: Description, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true, default: 1 }
      - { field: uom, label: Unit, type: text, required: true, default: Units }
      - { field: unit_price, label: Unit Price, type: number, required: true, default: 0 }
      - { field: tax_rate, label: Taxes, type: number, default: 0 }
    mutation:
      generated: [line_id]
      before_steps:
        - { query: "SELECT COALESCE(MAX(sequence), 0) + 10 AS next_sequence, 'purchase-order-line-' || :id || '-' || CAST(COALESCE(MAX(sequence), 0) + 10 AS VARCHAR) AS line_id FROM purchase_order_lines WHERE order_id = :id", assign: true }
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false AND row_version = :parent_expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed or is no longer editable. Reload before adding a product. }
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:product_name AS VARCHAR))) BETWEEN 1 AND 200 AND length(trim(COALESCE(NULLIF(CAST(:description AS VARCHAR), ''), CAST(:product_name AS VARCHAR)))) BETWEEN 1 AND 500 AND CAST(:quantity AS DECIMAL(18,3)) > 0 AND CAST(:unit_price AS DECIMAL(18,2)) >= 0 AND CAST(CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)) AS DECIMAL(9,4)) BETWEEN 0 AND 100", status: 422, code: PURCHASE_ORDER_LINE_INVALID, message: Product, description, quantity, price, and tax must be valid. }
      steps:
        - { query: "INSERT INTO purchase_order_lines(id, order_id, row_version, sequence, display_type, product_name, description, quantity, qty_received, qty_billed, uom, unit_price, tax_rate, line_total) VALUES(:line_id, :id, 1, :next_sequence, 'product', trim(CAST(:product_name AS VARCHAR)), COALESCE(NULLIF(trim(CAST(:description AS VARCHAR)), ''), trim(CAST(:product_name AS VARCHAR))), CAST(:quantity AS DECIMAL(18,3)), 0, 0, COALESCE(NULLIF(trim(CAST(:uom AS VARCHAR)), ''), 'Units'), CAST(:unit_price AS DECIMAL(18,2)), CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)), ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 + CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)) / 100), 2))" }
        - { query: "UPDATE purchase_orders SET total_amount = (SELECT COALESCE(SUM(line_total), 0) FROM purchase_order_lines WHERE order_id = :id), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed while adding the product. Reload before saving. }
      result: { query: "SELECT * FROM purchase_order_lines WHERE id = :line_id" }
  - id: edit_purchase_order_line
    type: server_form
    permission: purchase.write
    title: Edit product line
    action: purchase.orders.lines.update
    handler: line_item
    operation: update
    domain: purchase_order
    params: { id: '{state.id}', line_id: '{row.id}' }
    prefill: row
    refresh: [purchase_order_detail, purchase_order_lines]
    fields:
      - { field: product_name, label: Product, type: text, required: true }
      - { field: description, label: Description, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true }
      - { field: uom, label: Unit, type: text, required: true }
      - { field: unit_price, label: Unit Price, type: number, required: true }
      - { field: tax_rate, label: Taxes, type: number }
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false AND row_version = :parent_expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed or is no longer editable. Reload before saving the line. }
        - { query: "SELECT id FROM purchase_order_lines WHERE id = :line_id AND order_id = :id AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_STALE, message: This product line changed or was deleted. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE length(trim(CAST(:product_name AS VARCHAR))) BETWEEN 1 AND 200 AND length(trim(COALESCE(NULLIF(CAST(:description AS VARCHAR), ''), CAST(:product_name AS VARCHAR)))) BETWEEN 1 AND 500 AND CAST(:quantity AS DECIMAL(18,3)) > 0 AND CAST(:unit_price AS DECIMAL(18,2)) >= 0 AND CAST(CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)) AS DECIMAL(9,4)) BETWEEN 0 AND 100", status: 422, code: PURCHASE_ORDER_LINE_INVALID, message: Product, description, quantity, price, and tax must be valid. }
      steps:
        - { query: "UPDATE purchase_order_lines SET row_version = row_version + 1, product_name = trim(CAST(:product_name AS VARCHAR)), description = COALESCE(NULLIF(trim(CAST(:description AS VARCHAR)), ''), trim(CAST(:product_name AS VARCHAR))), quantity = CAST(:quantity AS DECIMAL(18,3)), uom = COALESCE(NULLIF(trim(CAST(:uom AS VARCHAR)), ''), 'Units'), unit_price = CAST(:unit_price AS DECIMAL(18,2)), tax_rate = CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)), line_total = ROUND(CAST(:quantity AS DECIMAL(18,3)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 + CAST(COALESCE(NULLIF(CAST(:tax_rate AS VARCHAR), ''), '0') AS DECIMAL(9,4)) / 100), 2), updated_at = CURRENT_TIMESTAMP WHERE id = :line_id AND order_id = :id AND row_version = :expected_row_version", expect_changed: true, code: PURCHASE_ORDER_LINE_STALE, message: This product line changed or was deleted. Reload before saving. }
        - { query: "UPDATE purchase_orders SET total_amount = (SELECT COALESCE(SUM(line_total), 0) FROM purchase_order_lines WHERE order_id = :id), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed while saving the line. Reload before saving. }
      result: { query: "SELECT * FROM purchase_order_lines WHERE id = :line_id" }
  - id: delete_purchase_order_line
    type: server
    permission: purchase.write
    action: purchase.orders.lines.delete
    handler: line_item
    operation: delete
    domain: purchase_order
    params: { id: '{state.id}', line_id: '{row.id}' }
    confirm: 'Delete product line {{row.description}}?'
    refresh: [purchase_order_detail, purchase_order_lines]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND state IN ('Draft', 'Sent') AND COALESCE(locked, false) = false AND row_version = :parent_expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed or is no longer editable. Reload before deleting the line. }
        - { query: "SELECT id FROM purchase_order_lines WHERE id = :line_id AND order_id = :id AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_STALE, message: This product line changed or was deleted. Reload before deleting. }
      steps:
        - { query: "DELETE FROM purchase_order_lines WHERE id = :line_id AND order_id = :id AND row_version = :expected_row_version", expect_changed: true, code: PURCHASE_ORDER_LINE_STALE, message: This product line changed or was deleted. Reload before deleting. }
        - { query: "UPDATE purchase_orders SET total_amount = (SELECT COALESCE(SUM(line_total), 0) FROM purchase_order_lines WHERE order_id = :id), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, code: PURCHASE_ORDER_LINE_PARENT_STALE, message: This purchase order changed while deleting the line. Reload before saving. }
      result: { query: "SELECT true AS deleted, :line_id AS id" }
