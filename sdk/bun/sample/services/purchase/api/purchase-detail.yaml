  - id: send_purchase_order_message
    type: server_form
    permission: purchase.write
    title: Send message
    action: purchase.orders.chatter.message
    handler: order_chatter
    operation: message
    params: { id: '{state.purchase_order_detail.id}', expected_row_version: '{state.purchase_order_detail.row_version}' }
    refresh: [purchase_order_detail, purchase_order_email_history]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      before_steps:
        - { query: "SELECT 'purchase-chatter-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM purchase_order_messages WHERE purchase_order_id = :id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: PURCHASE_ORDER_MESSAGE_ACTOR_REQUIRED, message: An authenticated Purchase actor is required to send a message. }
        - { query: "SELECT id FROM purchase_orders WHERE id = :id", status: 404, code: PURCHASE_ORDER_CHATTER_NOT_FOUND, message: Purchase order was not found. }
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_MESSAGE_PARENT_CHANGED, message: This purchase order changed. Reload before sending a message. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: PURCHASE_ORDER_MESSAGE_CONTENT_INVALID, message: Message content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO purchase_order_messages(id, purchase_order_id, row_version, actor_id, actor_name, action, action_label, detail, created_at) VALUES(:message_id, :id, 1, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Purchase User'), 'purchase.orders.chatter.message', 'Message', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-09-22 10:00:00')", expect_changed: true, status: 409, code: PURCHASE_ORDER_MESSAGE_FAILED, message: The Purchase order message could not be recorded. }
        - { query: "UPDATE purchase_orders SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: PURCHASE_ORDER_MESSAGE_PARENT_CHANGED, message: This purchase order changed while sending the message. Reload before retrying. }
      result: { query: "SELECT id, purchase_order_id, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM purchase_order_messages WHERE id = :message_id" }
