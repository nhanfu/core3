      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: PURCHASE_ORDER_NOTE_ACTOR_REQUIRED, message: An authenticated Purchase actor is required to log a note. }
        - { query: "SELECT id FROM purchase_orders WHERE id = :id", status: 404, code: PURCHASE_ORDER_CHATTER_NOT_FOUND, message: Purchase order was not found. }
