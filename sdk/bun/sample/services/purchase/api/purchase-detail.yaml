page: { id: purchase-detail }
datasources:
  - id: purchase_order_followers
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_FOLLOWERS_UNAVAILABLE, message: Purchase order followers are temporarily unavailable. } }
    query: "SELECT f.user_id, f.name, f.email, CAST(f.created_at AS VARCHAR) AS followed_at FROM purchase_order_followers f JOIN purchase_orders p ON p.id = f.purchase_order_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND f.purchase_order_id = :id ORDER BY f.created_at, f.user_id"
  - id: purchase_order_follower_candidates
    permission: purchase.write
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_FOLLOWER_CANDIDATES_UNAVAILABLE, message: Purchase order follower candidates are temporarily unavailable. } }
    query: "SELECT c.id AS value, c.name || ' · ' || c.email AS label FROM purchase_follower_catalog c JOIN purchase_orders p ON p.id = :id WHERE c.active = true AND NOT EXISTS (SELECT 1 FROM purchase_order_followers f WHERE f.purchase_order_id = :id AND f.user_id = c.id) ORDER BY c.name, c.id"
  - id: purchase_order_detail
    single: true
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_DETAIL_UNAVAILABLE, message: Purchase order details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, vendor_name, (SELECT email FROM purchase_vendors v WHERE v.id = purchase_orders.vendor_id) AS recipient_email, vendor_name AS recipient_name, 'Main Company (San Francisco) Order (Ref ' || name || ')' AS subject, '<p>Dear ' || vendor_name || '</p><p>Here is in attachment a request for quotation <strong>' || name || '</strong> from My Company (San Francisco).</p><p>If you have any questions, please do not hesitate to contact us.</p><p>Best regards,<br/>-- Mitchell Admin</p>' AS body_html, 'Request for Quotation - ' || name || '.pdf' AS attachment_name, contact_name, product_name, quantity, qty_received, unit_price, state, CAST(order_date AS VARCHAR) AS order_date, CAST(order_date AS VARCHAR) AS confirmation_date, CAST(expected_date AS VARCHAR) AS expected_date, CAST(expected_date AS VARCHAR) AS expected_arrival, reference, currency, 'Main Company (San Francisco)' AS company_name, buyer_name, CASE WHEN EXISTS (SELECT 1 FROM purchase_vendor_bills vb WHERE vb.purchase_order_id = purchase_orders.id) THEN 'Invoiced' WHEN state IN ('Confirmed', 'Received') THEN 'To Bill' ELSE 'To Bill' END AS billing_status, total_amount, printf('%s %,.2f', currency, CAST(total_amount AS DOUBLE)) AS total_amount_display, (SELECT COUNT(*) FROM purchase_order_lines l WHERE l.order_id = purchase_orders.id) AS line_count, (SELECT COUNT(*) FROM purchase_receipts r WHERE r.purchase_order_id = purchase_orders.id) AS receipt_count, (SELECT r.id FROM purchase_receipts r WHERE r.purchase_order_id = purchase_orders.id ORDER BY r.id LIMIT 1) AS receipt_id, (SELECT COUNT(*) FROM purchase_vendor_bills vb WHERE vb.purchase_order_id = purchase_orders.id) AS vendor_bill_count, (SELECT vb.accounting_invoice_id FROM purchase_vendor_bills vb WHERE vb.purchase_order_id = purchase_orders.id ORDER BY vb.id LIMIT 1) AS vendor_bill_id, locked, acknowledged, CAST(acknowledged_at AS VARCHAR) AS acknowledged_at, COALESCE(receipt_reminder_email, FALSE) AS receipt_reminder_email, COALESCE(reminder_date_before_receipt, 1) AS reminder_date_before_receipt, notes FROM purchase_orders WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
  - id: purchase_order_po_email_detail
    single: true
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_PO_EMAIL_DETAIL_UNAVAILABLE, message: Purchase order email details are temporarily unavailable. } }
    query: >-
      SELECT id, row_version, name, vendor_name,
      (SELECT email FROM purchase_vendors v WHERE v.id = purchase_orders.vendor_id) AS recipient_email,
      vendor_name AS recipient_name,
      'Main Company (San Francisco) Order (Ref ' || name || ')' AS subject,
      '<p>Dear ' || vendor_name || '</p><p>Here is in attachment a purchase order <strong>' || name || '</strong> amounting in <strong>' || printf('%s %,.2f', currency, CAST(total_amount AS DOUBLE)) || '</strong> from Main Company (San Francisco).</p><p>The receipt is expected for <strong>' || CAST(expected_date AS VARCHAR) || '</strong>.</p><p>Could you please acknowledge the receipt of this order?</p><p><a href="/purchase/detail?id=' || id || '">Acknowledge</a></p><p>Best regards,<br/>-- Mitchell Admin</p>' AS body_html,
      'Purchase Order - ' || name || '.pdf' AS attachment_name,
      state
      FROM purchase_orders
      WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
      AND id = :id AND state IN ('Confirmed', 'Received')
  - id: purchase_order_bill_uploads
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_BILL_UPLOADS_UNAVAILABLE, message: Uploaded vendor bills are temporarily unavailable. } }
    query: "SELECT u.id, u.purchase_order_id, p.name AS purchase_order_name, u.accounting_invoice_id, u.invoice_number, u.file_name, u.mime_type, u.size_bytes, u.uploaded_by, u.state, u.amount, CAST(u.created_at AS VARCHAR) AS created_at, u.row_version FROM purchase_order_bill_uploads u JOIN purchase_orders p ON p.id = u.purchase_order_id WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND u.purchase_order_id = :id ORDER BY u.created_at DESC, u.id DESC"
  - id: purchase_order_lines
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_LINES_UNAVAILABLE, message: Purchase order lines are temporarily unavailable. } }
    query: "SELECT l.id, l.row_version, l.order_id AS document_id, l.product_id, l.sequence, l.display_type, l.product_name, l.description, CAST(l.quantity AS DOUBLE) AS quantity, printf('%,.2f', CAST(l.quantity AS DOUBLE)) AS quantity_display, l.qty_received, l.qty_billed, l.uom, CAST(l.unit_price AS DOUBLE) AS unit_price, printf('%s %,.2f', p.currency, CAST(l.unit_price AS DOUBLE)) AS unit_price_display, CAST(l.tax_rate AS DOUBLE) AS tax_rate, printf('%.2f%%', CAST(l.tax_rate AS DOUBLE)) AS tax_rate_display, CAST(l.line_total AS DOUBLE) AS line_total, printf('%s %,.2f', p.currency, CAST(l.line_total AS DOUBLE)) AS line_total_display, p.state AS parent_state, p.row_version AS parent_row_version FROM purchase_order_lines l JOIN purchase_orders p ON p.id = l.order_id WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND l.order_id = :id ORDER BY l.sequence, l.id"
  - id: purchase_order_catalog_products
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_CATALOG_UNAVAILABLE, message: The purchase catalog is temporarily unavailable. } }
    query: "SELECT id AS value, id, COALESCE(NULLIF(default_code, ''), '') || CASE WHEN COALESCE(NULLIF(default_code, ''), '') = '' THEN '' ELSE ' · ' END || name AS label, name, CAST(cost_price AS DOUBLE) AS unit_price, uom FROM purchase_products WHERE active = true AND purchase_ok = true ORDER BY name, id"
  - id: purchase_order_print_runs
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_PRINTS_UNAVAILABLE, message: Purchase order print history is temporarily unavailable. } }
    query: "SELECT r.id, r.purchase_order_id, p.name AS purchase_order_name, r.report_name, r.report_action, r.report_template, r.output_format, r.printed_by, CAST(r.printed_at AS VARCHAR) AS printed_at, r.row_version FROM purchase_order_print_runs r JOIN purchase_orders p ON p.id = r.purchase_order_id WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND r.purchase_order_id = :id ORDER BY r.printed_at DESC, r.id DESC"
  - id: purchase_order_email_history
    permission: purchase.read
    error_states: { transport_error: { status: 503, code: PURCHASE_ORDER_EMAIL_HISTORY_UNAVAILABLE, message: Purchase order email history is temporarily unavailable. } }
    query: >-
      SELECT e.id, e.purchase_order_id, e.sent_by AS actor_name, CAST(e.sent_at AS VARCHAR) AS created_at,
      'purchase.orders.email.message' AS action, 'Sent ' || e.template_label AS action_label,
      e.recipient_name, e.recipient_email,
      'To ' || e.recipient_name || ' (' || e.recipient_email || ') · ' || e.attachment_name AS detail,
      e.subject, e.state, e.row_version
      FROM purchase_order_emails e
      WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND e.purchase_order_id = :id
      UNION ALL
      SELECT r.id, r.purchase_order_id, r.sent_by AS actor_name, CAST(r.sent_at AS VARCHAR) AS created_at,
      'purchase.orders.reminder.preview' AS action, 'Sent Purchase: Vendor Reminder' AS action_label,
      r.recipient_name, r.recipient_email, 'Sample sent to ' || r.recipient_email AS detail,
      r.subject, 'Sent' AS state, r.row_version
      FROM purchase_order_reminder_previews r
      WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND r.purchase_order_id = :id
      UNION ALL
      SELECT m.id, m.purchase_order_id, m.actor_name, CAST(m.created_at AS VARCHAR) AS created_at,
      m.action, m.action_label, CAST(NULL AS VARCHAR) AS recipient_name, CAST(NULL AS VARCHAR) AS recipient_email,
      m.detail, CAST(NULL AS VARCHAR) AS subject, 'Posted' AS state, m.row_version
      FROM purchase_order_messages m
      WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND m.purchase_order_id = :id
      ORDER BY created_at DESC, id DESC
actions:
  - { id: open_purchase_bill_matching, type: navigate, permission: accounting.write, navigate_to: /purchase/bill-matching, params: { id: '{row.id}' } }
  - { id: open_purchase_price_comparison, type: navigate, permission: purchase.read, navigate_to: /purchase/price-comparison, params: { id: '{row.id}' } }
  - { id: open_purchase_receipt, type: navigate, permission: purchase.read, navigate_to: /purchase/receipt, params: { id: '{row.receipt_id}' } }
  - { id: open_purchase_vendor_bill, type: navigate, permission: purchase.read, navigate_to: /accounting/invoice-detail, params: { id: '{row.vendor_bill_id}' } }
  - id: upload_purchase_bill
    type: upload
    action: purchase.orders.bill.upload
    handler: attachment_metadata
    permission: purchase.write
    kind: purchase_bill_attachment
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [purchase_order_detail, purchase_order_bill_uploads, purchase_order_lines]
    mutation:
      generated: [attachment_id]
      before_steps:
        - assign: true
          query: "SELECT p.vendor_name, p.name AS order_name, CAST(p.total_amount AS DECIMAL(18,2)) AS total_amount, 'BILL/UPLOAD/' || p.name AS bill_number, CAST(DATE '2026-09-22' AS VARCHAR) AS invoice_date, CAST(DATE '2026-10-22' AS VARCHAR) AS due_date, 'purchase-bill-upload-' || p.id || '-' || :attachment_id AS upload_id FROM purchase_orders p WHERE p.id = :id"
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id", status: 404, code: PURCHASE_ORDER_BILL_UPLOAD_NOT_FOUND, message: Purchase order not found. }
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND state IN ('Confirmed', 'Received') AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_BILL_UPLOAD_STALE, message: Only an unchanged confirmed purchase order can receive a bill upload. Reload before uploading. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM purchase_vendor_bills WHERE purchase_order_id = :id) AND NOT EXISTS (SELECT 1 FROM purchase_order_bill_uploads WHERE purchase_order_id = :id)", status: 409, code: PURCHASE_ORDER_BILL_UPLOAD_ALREADY_BILLED, message: This purchase order already has a vendor bill. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(:fileName, ''))) BETWEEN 1 AND 255 AND LENGTH(TRIM(COALESCE(:mimeType, ''))) BETWEEN 1 AND 160 AND COALESCE(CAST(:sizeBytes AS BIGINT), 0) BETWEEN 1 AND 5242880 AND LENGTH(TRIM(COALESCE(:storageKey, ''))) > 0", status: 422, code: PURCHASE_ORDER_BILL_UPLOAD_INVALID, message: Upload a non-empty vendor bill file no larger than 5 MB. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(:current_user_id, ''))) > 0 AND LENGTH(TRIM(COALESCE(:current_user_name, ''))) > 0", status: 403, code: PURCHASE_ORDER_BILL_UPLOAD_ACTOR_REQUIRED, message: A signed-in Purchase user is required to upload a bill. }
      steps:
        - type: service
          service: yaml.service.accounting
          operation: accounting.invoices.create_from_source
          request:
            name: bill_number
            partner_name: vendor_name
            invoice_type: Vendor Bill
            invoice_date: invoice_date
            due_date: due_date
            amount_untaxed: total_amount
            amount_total: total_amount
            amount_residual: total_amount
            reference: order_name
            source_service: purchase
            source_type: purchase_order_upload
            source_id: upload_id
          assign: true
        - query: "INSERT INTO purchase_order_bill_uploads(id, purchase_order_id, accounting_invoice_id, invoice_number, file_name, mime_type, size_bytes, storage_key, uploaded_by, state, amount, row_version) SELECT :attachment_id, :id, :accounting_invoice_id, :bill_number, :fileName, :mimeType, CAST(:sizeBytes AS BIGINT), :storageKey, :current_user_id, 'Draft', :total_amount, 1 FROM purchase_orders WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: PURCHASE_ORDER_BILL_UPLOAD_STALE
          message: The purchase order changed before its vendor bill could be attached. Reload and try again.
        - query: "INSERT INTO purchase_vendor_bills(id, purchase_order_id, accounting_invoice_id, invoice_number, state, amount, invoice_date, due_date) SELECT 'purchase-vendor-bill-upload-' || :id, :id, :accounting_invoice_id, :bill_number, 'Draft', :total_amount, CAST(:invoice_date AS DATE), CAST(:due_date AS DATE) WHERE NOT EXISTS (SELECT 1 FROM purchase_vendor_bills WHERE purchase_order_id = :id)"
          expect_changed: true
          status: 409
          code: PURCHASE_ORDER_BILL_UPLOAD_ALREADY_BILLED
          message: This purchase order already has a vendor bill.
        - query: "UPDATE purchase_orders SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: PURCHASE_ORDER_BILL_UPLOAD_STALE
          message: The purchase order changed before its vendor bill could be attached. Reload and try again.
      result: { query: "SELECT * FROM purchase_order_bill_uploads WHERE id = :attachment_id" }
  - id: preview_purchase_reminder_detail
    type: server
    permission: purchase.write
    action: purchase.orders.send_reminder_preview
    handler: yaml_mutation
    operation: create
    params: { id: '{state.purchase_order_detail.id}', expected_row_version: '{state.purchase_order_detail.row_version}' }
    refresh: [purchase_order_detail, purchase_order_email_history]
    mutation:
      operation: insert
      table: purchase_order_reminder_previews
      generated: [id]
      fields: [purchase_order_id, recipient_name, recipient_email, subject, body_html, template_label, sent_by, sent_at, row_version]
      defaults: { template_label: 'Purchase: Vendor Reminder', sent_at: '2026-09-22 09:30:00', row_version: 1 }
      before_steps:
        - assign: true
          query: "SELECT 'purchase-reminder-' || p.id || '-' || CAST((SELECT COUNT(*) + 1 FROM purchase_order_reminder_previews prior WHERE prior.purchase_order_id = p.id) AS VARCHAR) AS id, p.id AS purchase_order_id, :current_user_name AS recipient_name, :current_user_email AS recipient_email, 'Main Company (San Francisco) Order (Ref ' || p.name || ')' AS subject, '<p>Dear ' || p.vendor_name || '</p><p>Here is a reminder that the delivery of the purchase order <strong>' || p.name || '</strong> is expected for <strong>' || CAST(p.expected_date AS VARCHAR) || '</strong>.</p><p>Could you please confirm it will be delivered on time?</p><p><strong>Acknowledge</strong></p>' AS body_html, 'Purchase: Vendor Reminder' AS template_label, :current_user_name AS sent_by, TIMESTAMP '2026-09-22 09:30:00' AS sent_at, 1 AS row_version FROM purchase_orders p WHERE p.id = :id"
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id", status: 404, code: PURCHASE_ORDER_REMINDER_NOT_FOUND, message: Purchase order not found. }
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND COALESCE(receipt_reminder_email, FALSE) = TRUE AND state IN ('Draft', 'Sent', 'To Approve', 'Confirmed', 'Received') AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_REMINDER_INVALID, message: Only a current purchase order with receipt reminders enabled can send a reminder preview. Reload the order and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(:current_user_name, ''))) > 0 AND POSITION('@' IN TRIM(COALESCE(:current_user_email, ''))) > 1 AND POSITION('.' IN split_part(TRIM(COALESCE(:current_user_email, '')), '@', 2)) > 1", status: 403, code: PURCHASE_ORDER_REMINDER_ACTOR_REQUIRED, message: A signed-in user with a valid email is required to preview the reminder. }
      result: { query: "SELECT * FROM purchase_order_reminder_previews WHERE id = :id" }
  - id: send_purchase_order_detail
    type: server_form
    modal_style: mail_composer
    permission: purchase.write
    title: Compose Email
    submit_label: Send
    cancel_label: Discard
    success_message: Request for Quotation sent.
    action: purchase.orders.email.send_rfq
    handler: yaml_mutation
    operation: create
    params: { purchase_order_id: '{state.purchase_order_detail.id}' }
    prefill: source
    prefill_source: purchase_order_detail
    refresh: [purchase_order_detail, purchase_order_lines, purchase_order_email_history]
    mutation:
      operation: insert
      table: purchase_order_emails
      generated: [id]
      fields: [purchase_order_id, recipient_name, recipient_email, subject, body_html, attachment_name, template_label, state, sent_by]
      required: [purchase_order_id, recipient_name, recipient_email, subject, body_html, attachment_name]
      defaults: { state: Sent, template_label: Request for Quotation }
      before_steps:
        - assign: true
          query: "SELECT 'purchase-email-' || :purchase_order_id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS id FROM purchase_order_emails WHERE purchase_order_id = :purchase_order_id"
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :purchase_order_id", status: 404, code: PURCHASE_ORDER_EMAIL_NOT_FOUND, message: Purchase order not found. }
        - { query: "SELECT id FROM purchase_orders WHERE id = :purchase_order_id AND state IN ('Draft', 'Sent') AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_RFQ_SEND_STALE_OR_INVALID, message: Only a current RFQ can be sent. Reload the purchase order and try again. }
        - { query: "SELECT 1 AS ok FROM purchase_vendors v JOIN purchase_orders p ON p.vendor_id = v.id WHERE p.id = :purchase_order_id AND v.email IS NOT NULL AND POSITION('@' IN TRIM(CAST(:recipient_email AS VARCHAR))) > 1 AND POSITION('.' IN split_part(TRIM(CAST(:recipient_email AS VARCHAR)), '@', 2)) > 1", status: 422, code: PURCHASE_ORDER_VENDOR_EMAIL_INVALID, message: The vendor must have a valid email address before sending the RFQ. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:subject AS VARCHAR))) BETWEEN 1 AND 200 AND LENGTH(TRIM(CAST(:body_html AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:attachment_name AS VARCHAR))) BETWEEN 1 AND 255", status: 422, code: PURCHASE_ORDER_EMAIL_CONTENT_INVALID, message: A subject, message, and attachment are required. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(:current_user_name, ''))) > 0", status: 403, code: PURCHASE_ORDER_EMAIL_ACTOR_REQUIRED, message: A signed-in Purchase user is required to send the RFQ. }
      steps:
        - { query: "UPDATE purchase_order_emails SET sent_by = :current_user_name WHERE id = :id", expect_changed: true, status: 409, code: PURCHASE_ORDER_EMAIL_FAILED, message: The Request for Quotation email actor could not be recorded. }
        - { query: "UPDATE purchase_orders SET state = 'Sent', row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :purchase_order_id AND state IN ('Draft', 'Sent') AND row_version = :expected_row_version", expect_changed: true, status: 409, code: PURCHASE_ORDER_RFQ_SEND_STALE_OR_INVALID, message: This purchase order changed while sending the RFQ. Reload and try again. }
      result: { query: "SELECT * FROM purchase_order_emails WHERE id = :id" }
    fields:
      - { field: purchase_order_id, label: Purchase order, type: hidden, required: true }
      - { field: recipient_name, label: To, type: mail_recipient, required: true }
      - { field: recipient_email, label: Recipient email, type: hidden, required: true }
      - { field: subject, label: Subject, type: text, required: true }
      - { field: body_html, label: Message, type: mail_body, required: true }
      - { field: attachment_name, label: Attachments, type: mail_attachment, required: true }
  - id: send_confirmed_purchase_order_detail
    type: server_form
    modal_style: mail_composer
    permission: purchase.write
    title: Compose Email
    submit_label: Send
    cancel_label: Discard
    success_message: Purchase Order sent.
    action: purchase.orders.email.send_po
    handler: yaml_mutation
    operation: create
    params: { purchase_order_id: '{state.purchase_order_detail.id}' }
    prefill: source
    prefill_source: purchase_order_po_email_detail
    refresh: [purchase_order_detail, purchase_order_lines, purchase_order_email_history]
    mutation:
      operation: insert
      table: purchase_order_emails
      generated: [id]
      fields: [purchase_order_id, recipient_name, recipient_email, subject, body_html, attachment_name, template_label, state, sent_by]
      required: [purchase_order_id, recipient_name, recipient_email, subject, body_html, attachment_name]
      defaults: { state: Sent, template_label: Purchase Order }
      before_steps:
        - assign: true
          query: "SELECT 'purchase-email-' || :purchase_order_id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS id FROM purchase_order_emails WHERE purchase_order_id = :purchase_order_id"
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :purchase_order_id", status: 404, code: PURCHASE_ORDER_PO_EMAIL_NOT_FOUND, message: Purchase order not found. }
        - { query: "SELECT id FROM purchase_orders WHERE id = :purchase_order_id AND state IN ('Confirmed', 'Received') AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_PO_SEND_STALE_OR_INVALID, message: Only a current confirmed purchase order can be sent. Reload the purchase order and try again. }
        - { query: "SELECT 1 AS ok FROM purchase_vendors v JOIN purchase_orders p ON p.vendor_id = v.id WHERE p.id = :purchase_order_id AND v.email IS NOT NULL AND POSITION('@' IN TRIM(CAST(:recipient_email AS VARCHAR))) > 1 AND POSITION('.' IN split_part(TRIM(CAST(:recipient_email AS VARCHAR)), '@', 2)) > 1", status: 422, code: PURCHASE_ORDER_PO_VENDOR_EMAIL_INVALID, message: The vendor must have a valid email address before sending the purchase order. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:subject AS VARCHAR))) BETWEEN 1 AND 200 AND LENGTH(TRIM(CAST(:body_html AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:attachment_name AS VARCHAR))) BETWEEN 1 AND 255", status: 422, code: PURCHASE_ORDER_PO_EMAIL_CONTENT_INVALID, message: A subject, message, and attachment are required. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(COALESCE(:current_user_name, ''))) > 0", status: 403, code: PURCHASE_ORDER_PO_EMAIL_ACTOR_REQUIRED, message: A signed-in Purchase user is required to send the purchase order. }
      steps:
        - { query: "UPDATE purchase_order_emails SET sent_by = :current_user_name WHERE id = :id", expect_changed: true, status: 409, code: PURCHASE_ORDER_PO_EMAIL_FAILED, message: The Purchase Order email actor could not be recorded. }
      result: { query: "SELECT * FROM purchase_order_emails WHERE id = :id" }
    fields:
      - { field: purchase_order_id, label: Purchase order, type: hidden, required: true }
      - { field: recipient_name, label: To, type: mail_recipient, required: true }
      - { field: recipient_email, label: Recipient email, type: hidden, required: true }
      - { field: subject, label: Subject, type: text, required: true }
      - { field: body_html, label: Message, type: mail_body, required: true }
      - { field: attachment_name, label: Attachments, type: mail_attachment, required: true }
  - { id: confirm_purchase_order_detail, type: server, permission: purchase.write, action: purchase.orders.confirm, handler: order_transition, workflow: purchase_orders, operation: confirm, refresh: [purchase_order_detail] }
  - id: approve_purchase_order_detail
    type: server
    permission: purchase.manage
    action: purchase.orders.approve
