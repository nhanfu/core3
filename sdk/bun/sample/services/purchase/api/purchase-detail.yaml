    type: server
    permission: purchase.read
    action: purchase.report_purchase_quotation
    handler: yaml_mutation
    operation: print_report
    params: { id: '{state.purchase_order_detail.id}', expected_row_version: '{state.purchase_order_detail.row_version}' }
    refresh: [purchase_order_detail, purchase_order_print_runs]
    mutation:
      generated: [print_run_id]
      concurrency: { required: true }
      before_steps:
        - assign: true
          query: "SELECT 'purchase-print-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS print_run_id FROM purchase_order_print_runs WHERE purchase_order_id = :id"
      guards:
        - { query: "SELECT id FROM purchase_orders WHERE id = :id", status: 404, code: PURCHASE_ORDER_PRINT_NOT_FOUND, message: Purchase order not found. }
        - { query: "SELECT id FROM purchase_orders WHERE id = :id AND state IN ('Draft', 'Sent', 'To Approve', 'Cancelled') AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_QUOTATION_PRINT_NOT_ALLOWED, message: Only an unchanged RFQ or cancelled quotation can be printed as a quotation. Reload before printing. }
        - { query: "SELECT 1 AS ok WHERE length(trim(COALESCE(:current_user_name, ''))) > 0", status: 403, code: PURCHASE_ORDER_PRINT_ACTOR_REQUIRED, message: A signed-in Purchase user is required to print the report. }
      steps:
        - { query: "INSERT INTO purchase_order_print_runs(id, purchase_order_id, report_name, report_action, report_template, output_format, printed_by, printed_at, row_version) SELECT :print_run_id, id, 'Request for Quotation', 'purchase.report_purchase_quotation', 'purchase.report_purchasequotation', 'PDF', :current_user_name, TIMESTAMP '2026-09-21 09:00:00', 1 FROM purchase_orders WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: PURCHASE_ORDER_PRINT_FAILED, message: The Request for Quotation report could not be prepared. }
        - { query: "UPDATE purchase_orders SET state = CASE WHEN state = 'Draft' THEN 'Sent' ELSE state END, row_version = row_version + CASE WHEN state = 'Draft' THEN 1 ELSE 0 END, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND state IN ('Draft', 'Sent', 'To Approve', 'Cancelled') AND row_version = :expected_row_version", expect_changed: true, status: 409, code: PURCHASE_ORDER_QUOTATION_PRINT_STALE, message: This purchase order changed before the quotation report could be prepared. Reload before printing. }
      result: { query: "SELECT r.id, r.purchase_order_id, r.report_name, r.report_action, r.report_template, r.output_format, r.printed_by, r.row_version FROM purchase_order_print_runs r WHERE r.id = :print_run_id" }
