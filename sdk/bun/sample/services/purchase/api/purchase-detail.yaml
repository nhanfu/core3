        - { query: "SELECT id FROM purchase_order_lines WHERE id = :line_id AND order_id = :id AND display_type = 'product' AND row_version = :expected_row_version", status: 409, code: PURCHASE_ORDER_LINE_STALE, message: This product line changed or was deleted. Reload before deleting. }
