page: { id: purchase-product-categories }
datasources:
  - id: purchase_product_categories
    permission: purchase.read
    query: "SELECT id, row_version, name, parent_name, product_count FROM purchase_product_categories WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR parent_name ILIKE '%' || :q || '%') ORDER BY name, id"
actions:
  - id: view_purchase_product_category
    type: navigate
    permission: purchase.read
    navigate_to: /purchase/product-categories/detail
    params: { id: '{row.id}' }
  - id: create_purchase_product_category
    type: server_form
    permission: purchase.write
    title: New Product Category
    action: purchase.product_categories.create
    handler: yaml_mutation
    operation: create
    refresh: [purchase_product_categories]
    mutation:
      operation: insert
      table: purchase_product_categories
      fields: [name, parent_name, force_removal_strategy, packaging_reserve_method, costing_method, inventory_valuation]
      required: [name]
      defaults: { parent_name: '', force_removal_strategy: '', packaging_reserve_method: partial, costing_method: Standard Price, inventory_valuation: Periodic (at closing), product_count: 0 }
      guards:
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM purchase_product_categories WHERE LOWER(name) = LOWER(:name))", status: 409, code: PURCHASE_PRODUCT_CATEGORY_EXISTS, message: A product category with this name already exists. }
      result: { query: "SELECT * FROM purchase_product_categories WHERE id = :id" }
    fields:
      - { field: name, label: Category, type: text, required: true }
      - { field: parent_name, label: Parent Category, type: text }
      - { field: force_removal_strategy, label: Force Removal Strategy?, type: text }
      - { field: packaging_reserve_method, label: Reserve Packagings?, type: text, default: partial }
      - { field: costing_method, label: Costing Method?, type: text, default: Standard Price }
      - { field: inventory_valuation, label: Inventory Valuation?, type: text, default: Periodic (at closing) }
