page: { id: purchase-orders }
datasources:
  - id: purchase_order_states
    permission: purchase.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Sent','Sent'), ('To Approve','To Approve'), ('Confirmed','Confirmed'), ('Received','Received'), ('Cancelled','Cancelled')) states(value, label)"
  - id: purchase_vendor_lookup_orders
    permission: purchase.read
    query: "SELECT id AS value, name AS label FROM purchase_vendors WHERE state = 'Active' ORDER BY name"
  - id: purchase_orders
    permission: purchase.read
    workflow: purchase_orders
    query: "SELECT p.id, p.row_version, p.name, p.vendor_id, p.vendor_name, p.product_name, p.quantity, p.qty_received, p.unit_price, p.state, CAST(p.order_date AS VARCHAR) AS order_date, CAST(p.order_date AS VARCHAR) AS confirmation_date, CAST(p.expected_date AS VARCHAR) AS expected_date, CAST(p.expected_date AS VARCHAR) AS expected_arrival, p.reference, p.currency, 'Main Company (San Francisco)' AS company_name, p.buyer_name, CASE WHEN p.state IN ('Confirmed', 'Received') THEN 'Nothing to Bill' ELSE 'To Bill' END AS billing_status, p.total_amount, printf('%s %,.2f', p.currency, CAST(p.total_amount AS DOUBLE)) AS total_amount_display, CASE p.state WHEN 'Confirmed' THEN 'todo' WHEN 'Received' THEN 'document' ELSE 'email' END AS activity_type, CASE p.state WHEN 'Confirmed' THEN 'Review receipt' WHEN 'Received' THEN 'Match vendor bill' ELSE 'Review purchase order' END AS activity_summary, CAST(p.expected_date AS VARCHAR) AS activity_date, p.buyer_name AS activity_user, CASE p.state WHEN 'Received' THEN 'done' ELSE 'planned' END AS activity_state, 1 AS activity_count FROM purchase_orders p WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND p.order_type = 'purchase' AND (:q IS NULL OR p.name ILIKE '%' || :q || '%' OR p.vendor_name ILIKE '%' || :q || '%' OR p.product_name ILIKE '%' || :q || '%') AND (:state IS NULL OR p.state = :state) AND (:vendor_id IS NULL OR p.vendor_id = :vendor_id) ORDER BY p.order_date DESC, p.created_at DESC"
actions:
  - id: create_purchase_order
    type: server_form
    permission: purchase.write
    title: New purchase order
    action: purchase.orders.create
    handler: yaml_mutation
    operation: create
    refresh: [purchase_orders]
    mutation:
      operation: insert
      table: purchase_orders
      fields: [name, vendor_id, vendor_name, product_name, quantity, unit_price, order_date, expected_date, reference, order_type]
      required: [name, vendor_id, vendor_name, product_name, quantity]
      defaults: { state: Draft, qty_received: 0, order_type: purchase, currency: USD, buyer_name: Mitchell Admin }
      guards: [{ query: "SELECT 1 AS ok WHERE CAST(:quantity AS DECIMAL(18,3)) > 0 AND EXISTS (SELECT 1 FROM purchase_vendors WHERE id = :vendor_id AND state = 'Active')", status: 400, message: An order needs an active vendor and a positive quantity }]
      result: { query: "SELECT * FROM purchase_orders WHERE id = :id" }
    fields:
      - { field: name, label: Purchase order, type: text, required: true }
      - { field: vendor_id, label: Vendor, type: select, options_source: purchase_vendor_lookup_orders, required: true }
      - { field: vendor_name, label: Vendor name, type: text, required: true }
      - { field: product_name, label: Product, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true }
      - { field: unit_price, label: Unit price, type: number }
      - { field: order_date, label: Order date, type: text }
      - { field: expected_date, label: Expected date, type: text }
      - { field: reference, label: Reference, type: text }
  - { id: send_purchase_order, type: server, permission: purchase.write, action: purchase.orders.send, handler: order_transition, workflow: purchase_orders, operation: send, refresh: [purchase_orders] }
  - { id: confirm_purchase_order, type: server, permission: purchase.write, action: purchase.orders.confirm, handler: order_transition, workflow: purchase_orders, operation: confirm, refresh: [purchase_orders] }
  - { id: receive_purchase_order, type: server, permission: purchase.write, action: purchase.orders.receive, handler: order_transition, workflow: purchase_orders, operation: receive, refresh: [purchase_orders] }
  - { id: cancel_purchase_order, type: server, permission: purchase.write, action: purchase.orders.cancel, handler: order_transition, workflow: purchase_orders, operation: cancel, refresh: [purchase_orders] }
