workflow:
  id: purchase_vendors
  entity: purchase_vendors
  handler: order_transition
  initial: Active
  permission: purchase.manage
  mutable: true
  status_source: purchase_vendor_states
  states:
    - { id: Active, label: Active, color: green }
    - { id: Inactive, label: Inactive, color: neutral, terminal: true }
  transitions:
    - id: archive
      from: [Active]
      to: Inactive
      permission: purchase.manage
      mutation:
        guards:
          - { query: "SELECT id FROM purchase_vendors WHERE id = :id AND state = 'Active'", status: 409, code: PURCHASE_VENDOR_NOT_ACTIVE, message: Only active vendors can be archived. }
          - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM purchase_orders WHERE vendor_id = :id AND state <> 'Cancelled')", status: 409, code: PURCHASE_VENDOR_HAS_OPEN_ORDERS, message: A vendor with open purchase orders cannot be archived. }
        steps: [{ query: "UPDATE purchase_vendors SET state = 'Inactive', row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id" }]
        result: { query: "SELECT * FROM purchase_vendors WHERE id = :id" }
    - id: restore
      from: [Inactive]
      to: Active
      permission: purchase.manage
      mutation:
        guards: [{ query: "SELECT id FROM purchase_vendors WHERE id = :id AND state = 'Inactive'", status: 409, code: PURCHASE_VENDOR_NOT_INACTIVE, message: Only inactive vendors can be restored. }]
        steps: [{ query: "UPDATE purchase_vendors SET state = 'Active', row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id" }]
        result: { query: "SELECT * FROM purchase_vendors WHERE id = :id" }
