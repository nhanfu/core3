title: Products
page: { id: purchase-products, route: /purchase/products, breadcrumb: [Supply Chain, Purchase, Products], auth: { require: [purchase.read] } }
components:
  - type: ListView
    variant: odoo
    source: purchase_products
    create_action: create_purchase_product
    create_label: New product
    search: { label: Search products, placeholder: Search products by name or internal reference... }
    filters: [{ field: purchase_ok, label: Purchase, options_source: purchase_product_purchase_states }]
    view_navigation: tabs
    views:
      - { id: kanban, label: Kanban, icon: dashboard, mobile: false, group_by: category, card: { title: name, subtitle: default_code, fields: [{ field: cost_price_display, label: Cost }, { field: category, label: Category }] } }
      - { id: list, label: List, icon: table, mobile: false }
      - { id: card, label: Cards, icon: grid, mobile: true, card: { title: name, subtitle: default_code, fields: [{ field: cost_price_display, label: Cost }, { field: uom, label: Unit of Measure }] } }
      - { id: activity, label: Activity, icon: activity, mobile: false, title_field: name, subtitle_field: default_code, record_date_field: created_at, activity_types: [{ id: todo, label: To-Do, icon: ✓ }, { id: document, label: Document, icon: ▣ }] }
    columns:
      - { field: name, label: Product Name, type: PrimaryEntityCell, sortable: true }
      - { field: default_code, label: Internal Reference, sortable: true }
      - { field: product_tags, label: Tags }
      - { field: barcode, label: Barcode }
      - { field: company_name, label: Company }
      - { field: cost_price_display, label: Cost, align: right }
      - { field: category, label: Category }
      - { field: product_type, label: Type }
      - { field: uom, label: Unit of Measure }
      - { field: active, label: Active, type: StatusChip }
    page_size: 80
    row_key: id
    selectable: true
    row_actions: menu
    actions:
      - { id: archive_purchase_product, label: Archive, permission: purchase.write, variant: danger, show_if: "row.active === true" }
    empty_state: { title: No products found, description: 'Create a product for everything you purchase, whether it is a storable product, consumable, or service.' }
