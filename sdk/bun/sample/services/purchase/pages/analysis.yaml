title: Purchase Analysis
page: { id: purchase-analysis, route: /purchase-analysis, breadcrumb: [Supply Chain, Purchase, Analysis], auth: { require: [purchase.read] } }
components:
  - type: StatRow
    source: purchase_analysis_totals
    title: Purchasing performance
    stats: [{ label: Orders, field: order_count }, { label: Ordered units, field: ordered_units }, { label: Received units, field: received_units }, { label: Committed value, field: committed_value }]
  - type: ListView
    variant: odoo
    source: purchase_analysis_report
    search: { label: Search purchase analysis, placeholder: 'Search by order, vendor, product, or buyer...' }
    group_by:
      - { field: vendor_name, label: Vendor }
      - { field: buyer_name, label: Buyer }
      - { field: product_name, label: Product }
      - { field: order_month, label: Order Month }
      - { field: state, label: Status }
    view_navigation: tabs
    views:
      - id: list
        label: List
        icon: table
      - id: pivot
        label: Pivot
        icon: pivot
        mobile: false
        pivot:
          config_label: Measures
          fields:
            - { field: vendor_name, column: Vendor }
            - { field: buyer_name, column: Buyer }
            - { field: product_name, column: Product }
            - { field: order_month, column: Month, type: date }
            - { field: state, column: Status }
            - { field: ordered_quantity, column: Ordered Qty }
            - { field: received_quantity, column: Received Qty }
            - { field: billed_quantity, column: Billed Qty }
            - { field: untaxed_total, column: Untaxed Total }
            - { field: total_amount, column: Total }
          default:
            rows: [vendor_name]
            columns: [order_month]
            measures:
              - { field: ordered_quantity, aggregate: sum, column: Ordered Qty }
              - { field: received_quantity, aggregate: sum, column: Received Qty }
              - { field: untaxed_total, aggregate: sum, column: Untaxed Total }
              - { field: total_amount, aggregate: sum, column: Total }
          date_ranges: { order_month: month }
      - id: graph
        label: Graph
        icon: graph
        category_field: vendor_name
        measure_field: total_amount
        type: bar
    columns:
      - { field: order_reference, label: Reference, type: PrimaryEntityCell }
      - { field: order_date, label: Order Date }
      - { field: vendor_name, label: Vendor }
      - { field: buyer_name, label: Buyer }
      - { field: product_name, label: Product }
      - { field: ordered_quantity, label: Ordered Qty, align: right }
      - { field: received_quantity, label: Received Qty, align: right }
      - { field: billed_quantity, label: Billed Qty, align: right }
      - { field: total_amount, label: Total, align: right }
      - { field: state, label: Status, type: StatusChip }
    page_size: 25
    row_key: id
    empty_state: { title: No purchase analysis data, description: Purchase orders matching the current search or fixture are shown here. }
