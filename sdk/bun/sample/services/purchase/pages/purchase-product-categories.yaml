title: Categories
page: { id: purchase-product-categories, route: /purchase/product-categories, breadcrumb: [Supply Chain, Purchase, Configuration, Categories], auth: { require: [purchase.read] } }
components:
  - type: ListView
    variant: odoo
    source: purchase_product_categories
    create_action: create_purchase_product_category
    create_label: New
    search: { label: Search categories, placeholder: Search... }
