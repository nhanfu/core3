title: Purchase History
page: { id: purchase-product-history, route: /purchase/products/history, breadcrumb: [Supply Chain, Purchase, Products, Purchase History], auth: { require: [purchase.read] } }
components:
  - type: ListView
    variant: odoo
    source: purchase_product_history
    search: { label: Search purchase history, placeholder: 'Search orders, vendors, or products...' }
    date_range: { label: Order Date, from_field: order_date, to_field: order_date }
    group_by: [{ field: product_name, label: Product }, { field: vendor_name, label: Vendor }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields:
            - { field: product_name, column: Product }
            - { field: order_name, column: Order Reference }
            - { field: order_date, column: Order Date, type: date }
            - { field: confirmation_date, column: Confirmation Date, type: date }
            - { field: vendor_name, column: Vendor }
            - { field: company_name, column: Company }
            - { field: quantity, column: Total Qty purchased }
            - { field: total_untaxed, column: Total purchased amount }
          default:
            rows: [product_name, order_name]
            columns: []
            measures:
              - { field: total_untaxed, aggregate: sum, column: Total purchased amount }
              - { field: quantity, aggregate: sum, column: Total Qty purchased }
      - { id: graph, label: Graph, icon: graph, category_field: order_date, measure_field: quantity, type: line }
    columns:
      - { field: order_name, label: Order Reference, type: PrimaryEntityCell, sortable: true }
      - { field: confirmation_date, label: Confirmation Date }
      - { field: vendor_name, label: Vendor }
      - { field: company_name, label: Company }
      - { field: quantity, label: Quantity, align: right }
      - { field: unit_price_display, label: Unit Price, align: right }
      - { field: total_untaxed_display, label: Total Untaxed, align: right }
    page_size: 50
    row_key: id
    empty_state: { title: No purchase history, description: No purchase orders were made for this product yet! }
