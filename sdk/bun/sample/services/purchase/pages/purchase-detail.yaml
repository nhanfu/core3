title: Purchase Order
page: { id: purchase-detail, route: /purchase/detail, breadcrumb: [Supply Chain, Purchase, Purchase Order], auth: { require: [purchase.read] } }
components:
  - type: OdooFormView
    source: purchase_order_detail
    attachment_source: purchase_order_bill_uploads
    attachment_panel_open: true
    attachment_label: Vendor bill
    add_attachment_label: Upload Bill
    no_attachments_label: No vendor bill uploaded
    uploading_label: Uploading bill…
    upload_failed_label: Bill upload failed
    attachment_accept: application/pdf,image/*,.pdf,.jpg,.jpeg,.png
    attachment_upload_action: upload_purchase_bill
    title_field: name
    subtitle_field: vendor_name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: Sent, label: Sent }, { value: To Approve, label: To Approve }, { value: Confirmed, label: Confirmed }, { value: Received, label: Received }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, Sent: amber, 'To Approve': amber, Confirmed: blue, Received: green, Cancelled: red }
    stat_buttons:
      - { id: open_purchase_bill_matching, label: Bill Matching, value_field: line_count, hide_value: true, permission: accounting.write, show_if: "state.purchase_order_detail.state === 'Confirmed' || state.purchase_order_detail.state === 'Received'" }
      - { id: open_purchase_price_comparison, label: Price Comparison, value_field: line_count, hide_value: true, permission: purchase.read, show_if: "state.purchase_order_detail.state === 'Confirmed' || state.purchase_order_detail.state === 'Received'" }
      - { id: open_purchase_receipt, label: Receipt, value_field: receipt_count, permission: purchase.read, show_if: "(state.purchase_order_detail.state === 'Confirmed' || state.purchase_order_detail.state === 'Received') && state.purchase_order_detail.receipt_count > 0" }
      - { id: open_purchase_vendor_bill, label: Vendor Bills, value_field: vendor_bill_count, permission: purchase.read, show_if: "(state.purchase_order_detail.state === 'Confirmed' || state.purchase_order_detail.state === 'Received') && state.purchase_order_detail.vendor_bill_count > 0" }
    header_actions:
      - { id: send_purchase_order_detail, label: Send RFQ, variant: primary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Draft' || state.purchase_order_detail.state === 'Sent'" }
      - { id: send_confirmed_purchase_order_detail, label: Send PO, variant: primary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Confirmed' || state.purchase_order_detail.state === 'Received'" }
      - { id: upload_purchase_bill, label: Upload Bill, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Confirmed' || state.purchase_order_detail.state === 'Received'" }
      - { id: preview_purchase_reminder_detail, label: Send Reminder, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.receipt_reminder_email && state.purchase_order_detail.state !== 'Cancelled'" }
      - { id: confirm_purchase_order_detail, label: Confirm Order, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Sent'" }
      - { id: approve_purchase_order_detail, label: Approve Order, variant: primary, permission: purchase.manage, show_if: "state.purchase_order_detail.state === 'To Approve'" }
      - { id: receive_purchase_order_detail, label: Receive, variant: primary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Confirmed'" }
      - { id: acknowledge_purchase_order_detail, label: Acknowledge, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Confirmed' && !state.purchase_order_detail.acknowledged" }
      - { id: lock_purchase_order_detail, label: Lock, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Confirmed' && !state.purchase_order_detail.locked" }
      - { id: unlock_purchase_order_detail, label: Unlock, variant: secondary, permission: purchase.manage, show_if: "state.purchase_order_detail.locked" }
      - { id: print_purchase_quotation_detail, label: Print, variant: secondary, permission: purchase.read, show_if: "state.purchase_order_detail.state === 'Draft' || state.purchase_order_detail.state === 'Sent' || state.purchase_order_detail.state === 'To Approve' || state.purchase_order_detail.state === 'Cancelled'" }
      - { id: print_purchase_order_detail, label: Print, variant: secondary, permission: purchase.read, show_if: "state.purchase_order_detail.state === 'Confirmed' || state.purchase_order_detail.state === 'Received'" }
      - { id: cancel_purchase_order_detail, label: Cancel, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Draft' || state.purchase_order_detail.state === 'Sent' || state.purchase_order_detail.state === 'Confirmed'" }
      - { id: reset_purchase_order_detail, label: Set to Draft, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Cancelled'" }
    editable: true
    group_columns: 2
    groups:
      - title: Vendor
        fields: [{ field: vendor_name, label: Vendor }, { field: contact_name, label: Contact }, { field: reference, label: Vendor reference }, { field: currency, label: Currency }, { field: company_name, label: Company }]
      - title: Order details
        fields: [{ field: name, label: Purchase order }, { field: buyer_name, label: Buyer }, { field: confirmation_date, label: Confirmation date }, { field: expected_arrival, label: Expected arrival }, { field: billing_status, label: Billing status }, { field: state, label: Status }, { field: receipt_reminder_email, label: Ask confirmation, type: checkbox, readonly: true }, { field: reminder_date_before_receipt, label: Days before receipt, type: number, readonly: true }]
    notebook:
      active: products
      tabs:
        - { id: products, label: Products, content_slot: true }
        - id: other_information
          label: Other Information
          groups:
            - title: Other Information
              fields: [{ field: notes, label: Notes, type: textarea, wide: true }, { field: locked, label: Locked }, { field: acknowledged, label: Acknowledged }]
    message_source: purchase_order_email_history
    chatter_label: Chatter
    chatter_empty: No messages or activities yet.
    message_label: Send message
    message_action: send_purchase_order_message
    message_placeholder: Send a message to purchase order followers…
    note_label: Log note
    note_action: log_purchase_order_note
    note_placeholder: Log an internal note…
    message_actor_field: actor_name
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
    follower_source: purchase_order_followers
    follower_candidates_source: purchase_order_follower_candidates
    follower_candidates_page_size: 100
    follower_label: Followers
    add_follower_label: Add Followers
    remove_follower_label: Remove follower
    no_followers_label: No followers
    follower_search_placeholder: Select a follower
    follower_add_action: add_purchase_order_follower
    follower_remove_action: remove_purchase_order_follower
  - type: LineItemGrid
    mount_in: previous-panel
    source: purchase_order_lines
    parent_source: purchase_order_detail
    title: Products
    variant: odoo_x2many
    page_size: 50
    row_key: id
    actions:
      - { id: add_purchase_order_line, label: Add a product, variant: primary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Draft' || state.purchase_order_detail.state === 'Sent'" }
      - { id: add_purchase_order_section, label: Add a section, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Draft' || state.purchase_order_detail.state === 'Sent'" }
      - { id: add_purchase_order_note, label: Add a note, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Draft' || state.purchase_order_detail.state === 'Sent'" }
      - { id: add_purchase_order_catalog, label: Catalog, variant: secondary, permission: purchase.write, show_if: "state.purchase_order_detail.state === 'Draft' || state.purchase_order_detail.state === 'Sent'" }
    empty_state: { title: No order lines, description: Add a product to calculate the purchase total. }
    footer:
      source: purchase_order_detail
      stats:
        - { label: Total, field: total_amount_display }
    children:
      - { type: LineItemField, id: product_name, field: product_name, label: Product, input_type: text, required: true }
      - { type: LineItemField, id: description, field: description, label: Description, input_type: text, required: true }
      - { type: LineItemField, id: quantity, field: quantity, display_field: quantity_display, label: Quantity, input_type: number, required: true }
      - { type: LineItemField, id: uom, field: uom, label: Unit, input_type: text, required: true }
      - { type: LineItemField, id: unit_price, field: unit_price, display_field: unit_price_display, label: Unit Price, input_type: money, required: true }
      - { type: LineItemField, id: tax_rate, field: tax_rate, display_field: tax_rate_display, label: Taxes, input_type: number, decimals: 2 }
      - { type: LineItemField, id: line_total, field: line_total, display_field: line_total_display, label: Amount, readonly: true }
      - type: LineItemActions
        id: purchase_order_line_actions
        edit_action: edit_purchase_order_line
        create_action: add_purchase_order_line
        actions:
          - { id: edit_purchase_order_line, label: Edit, icon: edit, variant: ghost, permission: purchase.write, show_if: "(row.display_type === 'product' || !row.display_type) && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: edit_purchase_order_section, label: Edit, icon: edit, variant: ghost, permission: purchase.write, show_if: "row.display_type === 'line_section' && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: edit_purchase_order_note, label: Edit, icon: edit, variant: ghost, permission: purchase.write, show_if: "row.display_type === 'line_note' && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: delete_purchase_order_line, label: Delete, icon: trash, variant: danger, permission: purchase.write, show_if: "(row.display_type === 'product' || !row.display_type) && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: delete_purchase_order_section, label: Delete, icon: trash, variant: danger, permission: purchase.write, show_if: "row.display_type === 'line_section' && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: delete_purchase_order_note, label: Delete, icon: trash, variant: danger, permission: purchase.write, show_if: "row.display_type === 'line_note' && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
    columns:
      - { field: product_name, label: Product, width: 260 }
      - { field: description, label: Description, width: 260 }
      - { field: quantity_display, label: Quantity, align: right, width: 120 }
      - { field: uom, label: Unit, width: 110 }
      - { field: unit_price_display, label: Unit Price, align: right, width: 140 }
      - { field: tax_rate_display, label: Taxes, align: right, width: 100 }
      - { field: line_total_display, label: Amount, align: right, width: 150 }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: edit_purchase_order_line, label: Edit, icon: edit, variant: ghost, permission: purchase.write, show_if: "(row.display_type === 'product' || !row.display_type) && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: edit_purchase_order_section, label: Edit, icon: edit, variant: ghost, permission: purchase.write, show_if: "row.display_type === 'line_section' && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: delete_purchase_order_line, label: Delete, icon: trash, variant: danger, permission: purchase.write, show_if: "(row.display_type === 'product' || !row.display_type) && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: delete_purchase_order_section, label: Delete, icon: trash, variant: danger, permission: purchase.write, show_if: "row.display_type === 'line_section' && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: edit_purchase_order_note, label: Edit, icon: edit, variant: ghost, permission: purchase.write, show_if: "row.display_type === 'line_note' && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
          - { id: delete_purchase_order_note, label: Delete, icon: trash, variant: danger, permission: purchase.write, show_if: "row.display_type === 'line_note' && (row.parent_state === 'Draft' || row.parent_state === 'Sent')" }
