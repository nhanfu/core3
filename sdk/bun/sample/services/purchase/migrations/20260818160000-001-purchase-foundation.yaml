version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS purchase_vendors (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL, email VARCHAR,
        phone VARCHAR, state VARCHAR NOT NULL DEFAULT 'Active', payment_terms VARCHAR,
        row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS purchase_orders (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        vendor_id VARCHAR NOT NULL, vendor_name VARCHAR NOT NULL, product_name VARCHAR NOT NULL,
        quantity DECIMAL(18,3) NOT NULL, qty_received DECIMAL(18,3) NOT NULL DEFAULT 0,
        unit_price DECIMAL(18,2) NOT NULL DEFAULT 0, state VARCHAR NOT NULL DEFAULT 'Draft',
        order_date DATE, expected_date DATE, reference VARCHAR, row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS purchase_orders_vendor_idx ON purchase_orders(vendor_id);
      CREATE INDEX IF NOT EXISTS purchase_orders_state_idx ON purchase_orders(state);
    down: |
      DROP TABLE IF EXISTS purchase_orders;
      DROP TABLE IF EXISTS purchase_vendors;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
