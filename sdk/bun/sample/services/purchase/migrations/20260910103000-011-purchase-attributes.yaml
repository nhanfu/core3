version: 0.0.11
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS purchase_product_attributes (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE,
        display_type VARCHAR NOT NULL DEFAULT 'Radio',
        variant_creation VARCHAR NOT NULL DEFAULT 'Instantly',
        values_count INTEGER NOT NULL DEFAULT 0,
        active BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
      CREATE TABLE IF NOT EXISTS purchase_product_attribute_values (
        id VARCHAR PRIMARY KEY,
        attribute_id VARCHAR NOT NULL,
        sequence INTEGER NOT NULL DEFAULT 10,
        value VARCHAR NOT NULL,
        free_text BOOLEAN NOT NULL DEFAULT false,
        price_extra DECIMAL(18,2) NOT NULL DEFAULT 0,
        row_version BIGINT NOT NULL DEFAULT 1,
        active BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        UNIQUE(attribute_id, value)
      );
      CREATE INDEX IF NOT EXISTS purchase_product_attributes_name_idx ON purchase_product_attributes(name);
      CREATE INDEX IF NOT EXISTS purchase_product_attribute_values_attribute_idx ON purchase_product_attribute_values(attribute_id, sequence, id);
