      CREATE TABLE IF NOT EXISTS purchase_bill_line_matches (
        id VARCHAR PRIMARY KEY,
        purchase_order_id VARCHAR NOT NULL,
        row_version BIGINT NOT NULL DEFAULT 1,
        sequence INTEGER NOT NULL,
        source_kind VARCHAR NOT NULL,
        reference VARCHAR NOT NULL,
        product_description VARCHAR NOT NULL,
        quantity DECIMAL(18,3) NOT NULL DEFAULT 0,
        qty_to_invoice DECIMAL(18,3) NOT NULL DEFAULT 0,
        unit VARCHAR NOT NULL DEFAULT 'Units',
        price DECIMAL(18,2) NOT NULL DEFAULT 0,
        billed_amount DECIMAL(18,2),
        purchased_amount DECIMAL(18,2),
        match_key VARCHAR NOT NULL,
        matched BOOLEAN NOT NULL DEFAULT false,
        added_to_po BOOLEAN NOT NULL DEFAULT false,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS purchase_bill_line_matches_order_idx ON purchase_bill_line_matches(purchase_order_id, sequence);
