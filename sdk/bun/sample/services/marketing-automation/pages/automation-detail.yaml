title: Marketing Automation
page: { id: automation-detail, route: /automations/detail, breadcrumb: [Marketing, Marketing Automation, Detail], auth: { require: [marketing_automation.read] } }
components:
  - type: OdooFormView
    source: automation_detail
    title_field: name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: Published, label: Published }, { value: Running, label: Running }, { value: Completed, label: Completed }, { value: Paused, label: Paused }]
    status_colors: { Draft: neutral, Published: blue, Running: amber, Completed: green, Paused: red }
    group_columns: 2
    groups:
      - title: Journey
        fields: [{ field: name, label: Automation }, { field: state, label: Status }, { field: trigger_type, label: Trigger }, { field: trigger_definition, label: Trigger definition }, { field: action_type, label: Action }, { field: action_definition, label: Action definition }]
      - title: Audience
        fields: [{ field: audience_description, label: Audience }, { field: enrollment_count, label: Enrolled }, { field: completed_count, label: Completed }, { field: active, label: Active }, { field: published_at, label: Published at }]
    header_actions:
      - { id: edit_automation_detail, label: Edit, permission: marketing_automation.write, variant: secondary, show_if: "state.automation_detail.active === true" }
      - { id: enroll_contact, label: Enroll contact, permission: marketing_automation.write, variant: primary, show_if: "state.automation_detail.state === 'Published' || state.automation_detail.state === 'Running'" }
      - { id: archive_automation_detail, label: Archive, permission: marketing_automation.manage, variant: danger, show_if: "state.automation_detail.active === true" }
      - { id: restore_automation_detail, label: Restore, permission: marketing_automation.manage, variant: secondary, show_if: "state.automation_detail.active === false" }
      - { id: delete_automation_detail, label: Delete, permission: marketing_automation.manage, variant: danger, show_if: "state.automation_detail.state === 'Draft' && state.automation_detail.enrollment_count === 0" }
  - type: ContactGrid
    source: automation_enrollments
    row_key: id
    title: Enrolled contacts
    columns:
      - { field: contact_name, label: Contact, type: PrimaryEntityCell }
      - { field: contact_email, label: Email }
      - { field: state, label: Status, type: StatusChip }
      - { field: result, label: Result }
      - { field: enrolled_at, label: Enrolled at }
      - { field: completed_at, label: Completed at }
