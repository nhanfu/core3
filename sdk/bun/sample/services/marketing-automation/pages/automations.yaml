title: Marketing Automations
page: { id: automations, route: /automations, breadcrumb: [Marketing, Marketing Automation], auth: { require: [marketing_automation.read] } }
components:
  - type: ListView
    variant: odoo
    source: marketing_automations
    create_action: create_automation
    create_label: New automation
    search: { label: Search automations, placeholder: 'Search journey, trigger, or action...' }
    filters:
      - { field: state, label: Status, options_source: automation_states }
      - { field: active, label: Records, options: [{ id: 'true', label: Active }, { id: 'false', label: Archived }] }
    group_by: [{ field: state, label: Status }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - { id: kanban, label: Kanban, icon: dashboard, group_by: state, groups_source: automation_states, card: { title: name, subtitle: audience_description, fields: [{ field: trigger_type, label: Trigger }, { field: action_type, label: Action }, { field: enrollment_count, label: Enrolled }], footer: [{ field: state, label: Status }] } }
      - { id: form, label: Form, icon: form, mobile: false }
    columns:
      - { field: name, label: Automation, type: PrimaryEntityCell, mobile: true }
      - { field: trigger_type, label: Trigger, mobile: false }
      - { field: action_type, label: Action, mobile: false }
      - { field: audience_description, label: Audience, mobile: false }
      - { field: enrollment_count, label: Enrolled, align: right, mobile: false }
      - { field: completed_count, label: Completed, align: right, mobile: false }
      - { field: state, label: Status, type: StatusChip, colors: { Draft: neutral, Published: blue, Running: amber, Completed: green, Paused: red }, mobile: true }
    page_size: 50
    row_key: id
    row_open_action: view_automation
    row_double_click_action: view_automation
    row_actions: menu
    form_view: { page: apps/services/marketing-automation/pages/automation-detail.yaml, side_panel: true }
    actions:
      - { id: publish_automation, label: Publish, permission: marketing_automation.write, variant: primary, show_if: "row.state === 'Draft'" }
      - { id: run_automation, label: Run, permission: marketing_automation.write, variant: secondary, show_if: "row.state === 'Published' || row.state === 'Paused'" }
      - { id: complete_automation, label: Complete, permission: marketing_automation.manage, variant: primary, show_if: "row.state === 'Running'" }
      - { id: pause_automation, label: Pause, permission: marketing_automation.write, variant: danger, show_if: "row.state === 'Published' || row.state === 'Running'" }
      - { id: archive_automation, label: Archive, permission: marketing_automation.manage, variant: danger, show_if: "row.active === true" }
      - { id: restore_automation, label: Restore, permission: marketing_automation.manage, variant: secondary, show_if: "row.active === false" }
      - { id: delete_automation, label: Delete, permission: marketing_automation.manage, variant: danger, show_if: "row.state === 'Draft' && row.enrollment_count === 0" }
