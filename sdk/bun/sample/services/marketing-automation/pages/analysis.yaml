title: Automation Analysis
page: { id: automation-analysis, route: /automation-analysis, breadcrumb: [Marketing, Marketing Automation, Analysis], auth: { require: [marketing_automation.read] } }
components:
  - type: StatRow
    source: automation_analysis_totals
    title: Automation performance
    stats: [{ label: Automations, field: automation_count }, { label: Enrollments, field: enrollments }, { label: Completed, field: completed }, { label: Running, field: running_count }]
  - type: Chart
    source: automation_analysis_states
    title: Automations by status
    label_field: category
    value_field: automation_count
    variant: bar
