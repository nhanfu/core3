page: { id: automation-detail }
datasources:
  - id: automation_detail
    single: true
    permission: marketing_automation.read
    error_states: { transport_error: { status: 503, code: MARKETING_AUTOMATION_DETAIL_UNAVAILABLE, message: This automation is temporarily unavailable. } }
    query: "SELECT id, row_version, name, trigger_type, trigger_definition, action_type, action_definition, audience_description, enrollment_count, completed_count, state, active, CAST(published_at AS VARCHAR) AS published_at FROM marketing_automations WHERE id = :id"
  - id: automation_enrollments
    permission: marketing_automation.read
    query: "SELECT id, row_version, contact_name, contact_email, state, result, CAST(enrolled_at AS VARCHAR) AS enrolled_at, CAST(completed_at AS VARCHAR) AS completed_at FROM automation_enrollments WHERE automation_id = :id ORDER BY enrolled_at DESC, id"
actions:
  - id: edit_automation_detail
    type: server_form
    permission: marketing_automation.write
    title: Edit marketing automation
    action: marketing_automation.records.update
    handler: yaml_mutation
    operation: update
    prefill: state.automation_detail
    refresh: [automation_detail, marketing_automations]
    mutation:
      operation: update
      table: marketing_automations
      fields: [name, trigger_type, trigger_definition, action_type, action_definition, audience_description]
      required: [name, trigger_type, action_type]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM marketing_automations WHERE id = :id AND active = TRUE", status: 404, code: MARKETING_AUTOMATION_NOT_FOUND, message: Active automation not found. }
        - { query: "SELECT 1 AS ok FROM marketing_automations WHERE id = :id AND state IN ('Draft', 'Published', 'Paused')", status: 409, code: MARKETING_AUTOMATION_IMMUTABLE, message: Running or completed automations cannot be edited. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:trigger_type AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:action_type AS VARCHAR))) > 0", status: 422, code: MARKETING_AUTOMATION_REQUIRED_FIELDS, message: A name, trigger, and action are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM marketing_automations WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: MARKETING_AUTOMATION_EXISTS, message: An automation with this name already exists. }
      result: { query: "SELECT * FROM marketing_automations WHERE id = :id" }
    fields:
      - { field: name, label: Automation, type: text, required: true }
      - { field: trigger_type, label: Trigger, type: text, required: true }
      - { field: trigger_definition, label: Trigger definition, type: textarea }
      - { field: action_type, label: Action, type: text, required: true }
      - { field: action_definition, label: Action definition, type: textarea }
      - { field: audience_description, label: Audience, type: text }
  - id: enroll_contact
    type: server_form
    permission: marketing_automation.write
    title: Enroll contact
    action: marketing_automation.enrollments.create
    handler: yaml_mutation
    operation: enroll
    refresh: [automation_detail, automation_enrollments, marketing_automations]
    mutation:
      operation: insert
      table: automation_enrollments
      fields: [automation_id, automation_name, contact_name, contact_email]
      required: [automation_id, contact_name, contact_email]
      defaults: { state: Enrolled, row_version: 1 }
      generated: [id]
      guards:
        - { query: "SELECT a.name AS automation_name, 'automation-enrollment-' || a.id || '-' || regexp_replace(lower(trim(CAST(:contact_email AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id FROM marketing_automations a WHERE a.id = :automation_id AND a.active = TRUE AND a.state IN ('Published', 'Running')", assign: true, status: 409, code: MARKETING_AUTOMATION_ENROLLMENT_CLOSED, message: Only active published or running automations accept enrollments. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:contact_name AS VARCHAR))) > 0 AND regexp_matches(TRIM(CAST(:contact_email AS VARCHAR)), '^[^@ ]+@[^@ ]+\\.[^@ ]+$')", status: 422, code: MARKETING_AUTOMATION_CONTACT_INVALID, message: A contact name and valid email are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM automation_enrollments WHERE automation_id = :automation_id AND LOWER(contact_email) = LOWER(TRIM(CAST(:contact_email AS VARCHAR))))", status: 409, code: MARKETING_AUTOMATION_CONTACT_EXISTS, message: This contact is already enrolled in the automation. }
      steps: [{ query: "UPDATE marketing_automations SET enrollment_count = enrollment_count + 1, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :automation_id" }]
      result: { query: "SELECT * FROM automation_enrollments WHERE id = :id" }
    fields:
      - { field: automation_id, label: Automation ID, type: text, required: true, readonly: true }
      - { field: contact_name, label: Contact, type: text, required: true }
      - { field: contact_email, label: Email, type: text, required: true }
  - { id: publish_automation_detail, type: server, permission: marketing_automation.write, action: marketing_automation.records.publish, handler: order_transition, workflow: marketing_automations, operation: publish, params: { id: '{state.id}' }, refresh: [automation_detail] }
  - { id: run_automation_detail, type: server, permission: marketing_automation.write, action: marketing_automation.records.run, handler: order_transition, workflow: marketing_automations, operation: run, params: { id: '{state.id}' }, refresh: [automation_detail] }
  - { id: complete_automation_detail, type: server, permission: marketing_automation.manage, action: marketing_automation.records.complete, handler: order_transition, workflow: marketing_automations, operation: complete, params: { id: '{state.id}' }, refresh: [automation_detail] }
  - { id: pause_automation_detail, type: server, permission: marketing_automation.write, action: marketing_automation.records.pause, handler: order_transition, workflow: marketing_automations, operation: pause, params: { id: '{state.id}' }, refresh: [automation_detail] }
  - { id: archive_automation_detail, type: server, permission: marketing_automation.manage, action: marketing_automation.records.archive, handler: yaml_mutation, operation: update, params: { id: '{state.id}', values: { active: false } }, refresh: [automation_detail, marketing_automations], mutation: { operation: update, table: marketing_automations, fields: [active], defaults: { active: false }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM marketing_automations WHERE id = :id AND active = TRUE AND state <> 'Running'", status: 409, code: MARKETING_AUTOMATION_ARCHIVE_BLOCKED, message: Running automations cannot be archived. }] } }
  - { id: restore_automation_detail, type: server, permission: marketing_automation.manage, action: marketing_automation.records.restore, handler: yaml_mutation, operation: update, params: { id: '{state.id}', values: { active: true } }, refresh: [automation_detail, marketing_automations], mutation: { operation: update, table: marketing_automations, fields: [active], defaults: { active: true }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM marketing_automations WHERE id = :id AND active = FALSE", status: 404, code: MARKETING_AUTOMATION_NOT_FOUND, message: Archived automation not found. }] } }
  - { id: delete_automation_detail, type: server, permission: marketing_automation.manage, action: marketing_automation.records.delete, handler: yaml_mutation, operation: delete, refresh: [automation_detail, marketing_automations], mutation: { operation: delete, table: marketing_automations, concurrency: { required: true }, guards: [{ query: "SELECT id FROM marketing_automations WHERE id = :id", status: 404, code: MARKETING_AUTOMATION_NOT_FOUND, message: Automation not found. }, { query: "SELECT id FROM marketing_automations WHERE id = :id AND state = 'Draft' AND enrollment_count = 0", status: 409, code: MARKETING_AUTOMATION_DELETE_BLOCKED, message: Only empty draft automations can be deleted. }], before_steps: [{ query: "DELETE FROM automation_enrollments WHERE automation_id = :id" }] } }
