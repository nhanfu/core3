version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS marketing_automations (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        trigger_type VARCHAR NOT NULL, trigger_definition VARCHAR, action_type VARCHAR NOT NULL,
        action_definition VARCHAR, audience_description VARCHAR, enrollment_count INTEGER NOT NULL DEFAULT 0,
        completed_count INTEGER NOT NULL DEFAULT 0, state VARCHAR NOT NULL DEFAULT 'Draft',
        published_at TIMESTAMP, row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS automation_enrollments (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), automation_id VARCHAR NOT NULL,
        automation_name VARCHAR NOT NULL, contact_name VARCHAR NOT NULL, contact_email VARCHAR,
        state VARCHAR NOT NULL DEFAULT 'Enrolled', enrolled_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        completed_at TIMESTAMP, result VARCHAR
      );
      CREATE INDEX IF NOT EXISTS automations_state_idx ON marketing_automations(state);
      CREATE INDEX IF NOT EXISTS automation_enrollments_automation_idx ON automation_enrollments(automation_id);
    down: |
      DROP TABLE IF EXISTS automation_enrollments;
      DROP TABLE IF EXISTS marketing_automations;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
