id: crm
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  dashboard:
    path: /my-pipeline
    label: CRM
    icon: users
    permission: crm.read
  groups:
    - id: pipeline
      label: Pipeline
      items:
        - path: /my-pipeline
          label: My Pipeline
          icon: dashboard
          permission: crm.read
        - path: /leads
          label: Leads
          icon: list
          permission: crm.read
        - path: /crm-activities
          label: My Activities
          icon: calendar
          permission: crm.read
        - path: /crm-activity-detail
          label: Activity detail
          icon: calendar
          permission: crm.read
        - path: /teams
          label: Teams
          icon: users
          permission: crm.read
        - path: /contacts
          label: Customers
          icon: users
          permission: base.contacts.read
    - id: reporting
      label: Reporting
      items:
        - path: /forecast
          label: Forecast
          icon: chart
          permission: crm.read
        - path: /analysis
          label: Pipeline Analysis
          icon: chart
          permission: crm.read
        - path: /expected-revenue
          label: Expected Revenue
          icon: chart
          permission: crm.read
        - path: /lost-opportunities
          label: Lost Opportunities
          icon: archive
          permission: crm.read
        - path: /quality-leads
          label: Quality Leads
          icon: check
          permission: crm.read
        - path: /unattended-leads
          label: Unattended Leads
          icon: alert
          permission: crm.read
        - path: /unassigned-leads
          label: Unassigned Leads
          icon: users
          permission: crm.read
        - path: /activity-analysis
          label: Activities
          icon: chart
          permission: crm.read
    - id: configuration
      label: Configuration
      items:
        - path: /configuration
          label: Configuration
          icon: settings
          permission: crm.manage
        - path: /settings
          label: CRM Settings
          icon: settings
          permission: crm.manage
        - path: /recurring-plans
          label: Recurring Plans
          icon: list
        - path: /lost-reasons
          label: Lost Reasons
          icon: archive
          permission: crm.manage
