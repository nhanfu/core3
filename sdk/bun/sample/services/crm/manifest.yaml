id: crm
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  dashboard:
    path: /leads
    label: CRM
    icon: users
    permission: crm.read
  groups:
    - id: pipeline
      label: Pipeline
      items:
        - path: /crm-activities
          label: Activities
          icon: calendar
          permission: crm.read
        - path: /unattended-leads
          label: Unattended Leads
          icon: alert
          permission: crm.read
        - path: /quality-leads
          label: Quality Leads
          icon: check
          permission: crm.read
        - path: /expected-revenue
          label: Expected Revenue
        - path: /crm-tags
          label: Tags
          icon: chart
          permission: crm.read
        - path: /my-pipeline
          label: My Pipeline
          icon: users
          permission: crm.read
        - path: /unassigned-leads
          label: Unassigned Leads
          icon: users
          permission: crm.read
        - path: /teams
          label: Sales Teams
          icon: users
          permission: crm.read
        - path: /analysis
          label: Pipeline Analysis
          icon: chart
          permission: crm.read
        - path: /lost-opportunities
          label: Lost Opportunities
          icon: archive
          permission: crm.read
    - id: configuration
      label: Configuration
      items:
        - path: /configuration
          label: Configuration
          icon: settings
          permission: crm.manage
