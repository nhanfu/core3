        WHEN 'crm-forecast-001' THEN TIMESTAMP '2026-03-12 09:00:00'
        WHEN 'crm-forecast-002' THEN TIMESTAMP '2026-04-18 09:00:00'
        WHEN 'crm-forecast-003' THEN TIMESTAMP '2026-05-21 09:00:00'
        WHEN 'crm-forecast-004' THEN TIMESTAMP '2026-06-25 09:00:00'
        ELSE created_at END;
