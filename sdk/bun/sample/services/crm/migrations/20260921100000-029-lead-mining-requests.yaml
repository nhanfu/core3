version: 0.0.29
kind: schema
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS crm_lead_mining_countries (
        code VARCHAR PRIMARY KEY,
        name VARCHAR NOT NULL UNIQUE
      );
      CREATE TABLE IF NOT EXISTS crm_lead_mining_industries (
        id VARCHAR PRIMARY KEY,
        name VARCHAR NOT NULL UNIQUE
      );
      INSERT INTO crm_lead_mining_countries(code, name) VALUES
        ('US', 'United States'), ('CA', 'Canada'), ('GB', 'United Kingdom'), ('VN', 'Vietnam')
      ON CONFLICT(code) DO NOTHING;
      INSERT INTO crm_lead_mining_industries(id, name) VALUES
        ('technology', 'Technology'), ('manufacturing', 'Manufacturing'),
        ('healthcare', 'Healthcare'), ('retail', 'Retail')
      ON CONFLICT(id) DO NOTHING;
      CREATE TABLE IF NOT EXISTS crm_lead_mining_requests (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL DEFAULT 'New',
        state VARCHAR NOT NULL DEFAULT 'draft',
        error_type VARCHAR,
        lead_number INTEGER NOT NULL DEFAULT 3,
        search_type VARCHAR NOT NULL DEFAULT 'companies',
        lead_type VARCHAR NOT NULL DEFAULT 'opportunity',
        team_name VARCHAR,
        user_name VARCHAR,
        country_names VARCHAR NOT NULL DEFAULT 'United States',
        state_names VARCHAR NOT NULL DEFAULT '',
        industry_names VARCHAR NOT NULL DEFAULT '',
        default_tags VARCHAR NOT NULL DEFAULT '',
        filter_on_size BOOLEAN NOT NULL DEFAULT false,
        company_size_min INTEGER NOT NULL DEFAULT 1,
        company_size_max INTEGER NOT NULL DEFAULT 1000,
        contact_number INTEGER NOT NULL DEFAULT 10,
        contact_filter_type VARCHAR NOT NULL DEFAULT 'role',
        preferred_role VARCHAR,
        other_roles VARCHAR NOT NULL DEFAULT '',
        seniority VARCHAR,
        generated_lead_count INTEGER NOT NULL DEFAULT 0,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
    down: |
      DROP TABLE IF EXISTS crm_lead_mining_requests;
      DROP TABLE IF EXISTS crm_lead_mining_industries;
      DROP TABLE IF EXISTS crm_lead_mining_countries;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
