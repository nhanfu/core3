version: 0.0.12

type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS crm_tags (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        color INTEGER NOT NULL DEFAULT 0, active BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      INSERT INTO crm_tags(name)
      SELECT DISTINCT TRIM(split.tag)
      FROM crm_leads, UNNEST(string_split(COALESCE(crm_leads.tags, ''), ',')) AS split(tag)
      WHERE NULLIF(TRIM(split.tag), '') IS NOT NULL
      ON CONFLICT (name) DO NOTHING;
    down: |
      DROP TABLE IF EXISTS crm_tags;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
