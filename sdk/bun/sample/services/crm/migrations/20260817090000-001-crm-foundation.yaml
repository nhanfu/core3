version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS crm_leads (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL, type VARCHAR NOT NULL DEFAULT 'opportunity',
        partner_name VARCHAR, email VARCHAR, phone VARCHAR, description VARCHAR,
        source VARCHAR, priority VARCHAR NOT NULL DEFAULT '0',
        expected_revenue DECIMAL(18,2) NOT NULL DEFAULT 0,
        stage VARCHAR NOT NULL DEFAULT 'New', probability INTEGER NOT NULL DEFAULT 10,
        salesperson VARCHAR, team VARCHAR, expected_closing DATE, lost_reason VARCHAR,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS crm_activities (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), lead_id VARCHAR NOT NULL,
        activity_type VARCHAR NOT NULL, summary VARCHAR NOT NULL, due_date DATE,
        assigned_to VARCHAR, state VARCHAR NOT NULL DEFAULT 'planned',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, completed_at TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS idx_crm_leads_stage ON crm_leads(stage);
      CREATE INDEX IF NOT EXISTS idx_crm_activities_lead ON crm_activities(lead_id);
    down: |
      DROP TABLE IF EXISTS crm_activities;
      DROP TABLE IF EXISTS crm_leads;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
