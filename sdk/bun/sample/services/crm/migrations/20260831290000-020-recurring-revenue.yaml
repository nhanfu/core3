version: 0.0.20
type:
  postgres:
    up: |
      ALTER TABLE crm_leads ADD COLUMN IF NOT EXISTS recurring_revenue DECIMAL(18,2);
      ALTER TABLE crm_leads ADD COLUMN IF NOT EXISTS recurring_plan VARCHAR;
      UPDATE crm_leads SET recurring_revenue = 0 WHERE recurring_revenue IS NULL;
      CREATE TABLE IF NOT EXISTS crm_recurring_plans (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL,
        interval_unit VARCHAR NOT NULL DEFAULT 'month', interval_count INTEGER NOT NULL DEFAULT 1,
        active BOOLEAN NOT NULL DEFAULT true
      );
      CREATE UNIQUE INDEX IF NOT EXISTS idx_crm_recurring_plans_name ON crm_recurring_plans(name);
      INSERT INTO crm_recurring_plans(id, name, interval_unit, interval_count, active) SELECT 'crm-plan-monthly', 'Monthly', 'month', 1, true WHERE NOT EXISTS (SELECT 1 FROM crm_recurring_plans WHERE name = 'Monthly');
      INSERT INTO crm_recurring_plans(id, name, interval_unit, interval_count, active) SELECT 'crm-plan-yearly', 'Yearly', 'year', 1, true WHERE NOT EXISTS (SELECT 1 FROM crm_recurring_plans WHERE name = 'Yearly');
    down: |
      ALTER TABLE crm_leads DROP COLUMN IF EXISTS recurring_plan;
      ALTER TABLE crm_leads DROP COLUMN IF EXISTS recurring_revenue;
      DROP TABLE IF EXISTS crm_recurring_plans;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
