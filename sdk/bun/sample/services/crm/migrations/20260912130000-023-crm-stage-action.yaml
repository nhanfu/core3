version: 0.0.23
type:
  postgres:
    up: |
      ALTER TABLE crm_stages ADD COLUMN IF NOT EXISTS row_version BIGINT DEFAULT 1;
      ALTER TABLE crm_stages ADD COLUMN IF NOT EXISTS is_won BOOLEAN DEFAULT false;
      ALTER TABLE crm_stages ADD COLUMN IF NOT EXISTS color INTEGER DEFAULT 0;
      ALTER TABLE crm_stages ADD COLUMN IF NOT EXISTS rotting_threshold_days INTEGER DEFAULT 0;
      ALTER TABLE crm_stages ADD COLUMN IF NOT EXISTS team_names VARCHAR DEFAULT '';
      UPDATE crm_stages SET row_version = 1 WHERE row_version IS NULL;
      UPDATE crm_stages SET is_won = (name = 'Won');
