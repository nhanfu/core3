version: 0.0.16
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS crm_activity_log (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
        actor_id VARCHAR,
        actor_name VARCHAR NOT NULL,
        action VARCHAR NOT NULL,
        resource VARCHAR NOT NULL,
        resource_id VARCHAR,
        detail VARCHAR,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS crm_lead_followers (
        lead_id VARCHAR NOT NULL,
        user_id VARCHAR NOT NULL,
        added_by VARCHAR,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (lead_id, user_id)
      );
      CREATE TABLE IF NOT EXISTS crm_lead_attachments (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(),
        lead_id VARCHAR NOT NULL,
        file_name VARCHAR NOT NULL,
        mime_type VARCHAR,
        size_bytes BIGINT NOT NULL DEFAULT 0,
        storage_key VARCHAR NOT NULL,
        uploaded_by VARCHAR,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS idx_crm_activity_log_resource ON crm_activity_log(resource, resource_id);
      CREATE INDEX IF NOT EXISTS idx_crm_lead_followers_lead ON crm_lead_followers(lead_id);
      CREATE INDEX IF NOT EXISTS idx_crm_lead_attachments_lead ON crm_lead_attachments(lead_id);
    down: |
      DROP TABLE IF EXISTS crm_lead_attachments;
      DROP TABLE IF EXISTS crm_lead_followers;
      DROP TABLE IF EXISTS crm_activity_log;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
