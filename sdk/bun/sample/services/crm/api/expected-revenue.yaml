page: { id: expected-revenue }
datasources:
  - id: crm_expected_revenue
    single: false
    permission: crm.read
    mock_data:
      default: [{ id: crm-opp-001, row_version: 1, name: Vietnam expansion, partner_name: Core3 Vietnam Branch, salesperson: Administrator, team: Direct Sales, stage: Qualified, probability: 60, expected_revenue: 45000, weighted_revenue: 27000, tags: Priority, expected_closing: '2026-10-15' }]
      states: { empty: [], filtered: [{ id: crm-opp-001, row_version: 1, name: Vietnam expansion, partner_name: Core3 Vietnam Branch, salesperson: Administrator, team: Direct Sales, stage: Qualified, probability: 60, expected_revenue: 45000, weighted_revenue: 27000, tags: Priority, expected_closing: '2026-10-15' }] }
  - id: crm_expected_revenue_teams
    single: false
    permission: crm.read
    mock_data: { default: [{ value: Direct Sales, label: Direct Sales }] }
actions:
  - id: bulk_delete_expected_revenue
    type: server
    permission: crm.write
    action: crm.expected_revenue.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected opportunities?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
