page: { id: quality-leads }
datasources:
  - id: crm_quality_leads
    single: false
    permission: crm.read
    query: |
      SELECT id, row_version, name, type, partner_name, email, phone, source,
        salesperson, team, stage, probability, expected_revenue,
        CAST(created_at AS VARCHAR) AS created_at,
        CASE WHEN stage IN ('Won', 'Lost') THEN 'Closed' ELSE 'Open' END AS status_group
      FROM crm_leads
      WHERE created_at >= CURRENT_DATE - INTERVAL '30 days'
        AND (:team IS NULL OR team = :team)
        AND NULLIF(TRIM(email), '') IS NOT NULL
        AND NULLIF(TRIM(phone), '') IS NOT NULL
        AND NULLIF(TRIM(salesperson), '') IS NOT NULL
        AND NULLIF(TRIM(source), '') IS NOT NULL
      ORDER BY created_at DESC
  - id: crm_quality_teams
    single: false
    permission: crm.read
    query: "SELECT name AS value, name AS label FROM crm_teams WHERE active = true ORDER BY name"
  - id: crm_quality_by_salesperson
    single: false
    permission: crm.read
    query: "SELECT salesperson, COUNT(*) AS quality_lead_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS expected_revenue FROM crm_leads WHERE created_at >= CURRENT_DATE - INTERVAL '30 days' AND NULLIF(TRIM(email), '') IS NOT NULL AND NULLIF(TRIM(phone), '') IS NOT NULL AND NULLIF(TRIM(salesperson), '') IS NOT NULL AND NULLIF(TRIM(source), '') IS NOT NULL GROUP BY salesperson ORDER BY quality_lead_count DESC"
actions:
  - id: bulk_delete_quality_leads
    type: server
    permission: crm.write
    action: crm.quality_leads.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected leads?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
