page: { id: quality-leads }
datasources:
  - id: crm_quality_leads
    single: false
    permission: crm.read
    mock_data:
      default: [{ id: crm-lead-001, row_version: 1, name: Core3 website inquiry, type: lead, partner_name: Core3 Demo Company, email: buyer@core3.local, phone: '+1 555 0120', source: Website, priority: '1', expected_revenue: 12500, stage: New, probability: 20, salesperson: Administrator, team: Direct Sales, tags: New }]
      states: { empty: [] }
  - id: crm_quality_teams
    single: false
    permission: crm.read
    mock_data: { default: [{ value: Direct Sales, label: Direct Sales }] }
  - id: crm_quality_by_salesperson
    single: false
    permission: crm.read
    mock_data: { default: [{ salesperson: Administrator, quality_lead_count: 1, expected_revenue: 12500 }] }
actions:
  - id: bulk_delete_quality_leads
    type: server
    permission: crm.write
    action: crm.quality_leads.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected leads?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
