page: { id: unassigned-leads }
datasources:
  - id: crm_unassigned_leads
    single: false
    permission: crm.read
    mock_data:
      default: [{ id: crm-unassigned-001, row_version: 1, name: Unassigned inquiry, type: lead, partner_name: New Customer, source: Website, priority: '0', expected_revenue: 6000, stage: New, probability: 10, team: Direct Sales, tags: New, expected_closing: '2026-09-25', updated_at: '2026-09-08' }]
      states: { empty: [] }
actions:
  - id: bulk_delete_unassigned_leads
    type: server
    permission: crm.write
    action: crm.unassigned_leads.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected leads?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
