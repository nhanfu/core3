page: { id: crm-activities }
datasources:
  - id: crm_activity_queue
    single: false
    permission: crm.read
    mock_data:
      default: [{ id: crm-activity-001, lead_id: crm-opp-001, opportunity: Vietnam expansion, activity_type: Call, summary: Confirm expansion requirements, due_date: '2026-09-10', assigned_to: Administrator, state: planned, timing: Upcoming }]
      states: { empty: [], overdue: [{ id: crm-activity-002, lead_id: crm-lead-001, opportunity: Core3 website inquiry, activity_type: Email, summary: Send pricing details, due_date: '2026-09-08', assigned_to: Administrator, state: planned, timing: Overdue }] }
  - id: crm_activity_timing
    single: false
    permission: crm.read
    mock_data: { default: [{ value: Overdue, label: Overdue }, { value: Today, label: Today }, { value: Upcoming, label: Upcoming }] }
  - id: crm_activity_type_lookup
    single: false
    permission: crm.read
    mock_data: { default: [{ value: Call, label: Call }, { value: Email, label: Email }, { value: To-do, label: To-do }] }
actions:
  - id: complete_crm_activity
    type: server
    permission: crm.write
    action: crm.activities.complete
    handler: crm_activity
    operation: complete
    params: { id: '{row.id}' }
    refresh: [crm_activity_queue]
    mutation:
      guards:
        - query: "SELECT id FROM crm_activities WHERE id = :id AND state = 'planned'"
          status: 409
          message: Activity is already completed or no longer exists
      steps:
        - query: "UPDATE crm_activities SET state = 'done', completed_at = CURRENT_TIMESTAMP WHERE id = :id AND state = 'planned'"
        - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, due_date, assigned_to, state) SELECT gen_random_uuid(), lead_id, next_activity_type, next_activity_summary, next_activity_due_date, assigned_to, 'planned' FROM crm_activities WHERE id = :id AND next_activity_type IS NOT NULL AND NULLIF(TRIM(next_activity_summary), '') IS NOT NULL"
      result: { query: "SELECT * FROM crm_activities WHERE id = :id" }
  - id: bulk_delete_crm_activities
    type: server
    permission: crm.write
    action: crm.activities.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected activities?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_activities WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
