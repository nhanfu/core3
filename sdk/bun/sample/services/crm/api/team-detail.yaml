page: { id: team-detail }
datasources:
  - id: crm_team_detail
    single: true
    permission: crm.read
    query: "SELECT id, name, leader, email_alias, target_revenue, use_leads, active FROM crm_teams WHERE id = :id"
  - id: crm_team_members_detail
    single: false
    permission: crm.read
    query: "SELECT id, team_id, user_name, active FROM crm_team_members WHERE team_id = :id ORDER BY user_name"
  - id: crm_activity_type_lookup_detail
    single: false
    permission: crm.read
    query: "SELECT id AS value, name AS label FROM crm_activity_types WHERE active = true ORDER BY name"
actions:
  - id: edit_crm_team_detail
    type: server_form
    permission: crm.manage
    title: Edit sales team
    action: crm.teams.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_team_detail]
    mutation:
      guards:
        - query: "SELECT id FROM crm_teams WHERE id = :id AND active = true"
          status: 409
          message: Only active sales teams can be edited
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_teams WHERE name = :name AND id <> :id)"
          status: 409
          message: Sales team already exists
      steps:
        - query: "UPDATE crm_leads SET team = :name, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE team = (SELECT name FROM crm_teams WHERE id = :id)"
        - query: "UPDATE crm_teams SET name = :name, leader = :leader, email_alias = :email_alias, target_revenue = :target_revenue, use_leads = :use_leads WHERE id = :id"
      result: { query: "SELECT * FROM crm_teams WHERE id = :id" }
    fields:
      - { field: name, label: Sales team, type: text, required: true }
      - { field: leader, label: Team leader, type: text }
      - { field: email_alias, label: Email alias, type: text }
      - { field: target_revenue, label: Target revenue, type: number }
      - { field: use_leads, label: Leads enabled, type: checkbox }
  - id: archive_crm_team_detail
    type: server
    permission: crm.manage
    action: crm.teams.archive
    handler: yaml_mutation
    operation: archive
    params: { id: '{state.crm_team_detail.id}' }
    refresh: [crm_team_detail]
    mutation:
      guards:
        - query: "SELECT id FROM crm_teams WHERE id = :id AND active = true"
          status: 409
          message: Sales team is already archived
      steps:
        - query: "UPDATE crm_teams SET active = false WHERE id = :id"
      result: { query: "SELECT * FROM crm_teams WHERE id = :id" }
  - id: add_team_member_detail
    type: server_form
    permission: crm.manage
    title: Add sales team member
    action: crm.team_members.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_team_members_detail]
    mutation:
      operation: insert
      table: crm_team_members
      fields: [team_id, user_name, active]
      required: [team_id, user_name]
      defaults: { active: true }
      guards:
        - query: "SELECT id FROM crm_teams WHERE id = :team_id AND active = true"
          status: 400
          message: Select an active sales team
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_team_members WHERE team_id = :team_id AND lower(user_name) = lower(:user_name))"
          status: 409
          message: This user is already on the sales team
      result: { query: "SELECT * FROM crm_team_members WHERE id = :id" }
    fields:
      - { field: team_id, label: Sales team, type: hidden }
      - { field: user_name, label: Member, type: text, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: toggle_team_member_detail
    type: server
    permission: crm.manage
    action: crm.team_members.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_team_members_detail]
    mutation:
      guards:
        - query: "SELECT id FROM crm_team_members WHERE id = :id"
          status: 404
          message: Sales team member no longer exists
      steps:
        - query: "UPDATE crm_team_members SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_team_members WHERE id = :id" }
