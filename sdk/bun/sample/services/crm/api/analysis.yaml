page: { id: crm-analysis }
datasources:
  - id: crm_pipeline_analysis_teams
    single: false
    permission: crm.read
    query: "SELECT DISTINCT team AS value, team AS label FROM crm_leads WHERE type = 'opportunity' AND NULLIF(team, '') IS NOT NULL ORDER BY team"
  - id: crm_pipeline_analysis_salespeople
    single: false
    permission: crm.read
    query: "SELECT DISTINCT salesperson AS value, salesperson AS label FROM crm_leads WHERE type = 'opportunity' AND NULLIF(salesperson, '') IS NOT NULL ORDER BY salesperson"
  - id: crm_pipeline_analysis
    single: false
    permission: crm.read
    error_states:
      unauthorized: { status: 401, code: CRM_PIPELINE_ANALYSIS_UNAUTHORIZED, message: Sign in to view Pipeline Analysis. }
      forbidden: { status: 403, code: CRM_PIPELINE_ANALYSIS_FORBIDDEN, message: You do not have permission to view Pipeline Analysis. }
      conflict: { status: 409, code: CRM_PIPELINE_ANALYSIS_CONFLICT, message: The pipeline changed. Refresh to continue. }
      transport_error: { status: 503, code: CRM_PIPELINE_ANALYSIS_UNAVAILABLE, message: Pipeline Analysis is temporarily unavailable. }
    pivot: { fields: [id, row_version, name, type, active, stage, team, salesperson, expected_closing, expected_closing_month, probability, expected_revenue, prorated_revenue, record_count] }
    query: |
      SELECT id, row_version, name, type, active, stage,
        COALESCE(NULLIF(team, ''), 'Unassigned team') AS team,
        COALESCE(NULLIF(salesperson, ''), 'Unassigned') AS salesperson,
        CAST(expected_closing AS VARCHAR) AS expected_closing,
        strftime(expected_closing, '%Y-%m') AS expected_closing_month,
        probability, CAST(expected_revenue AS DOUBLE) AS expected_revenue,
        CAST(expected_revenue * probability / 100 AS DOUBLE) AS prorated_revenue,
        1 AS record_count
      FROM crm_leads
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'no_results', 'not_found') THEN FALSE ELSE TRUE END
        AND type = 'opportunity'
        AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(partner_name, '') ILIKE '%' || :q || '%' OR COALESCE(team, '') ILIKE '%' || :q || '%')
        AND (:active IS NULL OR (active = TRUE AND :active = 'active') OR (active = FALSE AND :active = 'inactive'))
        AND (:team IS NULL OR COALESCE(NULLIF(team, ''), 'Unassigned team') = :team)
        AND (:salesperson IS NULL OR COALESCE(NULLIF(salesperson, ''), 'Unassigned') = :salesperson)
        AND (:expected_closing_period IS NULL OR :expected_closing_period <> 'month' OR (expected_closing IS NOT NULL AND expected_closing >= DATE '2026-09-01'))
      ORDER BY expected_closing, id
  - id: crm_pipeline_totals
    single: true
    permission: crm.read
    query: "SELECT COUNT(*) AS lead_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS pipeline_revenue, CAST(COALESCE(SUM(expected_revenue * probability / 100), 0) AS DOUBLE) AS weighted_pipeline_revenue, CAST(COALESCE(AVG(probability), 0) AS DOUBLE) AS average_probability FROM crm_leads WHERE stage NOT IN ('Won', 'Lost')"
  - id: crm_pipeline_by_stage
    single: false
    permission: crm.read
    query: "SELECT stage, COUNT(*) AS lead_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS revenue FROM crm_leads GROUP BY stage ORDER BY lead_count DESC"
  - id: crm_pipeline_by_source
    single: false
    permission: crm.read
    query: "SELECT COALESCE(NULLIF(source, ''), 'Unknown') AS source, COUNT(*) AS lead_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS revenue FROM crm_leads GROUP BY COALESCE(NULLIF(source, ''), 'Unknown') ORDER BY revenue DESC"
  - id: crm_pipeline_by_team
    single: false
    permission: crm.read
    query: "SELECT COALESCE(team, 'Unassigned') AS team, COUNT(*) AS lead_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS revenue FROM crm_leads GROUP BY team ORDER BY revenue DESC"
  - id: crm_win_loss
    single: false
    permission: crm.read
    query: "SELECT stage AS outcome, COUNT(*) AS lead_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS revenue FROM crm_leads WHERE stage IN ('Won', 'Lost') GROUP BY stage ORDER BY stage"
  - id: crm_lost_by_reason
    single: false
    permission: crm.read
    query: "SELECT COALESCE(r.name, 'Unspecified') AS lost_reason, COUNT(*) AS lead_count, CAST(COALESCE(SUM(l.expected_revenue), 0) AS DOUBLE) AS revenue FROM crm_leads l LEFT JOIN crm_lost_reasons r ON r.id = l.lost_reason WHERE l.stage = 'Lost' GROUP BY COALESCE(r.name, 'Unspecified') ORDER BY revenue DESC"
  - id: crm_source_performance
    single: false
    permission: crm.read
    query: "SELECT COALESCE(NULLIF(source, ''), 'Unknown') AS source, COUNT(*) AS lead_count, COUNT(*) FILTER (WHERE stage = 'Won') AS won_count, COUNT(*) FILTER (WHERE stage = 'Lost') AS lost_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS revenue, CAST(COALESCE(100.0 * COUNT(*) FILTER (WHERE stage = 'Won') / NULLIF(COUNT(*) FILTER (WHERE stage IN ('Won', 'Lost')), 0), 0) AS DOUBLE) AS win_rate FROM crm_leads GROUP BY COALESCE(NULLIF(source, ''), 'Unknown') ORDER BY revenue DESC"
  - id: crm_historical_lead_scoring
    single: false
    permission: crm.read
    query: "SELECT COALESCE(NULLIF(source, ''), 'Unknown') AS source, COUNT(*) AS total_leads, COUNT(*) FILTER (WHERE stage = 'Won') AS won_count, COUNT(*) FILTER (WHERE stage IN ('Won', 'Lost')) AS closed_count, CAST(COALESCE(100.0 * COUNT(*) FILTER (WHERE stage = 'Won') / NULLIF(COUNT(*) FILTER (WHERE stage IN ('Won', 'Lost')), 0), 0) AS DOUBLE) AS observed_win_rate, CASE WHEN COUNT(*) FILTER (WHERE stage IN ('Won', 'Lost')) = 0 THEN 'No closed history' WHEN COUNT(*) FILTER (WHERE stage IN ('Won', 'Lost')) < 5 THEN 'Low sample' ELSE 'Historical baseline' END AS evidence_level FROM crm_leads GROUP BY COALESCE(NULLIF(source, ''), 'Unknown') ORDER BY observed_win_rate DESC, closed_count DESC, source"
  - id: crm_lead_distribution
    single: false
    permission: crm.read
    query: "SELECT COALESCE(NULLIF(team, ''), 'Unassigned team') AS team, COALESCE(NULLIF(salesperson, ''), 'Unassigned') AS salesperson, COUNT(*) AS lead_count, COUNT(*) FILTER (WHERE stage NOT IN ('Won', 'Lost')) AS open_count, COUNT(*) FILTER (WHERE stage = 'Won') AS won_count, COUNT(*) FILTER (WHERE stage = 'Lost') AS lost_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS expected_revenue FROM crm_leads GROUP BY COALESCE(NULLIF(team, ''), 'Unassigned team'), COALESCE(NULLIF(salesperson, ''), 'Unassigned') ORDER BY open_count DESC, team, salesperson"
  - id: crm_utm_campaign_performance
    single: false
    permission: crm.read
    query: "SELECT COALESCE(NULLIF(utm_campaign, ''), 'Unattributed') AS campaign, COUNT(*) AS lead_count, COUNT(*) FILTER (WHERE stage = 'Won') AS won_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS revenue FROM crm_leads GROUP BY COALESCE(NULLIF(utm_campaign, ''), 'Unattributed') ORDER BY revenue DESC"
actions:
  - id: view_pipeline_analysis_record
    type: navigate
    permission: crm.read
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
