page: { id: crm-analysis }
datasources:
  - id: crm_pipeline_totals
    single: true
    permission: crm.read
    mock_data: { default: { lead_count: 2, pipeline_revenue: 57500, weighted_pipeline_revenue: 29500, average_probability: 40 } }
  - id: crm_pipeline_by_stage
    single: false
    permission: crm.read
    mock_data: { default: [{ stage: Qualified, lead_count: 1, revenue: 45000 }, { stage: New, lead_count: 1, revenue: 12500 }] }
  - id: crm_pipeline_by_team
    single: false
    permission: crm.read
    mock_data: { default: [{ team: Direct Sales, lead_count: 2, revenue: 57500 }] }
  - id: crm_pipeline_by_source
    single: false
    permission: crm.read
    mock_data: { default: [{ source: Referral, lead_count: 1, revenue: 45000 }, { source: Website, lead_count: 1, revenue: 12500 }] }
  - id: crm_win_loss
    single: false
    permission: crm.read
    mock_data: { default: [{ outcome: Won, lead_count: 1, revenue: 22000 }, { outcome: Lost, lead_count: 1, revenue: 8000 }] }
  - id: crm_lost_by_reason
    single: false
    permission: crm.read
    mock_data: { default: [{ lost_reason: Too expensive, lead_count: 1, revenue: 8000 }] }
  - id: crm_source_performance
    single: false
    permission: crm.read
    mock_data: { default: [{ source: Referral, lead_count: 1, won_count: 1, lost_count: 0, revenue: 45000, win_rate: 100 }] }
  - id: crm_historical_lead_scoring
    single: false
    permission: crm.read
    mock_data: { default: [{ source: Referral, total_leads: 1, won_count: 1, closed_count: 1, observed_win_rate: 100, evidence_level: Low sample }] }
  - id: crm_lead_distribution
    single: false
    permission: crm.read
    mock_data: { default: [{ team: Direct Sales, salesperson: Administrator, lead_count: 2, open_count: 2, won_count: 0, lost_count: 0, expected_revenue: 57500 }] }
  - id: crm_utm_campaign_performance
    single: false
    permission: crm.read
    mock_data: { default: [{ campaign: partner, lead_count: 1, won_count: 0, revenue: 45000 }, { campaign: spring, lead_count: 1, won_count: 0, revenue: 12500 }] }
