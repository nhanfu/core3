page: { id: unattended-leads }
datasources:
  - id: crm_unattended_leads
    single: false
    permission: crm.read
    mock_data:
      default: [{ id: crm-unattended-001, row_version: 1, name: Follow-up needed, type: opportunity, partner_name: Core3 Demo Company, email: buyer@core3.local, salesperson: Administrator, team: Direct Sales, stage: Qualified, probability: 60, expected_revenue: 12500, expected_closing: '2026-09-12', attention: Past due }]
      states: { empty: [] }
actions:
  - id: bulk_delete_unattended_leads
    type: server
    permission: crm.write
    action: crm.unattended_leads.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected leads?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
