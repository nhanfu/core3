page: { id: unattended-leads }
datasources:
  - id: crm_unattended_leads
    single: false
    permission: crm.read
    query: |
      SELECT l.id, l.row_version, l.name, l.type, l.partner_name, l.email,
        l.salesperson, l.team, l.stage, l.probability, l.expected_revenue,
        CAST(l.expected_closing AS VARCHAR) AS expected_closing,
        CASE WHEN EXISTS (SELECT 1 FROM crm_activities a WHERE a.lead_id = l.id AND a.state = 'planned' AND a.due_date < CURRENT_DATE)
             THEN 'Past due' ELSE 'No planned activity' END AS attention
      FROM crm_leads l
      WHERE l.stage NOT IN ('Won', 'Lost')
        AND (:q IS NULL OR l.name ILIKE '%' || :q || '%' OR l.partner_name ILIKE '%' || :q || '%')
        AND (
          NOT EXISTS (SELECT 1 FROM crm_activities a WHERE a.lead_id = l.id AND a.state = 'planned')
          OR EXISTS (SELECT 1 FROM crm_activities a WHERE a.lead_id = l.id AND a.state = 'planned' AND a.due_date < CURRENT_DATE)
        )
      ORDER BY attention, l.updated_at DESC
actions:
  - id: bulk_delete_unattended_leads
    type: server
    permission: crm.write
    action: crm.unattended_leads.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected leads?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
