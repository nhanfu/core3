page: { id: crm-activity-types }
datasources:
  - id: crm_activity_types_action
    permission: crm.manage
    error_states:
      forbidden: { status: 403, code: CRM_ACTIVITY_TYPES_FORBIDDEN, message: You do not have permission to manage activity types. }
      transport_error: { status: 503, code: CRM_ACTIVITY_TYPES_UNAVAILABLE, message: Activity types are temporarily unavailable. }
    query: "SELECT id, row_version, sequence, name, summary, CAST(delay_count AS VARCHAR) || ' ' || delay_unit AS planned_in, delay_from, res_model, category, active FROM crm_activity_types WHERE ((COALESCE(:active, '') = '' AND active = true) OR (:active = 'archived' AND active = false)) AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR COALESCE(summary, '') ILIKE '%' || :q || '%') AND (res_model IS NULL OR res_model IN ('crm.lead', 'res.partner')) ORDER BY sequence, name"
actions:
  - id: create_crm_activity_type_action
    type: server_form
    permission: crm.manage
    title: New Activity Type
    action: crm.activity_types.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_activity_types_action]
    mutation:
      operation: insert
      table: crm_activity_types
      fields: [sequence, name, summary, delay_count, delay_unit, delay_from, res_model, category, active]
      required: [name]
      defaults: { sequence: 10, active: true, row_version: 1, delay_count: 0, delay_unit: days, delay_from: current_date, category: default, res_model: crm.lead }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: CRM_ACTIVITY_TYPE_NAME_REQUIRED, message: An activity type name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_activity_types WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: CRM_ACTIVITY_TYPE_EXISTS, message: Activity type already exists. }
      result: { query: "SELECT * FROM crm_activity_types WHERE id = :id" }
    fields:
      - { field: name, label: Activity Type, type: text, required: true }
      - { field: summary, label: Default Summary, type: text }
      - { field: delay_count, label: Planned in, type: number, default: 0 }
      - { field: delay_unit, label: Unit, type: select, options: [minutes, hours, days, weeks, months] }
      - { field: delay_from, label: Type, type: select, options: [current_date, completion] }
      - { field: res_model, label: Available on, type: select, options: [crm.lead, res.partner] }
  - id: edit_crm_activity_type_action
    type: server_form
    permission: crm.manage
    title: Edit Activity Type
    action: crm.activity_types.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_activity_types_action]
    mutation:
      operation: update
      table: crm_activity_types
      fields: [sequence, name, summary, delay_count, delay_unit, delay_from, res_model, category]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM crm_activity_types WHERE id = :id", status: 404, code: CRM_ACTIVITY_TYPE_NOT_FOUND, message: Activity type not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_activity_types WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: CRM_ACTIVITY_TYPE_EXISTS, message: Activity type already exists. }
      result: { query: "SELECT * FROM crm_activity_types WHERE id = :id" }
    fields:
      - { field: name, label: Activity Type, type: text, required: true }
      - { field: summary, label: Default Summary, type: text }
      - { field: delay_count, label: Planned in, type: number }
      - { field: delay_unit, label: Unit, type: select, options: [minutes, hours, days, weeks, months] }
      - { field: delay_from, label: Type, type: select, options: [current_date, completion] }
      - { field: res_model, label: Available on, type: select, options: [crm.lead, res.partner] }
  - id: bulk_delete_crm_activity_types_action
    type: server
    permission: crm.manage
    action: crm.activity_types.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected activity types?'
    mutation:
      guards: [{ query: "SELECT 1 AS ok WHERE :ids IS NOT NULL", status: 400, code: CRM_ACTIVITY_TYPE_SELECTION_REQUIRED, message: Select at least one activity type. }]
      steps:
        - query: "DELETE FROM crm_activity_types WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT TRUE AS deleted" }
