page: { id: my-pipeline }
datasources:
  - id: crm_my_pipeline
    single: false
    permission: crm.read
    mock_data:
      default: [{ id: crm-opp-001, row_version: 1, name: Vietnam expansion, type: opportunity, partner_name: Core3 Vietnam Branch, email: vn@core3.local, phone: '+84 28 5555 0100', source: Referral, priority: '2', expected_revenue: 45000, stage: Qualified, probability: 60, salesperson: Administrator, team: Direct Sales, tags: Priority, expected_closing: '2026-10-15', updated_at: '2026-09-08' }]
      states: { empty: [], filtered: [{ id: crm-opp-001, row_version: 1, name: Vietnam expansion, type: opportunity, partner_name: Core3 Vietnam Branch, expected_revenue: 45000, stage: Qualified, probability: 60, salesperson: Administrator, team: Direct Sales, tags: Priority, expected_closing: '2026-10-15', updated_at: '2026-09-08' }] }
actions:
  - id: bulk_delete_my_pipeline
    type: server
    permission: crm.write
    action: crm.my_pipeline.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected opportunities?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
