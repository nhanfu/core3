page: { id: my-pipeline }
datasources:
  - id: crm_my_pipeline
    single: false
    permission: crm.read
    mock_data:
      default:
        - { id: my-opp-001, row_version: 1, name: Devis pour 150 tapis, type: opportunity, partner_initial: O, partner_name: OpenWood, email: erik@example.com, source: Website, priority: '1', expected_revenue: 40000, stage: New, probability: 20, salesperson: Administrator, team: Direct Sales, tags: Product, activity_count: 1, expected_closing: '2026-09-20', updated_at: '2026-09-08' }
        - { id: my-opp-002, row_version: 1, name: Quote for 12 Tables, type: opportunity, partner_initial: W, partner_name: Will McEncroe, email: will@example.com, source: Referral, priority: '1', expected_revenue: 40000, stage: New, probability: 20, salesperson: Administrator, team: Direct Sales, tags: Product, activity_count: 1, expected_closing: '2026-09-22', updated_at: '2026-09-08' }
        - { id: crm-opp-001, row_version: 1, name: Vietnam expansion, type: opportunity, partner_initial: V, partner_name: Core3 Vietnam Branch, email: vn@core3.local, phone: '+84 28 5555 0100', source: Referral, priority: '2', expected_revenue: 45000, stage: Qualified, probability: 60, salesperson: Administrator, team: Direct Sales, tags: Priority, activity_count: 2, expected_closing: '2026-10-15', updated_at: '2026-09-08' }
        - { id: my-opp-003, row_version: 1, name: Office Design and Architecture, type: opportunity, partner_initial: R, partner_name: Ready Mat, source: Website, priority: '2', expected_revenue: 9000, stage: Proposition, probability: 75, salesperson: Administrator, team: Direct Sales, tags: Consulting, activity_count: 1, expected_closing: '2026-10-30', updated_at: '2026-09-08' }
      states: { empty: [], filtered: [{ id: crm-opp-001, row_version: 1, name: Vietnam expansion, type: opportunity, partner_initial: V, partner_name: Core3 Vietnam Branch, expected_revenue: 45000, stage: Qualified, probability: 60, salesperson: Administrator, team: Direct Sales, tags: Priority, activity_count: 2, expected_closing: '2026-10-15', updated_at: '2026-09-08' }] }
  - id: crm_my_pipeline_stages
    single: false
    permission: crm.read
    mock_data: { default: [{ value: New, label: New }, { value: Qualified, label: Qualified }, { value: Proposition, label: Proposition }, { value: Won, label: Won }, { value: Lost, label: Lost }] }
actions:
  - id: bulk_delete_my_pipeline
    type: server
    permission: crm.write
    action: crm.my_pipeline.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected opportunities?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
