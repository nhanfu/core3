page: { id: crm-tags }
datasources:
  - id: crm_tag_configuration
    permission: crm.manage
    error_states:
      unauthorized: { status: 401, code: CRM_TAGS_UNAUTHORIZED, message: Sign in to view CRM tags. }
      forbidden: { status: 403, code: CRM_TAGS_FORBIDDEN, message: You do not have permission to manage CRM tags. }
      transport_error: { status: 503, code: CRM_TAGS_UNAVAILABLE, message: CRM tags are temporarily unavailable. }
    query: "SELECT id, row_version, name, color FROM crm_tags WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'no_results') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY id"
actions:
  - id: create_crm_tag_inline
    type: server_form
    permission: crm.manage
    title: New CRM tag
    action: crm.tags.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_tag_configuration]
    mutation:
      operation: insert
      table: crm_tags
      fields: [name, color]
      required: [name]
      defaults: { color: 0, row_version: 1 }
      generated: [id]
      before_steps: [{ query: "SELECT 'crm-tag-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: CRM_TAG_NAME_REQUIRED, message: A tag name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(:color AS INTEGER) BETWEEN 0 AND 11", status: 422, code: CRM_TAG_COLOR_INVALID, message: Color must be between 0 and 11. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_tags WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: CRM_TAG_EXISTS, message: A CRM tag with this name already exists. }
      result: { query: "SELECT * FROM crm_tags WHERE id = :id" }
    fields:
      - { field: name, label: Tag, type: text, required: true }
      - { field: color, label: Color, type: color, palette: odoo, default: 0 }
  - id: update_crm_tag_inline
    type: server_form
    permission: crm.manage
    title: Edit CRM Tag
    action: crm.tags.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_tag_configuration]
    mutation:
      operation: update
      table: crm_tags
      fields: [name, color]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM crm_tags WHERE id = :id", status: 404, code: CRM_TAG_NOT_FOUND, message: CRM tag was not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: CRM_TAG_NAME_REQUIRED, message: A tag name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(:color AS INTEGER) BETWEEN 0 AND 11", status: 422, code: CRM_TAG_COLOR_INVALID, message: Color must be between 0 and 11. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_tags WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: CRM_TAG_EXISTS, message: A CRM tag with this name already exists. }
      steps: [{ query: "UPDATE crm_tags SET name = :name, color = :color, row_version = row_version + 1 WHERE id = :id" }]
      result: { query: "SELECT * FROM crm_tags WHERE id = :id" }
    fields:
      - { field: name, label: Tag Name, type: text, required: true }
      - { field: color, label: Color, type: color, palette: odoo }
  - id: edit_crm_tag
    type: navigate
    permission: crm.manage
    navigate_to: /crm/tags/detail
    params: { id: '{row.id}' }
  - id: bulk_delete_crm_tags
    type: server
    permission: crm.manage
    action: crm.tags.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected tags?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_tags WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
