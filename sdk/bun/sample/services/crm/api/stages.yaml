page: { id: crm-stages }
datasources:
  - id: crm_stage_action
    permission: crm.manage
    error_states: { transport_error: { status: 503, code: CRM_STAGES_UNAVAILABLE, message: Stages are temporarily unavailable. } }
    query: "SELECT id, row_version, name, sequence, probability, fold, requirements, active, is_won, color, rotting_threshold_days, team_names FROM crm_stages WHERE ((COALESCE(:active, '') = '' AND active = true) OR (:active = 'archived' AND active = false)) AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY sequence, id"
actions:
  - id: create_crm_stage_action
    type: server_form
    permission: crm.manage
    title: New Stage
    action: crm.stages.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_stage_action]
    mutation:
      operation: insert
      table: crm_stages
      fields: [row_version, name, sequence, probability, fold, requirements, active, is_won, color, rotting_threshold_days, team_names]
      required: [name]
      defaults: { row_version: 1, sequence: 10, probability: 10, fold: false, active: true, is_won: false, color: 0, rotting_threshold_days: 0, team_names: '' }
      generated: [id]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: CRM_STAGE_NAME_REQUIRED, message: Stage name is required. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:probability AS INTEGER), 10) BETWEEN 0 AND 100 AND COALESCE(CAST(:rotting_threshold_days AS INTEGER), 0) >= 0", status: 422, code: CRM_STAGE_VALUES_INVALID, message: Probability and days to rot are invalid. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_stages WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: CRM_STAGE_EXISTS, message: A stage with this name already exists. }
      result: { query: "SELECT * FROM crm_stages WHERE id = :id" }
    fields:
      - { field: name, label: Stage Name, type: text, required: true }
      - { field: sequence, label: Sequence, type: number, default: 10 }
      - { field: probability, label: Probability, type: number, min: 0, max: 100, default: 10 }
      - { field: fold, label: Folded, type: checkbox }
      - { field: color, label: Color, type: number, default: 0 }
      - { field: team_names, label: Sales Teams, type: text }
      - { field: is_won, label: Is Won Stage, type: checkbox }
      - { field: rotting_threshold_days, label: Days to rot, type: number, default: 0 }
      - { field: requirements, label: Requirements, type: textarea }
  - id: edit_crm_stage_action
    type: server_form
    permission: crm.manage
    title: Edit Stage
    action: crm.stages.update
    handler: yaml_mutation
    operation: update
    prefill: state.crm_stage_detail
    refresh: [crm_stage_detail, crm_stage_action]
    mutation:
      operation: update
      table: crm_stages
      fields: [name, sequence, probability, fold, requirements, is_won, color, rotting_threshold_days, team_names]
      required: [name]
      concurrency: { required: true }
      before_steps:
        - { query: "SELECT name AS old_name FROM crm_stages WHERE id = :id", assign: true }
      guards:
        - { query: "SELECT id FROM crm_stages WHERE id = :id", status: 404, code: CRM_STAGE_NOT_FOUND, message: Stage was not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: CRM_STAGE_NAME_REQUIRED, message: Stage name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(:probability AS INTEGER) BETWEEN 0 AND 100 AND CAST(:rotting_threshold_days AS INTEGER) >= 0", status: 422, code: CRM_STAGE_VALUES_INVALID, message: Probability and days to rot are invalid. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_stages WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: CRM_STAGE_EXISTS, message: A stage with this name already exists. }
      steps:
        - query: "UPDATE crm_leads SET stage = :name, probability = :probability, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE stage = :old_name"
      result: { query: "SELECT * FROM crm_stages WHERE id = :id" }
    fields:
      - { field: name, label: Stage Name, type: text, required: true }
      - { field: sequence, label: Sequence, type: number, required: true }
      - { field: probability, label: Probability, type: number, min: 0, max: 100, required: true }
      - { field: fold, label: Folded, type: checkbox }
      - { field: color, label: Color, type: number }
      - { field: team_names, label: Sales Teams, type: text }
      - { field: is_won, label: Is Won Stage, type: checkbox }
      - { field: rotting_threshold_days, label: Days to rot, type: number }
      - { field: requirements, label: Requirements, type: textarea }
  - id: archive_crm_stage_action
    type: server
    permission: crm.manage
    action: crm.stages.archive
    handler: yaml_mutation
    operation: update
    refresh: [crm_stage_detail, crm_stage_action]
    params: { values: { active: false } }
    mutation:
      operation: update
      table: crm_stages
      fields: [active]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM crm_stages WHERE id = :id AND active = true", status: 404, code: CRM_STAGE_NOT_FOUND, message: Active stage was not found. }
      result: { query: "SELECT * FROM crm_stages WHERE id = :id" }
  - id: unarchive_crm_stage_action
    type: server
    permission: crm.manage
    action: crm.stages.unarchive
    handler: yaml_mutation
    operation: update
    refresh: [crm_stage_detail, crm_stage_action]
    params: { values: { active: true } }
    mutation:
      operation: update
      table: crm_stages
      fields: [active]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM crm_stages WHERE id = :id AND active = false", status: 404, code: CRM_STAGE_NOT_FOUND, message: Archived stage was not found. }
      result: { query: "SELECT * FROM crm_stages WHERE id = :id" }
  - id: delete_crm_stage_action
    type: server
    permission: crm.manage
    action: crm.stages.delete
    handler: yaml_mutation
    operation: delete
    refresh: [crm_stage_detail, crm_stage_action]
    mutation:
      operation: delete
      table: crm_stages
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM crm_stages WHERE id = :id", status: 404, code: CRM_STAGE_NOT_FOUND, message: Stage was not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_leads WHERE stage = (SELECT name FROM crm_stages WHERE id = :id))", status: 409, code: CRM_STAGE_IN_USE, message: A stage used by opportunities cannot be deleted; archive it instead. }
      result: { query: "SELECT true AS deleted" }
