page: { id: leads }
datasources:
  - id: crm_leads
    single: false
    permission: crm.read
    workflow: crm_leads
    query: |
      SELECT id, row_version, name, type, partner_id, partner_name, email, phone, source, utm_campaign, utm_medium, utm_source, priority,
        expected_revenue, stage, probability, salesperson, team, tags,
        CAST(expected_closing AS VARCHAR) AS expected_closing,
        CAST(created_at AS VARCHAR) AS created_at
      FROM crm_leads
      WHERE (:q IS NULL OR name ILIKE '%' || :q || '%' OR partner_name ILIKE '%' || :q || '%' OR email ILIKE '%' || :q || '%' OR phone ILIKE '%' || :q || '%' OR source ILIKE '%' || :q || '%' OR utm_campaign ILIKE '%' || :q || '%' OR utm_medium ILIKE '%' || :q || '%' OR utm_source ILIKE '%' || :q || '%' OR tags ILIKE '%' || :q || '%')
        AND (:stage IS NULL OR stage = :stage)
        AND (:type IS NULL OR type = :type)
        AND (:salesperson IS NULL OR salesperson = :salesperson)
        AND (:team IS NULL OR team = :team)
        AND (:source IS NULL OR source = :source)
        AND (:utm_campaign IS NULL OR utm_campaign = :utm_campaign)
      ORDER BY created_at DESC
  - id: crm_lead_stages
    single: false
    permission: crm.read
    query: "SELECT name AS value, name AS label FROM crm_stages WHERE active = true ORDER BY sequence, name"
  - id: crm_lead_types
    single: false
    permission: crm.read
    query: "SELECT 'lead' AS value, 'Lead' AS label UNION ALL SELECT 'opportunity' AS value, 'Opportunity' AS label"
  - id: crm_salespeople
    single: false
    permission: crm.read
    query: "SELECT DISTINCT salesperson AS value, salesperson AS label FROM crm_leads WHERE NULLIF(TRIM(salesperson), '') IS NOT NULL ORDER BY salesperson"
  - id: crm_sales_teams
    single: false
    permission: crm.read
    query: "SELECT name AS value, name AS label FROM crm_teams WHERE active = true ORDER BY name"
  - id: crm_lost_reason_lookup
    single: false
    permission: crm.read
    query: "SELECT id AS value, name AS label FROM crm_lost_reasons WHERE active = true ORDER BY name"
  - id: crm_source_lookup
    permission: crm.read
    single: false
    query: "SELECT name AS value, name AS label FROM crm_sources WHERE active = true ORDER BY name"
  - id: crm_utm_campaign_lookup
    single: false
    permission: crm.read
    query: "SELECT DISTINCT utm_campaign AS value, utm_campaign AS label FROM crm_leads WHERE NULLIF(TRIM(utm_campaign), '') IS NOT NULL ORDER BY utm_campaign"
  - id: crm_lead_email_templates
    single: false
    permission: crm.read
    error_states:
      unauthorized: { status: 401, code: CRM_LEAD_EMAIL_TEMPLATES_UNAUTHORIZED, message: Sign in to view CRM email templates. }
      forbidden: { status: 403, code: CRM_LEAD_EMAIL_TEMPLATES_FORBIDDEN, message: You do not have permission to view CRM email templates. }
      transport_error: { status: 503, code: CRM_LEAD_EMAIL_TEMPLATES_UNAVAILABLE, message: CRM email templates are temporarily unavailable. }
    query: "SELECT id AS value, name AS label FROM crm_lead_mail_templates WHERE active = true ORDER BY name, id"
  - id: crm_contacts
    type: service
    service: yaml.service.base
    operation: contacts.search
    service_params: { query: q, limit: 100 }
    permission: base.contacts.read
actions:
  - id: send_leads_email
    type: server_form
    modal_style: mail_composer
    permission: crm.write
    title: Send Email
    submit_label: Send
    cancel_label: Discard
    success_message: Lead emails sent.
    action: crm.leads.email
    handler: yaml_mutation
    operation: bulk_send
    refresh: [crm_leads]
    mutation:
      fields: [subject, body_html, template_id, attachment_name]
      required: [subject]
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND CAST(:selectedIds AS VARCHAR) NOT LIKE '[]'", status: 400, code: CRM_LEAD_EMAIL_SELECTION_REQUIRED, message: Select at least one lead or opportunity. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_name, '')), '') IS NOT NULL", status: 403, code: CRM_LEAD_EMAIL_ACTOR_REQUIRED, message: A signed-in CRM user is required to send email. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM crm_leads WHERE id IN :selectedIds)", status: 404, code: CRM_LEAD_EMAIL_LEAD_NOT_FOUND, message: One or more selected leads were not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_leads WHERE id IN :selectedIds AND stage = 'Lost')", status: 409, code: CRM_LEAD_EMAIL_CLOSED, message: Lost leads cannot receive email. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_leads WHERE id IN :selectedIds AND (NULLIF(TRIM(COALESCE(email, '')), '') IS NULL OR POSITION('@' IN TRIM(email)) <= 1))", status: 422, code: CRM_LEAD_EMAIL_RECIPIENT_REQUIRED, message: Every selected lead must have a valid email address. }
        - { query: "SELECT 1 AS ok WHERE (NULLIF(TRIM(COALESCE(:template_id, '')), '') IS NOT NULL AND EXISTS (SELECT 1 FROM crm_lead_mail_templates WHERE id = :template_id AND active = true)) OR (LENGTH(TRIM(CAST(COALESCE(:subject, '') AS VARCHAR))) BETWEEN 1 AND 200 AND LENGTH(TRIM(CAST(COALESCE(:body_html, '') AS VARCHAR))) BETWEEN 1 AND 10000)", status: 422, code: CRM_LEAD_EMAIL_CONTENT_INVALID, message: Enter a subject and a message, or load an active template. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:template_id, '')), '') IS NULL OR EXISTS (SELECT 1 FROM crm_lead_mail_templates WHERE id = :template_id AND active = true)", status: 422, code: CRM_LEAD_EMAIL_TEMPLATE_INVALID, message: Select an active CRM email template. }
      steps:
        - for_each:
            input: selectedIds
            as: selected_lead_id
            steps:
              - query: "INSERT INTO crm_lead_mail_messages(id, lead_id, recipient_email, subject, body_html, template_id, attachment_name, sent_by, state, sent_at, row_version) SELECT 'crm-lead-mail-' || l.id || '-' || CAST(COALESCE((SELECT COUNT(*) FROM crm_lead_mail_messages prior WHERE prior.lead_id = l.id), 0) + 1 AS VARCHAR), l.id, l.email, COALESCE(t.subject, TRIM(CAST(:subject AS VARCHAR))), COALESCE(t.body_html, TRIM(CAST(COALESCE(:body_html, '') AS VARCHAR))), t.id, NULLIF(TRIM(CAST(COALESCE(:attachment_name, '') AS VARCHAR)), ''), :current_user_name, 'Sent', CURRENT_TIMESTAMP, 1 FROM crm_leads l LEFT JOIN crm_lead_mail_templates t ON t.id = :template_id AND t.active = true WHERE l.id = :selected_lead_id AND l.stage <> 'Lost'"
                expect_changed: true
                status: 409
                code: CRM_LEAD_EMAIL_SEND_FAILED
                message: A selected lead changed before its email could be sent. Reload and try again.
              - query: "INSERT INTO crm_activity_log(id, actor_id, actor_name, action, resource, resource_id, detail) SELECT gen_random_uuid(), :current_user_id, :current_user_name, 'crm.email', 'crm_leads', l.id, 'Sent email to ' || l.email || ': ' || COALESCE(t.subject, TRIM(CAST(:subject AS VARCHAR))) FROM crm_leads l LEFT JOIN crm_lead_mail_templates t ON t.id = :template_id AND t.active = true WHERE l.id = :selected_lead_id"
      result: { query: "SELECT id, lead_id, recipient_email, subject, body_html, template_id, attachment_name, sent_by, state, CAST(sent_at AS VARCHAR) AS sent_at, row_version FROM crm_lead_mail_messages WHERE lead_id IN :selectedIds ORDER BY sent_at DESC, id DESC" }
    fields:
      - { field: lead_names, label: Leads and opportunities, type: mail_recipient, default: Selected leads }
      - { field: subject, label: Subject, type: text, required: true }
      - { field: body_html, label: Message, type: mail_body, placeholder: Write your message here... }
      - { field: attachment_name, label: Attachments, type: mail_attachment }
      - { field: template_id, label: Load template, type: select, options_source: crm_lead_email_templates }
  - id: create_lead
    type: server_form
    permission: crm.write
    title: New lead
    action: crm.leads.create
    handler: yaml_mutation
    operation: create
    mutation:
      operation: insert
      table: crm_leads
      fields: [name, type, partner_id, partner_name, email, phone, description, source, utm_campaign, utm_medium, utm_source, tags, priority, expected_revenue, stage, probability, salesperson, team, expected_closing]
      required: [name]
      normalize_empty: [expected_revenue, probability, expected_closing]
      defaults: { stage: New, probability: 10, expected_revenue: 0 }
      guards:
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:partner_id, '') AS VARCHAR)), '') IS NULL OR LENGTH(TRIM(CAST(:partner_id AS VARCHAR))) > 0"
          status: 400
          message: Select a contact from the contact selector
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:source, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_sources WHERE name = :source AND active = true)"
          status: 400
          message: Select an active lead source
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams WHERE name = :team AND active = true)"
          status: 400
          message: Select an active sales team
        - query: "SELECT 1 AS ok WHERE CAST(COALESCE(:type, 'opportunity') AS VARCHAR) <> 'lead' OR NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams WHERE name = :team AND use_leads = true)"
          status: 409
          message: This sales team does not accept new leads
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:salesperson, '') AS VARCHAR)), '') IS NULL OR NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR NOT EXISTS (SELECT 1 FROM crm_team_members WHERE team_id = (SELECT id FROM crm_teams WHERE name = :team) AND active = true) OR EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = (SELECT id FROM crm_teams WHERE name = :team) AND m.user_name = :salesperson AND m.active = true)"
          status: 409
          message: Select a member of the sales team
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    fields:
      - { field: name, label: Opportunity, type: text, required: true }
      - { field: type, label: Type, type: select, options: [lead, opportunity], default: opportunity }
      - { field: partner_name, label: Customer, type: text }
      - { field: partner_id, label: Contact, type: async-select, options_source: crm_contacts }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: source, label: Source, type: select, options_source: crm_source_lookup }
      - { field: utm_campaign, label: UTM campaign, type: text }
      - { field: utm_medium, label: UTM medium, type: text }
      - { field: utm_source, label: UTM source, type: text }
      - { field: tags, label: Tags, type: text, placeholder: 'e.g. urgent, enterprise' }
      - { field: priority, label: Priority, type: select, options: [0, 1, 2, 3], default: 0 }
      - { field: expected_revenue, label: Expected revenue, type: number, default: 0 }
      - { field: probability, label: Probability, type: number, default: 10 }
      - { field: salesperson, label: Salesperson, type: text }
      - { field: team, label: Sales team, type: select, options_source: crm_sales_teams }
      - { field: expected_closing, label: Expected closing, type: date }
  - id: edit_lead
    type: server_form
    permission: crm.write
    title: Update lead
    action: crm.leads.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_leads]
    mutation:
      operation: update
      table: crm_leads
      fields: [name, type, partner_id, partner_name, email, phone, description, source, utm_campaign, utm_medium, utm_source, tags, priority, expected_revenue, probability, salesperson, team, expected_closing]
      required: [name]
      normalize_empty: [expected_revenue, probability, expected_closing]
      timestamps: true
      guards:
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:partner_id, '') AS VARCHAR)), '') IS NULL OR LENGTH(TRIM(CAST(:partner_id AS VARCHAR))) > 0"
          status: 400
          message: Select a contact from the contact selector
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:source, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_sources WHERE name = :source AND active = true)"
          status: 400
          message: Select an active lead source
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams WHERE name = :team AND active = true)"
          status: 400
          message: Select an active sales team
        - query: "SELECT id FROM crm_leads WHERE id = :id AND stage NOT IN ('Won', 'Lost')"
          status: 409
          message: Closed opportunities cannot be edited
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:salesperson, '') AS VARCHAR)), '') IS NULL OR NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR NOT EXISTS (SELECT 1 FROM crm_team_members WHERE team_id = (SELECT id FROM crm_teams WHERE name = :team) AND active = true) OR EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = (SELECT id FROM crm_teams WHERE name = :team) AND m.user_name = :salesperson AND m.active = true)"
          status: 409
          message: Select a member of the sales team
    fields:
      - { field: name, label: Opportunity, type: text, required: true }
      - { field: type, label: Type, type: select, options: [lead, opportunity] }
      - { field: partner_name, label: Customer, type: text }
      - { field: partner_id, label: Contact, type: async-select, options_source: crm_contacts }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: description, label: Notes, type: textarea }
      - { field: source, label: Source, type: select, options_source: crm_source_lookup }
      - { field: utm_campaign, label: UTM campaign, type: text }
      - { field: utm_medium, label: UTM medium, type: text }
      - { field: utm_source, label: UTM source, type: text }
      - { field: tags, label: Tags, type: text, placeholder: 'e.g. urgent, enterprise' }
      - { field: priority, label: Priority, type: select, options: [0, 1, 2, 3] }
      - { field: expected_revenue, label: Expected revenue, type: number, default: 0 }
      - { field: probability, label: Probability, type: number, default: 10 }
      - { field: salesperson, label: Salesperson, type: text }
      - { field: team, label: Sales team, type: select, options_source: crm_sales_teams }
      - { field: expected_closing, label: Expected closing, type: date }
  - id: qualify_lead
    type: server
    permission: crm.write
    action: crm.leads.qualify
    handler: order_transition
    workflow: crm_leads
    operation: qualify
    refresh: [crm_leads]
  - id: assign_lead_to_me
    type: server
    permission: crm.write
    action: crm.leads.assign_to_me
    handler: yaml_mutation
    operation: assign_to_me
    params: { id: '{row.id}' }
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT id FROM crm_leads WHERE id = :id AND stage NOT IN ('Won', 'Lost')"
          status: 409
          message: Closed opportunities cannot be assigned
        - query: "SELECT 1 AS ok FROM crm_leads l WHERE l.id = :id AND (NULLIF(TRIM(l.team), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams t WHERE t.name = l.team AND t.active = true))"
          status: 409
          message: Opportunities in archived sales teams cannot be assigned
        - query: "SELECT 1 AS ok FROM crm_leads l WHERE l.id = :id AND (NULLIF(TRIM(l.team), '') IS NULL OR NOT EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = (SELECT id FROM crm_teams WHERE name = l.team) AND m.active = true) OR EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = (SELECT id FROM crm_teams WHERE name = l.team) AND m.user_name = :current_user_name AND m.active = true))"
          status: 409
          message: You are not an active member of this sales team
      steps:
        - query: "UPDATE crm_leads SET salesperson = :current_user_name, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND stage NOT IN ('Won', 'Lost')"
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
  - id: convert_lead
    type: server
    permission: crm.write
    action: crm.leads.convert
    handler: yaml_mutation
    operation: convert
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT id FROM crm_leads WHERE id = :id AND type = 'lead' AND stage NOT IN ('Won', 'Lost')"
          status: 409
          message: Only open leads can be converted into opportunities
      steps:
        - query: "UPDATE crm_leads SET type = 'opportunity', updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND type = 'lead'"
        - query: "INSERT INTO crm_activities(lead_id, activity_type, summary, state, completed_at) VALUES(:id, 'stage_change', 'Lead converted to opportunity', 'done', CURRENT_TIMESTAMP)"
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
  - id: convert_leads_mass
    type: server_form
    permission: crm.write
    title: Convert to Opportunity
    submit_label: Convert to Opportunities
    cancel_label: Cancel
    action: crm.leads.mass_convert
    handler: yaml_mutation
    operation: mass_convert
    refresh: [crm_leads]
    fields:
      - { field: user_id, label: Salesperson, type: select, options_source: crm_salespeople }
      - { field: team_id, label: Sales Team, type: select, options_source: crm_sales_teams }
      - { field: force_assignment, label: Force assignment, type: checkbox, default: false }
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND CAST(:selectedIds AS VARCHAR) NOT LIKE '[]'"
          status: 400
          code: CRM_MASS_CONVERT_SELECTION_REQUIRED
          message: Select at least one lead to convert.
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:team_id, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams WHERE name = :team_id AND active = true)"
          status: 400
          code: CRM_MASS_CONVERT_TEAM_INVALID
          message: Select an active sales team.
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:user_id, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_team_members WHERE user_name = :user_id AND active = true)"
          status: 400
          code: CRM_MASS_CONVERT_USER_INVALID
          message: Select an active salesperson.
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:team_id, '') AS VARCHAR)), '') IS NULL OR NULLIF(TRIM(CAST(COALESCE(:user_id, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_team_members m JOIN crm_teams t ON t.id = m.team_id WHERE t.name = :team_id AND t.active = true AND m.user_name = :user_id AND m.active = true)"
          status: 409
          code: CRM_MASS_CONVERT_ASSIGNMENT_INVALID
          message: Select a salesperson who belongs to the selected sales team.
      steps:
        - for_each:
            input: selectedIds
            as: selected_lead_id
            steps:
              - query: "UPDATE crm_leads SET updated_at = updated_at WHERE id = :selected_lead_id AND type = 'lead' AND stage NOT IN ('Won', 'Lost')"
                expect_changed: true
                status: 409
                code: CRM_MASS_CONVERT_SELECTION_INVALID
                message: Select only open leads that have not already been converted.
        - for_each:
            input: selectedIds
            as: selected_lead_id
            steps:
              - query: "UPDATE crm_leads SET type = 'opportunity', salesperson = CASE WHEN CAST(COALESCE(:force_assignment, false) AS BOOLEAN) THEN COALESCE(NULLIF(:user_id, ''), salesperson) ELSE COALESCE(NULLIF(salesperson, ''), NULLIF(:user_id, '')) END, team = COALESCE(NULLIF(:team_id, ''), team), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :selected_lead_id AND type = 'lead' AND stage NOT IN ('Won', 'Lost')"
                expect_changed: true
                status: 409
                code: CRM_MASS_CONVERT_STALE
                message: A selected lead changed before conversion. Reload and try again.
              - query: "INSERT INTO crm_activities(lead_id, activity_type, summary, state, completed_at) VALUES(:selected_lead_id, 'stage_change', 'Lead converted to opportunity', 'done', CURRENT_TIMESTAMP)"
      result: { query: "SELECT COUNT(*) AS converted_count FROM crm_leads WHERE id IN :selectedIds AND type = 'opportunity'" }
  - id: merge_leads
    type: server_form
    title: Merge Leads/Opportunities
    submit_label: Merge
    cancel_label: Cancel
    permission: crm.write
    action: crm.leads.merge
    handler: yaml_mutation
    operation: merge
    refresh: [crm_leads]
    fields:
      - { field: user_id, label: Salesperson, type: select, options_source: crm_salespeople }
      - { field: team_id, label: Sales Team, type: select, options_source: crm_sales_teams }
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost')) >= 2"
          status: 409
          message: Select at least two open leads or opportunities to merge
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:team_id, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams WHERE name = :team_id AND active = true)"
          status: 400
          message: Select an active sales team
      steps:
        - query: "UPDATE crm_leads AS survivor SET utm_campaign = COALESCE(NULLIF(survivor.utm_campaign, ''), (SELECT duplicate.utm_campaign FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.utm_campaign, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), utm_medium = COALESCE(NULLIF(survivor.utm_medium, ''), (SELECT duplicate.utm_medium FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.utm_medium, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), utm_source = COALESCE(NULLIF(survivor.utm_source, ''), (SELECT duplicate.utm_source FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.utm_source, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)) WHERE survivor.id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1)"
        - query: "UPDATE crm_leads AS survivor SET partner_id = COALESCE(survivor.partner_id, (SELECT duplicate.partner_id FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND duplicate.partner_id IS NOT NULL ORDER BY duplicate.id LIMIT 1)), partner_name = COALESCE(NULLIF(survivor.partner_name, ''), (SELECT duplicate.partner_name FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.partner_name, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), email = COALESCE(NULLIF(survivor.email, ''), (SELECT duplicate.email FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.email, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), phone = COALESCE(NULLIF(survivor.phone, ''), (SELECT duplicate.phone FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.phone, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), source = COALESCE(NULLIF(survivor.source, ''), (SELECT duplicate.source FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.source, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), salesperson = COALESCE(NULLIF(survivor.salesperson, ''), (SELECT duplicate.salesperson FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.salesperson, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), team = COALESCE(NULLIF(survivor.team, ''), (SELECT duplicate.team FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.team, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), tags = COALESCE(NULLIF(survivor.tags, ''), (SELECT duplicate.tags FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.tags, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), expected_revenue = COALESCE(NULLIF(survivor.expected_revenue, 0), (SELECT duplicate.expected_revenue FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND duplicate.expected_revenue IS NOT NULL ORDER BY duplicate.id LIMIT 1)), row_version = survivor.row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE survivor.id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1)"
        - query: "UPDATE crm_leads SET salesperson = COALESCE(NULLIF(:user_id, ''), salesperson), team = COALESCE(NULLIF(:team_id, ''), team), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1)"
        - query: "UPDATE crm_activities SET lead_id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1) WHERE lead_id IN :selectedIds AND lead_id <> (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1) AND lead_id IN (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost'))"
