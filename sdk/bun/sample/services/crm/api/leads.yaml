      result: { query: "SELECT * FROM crm_leads WHERE id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1)" }
  - id: mark_lead_won
    type: server
    permission: crm.write
    action: crm.leads.won
    handler: order_transition
    workflow: crm_leads
    operation: won
    refresh: [crm_leads]
  - id: mark_lead_lost
    type: server_form
    permission: crm.write
    title: Mark lead lost
    action: crm.leads.lost
    handler: order_transition
    workflow: crm_leads
    operation: lost
    refresh: [crm_leads]
    fields:
      - { field: lost_reason, label: Lost reason, type: select, options_source: crm_lost_reason_lookup, required: true }
  - id: bulk_delete_leads
    type: server
    permission: crm.write
    action: crm.leads.bulk_delete
    handler: yaml_mutation
    operation: bulk_delete
    confirm: 'Delete {count} selected leads?'
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE :ids IS NOT NULL"
          status: 400
          message: No records selected
      steps:
        - query: "DELETE FROM crm_leads WHERE id IN (SELECT UNNEST(:ids))"
      result: { query: "SELECT true AS deleted" }
