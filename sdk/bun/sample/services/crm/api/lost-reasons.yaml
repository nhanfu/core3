page: { id: crm-lost-reasons }
datasources:
  - id: crm_lost_reason_action
    permission: crm.manage
    error_states:
      unauthorized: { status: 401, code: CRM_LOST_REASONS_UNAUTHORIZED, message: Sign in to view lost reasons. }
      forbidden: { status: 403, code: CRM_LOST_REASONS_FORBIDDEN, message: You do not have permission to manage lost reasons. }
      transport_error: { status: 503, code: CRM_LOST_REASONS_UNAVAILABLE, message: Lost reasons are temporarily unavailable. }
    query: "SELECT r.id, r.row_version, r.name, r.active, (SELECT COUNT(*) FROM crm_leads l WHERE l.lost_reason = r.id) AS leads_count FROM crm_lost_reasons r WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND ((COALESCE(CAST(:active AS VARCHAR), 'active') = 'active' AND r.active = TRUE) OR (CAST(:active AS VARCHAR) = 'archived' AND r.active = FALSE)) AND (:q IS NULL OR r.name ILIKE '%' || :q || '%') ORDER BY r.name, r.id"
actions:
  - id: create_crm_lost_reason
    type: server_form
    permission: crm.manage
    title: New Lost Reason
    action: crm.lost_reasons.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_lost_reason_action]
    mutation:
      operation: insert
      table: crm_lost_reasons
      generated: [id]
      fields: [row_version, name, active]
      required: [name]
      defaults: { row_version: 1, active: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: CRM_LOST_REASON_NAME_REQUIRED, message: Lost reason name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_lost_reasons WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: CRM_LOST_REASON_EXISTS, message: A lost reason with this name already exists. }
      result: { query: "SELECT * FROM crm_lost_reasons WHERE id = :id" }
    fields:
      - { field: name, label: Description, type: text, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: edit_crm_lost_reason
    type: server_form
    permission: crm.manage
    title: Edit Lost Reason
    action: crm.lost_reasons.update
    handler: yaml_mutation
    operation: update
    prefill: state.crm_lost_reason_detail
    refresh: [crm_lost_reason_detail, crm_lost_reason_action]
    mutation:
      operation: update
      table: crm_lost_reasons
      fields: [name]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM crm_lost_reasons WHERE id = :id", status: 404, code: CRM_LOST_REASON_NOT_FOUND, message: Lost reason was not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: CRM_LOST_REASON_NAME_REQUIRED, message: Lost reason name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_lost_reasons WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: CRM_LOST_REASON_EXISTS, message: A lost reason with this name already exists. }
      result: { query: "SELECT * FROM crm_lost_reasons WHERE id = :id" }
    fields:
      - { field: name, label: Description, type: text, required: true }
  - id: archive_crm_lost_reason
    type: server
    permission: crm.manage
    action: crm.lost_reasons.archive
    handler: yaml_mutation
    operation: update
    refresh: [crm_lost_reason_detail, crm_lost_reason_action]
    params: { values: { active: false } }
    mutation:
      operation: update
      table: crm_lost_reasons
      fields: [active]
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM crm_lost_reasons WHERE id = :id AND active = TRUE", status: 404, code: CRM_LOST_REASON_NOT_FOUND, message: Active lost reason was not found. }]
      result: { query: "SELECT * FROM crm_lost_reasons WHERE id = :id" }
  - id: unarchive_crm_lost_reason
    type: server
    permission: crm.manage
    action: crm.lost_reasons.unarchive
    handler: yaml_mutation
    operation: update
    refresh: [crm_lost_reason_detail, crm_lost_reason_action]
    params: { values: { active: true } }
    mutation:
      operation: update
      table: crm_lost_reasons
      fields: [active]
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM crm_lost_reasons WHERE id = :id AND active = FALSE", status: 404, code: CRM_LOST_REASON_NOT_FOUND, message: Archived lost reason was not found. }]
      result: { query: "SELECT * FROM crm_lost_reasons WHERE id = :id" }
  - id: delete_crm_lost_reason
    type: server
    permission: crm.manage
    action: crm.lost_reasons.delete
    handler: yaml_mutation
    operation: delete
    refresh: [crm_lost_reason_detail, crm_lost_reason_action]
    mutation:
      operation: delete
      table: crm_lost_reasons
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM crm_lost_reasons WHERE id = :id", status: 404, code: CRM_LOST_REASON_NOT_FOUND, message: Lost reason was not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_leads WHERE lost_reason = :id)", status: 409, code: CRM_LOST_REASON_IN_USE, message: A lost reason used by opportunities cannot be deleted; archive it instead. }
