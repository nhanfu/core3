database:
  storage:
    driver: duckdb

files:
  driver: local
  path: ${CRM_UPLOAD_ROOT:-.data/crm-uploads}
  credentials: {}

attachments:
  crm_lead_attachment:
    download:
      route: /crm/attachments
      permission: crm.attachment.download
      query: SELECT a.* FROM crm_lead_attachments a JOIN crm_leads l ON l.id = a.lead_id WHERE a.id = :attachment_id
