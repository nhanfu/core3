title: Unassigned Leads
page: { id: unassigned-leads, breadcrumb: [Sales, CRM, Unassigned Leads], auth: { require: [crm.read] } }
datasources:
  - id: crm_unassigned_leads
    single: false
    permission: crm.read
    query: |
      SELECT id, row_version, name, type, partner_id, partner_name, source, priority,
        expected_revenue, stage, probability, team, tags,
        CAST(expected_closing AS VARCHAR) AS expected_closing,
        CAST(updated_at AS VARCHAR) AS updated_at
      FROM crm_leads
      WHERE active = true AND NULLIF(TRIM(salesperson), '') IS NULL
        AND stage NOT IN ('Won', 'Lost')
        AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR partner_name ILIKE '%' || :q || '%' OR tags ILIKE '%' || :q || '%')
      ORDER BY expected_closing NULLS LAST, updated_at DESC
  - id: crm_assignment_members
    single: false
    permission: crm.write
    query: "SELECT DISTINCT user_name AS value, user_name AS label FROM crm_team_members WHERE active = true ORDER BY user_name"
components:
  - type: ListView
    variant: odoo
    source: crm_unassigned_leads
    search: { label: Search unassigned leads, placeholder: Search unassigned leads... }
    columns:
      - { field: name, label: Opportunity, type: PrimaryEntityCell, sortable: true }
      - { field: partner_name, label: Customer }
      - { field: type, label: Type }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: tags, label: Tags }
      - { field: priority, label: Priority }
      - { field: expected_revenue, label: Expected revenue, align: right }
      - { field: probability, label: Probability, align: right }
      - { field: team, label: Sales team }
      - { field: expected_closing, label: Expected closing }
    page_size: 50
    row_key: id
    selectable: true
    row_actions: menu
    bulk_actions:
      - { id: assign_selected_leads, label: Assign selected, permission: crm.write }
      - { id: apply_assignment_rules, label: Apply assignment rules, permission: crm.manage }
    actions:
      - { id: assign_unassigned_lead, label: Assign to salesperson, permission: crm.write, variant: primary }
      - { id: open_unassigned_lead_customer, label: Open customer, permission: base.contacts.read, variant: secondary, show_if: "!!row.partner_id" }
      - { id: crm.unassigned_leads.export, label: Export, title: Export, icon: download }
    row_open_action: view_unassigned_lead
    row_double_click_action: view_unassigned_lead
actions:
  - id: open_unassigned_lead_customer
    type: navigate
    permission: base.contacts.read
    navigate_to: /contact-detail
    params: { id: '{row.partner_id}' }
  - id: assign_unassigned_lead
    type: server_form
    permission: crm.write
    title: Assign lead
    action: crm.leads.assign
    handler: yaml_mutation
    operation: assign
    prefill: row
    refresh: [crm_unassigned_leads]
    mutation:
      operation: update
      table: crm_leads
      fields: [salesperson]
      required: [salesperson]
      guards:
        - query: "SELECT 1 AS ok FROM crm_leads WHERE id = :id AND stage NOT IN ('Won', 'Lost') AND NULLIF(TRIM(salesperson), '') IS NULL"
          status: 409
          message: Lead is already assigned or closed
        - query: "SELECT 1 AS ok FROM crm_team_members m LEFT JOIN crm_teams t ON t.id = m.team_id WHERE m.user_name = :salesperson AND m.active = true AND (t.active = true OR t.id IS NULL) AND (t.name IS NULL OR t.name = (SELECT team FROM crm_leads WHERE id = :id))"
          status: 409
          message: Select an active member of this sales team
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    fields:
      - { field: salesperson, label: Salesperson, type: select, options_source: crm_assignment_members, required: true }
  - id: assign_selected_leads
    type: server_form
    permission: crm.write
    title: Assign selected leads
    action: crm.leads.assign_batch
    handler: yaml_mutation
    operation: assign_batch
    refresh: [crm_unassigned_leads]
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds) > 0 AND (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') AND NULLIF(TRIM(salesperson), '') IS NULL) = (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds)"
          status: 409
          message: Select only open unassigned leads
        - query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM crm_team_members m WHERE m.user_name = :salesperson AND m.active = true) AND NOT EXISTS (SELECT 1 FROM crm_leads l JOIN crm_teams t ON t.name = l.team WHERE l.id IN :selectedIds AND NULLIF(TRIM(l.team), '') IS NOT NULL AND NOT EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = t.id AND m.user_name = :salesperson AND m.active = true))"
          status: 409
          message: Select an active member of the selected sales teams
      steps:
        - query: "UPDATE crm_leads SET salesperson = :salesperson, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') AND NULLIF(TRIM(salesperson), '') IS NULL"
      result: { query: "SELECT * FROM crm_leads WHERE id IN :selectedIds ORDER BY updated_at DESC" }
    fields:
      - { field: salesperson, label: Salesperson, type: select, options_source: crm_assignment_members, required: true }
  - id: apply_assignment_rules
    type: server
    permission: crm.manage
    action: crm.leads.apply_assignment_rules
    handler: yaml_mutation
    operation: apply_rules
    refresh: [crm_unassigned_leads]
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds AND active = true AND stage NOT IN ('Won', 'Lost') AND NULLIF(TRIM(salesperson), '') IS NULL) = (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds)"
          status: 409
          message: Select only active unassigned open leads
      steps:
        - query: "UPDATE crm_leads l SET salesperson = (SELECT r.user_name FROM crm_assignment_rules r JOIN crm_team_members m ON m.user_name = r.user_name AND m.active = true LEFT JOIN crm_teams t ON t.id = r.team_id AND t.active = true WHERE r.active = true AND (r.team_id IS NULL OR t.id IS NOT NULL) AND (r.team_id IS NULL OR l.team = t.name) AND ((r.field = 'source' AND ((r.operator = 'equals' AND l.source = r.comparison_value) OR (r.operator = 'present' AND NULLIF(TRIM(l.source), '') IS NOT NULL))) OR (r.field = 'type' AND ((r.operator = 'equals' AND l.type = r.comparison_value) OR (r.operator = 'present' AND NULLIF(TRIM(l.type), '') IS NOT NULL))) OR (r.field = 'priority' AND ((r.operator = 'equals' AND CAST(l.priority AS VARCHAR) = r.comparison_value) OR (r.operator = 'present' AND l.priority IS NOT NULL))) OR (r.field = 'team' AND ((r.operator = 'equals' AND l.team = r.comparison_value) OR (r.operator = 'present' AND NULLIF(TRIM(l.team), '') IS NOT NULL)))) ORDER BY r.sequence, r.id LIMIT 1), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE l.id IN :selectedIds AND l.active = true AND l.stage NOT IN ('Won', 'Lost') AND NULLIF(TRIM(l.salesperson), '') IS NULL AND (SELECT r.user_name FROM crm_assignment_rules r JOIN crm_team_members m ON m.user_name = r.user_name AND m.active = true LEFT JOIN crm_teams t ON t.id = r.team_id AND t.active = true WHERE r.active = true AND (r.team_id IS NULL OR t.id IS NOT NULL) AND (r.team_id IS NULL OR l.team = t.name) AND ((r.field = 'source' AND ((r.operator = 'equals' AND l.source = r.comparison_value) OR (r.operator = 'present' AND NULLIF(TRIM(l.source), '') IS NOT NULL))) OR (r.field = 'type' AND ((r.operator = 'equals' AND l.type = r.comparison_value) OR (r.operator = 'present' AND NULLIF(TRIM(l.type), '') IS NOT NULL))) OR (r.field = 'priority' AND ((r.operator = 'equals' AND CAST(l.priority AS VARCHAR) = r.comparison_value) OR (r.operator = 'present' AND l.priority IS NOT NULL))) OR (r.field = 'team' AND ((r.operator = 'equals' AND l.team = r.comparison_value) OR (r.operator = 'present' AND NULLIF(TRIM(l.team), '') IS NOT NULL)))) ORDER BY r.sequence, r.id LIMIT 1) IS NOT NULL"
        - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at, created_by) SELECT gen_random_uuid(), l.id, 'assignment', 'Lead assigned by assignment rule', 'done', CURRENT_TIMESTAMP, :current_user_name FROM crm_leads l WHERE l.id IN :selectedIds AND NULLIF(TRIM(l.salesperson), '') IS NOT NULL AND NOT EXISTS (SELECT 1 FROM crm_activities a WHERE a.lead_id = l.id AND a.activity_type = 'assignment' AND a.summary = 'Lead assigned by assignment rule')"
      result: { query: "SELECT * FROM crm_leads WHERE id IN :selectedIds ORDER BY id" }
  - id: view_unassigned_lead
    type: navigate
    permission: crm.read
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
