title: Unassigned Leads
page: { id: unassigned-leads, breadcrumb: [Sales, CRM, Unassigned Leads], auth: { require: [crm.read] } }
components:
  - type: ListView
    variant: odoo
    source: crm_unassigned_leads
    search: { label: Search unassigned leads, placeholder: Search unassigned leads... }
    columns:
      - { field: name, label: Opportunity, type: PrimaryEntityCell, sortable: true }
      - { field: partner_name, label: Customer }
      - { field: type, label: Type }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: tags, label: Tags }
      - { field: priority, label: Priority }
      - { field: expected_revenue, label: Expected revenue, align: right }
      - { field: probability, label: Probability, align: right }
      - { field: team, label: Sales team }
      - { field: expected_closing, label: Expected closing }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        group_by: stage
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: stage, label: Stage }
            - { field: expected_revenue, label: Expected revenue }
            - { field: team, label: Sales team }
    page_size: 50
    row_key: id
    selectable: true
    bulk_actions:
      - { id: bulk_delete_unassigned_leads, label: Delete selected, permission: crm.write }
    row_open_action: view_unassigned_lead
    row_double_click_action: view_unassigned_lead
    form_view: { page: apps/services/crm/pages/lead-detail.yaml, side_panel: true }
actions:
  - id: view_unassigned_lead
    type: navigate
    permission: crm.read
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
