title: CRM Lead Tags
page:
  id: crm-tags
  breadcrumb: [CRM, Tags]
  auth: { require: [crm.read] }
datasources:
  - id: crm_tag_values
    type: local
    permission: crm.read
    query: "SELECT TRIM(tag) AS value, TRIM(tag) AS label, COUNT(*) AS lead_count FROM crm_leads, UNNEST(string_split(COALESCE(tags, ''), ',')) AS split(tag) WHERE NULLIF(TRIM(tag), '') IS NOT NULL AND (:q IS NULL OR TRIM(tag) ILIKE '%' || :q || '%') GROUP BY TRIM(tag) ORDER BY lead_count DESC, value"
  - id: crm_tag_configuration
    permission: crm.read
    query: "SELECT t.id, t.name, t.color, t.active, (SELECT COUNT(*) FROM crm_leads l WHERE ',' || replace(COALESCE(l.tags, ''), ' ', '') || ',' LIKE '%,' || replace(t.name, ' ', '') || ',%') AS lead_count FROM crm_tags t WHERE (:q IS NULL OR t.name ILIKE '%' || :q || '%') ORDER BY t.active DESC, t.name"
components:
  - type: ListView
    variant: odoo
    source: crm_tag_values
    search: { label: Search tags, placeholder: Search lead tags... }
    columns:
      - { field: value, label: Tag }
      - { field: lead_count, label: Leads }
  - type: ListView
    variant: odoo
    source: crm_tag_configuration
    create_action: create_crm_tag
    columns:
      - { field: name, label: Tag }
      - { field: lead_count, label: Leads }
      - { field: color, label: Color }
      - { field: active, label: Active, type: StatusChip }
    row_actions: menu
    actions:
      - { id: toggle_crm_tag, label: Toggle, permission: crm.manage, variant: ghost }
actions:
  - id: create_crm_tag
    type: server_form
    permission: crm.manage
    title: New CRM tag
    action: crm.tags.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_tag_configuration, crm_tag_values]
    mutation:
      operation: insert
      table: crm_tags
      fields: [name, color, active]
      required: [name]
      defaults: { color: 0, active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80 AND NOT EXISTS (SELECT 1 FROM crm_tags WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))))"
          status: 409
          message: CRM tag already exists
      result: { query: "SELECT * FROM crm_tags WHERE id = :id" }
    fields:
      - { field: name, label: Tag, type: text, required: true }
      - { field: color, label: Color index, type: number, default: 0 }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: toggle_crm_tag
    type: server
    permission: crm.manage
    action: crm.tags.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_tag_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_tags WHERE id = :id"
          status: 404
          message: CRM tag no longer exists
      steps:
        - query: "UPDATE crm_tags SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_tags WHERE id = :id" }
