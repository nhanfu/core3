title: Lost Reason
page: { id: crm-lost-reason-detail, breadcrumb: [CRM, Configuration, Pipeline, Lost Reasons], auth: { require: [crm.manage] } }
components:
  - type: OdooFormView
    source: crm_lost_reason_detail
    title_field: name
    status_field: active
    status_colors: { true: green, false: red }
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit, workflowStatus: Status }
    header_actions:
      - { id: back_to_crm_lost_reasons, label: Lost Reasons, variant: secondary, permission: crm.manage }
      - { id: edit_crm_lost_reason, label: Edit, variant: primary, permission: crm.manage }
      - { id: archive_crm_lost_reason, label: Archive, variant: danger, permission: crm.manage, show_if: 'state.crm_lost_reason_detail.active === true' }
      - { id: unarchive_crm_lost_reason, label: Restore, variant: secondary, permission: crm.manage, show_if: 'state.crm_lost_reason_detail.active === false' }
      - { id: delete_crm_lost_reason, label: Delete, variant: danger, permission: crm.manage, confirm: Delete this lost reason? }
    stat_buttons:
      - { id: view_lost_reason_leads, label: Leads, value_field: leads_count, permission: crm.read }
    groups:
      - title: Lost Reason
        fields:
          - { field: name, label: Description }
          - { field: active, label: Active }
