title: Activity Plans
page: { id: crm-activity-plans, route: /crm/activity-plans, breadcrumb: [CRM, Configuration, Activities, Activity Plans], auth: { require: [crm.manage] } }
components:
  - type: ListView
    variant: odoo
    source: crm_activity_plans_action
    create_action: create_crm_activity_plan_action
    create_label: New
    search: { label: Search, placeholder: Search activity plans... }
    filters: [{ field: active, label: Archived, options: [{ id: archived, label: Archived }] }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Kanban
        icon: grid
        card:
          title: name
          subtitle: step_count
          fields: [{ field: active, label: Active }]
    form_view: { page: apps/services/crm/pages/activity-plan-detail.yaml, side_panel: true }
    row_key: id
    selectable: true
    row_open_action: edit_crm_activity_plan_action
    row_double_click_action: edit_crm_activity_plan_action
    row_actions: menu
    bulk_actions:
      - { id: delete_selected_crm_activity_plans, label: Delete selected, permission: crm.manage, variant: danger }
    columns:
      - { field: name, label: Activity Plan, type: PrimaryEntityCell }
      - { field: step_count, label: Steps, align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    empty_state: { title: Create an Activity Plan, description: Define ordered activities to apply to leads and opportunities. }
