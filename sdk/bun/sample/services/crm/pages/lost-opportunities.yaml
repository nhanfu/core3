title: Lost Opportunities
page: { id: lost-opportunities, breadcrumb: [Sales, CRM, Lost Opportunities], auth: { require: [crm.read] } }
datasources:
  - id: crm_lost_opportunities
    single: false
    permission: crm.read
    query: |
      SELECT id, row_version, name, partner_id, partner_name, email, phone, source,
        expected_revenue, salesperson, team, lost_reason, tags,
        CAST(expected_closing AS VARCHAR) AS expected_closing,
        CAST(updated_at AS VARCHAR) AS updated_at
      FROM crm_leads
      WHERE active = true AND stage = 'Lost'
        AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR partner_name ILIKE '%' || :q || '%' OR tags ILIKE '%' || :q || '%')
        AND (:lost_reason IS NULL OR lost_reason = :lost_reason)
      ORDER BY updated_at DESC
  - id: crm_lost_reason_filter
    single: false
    permission: crm.read
    query: "SELECT id AS value, name AS label FROM crm_lost_reasons ORDER BY name"
components:
  - type: ListView
    variant: odoo
    source: crm_lost_opportunities
    search: { label: Search lost opportunities, placeholder: Search lost opportunities... }
    filters: [{ field: lost_reason, label: Lost reason, options_source: crm_lost_reason_filter }]
    columns:
      - { field: name, label: Opportunity, type: PrimaryEntityCell, sortable: true }
      - { field: partner_name, label: Customer }
      - { field: expected_revenue, label: Expected revenue, align: right }
      - { field: salesperson, label: Salesperson }
      - { field: team, label: Sales team }
      - { field: lost_reason, label: Lost reason }
      - { field: tags, label: Tags }
      - { field: updated_at, label: Lost on }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: open_lost_opportunity_customer, label: Open customer, permission: base.contacts.read, variant: secondary, show_if: "!!row.partner_id" }
      - { id: crm.lost_opportunities.export, label: Export, title: Export, icon: download }
    selectable: true
    bulk_actions:
      - { id: restore_lost_opportunities, label: Restore selected, permission: crm.write }
    row_open_action: view_lost_opportunity
    row_double_click_action: view_lost_opportunity
    form_view: { page: apps/services/crm/pages/lead-detail.yaml, side_panel: true }
actions:
  - id: open_lost_opportunity_customer
    type: navigate
    permission: base.contacts.read
    navigate_to: /contact-detail
    params: { id: '{row.partner_id}' }
  - id: restore_lost_opportunities
    type: server
    permission: crm.write
    action: crm.leads.restore_lost
    handler: yaml_mutation
    operation: restore_lost
    refresh: [crm_lost_opportunities]
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds AND stage = 'Lost') > 0"
          status: 409
          message: Select at least one lost opportunity
      steps:
        - query: "UPDATE crm_leads SET stage = 'New', lost_reason = NULL, probability = COALESCE((SELECT probability FROM crm_stages WHERE name = 'New' AND active = true), 10), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id IN :selectedIds AND stage = 'Lost'"
        - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at) SELECT gen_random_uuid(), id, 'stage_change', 'Opportunity restored', 'done', CURRENT_TIMESTAMP FROM crm_leads WHERE id IN :selectedIds AND stage = 'New'"
      result: { query: "SELECT * FROM crm_leads WHERE id IN :selectedIds ORDER BY updated_at DESC" }
  - id: view_lost_opportunity
    type: navigate
    permission: crm.read
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
