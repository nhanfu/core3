workflow:
  id: crm_leads
  entity: crm_leads
  handler: crm_lead_status
  initial: New
  permission: crm.write
  mutable: true
  status_source: crm_lead_stages
  status_query: SELECT stage AS status FROM crm_leads WHERE id = ?
  default_mutation:
    guards:
      - query: "SELECT id FROM crm_leads WHERE id = :id AND stage = :current_status"
        status: 409
        message: Lead stage has changed; refresh and try again
      - query: "SELECT 1 AS ok FROM crm_leads l WHERE l.id = :id AND (NOT EXISTS (SELECT 1 FROM crm_stage_teams st WHERE st.stage_id = (SELECT id FROM crm_stages WHERE name = :target_status)) OR NULLIF(TRIM(l.team), '') IS NULL OR EXISTS (SELECT 1 FROM crm_stage_teams st JOIN crm_teams t ON t.id = st.team_id WHERE st.stage_id = (SELECT id FROM crm_stages WHERE name = :target_status) AND t.name = l.team AND t.active = true))"
        status: 409
        message: This stage is not available for the opportunity sales team
    steps:
      - query: "UPDATE crm_leads SET stage = :target_status, probability = COALESCE((SELECT probability FROM crm_stages WHERE name = :target_status), probability), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id"
      - query: "INSERT INTO crm_activities(lead_id, activity_type, summary, state, completed_at) VALUES(:id, 'stage_change', CAST(:current_status AS VARCHAR) || ' -> ' || CAST(:target_status AS VARCHAR), 'done', CURRENT_TIMESTAMP)"
    result: { query: "SELECT *, :current_status AS previous_status FROM crm_leads WHERE id = :id" }
  states:
    - { id: New, label: New, color: neutral }
    - { id: Qualified, label: Qualified, color: blue }
    - { id: Proposition, label: Proposition, color: amber }
    - { id: Won, label: Won, color: green, terminal: true }
    - { id: Lost, label: Lost, color: red, terminal: true }
  transitions:
    - id: reopen
      from: [Lost]
      to: New
      permission: crm.write
      mutation:
        steps:
          - query: "UPDATE crm_leads SET stage = 'New', lost_reason = NULL, probability = 10, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND stage = 'Lost'"
          - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at) VALUES(gen_random_uuid(), :id, 'stage_change', 'Opportunity reopened', 'done', CURRENT_TIMESTAMP)"
        result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    - id: qualify
      from: [New]
      to: Qualified
      permission: crm.write
      mutation:
        guards:
          - query: "SELECT id FROM crm_leads WHERE id = :id AND stage = 'New'"
            status: 409
            message: Only new leads can be qualified
          - query: "SELECT id FROM crm_leads WHERE id = :id AND stage = 'New' AND NULLIF(TRIM(COALESCE(partner_name, '')), '') IS NOT NULL AND NULLIF(TRIM(COALESCE(source, '')), '') IS NOT NULL AND NULLIF(TRIM(COALESCE(salesperson, '')), '') IS NOT NULL AND COALESCE(expected_revenue, 0) > 0"
            status: 400
            message: Complete contact, source, owner, and expected revenue before qualification
        steps:
          - query: "UPDATE crm_leads SET stage = 'Qualified', probability = COALESCE((SELECT probability FROM crm_stages WHERE name = 'Qualified'), probability), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id"
          - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at) VALUES(gen_random_uuid(), :id, 'stage_change', 'New -> Qualified', 'done', CURRENT_TIMESTAMP)"
        result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    - id: propose
      from: [Qualified]
      to: Proposition
      permission: crm.write
    - id: won
      from: [Proposition, Qualified]
      to: Won
      permission: crm.write
      mutation:
        guards:
          - query: "SELECT id FROM crm_leads WHERE id = :id AND stage IN ('Qualified', 'Proposition')"
            status: 409
            message: Lead must be qualified before it is won
        steps:
          - query: "UPDATE crm_leads SET stage = 'Won', probability = 100, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id"
          - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at) VALUES(gen_random_uuid(), :id, 'stage_change', 'Opportunity marked won', 'done', CURRENT_TIMESTAMP)"
        result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    - id: lost
      from: [New, Qualified, Proposition]
      to: Lost
      permission: crm.write
      mutation:
        guards:
          - query: "SELECT id FROM crm_leads WHERE id = :id AND stage IN ('New', 'Qualified', 'Proposition')"
            status: 409
            message: Lead is already closed
          - query: "SELECT id FROM crm_lost_reasons WHERE id = :lost_reason AND active = true"
            status: 400
            message: Select an active lost reason
        steps:
          - query: "UPDATE crm_leads SET stage = 'Lost', lost_reason = :lost_reason, probability = 0, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id"
          - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at) VALUES(gen_random_uuid(), :id, 'stage_change', 'Opportunity marked lost', 'done', CURRENT_TIMESTAMP)"
        result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
