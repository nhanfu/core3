workflow:
  id: crm_leads
  entity: crm_leads
  handler: crm_lead_status
  initial: New
  permission: crm.write
  mutable: true
  status_source: crm_lead_stages
  status_query: SELECT stage AS status FROM crm_leads WHERE id = ?
  default_mutation:
    guards:
      - query: "SELECT id FROM crm_leads WHERE id = :id AND stage = :current_status"
        status: 409
        message: Lead stage has changed; refresh and try again
    steps:
      - query: "UPDATE crm_leads SET stage = :target_status, probability = COALESCE((SELECT probability FROM crm_stages WHERE name = :target_status), probability), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id"
      - query: "INSERT INTO crm_activities(lead_id, activity_type, summary, state, completed_at) VALUES(:id, 'stage_change', CAST(:current_status AS VARCHAR) || ' -> ' || CAST(:target_status AS VARCHAR), 'done', CURRENT_TIMESTAMP)"
    result: { query: "SELECT *, :current_status AS previous_status FROM crm_leads WHERE id = :id" }
  states:
    - { id: New, label: New, color: neutral }
    - { id: Qualified, label: Qualified, color: blue }
    - { id: Proposition, label: Proposition, color: amber }
    - { id: Won, label: Won, color: green, terminal: true }
    - { id: Lost, label: Lost, color: red, terminal: true }
  transitions:
    - id: reopen
      from: [Lost]
      to: New
      permission: crm.write
      mutation:
        steps:
          - query: "UPDATE crm_leads SET stage = 'New', lost_reason = NULL, probability = 10, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND stage = 'Lost'"
          - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at) VALUES(gen_random_uuid(), :id, 'stage_change', 'Opportunity reopened', 'done', CURRENT_TIMESTAMP)"
        result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    - id: qualify
      from: [New]
      to: Qualified
      permission: crm.write
      mutation:
        guards:
          - query: "SELECT id FROM crm_leads WHERE id = :id AND stage = 'New'"
            status: 409
            message: Only new leads can be qualified
        steps:
          - query: "UPDATE crm_leads SET stage = 'Qualified', probability = COALESCE((SELECT probability FROM crm_stages WHERE name = 'Qualified'), probability), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id"
        result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    - id: propose
      from: [Qualified]
      to: Proposition
      permission: crm.write
    - id: won
      from: [Proposition, Qualified]
      to: Won
      permission: crm.write
      mutation:
        guards:
          - query: "SELECT id FROM crm_leads WHERE id = :id AND type = 'opportunity' AND stage IN ('Qualified', 'Proposition') AND row_version = :expected_row_version"
            status: 409
            code: STALE_RECORD
            message: Only an open opportunity at a qualified stage can be marked won
        steps:
          - query: "UPDATE crm_leads SET stage = 'Won', probability = 100, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND type = 'opportunity' AND stage IN ('Qualified', 'Proposition') AND row_version = :expected_row_version"
            expect_changed: true
            status: 409
            code: STALE_RECORD
            message: Opportunity was changed before it could be marked won
          - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at) VALUES(gen_random_uuid(), :id, 'stage_change', 'Opportunity marked won', 'done', CURRENT_TIMESTAMP)"
        result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    - id: lost
      from: [New, Qualified, Proposition]
      to: Lost
      permission: crm.write
      mutation:
        guards:
          - query: "SELECT id FROM crm_leads WHERE id = :id AND stage IN ('New', 'Qualified', 'Proposition') AND row_version = :expected_row_version"
            status: 409
            code: STALE_RECORD
            message: Lead was changed by another user. Reload it before marking it lost.
          - query: "SELECT id FROM crm_lost_reasons WHERE id = :lost_reason AND active = true"
            status: 400
            message: Select an active lost reason
        steps:
          - query: "UPDATE crm_leads SET stage = 'Lost', lost_reason = :lost_reason, probability = 0, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version"
            expect_changed: true
            status: 409
            code: STALE_RECORD
            message: Lead was changed by another user. Reload it before marking it lost.
          - query: "INSERT INTO crm_activity_log(actor_id, actor_name, action, resource, resource_id, detail) SELECT :current_user_id, :current_user_name, 'crm.note', 'crm_leads', :id, 'Lost Comment: ' || TRIM(CAST(:lost_feedback AS VARCHAR)) WHERE NULLIF(TRIM(CAST(COALESCE(:lost_feedback, '') AS VARCHAR)), '') IS NOT NULL"
        result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
