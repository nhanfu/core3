title: Lost Reasons
page: { id: crm-lost-reasons, route: /lost-reasons, breadcrumb: [CRM, Configuration, Pipeline, Lost Reasons], auth: { require: [crm.manage] } }
components:
  - type: ListView
    variant: odoo
    source: crm_lost_reason_action
    create_action: create_crm_lost_reason
    create_label: New
    search: { label: Search Opportunities, placeholder: Search... }
    filters: [{ field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - { id: form, label: Form, icon: edit }
    form_view: { page: apps/services/crm/pages/crm-lost-reason-detail.yaml, side_panel: true }
    row_key: id
    row_open_action: edit_crm_lost_reason
    row_double_click_action: edit_crm_lost_reason
    row_actions: menu
    columns:
      - { field: name, label: Description, type: PrimaryEntityCell, mobile: true }
      - { field: id, label: '', sortable: false, actions: [{ id: edit_crm_lost_reason, label: Edit, icon: edit }, { id: archive_crm_lost_reason, label: Archive, icon: archive, show_if: 'row.active === true' }, { id: unarchive_crm_lost_reason, label: Restore, icon: refresh, show_if: 'row.active === false' }, { id: delete_crm_lost_reason, label: Delete, icon: trash, variant: danger }] }
    page_size: 50
    empty_state: { title: Create a Lost Reason, description: Use Lost Reasons to report on why opportunities are lost. }
