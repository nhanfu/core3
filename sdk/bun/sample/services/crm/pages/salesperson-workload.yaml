title: Salesperson Workload
page: { id: salesperson-workload, breadcrumb: [Sales, CRM, Salesperson Workload], auth: { require: [crm.read] } }
datasources:
  - id: crm_salesperson_workload
    single: false
    permission: crm.read
    query: "SELECT COALESCE(NULLIF(TRIM(l.salesperson), ''), 'Unassigned') AS salesperson, COUNT(DISTINCT l.id) FILTER (WHERE l.active = true AND l.stage NOT IN ('Won', 'Lost')) AS open_opportunities, COUNT(a.id) FILTER (WHERE a.state = 'planned' AND a.due_date >= CURRENT_DATE) AS planned_activities, COUNT(a.id) FILTER (WHERE a.state = 'planned' AND a.due_date < CURRENT_DATE) AS overdue_activities, SUM(CASE WHEN l.active = true AND l.stage NOT IN ('Won', 'Lost') THEN COALESCE(l.expected_revenue, 0) * COALESCE(l.probability, 0) / 100 ELSE 0 END) AS weighted_pipeline FROM crm_leads l LEFT JOIN crm_activities a ON a.lead_id = l.id WHERE l.active = true GROUP BY COALESCE(NULLIF(TRIM(l.salesperson), ''), 'Unassigned') ORDER BY overdue_activities DESC, open_opportunities DESC, salesperson"
components:
  - type: ListView
    variant: odoo
    source: crm_salesperson_workload
    columns:
      - { field: salesperson, label: Salesperson, type: PrimaryEntityCell }
      - { field: open_opportunities, label: Open opportunities, align: right }
      - { field: planned_activities, label: Planned activities, align: right }
      - { field: overdue_activities, label: Overdue activities, align: right }
      - { field: weighted_pipeline, label: Weighted pipeline, align: right }
    row_key: salesperson
    row_actions: menu
    actions:
      - { id: open_workload_pipeline, label: Open pipeline, permission: crm.read, variant: ghost }
      - { id: open_workload_activities, label: Open activities, permission: crm.read, variant: ghost }
actions:
  - id: open_workload_pipeline
    type: navigate
    permission: crm.read
    navigate_to: /leads
    params: { salesperson: '{row.salesperson}' }
  - id: open_workload_activities
    type: navigate
    permission: crm.read
    navigate_to: /crm-activities
    params: { assigned_to: '{row.salesperson}' }
