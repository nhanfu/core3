title: CRM
page: { id: leads, breadcrumb: [Sales, CRM, Leads], auth: { require: [crm.read] } }
datasources:
  - id: crm_leads
    single: false
    permission: crm.read
    workflow: crm_leads
    query: |
      WITH scored_leads AS (
        SELECT l.*,
          CAST(COALESCE((SELECT SUM(r.points) FROM crm_scoring_rules r WHERE r.active = true AND (
            (r.field = 'email' AND r.operator = 'present' AND NULLIF(TRIM(l.email), '') IS NOT NULL) OR
            (r.field = 'phone' AND r.operator = 'present' AND NULLIF(TRIM(l.phone), '') IS NOT NULL) OR
            (r.field = 'source' AND r.operator = 'equals' AND l.source = r.comparison_value) OR
            (r.field = 'expected_revenue' AND r.operator = 'gte' AND l.expected_revenue >= CAST(r.comparison_value AS DECIMAL(18,2))) OR
            (r.field = 'type' AND r.operator = 'equals' AND l.type = r.comparison_value)
          )), 0) AS INTEGER) AS calculated_score
        FROM crm_leads l
        WHERE l.active = true
      )
      SELECT id, row_version, name, type, partner_id, partner_name, email, phone, source, utm_campaign, utm_medium, utm_source, priority,
        expected_revenue, recurring_revenue, recurring_plan, stage,
        (SELECT requirements FROM crm_stages s WHERE s.name = scored_leads.stage AND s.active = true) AS stage_requirements,
        (SELECT COUNT(*) FROM crm_opportunity_lines x WHERE x.lead_id = scored_leads.id) AS line_count,
        (SELECT COALESCE(SUM(x.line_total), 0) FROM crm_opportunity_lines x WHERE x.lead_id = scored_leads.id) AS line_subtotal,
        (SELECT COALESCE(SUM(x.line_total), 0) FROM crm_opportunity_lines x WHERE x.lead_id = scored_leads.id) * scored_leads.probability / 100 AS weighted_line_value,
        probability, salesperson, team, tags, calculated_score AS lead_score,
        CASE WHEN calculated_score >= 70 THEN 'Hot' WHEN calculated_score >= 30 THEN 'Warm' ELSE 'Cold' END AS lead_grade,
        (SELECT a.activity_type FROM crm_activities a WHERE a.lead_id = scored_leads.id AND a.state = 'planned' ORDER BY a.due_date NULLS LAST, a.id LIMIT 1) AS next_activity_type,
        (SELECT a.summary FROM crm_activities a WHERE a.lead_id = scored_leads.id AND a.state = 'planned' ORDER BY a.due_date NULLS LAST, a.id LIMIT 1) AS next_activity_summary,
        (SELECT CAST(a.due_date AS VARCHAR) FROM crm_activities a WHERE a.lead_id = scored_leads.id AND a.state = 'planned' ORDER BY a.due_date NULLS LAST, a.id LIMIT 1) AS next_activity_due_date,
        (SELECT a.assigned_to FROM crm_activities a WHERE a.lead_id = scored_leads.id AND a.state = 'planned' ORDER BY a.due_date NULLS LAST, a.id LIMIT 1) AS next_activity_assignee,
        CASE WHEN EXISTS (SELECT 1 FROM crm_activities a WHERE a.lead_id = scored_leads.id AND a.state = 'planned' AND a.due_date < CURRENT_DATE) THEN true ELSE false END AS next_activity_overdue,
        CAST(expected_closing AS VARCHAR) AS expected_closing,
        CAST(created_at AS VARCHAR) AS created_at
      FROM scored_leads
      WHERE (:q IS NULL OR name ILIKE '%' || :q || '%' OR partner_name ILIKE '%' || :q || '%' OR email ILIKE '%' || :q || '%' OR phone ILIKE '%' || :q || '%' OR source ILIKE '%' || :q || '%' OR utm_campaign ILIKE '%' || :q || '%' OR utm_medium ILIKE '%' || :q || '%' OR utm_source ILIKE '%' || :q || '%' OR tags ILIKE '%' || :q || '%')
        AND (:stage IS NULL OR stage = :stage)
        AND (:type IS NULL OR type = :type)
        AND (:salesperson IS NULL OR salesperson = :salesperson)
        AND (:team IS NULL OR team = :team)
        AND (COALESCE(:can_manage_crm, true) = true OR NULLIF(TRIM(team), '') IS NULL OR EXISTS (SELECT 1 FROM crm_team_members m JOIN crm_teams t ON t.id = m.team_id WHERE t.name = team AND t.active = true AND m.user_name = :current_user_name AND m.active = true))
        AND (:source IS NULL OR source = :source)
        AND (:utm_campaign IS NULL OR utm_campaign = :utm_campaign)
        AND (:score_min IS NULL OR calculated_score >= CAST(:score_min AS INTEGER))
        AND (:score_max IS NULL OR calculated_score <= CAST(:score_max AS INTEGER))
        AND (:activity_state IS NULL OR EXISTS (SELECT 1 FROM crm_activities a WHERE a.lead_id = scored_leads.id AND a.state = :activity_state))
      ORDER BY created_at DESC
  - id: crm_lead_stages
    single: false
    permission: crm.read
    query: "SELECT s.name AS value, s.name AS label FROM crm_stages s WHERE s.active = true AND (NOT EXISTS (SELECT 1 FROM crm_stage_teams st WHERE st.stage_id = s.id) OR EXISTS (SELECT 1 FROM crm_leads l JOIN crm_stage_teams st ON st.team_id = (SELECT id FROM crm_teams WHERE name = l.team) WHERE st.stage_id = s.id)) ORDER BY s.sequence, s.name"
  - id: crm_lead_types
    single: false
    permission: crm.read
    query: "SELECT 'lead' AS value, 'Lead' AS label UNION ALL SELECT 'opportunity' AS value, 'Opportunity' AS label"
  - id: crm_salespeople
    single: false
    permission: crm.read
    query: "SELECT DISTINCT salesperson AS value, salesperson AS label FROM crm_leads WHERE NULLIF(TRIM(salesperson), '') IS NOT NULL ORDER BY salesperson"
  - id: crm_active_salespeople
    single: false
    permission: crm.read
    query: "SELECT DISTINCT user_name AS value, user_name AS label FROM crm_team_members WHERE active = true ORDER BY user_name"
  - id: crm_duplicate_preview
    single: false
    permission: crm.read
    query: |
      SELECT MIN(id) AS survivor_id, MAX(id) AS duplicate_id,
        COALESCE(NULLIF(partner_name, ''), NULLIF(email, ''), 'Unnamed') AS match_key,
        COUNT(*) AS match_count
      FROM crm_leads
      WHERE active = true AND (NULLIF(TRIM(partner_name), '') IS NOT NULL OR NULLIF(TRIM(email), '') IS NOT NULL)
      GROUP BY COALESCE(NULLIF(partner_name, ''), NULLIF(email, ''), 'Unnamed')
      HAVING COUNT(*) > 1
      ORDER BY match_count DESC, match_key
  - id: crm_sales_teams
    single: false
    permission: crm.read
    query: "SELECT name AS value, name AS label FROM crm_teams WHERE active = true ORDER BY name"
  - id: crm_lost_reason_lookup
    single: false
    permission: crm.read
    query: "SELECT id AS value, name AS label FROM crm_lost_reasons WHERE active = true ORDER BY name"
  - id: crm_source_lookup
    permission: crm.read
    single: false
    query: "SELECT name AS value, name AS label FROM crm_sources WHERE active = true ORDER BY name"
  - id: crm_tag_lookup
    permission: crm.read
    single: false
    query: "SELECT name AS value, name AS label FROM crm_tags ORDER BY active DESC, name"
  - id: crm_utm_campaign_lookup
    single: false
    permission: crm.read
    query: "SELECT name AS value, name AS label FROM crm_campaigns WHERE active = true UNION SELECT DISTINCT utm_campaign AS value, utm_campaign AS label FROM crm_leads WHERE NULLIF(TRIM(utm_campaign), '') IS NOT NULL ORDER BY value"
  - id: crm_contacts
    type: service
    service: yaml.service.base
    operation: contacts.search
    service_params: { query: q, limit: 100 }
    permission: base.contacts.read
  - id: crm_persisted_pipeline_views
    single: false
    permission: crm.read
    query: "SELECT id, view_key, label, filters, group_by, filter_version FROM ui_saved_views v WHERE resource = 'crm_leads' AND (owner_id = :current_user_id OR (visibility = 'shared' AND (v.team IS NULL OR EXISTS (SELECT 1 FROM crm_team_members m JOIN crm_teams t ON t.id = m.team_id WHERE t.name = v.team AND t.active = true AND m.user_name = :current_user_name AND m.active = true)))) ORDER BY label"
  - id: crm_activity_state_lookup
    single: false
    permission: crm.read
    query: "SELECT value, label FROM (VALUES ('planned', 'Has planned activity'), ('done', 'Has completed activity')) states(value, label)"
components:
  - type: ListView
    variant: odoo
    source: crm_leads
    saved_views_source: crm_persisted_pipeline_views
    saved_views_version: 1
    create_action: create_lead
    create_label: New
    search: { label: Search leads, placeholder: Search opportunities and customers... }
    filters:
      - { field: stage, label: Stage, options_source: crm_lead_stages }
      - { field: type, label: Type, options_source: crm_lead_types }
      - { field: salesperson, label: Salesperson, options_source: crm_salespeople }
      - { field: team, label: Sales team, options_source: crm_sales_teams }
      - { field: source, label: Lead source, options_source: crm_source_lookup }
      - { field: utm_campaign, label: UTM campaign, options_source: crm_utm_campaign_lookup }
      - { field: score_min, label: Minimum lead score, options: [{ id: '0', label: '0+' }, { id: '30', label: '30+' }, { id: '70', label: '70+' }] }
      - { field: score_max, label: Maximum lead score, options: [{ id: '30', label: '30 or less' }, { id: '70', label: '70 or less' }, { id: '100', label: '100 or less' }] }
      - { field: activity_state, label: Activity state, options_source: crm_activity_state_lookup }
    favorites:
      - id: my_pipeline
        label: Proposition Pipeline
        filters: { type: opportunity, stage: Proposition }
        group_by: stage
      - id: unassigned
        label: Unassigned
        filters: { salesperson: '' }
      - id: open_leads
        label: Open Leads
        filters: { type: lead }
        group_by: stage
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        group_by: stage
        groups_source: crm_lead_stages
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: expected_revenue, label: Expected revenue }
            - { field: probability, label: Probability }
            - { field: next_activity_summary, label: Next activity }
            - { field: next_activity_due_date, label: Next activity due }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: stage
        groups_source: crm_lead_stages
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: expected_revenue, label: Expected revenue }
            - { field: probability, label: Probability }
            - { field: next_activity_summary, label: Next activity }
            - { field: next_activity_due_date, label: Next activity due }
      - id: calendar
        label: Calendar
        icon: calendar
        date_field: expected_closing
        card:
          title: name
          subtitle: partner_name
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields:
            - { field: stage, column: Stage }
            - { field: tags, column: Tags }
            - { field: type, column: Type }
            - { field: source, column: Source }
            - { field: team, column: Sales team }
            - { field: expected_closing, column: Expected closing, type: date }
            - { field: salesperson, column: Salesperson }
            - { field: probability, column: Probability }
            - { field: expected_revenue, column: Expected revenue }
          default:
            rows: [stage]
            columns: [team]
            measures:
              - { field: expected_revenue, aggregate: sum, column: Expected revenue }
              - { field: probability, aggregate: average, column: Probability }
          date_ranges: { expected_closing: month }
      - id: graph
        label: Graph
        icon: graph
        category_field: stage
        measure_field: expected_revenue
      - id: map
        label: Map
        icon: map
        label_field: name
        subtitle_field: partner_name
    columns:
      - { field: name, label: Opportunity, type: PrimaryEntityCell, sortable: true }
      - { field: partner_name, label: Customer }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: stage_requirements, label: Stage requirements }
      - { field: tags, label: Tags }
      - { field: priority, label: Priority }
      - { field: lead_score, label: Lead score, align: right }
      - { field: lead_grade, label: Grade, type: StatusChip }
      - { field: probability, label: Probability, align: right }
      - { field: expected_revenue, label: Expected revenue, align: right }
      - { field: line_count, label: Product lines, align: right }
      - { field: line_subtotal, label: Commercial subtotal, align: right }
      - { field: weighted_line_value, label: Weighted commercial value, align: right }
      - { field: recurring_revenue, label: Recurring revenue, align: right }
      - { field: salesperson, label: Salesperson }
      - { field: expected_closing, label: Expected closing }
    page_size: 50
    row_key: id
    selectable: true
    row_actions: menu
    actions:
      - { id: edit_lead, label: Edit, permission: crm.write, variant: ghost, show_if: "row.stage !== 'Won' && row.stage !== 'Lost'" }
      - { id: assign_lead_to_me, label: Assign to me, permission: crm.write, variant: secondary, show_if: "row.stage !== 'Won' && row.stage !== 'Lost'" }
      - { id: schedule_next_followup, label: Schedule next follow-up, permission: crm.write, variant: secondary, show_if: "row.stage !== 'Won' && row.stage !== 'Lost'" }
      - { id: qualify_lead, label: Qualify, permission: crm.write, variant: ghost, show_if: "row.stage === 'New'" }
      - { id: convert_lead, label: Convert to opportunity, permission: crm.write, variant: ghost, show_if: "row.type === 'lead' && row.stage !== 'Won' && row.stage !== 'Lost'" }
      - { id: open_lead_customer, label: Open customer, permission: base.contacts.read, variant: secondary, show_if: "!!row.partner_id" }
      - { id: archive_lead, label: Archive, permission: crm.write, variant: danger, show_if: "row.active === true && row.stage !== 'Won' && row.stage !== 'Lost'" }
      - { id: crm.leads.export, label: Export, title: Export, icon: download }
    bulk_actions:
      - { id: merge_leads, label: Merge selected }
      - { id: bulk_update_leads, label: Update selected, permission: crm.write }
      - { id: mass_convert_leads, label: Convert selected to opportunities, permission: crm.write }
      - { id: preview_duplicate_leads, label: Preview duplicates, permission: crm.read }
    row_open_action: view_lead
    row_double_click_action: view_lead
    form_view: { page: apps/services/crm/pages/lead-detail.yaml, side_panel: true }
actions:
  - id: open_lead_customer
    type: navigate
    permission: base.contacts.read
    navigate_to: /contact-detail
    params: { id: '{row.partner_id}' }
  - id: bulk_update_leads
    type: server_form
    permission: crm.write
    title: Update selected leads
    action: crm.leads.bulk_update
    handler: yaml_mutation
    operation: bulk_update
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds AND active = true AND stage NOT IN ('Won', 'Lost')) = (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds) AND (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds) > 0"
          status: 409
          message: Select only active open leads
        - query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM crm_team_members WHERE user_name = :salesperson AND active = true)"
          status: 409
          message: Select an active salesperson
        - query: "SELECT 1 AS ok FROM crm_stages WHERE name = :stage AND active = true"
          status: 409
          message: Select an active pipeline stage
      steps:
        - query: "UPDATE crm_leads SET stage = :stage, probability = COALESCE((SELECT probability FROM crm_stages WHERE name = :stage), probability), salesperson = :salesperson, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id IN :selectedIds AND active = true AND stage NOT IN ('Won', 'Lost')"
      result: { query: "SELECT * FROM crm_leads WHERE id IN :selectedIds ORDER BY updated_at DESC" }
    fields:
      - { field: stage, label: Stage, type: select, options_source: crm_lead_stages, required: true }
      - { field: salesperson, label: Salesperson, type: select, options_source: crm_active_salespeople, required: true }
  - id: mass_convert_leads
    type: server
    permission: crm.write
    action: crm.leads.mass_convert
    handler: yaml_mutation
    operation: mass_convert
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds) > 0 AND NOT EXISTS (SELECT 1 FROM crm_leads WHERE id IN :selectedIds AND NOT ((type = 'lead' AND stage NOT IN ('Won', 'Lost')) OR type = 'opportunity'))"
          status: 409
          message: Select only open leads for conversion
      steps:
        - query: "UPDATE crm_leads SET type = 'opportunity', row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id IN :selectedIds AND type = 'lead' AND stage NOT IN ('Won', 'Lost')"
        - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at) SELECT gen_random_uuid(), l.id, 'stage_change', 'Lead converted to opportunity', 'done', CURRENT_TIMESTAMP FROM crm_leads l WHERE l.id IN :selectedIds AND l.type = 'opportunity' AND NOT EXISTS (SELECT 1 FROM crm_activities a WHERE a.lead_id = l.id AND a.activity_type = 'stage_change' AND a.summary = 'Lead converted to opportunity')"
      result: { query: "SELECT * FROM crm_leads WHERE id IN :selectedIds ORDER BY id" }
  - id: preview_duplicate_leads
    type: navigate
    permission: crm.read
    navigate_to: /duplicate-leads
  - id: archive_lead
    type: server
    permission: crm.write
    action: crm.leads.archive
    handler: yaml_mutation
    operation: archive
    params: { id: '{row.id}' }
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT id FROM crm_leads WHERE id = :id AND active = true AND stage NOT IN ('Won', 'Lost')"
          status: 409
          message: Only open active leads can be archived
      steps:
        - query: "UPDATE crm_leads SET active = false, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND active = true AND stage NOT IN ('Won', 'Lost')"
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
  - id: unarchive_lead
    type: server
    permission: crm.write
    action: crm.leads.unarchive
    handler: yaml_mutation
    operation: unarchive
    params: { id: '{row.id}' }
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT id FROM crm_leads WHERE id = :id AND active = false"
          status: 409
          message: Only archived leads can be restored
      steps:
        - query: "UPDATE crm_leads SET active = true, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND active = false"
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
  - id: create_lead_from_team_alias
    type: server_form
    permission: crm.write
    title: Capture inbound lead
    action: crm.leads.create_from_alias
    handler: yaml_mutation
    operation: create_from_alias
    mutation:
      operation: insert
      table: crm_leads
      fields: [name, type, email, phone, source, team, stage, probability, expected_revenue, intake_channel]
      required: [name, team_alias]
      defaults: { type: lead, stage: New, probability: 10, expected_revenue: 0, source: Email, intake_channel: email_alias }
      guards:
        - query: "SELECT 1 AS ok FROM crm_teams WHERE lower(email_alias) = lower(trim(CAST(:team_alias AS VARCHAR))) AND active = true AND use_leads = true"
          status: 409
          message: Inbound alias is inactive or unavailable
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:email, '') AS VARCHAR)), '') IS NOT NULL AND lower(CAST(:email AS VARCHAR)) LIKE '%@%'"
          status: 400
          message: Enter a valid inbound email
      steps:
        - query: "UPDATE crm_leads SET team = (SELECT name FROM crm_teams WHERE lower(email_alias) = lower(trim(CAST(:team_alias AS VARCHAR))) AND active = true), origin_team = (SELECT name FROM crm_teams WHERE lower(email_alias) = lower(trim(CAST(:team_alias AS VARCHAR))) AND active = true), source = COALESCE(:source, 'Email'), intake_channel = 'email_alias', received_at = COALESCE(received_at, CURRENT_TIMESTAMP) WHERE id = :id"
        - query: "INSERT INTO crm_activities(id, lead_id, activity_type, summary, state, completed_at, created_by) VALUES(gen_random_uuid(), :id, 'message', 'Inbound lead received through team email alias', 'done', CURRENT_TIMESTAMP, COALESCE(:current_user_name, 'Email Gateway'))"
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    fields:
      - { field: team_alias, label: Team email alias, type: text, required: true }
      - { field: name, label: Lead, type: text, required: true }
      - { field: email, label: Email, type: text, required: true }
      - { field: phone, label: Phone, type: text }
  - id: create_lead
    type: server_form
    permission: crm.write
    title: New lead
    action: crm.leads.create
    handler: yaml_mutation
    operation: create
    mutation:
      operation: insert
      table: crm_leads
      fields: [name, type, partner_id, partner_name, email, phone, description, source, utm_campaign, utm_medium, utm_source, tags, priority, expected_revenue, stage, probability, salesperson, team, expected_closing]
      required: [name]
      defaults: { stage: New, probability: 10, expected_revenue: 0 }
      guards:
        - query: "SELECT 1 AS ok WHERE CAST(COALESCE(:probability, 10) AS INTEGER) BETWEEN 0 AND 100"
          status: 400
          message: Probability must be between 0 and 100
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:partner_id, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM base_contacts WHERE id = :partner_id AND active = true)"
          status: 400
          message: Select an active contact
        - query: "SELECT CASE WHEN NULLIF(TRIM(CAST(COALESCE(:partner_id, '') AS VARCHAR)), '') IS NULL THEN :partner_name ELSE (SELECT name FROM base_contacts WHERE id = :partner_id AND active = true) END AS partner_name"
          assign: true
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:source, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_sources WHERE name = :source AND active = true)"
          status: 400
          message: Select an active lead source
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams WHERE name = :team AND active = true)"
          status: 400
          message: Select an active sales team
        - query: "SELECT 1 AS ok WHERE CAST(COALESCE(:type, 'opportunity') AS VARCHAR) <> 'lead' OR NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams WHERE name = :team AND use_leads = true)"
          status: 409
          message: This sales team does not accept new leads
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:salesperson, '') AS VARCHAR)), '') IS NULL OR NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR NOT EXISTS (SELECT 1 FROM crm_team_members WHERE team_id = (SELECT id FROM crm_teams WHERE name = :team) AND active = true) OR EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = (SELECT id FROM crm_teams WHERE name = :team) AND m.user_name = :salesperson AND m.active = true)"
          status: 409
          message: Select a member of the sales team
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
    fields:
      - { field: name, label: Opportunity, type: text, required: true }
      - { field: type, label: Type, type: select, options: [lead, opportunity], default: opportunity }
      - { field: partner_name, label: Customer, type: text }
      - { field: partner_id, label: Contact, type: async-select, options_source: crm_contacts }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: source, label: Source, type: select, options_source: crm_source_lookup }
      - { field: utm_campaign, label: UTM campaign, type: select, options_source: crm_utm_campaign_lookup }
      - { field: utm_medium, label: UTM medium, type: text }
      - { field: utm_source, label: UTM source, type: text }
      - { field: tags, label: Tags, type: multi-select, multiple: true, options_source: crm_tag_lookup, placeholder: Choose tags }
      - { field: priority, label: Priority, type: select, options: [0, 1, 2, 3], default: 0 }
      - { field: expected_revenue, label: Expected revenue, type: number }
      - { field: probability, label: Probability, type: number }
      - { field: salesperson, label: Salesperson, type: select, options_source: crm_active_salespeople }
      - { field: team, label: Sales team, type: select, options_source: crm_sales_teams }
      - { field: expected_closing, label: Expected closing, type: date }
  - id: edit_lead
    type: server_form
    permission: crm.write
    title: Update lead
    action: crm.leads.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_leads]
    mutation:
      operation: update
      table: crm_leads
      fields: [name, type, partner_id, partner_name, email, phone, description, source, utm_campaign, utm_medium, utm_source, tags, priority, expected_revenue, probability, salesperson, team, expected_closing]
      required: [name]
      timestamps: true
      guards:
        - query: "SELECT 1 AS ok WHERE CAST(COALESCE(:probability, 10) AS INTEGER) BETWEEN 0 AND 100"
          status: 400
          message: Probability must be between 0 and 100
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:partner_id, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM base_contacts WHERE id = :partner_id AND active = true)"
          status: 400
          message: Select an active contact
        - query: "SELECT CASE WHEN NULLIF(TRIM(CAST(COALESCE(:partner_id, '') AS VARCHAR)), '') IS NULL THEN :partner_name ELSE (SELECT name FROM base_contacts WHERE id = :partner_id AND active = true) END AS partner_name"
          assign: true
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:source, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_sources WHERE name = :source AND active = true)"
          status: 400
          message: Select an active lead source
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams WHERE name = :team AND active = true)"
          status: 400
          message: Select an active sales team
        - query: "SELECT id FROM crm_leads WHERE id = :id AND stage NOT IN ('Won', 'Lost')"
          status: 409
          message: Closed opportunities cannot be edited
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:salesperson, '') AS VARCHAR)), '') IS NULL OR NULLIF(TRIM(CAST(COALESCE(:team, '') AS VARCHAR)), '') IS NULL OR NOT EXISTS (SELECT 1 FROM crm_team_members WHERE team_id = (SELECT id FROM crm_teams WHERE name = :team) AND active = true) OR EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = (SELECT id FROM crm_teams WHERE name = :team) AND m.user_name = :salesperson AND m.active = true)"
          status: 409
          message: Select a member of the sales team
    fields:
      - { field: name, label: Opportunity, type: text, required: true }
      - { field: type, label: Type, type: select, options: [lead, opportunity] }
      - { field: partner_name, label: Customer, type: text }
      - { field: partner_id, label: Contact, type: async-select, options_source: crm_contacts }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: description, label: Notes, type: textarea }
      - { field: source, label: Source, type: select, options_source: crm_source_lookup }
      - { field: utm_campaign, label: UTM campaign, type: select, options_source: crm_utm_campaign_lookup }
      - { field: utm_medium, label: UTM medium, type: text }
      - { field: utm_source, label: UTM source, type: text }
      - { field: tags, label: Tags, type: multi-select, multiple: true, options_source: crm_tag_lookup, placeholder: Choose tags }
      - { field: priority, label: Priority, type: select, options: [0, 1, 2, 3] }
      - { field: expected_revenue, label: Expected revenue, type: number }
      - { field: probability, label: Probability, type: number }
      - { field: salesperson, label: Salesperson, type: select, options_source: crm_active_salespeople }
      - { field: team, label: Sales team, type: select, options_source: crm_sales_teams }
      - { field: expected_closing, label: Expected closing, type: date }
  - id: view_lead
    type: navigate
    permission: crm.read
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
  - id: qualify_lead
    type: server
    permission: crm.write
    action: crm.leads.qualify
    handler: order_transition
    workflow: crm_leads
    operation: qualify
    refresh: [crm_leads]
  - id: schedule_next_followup
    type: navigate
    permission: crm.write
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
  - id: assign_lead_to_me
    type: server
    permission: crm.write
    action: crm.leads.assign_to_me
    handler: yaml_mutation
    operation: assign_to_me
    params: { id: '{row.id}' }
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT id FROM crm_leads WHERE id = :id AND stage NOT IN ('Won', 'Lost')"
          status: 409
          message: Closed opportunities cannot be assigned
        - query: "SELECT 1 AS ok FROM crm_leads l WHERE l.id = :id AND (NULLIF(TRIM(l.team), '') IS NULL OR EXISTS (SELECT 1 FROM crm_teams t WHERE t.name = l.team AND t.active = true))"
          status: 409
          message: Opportunities in archived sales teams cannot be assigned
        - query: "SELECT 1 AS ok FROM crm_leads l WHERE l.id = :id AND (NULLIF(TRIM(l.team), '') IS NULL OR NOT EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = (SELECT id FROM crm_teams WHERE name = l.team) AND m.active = true) OR EXISTS (SELECT 1 FROM crm_team_members m WHERE m.team_id = (SELECT id FROM crm_teams WHERE name = l.team) AND m.user_name = :current_user_name AND m.active = true))"
          status: 409
          message: You are not an active member of this sales team
      steps:
        - query: "UPDATE crm_leads SET salesperson = :current_user_name, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND stage NOT IN ('Won', 'Lost')"
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
  - id: convert_lead
    type: server
    permission: crm.write
    action: crm.leads.convert
    handler: yaml_mutation
    operation: convert
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT id FROM crm_leads WHERE id = :id AND type = 'lead' AND stage NOT IN ('Won', 'Lost')"
          status: 409
          message: Only open leads can be converted into opportunities
      steps:
        - query: "UPDATE crm_leads AS lead SET partner_name = COALESCE((SELECT contact.name FROM base_contacts contact WHERE contact.id = lead.partner_id AND contact.active = true), lead.partner_name), email = COALESCE((SELECT contact.email FROM base_contacts contact WHERE contact.id = lead.partner_id AND contact.active = true), lead.email), phone = COALESCE((SELECT contact.phone FROM base_contacts contact WHERE contact.id = lead.partner_id AND contact.active = true), lead.phone), type = 'opportunity', updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE lead.id = :id AND lead.type = 'lead'"
        - query: "INSERT INTO crm_activities(lead_id, activity_type, summary, state, completed_at) VALUES(:id, 'stage_change', 'Lead converted to opportunity', 'done', CURRENT_TIMESTAMP)"
      result: { query: "SELECT * FROM crm_leads WHERE id = :id" }
  - id: merge_leads
    type: server
    confirm: Merge the selected open records? The oldest selected record will be kept and the others will be deleted.
    permission: crm.write
    action: crm.leads.merge
    handler: yaml_mutation
    operation: merge
    refresh: [crm_leads]
    mutation:
      guards:
        - query: "SELECT 1 AS ok WHERE (SELECT COUNT(*) FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost')) >= 2"
          status: 409
          message: Select at least two open leads or opportunities to merge
      steps:
        - query: "INSERT INTO crm_merge_audit(id, survivor_id, merged_id, actor, retained_fields) SELECT gen_random_uuid(), (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1), id, :current_user_name, 'first_non_empty_declared_fields' FROM crm_leads WHERE id IN :selectedIds AND id <> (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1) AND stage NOT IN ('Won', 'Lost')"
        - query: "UPDATE crm_leads AS survivor SET utm_campaign = COALESCE(NULLIF(survivor.utm_campaign, ''), (SELECT duplicate.utm_campaign FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.utm_campaign, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), utm_medium = COALESCE(NULLIF(survivor.utm_medium, ''), (SELECT duplicate.utm_medium FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.utm_medium, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), utm_source = COALESCE(NULLIF(survivor.utm_source, ''), (SELECT duplicate.utm_source FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.utm_source, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)) WHERE survivor.id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1)"
        - query: "UPDATE crm_leads AS survivor SET partner_id = COALESCE(survivor.partner_id, (SELECT duplicate.partner_id FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND duplicate.partner_id IS NOT NULL ORDER BY duplicate.id LIMIT 1)), partner_name = COALESCE(NULLIF(survivor.partner_name, ''), (SELECT duplicate.partner_name FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.partner_name, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), email = COALESCE(NULLIF(survivor.email, ''), (SELECT duplicate.email FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.email, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), phone = COALESCE(NULLIF(survivor.phone, ''), (SELECT duplicate.phone FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.phone, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), source = COALESCE(NULLIF(survivor.source, ''), (SELECT duplicate.source FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.source, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), salesperson = COALESCE(NULLIF(survivor.salesperson, ''), (SELECT duplicate.salesperson FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.salesperson, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), team = COALESCE(NULLIF(survivor.team, ''), (SELECT duplicate.team FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.team, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), tags = COALESCE(NULLIF(survivor.tags, ''), (SELECT duplicate.tags FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND NULLIF(duplicate.tags, '') IS NOT NULL ORDER BY duplicate.id LIMIT 1)), expected_revenue = COALESCE(NULLIF(survivor.expected_revenue, 0), (SELECT duplicate.expected_revenue FROM crm_leads duplicate WHERE duplicate.id IN :selectedIds AND duplicate.stage NOT IN ('Won', 'Lost') AND duplicate.id <> survivor.id AND duplicate.expected_revenue IS NOT NULL ORDER BY duplicate.id LIMIT 1)), row_version = survivor.row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE survivor.id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1)"
        - query: "UPDATE crm_activities SET lead_id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1) WHERE lead_id IN :selectedIds AND lead_id <> (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1) AND lead_id IN (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost'))"
        - query: "INSERT INTO crm_activities(lead_id, activity_type, summary, state, completed_at, created_by) SELECT (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1), 'merge', 'Duplicate CRM records merged', 'done', CURRENT_TIMESTAMP, :current_user_name"
        - query: "DELETE FROM crm_leads WHERE id IN :selectedIds AND id <> (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1) AND stage NOT IN ('Won', 'Lost')"
      result: { query: "SELECT * FROM crm_leads WHERE id = (SELECT id FROM crm_leads WHERE id IN :selectedIds AND stage NOT IN ('Won', 'Lost') ORDER BY created_at ASC, id ASC LIMIT 1)" }
  - id: mark_lead_won
    type: server
    permission: crm.write
    action: crm.leads.won
    handler: order_transition
    workflow: crm_leads
    operation: won
    refresh: [crm_leads]
  - id: mark_lead_lost
    type: server_form
    permission: crm.write
    title: Mark lead lost
    action: crm.leads.lost
    handler: order_transition
    workflow: crm_leads
    operation: lost
    refresh: [crm_leads]
    fields:
      - { field: lost_reason, label: Lost reason, type: select, options_source: crm_lost_reason_lookup, required: true }
  - id: import_lead
    type: server
    permission: crm.write
    action: crm.leads.import
    handler: yaml_mutation
    operation: create
    mutation:
      operation: insert
      table: crm_leads
      fields: [name, type, partner_id, email, phone, source, utm_campaign, utm_medium, utm_source, tags, priority, expected_revenue, stage, probability, salesperson, team, expected_closing]
      required: [name]
      defaults: { type: lead, stage: New, probability: 10, expected_revenue: 0, priority: 0 }
      guards:
        - query: "SELECT 1 AS ok WHERE CAST(COALESCE(:probability, 10) AS INTEGER) BETWEEN 0 AND 100"
          status: 400
          message: Probability must be between 0 and 100
        - query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(COALESCE(:source, '') AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM crm_sources WHERE name = :source AND active = true)"
          status: 400
          message: Select an active lead source
