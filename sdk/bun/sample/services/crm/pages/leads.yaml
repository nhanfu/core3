title: CRM
page: { id: leads, breadcrumb: [Sales, CRM, Leads], auth: { require: [crm.read] } }
components:
  - type: ListView
    variant: odoo
    source: crm_leads
    create_action: create_lead
    create_label: New
    search: { label: Search leads, placeholder: Search opportunities and customers... }
    filters:
      - { field: stage, label: Stage, options_source: crm_lead_stages }
      - { field: type, label: Type, options_source: crm_lead_types }
      - { field: salesperson, label: Salesperson, options_source: crm_salespeople }
      - { field: team, label: Sales team, options_source: crm_sales_teams }
      - { field: source, label: Lead source, options_source: crm_source_lookup }
      - { field: utm_campaign, label: UTM campaign, options_source: crm_utm_campaign_lookup }
    favorites:
      - id: my_pipeline
        label: Proposition Pipeline
        filters: { type: opportunity, stage: Proposition }
        group_by: stage
      - id: unassigned
        label: Unassigned
        filters: { salesperson: '' }
      - id: open_leads
        label: Open Leads
        filters: { type: lead }
        group_by: stage
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        group_by: stage
        groups_source: crm_lead_stages
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: expected_revenue, label: Expected revenue }
            - { field: probability, label: Probability }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: stage
        groups_source: crm_lead_stages
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: expected_revenue, label: Expected revenue }
            - { field: probability, label: Probability }
      - id: calendar
        label: Calendar
        icon: calendar
        date_field: expected_closing
        card:
          title: name
          subtitle: partner_name
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields:
            - { field: stage, column: Stage }
            - { field: tags, column: Tags }
            - { field: type, column: Type }
            - { field: source, column: Source }
            - { field: team, column: Sales team }
            - { field: expected_closing, column: Expected closing, type: date }
            - { field: salesperson, column: Salesperson }
            - { field: probability, column: Probability }
            - { field: expected_revenue, column: Expected revenue }
          default:
            rows: [stage]
            columns: [team]
            measures:
              - { field: expected_revenue, aggregate: sum, column: Expected revenue }
              - { field: probability, aggregate: average, column: Probability }
          date_ranges: { expected_closing: month }
      - id: graph
        label: Graph
        icon: graph
        category_field: stage
        measure_field: expected_revenue
      - id: map
        label: Map
        icon: map
        label_field: name
        subtitle_field: partner_name
    columns:
      - { field: name, label: Opportunity, type: PrimaryEntityCell, sortable: true }
      - { field: partner_name, label: Customer }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: tags, label: Tags }
      - { field: priority, label: Priority }
      - { field: probability, label: Probability, align: right }
      - { field: expected_revenue, label: Expected revenue, align: right }
      - { field: salesperson, label: Salesperson }
      - { field: expected_closing, label: Expected closing }
    page_size: 50
    row_key: id
    selectable: true
    row_actions: menu
    actions:
      - { id: edit_lead, label: Edit, permission: crm.write, variant: ghost, show_if: "row.stage !== 'Won' && row.stage !== 'Lost'" }
      - { id: assign_lead_to_me, label: Assign to me, permission: crm.write, variant: secondary, show_if: "row.stage !== 'Won' && row.stage !== 'Lost'" }
      - { id: qualify_lead, label: Qualify, permission: crm.write, variant: ghost, show_if: "row.stage === 'New'" }
      - { id: convert_lead, label: Convert to opportunity, permission: crm.write, variant: ghost, show_if: "row.type === 'lead' && row.stage !== 'Won' && row.stage !== 'Lost'" }
    bulk_actions:
      - { id: merge_leads, label: Merge selected }
      - { id: bulk_delete_leads, label: Delete selected, permission: crm.write }
    row_open_action: view_lead
    row_double_click_action: view_lead
    form_view: { page: apps/services/crm/pages/lead-detail.yaml, side_panel: true }
actions:
  - id: view_lead
    type: navigate
    permission: crm.read
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
