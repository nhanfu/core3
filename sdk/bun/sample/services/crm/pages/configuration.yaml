title: CRM Configuration
page: { id: configuration, breadcrumb: [CRM, Configuration], auth: { require: [crm.manage] } }
datasources:
  - id: crm_stage_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, sequence, probability, fold, requirements, active FROM crm_stages ORDER BY sequence"
  - id: crm_lost_reason_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, active FROM crm_lost_reasons ORDER BY name"
  - id: crm_source_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, active FROM crm_sources ORDER BY name"
  - id: crm_activity_type_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, active FROM crm_activity_types ORDER BY name"
  - id: crm_activity_plan_configuration
    single: false
    permission: crm.manage
    query: "SELECT p.id, p.name, p.active, COUNT(s.id) AS step_count FROM crm_activity_plans p LEFT JOIN crm_activity_plan_steps s ON s.plan_id = p.id AND s.active = true GROUP BY p.id, p.name, p.active ORDER BY p.name"
  - id: crm_activity_plan_steps_configuration
    single: false
    permission: crm.manage
    query: "SELECT s.id, s.plan_id, p.name AS plan_name, s.sequence, s.activity_type, s.summary, s.delay_days, s.active FROM crm_activity_plan_steps s JOIN crm_activity_plans p ON p.id = s.plan_id ORDER BY p.name, s.sequence"
  - id: crm_activity_plan_lookup
    single: false
    permission: crm.manage
    query: "SELECT id AS value, name AS label FROM crm_activity_plans WHERE active = true ORDER BY name"
  - id: crm_scoring_rule_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, field, operator, comparison_value, points, active FROM crm_scoring_rules ORDER BY active DESC, field, id"
  - id: crm_recurring_plan_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, interval_unit, interval_count, active FROM crm_recurring_plans ORDER BY active DESC, name"
  - id: crm_campaign_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, active FROM crm_campaigns ORDER BY active DESC, name"
  - id: crm_stage_team_scope
    single: false
    permission: crm.manage
    query: "SELECT st.stage_id, s.name AS stage, st.team_id, t.name AS team FROM crm_stage_teams st JOIN crm_stages s ON s.id = st.stage_id JOIN crm_teams t ON t.id = st.team_id ORDER BY s.sequence, t.name"
  - id: crm_stage_scope_stage_lookup
    single: false
    permission: crm.manage
    query: "SELECT id AS value, name AS label FROM crm_stages WHERE active = true ORDER BY sequence, name"
  - id: crm_stage_scope_team_lookup
    single: false
    permission: crm.manage
    query: "SELECT id AS value, name AS label FROM crm_teams WHERE active = true ORDER BY name"
  - id: crm_assignment_rule_configuration
    single: false
    permission: crm.manage
    query: "SELECT r.id, r.sequence, r.field, r.operator, r.comparison_value, r.team_id, t.name AS team, r.user_name, r.active FROM crm_assignment_rules r LEFT JOIN crm_teams t ON t.id = r.team_id ORDER BY r.active DESC, r.sequence, r.id"
  - id: crm_assignment_rule_team_lookup
    single: false
    permission: crm.manage
    query: "SELECT id AS value, name AS label FROM crm_teams WHERE active = true ORDER BY name"
  - id: crm_assignment_rule_user_lookup
    single: false
    permission: crm.manage
    query: "SELECT DISTINCT user_name AS value, user_name AS label FROM crm_team_members WHERE active = true ORDER BY user_name"
  - id: crm_email_template_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, subject, body, active FROM crm_email_templates ORDER BY active DESC, name"
components:
  - type: ListView
    variant: odoo
    source: crm_stage_configuration
    create_action: create_crm_stage
    create_label: New stage
    columns:
      - { field: name, label: Stage, type: PrimaryEntityCell }
      - { field: sequence, label: Sequence, align: right }
      - { field: probability, label: Probability, align: right }
      - { field: fold, label: Folded, type: StatusChip }
      - { field: requirements, label: Requirements }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_stage, label: Edit stage, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_stage, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_scoring_rule_configuration
    create_action: create_crm_scoring_rule
    create_label: New scoring rule
    columns:
      - { field: field, label: Field, type: PrimaryEntityCell }
      - { field: operator, label: Operator }
      - { field: comparison_value, label: Comparison }
      - { field: points, label: Points, align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_scoring_rule, label: Edit rule, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_scoring_rule, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_recurring_plan_configuration
    create_action: create_crm_recurring_plan
    create_label: New recurring plan
    columns:
      - { field: name, label: Plan, type: PrimaryEntityCell }
      - { field: interval_count, label: Every, align: right }
      - { field: interval_unit, label: Unit }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_recurring_plan, label: Edit plan, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_recurring_plan, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_campaign_configuration
    create_action: create_crm_campaign
    create_label: New campaign
    columns:
      - { field: name, label: Campaign, type: PrimaryEntityCell }
      - { field: active, label: Active, type: StatusChip }
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_campaign, label: Edit campaign, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_campaign, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_stage_team_scope
    columns:
      - { field: stage, label: Stage, type: PrimaryEntityCell }
      - { field: team, label: Sales team }
    row_key: stage_id
    create_action: create_crm_stage_scope
    actions:
