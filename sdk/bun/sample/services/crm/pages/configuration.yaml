      - { field: activity_type, label: Activity type }
      - { field: summary, label: Summary }
      - { field: delay_days, label: Delay (days), align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    selectable: true
    bulk_actions:
      - { id: bulk_delete_crm_plan_steps, label: Delete selected, permission: crm.manage }
    row_actions: menu
    actions:
      - { id: edit_crm_activity_plan_step, label: Edit, permission: crm.manage, variant: ghost }
