title: CRM Configuration
page: { id: configuration, breadcrumb: [CRM, Configuration], auth: { require: [crm.manage] } }
datasources:
  - id: crm_stage_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, sequence, probability, fold, requirements, active FROM crm_stages ORDER BY sequence"
  - id: crm_lost_reason_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, active FROM crm_lost_reasons ORDER BY name"
  - id: crm_source_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, active FROM crm_sources ORDER BY name"
  - id: crm_activity_type_configuration
    single: false
    permission: crm.manage
    query: "SELECT id, name, active FROM crm_activity_types ORDER BY name"
  - id: crm_activity_plan_configuration
    single: false
    permission: crm.manage
    query: "SELECT p.id, p.name, p.active, COUNT(s.id) AS step_count FROM crm_activity_plans p LEFT JOIN crm_activity_plan_steps s ON s.plan_id = p.id AND s.active = true GROUP BY p.id, p.name, p.active ORDER BY p.name"
  - id: crm_activity_plan_steps_configuration
    single: false
    permission: crm.manage
    query: "SELECT s.id, s.plan_id, p.name AS plan_name, s.sequence, s.activity_type, s.summary, s.delay_days, s.active FROM crm_activity_plan_steps s JOIN crm_activity_plans p ON p.id = s.plan_id ORDER BY p.name, s.sequence"
  - id: crm_activity_plan_lookup
    single: false
    permission: crm.manage
    query: "SELECT id AS value, name AS label FROM crm_activity_plans WHERE active = true ORDER BY name"
components:
  - type: ListView
    variant: odoo
    source: crm_stage_configuration
    create_action: create_crm_stage
    create_label: New stage
    columns:
      - { field: name, label: Stage, type: PrimaryEntityCell }
      - { field: sequence, label: Sequence, align: right }
      - { field: probability, label: Probability, align: right }
      - { field: fold, label: Folded, type: StatusChip }
      - { field: requirements, label: Requirements }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_stage, label: Edit stage, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_stage, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_activity_type_configuration
    create_action: create_crm_activity_type
    create_label: New activity type
    columns:
      - { field: name, label: Activity type, type: PrimaryEntityCell }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: toggle_crm_activity_type, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_source_configuration
    create_action: create_crm_source
    create_label: New lead source
    columns:
      - { field: name, label: Lead source, type: PrimaryEntityCell }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: toggle_crm_source, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_lost_reason_configuration
    create_action: create_crm_lost_reason
    create_label: New lost reason
    columns:
      - { field: name, label: Lost reason, type: PrimaryEntityCell }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: toggle_crm_lost_reason, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_activity_plan_configuration
    create_action: create_crm_activity_plan
    create_label: New activity plan
    columns:
      - { field: name, label: Activity plan, type: PrimaryEntityCell }
      - { field: step_count, label: Steps, align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: toggle_crm_activity_plan, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_activity_plan_steps_configuration
    create_action: create_crm_activity_plan_step
    create_label: New plan step
    columns:
      - { field: plan_name, label: Activity plan, type: PrimaryEntityCell }
      - { field: sequence, label: Sequence, align: right }
      - { field: activity_type, label: Activity type }
      - { field: summary, label: Summary }
      - { field: delay_days, label: Delay (days), align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: toggle_crm_activity_plan_step, label: Toggle active, permission: crm.manage, variant: ghost }
actions:
  - id: create_crm_stage
    type: server_form
    permission: crm.manage
    title: New CRM stage
    action: crm.stages.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_stage_configuration]
    mutation:
      operation: insert
      table: crm_stages
      fields: [name, sequence, probability, fold, requirements]
      required: [name]
      defaults: { sequence: 10, probability: 10, fold: false }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_stages WHERE name = :name)"
          status: 409
          message: CRM stage already exists
      result: { query: "SELECT * FROM crm_stages WHERE id = :id" }
    fields:
      - { field: name, label: Stage name, type: text, required: true }
      - { field: sequence, label: Sequence, type: number, default: 10 }
      - { field: probability, label: Probability, type: number, default: 10 }
      - { field: fold, label: Fold stage, type: checkbox }
      - { field: requirements, label: Requirements, type: textarea }
  - id: edit_crm_stage
    type: server_form
    permission: crm.manage
    title: Edit CRM stage
    action: crm.stages.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_stage_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_stages WHERE id = :id"
          status: 404
          message: CRM stage no longer exists
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_stages WHERE lower(name) = lower(:name) AND id <> :id)"
          status: 409
          message: CRM stage already exists
        - query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80 AND CAST(:probability AS INTEGER) BETWEEN 0 AND 100"
          status: 400
          message: Stage name and probability are invalid
      steps:
        - query: "UPDATE crm_leads SET stage = :name, probability = :probability, updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE stage = (SELECT name FROM crm_stages WHERE id = :id)"
        - query: "UPDATE crm_stages SET name = :name, sequence = :sequence, probability = :probability, fold = :fold, requirements = :requirements WHERE id = :id"
      result: { query: "SELECT * FROM crm_stages WHERE id = :id" }
    fields:
      - { field: name, label: Stage name, type: text, required: true }
      - { field: sequence, label: Sequence, type: number, required: true }
      - { field: probability, label: Probability, type: number, min: 0, max: 100, required: true }
      - { field: fold, label: Fold stage, type: checkbox }
      - { field: requirements, label: Requirements, type: textarea }
  - id: toggle_crm_stage
    type: server
    permission: crm.manage
    action: crm.stages.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_stage_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_stages WHERE id = :id"
          status: 404
          message: CRM stage no longer exists
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_stages WHERE id = :id AND active = true AND NOT EXISTS (SELECT 1 FROM crm_leads WHERE stage = crm_stages.name AND stage NOT IN ('Won', 'Lost')))"
          status: 409
          message: A stage with open leads cannot be archived
      steps:
        - query: "UPDATE crm_stages SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_stages WHERE id = :id" }
  - id: toggle_crm_activity_plan
    type: server
    permission: crm.manage
    action: crm.activity_plans.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_activity_plan_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_activity_plans WHERE id = :id"
          status: 404
          message: Activity plan no longer exists
      steps:
        - query: "UPDATE crm_activity_plans SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_activity_plans WHERE id = :id" }
  - id: create_crm_activity_plan
    type: server_form
    permission: crm.manage
    title: New activity plan
    action: crm.activity_plans.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_activity_plan_configuration]
    mutation:
      operation: insert
      table: crm_activity_plans
      fields: [name, active]
      required: [name]
      defaults: { active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_activity_plans WHERE name = :name)"
          status: 409
          message: Activity plan already exists
      result: { query: "SELECT * FROM crm_activity_plans WHERE id = :id" }
    fields:
      - { field: name, label: Activity plan, type: text, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: toggle_crm_activity_plan_step
    type: server
    permission: crm.manage
    action: crm.activity_plan_steps.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_activity_plan_configuration, crm_activity_plan_steps_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_activity_plan_steps WHERE id = :id"
          status: 404
          message: Activity plan step no longer exists
      steps:
        - query: "UPDATE crm_activity_plan_steps SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_activity_plan_steps WHERE id = :id" }
  - id: create_crm_activity_plan_step
    type: server_form
    permission: crm.manage
    title: New activity plan step
    action: crm.activity_plan_steps.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_activity_plan_configuration, crm_activity_plan_steps_configuration]
    mutation:
      operation: insert
      table: crm_activity_plan_steps
      fields: [plan_id, sequence, activity_type, summary, delay_days, active]
      required: [plan_id, activity_type, summary]
      defaults: { sequence: 10, delay_days: 0, active: true }
      guards:
        - query: "SELECT id FROM crm_activity_plans WHERE id = :plan_id AND active = true"
          status: 400
          message: Select an active activity plan
        - query: "SELECT id FROM crm_activity_types WHERE name = :activity_type AND active = true"
          status: 400
          message: Select an active activity type
      result: { query: "SELECT * FROM crm_activity_plan_steps WHERE id = :id" }
    fields:
      - { field: plan_id, label: Activity plan, type: select, options_source: crm_activity_plan_lookup, required: true }
      - { field: sequence, label: Sequence, type: number, default: 10 }
      - { field: activity_type, label: Activity type, type: select, options_source: crm_activity_type_configuration, required: true }
      - { field: summary, label: Summary, type: text, required: true }
      - { field: delay_days, label: Delay (days), type: number, default: 0 }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: create_crm_lost_reason
    type: server_form
    permission: crm.manage
    title: New lost reason
    action: crm.lost_reasons.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_lost_reason_configuration]
    mutation:
      operation: insert
      table: crm_lost_reasons
      fields: [name, active]
      required: [name]
      defaults: { active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_lost_reasons WHERE name = :name)"
          status: 409
          message: Lost reason already exists
      result: { query: "SELECT * FROM crm_lost_reasons WHERE id = :id" }
    fields:
      - { field: name, label: Lost reason, type: text, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: toggle_crm_source
    type: server
    permission: crm.manage
    action: crm.sources.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_source_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_sources WHERE id = :id"
          status: 404
          message: Lead source no longer exists
      steps:
        - query: "UPDATE crm_sources SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_sources WHERE id = :id" }
  - id: toggle_crm_lost_reason
    type: server
    permission: crm.manage
    action: crm.lost_reasons.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_lost_reason_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_lost_reasons WHERE id = :id"
          status: 404
          message: Lost reason no longer exists
      steps:
        - query: "UPDATE crm_lost_reasons SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_lost_reasons WHERE id = :id" }
  - id: toggle_crm_activity_type
    type: server
    permission: crm.manage
    action: crm.activity_types.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_activity_type_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_activity_types WHERE id = :id"
          status: 404
          message: Activity type no longer exists
      steps:
        - query: "UPDATE crm_activity_types SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_activity_types WHERE id = :id" }
  - id: create_crm_activity_type
    type: server_form
    permission: crm.manage
    title: New activity type
    action: crm.activity_types.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_activity_type_configuration]
    mutation:
      operation: insert
      table: crm_activity_types
      fields: [name, active]
      required: [name]
      defaults: { active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_activity_types WHERE name = :name)"
          status: 409
          message: Activity type already exists
      result: { query: "SELECT * FROM crm_activity_types WHERE id = :id" }
    fields:
      - { field: name, label: Activity type, type: text, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: create_crm_source
    type: server_form
    permission: crm.manage
    title: New lead source
    action: crm.sources.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_source_configuration]
    mutation:
      operation: insert
      table: crm_sources
      fields: [name, active]
      required: [name]
      defaults: { active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_sources WHERE name = :name)"
          status: 409
          message: Lead source already exists
      result: { query: "SELECT * FROM crm_sources WHERE id = :id" }
    fields:
      - { field: name, label: Lead source, type: text, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
