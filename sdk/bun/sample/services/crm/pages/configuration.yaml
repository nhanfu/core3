    page_size: 50
    row_key: id
    selectable: true
    bulk_actions:
      - { id: bulk_delete_crm_lost_reasons, label: Delete selected, permission: crm.manage }
    row_actions: menu
    actions:
      - { id: edit_crm_lost_reason, label: Edit, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_lost_reason, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_activity_plan_configuration
    create_action: create_crm_activity_plan
    create_label: New activity plan
    columns:
      - { field: name, label: Activity plan, type: PrimaryEntityCell }
      - { field: step_count, label: Steps, align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    selectable: true
    bulk_actions:
      - { id: bulk_delete_crm_activity_plans, label: Delete selected, permission: crm.manage }
    row_actions: menu
    actions:
      - { id: edit_crm_activity_plan, label: Edit, permission: crm.manage, variant: ghost }
