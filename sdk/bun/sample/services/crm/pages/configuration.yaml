  - type: ListView
    variant: odoo
    source: crm_assignment_rule_configuration
    create_action: create_crm_assignment_rule
    create_label: New assignment rule
    columns:
      - { field: sequence, label: Priority, align: right }
      - { field: field, label: Lead field, type: PrimaryEntityCell }
      - { field: operator, label: Operator }
      - { field: comparison_value, label: Match }
      - { field: team, label: Sales team }
      - { field: user_name, label: Assignee }
      - { field: active, label: Active, type: StatusChip }
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_assignment_rule, label: Edit rule, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_assignment_rule, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_activity_type_configuration
    create_action: create_crm_activity_type
    create_label: New activity type
    columns:
      - { field: name, label: Activity type, type: PrimaryEntityCell }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_activity_type, label: Edit activity type, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_activity_type, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_email_template_configuration
    create_action: create_crm_email_template
    create_label: New email template
    columns:
      - { field: name, label: Template, type: PrimaryEntityCell }
      - { field: subject, label: Subject }
      - { field: body, label: Body }
      - { field: active, label: Active, type: StatusChip }
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_email_template, label: Edit template, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_email_template, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_source_configuration
    create_action: create_crm_source
    create_label: New lead source
    columns:
      - { field: name, label: Lead source, type: PrimaryEntityCell }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_source, label: Edit lead source, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_source, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_lost_reason_configuration
    create_action: create_crm_lost_reason
    create_label: New lost reason
    columns:
      - { field: name, label: Lost reason, type: PrimaryEntityCell }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_lost_reason, label: Edit lost reason, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_lost_reason, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_activity_plan_configuration
    create_action: create_crm_activity_plan
    create_label: New activity plan
    columns:
      - { field: name, label: Activity plan, type: PrimaryEntityCell }
      - { field: step_count, label: Steps, align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_activity_plan, label: Edit activity plan, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_activity_plan, label: Toggle active, permission: crm.manage, variant: ghost }
  - type: ListView
    variant: odoo
    source: crm_activity_plan_steps_configuration
    create_action: create_crm_activity_plan_step
    create_label: New plan step
    columns:
      - { field: plan_name, label: Activity plan, type: PrimaryEntityCell }
      - { field: sequence, label: Sequence, align: right }
      - { field: activity_type, label: Activity type }
      - { field: summary, label: Summary }
      - { field: delay_days, label: Delay (days), align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: edit_crm_activity_plan_step, label: Edit plan step, permission: crm.manage, variant: ghost }
      - { id: toggle_crm_activity_plan_step, label: Toggle active, permission: crm.manage, variant: ghost }
actions:
  - id: create_crm_stage_scope
    type: server_form
    permission: crm.manage
    title: Assign stage to sales team
    action: crm.stage_teams.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_stage_team_scope]
    mutation:
      operation: insert
      table: crm_stage_teams
      fields: [stage_id, team_id]
      required: [stage_id, team_id]
      guards:
        - query: "SELECT 1 AS ok FROM crm_stages WHERE id = :stage_id AND active = true"
          status: 400
          message: Select an active stage
        - query: "SELECT 1 AS ok FROM crm_teams WHERE id = :team_id AND active = true"
          status: 400
          message: Select an active sales team
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM crm_stage_teams WHERE stage_id = :stage_id AND team_id = :team_id)"
          status: 409
          message: This stage is already assigned to the team
      result: { query: "SELECT * FROM crm_stage_teams WHERE stage_id = :stage_id AND team_id = :team_id" }
    fields:
      - { field: stage_id, label: Stage, type: select, options_source: crm_stage_scope_stage_lookup, required: true }
      - { field: team_id, label: Sales team, type: select, options_source: crm_stage_scope_team_lookup, required: true }
  - id: remove_crm_stage_scope
    type: server
    permission: crm.manage
    action: crm.stage_teams.remove
    handler: yaml_mutation
    operation: delete
    refresh: [crm_stage_team_scope]
    mutation:
      guards:
        - query: "SELECT 1 AS ok FROM crm_stage_teams WHERE stage_id = :stage_id AND team_id = :team_id"
          status: 404
          message: Stage team scope no longer exists
      steps:
        - query: "DELETE FROM crm_stage_teams WHERE stage_id = :stage_id AND team_id = :team_id"
      result: { query: "SELECT :stage_id AS stage_id, :team_id AS team_id, true AS removed" }
  - id: create_crm_campaign
    type: server_form
    permission: crm.manage
    title: New campaign
    action: crm.campaigns.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_campaign_configuration]
    mutation:
      operation: insert
      table: crm_campaigns
      fields: [name, active]
      required: [name]
      defaults: { active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 120 AND NOT EXISTS (SELECT 1 FROM crm_campaigns WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))))"
          status: 409
          message: Campaign already exists
      result: { query: "SELECT * FROM crm_campaigns WHERE id = :id" }
    fields:
      - { field: name, label: Campaign, type: text, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: edit_crm_campaign
    type: server_form
    permission: crm.manage
    title: Edit campaign
    action: crm.campaigns.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_campaign_configuration]
    mutation:
      operation: update
      table: crm_campaigns
      fields: [name, active]
      required: [name]
      guards:
        - query: "SELECT id FROM crm_campaigns WHERE id = :id"
          status: 404
          message: Campaign no longer exists
        - query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 120 AND NOT EXISTS (SELECT 1 FROM crm_campaigns WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))) AND id <> :id)"
          status: 409
          message: Campaign already exists
      result: { query: "SELECT * FROM crm_campaigns WHERE id = :id" }
    fields:
      - { field: name, label: Campaign, type: text, required: true }
      - { field: active, label: Active, type: checkbox }
  - id: toggle_crm_campaign
    type: server
    permission: crm.manage
    action: crm.campaigns.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_campaign_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_campaigns WHERE id = :id"
          status: 404
          message: Campaign no longer exists
      steps:
        - query: "UPDATE crm_campaigns SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_campaigns WHERE id = :id" }
  - id: create_crm_recurring_plan
    type: server_form
    permission: crm.manage
    title: New recurring plan
    action: crm.recurring_plans.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_recurring_plan_configuration]
    mutation:
      operation: insert
      table: crm_recurring_plans
      fields: [name, interval_unit, interval_count, active]
      required: [name, interval_unit, interval_count]
      defaults: { active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80 AND NOT EXISTS (SELECT 1 FROM crm_recurring_plans WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))))"
          status: 409
          message: Recurring plan already exists
        - query: "SELECT 1 AS ok WHERE :interval_unit IN ('day', 'week', 'month', 'year') AND CAST(:interval_count AS INTEGER) BETWEEN 1 AND 120"
          status: 400
          message: Select a valid recurring interval
      result: { query: "SELECT * FROM crm_recurring_plans WHERE id = :id" }
    fields:
      - { field: name, label: Plan, type: text, required: true }
      - { field: interval_unit, label: Unit, type: select, options: [day, week, month, year], required: true }
      - { field: interval_count, label: Every, type: number, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: edit_crm_recurring_plan
    type: server_form
    permission: crm.manage
    title: Edit recurring plan
    action: crm.recurring_plans.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_recurring_plan_configuration]
    mutation:
      operation: update
      table: crm_recurring_plans
      fields: [name, interval_unit, interval_count, active]
      required: [name, interval_unit, interval_count]
      guards:
        - query: "SELECT id FROM crm_recurring_plans WHERE id = :id"
          status: 404
          message: Recurring plan no longer exists
        - query: "SELECT 1 AS ok WHERE length(trim(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80 AND NOT EXISTS (SELECT 1 FROM crm_recurring_plans WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))) AND id <> :id)"
          status: 409
          message: Recurring plan already exists
        - query: "SELECT 1 AS ok WHERE :interval_unit IN ('day', 'week', 'month', 'year') AND CAST(:interval_count AS INTEGER) BETWEEN 1 AND 120"
          status: 400
          message: Select a valid recurring interval
      result: { query: "SELECT * FROM crm_recurring_plans WHERE id = :id" }
    fields:
      - { field: name, label: Plan, type: text, required: true }
      - { field: interval_unit, label: Unit, type: select, options: [day, week, month, year], required: true }
      - { field: interval_count, label: Every, type: number, required: true }
      - { field: active, label: Active, type: checkbox }
  - id: toggle_crm_recurring_plan
    type: server
    permission: crm.manage
    action: crm.recurring_plans.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_recurring_plan_configuration]
    mutation:
      guards:
        - query: "SELECT id FROM crm_recurring_plans WHERE id = :id"
          status: 404
          message: Recurring plan no longer exists
      steps:
        - query: "UPDATE crm_recurring_plans SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_recurring_plans WHERE id = :id" }
  - id: create_crm_scoring_rule
    type: server_form
    permission: crm.manage
    title: New lead scoring rule
    action: crm.scoring_rules.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_scoring_rule_configuration]
    mutation:
      operation: insert
      table: crm_scoring_rules
      fields: [field, operator, comparison_value, points, active]
      required: [field, operator, points]
      defaults: { active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE :field IN ('email', 'phone', 'source', 'expected_revenue', 'type') AND :operator IN ('present', 'equals', 'gte') AND CAST(:points AS INTEGER) BETWEEN -100 AND 100"
          status: 400
          message: Scoring rule field, operator, or points are invalid
    fields:
      - { field: field, label: Lead field, type: select, options: [{ value: email, label: Email }, { value: phone, label: Phone }, { value: source, label: Source }, { value: expected_revenue, label: Expected revenue }, { value: type, label: Type }], required: true }
      - { field: operator, label: Operator, type: select, options: [{ value: present, label: Is present }, { value: equals, label: Equals }, { value: gte, label: Greater or equal }], required: true }
      - { field: comparison_value, label: Comparison value, type: text }
      - { field: points, label: Points, type: number, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: edit_crm_scoring_rule
    type: server_form
    permission: crm.manage
    title: Edit lead scoring rule
    action: crm.scoring_rules.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_scoring_rule_configuration]
    mutation:
      operation: update
      table: crm_scoring_rules
      fields: [field, operator, comparison_value, points, active]
      required: [field, operator, points]
      guards:
        - query: "SELECT id FROM crm_scoring_rules WHERE id = :id"
          status: 404
          message: Scoring rule no longer exists
        - query: "SELECT 1 AS ok WHERE :field IN ('email', 'phone', 'source', 'expected_revenue', 'type') AND :operator IN ('present', 'equals', 'gte') AND CAST(:points AS INTEGER) BETWEEN -100 AND 100"
          status: 400
          message: Scoring rule field, operator, or points are invalid
    fields:
      - { field: field, label: Lead field, type: select, options: [{ value: email, label: Email }, { value: phone, label: Phone }, { value: source, label: Source }, { value: expected_revenue, label: Expected revenue }, { value: type, label: Type }], required: true }
      - { field: operator, label: Operator, type: select, options: [{ value: present, label: Is present }, { value: equals, label: Equals }, { value: gte, label: Greater or equal }], required: true }
      - { field: comparison_value, label: Comparison value, type: text }
      - { field: points, label: Points, type: number, required: true }
      - { field: active, label: Active, type: checkbox }
  - id: toggle_crm_scoring_rule
    type: server
    permission: crm.manage
    action: crm.scoring_rules.toggle
    handler: yaml_mutation
    operation: update
    refresh: [crm_scoring_rule_configuration]
    mutation:
      steps:
        - query: "UPDATE crm_scoring_rules SET active = NOT active WHERE id = :id"
      result: { query: "SELECT * FROM crm_scoring_rules WHERE id = :id" }
  - id: create_crm_assignment_rule
    type: server_form
    permission: crm.manage
    title: New lead assignment rule
    action: crm.assignment_rules.create
    handler: yaml_mutation
    operation: create
    refresh: [crm_assignment_rule_configuration]
    mutation:
      operation: insert
      table: crm_assignment_rules
      fields: [sequence, field, operator, comparison_value, team_id, user_name, active]
      required: [field, operator, user_name]
      defaults: { sequence: 10, active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE :field IN ('source', 'type', 'priority', 'team') AND :operator IN ('equals', 'present')"
          status: 400
          message: Assignment rule field or operator is invalid
        - query: "SELECT 1 AS ok FROM crm_team_members m WHERE m.user_name = :user_name AND m.active = true AND (:team_id IS NULL OR m.team_id = :team_id)"
          status: 400
          message: Select an active member of the selected team
    fields:
      - { field: sequence, label: Priority, type: number, default: 10 }
      - { field: field, label: Lead field, type: select, options: [{ value: source, label: Lead source }, { value: type, label: Lead type }, { value: priority, label: Priority }, { value: team, label: Sales team }], required: true }
      - { field: operator, label: Operator, type: select, options: [{ value: equals, label: Equals }, { value: present, label: Is present }], required: true }
      - { field: comparison_value, label: Match value, type: text }
      - { field: team_id, label: Sales team, type: select, options_source: crm_assignment_rule_team_lookup }
      - { field: user_name, label: Assignee, type: select, options_source: crm_assignment_rule_user_lookup, required: true }
      - { field: active, label: Active, type: checkbox, default: true }
  - id: edit_crm_assignment_rule
    type: server_form
    permission: crm.manage
    title: Edit lead assignment rule
    action: crm.assignment_rules.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [crm_assignment_rule_configuration]
    mutation:
      operation: update
      table: crm_assignment_rules
      fields: [sequence, field, operator, comparison_value, team_id, user_name, active]
      required: [field, operator, user_name]
      guards:
        - query: "SELECT id FROM crm_assignment_rules WHERE id = :id"
          status: 404
          message: Assignment rule no longer exists
        - query: "SELECT 1 AS ok WHERE :field IN ('source', 'type', 'priority', 'team') AND :operator IN ('equals', 'present')"
          status: 400
          message: Assignment rule field or operator is invalid
