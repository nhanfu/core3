title: Activity Type
page: { id: crm-activity-type-detail, route: /crm/activity-types/detail, breadcrumb: [CRM, Configuration, Activities, Activity Types, Activity Type], auth: { require: [crm.manage] } }
components:
  - type: OdooFormView
    source: crm_activity_type_detail
    title_field: name
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit, workflowStatus: Status }
    groups:
      - title: Activity Settings
        fields:
          - { field: name, label: Activity Type, type: text, required: true }
          - { field: category, label: Category, type: select, options: [default, upload_file, phonecall] }
          - { field: res_model, label: Available on, type: select, options: [crm.lead, res.partner] }
          - { field: summary, label: Default Summary, type: text }
          - { field: delay_count, label: Planned in, type: number }
          - { field: delay_unit, label: Unit, type: select, options: [minutes, hours, days, weeks, months] }
          - { field: delay_from, label: Type, type: select, options: [current_date, completion] }
      - title: Next Activity
        fields:
          - { field: chaining_type, label: Chaining Type, type: select, options: [suggest, trigger] }
          - { field: triggered_next_type, label: Triggered Next, type: text }
          - { field: suggested_next_types, label: Suggested Next, type: text }
      - title: Notes
        fields: [{ field: default_note, label: Default Note, type: textarea }]
