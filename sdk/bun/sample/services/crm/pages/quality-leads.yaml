title: Quality Leads
page: { id: quality-leads, breadcrumb: [Sales, CRM, Quality Leads], auth: { require: [crm.read] } }
datasources:
  - id: crm_quality_leads
    single: false
    permission: crm.read
    query: |
      SELECT id, row_version, name, type, partner_id, partner_name, email, phone, source,
        salesperson, team, stage, probability, expected_revenue,
        CAST(created_at AS VARCHAR) AS created_at,
        CASE WHEN stage IN ('Won', 'Lost') THEN 'Closed' ELSE 'Open' END AS status_group
      FROM crm_leads
      WHERE active = true AND created_at >= CURRENT_DATE - INTERVAL '30 days'
        AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR partner_name ILIKE '%' || :q || '%' OR email ILIKE '%' || :q || '%' OR phone ILIKE '%' || :q || '%')
        AND (:team IS NULL OR team = :team)
        AND NULLIF(TRIM(email), '') IS NOT NULL
        AND NULLIF(TRIM(phone), '') IS NOT NULL
        AND NULLIF(TRIM(salesperson), '') IS NOT NULL
        AND NULLIF(TRIM(source), '') IS NOT NULL
      ORDER BY created_at DESC
  - id: crm_quality_teams
    single: false
    permission: crm.read
    query: "SELECT name AS value, name AS label FROM crm_teams WHERE active = true ORDER BY name"
  - id: crm_quality_by_salesperson
    single: false
    permission: crm.read
    query: "SELECT salesperson, COUNT(*) AS quality_lead_count, CAST(COALESCE(SUM(expected_revenue), 0) AS DOUBLE) AS expected_revenue FROM crm_leads WHERE active = true AND created_at >= CURRENT_DATE - INTERVAL '30 days' AND NULLIF(TRIM(email), '') IS NOT NULL AND NULLIF(TRIM(phone), '') IS NOT NULL AND NULLIF(TRIM(salesperson), '') IS NOT NULL AND NULLIF(TRIM(source), '') IS NOT NULL GROUP BY salesperson ORDER BY quality_lead_count DESC"
components:
  - type: ListView
    variant: odoo
    source: crm_quality_leads
    search: { label: Search quality leads, placeholder: Search opportunities and customers... }
    filters:
      - { field: team, label: Sales team, options_source: crm_quality_teams }
    columns:
      - { field: name, label: Opportunity, type: PrimaryEntityCell }
      - { field: partner_name, label: Customer }
      - { field: email, label: Email }
      - { field: phone, label: Phone }
      - { field: source, label: Lead source }
      - { field: salesperson, label: Salesperson }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: expected_revenue, label: Expected revenue, align: right }
      - { field: created_at, label: Created }
    row_key: id
    row_actions: menu
    actions:
      - { id: open_quality_lead_customer, label: Open customer, permission: base.contacts.read, variant: secondary, show_if: "!!row.partner_id" }
      - { id: crm.quality_leads.export, label: Export, title: Export, icon: download }
    row_open_action: view_quality_lead
    row_double_click_action: view_quality_lead
    form_view: { page: apps/services/crm/pages/lead-detail.yaml, side_panel: true }
  - type: Chart
    source: crm_quality_by_salesperson
    title: Quality leads by salesperson
    label_field: salesperson
    value_field: quality_lead_count
    variant: bar
actions:
  - id: open_quality_lead_customer
    type: navigate
    permission: base.contacts.read
    navigate_to: /contact-detail
    params: { id: '{row.partner_id}' }
  - id: view_quality_lead
    type: navigate
    permission: crm.read
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
