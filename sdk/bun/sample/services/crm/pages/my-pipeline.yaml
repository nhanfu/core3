title: My Pipeline
page: { id: my-pipeline, breadcrumb: [Sales, CRM, My Pipeline], auth: { require: [crm.read] } }
components:
  - type: ListView
    variant: odoo
    source: crm_my_pipeline
    search: { label: Search my pipeline, placeholder: Search my opportunities and tags... }
    columns:
      - { field: name, label: Opportunity, type: PrimaryEntityCell, sortable: true }
      - { field: partner_name, label: Customer }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: tags, label: Tags }
      - { field: priority, label: Priority }
      - { field: expected_revenue, label: Expected revenue, align: right }
      - { field: probability, label: Probability, align: right }
      - { field: expected_closing, label: Expected closing }
      - { field: team, label: Sales team }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        group_by: stage
        card:
          title: name
          subtitle: partner_name
          fields:
            - { field: expected_revenue, label: Expected revenue }
            - { field: probability, label: Probability }
            - { field: team, label: Sales team }
    page_size: 50
    row_key: id
    selectable: true
    bulk_actions:
      - { id: bulk_delete_my_pipeline, label: Delete selected, permission: crm.write }
    row_open_action: view_my_opportunity
    row_double_click_action: view_my_opportunity
    form_view: { page: apps/services/crm/pages/lead-detail.yaml, side_panel: true }
actions:
  - id: view_my_opportunity
    type: navigate
    permission: crm.read
    navigate_to: /lead-detail
    params: { id: '{row.id}' }
