title: Pipeline Analysis
page: { id: crm-analysis, route: /analysis, breadcrumb: [CRM, Reporting, Pipeline], auth: { require: [crm.read] } }
components:
  - type: ListView
    variant: odoo
    source: crm_pipeline_analysis
    search: { label: Opportunities Analysis, placeholder: Search opportunities... }
    default_filters: { record_type: opportunity, active: active }
    filters:
      - { field: active, label: Status, options: [{ id: active, label: Active }, { id: inactive, label: Archived }] }
      - { field: team, label: Sales Team, options_source: crm_pipeline_analysis_teams }
      - { field: salesperson, label: Salesperson, options_source: crm_pipeline_analysis_salespeople }
      - { field: expected_closing_period, label: Expected Closing, options: [{ id: month, label: This Month }] }
    group_by:
      - { field: salesperson, label: Salesperson }
      - { field: team, label: Sales Team }
      - { field: stage, label: Stage }
      - { field: expected_closing_month, label: Expected Closing }
    default_group_by: stage
    view_navigation: tabs
    views:
      - id: graph
        label: Graph
        icon: graph
        category_field: stage
        measure_field: prorated_revenue
        measure_label: Prorated Revenue
        type: bar
        measures: [{ field: prorated_revenue, label: Prorated Revenue, aggregate: sum }]
      - id: pivot
        label: Pivot
        icon: pivot
        show_leaf_rows: false
        pivot:
          fields:
            - { field: created_month, column: Creation Date, type: date }
            - { field: stage, column: Stage }
            - { field: team, column: Sales Team }
            - { field: salesperson, column: Salesperson }
            - { field: prorated_revenue, column: Prorated Revenue }
          default: { rows: [stage], columns: [created_month], measures: [{ field: prorated_revenue, aggregate: sum, column: Prorated Revenue }] }
          date_ranges: { created_month: month }
      - id: list
        label: List
        icon: table
    show_pager: true
    page_size: 50
    row_key: id
    row_open_action: view_pipeline_analysis_record
    row_double_click_action: view_pipeline_analysis_record
    empty_state: { title: No data found!, description: Use this menu to have an overview of your Pipeline. }
    columns:
      - { field: name, label: Opportunity, type: PrimaryEntityCell, mobile: true }
      - { field: stage, label: Stage, type: StatusChip, mobile: true }
      - { field: salesperson, label: Salesperson, mobile: false }
      - { field: team, label: Sales Team, mobile: false }
      - { field: expected_closing, label: Expected Closing, type: Date, mobile: true }
      - { field: probability, label: Probability, align: right, mobile: false }
      - { field: prorated_revenue, label: Prorated Revenue, align: right, mobile: true }
