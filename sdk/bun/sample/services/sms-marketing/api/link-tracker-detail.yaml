page: { id: sms-link-tracker-detail }
datasources:
  - id: sms_link_tracker_detail
    single: true
    permission: sms_marketing.read
    error_states: { transport_error: { status: 503, code: SMS_LINK_TRACKER_DETAIL_UNAVAILABLE, message: Link tracker details are temporarily unavailable. } }
    query: "SELECT id, row_version, CAST(created_at AS VARCHAR) AS created_at, short_url, title, url, label, count, campaign_name, medium_name, source_name FROM sms_marketing_link_trackers WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
actions:
  - id: edit_sms_link_tracker_detail
    type: server_form
    permission: sms_marketing.write
    title: Edit Website Link
    action: sms_marketing.link_trackers.update
    handler: yaml_mutation
    operation: update
    prefill: state.sms_link_tracker_detail
    refresh: [sms_link_trackers, sms_link_tracker_detail]
    mutation:
      operation: update
      table: sms_marketing_link_trackers
      fields: [url, title, label, campaign_name, medium_name, source_name]
      required: [url]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM sms_marketing_link_trackers WHERE id = :id", status: 404, code: SMS_LINK_TRACKER_NOT_FOUND, message: Link tracker not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:url AS VARCHAR))) > 0 AND (CAST(:url AS VARCHAR) ILIKE 'http://%' OR CAST(:url AS VARCHAR) ILIKE 'https://%')", status: 422, code: SMS_LINK_TRACKER_URL_INVALID, message: Enter a valid target URL beginning with http:// or https://. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM sms_marketing_link_trackers WHERE url = TRIM(CAST(:url AS VARCHAR)) AND COALESCE(label, '') = COALESCE(CAST(:label AS VARCHAR), '') AND COALESCE(campaign_name, '') = COALESCE(CAST(:campaign_name AS VARCHAR), '') AND COALESCE(medium_name, '') = COALESCE(CAST(:medium_name AS VARCHAR), '') AND COALESCE(source_name, '') = COALESCE(CAST(:source_name AS VARCHAR), '') AND id <> :id)", status: 409, code: SMS_LINK_TRACKER_EXISTS, message: A link tracker with this URL, UTM values, and button label already exists. }
      result: { query: "SELECT * FROM sms_marketing_link_trackers WHERE id = :id" }
    fields: [{ field: url, label: Target Link, type: text, required: true }, { field: title, label: Page Title, type: text }, { field: label, label: Button label, type: text }, { field: campaign_name, label: Campaign, type: text }, { field: medium_name, label: Medium, type: text }, { field: source_name, label: Source, type: text }]
  - { id: visit_sms_link_tracker, type: server, permission: sms_marketing.read, action: sms_marketing.link_trackers.visit, handler: noop }
  - { id: view_sms_link_tracker_clicks, type: server, permission: sms_marketing.read, action: sms_marketing.link_trackers.clicks, handler: noop }
