page: { id: sms-utm-campaign-detail }
datasources:
  - id: sms_utm_campaign_detail_stages
    permission: sms_marketing.manage
    query: "SELECT id AS value, name AS label FROM sms_marketing_campaign_stages ORDER BY sequence, id"
  - id: sms_utm_campaign_sms_lists
    permission: sms_marketing.write
    query: "SELECT id AS value, name AS label FROM sms_lists WHERE state = 'Active' ORDER BY name, id"
  - id: sms_utm_campaign_detail
    single: true
    permission: sms_marketing.manage
    error_states: { transport_error: { status: 503, code: SMS_UTM_CAMPAIGN_DETAIL_UNAVAILABLE, message: Campaign details are temporarily unavailable. } }
    query: "SELECT c.id, c.row_version, c.title, c.name, c.user_name, c.stage_id, c.stage_name, c.tag_names, c.active, c.color, c.mailing_sms_count, (SELECT COUNT(*) FROM sms_campaigns m WHERE m.campaign_id = c.id AND COALESCE(m.ab_testing_enabled, false) = true) AS ab_testing_mailings_sms_count, c.is_auto_campaign, c.company_name FROM sms_marketing_utm_campaigns c WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND c.id = :id AND c.is_auto_campaign = false"
  - id: sms_utm_campaign_mailings
    permission: sms_marketing.read
    error_states: { transport_error: { status: 503, code: SMS_UTM_CAMPAIGN_MAILINGS_UNAVAILABLE, message: Campaign SMS mailings are temporarily unavailable. } }
    query: "SELECT m.id, m.row_version, m.name, m.campaign_id, c.row_version AS campaign_row_version, m.scheduled_at, CAST(m.scheduled_at AS VARCHAR) AS calendar_date, m.title, m.title AS subject, m.list_id, m.list_name, m.message, m.sender_name, 'mailing.contact' AS recipient_model_label, m.sender_name AS responsible, m.company_name, m.recipient_count, m.recipient_count AS sent, CASE WHEN m.recipient_count = 0 THEN 0 ELSE ROUND(100.0 * m.delivered_count / m.recipient_count, 1) END AS clicked, CASE WHEN m.recipient_count = 0 THEN 0 ELSE ROUND(100.0 * m.failed_count / m.recipient_count, 1) END AS bounced, COALESCE(m.ab_testing_enabled, false) AS ab_testing_enabled, m.state FROM sms_campaigns m JOIN sms_marketing_utm_campaigns c ON c.id = m.campaign_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND m.campaign_id = :id AND c.is_auto_campaign = false ORDER BY m.scheduled_at, m.id"
actions:
  - id: new_sms_utm_campaign_detail
    type: navigate
    permission: sms_marketing.manage
    navigate_to: /sms-marketing/campaigns
  - id: create_sms_from_utm_campaign
    type: server_form
    permission: sms_marketing.write
    title: Send SMS
    description: Create an SMS mailing linked to this campaign.
    action: mass_mailing.action_create_mass_sms
    handler: yaml_mutation
    operation: create
    prefill:
      campaign_id: '{state.sms_utm_campaign_detail.id}'
      title: '{state.sms_utm_campaign_detail.title}'
    params:
      campaign_id: '{state.sms_utm_campaign_detail.id}'
      expected_campaign_row_version: '{state.sms_utm_campaign_detail.row_version}'
    refresh: [sms_utm_campaign_detail, sms_utm_campaigns]
    mutation:
      operation: insert
      table: sms_campaigns
      fields: [name, title, sender_name, list_id, list_name, message, recipient_count, scheduled_at, campaign_id, company_name]
      required: [name, title, list_id, message, recipient_count, campaign_id]
      defaults: { state: Draft, row_version: 1, delivered_count: 0, failed_count: 0, created_at: '2026-09-22 14:00:00', updated_at: '2026-09-22 14:00:00' }
      before_steps:
        - { query: "SELECT 'sms-campaign-utm-' || :campaign_id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS id FROM sms_campaigns WHERE campaign_id = :campaign_id", assign: true }
      guards:
        - { query: "SELECT id AS campaign_id, company_name FROM sms_marketing_utm_campaigns WHERE id = :campaign_id AND active = true AND is_auto_campaign = false AND row_version = :expected_campaign_row_version", status: 409, code: SMS_UTM_CAMPAIGN_STALE, message: This campaign changed before the SMS mailing could be created. Reload and try again., assign: true }
        - { query: "SELECT id AS list_id, name AS list_name FROM sms_lists WHERE id = :list_id AND state = 'Active'", status: 422, code: SMS_UTM_CAMPAIGN_LIST_REQUIRED, message: Select an active mailing list., assign: true }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:title AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:message AS VARCHAR))) > 0 AND CAST(:recipient_count AS INTEGER) >= 0", status: 422, code: SMS_UTM_CAMPAIGN_MAILING_REQUIRED, message: Mailing name, title, SMS content, and a non-negative recipient count are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM sms_campaigns WHERE lower(name) = lower(trim(CAST(:name AS VARCHAR))))", status: 409, code: SMS_UTM_CAMPAIGN_MAILING_EXISTS, message: A mailing with this name already exists. }
      steps:
        - { query: "UPDATE sms_marketing_utm_campaigns SET mailing_sms_count = mailing_sms_count + 1, row_version = row_version + 1, updated_at = TIMESTAMP '2026-09-22 14:00:00' WHERE id = :campaign_id AND active = true AND is_auto_campaign = false AND row_version = :expected_campaign_row_version", expect_changed: true, status: 409, code: SMS_UTM_CAMPAIGN_STALE, message: This campaign changed before the SMS mailing could be linked. Reload and try again. }
      result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
    fields:
      - { field: campaign_id, label: Campaign, type: hidden, required: true }
      - { field: name, label: Mailing, type: text, required: true, placeholder: 'e.g. SMS/2026/0005' }
      - { field: title, label: Title, type: text, required: true }
      - { field: sender_name, label: Sender, type: text }
      - { field: list_id, label: Mailing List, type: select, options_source: sms_utm_campaign_sms_lists, required: true }
      - { field: list_name, label: Mailing List Name, type: hidden }
      - { field: message, label: SMS Content, type: textarea, required: true }
      - { field: scheduled_at, label: Scheduled for, type: text }
      - { field: recipient_count, label: Recipients Count, type: number, required: true, min: 0 }
  - id: edit_sms_utm_campaign_detail
    type: server_form
    permission: sms_marketing.manage
    title: Edit Campaign
    action: mass_mailing.action_view_utm_campaigns.update
    handler: yaml_mutation
    operation: update
    prefill: state.sms_utm_campaign_detail
    refresh: [sms_utm_campaign_detail, sms_utm_campaigns]
    mutation:
      operation: update
      table: sms_marketing_utm_campaigns
      fields: [title, name, user_name, stage_id, stage_name, tag_names, color]
      required: [title, stage_id]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM sms_marketing_utm_campaigns WHERE id = :id AND is_auto_campaign = false", status: 404, code: SMS_UTM_CAMPAIGN_NOT_FOUND, message: Campaign not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:title AS VARCHAR))) > 0", status: 422, code: SMS_UTM_CAMPAIGN_TITLE_REQUIRED, message: A campaign name is required. }
        - { query: "SELECT id AS stage_id, name AS stage_name FROM sms_marketing_campaign_stages WHERE id = :stage_id", status: 422, code: SMS_UTM_CAMPAIGN_STAGE_REQUIRED, message: Select a valid campaign stage., assign: true }
        - { query: "SELECT regexp_replace(lower(trim(CAST(:title AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS name", assign: true }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM sms_marketing_utm_campaigns WHERE name = :name AND id <> :id)", status: 409, code: SMS_UTM_CAMPAIGN_EXISTS, message: A campaign with this name already exists. }
      result: { query: "SELECT * FROM sms_marketing_utm_campaigns WHERE id = :id" }
    fields:
      - { field: title, label: Campaign Name, type: text, required: true }
      - { field: user_name, label: Responsible, type: text, required: true }
      - { field: stage_id, label: Stage, type: select, options_source: sms_utm_campaign_detail_stages, required: true }
      - { field: tag_names, label: Tags, type: text }
      - { field: color, label: Color Index, type: number, min: 0, max: 11 }
  - id: archive_sms_utm_campaign_detail
    type: server
    permission: sms_marketing.manage
    action: mass_mailing.action_view_utm_campaigns.archive
    handler: yaml_mutation
    operation: update
    refresh: [sms_utm_campaign_detail, sms_utm_campaigns]
    mutation:
      operation: update
      table: sms_marketing_utm_campaigns
      fields: [active]
      defaults: { active: false }
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM sms_marketing_utm_campaigns WHERE id = :id AND active = true AND is_auto_campaign = false", status: 404, code: SMS_UTM_CAMPAIGN_NOT_FOUND, message: Active campaign not found. }
  - id: restore_sms_utm_campaign_detail
    type: server
    permission: sms_marketing.manage
    action: mass_mailing.action_view_utm_campaigns.restore
    handler: yaml_mutation
    operation: update
    refresh: [sms_utm_campaign_detail, sms_utm_campaigns]
    mutation:
      operation: update
      table: sms_marketing_utm_campaigns
      fields: [active]
      defaults: { active: true }
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM sms_marketing_utm_campaigns WHERE id = :id AND active = false AND is_auto_campaign = false", status: 404, code: SMS_UTM_CAMPAIGN_NOT_FOUND, message: Archived campaign not found. }
  - id: sms_utm_campaign_mailings
    type: navigate
    permission: sms_marketing.manage
    navigate_to: /sms-campaigns
    params: { campaign_name: '{state.sms_utm_campaign_detail.title}' }
  - id: view_sms_campaign_from_utm_campaign
    type: navigate
    permission: sms_marketing.read
    navigate_to: /sms-campaigns/detail
    params: { id: '{row.id}' }
  - id: duplicate_sms_utm_campaign_mailing
    type: server
    permission: sms_marketing.write
    action: mass_mailing.action_duplicate
    handler: yaml_mutation
    operation: create
    refresh: [sms_utm_campaign_detail, sms_utm_campaign_mailings]
    mutation:
      operation: insert
      table: sms_campaigns
      id_input: copy_id
      fields: [name, title, sender_name, list_id, list_name, message, recipient_count, scheduled_at, campaign_id, company_name, ab_testing_enabled]
      required: [name, title, list_id, list_name, message, recipient_count, campaign_id]
      defaults: { state: Draft, row_version: 1, delivered_count: 0, failed_count: 0, created_at: '2026-09-22 15:00:00', updated_at: '2026-09-22 15:00:00', ab_testing_enabled: false }
      guards:
        - { query: "SELECT 'sms-campaign-copy-' || CAST(:id AS VARCHAR) || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS copy_id, CAST(:name AS VARCHAR) || ' (copy ' || CAST(COUNT(*) + 1 AS VARCHAR) || ')' AS name, CAST(:id AS VARCHAR) AS source_id, :expected_row_version AS source_row_version FROM sms_campaigns WHERE id LIKE 'sms-campaign-copy-' || CAST(:id AS VARCHAR) || '-%'", assign: true }
        - { query: "SELECT m.id FROM sms_campaigns m JOIN sms_marketing_utm_campaigns c ON c.id = m.campaign_id WHERE m.id = :source_id AND m.row_version = :source_row_version AND m.campaign_id = :campaign_id AND c.active = true AND c.is_auto_campaign = false", status: 409, code: SMS_UTM_CAMPAIGN_MAILING_STALE, message: This SMS mailing or its campaign changed. Reload before duplicating. }
        - { query: "SELECT id FROM sms_marketing_utm_campaigns WHERE id = :campaign_id AND active = true AND is_auto_campaign = false AND row_version = :expected_campaign_row_version", status: 409, code: SMS_UTM_CAMPAIGN_STALE, message: This campaign changed before the SMS mailing could be duplicated. Reload and try again. }
        - { query: "SELECT 1 AS ok FROM sms_lists WHERE id = :list_id AND state = 'Active'", status: 422, code: SMS_UTM_CAMPAIGN_LIST_REQUIRED, message: The SMS mailing list is no longer active. }
      steps:
        - { query: "UPDATE sms_marketing_utm_campaigns SET mailing_sms_count = mailing_sms_count + 1, row_version = row_version + 1, updated_at = TIMESTAMP '2026-09-22 15:00:00' WHERE id = :campaign_id AND row_version = :expected_campaign_row_version", expect_changed: true, status: 409, code: SMS_UTM_CAMPAIGN_STALE, message: This campaign changed while duplicating the SMS mailing. Reload and try again. }
      result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
    params: { campaign_id: '{row.campaign_id}', expected_campaign_row_version: '{row.campaign_row_version}' }
