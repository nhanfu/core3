version: 0.0.5
kind: schema
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS sms_contacts (
        id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL, email VARCHAR, mobile VARCHAR,
        phone_sanitized VARCHAR, phone_sanitized_blacklisted BOOLEAN NOT NULL DEFAULT false,
        message_bounce INTEGER NOT NULL DEFAULT 0, active BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL
      );
      CREATE TABLE IF NOT EXISTS sms_subscriptions (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, contact_id VARCHAR NOT NULL,
        list_id VARCHAR NOT NULL, opt_out BOOLEAN NOT NULL DEFAULT false,
        subscription_date TIMESTAMP NOT NULL, opt_out_datetime TIMESTAMP,
        created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL
      );
      CREATE INDEX IF NOT EXISTS sms_subscriptions_list_idx ON sms_subscriptions(list_id);
      CREATE INDEX IF NOT EXISTS sms_subscriptions_contact_idx ON sms_subscriptions(contact_id);
