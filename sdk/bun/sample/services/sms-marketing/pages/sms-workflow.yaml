workflow:
  id: sms_campaigns
  entity: sms_campaigns
  handler: order_transition
  initial: Draft
  permission: sms_marketing.write
  mutable: true
  status_source: sms_mailing_states
  states:
    - { id: Draft, label: Draft, color: neutral }
    - { id: In Queue, label: In Queue, color: blue }
    - { id: Sending, label: Sending, color: blue }
    - { id: Sent, label: Sent, color: green, terminal: true }
  transitions:
    - id: schedule
      from: [Draft]
      to: In Queue
      permission: sms_marketing.write
      mutation:
        guards: [{ query: "SELECT id FROM sms_campaigns WHERE id = :id AND state = 'Draft' AND message <> '' AND recipient_count > 0", status: 409, message: An SMS campaign needs a message and opt-in recipients }]
        steps: [{ query: "UPDATE sms_campaigns SET state = 'In Queue', scheduled_at = COALESCE(scheduled_at, TIMESTAMP '2026-09-12 12:00:00'), row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
    - id: send
      from: [In Queue]
      to: Sending
      permission: sms_marketing.write
      mutation:
        guards: [{ query: "SELECT id FROM sms_campaigns WHERE id = :id AND state = 'In Queue'", status: 409, message: Only queued SMS campaigns can send }]
        steps: [{ query: "UPDATE sms_campaigns SET state = 'Sending', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
    - id: complete
      from: [Sending]
      to: Sent
      permission: sms_marketing.manage
      mutation:
        guards: [{ query: "SELECT id FROM sms_campaigns WHERE id = :id AND state = 'Sending'", status: 409, message: Only sending SMS campaigns can complete }]
        steps: [{ query: "UPDATE sms_campaigns SET state = 'Sent', sent_at = TIMESTAMP '2026-09-12 12:00:00', delivered_count = recipient_count, failed_count = 0, row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
    - id: cancel
      from: [Draft, In Queue]
      to: Draft
      permission: sms_marketing.manage
      mutation:
        guards: [{ query: "SELECT id FROM sms_campaigns WHERE id = :id AND state IN ('Draft', 'In Queue')", status: 409, message: Only queued SMS campaigns can be cancelled }]
        steps: [{ query: "UPDATE sms_campaigns SET state = 'Draft', scheduled_at = NULL, row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
