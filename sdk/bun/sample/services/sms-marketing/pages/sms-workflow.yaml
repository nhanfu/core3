workflow:
  id: sms_campaigns
  entity: sms_campaigns
  handler: order_transition
  initial: Draft
  permission: sms_marketing.write
  mutable: true
  status_source: sms_campaign_states
  states:
    - { id: Draft, label: Draft, color: neutral }
    - { id: Scheduled, label: Scheduled, color: amber }
    - { id: Sending, label: Sending, color: blue }
    - { id: Sent, label: Sent, color: green, terminal: true }
    - { id: Cancelled, label: Cancelled, color: red, terminal: true }
  transitions:
    - id: schedule
      from: [Draft]
      to: Scheduled
      permission: sms_marketing.write
      mutation:
        guards: [{ query: "SELECT id FROM sms_campaigns WHERE id = :id AND state = 'Draft' AND message <> '' AND recipient_count > 0", status: 409, message: An SMS campaign needs a message and opt-in recipients }]
        steps: [{ query: "UPDATE sms_campaigns SET state = 'Scheduled', scheduled_at = COALESCE(scheduled_at, CURRENT_TIMESTAMP), row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
    - id: send
      from: [Scheduled]
      to: Sending
      permission: sms_marketing.write
      mutation:
        guards: [{ query: "SELECT id FROM sms_campaigns WHERE id = :id AND state = 'Scheduled'", status: 409, message: Only scheduled SMS campaigns can send }]
        steps: [{ query: "UPDATE sms_campaigns SET state = 'Sending', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
    - id: complete
      from: [Sending]
      to: Sent
      permission: sms_marketing.manage
      mutation:
        guards: [{ query: "SELECT id FROM sms_campaigns WHERE id = :id AND state = 'Sending'", status: 409, message: Only sending SMS campaigns can complete }]
        steps: [{ query: "UPDATE sms_campaigns SET state = 'Sent', sent_at = CURRENT_TIMESTAMP, delivered_count = recipient_count, failed_count = 0, row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
    - id: cancel
      from: [Draft, Scheduled]
      to: Cancelled
      permission: sms_marketing.manage
      mutation:
        guards: [{ query: "SELECT id FROM sms_campaigns WHERE id = :id AND state IN ('Draft', 'Scheduled')", status: 409, message: Only open SMS campaigns can be cancelled }]
        steps: [{ query: "UPDATE sms_campaigns SET state = 'Cancelled', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM sms_campaigns WHERE id = :id" }
