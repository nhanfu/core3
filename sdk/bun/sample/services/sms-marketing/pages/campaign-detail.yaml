title: SMS Campaign
page: { id: sms-campaign-detail, breadcrumb: [Marketing, SMS Marketing, Detail], auth: { require: [sms_marketing.read] } }
datasources:
  - id: sms_campaign_detail
    single: true
    permission: sms_marketing.read
    query: "SELECT id, row_version, name, title, sender_name, list_name, message, recipient_count, delivered_count, failed_count, state, CAST(scheduled_at AS VARCHAR) AS scheduled_at, CAST(sent_at AS VARCHAR) AS sent_at FROM sms_campaigns WHERE id = :id"
components:
  - type: OdooFormView
    source: sms_campaign_detail
    title_field: name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: Scheduled, label: Scheduled }, { value: Sending, label: Sending }, { value: Sent, label: Sent }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, Scheduled: amber, Sending: blue, Sent: green, Cancelled: red }
    group_columns: 2
    groups:
      - title: Campaign
        fields: [{ field: name, label: Campaign }, { field: state, label: Status }, { field: title, label: Title }, { field: sender_name, label: Sender }, { field: list_name, label: Audience }, { field: message, label: Message }]
      - title: Delivery
        fields: [{ field: recipient_count, label: Recipients }, { field: delivered_count, label: Delivered }, { field: failed_count, label: Failed }, { field: scheduled_at, label: Scheduled at }, { field: sent_at, label: Sent at }]
actions:
  - { id: schedule_sms_campaign_detail, type: server, permission: sms_marketing.write, action: sms_marketing.campaigns.schedule, handler: order_transition, workflow: sms_campaigns, operation: schedule, params: { id: '{state.id}' }, refresh: [sms_campaign_detail] }
  - { id: send_sms_campaign_detail, type: server, permission: sms_marketing.write, action: sms_marketing.campaigns.send, handler: order_transition, workflow: sms_campaigns, operation: send, params: { id: '{state.id}' }, refresh: [sms_campaign_detail] }
  - { id: complete_sms_campaign_detail, type: server, permission: sms_marketing.manage, action: sms_marketing.campaigns.complete, handler: order_transition, workflow: sms_campaigns, operation: complete, params: { id: '{state.id}' }, refresh: [sms_campaign_detail] }
  - { id: cancel_sms_campaign_detail, type: server, permission: sms_marketing.manage, action: sms_marketing.campaigns.cancel, handler: order_transition, workflow: sms_campaigns, operation: cancel, params: { id: '{state.id}' }, refresh: [sms_campaign_detail] }
