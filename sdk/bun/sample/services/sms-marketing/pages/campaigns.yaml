title: SMS Marketing
page: { id: sms-campaigns, route: /sms-campaigns, breadcrumb: [Marketing, SMS Marketing, SMS Marketing], auth: { require: [sms_marketing.read] } }
components:
  - type: ListView
    variant: odoo
    source: sms_marketing_mailings
    create_action: create_sms_campaign
    create_label: New
    search: { label: Mailings, placeholder: Search Mailings... }
    filters: [{ field: state, label: Status, options_source: sms_mailing_states }]
    default_filters: { assigned_to_me: true }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - { id: kanban, label: Kanban, icon: dashboard, group_by: state, groups_source: sms_mailing_states }
      - { id: form, label: Form, icon: form, mobile: false }
      - { id: calendar, label: Calendar, icon: calendar, mobile: false, date_field: calendar_date }
      - { id: graph, label: Graph, icon: graph, mobile: false, category_field: state, measure_field: sent, type: bar }
    columns:
      - { field: calendar_date, label: Date, type: DateTime, mobile: false }
      - { field: subject, label: Title, type: PrimaryEntityCell, mobile: true }
      - { field: recipient_model_label, label: Recipients, mobile: false }
      - { field: sent, label: Sent, align: right, mobile: false }
      - { field: clicked, label: Clicked (%), type: ProgressBar, align: right, mobile: false }
      - { field: bounced, label: Bounced (%), type: ProgressBar, align: right, mobile: false }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_open_action: view_sms_campaign
    row_double_click_action: view_sms_campaign
    row_actions: menu
    form_view: { page: apps/services/sms-marketing/pages/campaign-detail.yaml, side_panel: true }
    empty_state: { title: Create a SMS Marketing Mailing, description: 'Write an appealing SMS Text Message, define recipients and track its results.' }
