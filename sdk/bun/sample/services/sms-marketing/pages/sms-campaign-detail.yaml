title: SMS Marketing
page: { id: sms-campaign-detail, route: /sms-campaigns/detail, breadcrumb: [Marketing, SMS Marketing, SMS Marketing], auth: { require: [sms_marketing.read] } }
components:
  - type: OdooFormView
    source: sms_marketing_mailing_detail
    title_field: subject
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: In Queue, label: In Queue }, { value: Sending, label: Sending }, { value: Sent, label: Sent }]
    status_colors: { Draft: blue, 'In Queue': blue, Sending: teal, Sent: green }
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit, workflowStatus: Status }
    header_actions:
      - { id: new_sms_campaign, label: New, variant: primary, permission: sms_marketing.write }
      - { id: send_sms_campaign_reload, label: Send, variant: primary, permission: sms_marketing.write, show_if: "state.sms_marketing_mailing_detail.state === 'Draft'" }
      - { id: schedule_sms_campaign_reload, label: Schedule, variant: secondary, permission: sms_marketing.write, show_if: "state.sms_marketing_mailing_detail.state === 'Draft'" }
      - { id: cancel_sms_campaign_reload, label: Cancel, variant: secondary, permission: sms_marketing.write, show_if: "state.sms_marketing_mailing_detail.state === 'In Queue'" }
      - { id: complete_sms_campaign_reload, label: Mark Sent, variant: primary, permission: sms_marketing.manage, show_if: "state.sms_marketing_mailing_detail.state === 'Sending'" }
    group_columns: 2
    groups:
      - title: Mailing
        fields: [{ field: subject, label: Title }, { field: company_name, label: Company }, { field: recipient_model_label, label: Recipients }, { field: mailing_list_names, label: Mailing Lists }, { field: responsible, label: Responsible }]
      - title: Delivery
        fields: [{ field: sent, label: Sent }, { field: expected, label: Expected }, { field: scheduled, label: Scheduled }, { field: failed, label: Failed }, { field: bounced, label: Bounced }, { field: schedule_date, label: Scheduled for }, { field: sent_date, label: Sent Date }]
    notebook:
      active: sms_body
      tabs:
        - { id: sms_body, label: SMS Content, content_slot: true }
        - { id: settings, label: Settings, groups: [{ title: Options, fields: [{ field: sms_allow_unsubscribe, label: Allow Unsubscribe }] }, { title: Tracking, fields: [{ field: campaign_name, label: Campaign }] }] }
actions:
  - { id: new_sms_campaign, type: navigate, permission: sms_marketing.write, navigate_to: /sms-campaigns }
  # Workflow buttons deliberately reload the detail route after the mutation.
  # The generic renderer refreshes every declared source sequentially; if a
  # source request never settles, the form submit remains pending forever.
  - id: send_sms_campaign_reload
    type: client
    permission: sms_marketing.write
    script: |
      // js
      async ({ row, request }) => {
        const controller = new AbortController()
        const timeout = setTimeout(() => controller.abort(), 10000)
        try {
          await request('/api/mutate', { method: 'POST', signal: controller.signal, body: { mutation: 'sms_marketing.mailings.send', id: row.id, expected_row_version: row.row_version } })
          window.location.reload()
        } catch (error) {
          if (error?.name === 'AbortError') throw new Error('Sending SMS campaign timed out. Please try again.')
          throw error
        } finally {
          clearTimeout(timeout)
        }
      }
  - id: schedule_sms_campaign_reload
    type: client
    permission: sms_marketing.write
    script: |
      // js
      async ({ row, request }) => {
        const controller = new AbortController()
        const timeout = setTimeout(() => controller.abort(), 10000)
        try {
          await request('/api/mutate', { method: 'POST', signal: controller.signal, body: { mutation: 'sms_marketing.mailings.schedule', id: row.id, expected_row_version: row.row_version } })
          window.location.reload()
        } catch (error) {
          if (error?.name === 'AbortError') throw new Error('Scheduling SMS campaign timed out. Please try again.')
          throw error
        } finally {
          clearTimeout(timeout)
        }
      }
  - id: cancel_sms_campaign_reload
    type: client
    permission: sms_marketing.write
    script: |
      // js
      async ({ row, request }) => {
        const controller = new AbortController()
        const timeout = setTimeout(() => controller.abort(), 10000)
        try {
          await request('/api/mutate', { method: 'POST', signal: controller.signal, body: { mutation: 'sms_marketing.mailings.cancel', id: row.id, expected_row_version: row.row_version } })
          window.location.reload()
        } catch (error) {
          if (error?.name === 'AbortError') throw new Error('Cancelling SMS campaign timed out. Please try again.')
          throw error
        } finally {
          clearTimeout(timeout)
        }
      }
  - id: complete_sms_campaign_reload
    type: client
    permission: sms_marketing.manage
    script: |
      // js
      async ({ row, request }) => {
        const controller = new AbortController()
        const timeout = setTimeout(() => controller.abort(), 10000)
        try {
          await request('/api/mutate', { method: 'POST', signal: controller.signal, body: { mutation: 'sms_marketing.mailings.complete', id: row.id, expected_row_version: row.row_version } })
          window.location.reload()
        } catch (error) {
          if (error?.name === 'AbortError') throw new Error('Completing SMS campaign timed out. Please try again.')
          throw error
        } finally {
          clearTimeout(timeout)
        }
      }
