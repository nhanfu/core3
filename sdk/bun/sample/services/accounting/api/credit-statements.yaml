page: { id: accounting-credit-statements }
datasources:
  - id: accounting_credit_statements
    permission: accounting.read
    pivot: { fields: [statement_month, starting_balance, ending_balance] }
    error_states: { forbidden: { status: 403, code: ACCOUNTING_CREDIT_STATEMENTS_FORBIDDEN, message: You do not have access to credit statements. }, transport_error: { status: 503, code: ACCOUNTING_DATA_UNAVAILABLE, message: Accounting data service is temporarily unavailable } }
    query: "SELECT id, row_version, reference, strftime(date, '%b') || ' ' || CAST(EXTRACT(DAY FROM date) AS VARCHAR) AS date_display, strftime(date, '%b') || ' ' || CAST(EXTRACT(DAY FROM date) AS VARCHAR) AS statement_month, journal, company, starting_balance, ending_balance, printf('$ %,.2f', CAST(starting_balance AS DOUBLE)) AS starting_balance_display, printf('$ %,.2f', CAST(ending_balance AS DOUBLE)) AS ending_balance_display FROM accounting_credit_statements WHERE (:fixture_state IS NULL OR :fixture_state <> 'empty') AND (:q IS NULL OR reference ILIKE '%' || :q || '%' OR journal ILIKE '%' || :q || '%') AND (:statement_filter IS NULL OR (:statement_filter = 'empty' AND line_numbers = '') OR (:statement_filter = 'invalid' AND is_valid = FALSE)) ORDER BY date DESC, sequence"
