page: { id: journal-entries }
datasources:
  - id: accounting_journal_entries
    single: false
    permission: accounting.read
    query: "SELECT id, row_version, name, journal, CAST(entry_date AS VARCHAR) AS entry_date, reference, debit, credit, state, COALESCE(checked, FALSE) AS checked FROM accounting_journal_entries WHERE (:q IS NULL OR name ILIKE '%' || :q || '%' OR journal ILIKE '%' || :q || '%') ORDER BY entry_date DESC"
actions:
  - id: create_journal_entry
    type: server_form
    permission: accounting.write
    title: New journal entry
    action: accounting.journal_entries.create
    handler: yaml_mutation
    operation: create
    mutation:
      operation: insert
      table: accounting_journal_entries
      fields: [name, journal, entry_date, reference, debit, credit]
      required: [name, journal]
      defaults: { state: Draft, debit: 0, credit: 0 }
      guards: [{ query: "SELECT 1 AS ok WHERE (CAST(:debit AS DECIMAL(18,2)) >= 0 AND CAST(:credit AS DECIMAL(18,2)) >= 0) AND (CAST(:debit AS DECIMAL(18,2)) > 0 OR CAST(:credit AS DECIMAL(18,2)) > 0)", status: 400, message: An entry must contain a debit or credit amount }]
      result: { query: "SELECT * FROM accounting_journal_entries WHERE id = :id" }
    fields:
      - { field: name, label: Entry, type: text, required: true }
      - { field: journal, label: Journal, type: select, options: [Sales, Purchases, Bank, Cash, Miscellaneous] }
      - { field: entry_date, label: Date, type: text }
      - { field: reference, label: Reference, type: text }
      - { field: debit, label: Debit, type: number }
      - { field: credit, label: Credit, type: number }
  - id: review_journal_entry
    type: server
    permission: accounting.write
    action: accounting.journal_entries.review
    handler: yaml_mutation
    operation: review
    refresh: [accounting_journal_entries, accounting_journal_entry_detail]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM accounting_journal_entries WHERE id = :id", status: 404, code: ACCOUNTING_JOURNAL_ENTRY_REVIEW_NOT_FOUND, message: Journal entry was not found. }
        - { query: "SELECT id FROM accounting_journal_entries WHERE id = :id AND state = 'Posted' AND COALESCE(checked, FALSE) = FALSE AND row_version = :expected_row_version", status: 409, code: ACCOUNTING_JOURNAL_ENTRY_REVIEW_UNAVAILABLE, message: Only an unchanged, unchecked posted journal entry can be marked reviewed. Reload before reviewing. }
      steps:
        - { query: "UPDATE accounting_journal_entries SET checked = TRUE, row_version = row_version + 1 WHERE id = :id AND state = 'Posted' AND COALESCE(checked, FALSE) = FALSE AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ACCOUNTING_JOURNAL_ENTRY_REVIEW_STALE, message: The journal entry changed before it could be marked reviewed. Reload and try again. }
      result: { query: "SELECT * FROM accounting_journal_entries WHERE id = :id" }
