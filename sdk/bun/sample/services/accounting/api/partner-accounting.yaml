page: { id: partner-accounting }
datasources:
  - id: accounting_partner_accounting
    permission: accounting.read
    error_states: { transport_error: { status: 503, code: ACCOUNTING_DATA_UNAVAILABLE, message: Accounting data service is temporarily unavailable } }
    query: "WITH request_guard AS (SELECT TRUE AS ok) SELECT id, row_version, partner_name, partner_role, customer_payment_terms, vendor_payment_terms, fiscal_position, company, state FROM accounting_partner_accounting CROSS JOIN request_guard WHERE request_guard.ok AND (:fixture_state IS NULL OR :fixture_state <> 'empty') AND (:q IS NULL OR partner_name ILIKE '%' || :q || '%' OR partner_role ILIKE '%' || :q || '%' OR COALESCE(customer_payment_terms, '') ILIKE '%' || :q || '%' OR COALESCE(vendor_payment_terms, '') ILIKE '%' || :q || '%' OR COALESCE(fiscal_position, '') ILIKE '%' || :q || '%') ORDER BY partner_name"
