page: { id: payment-transaction-detail }
datasources:
  - id: accounting_payment_transaction_detail
    single: true
    permission: accounting.read
    error_states:
      forbidden: { status: 403, code: ACCOUNTING_PAYMENT_TRANSACTION_DETAIL_FORBIDDEN, message: You do not have access to this payment transaction. }
      transport_error: { status: 503, code: ACCOUNTING_PAYMENT_TRANSACTION_DETAIL_UNAVAILABLE, message: Payment transaction details are temporarily unavailable. }
    query: "SELECT id, row_version, reference, source_transaction, amount, amount_display, payment_method, provider, company, provider_reference, token, create_date, last_state_change, is_live, is_live_label, state, state_label, partner, partner_name, partner_address, partner_city, partner_state, partner_zip, partner_country, partner_email, partner_phone, partner_lang, state_message FROM accounting_payment_transactions WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END = TRUE AND id = :id"
