page: { id: invoice-detail }
datasources:
  - id: accounting_invoice_detail
    single: true
    permission: accounting.read
    workflow: accounting_invoices
    error_states: { transport_error: { status: 503, code: ACCOUNTING_DATA_UNAVAILABLE, message: Accounting data service is temporarily unavailable } }
    query: "WITH request_guard AS (SELECT TRUE AS ok) SELECT id, row_version, name, partner_name, invoice_type, CAST(invoice_date AS VARCHAR) AS invoice_date, CAST(due_date AS VARCHAR) AS due_date, amount_untaxed, amount_tax, amount_total, amount_residual, state, reference, source_service, source_type, source_id, reversal_id, reversal_of_id, reversal_reason, COALESCE(send_count, 0) AS send_count, CAST(last_sent_at AS VARCHAR) AS last_sent_at, CASE partner_name WHEN 'Gemini Furniture' THEN 'gemini@example.com' WHEN 'LightsUp' THEN 'lightsup@example.com' WHEN 'Azure Interior' THEN 'azure@example.com' WHEN 'Lumber Inc' THEN 'lumber@example.com' ELSE 'billing@example.com' END AS recipient_email, 'Invoice ' || name AS subject, 'Please find your invoice ' || name || ' attached.' AS body, CASE WHEN invoice_type IN ('Customer Invoice', 'Vendor Bill') THEN 2 ELSE 1 END AS line_count, CASE WHEN invoice_type IN ('Customer Invoice', 'Vendor Bill') THEN 'Primary accounting line; tax line' ELSE 'Adjustment line' END AS line_summary FROM accounting_invoices CROSS JOIN request_guard WHERE request_guard.ok AND (:fixture_state IS NULL OR :fixture_state <> 'empty') AND id = :id"
  - id: accounting_invoice_messages
    single: false
    permission: accounting.read
    query: "SELECT id, actor_name, action, action_label, detail, delivery_method, recipient, subject, status, CAST(created_at AS VARCHAR) AS created_at FROM accounting_invoice_messages WHERE invoice_id = :id ORDER BY created_at DESC"
actions:
  - id: edit_accounting_invoice
    type: server_form
    permission: accounting.write
    title: Edit invoice
    action: accounting.invoices.update
    handler: yaml_mutation
    operation: update
    prefill: state.accounting_invoice_detail
    refresh: [accounting_invoice_detail]
    mutation:
      operation: update
      table: accounting_invoices
      fields: [name, partner_name, invoice_type, invoice_date, due_date, amount_untaxed, amount_tax, amount_total, amount_residual, reference]
      required: [name]
      timestamps: true
      guards: [{ query: "SELECT id FROM accounting_invoices WHERE id = :id AND state = 'Draft'", status: 409, message: Only draft invoices can be edited }]
    fields:
      - { field: name, label: Invoice, type: text, required: true }
      - { field: partner_name, label: Customer or vendor, type: select, options: [Azure Interior, Deco Addict, Gemini Furniture, Lumber Inc, Ready Mat, Wood Corner] }
      - { field: invoice_type, label: Type, type: select, options: [Customer Invoice, Vendor Bill, Customer Credit Note, Vendor Refund] }
      - { field: invoice_date, label: Invoice date, type: date }
      - { field: due_date, label: Due date, type: date }
      - { field: amount_untaxed, label: Untaxed amount, type: number }
      - { field: amount_tax, label: Tax, type: number }
      - { field: amount_total, label: Total, type: number }
      - { field: amount_residual, label: Amount due, type: number }
      - { field: reference, label: Reference, type: text }
  - { id: post_accounting_invoice_detail, type: server, permission: accounting.write, action: accounting.invoices.post, handler: order_transition, workflow: accounting_invoices, operation: post, refresh: [accounting_invoice_detail] }
  - id: register_accounting_invoice_payment
    type: server_form
    permission: accounting.write
    title: Register invoice payment
    action: accounting.invoices.pay
    handler: yaml_mutation
    operation: pay
    refresh: [accounting_invoice_detail]
    mutation:
      generated: [payment_id]
      guards:
        - { query: "SELECT id FROM accounting_invoices WHERE id = :id AND state = 'Posted' AND amount_residual > 0", status: 409, message: Only posted invoices with a balance can be paid }
        - { query: "SELECT id FROM accounting_invoices WHERE id = :id AND CAST(:payment_amount AS DECIMAL(18,2)) > 0 AND CAST(:payment_amount AS DECIMAL(18,2)) <= amount_residual", status: 422, message: Payment must be positive and cannot exceed the amount due }
      steps:
        - query: "INSERT INTO accounting_payments(id, name, partner_name, payment_type, amount, payment_method, payment_date, state, reference) SELECT :payment_id, 'Register payment', partner_name, CASE WHEN invoice_type IN ('Vendor Bill', 'Vendor Refund') THEN 'Outbound' ELSE 'Inbound' END, CAST(:payment_amount AS DECIMAL(18,2)), 'Bank', CURRENT_DATE, 'Posted', name FROM accounting_invoices WHERE id = :id"
        - query: "UPDATE accounting_invoices SET amount_residual = amount_residual - CAST(:payment_amount AS DECIMAL(18,2)), state = CASE WHEN amount_residual - CAST(:payment_amount AS DECIMAL(18,2)) <= 0 THEN 'Paid' ELSE state END, row_version = row_version + 1 WHERE id = :id"
      result: { query: "SELECT * FROM accounting_invoices WHERE id = :id" }
    fields:
      - { field: payment_amount, label: Payment amount, type: number, required: true }
      - { field: payment_method, label: Payment method, type: select, options: [Bank, Cash, Card, Other], default: Bank }
  - id: reverse_accounting_invoice
    type: server_form
    permission: accounting.write
    title: Create credit note
    action: accounting.invoices.reverse
    handler: yaml_mutation
    operation: create
    refresh: [accounting_invoice_detail, accounting_invoices]
    mutation:
      operation: insert
      table: accounting_invoices
      id_input: reversal_id
      generated: [reversal_id]
      fields: [name, partner_name, invoice_type, invoice_date, due_date, amount_untaxed, amount_tax, amount_total, amount_residual, state, reference, reversal_of_id, reversal_reason]
      required: [reversal_date]
      defaults: { state: Draft }
      guards:
        - { query: "SELECT 1 AS ok WHERE try_cast(:reversal_date AS DATE) IS NOT NULL AND try_cast(:reversal_date AS DATE) BETWEEN DATE '2000-01-01' AND DATE '2026-12-31'", status: 422, code: ACCOUNTING_INVOICE_REVERSAL_DATE_INVALID, message: The reversal date must be a valid date between January 1, 2000 and December 31, 2026 }
        - query: "SELECT id AS source_invoice_id, partner_name, CASE invoice_type WHEN 'Customer Invoice' THEN 'Customer Credit Note' ELSE 'Vendor Refund' END AS invoice_type, name || '/REV' AS name, CAST(:reversal_date AS DATE) AS invoice_date, CAST(:reversal_date AS DATE) AS due_date, amount_untaxed, amount_tax, amount_total, amount_total AS amount_residual, 'Draft' AS state, 'Reversal of: ' || name AS reference, id AS reversal_of_id, COALESCE(NULLIF(TRIM(CAST(:reason AS VARCHAR)), ''), 'Correction of posted document') AS reversal_reason FROM accounting_invoices WHERE id = :id AND row_version = :expected_row_version AND state = 'Posted' AND invoice_type IN ('Customer Invoice', 'Vendor Bill') AND reversal_id IS NULL"
          status: 409
          code: ACCOUNTING_INVOICE_REVERSAL_UNAVAILABLE
          message: Only an unreversed posted invoice or vendor bill can create a credit note
          assign: true
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM accounting_invoices WHERE id = :reversal_id)", status: 409, code: ACCOUNTING_INVOICE_REVERSAL_EXISTS, message: A credit note already exists for this invoice }
      steps:
        - query: "UPDATE accounting_invoices SET reversal_id = :reversal_id, row_version = row_version + 1 WHERE id = :source_invoice_id AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: ACCOUNTING_INVOICE_REVERSAL_STALE
          message: The invoice changed; reload before creating a credit note
      result:
        query: "SELECT reversal.id, reversal.row_version, reversal.name, reversal.partner_name, reversal.invoice_type, CAST(reversal.invoice_date AS VARCHAR) AS invoice_date, reversal.amount_total, reversal.amount_residual, reversal.state, reversal.reference, reversal.reversal_of_id, reversal.reversal_reason, source.name AS source_invoice_name, source.row_version AS source_row_version FROM accounting_invoices reversal JOIN accounting_invoices source ON source.id = reversal.reversal_of_id WHERE reversal.id = :id"
    fields:
      - { field: reversal_date, label: Reversal date, type: date, required: true, default: '2026-01-15' }
      - { field: reason, label: Reason, type: text, default: Correction of posted document }
  - id: send_accounting_invoice
    type: server_form
    permission: accounting.write
    title: Send invoice
    action: accounting.invoices.send
    handler: yaml_mutation
    operation: send
    params: { id: '{state.id}' }
    prefill: state.accounting_invoice_detail
    refresh: [accounting_invoice_detail, accounting_invoice_messages]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM accounting_invoices WHERE id = :id AND state = 'Posted' AND invoice_type <> 'Journal Entry' AND row_version = :expected_row_version", status: 409, code: ACCOUNTING_INVOICE_SEND_UNAVAILABLE, message: Only an unchanged posted invoice can be sent. Reload before sending. }
        - { query: "SELECT 1 AS ok WHERE :delivery_method IN ('Email', 'Post')", status: 422, code: ACCOUNTING_INVOICE_SEND_METHOD_INVALID, message: Choose Email or Post. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:recipient_email AS VARCHAR))) BETWEEN 3 AND 320", status: 422, code: ACCOUNTING_INVOICE_SEND_RECIPIENT_INVALID, message: A recipient is required. }
        - { query: "SELECT 1 AS ok WHERE :delivery_method = 'Post' OR regexp_matches(TRIM(CAST(:recipient_email AS VARCHAR)), '^[^ @]+@[^ @]+\\.[^ @]+$')", status: 422, code: ACCOUNTING_INVOICE_SEND_RECIPIENT_INVALID, message: Enter a valid email recipient. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:subject AS VARCHAR))) BETWEEN 1 AND 255 AND LENGTH(TRIM(CAST(:body AS VARCHAR))) BETWEEN 1 AND 10000", status: 422, code: ACCOUNTING_INVOICE_SEND_CONTENT_INVALID, message: Subject and message are required. }
      steps:
        - { query: "INSERT INTO accounting_invoice_messages(id, invoice_id, actor_name, action, action_label, detail, delivery_method, recipient, subject, status) VALUES(gen_random_uuid(), :id, :current_user_name, 'send', 'Sent by ' || :delivery_method, CAST(:body AS VARCHAR), :delivery_method, CAST(:recipient_email AS VARCHAR), CAST(:subject AS VARCHAR), 'Queued')" }
        - { query: "UPDATE accounting_invoices SET send_count = COALESCE(send_count, 0) + 1, last_sent_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: ACCOUNTING_INVOICE_SEND_STALE, message: The invoice changed; reload before sending. }
      result: { query: "SELECT * FROM accounting_invoices WHERE id = :id" }
    fields:
      - { field: row_version, label: Row version, type: hidden, default: 1 }
      - { field: delivery_method, label: Delivery method, type: select, options: [Email, Post], default: Email, required: true }
      - { field: recipient_email, label: To, type: text, default: billing@example.com, required: true }
      - { field: subject, label: Subject, type: text, default: Invoice, required: true }
      - { field: body, label: Message, type: textarea, default: Please find the invoice attached., required: true }
  - id: send_accounting_invoice_message
    type: server_form
    permission: accounting.write
    title: Send message
    action: accounting.invoices.message
    handler: yaml_mutation
    operation: message
    params: { id: '{state.id}' }
    refresh: [accounting_invoice_messages]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      guards: [{ query: "SELECT 1 AS ok WHERE LENGTH(TRIM(:content)) BETWEEN 1 AND 4000", status: 422, code: ACCOUNTING_INVOICE_MESSAGE_INVALID, message: Message content must be between 1 and 4000 characters. }]
      steps: [{ query: "INSERT INTO accounting_invoice_messages(id, invoice_id, actor_name, action, action_label, detail, delivery_method, recipient, subject, status) VALUES(gen_random_uuid(), :id, :current_user_name, 'message', 'Message', :content, NULL, NULL, NULL, 'Posted')" }]
  - id: log_accounting_invoice_note
    type: server_form
    permission: accounting.write
    title: Log note
    action: accounting.invoices.note
    handler: yaml_mutation
    operation: note
    params: { id: '{state.id}' }
    refresh: [accounting_invoice_messages]
    fields: [{ field: content, label: Note, type: textarea, required: true }]
    mutation:
      guards: [{ query: "SELECT 1 AS ok WHERE LENGTH(TRIM(:content)) BETWEEN 1 AND 4000", status: 422, code: ACCOUNTING_INVOICE_NOTE_INVALID, message: Note content must be between 1 and 4000 characters. }]
      steps: [{ query: "INSERT INTO accounting_invoice_messages(id, invoice_id, actor_name, action, action_label, detail, delivery_method, recipient, subject, status) VALUES(gen_random_uuid(), :id, :current_user_name, 'note', 'Note', :content, NULL, NULL, NULL, 'Posted')" }]
  - id: schedule_accounting_invoice_activity
    type: server_form
    permission: accounting.write
    title: Schedule activity
    action: accounting.invoices.activity
    handler: yaml_mutation
    operation: activity
    params: { id: '{state.id}' }
    refresh: [accounting_invoice_messages]
    fields: [{ field: content, label: Activity, type: textarea, required: true }]
    mutation:
      guards: [{ query: "SELECT 1 AS ok WHERE LENGTH(TRIM(:content)) BETWEEN 1 AND 4000", status: 422, code: ACCOUNTING_INVOICE_ACTIVITY_INVALID, message: Activity content must be between 1 and 4000 characters. }]
      steps: [{ query: "INSERT INTO accounting_invoice_messages(id, invoice_id, actor_name, action, action_label, detail, delivery_method, recipient, subject, status) VALUES(gen_random_uuid(), :id, :current_user_name, 'activity', 'Activity', :content, NULL, NULL, NULL, 'Posted')" }]
