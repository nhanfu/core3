page: { id: payment-tokens }
datasources:
  - id: accounting_payment_tokens
    single: false
    permission: accounting.read
    query: "SELECT payment_details, partner, payment_method, provider FROM (VALUES (CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR))) tokens(payment_details, partner, payment_method, provider) WHERE payment_details IS NOT NULL AND (:q IS NULL OR payment_details ILIKE '%' || :q || '%' OR COALESCE(partner, '') ILIKE '%' || :q || '%' OR COALESCE(payment_method, '') ILIKE '%' || :q || '%' OR COALESCE(provider, '') ILIKE '%' || :q || '%')"
