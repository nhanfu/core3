page: { id: payment-tokens }
datasources:
  - id: accounting_payment_tokens
    single: false
    permission: accounting.read
    error_states: { transport_error: { status: 503, code: ACCOUNTING_DATA_UNAVAILABLE, message: Accounting data service is temporarily unavailable } }
    query: "WITH request_guard AS (SELECT TRUE AS ok) SELECT id, row_version, payment_details, partner, payment_method, provider, provider_reference, company, active, transaction_count FROM accounting_payment_tokens CROSS JOIN request_guard WHERE request_guard.ok AND CASE WHEN COALESCE(:fixture_state, '') = 'empty' THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR payment_details ILIKE '%' || :q || '%' OR COALESCE(partner, '') ILIKE '%' || :q || '%' OR COALESCE(payment_method, '') ILIKE '%' || :q || '%' OR COALESCE(provider, '') ILIKE '%' || :q || '%' OR COALESCE(provider_reference, '') ILIKE '%' || :q || '%') AND ((:active IS NULL AND active = TRUE) OR (:active = 'active' AND active = TRUE) OR (:active = 'archived' AND active = FALSE)) ORDER BY partner, id"
actions:
  - id: view_accounting_payment_token
    type: navigate
    permission: accounting.read
    navigate_to: /accounting/payment-token-detail
    params: { id: '{row.id}' }
  - id: archive_accounting_payment_token
    type: server
    permission: accounting.write
    action: accounting.payment_tokens.archive
    handler: yaml_mutation
    operation: update
    refresh: [accounting_payment_tokens, accounting_payment_token_detail]
    params: { values: { active: false } }
    mutation:
      operation: update
      table: accounting_payment_tokens
      fields: [active]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM accounting_payment_tokens WHERE id = :id AND active = TRUE", status: 404, code: ACCOUNTING_PAYMENT_TOKEN_NOT_FOUND, message: Active payment token not found. }
      result: { query: "SELECT * FROM accounting_payment_tokens WHERE id = :id" }
  - id: restore_accounting_payment_token
    type: server
    permission: accounting.write
    action: accounting.payment_tokens.restore
    handler: yaml_mutation
    operation: update
    refresh: [accounting_payment_tokens, accounting_payment_token_detail]
    params: { values: { active: true } }
    mutation:
      operation: update
      table: accounting_payment_tokens
      fields: [active]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM accounting_payment_tokens WHERE id = :id AND active = FALSE", status: 404, code: ACCOUNTING_PAYMENT_TOKEN_NOT_FOUND, message: Archived payment token not found. }
        - { query: "SELECT id FROM accounting_payment_tokens WHERE id = :id AND provider_active = TRUE AND payment_method_active = TRUE", status: 409, code: ACCOUNTING_PAYMENT_TOKEN_RESTORE_FORBIDDEN, message: A token linked to an inactive provider or payment method cannot be restored. }
      result: { query: "SELECT * FROM accounting_payment_tokens WHERE id = :id" }
  - id: delete_accounting_payment_token
    type: server
    permission: accounting.write
    action: accounting.payment_tokens.delete
    handler: yaml_mutation
    operation: delete
    refresh: [accounting_payment_tokens]
    mutation:
      operation: delete
      table: accounting_payment_tokens
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM accounting_payment_tokens WHERE id = :id", status: 404, code: ACCOUNTING_PAYMENT_TOKEN_NOT_FOUND, message: Payment token not found. }
