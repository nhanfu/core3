page: { id: payments }
datasources:
  - id: payment_states
    single: false
    permission: accounting.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('In Process','In Process'), ('Posted','Posted'), ('Cancelled','Cancelled')) states(value, label)"
  - id: accounting_payments
    single: false
    permission: accounting.read
    query: "SELECT id, row_version, name, partner_name, payment_type, amount, printf('%s %,.2f', currency, CAST(amount AS DOUBLE)) AS amount_display, payment_method, journal, currency, CAST(payment_date AS VARCHAR) AS payment_date, state, reference, CASE state WHEN 'Posted' THEN 'done' WHEN 'Cancelled' THEN 'overdue' WHEN 'In Process' THEN 'today' ELSE 'planned' END AS activity_state, CASE state WHEN 'Posted' THEN 'Payment posted' WHEN 'Cancelled' THEN 'Review cancelled payment' WHEN 'In Process' THEN 'Follow up payment' ELSE 'Complete payment' END AS activity_summary, CAST(payment_date AS VARCHAR) AS activity_date, partner_name AS activity_user, 1 AS activity_count FROM accounting_payments WHERE (:q IS NULL OR name ILIKE '%' || :q || '%' OR partner_name ILIKE '%' || :q || '%') AND (:state IS NULL OR state = :state) ORDER BY payment_date DESC"
actions:
  - id: view_accounting_payment
    type: navigate
    permission: accounting.read
    navigate_to: /accounting/payment-detail
    params: { id: '{row.id}' }
  - id: create_accounting_payment
    type: server_form
    permission: accounting.write
    title: New payment
    action: accounting.payments.create
    handler: yaml_mutation
    operation: create
    mutation:
      operation: insert
      table: accounting_payments
      fields: [name, partner_name, payment_type, amount, payment_method, journal, currency, payment_date, reference]
      required: [name, amount]
      defaults: { payment_type: Inbound, payment_method: Bank, state: Draft }
      guards: [{ query: "SELECT 1 AS ok WHERE CAST(:amount AS DECIMAL(18,2)) > 0", status: 400, message: Payment amount must be positive }]
      result: { query: "SELECT * FROM accounting_payments WHERE id = :id" }
    fields:
      - { field: name, label: Payment, type: text, required: true }
      - { field: partner_name, label: Partner, type: text }
      - { field: payment_type, label: Type, type: select, options: [Inbound, Outbound] }
      - { field: amount, label: Amount, type: number, required: true }
      - { field: payment_method, label: Method, type: select, options: [Bank, Cash, Card, Other] }
      - { field: journal, label: Journal, type: select, options: [Bank, Cash, Card, Miscellaneous], default: Bank }
      - { field: currency, label: Currency, type: text, default: USD }
      - { field: payment_date, label: Date, type: text }
      - { field: reference, label: Reference, type: text }
