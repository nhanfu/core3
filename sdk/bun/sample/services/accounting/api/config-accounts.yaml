page: { id: chart-of-accounts }
datasources:
  - id: accounting_chart_of_accounts
    permission: accounting.read
    query: "SELECT id, row_version, code, name, account_type, normal_balance, state FROM accounting_config_accounts WHERE (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%') ORDER BY code"
