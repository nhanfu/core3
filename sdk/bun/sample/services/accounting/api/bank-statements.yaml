page: { id: accounting-bank-statements }
datasources:
  - id: accounting_bank_statements
    single: false
    permission: accounting.read
    error_states:
      forbidden: { status: 403, code: ACCOUNTING_BANK_STATEMENTS_FORBIDDEN, message: You do not have access to bank statements. }
      transport_error: { status: 503, code: ACCOUNTING_DATA_UNAVAILABLE, message: Accounting data service is temporarily unavailable }
    query: "SELECT id, row_version, reference, date, strftime(date, '%b') || ' ' || CAST(EXTRACT(DAY FROM date) AS VARCHAR) AS date_display, strftime(date, '%b') || ' ' || CAST(EXTRACT(DAY FROM date) AS VARCHAR) AS statement_month, journal, company, currency, starting_balance, ending_balance, printf('$ %,.2f', CAST(starting_balance AS DOUBLE)) AS starting_balance_display, printf('$ %,.2f', CAST(ending_balance AS DOUBLE)) AS ending_balance_display, computed_balance, printf('$ %,.2f', CAST(computed_balance AS DOUBLE)) AS computed_balance_display, external_reference, first_line_index, line_numbers, is_complete, has_invalid_statements, is_valid, CASE WHEN is_complete THEN 'Yes' ELSE 'No' END AS is_complete_label, CASE WHEN has_invalid_statements THEN 'Yes' ELSE 'No' END AS has_invalid_statements_label, CASE WHEN is_valid THEN 'Yes' ELSE 'No' END AS is_valid_label, problem_description, attachment_name, attachment_type, attachment_size, attachment_company, attachment_created_by, attachment_created_on FROM accounting_bank_statements WHERE (:fixture_state IS NULL OR :fixture_state <> 'empty') AND (:q IS NULL OR reference ILIKE '%' || :q || '%' OR journal ILIKE '%' || :q || '%' OR company ILIKE '%' || :q || '%' OR CAST(date AS VARCHAR) ILIKE '%' || :q || '%') AND (:statement_filter IS NULL OR (:statement_filter = 'empty' AND line_numbers = '') OR (:statement_filter = 'invalid' AND is_valid = FALSE)) ORDER BY date DESC, sequence"
actions:
  - id: view_accounting_bank_statement
    type: navigate
    permission: accounting.read
    navigate_to: /accounting/bank-statement-detail
    params: { id: '{row.id}' }
