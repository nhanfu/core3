page: { id: statement-reports }
datasources:
  - id: accounting_statement_report
    single: false
    permission: accounting.read
    error_states: { transport_error: { status: 503, code: ACCOUNTING_DATA_UNAVAILABLE, message: Accounting data service is temporarily unavailable } }
    query: "WITH request_guard AS (SELECT TRUE AS ok) SELECT journal, date_from, date_to, balance, statement_balance, state FROM (VALUES ('Bank','2026-09-01','2026-09-09',6793.93,6678.00,'Needs review'), ('Cash','2026-09-01','2026-09-09',1250.00,1250.00,'Reconciled')) statements(journal,date_from,date_to,balance,statement_balance,state) CROSS JOIN request_guard WHERE request_guard.ok AND (:fixture_state IS NULL OR :fixture_state <> 'empty') AND (:q IS NULL OR journal ILIKE '%' || :q || '%' OR state ILIKE '%' || :q || '%') ORDER BY journal"
