page: { id: vendor-payments }
datasources:
  - id: vendor_payment_states
    single: false
    permission: accounting.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('In Process','In Process'), ('Paid','Paid'), ('Canceled','Canceled'), ('Rejected','Rejected')) states(value, label)"
  - id: accounting_vendor_payments
    single: false
    permission: accounting.read
    query: "SELECT id, row_version, name, partner_name, payment_type, amount, printf('$ %,.2f', CAST(amount AS DOUBLE)) AS amount_display, payment_method, journal, currency, CAST(payment_date AS VARCHAR) AS payment_date, strftime(payment_date, '%b %-d') AS payment_date_display, state, reference, CASE state WHEN 'Paid' THEN 'done' WHEN 'Canceled' THEN 'overdue' WHEN 'Rejected' THEN 'overdue' WHEN 'In Process' THEN 'today' ELSE 'planned' END AS activity_state, CASE state WHEN 'Paid' THEN 'Payment paid' WHEN 'Canceled' THEN 'Review canceled payment' WHEN 'Rejected' THEN 'Review rejected payment' WHEN 'In Process' THEN 'Follow up payment' ELSE 'Complete payment' END AS activity_summary, CAST(payment_date AS VARCHAR) AS activity_date, partner_name AS activity_user, 1 AS activity_count FROM accounting_payments WHERE payment_type = 'Outbound' AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR partner_name ILIKE '%' || :q || '%') AND (:state IS NULL OR state = :state) ORDER BY payment_date DESC"
actions:
  - id: view_accounting_vendor_payment
    type: navigate
    permission: accounting.read
    navigate_to: /accounting/vendor-payment-detail
    params: { id: '{row.id}' }
  - id: new_accounting_vendor_payment
    type: navigate
    permission: accounting.write
    navigate_to: /accounting/vendor-payments/new
