page: { id: payment-terms }
datasources:
  - id: accounting_payment_terms
    permission: accounting.read
    error_states: { transport_error: { status: 503, code: ACCOUNTING_DATA_UNAVAILABLE, message: Accounting data service is temporarily unavailable } }
    query: "WITH request_guard AS (SELECT TRUE AS ok) SELECT id, row_version, name, description, state FROM accounting_config_payment_terms CROSS JOIN request_guard WHERE request_guard.ok AND (:fixture_state IS NULL OR :fixture_state <> 'empty') AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%') ORDER BY name"
