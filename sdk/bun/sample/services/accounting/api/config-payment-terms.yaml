page: { id: payment-terms }
datasources:
  - id: accounting_payment_terms
    permission: accounting.read
    query: "SELECT id, row_version, name, description, state, company_name FROM accounting_config_payment_terms WHERE :current_company_name IS NOT NULL AND company_name = :current_company_name AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR description ILIKE '%' || :q || '%') ORDER BY name"
