title: Payment Methods
page: { id: payment-methods, route: /accounting/payment-methods, breadcrumb: [Finance, Configuration, Payment Methods], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_payment_methods
    create_action: create_accounting_payment_method
    create_label: New
    search: { label: Search payment methods, placeholder: Search methods... }
    filters: [{ field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell }
      - { field: active, label: Active, type: BooleanToggle }
      - { field: code, label: Code, optional: hide }
    page_size: 50
    responsive_card: true
    row_key: id
    row_actions: menu
    row_open_action: view_accounting_payment_method
    row_double_click_action: view_accounting_payment_method
    empty_state: { title: No payment methods found, description: Create a payment method or adjust your search. }
