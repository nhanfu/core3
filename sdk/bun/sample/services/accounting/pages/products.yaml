title: Products
page: { id: accounting-products, route: /accounting/products, breadcrumb: [Finance, Invoicing, Products], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_products
    create_action: create_accounting_product
    create_label: New
    search: { label: Search products, placeholder: 'Search products...' }
    filters:
      - { field: active, label: Active, options: [{ id: 'true', label: Active }, { id: 'false', label: Archived }] }
    view_navigation: tabs
    views:
      - id: card
        label: Kanban
        icon: dashboard
        mobile: true
        card: { title: name, subtitle: default_code, fields: [{ field: price_display, label: Price }, { field: on_hand_display, label: On hand }, { field: variant_count, label: Variants }] }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: ''
        card: { title: name, subtitle: default_code, fields: [{ field: price_display, label: Price }, { field: on_hand_display, label: On hand }, { field: variant_count, label: Variants }] }
      - { id: list, label: List, icon: table, mobile: false }
    columns:
      - { field: name, label: Product Name, type: PrimaryEntityCell }
      - { field: default_code, label: Internal Reference }
      - { field: price_display, label: Sales Price, align: right }
      - { field: on_hand_display, label: On Hand, align: right }
      - { field: variant_count, label: Variants, align: right }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    responsive_card: true
    row_actions: menu
    row_key: id
