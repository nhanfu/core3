title: Journals
page: { id: journals, route: /accounting/journals, breadcrumb: [Finance, Configuration, Journals], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_journals
    create_action: create_accounting_journal
    create_label: New
    row_open_action: view_accounting_journal
    row_double_click_action: view_accounting_journal
    row_actions: menu
    search: { label: Search journals, placeholder: Search... }
    empty_state: { title: No journals found, description: Create a journal or adjust your search. }
    columns:
      - { field: name, label: Journal Name, type: PrimaryEntityCell }
      - { field: journal_type, label: Type }
      - { field: sequence_prefix, label: Sequence Prefix }
      - { field: default_account, label: Default Account }
    page_size: 50
    responsive_card: true
    row_key: id
