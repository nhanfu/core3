title: Payment Terms
page: { id: payment-terms, route: /accounting/payment-terms, breadcrumb: [Finance, Configuration, Payment Terms], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_payment_terms
    create_action: create_accounting_payment_term
    create_label: New
    search: { label: Search payment terms, placeholder: Search payment term... }
    filters: [{ field: state, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    columns:
      - { field: name, label: Payment Terms, type: PrimaryEntityCell }
      - { field: company, label: Company }
    page_size: 50
    responsive_card: true
    row_key: id
    row_actions: menu
    row_open_action: view_accounting_payment_term
    row_double_click_action: view_accounting_payment_term
    empty_state: { title: No payment terms found, description: Create a payment term or adjust your search. }
