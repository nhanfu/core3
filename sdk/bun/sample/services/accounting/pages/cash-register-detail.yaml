title: Cash Register
page: { id: accounting-cash-register-detail, route: /accounting/cash-register-detail, breadcrumb: [Finance, Accounting, Cash Registers, Detail], auth: { require: [accounting.read] } }
components:
  - type: OdooFormView
    source: accounting_cash_register_detail
    title_field: reference
    subtitle_field: journal
    editable: true
    group_columns: 2
    groups:
      - title: Statement
        fields: [{ field: reference, label: Reference }, { field: date, label: Date, type: date }, { field: starting_balance, label: Starting Balance, type: number }, { field: ending_balance, label: Ending Balance, type: number }, { field: currency, label: Currency }]
      - title: Accounting
        fields: [{ field: company, label: Company? }, { field: journal, label: Journal }, { field: is_complete_label, label: Is Complete }, { field: is_valid_label, label: Is Valid }, { field: problem_description, label: Problem Description }]
    notebook:
      active: statement-lines
      tabs: [{ id: statement-lines, label: Statement lines, fields: [{ field: line_numbers, label: Number }] }, { id: attachments, label: Attachments, fields: [{ field: attachment_name, label: Name }, { field: attachment_type, label: Type }, { field: attachment_size, label: File Size }] }]
