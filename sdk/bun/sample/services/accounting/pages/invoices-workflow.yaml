workflow:
  id: accounting_invoices
  entity: accounting_invoices
  handler: order_transition
  initial: Draft
  permission: accounting.write
  mutable: true
  status_source: invoice_states
  states:
    - { id: Draft, label: Draft, color: neutral }
    - { id: Posted, label: Posted, color: blue }
    - { id: Paid, label: Paid, color: green, terminal: true }
    - { id: Cancelled, label: Cancelled, color: red, terminal: true }
  transitions:
    - { id: post, from: [Draft], to: Posted, permission: accounting.write }
    - id: reset_to_draft
      from: [Posted, Cancelled]
      to: Draft
      permission: accounting.write
      mutation:
        guards:
          - query: "SELECT id FROM accounting_invoices WHERE id = :id AND state IN ('Posted', 'Cancelled') AND COALESCE(locked, FALSE) = FALSE AND row_version = :expected_row_version"
            status: 409
            code: ACCOUNTING_INVOICE_RESET_UNAVAILABLE
            message: Only an unchanged, unlocked posted or cancelled invoice can be reset to draft. Reload before resetting.
        steps:
          - query: "UPDATE accounting_invoices SET state = 'Draft', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version AND COALESCE(locked, FALSE) = FALSE"
            expect_changed: true
            status: 409
            code: ACCOUNTING_INVOICE_RESET_STALE
            message: The invoice changed; reload before resetting to draft.
        result:
          query: "SELECT * FROM accounting_invoices WHERE id = :id"
    - id: cancel
      from: [Draft]
      to: Cancelled
      permission: accounting.write
      mutation:
        concurrency: { required: true }
        guards:
          - query: "SELECT id FROM accounting_invoices WHERE id = :id AND state = 'Draft' AND row_version = :expected_row_version"
            status: 409
            code: ACCOUNTING_INVOICE_CANCEL_UNAVAILABLE
            message: Only an unchanged draft invoice can be cancelled. Reload before cancelling.
        steps:
          - query: "UPDATE accounting_invoices SET state = 'Cancelled', row_version = row_version + 1 WHERE id = :id AND state = 'Draft' AND row_version = :expected_row_version"
            expect_changed: true
            status: 409
            code: ACCOUNTING_INVOICE_CANCEL_STALE
            message: The invoice changed; reload before cancelling.
        result:
          query: "SELECT * FROM accounting_invoices WHERE id = :id"
