title: Taxes and Fiscal Reports
page: { id: tax-reports, route: /accounting/reports/taxes, breadcrumb: [Finance, Reporting, Taxes and Fiscal], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_tax_report
    search: { label: Search taxes and fiscal reports, placeholder: Search taxes or scope... }
    empty_state: { title: No records found, description: Try adjusting your search or filters. }
    columns: [{ field: tax, label: Tax, type: PrimaryEntityCell }, { field: scope, label: Scope }, { field: base_amount, label: Tax base, align: right }, { field: tax_amount, label: Tax amount, align: right }]
    row_key: tax
