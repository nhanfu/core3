title: Payment
page: { id: payment-detail, route: /accounting/payment-detail, breadcrumb: [Finance, Accounting, Payments, Detail], auth: { require: [accounting.read] } }
components:
  - type: OdooFormView
    source: accounting_payment_detail
    title_field: name
    status_field: state
    statusbar:
      - { value: Draft, label: Draft }
      - { value: In Process, label: In Process }
      - { value: Posted, label: Posted }
      - { value: Cancelled, label: Cancelled }
    status_colors: { Draft: neutral, In Process: blue, Posted: green, Cancelled: red }
    editable: false
    header_actions:
      - { id: send_accounting_payment_receipt, label: Send receipt by email, variant: secondary, permission: accounting.write, show_if: "state.accounting_payment_detail.state === 'Posted' || state.accounting_payment_detail.state === 'Paid' || state.accounting_payment_detail.state === 'In Process'" }
    group_columns: 2
    groups:
      - title: Payment
        fields:
          - { field: name, label: Payment }
          - { field: state, label: Status }
          - { field: payment_type, label: Payment Type }
          - { field: partner_name, label: Customer or vendor }
          - { field: reference, label: Memo }
      - title: Payment information
        fields:
          - { field: payment_date, label: Date }
          - { field: journal, label: Journal }
          - { field: payment_method, label: Payment Method }
          - { field: amount, label: Amount }
          - { field: currency, label: Currency }
          - { field: receipt_count, label: Receipts sent }
          - { field: last_receipt_sent_at, label: Last receipt sent }
    notebook:
      active: other-info
      tabs:
        - id: other-info
          label: Other Info
          fields:
            - { field: reference, label: Memo }
            - { field: payment_type, label: Payment Type }
            - { field: currency, label: Currency }
            - { field: receipt_count, label: Receipts sent }
            - { field: last_receipt_sent_at, label: Last receipt sent }
    message_source: accounting_payment_receipts
    chatter_label: Payment receipts
    chatter_empty: No payment receipts sent yet.
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
