title: Partner Reports
page: { id: partner-reports, route: /accounting/reports/partner, breadcrumb: [Finance, Reporting, Partner Reports], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_partner_report
    search: { label: Search partner reports, placeholder: Search partners... }
    empty_state: { title: No records found, description: Try adjusting your search or filters. }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields: [{ field: partner_name, column: Partner }, { field: document_count, column: Documents }, { field: total, column: Total }, { field: due, column: Due }]
          default: { rows: [partner_name], measures: [{ field: total, aggregate: sum, column: Total }, { field: due, aggregate: sum, column: Due }] }
    columns: [{ field: partner_name, label: Partner, type: PrimaryEntityCell }, { field: document_count, label: Documents, align: right }, { field: total, label: Total, align: right }, { field: due, label: Due, align: right }]
    page_size: 50
    row_key: partner_name
