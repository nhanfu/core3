title: Payments
page: { id: payments, route: /accounting/payments, breadcrumb: [Finance, Accounting, Payments], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_payments
    create_action: create_accounting_payment
    create_label: New payment
    search: { label: Search payments, placeholder: Search payments or customers... }
    columns:
      - { field: name, label: Payment, type: PrimaryEntityCell }
      - { field: partner_name, label: Partner }
      - { field: payment_type, label: Type }
      - { field: amount, label: Amount, align: right }
      - { field: payment_method, label: Method }
      - { field: payment_date, label: Date }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
