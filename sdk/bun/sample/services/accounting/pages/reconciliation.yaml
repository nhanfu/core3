title: Reconciliation
page: { id: reconciliation, route: /accounting/reconciliation, breadcrumb: [Finance, Accounting, Reconciliation], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_reconciliation
    search: { label: Search reconciliation, placeholder: Search invoices or partners... }
    empty_state: { title: No invoices to reconcile, description: Posted invoices with an outstanding balance will appear here. }
    columns:
      - { field: name, label: Invoice, type: PrimaryEntityCell }
      - { field: partner_name, label: Partner }
      - { field: invoice_date, label: Date }
      - { field: amount_total, label: Total, align: right }
      - { field: amount_residual, label: To reconcile, align: right }
      - { field: state, label: Status, type: StatusChip }
      - { field: row_actions, label: '', sortable: false, actions: [{ id: reconcile_invoice, label: Register payment, permission: accounting.write }] }
    row_key: id
    row_double_click_action: view_reconciliation_invoice
    row_actions: menu
