title: Payment Transactions
page: { id: payment-transactions, route: /accounting/payment-transactions, breadcrumb: [Finance, Configuration, Payment Transactions], auth: { require: [accounting.read] } }
datasources:
  - id: accounting_payment_transactions
    permission: accounting.read
    query: "SELECT name, partner_name, amount, payment_method, state, reference FROM accounting_payments ORDER BY payment_date DESC"
components:
  - type: ListView
    variant: odoo
    source: accounting_payment_transactions
    search: { label: Search transactions, placeholder: Search transactions... }
    columns: [{ field: name, label: Transaction, type: PrimaryEntityCell }, { field: partner_name, label: Partner }, { field: amount, label: Amount, align: right }, { field: payment_method, label: Method }, { field: state, label: State, type: StatusChip }, { field: reference, label: Reference }]
    row_key: name
