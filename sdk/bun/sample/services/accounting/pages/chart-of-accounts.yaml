title: Chart of Accounts
page: { id: chart-of-accounts, route: /accounting/chart-of-accounts, breadcrumb: [Finance, Accounting, Chart of Accounts], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_chart_of_accounts
    create_action: create_accounting_account
    create_label: New
    search: { label: Search accounts, placeholder: Search account code or name... }
    empty_state: { title: No accounts found, description: Create an account or adjust your search. }
    columns:
      - { field: code, label: Code, type: PrimaryEntityCell }
      - { field: name, label: Account }
      - { field: account_type, label: Type }
      - { field: normal_balance, label: Balance }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
actions:
  - id: create_accounting_account
    type: server_form
    permission: accounting.write
    title: New Account
    action: accounting.accounts.create
    handler: yaml_mutation
    operation: create
    refresh: [accounting_chart_of_accounts]
    mutation: { operation: insert, table: accounting_config_accounts, fields: [code, name, account_type, normal_balance, state], required: [code, name, account_type, normal_balance], defaults: { state: Active }, result: { query: "SELECT * FROM accounting_config_accounts WHERE id = :id" } }
    fields: [{ field: code, label: Code, type: text, required: true }, { field: name, label: Account, type: text, required: true }, { field: account_type, label: Type, type: select, options: [{ value: Assets, label: Assets }, { value: Liabilities, label: Liabilities }, { value: Income, label: Income }, { value: Expenses, label: Expenses }] }, { field: normal_balance, label: Balance, type: select, options: [{ value: Debit, label: Debit }, { value: Credit, label: Credit }] }, { field: state, label: Status, type: select, options: [{ value: Active, label: Active }, { value: Archived, label: Archived }] }]
