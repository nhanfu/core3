title: Invoices
page: { id: invoices, breadcrumb: [Finance, Invoices], auth: { require: [accounting.read] } }
datasources:
  - id: invoice_states
    single: false
    permission: accounting.read
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Posted','Posted'), ('Paid','Paid'), ('Cancelled','Cancelled')) states(value, label)"
  - id: accounting_invoices
    single: false
    permission: accounting.read
    workflow: accounting_invoices
    query: "SELECT id, row_version, name, partner_name, invoice_type, CAST(invoice_date AS VARCHAR) AS invoice_date, CAST(due_date AS VARCHAR) AS due_date, amount_untaxed, amount_tax, amount_total, amount_residual, state, reference, source_service, source_type, source_id FROM accounting_invoices WHERE (:q IS NULL OR name ILIKE '%' || :q || '%' OR partner_name ILIKE '%' || :q || '%') AND (:state IS NULL OR state = :state) ORDER BY invoice_date DESC"
components:
  - type: ListView
    variant: odoo
    source: accounting_invoices
    create_action: create_accounting_invoice
    create_label: New invoice
    search: { label: Search invoices, placeholder: Search invoices and customers... }
    filters: [{ field: state, label: Status, options_source: invoice_states }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: state
        groups_source: invoice_states
        card: { title: name, subtitle: partner_name, fields: [{ field: amount_total, label: Total }, { field: amount_residual, label: Due }, { field: state, label: Status }] }
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields: [{ field: state, column: Status }, { field: invoice_type, column: Type }, { field: invoice_date, column: Date, type: date }, { field: amount_total, column: Total }, { field: amount_residual, column: Due }]
          default: { rows: [state], columns: [invoice_type], measures: [{ field: amount_total, aggregate: sum, column: Total }, { field: amount_residual, aggregate: sum, column: Due }] }
          date_ranges: { invoice_date: month }
    columns:
      - { field: name, label: Invoice, type: PrimaryEntityCell }
      - { field: partner_name, label: Customer }
      - { field: invoice_type, label: Type }
      - { field: invoice_date, label: Invoice date }
      - { field: due_date, label: Due date }
      - { field: amount_total, label: Total, align: right }
      - { field: amount_residual, label: Due, align: right }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    actions:
      - { id: post_accounting_invoice, label: Post, permission: accounting.write, variant: primary, show_if: "row.state === 'Draft'" }
      - { id: register_invoice_payment, label: Register payment, permission: accounting.write, variant: secondary, show_if: "row.state === 'Posted' && row.amount_residual > 0" }
      - { id: cancel_accounting_invoice, label: Cancel, permission: accounting.write, variant: danger, show_if: "row.state !== 'Paid' && row.state !== 'Cancelled'" }
actions:
  - id: create_accounting_invoice
    type: server_form
    permission: accounting.write
    title: New invoice
    action: accounting.invoices.create
    handler: yaml_mutation
    operation: create
    mutation:
      operation: insert
      table: accounting_invoices
      fields: [name, partner_name, invoice_type, invoice_date, due_date, amount_untaxed, amount_tax, amount_total, amount_residual, reference]
      required: [name]
      defaults: { invoice_type: Customer Invoice, amount_untaxed: 0, amount_tax: 0, amount_total: 0, amount_residual: 0, state: Draft }
      result: { query: "SELECT * FROM accounting_invoices WHERE id = :id" }
    fields:
      - { field: name, label: Invoice, type: text, required: true }
      - { field: partner_name, label: Customer, type: text }
      - { field: invoice_type, label: Type, type: select, options: [Customer Invoice, Vendor Bill, Customer Credit Note, Vendor Refund] }
      - { field: invoice_date, label: Invoice date, type: text }
      - { field: due_date, label: Due date, type: text }
      - { field: amount_total, label: Total, type: number }
      - { field: reference, label: Reference, type: text }
  - id: create_accounting_invoice_from_source
    type: server
    permission: accounting.write
    action: accounting.invoices.create_from_source
    handler: yaml_mutation
    operation: create_from_source
    mutation:
      operation: insert
      table: accounting_invoices
      fields: [name, partner_name, invoice_type, invoice_date, due_date, amount_untaxed, amount_tax, amount_total, amount_residual, reference, source_service, source_type, source_id]
      required: [name, source_service, source_type, source_id]
      defaults: { invoice_type: Customer Invoice, amount_untaxed: 0, amount_tax: 0, amount_total: 0, amount_residual: 0, state: Draft }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM accounting_invoices WHERE source_service = :source_service AND source_type = :source_type AND source_id = :source_id)"
          status: 409
          message: An invoice already exists for this source record
      result: { query: "SELECT id AS accounting_invoice_id, name, state, amount_total, source_service, source_type, source_id FROM accounting_invoices WHERE id = :id" }
  - { id: post_accounting_invoice, type: server, permission: accounting.write, action: accounting.invoices.post, handler: order_transition, workflow: accounting_invoices, operation: post, refresh: [accounting_invoices] }
  - { id: register_invoice_payment, type: server_form, permission: accounting.write, title: Register invoice payment, action: accounting.invoices.pay, handler: yaml_mutation, operation: pay, refresh: [accounting_invoices], mutation: { generated: [payment_id], guards: [{ query: "SELECT id FROM accounting_invoices WHERE id = :id AND state = 'Posted' AND amount_residual > 0", status: 409, message: Only posted invoices with a balance can be paid }], steps: ["UPDATE accounting_invoices SET amount_residual = 0, state = 'Paid', row_version = row_version + 1 WHERE id = :id"], result: { query: "SELECT * FROM accounting_invoices WHERE id = :id" } }, fields: [{ field: payment_amount, label: Payment amount, type: number, required: true }] }
  - { id: cancel_accounting_invoice, type: server, permission: accounting.write, action: accounting.invoices.cancel, handler: order_transition, workflow: accounting_invoices, operation: cancel, refresh: [accounting_invoices] }
