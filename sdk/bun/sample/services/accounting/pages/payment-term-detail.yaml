title: Payment Term
page: { id: payment-term-detail, route: /accounting/payment-term-detail, breadcrumb: [Finance, Configuration, Payment Terms, Detail], auth: { require: [accounting.read] } }
components:
  - type: OdooFormView
    source: accounting_payment_term_detail
    title_field: name
    status_field: state
    status_badges: [{ value: Active, label: Active, tone: green }, { value: Archived, label: Archived, tone: neutral }]
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit }
    header_actions:
      - { id: edit_accounting_payment_term, label: Edit, variant: secondary, permission: accounting.write }
      - { id: archive_accounting_payment_term, label: Archive, variant: secondary, permission: accounting.write, show_if: "state.accounting_payment_term_detail.state === 'Active'" }
      - { id: restore_accounting_payment_term, label: Restore, variant: secondary, permission: accounting.write, show_if: "state.accounting_payment_term_detail.state === 'Archived'" }
      - { id: delete_accounting_payment_term, label: Delete, variant: danger, permission: accounting.write }
    group_columns: 2
    groups:
      - title: Payment Terms
        fields:
          - { field: name, label: Payment Terms }
          - { field: company, label: Company }
          - { field: description, label: Due Rule }
          - { field: early_discount, label: Early Discount }
          - { field: state, label: Status }
