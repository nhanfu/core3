title: Invoice
page: { id: invoice-detail, route: /accounting/invoice-detail, breadcrumb: [Finance, Invoices, Detail], auth: { require: [accounting.read] } }
components:
  - type: OdooFormView
    source: accounting_invoice_detail
    title_field: name
    status_field: state
    statusbar:
      - { value: Draft, label: Draft }
      - { value: Posted, label: Posted }
      - { value: Paid, label: Paid }
      - { value: Cancelled, label: Cancelled }
    status_colors: { Draft: neutral, Posted: blue, Paid: green, Cancelled: red }
    editable: true
    header_actions:
      - { id: edit_accounting_invoice, label: Edit, variant: secondary, permission: accounting.write, show_if: "state.accounting_invoice_detail.state === 'Draft'" }
      - { id: post_accounting_invoice_detail, label: Post, variant: primary, permission: accounting.write, show_if: "state.accounting_invoice_detail.state === 'Draft'" }
      - { id: register_accounting_invoice_payment, label: Register payment, variant: secondary, permission: accounting.write, show_if: "state.accounting_invoice_detail.state === 'Posted' && state.accounting_invoice_detail.amount_residual > 0" }
      - { id: reverse_accounting_invoice, label: Credit Note, variant: secondary, permission: accounting.write, show_if: "state.accounting_invoice_detail.state === 'Posted' && (state.accounting_invoice_detail.invoice_type === 'Customer Invoice' || state.accounting_invoice_detail.invoice_type === 'Vendor Bill') && !state.accounting_invoice_detail.reversal_id" }
      - { id: send_accounting_invoice, label: Send, variant: primary, permission: accounting.write, show_if: "state.accounting_invoice_detail.state === 'Posted' && state.accounting_invoice_detail.invoice_type !== 'Journal Entry'" }
      - { id: download_accounting_invoice_pdf, label: Print, variant: secondary, permission: accounting.read, show_if: "state.accounting_invoice_detail.state === 'Posted' && (state.accounting_invoice_detail.invoice_type === 'Customer Invoice' || state.accounting_invoice_detail.invoice_type === 'Customer Credit Note')" }
    group_columns: 2
    groups:
      - title: Invoice
        fields:
          - { field: name, label: Invoice }
          - { field: state, label: Status }
          - { field: invoice_type, label: Type }
          - field: partner_name
            label: Customer or vendor
            type: select
            options: [Azure Interior, Deco Addict, Gemini Furniture, Lumber Inc, Ready Mat, Wood Corner]
          - { field: reference, label: Reference }
      - title: Dates and amounts
        fields:
          - { field: invoice_date, label: Invoice date }
          - { field: due_date, label: Due date }
          - { field: amount_untaxed, label: Untaxed amount }
          - { field: amount_tax, label: Tax }
          - { field: amount_total, label: Total }
          - { field: amount_residual, label: Amount due }
      - title: Source link
        fields:
          - { field: source_service, label: Source service }
          - { field: source_type, label: Source type }
          - { field: source_id, label: Source record }
          - { field: reversal_id, label: Credit note }
          - { field: reversal_of_id, label: Reversal of }
          - { field: reversal_reason, label: Reversal reason }
          - { field: send_count, label: Times sent }
          - { field: last_sent_at, label: Last sent }
    notebook:
      active: invoice-lines
      tabs:
        - id: invoice-lines
          label: Invoice Lines
          fields:
            - { field: line_count, label: Lines }
            - { field: line_summary, label: Description }
            - { field: amount_untaxed, label: Untaxed amount }
            - { field: amount_tax, label: Tax }
            - { field: amount_total, label: Total }
        - id: other-info
          label: Other Info
          fields:
            - { field: invoice_date, label: Invoice date }
            - { field: due_date, label: Due date }
            - { field: source_service, label: Source service }
            - { field: source_type, label: Source type }
            - { field: source_id, label: Source record }
            - { field: reversal_id, label: Credit note }
            - { field: reversal_of_id, label: Reversal of }
            - { field: reversal_reason, label: Reversal reason }
            - { field: send_count, label: Times sent }
            - { field: last_sent_at, label: Last sent }
    message_source: accounting_invoice_messages
    chatter_label: Messages and activities
    chatter_empty: No messages or activities yet.
    message_label: Send message
    note_label: Log note
    activity_label: Activity
    message_action: send_accounting_invoice_message
    note_action: log_accounting_invoice_note
    activity_action: schedule_accounting_invoice_activity
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
