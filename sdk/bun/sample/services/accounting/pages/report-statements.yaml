title: Statement Reports
page: { id: statement-reports, route: /accounting/reports/statements, breadcrumb: [Finance, Reporting, Statement Reports], auth: { require: [accounting.read] } }
components:
  - type: ListView
    variant: odoo
    source: accounting_statement_report
    search: { label: Search statement reports, placeholder: Search journals or state... }
    empty_state: { title: No records found, description: Try adjusting your search or filters. }
    columns: [{ field: journal, label: Journal, type: PrimaryEntityCell }, { field: date_from, label: From }, { field: date_to, label: To }, { field: balance, label: Balance, align: right }, { field: statement_balance, label: Statement balance, align: right }, { field: state, label: State, type: StatusChip }]
    row_key: journal
