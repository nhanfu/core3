database: duckdb

files:
  driver: local
  path: ${ACCOUNTING_UPLOAD_ROOT:-.data/accounting-uploads}
  credentials: {}

attachments:
  accounting_bank_statement_attachment:
    download:
      route: /api/accounting/bank-statement-attachments
      permission: accounting.read
      query: SELECT id, attachment_name AS file_name, attachment_type AS mime_type, storage_key FROM accounting_bank_statements WHERE id = :attachment_id AND (COALESCE(:current_company_name, '') = '' OR company = :current_company_name) AND attachment_name IS NOT NULL
  accounting_invoice_pdf:
    download:
      route: /api/accounting/invoice-pdfs
      permission: accounting.read
      query: "SELECT id, replace(name, '/', '_') || '.pdf' AS file_name, 'application/pdf' AS mime_type, COALESCE(NULLIF(pdf_content_base64, ''), '') AS content_base64 FROM accounting_invoices WHERE id = :attachment_id AND state = 'Posted' AND invoice_type IN ('Customer Invoice', 'Customer Credit Note')"
