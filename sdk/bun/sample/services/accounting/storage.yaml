database: duckdb

files:
  driver: local
  path: ${ACCOUNTING_UPLOAD_ROOT:-.data/accounting-uploads}
  credentials: {}

attachments:
  accounting_bank_statement_attachment:
    download:
      route: /api/accounting/bank-statement-attachments
      permission: accounting.read
      query: SELECT id, attachment_name AS file_name, attachment_type AS mime_type, storage_key FROM accounting_bank_statements WHERE id = :attachment_id AND attachment_name IS NOT NULL
