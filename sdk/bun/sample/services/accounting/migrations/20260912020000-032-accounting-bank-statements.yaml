      CREATE TABLE IF NOT EXISTS accounting_bank_statements (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        sequence INTEGER NOT NULL DEFAULT 10,
        reference VARCHAR NOT NULL,
        date DATE NOT NULL,
        journal VARCHAR NOT NULL,
        company VARCHAR NOT NULL,
        currency VARCHAR NOT NULL DEFAULT 'USD',
        starting_balance DECIMAL(18, 2) NOT NULL DEFAULT 0,
        ending_balance DECIMAL(18, 2) NOT NULL DEFAULT 0,
        computed_balance DECIMAL(18, 2) NOT NULL DEFAULT 0,
        external_reference VARCHAR,
        first_line_index VARCHAR,
        line_numbers VARCHAR NOT NULL DEFAULT '',
        is_complete BOOLEAN NOT NULL DEFAULT TRUE,
        has_invalid_statements BOOLEAN NOT NULL DEFAULT FALSE,
        is_valid BOOLEAN NOT NULL DEFAULT TRUE,
        problem_description VARCHAR NOT NULL DEFAULT '',
        attachment_name VARCHAR,
        attachment_type VARCHAR,
        attachment_size VARCHAR,
        attachment_company VARCHAR,
        attachment_created_by VARCHAR,
        attachment_created_on VARCHAR
      );
