version: 0.0.7
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS accounting_products (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        default_code VARCHAR, name VARCHAR NOT NULL, product_type VARCHAR NOT NULL,
        price DECIMAL(18,2) NOT NULL DEFAULT 0, cost DECIMAL(18,2) NOT NULL DEFAULT 0,
        on_hand DECIMAL(18,2) NOT NULL DEFAULT 0, variant_count INTEGER NOT NULL DEFAULT 0,
        active BOOLEAN NOT NULL DEFAULT true
      );
      CREATE TABLE IF NOT EXISTS accounting_analytic_items (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        item_date DATE NOT NULL, account_name VARCHAR NOT NULL, partner_name VARCHAR,
        product_name VARCHAR, company_name VARCHAR NOT NULL, amount DECIMAL(18,2) NOT NULL,
        description VARCHAR NOT NULL
      );
      CREATE TABLE IF NOT EXISTS accounting_analytic_distribution_models (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        account_prefixes VARCHAR, partner_name VARCHAR, product_name VARCHAR,
        company_name VARCHAR NOT NULL, distribution VARCHAR NOT NULL, active BOOLEAN NOT NULL DEFAULT true
      );
