version: 0.0.28
description: Accounting Odoo payment token catalog fixtures
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS accounting_payment_tokens (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        payment_details VARCHAR NOT NULL,
        partner VARCHAR NOT NULL,
        payment_method VARCHAR NOT NULL,
        provider VARCHAR NOT NULL,
        provider_reference VARCHAR NOT NULL,
        company VARCHAR NOT NULL DEFAULT 'My Company (San Francisco)',
        active BOOLEAN NOT NULL DEFAULT TRUE,
        transaction_count INTEGER NOT NULL DEFAULT 0,
        provider_active BOOLEAN NOT NULL DEFAULT TRUE,
        payment_method_active BOOLEAN NOT NULL DEFAULT TRUE
      );
