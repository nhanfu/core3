        ('payment-term-45-days', 1, '45 Days', 'My Company (San Francisco)', '45 days after invoice date', FALSE, 'Active', 50),
        ('payment-term-end-following-month', 1, 'End of Following Month', 'My Company (San Francisco)', 'Due at the end of the following month', FALSE, 'Active', 60),
