version: 0.0.8
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS accounting_journal_items (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        item_date DATE NOT NULL, entry_name VARCHAR NOT NULL, partner_name VARCHAR,
        label VARCHAR NOT NULL, debit DECIMAL(18,2) NOT NULL DEFAULT 0,
        credit DECIMAL(18,2) NOT NULL DEFAULT 0, matching VARCHAR
      );
      CREATE TABLE IF NOT EXISTS accounting_audit_trail (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        event_date TIMESTAMP NOT NULL, author_name VARCHAR NOT NULL,
        record_name VARCHAR NOT NULL, description VARCHAR NOT NULL
      );
      CREATE TABLE IF NOT EXISTS accounting_incoterms (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1,
        code VARCHAR NOT NULL UNIQUE, name VARCHAR NOT NULL, active BOOLEAN NOT NULL DEFAULT true
      );
      INSERT OR IGNORE INTO accounting_journal_items VALUES
