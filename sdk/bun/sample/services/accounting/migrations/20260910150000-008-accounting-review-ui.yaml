        ('acct-item-004',1,DATE '2026-01-14','BILL/2026/0002','Azure Interior','Account Payable',0,480.00,'');
      INSERT OR IGNORE INTO accounting_audit_trail VALUES
        ('acct-audit-001',1,TIMESTAMP '2026-01-15 09:10:00','OdooBot','INV/2026/0001','Journal Entry created'),
        ('acct-audit-002',1,TIMESTAMP '2026-01-15 09:11:00','OdooBot','INV/2026/0001','Journal Entry posted'),
        ('acct-audit-003',1,TIMESTAMP '2026-01-14 14:20:00','OdooBot','BILL/2026/0002','Journal Entry created');
      INSERT OR IGNORE INTO accounting_incoterms VALUES
        ('incoterm-exw',1,'EXW','EX WORKS',true),('incoterm-fca',1,'FCA','FREE CARRIER',true),
        ('incoterm-fas',1,'FAS','FREE ALONGSIDE SHIP',true),('incoterm-fob',1,'FOB','FREE ON BOARD',true),
        ('incoterm-cfr',1,'CFR','COST AND FREIGHT',true),('incoterm-cif',1,'CIF','COST, INSURANCE AND FREIGHT',true),
        ('incoterm-cpt',1,'CPT','CARRIAGE PAID TO',true),('incoterm-cip',1,'CIP','CARRIAGE AND INSURANCE PAID TO',true),
        ('incoterm-dpu',1,'DPU','DELIVERED AT PLACE UNLOADED',true),('incoterm-dap',1,'DAP','DELIVERED AT PLACE',true),
        ('incoterm-ddp',1,'DDP','DELIVERED DUTY PAID',true);
    down: |
      DROP TABLE IF EXISTS accounting_incoterms;
      DROP TABLE IF EXISTS accounting_audit_trail;
      DROP TABLE IF EXISTS accounting_journal_items;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
