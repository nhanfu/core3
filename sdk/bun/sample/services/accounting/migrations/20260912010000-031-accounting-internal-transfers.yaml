version: 0.0.31
kind: data
description: Add deterministic Internal Transfers payment action fixtures
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS accounting_internal_transfers (
        id VARCHAR PRIMARY KEY, row_version BIGINT NOT NULL DEFAULT 1, name VARCHAR NOT NULL,
        partner_name VARCHAR NOT NULL, payment_type VARCHAR NOT NULL DEFAULT 'Outbound',
        amount DECIMAL(18,2) NOT NULL, journal VARCHAR NOT NULL, destination_journal VARCHAR NOT NULL,
        payment_method VARCHAR NOT NULL, currency VARCHAR NOT NULL DEFAULT 'USD',
        payment_date DATE NOT NULL, reference VARCHAR NOT NULL DEFAULT '', state VARCHAR NOT NULL DEFAULT 'Draft'
      );
      CREATE TABLE IF NOT EXISTS accounting_internal_transfer_messages (
        id VARCHAR PRIMARY KEY, payment_id VARCHAR NOT NULL, actor_name VARCHAR NOT NULL,
        action VARCHAR NOT NULL, action_label VARCHAR NOT NULL, detail VARCHAR NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
