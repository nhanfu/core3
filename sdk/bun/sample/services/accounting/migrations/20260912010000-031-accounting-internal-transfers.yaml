        ('accounting-internal-transfer-002', 1, 'BNK1/2026/00002', 'Azure Interior', 'Outbound', 875.50, 'Cash', 'Bank', 'Check', 'USD', DATE '2026-02-03', 'Petty cash replenishment', 'In Process'),
        ('accounting-internal-transfer-003', 1, 'BNK1/2026/00003', 'Gemini Furniture', 'Outbound', 4300.00, 'Bank', 'Miscellaneous', 'Manual Payment', 'USD', DATE '2026-03-12', 'Project float', 'Paid'),
        ('accounting-internal-transfer-004', 1, 'BNK1/2026/00004', 'Lumber Inc', 'Outbound', 1100.00, 'Miscellaneous', 'Bank', 'Card', 'USD', DATE '2026-04-18', 'Returned transfer', 'Canceled')
