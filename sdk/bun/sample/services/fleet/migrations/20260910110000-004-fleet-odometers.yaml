version: 0.0.4
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS fleet_vehicle_odometers (
        id VARCHAR PRIMARY KEY,
        vehicle_id VARCHAR NOT NULL,
        driver_name VARCHAR,
        date DATE NOT NULL,
        value DECIMAL(18,2) NOT NULL,
        unit VARCHAR NOT NULL DEFAULT 'km',
        row_version BIGINT NOT NULL DEFAULT 1
      );
      CREATE INDEX IF NOT EXISTS fleet_vehicle_odometers_date_idx ON fleet_vehicle_odometers(date, id);
      CREATE INDEX IF NOT EXISTS fleet_vehicle_odometers_vehicle_idx ON fleet_vehicle_odometers(vehicle_id, date);
