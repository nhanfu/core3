      CREATE TABLE IF NOT EXISTS fleet_contract_activities (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        contract_id VARCHAR NOT NULL,
        activity_type VARCHAR NOT NULL DEFAULT 'Contract to Renew',
        summary VARCHAR NOT NULL,
        due_date DATE NOT NULL,
        assigned_user VARCHAR NOT NULL,
        note VARCHAR NOT NULL DEFAULT '',
        state VARCHAR NOT NULL DEFAULT 'Planned',
        created_by VARCHAR NOT NULL,
        action VARCHAR NOT NULL DEFAULT 'fleet.contract.activity.schedule',
