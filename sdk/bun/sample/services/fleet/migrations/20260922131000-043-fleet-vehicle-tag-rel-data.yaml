    up: |
      INSERT INTO fleet_vehicle_tag_rel(vehicle_id, tag_id)
      VALUES
        ('fleet-demo-001', 'fleet-tag-003'),
        ('fleet-demo-001', 'fleet-tag-004'),
        ('fleet-demo-002', 'fleet-tag-003')
      ON CONFLICT (vehicle_id, tag_id) DO NOTHING;
