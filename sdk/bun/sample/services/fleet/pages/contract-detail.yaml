title: Contract
page: { id: contract-detail, route: /fleet/contracts/detail, breadcrumb: [Human Resources, Fleet, Contracts, Detail], auth: { require: [fleet.read] } }
components:
  - type: OdooFormView
    source: fleet_contract_detail
    message_source: fleet_contract_activities
    activity_action: schedule_fleet_contract_activity
    activity_label: Schedule renewal activity
    schedule_label: Schedule
    activity_placeholder: Describe the renewal activity…
    activity_complete_action: complete_fleet_contract_activity
    activity_complete_label: Mark done
    message_action_field: action_label
    message_action_labels: { fleet.contract.activity.schedule: Scheduled activity, fleet.contract.activity.complete: Completed activity }
    chatter_label: Messages and activities
    chatter_empty: No contract messages or activities yet.
    title_field: name
    subtitle_field: vehicle_name
    status_field: status
    status_colors: { New: neutral, Running: green, 'To Renew': amber, Expired: red, Closed: neutral }
    statusbar: [{ value: New, label: New }, { value: Running, label: Running }, { value: 'To Renew', label: To Renew }, { value: Expired, label: Expired }, { value: Closed, label: Cancelled }]
    statusbar_actions: { New: set_fleet_contract_new, Running: set_fleet_contract_running, Expired: expire_fleet_contract, Closed: close_fleet_contract }
    status_badges: [{ value: New, label: New, tone: neutral }, { value: Running, label: Running, tone: green }, { value: 'To Renew', label: To Renew, tone: amber }, { value: Expired, label: Expired, tone: red }, { value: Closed, label: Cancelled, tone: neutral }]
    editable: true
    group_columns: 2
    header_actions:
      - { id: edit_fleet_contract, label: Edit, variant: secondary, permission: fleet.write }
      - { id: renew_fleet_contract, label: Renew Contract, variant: primary, permission: fleet.write, show_if: "record.status !== 'Closed'" }
      - { id: archive_fleet_contract, label: Archive, variant: danger, permission: fleet.write, show_if: "state.fleet_contract_detail.active === true" }
      - { id: restore_fleet_contract, label: Restore, variant: secondary, permission: fleet.write, show_if: "state.fleet_contract_detail.active === false" }
      - { id: set_fleet_contract_new, label: New, variant: secondary, permission: fleet.write, show_if: "record.status !== 'New' && record.status !== 'Closed'" }
      - { id: set_fleet_contract_running, label: Set Running, variant: primary, permission: fleet.write, show_if: "record.status !== 'Running' && record.status !== 'Closed'" }
      - { id: expire_fleet_contract, label: Expire, variant: secondary, permission: fleet.write, show_if: "record.status !== 'Expired' && record.status !== 'Closed'" }
      - { id: close_fleet_contract, label: Cancel, variant: danger, permission: fleet.write, show_if: "record.status !== 'Closed'" }
    action_menu:
      label: Actions
      aria_label: Contract actions
      actions:
        - { id: delete_fleet_contract, label: Delete, icon: trash, variant: danger, permission: fleet.write }
    groups:
      - title: Contract
        fields: [{ field: vehicle_name, label: Vehicle }, { field: vendor, label: Vendor }, { field: driver_name, label: Driver }, { field: contract_type, label: Contract Type }, { field: status, label: Status }, { field: renewal_status, label: Renewal Alert }, { field: active_label, label: Record }]
      - title: Dates and Costs
        fields: [{ field: start_date, label: Contract Start Date }, { field: expiration_date, label: Contract Expiration Date }, { field: recurring_cost, label: Recurring Cost, type: money }, { field: recurring_cost_frequency, label: Recurring Cost Frequency }, { field: cost_generated, label: Generated Costs, type: money }]
    notebook:
      active: information
      tabs:
        - { id: information, label: Information, content_slot: true }
        - id: recurrence
          label: Costs & Recurrence
          fields: [{ field: recurring_cost, label: Recurring Cost, type: money }, { field: recurring_cost_frequency, label: Recurring Cost Frequency }, { field: cost_generated, label: Generated Costs, type: money }, { field: renewal_status, label: Renewal Alert }]
        - id: notes
          label: Notes
          fields: [{ field: notes, label: Notes, type: textarea, wide: true }]
