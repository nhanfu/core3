title: Fleet Vehicle
page: { id: vehicle-detail, route: /vehicles/detail, breadcrumb: [Human Resources, Fleet, Detail], auth: { require: [fleet.read] } }
components:
  - type: OdooFormView
    source: fleet_vehicle_detail
    title_field: name
    attachment_source: fleet_vehicle_attachments
    attachment_panel_open: true
    attachment_label: Attachments
    add_attachment_label: Add attachment
    no_attachments_label: No attachments yet
    upload_failed_label: Attachment upload failed
    attachment_upload_action: upload_fleet_vehicle_attachment
    attachment_download_action: download_fleet_vehicle_attachment
    attachment_actions:
      - { id: remove_fleet_vehicle_attachment, label: Remove, variant: danger, permission: fleet.write }
    message_source: fleet_vehicle_detail_chatter
    chatter_label: Messages and activities
    message_label: Send message
    note_label: Log note
    message_action: send_fleet_vehicle_detail_message
    note_action: log_fleet_vehicle_detail_note
    message_placeholder: Send a message to vehicle followers…
    note_placeholder: Log an internal note…
    message_actor_field: actor_name
    message_action_field: action_label
    message_detail_field: detail
    message_timestamp_field: created_at
    chatter_empty: No messages or activities yet.
    content_slot: vehicle-tags
    status_field: state
    statusbar: [{ value: Available, label: Available }, { value: Assigned, label: Assigned }, { value: Maintenance, label: Maintenance }, { value: Retired, label: Retired }]
    statusbar_actions: { Available: set_fleet_vehicle_status_available, Assigned: set_fleet_vehicle_status_assigned, Maintenance: set_fleet_vehicle_status_maintenance, Retired: set_fleet_vehicle_status_retired }
    status_colors: { Available: green, Assigned: blue, Maintenance: amber, Retired: red }
    header_actions:
      - { id: action_accept_driver_change, label: Apply New Driver, variant: primary, permission: fleet.write, show_if: "state.future_driver_name" }
      - { id: archive_fleet_vehicle, label: Archive, variant: danger, permission: fleet.write, show_if: "state.archived === false" }
      - { id: unarchive_fleet_vehicle, label: Restore, variant: secondary, permission: fleet.write, show_if: "state.archived === true" }
    group_columns: 2
    stat_buttons:
      - { id: open_fleet_vehicle_assignment_logs, label: Drivers History, value_field: assignment_count, permission: fleet.read }
      - { id: open_fleet_vehicle_contracts, label: Contracts, value_field: contract_count, permission: fleet.read }
      - { id: open_fleet_vehicle_services, label: Services, value_field: service_count, icon: wrench, permission: fleet.read, show_if: "state.service_activity === 'none'" }
      - { id: open_fleet_vehicle_services_overdue, label: Services, value_field: service_count, icon: wrench, permission: fleet.read, show_if: "state.service_activity === 'overdue'" }
      - { id: open_fleet_vehicle_services_today, label: Services, value_field: service_count, icon: wrench, permission: fleet.read, show_if: "state.service_activity === 'today'" }
      - { id: open_fleet_vehicle_odometers, label: Odometer, value_field: odometer_count, permission: fleet.read, show_if: "state.vehicle_type === 'car'" }
      - { id: open_fleet_vehicle_odometer_report, label: Odometer Report, value_field: odometer_count, hide_value: true, permission: fleet.manage, show_if: "state.vehicle_type === 'car'" }
    groups:
      - title: Vehicle
        fields: [{ field: name, label: Vehicle }, { field: state, label: Status }, { field: license_plate, label: License plate }, { field: vehicle_type, label: Type }, { field: model, label: Model }, { field: manufacturer, label: Manufacturer }]
      - title: Assignment and records
        fields: [{ field: driver_name, label: Driver }, { field: future_driver_name, label: Future Driver }, { field: next_assignation_date, label: Assignment Date }, { field: odometer, label: Odometer }, { field: fuel_type, label: Fuel }, { field: acquisition_date, label: Acquisition date }, { field: contract_end_date, label: Contract end date }]
  - type: LineItemGrid
    mount_in: previous-panel
    source: fleet_vehicle_tag_assignments
    parent_source: fleet_vehicle_detail
    title: Tags
    description: Assign the Odoo vehicle taxonomy tags used to classify this vehicle.
    variant: odoo_x2many
    page_size: 20
    row_key: id
    actions:
      - { id: add_fleet_vehicle_tag, label: Add a tag, variant: primary, permission: fleet.write }
    empty_state: { title: No tags, description: Add a tag to classify this vehicle. }
    children:
      - { type: LineItemField, id: name, field: name, label: Tag, readonly: true }
      - { type: LineItemField, id: color, field: color, label: Color, type: ColorCell, palette: odoo, readonly: true }
      - type: LineItemActions
        id: fleet_vehicle_tag_actions
        actions: [{ id: remove_fleet_vehicle_tag, label: Remove, icon: trash, variant: danger, permission: fleet.write }]
