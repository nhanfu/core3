title: Fleet Vehicle
page: { id: vehicle-detail, route: /vehicles/detail, breadcrumb: [Human Resources, Fleet, Detail], auth: { require: [fleet.read] } }
components:
  - type: OdooFormView
    source: fleet_vehicle_detail
    title_field: name
    status_field: state
    statusbar: [{ value: Available, label: Available }, { value: Assigned, label: Assigned }, { value: Maintenance, label: Maintenance }, { value: Retired, label: Retired }]
    status_colors: { Available: green, Assigned: blue, Maintenance: amber, Retired: red }
    header_actions:
      - { id: action_accept_driver_change, label: Apply New Driver, variant: primary, permission: fleet.write, show_if: "state.future_driver_name" }
      - { id: archive_fleet_vehicle, label: Archive, variant: danger, permission: fleet.write, show_if: "state.archived === false" }
      - { id: unarchive_fleet_vehicle, label: Restore, variant: secondary, permission: fleet.write, show_if: "state.archived === true" }
    group_columns: 2
    stat_buttons:
      - { id: open_fleet_vehicle_assignment_logs, label: Drivers History, value_field: assignment_count, permission: fleet.read }
      - { id: open_fleet_vehicle_contracts, label: Contracts, value_field: contract_count, permission: fleet.read }
      - { id: open_fleet_vehicle_odometers, label: Odometer, value_field: odometer_count, permission: fleet.read, show_if: "state.vehicle_type === 'car'" }
      - { id: open_fleet_vehicle_odometer_report, label: Odometer Report, value_field: odometer_count, hide_value: true, permission: fleet.manage, show_if: "state.vehicle_type === 'car'" }
    groups:
      - title: Vehicle
        fields: [{ field: name, label: Vehicle }, { field: state, label: Status }, { field: license_plate, label: License plate }, { field: vehicle_type, label: Type }, { field: model, label: Model }, { field: manufacturer, label: Manufacturer }]
      - title: Assignment and records
        fields: [{ field: driver_name, label: Driver }, { field: future_driver_name, label: Future Driver }, { field: next_assignation_date, label: Assignment Date }, { field: odometer, label: Odometer }, { field: fuel_type, label: Fuel }, { field: acquisition_date, label: Acquisition date }, { field: contract_end_date, label: Contract end date }]
