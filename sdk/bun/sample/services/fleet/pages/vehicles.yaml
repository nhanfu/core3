title: Fleet Vehicles
page: { id: vehicles, route: /vehicles, breadcrumb: [Human Resources, Fleet, Vehicles], auth: { require: [fleet.read] } }
components:
  - type: ListView
    variant: odoo
    source: fleet_vehicles
    create_action: create_fleet_vehicle
    create_label: New vehicle
    search: { label: Search vehicles, placeholder: 'Search vehicle, plate, or driver...' }
    filters:
      - { field: state, label: Status, options_source: fleet_vehicle_states }
      - { field: vehicle_type, label: Type, options: [{ id: Car, label: Cars }, { id: Bike, label: Bikes }] }
      - { field: trailer_hook, label: Trailer Hook, options: [{ id: 'true', label: Trailer Hook }] }
      - { field: archived, label: Archived, options: [{ id: 'false', label: Active }, { id: 'true', label: Archived }] }
    group_by: [{ field: model, label: Model }, { field: manufacturer, label: Brand }, { field: state, label: Status }, { field: fuel_type, label: Fuel Type }]
    view_navigation: tabs
    views:
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: state
        groups_source: fleet_vehicle_states
        card: { title: name, subtitle: license_plate, fields: [{ field: model, label: Model }, { field: driver_name, label: Driver }, { field: odometer, label: Odometer }, { field: contract_end_date, label: Contract end }] }
      - { id: list, label: List, icon: table }
    columns:
      - { field: name, label: Vehicle, type: PrimaryEntityCell }
      - { field: license_plate, label: License plate }
      - { field: vehicle_type, label: Type }
      - { field: model, label: Model }
      - { field: driver_name, label: Driver }
      - { field: odometer, label: Odometer, align: right }
      - { field: fuel_type, label: Fuel }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_open_action: view_fleet_vehicle
    row_double_click_action: view_fleet_vehicle
    form_view: { page: apps/services/fleet/pages/vehicle-detail.yaml, side_panel: true }
    row_actions: menu
    actions:
      - { id: assign_fleet_vehicle, label: Assign, permission: fleet.write, variant: primary, show_if: "row.state === 'Available'" }
      - { id: service_fleet_vehicle, label: Send to maintenance, permission: fleet.write, variant: secondary, show_if: "row.state === 'Available' || row.state === 'Assigned'" }
      - { id: release_fleet_vehicle, label: Release, permission: fleet.write, variant: primary, show_if: "row.state === 'Maintenance'" }
      - { id: retire_fleet_vehicle, label: Retire, permission: fleet.manage, variant: danger, show_if: "row.state !== 'Retired'" }
    empty_state: { title: No vehicles, description: Add a vehicle or adjust your filters. }
