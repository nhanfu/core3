title: Odometers
page: { id: fleet-odometers, route: /fleet/odometers, breadcrumb: [Human Resources, Fleet, Odometers], auth: { require: [fleet.read] } }
components:
  - type: ListView
    variant: odoo
    source: fleet_odometers
    create_action: create_fleet_odometer
    create_label: New
    search: { label: Search odometers, placeholder: 'Search vehicle, driver, value, or date...' }
    filters:
      - { field: vehicle_id, label: Vehicle, options_source: fleet_odometer_vehicles }
    group_by:
      - { field: vehicle_name, label: Vehicle }
      - { field: date, label: Date }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - { id: form, label: Form, icon: form }
      - { id: graph, label: Graph, icon: graph, category_field: vehicle_name, measure_field: value, type: bar }
    form_view: { page: apps/services/fleet/pages/fleet-odometer-detail.yaml, side_panel: true }
    columns:
      - { field: date, label: Date, type: DateCell, sortable: true }
      - { field: vehicle_name, label: Vehicle, type: PrimaryEntityCell }
      - { field: driver_name, label: Driver }
      - { field: value, label: Odometer Value, align: right }
      - { field: unit, label: Unit }
    page_size: 50
    row_key: id
    row_open_action: view_fleet_odometer
    row_double_click_action: view_fleet_odometer
    row_actions: menu
    empty_state: { title: No odometer logs, description: Create a new odometer log or adjust your search. }
