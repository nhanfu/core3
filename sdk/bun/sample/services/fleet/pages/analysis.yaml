title: Fleet Analysis
page: { id: fleet-analysis, route: /fleet-analysis, breadcrumb: [Human Resources, Fleet, Analysis], auth: { require: [fleet.read] } }
components:
  - type: StatRow
    source: fleet_analysis_totals
    title: Fleet overview
    stats: [{ label: Vehicles, field: vehicle_count }, { label: Assigned, field: assigned_count }, { label: Maintenance, field: maintenance_count }, { label: Total odometer, field: total_odometer }]
  - type: Chart
    source: fleet_analysis_states
    title: Vehicles by status
    label_field: category
    value_field: vehicle_count
    variant: bar
