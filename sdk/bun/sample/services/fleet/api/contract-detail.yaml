page: { id: contract-detail }
datasources:
  - id: fleet_contract_detail_vehicles
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM fleet_vehicles WHERE COALESCE(archived, FALSE) = FALSE ORDER BY name, id"
  - id: fleet_contract_detail
    single: true
    permission: fleet.read
    error_states: { transport_error: { status: 503, code: FLEET_CONTRACT_DETAIL_UNAVAILABLE, message: Fleet contract detail is temporarily unavailable } }
    query: "SELECT c.id, c.row_version, c.name, c.vehicle_id, v.name AS vehicle_name, COALESCE(c.vendor, '—') AS vendor, COALESCE(c.driver_name, v.driver_name, 'Unassigned') AS driver_name, c.contract_type, CAST(c.start_date AS VARCHAR) AS start_date, CAST(c.expiration_date AS VARCHAR) AS expiration_date, c.recurring_cost, c.recurring_cost_frequency, c.cost_generated, c.status, c.renewal_status, c.active, CASE WHEN c.active THEN 'Active' ELSE 'Archived' END AS active_label, COALESCE(c.notes, '') AS notes FROM fleet_vehicle_contracts c JOIN fleet_vehicles v ON v.id = c.vehicle_id WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND c.id = :id"
  - id: fleet_contract_activities
    permission: fleet.read
    error_states: { transport_error: { status: 503, code: FLEET_CONTRACT_ACTIVITIES_UNAVAILABLE, message: Contract activities are temporarily unavailable. } }
    query: "SELECT a.id, a.row_version, a.contract_id, a.activity_type, a.summary, CAST(a.due_date AS VARCHAR) AS due_date, a.assigned_user, a.note, a.state, a.created_by AS actor_name, a.action, a.action_label, a.detail, CAST(a.created_at AS VARCHAR) AS created_at, COALESCE(a.completed_by, '') AS completed_by, CAST(a.completed_at AS VARCHAR) AS completed_at FROM fleet_contract_activities a JOIN fleet_vehicle_contracts c ON c.id = a.contract_id JOIN fleet_vehicles v ON v.id = c.vehicle_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND a.contract_id = :id AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name) ORDER BY CASE WHEN a.state = 'Planned' THEN 0 ELSE 1 END, a.due_date, a.id"
actions:
  - id: edit_fleet_contract
    type: server_form
    permission: fleet.write
    title: Edit contract
    action: fleet.contracts.update
    handler: yaml_mutation
    operation: update
    prefill: state.fleet_contract_detail
    refresh: [fleet_contract_detail, fleet_contracts]
    mutation:
      operation: update
      table: fleet_vehicle_contracts
      key: id
      concurrency: { required: true }
      fields: [name, vehicle_id, vendor, driver_name, contract_type, start_date, expiration_date, recurring_cost, recurring_cost_frequency, status, renewal_status, notes]
      required: [name, vehicle_id, start_date, expiration_date]
      guards:
        - { query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id", status: 404, message: Contract was not found }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :vehicle_id AND COALESCE(archived, FALSE) = FALSE", status: 404, message: Vehicle was not found or is archived }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(CAST(:start_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') AND regexp_matches(CAST(:expiration_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') AND CAST(:expiration_date AS DATE) >= CAST(:start_date AS DATE) AND CAST(:recurring_cost AS DECIMAL(18,2)) >= 0", status: 422, code: FLEET_CONTRACT_VALUES_INVALID, message: Contract dates are invalid or the recurring cost is negative }
        - { query: "SELECT 1 AS ok WHERE :status IN ('New', 'Running', 'To Renew', 'Expired', 'Closed')", status: 422, code: FLEET_CONTRACT_STATUS_INVALID, message: Contract status is invalid. }
      result: { query: "SELECT * FROM fleet_vehicle_contracts WHERE id = :id" }
    fields:
      - { field: name, label: Contract, type: text, required: true }
      - { field: vehicle_id, label: Vehicle, type: select, options_source: fleet_contract_detail_vehicles, required: true }
      - { field: vendor, label: Vendor, type: text }
      - { field: driver_name, label: Driver, type: text }
      - { field: contract_type, label: Contract Type, type: select, options: [{ value: Leasing, label: Leasing }, { value: Insurance, label: Insurance }, { value: Services, label: Services }] }
      - { field: start_date, label: Contract Start Date, type: text, required: true }
      - { field: expiration_date, label: Contract Expiration Date, type: text, required: true }
      - { field: recurring_cost, label: Recurring Cost, type: number }
      - { field: recurring_cost_frequency, label: Recurring Cost Frequency, type: select, options: [{ value: No, label: No }, { value: Daily, label: Daily }, { value: Weekly, label: Weekly }, { value: Monthly, label: Monthly }, { value: Yearly, label: Yearly }] }
      - { field: status, label: Status, type: select, options: [{ value: Running, label: Running }, { value: To Renew, label: To Renew }, { value: Expired, label: Expired }, { value: Closed, label: Closed }] }
      - { field: renewal_status, label: Renewal Alert, type: select, options: [{ value: On track, label: On track }, { value: Due soon, label: Due soon }, { value: Renewal required, label: Renewal required }, { value: Expired, label: Expired }] }
      - { field: notes, label: Notes, type: textarea }
  - id: renew_fleet_contract
    type: server_form
    permission: fleet.write
    title: Renew contract
    action: fleet.contracts.renew
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', status: Running, renewal_status: On track }
    refresh: [fleet_contract_detail, fleet_contracts]
    mutation:
      operation: update
      table: fleet_vehicle_contracts
      key: id
      fields: [expiration_date, status, renewal_status]
      concurrency: { required: true }
      required: [expiration_date]
      guards:
        - { query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id AND status IN ('Expired', 'To Renew', 'Running')", status: 409, message: This contract cannot be renewed from its current status }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(CAST(:expiration_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') AND CAST(:expiration_date AS DATE) >= DATE '2026-01-15'", status: 422, message: Renewal date must be on or after the Fleet reference date }
      result: { query: "SELECT * FROM fleet_vehicle_contracts WHERE id = :id" }
    fields: [{ field: expiration_date, label: New Expiration Date, type: text, required: true }]
  - id: set_fleet_contract_new
    type: server
    permission: fleet.write
    action: fleet.contracts.set_new
    handler: yaml_mutation
    operation: update
    params: { values: { status: New } }
    refresh: [fleet_contract_detail, fleet_contracts]
    mutation: { operation: update, table: fleet_vehicle_contracts, fields: [status], concurrency: { required: true }, guards: [{ query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id AND status <> 'Closed'", status: 409, code: FLEET_CONTRACT_STATUS_TRANSITION_INVALID, message: A cancelled contract cannot be reopened. }], result: { query: "SELECT * FROM fleet_vehicle_contracts WHERE id = :id" } }
  - id: set_fleet_contract_running
    type: server
    permission: fleet.write
    action: fleet.contracts.set_running
    handler: yaml_mutation
    operation: update
    params: { values: { status: Running } }
    refresh: [fleet_contract_detail, fleet_contracts]
    mutation: { operation: update, table: fleet_vehicle_contracts, fields: [status], concurrency: { required: true }, guards: [{ query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id AND status <> 'Closed'", status: 409, code: FLEET_CONTRACT_STATUS_TRANSITION_INVALID, message: A cancelled contract cannot be reopened. }], result: { query: "SELECT * FROM fleet_vehicle_contracts WHERE id = :id" } }
  - id: expire_fleet_contract
    type: server
    permission: fleet.write
    action: fleet.contracts.expire
    handler: yaml_mutation
    operation: update
    params: { values: { status: Expired } }
    refresh: [fleet_contract_detail, fleet_contracts]
    mutation: { operation: update, table: fleet_vehicle_contracts, fields: [status], concurrency: { required: true }, guards: [{ query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id AND status <> 'Closed'", status: 409, code: FLEET_CONTRACT_STATUS_TRANSITION_INVALID, message: A cancelled contract cannot be expired. }], result: { query: "SELECT * FROM fleet_vehicle_contracts WHERE id = :id" } }
  - id: close_fleet_contract
    type: server
    permission: fleet.write
    action: fleet.contracts.close
    handler: yaml_mutation
    operation: update
    params: { values: { status: Closed } }
    refresh: [fleet_contract_detail, fleet_contracts]
    mutation: { operation: update, table: fleet_vehicle_contracts, fields: [status], concurrency: { required: true }, guards: [{ query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id AND status <> 'Closed'", status: 409, code: FLEET_CONTRACT_ALREADY_CLOSED, message: Contract is already cancelled. }], result: { query: "SELECT * FROM fleet_vehicle_contracts WHERE id = :id" } }
  - id: archive_fleet_contract
    type: server
    permission: fleet.write
    action: fleet.contracts.archive
    handler: yaml_mutation
    operation: update
    params: { values: { active: false } }
    refresh: [fleet_contract_detail, fleet_contracts]
    mutation: { operation: update, table: fleet_vehicle_contracts, fields: [active], concurrency: { required: true }, guards: [{ query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id AND active = TRUE", status: 409, code: FLEET_CONTRACT_ALREADY_ARCHIVED, message: Contract is already archived. }], result: { query: "SELECT * FROM fleet_vehicle_contracts WHERE id = :id" } }
  - id: restore_fleet_contract
    type: server
    permission: fleet.write
    action: fleet.contracts.restore
    handler: yaml_mutation
    operation: update
    params: { values: { active: true } }
    refresh: [fleet_contract_detail, fleet_contracts]
    mutation: { operation: update, table: fleet_vehicle_contracts, fields: [active], concurrency: { required: true }, guards: [{ query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id AND active = FALSE", status: 409, code: FLEET_CONTRACT_ALREADY_ACTIVE, message: Contract is already active. }], result: { query: "SELECT * FROM fleet_vehicle_contracts WHERE id = :id" } }
  - id: delete_fleet_contract
    type: delete
    permission: fleet.write
    table: fleet_vehicle_contracts
    refresh: [fleet_contracts]
    mutation:
      operation: delete
      table: fleet_vehicle_contracts
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM fleet_vehicle_contracts WHERE id = :id", status: 404, code: FLEET_CONTRACT_NOT_FOUND, message: Contract was not found. }]
  - id: schedule_fleet_contract_activity
    type: server_form
    permission: fleet.write
    title: Schedule activity
    description: Schedule a renewal activity on this Fleet contract.
    action: fleet.contracts.activity.schedule
    handler: yaml_mutation
    operation: activity
    params: { id: '{state.id}', expected_row_version: '{state.row_version}' }
    refresh: [fleet_contract_detail, fleet_contract_activities]
    mutation:
      generated: [activity_id]
      before_steps: [{ query: "SELECT 'fleet-contract-activity-' || CAST(:id AS VARCHAR) || '-' || CAST(:expected_row_version AS VARCHAR) AS activity_id", assign: activity_id }]
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), '') IS NOT NULL", status: 403, code: FLEET_CONTRACT_ACTIVITY_ACTOR_REQUIRED, message: A signed-in Fleet user is required to schedule an activity. }
        - { query: "SELECT c.id FROM fleet_vehicle_contracts c JOIN fleet_vehicles v ON v.id = c.vehicle_id WHERE c.id = :id AND c.active = TRUE AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name)", status: 404, code: FLEET_CONTRACT_ACTIVITY_CONTRACT_NOT_FOUND, message: Active contract was not found in the current company. }
        - { query: "SELECT c.id FROM fleet_vehicle_contracts c JOIN fleet_vehicles v ON v.id = c.vehicle_id WHERE c.id = :id AND c.row_version = :expected_row_version AND c.active = TRUE AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The contract changed before the activity was scheduled. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: FLEET_CONTRACT_ACTIVITY_SUMMARY_INVALID, message: Activity summary must be between 1 and 4000 characters. }
      steps:
        - query: "INSERT INTO fleet_contract_activities(id, contract_id, activity_type, summary, due_date, assigned_user, note, state, created_by, action, action_label, detail, created_at) SELECT :activity_id, c.id, 'Contract to Renew', TRIM(CAST(:content AS VARCHAR)), c.expiration_date, COALESCE(NULLIF(TRIM(CAST(:activity_user AS VARCHAR)), ''), :current_user_name), '', 'Planned', :current_user_name, 'fleet.contract.activity.schedule', 'Scheduled activity', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-01-15 09:30:00' FROM fleet_vehicle_contracts c WHERE c.id = :id"
          expect_changed: true
          status: 409
          code: FLEET_CONTRACT_ACTIVITY_CREATE_FAILED
          message: The contract activity could not be scheduled.
        - query: "UPDATE fleet_vehicle_contracts SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:30:00' WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The contract changed before the activity was scheduled. Reload and try again.
      result: { query: "SELECT id, row_version, contract_id, activity_type, summary, CAST(due_date AS VARCHAR) AS due_date, assigned_user, note, state, created_by AS actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM fleet_contract_activities WHERE id = :activity_id" }
    fields:
      - { field: content, label: Activity, type: textarea, required: true, placeholder: Describe the renewal activity… }
      - { field: activity_user, label: Assigned to, type: text }
  - id: complete_fleet_contract_activity
    type: server
    permission: fleet.write
    action: fleet.contracts.activity.complete
    handler: yaml_mutation
    operation: complete_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [fleet_contract_detail, fleet_contract_activities]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), '') IS NOT NULL", status: 403, code: FLEET_CONTRACT_ACTIVITY_ACTOR_REQUIRED, message: A signed-in Fleet user is required to complete an activity. }
        - { query: "SELECT a.id FROM fleet_contract_activities a JOIN fleet_vehicle_contracts c ON c.id = a.contract_id JOIN fleet_vehicles v ON v.id = c.vehicle_id WHERE a.id = :id AND (COALESCE(:current_company_name, '') = '' OR v.company_name = :current_company_name)", status: 404, code: FLEET_CONTRACT_ACTIVITY_NOT_FOUND, message: Contract activity was not found in the current company. }
        - { query: "SELECT id FROM fleet_contract_activities WHERE id = :id AND state = 'Planned' AND row_version = :expected_row_version", status: 409, code: FLEET_CONTRACT_ACTIVITY_STALE, message: The contract activity is already complete or has changed. Reload before completing it. }
      steps:
        - query: "UPDATE fleet_contract_activities SET state = 'Done', completed_by = :current_user_name, completed_at = TIMESTAMP '2026-01-15 10:00:00', row_version = row_version + 1, action = 'fleet.contract.activity.complete', action_label = 'Completed activity' WHERE id = :id AND state = 'Planned' AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: FLEET_CONTRACT_ACTIVITY_STALE
          message: The contract activity changed before completion was saved.
      result: { query: "SELECT id, row_version, contract_id, activity_type, summary, CAST(due_date AS VARCHAR) AS due_date, assigned_user, note, state, completed_by, CAST(completed_at AS VARCHAR) AS completed_at, created_by AS actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM fleet_contract_activities WHERE id = :id" }
