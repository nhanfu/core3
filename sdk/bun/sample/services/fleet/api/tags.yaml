page: { id: fleet-tags }
datasources:
  - id: fleet_vehicle_tags
    permission: fleet.read
    error_states:
      unauthorized: { status: 401, code: FLEET_TAGS_UNAUTHORIZED, message: Sign in to view vehicle tags. }
      forbidden: { status: 403, code: FLEET_TAGS_FORBIDDEN, message: You do not have permission to view vehicle tags. }
      transport_error: { status: 503, code: FLEET_TAGS_UNAVAILABLE, message: Vehicle tag data is temporarily unavailable. }
    query: "SELECT id, row_version, name, color FROM fleet_vehicle_tags WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY id"
actions:
  - id: create_fleet_vehicle_tag_inline
    type: server_form
    permission: fleet.manage
    title: New Vehicle Tag
    action: fleet.vehicle_tags.create
    handler: yaml_mutation
    operation: create
    refresh: [fleet_vehicle_tags]
    mutation:
      operation: insert
      table: fleet_vehicle_tags
      fields: [row_version, name, color]
      required: [name]
      defaults: { row_version: 1, color: 0 }
      generated: [id]
      before_steps: [{ query: "SELECT 'fleet-tag-custom-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: FLEET_TAG_NAME_REQUIRED, message: Vehicle tag name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:color, 0) AS INTEGER) BETWEEN 0 AND 11", status: 422, code: FLEET_TAG_COLOR_INVALID, message: Vehicle tag color must be between 0 and 11. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM fleet_vehicle_tags WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: FLEET_TAG_EXISTS, message: A vehicle tag with this name already exists. }
      result: { query: "SELECT * FROM fleet_vehicle_tags WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true, placeholder: Tag name }
      - { field: color, label: Color, type: color, default: 0 }
  - id: update_fleet_vehicle_tag_inline
    type: server_form
    permission: fleet.manage
    title: Edit Vehicle Tag
    action: fleet.vehicle_tags.update
    handler: yaml_mutation
    operation: update
    refresh: [fleet_vehicle_tags]
    mutation:
      operation: update
      table: fleet_vehicle_tags
      fields: [name, color]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicle_tags WHERE id = :id", status: 404, code: FLEET_TAG_NOT_FOUND, message: Vehicle tag was not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 80", status: 422, code: FLEET_TAG_NAME_REQUIRED, message: Vehicle tag name is required. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:color, 0) AS INTEGER) BETWEEN 0 AND 11", status: 422, code: FLEET_TAG_COLOR_INVALID, message: Vehicle tag color must be between 0 and 11. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM fleet_vehicle_tags WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: FLEET_TAG_EXISTS, message: A vehicle tag with this name already exists. }
      result: { query: "SELECT * FROM fleet_vehicle_tags WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: color, label: Color, type: color }
  - id: edit_fleet_vehicle_tag
    type: navigate
    permission: fleet.read
    navigate_to: /fleet/config/tags/detail
    params: { id: '{row.id}' }
  - id: delete_fleet_vehicle_tag
    type: server
    permission: fleet.manage
    action: fleet.vehicle_tags.delete
    handler: yaml_mutation
    operation: delete
    refresh: [fleet_vehicle_tags]
    params: { id: '{row.id}' }
    mutation:
      operation: delete
      table: fleet_vehicle_tags
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicle_tags WHERE id = :id", status: 404, code: FLEET_TAG_NOT_FOUND, message: Vehicle tag was not found. }
