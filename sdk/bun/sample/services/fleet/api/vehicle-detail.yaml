page: { id: vehicle-detail }
datasources:
  - id: fleet_vehicle_detail
    single: true
    permission: fleet.read
    workflow: fleet_vehicles
    query: "SELECT id, row_version, name, license_plate, vehicle_type, model, manufacturer, driver_name, odometer, fuel_type, state, trailer_hook, archived, CAST(acquisition_date AS VARCHAR) AS acquisition_date, CAST(contract_end_date AS VARCHAR) AS contract_end_date FROM fleet_vehicles WHERE id = :id"
actions:
  - { id: assign_fleet_vehicle_detail, type: server, permission: fleet.write, action: fleet.vehicles.assign, handler: order_transition, workflow: fleet_vehicles, operation: assign, params: { id: '{state.id}' }, refresh: [fleet_vehicle_detail] }
  - { id: service_fleet_vehicle_detail, type: server, permission: fleet.write, action: fleet.vehicles.service, handler: order_transition, workflow: fleet_vehicles, operation: service, params: { id: '{state.id}' }, refresh: [fleet_vehicle_detail] }
  - { id: release_fleet_vehicle_detail, type: server, permission: fleet.write, action: fleet.vehicles.release, handler: order_transition, workflow: fleet_vehicles, operation: release, params: { id: '{state.id}' }, refresh: [fleet_vehicle_detail] }
  - { id: retire_fleet_vehicle_detail, type: server, permission: fleet.manage, action: fleet.vehicles.retire, handler: order_transition, workflow: fleet_vehicles, operation: retire, params: { id: '{state.id}' }, refresh: [fleet_vehicle_detail] }
