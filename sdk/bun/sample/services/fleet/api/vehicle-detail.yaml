page: { id: vehicle-detail }
datasources:
  - id: fleet_vehicle_detail
    single: true
    permission: fleet.read
    workflow: fleet_vehicles
    error_states:
      unauthorized: { status: 401, code: FLEET_VEHICLE_DETAIL_UNAUTHORIZED, message: Sign in to view this vehicle. }
      forbidden: { status: 403, code: FLEET_VEHICLE_DETAIL_FORBIDDEN, message: You do not have permission to view this vehicle. }
      transport_error: { status: 503, code: FLEET_VEHICLE_DETAIL_UNAVAILABLE, message: Vehicle details are temporarily unavailable. }
    query: "SELECT v.id, v.row_version, v.name, v.license_plate, v.vehicle_type, v.model, v.manufacturer, v.driver_name, v.future_driver_name, CAST(v.next_assignation_date AS VARCHAR) AS next_assignation_date, v.odometer, v.fuel_type, v.state, v.trailer_hook, v.archived, v.company_name, CAST(v.acquisition_date AS VARCHAR) AS acquisition_date, CAST(v.contract_end_date AS VARCHAR) AS contract_end_date, COALESCE((SELECT ARRAY_AGG(r.tag_id ORDER BY r.tag_id) FROM fleet_vehicle_tag_rel r JOIN fleet_vehicle_tags t ON t.id = r.tag_id WHERE r.vehicle_id = v.id), CAST([] AS VARCHAR[])) AS tag_ids, COALESCE((SELECT string_agg(t.name, ', ' ORDER BY t.name, t.id) FROM fleet_vehicle_tag_rel r JOIN fleet_vehicle_tags t ON t.id = r.tag_id WHERE r.vehicle_id = v.id), '') AS tag_names, (SELECT COUNT(*) FROM fleet_vehicle_assignation_logs l WHERE l.vehicle_id = v.id) AS assignment_count, (SELECT COUNT(*) FROM fleet_vehicle_contracts c WHERE c.vehicle_id = v.id AND c.status <> 'Closed') AS contract_count, (SELECT COUNT(*) FROM fleet_vehicle_services s WHERE s.vehicle_id = v.id AND s.active = NOT v.archived) AS service_count, COALESCE(v.service_activity, 'none') AS service_activity, (SELECT COUNT(*) FROM fleet_vehicle_odometers o WHERE o.vehicle_id = v.id) AS odometer_count FROM fleet_vehicles v WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND v.id = :id AND (COALESCE(:current_company_name, :company_name, '') = '' OR v.company_name = COALESCE(:current_company_name, :company_name))"
  - id: fleet_vehicle_attachments
    permission: fleet.read
    error_states: { transport_error: { status: 503, code: FLEET_VEHICLE_ATTACHMENTS_UNAVAILABLE, message: Vehicle attachments are temporarily unavailable. } }
    query: "SELECT a.id, a.row_version, a.vehicle_id, a.company_name, a.file_name, a.mime_type, a.size_bytes, a.uploaded_by, CAST(a.created_at AS VARCHAR) AS created_at FROM fleet_vehicle_attachments a JOIN fleet_vehicles v ON v.id = a.vehicle_id WHERE a.vehicle_id = :id AND a.active = TRUE AND (COALESCE(:current_company_name, :company_name, '') = '' OR v.company_name = COALESCE(:current_company_name, :company_name)) ORDER BY a.created_at DESC, a.id DESC"
  - id: fleet_vehicle_tag_options
    single: false
    permission: fleet.write
    query: "SELECT t.id AS value, t.name AS label FROM fleet_vehicle_tags t JOIN fleet_vehicles v ON v.id = :id WHERE v.archived = FALSE AND (COALESCE(:current_company_name, :company_name, '') = '' OR v.company_name = COALESCE(:current_company_name, :company_name)) AND NOT EXISTS (SELECT 1 FROM fleet_vehicle_tag_rel r WHERE r.vehicle_id = :id AND r.tag_id = t.id) ORDER BY t.name, t.id"
  - id: fleet_vehicle_tag_assignments
    single: false
    permission: fleet.read
    error_states: { transport_error: { status: 503, code: FLEET_VEHICLE_TAGS_UNAVAILABLE, message: Vehicle tags are temporarily unavailable. } }
    query: "SELECT r.vehicle_id, r.tag_id AS id, 1 AS row_version, r.tag_id, t.name, t.color FROM fleet_vehicle_tag_rel r JOIN fleet_vehicle_tags t ON t.id = r.tag_id JOIN fleet_vehicles v ON v.id = r.vehicle_id WHERE r.vehicle_id = :id AND (COALESCE(:current_company_name, :company_name, '') = '' OR v.company_name = COALESCE(:current_company_name, :company_name)) ORDER BY t.name, t.id"
  - id: fleet_vehicle_detail_chatter
    permission: fleet.read
    error_states: { transport_error: { status: 503, code: FLEET_VEHICLE_CHATTER_UNAVAILABLE, message: Vehicle messages and activities are temporarily unavailable. } }
    query: "SELECT timeline.id, timeline.row_version, timeline.vehicle_id, timeline.state, timeline.actor_name, timeline.action, timeline.action_label, timeline.detail, CAST(timeline.created_at AS VARCHAR) AS created_at FROM (SELECT m.id, m.row_version, m.vehicle_id, 'done' AS state, m.actor_name, m.action, m.action_label, m.detail, m.created_at FROM fleet_vehicle_messages m UNION ALL SELECT a.id, a.row_version, a.vehicle_id, CASE WHEN a.state = 'Done' THEN 'done' ELSE 'planned' END AS state, a.created_by AS actor_name, 'fleet.vehicles.activity.schedule' AS action, CASE WHEN a.state = 'Done' THEN 'Activity completed' ELSE 'Activity scheduled' END AS action_label, a.summary AS detail, a.created_at FROM fleet_vehicle_activities a) timeline JOIN fleet_vehicles v ON v.id = timeline.vehicle_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END AND timeline.vehicle_id = :id AND (COALESCE(:current_company_name, :company_name, '') = '' OR v.company_name = COALESCE(:current_company_name, :company_name)) ORDER BY timeline.created_at DESC, timeline.id DESC"
actions:
  - { id: open_fleet_vehicle_assignment_logs, type: navigate, permission: fleet.read, navigate_to: /fleet/vehicles/assignment-logs, params: { vehicle_id: '{state.id}' } }
  - id: send_fleet_vehicle_detail_message
    type: server_form
    permission: fleet.write
    title: Send message
    action: fleet.vehicles.chatter.message
    handler: order_chatter
    operation: message
    params: { id: '{state.fleet_vehicle_detail.id}', expected_row_version: '{state.fleet_vehicle_detail.row_version}' }
    refresh: [fleet_vehicle_detail, fleet_vehicle_detail_chatter]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      before_steps:
        - { query: "SELECT 'fleet-vehicle-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM fleet_vehicle_messages WHERE vehicle_id = :id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: FLEET_VEHICLE_CHATTER_ACTOR_REQUIRED, message: An authenticated Fleet actor is required to send a message. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 409, code: FLEET_VEHICLE_CHATTER_PARENT_CHANGED, message: This vehicle changed before the message was sent. Reload before retrying. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: FLEET_VEHICLE_CHATTER_CONTENT_INVALID, message: Message content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO fleet_vehicle_messages(id, vehicle_id, company_name, row_version, actor_id, actor_name, action, action_label, detail, created_at) SELECT :message_id, v.id, v.company_name, 1, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Fleet User'), 'fleet.vehicles.chatter.message', 'Message', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-01-15 11:00:00' FROM fleet_vehicles v WHERE v.id = :id", expect_changed: true, status: 409, code: FLEET_VEHICLE_CHATTER_NOT_CREATED, message: The vehicle message could not be sent. }
        - { query: "UPDATE fleet_vehicles SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 11:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: FLEET_VEHICLE_CHATTER_PARENT_CHANGED, message: This vehicle changed while sending the message. Reload before retrying. }
      result: { query: "SELECT id, vehicle_id, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM fleet_vehicle_messages WHERE id = :message_id" }
  - id: log_fleet_vehicle_detail_note
    type: server_form
    permission: fleet.write
    title: Log note
    action: fleet.vehicles.chatter.note
    handler: order_chatter
    operation: note
    params: { id: '{state.fleet_vehicle_detail.id}', expected_row_version: '{state.fleet_vehicle_detail.row_version}' }
    refresh: [fleet_vehicle_detail, fleet_vehicle_detail_chatter]
    fields: [{ field: content, label: Note, type: textarea, required: true }]
    mutation:
      concurrency: { required: true }
      generated: [message_id]
      before_steps:
        - { query: "SELECT 'fleet-vehicle-message-' || :id || '-' || CAST(COUNT(*) + 1 AS VARCHAR) AS message_id FROM fleet_vehicle_messages WHERE vehicle_id = :id", assign: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: FLEET_VEHICLE_CHATTER_ACTOR_REQUIRED, message: An authenticated Fleet actor is required to log a note. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 409, code: FLEET_VEHICLE_CHATTER_PARENT_CHANGED, message: This vehicle changed before the note was logged. Reload before retrying. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: FLEET_VEHICLE_CHATTER_CONTENT_INVALID, message: Note content must be between 1 and 4000 characters. }
      steps:
        - { query: "INSERT INTO fleet_vehicle_messages(id, vehicle_id, company_name, row_version, actor_id, actor_name, action, action_label, detail, created_at) SELECT :message_id, v.id, v.company_name, 1, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'Fleet User'), 'fleet.vehicles.chatter.note', 'Internal note', TRIM(CAST(:content AS VARCHAR)), TIMESTAMP '2026-01-15 11:00:00' FROM fleet_vehicles v WHERE v.id = :id", expect_changed: true, status: 409, code: FLEET_VEHICLE_CHATTER_NOT_CREATED, message: The vehicle note could not be logged. }
        - { query: "UPDATE fleet_vehicles SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 11:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: FLEET_VEHICLE_CHATTER_PARENT_CHANGED, message: This vehicle changed while logging the note. Reload before retrying. }
      result: { query: "SELECT id, vehicle_id, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM fleet_vehicle_messages WHERE id = :message_id" }
  - id: edit_fleet_vehicle
    type: server_form
    permission: fleet.write
    title: Edit Vehicle
    action: fleet.vehicles.update
    handler: yaml_mutation
    operation: update
    prefill: state.fleet_vehicle_detail
    refresh: [fleet_vehicle_detail, fleet_vehicles]
    mutation:
      operation: update
      table: fleet_vehicles
      fields: [name, license_plate, vehicle_type, model, manufacturer, driver_employee_id, driver_name, odometer, fuel_type, acquisition_date, contract_end_date, trailer_hook, company_name]
      required: [name, license_plate]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id", status: 404, code: FLEET_VEHICLE_NOT_FOUND, message: Vehicle was not found. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM fleet_vehicles WHERE id = :id AND company_name = :current_company_name)", status: 403, code: FLEET_VEHICLE_COMPANY_SCOPE_REQUIRED, message: Vehicle belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 120", status: 422, code: FLEET_VEHICLE_NAME_REQUIRED, message: Vehicle name is required. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:license_plate AS VARCHAR))) BETWEEN 1 AND 32", status: 422, code: FLEET_VEHICLE_LICENSE_PLATE_REQUIRED, message: License plate is required. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:vehicle_type, 'Car') IN ('Car', 'Bike')", status: 422, code: FLEET_VEHICLE_TYPE_INVALID, message: Vehicle type must be Car or Bike. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:odometer AS DECIMAL(18,3)), 0) >= 0", status: 422, code: FLEET_VEHICLE_ODOMETER_INVALID, message: Odometer cannot be negative. }
        - { query: "SELECT 1 AS ok WHERE (:acquisition_date IS NULL OR (regexp_matches(CAST(:acquisition_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') AND CAST(:acquisition_date AS DATE) BETWEEN DATE '1900-01-01' AND DATE '2100-12-31')) AND (:contract_end_date IS NULL OR (regexp_matches(CAST(:contract_end_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') AND CAST(:contract_end_date AS DATE) BETWEEN DATE '1900-01-01' AND DATE '2100-12-31')) AND (:acquisition_date IS NULL OR :contract_end_date IS NULL OR CAST(:contract_end_date AS DATE) >= CAST(:acquisition_date AS DATE))", status: 422, code: FLEET_VEHICLE_DATES_INVALID, message: Acquisition and contract dates are invalid. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM fleet_vehicles WHERE LOWER(TRIM(name)) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: FLEET_VEHICLE_NAME_EXISTS, message: A vehicle with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM fleet_vehicles WHERE LOWER(TRIM(license_plate)) = LOWER(TRIM(CAST(:license_plate AS VARCHAR))) AND id <> :id)", status: 409, code: FLEET_VEHICLE_LICENSE_PLATE_EXISTS, message: A vehicle with this license plate already exists. }
      result: { query: "SELECT * FROM fleet_vehicles WHERE id = :id" }
    fields: [{ field: name, label: Vehicle, type: text, required: true }, { field: license_plate, label: License plate, type: text, required: true }, { field: vehicle_type, label: Type, type: select, options: [{ value: Car, label: Car }, { value: Bike, label: Bike }] }, { field: model, label: Model, type: text }, { field: manufacturer, label: Manufacturer, type: text }, { field: driver_name, label: Driver, type: text }, { field: odometer, label: Odometer, type: number }, { field: fuel_type, label: Fuel type, type: text }, { field: acquisition_date, label: Acquisition date, type: text }, { field: contract_end_date, label: Contract end date, type: text }, { field: trailer_hook, label: Trailer Hook, type: checkbox }, { field: company_name, label: Company, type: text }]
  - { id: open_fleet_vehicle_contracts, type: navigate, permission: fleet.read, navigate_to: /fleet/contracts, params: { vehicle_id: '{state.id}', search_default_open: true, search_default_inactive: '{state.archived}' } }
  - { id: open_fleet_vehicle_services, type: navigate, permission: fleet.read, navigate_to: /fleet/services, params: { vehicle_id: '{state.id}', search_default_inactive: '{state.archived}' } }
  - { id: open_fleet_vehicle_services_overdue, type: navigate, permission: fleet.read, navigate_to: /fleet/services, params: { vehicle_id: '{state.id}', search_default_inactive: '{state.archived}' } }
  - { id: open_fleet_vehicle_services_today, type: navigate, permission: fleet.read, navigate_to: /fleet/services, params: { vehicle_id: '{state.id}', search_default_inactive: '{state.archived}' } }
  - { id: open_fleet_vehicle_odometers, type: navigate, permission: fleet.read, navigate_to: /fleet/odometers, params: { vehicle_id: '{state.id}' } }
  - { id: open_fleet_vehicle_odometer_report, type: navigate, permission: fleet.manage, navigate_to: /fleet/reporting/odometers, params: { vehicle_id: '{state.id}', default_group_by: recorded_month } }
  - id: set_fleet_vehicle_status_available
    type: server
    permission: fleet.write
    action: fleet.vehicles.status
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', values: { state: Available } }
    refresh: [fleet_vehicle_detail, fleet_vehicles]
    mutation:
      operation: update
      table: fleet_vehicles
      fields: [state]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id", status: 404, code: FLEET_VEHICLE_NOT_FOUND, message: Vehicle was not found. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM fleet_vehicles WHERE id = :id AND company_name = :current_company_name)", status: 403, code: FLEET_VEHICLE_COMPANY_SCOPE_REQUIRED, message: Vehicle belongs to another company. }
        - { query: "SELECT id FROM fleet_vehicle_states WHERE id = :state AND active = TRUE", status: 422, code: FLEET_VEHICLE_STATUS_INVALID, message: Vehicle status is not available. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Vehicle was changed by another user. Reload before changing its status. }
      result: { query: "SELECT * FROM fleet_vehicles WHERE id = :id" }
  - id: set_fleet_vehicle_status_assigned
    type: server
    permission: fleet.write
    action: fleet.vehicles.status
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', values: { state: Assigned } }
    refresh: [fleet_vehicle_detail, fleet_vehicles]
    mutation:
      operation: update
      table: fleet_vehicles
      fields: [state]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id", status: 404, code: FLEET_VEHICLE_NOT_FOUND, message: Vehicle was not found. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM fleet_vehicles WHERE id = :id AND company_name = :current_company_name)", status: 403, code: FLEET_VEHICLE_COMPANY_SCOPE_REQUIRED, message: Vehicle belongs to another company. }
        - { query: "SELECT id FROM fleet_vehicle_states WHERE id = :state AND active = TRUE", status: 422, code: FLEET_VEHICLE_STATUS_INVALID, message: Vehicle status is not available. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Vehicle was changed by another user. Reload before changing its status. }
      result: { query: "SELECT * FROM fleet_vehicles WHERE id = :id" }
  - id: set_fleet_vehicle_status_maintenance
    type: server
    permission: fleet.write
    action: fleet.vehicles.status
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', values: { state: Maintenance } }
    refresh: [fleet_vehicle_detail, fleet_vehicles]
    mutation:
      operation: update
      table: fleet_vehicles
      fields: [state]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id", status: 404, code: FLEET_VEHICLE_NOT_FOUND, message: Vehicle was not found. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM fleet_vehicles WHERE id = :id AND company_name = :current_company_name)", status: 403, code: FLEET_VEHICLE_COMPANY_SCOPE_REQUIRED, message: Vehicle belongs to another company. }
        - { query: "SELECT id FROM fleet_vehicle_states WHERE id = :state AND active = TRUE", status: 422, code: FLEET_VEHICLE_STATUS_INVALID, message: Vehicle status is not available. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Vehicle was changed by another user. Reload before changing its status. }
      result: { query: "SELECT * FROM fleet_vehicles WHERE id = :id" }
  - id: set_fleet_vehicle_status_retired
    type: server
    permission: fleet.write
    action: fleet.vehicles.status
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', values: { state: Retired } }
    refresh: [fleet_vehicle_detail, fleet_vehicles]
    mutation:
      operation: update
      table: fleet_vehicles
      fields: [state]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id", status: 404, code: FLEET_VEHICLE_NOT_FOUND, message: Vehicle was not found. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM fleet_vehicles WHERE id = :id AND company_name = :current_company_name)", status: 403, code: FLEET_VEHICLE_COMPANY_SCOPE_REQUIRED, message: Vehicle belongs to another company. }
        - { query: "SELECT id FROM fleet_vehicle_states WHERE id = :state AND active = TRUE", status: 422, code: FLEET_VEHICLE_STATUS_INVALID, message: Vehicle status is not available. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Vehicle was changed by another user. Reload before changing its status. }
      result: { query: "SELECT * FROM fleet_vehicles WHERE id = :id" }
  - { id: assign_fleet_vehicle_detail, type: server, permission: fleet.write, action: fleet.vehicles.assign, handler: order_transition, workflow: fleet_vehicles, operation: assign, params: { id: '{state.id}' }, refresh: [fleet_vehicle_detail] }
  - { id: service_fleet_vehicle_detail, type: server, permission: fleet.write, action: fleet.vehicles.service, handler: order_transition, workflow: fleet_vehicles, operation: service, params: { id: '{state.id}' }, refresh: [fleet_vehicle_detail] }
  - { id: release_fleet_vehicle_detail, type: server, permission: fleet.write, action: fleet.vehicles.release, handler: order_transition, workflow: fleet_vehicles, operation: release, params: { id: '{state.id}' }, refresh: [fleet_vehicle_detail] }
  - { id: retire_fleet_vehicle_detail, type: server, permission: fleet.manage, action: fleet.vehicles.retire, handler: order_transition, workflow: fleet_vehicles, operation: retire, params: { id: '{state.id}' }, refresh: [fleet_vehicle_detail] }
  - id: action_accept_driver_change
    type: server
    permission: fleet.write
    action: fleet.vehicle.action_accept_driver_change
    handler: yaml_mutation
    params: { id: '{state.id}' }
    refresh: [fleet_vehicle_detail, fleet_vehicles, fleet_vehicle_assignment_logs]
    mutation:
      before_steps: [{ query: "SELECT future_driver_name FROM fleet_vehicles WHERE id = :id", assign: future_driver_name }]
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id", status: 404, code: FLEET_VEHICLE_NOT_FOUND, message: Vehicle was not found. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND future_driver_name IS NOT NULL AND LENGTH(TRIM(future_driver_name)) > 0", status: 409, code: FLEET_DRIVER_CHANGE_NOT_PLANNED, message: No future driver is planned for this vehicle. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Vehicle was changed by another user. Reload before applying the new driver. }
      steps: [{ query: "UPDATE fleet_vehicles SET driver_name = :future_driver_name, future_driver_name = NULL, next_assignation_date = NULL, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :id AND row_version = :expected_row_version", expect_changed: true }]
      result: { query: "SELECT * FROM fleet_vehicles WHERE id = :id" }
  - id: archive_fleet_vehicle
    type: server
    permission: fleet.write
    action: fleet.vehicles.archive
    handler: yaml_mutation
    params: { id: '{state.id}', values: { archived: true } }
    refresh: [fleet_vehicle_detail, fleet_vehicles]
    mutation:
      operation: update
      table: fleet_vehicles
      fields: [archived]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND archived = FALSE", status: 404, code: FLEET_VEHICLE_NOT_ACTIVE, message: Active vehicle was not found. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM fleet_vehicles WHERE id = :id AND company_name = :current_company_name)", status: 403, code: FLEET_VEHICLE_COMPANY_SCOPE_REQUIRED, message: Vehicle belongs to another company. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Vehicle was changed by another user. Reload before archiving. }
      result: { query: "SELECT * FROM fleet_vehicles WHERE id = :id" }
  - id: unarchive_fleet_vehicle
    type: server
    permission: fleet.write
    action: fleet.vehicles.unarchive
    handler: yaml_mutation
    params: { id: '{state.id}', values: { archived: false } }
    refresh: [fleet_vehicle_detail, fleet_vehicles]
    mutation:
      operation: update
      table: fleet_vehicles
      fields: [archived]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND archived = TRUE", status: 404, code: FLEET_VEHICLE_NOT_ARCHIVED, message: Archived vehicle was not found. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM fleet_vehicles WHERE id = :id AND company_name = :current_company_name)", status: 403, code: FLEET_VEHICLE_COMPANY_SCOPE_REQUIRED, message: Vehicle belongs to another company. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :expected_row_version", status: 409, code: STALE_RECORD, message: Vehicle was changed by another user. Reload before restoring. }
      result: { query: "SELECT * FROM fleet_vehicles WHERE id = :id" }
  - id: upload_fleet_vehicle_attachment
    type: upload
    action: fleet.vehicles.attachments.upload
    handler: attachment_metadata
    permission: fleet.write
    kind: fleet_vehicle_attachment
    params: { vehicle_id: '{state.fleet_vehicle_detail.id}', expected_row_version: '{state.fleet_vehicle_detail.row_version}' }
    refresh: [fleet_vehicle_detail, fleet_vehicle_attachments]
    mutation:
      generated: [attachment_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: FLEET_ATTACHMENT_ACTOR_REQUIRED, message: An authenticated Fleet actor is required. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :vehicle_id AND archived = FALSE AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 404, code: FLEET_ATTACHMENT_VEHICLE_NOT_FOUND, message: Active vehicle was not found in the current company. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :vehicle_id AND row_version = :expected_row_version AND archived = FALSE AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 409, code: STALE_RECORD, message: The vehicle changed before the attachment was uploaded. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:fileName AS VARCHAR))) BETWEEN 1 AND 255 AND CAST(:sizeBytes AS BIGINT) > 0 AND CAST(:sizeBytes AS BIGINT) <= 5242880", status: 422, code: FLEET_ATTACHMENT_INVALID, message: Upload a non-empty attachment up to 5 MB. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM fleet_vehicle_attachments WHERE vehicle_id = :vehicle_id AND active = TRUE AND LOWER(file_name) = LOWER(TRIM(CAST(:fileName AS VARCHAR))))", status: 409, code: FLEET_ATTACHMENT_DUPLICATE, message: This attachment already exists for the vehicle. }
      steps:
        - { query: "INSERT INTO fleet_vehicle_attachments(id, vehicle_id, company_name, file_name, mime_type, size_bytes, storage_key, uploaded_by) SELECT :attachment_id, v.id, v.company_name, TRIM(CAST(:fileName AS VARCHAR)), :mimeType, CAST(:sizeBytes AS BIGINT), :storageKey, :current_user_id FROM fleet_vehicles v WHERE v.id = :vehicle_id", expect_changed: true, status: 404, code: FLEET_ATTACHMENT_VEHICLE_NOT_FOUND, message: Active vehicle was not found. }
        - { query: "UPDATE fleet_vehicles SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :vehicle_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The vehicle changed before the attachment was uploaded. Reload and try again. }
      result: { query: "SELECT id, vehicle_id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM fleet_vehicle_attachments WHERE id = :attachment_id" }
  - id: download_fleet_vehicle_attachment
    type: download
    permission: fleet.read
    kind: fleet_vehicle_attachment
  - id: remove_fleet_vehicle_attachment
    type: server
    permission: fleet.write
    action: fleet.vehicles.attachments.remove
    handler: line_item
    operation: delete
    domain: fleet_vehicle_attachment
    params: { id: '{state.id}', line_id: '{row.id}', parent_expected_row_version: '{state.fleet_vehicle_detail.row_version}' }
    refresh: [fleet_vehicle_detail, fleet_vehicle_attachments]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: FLEET_ATTACHMENT_ACTOR_REQUIRED, message: An authenticated Fleet actor is required. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 404, code: FLEET_ATTACHMENT_VEHICLE_NOT_FOUND, message: Vehicle was not found in the current company. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :parent_expected_row_version AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 409, code: STALE_RECORD, message: The vehicle changed before the attachment was removed. Reload and try again. }
        - { query: "SELECT id FROM fleet_vehicle_attachments WHERE id = :line_id AND vehicle_id = :id AND active = TRUE AND row_version = :expected_row_version", status: 409, code: FLEET_ATTACHMENT_STALE, message: This vehicle attachment changed before it was removed. Reload and try again. }
      steps:
        - { query: "UPDATE fleet_vehicle_attachments SET active = FALSE, row_version = row_version + 1 WHERE id = :line_id AND vehicle_id = :id AND active = TRUE AND row_version = :expected_row_version", expect_changed: true, status: 409, code: FLEET_ATTACHMENT_STALE, message: This vehicle attachment changed before it was removed. Reload and try again. }
        - { query: "UPDATE fleet_vehicles SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The vehicle changed before the attachment was removed. Reload and try again. }
      result: { query: "SELECT TRUE AS deleted, :line_id AS id" }
  - id: add_fleet_vehicle_tag
    type: server_form
    permission: fleet.write
    title: Add Tag
    description: Assign an Odoo vehicle tag to this vehicle.
    action: fleet.vehicles.tags.add
    handler: line_item
    operation: create
    domain: fleet_vehicle_detail
    params: { id: '{state.fleet_vehicle_detail.id}', parent_expected_row_version: '{state.fleet_vehicle_detail.row_version}' }
    refresh: [fleet_vehicle_detail, fleet_vehicle_tag_assignments, fleet_vehicle_tag_options]
    fields:
      - { field: tag_id, label: Tag, type: select, options_source: fleet_vehicle_tag_options, required: true }
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: FLEET_VEHICLE_TAG_ACTOR_REQUIRED, message: An authenticated Fleet actor is required. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND archived = FALSE AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 404, code: FLEET_VEHICLE_TAG_VEHICLE_NOT_FOUND, message: Active vehicle was not found in the current company. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND archived = FALSE AND row_version = :parent_expected_row_version AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 409, code: STALE_RECORD, message: The vehicle changed before the tag was added. Reload and try again. }
        - { query: "SELECT id FROM fleet_vehicle_tags WHERE id = :tag_id", status: 422, code: FLEET_VEHICLE_TAG_INVALID, message: Select a supported vehicle tag. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM fleet_vehicle_tag_rel WHERE vehicle_id = :id AND tag_id = :tag_id)", status: 409, code: FLEET_VEHICLE_TAG_EXISTS, message: This tag is already assigned to the vehicle. }
      steps:
        - { query: "INSERT INTO fleet_vehicle_tag_rel(vehicle_id, tag_id) VALUES(:id, :tag_id)", expect_changed: true, status: 409, code: FLEET_VEHICLE_TAG_CREATE_FAILED, message: The vehicle tag could not be assigned. }
        - { query: "UPDATE fleet_vehicles SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :id AND archived = FALSE AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The vehicle changed before the tag was saved. Reload and try again. }
      result: { query: "SELECT r.vehicle_id, r.tag_id AS id, 1 AS row_version, r.tag_id, t.name, t.color FROM fleet_vehicle_tag_rel r JOIN fleet_vehicle_tags t ON t.id = r.tag_id WHERE r.vehicle_id = :id AND r.tag_id = :tag_id" }
  - id: remove_fleet_vehicle_tag
    type: server
    permission: fleet.write
    action: fleet.vehicles.tags.remove
    handler: line_item
    operation: delete
    domain: fleet_vehicle_tag_assignment
    params: { id: '{state.fleet_vehicle_detail.id}', tag_id: '{row.tag_id}', parent_expected_row_version: '{state.fleet_vehicle_detail.row_version}' }
    refresh: [fleet_vehicle_detail, fleet_vehicle_tag_assignments, fleet_vehicle_tag_options]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: FLEET_VEHICLE_TAG_ACTOR_REQUIRED, message: An authenticated Fleet actor is required. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 404, code: FLEET_VEHICLE_TAG_VEHICLE_NOT_FOUND, message: Vehicle was not found in the current company. }
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :id AND row_version = :parent_expected_row_version AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name))", status: 409, code: STALE_RECORD, message: The vehicle changed before the tag was removed. Reload and try again. }
        - { query: "SELECT tag_id FROM fleet_vehicle_tag_rel WHERE vehicle_id = :id AND tag_id = :tag_id", status: 409, code: FLEET_VEHICLE_TAG_STALE, message: This vehicle tag changed or was removed; reload and try again. }
      steps:
        - { query: "DELETE FROM fleet_vehicle_tag_rel WHERE vehicle_id = :id AND tag_id = :tag_id", expect_changed: true, status: 409, code: FLEET_VEHICLE_TAG_STALE, message: This vehicle tag changed or was removed; reload and try again. }
        - { query: "UPDATE fleet_vehicles SET row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 00:00:00' WHERE id = :id AND row_version = :parent_expected_row_version", expect_changed: true, status: 409, code: STALE_RECORD, message: The vehicle changed before the tag was removed. Reload and try again. }
      result: { query: "SELECT :id AS vehicle_id, :tag_id AS tag_id" }
