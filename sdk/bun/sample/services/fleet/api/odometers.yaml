page: { id: fleet-odometers }
datasources:
  - id: fleet_odometer_vehicles
    permission: fleet.read
    query: "SELECT id AS value, name AS label FROM fleet_vehicles WHERE COALESCE(archived, FALSE) = FALSE ORDER BY name, id"
  - id: fleet_odometers
    permission: fleet.read
    error_states: { transport_error: { status: 503, code: FLEET_ODOMETER_DATA_UNAVAILABLE, message: Fleet odometer data service is temporarily unavailable } }
    query: "SELECT o.id, o.row_version, CAST(o.date AS VARCHAR) AS date, o.vehicle_id, v.name AS vehicle_name, COALESCE(o.driver_name, v.driver_name) AS driver_name, o.value, o.unit FROM fleet_vehicle_odometers o JOIN fleet_vehicles v ON v.id = o.vehicle_id WHERE (:fixture_state IS NULL OR :fixture_state <> 'empty') AND (:q IS NULL OR v.name ILIKE '%' || :q || '%' OR COALESCE(o.driver_name, v.driver_name, '') ILIKE '%' || :q || '%' OR CAST(o.value AS VARCHAR) ILIKE '%' || :q || '%' OR CAST(o.date AS VARCHAR) ILIKE '%' || :q || '%') AND (:vehicle_id IS NULL OR o.vehicle_id = :vehicle_id) ORDER BY o.date DESC, o.id"
actions:
  - { id: view_fleet_odometer, type: navigate, permission: fleet.read, navigate_to: /fleet/odometers/detail, params: { id: '{row.id}' } }
  - id: create_fleet_odometer
    type: server_form
    permission: fleet.write
    title: New odometer log
    action: fleet.odometer.create
    handler: yaml_mutation
    operation: create
    refresh: [fleet_odometers]
    mutation:
      operation: insert
      table: fleet_vehicle_odometers
      fields: [vehicle_id, driver_name, date, value]
      required: [vehicle_id, date, value]
      generated: [id]
      normalize_empty: [driver_name]
      guards:
        - { query: "SELECT id FROM fleet_vehicles WHERE id = :vehicle_id AND COALESCE(archived, FALSE) = FALSE", status: 404, code: FLEET_ODOMETER_VEHICLE_NOT_FOUND, message: Vehicle was not found or is archived. }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(CAST(:date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') AND CAST(:date AS DATE) BETWEEN DATE '2000-01-01' AND DATE '2100-12-31' AND CAST(:value AS DECIMAL(18,2)) >= 0", status: 422, code: FLEET_ODOMETER_VALUE_INVALID, message: Date must be YYYY-MM-DD and odometer value must be zero or greater. }
      result: { query: "SELECT * FROM fleet_vehicle_odometers WHERE id = :id" }
    fields:
      - { field: vehicle_id, label: Vehicle, type: select, options_source: fleet_odometer_vehicles, required: true }
      - { field: date, label: Date, type: text, required: true }
      - { field: value, label: Odometer Value, type: number, required: true }
      - { field: driver_name, label: Driver, type: text }
