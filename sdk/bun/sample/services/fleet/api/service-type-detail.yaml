page: { id: fleet-service-type-detail }
datasources:
  - id: fleet_service_type_detail
    single: true
    permission: fleet.read
    error_states:
      unauthorized: { status: 401, code: FLEET_SERVICE_TYPE_DETAIL_UNAUTHORIZED, message: Sign in to view the fleet service type. }
      forbidden: { status: 403, code: FLEET_SERVICE_TYPE_DETAIL_FORBIDDEN, message: You do not have permission to view this fleet service type. }
      transport_error: { status: 503, code: FLEET_SERVICE_TYPE_DETAIL_UNAVAILABLE, message: Fleet service type details are temporarily unavailable. }
    query: "SELECT id, row_version, name, category, CASE category WHEN 'contract' THEN 'Contract' ELSE 'Service' END AS category_label FROM fleet_service_types WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
actions:
  - id: edit_fleet_service_type_detail
    type: server_form
    permission: fleet.manage
    title: Edit Service Type
    action: fleet.service_types.update
    handler: yaml_mutation
    operation: update
    refresh: [fleet_service_type_detail, fleet_service_types]
    mutation:
      operation: update
      table: fleet_service_types
      fields: [name, category]
      required: [name, category]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_service_types WHERE id = :id", status: 404, code: FLEET_SERVICE_TYPE_NOT_FOUND, message: Service type was not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) BETWEEN 1 AND 120", status: 422, code: FLEET_SERVICE_TYPE_NAME_REQUIRED, message: Service type name is required. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:category, '') IN ('service', 'contract')", status: 422, code: FLEET_SERVICE_TYPE_CATEGORY_INVALID, message: Category must be Service or Contract. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM fleet_service_types WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: FLEET_SERVICE_TYPE_EXISTS, message: A service type with this name already exists. }
      result: { query: "SELECT * FROM fleet_service_types WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: category, label: Category, type: select, required: true, options: [{ value: contract, label: Contract }, { value: service, label: Service }] }
  - id: delete_fleet_service_type_detail
    type: server
    permission: fleet.manage
    action: fleet.service_types.delete
    handler: yaml_mutation
    operation: delete
    refresh: [fleet_service_type_detail, fleet_service_types]
    params: { id: '{row.id}' }
    mutation:
      operation: delete
      table: fleet_service_types
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM fleet_service_types WHERE id = :id", status: 404, code: FLEET_SERVICE_TYPE_NOT_FOUND, message: Service type was not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM fleet_vehicle_services WHERE service_type_id = :id)", status: 409, code: FLEET_SERVICE_TYPE_IN_USE, message: This service type is used by vehicle service logs. }
