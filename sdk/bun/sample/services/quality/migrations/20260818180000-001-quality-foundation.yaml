version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS quality_checks (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        check_type VARCHAR NOT NULL DEFAULT 'Incoming', product_name VARCHAR NOT NULL,
        source_type VARCHAR, source_id VARCHAR, operation VARCHAR, inspector VARCHAR,
        specification VARCHAR, measured_value DECIMAL(18,3), uom VARCHAR, result VARCHAR,
        priority VARCHAR NOT NULL DEFAULT 'Normal', state VARCHAR NOT NULL DEFAULT 'New',
        checked_date DATE, notes VARCHAR, row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS quality_checks_state_idx ON quality_checks(state);
      CREATE INDEX IF NOT EXISTS quality_checks_product_idx ON quality_checks(product_name);
    down: |
      DROP TABLE IF EXISTS quality_checks;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
