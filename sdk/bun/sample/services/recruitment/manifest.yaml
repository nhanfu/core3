id: recruitment
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  recruitment:
    path: /applicants
    label: Recruitment
    icon: recruitment
    permission: recruitment.read
  groups:
    - id: hiring
      label: Hiring
      items:
        - { path: /applicants, label: Applicants, icon: users, permission: recruitment.read }
        - { path: /openings, label: Job Openings, icon: briefcase, permission: recruitment.read }
        - { path: /recruitment/talent-pools, label: By Talent Pools, icon: users, permission: recruitment.read }
    - id: reporting
      label: Reporting
      items:
        - { path: /recruitment-analysis, label: Recruitment Analysis, icon: chart, permission: recruitment.read }
    - id: configuration
      label: Configuration
      items:
        - { path: /recruitment/degrees, label: Degrees, icon: list, permission: recruitment.manage }
