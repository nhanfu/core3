page: { id: applicants }
datasources:
  - id: recruitment_applicant_stages
    permission: recruitment.read
    single: false
    query: "SELECT value, label FROM (VALUES ('New','New'), ('Screening','First screening'), ('Interview','First interview'), ('Offer','Contract proposal'), ('Hired','Contract signed'), ('Rejected','Refused')) stages(value, label)"
  - id: recruitment_opening_lookup
    permission: recruitment.read
    single: false
    query: "SELECT id AS value, name || ' - ' || job_title AS label FROM recruitment_openings WHERE state IN ('Open','Draft') ORDER BY name, id"
  - id: recruitment_applicant_list_refuse_reason_lookup
    permission: recruitment.read
    single: false
    query: "SELECT id AS value, name AS label FROM recruitment_refuse_reasons WHERE active = TRUE ORDER BY sequence, name, id"
  - id: recruitment_applicant_email_templates
    permission: recruitment.read
    single: false
    query: "SELECT id AS value, name AS label FROM recruitment_applicant_mail_templates WHERE active = TRUE ORDER BY name, id"
  - id: recruitment_active_talent_pool_options
    permission: recruitment.write
    single: false
    error_states: { unauthorized: { status: 401, code: RECRUITMENT_TALENT_POOL_ADD_UNAUTHENTICATED, message: Sign in to add applicants to a talent pool. }, forbidden: { status: 403, code: RECRUITMENT_TALENT_POOL_ADD_FORBIDDEN, message: You do not have permission to add applicants to a talent pool. }, transport_error: { status: 503, code: RECRUITMENT_TALENT_POOL_OPTIONS_UNAVAILABLE, message: Active talent pools are temporarily unavailable. } }
    query: "SELECT id AS value, name AS label FROM recruitment_talent_pools WHERE active = TRUE AND (company_name = 'Visible to all' OR COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name) ORDER BY name, id"
  - id: recruitment_applicant_tag_options
    permission: recruitment.write
    single: false
    error_states: { transport_error: { status: 503, code: RECRUITMENT_APPLICANT_TAG_OPTIONS_UNAVAILABLE, message: Applicant tags are temporarily unavailable. } }
    query: "SELECT id AS value, name AS label FROM recruitment_tags ORDER BY sequence, name, id"
  - id: recruitment_applicant_follower_options
    permission: recruitment.write
    single: false
    error_states: { unauthorized: { status: 401, code: RECRUITMENT_FOLLOWERS_UNAUTHENTICATED, message: Sign in to manage applicant followers. }, forbidden: { status: 403, code: RECRUITMENT_FOLLOWERS_FORBIDDEN, message: You do not have permission to manage applicant followers. }, transport_error: { status: 503, code: RECRUITMENT_FOLLOWERS_UNAVAILABLE, message: Follower contacts are temporarily unavailable. } }
    query: "SELECT id AS value, name || ' <' || email || '>' AS label FROM recruitment_follower_contacts WHERE active = TRUE ORDER BY name, id"
  - id: recruitment_applicants
    permission: recruitment.read
    workflow: recruitment_applicants
    error_states: { unauthorized: { status: 401, code: RECRUITMENT_APPLICANTS_UNAUTHENTICATED, message: Sign in to view applicants. }, forbidden: { status: 403, code: RECRUITMENT_APPLICANTS_FORBIDDEN, message: You do not have permission to view applicants. }, transport_error: { status: 503, code: RECRUITMENT_APPLICANTS_UNAVAILABLE, message: Applicants are temporarily unavailable. } }
    query: "SELECT a.id, a.row_version, a.name, a.opening_name, a.email, a.phone, a.source, a.recruiter, a.stage, a.rating, a.priority, a.archived, a.company_name, CAST(a.applied_date AS VARCHAR) AS applied_date, CAST(a.interview_date AS VARCHAR) AS interview_date, CAST(a.activity_date_deadline AS VARCHAR) AS activity_date_deadline, a.activity_type, a.activity_summary, a.activity_exception, a.activity_user FROM recruitment_applicants a WHERE (:q IS NULL OR a.name ILIKE '%' || :q || '%' OR a.email ILIKE '%' || :q || '%' OR a.opening_name ILIKE '%' || :q || '%') AND (:stage IS NULL OR a.stage = :stage) AND (:opening_name IS NULL OR a.opening_name = :opening_name) AND (:priority IS NULL OR a.priority = :priority) AND (:archived IS NULL OR (:archived = 'active' AND a.archived = FALSE) OR (:archived = 'archived' AND a.archived = TRUE)) AND (COALESCE(:current_company_name, '') = '' OR a.company_name = :current_company_name) ORDER BY a.applied_date DESC, a.id"
  - id: recruitment_applicant_activities
    permission: recruitment.read
    single: false
    query: "SELECT a.id, a.row_version, a.name AS applicant, CAST(a.activity_date_deadline AS VARCHAR) AS activity_date_deadline, a.activity_type, a.activity_summary, a.stage, a.activity_exception, a.activity_user FROM recruitment_applicants a WHERE a.activity_date_deadline IS NOT NULL AND (:q IS NULL OR a.name ILIKE '%' || :q || '%' OR a.activity_summary ILIKE '%' || :q || '%' OR a.activity_type ILIKE '%' || :q || '%') AND (:activity_state IS NULL OR (:activity_state = 'overdue' AND a.activity_exception = 'overdue') OR (:activity_state = 'upcoming' AND a.activity_exception <> 'overdue')) AND (COALESCE(:current_company_name, '') = '' OR a.company_name = :current_company_name) ORDER BY a.activity_date_deadline, a.id"
actions:
  - { id: view_recruitment_applicant, type: navigate, permission: recruitment.read, navigate_to: /applicants/detail, params: { id: '{row.id}' } }
  - id: send_recruitment_applicant_email
    type: server_form
    modal_style: mail_composer
    permission: recruitment.write
    title: Send Email
    submit_label: Send
    cancel_label: Cancel
    success_message: Applicant emails sent.
    action: recruitment.applicants.send_email
    handler: yaml_mutation
    operation: bulk_create
    refresh: [recruitment_applicants]
    mutation:
      table: recruitment_applicant_mail_messages
      fields: [subject, body_html, template_id, attachment_name]
      required: [subject]
      defaults: { state: Sent }
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND CAST(:selectedIds AS VARCHAR) NOT LIKE '[]'", status: 400, code: RECRUITMENT_MAIL_SELECTION_REQUIRED, message: Select at least one applicant. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_name, '')), '') IS NOT NULL", status: 403, code: RECRUITMENT_MAIL_ACTOR_REQUIRED, message: A signed-in Recruitment user is required to send applicant email. }
        - { query: "SELECT id FROM recruitment_applicants WHERE id IN :selectedIds LIMIT 1", status: 404, code: RECRUITMENT_MAIL_APPLICANT_NOT_FOUND, message: One or more selected applicants were not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id IN :selectedIds AND COALESCE(:current_company_name, '') <> '' AND a.company_name <> :current_company_name)", status: 403, code: RECRUITMENT_MAIL_COMPANY_FORBIDDEN, message: One or more selected applicants belong to another company. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id IN :selectedIds AND NULLIF(TRIM(COALESCE(a.email, '')), '') IS NULL)", status: 422, code: RECRUITMENT_MAIL_EMAIL_REQUIRED, message: Every selected applicant must have an email address. }
        - { query: "SELECT 1 AS ok WHERE (NULLIF(TRIM(COALESCE(:template_id, '')), '') IS NOT NULL AND EXISTS (SELECT 1 FROM recruitment_applicant_mail_templates t WHERE t.id = :template_id AND t.active = TRUE)) OR (LENGTH(TRIM(CAST(COALESCE(:subject, '') AS VARCHAR))) BETWEEN 1 AND 200 AND LENGTH(CAST(COALESCE(:body_html, '') AS VARCHAR)) BETWEEN 1 AND 10000)", status: 422, code: RECRUITMENT_MAIL_CONTENT_INVALID, message: Enter a subject and a message, or load an active template. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:template_id, '')), '') IS NULL OR EXISTS (SELECT 1 FROM recruitment_applicant_mail_templates t WHERE t.id = :template_id AND t.active = TRUE)", status: 422, code: RECRUITMENT_MAIL_TEMPLATE_INVALID, message: Select an active applicant email template. }
      steps:
        - for_each:
            input: selectedIds
            as: selected_applicant_id
            steps:
              - query: "INSERT INTO recruitment_applicant_mail_messages(id, applicant_id, company_name, applicant_name, recipient_email, subject, body_html, template_id, attachment_name, sent_by, state, sent_at, row_version) SELECT 'recruitment-applicant-mail-' || a.id || '-' || CAST(COALESCE((SELECT COUNT(*) FROM recruitment_applicant_mail_messages prior WHERE prior.applicant_id = a.id), 0) + 1 AS VARCHAR), a.id, a.company_name, a.name, a.email, COALESCE(t.subject, TRIM(CAST(:subject AS VARCHAR))), COALESCE(t.body_html, CAST(COALESCE(:body_html, '') AS VARCHAR)), t.id, NULLIF(TRIM(CAST(COALESCE(:attachment_name, '') AS VARCHAR)), ''), :current_user_name, 'Sent', TIMESTAMP '2026-01-15 09:30:00', 1 FROM recruitment_applicants a LEFT JOIN recruitment_applicant_mail_templates t ON t.id = :template_id AND t.active = TRUE WHERE a.id = :selected_applicant_id AND (COALESCE(:current_company_name, '') = '' OR a.company_name = :current_company_name)"
                expect_changed: true
                status: 409
                code: RECRUITMENT_MAIL_SEND_FAILED
                message: The applicant email could not be sent. Reload the selected applicants and try again.
      result: { query: "SELECT id, applicant_id, applicant_name, recipient_email, subject, body_html, template_id, attachment_name, sent_by, state, CAST(sent_at AS VARCHAR) AS sent_at, row_version FROM recruitment_applicant_mail_messages WHERE applicant_id IN :selectedIds ORDER BY sent_at DESC, id DESC" }
    fields:
      - { field: applicant_names, label: Applications, type: mail_recipient, default: Selected applicants }
      - { field: subject, label: Subject, type: text, required: true }
      - { field: body_html, label: Message, type: mail_body, placeholder: Write your message here... }
      - { field: attachment_name, label: Attachments, type: mail_attachment }
      - { field: template_id, label: Load template, type: select, options_source: recruitment_applicant_email_templates }
  - id: edit_recruitment_applicant_followers
    type: server_form
    permission: recruitment.write
    title: Add/Remove Followers
    submit_label: Update Followers
    cancel_label: Discard
    success_message: Followers updated.
    action: recruitment.applicants.edit_followers
    handler: yaml_mutation
    operation: follower_edit
    refresh: [recruitment_applicants]
    mutation:
      fields: [operation, partner_ids, notify, message]
      required: [operation, partner_ids]
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND CAST(:selectedIds AS VARCHAR) NOT LIKE '[]'", status: 400, code: RECRUITMENT_FOLLOWERS_SELECTION_REQUIRED, message: Select at least one applicant. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_name, '')), '') IS NOT NULL", status: 403, code: RECRUITMENT_FOLLOWERS_ACTOR_REQUIRED, message: A signed-in Recruitment user is required to update followers. }
        - { query: "SELECT 1 AS ok WHERE CAST(:operation AS VARCHAR) IN ('add', 'remove')", status: 422, code: RECRUITMENT_FOLLOWERS_OPERATION_INVALID, message: Choose Add or Remove. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id IN :selectedIds)", status: 404, code: RECRUITMENT_FOLLOWERS_APPLICANT_NOT_FOUND, message: One or more selected applicants were not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id IN :selectedIds AND COALESCE(:current_company_name, '') <> '' AND a.company_name <> :current_company_name)", status: 403, code: RECRUITMENT_FOLLOWERS_COMPANY_FORBIDDEN, message: One or more selected applicants belong to another company. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM recruitment_follower_contacts c WHERE c.id IN :partner_ids AND c.active = TRUE) AND NOT EXISTS (SELECT 1 FROM recruitment_follower_contacts c WHERE c.id IN :partner_ids AND c.active = FALSE)", status: 422, code: RECRUITMENT_FOLLOWERS_CONTACT_INVALID, message: Select active follower contacts only. }
        - { query: "SELECT 1 AS ok WHERE CAST(COALESCE(:notify, FALSE) AS BOOLEAN) = FALSE OR CAST(:operation AS VARCHAR) = 'add'", status: 422, code: RECRUITMENT_FOLLOWERS_NOTIFY_INVALID, message: Notifications can only be sent when adding followers. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(COALESCE(:message, '') AS VARCHAR)) <= 4000", status: 422, code: RECRUITMENT_FOLLOWERS_MESSAGE_INVALID, message: Extra Comments must be 4000 characters or fewer. }
      steps:
        - query: "INSERT INTO recruitment_applicant_follower_events(id, applicant_id, contact_id, operation, notify, message, changed_by) SELECT 'recruitment-follower-event-' || a.id || '-' || c.id || '-' || CAST(COALESCE((SELECT COUNT(*) FROM recruitment_applicant_follower_events prior WHERE prior.applicant_id = a.id AND prior.contact_id = c.id), 0) + 1 AS VARCHAR), a.id, c.id, :operation, CAST(COALESCE(:notify, FALSE) AS BOOLEAN), CAST(COALESCE(:message, '') AS VARCHAR), :current_user_name FROM recruitment_applicants a CROSS JOIN recruitment_follower_contacts c WHERE a.id IN :selectedIds AND c.id IN :partner_ids AND ((:operation = 'add' AND NOT EXISTS (SELECT 1 FROM recruitment_applicant_followers f WHERE f.applicant_id = a.id AND f.contact_id = c.id)) OR (:operation = 'remove' AND EXISTS (SELECT 1 FROM recruitment_applicant_followers f WHERE f.applicant_id = a.id AND f.contact_id = c.id)))"
        - query: "INSERT INTO recruitment_applicant_followers(id, applicant_id, contact_id, company_name, added_by) SELECT 'recruitment-follower-' || a.id || '-' || c.id, a.id, c.id, a.company_name, :current_user_name FROM recruitment_applicants a CROSS JOIN recruitment_follower_contacts c WHERE :operation = 'add' AND a.id IN :selectedIds AND c.id IN :partner_ids AND c.active = TRUE AND NOT EXISTS (SELECT 1 FROM recruitment_applicant_followers f WHERE f.applicant_id = a.id AND f.contact_id = c.id)"
        - query: "DELETE FROM recruitment_applicant_followers WHERE :operation = 'remove' AND applicant_id IN :selectedIds AND contact_id IN :partner_ids"
      result: { query: "SELECT f.applicant_id, f.contact_id, c.name AS contact_name, f.added_by, CAST(f.added_at AS VARCHAR) AS added_at FROM recruitment_applicant_followers f JOIN recruitment_follower_contacts c ON c.id = f.contact_id WHERE f.applicant_id IN :selectedIds ORDER BY f.applicant_id, c.name, c.id" }
    fields:
      - { field: applicant_names, label: Applications, type: mail_recipient, default: Selected applicants }
      - { field: operation, label: Operation, type: radio, options: [{ value: add, label: Add }, { value: remove, label: Remove }], default: add }
      - { field: partner_ids, label: Followers, type: multi-select, options_source: recruitment_applicant_follower_options, multiple: true, required: true, placeholder: Add contacts }
      - { field: notify, label: Notify Recipients, type: checkbox, default: false, show_if: "state.operation === 'add'" }
      - { field: message, label: Extra Comments, type: textarea, placeholder: Extra Comments ..., show_if: "state.operation === 'add' && state.notify === true" }
  - id: add_recruitment_applicants_to_pool
    type: server_form
    permission: recruitment.write
    title: Add Applicants to the Pool
    submit_label: Add to Pool
    cancel_label: Discard
    success_message: Applicants added to the talent pool.
    action: recruitment.applicants.add_to_pool
    handler: yaml_mutation
    operation: bulk_create
    refresh: [recruitment_applicants]
    mutation:
      fields: [pool_ids, tag_ids]
      required: [pool_ids]
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND CAST(:selectedIds AS VARCHAR) NOT LIKE '[]'", status: 400, code: RECRUITMENT_TALENT_POOL_ADD_SELECTION_REQUIRED, message: Select at least one applicant. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_name, '')), '') IS NOT NULL", status: 403, code: RECRUITMENT_TALENT_POOL_ADD_ACTOR_REQUIRED, message: A signed-in Recruitment user is required to add applicants to a talent pool. }
        - { query: "SELECT 1 AS ok WHERE :pool_ids IS NOT NULL AND CAST(:pool_ids AS VARCHAR) NOT LIKE '[]'", status: 400, code: RECRUITMENT_TALENT_POOL_ADD_POOL_REQUIRED, message: Select at least one active talent pool. }
        - { query: "SELECT 1 AS ok FROM recruitment_applicants WHERE id IN :selectedIds", status: 404, code: RECRUITMENT_TALENT_POOL_ADD_APPLICANT_NOT_FOUND, message: One or more selected applicants were not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id IN :selectedIds AND a.archived = TRUE)", status: 409, code: RECRUITMENT_TALENT_POOL_ADD_APPLICANT_INACTIVE, message: Archived applicants cannot be added to a talent pool. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id IN :selectedIds AND COALESCE(:current_company_name, '') <> '' AND a.company_name <> :current_company_name)", status: 403, code: RECRUITMENT_TALENT_POOL_ADD_COMPANY_FORBIDDEN, message: One or more selected applicants belong to another company. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_talent_pools p WHERE p.id IN :pool_ids AND (p.active = FALSE OR (p.company_name <> 'Visible to all' AND COALESCE(:current_company_name, '') <> '' AND p.company_name <> :current_company_name)))", status: 422, code: RECRUITMENT_TALENT_POOL_ADD_POOL_INVALID, message: Select only active talent pools in the current company. }
      steps:
        - query: "INSERT OR IGNORE INTO recruitment_applicants(id, name, opening_id, opening_name, email, phone, source, recruiter, stage, rating, priority, department_name, applied_date, interview_date, hired_date, notes, archived, company_name, pool_applicant_id, is_pool_profile, created_at, updated_at) SELECT 'recruitment-applicant-pool-' || a.id, a.name, a.opening_id, a.opening_name, a.email, a.phone, a.source, a.recruiter, 'New', a.rating, a.priority, a.department_name, a.applied_date, NULL, NULL, a.notes, FALSE, a.company_name, 'recruitment-applicant-pool-' || a.id, TRUE, TIMESTAMP '2026-01-15 09:30:00', TIMESTAMP '2026-01-15 09:30:00' FROM recruitment_applicants a WHERE a.id IN :selectedIds AND a.pool_applicant_id IS NULL AND NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members existing WHERE existing.applicant_id = a.id)"
        - query: "UPDATE recruitment_applicants SET pool_applicant_id = 'recruitment-applicant-pool-' || id, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:30:00' WHERE id IN :selectedIds AND pool_applicant_id IS NULL AND NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members existing WHERE existing.applicant_id = recruitment_applicants.id)"
        - query: "INSERT OR IGNORE INTO recruitment_talent_pool_members(id, pool_id, applicant_id, row_version, created_at, updated_at) SELECT 'talent-member-' || CASE WHEN a.pool_applicant_id IS NOT NULL THEN a.pool_applicant_id WHEN EXISTS (SELECT 1 FROM recruitment_talent_pool_members existing WHERE existing.applicant_id = a.id) THEN a.id ELSE 'recruitment-applicant-pool-' || a.id END || '-' || p.id, p.id, CASE WHEN a.pool_applicant_id IS NOT NULL THEN a.pool_applicant_id WHEN EXISTS (SELECT 1 FROM recruitment_talent_pool_members existing WHERE existing.applicant_id = a.id) THEN a.id ELSE 'recruitment-applicant-pool-' || a.id END, 1, TIMESTAMP '2026-01-15 09:30:00', TIMESTAMP '2026-01-15 09:30:00' FROM recruitment_applicants a CROSS JOIN recruitment_talent_pools p WHERE a.id IN :selectedIds AND p.id IN :pool_ids"
        - for_each:
            input: tag_ids
            as: selected_tag_id
            steps:
              - query: "INSERT OR IGNORE INTO recruitment_applicant_tags(id, applicant_id, tag_id, added_by) SELECT 'recruitment-applicant-tag-' || CASE WHEN a.pool_applicant_id IS NOT NULL THEN a.pool_applicant_id WHEN EXISTS (SELECT 1 FROM recruitment_talent_pool_members existing WHERE existing.applicant_id = a.id) THEN a.id ELSE 'recruitment-applicant-pool-' || a.id END || '-' || :selected_tag_id, CASE WHEN a.pool_applicant_id IS NOT NULL THEN a.pool_applicant_id WHEN EXISTS (SELECT 1 FROM recruitment_talent_pool_members existing WHERE existing.applicant_id = a.id) THEN a.id ELSE 'recruitment-applicant-pool-' || a.id END, :selected_tag_id, :current_user_name FROM recruitment_applicants a WHERE a.id IN :selectedIds"
      result: { query: "SELECT m.id, m.pool_id, m.applicant_id, p.name AS pool_name FROM recruitment_talent_pool_members m JOIN recruitment_talent_pools p ON p.id = m.pool_id WHERE m.applicant_id IN (SELECT COALESCE(pool_applicant_id, id) FROM recruitment_applicants WHERE id IN :selectedIds) AND m.pool_id IN :pool_ids ORDER BY m.applicant_id, m.pool_id" }
    fields:
      - { field: applicant_names, label: Applications, type: mail_recipient, default: Selected applicants }
      - { field: pool_ids, label: Talent Pools, type: multi-select, options_source: recruitment_active_talent_pool_options, multiple: true, required: true, placeholder: Add to... }
      - { field: tag_ids, label: Tags, type: multi-select, options_source: recruitment_applicant_tag_options, multiple: true, placeholder: Optional tags }
  - id: create_recruitment_applicant
    type: server_form
    permission: recruitment.write
    title: New applicant
    action: recruitment.applicants.create
    handler: yaml_mutation
    operation: create
    refresh: [recruitment_applicants]
    mutation: { operation: insert, table: recruitment_applicants, fields: [name, opening_id, opening_name, email, phone, source, recruiter, rating, priority, applied_date, notes], required: [name, opening_id, opening_name, email], defaults: { stage: New, archived: false, applied_date: '2026-01-15' }, result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" } }
    fields:
      - { field: name, label: Applicant, type: text, required: true }
      - { field: opening_id, label: Job position, type: select, options_source: recruitment_opening_lookup, required: true }
      - { field: opening_name, label: Job position name, type: text, required: true }
      - { field: email, label: Email, type: text, required: true }
      - { field: phone, label: Phone, type: text }
      - { field: source, label: Source, type: text }
      - { field: recruiter, label: Recruiter, type: text }
      - { field: priority, label: Priority, type: select, options: [Low, Normal, High], default: Normal }
      - { field: rating, label: Rating, type: select, options: [Excellent, Good, Average] }
      - { field: applied_date, label: Applied date, type: date, default: '2026-01-15' }
      - { field: notes, label: Notes, type: textarea }
  - { id: screen_applicant, type: server, permission: recruitment.write, action: recruitment.applicants.screen, handler: order_transition, workflow: recruitment_applicants, operation: screen, refresh: [recruitment_applicants] }
  - { id: interview_applicant, type: server, permission: recruitment.write, action: recruitment.applicants.interview, handler: order_transition, workflow: recruitment_applicants, operation: interview, refresh: [recruitment_applicants] }
  - { id: offer_applicant, type: server, permission: recruitment.write, action: recruitment.applicants.offer, handler: order_transition, workflow: recruitment_applicants, operation: offer, refresh: [recruitment_applicants] }
  - { id: hire_applicant, type: server, permission: recruitment.manage, action: recruitment.applicants.hire, handler: order_transition, workflow: recruitment_applicants, operation: hire, refresh: [recruitment_applicants] }
  - id: reject_applicant
    type: server_form
    permission: recruitment.manage
    title: Refuse application
    submit_label: Refuse
    cancel_label: Discard
    action: recruitment.applicants.refuse_with_reason
    handler: yaml_mutation
    operation: refuse
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [recruitment_applicants]
    mutation:
      required: [refuse_reason_id]
      guards:
        - { query: "SELECT id FROM recruitment_applicants WHERE id = :id AND stage NOT IN ('Hired', 'Rejected') AND row_version = :expected_row_version", status: 409, code: RECRUITMENT_APPLICANT_REFUSE_STALE, message: Only a current open application can be refused. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM recruitment_applicants WHERE id = :id AND company_name = :current_company_name)", status: 403, code: RECRUITMENT_APPLICANT_COMPANY_SCOPE_REQUIRED, message: The application belongs to another company. }
        - { query: "SELECT id FROM recruitment_refuse_reasons WHERE id = :refuse_reason_id AND active = TRUE", status: 422, code: RECRUITMENT_REFUSE_REASON_INVALID, message: Select an active refusal reason. }
      steps: [{ query: "UPDATE recruitment_applicants SET stage = 'Rejected', archived = TRUE, refuse_reason_id = :refuse_reason_id, refused_date = DATE '2026-01-15', row_version = :expected_row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", expect_changed: true, status: 409, code: STALE_RECORD, message: The application changed by another user. Reload it before refusing. }]
      result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" }
    fields:
      - { field: refuse_reason_id, label: Reason, type: select, options_source: recruitment_applicant_list_refuse_reason_lookup, required: true }
