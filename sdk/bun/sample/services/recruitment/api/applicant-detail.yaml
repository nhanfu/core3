page: { id: applicant-detail }
datasources:
  - id: recruitment_applicant_detail
    single: true
    permission: recruitment.read
    error_states: { unauthorized: { status: 401, code: RECRUITMENT_APPLICANT_UNAUTHENTICATED, message: Sign in to view this applicant. }, forbidden: { status: 403, code: RECRUITMENT_APPLICANT_FORBIDDEN, message: You do not have permission to view this applicant. }, missing_record: { status: 404, code: RECRUITMENT_APPLICANT_NOT_FOUND, message: Applicant not found. }, transport_error: { status: 503, code: RECRUITMENT_APPLICANT_UNAVAILABLE, message: Applicant details are temporarily unavailable. } }
    query: "SELECT a.id, a.row_version, a.name, a.opening_id, a.opening_name, a.email, a.phone, a.source, a.recruiter, a.stage, a.rating, a.priority, a.department_name, a.notes, a.archived, a.company_name, a.employee_id, COALESCE(a.employee_name, '') AS employee_name, a.refuse_reason_id, COALESCE(rr.name, '') AS refuse_reason_name, COALESCE((SELECT string_agg(c.name, ', ' ORDER BY c.name) FROM recruitment_applicant_followers f JOIN recruitment_follower_contacts c ON c.id = f.contact_id WHERE f.applicant_id = a.id), '') AS follower_names, (SELECT COUNT(*) FROM recruitment_applicant_followers f WHERE f.applicant_id = a.id) AS follower_count, EXISTS (SELECT 1 FROM recruitment_talent_pool_members m WHERE m.applicant_id = a.id) AS is_pool_applicant, (SELECT COUNT(*) FROM recruitment_applicants created WHERE created.pool_applicant_id = a.id) AS created_application_count, CAST(a.applied_date AS VARCHAR) AS applied_date, CAST(a.interview_date AS VARCHAR) AS interview_date, CAST(a.hired_date AS VARCHAR) AS hired_date, CAST(a.refused_date AS VARCHAR) AS refused_date FROM recruitment_applicants a LEFT JOIN recruitment_refuse_reasons rr ON rr.id = a.refuse_reason_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END = TRUE AND a.id = :id AND (COALESCE(:current_company_name, '') = '' OR a.company_name = :current_company_name)"
  - id: recruitment_applicant_refuse_reason_lookup
    permission: recruitment.read
    query: "SELECT id AS value, name AS label FROM recruitment_refuse_reasons WHERE active = TRUE ORDER BY sequence, name, id"
  - id: recruitment_applicant_job_application_options
    permission: recruitment.write
    single: false
    error_states: { unauthorized: { status: 401, code: RECRUITMENT_JOB_APPLICATIONS_UNAUTHENTICATED, message: Sign in to create applications. }, forbidden: { status: 403, code: RECRUITMENT_JOB_APPLICATIONS_FORBIDDEN, message: You do not have permission to create applications. }, transport_error: { status: 503, code: RECRUITMENT_JOB_APPLICATIONS_UNAVAILABLE, message: Job positions are temporarily unavailable. } }
    query: "SELECT id AS value, name || ' — ' || job_title AS label FROM recruitment_openings WHERE state <> 'Archived' ORDER BY name, id"
actions:
  - id: view_recruitment_applicant_employee
    type: navigate
    permission: employees.read
    navigate_to: /employees/detail
    params: { id: '{state.employee_id}' }
  - id: create_employee_from_recruitment_applicant
    type: server
    permission: employees.write
    action: recruitment.applicants.create_employee
    handler: yaml_mutation
    operation: create
    params: { id: '{state.id}', expected_row_version: '{state.recruitment_applicant_detail.row_version}' }
    refresh: [recruitment_applicant_detail, recruitment_applicants, employees]
    mutation:
      guards:
        - query: "SELECT 'employee-recruitment-' || regexp_replace(lower(trim(CAST(a.id AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS employee_id, 'RECRUIT-' || upper(regexp_replace(lower(trim(CAST(a.id AS VARCHAR))), '[^a-z0-9]+', '-', 'g')) AS employee_number, TRIM(a.name) AS employee_name, TRIM(COALESCE(a.email, '')) AS employee_email, TRIM(COALESCE(a.phone, '')) AS employee_phone, TRIM(COALESCE(a.department_name, '')) AS department_name, TRIM(COALESCE(o.job_title, a.opening_name)) AS job_title, a.company_name FROM recruitment_applicants a LEFT JOIN recruitment_openings o ON o.id = a.opening_id WHERE a.id = :id AND a.row_version = :expected_row_version AND a.stage = 'Hired' AND a.archived = FALSE AND a.employee_id IS NULL"
          assign: true
          status: 409
          code: RECRUITMENT_CREATE_EMPLOYEE_NOT_READY
          message: Only a current hired applicant without an employee can be converted.
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: RECRUITMENT_CREATE_EMPLOYEE_ACTOR_REQUIRED, message: A signed-in HR user is required to create an employee. }
        - { query: "SELECT 1 AS ok FROM recruitment_applicants WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: RECRUITMENT_CREATE_EMPLOYEE_COMPANY_FORBIDDEN, message: The applicant belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:employee_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: RECRUITMENT_CREATE_EMPLOYEE_NAME_REQUIRED, message: Please provide an applicant name before creating an employee. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employees WHERE id = :employee_id OR employee_number = :employee_number)", status: 409, code: RECRUITMENT_CREATE_EMPLOYEE_EXISTS, message: An employee has already been created for this applicant. }
      steps:
        - query: "INSERT INTO employees(id, employee_number, name, work_email, phone, department_name, job_title, employment_type, hire_date, state, active, company_name, row_version, created_at, updated_at) VALUES(:employee_id, :employee_number, :employee_name, NULLIF(:employee_email, ''), NULLIF(:employee_phone, ''), NULLIF(:department_name, ''), NULLIF(:job_title, ''), 'Employee', DATE '2026-01-15', 'Active', TRUE, :company_name, 1, TIMESTAMP '2026-01-15 09:00:00', TIMESTAMP '2026-01-15 09:00:00')"
        - query: "UPDATE recruitment_applicants SET employee_id = :employee_id, employee_name = :employee_name, row_version = row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :expected_row_version AND employee_id IS NULL"
          expect_changed: true
          status: 409
          code: RECRUITMENT_CREATE_EMPLOYEE_STALE
          message: The applicant changed before the employee was created. Reload and try again.
      result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" }
  - id: reopen_applicant_detail
    type: server
    permission: recruitment.write
    action: recruitment.applicants.reopen
    handler: order_transition
    workflow: recruitment_applicants
    operation: reopen
    # handleAction supplies the numeric row version from the loaded detail
    # record. Do not interpolate it here: interpolation serializes values as
    # strings before the guarded SQL mutation is executed.
    params: { id: '{state.id}' }
    refresh: [recruitment_applicant_detail, recruitment_applicants]
  - { id: screen_applicant_detail, type: server, permission: recruitment.write, action: recruitment.applicants.screen, handler: order_transition, workflow: recruitment_applicants, operation: screen, params: { id: '{state.id}' }, refresh: [recruitment_applicant_detail] }
  - { id: interview_applicant_detail, type: server, permission: recruitment.write, action: recruitment.applicants.interview, handler: order_transition, workflow: recruitment_applicants, operation: interview, params: { id: '{state.id}' }, refresh: [recruitment_applicant_detail] }
  - { id: offer_applicant_detail, type: server, permission: recruitment.write, action: recruitment.applicants.offer, handler: order_transition, workflow: recruitment_applicants, operation: offer, params: { id: '{state.id}' }, refresh: [recruitment_applicant_detail] }
  - { id: hire_applicant_detail, type: server, permission: recruitment.manage, action: recruitment.applicants.hire, handler: order_transition, workflow: recruitment_applicants, operation: hire, params: { id: '{state.id}' }, refresh: [recruitment_applicant_detail] }
  - id: create_recruitment_applications_from_detail
    type: server_form
    permission: recruitment.write
    title: Create Applications
    description: Create a new application for each selected job position.
    submit_label: Create Applications
    cancel_label: Discard
    success_message: Applications created.
    action: recruitment.applicants.create_applications
    handler: yaml_mutation
    operation: bulk_create
    params: { source_applicant_id: '{state.id}' }
    refresh: [recruitment_applicant_detail, recruitment_applicants, recruitment_openings]
    mutation:
      fields: [job_ids]
      required: [job_ids]
      guards:
        - { query: "SELECT 1 AS ok WHERE :job_ids IS NOT NULL AND CAST(:job_ids AS VARCHAR) NOT LIKE '[]'", status: 400, code: RECRUITMENT_JOB_APPLICATIONS_JOB_REQUIRED, message: Select at least one job position. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_name, '')), '') IS NOT NULL", status: 403, code: RECRUITMENT_JOB_APPLICATIONS_ACTOR_REQUIRED, message: A signed-in Recruitment user is required to create applications. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id = :source_applicant_id AND a.archived = FALSE AND EXISTS (SELECT 1 FROM recruitment_talent_pool_members m WHERE m.applicant_id = a.id))", status: 404, code: RECRUITMENT_JOB_APPLICATIONS_APPLICANT_NOT_FOUND, message: The selected applicant is not a talent-pool applicant. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id = :source_applicant_id AND a.row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR a.company_name = :current_company_name))", status: 409, code: RECRUITMENT_JOB_APPLICATIONS_STALE, message: The applicant changed before applications were created. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM recruitment_openings o WHERE o.id IN :job_ids AND o.state <> 'Archived')", status: 422, code: RECRUITMENT_JOB_APPLICATIONS_JOB_INVALID, message: Select an active job position. }
      steps:
        - query: "INSERT INTO recruitment_applicants(id, name, opening_id, opening_name, email, phone, source, recruiter, stage, rating, priority, department_name, applied_date, interview_date, hired_date, notes, archived, company_name, pool_applicant_id, created_at, updated_at) SELECT 'recruitment-applicant-job-' || regexp_replace(lower(a.id || '-' || o.id), '[^a-z0-9]+', '-', 'g') || '-' || CAST(COALESCE((SELECT COUNT(*) FROM recruitment_applicants prior WHERE prior.pool_applicant_id = a.id AND prior.opening_id = o.id), 0) + 1 AS VARCHAR), a.name, o.id, o.name, a.email, a.phone, a.source, a.recruiter, COALESCE((SELECT s.name FROM recruitment_stages s WHERE s.fold = FALSE ORDER BY s.sequence, s.id LIMIT 1), 'New'), a.rating, a.priority, a.department_name, DATE '2026-01-15', NULL, NULL, a.notes, FALSE, a.company_name, a.id, TIMESTAMP '2026-01-15 09:30:00', TIMESTAMP '2026-01-15 09:30:00' FROM recruitment_applicants a CROSS JOIN recruitment_openings o WHERE a.id = :source_applicant_id AND o.id IN :job_ids AND o.state <> 'Archived'"
      result: { query: "SELECT created.id, created.pool_applicant_id, created.name, created.opening_id, created.opening_name, created.stage, created.company_name FROM recruitment_applicants created WHERE created.pool_applicant_id = :source_applicant_id AND created.opening_id IN :job_ids ORDER BY created.id" }
    fields:
      - { field: job_ids, label: Job Positions, type: multi-select, options_source: recruitment_applicant_job_application_options, multiple: true, required: true, placeholder: Move to... }
  - id: reject_applicant_detail
    type: server_form
    permission: recruitment.manage
    title: Refuse application
    submit_label: Refuse
    cancel_label: Discard
    action: recruitment.applicants.refuse_with_reason
    handler: yaml_mutation
    operation: refuse
    params: { id: '{state.id}', expected_row_version: '{state.recruitment_applicant_detail.row_version}' }
    refresh: [recruitment_applicant_detail, recruitment_applicants]
    mutation:
      required: [refuse_reason_id]
      guards:
        - { query: "SELECT id FROM recruitment_applicants WHERE id = :id AND stage NOT IN ('Hired', 'Rejected') AND row_version = :expected_row_version", status: 409, code: RECRUITMENT_APPLICANT_REFUSE_STALE, message: Only a current open application can be refused. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR EXISTS (SELECT 1 FROM recruitment_applicants WHERE id = :id AND company_name = :current_company_name)", status: 403, code: RECRUITMENT_APPLICANT_COMPANY_SCOPE_REQUIRED, message: The application belongs to another company. }
        - { query: "SELECT id FROM recruitment_refuse_reasons WHERE id = :refuse_reason_id AND active = TRUE", status: 422, code: RECRUITMENT_REFUSE_REASON_INVALID, message: Select an active refusal reason. }
      steps: [{ query: "UPDATE recruitment_applicants SET stage = 'Rejected', archived = TRUE, refuse_reason_id = :refuse_reason_id, refused_date = DATE '2026-01-15', row_version = :expected_row_version + 1, updated_at = TIMESTAMP '2026-01-15 09:00:00' WHERE id = :id AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", expect_changed: true, status: 409, code: STALE_RECORD, message: The application changed by another user. Reload it before refusing. }]
      result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" }
    fields:
      - { field: refuse_reason_id, label: Reason, type: select, options_source: recruitment_applicant_refuse_reason_lookup, required: true }
