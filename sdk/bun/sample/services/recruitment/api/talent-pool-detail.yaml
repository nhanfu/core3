page: { id: recruitment-talent-pool-detail }
datasources:
  - id: recruitment_talent_pool_detail
    single: true
    permission: recruitment.read
    error_states:
      forbidden: { status: 403, code: RECRUITMENT_TALENT_POOL_DETAIL_FORBIDDEN, message: You do not have permission to view this talent pool. }
      transport_error: { status: 503, code: RECRUITMENT_TALENT_POOL_DETAIL_UNAVAILABLE, message: Talent pool details are temporarily unavailable. }
    query: "SELECT p.id, p.row_version, p.name, p.pool_manager, p.tags, p.company_name, p.color, p.description, p.active, CASE WHEN p.active THEN 'Active' ELSE 'Archived' END AS active_label, COUNT(m.id) AS talent_count, CAST(COUNT(m.id) AS VARCHAR) || ' talents in this pool' AS talent_summary, 'Manage applicant membership from the Talents action.' AS membership_help FROM recruitment_talent_pools p LEFT JOIN recruitment_talent_pool_members m ON m.pool_id = p.id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END = TRUE AND p.id = :id GROUP BY p.id, p.row_version, p.name, p.pool_manager, p.tags, p.company_name, p.color, p.description, p.active ORDER BY p.id"
  - id: recruitment_pool_applicant_options
    permission: recruitment.manage
    error_states: { transport_error: { status: 503, code: RECRUITMENT_POOL_APPLICANTS_UNAVAILABLE, message: Applicant choices are temporarily unavailable. } }
    query: "SELECT a.id AS value, a.name || ' — ' || COALESCE(a.opening_name, 'No opening') AS label FROM recruitment_applicants a WHERE a.archived = FALSE AND NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members m WHERE m.pool_id = :id AND m.applicant_id = a.id) ORDER BY a.name, a.id"
actions:
  - { id: back_to_recruitment_talent_pools, type: navigate, permission: recruitment.read, navigate_to: /recruitment/talent-pools }
  - { id: view_recruitment_talent_pool_talents, type: navigate, permission: recruitment.read, navigate_to: /recruitment/talent-pools/talents, params: { pool_id: '{state.id}' } }
  - id: add_recruitment_pool_talent
    type: server_form
    permission: recruitment.manage
    title: Add applicant(s) to the pool
    action: recruitment.talent_pools.add_applicant
    handler: yaml_mutation
    operation: create
    params: { pool_id: '{state.id}' }
    prefill: { pool_id: '{state.id}' }
    refresh: [recruitment_talent_pool_detail, recruitment_talent_pool_members, recruitment_pool_applicant_options]
    mutation:
      operation: insert
      table: recruitment_talent_pool_members
      generated: [id]
      fields: [pool_id, applicant_id]
      required: [pool_id, applicant_id]
      guards:
        - { query: "SELECT id FROM recruitment_talent_pools WHERE id = :pool_id AND active = TRUE", status: 404, code: RECRUITMENT_TALENT_POOL_NOT_FOUND, message: Active talent pool not found. }
        - { query: "SELECT id FROM recruitment_applicants WHERE id = :applicant_id AND archived = FALSE", status: 404, code: RECRUITMENT_APPLICANT_NOT_FOUND, message: Applicant not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members WHERE pool_id = :pool_id AND applicant_id = :applicant_id)", status: 409, code: RECRUITMENT_TALENT_POOL_MEMBER_EXISTS, message: This applicant is already in the talent pool. }
      result: { query: "SELECT * FROM recruitment_talent_pool_members WHERE id = :id" }
    fields:
      - { field: pool_id, label: Talent Pool, type: hidden }
      - { field: applicant_id, label: Applicants, type: select, options_source: recruitment_pool_applicant_options, required: true }
  - id: edit_recruitment_talent_pool
    type: server_form
    permission: recruitment.manage
    title: Edit Talent Pool
    action: recruitment.talent_pools.update
    handler: yaml_mutation
    operation: update
    prefill: source
    prefill_source: recruitment_talent_pool_detail
    refresh: [recruitment_talent_pool_detail, recruitment_talent_pools]
    mutation: { operation: update, table: recruitment_talent_pools, fields: [name, pool_manager, tags, company_name, color, description, active], required: [name], concurrency: { required: true }, guards: [{ query: "SELECT id FROM recruitment_talent_pools WHERE id = :id", status: 404, code: RECRUITMENT_TALENT_POOL_NOT_FOUND, message: Talent pool not found. }, { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_talent_pools WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: RECRUITMENT_TALENT_POOL_NAME_EXISTS, message: A talent pool with this title already exists. }], result: { query: "SELECT * FROM recruitment_talent_pools WHERE id = :id" } }
    fields: [{ field: name, label: Title, type: text, required: true }, { field: pool_manager, label: Pool Manager, type: text }, { field: tags, label: Tags, type: text }, { field: company_name, label: Company, type: text }, { field: color, label: Color, type: number, min: 0, max: 11 }, { field: description, label: Description, type: textarea }, { field: active, label: Active, type: checkbox }]
  - { id: archive_recruitment_talent_pool, type: server, permission: recruitment.manage, action: recruitment.talent_pools.archive, handler: yaml_mutation, operation: update, refresh: [recruitment_talent_pool_detail, recruitment_talent_pools], params: { id: '{state.id}', values: { active: false } }, mutation: { operation: update, table: recruitment_talent_pools, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM recruitment_talent_pools WHERE id = :id" } } }
  - { id: restore_recruitment_talent_pool, type: server, permission: recruitment.manage, action: recruitment.talent_pools.restore, handler: yaml_mutation, operation: update, refresh: [recruitment_talent_pool_detail, recruitment_talent_pools], params: { id: '{state.id}', values: { active: true } }, mutation: { operation: update, table: recruitment_talent_pools, fields: [active], concurrency: { required: true }, result: { query: "SELECT * FROM recruitment_talent_pools WHERE id = :id" } } }
  - { id: delete_recruitment_talent_pool, type: server, permission: recruitment.manage, action: recruitment.talent_pools.delete, handler: yaml_mutation, operation: delete, refresh: [recruitment_talent_pools], params: { id: '{state.id}' }, mutation: { operation: delete, table: recruitment_talent_pools, concurrency: { required: true }, guards: [{ query: "SELECT id FROM recruitment_talent_pools WHERE id = :id", status: 404, code: RECRUITMENT_TALENT_POOL_NOT_FOUND, message: Talent pool not found. }, { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members WHERE pool_id = :id)", status: 409, code: RECRUITMENT_TALENT_POOL_HAS_TALENTS, message: Remove all talents before deleting this pool. }] } }
