page: { id: recruitment-degrees }
datasources:
  - id: recruitment_degrees
    permission: recruitment.manage
    error_states: { transport_error: { status: 503, code: RECRUITMENT_DEGREES_UNAVAILABLE, message: Recruitment degrees are temporarily unavailable. } }
    query: "SELECT id, row_version, name, score, sequence FROM recruitment_degrees WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR name ILIKE '%' || :q || '%') ORDER BY sequence, name, id"
actions:
  - id: create_recruitment_degree
    type: server_form
    permission: recruitment.manage
    title: New Degree
    action: recruitment.degrees.create
    handler: yaml_mutation
    operation: create
    refresh: [recruitment_degrees]
    mutation:
      operation: insert
      table: recruitment_degrees
      generated: [id]
      fields: [name, score, sequence]
      required: [name]
      defaults: { score: 0, sequence: 10 }
      guards:
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_degrees WHERE LOWER(name) = LOWER(:name))", status: 409, code: RECRUITMENT_DEGREE_NAME_EXISTS, message: A recruitment degree with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:score AS DOUBLE) >= 0 AND TRY_CAST(:score AS DOUBLE) <= 1", status: 422, code: RECRUITMENT_DEGREE_SCORE_INVALID, message: Score must be between 0% and 100%. }
      result: { query: "SELECT * FROM recruitment_degrees WHERE id = :id" }
    fields: [{ field: name, label: Degree Name, type: text, required: true }, { field: score, label: Score, type: number, required: true, min: 0, max: 1, step: 0.01 }, { field: sequence, label: Sequence, type: number, required: true, min: 1, step: 1 }]
  - id: edit_recruitment_degree
    type: server_form
    permission: recruitment.manage
    title: Edit Degree
    action: recruitment.degrees.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [recruitment_degrees]
    mutation:
      operation: update
      table: recruitment_degrees
      fields: [name, score, sequence]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_degrees WHERE LOWER(name) = LOWER(:name) AND id <> :id)", status: 409, code: RECRUITMENT_DEGREE_NAME_EXISTS, message: A recruitment degree with this name already exists. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:score AS DOUBLE) >= 0 AND TRY_CAST(:score AS DOUBLE) <= 1", status: 422, code: RECRUITMENT_DEGREE_SCORE_INVALID, message: Score must be between 0% and 100%. }
      result: { query: "SELECT * FROM recruitment_degrees WHERE id = :id" }
    fields: [{ field: name, label: Degree Name, type: text, required: true }, { field: score, label: Score, type: number, required: true, min: 0, max: 1, step: 0.01 }, { field: sequence, label: Sequence, type: number, required: true, min: 1, step: 1 }]
  - id: delete_recruitment_degree
    type: server
    permission: recruitment.manage
    action: recruitment.degrees.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete degree {{row.name}}?'
    refresh: [recruitment_degrees]
    mutation:
      operation: delete
      table: recruitment_degrees
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM recruitment_degrees WHERE id = :id", status: 404, code: RECRUITMENT_DEGREE_NOT_FOUND, message: Recruitment degree not found. }]
