page: { id: recruitment-talent-pool-talents }
datasources:
  - id: recruitment_talent_pool_members
    permission: recruitment.read
    error_states:
      forbidden: { status: 403, code: RECRUITMENT_TALENT_POOL_MEMBERS_FORBIDDEN, message: You do not have permission to view pool talents. }
      transport_error: { status: 503, code: RECRUITMENT_TALENT_POOL_MEMBERS_UNAVAILABLE, message: Pool talents are temporarily unavailable. }
    query: "SELECT m.id, m.row_version, m.pool_id, p.name AS pool_name, a.id AS applicant_id, a.name AS applicant_name, CAST(a.applied_date AS VARCHAR) AS applied_date, a.stage, COALESCE(a.rating, 'Not rated') AS matching, COALESCE(a.source, '—') AS tags, COALESCE(a.recruiter, 'Unassigned') AS recruiter, (SELECT COUNT(*) FROM recruitment_applicants created WHERE created.pool_applicant_id = a.id) AS created_application_count FROM recruitment_talent_pool_members m JOIN recruitment_talent_pools p ON p.id = m.pool_id JOIN recruitment_applicants a ON a.id = m.applicant_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN FALSE ELSE TRUE END = TRUE AND m.pool_id = :pool_id AND (:q IS NULL OR a.name ILIKE '%' || :q || '%' OR COALESCE(a.recruiter, '') ILIKE '%' || :q || '%' OR COALESCE(a.source, '') ILIKE '%' || :q || '%') ORDER BY a.name, a.id"
  - id: recruitment_pool_member_applicant_options
    permission: recruitment.manage
    error_states: { transport_error: { status: 503, code: RECRUITMENT_POOL_APPLICANTS_UNAVAILABLE, message: Applicant choices are temporarily unavailable. } }
    query: "SELECT a.id AS value, a.name || ' — ' || COALESCE(a.opening_name, 'No opening') AS label FROM recruitment_applicants a WHERE a.archived = FALSE AND NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members m WHERE m.pool_id = :pool_id AND m.applicant_id = a.id) ORDER BY a.name, a.id"
  - id: recruitment_job_application_options
    permission: recruitment.manage
    single: false
    error_states: { unauthorized: { status: 401, code: RECRUITMENT_JOB_APPLICATIONS_UNAUTHENTICATED, message: Sign in to create applications. }, forbidden: { status: 403, code: RECRUITMENT_JOB_APPLICATIONS_FORBIDDEN, message: You do not have permission to create applications. }, transport_error: { status: 503, code: RECRUITMENT_JOB_APPLICATIONS_UNAVAILABLE, message: Job positions are temporarily unavailable. } }
    query: "SELECT id AS value, name || ' — ' || job_title AS label FROM recruitment_openings WHERE state <> 'Archived' ORDER BY name, id"
actions:
  - { id: view_recruitment_pool_applicant, type: navigate, permission: recruitment.read, navigate_to: /applicants/detail, params: { id: '{row.applicant_id}' } }
  - id: create_recruitment_applications
    type: server_form
    permission: recruitment.manage
    title: Create Applications
    description: Create a new application for each selected job position.
    submit_label: Create Applications
    cancel_label: Discard
    success_message: Applications created.
    action: recruitment.talent_pools.create_applications
    handler: yaml_mutation
    operation: bulk_create
    refresh: [recruitment_talent_pool_members, recruitment_applicants, recruitment_openings]
    mutation:
      fields: [job_ids]
      required: [job_ids]
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL AND CAST(:selectedIds AS VARCHAR) NOT LIKE '[]'", status: 400, code: RECRUITMENT_JOB_APPLICATIONS_SELECTION_REQUIRED, message: Select at least one applicant. }
        - { query: "SELECT 1 AS ok WHERE :job_ids IS NOT NULL AND CAST(:job_ids AS VARCHAR) NOT LIKE '[]'", status: 400, code: RECRUITMENT_JOB_APPLICATIONS_JOB_REQUIRED, message: Select at least one job position. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(COALESCE(:current_user_name, '')), '') IS NOT NULL", status: 403, code: RECRUITMENT_JOB_APPLICATIONS_ACTOR_REQUIRED, message: A signed-in Recruitment user is required to create applications. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members m JOIN recruitment_applicants a ON a.id = m.applicant_id WHERE m.id IN :selectedIds AND (a.archived = TRUE OR (COALESCE(:current_company_name, '') <> '' AND a.company_name <> :current_company_name)))", status: 403, code: RECRUITMENT_JOB_APPLICATIONS_COMPANY_FORBIDDEN, message: Selected applicants are outside the current company or are archived. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM recruitment_talent_pool_members m WHERE m.id IN :selectedIds) AND NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members m WHERE m.id IN :selectedIds AND NOT EXISTS (SELECT 1 FROM recruitment_applicants a WHERE a.id = m.applicant_id))", status: 404, code: RECRUITMENT_JOB_APPLICATIONS_APPLICANT_NOT_FOUND, message: One or more selected applicants were not found. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM recruitment_openings o WHERE o.id IN :job_ids AND o.state <> 'Archived')", status: 422, code: RECRUITMENT_JOB_APPLICATIONS_JOB_INVALID, message: Select an active job position. }
      steps:
        - query: "INSERT INTO recruitment_applicants(id, name, opening_id, opening_name, email, phone, source, recruiter, stage, rating, priority, department_name, applied_date, interview_date, hired_date, notes, archived, company_name, pool_applicant_id, created_at, updated_at) SELECT 'recruitment-applicant-job-' || regexp_replace(lower(a.id || '-' || o.id), '[^a-z0-9]+', '-', 'g') || '-' || CAST(COALESCE((SELECT COUNT(*) FROM recruitment_applicants prior WHERE prior.pool_applicant_id = a.id AND prior.opening_id = o.id), 0) + 1 AS VARCHAR), a.name, o.id, o.name, a.email, a.phone, a.source, a.recruiter, COALESCE((SELECT s.name FROM recruitment_stages s WHERE s.fold = FALSE ORDER BY s.sequence, s.id LIMIT 1), 'New'), a.rating, a.priority, a.department_name, DATE '2026-01-15', NULL, NULL, a.notes, FALSE, a.company_name, a.id, TIMESTAMP '2026-01-15 09:30:00', TIMESTAMP '2026-01-15 09:30:00' FROM recruitment_talent_pool_members m JOIN recruitment_applicants a ON a.id = m.applicant_id CROSS JOIN recruitment_openings o WHERE m.id IN :selectedIds AND o.id IN :job_ids AND o.state <> 'Archived'"
      result: { query: "SELECT created.id, created.pool_applicant_id, created.name, created.opening_id, created.opening_name, created.stage, created.company_name FROM recruitment_applicants created WHERE created.pool_applicant_id IN (SELECT m.applicant_id FROM recruitment_talent_pool_members m WHERE m.id IN :selectedIds) AND created.opening_id IN :job_ids ORDER BY created.id" }
    fields:
      - { field: job_ids, label: Job Positions, type: multi-select, options_source: recruitment_job_application_options, multiple: true, required: true, placeholder: Move to... }
  - id: add_recruitment_pool_talent
    type: server_form
    permission: recruitment.manage
    title: Add applicant(s) to the pool
    action: recruitment.talent_pools.add_applicant
    handler: yaml_mutation
    operation: create
    params: { pool_id: '{state.pool_id}' }
    prefill: { pool_id: '{state.pool_id}' }
    refresh: [recruitment_talent_pool_members, recruitment_pool_member_applicant_options, recruitment_talent_pool_detail]
    mutation:
      operation: insert
      table: recruitment_talent_pool_members
      generated: [id]
      fields: [pool_id, applicant_id]
      required: [pool_id, applicant_id]
      guards:
        - { query: "SELECT id FROM recruitment_talent_pools WHERE id = :pool_id AND active = TRUE", status: 404, code: RECRUITMENT_TALENT_POOL_NOT_FOUND, message: Active talent pool not found. }
        - { query: "SELECT id FROM recruitment_applicants WHERE id = :applicant_id AND archived = FALSE", status: 404, code: RECRUITMENT_APPLICANT_NOT_FOUND, message: Applicant not found. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM recruitment_talent_pool_members WHERE pool_id = :pool_id AND applicant_id = :applicant_id)", status: 409, code: RECRUITMENT_TALENT_POOL_MEMBER_EXISTS, message: This applicant is already in the talent pool. }
      result: { query: "SELECT * FROM recruitment_talent_pool_members WHERE id = :id" }
    fields:
      - { field: pool_id, label: Talent Pool, type: hidden }
      - { field: applicant_id, label: Applicants, type: select, options_source: recruitment_pool_member_applicant_options, required: true }
  - id: remove_recruitment_pool_talent
    type: server
    permission: recruitment.manage
    action: recruitment.talent_pools.remove_applicant
    handler: yaml_mutation
    operation: delete
    refresh: [recruitment_talent_pool_members, recruitment_talent_pool_detail]
    mutation:
      operation: delete
      table: recruitment_talent_pool_members
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM recruitment_talent_pool_members WHERE id = :id", status: 404, code: RECRUITMENT_TALENT_POOL_MEMBER_NOT_FOUND, message: Talent pool membership not found. }
