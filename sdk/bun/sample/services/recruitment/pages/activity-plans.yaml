title: Recruitment Plans
page: { id: recruitment-activity-plans, route: /recruitment/activity-plans, breadcrumb: [Recruitment, Configuration, Activities, Activity Plans], auth: { require: [recruitment.manage] } }
components:
  - type: ListView
    variant: odoo
    source: recruitment_activity_plans
    create_action: create_recruitment_activity_plan
    create_label: New
    search: { label: Search activity plans, placeholder: Search activity plans... }
    filters: [{ field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: name
        card:
          title: name
          subtitle: res_model_label
          fields: [{ field: steps_count, label: Steps }, { field: company_name, label: Company }]
    columns:
      - { field: name, label: Name, type: PrimaryEntityCell, sortable: true, mobile: true }
      - { field: res_model_label, label: Applies to, sortable: true, mobile: false }
      - { field: steps_count, label: Activities, type: Number, sortable: true }
      - { field: company_name, label: Company, sortable: true, mobile: false }
      - { field: active_label, label: Status, type: StatusChip, mobile: false }
      - { field: id, label: '', sortable: false, actions: [{ id: edit_recruitment_activity_plan, label: Edit, icon: edit }, { id: archive_recruitment_activity_plan, label: Archive, icon: archive, variant: danger, show_if: 'row.active === true' }, { id: restore_recruitment_activity_plan, label: Restore, icon: restore, show_if: 'row.active === false' }, { id: delete_recruitment_activity_plan, label: Delete, icon: delete, variant: danger }] }
    row_key: id
    row_open_action: edit_recruitment_activity_plan
    row_actions: menu
    empty_state: { title: Create a Recruitment Activity Plan, description: 'Activity plans are used to assign a list of activities in just a few clicks (e.g. "Language Test", "Prepare Offer", ...)' }
    page_size: 25
