title: Recruitment Analysis
page: { id: recruitment-analysis, breadcrumb: [Human Resources, Recruitment, Reporting, Analysis], auth: { require: [recruitment.read] } }
components:
  - type: StatRow
    source: recruitment_analysis_totals
    title: Hiring funnel
    stats: [{ label: Applicants, field: applicant_count }, { label: Hired, field: hired_count }, { label: Open, field: open_count }, { label: Job positions, field: opening_count }]
  - type: Chart
    source: recruitment_analysis_stages
    title: Applicants by stage
    label_field: category
    value_field: applicant_count
    variant: bar
