title: Activity Types
page: { id: recruitment-activity-types, route: /recruitment/activity-types, breadcrumb: [Recruitment, Configuration, Activities, Activity Types], auth: { require: [recruitment.read] } }
components:
  - type: ListView
    variant: odoo
    source: recruitment_activity_types
    create_action: create_recruitment_activity_type
    create_label: New
    search: { label: Search activity types, placeholder: Search activity types... }
    filters: [{ field: active, label: Status, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: name
        card:
          title: name
          subtitle: res_model_label
          fields: [{ field: summary, label: Default Summary }, { field: delay_label, label: Planned in }, { field: default_user, label: Default User }]
    columns:
      - { field: sequence, label: Sequence, type: Number, sortable: true, mobile: false }
      - { field: name, label: Name, type: PrimaryEntityCell, sortable: true, mobile: true }
      - { field: summary, label: Default Summary, sortable: true }
      - { field: delay_label, label: Planned in, sortable: false }
      - { field: delay_from_label, label: Type, sortable: false }
      - { field: res_model_label, label: Model, sortable: true, mobile: false }
      - { field: active, label: Status, type: StatusChip, mobile: false }
      - { field: id, label: '', sortable: false, actions: [{ id: edit_recruitment_activity_type, label: Edit, icon: edit }, { id: archive_recruitment_activity_type, label: Archive, icon: archive, variant: danger, show_if: 'row.active === true' }, { id: restore_recruitment_activity_type, label: Restore, icon: restore, show_if: 'row.active === false' }, { id: delete_recruitment_activity_type, label: Delete, icon: delete, variant: danger }] }
    row_key: id
    row_open_action: edit_recruitment_activity_type
    row_actions: menu
    empty_state: { title: No data to display, description: 'Try to add some records, or make sure that there is no active filter in the search bar.' }
    page_size: 25
