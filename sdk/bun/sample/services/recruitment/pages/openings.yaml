title: Job Positions
page: { id: openings, breadcrumb: [Human Resources, Recruitment, Job Positions], auth: { require: [recruitment.read] } }
components:
  - type: ListView
    variant: odoo
    source: recruitment_openings
    create_action: create_recruitment_opening
    create_label: New job position
    search: { label: Search job positions, placeholder: Search positions or roles... }
    filters: [{ field: state, label: Status, options: [Open, Draft, Closed, Archived] }, { field: department_name, label: Department, options_source: recruitment_department_lookup }]
    group_by: [{ field: department_name, label: Department }, { field: state, label: Status }, { field: recruiter, label: Recruiter }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: state
        groups_source: recruitment_opening_states
        card:
          title: name
          subtitle: job_title
          fields: [{ field: department_name, label: Department }, { field: application_count, label: Applications }, { field: hired_count, label: Hired }, { field: recruiter, label: Recruiter }]
    columns:
      - { field: name, label: Job position, type: PrimaryEntityCell, sortable: true }
      - { field: job_title, label: Job title }
      - { field: department_name, label: Department }
      - { field: application_count, label: Applications, align: right }
      - { field: target_hires, label: Expected new employees, align: right }
      - { field: hired_count, label: Hired, align: right }
      - { field: recruiter, label: Recruiter }
      - { field: state, label: Status, type: StatusChip }
    page_size: 25
    column_chooser: true
    row_key: id
    row_open_action: view_recruitment_opening
    row_double_click_action: view_recruitment_opening
    row_actions: menu
    empty_state: { title: No job positions, description: Create a job position to start recruiting. }
