workflow:
  id: recruitment_applicants
  entity: recruitment_applicants
  handler: order_transition
  initial: New
  permission: recruitment.write
  mutable: true
  status_source: recruitment_applicant_stages
  states:
    - { id: New, label: New, color: neutral }
    - { id: Screening, label: Screening, color: amber }
    - { id: Interview, label: Interview, color: blue }
    - { id: Offer, label: Offer, color: violet }
    - { id: Hired, label: Hired, color: green, terminal: true }
    - { id: Rejected, label: Rejected, color: red, terminal: true }
  transitions:
    - id: screen
      from: [New]
      to: Screening
      permission: recruitment.write
      mutation:
        guards: [{ query: "SELECT id FROM recruitment_applicants WHERE id = :id AND stage = 'New'", status: 409, message: Only new applicants can enter screening }]
        steps: [{ query: "UPDATE recruitment_applicants SET stage = 'Screening', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" }
    - id: interview
      from: [Screening]
      to: Interview
      permission: recruitment.write
      mutation:
        guards: [{ query: "SELECT id FROM recruitment_applicants WHERE id = :id AND stage = 'Screening'", status: 409, message: Only screened applicants can be interviewed }]
        steps: [{ query: "UPDATE recruitment_applicants SET stage = 'Interview', interview_date = COALESCE(interview_date, CURRENT_DATE), row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" }
    - id: offer
      from: [Interview]
      to: Offer
      permission: recruitment.write
      mutation:
        guards: [{ query: "SELECT id FROM recruitment_applicants WHERE id = :id AND stage = 'Interview'", status: 409, message: Only interviewed applicants can receive an offer }]
        steps: [{ query: "UPDATE recruitment_applicants SET stage = 'Offer', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" }
    - id: hire
      from: [Offer]
      to: Hired
      permission: recruitment.manage
      mutation:
        guards: [{ query: "SELECT id FROM recruitment_applicants WHERE id = :id AND stage = 'Offer'", status: 409, message: Only offered applicants can be hired }]
        steps:
          - query: "UPDATE recruitment_applicants SET stage = 'Hired', hired_date = CURRENT_DATE, row_version = row_version + 1 WHERE id = :id"
          - query: "UPDATE recruitment_openings SET hired_count = hired_count + 1, row_version = row_version + 1 WHERE id = (SELECT opening_id FROM recruitment_applicants WHERE id = :id)"
        result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" }
    - id: reject
      from: [New, Screening, Interview, Offer]
      to: Rejected
      permission: recruitment.manage
      mutation:
        guards: [{ query: "SELECT id FROM recruitment_applicants WHERE id = :id AND stage IN ('New', 'Screening', 'Interview', 'Offer')", status: 409, message: Only open applicants can be rejected }]
        steps: [{ query: "UPDATE recruitment_applicants SET stage = 'Rejected', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM recruitment_applicants WHERE id = :id" }
