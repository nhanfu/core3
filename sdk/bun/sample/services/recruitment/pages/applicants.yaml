title: Applicants
page: { id: applicants, breadcrumb: [Human Resources, Recruitment, Applications], auth: { require: [recruitment.read] } }
components:
  - type: ListView
    variant: odoo
    source: recruitment_applicants
    create_action: create_recruitment_applicant
    create_label: New applicant
    search: { label: Search applicants, placeholder: 'Search applicants, email, or opening...' }
    filters:
      - { field: stage, label: Stage, options_source: recruitment_applicant_stages }
      - { field: opening_name, label: Job position, options_source: recruitment_opening_lookup }
      - { field: priority, label: Priority, options: [Low, Normal, High] }
      - { field: archived, label: Active, options: [{ id: active, label: Active }, { id: archived, label: Archived }] }
    group_by: [{ field: stage, label: Stage }, { field: opening_name, label: Job position }, { field: recruiter, label: Recruiter }, { field: source, label: Source }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: stage
        groups_source: recruitment_applicant_stages
        card:
          title: name
          subtitle: opening_name
          fields: [{ field: email, label: Email }, { field: recruiter, label: Recruiter }, { field: priority, label: Priority }, { field: rating, label: Rating }]
    columns:
      - { field: name, label: Applicant, type: PrimaryEntityCell, sortable: true }
      - { field: opening_name, label: Job position }
      - { field: email, label: Email }
      - { field: recruiter, label: Recruiter }
      - { field: source, label: Source }
      - { field: priority, label: Priority, type: StatusChip }
      - { field: stage, label: Stage, type: StatusChip }
      - { field: applied_date, label: Applied on }
    page_size: 25
    column_chooser: true
    row_key: id
    row_open_action: view_recruitment_applicant
    row_double_click_action: view_recruitment_applicant
    form_view: { page: apps/services/recruitment/pages/applicant-detail.yaml, side_panel: true }
    row_actions: menu
    empty_state: { title: No applicants, description: No applications match the current filters. }
