title: Applicant
page: { id: applicant-detail, route: /applicants/detail, breadcrumb: [Human Resources, Recruitment, Applicant], auth: { require: [recruitment.read] } }
components:
  - type: OdooFormView
    source: recruitment_applicant_detail
    title_field: name
    status_field: stage
    statusbar: [{ value: New, label: New }, { value: Screening, label: First screening }, { value: Interview, label: First interview }, { value: Offer, label: Contract proposal }, { value: Hired, label: Contract signed }, { value: Rejected, label: Refused }]
    status_colors: { New: neutral, Screening: amber, Interview: blue, Offer: violet, Hired: green, Rejected: red }
    group_columns: 2
    groups:
      - title: Applicant
        fields: [{ field: name, label: Applicant }, { field: stage, label: Stage }, { field: opening_name, label: Job position }, { field: department_name, label: Department }, { field: email, label: Email }, { field: phone, label: Phone }, { field: priority, label: Priority }, { field: rating, label: Rating }]
      - title: Hiring
        fields: [{ field: recruiter, label: Recruiter }, { field: source, label: Source }, { field: applied_date, label: Applied date }, { field: interview_date, label: Interview date }, { field: hired_date, label: Hired date }, { field: refused_date, label: Refused date }, { field: refuse_reason_name, label: Refuse reason }, { field: notes, label: Notes }, { field: archived, label: Archived }]
    header_actions: [{ id: screen_applicant_detail, label: First screening, permission: recruitment.write, show_if: "record.stage === 'New'" }, { id: interview_applicant_detail, label: First interview, permission: recruitment.write, show_if: "record.stage === 'Screening'" }, { id: offer_applicant_detail, label: Contract proposal, permission: recruitment.write, show_if: "record.stage === 'Interview'" }, { id: hire_applicant_detail, label: Hire, permission: recruitment.manage, show_if: "record.stage === 'Offer'" }, { id: reject_applicant_detail, label: Refuse, permission: recruitment.manage, variant: danger, show_if: "record.stage !== 'Hired' && record.stage !== 'Rejected'" }]
