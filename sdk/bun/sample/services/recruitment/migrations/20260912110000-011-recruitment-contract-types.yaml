        ('contract-type-permanent', 'Permanent', 'Permanent', 1001),
        ('contract-type-temporary', 'Temporary', 'Temporary', 1002),
        ('contract-type-interim', 'Interim', 'Interim', 1003),
        ('contract-type-seasonal', 'Seasonal', 'Seasonal', 1004),
        ('contract-type-full-time', 'Full-Time', 'Full-Time', 1005),
        ('contract-type-part-time', 'Part-Time', 'Part-Time', 1006),
        ('contract-type-intern', 'Intern', 'Intern', 1007),
        ('contract-type-student', 'Student', 'Student', 1008),
        ('contract-type-apprenticeship', 'Apprenticeship', 'Apprenticeship', 1009),
        ('contract-type-thesis', 'Thesis', 'Thesis', 1010),
        ('contract-type-statutory', 'Statutory', 'Statutory', 1011),
        ('contract-type-employee', 'Employee', 'Employee', 1012);
    down: |
