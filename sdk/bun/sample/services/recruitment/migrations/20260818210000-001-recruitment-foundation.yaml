version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS recruitment_openings (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        department_name VARCHAR, job_title VARCHAR NOT NULL, employment_type VARCHAR NOT NULL DEFAULT 'Employee',
        target_hires INTEGER NOT NULL DEFAULT 1, hired_count INTEGER NOT NULL DEFAULT 0,
        recruiter VARCHAR, opened_date DATE, closing_date DATE, state VARCHAR NOT NULL DEFAULT 'Open',
        row_version BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS recruitment_applicants (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        opening_id VARCHAR NOT NULL, opening_name VARCHAR NOT NULL, email VARCHAR, phone VARCHAR,
        source VARCHAR, recruiter VARCHAR, stage VARCHAR NOT NULL DEFAULT 'New', rating VARCHAR,
        applied_date DATE NOT NULL DEFAULT CURRENT_DATE, interview_date DATE, hired_date DATE,
        notes VARCHAR, row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS recruitment_applicants_opening_idx ON recruitment_applicants(opening_id);
      CREATE INDEX IF NOT EXISTS recruitment_applicants_stage_idx ON recruitment_applicants(stage);
    down: |
      DROP TABLE IF EXISTS recruitment_applicants;
      DROP TABLE IF EXISTS recruitment_openings;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
