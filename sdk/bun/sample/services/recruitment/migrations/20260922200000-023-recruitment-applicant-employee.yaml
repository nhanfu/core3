        ON recruitment_applicants(employee_id);
    down: |
      DROP INDEX IF EXISTS recruitment_applicants_employee_idx;
      ALTER TABLE recruitment_applicants DROP COLUMN IF EXISTS employee_name;
      ALTER TABLE recruitment_applicants DROP COLUMN IF EXISTS employee_id;
