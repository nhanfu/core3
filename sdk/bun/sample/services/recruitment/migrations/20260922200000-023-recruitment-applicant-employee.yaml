version: 0.0.23
kind: schema
description: Durable Recruitment applicant to employee conversion link
type:
  postgres:
    up: |
      ALTER TABLE recruitment_applicants ADD COLUMN IF NOT EXISTS employee_id VARCHAR;
      ALTER TABLE recruitment_applicants ADD COLUMN IF NOT EXISTS employee_name VARCHAR;
