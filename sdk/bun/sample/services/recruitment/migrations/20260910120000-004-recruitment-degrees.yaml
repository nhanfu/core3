version: 0.0.4
kind: schema
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS recruitment_degrees (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE,
        score DECIMAL(4,3) NOT NULL DEFAULT 0,
        sequence INTEGER NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        CONSTRAINT recruitment_degrees_score_range CHECK (score >= 0 AND score <= 1)
      );
      INSERT OR IGNORE INTO recruitment_degrees(id, name, score, sequence) VALUES
        ('degree-graduate', 'Graduate', 0.500, 1),
        ('degree-bachelor', 'Bachelor Degree', 0.700, 2),
        ('degree-master', 'Master Degree', 0.900, 3),
        ('degree-doctoral', 'Doctoral Degree', 1.000, 4);
    down: |
      DROP TABLE IF EXISTS recruitment_degrees;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
