version: 0.0.9
kind: schema
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS recruitment_tags (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE,
        color INTEGER NOT NULL DEFAULT 0,
        sequence INTEGER NOT NULL DEFAULT 100,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 09:00:00',
        CONSTRAINT recruitment_tags_color_range CHECK (color >= 0 AND color <= 11)
      );
      INSERT OR IGNORE INTO recruitment_tags(id, name, color, sequence) VALUES
        ('recruitment-tag-reserve', 'Reserve', 3, 1),
        ('recruitment-tag-manager', 'Manager', 10, 2),
        ('recruitment-tag-it', 'IT', 1, 3),
        ('recruitment-tag-sales', 'Sales', 3, 4);
    down: |
      DROP TABLE IF EXISTS recruitment_tags;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
