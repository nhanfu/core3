version: 0.0.14
kind: schema
type:
  postgres:
    up: |
      -- Keep this migration self-contained when the preceding company-scope
      -- migration is not present on the receiving branch.
      ALTER TABLE recruitment_applicants ADD COLUMN IF NOT EXISTS company_name VARCHAR;
      UPDATE recruitment_applicants
      SET company_name = 'My Company (San Francisco)'
      WHERE company_name IS NULL;
      UPDATE recruitment_applicants
      SET company_name = 'Core3 Demo Company'
      WHERE company_name = 'My Company (San Francisco)';
    down: |
      ALTER TABLE recruitment_applicants DROP COLUMN IF EXISTS company_name;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
