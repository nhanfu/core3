page: { id: employee-departments }
datasources:
  - id: employee_departments_report
    permission: employees.read
    query: "SELECT d.id, d.row_version, d.name, d.manager_name, d.state, d.active, COALESCE(d.company_name, 'Core3 Vietnam') AS company_name, COALESCE(d.parent_name, '') AS parent_name, COALESCE(d.notes, '') AS notes, COUNT(e.id) FILTER (WHERE COALESCE(e.active, true) = true) AS employee_count FROM employee_departments d LEFT JOIN employees e ON e.department_id = d.id WHERE ((:active IS NULL AND COALESCE(d.active, true) = true) OR (:active IS NOT NULL AND d.active = CAST(:active AS BOOLEAN))) AND (:q IS NULL OR d.name ILIKE '%' || :q || '%' OR d.manager_name ILIKE '%' || :q || '%') GROUP BY d.id, d.row_version, d.name, d.manager_name, d.state, d.active, d.company_name, d.parent_name, d.notes ORDER BY d.name, d.id"
actions:
  - id: view_department
    type: navigate
    permission: employees.read
    navigate_to: /employees/departments/detail
    params: { id: '{row.id}' }
  - id: create_department
    type: server_form
    permission: employees.manage
    title: New department
    action: employees.departments.create
    handler: yaml_mutation
    operation: create
    refresh: [employee_departments_report]
    mutation:
      operation: insert
      table: employee_departments
      fields: [name, manager_name, company_name, parent_name, notes]
      required: [name]
      defaults: { active: true, state: Active, company_name: Core3 Vietnam }
      result: { query: "SELECT * FROM employee_departments WHERE id = :id" }
    fields:
      - { field: name, label: Department, type: text, required: true }
      - { field: manager_name, label: Manager, type: text }
      - { field: company_name, label: Company, type: text, default: Core3 Vietnam }
      - { field: parent_name, label: Parent Department, type: text }
      - { field: notes, label: Notes, type: textarea }
