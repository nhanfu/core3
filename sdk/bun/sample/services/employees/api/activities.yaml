page: { id: employee-activities }
datasources:
  - id: employee_activity_timing
    permission: employees.read
    query: "SELECT value, label FROM (VALUES ('Overdue', 'Overdue'), ('Today', 'Today'), ('Planned', 'Planned'), ('Done', 'Done')) timing(value, label)"
  - id: employee_activity_types
    permission: employees.read
    query: "SELECT value, label FROM (VALUES ('todo', 'To-Do'), ('email', 'Email'), ('call', 'Call'), ('meeting', 'Meeting'), ('document', 'Document')) types(value, label)"
  - id: employee_activities
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_ACTIVITIES_UNAVAILABLE, message: Employee activities are temporarily unavailable. } }
    query: "WITH matching_activities AS (SELECT a.id AS activity_id, a.row_version, a.employee_id, a.employee_name, a.job_title, a.activity_type, a.activity_summary, CAST(a.activity_date AS VARCHAR) AS activity_date, a.activity_user, a.activity_state, a.timing, e.department_name, e.work_email, e.work_phone, e.company_name, e.employee_number, e.hire_date, COUNT(*) OVER (PARTITION BY a.employee_id) AS activity_total, ROW_NUMBER() OVER (PARTITION BY a.employee_id ORDER BY a.activity_date, a.id) AS activity_rank FROM employee_activities a JOIN employees e ON e.id = a.employee_id AND COALESCE(e.active, true) = true WHERE (:fixture_state IS NULL OR :fixture_state NOT IN ('empty', 'not_found')) AND (:q IS NULL OR e.employee_number ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%' OR e.work_email ILIKE '%' || :q || '%' OR a.employee_name ILIKE '%' || :q || '%' OR a.job_title ILIKE '%' || :q || '%' OR a.activity_summary ILIKE '%' || :q || '%') AND (:timing IS NULL OR a.timing = :timing) AND (:activity_type IS NULL OR a.activity_type = :activity_type)) SELECT employee_id AS id, row_version, employee_id, employee_name, job_title, activity_type, activity_summary, activity_date, activity_user, activity_state, CAST(activity_total AS INTEGER) AS activity_count, timing, department_name, work_email, work_phone, company_name, employee_number, CAST(hire_date AS VARCHAR) AS hire_date FROM matching_activities WHERE activity_rank = 1 ORDER BY employee_name, employee_id"
actions:
  - id: view_employee_activity
    type: navigate
    permission: employees.read
    navigate_to: /employees/detail
    params: { id: '{row.employee_id}' }
