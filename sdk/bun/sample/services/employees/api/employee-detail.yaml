        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:certificate AS VARCHAR)), '') IS NULL OR CAST(:certificate AS VARCHAR) IN ('graduate', 'bachelor', 'master', 'doctor', 'other')", status: 422, code: EMPLOYEES_EDUCATION_CERTIFICATE_INVALID, message: Select a valid certificate level. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:sex AS VARCHAR)), '') IS NULL OR CAST(:sex AS VARCHAR) IN ('male', 'female', 'other')", status: 422, code: EMPLOYEES_BIRTH_IDENTITY_GENDER_INVALID, message: Select a valid gender. }
        - { query: "SELECT 1 AS ok WHERE :visa_expire IS NULL OR regexp_matches(CAST(:visa_expire AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 422, code: EMPLOYEES_VISA_EXPIRATION_INVALID, message: Visa expiration must use YYYY-MM-DD. }
        - { query: "SELECT 1 AS ok WHERE :work_permit_expiration_date IS NULL OR regexp_matches(CAST(:work_permit_expiration_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 422, code: EMPLOYEES_WORK_PERMIT_EXPIRATION_INVALID, message: Work permit expiration must use YYYY-MM-DD. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:has_work_permit AS BOOLEAN), false) = false OR NULLIF(TRIM(CAST(:work_permit_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: EMPLOYEES_WORK_PERMIT_DOCUMENT_INVALID, message: A work permit filename is required when a document is present. }
        - { query: "SELECT 1 AS ok WHERE :passport_expiration_date IS NULL OR regexp_matches(CAST(:passport_expiration_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 422, code: EMPLOYEES_PASSPORT_EXPIRATION_INVALID, message: Passport expiration must use YYYY-MM-DD. }
        - { query: "SELECT 1 AS ok WHERE :distance_home_work IS NULL OR CAST(:distance_home_work AS INTEGER) >= 0", status: 422, code: EMPLOYEES_PRIVATE_DISTANCE_INVALID, message: Home-work distance cannot be negative. }
