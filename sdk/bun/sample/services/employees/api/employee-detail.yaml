        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:coach_name AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM employees c WHERE c.active = true AND c.name = TRIM(CAST(:coach_name AS VARCHAR)) AND (COALESCE(:current_company_name, '') = '' OR c.company_name = :current_company_name))", status: 422, code: EMPLOYEES_COACH_INVALID, message: Select an active coach from the current company. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:employee_properties AS VARCHAR)), '') IS NULL OR (SUBSTR(TRIM(CAST(:employee_properties AS VARCHAR)), 1, 1) = '{' AND RIGHT(TRIM(CAST(:employee_properties AS VARCHAR)), 1) = '}')", status: 422, code: EMPLOYEES_PROPERTIES_INVALID, message: Properties must be a JSON object. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:marital AS VARCHAR)), '') IS NULL OR CAST(:marital AS VARCHAR) IN ('single', 'married', 'cohabitant', 'widower', 'divorced')", status: 422, code: EMPLOYEES_FAMILY_MARITAL_INVALID, message: Select a valid marital status. }
