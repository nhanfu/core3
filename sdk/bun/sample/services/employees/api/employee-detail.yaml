    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_FOLLOWER_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the follower was removed. Reload and try again. }
        - { query: "SELECT user_id FROM employee_followers WHERE employee_id = :id AND user_id = :user_id", status: 404, code: EMPLOYEES_FOLLOWER_NOT_FOUND, message: Follower not found for this employee. }
      steps:
        - query: "INSERT INTO employee_messages(id, employee_id, actor_id, actor_name, action, action_label, detail, row_version, state) VALUES(gen_random_uuid(), :id, :current_user_id, :current_user_name, 'employees.followers.remove', 'Removed follower', (SELECT name FROM employee_related_user_catalog WHERE id = :user_id) || ' no longer follows ' || (SELECT name FROM employees WHERE id = :id), 1, 'done')"
        - query: "DELETE FROM employee_followers WHERE employee_id = :id AND user_id = :user_id"
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the follower was removed. Reload and try again.
      result: { query: "SELECT :user_id AS user_id, u.name, u.email, true AS removed FROM employee_related_user_catalog u WHERE u.id = :user_id" }
