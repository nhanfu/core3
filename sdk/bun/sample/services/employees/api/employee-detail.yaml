      - { field: skill_id, label: Skill, type: select, options_source: employee_skills_for_type, required: true }
      - { field: skill_level_id, label: Level, type: select, options_source: employee_skill_levels_for_type, required: true }
      - { field: valid_from, label: Valid From, type: date, required: true, default: '2026-01-15' }
      - { field: valid_to, label: Valid To, type: date }
