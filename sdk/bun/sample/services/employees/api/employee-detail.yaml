    handler: yaml_mutation
    operation: update
    prefill: state.employee_detail
    refresh: [employee_detail]
    mutation:
      operation: update
      table: employees
      fields: [name, work_email, work_phone, phone, private_email, company_name, department_name, job_position_name, job_title, manager_name, coach_name, work_location, address_name, departure_reason_name, departure_description, departure_date, additional_note, employment_type, hire_date, contract_start, contract_end, birthday, wage, working_schedule, timezone, barcode, skills, resume_summary, street, emergency_contact, emergency_phone, marital, spouse_complete_name, spouse_birthdate, children, certificate, study_field, place_of_birth, country_of_birth, sex]
      required: [name]
      timestamps: true
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM employees WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RECORD_NOT_FOUND, message: Employee not found in the current company. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: EMPLOYEES_RECORD_NAME_REQUIRED, message: Employee name is required. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR COALESCE(:company_name, :current_company_name) = :current_company_name", status: 403, code: EMPLOYEES_COMPANY_SCOPE_REQUIRED, message: Employee must belong to the current company. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:marital AS VARCHAR)), '') IS NULL OR CAST(:marital AS VARCHAR) IN ('single', 'married', 'cohabitant', 'widower', 'divorced')", status: 422, code: EMPLOYEES_FAMILY_MARITAL_INVALID, message: Select a valid marital status. }
