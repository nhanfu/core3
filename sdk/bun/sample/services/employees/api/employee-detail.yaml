        - query: "UPDATE employee_versions SET manager_id = :manager_id, manager_name = (SELECT name FROM employees WHERE id = :manager_id), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE employee_id = :id AND active = true AND date_version = (SELECT MAX(date_version) FROM employee_versions WHERE employee_id = :id AND active = true AND contract_date_start <= DATE '2026-01-15')"
