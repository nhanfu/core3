        - query: "UPDATE employees SET company_id = :company_id, company_name = (SELECT name FROM employee_companies WHERE id = :company_id), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
