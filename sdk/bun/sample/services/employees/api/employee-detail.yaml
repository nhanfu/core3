page: { id: employee-detail }
datasources:
  - id: employee_detail
    single: true
    permission: employees.read
    query: "SELECT id, row_version, employee_number, name, image_url, auth_user_id, user_name, work_email, work_phone, phone, private_email, company_name, department_name, job_position_name, job_title, manager_name, coach_name, work_location, address_name, departure_reason_name, departure_description, CAST(departure_date AS VARCHAR) AS departure_date, additional_note, org_parent_name, org_direct_reports, employment_type, state, active, CAST(hire_date AS VARCHAR) AS hire_date, CAST(termination_date AS VARCHAR) AS termination_date, CAST(contract_start AS VARCHAR) AS contract_start, CAST(contract_end AS VARCHAR) AS contract_end, CAST(birthday AS VARCHAR) AS birthday, wage, working_schedule, contract_template_id, contract_template_name, timezone, barcode, presence, skills, resume_summary, street, emergency_contact, emergency_phone, marital, spouse_complete_name, CAST(spouse_birthdate AS VARCHAR) AS spouse_birthdate, children, certificate, study_field, place_of_birth, country_of_birth, sex, CAST((SELECT COUNT(*) FROM employee_versions v WHERE v.employee_id = employees.id) AS INTEGER) AS version_count FROM employees WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
  - id: employee_departure_wizard
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_DEPARTURE_EMPLOYEE_NOT_FOUND, message: The active employee is not available for departure registration. }
      transport_error: { status: 503, code: EMPLOYEES_DEPARTURE_WIZARD_UNAVAILABLE, message: Departure registration is temporarily unavailable. }
    query: |
      SELECT e.id, e.row_version, e.name AS employee_name, e.company_name,
        CAST(e.contract_start AS VARCHAR) AS contract_start, CAST(e.contract_end AS VARCHAR) AS contract_end, e.auth_user_id, e.user_name,
        CASE WHEN e.auth_user_id IS NOT NULL OR NULLIF(TRIM(COALESCE(e.user_name, '')), '') IS NOT NULL THEN true ELSE false END AS is_user_employee,
        COALESCE(CAST(e.departure_date AS VARCHAR), '2026-01-15') AS departure_date,
        e.departure_reason_name, e.departure_description,
        true AS set_date_end, false AS remove_related_user
      FROM employees e
      WHERE e.id = :id AND e.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
  - id: employee_departure_wizard_reasons
    single: false
    permission: employees.read
    query: "SELECT r.id AS value, r.name AS label FROM employee_departure_reasons r WHERE r.active = true AND (COALESCE(:current_company_name, '') = '' OR r.company_name = :current_company_name OR r.id IN ('departure-reason-fired', 'departure-reason-resigned', 'departure-reason-retired')) ORDER BY r.sequence, r.id"
  - id: employee_user_wizard
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_USER_EMPLOYEE_NOT_FOUND, message: Employee not found for user creation. }
      transport_error: { status: 503, code: EMPLOYEES_USER_WIZARD_UNAVAILABLE, message: User creation is temporarily unavailable. }
    query: |
      SELECT e.id, e.row_version, e.name, e.work_email AS login, e.work_phone AS phone,
        e.auth_user_id, e.user_name, e.company_name
      FROM employees e
      WHERE e.id = :id
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
  - id: employee_launch_plan_wizard
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_PLAN_EMPLOYEE_NOT_FOUND, message: Active employee not found for plan launch. }
      transport_error: { status: 503, code: EMPLOYEES_PLAN_WIZARD_UNAVAILABLE, message: Launch Plan is temporarily unavailable. }
    query: |
      SELECT e.id, e.row_version, e.name AS employee_name, e.job_title, e.department_name, e.company_name,
        'hr.employee' AS res_model, '2026-01-15' AS plan_date
      FROM employees e
      WHERE e.id = :id AND e.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
  - id: employee_launch_plans
    single: false
    permission: employees.write
    query: |
      SELECT p.id AS value, p.name AS label
      FROM employee_activity_plans p
      JOIN employees e ON e.id = :employee_id
      WHERE p.active = true AND p.res_model = 'hr.employee'
        AND (p.company_name IS NULL OR p.company_name = e.company_name)
        AND (p.department_name IS NULL OR p.department_name = e.department_name)
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY p.name, p.id
  - id: employee_contract_template_wizard
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_TEMPLATE_EMPLOYEE_NOT_FOUND, message: Active employee not found for contract template loading. }
      transport_error: { status: 503, code: EMPLOYEES_TEMPLATE_WIZARD_UNAVAILABLE, message: Contract template loading is temporarily unavailable. }
    query: |
      SELECT e.id, e.row_version, e.name AS employee_name, e.company_name, e.active,
        e.contract_template_id, e.contract_template_name
      FROM employees e
      WHERE e.id = :id AND e.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
  - id: employee_contract_templates_for_employee
    single: false
    permission: employees.write
    query: |
      SELECT t.id AS value, t.name AS label
      FROM employee_contract_templates t
      JOIN employees e ON e.id = :employee_id
      WHERE t.active = true
        AND (t.company_name IS NULL OR t.company_name = e.company_name)
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY t.name, t.id
  - id: employee_bank_accounts
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_BANK_ACCOUNTS_UNAVAILABLE, message: Employee bank accounts are temporarily unavailable. } }
    query: |
      SELECT b.id, b.row_version, b.employee_id, b.company_name, b.acc_number,
        b.bank_name, b.acc_holder_name, b.currency_code, b.amount, b.amount_type,
        b.trusted, b.sequence, b.active,
        CASE WHEN b.amount_type = 'percentage' THEN CAST(b.amount AS VARCHAR) || '%' ELSE printf('%.2f %s', b.amount, b.currency_code) END AS allocation_display,
        CASE WHEN b.trusted THEN 'Trusted' ELSE 'Untrusted' END AS trust_status
      FROM employee_bank_accounts b
      JOIN employees e ON e.id = b.employee_id
      WHERE b.employee_id = :employee_id
        AND b.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY b.sequence, b.id
  - id: employee_skill_assignments
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_SKILLS_UNAVAILABLE, message: Employee skills are temporarily unavailable. } }
    query: |
      SELECT a.id, a.row_version, a.employee_id, a.skill_type_id, t.name AS skill_type_name,
        a.skill_id, s.name AS skill_name, a.skill_level_id, l.name AS skill_level_name,
        l.level_progress, CAST(a.valid_from AS VARCHAR) AS valid_from,
        CAST(a.valid_to AS VARCHAR) AS valid_to, a.active,
        CASE WHEN a.valid_to IS NULL OR a.valid_to >= DATE '2026-01-15' THEN 'Current' ELSE 'Expired' END AS validity_status
      FROM employee_skill_assignments a
      JOIN employees e ON e.id = a.employee_id
      JOIN employee_skill_types t ON t.id = a.skill_type_id
      JOIN employee_skills s ON s.id = a.skill_id AND s.skill_type_id = a.skill_type_id
      JOIN employee_skill_levels l ON l.id = a.skill_level_id AND l.skill_type_id = a.skill_type_id
      WHERE a.employee_id = :employee_id AND a.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY t.sequence, s.sequence, a.id
  - id: employee_skill_types_for_employee
    single: false
    permission: employees.write
    query: |
      SELECT t.id AS value, t.name AS label
      FROM employee_skill_types t
      JOIN employees e ON e.id = :employee_id
      WHERE t.active = true AND t.is_certification = false
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY t.sequence, t.id
  - id: employee_skills_for_type
    single: false
    permission: employees.write
    query: |
      SELECT s.id AS value, s.name AS label
      FROM employee_skills s
      JOIN employee_skill_types t ON t.id = s.skill_type_id
      WHERE s.skill_type_id = :skill_type_id AND t.active = true AND t.is_certification = false
      ORDER BY s.sequence, s.id
  - id: employee_skill_levels_for_type
    single: false
    permission: employees.write
    query: |
      SELECT l.id AS value, l.name AS label
      FROM employee_skill_levels l
      JOIN employee_skill_types t ON t.id = l.skill_type_id
      WHERE l.skill_type_id = :skill_type_id AND t.active = true AND t.is_certification = false
      ORDER BY l.level_progress DESC, l.id
  - id: employee_resume_lines
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_RESUME_LINES_UNAVAILABLE, message: Employee resume lines are temporarily unavailable. } }
    query: |
      SELECT r.id, r.row_version, r.employee_id, r.line_type_id, t.name AS line_type_name,
        t.is_course, r.name, CAST(r.date_start AS VARCHAR) AS date_start,
        CAST(r.date_end AS VARCHAR) AS date_end, r.duration, r.course_type,
        r.description, r.external_url
      FROM employee_resume_lines r
      JOIN employees e ON e.id = r.employee_id
      JOIN employee_resume_line_types t ON t.id = r.line_type_id AND t.active = true
      WHERE r.employee_id = :employee_id
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY t.sequence, r.date_end DESC NULLS LAST, r.date_start DESC, r.id
  - id: employee_resume_line_types_for_employee
    single: false
    permission: employees.write
    query: "SELECT id AS value, name AS label FROM employee_resume_line_types WHERE active = true ORDER BY sequence, id"
actions:
  - id: open_employee_timesheets
    type: navigate
    permission: timesheets.read
    navigate_to: /employee-timesheets
    params: { employee_id: '{state.id}' }
  - id: open_employee_history
    type: navigate
    permission: employees.read
    navigate_to: /employees/versions
    params: { employee_id: '{state.id}' }
  - id: generate_employee_barcode
    type: server
    permission: employees.write
    action: employees.records.generate_barcode
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', expected_row_version: '{state.employee_detail.row_version}', current_user_id: '{current_user_id}' }
    refresh: [employee_detail]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - query: "SELECT id, CASE WHEN NULLIF(REGEXP_REPLACE(COALESCE(employee_number, ''), '[^0-9]', '', 'g'), '') IS NOT NULL THEN '041' || RIGHT('000000000' || REGEXP_REPLACE(employee_number, '[^0-9]', '', 'g'), 9) ELSE 'B' || SUBSTR(REGEXP_REPLACE(UPPER(id), '[^A-Z0-9]', '', 'g'), 1, 17) END AS generated_barcode FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          assign: true
          status: 404
          code: EMPLOYEES_BARCODE_EMPLOYEE_NOT_FOUND
          message: Active employee not found in the current company.
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before a badge ID was generated. Reload the employee and try again. }
        - { query: "SELECT id FROM employees WHERE id = :id AND NULLIF(TRIM(COALESCE(barcode, '')), '') IS NULL", status: 409, code: EMPLOYEES_BADGE_ALREADY_ASSIGNED, message: This employee already has a badge ID. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(:generated_barcode AS VARCHAR)) BETWEEN 1 AND 18 AND regexp_matches(CAST(:generated_barcode AS VARCHAR), '^[A-Za-z0-9]+$')", status: 422, code: EMPLOYEES_BADGE_INVALID, message: The generated badge ID is invalid. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employees WHERE barcode = :generated_barcode AND id <> :id)", status: 409, code: EMPLOYEES_BADGE_EXISTS, message: The generated badge ID is already assigned. }
      steps:
        - query: "UPDATE employees SET barcode = :generated_barcode, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND active = true AND row_version = :expected_row_version AND NULLIF(TRIM(COALESCE(barcode, '')), '') IS NULL AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before a badge ID was generated. Reload the employee and try again.
      result: { query: "SELECT * FROM employees WHERE id = :id" }
  - id: create_employee_user
    type: server_form
    permission: auth.users.manage
    title: Create User
    description: Create an invited user linked to this employee, using the employee's work contact defaults.
    action: employees.records.create_user
    handler: yaml_mutation
    operation: create
    prefill: state.employee_user_wizard
    refresh: [employee_detail, employee_user_wizard]
    mutation:
      boolean_fields: [enabled]
      guards:
        - { query: "SELECT id FROM employees WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_USER_EMPLOYEE_NOT_FOUND, message: Employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND auth_user_id IS NULL AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: EMPLOYEES_USER_ALREADY_LINKED, message: This employee already has a user. }
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :expected_row_version AND auth_user_id IS NULL AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: This employee changed before the user was created. Refresh and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND regexp_matches(TRIM(CAST(:login AS VARCHAR)), '^[^@ ]+@[^@ ]+\\.[^@ ]+$')", status: 422, code: EMPLOYEES_USER_VALUES_INVALID, message: User name and a valid login email are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM users WHERE LOWER(email) = LOWER(TRIM(CAST(:login AS VARCHAR))))", status: 409, code: EMPLOYEES_USER_LOGIN_EXISTS, message: A user already exists with this login. }
      before_steps:
        - query: "SELECT 'employee-user-' || CAST(:id AS VARCHAR) AS new_user_id"
          assign: true
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM users WHERE id = :new_user_id)"
          status: 409
          code: EMPLOYEES_USER_ID_EXISTS
          message: A linked user already exists for this employee.
      steps:
        - query: "INSERT INTO users(id, email, name, password_hash, preferred_lang, enabled) VALUES(:new_user_id, LOWER(TRIM(CAST(:login AS VARCHAR))), TRIM(CAST(:name AS VARCHAR)), 'invite-pending', 'en', false)"
        - query: "UPDATE employees SET auth_user_id = :new_user_id, user_name = TRIM(CAST(:name AS VARCHAR)), work_email = LOWER(TRIM(CAST(:login AS VARCHAR))), work_phone = NULLIF(TRIM(CAST(:phone AS VARCHAR)), ''), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND auth_user_id IS NULL AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before user creation. Reload the employee and try again.
      result: { query: "SELECT * FROM employees WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: login, label: Login, type: text, required: true }
      - { field: phone, label: Phone, type: text }
  - id: print_employee_badge
    type: client
    permission: employees.read
    script: |
      // js
      async ({ state, request }) => {
        const employee = state.employee_detail;
        if (!employee?.id) throw new Error('Employee badge context is unavailable');
        await request('/api/actions/employees.records.print_badge', {
          method: 'POST',
          body: { employee_id: employee.id, expected_row_version: employee.row_version },
        });
        window.location.assign(`/employees/badge?id=${encodeURIComponent(String(employee.id))}`);
      }
  - id: launch_employee_plan
    type: server_form
    permission: employees.write
    title: Launch Plan
    description: Schedule the selected employee activity plan using its ordered templates.
    action: employees.records.launch_plan
    handler: yaml_mutation
    operation: launch_plan
    params: { employee_id: '{state.id}' }
    prefill: state.employee_launch_plan_wizard
    refresh: [employee_detail, employee_activities]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_PLAN_EMPLOYEE_NOT_FOUND, message: Active employee not found for plan launch. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before Launch Plan. Reload the employee and try again. }
        - { query: "SELECT p.id FROM employee_activity_plans p JOIN employees e ON e.id = :id WHERE p.id = :plan_id AND p.active = true AND p.res_model = 'hr.employee' AND (p.company_name IS NULL OR p.company_name = e.company_name) AND (p.department_name IS NULL OR p.department_name = e.department_name) AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)", status: 422, code: EMPLOYEES_PLAN_NOT_ELIGIBLE, message: Select an active plan available to this employee. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employee_activities WHERE employee_id = :id AND plan_id = :plan_id)", status: 409, code: EMPLOYEES_PLAN_ALREADY_LAUNCHED, message: This plan has already been launched for the employee. }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(CAST(:plan_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 422, code: EMPLOYEES_PLAN_DATE_INVALID, message: Plan date must use YYYY-MM-DD. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM employee_activity_plan_steps WHERE plan_id = :plan_id)", status: 422, code: EMPLOYEES_PLAN_EMPTY, message: The selected plan has no activities to launch. }
      steps:
        - query: |
            INSERT INTO employee_activities(
              id, row_version, employee_id, employee_name, job_title, activity_type, activity_summary,
              activity_date, activity_user, activity_state, activity_count, timing, is_primary,
              plan_id, plan_name, responsible_type
            )
            SELECT
              'employee-plan-activity-' || CAST(e.id AS VARCHAR) || '-' || CAST(p.id AS VARCHAR) || '-' || CAST(s.sequence AS VARCHAR),
              1, e.id, e.name, e.job_title, s.activity_type, s.summary,
              CAST(CAST(:plan_date AS DATE) + s.delay_count * INTERVAL '1 day' AS DATE),
              CASE s.responsible_type
                WHEN 'Employee' THEN e.name
                WHEN 'Manager' THEN COALESCE(NULLIF(e.manager_name, ''), 'HR Manager')
                WHEN 'HR Responsible' THEN 'HR Manager'
                ELSE COALESCE(NULLIF(CAST(:current_user_name AS VARCHAR), ''), 'HR Manager')
              END,
              'planned', 1,
              CASE WHEN s.delay_count = 0 THEN 'Today' ELSE 'Planned' END,
              false, p.id, p.name, s.responsible_type
            FROM employee_activity_plan_steps s
            JOIN employee_activity_plans p ON p.id = s.plan_id
            JOIN employees e ON e.id = :id
            WHERE s.plan_id = :plan_id AND e.active = true
              AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
            ORDER BY s.sequence, s.id
      result: { query: "SELECT * FROM employee_activities WHERE employee_id = :id AND plan_id = :plan_id ORDER BY activity_date, id" }
    fields:
      - { field: plan_id, label: Activity Plan, type: select, options_source: employee_launch_plans, required: true }
      - { field: plan_date, label: Plan Date, type: text, required: true, placeholder: YYYY-MM-DD }
  - id: load_employee_contract_template
    type: server_form
    permission: employees.write
    title: Load a Template
    description: Copy the selected company contract template into the employee's active contract version.
    action: employees.records.load_contract_template
    handler: yaml_mutation
    operation: load_contract_template
    params: { employee_id: '{state.id}' }
    prefill: state.employee_contract_template_wizard
    refresh: [employee_detail, employee_contract_template_wizard, employee_versions]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM employees WHERE id = :employee_id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_TEMPLATE_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :employee_id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the contract template was loaded. Refresh and try again. }
        - { query: "SELECT t.id FROM employee_contract_templates t JOIN employees e ON e.id = :employee_id WHERE t.id = :template_id AND t.active = true AND (t.company_name IS NULL OR t.company_name = e.company_name) AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)", status: 422, code: EMPLOYEES_TEMPLATE_NOT_ELIGIBLE, message: Select an active contract template for the employee's company. }
      steps:
        - query: "UPDATE employees SET job_position_name = (SELECT job_position FROM employee_contract_templates WHERE id = :template_id), department_name = (SELECT department_name FROM employee_contract_templates WHERE id = :template_id), employment_type = (SELECT contract_type FROM employee_contract_templates WHERE id = :template_id), wage = (SELECT wage FROM employee_contract_templates WHERE id = :template_id), working_schedule = (SELECT working_schedule FROM employee_contract_templates WHERE id = :template_id), contract_template_id = :template_id, contract_template_name = (SELECT name FROM employee_contract_templates WHERE id = :template_id), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :employee_id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the contract template was loaded. Reload the employee and try again.
        - query: "UPDATE employee_versions SET job_name = (SELECT job_position FROM employee_contract_templates WHERE id = :template_id), department_name = (SELECT department_name FROM employee_contract_templates WHERE id = :template_id), contract_type_name = (SELECT contract_type FROM employee_contract_templates WHERE id = :template_id), wage = (SELECT wage FROM employee_contract_templates WHERE id = :template_id), schedule_name = (SELECT working_schedule FROM employee_contract_templates WHERE id = :template_id), contract_template_id = :template_id, contract_template_name = (SELECT name FROM employee_contract_templates WHERE id = :template_id), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE employee_id = :employee_id AND active = true AND date_version = (SELECT MAX(date_version) FROM employee_versions WHERE employee_id = :employee_id AND active = true AND contract_date_start <= DATE '2026-01-15')"
          expect_changed: true
          status: 409
          code: EMPLOYEES_TEMPLATE_VERSION_NOT_FOUND
          message: The employee has no active contract version to update.
      result: { query: "SELECT * FROM employees WHERE id = :employee_id" }
    fields:
      - { field: template_id, label: Contract Template, type: select, options_source: employee_contract_templates_for_employee, required: true }
  - id: add_employee_bank_account
    type: server_form
    permission: employees.write
    title: Add Bank Account
    description: Add an employee bank account and its salary allocation line.
    action: employees.records.bank_account.create
    handler: line_item
    operation: create
    domain: employee_bank_account
    params: { id: '{state.id}' }
    refresh: [employee_detail, employee_bank_accounts]
    mutation:
      generated: [line_id]
      before_steps: [{ query: "SELECT COALESCE(MAX(sequence), 0) + 10 AS next_sequence FROM employee_bank_accounts WHERE employee_id = :id AND active = true", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_BANK_ACCOUNT_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND row_version = :parent_expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the bank account was added. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:acc_number AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:currency_code AS VARCHAR))) > 0 AND CAST(:amount AS DOUBLE) >= 0 AND ((CAST(:amount_type AS VARCHAR) = 'percentage' AND CAST(:amount AS DOUBLE) <= 100) OR CAST(:amount_type AS VARCHAR) = 'fixed') AND CAST(:amount_type AS VARCHAR) IN ('percentage', 'fixed')", status: 422, code: EMPLOYEES_BANK_ACCOUNT_VALUES_INVALID, message: Account number, currency, allocation, and allocation type are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employee_bank_accounts WHERE employee_id = :id AND LOWER(acc_number) = LOWER(TRIM(CAST(:acc_number AS VARCHAR))) AND active = true)", status: 409, code: EMPLOYEES_BANK_ACCOUNT_EXISTS, message: This account number is already linked to the employee. }
        - { query: "SELECT 1 AS ok WHERE CAST(:amount_type AS VARCHAR) <> 'percentage' OR COALESCE((SELECT SUM(amount) FROM employee_bank_accounts WHERE employee_id = :id AND active = true AND amount_type = 'percentage'), 0) + CAST(:amount AS DOUBLE) <= 100", status: 422, code: EMPLOYEES_BANK_ACCOUNT_ALLOCATION_INVALID, message: Percentage allocations cannot exceed 100%. }
      steps:
        - query: "INSERT INTO employee_bank_accounts(id, row_version, employee_id, company_name, acc_number, bank_name, acc_holder_name, currency_code, amount, amount_type, trusted, sequence, active) SELECT :line_id, 1, e.id, e.company_name, TRIM(CAST(:acc_number AS VARCHAR)), NULLIF(TRIM(CAST(:bank_name AS VARCHAR)), ''), NULLIF(TRIM(CAST(:acc_holder_name AS VARCHAR)), ''), UPPER(TRIM(CAST(:currency_code AS VARCHAR))), CAST(:amount AS DOUBLE), CAST(:amount_type AS VARCHAR), COALESCE(CAST(:trusted AS BOOLEAN), false), :next_sequence, true FROM employees e WHERE e.id = :id"
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :parent_expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the bank account was added. Reload and try again.
      result: { query: "SELECT * FROM employee_bank_accounts WHERE id = :line_id" }
    fields:
      - { field: acc_number, label: Account Number, type: text, required: true }
      - { field: bank_name, label: Bank, type: text }
      - { field: acc_holder_name, label: Account Holder, type: text }
      - { field: currency_code, label: Currency, type: text, required: true, default: VND }
      - { field: amount, label: Allocation, type: number, required: true, min: 0 }
      - { field: amount_type, label: Type, type: select, options: [{ value: percentage, label: Percentage }, { value: fixed, label: Fixed }] }
      - { field: trusted, label: Trusted, type: checkbox }
