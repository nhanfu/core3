        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RELATED_USER_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the related user was updated. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE :auth_user_id IS NULL OR LENGTH(TRIM(CAST(:auth_user_id AS VARCHAR))) > 0", status: 422, code: EMPLOYEES_RELATED_USER_INVALID, message: Select an enabled related user or clear the field. }
        - { query: "SELECT 1 AS ok WHERE :auth_user_id IS NULL OR EXISTS (SELECT 1 FROM employee_related_user_catalog WHERE id = TRIM(CAST(:auth_user_id AS VARCHAR)) AND enabled = true)", status: 422, code: EMPLOYEES_RELATED_USER_INVALID, message: Select an enabled related user or clear the field. }
        - { query: "SELECT 1 AS ok WHERE :auth_user_id IS NULL OR NOT EXISTS (SELECT 1 FROM employees WHERE auth_user_id = TRIM(CAST(:auth_user_id AS VARCHAR)) AND id <> :id)", status: 409, code: EMPLOYEES_RELATED_USER_ALREADY_LINKED, message: This user is already linked to another employee. }
      steps:
        - query: "UPDATE employees SET auth_user_id = NULLIF(TRIM(CAST(:auth_user_id AS VARCHAR)), ''), user_name = (SELECT u.name FROM employee_related_user_catalog u WHERE u.id = NULLIF(TRIM(CAST(:auth_user_id AS VARCHAR)), '')), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the related user was updated. Reload and try again.
      result: { query: "SELECT * FROM employees WHERE id = :id" }
    fields:
      - { field: auth_user_id, label: Related User, type: select, options_source: employee_related_user_options }
  - id: edit_employee_user_active
    type: server_form
    permission: auth.users.manage
