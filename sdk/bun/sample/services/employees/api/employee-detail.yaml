      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_DEPARTURE_EMPLOYEE_NOT_FOUND, message: The active employee is not available for departure registration. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before departure registration. Reload the employee and try again. }
        - { query: "SELECT 1 AS ok FROM employee_departure_reasons r JOIN employees e ON e.id = :id WHERE r.name = TRIM(CAST(:departure_reason_name AS VARCHAR)) AND r.active = true AND (COALESCE(r.company_name, '') = '' OR r.company_name = e.company_name OR r.id IN ('departure-reason-fired', 'departure-reason-resigned', 'departure-reason-retired'))", status: 422, code: EMPLOYEES_DEPARTURE_REASON_INVALID, message: Select an active departure reason for the employee's company. }
        - { query: "SELECT 1 AS ok WHERE :departure_date IS NOT NULL AND regexp_matches(CAST(:departure_date AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 422, code: EMPLOYEES_DEPARTURE_DATE_INVALID, message: Departure date must use YYYY-MM-DD. }
        - { query: "SELECT 1 AS ok FROM employees WHERE id = :id AND (contract_start IS NULL OR CAST(:departure_date AS DATE) >= contract_start)", status: 422, code: EMPLOYEES_DEPARTURE_DATE_INVALID, message: Departure date cannot be earlier than the current contract start date. }
      before_steps:
        - query: "SELECT CASE WHEN COALESCE(CAST(:remove_related_user AS BOOLEAN), false) AND e.auth_user_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM employees other WHERE other.id <> e.id AND other.auth_user_id = e.auth_user_id AND other.active = true) THEN true ELSE false END AS clear_related_user FROM employees e WHERE e.id = :id"
          assign: true
      steps:
        - query: |
            UPDATE employees
            SET active = false,
                state = 'Terminated',
                departure_reason_name = TRIM(CAST(:departure_reason_name AS VARCHAR)),
                departure_description = NULLIF(TRIM(CAST(:departure_description AS VARCHAR)), ''),
                departure_date = CAST(:departure_date AS DATE),
                termination_date = CAST(:departure_date AS DATE),
                contract_end = CASE WHEN COALESCE(CAST(:set_date_end AS BOOLEAN), true) AND contract_start IS NOT NULL THEN CAST(:departure_date AS DATE) ELSE contract_end END,
                auth_user_id = CASE WHEN COALESCE(CAST(:clear_related_user AS BOOLEAN), false) THEN NULL ELSE auth_user_id END,
                user_name = CASE WHEN COALESCE(CAST(:clear_related_user AS BOOLEAN), false) THEN NULL ELSE user_name END,
                row_version = row_version + 1,
                updated_at = CURRENT_TIMESTAMP
            WHERE id = :id AND active = true AND row_version = :expected_row_version
              AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before departure registration. Reload the employee and try again.
      result: { query: "SELECT * FROM employees WHERE id = :id" }
    fields:
      - { field: departure_reason_name, label: Departure Reason, type: select, options_source: employee_departure_wizard_reasons, required: true }
      - { field: departure_date, label: Contract End Date, type: date, required: true }
      - { field: set_date_end, label: Set Contract End Date, type: checkbox, default: true }
      - { field: remove_related_user, label: Remove Related User, type: checkbox, show_if: "state.employee_departure_wizard.is_user_employee === true" }
      - { field: departure_description, label: Detailed Reason, type: textarea }
  - id: archive_employee_detail
    type: server
    permission: employees.write
    action: employees.records.archive
    handler: yaml_mutation
    operation: update
    refresh: [employee_detail]
    params: { values: { active: false } }
    mutation:
      operation: update
      table: employees
      fields: [active]
      defaults: { active: false }
      concurrency: { required: true }
      before_steps:
        - { query: "SELECT 'employee-archive-cleanup-' || CAST(:id AS VARCHAR) || '-' || CAST(:expected_row_version AS VARCHAR) AS cleanup_event_id", assign: true }
        - { query: "SELECT COUNT(*) AS cleared_employee_count FROM employees target JOIN employees archived ON archived.id = :id WHERE target.id <> archived.id AND target.active = true AND target.company_name = archived.company_name AND (target.manager_id = archived.id OR target.manager_name = archived.name OR target.org_parent_name = archived.name OR target.coach_name = archived.name)", assign: true }
      guards:
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RECORD_NOT_FOUND, message: Active employee not found in the current company. }
      steps:
        - { query: "INSERT INTO employee_archive_cleanup_events(id, employee_id, company_name, requested_by, cleared_employee_count) SELECT :cleanup_event_id, archived.id, archived.company_name, NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), ''), :cleared_employee_count FROM employees archived WHERE archived.id = :id", expect_changed: true, status: 404, code: EMPLOYEES_RECORD_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "UPDATE employee_versions SET manager_id = NULL, manager_name = NULL, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE active = true AND employee_id IN (SELECT target.id FROM employees target JOIN employees archived ON archived.id = :id WHERE target.id <> archived.id AND target.active = true AND target.company_name = archived.company_name AND (target.manager_id = archived.id OR target.manager_name = archived.name OR target.org_parent_name = archived.name OR target.coach_name = archived.name))" }
        - { query: "UPDATE employees SET manager_id = CASE WHEN manager_id = :id THEN NULL ELSE manager_id END, manager_name = CASE WHEN manager_id = :id OR manager_name = (SELECT name FROM employees WHERE id = :id) THEN NULL ELSE manager_name END, org_parent_name = CASE WHEN manager_id = :id OR org_parent_name = (SELECT name FROM employees WHERE id = :id) THEN NULL ELSE org_parent_name END, coach_name = CASE WHEN coach_name = (SELECT name FROM employees WHERE id = :id) THEN NULL ELSE coach_name END, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id <> :id AND active = true AND company_name = (SELECT company_name FROM employees WHERE id = :id) AND (manager_id = :id OR manager_name = (SELECT name FROM employees WHERE id = :id) OR org_parent_name = (SELECT name FROM employees WHERE id = :id) OR coach_name = (SELECT name FROM employees WHERE id = :id))" }
      result: { query: "SELECT e.*, COALESCE((SELECT cleared_employee_count FROM employee_archive_cleanup_events WHERE id = :cleanup_event_id), 0) AS archive_cleanup_count FROM employees e WHERE e.id = :id" }
  - id: restore_employee_detail
    type: server
    permission: employees.write
    action: employees.records.restore
    handler: yaml_mutation
    operation: update
    refresh: [employee_detail]
    params: { values: { active: true } }
    mutation: { operation: update, table: employees, fields: [active], defaults: { active: true }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM employees WHERE id = :id AND active = false AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RECORD_NOT_FOUND, message: Archived employee not found in the current company. }], result: { query: "SELECT * FROM employees WHERE id = :id" } }
