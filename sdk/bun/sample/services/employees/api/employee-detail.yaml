page: { id: employee-detail }
datasources:
  - id: employee_detail
    single: true
    permission: employees.read
    query: "SELECT id, row_version, employee_number, name, COALESCE(NULLIF(legal_name, ''), name) AS legal_name, image_url, auth_user_id, user_name, CASE WHEN auth_user_id IS NULL THEN NULL ELSE COALESCE((SELECT u.enabled FROM employee_related_user_catalog u WHERE u.id = employees.auth_user_id), false) END AS is_user_active, work_email, work_phone, mobile_phone, phone, private_email, private_phone, company_id, company_name, department_id, department_name, work_contact_id, (SELECT c.name FROM base_contacts c WHERE c.id = employees.work_contact_id AND c.active = true LIMIT 1) AS work_contact_name, (SELECT c.row_version FROM base_contacts c WHERE c.id = employees.work_contact_id AND c.active = true LIMIT 1) AS work_contact_row_version, COALESCE((SELECT COUNT(*) FROM base_contacts c WHERE c.id = employees.work_contact_id AND c.active = true), 0) AS related_contacts_count, COALESCE((SELECT ARRAY_AGG(r.tag_id ORDER BY t.name, t.id) FROM employee_tag_rel r JOIN employee_tags t ON t.id = r.tag_id WHERE r.employee_id = employees.id), CAST([] AS VARCHAR[])) AS employee_tag_ids, COALESCE((SELECT string_agg(t.name, ', ' ORDER BY t.name, t.id) FROM employee_tag_rel r JOIN employee_tags t ON t.id = r.tag_id WHERE r.employee_id = employees.id), '') AS employee_tags, job_id, job_position_name, job_title, manager_id, manager_name, coach_name, private_car_plate, work_location_id, COALESCE(work_location_type, (SELECT w.location_type FROM employee_work_locations w WHERE w.id = employees.work_location_id), 'other') AS work_location_type, work_address_id, COALESCE(NULLIF(employee_properties, ''), '{}') AS employee_properties, work_location, address_name, departure_reason_name, departure_description, CAST(departure_date AS VARCHAR) AS departure_date, additional_note, org_parent_name, org_direct_reports, employment_type, employee_type, contract_type_name, pay_category_name, hr_responsible_name, state, active, CAST(hire_date AS VARCHAR) AS hire_date, CAST(termination_date AS VARCHAR) AS termination_date, CAST(contract_start AS VARCHAR) AS contract_start, CAST(contract_end AS VARCHAR) AS contract_end, CAST(trial_date_end AS VARCHAR) AS trial_date_end, CAST(birthday AS VARCHAR) AS birthday, COALESCE(birthday_public_display, false) AS birthday_public_display, CASE WHEN COALESCE(birthday_public_display, false) AND birthday IS NOT NULL THEN strftime(birthday, '%d %B') ELSE 'hidden' END AS birthday_public_display_string, wage, working_schedule, working_schedule_id, contract_template_id, contract_template_name, timezone, lang, barcode, pin, presence, COALESCE(hr_presence_state, CASE WHEN active = false THEN 'archive' WHEN presence = 'online' THEN 'present' WHEN presence = 'offline' THEN 'absent' ELSE 'out_of_working_hour' END) AS hr_presence_state, CASE WHEN auth_user_id IS NULL THEN 'presence_undetermined' ELSE 'presence_' || COALESCE(COALESCE(hr_presence_state, CASE WHEN active = false THEN 'archive' WHEN presence = 'online' THEN 'present' WHEN presence = 'offline' THEN 'absent' ELSE 'out_of_working_hour' END), 'out_of_working_hour') END AS hr_icon_display, CASE WHEN auth_user_id IS NULL THEN false ELSE true END AS show_hr_icon_display, skills, resume_summary, street, emergency_contact, emergency_phone, marital, spouse_complete_name, CAST(spouse_birthdate AS VARCHAR) AS spouse_birthdate, children, certificate, study_field, study_school, place_of_birth, country_of_birth, sex, visa_no, CAST(visa_expire AS VARCHAR) AS visa_expire, permit_no, CAST(work_permit_expiration_date AS VARCHAR) AS work_permit_expiration_date, work_permit_name, has_work_permit, work_permit_scheduled_activity, country_id, identification_id, ssnid, passport_id, CAST(passport_expiration_date AS VARCHAR) AS passport_expiration_date, private_street, private_street2, private_city, private_state_id, private_zip, distance_home_work, distance_home_work_unit, id_card, id_card_name, driving_license, driving_license_name, CAST((SELECT COUNT(*) FROM employee_versions v WHERE v.employee_id = employees.id) AS INTEGER) AS version_count FROM employees WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
  - id: employee_org_chart
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_ORG_CHART_UNAVAILABLE, message: The employee organization chart is temporarily unavailable. } }
    query: "SELECT child.id, child.row_version, child.employee_number, child.name, COALESCE(child.job_title, child.job_position_name, '') AS job_title, COALESCE(child.department_name, '') AS department_name, COALESCE(child.work_email, '') AS work_email, child.manager_id, child.manager_name, child.company_name, child.active FROM employees child JOIN employees target ON target.id = :id AND target.active = true AND (COALESCE(:current_company_name, '') = '' OR target.company_name = :current_company_name) WHERE (:fixture_state IS NULL OR :fixture_state NOT IN ('empty', 'not_found')) AND child.id <> target.id AND child.active = true AND child.company_name = target.company_name AND (child.manager_id = target.id OR child.org_parent_name = target.name OR child.manager_name = target.name) ORDER BY child.name, child.id"
  - id: employee_avatar
    single: true
    permission: employees.read
    query: "SELECT a.id, a.employee_id, a.file_name, a.mime_type, a.size_bytes, a.uploaded_by, CAST(a.created_at AS VARCHAR) AS created_at, '/api/employees/avatars/' || a.id AS image_url FROM employee_avatar_assets a JOIN employees e ON e.id = a.employee_id WHERE a.employee_id = :id AND a.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY a.created_at DESC, a.id DESC LIMIT 1"
  - id: employee_attachments
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_ATTACHMENTS_UNAVAILABLE, message: Employee attachments are temporarily unavailable. } }
    query: "SELECT a.id, a.row_version, a.employee_id, a.company_name, a.file_name, a.mime_type, a.size_bytes, a.uploaded_by, CAST(a.created_at AS VARCHAR) AS created_at FROM employee_attachments a JOIN employees e ON e.id = a.employee_id WHERE a.employee_id = :id AND a.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY a.created_at DESC, a.id DESC"
  - id: employee_related_contacts
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_RELATED_CONTACTS_UNAVAILABLE, message: Related contacts are temporarily unavailable. } }
    query: "SELECT c.id, c.row_version, c.name, c.company_type, c.email, c.phone, c.city, c.country_name, c.company_id FROM base_contacts c JOIN employees e ON e.work_contact_id = c.id WHERE e.id = :id AND e.active = true AND c.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY c.name, c.id"
  - id: employee_messages
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_MESSAGES_UNAVAILABLE, message: Employee messages are temporarily unavailable. } }
    query: "SELECT m.id, COALESCE(m.row_version, 1) AS row_version, m.activity_id, m.state, m.employee_id, m.actor_name, m.action, m.action_label, m.detail, CAST(m.created_at AS VARCHAR) AS created_at FROM employee_messages m JOIN employees e ON e.id = m.employee_id WHERE m.employee_id = :id AND e.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY m.created_at DESC, m.id DESC"
  - id: employee_detail_activities
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_ACTIVITIES_UNAVAILABLE, message: Employee activities are temporarily unavailable. } }
    query: "SELECT a.id, a.row_version, a.employee_id, a.employee_name, a.job_title, a.activity_type, a.activity_summary, CAST(a.activity_date AS VARCHAR) AS activity_date, a.activity_user, a.activity_state, a.timing, a.activity_count, a.activity_origin FROM employee_activities a JOIN employees e ON e.id = a.employee_id WHERE a.employee_id = :id AND e.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY a.activity_date DESC, a.id DESC"
  - id: employee_followers
    single: false
    permission: employees.read
    query: "SELECT f.user_id, u.name, u.email, CAST(f.created_at AS VARCHAR) AS followed_at FROM employee_followers f JOIN employee_related_user_catalog u ON u.id = f.user_id JOIN employees e ON e.id = f.employee_id WHERE f.employee_id = :id AND u.enabled = true AND e.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY f.created_at, f.user_id"
  - id: employee_follower_candidates
    single: false
    permission: employees.write
    query: "SELECT u.id AS value, u.name || ' · ' || u.email AS label FROM employee_related_user_catalog u JOIN employees e ON e.id = :id WHERE u.enabled = true AND NOT EXISTS (SELECT 1 FROM employee_followers f WHERE f.employee_id = :id AND f.user_id = u.id) AND e.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY u.name, u.id"
  - id: employee_work_contact_options
    single: false
    permission: employees.write
    query: "SELECT c.id AS value, c.name || CASE WHEN c.email IS NULL OR c.email = '' THEN '' ELSE ' · ' || c.email END AS label FROM base_contacts c JOIN employees e ON e.id = :id WHERE c.active = true AND c.is_company = false AND (c.company_id IS NULL OR c.company_id = CASE WHEN e.company_name IN ('Core3 Vietnam', 'Core3 Vietnam Branch') THEN 'company-vietnam' WHEN e.company_name = 'Core3 Demo Company' THEN 'company-demo' ELSE c.company_id END) AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY c.name, c.id"
  - id: employee_company_options
    single: false
    permission: employees.manage
    query: "SELECT id AS value, name AS label FROM employee_companies WHERE active = true ORDER BY name, id"
  - id: employee_work_addresses_for_employee
    single: false
    permission: employees.write
    query: "SELECT a.id AS value, a.name AS label FROM employee_work_addresses a WHERE a.active = true AND (a.company_name IS NULL OR a.company_name = :current_company_name) ORDER BY a.name, a.id"
  - id: employee_job_position_options
    single: false
    permission: employees.write
    query: "SELECT j.id AS value, j.name AS label FROM employee_job_positions j JOIN employees e ON e.id = :id WHERE j.active = true AND (j.company_name IS NULL OR j.company_name = e.company_name) AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY j.sequence, j.name, j.id"
  - id: employee_department_options
    single: false
    permission: employees.write
    query: "SELECT d.id AS value, d.name AS label FROM employee_departments d JOIN employees e ON e.id = :id WHERE COALESCE(d.active, true) = true AND (d.company_name IS NULL OR d.company_name = e.company_name) AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY d.name, d.id"
  - id: employee_tag_options
    single: false
    permission: employees.write
    query: "SELECT t.id AS value, t.name AS label FROM employee_tags t WHERE NOT EXISTS (SELECT 1 FROM employee_tag_rel r WHERE r.employee_id = :id AND r.tag_id = t.id) ORDER BY t.name, t.id"
  - id: employee_tag_assignments
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_TAGS_UNAVAILABLE, message: Employee tags are temporarily unavailable. } }
    query: "SELECT r.employee_id, r.tag_id AS id, 1 AS row_version, r.tag_id, t.name, t.color FROM employee_tag_rel r JOIN employee_tags t ON t.id = r.tag_id JOIN employees e ON e.id = r.employee_id WHERE r.employee_id = :id AND e.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY t.name, t.id"
  - id: employee_manager_options
    single: false
    permission: employees.write
    query: "SELECT e.id AS value, e.name AS label FROM employees e JOIN employees target ON target.id = :id WHERE e.active = true AND e.id <> target.id AND (e.company_name IS NULL OR e.company_name = target.company_name) AND (COALESCE(:current_company_name, '') = '' OR target.company_name = :current_company_name) ORDER BY e.name, e.id"
  - id: employee_work_locations_for_employee
    single: false
    permission: employees.write
    query: "SELECT w.id AS value, w.name AS label FROM employee_work_locations w JOIN employees e ON e.id = :id WHERE w.active = true AND (w.company_name IS NULL OR w.company_name = e.company_name) AND w.address_name = e.address_name AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY w.name, w.id"
  - id: employee_working_schedules_for_employee
    single: false
    permission: employees.manage
    query: "SELECT s.id AS value, s.name AS label FROM employee_working_schedules s WHERE s.active = true AND (s.company_name IS NULL OR s.company_name = :current_company_name) ORDER BY s.name, s.id"
  - id: employee_detail_language_options
    single: false
    permission: employees.write
    query: "SELECT code AS value, name AS label FROM employee_languages WHERE active = true ORDER BY name, code"
  - id: employee_coach_options
    single: false
    permission: employees.write
    query: "SELECT DISTINCT c.name AS value, c.name AS label FROM employees c WHERE c.active = true AND (COALESCE(:current_company_name, '') = '' OR c.company_name = :current_company_name) ORDER BY c.name"
  - id: employee_departure_wizard
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_DEPARTURE_EMPLOYEE_NOT_FOUND, message: The active employee is not available for departure registration. }
      transport_error: { status: 503, code: EMPLOYEES_DEPARTURE_WIZARD_UNAVAILABLE, message: Departure registration is temporarily unavailable. }
    query: |
      SELECT e.id, e.row_version, e.name AS employee_name, e.company_name,
        CAST(e.contract_start AS VARCHAR) AS contract_start, CAST(e.contract_end AS VARCHAR) AS contract_end, e.auth_user_id, e.user_name,
        CASE WHEN e.auth_user_id IS NOT NULL OR NULLIF(TRIM(COALESCE(e.user_name, '')), '') IS NOT NULL THEN true ELSE false END AS is_user_employee,
        COALESCE(CAST(e.departure_date AS VARCHAR), '2026-01-15') AS departure_date,
        e.departure_reason_name, e.departure_description,
        true AS set_date_end, false AS remove_related_user
      FROM employees e
      WHERE e.id = :id AND e.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
  - id: employee_departure_wizard_reasons
    single: false
    permission: employees.read
    query: "SELECT r.id AS value, r.name AS label FROM employee_departure_reasons r WHERE r.active = true AND (COALESCE(:current_company_name, '') = '' OR r.company_name = :current_company_name OR r.id IN ('departure-reason-fired', 'departure-reason-resigned', 'departure-reason-retired')) ORDER BY r.sequence, r.id"
  - id: employee_user_wizard
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_USER_EMPLOYEE_NOT_FOUND, message: Employee not found for user creation. }
      transport_error: { status: 503, code: EMPLOYEES_USER_WIZARD_UNAVAILABLE, message: User creation is temporarily unavailable. }
    query: |
      SELECT e.id, e.row_version, e.name, e.work_email AS login, e.work_phone AS phone,
        e.auth_user_id, e.user_name, e.company_name
      FROM employees e
      WHERE e.id = :id
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
  - id: employee_related_user_options
    single: false
    permission: auth.users.manage
    query: |
      SELECT u.id AS value, u.name || ' · ' || u.email AS label
      FROM employee_related_user_catalog u
      JOIN employees target ON target.id = :id
      WHERE u.enabled = true
        AND (u.id = target.auth_user_id OR NOT EXISTS (
          SELECT 1 FROM employees linked WHERE linked.auth_user_id = u.id
        ))
        AND (COALESCE(:current_company_name, '') = '' OR target.company_name = :current_company_name)
      ORDER BY u.name, u.id
  - id: employee_launch_plan_wizard
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_PLAN_EMPLOYEE_NOT_FOUND, message: Active employee not found for plan launch. }
      transport_error: { status: 503, code: EMPLOYEES_PLAN_WIZARD_UNAVAILABLE, message: Launch Plan is temporarily unavailable. }
    query: |
      SELECT e.id, e.row_version, e.name AS employee_name, e.job_title, e.department_name, e.company_name,
        'hr.employee' AS res_model, '2026-01-15' AS plan_date
      FROM employees e
      WHERE e.id = :id AND e.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
  - id: employee_launch_plans
    single: false
    permission: employees.write
    query: |
      SELECT p.id AS value, p.name AS label
      FROM employee_activity_plans p
      JOIN employees e ON e.id = :employee_id
      WHERE p.active = true AND p.res_model = 'hr.employee'
        AND (p.company_name IS NULL OR p.company_name = e.company_name)
        AND (p.department_name IS NULL OR p.department_name = e.department_name)
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY p.name, p.id
  - id: employee_contract_template_wizard
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_TEMPLATE_EMPLOYEE_NOT_FOUND, message: Active employee not found for contract template loading. }
      transport_error: { status: 503, code: EMPLOYEES_TEMPLATE_WIZARD_UNAVAILABLE, message: Contract template loading is temporarily unavailable. }
    query: |
      SELECT e.id, e.row_version, e.name AS employee_name, e.company_name, e.active,
        e.contract_template_id, e.contract_template_name
      FROM employees e
      WHERE e.id = :id AND e.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
  - id: employee_contract_templates_for_employee
    single: false
    permission: employees.write
    query: |
      SELECT t.id AS value, t.name AS label
      FROM employee_contract_templates t
      JOIN employees e ON e.id = :employee_id
      WHERE t.active = true
        AND (t.company_name IS NULL OR t.company_name = e.company_name)
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY t.name, t.id
  - id: employee_bank_accounts
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_BANK_ACCOUNTS_UNAVAILABLE, message: Employee bank accounts are temporarily unavailable. } }
    query: |
      SELECT b.id, b.row_version, b.employee_id, b.company_name, b.acc_number,
        b.bank_name, b.acc_holder_name, b.currency_code, b.amount, b.amount_type,
        b.trusted, b.sequence, b.active,
        CASE WHEN b.amount_type = 'percentage' THEN CAST(b.amount AS VARCHAR) || '%' ELSE printf('%.2f %s', b.amount, b.currency_code) END AS allocation_display,
        CASE WHEN b.trusted THEN 'Trusted' ELSE 'Untrusted' END AS trust_status
      FROM employee_bank_accounts b
      JOIN employees e ON e.id = b.employee_id
      WHERE b.employee_id = :employee_id
        AND b.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY b.sequence, b.id
  - id: employee_skill_assignments
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_SKILLS_UNAVAILABLE, message: Employee skills are temporarily unavailable. } }
    query: |
      SELECT a.id, a.row_version, a.employee_id, a.skill_type_id, t.name AS skill_type_name,
        a.skill_id, s.name AS skill_name, a.skill_level_id, l.name AS skill_level_name,
        l.level_progress, CAST(a.valid_from AS VARCHAR) AS valid_from,
        CAST(a.valid_to AS VARCHAR) AS valid_to, a.active,
        CASE WHEN a.valid_to IS NULL OR a.valid_to >= DATE '2026-01-15' THEN 'Current' ELSE 'Expired' END AS validity_status
      FROM employee_skill_assignments a
      JOIN employees e ON e.id = a.employee_id
      JOIN employee_skill_types t ON t.id = a.skill_type_id
      JOIN employee_skills s ON s.id = a.skill_id AND s.skill_type_id = a.skill_type_id
      JOIN employee_skill_levels l ON l.id = a.skill_level_id AND l.skill_type_id = a.skill_type_id
      WHERE a.employee_id = :employee_id AND a.active = true
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY t.sequence, s.sequence, a.id
  - id: employee_skill_types_for_employee
    single: false
    permission: employees.write
    query: |
      SELECT t.id AS value, t.name AS label
      FROM employee_skill_types t
      JOIN employees e ON e.id = :employee_id
      WHERE t.active = true AND t.is_certification = false
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY t.sequence, t.id
  - id: employee_skills_for_type
    single: false
    permission: employees.write
    query: |
      SELECT s.id AS value, s.name AS label
      FROM employee_skills s
      JOIN employee_skill_types t ON t.id = s.skill_type_id
      WHERE s.skill_type_id = :skill_type_id AND t.active = true AND t.is_certification = false
      ORDER BY s.sequence, s.id
  - id: employee_skill_levels_for_type
    single: false
    permission: employees.write
    query: |
      SELECT l.id AS value, l.name AS label
      FROM employee_skill_levels l
      JOIN employee_skill_types t ON t.id = l.skill_type_id
      WHERE l.skill_type_id = :skill_type_id AND t.active = true AND t.is_certification = false
      ORDER BY l.level_progress DESC, l.id
  - id: employee_resume_lines
    single: false
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_RESUME_LINES_UNAVAILABLE, message: Employee resume lines are temporarily unavailable. } }
    query: |
      SELECT r.id, r.row_version, r.employee_id, r.line_type_id, t.name AS line_type_name,
        t.is_course, r.name, CAST(r.date_start AS VARCHAR) AS date_start,
        CAST(r.date_end AS VARCHAR) AS date_end, r.duration, r.course_type,
        r.description, r.external_url
      FROM employee_resume_lines r
      JOIN employees e ON e.id = r.employee_id
      JOIN employee_resume_line_types t ON t.id = r.line_type_id AND t.active = true
      WHERE r.employee_id = :employee_id
        AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
      ORDER BY t.sequence, r.date_end DESC NULLS LAST, r.date_start DESC, r.id
  - id: employee_resume_line_types_for_employee
    single: false
    permission: employees.write
    query: "SELECT id AS value, name AS label FROM employee_resume_line_types WHERE active = true ORDER BY sequence, id"
actions:
  - id: view_employee_org_report
    type: navigate
    permission: employees.read
    navigate_to: /employees/detail
    params: { id: '{row.id}' }
  - id: upload_employee_attachment
    type: upload
    action: employees.records.attachments.upload
    handler: attachment_metadata
    permission: employees.write
    kind: employee_attachment
    params: { employee_id: '{state.employee_detail.id}', expected_row_version: '{state.employee_detail.row_version}' }
    refresh: [employee_detail, employee_attachments]
    mutation:
      generated: [attachment_id]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :employee_id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_ATTACHMENT_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
