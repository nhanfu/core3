  - id: delete_employee_resume_line
    type: server
    permission: employees.write
    action: employees.records.resume_line.delete
    handler: line_item
    operation: delete
    domain: employee_resume_line
    params: { id: '{state.id}', line_id: '{row.id}', parent_expected_row_version: '{state.employee_detail.row_version}' }
    confirm: Delete this resume line?
    refresh: [employee_detail, employee_resume_lines]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RESUME_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :parent_expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the resume line was deleted. Reload and try again. }
        - { query: "SELECT id FROM employee_resume_lines WHERE id = :line_id AND employee_id = :id AND row_version = :expected_row_version", status: 409, code: EMPLOYEES_RESUME_STALE, message: This resume line changed before it was deleted. Reload and try again. }
      steps:
        - query: "DELETE FROM employee_resume_lines WHERE id = :line_id AND employee_id = :id AND row_version = :expected_row_version"
          expect_changed: true
          status: 409
          code: EMPLOYEES_RESUME_STALE
          message: This resume line changed before it was deleted. Reload and try again.
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :parent_expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the resume line was deleted. Reload and try again.
  - id: edit_employee
