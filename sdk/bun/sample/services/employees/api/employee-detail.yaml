    mutation: { operation: update, table: employees, fields: [active], defaults: { active: false }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RECORD_NOT_FOUND, message: Active employee not found in the current company. }], result: { query: "SELECT * FROM employees WHERE id = :id" } }
  - id: restore_employee_detail
    type: server
    permission: employees.write
    action: employees.records.restore
