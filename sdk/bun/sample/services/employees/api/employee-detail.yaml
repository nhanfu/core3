    description: Add education, experience, or training to the employee resume.
    action: employees.records.resume_line.create
    handler: line_item
    operation: create
    domain: employee_resume_line
    params: { id: '{state.id}', parent_expected_row_version: '{state.employee_detail.row_version}' }
    refresh: [employee_detail, employee_resume_lines]
    mutation:
      concurrency: { required: true }
      before_steps: [{ query: "SELECT 'employee-resume-' || CAST(:id AS VARCHAR) || '-' || regexp_replace(lower(trim(CAST(:name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-' || CAST(:date_start AS VARCHAR) AS resume_line_id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RESUME_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :parent_expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the resume line was added. Reload and try again. }
        - { query: "SELECT id FROM employee_resume_line_types WHERE id = :line_type_id AND active = true", status: 422, code: EMPLOYEES_RESUME_TYPE_INVALID, message: Select an active resume section. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND CAST(:date_start AS DATE) IS NOT NULL AND (CAST(:date_end AS DATE) IS NULL OR CAST(:date_end AS DATE) >= CAST(:date_start AS DATE))", status: 422, code: EMPLOYEES_RESUME_VALUES_INVALID, message: Resume name and a valid date range are required. }
        - { query: "SELECT 1 AS ok WHERE CAST(:duration AS INTEGER) >= 0", status: 422, code: EMPLOYEES_RESUME_DURATION_INVALID, message: Duration must be zero or greater. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employee_resume_lines WHERE employee_id = :id AND LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND date_start = CAST(:date_start AS DATE))", status: 409, code: EMPLOYEES_RESUME_EXISTS, message: This resume line already exists for the employee and date. }
      steps:
        - query: "INSERT INTO employee_resume_lines(id, row_version, employee_id, line_type_id, name, date_start, date_end, duration, course_type, description, external_url) VALUES(:resume_line_id, 1, :id, :line_type_id, TRIM(CAST(:name AS VARCHAR)), CAST(:date_start AS DATE), CAST(:date_end AS DATE), CAST(:duration AS INTEGER), COALESCE(NULLIF(TRIM(CAST(:course_type AS VARCHAR)), ''), 'external'), NULLIF(TRIM(CAST(:description AS VARCHAR)), ''), NULLIF(TRIM(CAST(:external_url AS VARCHAR)), ''))"
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :parent_expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the resume line was added. Reload and try again.
      result: { query: "SELECT * FROM employee_resume_lines WHERE id = :resume_line_id" }
    fields:
      - { field: line_type_id, label: Resume Section, type: select, options_source: employee_resume_line_types_for_employee, required: true }
      - { field: name, label: Title, type: text, required: true }
      - { field: date_start, label: Start Date, type: date, required: true, default: '2026-01-15' }
      - { field: date_end, label: End Date, type: date }
      - { field: duration, label: Duration (hours), type: number, default: 0 }
      - { field: course_type, label: Type, type: select, options: [{ value: external, label: External }, { value: internal, label: Internal }] }
      - { field: description, label: Description, type: textarea }
      - { field: external_url, label: External URL, type: text }
