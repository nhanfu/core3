        - query: "UPDATE employee_versions SET job_name = (SELECT job_position FROM employee_contract_templates WHERE id = :template_id), department_name = (SELECT department_name FROM employee_contract_templates WHERE id = :template_id), contract_type_name = (SELECT contract_type FROM employee_contract_templates WHERE id = :template_id), wage = (SELECT wage FROM employee_contract_templates WHERE id = :template_id), schedule_name = (SELECT working_schedule FROM employee_contract_templates WHERE id = :template_id), contract_template_id = :template_id, contract_template_name = (SELECT name FROM employee_contract_templates WHERE id = :template_id), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE employee_id = :employee_id AND active = true AND date_version = (SELECT MAX(date_version) FROM employee_versions WHERE employee_id = :employee_id AND active = true AND contract_date_start <= DATE '2026-01-15')"
          expect_changed: true
          status: 409
          code: EMPLOYEES_TEMPLATE_VERSION_NOT_FOUND
          message: The employee has no active contract version to update.
      result: { query: "SELECT * FROM employees WHERE id = :employee_id" }
    fields:
      - { field: template_id, label: Contract Template, type: select, options_source: employee_contract_templates_for_employee, required: true }
