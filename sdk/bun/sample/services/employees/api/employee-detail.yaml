        - { query: "SELECT id FROM employees WHERE id = :employee_id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the contract template was loaded. Refresh and try again. }
