        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_COMPANY_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the company was edited. Reload and try again. }
        - { query: "SELECT id FROM employee_companies WHERE id = :company_id AND active = true", status: 422, code: EMPLOYEES_COMPANY_INVALID, message: Select an active company. }
        - { query: "SELECT 1 AS ok FROM employee_versions WHERE employee_id = :id AND active = true AND date_version = (SELECT MAX(current_v.date_version) FROM employee_versions current_v WHERE current_v.employee_id = :id AND current_v.active = true AND current_v.contract_date_start <= DATE '2026-01-15')", status: 409, code: EMPLOYEES_COMPANY_VERSION_NOT_FOUND, message: The employee has no active Payroll record to update. }
