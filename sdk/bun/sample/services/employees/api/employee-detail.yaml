    params: { id: '{state.employee_detail.id}', expected_row_version: '{state.employee_detail.row_version}' }
    refresh: [employee_detail, employee_messages]
    fields: [{ field: content, label: Message, type: textarea, required: true, placeholder: Write a message… }]
    mutation:
      generated: [message_id]
      before_steps: [{ query: "SELECT 'employee-message-' || CAST(:id AS VARCHAR) || '-' || CAST(COALESCE(:expected_row_version, 1) AS VARCHAR) AS message_id", assign: true }]
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_MESSAGE_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the message was sent. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: EMPLOYEES_MESSAGE_INVALID, message: Message content must be between 1 and 4000 characters. }
      steps:
        - query: "INSERT INTO employee_messages(id, employee_id, actor_id, actor_name, action, action_label, detail, row_version, state) VALUES(:message_id, :id, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'HR Manager'), 'employees.message', 'Message', TRIM(CAST(:content AS VARCHAR)), 1, 'done')"
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the message was sent. Reload and try again.
      result: { query: "SELECT id, employee_id, actor_name, action, action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM employee_messages WHERE id = :message_id" }
  - id: schedule_employee_activity
    type: server_form
    permission: employees.write
    title: Schedule activity
    description: Schedule one ad-hoc activity for this employee and record it in the chatter.
    action: employees.records.activity.schedule
    handler: yaml_mutation
    operation: activity
    params: { id: '{state.employee_detail.id}', expected_row_version: '{state.employee_detail.row_version}' }
    refresh: [employee_detail, employee_detail_activities, employee_messages]
    mutation:
      generated: [activity_id]
      before_steps: [{ query: "SELECT 'employee-activity-adhoc-' || CAST(:id AS VARCHAR) || '-' || CAST(COALESCE(:expected_row_version, 1) AS VARCHAR) AS activity_id", assign: true }]
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_ACTIVITY_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND row_version = :expected_row_version AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the activity was scheduled. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(NULLIF(TRIM(CAST(:activity_type AS VARCHAR)), ''), 'todo') IN ('todo', 'call', 'meeting', 'email', 'document')", status: 422, code: EMPLOYEES_ACTIVITY_TYPE_INVALID, message: Select a supported activity type. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:content AS VARCHAR))) BETWEEN 1 AND 4000", status: 422, code: EMPLOYEES_ACTIVITY_SUMMARY_INVALID, message: Activity content must be between 1 and 4000 characters. }
        - { query: "SELECT 1 AS ok WHERE regexp_matches(CAST(COALESCE(NULLIF(TRIM(CAST(:activity_date AS VARCHAR)), ''), '2026-01-15') AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 422, code: EMPLOYEES_ACTIVITY_DATE_INVALID, message: Activity due date must use YYYY-MM-DD. }
      steps:
        - query: |
            INSERT INTO employee_activities(
              id, row_version, employee_id, employee_name, job_title, activity_type, activity_summary,
              activity_date, activity_user, activity_state, activity_count, timing, is_primary,
              plan_id, plan_name, responsible_type, activity_origin
            )
            SELECT
              :activity_id, 1, e.id, e.name, e.job_title,
              COALESCE(NULLIF(TRIM(CAST(:activity_type AS VARCHAR)), ''), 'todo'),
              TRIM(CAST(:content AS VARCHAR)),
              CAST(COALESCE(NULLIF(TRIM(CAST(:activity_date AS VARCHAR)), ''), '2026-01-15') AS DATE),
              COALESCE(NULLIF(TRIM(CAST(:activity_user AS VARCHAR)), ''), NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'HR Manager'),
              'planned', 1,
              CASE WHEN CAST(COALESCE(NULLIF(TRIM(CAST(:activity_date AS VARCHAR)), ''), '2026-01-15') AS DATE) < DATE '2026-01-15' THEN 'Overdue' WHEN CAST(COALESCE(NULLIF(TRIM(CAST(:activity_date AS VARCHAR)), ''), '2026-01-15') AS DATE) = DATE '2026-01-15' THEN 'Today' ELSE 'Planned' END,
              false, NULL, NULL, NULL, 'adhoc'
            FROM employees e
            WHERE e.id = :id AND e.active = true
              AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)
        - query: "INSERT INTO employee_messages(id, employee_id, actor_id, actor_name, action, action_label, detail, row_version, activity_id, state) VALUES(gen_random_uuid(), :id, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'HR Manager'), 'employees.activity.schedule', 'Scheduled activity', TRIM(CAST(:content AS VARCHAR)), 1, :activity_id, 'planned')"
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the activity was scheduled. Reload and try again.
      result: { query: "SELECT * FROM employee_activities WHERE id = :activity_id" }
    fields:
      - { field: content, label: Activity, type: textarea, required: true, placeholder: Describe the activity… }
      - { field: activity_type, label: Activity type, type: select, options: [{ value: todo, label: To-Do }, { value: call, label: Call }, { value: meeting, label: Meeting }, { value: email, label: Email }, { value: document, label: Document }], default: todo }
      - { field: activity_date, label: Due date, type: text, placeholder: YYYY-MM-DD, default: '2026-01-15' }
      - { field: activity_user, label: Assigned to, type: text }
  - id: complete_employee_activity
    type: server
    permission: employees.write
    action: employees.records.activity.complete
    handler: yaml_mutation
    operation: complete_activity
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [employee_detail, employee_detail_activities, employee_messages]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT m.activity_id FROM employee_messages m JOIN employees e ON e.id = m.employee_id WHERE m.id = :id AND m.action = 'employees.activity.schedule' AND m.activity_id IS NOT NULL AND e.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)", status: 404, code: EMPLOYEES_ACTIVITY_MESSAGE_NOT_FOUND, message: Planned activity message not found in the current company. }
        - { query: "SELECT a.id FROM employee_activities a JOIN employee_messages m ON m.activity_id = a.id WHERE m.id = :id AND a.activity_state = 'planned'", status: 409, code: EMPLOYEES_ACTIVITY_ALREADY_DONE, message: This activity is already completed or unavailable. }
        - { query: "SELECT m.id FROM employee_messages m JOIN employees e ON e.id = m.employee_id WHERE m.id = :id AND m.action = 'employees.activity.schedule' AND m.state = 'planned' AND m.activity_id IS NOT NULL AND m.row_version = :expected_row_version AND e.active = true AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The activity changed before it was completed. Reload and try again. }
      steps:
        - query: "UPDATE employee_activities SET activity_state = 'done', timing = 'Done', row_version = row_version + 1 WHERE id = (SELECT activity_id FROM employee_messages WHERE id = :id) AND activity_state = 'planned'"
          expect_changed: true
          status: 409
          code: EMPLOYEES_ACTIVITY_ALREADY_DONE
          message: This activity is already completed or unavailable.
        - query: "UPDATE employee_messages SET state = 'done', row_version = row_version + 1 WHERE id = :id AND row_version = :expected_row_version AND state = 'planned'"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The activity message changed before it was completed. Reload and try again.
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = (SELECT employee_id FROM employee_messages WHERE id = :id) AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: EMPLOYEES_ACTIVITY_MESSAGE_NOT_FOUND
          message: The activity employee changed before completion was saved. Reload and try again.
        - query: "INSERT INTO employee_messages(id, employee_id, actor_id, actor_name, action, action_label, detail, row_version, state) SELECT gen_random_uuid(), employee_id, :current_user_id, COALESCE(NULLIF(TRIM(CAST(:current_user_name AS VARCHAR)), ''), 'HR Manager'), 'employees.activity.complete', 'Completed activity', detail, 1, 'done' FROM employee_messages WHERE id = :id"
      result: { query: "SELECT a.* FROM employee_activities a JOIN employee_messages m ON m.activity_id = a.id WHERE m.id = :id" }
  - id: add_employee_follower
    type: server
    permission: employees.write
    action: employees.followers.add
    handler: order_chatter
    operation: follower_add
    params: { user_id: '{row.user_id}', expected_row_version: '{state.employee_detail.row_version}' }
    refresh: [employee_detail, employee_followers, employee_follower_candidates, employee_messages]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_FOLLOWER_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the follower was added. Reload and try again. }
        - { query: "SELECT id FROM employee_related_user_catalog WHERE id = :user_id AND enabled = true", status: 404, code: EMPLOYEES_FOLLOWER_USER_NOT_FOUND, message: Select an enabled follower. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employee_followers WHERE employee_id = :id AND user_id = :user_id)", status: 409, code: EMPLOYEES_FOLLOWER_EXISTS, message: This user already follows the employee. }
      steps:
        - query: "INSERT INTO employee_followers(employee_id, user_id, added_by) VALUES(:id, :user_id, :current_user_id)"
        - query: "INSERT INTO employee_messages(id, employee_id, actor_id, actor_name, action, action_label, detail, row_version, state) VALUES(gen_random_uuid(), :id, :current_user_id, :current_user_name, 'employees.followers.add', 'Added follower', (SELECT name FROM employee_related_user_catalog WHERE id = :user_id) || ' now follows ' || (SELECT name FROM employees WHERE id = :id), 1, 'done')"
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the follower was added. Reload and try again.
      result: { query: "SELECT :user_id AS user_id, u.name, u.email, false AS removed FROM employee_related_user_catalog u WHERE u.id = :user_id" }
  - id: remove_employee_follower
    type: server
    permission: employees.write
    action: employees.followers.remove
    handler: order_chatter
    operation: follower_remove
    params: { user_id: '{row.user_id}', expected_row_version: '{state.employee_detail.row_version}' }
