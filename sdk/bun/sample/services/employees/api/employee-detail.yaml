    params: { id: '{state.id}', parent_expected_row_version: '{state.employee_detail.row_version}' }
    refresh: [employee_detail, employee_skill_assignments]
    mutation:
      generated: [assignment_id]
      before_steps: [{ query: "SELECT 'employee-skill-' || CAST(:id AS VARCHAR) || '-' || CAST(:skill_id AS VARCHAR) AS assignment_id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_SKILL_EMPLOYEE_NOT_FOUND, message: Active employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :parent_expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before the skill was added. Reload and try again. }
        - { query: "SELECT t.id FROM employee_skill_types t WHERE t.id = :skill_type_id AND t.active = true AND t.is_certification = false", status: 422, code: EMPLOYEES_SKILL_TYPE_INVALID, message: Select an active regular skill type. }
        - { query: "SELECT s.id FROM employee_skills s WHERE s.id = :skill_id AND s.skill_type_id = :skill_type_id", status: 422, code: EMPLOYEES_SKILL_INVALID, message: Select a skill from the chosen skill type. }
        - { query: "SELECT l.id FROM employee_skill_levels l WHERE l.id = :skill_level_id AND l.skill_type_id = :skill_type_id", status: 422, code: EMPLOYEES_SKILL_LEVEL_INVALID, message: Select a level from the chosen skill type. }
        - { query: "SELECT 1 AS ok WHERE CAST(:valid_to AS DATE) IS NULL OR CAST(:valid_to AS DATE) >= CAST(:valid_from AS DATE)", status: 422, code: EMPLOYEES_SKILL_DATES_INVALID, message: The skill end date must be after the start date. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employee_skill_assignments WHERE employee_id = :id AND skill_id = :skill_id AND active = true)", status: 409, code: EMPLOYEES_SKILL_EXISTS, message: This skill is already assigned to the employee. }
      steps:
        - query: "INSERT INTO employee_skill_assignments(id, row_version, employee_id, skill_type_id, skill_id, skill_level_id, valid_from, valid_to, active) VALUES(:assignment_id, 1, :id, :skill_type_id, :skill_id, :skill_level_id, CAST(:valid_from AS DATE), CAST(:valid_to AS DATE), true)"
        - query: "UPDATE employees SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :parent_expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before the skill was added. Reload and try again.
      result: { query: "SELECT * FROM employee_skill_assignments WHERE id = :assignment_id" }
    fields:
