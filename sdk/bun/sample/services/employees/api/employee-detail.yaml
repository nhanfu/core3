        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:id_card AS BOOLEAN), false) = false OR NULLIF(TRIM(CAST(:id_card_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: EMPLOYEES_ID_CARD_DOCUMENT_INVALID, message: An ID card filename is required when a document is present. }
