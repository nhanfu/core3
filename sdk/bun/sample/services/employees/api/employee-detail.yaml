page: { id: employee-detail }
datasources:
  - id: employee_detail
    single: true
    permission: employees.read
    query: "SELECT id, row_version, employee_number, name, image_url, auth_user_id, user_name, work_email, work_phone, phone, private_email, company_name, department_name, job_title, manager_name, coach_name, work_location, employment_type, state, active, CAST(hire_date AS VARCHAR) AS hire_date, CAST(termination_date AS VARCHAR) AS termination_date, CAST(contract_start AS VARCHAR) AS contract_start, CAST(contract_end AS VARCHAR) AS contract_end, CAST(birthday AS VARCHAR) AS birthday, wage, working_schedule, timezone, barcode, presence, skills, resume_summary, street FROM employees WHERE id = :id"
actions:
  - id: edit_employee
    type: server_form
    permission: employees.write
    title: Edit employee
    action: employees.records.update
    handler: yaml_mutation
    operation: update
    prefill: state.employee_detail
    refresh: [employee_detail]
    mutation:
      operation: update
      table: employees
      fields: [name, work_email, work_phone, phone, private_email, company_name, department_name, job_title, manager_name, coach_name, work_location, employment_type, hire_date, contract_start, contract_end, birthday, wage, working_schedule, timezone, barcode, skills, resume_summary, street]
      required: [name]
      timestamps: true
      result: { query: "SELECT * FROM employees WHERE id = :id" }
    fields:
      - { field: name, label: Employee Name, type: text, required: true }
      - { field: work_email, label: Work Email, type: text }
      - { field: work_phone, label: Work Phone, type: text }
      - { field: department_name, label: Department, type: text }
      - { field: job_title, label: Job Position, type: text }
      - { field: manager_name, label: Manager, type: text }
      - { field: coach_name, label: Coach, type: text }
      - { field: work_location, label: Work Location, type: text }
      - { field: hire_date, label: Start Date, type: date }
      - { field: contract_start, label: Contract Start, type: date }
      - { field: contract_end, label: Contract End, type: date }
      - { field: employment_type, label: Employment Type, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: private_email, label: Private Email, type: text }
      - { field: birthday, label: Birthday, type: date }
      - { field: wage, label: Wage, type: number }
      - { field: working_schedule, label: Working Schedule, type: text }
      - { field: timezone, label: Timezone, type: text }
      - { field: barcode, label: Badge ID, type: text }
      - { field: skills, label: Skills, type: text }
      - { field: resume_summary, label: Resume, type: textarea }
      - { field: street, label: Private Address, type: text }
  - id: archive_employee_detail
    type: server
    permission: employees.write
    action: employees.records.archive
    handler: yaml_mutation
    operation: update
    refresh: [employee_detail]
    mutation: { operation: update, table: employees, fields: [active], defaults: { active: false } }
  - id: restore_employee_detail
    type: server
    permission: employees.write
    action: employees.records.restore
    handler: yaml_mutation
    operation: update
    refresh: [employee_detail]
    mutation: { operation: update, table: employees, fields: [active], defaults: { active: true } }
