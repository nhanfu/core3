  - id: generate_employee_barcode
    type: server
    permission: employees.write
    action: employees.records.generate_barcode
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}', expected_row_version: '{state.employee_detail.row_version}', current_user_id: '{current_user_id}' }
    refresh: [employee_detail]
    mutation:
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(CAST(:current_user_id AS VARCHAR), '') IS NOT NULL", status: 403, code: EMPLOYEES_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - query: "SELECT id, CASE WHEN NULLIF(REGEXP_REPLACE(COALESCE(employee_number, ''), '[^0-9]', '', 'g'), '') IS NOT NULL THEN '041' || RIGHT('000000000' || REGEXP_REPLACE(employee_number, '[^0-9]', '', 'g'), 9) ELSE 'B' || SUBSTR(REGEXP_REPLACE(UPPER(id), '[^A-Z0-9]', '', 'g'), 1, 17) END AS generated_barcode FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          assign: true
          status: 404
          code: EMPLOYEES_BARCODE_EMPLOYEE_NOT_FOUND
          message: Active employee not found in the current company.
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :expected_row_version AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: The employee changed before a badge ID was generated. Reload the employee and try again. }
        - { query: "SELECT id FROM employees WHERE id = :id AND NULLIF(TRIM(COALESCE(barcode, '')), '') IS NULL", status: 409, code: EMPLOYEES_BADGE_ALREADY_ASSIGNED, message: This employee already has a badge ID. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(CAST(:generated_barcode AS VARCHAR)) BETWEEN 1 AND 18 AND regexp_matches(CAST(:generated_barcode AS VARCHAR), '^[A-Za-z0-9]+$')", status: 422, code: EMPLOYEES_BADGE_INVALID, message: The generated badge ID is invalid. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employees WHERE barcode = :generated_barcode AND id <> :id)", status: 409, code: EMPLOYEES_BADGE_EXISTS, message: The generated badge ID is already assigned. }
      steps:
        - query: "UPDATE employees SET barcode = :generated_barcode, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND active = true AND row_version = :expected_row_version AND NULLIF(TRIM(COALESCE(barcode, '')), '') IS NULL AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before a badge ID was generated. Reload the employee and try again.
      result: { query: "SELECT * FROM employees WHERE id = :id" }
  - id: create_employee_user
    type: server_form
    permission: auth.users.manage
    title: Create User
    description: Create an invited user linked to this employee, using the employee's work contact defaults.
    action: employees.records.create_user
    handler: yaml_mutation
    operation: create
    prefill: state.employee_user_wizard
    refresh: [employee_detail, employee_user_wizard]
    mutation:
      boolean_fields: [enabled]
      guards:
        - { query: "SELECT id FROM employees WHERE id = :id AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_USER_EMPLOYEE_NOT_FOUND, message: Employee not found in the current company. }
        - { query: "SELECT id FROM employees WHERE id = :id AND auth_user_id IS NULL AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: EMPLOYEES_USER_ALREADY_LINKED, message: This employee already has a user. }
        - { query: "SELECT id FROM employees WHERE id = :id AND row_version = :expected_row_version AND auth_user_id IS NULL AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: STALE_RECORD, message: This employee changed before the user was created. Refresh and try again. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND regexp_matches(TRIM(CAST(:login AS VARCHAR)), '^[^@ ]+@[^@ ]+\\.[^@ ]+$')", status: 422, code: EMPLOYEES_USER_VALUES_INVALID, message: User name and a valid login email are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM users WHERE LOWER(email) = LOWER(TRIM(CAST(:login AS VARCHAR))))", status: 409, code: EMPLOYEES_USER_LOGIN_EXISTS, message: A user already exists with this login. }
      before_steps:
        - query: "SELECT 'employee-user-' || CAST(:id AS VARCHAR) AS new_user_id"
          assign: true
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM users WHERE id = :new_user_id)"
          status: 409
          code: EMPLOYEES_USER_ID_EXISTS
          message: A linked user already exists for this employee.
      steps:
        - query: "INSERT INTO users(id, email, name, password_hash, preferred_lang, enabled) VALUES(:new_user_id, LOWER(TRIM(CAST(:login AS VARCHAR))), TRIM(CAST(:name AS VARCHAR)), 'invite-pending', 'en', false)"
        - query: "UPDATE employees SET auth_user_id = :new_user_id, user_name = TRIM(CAST(:name AS VARCHAR)), work_email = LOWER(TRIM(CAST(:login AS VARCHAR))), work_phone = NULLIF(TRIM(CAST(:phone AS VARCHAR)), ''), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND auth_user_id IS NULL AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)"
          expect_changed: true
          status: 409
          code: STALE_RECORD
          message: The employee changed before user creation. Reload the employee and try again.
      result: { query: "SELECT * FROM employees WHERE id = :id" }
    fields:
      - { field: name, label: Name, type: text, required: true }
      - { field: login, label: Login, type: text, required: true }
      - { field: phone, label: Phone, type: text }
  - id: edit_employee_related_user
