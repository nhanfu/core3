        - { query: "SELECT 1 AS ok WHERE :manager_id IS NULL OR EXISTS (SELECT 1 FROM employees target JOIN employees manager ON manager.id = :manager_id WHERE target.id = :id AND manager.active = true AND manager.id <> target.id AND (manager.company_name IS NULL OR manager.company_name = target.company_name) AND (COALESCE(:current_company_name, '') = '' OR target.company_name = :current_company_name))", status: 422, code: EMPLOYEES_MANAGER_INVALID, message: Select an active Manager from the employee's current company. }
