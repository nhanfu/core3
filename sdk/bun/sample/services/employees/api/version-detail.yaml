page: { id: employee-version-detail }
datasources:
  - id: employee_version_detail
    single: true
    permission: employees.read
    error_states:
      missing_record: { status: 404, code: EMPLOYEES_VERSION_NOT_FOUND, message: Employee record not found in the current company. }
      transport_error: { status: 503, code: EMPLOYEES_VERSION_DETAIL_UNAVAILABLE, message: Employee record details are temporarily unavailable. }
    query: "SELECT v.id, v.row_version, v.employee_id, e.name AS employee_name, e.employee_number, CAST(v.date_version AS VARCHAR) AS date_version, CAST(v.contract_date_start AS VARCHAR) AS contract_date_start, CAST(v.contract_date_end AS VARCHAR) AS contract_date_end, v.additional_note, v.wage, v.contract_type_name, v.job_name, v.department_name, v.schedule_name, v.company_name, v.contract_template_name, v.active, CASE WHEN v.active THEN 'Active' ELSE 'Archived' END AS status, CASE WHEN v.contract_date_start IS NOT NULL AND v.contract_date_start > DATE '2026-01-15' THEN 'future' WHEN v.contract_date_end IS NOT NULL AND v.contract_date_end < DATE '2026-01-15' THEN 'expired' ELSE 'current' END AS contract_state FROM employee_versions v JOIN employees e ON e.id = v.employee_id WHERE v.id = :id AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name)"
actions:
  - id: open_employee_from_version
    type: navigate
    permission: employees.read
    navigate_to: /employees/detail
    params: { id: '{state.employee_version_detail.employee_id}' }
