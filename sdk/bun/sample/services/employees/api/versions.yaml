page: { id: employee-versions }
datasources:
  - id: employee_versions
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_VERSIONS_UNAVAILABLE, message: Employee records are temporarily unavailable. } }
    query: "SELECT v.id, v.row_version, v.employee_id, e.name AS employee_name, CAST(v.date_version AS VARCHAR) AS date_version, CAST(v.contract_date_start AS VARCHAR) AS contract_date_start, CAST(v.contract_date_end AS VARCHAR) AS contract_date_end, v.additional_note, v.wage, v.contract_type_name, v.job_name, v.department_name, v.schedule_name, v.company_name, v.active, CASE WHEN v.active THEN 'Active' ELSE 'Archived' END AS status, CASE WHEN v.contract_date_start IS NOT NULL AND v.contract_date_start > DATE '2026-01-15' THEN 'future' WHEN v.contract_date_end IS NOT NULL AND v.contract_date_end < DATE '2026-01-15' THEN 'expired' ELSE 'current' END AS contract_state FROM employee_versions v JOIN employees e ON e.id = v.employee_id WHERE (:fixture_state IS NULL OR :fixture_state NOT IN ('empty', 'not_found')) AND (:active IS NULL OR v.active = CAST(:active AS BOOLEAN)) AND (:contract_state IS NULL OR (CASE WHEN v.contract_date_start IS NOT NULL AND v.contract_date_start > DATE '2026-01-15' THEN 'future' WHEN v.contract_date_end IS NOT NULL AND v.contract_date_end < DATE '2026-01-15' THEN 'expired' ELSE 'current' END) = :contract_state) AND (:q IS NULL OR e.name ILIKE '%' || :q || '%' OR COALESCE(v.job_name, '') ILIKE '%' || :q || '%' OR COALESCE(v.department_name, '') ILIKE '%' || :q || '%' OR COALESCE(v.schedule_name, '') ILIKE '%' || :q || '%') ORDER BY v.date_version DESC, e.name, v.id"
