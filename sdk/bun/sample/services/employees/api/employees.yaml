page: { id: employees }
datasources:
  - id: employee_states
    permission: employees.read
    query: "SELECT value, label FROM (VALUES ('Draft','New'), ('Active','Active'), ('On Leave','On leave'), ('Terminated','Departed')) states(value, label)"
  - id: employee_departments
    permission: employees.read
    query: "SELECT id AS value, name AS label FROM employee_departments WHERE state = 'Active' ORDER BY name"
  - id: employee_coaches
    permission: employees.read
    query: "SELECT DISTINCT c.name AS value, c.name AS label FROM employees c WHERE c.active = true AND (COALESCE(:current_company_name, '') = '' OR c.company_name = :current_company_name) ORDER BY c.name"
  - id: employees
    permission: employees.read
    pivot:
      fields: [state, department_name, job_title, employment_type, hire_date, activity_count]
    query: "SELECT e.id, e.row_version, e.employee_number, e.name, e.image_url, e.work_email, e.work_phone, e.department_name, e.job_title, e.manager_name, e.coach_name, e.employment_type, e.state, e.active, e.company_name, CAST(e.hire_date AS VARCHAR) AS hire_date, COALESCE(a.activity_type, 'todo') AS activity_type, a.activity_summary, CAST(a.activity_date AS VARCHAR) AS activity_date, a.activity_user, COALESCE(a.activity_state, 'planned') AS activity_state, COALESCE(a.activity_count, 0) AS activity_count FROM employees e LEFT JOIN employee_activities a ON a.employee_id = e.id AND a.is_primary = true WHERE ((:active IS NULL AND COALESCE(e.active, true) = true) OR (:active IS NOT NULL AND e.active = CAST(:active AS BOOLEAN))) AND (:q IS NULL OR e.employee_number ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%' OR e.work_email ILIKE '%' || :q || '%' OR COALESCE(e.coach_name, '') ILIKE '%' || :q || '%') AND (:state IS NULL OR e.state = :state) AND (:department_name IS NULL OR e.department_name = :department_name) AND (:coach_name IS NULL OR e.coach_name = :coach_name) AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY e.name, e.id"
  - id: employee_sample_load_runs
    permission: employees.read
    query: "SELECT id, company_name, requested_by, employee_count, CAST(loaded_at AS VARCHAR) AS loaded_at, row_version FROM employee_sample_load_runs WHERE COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name ORDER BY loaded_at DESC, id DESC"
actions:
  - id: load_sample_employee_data
    type: server
    permission: employees.write
    action: employees.records.load_sample_data
    handler: yaml_mutation
    operation: create
    refresh: [employees, employee_departments, employee_sample_load_runs]
    mutation:
      before_steps:
        - query: "SELECT regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS sample_slug, 'Research & Development - ' || trim(CAST(:current_company_name AS VARCHAR)) AS sample_department_rd_name, 'Management - ' || trim(CAST(:current_company_name AS VARCHAR)) AS sample_department_management_name, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-load' AS sample_load_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-department-rd' AS sample_department_rd_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-department-management' AS sample_department_management_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-001' AS sample_employee_1_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-002' AS sample_employee_2_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-003' AS sample_employee_3_id, 'SAMPLE-' || upper(regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g')) || '-001' AS sample_employee_1_number, 'SAMPLE-' || upper(regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g')) || '-002' AS sample_employee_2_number, 'SAMPLE-' || upper(regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g')) || '-003' AS sample_employee_3_number"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_SAMPLE_DATA_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_company_name AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_SAMPLE_DATA_COMPANY_REQUIRED, message: A current company is required to load employee sample data. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employees WHERE active = true AND company_name = :current_company_name)", status: 409, code: EMPLOYEES_SAMPLE_DATA_ALREADY_LOADED, message: Sample employee data is available only for an empty Employees action. }
      steps:
        - query: "INSERT OR IGNORE INTO employee_departments(id, name, manager_name, state, active, company_name, row_version) VALUES(:sample_department_rd_id, :sample_department_rd_name, 'Michael Williams', 'Active', true, :current_company_name, 1)"
        - query: "INSERT OR IGNORE INTO employee_departments(id, name, manager_name, state, active, company_name, row_version) VALUES(:sample_department_management_id, :sample_department_management_name, 'Michael Williams', 'Active', true, :current_company_name, 1)"
        - query: "INSERT INTO employees(id, employee_number, name, work_email, work_phone, company_name, department_id, department_name, job_title, manager_name, employment_type, contract_type_name, hr_responsible_name, pin, hire_date, contract_start, timezone, state, active, row_version) VALUES(:sample_employee_1_id, :sample_employee_1_number, 'Michael Williams', 'williams@sample.core3.local', '+1 555-555-6230', :current_company_name, :sample_department_management_id, :sample_department_management_name, 'Chief Executive Officer', 'Michael Williams', 'Employee', 'Permanent', 'HR Manager', '4821', DATE '2026-01-05', DATE '2026-01-05', 'UTC', 'Active', true, 1), (:sample_employee_2_id, :sample_employee_2_number, 'Emma Granger', 'granger@sample.core3.local', '+1 555-555-6231', :current_company_name, :sample_department_rd_id, :sample_department_rd_name, 'Consultant', 'Michael Williams', 'Employee', 'Permanent', 'HR Manager', '7314', DATE '2026-01-06', DATE '2026-01-06', 'UTC', 'Active', true, 1), (:sample_employee_3_id, :sample_employee_3_number, 'Simon Jones', 'jones@sample.core3.local', '+1 555-555-6232', :current_company_name, :sample_department_rd_id, :sample_department_rd_name, 'Experienced Developer', 'Michael Williams', 'Employee', 'Permanent', 'HR Manager', '1906', DATE '2026-01-07', DATE '2026-01-07', 'UTC', 'Active', true, 1)"
        - query: "INSERT INTO employee_sample_load_runs(id, company_name, requested_by, employee_count, loaded_at, row_version) VALUES(:sample_load_id, :current_company_name, COALESCE(NULLIF(:current_user_name, ''), :current_user_id), 3, TIMESTAMP '2026-09-20 00:00:00', 1)"
      result: { query: "SELECT * FROM employee_sample_load_runs WHERE id = :sample_load_id" }
  - id: view_employee
    type: navigate
    permission: employees.read
    navigate_to: /employees/detail
    params: { id: '{row.id}' }
  - id: create_employee
    type: server_form
    permission: employees.write
    title: New employee
    action: employees.records.create
    handler: yaml_mutation
    operation: create
    refresh: [employees]
    mutation:
      operation: insert
      table: employees
      fields: [employee_number, name, legal_name, work_email, work_phone, mobile_phone, company_name, department_name, job_position_name, employment_type, contract_type_name, hr_responsible_name, pin, coach_name, hire_date, emergency_contact, emergency_phone, marital, spouse_complete_name, spouse_birthdate, children, certificate, study_field, place_of_birth, country_of_birth, sex, visa_no, visa_expire, permit_no, work_permit_expiration_date, work_permit_name, has_work_permit, country_id, identification_id, ssnid, passport_id, passport_expiration_date, private_street, private_street2, private_city, private_state_id, private_zip, private_country_id, distance_home_work, distance_home_work_unit, private_email, private_phone, birthday, birthday_public_display, id_card, id_card_name, driving_license, driving_license_name]
      boolean_fields: [birthday_public_display, has_work_permit, id_card, driving_license]
      required: [employee_number, name, hire_date]
      defaults: { active: true, state: Draft, marital: single, children: 0, distance_home_work_unit: kilometers, contract_type_name: Permanent, hr_responsible_name: HR Manager }
      generated: [id]
      before_steps: [{ query: "SELECT 'employee-' || regexp_replace(lower(trim(CAST(:employee_number AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:employee_number AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND :hire_date IS NOT NULL", status: 422, code: EMPLOYEES_RECORD_VALUES_INVALID, message: Employee number, name, and start date are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employees WHERE LOWER(employee_number) = LOWER(TRIM(CAST(:employee_number AS VARCHAR))))", status: 409, code: EMPLOYEES_RECORD_NUMBER_EXISTS, message: An employee with this number already exists. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR COALESCE(:company_name, :current_company_name) = :current_company_name", status: 403, code: EMPLOYEES_COMPANY_SCOPE_REQUIRED, message: Employee must belong to the current company. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:coach_name AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM employees c WHERE c.active = true AND c.name = TRIM(CAST(:coach_name AS VARCHAR)) AND (COALESCE(:current_company_name, '') = '' OR c.company_name = :current_company_name))", status: 422, code: EMPLOYEES_COACH_INVALID, message: Select an active coach from the current company. }
        - { query: "SELECT COALESCE(NULLIF(TRIM(CAST(:legal_name AS VARCHAR)), ''), TRIM(CAST(:name AS VARCHAR))) AS legal_name", assign: true }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:id_card AS BOOLEAN), false) = false OR NULLIF(TRIM(CAST(:id_card_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: EMPLOYEES_ID_CARD_DOCUMENT_INVALID, message: An ID card filename is required when a document is present. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:driving_license AS BOOLEAN), false) = false OR NULLIF(TRIM(CAST(:driving_license_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: EMPLOYEES_DRIVING_LICENSE_DOCUMENT_INVALID, message: A driving license filename is required when a document is present. }
      result: { query: "SELECT * FROM employees WHERE id = :id" }
    fields:
      - { field: employee_number, label: Employee number, type: text, required: true }
      - { field: name, label: Name, type: text, required: true }
      - { field: legal_name, label: Legal Name, type: text }
      - { field: work_email, label: Work Email, type: text }
      - { field: work_phone, label: Work Phone, type: text }
      - { field: mobile_phone, label: Work Mobile, type: text }
      - { field: private_email, label: Private Email, type: text }
      - { field: private_phone, label: Private Phone, type: text }
      - { field: birthday, label: Birthday, type: date }
      - { field: birthday_public_display, label: Show to all employees, type: checkbox }
      - { field: company_name, label: Company, type: text }
      - { field: department_name, label: Department, type: text }
      - { field: job_title, label: Job Position, type: text }
      - { field: employment_type, label: Employment Type, type: select, options: [{ value: Employee, label: Employee }, { value: Contractor, label: Contractor }, { value: Intern, label: Intern }] }
      - { field: contract_type_name, label: Contract Type, type: select, options: [{ value: Permanent, label: Permanent }, { value: Temporary, label: Temporary }, { value: Contractor, label: Contractor }] }
      - { field: hr_responsible_name, label: HR Responsible, type: select, options: [{ value: HR Manager, label: HR Manager }, { value: People Operations, label: People Operations }, { value: Admin User, label: Admin User }] }
      - { field: pin, label: PIN Code, type: password }
      - { field: coach_name, label: Coach, type: text }
      - { field: hire_date, label: Start Date, type: date, required: true }
      - { field: emergency_contact, label: Emergency Contact, type: text }
      - { field: emergency_phone, label: Emergency Phone, type: text }
      - { field: marital, label: Marital Status, type: select, options: [{ value: single, label: Single }, { value: married, label: Married }, { value: cohabitant, label: Cohabitant }, { value: widower, label: Widower }, { value: divorced, label: Divorced }] }
      - { field: spouse_complete_name, label: Spouse Legal Name, type: text }
      - { field: spouse_birthdate, label: Spouse Birthdate, type: date }
      - { field: children, label: Dependent Children, type: number, min: 0 }
      - { field: certificate, label: Certificate Level, type: select, options: [{ value: graduate, label: Graduate }, { value: bachelor, label: Bachelor }, { value: master, label: Master }, { value: doctor, label: Doctor }, { value: other, label: Other }] }
      - { field: study_field, label: Field of Study, type: text }
      - { field: place_of_birth, label: Place of Birth, type: text }
      - { field: country_of_birth, label: Country of Birth, type: text }
      - { field: sex, label: Gender, type: select, options: [{ value: male, label: Male }, { value: female, label: Female }, { value: other, label: Other }] }
      - { field: visa_no, label: Visa No, type: text }
      - { field: visa_expire, label: Visa Expiration, type: date }
      - { field: permit_no, label: Work Permit No, type: text }
      - { field: work_permit_expiration_date, label: Work Permit Expiration, type: date }
      - { field: has_work_permit, label: Work Permit Document, type: checkbox }
      - { field: work_permit_name, label: Document Filename, type: text }
      - { field: id_card, label: ID Card Copy, type: checkbox }
      - { field: id_card_name, label: ID Card Filename, type: text }
      - { field: driving_license, label: Driving License, type: checkbox }
      - { field: driving_license_name, label: Driving License Filename, type: text }
      - { field: country_id, label: Nationality (Country), type: text }
      - { field: identification_id, label: Identification No, type: text }
      - { field: ssnid, label: SSN No, type: text }
      - { field: passport_id, label: Passport No, type: text }
      - { field: passport_expiration_date, label: Passport Expiration, type: date }
      - { field: private_street, label: Private Street, type: text }
      - { field: private_street2, label: Private Street 2, type: text }
      - { field: private_city, label: Private City, type: text }
      - { field: private_state_id, label: Private State, type: text }
      - { field: private_zip, label: Private ZIP, type: text }
      - { field: private_country_id, label: Private Country, type: text }
      - { field: distance_home_work, label: Home-Work Distance, type: number, min: 0 }
      - { field: distance_home_work_unit, label: Distance Unit, type: select, options: [{ value: kilometers, label: km }, { value: miles, label: mi }] }
  - id: archive_employee
    type: server
    permission: employees.write
    action: employees.records.archive
    handler: yaml_mutation
    operation: update
    refresh: [employees]
    params: { values: { active: false } }
    mutation: { operation: update, table: employees, fields: [active], defaults: { active: false }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM employees WHERE id = :id AND active = true AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RECORD_NOT_FOUND, message: Active employee not found in the current company. }], result: { query: "SELECT * FROM employees WHERE id = :id" } }
  - id: restore_employee
    type: server
    permission: employees.write
    action: employees.records.restore
    handler: yaml_mutation
    operation: update
    refresh: [employees]
    params: { values: { active: true } }
    mutation: { operation: update, table: employees, fields: [active], defaults: { active: true }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM employees WHERE id = :id AND active = false AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 404, code: EMPLOYEES_RECORD_NOT_FOUND, message: Archived employee not found in the current company. }], result: { query: "SELECT * FROM employees WHERE id = :id" } }
