page: { id: employees }
datasources:
  - id: employee_states
    permission: employees.read
    query: "SELECT value, label FROM (VALUES ('Draft','New'), ('Active','Active'), ('On Leave','On leave'), ('Terminated','Departed')) states(value, label)"
  - id: employee_departments
    permission: employees.read
    query: "SELECT id AS value, name AS label FROM employee_departments WHERE state = 'Active' ORDER BY name"
  - id: employee_coaches
    permission: employees.read
    query: "SELECT DISTINCT c.name AS value, c.name AS label FROM employees c WHERE c.active = true AND (COALESCE(:current_company_name, '') = '' OR c.company_name = :current_company_name) ORDER BY c.name"
  - id: employee_language_options
    permission: employees.write
    query: "SELECT code AS value, name AS label FROM employee_languages WHERE active = true ORDER BY name, code"
  - id: employees
    permission: employees.read
    pivot:
      fields: [state, department_name, job_title, employment_type, employee_type, hire_date, contract_start, birthday, employee_count]
    query: "SELECT e.id, e.row_version, e.employee_number, e.name, e.image_url, e.work_email, e.work_phone, e.department_name, e.job_title, e.manager_name, e.coach_name, e.private_car_plate, COALESCE(NULLIF(e.employee_properties, ''), '{}') AS employee_properties, e.employment_type, e.employee_type, e.state, COALESCE(e.hr_presence_state, CASE WHEN e.active = false THEN 'archive' WHEN e.presence = 'online' THEN 'present' WHEN e.presence = 'offline' THEN 'absent' ELSE 'out_of_working_hour' END) AS hr_presence_state, e.active, e.company_name, CAST(e.hire_date AS VARCHAR) AS hire_date, CAST(e.contract_start AS VARCHAR) AS contract_start, CAST(e.contract_end AS VARCHAR) AS contract_end, CAST(e.birthday AS VARCHAR) AS birthday, CAST(1 AS INTEGER) AS employee_count, CASE WHEN e.contract_start IS NOT NULL AND e.contract_start <= DATE '2026-01-15' AND (e.contract_end IS NULL OR e.contract_end >= DATE '2026-01-15') THEN true ELSE false END AS in_contract, CASE WHEN e.contract_start IS NULL OR e.contract_start > DATE '2026-01-15' OR (e.contract_end IS NOT NULL AND e.contract_end < DATE '2026-01-15') THEN true ELSE false END AS out_of_contract, CASE WHEN e.created_at > TIMESTAMP '2025-10-17 00:00:00' THEN true ELSE false END AS newly_hired, CASE WHEN EXISTS (SELECT 1 FROM employees viewer WHERE viewer.auth_user_id = :current_user_id AND viewer.active = true AND viewer.company_name = e.company_name AND (e.manager_id = viewer.id OR e.org_parent_name = viewer.name OR e.manager_name = viewer.name)) THEN true ELSE false END AS my_team, CASE WHEN EXISTS (SELECT 1 FROM employees viewer WHERE viewer.auth_user_id = :current_user_id AND viewer.active = true AND viewer.company_name = e.company_name AND (e.department_id = viewer.department_id OR e.department_name = viewer.department_name)) THEN true ELSE false END AS my_department, COALESCE(a.activity_type, 'todo') AS activity_type, a.activity_summary, CAST(a.activity_date AS VARCHAR) AS activity_date, a.activity_user, COALESCE(a.activity_state, 'planned') AS activity_state, COALESCE(a.activity_count, 0) AS activity_count FROM employees e LEFT JOIN employee_activities a ON a.employee_id = e.id AND a.is_primary = true WHERE ((:active IS NULL AND COALESCE(e.active, true) = true) OR (:active IS NOT NULL AND e.active = CAST(:active AS BOOLEAN))) AND (:q IS NULL OR e.employee_number ILIKE '%' || :q || '%' OR e.name ILIKE '%' || :q || '%' OR e.work_email ILIKE '%' || :q || '%' OR COALESCE(e.coach_name, '') ILIKE '%' || :q || '%' OR COALESCE(e.private_car_plate, '') ILIKE '%' || :q || '%' OR COALESCE(e.employee_properties, '') ILIKE '%' || :q || '%') AND (:state IS NULL OR e.state = :state) AND (:department_name IS NULL OR e.department_name = :department_name) AND (:coach_name IS NULL OR e.coach_name = :coach_name) AND (:my_team IS NULL OR (CASE WHEN EXISTS (SELECT 1 FROM employees viewer WHERE viewer.auth_user_id = :current_user_id AND viewer.active = true AND viewer.company_name = e.company_name AND (e.manager_id = viewer.id OR e.org_parent_name = viewer.name OR e.manager_name = viewer.name)) THEN true ELSE false END) = CAST(:my_team AS BOOLEAN)) AND (:my_department IS NULL OR (CASE WHEN EXISTS (SELECT 1 FROM employees viewer WHERE viewer.auth_user_id = :current_user_id AND viewer.active = true AND viewer.company_name = e.company_name AND (e.department_id = viewer.department_id OR e.department_name = viewer.department_name)) THEN true ELSE false END) = CAST(:my_department AS BOOLEAN)) AND (:newly_hired IS NULL OR (CASE WHEN e.created_at > TIMESTAMP '2025-10-17 00:00:00' THEN true ELSE false END) = CAST(:newly_hired AS BOOLEAN)) AND (:in_contract IS NULL OR (CASE WHEN e.contract_start IS NOT NULL AND e.contract_start <= DATE '2026-01-15' AND (e.contract_end IS NULL OR e.contract_end >= DATE '2026-01-15') THEN true ELSE false END) = CAST(:in_contract AS BOOLEAN)) AND (:out_of_contract IS NULL OR (CASE WHEN e.contract_start IS NULL OR e.contract_start > DATE '2026-01-15' OR (e.contract_end IS NOT NULL AND e.contract_end < DATE '2026-01-15') THEN true ELSE false END) = CAST(:out_of_contract AS BOOLEAN)) AND (COALESCE(:current_company_name, '') = '' OR e.company_name = :current_company_name) ORDER BY e.name, e.id"
  - id: employee_sample_load_runs
    permission: employees.read
    query: "SELECT id, company_name, requested_by, employee_count, CAST(loaded_at AS VARCHAR) AS loaded_at, row_version FROM employee_sample_load_runs WHERE COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name ORDER BY loaded_at DESC, id DESC"
  - id: employee_bulk_user_creation_runs
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_BULK_USER_RUNS_UNAVAILABLE, message: Bulk user creation history is temporarily unavailable. } }
    query: "SELECT r.id, r.row_version, r.company_name, r.requested_by, r.selected_count, r.created_count, r.skipped_count, CAST(r.created_at AS VARCHAR) AS created_at FROM employee_bulk_user_creation_runs r WHERE COALESCE(:current_company_name, '') = '' OR r.company_name = :current_company_name ORDER BY r.created_at DESC, r.id DESC"
  - id: employee_bulk_user_creation_lines
    permission: employees.read
    error_states: { transport_error: { status: 503, code: EMPLOYEES_BULK_USER_LINES_UNAVAILABLE, message: Bulk user creation details are temporarily unavailable. } }
    query: "SELECT l.id, l.row_version, l.run_id, l.employee_id, l.employee_name, l.outcome, l.user_id, l.detail, CAST(l.created_at AS VARCHAR) AS created_at FROM employee_bulk_user_creation_lines l JOIN employee_bulk_user_creation_runs r ON r.id = l.run_id WHERE l.run_id = :run_id AND (COALESCE(:current_company_name, '') = '' OR r.company_name = :current_company_name) ORDER BY l.employee_id"
actions:
  - id: load_sample_employee_data
    type: server
    permission: employees.write
    action: employees.records.load_sample_data
    handler: yaml_mutation
    operation: create
    refresh: [employees, employee_departments, employee_sample_load_runs]
    mutation:
      before_steps:
        - query: "SELECT regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS sample_slug, 'Research & Development - ' || trim(CAST(:current_company_name AS VARCHAR)) AS sample_department_rd_name, 'Management - ' || trim(CAST(:current_company_name AS VARCHAR)) AS sample_department_management_name, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-load' AS sample_load_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-department-rd' AS sample_department_rd_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-department-management' AS sample_department_management_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-001' AS sample_employee_1_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-002' AS sample_employee_2_id, 'employee-sample-' || regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') || '-003' AS sample_employee_3_id, 'SAMPLE-' || upper(regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g')) || '-001' AS sample_employee_1_number, 'SAMPLE-' || upper(regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g')) || '-002' AS sample_employee_2_number, 'SAMPLE-' || upper(regexp_replace(lower(trim(CAST(:current_company_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g')) || '-003' AS sample_employee_3_number"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_SAMPLE_DATA_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_company_name AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_SAMPLE_DATA_COMPANY_REQUIRED, message: A current company is required to load employee sample data. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employees WHERE active = true AND company_name = :current_company_name)", status: 409, code: EMPLOYEES_SAMPLE_DATA_ALREADY_LOADED, message: Sample employee data is available only for an empty Employees action. }
      steps:
        - query: "INSERT OR IGNORE INTO employee_departments(id, name, manager_name, state, active, company_name, row_version) VALUES(:sample_department_rd_id, :sample_department_rd_name, 'Michael Williams', 'Active', true, :current_company_name, 1)"
        - query: "INSERT OR IGNORE INTO employee_departments(id, name, manager_name, state, active, company_name, row_version) VALUES(:sample_department_management_id, :sample_department_management_name, 'Michael Williams', 'Active', true, :current_company_name, 1)"
        - query: "INSERT INTO employees(id, employee_number, name, work_email, work_phone, company_name, department_id, department_name, job_title, manager_name, employment_type, employee_type, contract_type_name, hr_responsible_name, pin, hire_date, contract_start, timezone, state, active, row_version) VALUES(:sample_employee_1_id, :sample_employee_1_number, 'Michael Williams', 'williams@sample.core3.local', '+1 555-555-6230', :current_company_name, :sample_department_management_id, :sample_department_management_name, 'Chief Executive Officer', 'Michael Williams', 'Employee', 'employee', 'Permanent', 'HR Manager', '4821', DATE '2026-01-05', DATE '2026-01-05', 'UTC', 'Active', true, 1), (:sample_employee_2_id, :sample_employee_2_number, 'Emma Granger', 'granger@sample.core3.local', '+1 555-555-6231', :current_company_name, :sample_department_rd_id, :sample_department_rd_name, 'Consultant', 'Michael Williams', 'Employee', 'employee', 'Permanent', 'HR Manager', '7314', DATE '2026-01-06', DATE '2026-01-06', 'UTC', 'Active', true, 1), (:sample_employee_3_id, :sample_employee_3_number, 'Simon Jones', 'jones@sample.core3.local', '+1 555-555-6232', :current_company_name, :sample_department_rd_id, :sample_department_rd_name, 'Experienced Developer', 'Michael Williams', 'Employee', 'employee', 'Permanent', 'HR Manager', '1906', DATE '2026-01-07', DATE '2026-01-07', 'UTC', 'Active', true, 1)"
        - query: "INSERT INTO employee_sample_load_runs(id, company_name, requested_by, employee_count, loaded_at, row_version) VALUES(:sample_load_id, :current_company_name, COALESCE(NULLIF(:current_user_name, ''), :current_user_id), 3, TIMESTAMP '2026-09-20 00:00:00', 1)"
      result: { query: "SELECT * FROM employee_sample_load_runs WHERE id = :sample_load_id" }
  - id: view_employee
    type: navigate
    permission: employees.read
    navigate_to: /employees/detail
    params: { id: '{row.id}' }
  - id: create_employee_users_bulk
    type: server
    permission: auth.users.manage
    action: employees.records.create_users
    handler: yaml_mutation
    operation: bulk_create
    refresh: [employees, employee_bulk_user_creation_runs]
    mutation:
      generated: [run_id]
      before_steps:
        - query: "SELECT 'employee-bulk-user-' || LPAD(CAST((SELECT COUNT(*) + 1 FROM employee_bulk_user_creation_runs) AS VARCHAR), 4, '0') AS run_id"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE :selectedIds IS NOT NULL", status: 400, code: EMPLOYEES_BULK_USER_SELECTION_REQUIRED, message: Select at least one employee. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_user_id AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_BULK_USER_ACTOR_REQUIRED, message: An authenticated employee actor is required. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:current_company_name AS VARCHAR)), '') IS NOT NULL", status: 403, code: EMPLOYEES_BULK_USER_COMPANY_REQUIRED, message: A current company is required to create employee users. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employees e WHERE e.id IN :selectedIds AND e.active = true AND e.company_name <> :current_company_name)", status: 403, code: EMPLOYEES_BULK_USER_COMPANY_FORBIDDEN, message: All selected employees must belong to the current company. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM employees e WHERE e.id IN :selectedIds AND e.active = true AND e.company_name = :current_company_name)", status: 404, code: EMPLOYEES_BULK_USER_EMPLOYEE_NOT_FOUND, message: One or more selected employees are missing or inactive. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:expected_row_version, 0) = 0 OR NOT EXISTS (SELECT 1 FROM employees e WHERE e.id IN :selectedIds AND e.row_version <> :expected_row_version)", status: 409, code: STALE_RECORD, message: One or more selected employees changed before users were created. Reload and try again. }
      steps:
        - query: "INSERT INTO employee_bulk_user_creation_runs(id, company_name, requested_by, selected_count) VALUES(:run_id, :current_company_name, COALESCE(NULLIF(:current_user_name, ''), :current_user_id), 0)"
        - for_each:
            input: selectedIds
            as: employee_id
            steps:
              - query: "UPDATE employees SET updated_at = updated_at WHERE id = :employee_id AND active = true AND company_name = :current_company_name"
                expect_changed: true
                status: 404
                code: EMPLOYEES_BULK_USER_EMPLOYEE_NOT_FOUND
                message: One or more selected employees are missing or inactive.
              - query: "SELECT 'employee-user-' || CAST(:employee_id AS VARCHAR) AS new_user_id"
                assign: true
              - query: "SELECT EXISTS (SELECT 1 FROM employees WHERE id = :employee_id AND auth_user_id IS NOT NULL) AS was_linked"
                assign: true
              - query: "INSERT INTO users(id, email, name, password_hash, preferred_lang, enabled) SELECT :new_user_id, LOWER(TRIM(e.work_email)), TRIM(e.name), 'invite-pending', 'en', false FROM employees e WHERE e.id = :employee_id AND e.active = true AND e.company_name = :current_company_name AND e.auth_user_id IS NULL AND NULLIF(TRIM(e.work_email), '') IS NOT NULL AND regexp_matches(TRIM(e.work_email), '^[^@ ]+@[^@ ]+\\.[^@ ]+$') AND NOT EXISTS (SELECT 1 FROM users u WHERE LOWER(u.email) = LOWER(TRIM(e.work_email))) ON CONFLICT (id) DO NOTHING"
              - query: "UPDATE employees SET auth_user_id = :new_user_id, user_name = name, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :employee_id AND active = true AND company_name = :current_company_name AND auth_user_id IS NULL AND NULLIF(TRIM(work_email), '') IS NOT NULL AND regexp_matches(TRIM(work_email), '^[^@ ]+@[^@ ]+\\.[^@ ]+$') AND NOT EXISTS (SELECT 1 FROM users u WHERE LOWER(u.email) = LOWER(TRIM(employees.work_email)) AND u.id <> :new_user_id)"
              - query: "INSERT INTO employee_bulk_user_creation_lines(id, run_id, employee_id, employee_name, outcome, user_id, detail) SELECT :run_id || '-' || CAST(e.id AS VARCHAR), :run_id, e.id, e.name, CASE WHEN e.auth_user_id = :new_user_id AND NOT COALESCE(:was_linked, false) THEN 'created' WHEN e.auth_user_id IS NOT NULL THEN 'already_linked' WHEN NULLIF(TRIM(e.work_email), '') IS NULL OR NOT regexp_matches(TRIM(e.work_email), '^[^@ ]+@[^@ ]+\\.[^@ ]+$') THEN 'missing_email' WHEN EXISTS (SELECT 1 FROM users u WHERE LOWER(u.email) = LOWER(TRIM(e.work_email))) THEN 'login_exists' ELSE 'skipped' END, CASE WHEN e.auth_user_id = :new_user_id THEN :new_user_id ELSE e.auth_user_id END, CASE WHEN e.auth_user_id = :new_user_id AND NOT COALESCE(:was_linked, false) THEN 'Invited user created and linked.' WHEN e.auth_user_id IS NOT NULL THEN 'Employee already has a related user.' WHEN NULLIF(TRIM(e.work_email), '') IS NULL OR NOT regexp_matches(TRIM(e.work_email), '^[^@ ]+@[^@ ]+\\.[^@ ]+$') THEN 'Employee has no valid work email.' WHEN EXISTS (SELECT 1 FROM users u WHERE LOWER(u.email) = LOWER(TRIM(e.work_email))) THEN 'A user already exists with this login.' ELSE 'Employee was not eligible for user creation.' END FROM employees e WHERE e.id = :employee_id"
        - query: "UPDATE employee_bulk_user_creation_runs SET selected_count = (SELECT COUNT(*) FROM employee_bulk_user_creation_lines WHERE run_id = :run_id), created_count = (SELECT COUNT(*) FROM employee_bulk_user_creation_lines WHERE run_id = :run_id AND outcome = 'created'), skipped_count = (SELECT COUNT(*) FROM employee_bulk_user_creation_lines WHERE run_id = :run_id AND outcome <> 'created') WHERE id = :run_id"
      result: { query: "SELECT id, row_version, company_name, requested_by, selected_count, created_count, skipped_count, CAST(created_at AS VARCHAR) AS created_at FROM employee_bulk_user_creation_runs WHERE id = :run_id" }
  - id: create_employee
    type: server_form
    permission: employees.write
    title: New employee
    action: employees.records.create
    handler: yaml_mutation
    operation: create
    refresh: [employees]
    mutation:
      operation: insert
      table: employees
      fields: [employee_number, name, legal_name, work_email, work_phone, mobile_phone, company_name, department_name, employment_type, employee_type, contract_type_name, hr_responsible_name, pin, coach_name, private_car_plate, employee_properties, hire_date, contract_start, contract_end, trial_date_end, timezone, lang, emergency_contact, emergency_phone, marital, spouse_complete_name, spouse_birthdate, children, certificate, study_field, study_school, place_of_birth, country_of_birth, sex, visa_no, visa_expire, permit_no, work_permit_expiration_date, work_permit_name, has_work_permit, work_permit_scheduled_activity, country_id, identification_id, ssnid, passport_id, passport_expiration_date, private_street, private_street2, private_city, private_state_id, private_zip, private_country_id, distance_home_work, distance_home_work_unit, private_email, private_phone, birthday, birthday_public_display, id_card, id_card_name, driving_license, driving_license_name]
      boolean_fields: [birthday_public_display, has_work_permit, work_permit_scheduled_activity, id_card, driving_license]
      required: [employee_number, name, hire_date]
      defaults: { active: true, state: Draft, marital: single, children: 0, distance_home_work_unit: kilometers, employee_type: employee, contract_type_name: Permanent, hr_responsible_name: HR Manager }
      generated: [id]
      before_steps: [{ query: "SELECT 'employee-' || regexp_replace(lower(trim(CAST(:employee_number AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:employee_number AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND :hire_date IS NOT NULL", status: 422, code: EMPLOYEES_RECORD_VALUES_INVALID, message: Employee number, name, and start date are required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM employees WHERE LOWER(employee_number) = LOWER(TRIM(CAST(:employee_number AS VARCHAR))))", status: 409, code: EMPLOYEES_RECORD_NUMBER_EXISTS, message: An employee with this number already exists. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR COALESCE(:company_name, :current_company_name) = :current_company_name", status: 403, code: EMPLOYEES_COMPANY_SCOPE_REQUIRED, message: Employee must belong to the current company. }
        - { query: "SELECT 1 AS ok WHERE :timezone IS NULL OR CAST(:timezone AS VARCHAR) IN ('UTC', 'Asia/Ho_Chi_Minh', 'Asia/Tokyo', 'Europe/London', 'America/Los_Angeles')", status: 422, code: EMPLOYEES_TIMEZONE_INVALID, message: Select a supported employee timezone. }
        - { query: "SELECT 1 AS ok WHERE :trial_date_end IS NULL OR regexp_matches(CAST(:trial_date_end AS VARCHAR), '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')", status: 422, code: EMPLOYEES_TRIAL_DATE_INVALID, message: End of Trial Period must use YYYY-MM-DD. }
        - { query: "SELECT 1 AS ok WHERE :trial_date_end IS NULL OR :contract_start IS NULL OR CAST(:trial_date_end AS DATE) >= CAST(:contract_start AS DATE)", status: 422, code: EMPLOYEES_TRIAL_DATE_ORDER_INVALID, message: End of Trial Period must be on or after the Contract Start Date. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:coach_name AS VARCHAR)), '') IS NULL OR EXISTS (SELECT 1 FROM employees c WHERE c.active = true AND c.name = TRIM(CAST(:coach_name AS VARCHAR)) AND (COALESCE(:current_company_name, '') = '' OR c.company_name = :current_company_name))", status: 422, code: EMPLOYEES_COACH_INVALID, message: Select an active coach from the current company. }
        - { query: "SELECT 1 AS ok WHERE NULLIF(TRIM(CAST(:employee_properties AS VARCHAR)), '') IS NULL OR (SUBSTR(TRIM(CAST(:employee_properties AS VARCHAR)), 1, 1) = '{' AND RIGHT(TRIM(CAST(:employee_properties AS VARCHAR)), 1) = '}')", status: 422, code: EMPLOYEES_PROPERTIES_INVALID, message: Properties must be a JSON object. }
        - { query: "SELECT COALESCE(NULLIF(TRIM(CAST(:legal_name AS VARCHAR)), ''), TRIM(CAST(:name AS VARCHAR))) AS legal_name", assign: true }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:id_card AS BOOLEAN), false) = false OR NULLIF(TRIM(CAST(:id_card_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: EMPLOYEES_ID_CARD_DOCUMENT_INVALID, message: An ID card filename is required when a document is present. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:driving_license AS BOOLEAN), false) = false OR NULLIF(TRIM(CAST(:driving_license_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: EMPLOYEES_DRIVING_LICENSE_DOCUMENT_INVALID, message: A driving license filename is required when a document is present. }
      result: { query: "SELECT * FROM employees WHERE id = :id" }
    fields:
      - { field: employee_number, label: Employee number, type: text, required: true }
      - { field: name, label: Name, type: text, required: true }
      - { field: legal_name, label: Legal Name, type: text }
      - { field: work_email, label: Work Email, type: text }
      - { field: work_phone, label: Work Phone, type: text }
      - { field: mobile_phone, label: Work Mobile, type: text }
      - { field: private_email, label: Private Email, type: text }
      - { field: private_phone, label: Private Phone, type: text }
      - { field: birthday, label: Birthday, type: date }
      - { field: birthday_public_display, label: Show to all employees, type: checkbox }
      - { field: company_name, label: Company, type: text }
      - { field: department_name, label: Department, type: text }
      - { field: job_title, label: Job Position, type: text }
      - { field: employment_type, label: Employment Type, type: select, options: [{ value: Employee, label: Employee }, { value: Contractor, label: Contractor }, { value: Intern, label: Intern }] }
      - { field: employee_type, label: Employee Type, type: select, options: [{ value: employee, label: Employee }, { value: worker, label: Worker }, { value: student, label: Student }, { value: trainee, label: Trainee }, { value: contractor, label: Contractor }, { value: freelance, label: Freelancer }] }
      - { field: contract_type_name, label: Contract Type, type: select, options: [{ value: Permanent, label: Permanent }, { value: Temporary, label: Temporary }, { value: Contractor, label: Contractor }] }
      - { field: hr_responsible_name, label: HR Responsible, type: select, options: [{ value: HR Manager, label: HR Manager }, { value: People Operations, label: People Operations }, { value: Admin User, label: Admin User }] }
      - { field: pin, label: PIN Code, type: password }
      - { field: coach_name, label: Coach, type: text }
      - { field: private_car_plate, label: Private Car Plate, type: text }
      - { field: employee_properties, label: Properties, type: textarea }
      - { field: hire_date, label: Start Date, type: date, required: true }
      - { field: contract_start, label: Contract Start Date, type: date }
