page: { id: employee-directory-detail }
datasources:
  - id: employee_directory_detail
    single: true
    permission: employees.read
    error_states: { forbidden: { status: 403, code: EMPLOYEES_DIRECTORY_DETAIL_FORBIDDEN, message: You do not have access to this employee profile. }, transport_error: { status: 503, code: EMPLOYEES_DIRECTORY_DETAIL_UNAVAILABLE, message: The employee profile is temporarily unavailable. } }
    query: "SELECT id, name, image_url, job_title, department_name, work_email, work_phone, company_name, work_location, presence, manager_name, active FROM employees WHERE directory_visible = true AND CASE WHEN COALESCE(:fixture_state, '') = 'not_found' THEN false ELSE true END AND id = :id"
