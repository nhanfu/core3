title: Skill Types
page: { id: employee-skill-types, route: /employees/skill-types, breadcrumb: [Employees, Configuration, Employee, Skill Types], auth: { require: [employees.read] } }
components:
  - type: ListView
    variant: odoo
    source: employee_skill_types
    create_action: create_employee_skill_type
    create_label: New
    search: { label: Search Skill Type, placeholder: Search... }
    filters: [{ field: active, label: Records, options: [{ id: 'true', label: Current }, { id: 'false', label: Archived }] }]
    views: [{ id: list, label: List, icon: table, mobile: true }]
    columns:
      - { field: sequence, label: ' ', type: HandleCell, mobile: false }
      - { field: display_name, label: Skill Types, type: PrimaryEntityCell }
      - { field: color, label: Color, type: ColorSwatch, optional: show }
      - { field: skills, label: Skills, type: TagsCell, optional: show }
      - { field: levels, label: Levels, type: TagsCell, optional: show }
      - { field: status, label: Status, type: StatusChip }
    row_key: id
    row_open_action: view_employee_skill_type
    row_double_click_action: view_employee_skill_type
    column_chooser: true
    empty_state: { title: No skill types found, description: Create a skill type to organize employee skills and levels. }
