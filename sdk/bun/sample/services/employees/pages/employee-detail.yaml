title: Employee
page: { id: employee-detail, route: /employees/detail, breadcrumb: [Human Resources, Employees, Employee], auth: { require: [employees.read] } }
components:
  - type: OdooFormView
    source: employee_detail
    title_field: name
    subtitle_field: job_title
    status_field: state
    statusbar: [{ value: Draft, label: New }, { value: Active, label: Active }, { value: On Leave, label: On leave }, { value: Terminated, label: Departed }]
    status_colors: { Draft: neutral, Active: green, On Leave: amber, Terminated: red }
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    stat_buttons:
      - { id: open_employee_timesheets, label: Timesheets, value_field: employee_number, permission: timesheets.read }
      - { id: open_employee_history, label: History, value_field: version_count, permission: employees.read }
    header_actions:
      - { id: edit_employee, label: Edit, variant: secondary, permission: employees.write }
      - { id: create_employee_user, label: Create User, variant: primary, permission: auth.users.manage, show_if: "state.employee_detail.id && !state.employee_detail.auth_user_id" }
      - { id: edit_employee_related_user, label: Set Related User, variant: secondary, permission: auth.users.manage, show_if: "state.employee_detail.active === true" }
      - { id: launch_employee_plan, label: Launch Plan, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: load_employee_contract_template, label: Load a Template, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_contract_type, label: Edit Contract Type, variant: secondary, permission: employees.manage, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_contract_period, label: Edit Contract Dates, variant: secondary, permission: employees.manage, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_pay_category, label: Edit Pay Category, variant: secondary, permission: employees.manage, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_type, label: Edit Employee Type, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_working_hours, label: Edit Working Hours, variant: secondary, permission: employees.manage, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_work_location, label: Edit Work Location, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_work_address, label: Edit Work Address, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_manager, label: Edit Manager, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_hr_responsible, label: Edit HR Responsible, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_coach, label: Edit Coach, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_properties, label: Edit Properties, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: edit_employee_pin, label: Edit PIN Code, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: generate_employee_barcode, label: Generate Badge ID, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true && !state.employee_detail.barcode" }
      - { id: print_employee_badge, label: Print Badge, variant: secondary, permission: employees.read, show_if: "state.employee_detail.active === true && !!state.employee_detail.barcode" }
      - { id: register_employee_departure, label: Register Departure, variant: danger, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: archive_employee_detail, label: Archive, variant: danger, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: restore_employee_detail, label: Restore, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === false" }
    groups:
      - title: Properties
        permission: employees.read
        fields: [{ field: employee_properties, label: Properties, type: textarea, readonly: true, wide: true }]
    notebook:
      active: work
      tabs:
        - id: work
          label: Work
          groups:
            - title: Work
              fields: [{ field: company_name, label: Company }, { field: department_name, label: Department }, { field: job_position_name, label: Job Position }, { field: job_title, label: Job Title }, { field: manager_name, label: Manager }, { field: coach_name, label: Coach }, { field: mobile_phone, label: Work Mobile }]
            - title: Location
              fields: [{ field: address_name, label: Address }, { field: work_location, label: Work Location }]
            - title: Departure
              show_if: "state.employee_detail.active === false"
              fields: [{ field: departure_reason_name, label: Departure Reason }, { field: departure_description, label: Description, type: textarea }, { field: departure_date, label: Departure Date, type: date }]
            - title: Note
              permission: employees.write
              fields: [{ field: additional_note, label: Note, type: textarea, wide: true }]
          organization_chart: { parent_field: org_parent_name, direct_reports_field: org_direct_reports }
          component:
            type: LineItemGrid
            source: employee_skill_assignments
            parent_source: employee_detail
            title: Skills
            description: Add current skills and levels to the employee profile.
            variant: odoo_x2many
            page_size: 20
            row_key: id
            actions: [{ id: add_employee_skill, label: Add a skill, variant: primary, permission: employees.write }]
            empty_state: { title: No skills, description: Add a skill and level to this employee. }
            children:
              - { type: LineItemField, id: skill_type_name, field: skill_type_name, label: Category, readonly: true }
              - { type: LineItemField, id: skill_name, field: skill_name, label: Skill, readonly: true }
              - { type: LineItemField, id: skill_level_name, field: skill_level_name, label: Level, readonly: true }
              - { type: LineItemField, id: level_progress, field: level_progress, label: Progress, readonly: true }
              - { type: LineItemField, id: validity_status, field: validity_status, label: Validity, readonly: true }
              - type: LineItemActions
                id: employee_skill_assignment_actions
                actions: [{ id: archive_employee_skill, label: Archive, icon: archive, variant: danger, permission: employees.write }]
        - id: resume
          label: Resume
          groups:
            - title: Skills and resume
              fields: [{ field: skills, label: Skills }, { field: resume_summary, label: Resume, type: textarea, wide: true }]
          component:
            type: LineItemGrid
            source: employee_resume_lines
            parent_source: employee_detail
            title: Resume Lines
            description: Track education, experience, and training on the employee resume.
            variant: odoo_x2many
            page_size: 20
            row_key: id
            actions: [{ id: add_employee_resume_line, label: Add a resume line, variant: primary, permission: employees.write }]
            empty_state: { title: No resume lines, description: Add an education, experience, or training entry. }
            children:
              - { type: LineItemField, id: line_type_name, field: line_type_name, label: Section, readonly: true }
              - { type: LineItemField, id: name, field: name, label: Title, readonly: true }
              - { type: LineItemField, id: date_start, field: date_start, label: Start Date, readonly: true }
              - { type: LineItemField, id: date_end, field: date_end, label: End Date, readonly: true }
              - { type: LineItemField, id: course_type, field: course_type, label: Type, readonly: true }
              - { type: LineItemField, id: duration, field: duration, label: Hours, readonly: true }
              - type: LineItemActions
                id: employee_resume_line_actions
                actions:
                  - { id: edit_employee_resume_line, label: Edit, icon: edit, variant: ghost, permission: employees.write }
                  - { id: delete_employee_resume_line, label: Delete, icon: trash, variant: danger, permission: employees.write }
        - id: personal
          label: Personal
          groups:
            - title: Private Contact
              permission: employees.read
              fields: [{ field: private_email, label: Email }, { field: private_phone, label: Phone }, { field: street, label: Private Address }, { field: birthday, label: Birthday }]
            - title: Personal Information
              permission: employees.read
              fields: [{ field: legal_name, label: Legal Name }, { field: birthday, label: Birthday, type: date }, { field: birthday_public_display, label: Show to all employees, type: checkbox, show_if: "!!state.employee_detail.birthday" }, { field: place_of_birth, label: Place of Birth }, { field: country_of_birth, label: Country of Birth }, { field: sex, label: Gender }]
            - title: Emergency Contact
              permission: employees.read
              fields: [{ field: emergency_contact, label: Contact }, { field: emergency_phone, label: Phone }]
            - title: Visa & Work Permit
              permission: employees.read
              fields: [{ field: visa_no, label: Visa No }, { field: visa_expire, label: Visa Expiration, type: date, show_if: "!!state.employee_detail.visa_no" }, { field: permit_no, label: Work Permit No }, { field: work_permit_expiration_date, label: Work Permit Expiration, type: date, show_if: "!!state.employee_detail.permit_no" }, { field: has_work_permit, label: Document, type: checkbox }, { field: work_permit_name, label: Document Filename, show_if: "!!state.employee_detail.has_work_permit" }]
            - title: Citizenship
              permission: employees.read
              fields: [{ field: country_id, label: Nationality (Country) }, { field: identification_id, label: Identification No }, { field: ssnid, label: SSN No }, { field: passport_id, label: Passport No }, { field: passport_expiration_date, label: Passport Expiration, type: date, show_if: "!!state.employee_detail.passport_id" }]
            - title: Location
              permission: employees.read
              fields: [{ field: private_street, label: Private Street }, { field: private_street2, label: Private Street 2 }, { field: private_city, label: Private City }, { field: private_state_id, label: Private State }, { field: private_zip, label: Private ZIP }, { field: private_country_id, label: Private Country }, { field: distance_home_work, label: Home-Work Distance, type: number }, { field: distance_home_work_unit, label: Distance Unit }]
            - title: Family
              permission: employees.read
              fields: [{ field: marital, label: Marital Status }, { field: spouse_complete_name, label: Spouse Legal Name, show_if: "['married', 'cohabitant'].includes(state.employee_detail.marital)" }, { field: spouse_birthdate, label: Spouse Birthdate, type: date, show_if: "['married', 'cohabitant'].includes(state.employee_detail.marital)" }, { field: children, label: Dependent Children, type: number }]
            - title: Education
              permission: employees.read
              fields: [{ field: certificate, label: Certificate Level }, { field: study_field, label: Field of Study }]
            - title: Documents
              permission: employees.read
              fields: [{ field: id_card, label: ID Card Copy, type: checkbox }, { field: id_card_name, label: ID Card Filename, show_if: "!!state.employee_detail.id_card" }, { field: driving_license, label: Driving License, type: checkbox }, { field: driving_license_name, label: Driving License Filename, show_if: "!!state.employee_detail.driving_license" }]
          component:
            type: LineItemGrid
            source: employee_bank_accounts
            parent_source: employee_detail
            title: Bank Accounts
            description: Allocate salary across the employee's bank accounts and mark trusted payout accounts.
            variant: odoo_x2many
            page_size: 20
            row_key: id
            actions:
              - { id: add_employee_bank_account, label: Add a bank account, variant: primary, permission: employees.write }
              - { id: open_employee_bank_allocation, label: Salary Allocation, variant: secondary, permission: employees.write }
            empty_state: { title: No bank accounts, description: Add an employee bank account before configuring salary allocation. }
            children:
              - { type: LineItemField, id: sequence, field: sequence, label: '#', readonly: true }
              - { type: LineItemField, id: acc_number, field: acc_number, label: Account Number, readonly: true }
              - { type: LineItemField, id: bank_name, field: bank_name, label: Bank, readonly: true }
              - { type: LineItemField, id: amount, field: amount, label: Allocation, input_type: number, required: true }
              - { type: LineItemField, id: amount_type, field: amount_type, label: Type, readonly: true }
              - { type: LineItemField, id: trusted, field: trusted, label: Trusted, input_type: checkbox }
              - type: LineItemActions
                id: employee_bank_account_actions
                actions:
                  - { id: edit_employee_bank_account, label: Edit, icon: edit, variant: ghost, permission: employees.write }
                  - { id: toggle_employee_bank_account_trust, label: Toggle trust, icon: shield, variant: secondary, permission: employees.write }
                  - { id: delete_employee_bank_account, label: Delete, icon: trash, variant: danger, permission: employees.write }
        - id: payroll
          label: Payroll
          groups:
            - title: Contract Overview
              permission: employees.manage
              fields: [{ field: contract_type_name, label: Contract Type, readonly: true }]
            - title: Pay Category
              permission: employees.manage
              fields: [{ field: pay_category_name, label: Pay Category, readonly: true }]
            - title: Working Hours
              permission: employees.manage
              fields: [{ field: working_schedule, label: Working Hours, readonly: true }]
            - title: Employee Type
              permission: employees.write
              fields: [{ field: employee_type, label: Employee Type, readonly: true }]
            - title: Contract Dates
              permission: employees.manage
              fields: [{ field: contract_start, label: Contract Start Date, readonly: true }, { field: contract_end, label: Contract End Date, readonly: true }]
            - title: Contract
              fields: [{ field: employment_type, label: Employment Type }, { field: wage, label: Wage }, { field: contract_template_name, label: Contract Template }]
        - id: settings
          label: Settings
          groups:
            - title: User and attendance
              fields: [{ field: user_name, label: Related User }, { field: timezone, label: Timezone }, { field: barcode, label: Badge ID }, { field: presence, label: Presence, type: StatusChip }]
            - title: Approvers
              permission: employees.write
              fields: [{ field: hr_responsible_name, label: HR Responsible, readonly: true }]
            - title: Attendance / Point of Sale
              permission: employees.write
              fields: [{ field: pin, label: PIN Code, readonly: true }]
    content_slot: true
