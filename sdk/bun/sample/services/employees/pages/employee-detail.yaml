title: Employee
page: { id: employee-detail, route: /employees/detail, breadcrumb: [Human Resources, Employees, Employee], auth: { require: [employees.read] } }
components:
  - type: OdooFormView
    source: employee_detail
    title_field: name
    subtitle_field: job_title
    status_field: state
    statusbar: [{ value: Draft, label: New }, { value: Active, label: Active }, { value: On Leave, label: On leave }, { value: Terminated, label: Departed }]
    status_colors: { Draft: neutral, Active: green, On Leave: amber, Terminated: red }
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    stat_buttons:
      - { id: open_employee_timesheets, label: Timesheets, value_field: employee_number, permission: timesheets.read }
      - { id: open_employee_history, label: History, value_field: version_count, permission: employees.read }
    header_actions:
      - { id: edit_employee, label: Edit, variant: secondary, permission: employees.write }
      - { id: create_employee_user, label: Create User, variant: primary, permission: auth.users.manage, show_if: "!state.employee_detail.auth_user_id" }
      - { id: launch_employee_plan, label: Launch Plan, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: load_employee_contract_template, label: Load a Template, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: generate_employee_barcode, label: Generate Badge ID, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === true && !state.employee_detail.barcode" }
      - { id: print_employee_badge, label: Print Badge, variant: secondary, permission: employees.read, show_if: "state.employee_detail.active === true && !!state.employee_detail.barcode" }
      - { id: register_employee_departure, label: Register Departure, variant: danger, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: archive_employee_detail, label: Archive, variant: danger, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: restore_employee_detail, label: Restore, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === false" }
    notebook:
      active: work
      tabs:
        - id: work
          label: Work
          groups:
            - title: Work
              fields: [{ field: company_name, label: Company }, { field: department_name, label: Department }, { field: job_position_name, label: Job Position }, { field: job_title, label: Job Title }, { field: manager_name, label: Manager }]
            - title: Location
              fields: [{ field: address_name, label: Address }, { field: work_location, label: Work Location }]
            - title: Departure
              show_if: "state.employee_detail.active === false"
              fields: [{ field: departure_reason_name, label: Departure Reason }, { field: departure_description, label: Description, type: textarea }, { field: departure_date, label: Departure Date, type: date }]
            - title: Note
              permission: employees.write
              fields: [{ field: additional_note, label: Note, type: textarea, wide: true }]
          organization_chart: { parent_field: org_parent_name, direct_reports_field: org_direct_reports }
        - id: resume
          label: Resume
          groups:
            - title: Skills and resume
              fields: [{ field: skills, label: Skills }, { field: resume_summary, label: Resume, type: textarea, wide: true }]
        - id: personal
          label: Personal
          groups:
            - title: Contact Information
              fields: [{ field: private_email, label: Private Email }, { field: phone, label: Phone }, { field: street, label: Private Address }, { field: birthday, label: Birthday }]
          component:
            type: LineItemGrid
            source: employee_bank_accounts
            parent_source: employee_detail
            title: Bank Accounts
            description: Allocate salary across the employee's bank accounts and mark trusted payout accounts.
            variant: odoo_x2many
            page_size: 20
            row_key: id
            actions: [{ id: add_employee_bank_account, label: Add a bank account, variant: primary, permission: employees.write }]
            empty_state: { title: No bank accounts, description: Add an employee bank account before configuring salary allocation. }
            children:
              - { type: LineItemField, id: sequence, field: sequence, label: '#', readonly: true }
              - { type: LineItemField, id: acc_number, field: acc_number, label: Account Number, readonly: true }
              - { type: LineItemField, id: bank_name, field: bank_name, label: Bank, readonly: true }
              - { type: LineItemField, id: amount, field: amount, label: Allocation, input_type: number, required: true }
              - { type: LineItemField, id: amount_type, field: amount_type, label: Type, readonly: true }
              - { type: LineItemField, id: trusted, field: trusted, label: Trusted, input_type: checkbox }
              - type: LineItemActions
                id: employee_bank_account_actions
                actions:
                  - { id: edit_employee_bank_account, label: Edit, icon: edit, variant: ghost, permission: employees.write }
                  - { id: delete_employee_bank_account, label: Delete, icon: trash, variant: danger, permission: employees.write }
        - id: payroll
          label: Payroll
          groups:
            - title: Contract
              fields: [{ field: employment_type, label: Employment Type }, { field: contract_start, label: Contract Start }, { field: contract_end, label: Contract End }, { field: wage, label: Wage }, { field: working_schedule, label: Working Schedule }, { field: contract_template_name, label: Contract Template }]
        - id: settings
          label: Settings
          groups:
            - title: User and attendance
              fields: [{ field: user_name, label: Related User }, { field: timezone, label: Timezone }, { field: barcode, label: Badge ID }, { field: presence, label: Presence, type: StatusChip }]
    content_slot: true
