title: Employee
page: { id: employee-detail, route: /employees/detail, breadcrumb: [Human Resources, Employees, Employee], auth: { require: [employees.read] } }
components:
  - type: OdooFormView
    source: employee_detail
    title_field: name
    subtitle_field: job_title
    status_field: state
    statusbar: [{ value: Draft, label: New }, { value: Active, label: Active }, { value: On Leave, label: On leave }, { value: Terminated, label: Departed }]
    status_colors: { Draft: neutral, Active: green, On Leave: amber, Terminated: red }
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    stat_buttons:
      - { id: open_employee_timesheets, label: Timesheets, value_field: employee_number, permission: timesheets.read }
    header_actions:
      - { id: edit_employee, label: Edit, variant: secondary, permission: employees.write }
      - { id: archive_employee_detail, label: Archive, variant: danger, permission: employees.write, show_if: "state.employee_detail.active === true" }
      - { id: restore_employee_detail, label: Restore, variant: secondary, permission: employees.write, show_if: "state.employee_detail.active === false" }
    group_columns: 2
    groups:
      - title: Work Information
        fields:
          - { field: name, label: Employee Name }
          - { field: employee_number, label: Employee Number }
          - { field: work_email, label: Work Email }
          - { field: work_phone, label: Work Phone }
          - { field: company_name, label: Company }
          - { field: department_name, label: Department }
          - { field: job_title, label: Job Position }
          - { field: manager_name, label: Manager }
          - { field: coach_name, label: Coach }
          - { field: work_location, label: Work Location }
          - { field: address_name, label: Work Address }
          - { field: hire_date, label: Start Date }
          - { field: termination_date, label: Departure Date }
    notebook:
      active: work
      tabs:
        - id: work
          label: Work
          groups:
            - title: Organization
              fields: [{ field: company_name, label: Company }, { field: department_name, label: Department }, { field: job_position_name, label: Job Position }, { field: job_title, label: Job Title }, { field: manager_name, label: Manager }, { field: address_name, label: Address }, { field: work_location, label: Work Location }]
            - title: Departure
              show_if: "state.employee_detail.active === false"
              fields: [{ field: departure_reason_name, label: Departure Reason }, { field: departure_description, label: Description, type: textarea }, { field: departure_date, label: Departure Date, type: date }]
            - title: Note
              permission: employees.write
              fields: [{ field: additional_note, label: Note, type: textarea, wide: true }]
            - title: Organization chart
              fields: [{ field: org_parent_name, label: Manager }, { field: org_direct_reports, label: Direct Reports }]
        - id: resume
          label: Resume
          groups:
            - title: Skills and resume
              fields: [{ field: skills, label: Skills }, { field: resume_summary, label: Resume, type: textarea, wide: true }]
        - id: personal
          label: Personal
          groups:
            - title: Contact Information
              fields: [{ field: private_email, label: Private Email }, { field: phone, label: Phone }, { field: street, label: Private Address }, { field: birthday, label: Birthday }]
        - id: payroll
          label: Payroll
          groups:
            - title: Contract
              fields: [{ field: employment_type, label: Employment Type }, { field: contract_start, label: Contract Start }, { field: contract_end, label: Contract End }, { field: wage, label: Wage }, { field: working_schedule, label: Working Schedule }]
        - id: settings
          label: Settings
          groups:
            - title: User and attendance
              fields: [{ field: user_name, label: Related User }, { field: timezone, label: Timezone }, { field: barcode, label: Badge ID }, { field: presence, label: Presence, type: StatusChip }]
    content_slot: true
