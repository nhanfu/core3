title: All activities
page: { id: employee-activities, route: /employees/activities, breadcrumb: [Human Resources, Reporting, All activities], auth: { require: [employees.read] } }
components:
  - type: ListView
    variant: odoo
    source: employee_activities
    search: { label: Search activities, placeholder: 'Search employee, job, or activity...' }
    filters:
      - { field: timing, label: Timing, options_source: employee_activity_timing }
      - { field: activity_type, label: Activity, options_source: employee_activity_types }
    group_by:
      - { field: employee_name, label: Employee }
      - { field: job_title, label: Job Position }
      - { field: timing, label: Timing }
    view_navigation: tabs
    views:
      - id: activity
        label: Activity
        icon: activity
        title_field: employee_name
        subtitle_field: job_title
        record_date_field: activity_date
        activity_types:
          - { id: todo, label: To-Do, icon: ✓ }
          - { id: email, label: Email, icon: ✉ }
          - { id: call, label: Call, icon: ☎ }
          - { id: meeting, label: Meeting, icon: ◉ }
          - { id: document, label: Document, icon: ▣ }
        mobile: false
      - id: list
        label: List
        icon: table
        mobile: false
      - id: card
        label: Cards
        icon: grid
        card:
          title: employee_name
          subtitle: job_title
          fields:
            - { field: activity_type, label: Activity }
            - { field: activity_summary, label: Summary }
            - { field: activity_date, label: Due date }
            - { field: timing, label: Timing }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: timing
        groups_source: employee_activity_timing
        mobile: false
        card:
          title: employee_name
          subtitle: activity_type
          fields:
            - { field: activity_summary, label: Summary }
            - { field: activity_date, label: Due date }
            - { field: activity_user, label: Assigned to }
      - id: graph
        label: Graph
        icon: graph
        category_field: timing
        measure_field: activity_count
        type: bar
        mobile: false
      - id: pivot
        label: Pivot
        icon: pivot
        mobile: false
        pivot:
          fields:
            - { field: employee_name, column: Employee }
            - { field: activity_type, column: Activity }
            - { field: timing, column: Timing }
            - { field: activity_count, column: Activities }
          default:
            rows: [employee_name]
            columns: [timing]
            measures: [{ field: activity_count, aggregate: sum, column: Activities }]
    columns:
      - { field: employee_name, label: Employee, type: PrimaryEntityCell, secondary: job_title }
      - { field: activity_type, label: Activity }
      - { field: activity_summary, label: Summary }
      - { field: activity_date, label: Due date }
      - { field: activity_user, label: Assigned to }
      - { field: timing, label: Timing, type: StatusChip }
    page_size: 50
    row_key: id
    row_open_action: view_employee_activity
    row_double_click_action: view_employee_activity
    empty_state: { title: No activities found, description: There are no employee activities matching the current filters. }
