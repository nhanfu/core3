title: Employee Directory
page: { id: employee-directory, route: /employees/directory, breadcrumb: [Human Resources, Directory], auth: { require: [employees.read] } }
components:
  - type: ListView
    variant: odoo
    source: employee_directory
    search: { label: Search directory, placeholder: 'Search employees...' }
    filters:
      - { field: directory_filter, label: Directory, options: [{ id: my_team, label: My Team }, { id: my_department, label: My Department }, { id: newly_hired, label: Newly Hired }, { id: archived, label: Archived }] }
      - { field: company_name, label: Company, options: [{ id: Core3 Vietnam, label: Core3 Vietnam }] }
      - { field: department_name, label: Department, options: [{ id: Engineering, label: Engineering }] }
    group_by:
      - { field: manager_name, label: Manager }
      - { field: department_name, label: Department }
      - { field: job_title, label: Job }
      - { field: company_name, label: Company }
    view_navigation: tabs
    views:
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: department_name
        groups: [{ value: Engineering, label: Engineering }]
        card:
          title: name
          subtitle: job_title
          image_field: image_url
          fields:
            - { field: department_name, label: Department }
            - { field: work_email, label: Work Email }
            - { field: work_phone, label: Work Phone }
      - id: list
        label: List
        icon: table
        mobile: false
      - id: card
        label: Cards
        icon: grid
        card:
          title: name
          subtitle: job_title
          image_field: image_url
          fields:
            - { field: department_name, label: Department }
            - { field: work_email, label: Work Email }
            - { field: work_phone, label: Work Phone }
    columns:
      - { field: image_url, label: Avatar, type: Image }
      - { field: name, label: Name, type: PrimaryEntityCell }
      - { field: job_title, label: Job Position }
      - { field: department_name, label: Department }
      - { field: work_email, label: Work Email }
      - { field: work_phone, label: Work Phone }
    page_size: 50
    row_key: id
    empty_state: { title: No employees found, description: No public employees match the current search. }
    row_double_click_action: view_directory_employee
