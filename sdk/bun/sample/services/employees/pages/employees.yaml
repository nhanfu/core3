title: Employees
page: { id: employees, route: /employees, breadcrumb: [Human Resources, Employees], auth: { require: [employees.read] } }
components:
  - type: ListView
    variant: odoo
    source: employees
    create_action: create_employee
    create_label: New employee
    header_actions:
      - { id: load_sample_employee_data, label: Load Sample Data, permission: employees.write, variant: secondary }
    search: { label: Search employees, placeholder: 'Search employee number, name, email, coach, or private car plate...' }
    filters:
      - { field: state, label: Status, options_source: employee_states }
      - { field: department_name, label: Department, options_source: employee_departments }
      - { field: coach_name, label: Coach, options_source: employee_coaches }
      - { field: my_activities, label: My Activities, options: [{ id: 'true', label: My Activities }] }
      - { field: activities_overdue, label: Late Activities, options: [{ id: 'true', label: Late Activities }] }
      - { field: activities_today, label: Today Activities, options: [{ id: 'true', label: Today Activities }] }
      - { field: activities_upcoming_all, label: Future Activities, options: [{ id: 'true', label: Future Activities }] }
      - { field: my_team, label: My Team, options: [{ id: 'true', label: My Team }] }
      - { field: my_department, label: My Department, options: [{ id: 'true', label: My Department }] }
      - { field: newly_hired, label: Hiring, options: [{ id: 'true', label: Newly Hired }] }
      - { field: in_contract, label: In Contract, options: [{ id: 'true', label: In Contract }] }
      - { field: out_of_contract, label: Out of Contract, options: [{ id: 'true', label: Out of Contract }] }
      - { field: active, label: Records, options: [{ id: 'true', label: Active }, { id: 'false', label: Archived }] }
    group_by:
      - { field: manager_name, label: Manager }
      - { field: department_name, label: Department }
      - { field: job_title, label: Job Position }
      - { field: employee_type, label: Employee Type }
      - { field: state, label: Status }
      - { field: birthday, label: Birthday }
      - { field: employee_tags, label: Tags }
      - { field: employee_properties, label: Properties }
    view_navigation: tabs
    views:
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: false
        group_by: state
        groups_source: employee_states
        card:
          title: name
          subtitle: job_title
          image_field: image_url
          fields:
            - { field: department_name, label: Department }
            - { field: work_email, label: Work Email }
            - { field: work_phone, label: Work Phone }
            - { field: state, label: Status }
      - id: list
        label: List
        icon: table
        mobile: false
      - id: card
        label: Cards
        icon: grid
        card:
          title: name
          subtitle: job_title
          image_field: image_url
          fields:
            - { field: department_name, label: Department }
            - { field: work_email, label: Work Email }
            - { field: state, label: Status }
      - id: activity
        label: Activity
        icon: activity
        mobile: false
        title_field: name
        subtitle_field: job_title
        record_date_field: hire_date
        activity_types:
          - { id: todo, label: To-Do, icon: ✓ }
          - { id: email, label: Email, icon: ✉ }
          - { id: call, label: Call, icon: ☎ }
          - { id: meeting, label: Meeting, icon: ◉ }
          - { id: document, label: Document, icon: ▣ }
        schedule_action: view_employee
      - id: graph
        label: Graph
        icon: graph
        mobile: false
        category_field: contract_start
        measure_field: employee_count
        measure_label: Employees
        type: line
      - id: pivot
        label: Pivot
        icon: pivot
        mobile: false
        pivot:
          fields:
            - { field: job_title, column: Job Position }
            - { field: contract_start, column: Contract Start, type: date }
            - { field: employee_count, column: Employees }
          default:
            rows: [job_title]
            columns: [contract_start]
            measures: [{ field: employee_count, aggregate: sum, column: Employees }]
          date_ranges: { contract_start: year }
    columns:
      - { field: image_url, label: Avatar, type: Image }
      - { field: employee_number, label: Employee number, type: PrimaryEntityCell }
      - { field: name, label: Name }
      - { field: job_title, label: Job Position }
      - { field: department_name, label: Department }
      - { field: coach_name, label: Coach }
      - { field: private_car_plate, label: Private Car Plate, optional: hide }
      - { field: work_email, label: Work Email }
      - { field: work_phone, label: Work Phone }
      - { field: state, label: Status, type: StatusChip }
      - { field: hr_presence_state, label: Presence, type: StatusChip, optional: hide }
      - { field: birthday, label: Birthday, type: date, optional: hide }
      - { field: employee_tags, label: Tags, optional: hide }
    page_size: 50
    row_key: id
    selectable: true
    bulk_actions:
      - { id: create_employee_users_bulk, label: Create Users, permission: auth.users.manage }
    row_actions: menu
    empty_state: { title: Ready to start your experience?, description: Load sample data to explore Employees }
    row_double_click_action: view_employee
    form_view: { page: apps/services/employees/pages/employee-detail.yaml, side_panel: true }
    actions:
      - { id: archive_employee, label: Archive, permission: employees.write, variant: danger, show_if: "row.active === true" }
      - { id: restore_employee, label: Restore, permission: employees.write, variant: secondary, show_if: "row.active === false" }
