        name VARCHAR NOT NULL UNIQUE,
        department_name VARCHAR,
        company_name VARCHAR,
        employment_type VARCHAR,
        recruiter_name VARCHAR,
        interviewer_names VARCHAR,
        no_of_recruitment INTEGER NOT NULL DEFAULT 0,
