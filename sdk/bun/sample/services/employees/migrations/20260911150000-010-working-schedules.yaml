version: 0.0.10
kind: data
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS employee_working_schedules (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        name VARCHAR NOT NULL UNIQUE,
        schedule_type VARCHAR NOT NULL DEFAULT 'fully_fixed',
        flexible_hours BOOLEAN NOT NULL DEFAULT false,
        duration_based BOOLEAN NOT NULL DEFAULT false,
        full_time_required_hours DOUBLE NOT NULL DEFAULT 40,
        work_time_rate DOUBLE NOT NULL DEFAULT 100,
        hours_per_day DOUBLE NOT NULL DEFAULT 8,
        hours_per_week DOUBLE NOT NULL DEFAULT 40,
        company_name VARCHAR,
        timezone VARCHAR NOT NULL DEFAULT 'UTC',
        two_weeks_calendar BOOLEAN NOT NULL DEFAULT false,
        work_resources_count INTEGER NOT NULL DEFAULT 0,
        active BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00'
      );
      CREATE TABLE IF NOT EXISTS employee_work_schedule_attendances (
        id VARCHAR PRIMARY KEY,
        schedule_id VARCHAR NOT NULL,
        row_version BIGINT NOT NULL DEFAULT 1,
        sequence INTEGER NOT NULL,
        name VARCHAR NOT NULL,
        day_of_week INTEGER NOT NULL,
        day_period VARCHAR NOT NULL,
        hour_from DOUBLE NOT NULL,
        hour_to DOUBLE NOT NULL,
        duration_days DOUBLE NOT NULL DEFAULT 0
      );
