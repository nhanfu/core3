title: Rental Order
page: { id: rental-detail, route: /rental-detail, breadcrumb: [Sales, Rental, Detail], auth: { require: [rental.read] } }
components:
  - type: OdooFormView
    source: rental_detail
    title_field: name
    status_field: state
    statusbar:
      - { value: Quotation, label: Quotation }
      - { value: Reserved, label: Reserved }
      - { value: Picked Up, label: Picked Up }
      - { value: Returned, label: Returned }
      - { value: Cancelled, label: Cancelled }
    status_colors: { Quotation: neutral, Reserved: blue, Picked Up: amber, Returned: green, Cancelled: red }
    header_actions:
      - { id: edit_rental_detail, label: Edit, permission: rental.write, show_if: "state.rental_detail.state === 'Quotation'" }
      - { id: reserve_rental_detail, label: Reserve, permission: rental.write, show_if: "state.rental_detail.state === 'Quotation'" }
      - { id: pickup_rental_detail, label: Pick up, permission: rental.write, show_if: "state.rental_detail.state === 'Reserved'" }
      - { id: return_rental_detail, label: Return, permission: rental.write, show_if: "state.rental_detail.state === 'Picked Up'" }
      - { id: cancel_rental_detail, label: Cancel, permission: rental.write, show_if: "state.rental_detail.state === 'Quotation' || state.rental_detail.state === 'Reserved'" }
    group_columns: 2
    groups:
      - title: Rental order
        fields:
          - { field: name, label: Rental order }
          - { field: state, label: Status }
          - { field: product_name, label: Product }
          - { field: quantity, label: Quantity }
          - { field: rental_period, label: Rental period }
      - title: Customer and dates
        fields:
          - { field: partner_name, label: Customer }
          - { field: start_date, label: Start date }
          - { field: return_date, label: Return date }
          - { field: price, label: Price }
          - { field: salesperson, label: Salesperson }
  - type: ContactGrid
    source: rental_detail_events
    row_key: id
    columns:
      - { field: event_type, label: Event }
      - { field: event_date, label: Date }
      - { field: actor_name, label: Responsible }
      - { field: notes, label: Notes }
