title: Rental Availability
page: { id: rental-availability, route: /availability, breadcrumb: [Sales, Rental, Availability], auth: { require: [rental.read] } }
components:
  - type: ListView
    variant: odoo
    source: rental_availability
    columns:
      - { field: product_name, label: Rental product, type: PrimaryEntityCell }
      - { field: rented_quantity, label: Total units, align: right }
      - { field: reserved_quantity, label: Reserved units, align: right }
      - { field: next_start, label: Next rental }
      - { field: last_return, label: Last return }
    page_size: 50
    row_key: product_name
