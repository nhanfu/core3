title: Rental Events
page: { id: rental-events, route: /rental-events, breadcrumb: [Sales, Rental, Events], auth: { require: [rental.read] } }
components:
  - type: ListView
    variant: odoo
    source: rental_events
    columns:
      - { field: rental_name, label: Rental order, type: PrimaryEntityCell }
