page: { id: rental-detail }
datasources:
  - id: rental_detail
    single: true
    permission: rental.read
    query: "SELECT id, row_version, name, partner_name, product_name, quantity, rental_period, state, CAST(start_date AS VARCHAR) AS start_date, CAST(return_date AS VARCHAR) AS return_date, price, salesperson FROM sale_rentals WHERE id = :id"
  - id: rental_detail_events
    single: false
    permission: rental.read
    query: "SELECT id, event_type, CAST(event_date AS VARCHAR) AS event_date, notes, actor_name FROM sale_rental_events WHERE rental_id = :id ORDER BY event_date DESC"
actions:
  - id: edit_rental_detail
    type: server_form
    permission: rental.write
    title: Edit rental order
    action: rental.update
    handler: yaml_mutation
    operation: update
    prefill: source
    prefill_source: rental_detail
    refresh: [rental_detail, rental_detail_events]
    mutation:
      operation: update
      table: sale_rentals
      fields: [name, partner_name, product_name, quantity, rental_period, start_date, return_date, price, salesperson]
      required: [name, product_name]
      concurrency: { required: true }
      guards:
        - query: "SELECT id FROM sale_rentals WHERE id = :id AND row_version = :expected_row_version"
          status: 409
          code: STALE_RECORD
          message: This rental changed or was deleted; reload before saving
        - query: "SELECT id FROM sale_rentals WHERE id = :id AND state = 'Quotation'"
          status: 409
          code: RENTAL_EDIT_NOT_ALLOWED
          message: Only quotation rentals can be edited
        - query: "SELECT 1 AS ok WHERE CAST(:quantity AS DECIMAL(18,3)) > 0 AND CAST(:price AS DECIMAL(18,2)) >= 0"
          status: 422
          code: RENTAL_VALUES_INVALID
          message: Quantity must be positive and price cannot be negative
        - query: "SELECT 1 AS ok WHERE (COALESCE(TRIM(CAST(:start_date AS VARCHAR)), '') = '' OR TRY_CAST(:start_date AS DATE) IS NOT NULL) AND (COALESCE(TRIM(CAST(:return_date AS VARCHAR)), '') = '' OR TRY_CAST(:return_date AS DATE) IS NOT NULL) AND (COALESCE(TRIM(CAST(:start_date AS VARCHAR)), '') = '' OR COALESCE(TRIM(CAST(:return_date AS VARCHAR)), '') = '' OR TRY_CAST(:return_date AS DATE) >= TRY_CAST(:start_date AS DATE))"
          status: 422
          code: RENTAL_DATES_INVALID
          message: Return date must be on or after the rental start
      result: { query: "SELECT * FROM sale_rentals WHERE id = :id" }
    fields:
      - { field: name, label: Rental order, type: text, required: true }
      - { field: partner_name, label: Customer, type: text }
      - { field: product_name, label: Product, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, required: true }
      - { field: rental_period, label: Rental period, type: select, options: [Hours, Days, Weeks, Months] }
      - { field: start_date, label: Start date, type: date }
      - { field: return_date, label: Return date, type: date }
      - { field: price, label: Price, type: money, required: true }
      - { field: salesperson, label: Salesperson, type: text }
  - id: reserve_rental_detail
    type: server
    permission: rental.write
    action: rental.reserve
    handler: order_transition
    workflow: rentals
    operation: reserve
    refresh: [rental_detail, rental_detail_events]
  - id: pickup_rental_detail
    type: server
    permission: rental.write
    action: rental.pickup
    handler: order_transition
    workflow: rentals
    operation: pickup
    refresh: [rental_detail, rental_detail_events]
  - id: return_rental_detail
    type: server
    permission: rental.write
    action: rental.return
    handler: order_transition
    workflow: rentals
    operation: return
    refresh: [rental_detail, rental_detail_events]
  - id: cancel_rental_detail
    type: server
    permission: rental.write
    action: rental.cancel
    handler: order_transition
    workflow: rentals
    operation: cancel
    refresh: [rental_detail, rental_detail_events]
