version: 0.0.1

hot_data:
  - table: orders
    date_column: order_date
    window:
      years: 2

type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS customers (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), code VARCHAR NOT NULL UNIQUE, name VARCHAR NOT NULL, legal_name VARCHAR,
        owner_name VARCHAR, visibility VARCHAR DEFAULT 'Public', status VARCHAR DEFAULT 'Active'
      );
      CREATE TABLE IF NOT EXISTS master_data (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), kind VARCHAR NOT NULL, code VARCHAR NOT NULL,
        name VARCHAR NOT NULL, status VARCHAR NOT NULL DEFAULT 'Active', UNIQUE(kind, code)
      );
      CREATE TABLE IF NOT EXISTS system_configs (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), kind VARCHAR NOT NULL, code VARCHAR NOT NULL,
        name VARCHAR NOT NULL, status VARCHAR NOT NULL DEFAULT 'Active', UNIQUE(kind, code)
      );
      CREATE TABLE IF NOT EXISTS orders (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), order_number VARCHAR NOT NULL UNIQUE,
        customer_name VARCHAR NOT NULL, customer_legal_name VARCHAR, order_date DATE NOT NULL,
        status VARCHAR NOT NULL DEFAULT 'Draft', shipment_type VARCHAR, route VARCHAR, transport_method VARCHAR,
        trip_count INTEGER NOT NULL DEFAULT 0, total_amount DECIMAL(18,2) NOT NULL DEFAULT 0,
        branch_id VARCHAR, created_by VARCHAR NOT NULL DEFAULT 'Admin User', notes VARCHAR,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS order_workflow_states (
        order_id VARCHAR PRIMARY KEY REFERENCES orders(id), status VARCHAR NOT NULL, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS order_lines (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), order_id VARCHAR NOT NULL REFERENCES orders(id),
        sequence INTEGER NOT NULL DEFAULT 10, description VARCHAR NOT NULL, quantity DECIMAL(18,3) NOT NULL DEFAULT 1,
        unit VARCHAR NOT NULL DEFAULT 'Chuyến', unit_price DECIMAL(18,2) NOT NULL DEFAULT 0,
        tax_rate DECIMAL(5,2) NOT NULL DEFAULT 0, line_total DECIMAL(18,2) NOT NULL DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(order_id, sequence)
      );
      CREATE TABLE IF NOT EXISTS order_followers (
        order_id VARCHAR NOT NULL, user_id VARCHAR NOT NULL, added_by VARCHAR, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY(order_id, user_id)
      );
      CREATE TABLE IF NOT EXISTS order_attachments (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), order_id VARCHAR NOT NULL, file_name VARCHAR NOT NULL,
        mime_type VARCHAR, size_bytes BIGINT NOT NULL DEFAULT 0, storage_key VARCHAR NOT NULL,
        uploaded_by VARCHAR, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS system_activity (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), actor_id VARCHAR, actor_name VARCHAR NOT NULL,
        action VARCHAR NOT NULL, resource VARCHAR NOT NULL, resource_id VARCHAR, detail VARCHAR,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS idx_order_status ON orders(status);
      CREATE INDEX IF NOT EXISTS idx_order_date ON orders(order_date);
      CREATE INDEX IF NOT EXISTS idx_order_lines_order ON order_lines(order_id);
      CREATE INDEX IF NOT EXISTS idx_order_followers_user ON order_followers(user_id, order_id);

    down: |
      DROP TABLE IF EXISTS order_attachments;
      DROP TABLE IF EXISTS order_followers;
      DROP TABLE IF EXISTS order_lines;
      DROP TABLE IF EXISTS order_workflow_states;
      DROP TABLE IF EXISTS orders;
      DROP TABLE IF EXISTS system_activity;
      DROP TABLE IF EXISTS system_configs;
      DROP TABLE IF EXISTS master_data;
      DROP TABLE IF EXISTS customers;
  duckdb:
    up: |
      CREATE TABLE IF NOT EXISTS customers (id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), code VARCHAR NOT NULL UNIQUE, name VARCHAR NOT NULL, legal_name VARCHAR, owner_name VARCHAR, visibility VARCHAR DEFAULT 'Public', status VARCHAR DEFAULT 'Active');
      CREATE TABLE IF NOT EXISTS master_data (id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), kind VARCHAR NOT NULL, code VARCHAR NOT NULL, name VARCHAR NOT NULL, status VARCHAR NOT NULL DEFAULT 'Active', UNIQUE(kind, code));
      CREATE TABLE IF NOT EXISTS system_configs (id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), kind VARCHAR NOT NULL, code VARCHAR NOT NULL, name VARCHAR NOT NULL, status VARCHAR NOT NULL DEFAULT 'Active', UNIQUE(kind, code));
      CREATE TABLE IF NOT EXISTS orders (id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), order_number VARCHAR NOT NULL UNIQUE, customer_name VARCHAR NOT NULL, customer_legal_name VARCHAR, order_date DATE NOT NULL, status VARCHAR NOT NULL DEFAULT 'Draft', shipment_type VARCHAR, route VARCHAR, transport_method VARCHAR, trip_count INTEGER NOT NULL DEFAULT 0, total_amount DECIMAL(18,2) NOT NULL DEFAULT 0, branch_id VARCHAR, created_by VARCHAR NOT NULL DEFAULT 'Admin User', notes VARCHAR, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
      CREATE TABLE IF NOT EXISTS order_workflow_states (order_id VARCHAR PRIMARY KEY, status VARCHAR NOT NULL, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
      CREATE TABLE IF NOT EXISTS order_lines (id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), order_id VARCHAR NOT NULL, sequence INTEGER NOT NULL DEFAULT 10, description VARCHAR NOT NULL, quantity DECIMAL(18,3) NOT NULL DEFAULT 1, unit VARCHAR NOT NULL DEFAULT 'Chuyến', unit_price DECIMAL(18,2) NOT NULL DEFAULT 0, tax_rate DECIMAL(5,2) NOT NULL DEFAULT 0, line_total DECIMAL(18,2) NOT NULL DEFAULT 0, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, UNIQUE(order_id, sequence));
      CREATE TABLE IF NOT EXISTS order_followers (order_id VARCHAR NOT NULL, user_id VARCHAR NOT NULL, added_by VARCHAR, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, PRIMARY KEY(order_id, user_id));
      CREATE TABLE IF NOT EXISTS order_attachments (id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), order_id VARCHAR NOT NULL, file_name VARCHAR NOT NULL, mime_type VARCHAR, size_bytes BIGINT NOT NULL DEFAULT 0, storage_key VARCHAR NOT NULL, uploaded_by VARCHAR, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
      CREATE TABLE IF NOT EXISTS system_activity (id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), actor_id VARCHAR, actor_name VARCHAR NOT NULL, action VARCHAR NOT NULL, resource VARCHAR NOT NULL, resource_id VARCHAR, detail VARCHAR, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
      CREATE INDEX IF NOT EXISTS idx_order_status ON orders(status);
      CREATE INDEX IF NOT EXISTS idx_order_date ON orders(order_date);
      CREATE INDEX IF NOT EXISTS idx_order_lines_order ON order_lines(order_id);
      CREATE INDEX IF NOT EXISTS idx_order_followers_user ON order_followers(user_id, order_id);
    down: |
      DROP TABLE IF EXISTS order_attachments;
      DROP TABLE IF EXISTS order_followers;
      DROP TABLE IF EXISTS order_lines;
      DROP TABLE IF EXISTS order_workflow_states;
      DROP TABLE IF EXISTS orders;
      DROP TABLE IF EXISTS system_activity;
      DROP TABLE IF EXISTS system_configs;
      DROP TABLE IF EXISTS master_data;
      DROP TABLE IF EXISTS customers;
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
