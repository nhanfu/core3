      ALTER TABLE orders ADD COLUMN IF NOT EXISTS salesperson_name VARCHAR;
      UPDATE orders SET salesperson_name = CASE
        WHEN created_by = 'Dispatcher User' THEN 'Sarah Johnson'
        ELSE 'Mitchell Admin'
      END
      WHERE salesperson_name IS NULL;
