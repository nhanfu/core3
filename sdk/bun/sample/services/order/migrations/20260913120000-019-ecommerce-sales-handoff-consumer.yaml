      DROP INDEX IF EXISTS uq_orders_source;
      ALTER TABLE order_lines DROP COLUMN IF EXISTS source_line_id;
      ALTER TABLE orders DROP COLUMN IF EXISTS source_id;
      ALTER TABLE orders DROP COLUMN IF EXISTS source_service;
