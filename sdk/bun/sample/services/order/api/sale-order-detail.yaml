title: Sales order
page: { id: sale-order-detail }

datasources:
  - id: sale_order_detail
    single: true
    permission: orders.read
    query: |
      SELECT o.id, o.row_version, o.order_number,
        o.customer_name, o.customer_legal_name, o.customer_legal_name AS shipping_address,
        o.customer_reference, CAST(o.order_date AS VARCHAR) AS order_date,
        CAST(o.validity_date AS VARCHAR) AS validity_date, CAST(o.commitment_date AS VARCHAR) AS commitment_date,
        o.pricelist_name, o.payment_term_name, COALESCE(o.salesperson_name, o.created_by) AS salesperson_name,
        'My Company' AS company_name, o.require_signature, o.require_payment,
        o.notes, COALESCE(o.total_amount, 0) AS total_amount, printf('$%,.2f', COALESCE(o.total_amount, 0)) AS total_amount_display,
        CASE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status)
          WHEN 'Draft' THEN 'Quotation' WHEN 'Pending Approval' THEN 'Sent'
          WHEN 'Approved' THEN 'Sales Order' WHEN 'Cancelled' THEN 'Cancelled'
          ELSE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) END AS status,
        CASE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status)
          WHEN 'Draft' THEN 'Quotation' WHEN 'Pending Approval' THEN 'Quotation Sent'
          WHEN 'Approved' THEN 'Sales Order' WHEN 'Cancelled' THEN 'Cancelled'
          ELSE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) END AS status_label,
        CASE WHEN EXISTS (SELECT 1 FROM sale_invoices i WHERE i.order_id = o.id AND i.state = 'Posted') THEN 'Invoiced' ELSE COALESCE(o.invoice_status, 'To invoice') END AS invoice_status,
        (SELECT COUNT(*) FROM sale_invoices i WHERE i.order_id = o.id) AS invoice_count
      FROM orders o
      WHERE o.id = :id AND (:view_scope = 'all' OR o.branch_id = :current_branch_id)
  - id: sale_order_statuses
    single: false
    permission: orders.read
    query: "SELECT value, label, color FROM (VALUES ('Quotation', 'Quotation', 'neutral'), ('Sent', 'Quotation Sent', 'amber'), ('Sales Order', 'Sales Order', 'green'), ('Cancelled', 'Cancelled', 'red')) states(value, label, color) ORDER BY CASE value WHEN 'Quotation' THEN 1 WHEN 'Sent' THEN 2 WHEN 'Sales Order' THEN 3 ELSE 4 END"
  - id: sale_order_lines
    single: false
    permission: orders.read
    query: |
      SELECT l.id, l.row_version, l.order_id AS document_id, l.product_id, p.name AS product_name,
        l.description, CAST(l.quantity AS DOUBLE) AS quantity, printf('%,.2f', l.quantity) AS quantity_display,
        l.unit, CAST(l.unit_price AS DOUBLE) AS unit_price, printf('$%,.2f', l.unit_price) AS unit_price_display,
        CAST(COALESCE(l.discount, 0) AS DOUBLE) AS discount, printf('%.2f%%', COALESCE(l.discount, 0)) AS discount_display,
        CAST(l.tax_rate AS DOUBLE) AS tax_rate, printf('%.2f%%', l.tax_rate) AS tax_rate_display,
        CAST(COALESCE(l.price_total, l.line_total) AS DOUBLE) AS line_total,
        printf('$%,.2f', COALESCE(l.price_total, l.line_total)) AS line_total_display,
        COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = l.order_id), o.status) AS parent_status,
        o.row_version AS parent_row_version
      FROM order_lines l JOIN orders o ON o.id = l.order_id LEFT JOIN sale_products p ON p.id = l.product_id
      WHERE l.order_id = :id AND (:view_scope = 'all' OR o.branch_id = :current_branch_id) ORDER BY l.sequence
  - id: sale_order_product_lookup
    single: false
    permission: orders.read
    query: "SELECT id AS value, default_code || ' - ' || name AS label FROM sale_products WHERE active = true AND sale_ok = true ORDER BY name"
  - id: sale_order_customer_lookup
    single: false
    permission: orders.read
    query: "SELECT name AS value, code || ' - ' || name AS label FROM customers WHERE status = 'Active' AND (:view_scope = 'all' OR visibility = 'Public' OR owner_name = :current_user_name) ORDER BY name"
  - id: sale_order_pricelist_lookup
    single: false
    permission: orders.read
    query: "SELECT name AS value, name AS label FROM sale_pricelists WHERE active = true ORDER BY name"
  - id: sale_order_payment_terms_lookup
    single: false
    permission: orders.read
    query: "SELECT name AS value, name AS label FROM sale_payment_terms WHERE active = true ORDER BY due_days, name"
  - id: sale_unit_lookup
    single: false
    permission: orders.read
    query: "SELECT code AS value, code AS label FROM master_data WHERE kind = 'unit' AND status = 'Active' UNION SELECT DISTINCT unit AS value, unit AS label FROM order_lines WHERE unit IS NOT NULL AND unit <> '' ORDER BY label"
  - id: sale_order_timeline
    single: false
    permission: orders.read
    query: "SELECT actor_name, action, CASE action WHEN 'orders.submit_for_approval' THEN 'Sent quotation' WHEN 'orders.approve' THEN 'Confirmed order' WHEN 'orders.cancel' THEN 'Cancelled order' WHEN 'orders.reset_to_quotation' THEN 'Set to quotation' WHEN 'orders.lines.create' THEN 'Added order line' WHEN 'orders.message' THEN 'Message' WHEN 'orders.note' THEN 'Note' ELSE action END AS action_label, detail, CAST(created_at AS VARCHAR) AS created_at FROM system_activity WHERE resource = 'orders' AND resource_id = :id ORDER BY created_at DESC"
  - id: sale_order_followers
    single: false
    permission: orders.read
    query: "SELECT user_id, CAST(created_at AS VARCHAR) AS followed_at FROM order_followers WHERE order_id = :id ORDER BY created_at"

actions:
  - id: edit_sale_order
    type: server_form
    permission: orders.write
    title: Edit Sales Order
    action: orders.update
    handler: yaml_mutation
    operation: update
    prefill: source
    prefill_source: sale_order_detail
    refresh: [sale_order_detail, sale_order_lines, sale_order_timeline]
    mutation:
      operation: update
      table: orders
      fields: [order_number, customer_name, customer_legal_name, customer_reference, order_date, validity_date, commitment_date, pricelist_name, payment_term_name, require_signature, require_payment, notes]
      required: [order_number, customer_name, order_date]
      timestamps: true
      concurrency: { required: true }
      scope: { field: branch_id, message: Sales order is outside the current view scope }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM orders WHERE order_number = :order_number AND id <> :id)"
          status: 409
          code: DUPLICATE_ORDER
          message: Sales order number already exists
        - query: "SELECT id FROM orders WHERE id = :id AND COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = orders.id), orders.status) IN ('Draft', 'Pending Approval')"
          status: 409
          code: SALE_ORDER_LOCKED
          message: Only quotations can be edited
      result: { query: "SELECT * FROM orders WHERE id = :id" }
    fields:
      - { field: order_number, label: Order Number, type: text, required: true }
      - { field: customer_name, label: Customer, type: async-select, options_source: sale_order_customer_lookup, search_placeholder: 'Type to find a customer...', required: true }
      - { field: customer_legal_name, label: Invoice Address, type: text }
      - { field: customer_reference, label: Customer Reference, type: text }
      - { field: order_date, label: Quotation Date, type: date, required: true }
      - { field: validity_date, label: Expiration, type: date }
      - { field: commitment_date, label: Delivery Date, type: date }
      - { field: pricelist_name, label: Pricelist, type: select, options_source: sale_order_pricelist_lookup }
      - { field: payment_term_name, label: Payment Terms, type: select, options_source: sale_order_payment_terms_lookup }
      - { field: require_signature, label: Online Signature, type: checkbox }
      - { field: require_payment, label: Online Payment, type: checkbox }
      - { field: notes, label: Terms and Conditions, type: textarea }
  - id: send_sale_quotation
    type: server
    permission: orders.write
    action: orders.submit_for_approval
    handler: order_transition
    workflow: orders
    operation: submit_for_approval
    confirm: 'Send quotation {{row.order_number}}?'
    refresh: [sale_order_detail, sale_order_lines, sale_order_timeline]
  - id: confirm_sale_order
    type: server
    permission: orders.approve
    action: orders.approve
    handler: order_transition
    workflow: orders
    operation: approve
    confirm: 'Confirm {{row.order_number}}?'
    refresh: [sale_order_detail, sale_order_lines, sale_order_timeline]
  - id: confirm_draft_sale_order
    type: server
    permission: orders.approve
    action: orders.approve
    handler: order_transition
    workflow: orders
    operation: approve
    confirm: 'Confirm {{row.order_number}}?'
    refresh: [sale_order_detail, sale_order_lines, sale_order_timeline]
  - id: cancel_sale_order
    type: server
    permission: orders.write
    action: orders.cancel
    handler: order_transition
    workflow: orders
    operation: cancel
    confirm: 'Cancel {{row.order_number}}?'
    mutation:
      scope: { table: orders, field: branch_id, message: Sales order is outside the current view scope }
      guards:
        - query: "SELECT id FROM orders WHERE id = :id AND row_version = :expected_row_version"
          status: 409
          code: STALE_RECORD
          message: Order was changed by another user. Reload it before cancelling.
          message_key: errors.stale_record
        - query: "SELECT o.order_number, COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) AS current_status FROM orders o WHERE o.id = :id AND COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) IN ('Draft', 'Pending Approval', 'Approved')"
          status: 409
          code: INVALID_TRANSITION
          message: Order cannot be cancelled in its current state
          message_key: errors.invalid_transition
          assign: true
      steps:
        - query: "INSERT INTO order_workflow_states(order_id, status, updated_at) VALUES(:id, 'Cancelled', CURRENT_TIMESTAMP) ON CONFLICT(order_id) DO UPDATE SET status = excluded.status, updated_at = excluded.updated_at"
        - query: "INSERT INTO system_activity(id, actor_id, actor_name, action, resource, resource_id, detail) VALUES(gen_random_uuid(), :current_user_id, :current_user_name, 'orders.cancel', 'orders', :id, :order_number || ': ' || :current_status || ' -> Cancelled')"
        - query: "UPDATE orders SET row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version"
          expect_changed: true
          code: STALE_RECORD
      result: { query: "SELECT o.*, COALESCE(s.status, o.status) AS status, :current_status AS previous_status FROM orders o LEFT JOIN order_workflow_states s ON s.order_id = o.id WHERE o.id = :id" }
    refresh: [sale_order_detail, sale_order_lines, sale_order_timeline]
  - id: reset_sale_quotation
    type: server
    permission: orders.write
    action: orders.reset_to_quotation
    handler: yaml_mutation
    operation: update
    refresh: [sale_order_detail, sale_order_lines, sale_order_timeline]
    mutation:
      operation: update
      table: order_workflow_states
      key: order_id
      fields: [status]
      scope: { table: orders, field: branch_id }
      guards:
        - query: "SELECT order_id AS id FROM order_workflow_states WHERE order_id = :id AND status = 'Cancelled'"
          status: 409
          code: SALE_ORDER_NOT_CANCELLED
          message: Only cancelled orders can be set to quotation
      before_steps:
        - query: "INSERT INTO system_activity(id, actor_id, actor_name, action, resource, resource_id, detail) VALUES(gen_random_uuid(), :current_user_id, :current_user_name, 'orders.reset_to_quotation', 'orders', :id, 'Set to quotation')"
      values: { status: Draft }
      result: { query: "SELECT * FROM orders WHERE id = :id" }
  - id: create_sale_invoice
    type: navigate
    permission: orders.write
    navigate_to: /order/to-invoice
    params: { order_id: '{row.id}' }
  - id: view_sale_invoice
    type: navigate
    permission: orders.read
    navigate_to: /order/invoices
    params: { order_id: '{row.id}' }
  - id: add_sale_order_line
    type: server_form
    permission: orders.write
    title: Add a product
    action: orders.lines.create
    handler: line_item
    operation: create
    domain: order
    params: { id: '{state.id}' }
    refresh: [sale_order_detail, sale_order_lines, sale_order_timeline]
    fields:
      - { field: product_id, label: Product, type: select, options_source: sale_order_product_lookup, required: true }
      - { field: description, label: Description, type: text, required: true }
      - { field: quantity, label: Quantity, type: number, default: 1, required: true }
      - { field: unit, label: Unit, type: select, options_source: sale_unit_lookup, default: Units, required: true }
      - { field: unit_price, label: Unit Price, type: money, currency: USD, default: 0, required: true }
      - { field: discount, label: Discount (%), type: number, default: 0, required: true }
      - { field: tax_rate, label: Taxes (%), type: number, default: 0, required: true }
    mutation:
      scope: { table: orders, field: branch_id, message: Sales order is outside the current view scope }
      generated: [line_id]
      guards:
        - query: "SELECT id FROM orders WHERE id = :id AND row_version = :parent_expected_row_version AND COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = orders.id), orders.status) IN ('Draft', 'Pending Approval')"
          status: 409
          code: SALE_ORDER_LINE_STALE
          message: Sales order changed or is no longer editable; reload it before adding a product
        - query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM sale_products WHERE id = :product_id AND active = true AND sale_ok = true)"
          status: 400
          message: Selected product is not available for sale
      steps:
        - { query: "SELECT COALESCE(MAX(sequence), 0) + 10 AS next_sequence FROM order_lines WHERE order_id = :id", assign: true }
        - query: "INSERT INTO order_lines(id, order_id, sequence, description, product_id, quantity, unit, unit_price, tax_rate, discount, qty_to_invoice, price_subtotal, price_tax, price_total, line_total) VALUES(:line_id, :id, :next_sequence, :description, :product_id, :quantity, :unit, :unit_price, :tax_rate, :discount, :quantity, ROUND(CAST(:quantity AS DECIMAL(18,4)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100), 2), ROUND(CAST(:quantity AS DECIMAL(18,4)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100) * CAST(:tax_rate AS DECIMAL(9,4)) / 100, 2), ROUND(CAST(:quantity AS DECIMAL(18,4)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100) * (1 + CAST(:tax_rate AS DECIMAL(9,4)) / 100), 2), ROUND(CAST(:quantity AS DECIMAL(18,4)) * CAST(:unit_price AS DECIMAL(18,2)) * (1 - CAST(:discount AS DECIMAL(9,4)) / 100) * (1 + CAST(:tax_rate AS DECIMAL(9,4)) / 100), 2))"
        - query: "UPDATE orders SET total_amount = (SELECT COALESCE(SUM(COALESCE(price_total, line_total)), 0) FROM order_lines WHERE order_id = :id), updated_at = CURRENT_TIMESTAMP, row_version = row_version + 1 WHERE id = :id AND row_version = :parent_expected_row_version"
          expect_changed: true
          code: SALE_ORDER_LINE_STALE
        - query: "INSERT INTO system_activity(id, actor_id, actor_name, action, resource, resource_id, detail) VALUES(gen_random_uuid(), :current_user_id, :current_user_name, 'orders.lines.create', 'orders', :id, concat('Added product: ', :description))"
      result: { query: "SELECT * FROM order_lines WHERE id = :line_id" }
  - id: send_sale_order_message
    type: server_form
    permission: orders.write
    title: Send message
    action: orders.chatter.send
    handler: order_chatter
    operation: message
    params: { id: '{row.id}' }
    refresh: [sale_order_timeline]
    fields: [{ field: content, label: Message, type: textarea, required: true }]
  - id: log_sale_order_note
    type: server_form
    permission: orders.write
    title: Log note
    action: orders.chatter.note
    handler: order_chatter
    operation: note
    params: { id: '{row.id}' }
    refresh: [sale_order_timeline]
    fields: [{ field: content, label: Note, type: textarea, required: true }]
