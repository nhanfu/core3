page: { id: sale-pricelists }
datasources:
  - id: sale_pricelists
    single: false
    permission: orders.read
    query: |
      SELECT p.id, p.row_version, p.name, p.currency, p.discount_policy, p.active,
        (SELECT COUNT(*) FROM sale_pricelist_items i WHERE i.pricelist_id = p.id) AS rule_count,
        CAST(p.created_at AS VARCHAR) AS created_at
      FROM sale_pricelists p ORDER BY p.name
actions:
  - id: view_sale_pricelist
    type: navigate
    permission: orders.read
    navigate_to: /order/pricelist/detail
    params: { id: '{row.id}' }
  - id: create_sale_pricelist
    type: server_form
    permission: orders.write
    title: New pricelist
    action: sales.pricelists.create
    handler: yaml_mutation
    operation: create
    refresh: [sale_pricelists]
    mutation:
      operation: insert
      table: sale_pricelists
      fields: [name, currency, discount_policy, active]
      required: [name]
      defaults: { currency: USD, discount_policy: Discount included, active: true }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM sale_pricelists WHERE name = :name)"
          status: 409
          message: Pricelist name already exists
      result: { query: "SELECT * FROM sale_pricelists WHERE id = :id" }
    fields:
      - { field: name, label: Pricelist name, type: text, required: true }
      - { field: currency, label: Currency, type: text, default: USD }
      - { field: discount_policy, label: Discount policy, type: select, options: [Discount included, Discount shown separately] }
  - id: archive_sale_pricelist
    type: server
    permission: orders.write
    action: sales.pricelists.archive
    handler: pricelist_status
    operation: archive
    params: { id: '{row.id}' }
    refresh: [sale_pricelists]
    mutation:
      guards:
        - query: "SELECT id FROM sale_pricelists WHERE id = :id AND active = true"
          status: 409
          message: Pricelist is already archived
      steps:
        - query: "UPDATE sale_pricelists SET active = false WHERE id = :id"
      result: { query: "SELECT * FROM sale_pricelists WHERE id = :id" }
