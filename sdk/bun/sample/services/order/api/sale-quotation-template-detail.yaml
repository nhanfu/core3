page: { id: sale-quotation-template-detail }
datasources:
  - id: sale_quotation_template_detail
    single: true
    permission: orders.read
    error_states: { transport_error: { status: 503, code: SALES_QUOTATION_TEMPLATE_DETAIL_UNAVAILABLE, message: Quotation template details are temporarily unavailable. } }
    query: "SELECT id, row_version, name, company_name, active, number_of_days, confirmation_mail, invoicing_journal, require_signature, require_payment, prepayment_percent, note, CASE WHEN active THEN 'Active' ELSE 'Archived' END AS status FROM sale_quotation_templates WHERE CASE WHEN :fixture_state IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND id = :id"
  - id: sale_quotation_template_lines
    single: false
    permission: orders.read
    query: "SELECT id, template_id, row_version, sequence, product_name, description, quantity, uom, optional FROM sale_quotation_template_lines WHERE template_id = :id ORDER BY sequence, id"
  - id: template_order_customer_lookup
    single: false
    permission: orders.read
    query: "SELECT name AS value, code || ' - ' || name AS label FROM customers WHERE status = 'Active' AND (:company_name IS NULL OR company_name IS NULL OR company_name = :company_name) AND (:view_scope = 'all' OR visibility = 'Public' OR owner_name = :current_user_name) ORDER BY name"
  - id: template_order_pricelist_lookup
    single: false
    permission: orders.read
    query: "SELECT name AS value, name AS label FROM sale_pricelists WHERE active = true ORDER BY name"
  - id: template_order_payment_terms_lookup
    single: false
    permission: orders.read
    query: "SELECT name AS value, name AS label FROM sale_payment_terms WHERE active = true ORDER BY due_days, name"
actions:
  - id: edit_sale_quotation_template
    type: server_form
    permission: orders.write
    title: Edit quotation template
    action: sales.quotation_templates.update
    handler: yaml_mutation
    operation: update
    prefill: state.sale_quotation_template_detail
    params: { id: '{state.id}' }
    refresh: [sale_quotation_template_detail, sale_quotation_templates]
    mutation:
      operation: update
      table: sale_quotation_templates
      fields: [name, company_name, number_of_days, confirmation_mail, invoicing_journal, require_signature, require_payment, prepayment_percent, note]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM sale_quotation_templates WHERE id = :id", status: 404, code: SALES_QUOTATION_TEMPLATE_NOT_FOUND, message: Quotation template not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: SALES_QUOTATION_TEMPLATE_NAME_REQUIRED, message: A quotation template name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM sale_quotation_templates WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: SALES_QUOTATION_TEMPLATE_EXISTS, message: A quotation template with this name already exists. }
      result: { query: "SELECT * FROM sale_quotation_templates WHERE id = :id" }
    fields:
      - { field: name, label: Quotation Template, type: text, required: true }
      - { field: company_name, label: Company, type: text }
      - { field: number_of_days, label: Quotation Validity, type: number, min: 0 }
      - { field: confirmation_mail, label: Confirmation Mail, type: text }
      - { field: invoicing_journal, label: Invoicing Journal, type: text }
      - { field: require_signature, label: Online Signature, type: checkbox }
      - { field: require_payment, label: Online Payment, type: checkbox }
      - { field: prepayment_percent, label: Prepayment percentage, type: number, min: 0, max: 100 }
      - { field: note, label: Terms & Conditions, type: textarea, wide: true }
  - id: create_sale_order_from_template
    type: server_form
    permission: orders.write
    title: Create quotation from template
    action: sales.quotation_templates.create_order
    handler: yaml_mutation
    operation: create
    params: { template_id: '{state.id}', template_expected_row_version: '{state.row_version}' }
    refresh: [sale_quotation_templates, sale_quotation_template_detail, sale_quotation_template_lines]
    mutation:
      operation: insert
      table: orders
      fields: [order_number, customer_name, customer_legal_name, order_date, validity_date, pricelist_name, payment_term_name, status, total_amount, created_by, notes]
      required: [order_number, customer_name, order_date]
      defaults: { status: Draft, total_amount: 0, created_by: 'Admin User' }
      generated: [id]
      scope: { table: orders, field: branch_id, message: New quotation must remain in the current branch scope, message_key: errors.order_outside_scope }
      guards:
        - { query: "SELECT t.row_version, t.name AS template_name, t.company_name AS template_company_name, COALESCE(t.note, '') AS template_note FROM sale_quotation_templates t WHERE t.id = :template_id", status: 404, code: SALES_QUOTATION_TEMPLATE_NOT_FOUND, message: Quotation template not found. }
        - { query: "SELECT t.row_version, t.name AS template_name, t.company_name AS template_company_name, COALESCE(t.note, '') AS template_note FROM sale_quotation_templates t WHERE t.id = :template_id AND t.active = true AND t.row_version = :template_expected_row_version", status: 409, code: STALE_RECORD, message: Quotation template changed or is archived; reload it before creating an order. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM orders WHERE order_number = :order_number)", status: 409, code: DUPLICATE_ORDER, message: Sales order number already exists. }
        - { query: "SELECT id FROM customers WHERE name = :customer_name AND status = 'Active'", status: 422, code: SALES_ORDER_CUSTOMER_INVALID, message: Select an active customer before creating the quotation. }
        - { query: "SELECT id FROM customers WHERE name = :customer_name AND status = 'Active' AND (:company_name IS NULL OR company_name IS NULL OR company_name = :company_name)", status: 403, code: SALES_CUSTOMER_COMPANY_FORBIDDEN, message: Customer belongs to another company. }
        - { query: "SELECT id FROM customers WHERE name = :customer_name AND status = 'Active' AND (:view_scope = 'all' OR visibility = 'Public' OR owner_name = :current_user_name)", status: 403, code: SALES_CUSTOMER_FORBIDDEN, message: You are not allowed to use this customer. }
        - { query: "SELECT id FROM customers WHERE name = :customer_name AND status = 'Active' AND (:customer_expected_row_version IS NULL OR row_version = :customer_expected_row_version)", status: 409, code: STALE_CUSTOMER_REFERENCE, message: Customer changed before the quotation was saved. Reload and try again. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM sale_quotation_template_lines l WHERE COALESCE(l.quantity, 0) <= 0 OR NOT EXISTS (SELECT 1 FROM sale_products p WHERE p.active = true AND p.sale_ok = true AND (LOWER(p.name) = LOWER(l.product_name) OR LOWER(regexp_replace(p.name, 's$', '')) = LOWER(regexp_replace(l.product_name, 's$', '')))))", status: 422, code: SALES_QUOTATION_TEMPLATE_LINE_INVALID, message: Every template line must use an active product with a positive quantity. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM orders WHERE id = 'sale-order-' || regexp_replace(lower(trim(CAST(:order_number AS VARCHAR))), '[^a-z0-9]+', '-', 'g'))", status: 409, code: SALES_ORDER_ID_EXISTS, message: The generated sales order identifier already exists. }
      before_steps:
        - { query: "SELECT 'sale-order-' || regexp_replace(lower(trim(CAST(:order_number AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id, COALESCE(NULLIF(CAST(:current_user_name AS VARCHAR), ''), 'Admin User') AS created_by", assign: true }
      steps:
        - query: "UPDATE orders SET customer_id = (SELECT id FROM customers WHERE name = :customer_name AND status = 'Active' LIMIT 1), customer_row_version = (SELECT row_version FROM customers WHERE name = :customer_name AND status = 'Active' LIMIT 1) WHERE id = :id"
        - query: "INSERT INTO order_lines(id, order_id, sequence, description, product_id, quantity, unit, unit_price, tax_rate, discount, qty_delivered, qty_invoiced, qty_to_invoice, price_subtotal, price_tax, price_total, line_total) SELECT :id || '-line-' || CAST(l.sequence AS VARCHAR), :id, l.sequence, COALESCE(NULLIF(l.description, ''), l.product_name), p.id, l.quantity, COALESCE(l.uom, p.uom), p.list_price, 0, 0, 0, 0, l.quantity, ROUND(CAST(l.quantity AS DECIMAL(18, 4)) * p.list_price, 2), 0, ROUND(CAST(l.quantity AS DECIMAL(18, 4)) * p.list_price, 2), ROUND(CAST(l.quantity AS DECIMAL(18, 4)) * p.list_price, 2) FROM sale_quotation_template_lines l JOIN sale_products p ON p.id = (SELECT p2.id FROM sale_products p2 WHERE p2.active = true AND p2.sale_ok = true AND (LOWER(p2.name) = LOWER(l.product_name) OR LOWER(regexp_replace(p2.name, 's$', '')) = LOWER(regexp_replace(l.product_name, 's$', ''))) ORDER BY p2.id LIMIT 1) WHERE l.template_id = :template_id ORDER BY l.sequence, l.id"
        - query: "UPDATE orders SET total_amount = (SELECT COALESCE(SUM(COALESCE(price_total, line_total)), 0) FROM order_lines WHERE order_id = :id), updated_at = CURRENT_TIMESTAMP WHERE id = :id"
        - query: "INSERT INTO system_activity(id, actor_id, actor_name, action, resource, resource_id, detail) VALUES(gen_random_uuid(), :current_user_id, :current_user_name, 'sales.quotation_templates.create_order', 'orders', :id, :order_number || ' from template ' || :template_name)"
      result: { query: "SELECT * FROM orders WHERE id = :id" }
    fields:
      - { field: order_number, label: Order Number, type: text, required: true }
      - { field: customer_name, label: Customer, type: async-select, options_source: template_order_customer_lookup, required: true }
      - { field: customer_expected_row_version, label: Customer version, type: hidden }
      - { field: customer_legal_name, label: Invoice Address, type: text }
      - { field: order_date, label: Quotation Date, type: date, required: true }
      - { field: validity_date, label: Expiration, type: date }
      - { field: pricelist_name, label: Pricelist, type: select, options_source: template_order_pricelist_lookup }
      - { field: payment_term_name, label: Payment Terms, type: select, options_source: template_order_payment_terms_lookup }
  - id: add_sale_quotation_template_line
    type: server_form
    permission: orders.write
    title: Add a product
    action: sales.quotation_templates.lines.create
    handler: yaml_mutation
    operation: create
    params: { template_id: '{state.id}' }
    refresh: [sale_quotation_template_lines]
    mutation:
      operation: insert
      table: sale_quotation_template_lines
      fields: [template_id, sequence, product_name, description, quantity, uom, optional, row_version]
      required: [product_name, quantity]
      defaults: { sequence: 20, description: '', quantity: 1, uom: Units, optional: false, row_version: 1 }
      generated: [id]
      before_steps: [{ query: "SELECT :template_id || '-line-' || regexp_replace(lower(trim(CAST(:product_name AS VARCHAR))), '[^a-z0-9]+', '-', 'g') AS id", assign: true }]
      guards:
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM sale_quotation_templates WHERE id = :template_id)", status: 404, code: SALES_QUOTATION_TEMPLATE_NOT_FOUND, message: Quotation template not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:product_name AS VARCHAR))) > 0 AND COALESCE(:quantity, 0) > 0", status: 422, code: SALES_QUOTATION_TEMPLATE_LINE_INVALID, message: Product and a positive quantity are required. }
      result: { query: "SELECT * FROM sale_quotation_template_lines WHERE id = :id" }
    fields:
      - { field: product_name, label: Product, type: text, required: true }
      - { field: description, label: Description, type: text }
      - { field: quantity, label: Quantity, type: number, required: true, min: 0.01 }
      - { field: uom, label: Unit, type: text }
      - { field: optional, label: Optional Product, type: checkbox }
  - id: delete_sale_quotation_template_line
    type: server
    permission: orders.write
    action: sales.quotation_templates.lines.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{row.id}' }
    refresh: [sale_quotation_template_lines]
    mutation: { operation: delete, table: sale_quotation_template_lines, concurrency: { required: true }, guards: [{ query: "SELECT id FROM sale_quotation_template_lines WHERE id = :id", status: 404, code: SALES_QUOTATION_TEMPLATE_LINE_NOT_FOUND, message: Template line not found. }] }
  - id: archive_sale_quotation_template
    type: server
    permission: orders.write
    action: sales.quotation_templates.archive
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    refresh: [sale_quotation_template_detail, sale_quotation_templates]
    mutation: { operation: update, table: sale_quotation_templates, fields: [active], defaults: { active: false }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM sale_quotation_templates WHERE id = :id AND active = true", status: 409, code: SALES_QUOTATION_TEMPLATE_ALREADY_ARCHIVED, message: Quotation template is already archived. }] }
  - id: restore_sale_quotation_template
    type: server
    permission: orders.write
    action: sales.quotation_templates.restore
    handler: yaml_mutation
    operation: update
    params: { id: '{state.id}' }
    refresh: [sale_quotation_template_detail, sale_quotation_templates]
    mutation: { operation: update, table: sale_quotation_templates, fields: [active], defaults: { active: true }, concurrency: { required: true }, guards: [{ query: "SELECT id FROM sale_quotation_templates WHERE id = :id AND active = false", status: 409, code: SALES_QUOTATION_TEMPLATE_ALREADY_ACTIVE, message: Quotation template is already active. }] }
