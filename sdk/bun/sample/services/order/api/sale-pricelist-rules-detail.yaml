page: { id: sale-pricelist-rules-detail }
datasources:
  - id: sale_pricelist_rule_detail
    single: true
    permission: orders.read
    mock_data: { default: { id: rule-public-001, pricelist_id: pricelist-public, pricelist_name: Public Pricelist, product_id: product-demo, product_name: Core3 Service, min_quantity: 1, fixed_price: 12500, discount: 0, currency: USD, active: true } }
    query: "SELECT * FROM sale_pricelist_items WHERE id = :id"
actions:
  - id: edit_sale_pricelist_rules
    type: server_form
    permission: orders.write
    title: Edit Pricelist rule
    action: sale_pricelist_rules.update
    handler: yaml_mutation
    operation: update
    refresh: [sale_pricelist_rule_detail]
    mutation:
      operation: update
      table: sale_pricelist_items
      key: id
      concurrency: false
      fields: [pricelist_id, product_id, min_quantity, fixed_price, percentage_discount, date_start, date_end]
      required: []
      result: { query: "SELECT * FROM sale_pricelist_items WHERE id = :id" }
    fields:
      - { field: pricelist_id, label: Pricelist, type: text }
      - { field: product_id, label: Product, type: text }
      - { field: min_quantity, label: Minimum quantity, type: number }
      - { field: fixed_price, label: Fixed price, type: number }
      - { field: percentage_discount, label: Discount (%), type: number }
      - { field: date_start, label: Start date, type: date }
      - { field: date_end, label: End date, type: date }
