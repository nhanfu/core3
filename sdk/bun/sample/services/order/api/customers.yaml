page: { id: customers }
datasources:
  - id: sales_customers
    single: false
    permission: orders.read
    query: |
      SELECT id, code, name, legal_name, owner_name, visibility, status, email, phone, street, city, country, vat, company_type
      FROM customers
      WHERE (:q IS NULL OR code ILIKE '%' || :q || '%' OR name ILIKE '%' || :q || '%')
        AND (:status IS NULL OR status = :status)
        AND (:view_scope = 'all' OR (:view_scope = 'branch' AND (visibility = 'Public' OR owner_name = :current_user_name)) OR (:view_scope = 'own' AND owner_name = :current_user_name))
      ORDER BY name
  - id: customer_statuses
    single: false
    permission: orders.read
    query: "SELECT value, label FROM (VALUES ('Active','Active'), ('Archived','Archived')) statuses(value, label)"
actions:
  - id: create_customer
    type: server_form
    permission: orders.write
    title: New customer
    action: sales.customers.create
    handler: yaml_mutation
    operation: create
    refresh: [sales_customers]
    mutation:
      operation: insert
      table: customers
      fields: [code, name, legal_name, owner_name, visibility, status, email, phone, street, city, country, vat, company_type]
      required: [code, name]
      defaults: { visibility: Public, status: Active, company_type: Company }
      guards:
        - query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM customers WHERE code = :code OR name = :name)"
          status: 409
          message: Customer code or name already exists
      result: { query: "SELECT * FROM customers WHERE id = :id" }
    fields:
      - { field: code, label: Customer code, type: text, required: true }
      - { field: name, label: Customer name, type: text, required: true }
      - { field: legal_name, label: Legal name, type: text }
      - { field: owner_name, label: Account owner, type: text }
      - { field: email, label: Email, type: text }
      - { field: phone, label: Phone, type: text }
      - { field: street, label: Street, type: text }
      - { field: city, label: City, type: text }
      - { field: country, label: Country, type: text }
      - { field: vat, label: Tax ID, type: text }
      - { field: company_type, label: Company type, type: select, options: [Company, Individual], default: Company }
      - { field: visibility, label: Visibility, type: select, options: [Public, Private], default: Public }
  - id: archive_customer
    type: server
    permission: orders.write
    action: sales.customers.archive
    handler: customer_status
    operation: archive
    params: { id: '{row.id}' }
    refresh: [sales_customers]
    mutation:
      guards:
        - query: "SELECT id FROM customers WHERE id = :id AND status = 'Active'"
          status: 409
          message: Customer is already archived
      steps:
        - query: "UPDATE customers SET status = 'Archived' WHERE id = :id"
      result: { query: "SELECT * FROM customers WHERE id = :id" }
