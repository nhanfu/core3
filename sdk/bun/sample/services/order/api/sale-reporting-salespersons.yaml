title: Sales Analysis By Salespersons
page: { id: sale-reporting-salespersons }

datasources:
  - id: sale_report_salespersons
    single: false
    permission: orders.read
    pivot:
      fields: [salesperson_name, order_count, quantity_ordered, total_revenue]
    error_states:
      transport_error: { status: 503, code: SALES_SALESPERSON_REPORT_UNAVAILABLE, message: Salesperson sales analysis is temporarily unavailable. }
    query: |
      SELECT
        COALESCE(o.salesperson_name, o.created_by) AS salesperson_name,
        COUNT(DISTINCT o.id) AS order_count,
        CAST(COALESCE(SUM(ol.quantity), 0) AS DOUBLE) AS quantity_ordered,
        CAST(COALESCE(SUM(COALESCE(ol.line_total, 0)), 0) AS DOUBLE) AS total_revenue,
        printf('$%,.2f', CAST(COALESCE(SUM(COALESCE(ol.line_total, 0)), 0) AS DOUBLE)) AS total_revenue_display,
        CAST(COALESCE(AVG(o.total_amount), 0) AS DOUBLE) AS avg_order_value,
        printf('$%,.2f', CAST(COALESCE(AVG(o.total_amount), 0) AS DOUBLE)) AS avg_order_value_display
      FROM orders o
      LEFT JOIN order_lines ol ON ol.order_id = o.id
      WHERE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) IN ('Approved', 'Pending Approval')
        AND (:fixture_state IS NULL OR :fixture_state <> 'empty')
        AND (:q IS NULL OR COALESCE(o.salesperson_name, o.created_by) ILIKE '%' || :q || '%')
        AND (:from_date IS NULL OR o.order_date >= CAST(:from_date AS DATE))
        AND (:to_date IS NULL OR o.order_date <= CAST(:to_date AS DATE))
      GROUP BY COALESCE(o.salesperson_name, o.created_by)
      ORDER BY total_revenue DESC, salesperson_name
