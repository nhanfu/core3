database:
  driver: ${CORE3_ORDER_DB_DRIVER:-postgres}
  credentials:
    url: ${CORE3_ORDER_DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:55433/core3}
    url_env: CORE3_ORDER_DATABASE_URL
  encryption:
    enabled: ${CORE3_ORDER_DB_ENCRYPTION:-false}
    key_env: CORE3_ORDER_DB_ENCRYPTION_KEY
    key_id: ${CORE3_ORDER_DB_ENCRYPTION_KEY_ID:-order-db-key-v1}
    cipher: ${CORE3_ORDER_DB_ENCRYPTION_CIPHER:-GCM}

files:
  driver: local
  path: ${ORDER_UPLOAD_ROOT:-.data/uploads}
  credentials: {}
  s3:
    driver: s3
    endpoint: ${ORDER_S3_ENDPOINT:-}
    region: ${ORDER_S3_REGION:-}
    bucket: ${ORDER_S3_BUCKET:-}
    credentials:
      access_key_id: ${ORDER_S3_ACCESS_KEY_ID:-}
      secret_access_key: ${ORDER_S3_SECRET_ACCESS_KEY:-}

attachments:
  order_attachment:
    download:
      route: /api/orders/attachments
      permission: orders.attachment.download
      query: SELECT * FROM order_attachments WHERE id = :attachment_id
      scope: { table: orders, field: branch_id }
