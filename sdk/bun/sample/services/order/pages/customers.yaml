title: Customers
page: { id: customers, breadcrumb: [Sales, Customers], auth: { require: [orders.read] } }
components:
  - type: ListView
    variant: odoo
    source: sales_customers
    create_action: create_customer
    create_label: New customer
    search: { label: Search customers, placeholder: Search by customer code or name... }
    filters: [{ field: status, label: Status, options_source: customer_statuses }]
    columns:
      - { field: code, label: Code }
      - { field: name, label: Customer, type: PrimaryEntityCell }
      - { field: legal_name, label: Legal name }
      - { field: owner_name, label: Owner }
      - { field: email, label: Email }
      - { field: phone, label: Phone }
      - { field: city, label: City }
      - { field: vat, label: Tax ID }
      - { field: visibility, label: Visibility }
      - { field: status, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    form_view: { page: apps/services/order/pages/customer-detail.yaml, side_panel: true }
    actions:
      - { id: archive_customer, label: Archive, permission: orders.write, variant: danger, show_if: "row.status === 'Active'" }
