title: Salespersons
page: { id: sale-reporting-salespersons, route: /order/reporting/salespersons, breadcrumb: [Sales, Reporting, Salespersons], auth: { require: [orders.read] } }
datasources:
  - id: sale_report_salespersons
    single: false
    permission: orders.read
    query: |
      SELECT
        COALESCE(o.salesperson_name, o.created_by) AS salesperson_name,
        COUNT(DISTINCT o.id) AS order_count,
        CAST(SUM(o.total_amount) AS DOUBLE) AS total_amount,
        printf('$%,.2f', CAST(SUM(o.total_amount) AS DOUBLE)) AS total_amount_display,
        CAST(AVG(o.total_amount) AS DOUBLE) AS avg_order_value,
        printf('$%,.2f', CAST(AVG(o.total_amount) AS DOUBLE)) AS avg_order_value_display
      FROM orders o
      WHERE COALESCE((SELECT s.status FROM order_workflow_states s WHERE s.order_id = o.id), o.status) IN ('Approved', 'Pending Approval')
      GROUP BY COALESCE(o.salesperson_name, o.created_by)
      ORDER BY total_amount DESC
components:
  - type: ListView
    variant: odoo
    source: sale_report_salespersons
    view_navigation: tabs
    views:
      - id: graph
        label: Graph
        icon: graph
        category_field: salesperson_name
        measure_field: total_amount
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields:
            - { field: salesperson_name, column: Salesperson }
            - { field: order_count, column: Orders }
            - { field: total_amount, column: Revenue }
          default:
            rows: [salesperson_name]
            measures:
              - { field: total_amount, aggregate: sum, column: Revenue }
              - { field: order_count, aggregate: sum, column: Orders }
      - { id: list, label: List, icon: table }
    columns:
      - { field: salesperson_name, label: Salesperson, type: PrimaryEntityCell }
      - { field: order_count, label: Orders, align: right }
      - { field: total_amount_display, label: Revenue, align: right }
      - { field: avg_order_value_display, label: Avg. order, align: right }
    page_size: 50
    row_key: salesperson_name
    empty_state:
      title: No data
      description: No confirmed orders found for this period.
