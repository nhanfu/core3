title: Sales Analysis By Salespersons
page: { id: sale-reporting-salespersons, route: /order/reporting/salespersons, breadcrumb: [Sales, Reporting, Sales Analysis By Salespersons], auth: { require: [orders.read] } }

components:
  - type: ListView
    variant: odoo
    source: sale_report_salespersons
    search: { label: Search salespersons, placeholder: Search salespersons... }
    date_range:
      label: Order Date
      from_field: from_date
      to_field: to_date
      default_preset: last_12_months
      presets: [last_12_months, year, quarter, month]
      preset_labels: { last_12_months: Last 365 Days, year: This Year, quarter: This Quarter, month: This Month }
    group_by:
      - { field: salesperson_name, label: Salesperson }
    default_group_by: salesperson_name
    views:
      - id: graph
        label: Graph
        icon: graph
        type: bar
        category_field: salesperson_name
        measure_field: quantity_ordered
        measure_label: Qty Ordered
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields:
            - { field: salesperson_name, column: Salesperson }
            - { field: order_count, column: Orders }
            - { field: quantity_ordered, column: Qty Ordered }
            - { field: total_revenue, column: Total }
          default:
            rows: [salesperson_name]
            measures:
              - { field: quantity_ordered, aggregate: sum, column: Qty Ordered }
              - { field: total_revenue, aggregate: sum, column: Total }
              - { field: order_count, aggregate: sum, column: Orders }
    columns:
      - { field: salesperson_name, label: Salesperson, type: PrimaryEntityCell }
      - { field: order_count, label: Orders, align: right }
      - { field: quantity_ordered, label: Qty Ordered, align: right }
      - { field: total_revenue_display, label: Total, align: right }
      - { field: avg_order_value_display, label: Average Order, align: right }
    page_size: 80
    row_key: salesperson_name
    empty_state:
      title: No sales data
      description: No confirmed orders match the selected salesperson or date filters.
