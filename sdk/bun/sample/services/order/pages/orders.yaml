title: Orders

page:
  id: orders
  breadcrumb: [Management, Orders]
  auth:
    require: [orders.read]

components:
  - type: ListView
    variant: odoo
    scroll: body
    source: orders
    create_action: add_order
    create_label: New
    search:
      label: Search orders
      placeholder: 'Search order number, customer, item name...'
    date_range:
      label: Order date
      from_field: from_date
      to_field: to_date
      from_label: From date
      to_label: To date
      presets: [today, week, month, quarter, year, last_12_months]
      default_preset: last_12_months
      max_years: 2
      deny_unbounded: true
      apply_label: Apply
      calendar_previous_label: Previous date picker month
      calendar_next_label: Next date picker month
      weekday_labels: [Mo, Tu, We, Th, Fr, Sa, Su]
      validation_messages:
        required: A bounded date range is required.
        invalid: Enter valid dates in YYYY-MM-DD format.
        start_before_end: The start date must be before the end date.
        max_years: The date range cannot be longer than {max_years} years.
      preset_labels:
        today: Today
        week: This week
        month: This month
        quarter: This quarter
        year: This year
        last_12_months: Last 12 months
    filters:
      - field: status
        label: Status
        placeholder: All statuses
        options:
          - { id: Draft, label: Draft }
          - { id: Pending Approval, label: Pending approval }
          - { id: Approved, label: Approved }
          - { id: Cancelled, label: Cancelled }
      - field: shipment_type
        label: Shipment type
        placeholder: All shipment types
        options_source: order_shipment_type_lookup
      - field: transport_method
        label: Transport method
        placeholder: All transport methods
        options: [Road, Sea, Rail, Air]
    group_by:
      - { field: status_label, label: Status }
      - { field: shipment_type, label: Shipment type }
      - { field: transport_method, label: Transport method }
    favorites:
      - { id: draft_orders, label: Draft orders, filters: { status: Draft }, group_by: status_label }
      - { id: approved_orders, label: Approved orders, filters: { status: Approved }, group_by: status_label }
    actions:
      - { id: orders.export, label: Export, title: Export, icon: download }
    view_navigation: tabs
    labels:
      new: New
      filters: Filters
      columns: Columns
      selected: selected
      clear_selection: Clear selection
      remove_filter: Remove filter
      previous_page: Previous page
      next_page: Next page
      select_all: Select all rows
      select_row: Select row
      search_facet: Search
      apply: Apply
      more_actions: More actions
    views:
      - { id: list, label: List, icon: table }
      - id: card
        label: Cards
        icon: grid
        group_by: status
        groups_source: order_statuses
        card:
          title: order_number
          subtitle: customer_name
          fields:
            - { field: status, label: Status }
            - { field: order_date, label: Order date }
            - { field: total_amount_display, label: Total }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: status
        groups_source: order_statuses
        card:
          title: order_number
          subtitle: customer_name
          fields:
            - { field: order_date, label: Order date }
            - { field: shipment_type, label: Shipment type }
            - { field: route, label: Route }
            - { field: total_amount_display, label: Total }
      - id: calendar
        label: Calendar
        icon: calendar
        date_field: order_date
        card:
          title: order_number
          subtitle: customer_name
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields:
            - { field: status_label, column: Status }
            - { field: transport_method, column: Transport method }
            - { field: shipment_type, column: Shipment type }
            - { field: order_date, column: Order date, type: date }
            - { field: customer_name, column: Customer }
            - { field: route, column: Route }
            - { field: trip_count, column: Trip count }
            - { field: total_amount, column: Total amount }
            - { field: created_by, column: Created by }
          default:
            rows: [status_label]
            columns: [transport_method]
            measures:
              - { field: total_amount, aggregate: sum, column: Amount }
          date_ranges: { order_date: month }
      - id: graph
        label: Graph
        icon: graph
        category_field: status_label
        measure_field: total_amount
      - id: map
        label: Map
        icon: map
        label_field: order_number
        subtitle_field: route
    page_size: 50
    column_chooser: true
    row_key: id
    selectable: true
    row_open_action: view_order
    row_double_click_action: view_order
    form_view: { page: apps/services/order/pages/order-detail.yaml, side_panel: true }
    row_actions: menu
    empty_state:
      title: No orders
      description: Try changing the filters or create a new order.
    columns:
      - { field: order_number, label: Order number, type: PrimaryEntityCell, sortable: true }
      - { field: customer_name, label: Customer }
      - { field: order_date, label: Order date, sortable: true }
      - field: status_label
        label: Status
        type: StatusChip
        colors:
          Nháp: neutral
          Đang duyệt: amber
          Đã duyệt: green
          Đã hủy: red
      - { field: shipment_type, label: Shipment type }
      - { field: route, label: Route }
      - { field: transport_method, label: Transport method, optional: hide }
      - { field: trip_count, label: Trip count, align: right, optional: hide }
      - { field: total_amount_display, label: Total amount, align: right }
      - { field: created_by, label: Created by, optional: hide }
      - { field: created_at, label: Created at, optional: hide }
      - field: actions
        label: ''
        sortable: false
        align: right
        actions:
          - { id: view_order, label: Details, variant: secondary, permission: orders.read }
          - { id: edit_order, label: Edit, variant: ghost, permission: orders.write, show_if: "row.status === 'Draft'" }
          - { id: submit_order, label: Submit for approval, variant: primary, permission: orders.write, show_if: "row.status === 'Draft'" }
          - { id: approve_order, label: Approve, variant: primary, permission: orders.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: reject_order, label: Reject, variant: ghost, permission: orders.approve, show_if: "row.status === 'Pending Approval'" }
          - { id: cancel_order, label: Cancel, variant: danger, permission: orders.write, show_if: "row.status !== 'Cancelled'" }
          - { id: delete_order, label: Delete, variant: danger, permission: orders.write, show_if: "row.status === 'Draft'" }

actions:
  - id: view_order
    type: navigate
    permission: orders.read
    navigate_to: /order/detail
    params: { id: '{row.id}' }
