title: Products
page: { id: sale-products, breadcrumb: [Sales, Products], auth: { require: [orders.read] } }
components:
  - type: ListView
    variant: odoo
    source: sale_products
    create_action: create_sale_product
    create_label: New product
    search: { label: Search products, placeholder: Search products by name or internal reference... }
    filters: [{ field: active, label: Status, options_source: sale_product_active }]
    columns:
      - { field: default_code, label: Internal reference }
      - { field: name, label: Product, type: PrimaryEntityCell }
      - { field: product_type, label: Product type }
      - { field: category, label: Category }
      - { field: list_price, label: Sales price, align: right }
      - { field: uom, label: Unit of Measure }
      - { field: sale_ok, label: Can be sold }
      - { field: active, label: Active, type: StatusChip }
    page_size: 50
    row_key: id
    row_double_click_action: view_sale_product
    selectable: true
    row_actions: menu
    actions:
      - { id: archive_sale_product, label: Archive, permission: orders.write, variant: danger, show_if: "row.active === true" }
    form_view: { page: apps/services/order/pages/sale-products-detail.yaml, side_panel: true }
