title: Quotations
page: { id: sale-quotations, breadcrumb: [Sales, Quotations], auth: { require: [orders.read] } }
components:
  - type: ListView
    variant: odoo
    source: sale_quotations
    create_action: create_quotation
    create_label: New quotation
    search: { label: Search quotations, placeholder: Search quotations and customers... }
    row_open_action: view_quotation
    row_double_click_action: view_quotation
    form_view: { page: apps/services/order/pages/order-detail.yaml, side_panel: true }
    columns:
      - { field: order_number, label: Quotation, type: PrimaryEntityCell }
      - { field: customer_name, label: Customer }
      - { field: opportunity_id, label: CRM opportunity }
      - { field: order_date, label: Quotation date }
      - { field: validity_date, label: Expiration }
      - { field: status, label: Status, type: StatusChip }
      - { field: pricelist_name, label: Pricelist }
      - { field: total_amount, label: Total, align: right }
      - { field: invoice_status, label: Invoice status }
    page_size: 50
    row_key: id
    selectable: true
    row_actions: menu
