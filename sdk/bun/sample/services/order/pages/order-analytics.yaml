title: Order analytics
page:
  id: order-analytics
  breadcrumb: [Management, Orders, Analytics]
  auth:
    require: [orders.read]
components:
  - type: StatRow
    source: order_totals
    title: This period
    stats:
      - label: Total orders
        field: order_count
      - label: Total revenue
        field: total_revenue_display
      - label: Average order value
        field: avg_order_value_display
  - type: Chart
    source: order_status_breakdown
    title: Orders by status
    label_field: status_label
    value_field: order_count
    variant: bar
