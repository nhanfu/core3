page: { id: blog }
datasources:
  - id: blog_blogs
    permission: blog.read
    error_states:
      unauthorized: { status: 401, code: BLOG_BLOGS_UNAUTHORIZED, message: Sign in to view blogs. }
      forbidden: { status: 403, code: BLOG_BLOGS_FORBIDDEN, message: You do not have permission to view blogs. }
      transport_error: { status: 503, code: BLOG_BLOGS_UNAVAILABLE, message: Blogs are temporarily unavailable. }
    query: "SELECT b.id, b.row_version, b.name, b.subtitle, b.active, b.sequence, (SELECT COUNT(*) FROM blog_posts p WHERE p.blog_id = b.id) AS post_count FROM blog_blogs b WHERE (:q IS NULL OR b.name ILIKE '%' || :q || '%' OR b.subtitle ILIKE '%' || :q || '%') ORDER BY b.sequence, b.name, b.id"
  - id: blog_detail
    single: true
    permission: blog.read
    error_states:
      unauthorized: { status: 401, code: BLOG_DETAIL_UNAUTHORIZED, message: Sign in to view this blog. }
      forbidden: { status: 403, code: BLOG_DETAIL_FORBIDDEN, message: You do not have permission to view this blog. }
      missing_record: { status: 404, code: BLOG_NOT_FOUND, message: Blog not found. }
      transport_error: { status: 503, code: BLOG_DETAIL_UNAVAILABLE, message: This blog is temporarily unavailable. }
    query: "SELECT id, row_version, name, subtitle, active, sequence FROM blog_blogs WHERE id = :id"
actions:
  - id: create_blog
    type: server_form
    permission: blog.write
    title: New blog
    action: blog.blogs.create
    handler: yaml_mutation
    operation: create
    refresh: [blog_blogs]
    mutation:
      operation: insert
      table: blog_blogs
      fields: [name, subtitle]
      required: [name]
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: BLOG_NAME_REQUIRED, message: A blog name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM blog_blogs WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))))", status: 409, code: BLOG_EXISTS, message: A blog with this name already exists. }
      result: { query: "SELECT * FROM blog_blogs WHERE id = :id" }
    fields:
      - { field: name, label: Blog Name, type: text, required: true }
      - { field: subtitle, label: Blog Subtitle, type: text }
  - id: edit_blog
    type: server_form
    permission: blog.write
    title: Edit blog
    action: blog.blogs.update
    handler: yaml_mutation
    operation: update
    params: { id: '{row.id}' }
    prefill: row
    refresh: [blog_blogs, blog_detail]
    mutation:
      operation: update
      table: blog_blogs
      fields: [name, subtitle]
      required: [name]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM blog_blogs WHERE id = :id", status: 404, code: BLOG_NOT_FOUND, message: Blog not found. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0", status: 422, code: BLOG_NAME_REQUIRED, message: A blog name is required. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM blog_blogs WHERE LOWER(name) = LOWER(TRIM(CAST(:name AS VARCHAR))) AND id <> :id)", status: 409, code: BLOG_EXISTS, message: A blog with this name already exists. }
      result: { query: "SELECT * FROM blog_blogs WHERE id = :id" }
    fields:
      - { field: name, label: Blog Name, type: text, required: true }
      - { field: subtitle, label: Blog Subtitle, type: text }
