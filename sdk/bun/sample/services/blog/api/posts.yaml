page: { id: blog-posts }
datasources:
  - id: blog_post_states
    permission: blog.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Published','Published'), ('Archived','Archived')) states(value, label)"
  - id: blog_post_active_states
    permission: blog.read
    single: false
    query: "SELECT value, label FROM (VALUES ('active','Active'), ('archived','Archived')) states(value, label)"
  - id: blog_lookup
    permission: blog.read
    single: false
    query: "SELECT id AS value, name AS label FROM blog_blogs WHERE active AND (COALESCE(:current_company_name, :company_name, '') = '' OR company_name = COALESCE(:current_company_name, :company_name)) ORDER BY name"
  - id: blog_posts
    permission: blog.read
    workflow: blog_posts
    error_states:
      unauthorized: { status: 401, code: BLOG_POSTS_UNAUTHORIZED, message: Sign in to view blog posts. }
      forbidden: { status: 403, code: BLOG_POSTS_FORBIDDEN, message: You do not have permission to view blog posts. }
      transport_error: { status: 503, code: BLOG_POSTS_UNAVAILABLE, message: Blog posts are temporarily unavailable. }
    query: "SELECT p.id, p.row_version, p.blog_id, p.blog_name, p.company_name, p.name, p.subtitle, p.author_name, COALESCE((SELECT string_agg(t.name, ', ' ORDER BY t.name, t.id) FROM blog_post_tags r JOIN blog_tags t ON t.id = r.tag_id WHERE r.post_id = p.id), p.tags) AS tags, p.visits, '/blog/post?id=' || p.id AS website_url, CAST(published_date AS VARCHAR) AS published_date, CAST(COALESCE(p.published_date, p.created_at) AS VARCHAR) AS post_date, CASE WHEN p.state = 'Published' THEN TRUE ELSE FALSE END AS is_published, CASE WHEN p.state = 'Published' THEN 'Published' ELSE 'Not Published' END AS publication_status, p.active, p.state FROM blog_posts p WHERE (COALESCE(:current_company_name, :company_name, '') = '' OR p.company_name = COALESCE(:current_company_name, :company_name)) AND ((CAST(:active AS VARCHAR) IS NULL AND p.active = TRUE) OR CAST(:active AS VARCHAR) = 'active' AND p.active = TRUE OR CAST(:active AS VARCHAR) = 'archived' AND p.active = FALSE) AND (:q IS NULL OR p.name ILIKE '%' || :q || '%' OR p.subtitle ILIKE '%' || :q || '%' OR COALESCE((SELECT string_agg(t.name, ', ' ORDER BY t.name, t.id) FROM blog_post_tags r JOIN blog_tags t ON t.id = r.tag_id WHERE r.post_id = p.id), p.tags) ILIKE '%' || :q || '%') AND (:state IS NULL OR p.state = :state) ORDER BY p.published_date NULLS LAST, p.created_at DESC"
actions:
  - id: import_blog_posts
    type: server_form
    permission: blog.write
    title: Import blog posts
    action: blog.posts.import
    handler: yaml_mutation
    operation: create
    submit_label: Import
    refresh: [blog_posts]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:post_list AS VARCHAR))) > 0", status: 422, code: BLOG_POST_IMPORT_REQUIRED, message: Add at least one post row. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM (SELECT trim(unnest(string_split(CAST(:post_list AS VARCHAR), chr(10)))) AS line) lines WHERE line <> '' AND NOT regexp_matches(line, '^[^|]+\\|[^|]+\\|[^|]+\\|[^|]+$'))", status: 422, code: BLOG_POST_IMPORT_INVALID, message: Each row must use Title|Subtitle|Author|Tags format. }
      steps:
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(CAST(:post_list AS VARCHAR), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS name, trim(split_part(line, '|', 2)) AS subtitle, trim(split_part(line, '|', 3)) AS author_name, trim(split_part(line, '|', 4)) AS tags FROM lines WHERE line <> '') INSERT INTO blog_posts(id, row_version, blog_id, blog_name, company_name, name, subtitle, author_name, tags, active, state) SELECT 'blog-post-import-' || regexp_replace(lower(name), '[^a-z0-9]+', '-', 'g'), 1, 'blog-demo-001', 'Core3 Engineering', COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'), name, subtitle, author_name, tags, TRUE, 'Draft' FROM parsed ON CONFLICT (id) DO UPDATE SET subtitle = EXCLUDED.subtitle, author_name = EXCLUDED.author_name, tags = EXCLUDED.tags, active = TRUE, state = 'Draft', company_name = EXCLUDED.company_name, updated_at = TIMESTAMP '2026-09-13 10:00:00'" }
      result: { query: "SELECT COUNT(*) AS imported FROM blog_posts WHERE id LIKE 'blog-post-import-%'" }
    fields: [{ field: post_list, label: Post List, type: textarea, required: true, placeholder: 'Title|Subtitle|Author|tag' }]
  - id: create_blog_post
    type: server_form
    permission: blog.write
    title: New blog post
    action: blog.posts.create
    handler: yaml_mutation
    operation: create
    refresh: [blog_posts]
    mutation:
      operation: insert
      table: blog_posts
      fields: [blog_id, blog_name, company_name, name, subtitle, author_name, teaser, content_html, tags, active]
      required: [blog_id, blog_name, name]
      defaults: { active: true }
      guards:
        - { query: "SELECT 1 AS ok FROM blog_blogs WHERE id = :blog_id AND active AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 403, code: BLOG_COMPANY_SCOPE_REQUIRED, message: The blog belongs to another company. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:current_company_name, '') = '' OR COALESCE(:company_name, :current_company_name) = :current_company_name", status: 403, code: BLOG_COMPANY_SCOPE_REQUIRED, message: A post must belong to the current company. }
      result: { query: "SELECT * FROM blog_posts WHERE id = :id" }
    fields:
      - { field: blog_id, label: Blog, type: select, options_source: blog_lookup, required: true }
      - { field: blog_name, label: Blog name, type: text, required: true }
      - { field: company_name, label: Company, type: text }
      - { field: name, label: Title, type: text, required: true }
      - { field: subtitle, label: Subtitle, type: text }
      - { field: author_name, label: Author, type: text }
      - { field: teaser, label: Teaser, type: textarea }
      - { field: content_html, label: Content, type: textarea }
      - { field: tags, label: Tags, type: text }
  - id: view_blog_post
    type: navigate
    permission: blog.read
    navigate_to: /blog-post-detail
    params: { id: '{row.id}' }
  - id: open_blog_post_website
    type: client
    permission: blog.read
    script: |
      // js
      async ({ row }) => {
        const url = String(row?.website_url || '').trim();
        if (!url) throw new Error('This blog post does not have a website URL.');
        window.location.assign(url);
      }
  - { id: publish_blog_post, type: server, permission: blog.write, action: blog.posts.publish, handler: order_transition, workflow: blog_posts, operation: publish, refresh: [blog_posts] }
  - { id: unpublish_blog_post, type: server, permission: blog.write, action: blog.posts.unpublish, handler: order_transition, workflow: blog_posts, operation: unpublish, refresh: [blog_posts] }
  - { id: archive_blog_post, type: server, permission: blog.manage, action: blog.posts.archive, handler: order_transition, workflow: blog_posts, operation: archive, refresh: [blog_posts] }
  - { id: unarchive_blog_post, type: server, permission: blog.manage, action: blog.posts.unarchive, handler: order_transition, workflow: blog_posts, operation: unarchive, refresh: [blog_posts] }
