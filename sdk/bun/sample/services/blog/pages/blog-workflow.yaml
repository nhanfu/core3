workflow:
  id: blog_posts
  entity: blog_posts
  handler: order_transition
  initial: Draft
  permission: blog.write
  mutable: true
  status_source: blog_post_states
  states:
    - { id: Draft, label: Draft, color: neutral }
    - { id: Published, label: Published, color: green }
    - { id: Archived, label: Archived, color: red }
  transitions:
    - id: publish
      from: [Draft]
      to: Published
      permission: blog.write
      mutation:
        guards: [{ query: "SELECT id FROM blog_posts WHERE id = :id AND state = 'Draft' AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: BLOG_POST_SCOPE_REQUIRED, message: Only a current-company draft blog post can be published }]
        steps: [{ query: "UPDATE blog_posts SET state = 'Published', published_date = COALESCE(published_date, CURRENT_TIMESTAMP), row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM blog_posts WHERE id = :id" }
    - id: unpublish
      from: [Published]
      to: Draft
      permission: blog.write
      mutation:
        guards: [{ query: "SELECT id FROM blog_posts WHERE id = :id AND state = 'Published' AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: BLOG_POST_SCOPE_REQUIRED, message: Only a current-company published blog post can be unpublished }]
        steps: [{ query: "UPDATE blog_posts SET state = 'Draft', row_version = row_version + 1 WHERE id = :id" }]
        result: { query: "SELECT * FROM blog_posts WHERE id = :id" }
    - id: archive
      from: [Draft, Published]
      to: Archived
      permission: blog.manage
      mutation:
        guards: [{ query: "SELECT id FROM blog_posts WHERE id = :id AND state IN ('Draft', 'Published') AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: BLOG_POST_SCOPE_REQUIRED, message: Only a current-company blog post can be archived }]
        steps: [{ query: "UPDATE blog_posts SET active = FALSE, state = 'Archived', published_date = NULL, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id" }]
        result: { query: "SELECT * FROM blog_posts WHERE id = :id" }
    - id: unarchive
      from: [Archived]
      to: Draft
      permission: blog.manage
      mutation:
        guards: [{ query: "SELECT id FROM blog_posts WHERE id = :id AND state = 'Archived' AND active = FALSE AND (COALESCE(:current_company_name, '') = '' OR company_name = :current_company_name)", status: 409, code: BLOG_POST_SCOPE_REQUIRED, message: Only a current-company archived blog post can be unarchived }]
        steps: [{ query: "UPDATE blog_posts SET active = TRUE, state = 'Draft', row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id" }]
        result: { query: "SELECT * FROM blog_posts WHERE id = :id" }
