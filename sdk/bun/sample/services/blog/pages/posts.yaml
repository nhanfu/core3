title: Blog Posts
page: { id: blog-posts, breadcrumb: [Website, Blog, Posts], auth: { require: [blog.read] } }
components:
  - type: ListView
    variant: odoo
    source: blog_posts
    create_action: create_blog_post
    create_label: New blog post
    search: { label: Search blog posts, placeholder: 'Search title, subtitle, or tag...' }
    default_filters: { active: active }
    filters:
      - { field: active, label: Records, options_source: blog_post_active_states }
      - { field: state, label: Status, options_source: blog_post_states }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: true
        group_by: ''
        card:
          title: name
          subtitle: blog_name
          fields:
            - { field: post_date, label: Post date }
            - { field: author_name, label: Author }
          footer:
            - { field: publication_status, label: '' }
    columns:
      - { field: name, label: Post, type: PrimaryEntityCell, secondary: subtitle }
      - { field: blog_name, label: Blog }
      - { field: author_name, label: Author }
      - { field: tags, label: Tags }
      - { field: visits, label: Views, align: right }
      - { field: published_date, label: Published on }
      - { field: active, label: Active, type: StatusChip, optional: hide }
      - { field: state, label: Status, type: StatusChip }
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: view_blog_post
    header_actions: [{ id: import_blog_posts, label: Import, permission: blog.write, variant: secondary }]
    actions:
      - { id: blog_posts.export, label: Export, title: Export, icon: download }
      - { id: publish_blog_post, label: Publish, permission: blog.write, variant: primary, show_if: "row.state === 'Draft'" }
      - { id: unpublish_blog_post, label: Unpublish, permission: blog.write, variant: secondary, show_if: "row.state === 'Published'" }
      - { id: archive_blog_post, label: Archive, permission: blog.manage, variant: danger, show_if: "row.active === true" }
      - { id: unarchive_blog_post, label: Unarchive, permission: blog.manage, variant: secondary, show_if: "row.active === false" }
