title: Blog Post
page: { id: blog-post-detail, breadcrumb: [Website, Blog, Post], auth: { require: [blog.read] } }
components:
  - type: OdooFormView
    source: blog_post_detail
    attachment_source: blog_post_attachments
    attachment_upload_action: upload_blog_post_attachment
    title_field: name
    header_actions:
      - { id: back_to_blog_posts, label: Back, variant: secondary }
      - { id: open_blog_post_website, label: Open website, variant: secondary, permission: blog.read }
      - { id: update_blog_post_seo, label: Edit SEO Metadata, variant: secondary, permission: blog.write }
      - { id: edit_blog_post_detail, label: Edit, variant: primary, permission: blog.write }
      - { id: print_blog_post, label: Print, variant: secondary, permission: blog.read }
    fields:
      - { field: name, label: Title }
      - { field: subtitle, label: Subtitle }
      - { field: blog_name, label: Blog }
      - { field: author_name, label: Author }
      - { field: teaser, label: Teaser }
      - { field: content_html, label: Content, type: textarea }
      - { field: tags, label: Tags }
      - { field: visits, label: Views }
      - { field: published_date, label: Publishing date, type: datetime }
      - { field: is_seo_optimized, label: SEO Optimized, type: StatusChip }
      - { field: state, label: Status, type: StatusChip }
    groups:
      - { title: SEO Metadata, columns: 2, fields: [{ field: website_meta_title, label: Website Meta Title }, { field: website_meta_description, label: Website Meta Description, wide: true }, { field: website_meta_keywords, label: Website Meta Keywords }, { field: website_meta_og_img, label: Website OpenGraph Image }, { field: is_seo_optimized, label: SEO Optimized, type: StatusChip }] }
  - type: LineItemGrid
    mount_in: previous-panel
    source: blog_post_tags
    parent_source: blog_post_detail
    title: Tags
    description: Assign the taxonomy tags used by this blog post.
    variant: odoo_x2many
    page_size: 50
    row_key: id
    actions:
      - { id: add_blog_post_tag, label: Add a tag, variant: primary, permission: blog.write }
    empty_state: { title: No tags, description: Add a tag to classify this blog post. }
    children:
      - { type: LineItemField, id: name, field: name, label: Tag, readonly: true }
      - { type: LineItemField, id: category, field: category, label: Category, readonly: true }
      - type: LineItemActions
        id: blog_post_tag_actions
        actions:
          - { id: remove_blog_post_tag, label: Remove, icon: trash, variant: danger, permission: blog.write }
    columns:
      - { field: name, label: Tag, type: PrimaryEntityCell }
      - { field: category, label: Category }
      - field: actions
        label: ''
        sortable: false
        width: 84
        actions:
          - { id: remove_blog_post_tag, label: Remove, icon: trash, variant: danger, permission: blog.write }
