title: Blog Tags
page: { id: blog-tags, breadcrumb: [Website, Blog, Tags], auth: { require: [blog.read] } }
datasources:
  - id: blog_tags
    permission: blog.read
    query: "SELECT t.id, t.row_version, t.name, t.category, t.color, (SELECT COUNT(*) FROM blog_posts p WHERE p.tags ILIKE '%' || t.name || '%') AS post_count FROM blog_tags t WHERE (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.category ILIKE '%' || :q || '%') ORDER BY t.name"
components:
  - type: ListView
    variant: odoo
    source: blog_tags
    create_action: create_blog_tag
    create_label: New tag
    search: { label: Search tags, placeholder: 'Search tag or category...' }
    columns:
      - { field: name, label: Tag, type: PrimaryEntityCell }
      - { field: category, label: Category }
      - { field: post_count, label: Posts, align: right }
      - { field: color, label: Color, align: right }
    page_size: 50
    row_key: id
actions:
  - id: create_blog_tag
    type: server_form
    permission: blog.write
    title: New tag
    action: blog.tags.create
    handler: yaml_mutation
    operation: create
    refresh: [blog_tags]
    mutation:
      operation: insert
      table: blog_tags
      fields: [name, category, color]
      required: [name]
      result: { query: "SELECT * FROM blog_tags WHERE id = :id" }
    fields:
      - { field: name, label: Tag name, type: text, required: true }
      - { field: category, label: Category, type: text }
      - { field: color, label: Color, type: number }
