title: Blog Tags
page: { id: blog-tags, route: /blog-tags, breadcrumb: [Website, Configuration, Blog, Tags], auth: { require: [blog.read] } }
components:
  - type: ListView
    variant: odoo
    source: blog_tags
    create_action: create_blog_tag
    create_label: New tag
    search: { label: Search tags, placeholder: 'Search tag or category...' }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - { id: form, label: Form, icon: edit }
    form_view: { page: apps/services/blog/pages/tag-detail.yaml, side_panel: true }
    columns:
      - { field: name, label: Tag, type: PrimaryEntityCell }
      - { field: category, label: Category }
      - { field: post_count, label: Posts, align: right }
      - { field: color, label: Color, align: right }
      - { field: id, label: '', sortable: false, actions: [{ id: edit_blog_tag, label: Edit, icon: edit }, { id: delete_blog_tag, label: Delete, icon: trash, variant: danger }] }
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: edit_blog_tag
