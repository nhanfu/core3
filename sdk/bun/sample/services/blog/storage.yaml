database:
  driver: duckdb
files:
  driver: local
  path: .data/uploads
attachments:
  blog_post_attachment:
    download:
      route: /api/blog/post-attachments
      permission: blog.read
      query: SELECT a.* FROM blog_post_attachments a JOIN blog_posts p ON p.id = a.post_id WHERE a.id = :attachment_id AND (COALESCE(:current_company_name, '') = '' OR p.company_name = :current_company_name)
