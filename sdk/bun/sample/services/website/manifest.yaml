id: website
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
operations: operations.yaml
storage: storage.yaml
menu:
  website:
    path: /website
    label: Website
    icon: globe
    permission: website.read
  groups:
    - id: site
      label: Site
      items:
        - { path: /website-homepage, label: Homepage, icon: home, permission: website.read }
        - { path: /website-themes, label: Themes, icon: palette, permission: website.read }
    - id: configuration
      label: Configuration
      items:
        - { path: /website-settings, label: Settings, icon: settings, permission: website.manage }
    - id: content
      label: Content
      items:
        - { path: /website, label: Websites, icon: globe, permission: website.read }
        - { path: /website-pages, label: Pages, icon: document, permission: website.read }
        - { path: /website-menus, label: Menus, icon: menu, permission: website.read }
        - { path: /forum-post-pages, label: Forum Posts, icon: comment, permission: forum.read }
    - id: reporting
      label: Reporting
      items:
        - { path: /website-analysis, label: Analytics, icon: chart, permission: website.read }
