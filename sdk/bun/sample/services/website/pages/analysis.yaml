title: Analytics
page: { id: website-analysis, route: /website-analysis, breadcrumb: [Website, Reporting, Analytics], auth: { require: [website.read] } }
components:
  - type: StatRow
    source: website_analysis_totals
    title: Website analytics
    stats: [{ label: Websites, field: website_count }, { label: Visitors, field: visitor_count }, { label: Visits, field: visit_count }, { label: Page views, field: pageview_count }]
  - type: Chart
    source: website_analysis_traffic
    title: Visits by date
    label_field: report_date
    value_field: visits
    variant: bar
