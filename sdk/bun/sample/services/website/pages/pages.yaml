title: Website Pages
page: { id: website-pages, route: /website-pages, breadcrumb: [Website, Site, Content, Pages], auth: { require: [website.read] } }
components:
  - type: ListView
    variant: odoo
    source: website_pages
    create_action: create_website_page
    create_label: New page
    search: { label: Search pages, placeholder: Search pages... }
    filters:
      - { field: state, label: Status, options_source: website_page_states }
      - { field: track, label: Tracking, options: [{ id: tracked, label: Tracked }, { id: not_tracked, label: Not tracked }] }
      - { field: is_seo_optimized, label: SEO, options: [{ id: not_optimized, label: Not SEO optimized }] }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: true
        group_by: state
        card:
          title: name
          subtitle: url
          fields:
            - { field: is_in_menu, label: In Main Menu }
            - { field: is_seo_optimized, label: SEO Optimized }
            - { field: state, label: Status }
    columns:
      - { field: name, label: Page Title, type: PrimaryEntityCell }
      - { field: url, label: Page URL }
      - { field: is_indexed, label: Indexed }
      - { field: is_in_menu, label: Is In Main Menu }
      - { field: is_seo_optimized, label: Is SEO Optimized }
      - field: state
        label: Is Published
        type: StatusChip
        actions:
          - { id: edit_website_page, label: Edit, permission: website.write }
          - { id: publish_website_page, label: Publish, permission: website.write, variant: primary, show_if: "row.state === 'Draft'" }
          - { id: unpublish_website_page, label: Unpublish, permission: website.manage, variant: secondary, show_if: "row.state === 'Published'" }
    page_size: 50
    row_key: id
    row_actions: menu
    row_open_action: open_website_page_detail
    actions:
      - { id: website.pages.export, label: Export, title: Export Website Pages, icon: download, permission: website.read }
      - { id: edit_website_page, label: Edit, permission: website.write, variant: secondary }
      - { id: publish_website_page, label: Publish, permission: website.write, variant: primary, show_if: "row.state === 'Draft'" }
      - { id: unpublish_website_page, label: Unpublish, permission: website.manage, variant: secondary, show_if: "row.state === 'Published'" }
    empty_state: { title: No pages found, description: No website pages match the current search. }
