title: Website Settings
page: { id: website-settings, route: /website-settings, breadcrumb: [Website, Configuration, Settings], auth: { require: [website.manage] } }
components:
  - type: SettingsView
    id: website-settings-view
    source: website_settings
    title: Settings
    save_action: save_website_identification
    search_placeholder: Search settings...
    tabs:
      - id: website
        label: Website
        icon: globe
        sections:
          - title: General
            fields:
              - { field: domain, label: Domain, description: Display this website for this web address., type: text, placeholder: 'https://www.example.com' }
              - { field: name, label: Name, description: "Set your website's name, displayed in the browser tab next to the page title.", type: text, required: true }
          - title: Website Identification
            fields:
              - { field: website_name, label: Website, description: Settings on this page apply to the selected website., type: info }
              - { label: Favicon, description: Favicon upload remains a separate Website asset slice., type: info }
