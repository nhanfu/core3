operations:
  website.public.pages:
    result_key: pages
    query: "SELECT id, website_id, website_name, name, url, content_html, (SELECT id FROM website_page_assets a WHERE a.page_id = website_pages.id AND a.is_public = TRUE ORDER BY a.created_at, a.id LIMIT 1) AS asset_id, is_homepage, is_in_menu, is_seo_optimized, CAST(date_publish AS VARCHAR) AS date_publish FROM website_pages WHERE state = 'Published' AND (:website_id IS NULL OR website_id = :website_id) AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR url ILIKE '%' || :q || '%') ORDER BY is_homepage DESC, url, id"
  website.public.page:
    result_key: pages
    query: "SELECT id, website_id, website_name, name, url, content_html, (SELECT id FROM website_page_assets a WHERE a.page_id = website_pages.id AND a.is_public = TRUE ORDER BY a.created_at, a.id LIMIT 1) AS asset_id, is_homepage, is_in_menu, is_seo_optimized, CAST(date_publish AS VARCHAR) AS date_publish FROM website_pages WHERE id = :id AND state = 'Published' AND (:website_id IS NULL OR website_id = :website_id) LIMIT 1"
  website.public.page_by_path:
    result_key: pages
    query: "SELECT id, website_id, website_name, name, url, content_html, (SELECT id FROM website_page_assets a WHERE a.page_id = website_pages.id AND a.is_public = TRUE ORDER BY a.created_at, a.id LIMIT 1) AS asset_id, is_homepage, is_in_menu, is_seo_optimized, CAST(date_publish AS VARCHAR) AS date_publish FROM website_pages WHERE url = :url AND state = 'Published' AND (:website_id IS NULL OR website_id = :website_id) ORDER BY is_homepage DESC, id LIMIT 1"
  website.public.asset:
    result_key: asset
    query: "SELECT a.id, a.file_name, a.mime_type, a.size_bytes, a.content_base64 FROM website_page_assets a JOIN website_pages p ON p.id = a.page_id AND p.state = 'Published' WHERE a.id = :id AND a.is_public = TRUE LIMIT 1"
