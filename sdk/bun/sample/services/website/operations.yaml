operations:
  website.public.pages:
    result_key: pages
    query: "SELECT id, website_id, website_name, name, url, content_html, is_homepage, is_in_menu, is_seo_optimized, CAST(date_publish AS VARCHAR) AS date_publish FROM website_pages WHERE state = 'Published' AND (:q IS NULL OR name ILIKE '%' || :q || '%' OR url ILIKE '%' || :q || '%') ORDER BY is_homepage DESC, url, id"
  website.public.page:
    result_key: pages
    query: "SELECT id, website_id, website_name, name, url, content_html, is_homepage, is_in_menu, is_seo_optimized, CAST(date_publish AS VARCHAR) AS date_publish FROM website_pages WHERE id = :id AND state = 'Published' LIMIT 1"
  website.public.page_by_path:
    result_key: pages
    query: "SELECT id, website_id, website_name, name, url, content_html, is_homepage, is_in_menu, is_seo_optimized, CAST(date_publish AS VARCHAR) AS date_publish FROM website_pages WHERE url = :url AND state = 'Published' ORDER BY is_homepage DESC, id LIMIT 1"
