operations:
  website.public.pages:
    result_key: pages
    query: "SELECT p.id, p.website_id, p.website_name, p.name, p.url, p.content_html, (SELECT id FROM website_page_assets a WHERE a.page_id = p.id AND a.is_public = TRUE ORDER BY a.created_at, a.id LIMIT 1) AS asset_id, p.is_homepage, p.is_in_menu, p.is_seo_optimized, CAST(p.date_publish AS VARCHAR) AS date_publish, w.theme_id, w.theme_revision, t.name AS theme_name, t.primary_color AS theme_primary_color, t.accent_color AS theme_accent_color, t.surface_color AS theme_surface_color, t.text_color AS theme_text_color FROM website_pages p JOIN website_websites w ON w.id = p.website_id LEFT JOIN website_themes t ON t.id = COALESCE(NULLIF(CAST(:preview_theme_id AS VARCHAR), ''), w.theme_id) AND t.active = TRUE WHERE p.state = 'Published' AND (:website_id IS NULL OR p.website_id = :website_id) AND (:q IS NULL OR p.name ILIKE '%' || :q || '%' OR p.url ILIKE '%' || :q || '%') ORDER BY p.is_homepage DESC, p.url, p.id"
  website.public.page:
    result_key: pages
    query: "SELECT p.id, p.website_id, p.website_name, p.name, p.url, p.content_html, (SELECT id FROM website_page_assets a WHERE a.page_id = p.id AND a.is_public = TRUE ORDER BY a.created_at, a.id LIMIT 1) AS asset_id, p.is_homepage, p.is_in_menu, p.is_seo_optimized, CAST(p.date_publish AS VARCHAR) AS date_publish, w.theme_id, w.theme_revision, t.name AS theme_name, t.primary_color AS theme_primary_color, t.accent_color AS theme_accent_color, t.surface_color AS theme_surface_color, t.text_color AS theme_text_color FROM website_pages p JOIN website_websites w ON w.id = p.website_id LEFT JOIN website_themes t ON t.id = COALESCE(NULLIF(CAST(:preview_theme_id AS VARCHAR), ''), w.theme_id) AND t.active = TRUE WHERE p.id = :id AND p.state = 'Published' AND (:website_id IS NULL OR p.website_id = :website_id) LIMIT 1"
  website.public.page_by_path:
    result_key: pages
    query: "SELECT p.id, p.website_id, p.website_name, p.name, p.url, p.content_html, (SELECT id FROM website_page_assets a WHERE a.page_id = p.id AND a.is_public = TRUE ORDER BY a.created_at, a.id LIMIT 1) AS asset_id, p.is_homepage, p.is_in_menu, p.is_seo_optimized, CAST(p.date_publish AS VARCHAR) AS date_publish, w.theme_id, w.theme_revision, t.name AS theme_name, t.primary_color AS theme_primary_color, t.accent_color AS theme_accent_color, t.surface_color AS theme_surface_color, t.text_color AS theme_text_color FROM website_pages p JOIN website_websites w ON w.id = p.website_id LEFT JOIN website_themes t ON t.id = COALESCE(NULLIF(CAST(:preview_theme_id AS VARCHAR), ''), w.theme_id) AND t.active = TRUE WHERE p.url = :url AND p.state = 'Published' AND (:website_id IS NULL OR p.website_id = :website_id) ORDER BY p.is_homepage DESC, p.id LIMIT 1"
  website.public.asset:
    result_key: asset
    query: "SELECT a.id, a.file_name, a.mime_type, a.size_bytes, a.content_base64 FROM website_page_assets a JOIN website_pages p ON p.id = a.page_id AND p.state = 'Published' WHERE a.id = :id AND a.is_public = TRUE LIMIT 1"
  website.public.cookie_consent:
    kind: public-datasource
    route: /api/public/website/cookie-consent
    method: GET
    result_key: websites
    query: "SELECT id, name, COALESCE(cookies_bar, FALSE) AS cookies_bar, COALESCE(block_third_party_domains, TRUE) AS block_third_party_domains FROM website_websites WHERE id = COALESCE(NULLIF(CAST(:website_id AS VARCHAR), ''), 'website-demo-001') LIMIT 1"
  website.public.cookie_consent.save:
    kind: public-action
    route: /api/public/website/cookie-consent
    method: POST
    result_key: websites
    description: Persist the Odoo-compatible website_cookies_bar browser preference.
    query: "SELECT id, name, COALESCE(cookies_bar, FALSE) AS cookies_bar, COALESCE(block_third_party_domains, TRUE) AS block_third_party_domains FROM website_websites WHERE id = COALESCE(NULLIF(CAST(:website_id AS VARCHAR), ''), 'website-demo-001') LIMIT 1"
