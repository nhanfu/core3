page:
  id: website-pages
  route: /website-pages
datasources:
  - id: website_page_states
    permission: website.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Published','Published')) states(value, label)"
  - id: website_lookup
    permission: website.read
    single: false
    query: "SELECT id AS value, name AS label FROM website_websites ORDER BY name"
  - id: website_pages
    permission: website.read
    workflow: website_pages
    query: "SELECT p.id, p.row_version, p.website_id, p.website_name, p.name, p.url, p.content_html, p.is_indexed, p.is_homepage, p.is_in_menu, p.is_seo_optimized, p.track, CAST(p.date_publish AS VARCHAR) AS date_publish, p.state, w.row_version AS website_row_version FROM website_pages p JOIN website_websites w ON w.id = p.website_id WHERE (:q IS NULL OR p.name ILIKE '%' || :q || '%' OR p.url ILIKE '%' || :q || '%') AND (:state IS NULL OR p.state = :state) AND (COALESCE(CAST(:track AS VARCHAR), '') = '' OR (CAST(:track AS VARCHAR) = 'tracked' AND p.track = TRUE) OR (CAST(:track AS VARCHAR) = 'not_tracked' AND p.track = FALSE)) AND (COALESCE(CAST(:is_seo_optimized AS VARCHAR), '') = '' OR (CAST(:is_seo_optimized AS VARCHAR) = 'not_optimized' AND p.is_seo_optimized = FALSE)) ORDER BY p.url, p.id"
actions:
  - id: import_website_pages
    type: server_form
    permission: website.write
    title: Import website pages
    action: website.pages.import
    handler: yaml_mutation
    operation: create
    submit_label: Import
    refresh: [website_pages]
    mutation:
      guards:
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:page_list AS VARCHAR))) > 0", status: 422, code: WEBSITE_PAGE_IMPORT_REQUIRED, message: Add at least one website page row. }
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM (SELECT trim(unnest(string_split(replace(CAST(:page_list AS VARCHAR), chr(13), ''), chr(10)))) AS line) lines WHERE line <> '' AND NOT regexp_matches(line, '^[^|]+\\|[^|]+\\|/[^|]*\\|(Draft|Published)\\|(true|false)\\|(true|false)\\|(true|false)\\|(true|false)$'))", status: 422, code: WEBSITE_PAGE_IMPORT_INVALID, message: "Each row must use Website ID|Page Title|Page URL|State|Indexed|In Main Menu|SEO Optimized|Tracked format." }
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(replace(CAST(:page_list AS VARCHAR), chr(13), ''), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS website_id FROM lines WHERE line <> '') SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM parsed p LEFT JOIN website_websites w ON w.id = p.website_id WHERE w.id IS NULL)", status: 422, code: WEBSITE_PAGE_IMPORT_SITE_INVALID, message: Every imported row must reference an existing Website ID. }
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(replace(CAST(:page_list AS VARCHAR), chr(13), ''), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS website_id, trim(split_part(line, '|', 3)) AS url FROM lines WHERE line <> '') SELECT 1 AS ok WHERE NOT EXISTS (SELECT website_id, url FROM parsed GROUP BY website_id, url HAVING COUNT(*) > 1)", status: 422, code: WEBSITE_PAGE_IMPORT_DUPLICATE, message: The import contains duplicate Website ID and Page URL rows. }
      steps:
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(replace(CAST(:page_list AS VARCHAR), chr(13), ''), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS website_id, trim(split_part(line, '|', 2)) AS name, trim(split_part(line, '|', 3)) AS url, trim(split_part(line, '|', 4)) AS state, lower(trim(split_part(line, '|', 5))) = 'true' AS is_indexed, lower(trim(split_part(line, '|', 6))) = 'true' AS is_in_menu, lower(trim(split_part(line, '|', 7))) = 'true' AS is_seo_optimized, lower(trim(split_part(line, '|', 8))) = 'true' AS track FROM lines WHERE line <> '') UPDATE website_pages p SET website_name = w.name, name = s.name, url = s.url, is_indexed = s.is_indexed, is_in_menu = s.is_in_menu, is_seo_optimized = s.is_seo_optimized, track = s.track, state = s.state, date_publish = CASE WHEN s.state = 'Published' THEN COALESCE(p.date_publish, NOW()) ELSE NULL END, row_version = p.row_version + 1, updated_at = NOW() FROM parsed s JOIN website_websites w ON w.id = s.website_id WHERE p.website_id = s.website_id AND p.url = s.url" }
        - { query: "WITH lines AS (SELECT trim(unnest(string_split(replace(CAST(:page_list AS VARCHAR), chr(13), ''), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS website_id, trim(split_part(line, '|', 2)) AS name, trim(split_part(line, '|', 3)) AS url, trim(split_part(line, '|', 4)) AS state, lower(trim(split_part(line, '|', 5))) = 'true' AS is_indexed, lower(trim(split_part(line, '|', 6))) = 'true' AS is_in_menu, lower(trim(split_part(line, '|', 7))) = 'true' AS is_seo_optimized, lower(trim(split_part(line, '|', 8))) = 'true' AS track FROM lines WHERE line <> '') INSERT INTO website_pages(id, row_version, website_id, website_name, name, url, is_indexed, is_homepage, is_in_menu, is_seo_optimized, track, state, date_publish) SELECT 'website-page-import-' || regexp_replace(lower(s.website_id || '-' || s.url), '[^a-z0-9]+', '-', 'g'), 1, s.website_id, w.name, s.name, s.url, s.is_indexed, FALSE, s.is_in_menu, s.is_seo_optimized, s.track, s.state, CASE WHEN s.state = 'Published' THEN NOW() ELSE NULL END FROM parsed s JOIN website_websites w ON w.id = s.website_id WHERE NOT EXISTS (SELECT 1 FROM website_pages p WHERE p.website_id = s.website_id AND p.url = s.url) ON CONFLICT(id) DO UPDATE SET website_name = EXCLUDED.website_name, name = EXCLUDED.name, url = EXCLUDED.url, is_indexed = EXCLUDED.is_indexed, is_in_menu = EXCLUDED.is_in_menu, is_seo_optimized = EXCLUDED.is_seo_optimized, track = EXCLUDED.track, state = EXCLUDED.state, date_publish = EXCLUDED.date_publish, updated_at = NOW()" }
      result: { query: "WITH lines AS (SELECT trim(unnest(string_split(replace(CAST(:page_list AS VARCHAR), chr(13), ''), chr(10)))) AS line), parsed AS (SELECT trim(split_part(line, '|', 1)) AS website_id, trim(split_part(line, '|', 3)) AS url FROM lines WHERE line <> '') SELECT COUNT(*) AS imported FROM parsed s JOIN website_pages p ON p.website_id = s.website_id AND p.url = s.url" }
    fields: [{ field: page_list, label: Page List, type: textarea, required: true, placeholder: 'website-demo-001|About|/about|Draft|true|true|true|false' }]
  - { id: open_website_page_detail, type: navigate, permission: website.read, navigate_to: /website-pages/detail, params: { id: '{row.id}' } }
  - id: create_website_page
    type: server_form
    permission: website.write
    title: New page
    action: website.pages.create
    handler: yaml_mutation
    operation: create
    refresh: [website_pages]
    mutation:
      operation: insert
      table: website_pages
      fields: [website_id, website_name, name, url, content_html, is_indexed, is_homepage, is_in_menu, is_seo_optimized, track]
      defaults: { track: false }
      boolean_fields: [is_indexed, is_homepage, is_in_menu, is_seo_optimized, track]
      required: [website_id, website_name, name, url]
      guards: [{ query: "SELECT 1 AS ok FROM website_websites WHERE id = :website_id", status: 400, message: A valid website is required }]
      result: { query: "SELECT * FROM website_pages WHERE id = :id" }
    fields:
      - { field: website_id, label: Website, type: select, options_source: website_lookup, required: true }
      - { field: website_name, label: Website name, type: text, required: true }
      - { field: name, label: Page Title, type: text, required: true }
      - { field: url, label: Page URL, type: text, required: true }
      - { field: content_html, label: Page content, type: textarea }
      - { field: is_indexed, label: Indexed, type: checkbox }
      - { field: is_homepage, label: Home page, type: checkbox }
      - { field: is_in_menu, label: Is In Main Menu, type: checkbox }
      - { field: is_seo_optimized, label: Is SEO Optimized, type: checkbox }
      - { field: track, label: Track, type: checkbox }
  - id: edit_website_page
    type: server_form
    permission: website.write
    title: Edit page
    action: website.pages.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [website_pages]
    mutation:
      operation: update
      table: website_pages
      fields: [website_id, website_name, name, url, content_html, is_indexed, is_homepage, is_in_menu, is_seo_optimized, track]
      boolean_fields: [is_indexed, is_homepage, is_in_menu, is_seo_optimized, track]
      required: [website_id, website_name, name, url]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM website_pages WHERE id = :id", status: 404, code: WEBSITE_PAGE_NOT_FOUND, message: Website page not found }
        - { query: "SELECT 1 AS ok FROM website_websites WHERE id = :website_id", status: 400, code: WEBSITE_INVALID_SITE, message: A valid website is required }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:redirect_old_url AS BOOLEAN), FALSE) = FALSE OR CAST(:redirect_type AS VARCHAR) IN ('301', '302')", status: 422, code: WEBSITE_PAGE_REDIRECT_TYPE_INVALID, message: Page URL redirects must use 301 or 302. }
      before_steps:
        - { query: "SELECT url AS old_url FROM website_pages WHERE id = :id", assign: true }
      steps:
        - { query: "INSERT INTO website_page_redirects(id, row_version, page_id, website_id, website_name, name, url_from, url_to, redirect_type, active, sequence) SELECT 'website-page-redirect-' || :id || '-' || CAST(:expected_row_version AS VARCHAR), 1, id, website_id, website_name, name, :old_url, url, COALESCE(NULLIF(CAST(:redirect_type AS VARCHAR), ''), '301'), TRUE, 10 FROM website_pages WHERE id = :id AND COALESCE(CAST(:redirect_old_url AS BOOLEAN), FALSE) = TRUE AND COALESCE(CAST(:old_url AS VARCHAR), '') <> COALESCE(url, '')" }
      timestamps: true
      result: { query: "SELECT * FROM website_pages WHERE id = :id" }
    fields:
      - { field: website_id, label: Website, type: select, options_source: website_lookup, required: true }
      - { field: website_name, label: Website name, type: text, required: true }
      - { field: name, label: Page Title, type: text, required: true }
      - { field: url, label: Page URL, type: text, required: true }
      - { field: content_html, label: Page content, type: textarea }
      - { field: is_indexed, label: Indexed, type: checkbox }
      - { field: is_homepage, label: Home page, type: checkbox }
      - { field: is_in_menu, label: Is In Main Menu, type: checkbox }
      - { field: is_seo_optimized, label: Is SEO Optimized, type: checkbox }
      - { field: track, label: Track, type: checkbox }
      - { field: redirect_old_url, label: Redirect old URL, type: checkbox }
      - { field: redirect_type, label: Redirect type, type: select, options: [{ value: '301', label: 301 Moved permanently }, { value: '302', label: 302 Moved temporarily }], default: '301' }
  - id: upload_website_page_asset
    type: upload
    action: website.pages.assets.upload
    handler: attachment_metadata
    permission: website.write
    kind: website_page_asset
    mutation:
      generated: [asset_id]
      guards:
        - { query: "SELECT id FROM website_pages WHERE id = :page_id", status: 404, code: WEBSITE_PAGE_NOT_FOUND, message: Website page not found }
      steps:
        - { query: "INSERT INTO website_page_assets(id, page_id, file_name, mime_type, size_bytes, storage_key, content_base64, is_public, uploaded_by) VALUES(:asset_id, :page_id, :fileName, :mimeType, :sizeBytes, :storageKey, '', FALSE, :current_user_id)" }
      result: { query: "SELECT id, page_id, file_name, mime_type, size_bytes, storage_key, is_public, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM website_page_assets WHERE id = :asset_id" }
  - id: download_website_page_asset
    type: download
    permission: website.read
    kind: website_page_asset
  - id: website.pages.export
    type: client
    permission: website.read
  - { id: publish_website_page, type: server, permission: website.write, action: website.pages.publish, handler: order_transition, workflow: website_pages, operation: publish, refresh: [website_pages] }
  - { id: unpublish_website_page, type: server, permission: website.manage, action: website.pages.unpublish, handler: order_transition, workflow: website_pages, operation: unpublish, refresh: [website_pages] }
  - id: set_website_page_homepage
    type: server
    permission: website.write
    action: website.pages.homepage.set
    handler: yaml_mutation
    refresh: [website_pages]
    params: { website_id: '{row.website_id}', expected_row_version: '{row.row_version}', expected_website_row_version: '{row.website_row_version}' }
    mutation:
      guards:
        - { query: "SELECT id FROM website_pages WHERE id = :id AND website_id = :website_id AND row_version = :expected_row_version AND is_homepage = FALSE", status: 409, code: WEBSITE_PAGE_HOMEPAGE_STALE, message: This page changed or is already the homepage. Reload before changing the homepage. }
        - { query: "SELECT id FROM website_websites WHERE id = :website_id AND row_version = :expected_website_row_version", status: 409, code: WEBSITE_WEBSITE_HOMEPAGE_STALE, message: This website changed before the homepage could be changed. Reload before trying again. }
      steps:
        - { query: "UPDATE website_pages SET is_homepage = FALSE, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE website_id = :website_id AND is_homepage = TRUE" }
        - { query: "UPDATE website_pages SET is_homepage = TRUE, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND website_id = :website_id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: WEBSITE_PAGE_HOMEPAGE_STALE, message: This page changed before it could become the homepage. Reload before trying again. }
        - { query: "UPDATE website_websites SET homepage_url = (SELECT url FROM website_pages WHERE id = :id), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :website_id AND row_version = :expected_website_row_version", expect_changed: true, status: 409, code: WEBSITE_WEBSITE_HOMEPAGE_STALE, message: This website changed before the homepage could be changed. Reload before trying again. }
      result: { query: "SELECT * FROM website_pages WHERE id = :id" }
  - id: clear_website_page_homepage
    type: server
    permission: website.write
    action: website.pages.homepage.clear
    handler: yaml_mutation
    refresh: [website_pages]
    params: { website_id: '{row.website_id}', expected_row_version: '{row.row_version}', expected_website_row_version: '{row.website_row_version}' }
    mutation:
      guards:
        - { query: "SELECT id FROM website_pages WHERE id = :id AND website_id = :website_id AND row_version = :expected_row_version AND is_homepage = TRUE AND url <> '/'", status: 409, code: WEBSITE_PAGE_HOMEPAGE_STALE, message: This page changed or cannot clear the homepage selection. Reload before changing the homepage. }
        - { query: "SELECT id FROM website_websites WHERE id = :website_id AND row_version = :expected_website_row_version", status: 409, code: WEBSITE_WEBSITE_HOMEPAGE_STALE, message: This website changed before the homepage could be changed. Reload before trying again. }
      steps:
        - { query: "UPDATE website_pages SET is_homepage = (url = '/'), row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE website_id = :website_id AND (is_homepage = TRUE OR url = '/')" }
        - { query: "UPDATE website_websites SET homepage_url = NULL, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :website_id AND row_version = :expected_website_row_version", expect_changed: true, status: 409, code: WEBSITE_WEBSITE_HOMEPAGE_STALE, message: This website changed before the homepage could be changed. Reload before trying again. }
      result: { query: "SELECT * FROM website_pages WHERE id = :id" }
