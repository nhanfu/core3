page: { id: website-page-detail }
datasources:
  - id: website_page_detail
    single: true
    permission: website.read
    error_states:
      missing_record: { status: 404, code: WEBSITE_PAGE_NOT_FOUND, message: Website page not found. }
    query: "SELECT id, row_version, website_id, website_name, name, url, content_html, is_indexed, is_homepage, is_in_menu, is_seo_optimized, track, CAST(date_publish AS VARCHAR) AS date_publish, state FROM website_pages WHERE id = :id"
  - id: website_page_assets
    permission: website.read
    query: "SELECT id, row_version, page_id, file_name, mime_type, size_bytes, is_public, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM website_page_assets WHERE page_id = :id ORDER BY created_at DESC, id"
actions:
  - { id: back_to_website_pages, type: navigate, permission: website.read, navigate_to: /website-pages, params: {} }
  - { id: publish_website_page_detail, type: server, permission: website.write, action: website.pages.publish, handler: order_transition, workflow: website_pages, operation: publish, refresh: [website_page_detail, website_page_assets] }
  - { id: unpublish_website_page_detail, type: server, permission: website.manage, action: website.pages.unpublish, handler: order_transition, workflow: website_pages, operation: unpublish, refresh: [website_page_detail, website_page_assets] }
  - id: upload_website_page_asset
    type: upload
    action: website.pages.assets.upload
    handler: attachment_metadata
    permission: website.write
    kind: website_page_asset
    params: { page_id: '{state.website_page_detail.id}' }
    refresh: [website_page_assets]
    mutation:
      generated: [asset_id]
      guards: [{ query: "SELECT id FROM website_pages WHERE id = :page_id", status: 404, code: WEBSITE_PAGE_NOT_FOUND, message: Website page not found }]
      steps: [{ query: "INSERT INTO website_page_assets(id, page_id, file_name, mime_type, size_bytes, storage_key, content_base64, is_public, uploaded_by) VALUES(:asset_id, :page_id, :fileName, :mimeType, :sizeBytes, :storageKey, '', FALSE, :current_user_id)" }]
      result: { query: "SELECT id, page_id, file_name, mime_type, size_bytes, storage_key, is_public, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM website_page_assets WHERE id = :asset_id" }
  - { id: download_website_page_asset, type: download, permission: website.read, kind: website_page_asset }
  - id: publish_website_page_asset
    type: server
    permission: website.manage
    action: website.pages.assets.publish
    handler: yaml_mutation
    operation: update
    refresh: [website_page_assets]
    params: { values: { is_public: true } }
    mutation:
      operation: update
      table: website_page_assets
      fields: [is_public]
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE CAST(:is_public AS BOOLEAN) = TRUE", status: 400, code: WEBSITE_ASSET_PUBLIC_VALUE_REQUIRED, message: Public asset action requires is_public=true. }
        - { query: "SELECT a.id FROM website_page_assets a JOIN website_pages p ON p.id = a.page_id WHERE a.id = :id AND p.state = 'Published'", status: 409, code: WEBSITE_ASSET_PAGE_NOT_PUBLISHED, message: The page must be published before an asset can be public. }
      result: { query: "SELECT id, row_version, page_id, file_name, mime_type, size_bytes, is_public, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM website_page_assets WHERE id = :id" }
  - id: privatize_website_page_asset
    type: server
    permission: website.manage
    action: website.pages.assets.privatize
    handler: yaml_mutation
    operation: update
    refresh: [website_page_assets]
    params: { values: { is_public: false } }
    mutation:
      operation: update
      table: website_page_assets
      fields: [is_public]
      concurrency: { required: true }
      guards:
        - { query: "SELECT 1 AS ok WHERE CAST(:is_public AS BOOLEAN) = FALSE", status: 400, code: WEBSITE_ASSET_PRIVATE_VALUE_REQUIRED, message: Private asset action requires is_public=false. }
        - { query: "SELECT id FROM website_page_assets WHERE id = :id", status: 404, code: WEBSITE_ASSET_NOT_FOUND, message: Website asset not found. }
      result: { query: "SELECT id, row_version, page_id, file_name, mime_type, size_bytes, is_public, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM website_page_assets WHERE id = :id" }
  - id: edit_website_page_detail
    type: server_form
    permission: website.write
    title: Edit page
    action: website.pages.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [website_page_detail, website_page_assets]
    mutation:
      operation: update
      table: website_pages
      fields: [website_id, website_name, name, url, content_html, is_indexed, is_homepage, is_in_menu, is_seo_optimized, track]
      boolean_fields: [is_indexed, is_homepage, is_in_menu, is_seo_optimized, track]
      required: [website_id, website_name, name, url]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM website_pages WHERE id = :id", status: 404, code: WEBSITE_PAGE_NOT_FOUND, message: Website page not found }
        - { query: "SELECT 1 AS ok FROM website_websites WHERE id = :website_id", status: 400, code: WEBSITE_INVALID_SITE, message: A valid website is required }
        - { query: "SELECT 1 AS ok WHERE COALESCE(CAST(:redirect_old_url AS BOOLEAN), FALSE) = FALSE OR CAST(:redirect_type AS VARCHAR) IN ('301', '302')", status: 422, code: WEBSITE_PAGE_REDIRECT_TYPE_INVALID, message: Page URL redirects must use 301 or 302. }
      before_steps:
        - { query: "SELECT url AS old_url FROM website_pages WHERE id = :id", assign: true }
      steps:
        - { query: "INSERT INTO website_page_redirects(id, row_version, page_id, website_id, website_name, name, url_from, url_to, redirect_type, active, sequence) SELECT 'website-page-redirect-' || :id || '-' || CAST(:expected_row_version AS VARCHAR), 1, id, website_id, website_name, name, :old_url, url, COALESCE(NULLIF(CAST(:redirect_type AS VARCHAR), ''), '301'), TRUE, 10 FROM website_pages WHERE id = :id AND COALESCE(CAST(:redirect_old_url AS BOOLEAN), FALSE) = TRUE AND COALESCE(CAST(:old_url AS VARCHAR), '') <> COALESCE(url, '')" }
      timestamps: true
      result: { query: "SELECT * FROM website_pages WHERE id = :id" }
    fields:
      - { field: website_id, label: Website, type: select, options_source: website_lookup, required: true }
      - { field: website_name, label: Website name, type: text, required: true }
      - { field: name, label: Page Title, type: text, required: true }
      - { field: url, label: Page URL, type: text, required: true }
      - { field: content_html, label: Page content, type: textarea }
      - { field: is_indexed, label: Indexed, type: checkbox }
      - { field: is_homepage, label: Home page, type: checkbox }
      - { field: is_in_menu, label: Is In Main Menu, type: checkbox }
      - { field: is_seo_optimized, label: Is SEO Optimized, type: checkbox }
      - { field: track, label: Track, type: checkbox }
      - { field: redirect_old_url, label: Redirect old URL, type: checkbox }
      - { field: redirect_type, label: Redirect type, type: select, options: [{ value: '301', label: 301 Moved permanently }, { value: '302', label: 302 Moved temporarily }], default: '301' }
