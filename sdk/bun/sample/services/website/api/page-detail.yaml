page: { id: website-page-detail }
datasources:
  - id: website_page_detail
    single: true
    permission: website.read
    error_states:
      missing_record: { status: 404, code: WEBSITE_PAGE_NOT_FOUND, message: Website page not found. }
    query: "SELECT id, row_version, website_id, website_name, name, url, content_html, is_indexed, is_homepage, is_in_menu, is_seo_optimized, CAST(date_publish AS VARCHAR) AS date_publish, state FROM website_pages WHERE id = :id"
  - id: website_page_assets
    permission: website.read
    query: "SELECT id, page_id, file_name, mime_type, size_bytes, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM website_page_assets WHERE page_id = :id ORDER BY created_at DESC, id"
actions:
  - { id: back_to_website_pages, type: navigate, permission: website.read, navigate_to: /website-pages, params: {} }
  - id: upload_website_page_asset
    type: upload
    action: website.pages.assets.upload
    handler: attachment_metadata
    permission: website.write
    kind: website_page_asset
    params: { page_id: '{state.website_page_detail.id}' }
    refresh: [website_page_assets]
    mutation:
      generated: [asset_id]
      guards: [{ query: "SELECT id FROM website_pages WHERE id = :page_id", status: 404, code: WEBSITE_PAGE_NOT_FOUND, message: Website page not found }]
      steps: [{ query: "INSERT INTO website_page_assets(id, page_id, file_name, mime_type, size_bytes, storage_key, content_base64, is_public, uploaded_by) VALUES(:asset_id, :page_id, :fileName, :mimeType, :sizeBytes, :storageKey, '', FALSE, :current_user_id)" }]
      result: { query: "SELECT id, page_id, file_name, mime_type, size_bytes, storage_key, is_public, uploaded_by, CAST(created_at AS VARCHAR) AS created_at FROM website_page_assets WHERE id = :asset_id" }
  - { id: download_website_page_asset, type: download, permission: website.read, kind: website_page_asset }
  - id: edit_website_page_detail
    type: server_form
    permission: website.write
    title: Edit page
    action: website.pages.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [website_page_detail, website_page_assets]
    mutation:
      operation: update
      table: website_pages
      fields: [website_id, website_name, name, url, content_html, is_indexed, is_homepage, is_in_menu, is_seo_optimized]
      required: [website_id, website_name, name, url]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM website_pages WHERE id = :id", status: 404, code: WEBSITE_PAGE_NOT_FOUND, message: Website page not found }
        - { query: "SELECT 1 AS ok FROM website_websites WHERE id = :website_id", status: 400, code: WEBSITE_INVALID_SITE, message: A valid website is required }
      timestamps: true
      result: { query: "SELECT * FROM website_pages WHERE id = :id" }
    fields:
      - { field: website_id, label: Website, type: select, options_source: website_lookup, required: true }
      - { field: website_name, label: Website name, type: text, required: true }
      - { field: name, label: Page Title, type: text, required: true }
      - { field: url, label: Page URL, type: text, required: true }
      - { field: content_html, label: Page content, type: textarea }
      - { field: is_indexed, label: Indexed, type: checkbox }
      - { field: is_homepage, label: Home page, type: checkbox }
      - { field: is_in_menu, label: Is In Main Menu, type: checkbox }
      - { field: is_seo_optimized, label: Is SEO Optimized, type: checkbox }
