page: { id: website-settings }
datasources:
  - id: website_settings
    single: true
    permission: website.manage
    error_states:
      unauthorized: { status: 401, code: WEBSITE_SETTINGS_UNAUTHENTICATED, message: Sign in to view Website settings. }
      forbidden: { status: 403, code: WEBSITE_SETTINGS_FORBIDDEN, message: You do not have permission to manage Website settings. }
      transport_error: { status: 503, code: WEBSITE_SETTINGS_UNAVAILABLE, message: Website settings are temporarily unavailable. }
    query: "SELECT id, row_version, name, name AS website_name, domain, favicon_file_name, favicon_mime_type, favicon_size_bytes, CASE WHEN COALESCE(favicon_content_base64, '') <> '' THEN 'data:' || favicon_mime_type || ';base64,' || favicon_content_base64 ELSE NULL END AS favicon_data_url FROM website_websites WHERE id = COALESCE(NULLIF(CAST(:website_id AS VARCHAR), ''), 'website-demo-001')"
    meta: { empty_state: { title: Website settings unavailable, description: Select an existing website before editing its settings. } }
actions:
  - id: save_website_identification
    type: client
    permission: website.manage
    script: |
      async ({ row, request }) => {
        return request('/api/actions/website.settings.update', {
          method: 'POST',
          body: {
            id: row.id,
            expected_row_version: row.row_version,
            values: { name: row.name, domain: row.domain },
          },
        });
      }
  - id: website_settings_update_server
    type: server
    permission: website.manage
    action: website.settings.update
    handler: yaml_mutation
    operation: update
    mutation:
      operation: update
      table: website_websites
      key_field: id
      fields: [name, domain]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM website_websites WHERE id = :id", status: 404, code: WEBSITE_SETTINGS_NOT_FOUND, message: Website settings no longer exist. }
        - { query: "SELECT id FROM website_websites WHERE id = :id AND row_version = :expected_row_version", status: 409, code: WEBSITE_SETTINGS_STALE, message: Website settings changed before they could be saved. Reload before saving. }
        - { query: "SELECT 1 AS ok WHERE LENGTH(TRIM(CAST(:name AS VARCHAR))) > 0 AND LENGTH(TRIM(CAST(:name AS VARCHAR))) <= 120", status: 422, code: WEBSITE_SETTINGS_NAME_INVALID, message: Enter a website name between 1 and 120 characters. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(TRIM(CAST(:domain AS VARCHAR)), '') = '' OR regexp_matches(TRIM(CAST(:domain AS VARCHAR)), '^(http|https)://[^ ]+$')", status: 422, code: WEBSITE_SETTINGS_DOMAIN_INVALID, message: Enter a valid http or https website address. }
      result: { query: "SELECT id, row_version, name, name AS website_name, domain FROM website_websites WHERE id = :id" }
  - id: upload_website_favicon
    type: upload
    permission: website.manage
    action: website.settings.favicon.upload
    handler: attachment_metadata
    kind: website_favicon
    params: { id: '{row.id}', expected_row_version: '{row.row_version}' }
    refresh: [website_settings]
    mutation:
      guards:
        - { query: "SELECT id FROM website_websites WHERE id = :id", status: 404, code: WEBSITE_FAVICON_SITE_NOT_FOUND, message: Website settings no longer exist. }
        - { query: "SELECT id FROM website_websites WHERE id = :id AND row_version = :expected_row_version", status: 409, code: WEBSITE_FAVICON_STALE, message: Website settings changed before the favicon could be uploaded. Reload before trying again. }
        - { query: "SELECT 1 AS ok WHERE LOWER(CAST(:mimeType AS VARCHAR)) LIKE 'image/%' AND CAST(:sizeBytes AS BIGINT) > 0 AND CAST(:sizeBytes AS BIGINT) <= 1048576", status: 422, code: WEBSITE_FAVICON_INVALID, message: Upload an image favicon up to 1 MB. }
      steps:
        - { query: "UPDATE website_websites SET favicon_file_name = :fileName, favicon_mime_type = :mimeType, favicon_size_bytes = CAST(:sizeBytes AS BIGINT), favicon_storage_key = :storageKey, favicon_content_base64 = :contentBase64, row_version = row_version + 1, updated_at = CURRENT_TIMESTAMP WHERE id = :id AND row_version = :expected_row_version", expect_changed: true, status: 409, code: WEBSITE_FAVICON_STALE, message: Website settings changed before the favicon could be uploaded. Reload before trying again. }
      result: { query: "SELECT id, row_version, name, name AS website_name, domain, favicon_file_name, favicon_mime_type, favicon_size_bytes, CASE WHEN COALESCE(favicon_content_base64, '') <> '' THEN 'data:' || favicon_mime_type || ';base64,' || favicon_content_base64 ELSE NULL END AS favicon_data_url FROM website_websites WHERE id = :id" }
