description: Durable redirects created when a Website Page URL changes
version: 0.0.20
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS website_page_redirects (
        id VARCHAR PRIMARY KEY,
        row_version BIGINT NOT NULL DEFAULT 1,
        page_id VARCHAR NOT NULL,
        website_id VARCHAR,
        website_name VARCHAR,
        name VARCHAR NOT NULL,
        url_from VARCHAR NOT NULL,
        url_to VARCHAR NOT NULL,
        redirect_type VARCHAR NOT NULL DEFAULT '301',
        active BOOLEAN NOT NULL DEFAULT TRUE,
        sequence INTEGER NOT NULL DEFAULT 10,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS website_page_redirects_page_idx ON website_page_redirects(page_id);
      CREATE INDEX IF NOT EXISTS website_page_redirects_website_idx ON website_page_redirects(website_id);
    down: |
      DROP TABLE IF EXISTS website_page_redirects;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
