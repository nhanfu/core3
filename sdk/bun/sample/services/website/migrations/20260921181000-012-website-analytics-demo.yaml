        AND NOT EXISTS (SELECT 1 FROM website_analytics_daily WHERE id = 'website-analytics-demo-002');
      INSERT INTO website_analytics_daily(id, website_id, report_date, visitors, visits, pageviews)
      SELECT 'website-analytics-demo-003', 'website-demo-001', DATE '2026-01-14', 104, 141, 338
