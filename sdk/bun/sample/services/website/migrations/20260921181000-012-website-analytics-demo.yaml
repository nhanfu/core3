      SELECT 'website-analytics-demo-001', 'website-demo-001', DATE '2026-01-12', 82, 109, 246
      WHERE EXISTS (SELECT 1 FROM website_websites WHERE id = 'website-demo-001')
        AND NOT EXISTS (SELECT 1 FROM website_analytics_daily WHERE id = 'website-analytics-demo-001');
