version: 0.0.11
kind: schema
description: Persist first-party Website Analytics daily aggregates for the YAML dashboard
type:
  postgres:
    up: |
      ALTER TABLE website_websites ADD COLUMN IF NOT EXISTS analytics_provider VARCHAR DEFAULT 'Plausible';
      ALTER TABLE website_websites ADD COLUMN IF NOT EXISTS analytics_connected BOOLEAN DEFAULT FALSE;
      UPDATE website_websites SET analytics_provider = COALESCE(analytics_provider, 'Plausible'), analytics_connected = COALESCE(analytics_connected, FALSE);
      CREATE TABLE IF NOT EXISTS website_analytics_daily (
        id VARCHAR PRIMARY KEY,
        website_id VARCHAR NOT NULL,
        report_date DATE NOT NULL,
        visitors BIGINT NOT NULL DEFAULT 0,
        visits BIGINT NOT NULL DEFAULT 0,
        pageviews BIGINT NOT NULL DEFAULT 0,
        row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        updated_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        UNIQUE(website_id, report_date)
      );
      CREATE INDEX IF NOT EXISTS website_analytics_daily_website_date_idx ON website_analytics_daily(website_id, report_date);
    down: |
      DROP INDEX IF EXISTS website_analytics_daily_website_date_idx;
      DROP TABLE IF EXISTS website_analytics_daily;
      ALTER TABLE website_websites DROP COLUMN IF EXISTS analytics_connected;
      ALTER TABLE website_websites DROP COLUMN IF EXISTS analytics_provider;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
