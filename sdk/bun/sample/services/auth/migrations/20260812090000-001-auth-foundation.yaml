version: 0.0.1

type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS roles (
        id VARCHAR PRIMARY KEY,
        name VARCHAR NOT NULL UNIQUE,
        description VARCHAR,
        view_scope VARCHAR NOT NULL DEFAULT 'all'
      );
      CREATE TABLE IF NOT EXISTS users (
        id VARCHAR PRIMARY KEY,
        email VARCHAR NOT NULL UNIQUE,
        name VARCHAR NOT NULL,
        password_hash VARCHAR NOT NULL,
        avatar_url VARCHAR,
        preferred_lang VARCHAR DEFAULT 'en',
        enabled BOOLEAN DEFAULT true,
        branch_id VARCHAR,
        department_id VARCHAR,
        last_login TIMESTAMP,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE IF NOT EXISTS user_roles (
        user_id VARCHAR NOT NULL,
        role_id VARCHAR NOT NULL REFERENCES roles(id),
        PRIMARY KEY (user_id, role_id)
      );
      CREATE TABLE IF NOT EXISTS permissions (
        id VARCHAR PRIMARY KEY,
        role_id VARCHAR NOT NULL REFERENCES roles(id),
        permission_key VARCHAR NOT NULL
      );
      CREATE INDEX IF NOT EXISTS idx_auth_users_email ON users(email);
      CREATE INDEX IF NOT EXISTS idx_auth_user_roles_user ON user_roles(user_id);
      CREATE INDEX IF NOT EXISTS idx_auth_permissions_role ON permissions(role_id);

    down: |
      DROP TABLE IF EXISTS permissions;
      DROP TABLE IF EXISTS user_roles;
      DROP TABLE IF EXISTS users;
      DROP TABLE IF EXISTS roles;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
