version: 0.0.17
kind: schema
type:
  postgres:
    up: |
      ALTER TABLE timesheet_entries ADD COLUMN IF NOT EXISTS parent_task_id VARCHAR;
      ALTER TABLE timesheet_entries ADD COLUMN IF NOT EXISTS parent_task_name VARCHAR;
      UPDATE timesheet_entries
      SET parent_task_id = CASE
            WHEN project_id = 'project-demo-001' THEN 'parent-task-implementation'
            WHEN project_id = 'project-demo-002' THEN 'parent-task-delivery'
            ELSE parent_task_id
          END,
          parent_task_name = CASE
            WHEN project_id = 'project-demo-001' THEN 'Implementation rollout'
            WHEN project_id = 'project-demo-002' THEN 'Delivery operations'
            ELSE parent_task_name
          END;
      CREATE INDEX IF NOT EXISTS timesheet_entries_parent_task_idx ON timesheet_entries(parent_task_id, company_name, employee_name);
    down: |
      DROP INDEX IF EXISTS timesheet_entries_parent_task_idx;
      ALTER TABLE timesheet_entries DROP COLUMN IF EXISTS parent_task_name;
      ALTER TABLE timesheet_entries DROP COLUMN IF EXISTS parent_task_id;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
