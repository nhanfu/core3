type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS timesheet_entry_batches (
        id VARCHAR PRIMARY KEY,
        employee_id VARCHAR NOT NULL,
        employee_name VARCHAR NOT NULL,
        company_name VARCHAR NOT NULL,
        project_id VARCHAR NOT NULL,
        project_name VARCHAR NOT NULL,
        task_id VARCHAR,
        task_name VARCHAR,
        date_from DATE NOT NULL,
        date_to DATE NOT NULL,
        description VARCHAR NOT NULL DEFAULT '',
        hours DECIMAL(18,3) NOT NULL,
        entry_count INTEGER NOT NULL DEFAULT 0,
        state VARCHAR NOT NULL DEFAULT 'Draft',
        created_at TIMESTAMP NOT NULL DEFAULT TIMESTAMP '2026-01-15 00:00:00',
        row_version BIGINT NOT NULL DEFAULT 1
      );
      CREATE INDEX IF NOT EXISTS timesheet_entry_batches_employee_idx ON timesheet_entry_batches(company_name, employee_name, date_from, date_to);
