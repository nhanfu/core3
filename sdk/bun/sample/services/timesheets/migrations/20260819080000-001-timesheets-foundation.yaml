version: 0.0.1
type:
  postgres:
    up: |
      CREATE TABLE IF NOT EXISTS timesheet_entries (
        id VARCHAR PRIMARY KEY DEFAULT gen_random_uuid(), name VARCHAR NOT NULL UNIQUE,
        employee_id VARCHAR NOT NULL, employee_name VARCHAR NOT NULL, project_id VARCHAR,
        project_name VARCHAR, task_id VARCHAR, task_name VARCHAR, work_date DATE NOT NULL,
        description VARCHAR, hours DECIMAL(18,3) NOT NULL DEFAULT 0, billable BOOLEAN NOT NULL DEFAULT TRUE,
        unit_amount DECIMAL(18,2) NOT NULL DEFAULT 0, state VARCHAR NOT NULL DEFAULT 'Draft',
        approver VARCHAR, approved_at TIMESTAMP, row_version BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS timesheet_entries_employee_idx ON timesheet_entries(employee_id);
      CREATE INDEX IF NOT EXISTS timesheet_entries_project_idx ON timesheet_entries(project_id);
      CREATE INDEX IF NOT EXISTS timesheet_entries_state_idx ON timesheet_entries(state);
    down: |
      DROP TABLE IF EXISTS timesheet_entries;
  duckdb: postgres
  mysql: postgres
  oracle: postgres
  sqlserver: postgres
