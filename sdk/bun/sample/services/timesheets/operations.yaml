operations:
  timesheets.entries.by_task:
    result_key: timesheet_entries
    query: |
      SELECT t.id, t.row_version, t.employee_id, t.employee_name, t.name,
             CAST(t.work_date AS VARCHAR) AS work_date, t.description,
             t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER),
               CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display,
             t.project_id, t.project_name, t.task_id, t.task_name,
             t.billable, t.state
      FROM timesheet_entries t
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
        AND t.task_id = :task_id
      ORDER BY t.work_date DESC, t.id
  timesheets.entries.by_project:
    result_key: timesheet_entries
    query: |
      SELECT t.id, t.row_version, t.employee_id, t.employee_name, t.name,
             CAST(t.work_date AS VARCHAR) AS work_date, t.description,
             t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER),
               CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display,
             t.project_id, t.project_name, t.task_id, t.task_name,
             t.billable, t.state
      FROM timesheet_entries t
      JOIN timesheet_projects p ON p.id = t.project_id
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
        AND p.allow_timesheets = TRUE
        AND p.has_analytic_account = TRUE
        AND p.active = TRUE
        AND p.company_name = 'Core3 Demo Company'
        AND t.company_name = 'Core3 Demo Company'
        AND p.id = :project_id
      ORDER BY t.work_date DESC, t.id
  timesheets.entries.project_summary:
    result_key: project_timesheet_summary
    query: |
      SELECT :project_id AS project_id,
             COALESCE(SUM(t.hours), 0) AS timesheets,
             COUNT(t.id) AS timesheet_entry_count
      FROM timesheet_projects p
      LEFT JOIN timesheet_entries t ON t.project_id = p.id
        AND t.company_name = 'Core3 Demo Company'
      WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
        AND p.allow_timesheets = TRUE
        AND p.has_analytic_account = TRUE
        AND p.active = TRUE
        AND p.company_name = 'Core3 Demo Company'
        AND p.id = :project_id
      GROUP BY p.id
