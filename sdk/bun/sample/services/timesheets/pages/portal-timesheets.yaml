title: My Timesheets Portal
page: { id: timesheets-portal, route: /my/timesheets, breadcrumb: [Timesheets, Portal], auth: { require: [timesheets.read] } }
components:
  - type: ListView
    variant: odoo
    source: portal_timesheet_entries
    search: { label: Search, placeholder: 'Search description, employee, project, task, or parent task...' }
    filters:
      - { field: work_date, label: Date, options: [{ id: all, label: All }, { id: today, label: Today }, { id: this_week, label: This Week }, { id: last_week, label: Last Week }, { id: this_month, label: This Month }, { id: last_month, label: Last Month }, { id: this_quarter, label: This Quarter }, { id: last_quarter, label: Last Quarter }, { id: this_year, label: This Year }, { id: last_year, label: Last Year }] }
      - { field: sortby, label: Sort By, options: [{ id: date_desc, label: Newest }, { id: employee, label: Employee }, { id: project, label: Project }, { id: task, label: Task }, { id: description, label: Description }] }
    group_by:
      - { field: work_date, label: Date }
      - { field: project_name, label: Project }
      - { field: parent_task_name, label: Parent Task }
      - { field: task_name, label: Task }
      - { field: employee_name, label: Employee }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
    columns:
      - { field: work_date, label: Date, type: DateCell }
      - { field: employee_name, label: Employee }
      - { field: project_name, label: Project }
      - { field: task_name, label: Task }
      - { field: description, label: Description, type: PrimaryEntityCell }
      - { field: time_spent_display, label: Time Spent, align: right }
    page_size: 100
    row_key: id
    row_open_action: view_portal_timesheet_entry
    row_double_click_action: view_portal_timesheet_entry
    row_actions: menu
    empty_state: { title: There are no timesheets., description: No timesheet entries match the current portal filters. }
