title: Timesheets
page: { id: timesheet-report-preview, route: /timesheets/report-preview, breadcrumb: [Timesheets, My Timesheets, Report], auth: { require: [timesheets.read] } }
components:
  - type: OdooFormView
    source: timesheet_report_preview
    title_field: report_name
    editable: false
    labels: { save: Save, discard: Close, editDetails: Report, workflowStatus: Report }
    group_columns: 2
    header_actions:
      - { id: print_timesheet_report_preview, label: Print, permission: timesheets.read, variant: primary }
      - { id: back_to_timesheet_detail, label: Back to entry, permission: timesheets.read, variant: secondary }
    groups:
      - title: Timesheets
        fields: [{ field: report_name, label: Report }, { field: report_run_id, label: Run }, { field: entry_name, label: Entry }, { field: employee_name, label: Employee }, { field: project_name, label: Project }, { field: task_name, label: Task }]
      - title: Activity
        fields: [{ field: work_date, label: Date }, { field: time_spent_display, label: Time Spent }, { field: description, label: Description, type: textarea, wide: true }, { field: hours, label: Total Hours }, { field: generated_at, label: Generated at }, { field: requested_by, label: Requested by }]
