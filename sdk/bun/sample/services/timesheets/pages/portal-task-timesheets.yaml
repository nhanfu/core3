title: Shared Task Timesheets
page: { id: portal-task-timesheets, route: /my/projects/task/timesheets, breadcrumb: [Project, Portal, Task, Timesheets], auth: { require: [project.portal] } }
components:
  - type: ListView
    variant: odoo
    source: portal_task_timesheet_entries
    search: { label: Search, placeholder: 'Search task timesheets...' }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
      - id: kanban
        label: Kanban
        icon: dashboard
        mobile: true
        group_by: task_name
        card: { title: task_name, subtitle: employee_name, fields: [{ field: work_date, label: Date }, { field: time_spent_display, label: Time Spent }, { field: description, label: Description }] }
      - { id: form, label: Form, icon: form }
    columns:
      - { field: work_date, label: Date, type: DateCell }
      - { field: employee_name, label: Employee }
      - { field: task_name, label: Task }
      - { field: description, label: Description, type: PrimaryEntityCell }
      - { field: time_spent_display, label: Time Spent, align: right }
    form_view: { page: apps/services/timesheets/pages/portal-task-timesheet-detail.yaml, side_panel: true }
    row_key: id
    row_open_action: view_portal_task_timesheet_entry
    row_double_click_action: view_portal_task_timesheet_entry
    row_actions: menu
    page_size: 50
    empty_state: { title: No shared task timesheets, description: This portal task has no visible timesheet entries. }
