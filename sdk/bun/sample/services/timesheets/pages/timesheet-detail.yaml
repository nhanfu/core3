title: Timesheet Entry
page: { id: timesheet-detail, route: /timesheets/detail, breadcrumb: [Services, Timesheets, Detail], auth: { require: [timesheets.read] } }
components:
  - type: OdooFormView
    source: timesheet_detail
    title_field: name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: Submitted, label: Submitted }, { value: Approved, label: Approved }, { value: Rejected, label: Rejected }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, Submitted: amber, Approved: green, Rejected: red, Cancelled: violet }
    group_columns: 2
    groups:
      - title: Work
        fields: [{ field: name, label: Entry }, { field: state, label: Status }, { field: employee_name, label: Employee }, { field: project_name, label: Project }, { field: task_name, label: Task }]
      - title: Time and approval
        fields: [{ field: work_date, label: Date }, { field: hours, label: Hours }, { field: billable, label: Billable }, { field: unit_amount, label: Unit amount }, { field: description, label: Description }, { field: approver, label: Approver }, { field: approved_at, label: Approved at }]
