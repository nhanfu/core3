title: Employee Timesheets Report
page: { id: employee-timesheet-report-preview, route: /timesheets/employee-report-preview, breadcrumb: [Human Resources, Employees, Timesheets, Report], auth: { require: [timesheets.read] } }
components:
  - type: OdooFormView
    source: employee_timesheet_report_preview
    title_field: report_name
    editable: false
    labels: { save: Save, discard: Close, editDetails: Report, workflowStatus: Report }
    group_columns: 2
    header_actions:
      - { id: print_employee_timesheet_report_preview, label: Print, permission: timesheets.read, variant: primary }
      - { id: back_to_employee_timesheets, label: Back to employee timesheets, permission: timesheets.read, variant: secondary }
    groups:
      - title: Employee Timesheets
        fields: [{ field: report_name, label: Report }, { field: report_run_id, label: Run }, { field: employee_name, label: Employee }, { field: employee_id, label: Employee ID }]
      - title: Activity
        fields: [{ field: entry_count, label: Entries }, { field: total_hours, label: Total Hours }, { field: generated_at, label: Generated at }, { field: requested_by, label: Requested by }]
  - type: ListView
    variant: odoo
    source: employee_timesheet_report_lines
    columns:
      - { field: work_date, label: Date }
      - { field: project_name, label: Project }
      - { field: task_name, label: Task }
      - { field: description, label: Description }
      - { field: time_spent_display, label: Time Spent, align: right }
      - { field: state, label: Status, type: StatusChip }
    row_key: id
    page_size: 25
    empty_state: { title: No timesheets, description: This employee report has no persisted lines. }
