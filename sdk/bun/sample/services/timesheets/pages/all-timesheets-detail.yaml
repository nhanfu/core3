title: All Timesheet Entry
page: { id: all-timesheets-detail, route: /all-timesheets/detail, breadcrumb: [Services, Timesheets, All Timesheets, Entry], auth: { require: [timesheets.manage] } }
components:
  - type: OdooFormView
    source: all_timesheet_detail
    title_field: name
    status_field: state
    statusbar: [{ value: Draft, label: Draft }, { value: Submitted, label: Submitted }, { value: Approved, label: Approved }, { value: Rejected, label: Rejected }, { value: Cancelled, label: Cancelled }]
    status_colors: { Draft: neutral, Submitted: amber, Approved: green, Rejected: red, Cancelled: violet }
    editable: true
    labels: { save: Save, discard: Discard, editDetails: Edit details, workflowStatus: Status }
    header_actions:
      - { id: edit_all_timesheet_detail, label: Edit, variant: secondary, permission: timesheets.manage, show_if: "state.all_timesheet_detail.state !== 'Cancelled'" }
      - { id: approve_all_timesheet_detail, label: Approve, variant: primary, permission: timesheets.manage, show_if: "state.all_timesheet_detail.state === 'Submitted'" }
      - { id: reject_all_timesheet_detail, label: Reject, variant: danger, permission: timesheets.manage, show_if: "state.all_timesheet_detail.state === 'Submitted'" }
    group_columns: 2
    groups:
      - title: Work
        fields: [{ field: name, label: Entry }, { field: state, label: Status }, { field: employee_name, label: Employee }, { field: project_name, label: Project }, { field: task_name, label: Task }, { field: description, label: Description, type: textarea, wide: true }]
      - title: Time and approval
        fields: [{ field: work_date, label: Date }, { field: time_spent_display, label: Time Spent }, { field: hours, label: Hours }, { field: billable, label: Billable }, { field: unit_amount, label: Unit amount }, { field: sales_order_item, label: Sales Order Item }, { field: approver, label: Approver }, { field: approved_at, label: Approved at }]
