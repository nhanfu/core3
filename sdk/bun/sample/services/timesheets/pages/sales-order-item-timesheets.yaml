title: Sales Order Item Timesheets
page: { id: sales-order-item-timesheets, route: /timesheets/sales-order-item, breadcrumb: [Timesheets, Sales Order Item], auth: { require: [timesheets.manage] } }
components:
  - type: ListView
    variant: odoo
    source: sales_order_item_timesheet_entries
    default_filters: { work_date: this_week }
    search: { label: Search timesheets, placeholder: 'Search employee, project, task, or entry...' }
    filters:
      - { field: state, label: Status, options: [Draft, Submitted, Approved, Rejected, Cancelled] }
      - { field: work_date, label: Date, options: [{ id: today, label: Today }, { id: this_week, label: This Week }, { id: last_week, label: Last Week }] }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: employee_name
        mobile: false
        card: { title: project_name, subtitle: employee_name, fields: [{ field: task_name, label: Task }, { field: work_date, label: Date }, { field: time_spent_display, label: Time Spent }, { field: state, label: Status }] }
      - id: pivot
        label: Pivot
        icon: pivot
        mobile: false
        pivot:
          fields: [{ field: employee_name, column: Employee }, { field: work_date, column: Date, type: date }, { field: hours, column: Time Spent }, { field: unit_amount, column: Timesheet Costs }]
          default: { rows: [employee_name], columns: [work_date], measures: [{ field: hours, aggregate: sum, column: Time Spent }, { field: unit_amount, aggregate: sum, column: Timesheet Costs }] }
      - { id: graph, label: Graph, icon: graph, category_field: employee_name, series_field: project_name, measure_field: hours, measure_label: Time Spent, type: bar, mobile: false }
      - { id: form, label: Form, icon: form, mobile: false }
    columns:
      - { field: work_date, label: Date }
      - { field: employee_name, label: Employee }
      - { field: project_name, label: Project }
      - { field: task_name, label: Task }
      - { field: name, label: Entry, type: PrimaryEntityCell }
      - { field: description, label: Description }
      - { field: time_spent_display, label: Time Spent, align: right }
      - { field: state, label: Status, type: StatusChip, optional: hide }
    row_key: id
    row_actions: menu
    row_open_action: view_sales_order_item_timesheet_entry
    row_double_click_action: view_sales_order_item_timesheet_entry
    form_view: { page: apps/services/timesheets/pages/all-timesheets-detail.yaml, side_panel: true }
    page_size: 25
    empty_state: { title: No timesheets for this sales order item, description: Billable timesheets for the selected sales order item will appear here. }
actions:
  - { id: view_sales_order_item_timesheet_entry, type: navigate, permission: timesheets.manage, navigate_to: /all-timesheets/detail, params: { id: '{row.id}' } }
