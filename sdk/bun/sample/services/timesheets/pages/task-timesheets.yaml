title: Timesheets
page: { id: task-timesheets, route: /task-timesheets, breadcrumb: [Project, Task, Timesheets], auth: { require: [timesheets.read] } }
components:
  - type: ListView
    variant: odoo
    source: task_timesheet_entries
    create_action: create_task_timesheet_entry
    create_label: New
    header_actions:
      - { id: print_task_timesheets_report, label: Print, permission: timesheets.read, variant: secondary }
      - { id: print_task_timesheet_lines_report, label: Print lines, permission: timesheets.read, variant: secondary }
    search: { label: Search timesheets, placeholder: 'Search employee, entry, or description...' }
    default_filters: { include_subtasks: 'true' }
    filters:
      - { field: state, label: Status, options: [Draft, Submitted, Approved, Rejected, Cancelled] }
      - { field: work_date, label: Date, options: [{ id: today, label: Today }, { id: this_week, label: This Week }, { id: last_week, label: Last Week }] }
      - { field: include_subtasks, label: Include sub-tasks, options: [{ id: 'true', label: Include sub-tasks }] }
    group_by: [{ field: employee_name, label: Employee }, { field: state, label: Status }]
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table }
    columns:
      - { field: work_date, label: Date }
      - { field: employee_name, label: Employee }
      - { field: name, label: Entry }
      - { field: description, label: Description }
      - { field: parent_task_name, label: Parent Task, optional: hide }
      - { field: is_subtask, label: Sub-task, type: BooleanCell, optional: hide }
      - { field: time_spent_display, label: Time Spent, align: right }
      - { field: state, label: Status, type: StatusChip, optional: hide }
    row_key: id
    row_actions: menu
    empty_state: { title: Record a new activity, description: Track your working hours by project every day. }
    page_size: 25
  - type: StatRow
    source: task_timesheet_progress
    title: Task progress
    stats: [{ label: Allocated time, field: allocated_hours }, { label: Time spent, field: effective_hours }, { label: Remaining, field: remaining_hours }, { label: Progress %, field: progress_percent }, { label: Overtime, field: overtime_hours }]
  - type: StatRow
    source: task_timesheet_action_context
    title: Task action context
    stats: [{ label: Action title, field: action_label }]
  - type: StatRow
    source: task_timesheet_scope
    title: Task scope
    stats: [{ label: Tasks, field: task_count }, { label: Entries, field: entry_count }, { label: Total hours, field: total_hours }]
actions:
  - { id: view_task_timesheet_entry, type: navigate, permission: timesheets.read, navigate_to: /timesheets/detail, params: { id: '{row.id}', view_scope: task, task_id: '{state.task_id}' } }
