title: Timesheet Analysis
page: { id: timesheet-analysis, route: /timesheet-analysis, breadcrumb: [Services, Timesheets, Reporting], auth: { require: [timesheets.read] } }
components:
  - type: StatRow
    source: timesheet_analysis_totals
    title: Timesheet performance
    stats: [{ label: Entries, field: entry_count }, { label: Total hours, field: total_hours }, { label: Approved hours, field: approved_hours }, { label: Billable hours, field: billable_hours }]
  - type: ListView
    variant: odoo
    source: timesheet_analysis
    search: { label: Search analysis, placeholder: 'Search employee, project, or task...' }
    group_by: [{ field: employee_name, label: Employee }, { field: project_name, label: Project }, { field: task_name, label: Task }, { field: month, label: Month }]
    view_navigation: tabs
    views:
      - id: pivot
        label: Pivot
        icon: pivot
        pivot:
          fields: [{ field: employee_name, column: Employee }, { field: project_name, column: Project }, { field: task_name, column: Task }, { field: month, column: Month }, { field: hours, column: Time Spent }, { field: cost, column: Timesheet Costs }]
          default: { rows: [employee_name], columns: [month], measures: [{ field: hours, aggregate: sum, column: Time Spent }, { field: cost, aggregate: sum, column: Timesheet Costs }] }
      - id: graph
        label: Graph
        icon: graph
        category_field: project_name
        measure_field: hours
      - { id: list, label: List, icon: table }
    columns:
      - { field: employee_name, label: Employee, type: PrimaryEntityCell }
      - { field: project_name, label: Project }
      - { field: task_name, label: Task }
      - { field: month, label: Month }
      - { field: hours, label: Time Spent, align: right }
      - { field: cost, label: Timesheet Costs, align: right }
    page_size: 50
    row_key: id
