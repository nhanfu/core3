title: My Timesheets
page: { id: timesheets, route: /timesheets, breadcrumb: [Timesheets, My Timesheets], auth: { require: [timesheets.read] } }
components:
  - type: ListView
    variant: odoo
    source: timesheet_entries
    create_action: create_timesheet_entry_inline
    create_label: New
    inline_edit:
      create_action: create_timesheet_entry_inline
      update_action: edit_timesheet_entry_inline
      save_label: Save
      discard_label: Discard
      fields:
        - { field: work_date, type: date, required: true }
        - { field: project_name, type: text, required: true, placeholder: Project }
        - { field: task_name, type: text, placeholder: Task }
        - { field: name, type: text, required: true, placeholder: Describe your activity }
        - { field: hours, type: number, required: true, default: 1, placeholder: '0.00' }
    default_filters: { work_date: this_week }
    footer:
      source: timesheet_entries_summary
      stats:
        - { label: Total, field: total_time_spent_display }
    header_actions:
      - { id: create_timesheet_entry, label: New Timesheet, permission: timesheets.write, variant: primary }
      - { id: download_timesheet_import_template, label: Download import template, permission: timesheets.write, variant: secondary }
      - { id: create_timesheet_calendar_batch, label: Log multiple days, permission: timesheets.write, variant: secondary }
    search: { label: Search, placeholder: 'Search...' }
    filters:
      - { field: state, label: Status, options_source: timesheet_states }
      - { field: work_date, label: Date, options: [{ id: today, label: Today }, { id: this_week, label: This Week }, { id: last_week, label: Last Week }] }
    group_by:
      - { field: employee_name, label: Employee }
      - { field: project_name, label: Project }
      - { field: task_name, label: Task }
      - { field: parent_task_name, label: Parent Task }
      - { field: department_name, label: Department }
      - { field: manager_name, label: Manager }
      - { field: billing_type, label: Billing Type }
      - { field: state, label: Status }
    view_navigation: tabs
    views:
      - { id: list, label: List, icon: table, mobile: false }
      - id: calendar
        label: Calendar
        icon: calendar
        date_field: work_date
        card: { title: calendar_display_name, subtitle: time_spent_display, fields: [{ field: task_name, label: Task }, { field: description, label: Description }] }
      - id: kanban
        label: Kanban
        icon: dashboard
        group_by: state
        groups_source: timesheet_states
        card: { title: project_name, subtitle: time_spent_display, fields: [{ field: task_name, label: Task }, { field: description, label: Description }, { field: work_date, label: Date }] }
      - { id: form, label: Form, icon: form }
      - id: pivot
        label: Pivot
        icon: pivot
        mobile: false
        pivot:
          fields: [{ field: work_date, column: Date, type: date }, { field: project_name, column: Project }, { field: hours, column: Time Spent }, { field: cost, column: Timesheet Costs }]
          default: { rows: [work_date], columns: [], measures: [{ field: hours, aggregate: sum, column: Time Spent }, { field: cost, aggregate: sum, column: Timesheet Costs }] }
          date_ranges: { work_date: week }
      - id: graph
        label: Graph
        icon: graph
        mobile: false
        category_field: work_date
        date_field: work_date
        series_field: project_name
        measure_field: hours
        measure_label: Time Spent
        type: bar
    form_view: { page: apps/services/timesheets/pages/timesheet-detail.yaml, side_panel: true }
    row_open_action: view_timesheet_entry
    row_double_click_action: view_timesheet_entry
    column_chooser: true
    selectable: true
    columns:
      - { field: project_name, label: Project }
      - { field: task_name, label: Task }
      - { field: work_date, label: Date }
      - { field: name, label: Description }
      - { field: sales_order_item, label: Sales Order Item, optional: hide }
      - { field: hours, label: Time Spent, align: right }
      - field: id
        label: ' '
        sortable: false
        width: 52
        actions:
          - { id: edit_timesheet_entry, label: Edit, icon: edit, show_if: "row.state === 'Draft' || row.state === 'Rejected'" }
          - { id: delete_timesheet_entry, label: Delete, icon: trash, variant: danger, show_if: "row.state === 'Draft' || row.state === 'Rejected'" }
          - { id: submit_timesheet_entry, label: Submit, icon: send, show_if: "row.state === 'Draft' || row.state === 'Rejected'" }
          - { id: cancel_timesheet_entry, label: Cancel, icon: x, variant: danger, show_if: "row.state !== 'Approved' && row.state !== 'Cancelled'" }
    page_size: 25
    row_key: id
    row_actions: menu
    empty_state: { title: No timesheets, description: No timesheet entries match the current filters. }
    actions:
      - { id: submit_timesheet_entry, label: Submit, permission: timesheets.write, variant: primary, show_if: "row.state === 'Draft' || row.state === 'Rejected'" }
      - { id: approve_timesheet_entry, label: Approve, permission: timesheets.manage, variant: primary, show_if: "row.state === 'Submitted'" }
      - { id: reject_timesheet_entry, label: Reject, permission: timesheets.manage, variant: danger, show_if: "row.state === 'Submitted'" }
      - { id: cancel_timesheet_entry, label: Cancel, permission: timesheets.write, variant: danger, show_if: "row.state !== 'Approved' && row.state !== 'Cancelled'" }
actions:
  - { id: view_timesheet_entry, type: navigate, permission: timesheets.read, navigate_to: /timesheets/detail, params: { id: '{row.id}' } }
