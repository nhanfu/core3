title: Shared Task Timesheet
page: { id: portal-task-timesheet-detail, route: /my/projects/task/timesheet/detail, breadcrumb: [Project, Portal, Task, Timesheets, Entry], auth: { require: [project.portal] } }
components:
  - type: OdooFormView
    source: portal_task_timesheet_detail
    title_field: task_name
    status_field: state
    editable: false
    labels: { save: Close, discard: Close, editDetails: Timesheet, workflowStatus: Status }
    group_columns: 2
    header_actions:
      - { id: back_to_portal_task_timesheets, label: Back to task timesheets, permission: project.portal, variant: secondary }
    groups:
      - title: Work
        fields: [{ field: employee_name, label: Employee }, { field: project_name, label: Project }, { field: task_name, label: Task }, { field: description, label: Description, type: textarea, wide: true }]
      - title: Time
        fields: [{ field: work_date, label: Date }, { field: time_spent_display, label: Time Spent }, { field: hours, label: Hours }, { field: state, label: Status }]
