id: timesheets
kind: domain-service
database: duckdb
migrations: migrations
permissions: permissions.yaml
storage: storage.yaml
menu:
  timesheets:
    path: /timesheets
    label: Timesheets
    icon: clock
    permission: timesheets.read
  groups:
    - id: work
      label: Work
      items:
        - { path: /timesheets, label: Timesheets, icon: clock, permission: timesheets.read }
        - { path: /timesheet-analysis, label: Timesheet Analysis, icon: chart, permission: timesheets.read }
        - { path: /all-timesheets, label: All Timesheets, icon: users, permission: timesheets.manage }
    - id: reporting
      label: Reporting
      items:
        - { path: /timesheets-by-employee, label: By Employee, icon: users, permission: timesheets.manage }
        - { path: /timesheets-by-project, label: By Project, icon: project, permission: timesheets.manage }
        - { path: /timesheets-by-task, label: By Task, icon: task, permission: timesheets.manage }
        - { path: /timesheets-billing, label: By Billing Type, icon: chart, permission: timesheets.manage }
    - id: configuration
      label: Configuration
      items:
        - { path: /timesheets/settings, label: Configuration, icon: settings, permission: timesheets.settings }
