page: { id: employee-timesheets }
datasources:
  - id: employee_timesheet_entries
    permission: timesheets.read
    workflow: timesheet_entries
    pivot: { fields: [id, row_version, name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, time_spent_display, billable, unit_amount, state] }
    error_states: { transport_error: { status: 503, code: EMPLOYEE_TIMESHEETS_UNAVAILABLE, message: Employee timesheets are temporarily unavailable. } }
    query: "SELECT t.id, t.row_version, t.name, t.employee_id, t.employee_name, t.company_name, t.project_id, t.project_name, t.task_id, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.billable, t.unit_amount, t.state FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.employee_id = :employee_id AND (:q IS NULL OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
  - id: employee_timesheet_report_context
    single: true
    permission: timesheets.read
    error_states: { transport_error: { status: 503, code: EMPLOYEE_TIMESHEET_REPORT_CONTEXT_UNAVAILABLE, message: Employee report context is temporarily unavailable. } }
    query: "SELECT e.id AS employee_id, COALESCE(MAX(t.employee_name), e.name) AS employee_name, e.company_name, COUNT(t.id) AS entry_count, COALESCE(SUM(t.hours), 0) AS total_hours FROM timesheet_employees e LEFT JOIN timesheet_entries t ON t.employee_id = e.id AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE e.id = :employee_id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') GROUP BY e.id, e.name, e.company_name"
  - id: employee_timesheet_report_runs
    permission: timesheets.read
    error_states: { transport_error: { status: 503, code: EMPLOYEE_TIMESHEET_REPORT_RUNS_UNAVAILABLE, message: Employee report history is temporarily unavailable. } }
    query: "SELECT id, employee_id, employee_name, report_name, requested_by, CAST(generated_at AS VARCHAR) AS generated_at, entry_count, total_hours, row_version FROM timesheet_employee_report_runs WHERE employee_id = :employee_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') ORDER BY generated_at DESC, id DESC"
actions:
  - id: print_employee_timesheets_report
    type: client
    permission: timesheets.read
    script: |
      // js
      async ({ state, request }) => {
        const context = state.employee_timesheet_report_context;
        if (!context?.employee_id) throw new Error('Employee report context is unavailable');
        await request('/api/actions/timesheets.employee_entries.print_report', {
          method: 'POST',
          body: { employee_id: context.employee_id, expected_entry_count: context.entry_count, requested_by: 'Admin User', company_name: context.company_name, current_user_name: 'Admin User', current_company_name: context.company_name },
        });
        window.location.assign(`/timesheets/employee-report-preview?id=${encodeURIComponent(String(context.employee_id))}`);
      }
  - id: record_employee_timesheets_report_run
    type: server
    permission: timesheets.read
    action: timesheets.employee_entries.print_report
    handler: yaml_mutation
    operation: report
    refresh: [employee_timesheet_report_context, employee_timesheet_entries, employee_timesheet_report_runs]
    mutation:
      before_steps:
        - query: "SELECT 'timesheet-employee-report-run-' || CAST(:employee_id AS VARCHAR) || '-' || CAST((SELECT COUNT(*) + 1 FROM timesheet_employee_report_runs WHERE employee_id = :employee_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) AS VARCHAR) AS id, COALESCE(MAX(t.employee_name), e.name) AS employee_name, 'Timesheets' AS report_name, COALESCE(NULLIF(:requested_by, ''), NULLIF(:current_user_name, ''), 'Admin User') AS requested_by, COALESCE(NULLIF(:company_name, ''), NULLIF(:current_company_name, ''), 'Core3 Demo Company') AS company_name, COUNT(t.id) AS entry_count, COALESCE(SUM(t.hours), 0) AS total_hours FROM timesheet_employees e LEFT JOIN timesheet_entries t ON t.employee_id = e.id AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE e.id = :employee_id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') GROUP BY e.id, e.name, e.company_name"
          assign: true
      guards:
        - { query: "SELECT id FROM timesheet_employees WHERE id = :employee_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')", status: 404, code: EMPLOYEE_TIMESHEET_REPORT_EMPLOYEE_NOT_FOUND, message: Employee was not found in the current company. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM timesheet_entries WHERE employee_id = :employee_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'))", status: 404, code: EMPLOYEE_TIMESHEET_REPORT_EMPTY, message: This employee has no timesheets to print. }
        - { query: "SELECT 1 AS ok WHERE CAST(:expected_entry_count AS INTEGER) = (SELECT COUNT(*) FROM timesheet_entries WHERE employee_id = :employee_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'))", status: 409, code: EMPLOYEE_TIMESHEET_REPORT_STALE, message: Employee timesheets changed; reload before printing. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:requested_by, COALESCE(NULLIF(:current_user_name, ''), 'Admin User')) = COALESCE(NULLIF(:current_user_name, ''), 'Admin User')", status: 403, code: EMPLOYEE_TIMESHEET_REPORT_ACTOR, message: The report actor must match the signed-in user. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:company_name, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')", status: 403, code: EMPLOYEE_TIMESHEET_REPORT_COMPANY, message: The report company must match the signed-in company. }
      steps:
        - query: "INSERT INTO timesheet_employee_report_runs(id, employee_id, employee_name, report_name, requested_by, company_name, entry_count, total_hours, generated_at, row_version) VALUES(:id, :employee_id, :employee_name, :report_name, :requested_by, :company_name, :entry_count, :total_hours, TIMESTAMP '2026-01-15 00:00:00', 1)"
      result: { query: "SELECT id, employee_id, employee_name, report_name, requested_by, company_name, entry_count, total_hours, CAST(generated_at AS VARCHAR) AS generated_at, row_version FROM timesheet_employee_report_runs WHERE id = :id" }
  - id: create_employee_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: New employee timesheet
    action: timesheets.employee_entries.create
    handler: yaml_mutation
    operation: create
    refresh: [employee_timesheet_entries]
    mutation:
      operation: insert
      table: timesheet_entries
      fields: [name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount]
      required: [name, employee_id, employee_name, project_id, project_name, work_date, description, hours]
      defaults: { billable: true, unit_amount: 125, state: Draft, row_version: 1 }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE employee_id = :employee_id LIMIT 1", status: 404, code: EMPLOYEE_TIMESHEET_NOT_FOUND, message: Employee not found or has no timesheets. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields: [{ field: name, label: Entry, type: text, required: true }, { field: employee_id, label: Employee ID, type: text, required: true }, { field: employee_name, label: Employee, type: text, required: true }, { field: project_id, label: Project ID, type: text, required: true }, { field: project_name, label: Project, type: text, required: true }, { field: task_name, label: Task, type: text }, { field: work_date, label: Date, type: date, required: true }, { field: description, label: Description, type: textarea, required: true }, { field: hours, label: Time Spent, type: number, required: true }]
  - id: edit_employee_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: Edit employee timesheet
    action: timesheets.employee_entries.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [employee_timesheet_entries]
    mutation:
      operation: update
      table: timesheet_entries
      fields: [work_date, task_id, task_name, description, hours, billable, unit_amount]
      required: [work_date, description, hours]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND employee_id = :employee_id AND state IN ('Draft', 'Rejected')", status: 403, code: EMPLOYEE_TIMESHEET_SCOPE, message: Only draft or rejected employee timesheets can be edited. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields: [{ field: work_date, label: Date, type: date, required: true }, { field: task_name, label: Task, type: text }, { field: description, label: Description, type: textarea, required: true }, { field: hours, label: Time Spent, type: number, required: true }]
  - id: delete_employee_timesheet_entry
    type: server
    permission: timesheets.write
    action: timesheets.employee_entries.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete employee timesheet entry {{row.name}}?'
    refresh: [employee_timesheet_entries]
    mutation:
      operation: delete
      table: timesheet_entries
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM timesheet_entries WHERE id = :id AND employee_id = :employee_id AND state IN ('Draft', 'Rejected')", status: 403, code: EMPLOYEE_TIMESHEET_SCOPE, message: Only draft or rejected employee timesheets can be deleted. }]
      result: { query: "SELECT :id AS id, TRUE AS deleted" }
