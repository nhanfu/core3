page: { id: sales-order-item-timesheets }
datasources:
  - id: sales_order_item_timesheet_context
    single: true
    permission: timesheets.manage
    error_states: { transport_error: { status: 503, code: SALES_ORDER_ITEM_TIMESHEETS_CONTEXT_UNAVAILABLE, message: Sales order item timesheet context is temporarily unavailable. } }
    query: "SELECT :sales_order_item AS sales_order_item, MIN(t.project_id) AS project_id, MIN(t.project_name) AS project_name, COUNT(t.id) AS entry_count, COALESCE(SUM(t.hours), 0) AS total_hours FROM timesheet_entries t WHERE t.sales_order_item = :sales_order_item AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) = 'billable_time'"
  - id: sales_order_item_timesheet_entries
    permission: timesheets.manage
    workflow: timesheet_entries
    pivot: { fields: [id, row_version, name, company_name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, time_spent_display, billable, unit_amount, sales_order_item, billing_type, state] }
    error_states: { transport_error: { status: 503, code: SALES_ORDER_ITEM_TIMESHEETS_UNAVAILABLE, message: Sales order item timesheets are temporarily unavailable. } }
    meta: { mock_data_justification: Runtime-only persisted sales-order-item scope; static data would bypass company and relation guards., source_context: sale_timesheet.timesheet_action_from_sales_order_item, default_context: { billable_timesheet: true, week: true } }
    query: "SELECT t.id, t.row_version, t.name, t.company_name, t.employee_id, t.employee_name, t.project_id, t.project_name, t.task_id, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.billable, t.unit_amount, t.sales_order_item, COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) AS billing_type, t.state FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND t.sales_order_item = :sales_order_item AND COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) = 'billable_time' AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
