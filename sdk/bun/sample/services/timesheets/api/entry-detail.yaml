page: { id: timesheet-detail }
datasources:
  - id: timesheet_detail
    single: true
    permission: timesheets.read
    meta: { mock_data_justification: Runtime-only persisted entry detail; static mock data would hide CRUD persistence, lock state, and employee-cost calculation. }
    query: "SELECT t.id, t.row_version, t.name, t.company_name, t.employee_id, t.employee_name, t.project_id, t.project_name, t.task_id, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.sales_order_item, t.billable, t.unit_amount, CAST(t.hours * e.hourly_cost AS DECIMAL(18,2)) AS cost, t.state, t.approver, CAST(t.approved_at AS VARCHAR) AS approved_at FROM timesheet_entries t LEFT JOIN timesheet_employees e ON e.id = t.employee_id WHERE :id IS NOT NULL AND t.id = :id AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND (COALESCE(:view_scope, 'own') = 'all' OR t.employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User'))"
  - id: timesheet_detail_employees
    permission: timesheets.write
    query: "SELECT id AS value, name AS label FROM timesheet_employees WHERE active ORDER BY name, id"
  - id: timesheet_detail_projects
    permission: timesheets.write
    query: "SELECT id AS value, name AS label FROM timesheet_projects WHERE active AND allow_timesheets AND has_analytic_account ORDER BY name, id"
  - id: timesheet_detail_tasks
    permission: timesheets.write
    query: "SELECT id AS value, name AS label FROM timesheet_tasks WHERE open ORDER BY name, id"
actions:
  - id: edit_timesheet_detail
    type: server_form
    permission: timesheets.write
    title: Edit timesheet entry
    action: timesheets.entry_detail.update
    handler: yaml_mutation
    operation: update
    prefill: state.timesheet_detail
    refresh: [timesheet_detail]
    mutation:
      operation: update
      table: timesheet_entries
      concurrency: { required: true }
      fields: [work_date, project_id, project_name, task_id, task_name, description, hours, billable, unit_amount, sales_order_item]
      required: [work_date, project_name, description, hours]
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND state IN ('Draft', 'Rejected')", status: 409, code: TIMESHEET_ENTRY_LOCKED, message: Only draft or rejected timesheets can be edited }
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND state IN ('Draft', 'Rejected')", status: 403, code: TIMESHEETS_ENTRY_SCOPE, message: Only your draft or rejected timesheets can be edited. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:project_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEET_ENTRY_INVALID, message: Enter a valid date, project, and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: name, label: Entry, type: text, required: true }
      - { field: employee_id, label: Employee, type: select, options_source: timesheet_detail_employees, required: true }
      - { field: employee_name, label: Employee name, type: text, required: true }
      - { field: project_id, label: Project, type: select, options_source: timesheet_detail_projects, required: true }
      - { field: project_name, label: Project name, type: text, required: true }
      - { field: task_id, label: Task, type: select, options_source: timesheet_detail_tasks, required: true }
      - { field: task_name, label: Task name, type: text, required: true }
      - { field: work_date, label: Date, type: text, required: true }
      - { field: description, label: Description, type: textarea, required: true }
      - { field: hours, label: Hours, type: number, required: true }
      - { field: billable, label: Billable, type: checkbox }
      - { field: unit_amount, label: Unit amount, type: number }
      - { field: sales_order_item, label: Sales Order Item, type: text }
  - id: delete_timesheet_detail
    type: server
    permission: timesheets.write
    action: timesheets.entry_detail.delete
    handler: yaml_mutation
    operation: delete
    params: { id: '{state.id}' }
    refresh: [timesheet_detail, timesheet_entries]
    mutation:
      operation: delete
      table: timesheet_entries
      key_field: id
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND state IN ('Draft', 'Rejected')", status: 409, code: TIMESHEET_ENTRY_LOCKED, message: Only draft or rejected timesheets can be deleted }
      result: { query: "SELECT :id AS id" }
  - { id: submit_timesheet_detail, type: server, permission: timesheets.write, action: timesheets.entries.submit, handler: order_transition, workflow: timesheet_entries, operation: submit, params: { id: '{state.id}' }, refresh: [timesheet_detail] }
  - { id: approve_timesheet_detail, type: server, permission: timesheets.manage, action: timesheets.entries.approve, handler: order_transition, workflow: timesheet_entries, operation: approve, params: { id: '{state.id}' }, refresh: [timesheet_detail] }
  - { id: reject_timesheet_detail, type: server, permission: timesheets.manage, action: timesheets.entries.reject, handler: order_transition, workflow: timesheet_entries, operation: reject, params: { id: '{state.id}' }, refresh: [timesheet_detail] }
  - { id: cancel_timesheet_detail, type: server, permission: timesheets.write, action: timesheets.entries.cancel, handler: order_transition, workflow: timesheet_entries, operation: cancel, params: { id: '{state.id}' }, refresh: [timesheet_detail] }
