page: { id: timesheet-detail }
datasources:
  - id: timesheet_detail
    single: true
    permission: timesheets.read
    query: "SELECT id, row_version, name, employee_id, employee_name, project_id, project_name, task_id, task_name, CAST(work_date AS VARCHAR) AS work_date, description, hours, printf('%02d:%02d', CAST(FLOOR(hours) AS INTEGER), CAST(ROUND((hours - FLOOR(hours)) * 60) AS INTEGER)) AS time_spent_display, sales_order_item, billable, unit_amount, state, approver, CAST(approved_at AS VARCHAR) AS approved_at FROM timesheet_entries WHERE :id IS NOT NULL AND id = :id AND (COALESCE(:view_scope, 'own') = 'all' OR employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User'))"
actions:
  - id: edit_timesheet_detail
    type: server_form
    permission: timesheets.write
    title: Edit timesheet entry
    action: timesheets.entries.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [timesheet_detail]
    mutation:
      operation: update
      table: timesheet_entries
      fields: [work_date, project_id, project_name, task_id, task_name, description, hours, billable, unit_amount, sales_order_item]
      required: [work_date, project_name, description, hours]
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND state IN ('Draft', 'Rejected')", status: 403, code: TIMESHEETS_ENTRY_SCOPE, message: Only your draft or rejected timesheets can be edited. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:project_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date, project, and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: work_date, label: Date, type: date, required: true }
      - { field: project_id, label: Project ID, type: text }
      - { field: project_name, label: Project, type: text, required: true }
      - { field: task_id, label: Task ID, type: text }
      - { field: task_name, label: Task, type: text }
      - { field: description, label: Description, type: textarea, required: true }
      - { field: hours, label: Time Spent, type: number, required: true }
      - { field: billable, label: Billable, type: checkbox }
      - { field: unit_amount, label: Unit amount, type: number }
      - { field: sales_order_item, label: Sales Order Item, type: text }
  - { id: submit_timesheet_detail, type: server, permission: timesheets.write, action: timesheets.entries.submit, handler: order_transition, workflow: timesheet_entries, operation: submit, params: { id: '{state.id}' }, refresh: [timesheet_detail] }
  - { id: approve_timesheet_detail, type: server, permission: timesheets.manage, action: timesheets.entries.approve, handler: order_transition, workflow: timesheet_entries, operation: approve, params: { id: '{state.id}' }, refresh: [timesheet_detail] }
  - { id: reject_timesheet_detail, type: server, permission: timesheets.manage, action: timesheets.entries.reject, handler: order_transition, workflow: timesheet_entries, operation: reject, params: { id: '{state.id}' }, refresh: [timesheet_detail] }
  - { id: cancel_timesheet_detail, type: server, permission: timesheets.write, action: timesheets.entries.cancel, handler: order_transition, workflow: timesheet_entries, operation: cancel, params: { id: '{state.id}' }, refresh: [timesheet_detail] }
