page: { id: project-timesheets }
datasources:
  - id: project_timesheet_entries
    permission: timesheets.read
    workflow: timesheet_entries
    pivot: { fields: [id, row_version, name, employee_name, project_id, project_name, task_name, work_date, description, hours, time_spent_display, billable, unit_amount, state] }
    error_states: { transport_error: { status: 503, code: PROJECT_TIMESHEETS_UNAVAILABLE, message: Project timesheets are temporarily unavailable. } }
    query: "SELECT t.id, t.row_version, t.name, t.employee_name, t.project_id, t.project_name, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.billable, t.unit_amount, t.state FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.project_id = :project_id AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
  - id: project_timesheet_entry_defaults
    single: true
    permission: timesheets.write
    error_states: { transport_error: { status: 503, code: PROJECT_TIMESHEET_DEFAULTS_UNAVAILABLE, message: Project timesheet defaults are temporarily unavailable. } }
    meta: { mock_data_justification: The project context is resolved from the durable timesheetable project relation; no static form default is used. }
    query: "SELECT id AS project_id, name AS project_name, company_name FROM timesheet_projects WHERE id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1"
  - id: project_timesheet_context
    single: true
    permission: timesheets.read
    error_states: { transport_error: { status: 503, code: PROJECT_TIMESHEET_CONTEXT_UNAVAILABLE, message: Project report context is temporarily unavailable. } }
    query: "SELECT p.id, p.name AS project_name, COUNT(e.id) AS entry_count, COALESCE(SUM(e.hours), 0) AS total_hours FROM timesheet_projects p LEFT JOIN timesheet_entries e ON e.project_id = p.id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE p.id = :project_id AND p.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') GROUP BY p.id, p.name"
  - id: timesheet_project_report_runs
    permission: timesheets.read
    error_states: { transport_error: { status: 503, code: PROJECT_TIMESHEET_REPORT_RUNS_UNAVAILABLE, message: Project timesheet report history is temporarily unavailable. } }
    query: "SELECT id, project_id, project_name, requested_by, CAST(generated_at AS VARCHAR) AS generated_at, entry_count, total_hours, row_version FROM timesheet_project_report_runs WHERE project_id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') ORDER BY generated_at DESC, id DESC"
actions:
  - id: print_project_timesheets_report
    type: client
    permission: timesheets.read
    script: |
      // js
      async ({ state, request }) => {
        const context = state.project_timesheet_context;
        if (!context?.id) throw new Error('Project report context is unavailable');
        await request('/api/actions/timesheets.project_entries.print_report', {
          method: 'POST',
          body: { project_id: context.id, expected_entry_count: context.entry_count },
        });
        window.location.assign(`/timesheets/project-report-preview?id=${encodeURIComponent(String(context.id))}`);
      }
  - id: record_project_timesheets_report_run
    type: server
    permission: timesheets.read
    action: timesheets.project_entries.print_report
    handler: yaml_mutation
    operation: report
    refresh: [project_timesheet_context, project_timesheet_entries, timesheet_project_report_runs]
    mutation:
      before_steps:
        - query: "SELECT 'timesheet-project-report-run-' || CAST(:project_id AS VARCHAR) || '-' || CAST((SELECT COUNT(*) + 1 FROM timesheet_project_report_runs WHERE project_id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) AS VARCHAR) AS id, p.name AS project_name, COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AS requested_by, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AS company_name, COUNT(e.id) AS entry_count, COALESCE(SUM(e.hours), 0) AS total_hours FROM timesheet_projects p LEFT JOIN timesheet_entries e ON e.project_id = p.id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE p.id = :project_id AND p.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') GROUP BY p.id, p.name"
          assign: true
      guards:
        - { query: "SELECT id FROM timesheet_projects WHERE id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')", status: 404, code: PROJECT_TIMESHEET_REPORT_PROJECT_NOT_FOUND, message: Project was not found. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM timesheet_entries WHERE project_id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'))", status: 404, code: PROJECT_TIMESHEET_REPORT_EMPTY, message: This project has no timesheets to print. }
        - { query: "SELECT 1 AS ok WHERE CAST(:expected_entry_count AS INTEGER) = (SELECT COUNT(*) FROM timesheet_entries WHERE project_id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'))", status: 409, code: PROJECT_TIMESHEET_REPORT_STALE, message: Project timesheets changed; reload before printing. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:requested_by, COALESCE(NULLIF(:current_user_name, ''), 'Admin User')) = COALESCE(NULLIF(:current_user_name, ''), 'Admin User')", status: 403, code: PROJECT_TIMESHEET_REPORT_ACTOR, message: The report actor must match the signed-in user. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:company_name, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')", status: 403, code: PROJECT_TIMESHEET_REPORT_COMPANY, message: The report company must match the signed-in company. }
      steps:
        - query: "INSERT INTO timesheet_project_report_runs(id, project_id, project_name, requested_by, company_name, entry_count, total_hours, generated_at, row_version) VALUES(:id, :project_id, :project_name, :requested_by, :company_name, :entry_count, :total_hours, TIMESTAMP '2026-01-15 00:00:00', 1)"
      result: { query: "SELECT id, project_id, project_name, requested_by, company_name, entry_count, total_hours, CAST(generated_at AS VARCHAR) AS generated_at, row_version FROM timesheet_project_report_runs WHERE id = :id" }
  - id: create_project_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: New project timesheet
    action: timesheets.project_entries.create
    params: { context_project_id: '{state.project_id}' }
    handler: yaml_mutation
    operation: create
    prefill: source
    prefill_source: project_timesheet_entry_defaults
    refresh: [project_timesheet_entries]
    mutation:
      operation: insert
      table: timesheet_entries
      fields: [name, employee_id, employee_name, company_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount, sales_order_item]
      required: [name, project_id, project_name, work_date, description, hours]
      defaults: { employee_id: employee-demo-001, employee_name: Admin User, billable: true, unit_amount: 125, state: Draft, row_version: 1 }
      before_steps:
        - query: "SELECT name AS project_name, company_name FROM timesheet_projects WHERE id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account"
          assign: true
      steps:
        - query: "UPDATE timesheet_entries SET company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE id = :id"
      guards:
        - { query: "SELECT 1 AS ok WHERE COALESCE(NULLIF(:context_project_id, ''), :project_id) = :project_id", status: 403, code: PROJECT_TIMESHEET_CONTEXT_SCOPE, message: The new entry must stay within the selected project context. }
        - { query: "SELECT id FROM timesheet_projects WHERE id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account", status: 403, code: PROJECT_TIMESHEET_PROJECT_SCOPE, message: Select an active timesheetable project in the current company. }
        - { query: "SELECT id FROM timesheet_entries WHERE project_id = :project_id LIMIT 1", status: 404, code: PROJECT_TIMESHEET_NOT_FOUND, message: Project not found or has no timesheet entries. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:project_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date, project, and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: name, label: Entry, type: text, required: true }
      - { field: project_id, label: Project ID, type: text, required: true }
      - { field: project_name, label: Project, type: text, required: true }
      - { field: task_name, label: Task, type: text }
      - { field: work_date, label: Date, type: text, required: true }
      - { field: description, label: Description, type: textarea, required: true }
      - { field: hours, label: Time Spent, type: number, required: true }
  - id: edit_project_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: Edit project timesheet
    action: timesheets.project_entries.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [project_timesheet_entries]
    mutation:
      operation: update
      table: timesheet_entries
      fields: [work_date, task_id, task_name, description, hours, billable, unit_amount, sales_order_item]
      required: [work_date, description, hours]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND state IN ('Draft', 'Rejected')", status: 403, code: PROJECT_TIMESHEET_SCOPE, message: Only draft or rejected project timesheets can be edited. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: work_date, label: Date, type: date, required: true }
      - { field: task_name, label: Task, type: text }
      - { field: description, label: Description, type: textarea, required: true }
      - { field: hours, label: Time Spent, type: number, required: true }
      - { field: billable, label: Billable, type: checkbox }
      - { field: unit_amount, label: Unit amount, type: number }
  - id: delete_project_timesheet_entry
    type: server
    permission: timesheets.write
    action: timesheets.project_entries.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete project timesheet entry {{row.name}}?'
    refresh: [project_timesheet_entries]
    mutation:
      operation: delete
      table: timesheet_entries
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM timesheet_entries WHERE id = :id AND state IN ('Draft', 'Rejected')", status: 403, code: PROJECT_TIMESHEET_SCOPE, message: Only draft or rejected project timesheets can be deleted. }]
      result: { query: "SELECT :id AS id, TRUE AS deleted" }
  - { id: submit_project_timesheet_entry, type: server, permission: timesheets.write, action: timesheets.entries.submit, handler: order_transition, workflow: timesheet_entries, operation: submit, refresh: [project_timesheet_entries] }
