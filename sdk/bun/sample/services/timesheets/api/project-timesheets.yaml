page: { id: project-timesheets }
datasources:
  - id: project_timesheet_entries
    permission: timesheets.read
    workflow: timesheet_entries
    pivot: { fields: [id, row_version, name, employee_name, project_id, project_name, task_name, work_date, description, hours, time_spent_display, billable, unit_amount, state] }
    error_states: { transport_error: { status: 503, code: PROJECT_TIMESHEETS_UNAVAILABLE, message: Project timesheets are temporarily unavailable. } }
    query: "SELECT t.id, t.row_version, t.name, t.employee_name, t.project_id, t.project_name, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.billable, t.unit_amount, t.state FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.project_id = :project_id AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
actions:
  - id: create_project_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: New project timesheet
    action: timesheets.entries.create
    handler: yaml_mutation
    operation: create
    refresh: [project_timesheet_entries]
    mutation:
      operation: insert
      table: timesheet_entries
      fields: [name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount, sales_order_item]
      required: [name, project_id, project_name, work_date, description, hours]
      defaults: { employee_id: employee-demo-001, employee_name: Admin User, billable: true, unit_amount: 125, state: Draft, row_version: 1 }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE project_id = :project_id LIMIT 1", status: 404, code: PROJECT_TIMESHEET_NOT_FOUND, message: Project not found or has no timesheet entries. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:project_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date, project, and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: name, label: Entry, type: text, required: true }
      - { field: project_id, label: Project ID, type: text, required: true }
      - { field: project_name, label: Project, type: text, required: true }
      - { field: task_name, label: Task, type: text }
      - { field: work_date, label: Date, type: text, required: true }
      - { field: description, label: Description, type: textarea, required: true }
      - { field: hours, label: Time Spent, type: number, required: true }
  - id: edit_project_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: Edit project timesheet
    action: timesheets.entries.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [project_timesheet_entries]
    mutation:
      operation: update
      table: timesheet_entries
      fields: [work_date, task_id, task_name, description, hours, billable, unit_amount, sales_order_item]
      required: [work_date, description, hours]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND state IN ('Draft', 'Rejected')", status: 403, code: PROJECT_TIMESHEET_SCOPE, message: Only draft or rejected project timesheets can be edited. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: work_date, label: Date, type: date, required: true }
      - { field: task_name, label: Task, type: text }
      - { field: description, label: Description, type: textarea, required: true }
      - { field: hours, label: Time Spent, type: number, required: true }
      - { field: billable, label: Billable, type: checkbox }
      - { field: unit_amount, label: Unit amount, type: number }
  - id: delete_project_timesheet_entry
    type: server
    permission: timesheets.write
    action: timesheets.entries.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete project timesheet entry {{row.name}}?'
    refresh: [project_timesheet_entries]
    mutation:
      operation: delete
      table: timesheet_entries
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM timesheet_entries WHERE id = :id AND state IN ('Draft', 'Rejected')", status: 403, code: PROJECT_TIMESHEET_SCOPE, message: Only draft or rejected project timesheets can be deleted. }]
      result: { query: "SELECT :id AS id, TRUE AS deleted" }
  - { id: submit_project_timesheet_entry, type: server, permission: timesheets.write, action: timesheets.entries.submit, handler: order_transition, workflow: timesheet_entries, operation: submit, refresh: [project_timesheet_entries] }
