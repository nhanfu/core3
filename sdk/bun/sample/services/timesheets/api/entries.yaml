page: { id: timesheets }
datasources:
  - id: timesheet_employees
    permission: timesheets.write
    query: "SELECT id AS value, name AS label FROM timesheet_employees WHERE active ORDER BY name, id"
  - id: timesheet_projects
    permission: timesheets.write
    query: "SELECT id AS value, name AS label FROM timesheet_projects WHERE active AND allow_timesheets AND has_analytic_account ORDER BY name, id"
  - id: timesheet_tasks
    permission: timesheets.write
    query: "SELECT id AS value, name AS label FROM timesheet_tasks WHERE open ORDER BY name, id"
  - id: timesheet_entry_batches
    permission: timesheets.read
    meta: { mock_data_justification: Durable calendar multi-create audit records are created by the YAML action and seeded only as a deterministic demo fixture. }
    query: "SELECT id, employee_name, company_name, project_name, task_name, CAST(date_from AS VARCHAR) AS date_from, CAST(date_to AS VARCHAR) AS date_to, description, hours, entry_count, state, CAST(created_at AS VARCHAR) AS created_at, row_version FROM timesheet_entry_batches WHERE company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') ORDER BY date_from DESC, id"
  - id: timesheet_states
    permission: timesheets.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Submitted'), ('Approved','Approved'), ('Rejected','Rejected'), ('Cancelled','Cancelled')) states(value, label)"
  - id: timesheet_entries
    permission: timesheets.read
    workflow: timesheet_entries
    pivot: { fields: [id, row_version, employee_name, employee_id, department_id, department_name, manager_id, manager_name, company_name, project_name, task_name, parent_task_id, parent_task_name, work_date, description, hours, time_spent_display, time_encoding_method, cost, billable, unit_amount, state] }
    error_states: { transport_error: { status: 503, code: TIMESHEETS_ENTRIES_UNAVAILABLE, message: My Timesheets are temporarily unavailable. } }
    meta: { mock_data_justification: Runtime-only persisted entry list; static mock data would make CRUD results and permissions unverifiable. }
    query: "SELECT t.id, t.row_version, t.name, t.company_name, t.employee_id, t.employee_name, e.department_id, e.department_name, e.manager_id, e.manager_name, t.project_id, t.project_name, t.task_id, t.task_name, t.parent_task_id, t.parent_task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, CASE WHEN COALESCE(s.timesheet_encode_method, 'hours') = 'days' THEN printf('%g d', ROUND(t.hours / 8, 2)) ELSE printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) END AS time_spent_display, COALESCE(s.timesheet_encode_method, 'hours') AS time_encoding_method, t.sales_order_item, t.billable, t.unit_amount, e.hourly_cost, CAST(t.hours * e.hourly_cost AS DECIMAL(18,2)) AS cost, t.state, t.approver, CAST(t.approved_at AS VARCHAR) AS approved_at FROM timesheet_entries t JOIN timesheet_employees e ON e.id = t.employee_id LEFT JOIN timesheet_settings s ON s.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND t.employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.parent_task_name ILIKE '%' || :q || '%' OR e.department_name ILIKE '%' || :q || '%' OR e.manager_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
  - id: timesheet_entries_summary
    single: true
    permission: timesheets.read
    error_states: { transport_error: { status: 503, code: TIMESHEETS_ENTRIES_SUMMARY_UNAVAILABLE, message: My Timesheets totals are temporarily unavailable. } }
    meta: { mock_data_justification: Runtime-only persisted entry totals; a static total would make CRUD, filters, and permission scope unverifiable. }
    query: "SELECT COUNT(t.id) AS entry_count, COALESCE(SUM(t.hours), 0) AS total_hours, CASE WHEN COALESCE(MAX(s.timesheet_encode_method), 'hours') = 'days' THEN printf('%g d', ROUND(COALESCE(SUM(t.hours), 0) / 8, 2)) ELSE printf('%02d:%02d', CAST(FLOOR(COALESCE(SUM(t.hours), 0)) AS INTEGER), CAST(ROUND((COALESCE(SUM(t.hours), 0) - FLOOR(COALESCE(SUM(t.hours), 0))) * 60) AS INTEGER)) END AS total_time_spent_display, COALESCE(MAX(s.timesheet_encode_method), 'hours') AS time_encoding_method FROM timesheet_entries t LEFT JOIN timesheet_settings s ON s.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND t.employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.parent_task_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11'))"
actions:
  - id: create_timesheet_entry_inline
    type: server_form
    permission: timesheets.write
    title: New inline timesheet
    action: timesheets.entries.create_inline
    handler: yaml_mutation
    operation: create
    refresh: [timesheet_entries]
    mutation:
      operation: insert
      table: timesheet_entries
      fields: [id, name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount, state, row_version, company_name]
      required: [work_date, project_name, name, hours]
      defaults: { employee_id: employee-demo-001, employee_name: Admin User, billable: true, unit_amount: 125, state: Draft, row_version: 1, company_name: 'Core3 Demo Company' }
      generated: [id]
      before_steps:
        - query: "SELECT 'timesheet-inline-' || strftime(TRY_CAST(:work_date AS DATE), '%Y%m%d') || '-' || CAST((SELECT COUNT(*) + 1 FROM timesheet_entries WHERE name LIKE 'TS/INLINE/%') AS VARCHAR) AS id, 'TS/INLINE/' || strftime(TRY_CAST(:work_date AS DATE), '%Y%m%d') || '/' || CAST((SELECT COUNT(*) + 1 FROM timesheet_entries WHERE name LIKE 'TS/INLINE/%') AS VARCHAR) AS name, CASE COALESCE(NULLIF(:current_user_name, ''), 'Admin User') WHEN 'Demo Employee' THEN 'employee-demo-002' WHEN 'Morgan Taylor' THEN 'employee-demo-002' WHEN 'Priya Shah' THEN 'employee-demo-003' ELSE 'employee-demo-001' END AS employee_id, COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AS employee_name, (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1) AS project_id, (SELECT id FROM timesheet_tasks WHERE name = :task_name AND project_id = (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1) AND open LIMIT 1) AS task_id, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AS company_name"
          assign: true
      guards:
        - { query: "SELECT id FROM timesheet_employees WHERE name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active", status: 403, code: TIMESHEET_INLINE_EMPLOYEE_SCOPE, message: The current employee is not active in this company. }
        - { query: "SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account", status: 422, code: TIMESHEET_INLINE_PROJECT_INVALID, message: Select an active timesheetable project with an analytic account. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(NULLIF(TRIM(CAST(:task_name AS VARCHAR)), ''), '') = '' OR EXISTS (SELECT 1 FROM timesheet_tasks WHERE name = :task_name AND project_id = (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1) AND open)", status: 422, code: TIMESHEET_INLINE_TASK_INVALID, message: Select an open task belonging to the selected project. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEET_INLINE_ENTRY_INVALID, message: Enter a valid date, activity, and time between 0 and 24 hours. }
      steps:
        - query: "UPDATE timesheet_entries SET description = :name, company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'), employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User'), employee_id = CASE COALESCE(NULLIF(:current_user_name, ''), 'Admin User') WHEN 'Demo Employee' THEN 'employee-demo-002' WHEN 'Morgan Taylor' THEN 'employee-demo-002' WHEN 'Priya Shah' THEN 'employee-demo-003' ELSE 'employee-demo-001' END, project_id = (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1), task_id = (SELECT id FROM timesheet_tasks WHERE name = :task_name AND project_id = (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1) AND open LIMIT 1) WHERE id = :id"
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: work_date, label: Date, type: date, required: true }
      - { field: project_name, label: Project, type: text, required: true }
      - { field: task_name, label: Task, type: text }
      - { field: name, label: Description, type: text, required: true }
      - { field: hours, label: Time Spent, type: number, required: true }
  - id: edit_timesheet_entry_inline
    type: server_form
    permission: timesheets.write
    title: Edit inline timesheet
    action: timesheets.entries.update_inline
    handler: yaml_mutation
    operation: update
    refresh: [timesheet_entries]
    mutation:
      operation: update
      table: timesheet_entries
      fields: [work_date, project_id, project_name, task_id, task_name, name, hours, billable, unit_amount]
      required: [work_date, project_name, name, hours]
      concurrency: { required: true }
      before_steps:
        - query: "SELECT (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1) AS project_id, (SELECT id FROM timesheet_tasks WHERE name = :task_name AND project_id = (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1) AND open LIMIT 1) AS task_id"
          assign: true
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND state IN ('Draft', 'Rejected')", status: 403, code: TIMESHEET_INLINE_ENTRY_SCOPE, message: Only your draft or rejected timesheets can be edited inline. }
        - { query: "SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account", status: 422, code: TIMESHEET_INLINE_PROJECT_INVALID, message: Select an active timesheetable project with an analytic account. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(NULLIF(TRIM(CAST(:task_name AS VARCHAR)), ''), '') = '' OR EXISTS (SELECT 1 FROM timesheet_tasks WHERE name = :task_name AND project_id = (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1) AND open)", status: 422, code: TIMESHEET_INLINE_TASK_INVALID, message: Select an open task belonging to the selected project. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEET_INLINE_ENTRY_INVALID, message: Enter a valid date, activity, and time between 0 and 24 hours. }
      steps:
        - query: "UPDATE timesheet_entries SET description = :name, project_id = (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1), task_id = (SELECT id FROM timesheet_tasks WHERE name = :task_name AND project_id = (SELECT id FROM timesheet_projects WHERE name = :project_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account LIMIT 1) AND open LIMIT 1) WHERE id = :id"
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: work_date, label: Date, type: date, required: true }
      - { field: project_name, label: Project, type: text, required: true }
      - { field: task_name, label: Task, type: text }
      - { field: name, label: Description, type: text, required: true }
      - { field: hours, label: Time Spent, type: number, required: true }
  - id: create_timesheet_calendar_batch
    type: server_form
    permission: timesheets.write
    title: Log time on multiple days
    description: Create one draft timesheet entry for every date in the selected range.
    action: timesheets.entries.calendar_batch_create
    handler: yaml_mutation
    operation: create
    refresh: [timesheet_entries, timesheet_entry_batches]
    submit_label: Log time
    mutation:
      before_steps:
        - query: "SELECT 'timesheet-calendar-batch-' || regexp_replace(lower(COALESCE(NULLIF(:current_user_name, ''), 'admin-user')), '[^a-z0-9]+', '-', 'g') || '-' || CAST(:date_from AS VARCHAR) || '-' || CAST(:date_to AS VARCHAR) || '-' || CAST((SELECT COUNT(*) + 1 FROM timesheet_entry_batches WHERE employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND date_from = TRY_CAST(:date_from AS DATE) AND date_to = TRY_CAST(:date_to AS DATE)) AS VARCHAR) AS id, CASE COALESCE(NULLIF(:current_user_name, ''), 'Admin User') WHEN 'Demo Employee' THEN 'employee-demo-002' WHEN 'Morgan Taylor' THEN 'employee-demo-002' WHEN 'Priya Shah' THEN 'employee-demo-003' ELSE 'employee-demo-001' END AS employee_id, COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AS employee_name, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AS company_name, (SELECT name FROM timesheet_projects WHERE id = :project_id) AS project_name, (SELECT name FROM timesheet_tasks WHERE id = :task_id) AS task_name"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:date_from AS DATE) IS NOT NULL AND TRY_CAST(:date_to AS DATE) IS NOT NULL AND date_diff('day', TRY_CAST(:date_from AS DATE), TRY_CAST(:date_to AS DATE)) BETWEEN 0 AND 30", status: 422, code: TIMESHEET_CALENDAR_RANGE_INVALID, message: Select a date range of one to 31 days. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24", status: 422, code: TIMESHEET_CALENDAR_HOURS_INVALID, message: Time spent must be greater than 0 and no more than 24 hours per day. }
        - { query: "SELECT id FROM timesheet_employees WHERE name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active", status: 403, code: TIMESHEET_CALENDAR_EMPLOYEE_SCOPE, message: The current employee is not active in this company. }
        - { query: "SELECT id FROM timesheet_projects WHERE id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account", status: 422, code: TIMESHEET_CALENDAR_PROJECT_INVALID, message: Select an active timesheetable project with an analytic account. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(NULLIF(TRIM(CAST(:task_id AS VARCHAR)), ''), '') = '' OR EXISTS (SELECT 1 FROM timesheet_tasks WHERE id = :task_id AND project_id = :project_id AND open)", status: 422, code: TIMESHEET_CALENDAR_TASK_INVALID, message: Select an open task belonging to the selected project. }
      steps:
        - query: "INSERT INTO timesheet_entry_batches(id, employee_id, employee_name, company_name, project_id, project_name, task_id, task_name, date_from, date_to, description, hours, entry_count, state, created_at, row_version) VALUES(:id, :employee_id, :employee_name, :company_name, :project_id, :project_name, NULLIF(:task_id, ''), NULLIF(:task_name, ''), TRY_CAST(:date_from AS DATE), TRY_CAST(:date_to AS DATE), COALESCE(NULLIF(TRIM(CAST(:description AS VARCHAR)), ''), 'Calendar timesheet'), TRY_CAST(:hours AS DECIMAL(18,3)), 0, 'Draft', TIMESTAMP '2026-01-15 00:00:00', 1)"
        - query: "INSERT INTO timesheet_entries(id, name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount, state, row_version, company_name, created_at, updated_at) SELECT :id || '-entry-' || strftime(work_date, '%Y%m%d'), 'TS/BATCH/' || :id || '/' || strftime(work_date, '%Y%m%d'), :employee_id, :employee_name, :project_id, :project_name, NULLIF(:task_id, ''), NULLIF(:task_name, ''), work_date, COALESCE(NULLIF(TRIM(CAST(:description AS VARCHAR)), ''), 'Calendar timesheet'), TRY_CAST(:hours AS DECIMAL(18,3)), TRUE, 125, 'Draft', 1, :company_name, TIMESTAMP '2026-01-15 00:00:00', TIMESTAMP '2026-01-15 00:00:00' FROM generate_series(TRY_CAST(:date_from AS DATE), TRY_CAST(:date_to AS DATE), INTERVAL 1 DAY) AS series(work_date)"
        - query: "UPDATE timesheet_entry_batches SET entry_count = (SELECT COUNT(*) FROM timesheet_entries WHERE id LIKE :id || '-entry-%'), row_version = row_version + 1 WHERE id = :id"
      result: { query: "SELECT id, employee_name, company_name, project_id, project_name, task_id, task_name, CAST(date_from AS VARCHAR) AS date_from, CAST(date_to AS VARCHAR) AS date_to, description, hours, entry_count, state, row_version FROM timesheet_entry_batches WHERE id = :id" }
    fields:
      - { field: project_id, label: Project, type: select, options_source: timesheet_projects, required: true }
      - { field: task_id, label: Task, type: select, options_source: timesheet_tasks }
      - { field: date_from, label: First day, type: date, required: true }
      - { field: date_to, label: Last day, type: date, required: true }
      - { field: hours, label: Time Spent per day, type: number, required: true, min: 0.001, max: 24, step: 0.25, default: 8 }
      - { field: description, label: Description, type: textarea, placeholder: 'e.g. Sending E-mails' }
  - id: create_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: New timesheet entry
    action: timesheets.entries.create
    handler: yaml_mutation
    operation: create
    refresh: [timesheet_entries]
    mutation:
      operation: insert
      table: timesheet_entries
      fields: [name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount, sales_order_item, company_name]
      required: [name, work_date, project_name, description, hours]
      defaults: { employee_id: employee-demo-001, employee_name: Admin User, billable: true, unit_amount: 125, state: Draft, row_version: 1 }
      before_steps:
        - query: "SELECT COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AS company_name, COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AS employee_name, CASE COALESCE(NULLIF(:current_user_name, ''), 'Admin User') WHEN 'Demo Employee' THEN 'employee-demo-002' WHEN 'Morgan Taylor' THEN 'employee-demo-002' WHEN 'Priya Shah' THEN 'employee-demo-003' ELSE 'employee-demo-001' END AS employee_id"
          assign: true
      steps:
        - query: "UPDATE timesheet_entries SET company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'), employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User'), employee_id = CASE COALESCE(NULLIF(:current_user_name, ''), 'Admin User') WHEN 'Demo Employee' THEN 'employee-demo-002' WHEN 'Morgan Taylor' THEN 'employee-demo-002' WHEN 'Priya Shah' THEN 'employee-demo-003' ELSE 'employee-demo-001' END WHERE id = :id"
      guards:
        - { query: "SELECT 1 AS ok WHERE NOT EXISTS (SELECT 1 FROM timesheet_entries WHERE name = :name)", status: 409, code: TIMESHEETS_ENTRY_DUPLICATE, message: A timesheet with this entry number already exists. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:project_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEET_ENTRY_INVALID, message: Enter a valid date, project, and time between 0 and 24 hours. }
        - { query: "SELECT id FROM timesheet_employees WHERE id = :employee_id AND name = :employee_name AND active", status: 422, code: TIMESHEET_EMPLOYEE_INVALID, message: Select an active employee in this company }
        - { query: "SELECT id FROM timesheet_projects WHERE id = :project_id AND name = :project_name AND active AND allow_timesheets AND has_analytic_account", status: 422, code: TIMESHEET_PROJECT_INVALID, message: Select an active timesheetable project with an analytic account }
        - { query: "SELECT id FROM timesheet_tasks WHERE id = :task_id AND name = :task_name AND project_id = :project_id AND open", status: 422, code: TIMESHEET_TASK_INVALID, message: Select an open task belonging to the selected project }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: name, label: Entry, type: text, required: true }
      - { field: project_id, label: Project ID, type: text }
      - { field: project_name, label: Project, type: text, required: true }
      - { field: task_id, label: Task ID, type: text }
      - { field: task_name, label: Task, type: text }
      - { field: work_date, label: Date, type: text, required: true }
      - { field: description, label: Description, type: text, required: true }
      - { field: hours, label: Hours, type: number, required: true }
      - { field: billable, label: Billable, type: checkbox }
      - { field: unit_amount, label: Unit amount, type: number }
      - { field: sales_order_item, label: Sales Order Item, type: text }
  - id: edit_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: Edit timesheet entry
    action: timesheets.entries.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [timesheet_entries]
    mutation:
      operation: update
      table: timesheet_entries
      fields: [work_date, project_id, project_name, task_id, task_name, description, hours, billable, unit_amount, sales_order_item]
      required: [work_date, project_name, description, hours]
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND state IN ('Draft', 'Rejected')", status: 403, code: TIMESHEETS_ENTRY_SCOPE, message: Only your draft or rejected timesheets can be edited. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:project_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date, project, and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
      steps:
