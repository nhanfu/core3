page: { id: timesheets }
datasources:
  - id: timesheet_states
    permission: timesheets.read
    single: false
    query: "SELECT value, label FROM (VALUES ('Draft','Draft'), ('Submitted','Submitted'), ('Approved','Approved'), ('Rejected','Rejected'), ('Cancelled','Cancelled')) states(value, label)"
  - id: timesheet_entries
    permission: timesheets.read
    workflow: timesheet_entries
    error_states: { transport_error: { status: 503, code: TIMESHEETS_ENTRIES_UNAVAILABLE, message: My Timesheets are temporarily unavailable. } }
    query: "SELECT t.id, t.row_version, t.name, t.employee_id, t.employee_name, t.project_id, t.project_name, t.task_id, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.sales_order_item, t.billable, t.unit_amount, t.state, t.approver, CAST(t.approved_at AS VARCHAR) AS approved_at FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
actions:
  - id: create_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: New timesheet entry
    action: timesheets.entries.create
    handler: yaml_mutation
    operation: create
    refresh: [timesheet_entries]
    mutation:
      operation: insert
      table: timesheet_entries
      fields: [name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount, sales_order_item]
      required: [name, work_date, project_name, description, hours]
      defaults: { employee_id: employee-demo-001, employee_name: Admin User, billable: true, unit_amount: 125, state: Draft, row_version: 1 }
      guards:
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:project_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date, project, and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: name, label: Entry, type: text, required: true }
      - { field: project_id, label: Project ID, type: text }
      - { field: project_name, label: Project, type: text, required: true }
      - { field: task_id, label: Task ID, type: text }
      - { field: task_name, label: Task, type: text }
      - { field: work_date, label: Date, type: text, required: true }
      - { field: description, label: Description, type: text, required: true }
      - { field: hours, label: Hours, type: number, required: true }
      - { field: billable, label: Billable, type: checkbox }
      - { field: unit_amount, label: Unit amount, type: number }
      - { field: sales_order_item, label: Sales Order Item, type: text }
  - id: edit_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: Edit timesheet entry
    action: timesheets.entries.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [timesheet_entries]
    mutation:
      operation: update
      table: timesheet_entries
      fields: [work_date, project_id, project_name, task_id, task_name, description, hours, billable, unit_amount, sales_order_item]
      required: [work_date, project_name, description, hours]
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND state IN ('Draft', 'Rejected')", status: 403, code: TIMESHEETS_ENTRY_SCOPE, message: Only your draft or rejected timesheets can be edited. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL AND NULLIF(TRIM(CAST(:project_name AS VARCHAR)), '') IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date, project, and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields:
      - { field: work_date, label: Date, type: date, required: true }
      - { field: project_id, label: Project ID, type: text }
      - { field: project_name, label: Project, type: text, required: true }
      - { field: task_id, label: Task ID, type: text }
      - { field: task_name, label: Task, type: text }
      - { field: description, label: Description, type: textarea, required: true }
      - { field: hours, label: Time Spent, type: number, required: true }
      - { field: billable, label: Billable, type: checkbox }
      - { field: unit_amount, label: Unit amount, type: number }
      - { field: sales_order_item, label: Sales Order Item, type: text }
  - id: delete_timesheet_entry
    type: server
    permission: timesheets.write
    action: timesheets.entries.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete timesheet entry {{row.name}}?'
    refresh: [timesheet_entries]
    mutation:
      operation: delete
      table: timesheet_entries
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND state IN ('Draft', 'Rejected')", status: 403, code: TIMESHEETS_ENTRY_SCOPE, message: Only your draft or rejected timesheets can be deleted. }
      result: { query: "SELECT :id AS id, TRUE AS deleted" }
  - { id: submit_timesheet_entry, type: server, permission: timesheets.write, action: timesheets.entries.submit, handler: order_transition, workflow: timesheet_entries, operation: submit, refresh: [timesheet_entries] }
  - { id: approve_timesheet_entry, type: server, permission: timesheets.manage, action: timesheets.entries.approve, handler: order_transition, workflow: timesheet_entries, operation: approve, refresh: [timesheet_entries] }
  - { id: reject_timesheet_entry, type: server, permission: timesheets.manage, action: timesheets.entries.reject, handler: order_transition, workflow: timesheet_entries, operation: reject, refresh: [timesheet_entries] }
  - { id: cancel_timesheet_entry, type: server, permission: timesheets.write, action: timesheets.entries.cancel, handler: order_transition, workflow: timesheet_entries, operation: cancel, refresh: [timesheet_entries] }
