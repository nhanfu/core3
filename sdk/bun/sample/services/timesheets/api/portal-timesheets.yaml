page: { id: timesheets-portal }
datasources:
  - id: portal_timesheet_entries
    permission: timesheets.read
    single: false
    error_states: { transport_error: { status: 503, code: TIMESHEETS_PORTAL_UNAVAILABLE, message: Portal timesheets are temporarily unavailable. } }
    meta: { mock_data_justification: Durable portal rows are read from persisted timesheet entries; static data would hide actor/company isolation and restart behavior. }
    pivot: { fields: [id, row_version, employee_id, employee_name, company_name, project_id, project_name, task_id, task_name, work_date, description, hours, time_spent_display, state] }
    query: "SELECT t.id, t.row_version, t.employee_id, t.employee_name, t.company_name, t.project_id, t.project_name, t.task_id, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.state FROM timesheet_entries t JOIN timesheet_projects p ON p.id = t.project_id AND p.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') LEFT JOIN timesheet_portal_visibility visibility ON visibility.project_id = t.project_id AND visibility.portal_user_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND visibility.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND visibility.active WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND p.privacy_visibility IN ('invited_users', 'portal') AND (t.employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') OR visibility.relation_type IN ('project_partner', 'task_follower')) AND (COALESCE(:project_id, '') = '' OR t.project_id = :project_id) AND (COALESCE(:expected_project_row_version, '') = '' OR p.row_version = TRY_CAST(:expected_project_row_version AS BIGINT)) AND (:q IS NULL OR t.description ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%') AND (COALESCE(:work_date, '') IN ('', 'all') OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11') OR (:work_date = 'this_month' AND t.work_date BETWEEN DATE '2026-01-01' AND DATE '2026-01-31') OR (:work_date = 'last_month' AND t.work_date BETWEEN DATE '2025-12-01' AND DATE '2025-12-31') OR (:work_date = 'this_quarter' AND t.work_date BETWEEN DATE '2026-01-01' AND DATE '2026-03-31') OR (:work_date = 'last_quarter' AND t.work_date BETWEEN DATE '2025-10-01' AND DATE '2025-12-31') OR (:work_date = 'this_year' AND t.work_date BETWEEN DATE '2026-01-01' AND DATE '2026-12-31') OR (:work_date = 'last_year' AND t.work_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31')) ORDER BY CASE WHEN COALESCE(:sortby, 'date_desc') = 'employee' THEN t.employee_name END ASC, CASE WHEN COALESCE(:sortby, 'date_desc') = 'project' THEN t.project_name END ASC, CASE WHEN COALESCE(:sortby, 'date_desc') = 'task' THEN t.task_name END ASC, CASE WHEN COALESCE(:sortby, 'date_desc') = 'description' THEN t.description END ASC, CASE WHEN COALESCE(:sortby, 'date_desc') = 'date_desc' THEN t.work_date END DESC, t.id"
actions:
  - id: view_portal_timesheet_entry
    type: navigate
    permission: timesheets.read
    navigate_to: /timesheets/detail
    params: { id: '{row.id}', view_scope: own, portal_scope: true }
