page: { id: timesheets-portal }
datasources:
  - id: portal_timesheet_entries
    permission: timesheets.read
    single: false
    error_states: { transport_error: { status: 503, code: TIMESHEETS_PORTAL_UNAVAILABLE, message: Portal timesheets are temporarily unavailable. } }
    meta: { mock_data_justification: Durable portal rows are read from persisted timesheet entries; static data would hide actor/company isolation and restart behavior. }
    pivot: { fields: [id, row_version, employee_id, employee_name, company_name, project_id, project_name, task_id, task_name, work_date, description, hours, time_spent_display, state] }
    query: "SELECT t.id, t.row_version, t.employee_id, t.employee_name, t.company_name, t.project_id, t.project_name, t.task_id, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.state FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND t.employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AND (:q IS NULL OR t.description ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%') AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
actions:
  - id: view_portal_timesheet_entry
    type: navigate
    permission: timesheets.read
    navigate_to: /timesheets/detail
    params: { id: '{row.id}', view_scope: own, portal_scope: true }
