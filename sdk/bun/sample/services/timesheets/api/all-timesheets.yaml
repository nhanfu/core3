page: { id: all-timesheets }
datasources:
  - id: all_timesheet_entries
    permission: timesheets.manage
    workflow: timesheet_entries
    error_states: { transport_error: { status: 503, code: TIMESHEETS_ALL_ENTRIES_UNAVAILABLE, message: All Timesheets are temporarily unavailable. } }
    query: "SELECT t.id, t.row_version, t.name, t.employee_name, t.project_name, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.billable, t.unit_amount, t.sales_order_item, t.state, t.approver, CAST(t.approved_at AS VARCHAR) AS approved_at, CASE t.state WHEN 'Approved' THEN 'done' WHEN 'Submitted' THEN 'email' WHEN 'Rejected' THEN 'call' ELSE 'todo' END AS activity_type, CASE t.state WHEN 'Approved' THEN 'Approved timesheet' WHEN 'Submitted' THEN 'Review submitted timesheet' WHEN 'Rejected' THEN 'Review rejected timesheet' ELSE 'Review draft timesheet' END AS activity_summary, CAST(t.work_date AS VARCHAR) AS activity_date, t.employee_name AS activity_user, CASE t.state WHEN 'Approved' THEN 'done' WHEN 'Rejected' THEN 'overdue' WHEN 'Submitted' THEN 'today' ELSE 'planned' END AS activity_state, 1 AS activity_count FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
