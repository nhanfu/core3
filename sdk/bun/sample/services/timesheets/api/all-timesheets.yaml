page: { id: all-timesheets }
datasources:
  - id: all_timesheet_entries
    permission: timesheets.manage
    workflow: timesheet_entries
    pivot: { fields: [id, row_version, name, company_name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, time_spent_display, billable, unit_amount, sales_order_item, billing_type, state, approver, approved_at, activity_type, activity_summary, activity_date, activity_user, activity_state, activity_count] }
    error_states: { transport_error: { status: 503, code: TIMESHEETS_ALL_ENTRIES_UNAVAILABLE, message: All Timesheets are temporarily unavailable. } }
    meta: { mock_data_justification: Runtime-only persisted all-entry list; static mock data would bypass approver scope and workflow state., filter_contracts: [{ field: billing_type, value: billable_fixed, label: Billed at a Fixed Price, source: timesheet_entries.billing_type }, { field: billing_type, value: billable_milestones, label: Billed on Milestones, source: timesheet_entries.billing_type }] }
    query: "SELECT t.id, t.row_version, t.name, t.company_name, t.employee_id, t.employee_name, t.project_id, t.project_name, t.task_id, t.task_name, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.billable, t.unit_amount, e.hourly_cost, CAST(t.hours * e.hourly_cost AS DECIMAL(18,2)) AS cost, t.sales_order_item, COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) AS billing_type, t.state, t.approver, CAST(t.approved_at AS VARCHAR) AS approved_at, CASE t.state WHEN 'Approved' THEN 'done' WHEN 'Submitted' THEN 'email' WHEN 'Rejected' THEN 'call' ELSE 'todo' END AS activity_type, CASE t.state WHEN 'Approved' THEN 'Approved timesheet' WHEN 'Submitted' THEN 'Review submitted timesheet' WHEN 'Rejected' THEN 'Review rejected timesheet' ELSE 'Review draft timesheet' END AS activity_summary, CAST(t.work_date AS VARCHAR) AS activity_date, t.employee_name AS activity_user, CASE t.state WHEN 'Approved' THEN 'done' WHEN 'Rejected' THEN 'overdue' WHEN 'Submitted' THEN 'today' ELSE 'planned' END AS activity_state, 1 AS activity_count FROM timesheet_entries t JOIN timesheet_employees e ON e.id = t.employee_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND (:employee_id IS NULL OR t.employee_id = :employee_id) AND (:project_id IS NULL OR t.project_id = :project_id) AND (:task_id IS NULL OR t.task_id = :task_id) AND (COALESCE(:mine, '') <> 'mine' OR t.employee_name = COALESCE(NULLIF(:current_user_name, ''), 'Admin User')) AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.sales_order_item ILIKE '%' || :q || '%') AND (COALESCE(:billing_type, '') = '' OR COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) = :billing_type) AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
  - id: all_timesheet_employees
    permission: timesheets.manage
    query: "SELECT id AS value, name AS label FROM timesheet_employees WHERE active AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') ORDER BY name, id"
  - id: all_timesheet_projects
    permission: timesheets.manage
    query: "SELECT id AS value, name AS label FROM timesheet_projects WHERE active AND allow_timesheets AND has_analytic_account AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') ORDER BY name, id"
  - id: all_timesheet_tasks
    permission: timesheets.manage
    query: "SELECT id AS value, name AS label FROM timesheet_tasks WHERE open AND project_id = :project_id ORDER BY name, id"
  - id: all_timesheet_filter_tasks
    permission: timesheets.manage
    query: "SELECT t.id AS value, t.name AS label FROM timesheet_tasks t JOIN timesheet_projects p ON p.id = t.project_id WHERE t.open AND p.active AND p.allow_timesheets AND p.has_analytic_account AND p.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') ORDER BY t.name, t.id"
actions:
  - id: create_all_timesheet_calendar_batch
    type: server_form
    permission: timesheets.manage
    title: Log time for multiple days
    description: Create one draft timesheet entry for every date in the selected range for an active employee.
    action: timesheets.entries.all_calendar_batch_create
    handler: yaml_mutation
    operation: create
    refresh: [all_timesheet_entries]
    submit_label: Log time
    mutation:
      before_steps:
        - query: "SELECT 'timesheet-all-calendar-batch-' || regexp_replace(lower(COALESCE(NULLIF(:employee_name, ''), 'employee')), '[^a-z0-9]+', '-', 'g') || '-' || CAST(:date_from AS VARCHAR) || '-' || CAST(:date_to AS VARCHAR) || '-' || CAST((SELECT COUNT(*) + 1 FROM timesheet_entry_batches WHERE employee_id = :employee_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND date_from = TRY_CAST(:date_from AS DATE) AND date_to = TRY_CAST(:date_to AS DATE)) AS VARCHAR) AS id, :employee_id AS employee_id, :employee_name AS employee_name, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AS company_name, (SELECT name FROM timesheet_projects WHERE id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) AS project_name, (SELECT name FROM timesheet_tasks WHERE id = :task_id AND project_id = :project_id) AS task_name"
          assign: true
      guards:
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:date_from AS DATE) IS NOT NULL AND TRY_CAST(:date_to AS DATE) IS NOT NULL AND date_diff('day', TRY_CAST(:date_from AS DATE), TRY_CAST(:date_to AS DATE)) BETWEEN 0 AND 30", status: 422, code: TIMESHEET_ALL_CALENDAR_RANGE_INVALID, message: Select a date range of one to 31 days. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24", status: 422, code: TIMESHEET_ALL_CALENDAR_HOURS_INVALID, message: Time spent must be greater than 0 and no more than 24 hours per day. }
        - { query: "SELECT id FROM timesheet_employees WHERE id = :employee_id AND name = :employee_name AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active", status: 403, code: TIMESHEET_ALL_CALENDAR_EMPLOYEE_INVALID, message: Select an active employee in the current company. }
        - { query: "SELECT id FROM timesheet_projects WHERE id = :project_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND active AND allow_timesheets AND has_analytic_account", status: 422, code: TIMESHEET_ALL_CALENDAR_PROJECT_INVALID, message: Select an active timesheetable project in the current company. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(NULLIF(TRIM(CAST(:task_id AS VARCHAR)), ''), '') = '' OR EXISTS (SELECT 1 FROM timesheet_tasks WHERE id = :task_id AND project_id = :project_id AND open)", status: 422, code: TIMESHEET_ALL_CALENDAR_TASK_INVALID, message: Select an open task belonging to the selected project. }
      steps:
        - query: "INSERT INTO timesheet_entry_batches(id, employee_id, employee_name, company_name, project_id, project_name, task_id, task_name, date_from, date_to, description, hours, entry_count, state, created_at, row_version) VALUES(:id, :employee_id, :employee_name, :company_name, :project_id, :project_name, NULLIF(:task_id, ''), NULLIF(:task_name, ''), TRY_CAST(:date_from AS DATE), TRY_CAST(:date_to AS DATE), COALESCE(NULLIF(TRIM(CAST(:description AS VARCHAR)), ''), 'Calendar timesheet'), TRY_CAST(:hours AS DECIMAL(18,3)), 0, 'Draft', TIMESTAMP '2026-01-15 00:00:00', 1)"
        - query: "INSERT INTO timesheet_entries(id, name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount, state, row_version, company_name, created_at, updated_at) SELECT :id || '-entry-' || strftime(work_date, '%Y%m%d'), 'TS/ALL-BATCH/' || :id || '/' || strftime(work_date, '%Y%m%d'), :employee_id, :employee_name, :project_id, :project_name, NULLIF(:task_id, ''), NULLIF(:task_name, ''), work_date, COALESCE(NULLIF(TRIM(CAST(:description AS VARCHAR)), ''), 'Calendar timesheet'), TRY_CAST(:hours AS DECIMAL(18,3)), TRUE, 125, 'Draft', 1, :company_name, TIMESTAMP '2026-01-15 00:00:00', TIMESTAMP '2026-01-15 00:00:00' FROM generate_series(TRY_CAST(:date_from AS DATE), TRY_CAST(:date_to AS DATE), INTERVAL 1 DAY) AS series(work_date)"
        - query: "UPDATE timesheet_entry_batches SET entry_count = (SELECT COUNT(*) FROM timesheet_entries WHERE id LIKE :id || '-entry-%'), row_version = row_version + 1 WHERE id = :id"
      result: { query: "SELECT id, employee_id, employee_name, company_name, project_id, project_name, task_id, task_name, CAST(date_from AS VARCHAR) AS date_from, CAST(date_to AS VARCHAR) AS date_to, description, hours, entry_count, state, row_version FROM timesheet_entry_batches WHERE id = :id" }
    fields:
      - { field: employee_id, label: Employee, type: select, options_source: all_timesheet_employees, required: true }
      - { field: project_id, label: Project, type: select, options_source: all_timesheet_projects, required: true }
      - { field: task_id, label: Task, type: select, options_source: all_timesheet_tasks }
      - { field: date_from, label: First day, type: date, required: true }
      - { field: date_to, label: Last day, type: date, required: true }
      - { field: hours, label: Time Spent per day, type: number, required: true, min: 0.001, max: 24, step: 0.25, default: 8 }
      - { field: description, label: Description, type: textarea, placeholder: 'e.g. Sending E-mails' }
