page: { id: project-timesheet-report-preview }
datasources:
  - id: project_timesheet_report_preview
    single: true
    permission: timesheets.read
    error_states:
      missing_record: { status: 404, code: PROJECT_TIMESHEET_REPORT_PREVIEW_NOT_FOUND, message: The project Timesheets report is no longer available. }
      transport_error: { status: 503, code: PROJECT_TIMESHEET_REPORT_PREVIEW_UNAVAILABLE, message: The project Timesheets report preview is temporarily unavailable. }
    query: |
      SELECT
        r.id AS report_run_id,
        'Timesheets' AS report_name,
        r.project_id,
        r.project_name,
        r.entry_count,
        r.total_hours,
        r.requested_by,
        CAST(r.generated_at AS VARCHAR) AS generated_at,
        p.company_name
      FROM timesheet_project_report_runs r
      JOIN timesheet_projects p ON p.id = r.project_id
      WHERE r.project_id = :id
        AND r.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')
        AND p.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')
      ORDER BY r.generated_at DESC, r.id DESC
      LIMIT 1
  - id: project_timesheet_report_lines
    permission: timesheets.read
    pivot: { fields: [id, row_version, name, employee_name, project_id, project_name, task_name, work_date, description, hours, time_spent_display, state] }
    error_states:
      transport_error: { status: 503, code: PROJECT_TIMESHEET_REPORT_LINES_UNAVAILABLE, message: Project Timesheets report lines are temporarily unavailable. }
    query: |
      SELECT
        t.id,
        t.row_version,
        t.name,
        t.employee_name,
        t.project_id,
        t.project_name,
        t.task_name,
        CAST(t.work_date AS VARCHAR) AS work_date,
        t.description,
        t.hours,
        printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display,
        t.state
      FROM timesheet_entries t
      WHERE t.project_id = :id
        AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')
        AND CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1
      ORDER BY t.work_date DESC, t.id
actions:
  - id: print_project_timesheet_report_preview
    type: client
    permission: timesheets.read
    script: |
      // js
      async () => {
        window.print();
      }
  - id: back_to_project_timesheets
    type: navigate
    permission: timesheets.read
    navigate_to: /project-timesheets
    params: { project_id: '{state.project_timesheet_report_preview.project_id}' }
