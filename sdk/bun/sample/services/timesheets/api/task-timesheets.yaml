page: { id: task-timesheets }
datasources:
  - id: task_timesheet_entries
    permission: timesheets.read
    workflow: timesheet_entries
    pivot: { fields: [id, row_version, name, employee_id, employee_name, project_id, project_name, task_id, task_name, parent_task_id, parent_task_name, is_subtask, work_date, description, hours, time_spent_display, billable, unit_amount, state] }
    error_states: { transport_error: { status: 503, code: TASK_TIMESHEETS_UNAVAILABLE, message: Task timesheets are temporarily unavailable. } }
    query: "SELECT t.id, t.row_version, t.name, t.employee_id, t.employee_name, t.project_id, t.project_name, t.task_id, t.task_name, child.parent_task_id, child.parent_task_name, CASE WHEN t.task_id = :task_id THEN FALSE ELSE TRUE END AS is_subtask, CAST(t.work_date AS VARCHAR) AS work_date, t.description, t.hours, printf('%02d:%02d', CAST(FLOOR(t.hours) AS INTEGER), CAST(ROUND((t.hours - FLOOR(t.hours)) * 60) AS INTEGER)) AS time_spent_display, t.billable, t.unit_amount, t.state FROM timesheet_entries t JOIN timesheet_tasks child ON child.id = t.task_id WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND child.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND (t.task_id = :task_id OR (COALESCE(:include_subtasks, '') = 'true' AND child.parent_task_id = :task_id)) AND (:q IS NULL OR t.name ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') AND (:state IS NULL OR t.state = :state) AND (COALESCE(:work_date, '') = '' OR (:work_date = 'today' AND t.work_date = DATE '2026-01-15') OR (:work_date = 'this_week' AND t.work_date BETWEEN DATE '2026-01-12' AND DATE '2026-01-18') OR (:work_date = 'last_week' AND t.work_date BETWEEN DATE '2026-01-05' AND DATE '2026-01-11')) ORDER BY t.work_date DESC, t.id"
  - id: task_timesheet_context
    single: true
    permission: timesheets.read
    error_states: { transport_error: { status: 503, code: TASK_TIMESHEET_CONTEXT_UNAVAILABLE, message: Task report context is temporarily unavailable. } }
    query: "SELECT t.id, t.name AS task_name, t.project_id, COALESCE(MIN(e.project_name), '') AS project_name, COUNT(e.id) AS entry_count, COALESCE(SUM(e.hours), 0) AS total_hours FROM timesheet_tasks t LEFT JOIN timesheet_entries e ON e.task_id = t.id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE t.id = :task_id GROUP BY t.id, t.name, t.project_id"
  - id: timesheet_task_report_runs
    permission: timesheets.read
    error_states: { transport_error: { status: 503, code: TASK_TIMESHEET_REPORT_RUNS_UNAVAILABLE, message: Task timesheet report history is temporarily unavailable. } }
    query: "SELECT id, task_id, task_name, project_id, project_name, requested_by, CAST(generated_at AS VARCHAR) AS generated_at, entry_count, total_hours, row_version FROM timesheet_task_report_runs WHERE task_id = :task_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') ORDER BY generated_at DESC, id DESC"
  - id: timesheet_task_lines_report_runs
    permission: timesheets.read
    error_states: { transport_error: { status: 503, code: TASK_TIMESHEET_LINES_REPORT_RUNS_UNAVAILABLE, message: Task timesheet line report history is temporarily unavailable. } }
    query: "SELECT id, task_id, task_name, project_id, project_name, report_name, requested_by, CAST(generated_at AS VARCHAR) AS generated_at, entry_count, total_hours, row_version FROM timesheet_task_lines_report_runs WHERE task_id = :task_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') ORDER BY generated_at DESC, id DESC"
  - id: task_timesheet_progress
    single: true
    permission: timesheets.read
    pivot: { fields: [task_id, task_name, project_id, allocated_hours, effective_hours, remaining_hours, progress_percent, overtime_hours, effective_time_display, row_version] }
    error_states: { transport_error: { status: 503, code: TASK_TIMESHEET_PROGRESS_UNAVAILABLE, message: Task progress is temporarily unavailable. } }
    query: "SELECT t.id AS task_id, t.name AS task_name, t.project_id, t.allocated_hours, COALESCE(SUM(CASE WHEN e.state <> 'Cancelled' THEN e.hours ELSE 0 END), 0) AS effective_hours, CASE WHEN t.allocated_hours > 0 THEN t.allocated_hours - COALESCE(SUM(CASE WHEN e.state <> 'Cancelled' THEN e.hours ELSE 0 END), 0) ELSE 0 END AS remaining_hours, CASE WHEN t.allocated_hours > 0 THEN ROUND(COALESCE(SUM(CASE WHEN e.state <> 'Cancelled' THEN e.hours ELSE 0 END), 0) / t.allocated_hours * 100, 1) ELSE 0 END AS progress_percent, GREATEST(COALESCE(SUM(CASE WHEN e.state <> 'Cancelled' THEN e.hours ELSE 0 END), 0) - t.allocated_hours, 0) AS overtime_hours, printf('%02d:%02d', CAST(FLOOR(COALESCE(SUM(CASE WHEN e.state <> 'Cancelled' THEN e.hours ELSE 0 END), 0)) AS INTEGER), CAST(ROUND((COALESCE(SUM(CASE WHEN e.state <> 'Cancelled' THEN e.hours ELSE 0 END), 0) - FLOOR(COALESCE(SUM(CASE WHEN e.state <> 'Cancelled' THEN e.hours ELSE 0 END), 0))) * 60) AS INTEGER)) AS effective_time_display, t.row_version FROM timesheet_tasks t LEFT JOIN timesheet_entries e ON e.task_id = t.id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.id = :task_id AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') GROUP BY t.id, t.name, t.project_id, t.allocated_hours, t.row_version"
actions:
  - id: print_task_timesheets_report
    type: client
    permission: timesheets.read
    script: |
      // js
      async ({ state, request }) => {
        const context = state.task_timesheet_context;
        if (!context?.id) throw new Error('Task report context is unavailable');
        await request('/api/actions/timesheets.task_entries.print_report', {
          method: 'POST',
          body: { task_id: context.id, expected_entry_count: context.entry_count },
        });
        window.location.assign(`/timesheets/task-report-preview?id=${encodeURIComponent(String(context.id))}`);
      }
  - id: print_task_timesheet_lines_report
    type: client
    permission: timesheets.read
    script: |
      // js
      async ({ state, request }) => {
        const context = state.task_timesheet_context;
        if (!context?.id) throw new Error('Task timesheet line report context is unavailable');
        await request('/api/actions/timesheets.task_entries.print_lines_report', {
          method: 'POST',
          body: { task_id: context.id, expected_entry_count: context.entry_count },
        });
        window.location.assign(`/timesheets/task-lines-report-preview?id=${encodeURIComponent(String(context.id))}`);
      }
  - id: record_task_timesheet_lines_report_run
    type: server
    permission: timesheets.read
    action: timesheets.task_entries.print_lines_report
    handler: yaml_mutation
    operation: report
    refresh: [task_timesheet_context, task_timesheet_entries, timesheet_task_lines_report_runs]
    mutation:
      before_steps:
        - query: "SELECT 'timesheet-task-lines-report-run-' || CAST(:task_id AS VARCHAR) || '-' || CAST((SELECT COUNT(*) + 1 FROM timesheet_task_lines_report_runs WHERE task_id = :task_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) AS VARCHAR) AS id, t.name AS task_name, t.project_id, COALESCE(MIN(e.project_name), '') AS project_name, 'Timesheets' AS report_name, COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AS requested_by, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AS company_name, COUNT(e.id) AS entry_count, COALESCE(SUM(e.hours), 0) AS total_hours FROM timesheet_tasks t LEFT JOIN timesheet_entries e ON e.task_id = t.id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE t.id = :task_id GROUP BY t.id, t.name, t.project_id"
          assign: true
      guards:
        - { query: "SELECT id FROM timesheet_tasks WHERE id = :task_id", status: 404, code: TASK_TIMESHEET_LINES_REPORT_TASK_NOT_FOUND, message: Task was not found. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM timesheet_entries WHERE task_id = :task_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'))", status: 404, code: TASK_TIMESHEET_LINES_REPORT_EMPTY, message: This task has no timesheets to print. }
        - { query: "SELECT 1 AS ok WHERE CAST(:expected_entry_count AS INTEGER) = (SELECT COUNT(*) FROM timesheet_entries WHERE task_id = :task_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'))", status: 409, code: TASK_TIMESHEET_LINES_REPORT_STALE, message: Task timesheet lines changed; reload before printing. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:requested_by, COALESCE(NULLIF(:current_user_name, ''), 'Admin User')) = COALESCE(NULLIF(:current_user_name, ''), 'Admin User')", status: 403, code: TASK_TIMESHEET_LINES_REPORT_ACTOR, message: The report actor must match the signed-in user. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:company_name, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')", status: 403, code: TASK_TIMESHEET_LINES_REPORT_COMPANY, message: The report company must match the signed-in company. }
      steps:
        - query: "INSERT INTO timesheet_task_lines_report_runs(id, task_id, task_name, project_id, project_name, report_name, requested_by, company_name, entry_count, total_hours, generated_at, row_version) VALUES(:id, :task_id, :task_name, :project_id, :project_name, :report_name, :requested_by, :company_name, :entry_count, :total_hours, TIMESTAMP '2026-01-15 00:00:00', 1)"
      result: { query: "SELECT id, task_id, task_name, project_id, project_name, report_name, requested_by, company_name, entry_count, total_hours, CAST(generated_at AS VARCHAR) AS generated_at, row_version FROM timesheet_task_lines_report_runs WHERE id = :id" }
  - id: record_task_timesheets_report_run
    type: server
    permission: timesheets.read
    action: timesheets.task_entries.print_report
    handler: yaml_mutation
    operation: report
    refresh: [task_timesheet_context, task_timesheet_entries, timesheet_task_report_runs]
    mutation:
      before_steps:
        - query: "SELECT 'timesheet-task-report-run-' || CAST(:task_id AS VARCHAR) || '-' || CAST((SELECT COUNT(*) + 1 FROM timesheet_task_report_runs WHERE task_id = :task_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) AS VARCHAR) AS id, t.name AS task_name, t.project_id, COALESCE(MIN(e.project_name), '') AS project_name, COALESCE(NULLIF(:current_user_name, ''), 'Admin User') AS requested_by, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AS company_name, COUNT(e.id) AS entry_count, COALESCE(SUM(e.hours), 0) AS total_hours FROM timesheet_tasks t LEFT JOIN timesheet_entries e ON e.task_id = t.id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE t.id = :task_id GROUP BY t.id, t.name, t.project_id"
          assign: true
      guards:
        - { query: "SELECT id FROM timesheet_tasks WHERE id = :task_id", status: 404, code: TASK_TIMESHEET_REPORT_TASK_NOT_FOUND, message: Task was not found. }
        - { query: "SELECT 1 AS ok WHERE EXISTS (SELECT 1 FROM timesheet_entries WHERE task_id = :task_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'))", status: 404, code: TASK_TIMESHEET_REPORT_EMPTY, message: This task has no timesheets to print. }
        - { query: "SELECT 1 AS ok WHERE CAST(:expected_entry_count AS INTEGER) = (SELECT COUNT(*) FROM timesheet_entries WHERE task_id = :task_id AND company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company'))", status: 409, code: TASK_TIMESHEET_REPORT_STALE, message: Task timesheets changed; reload before printing. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:requested_by, COALESCE(NULLIF(:current_user_name, ''), 'Admin User')) = COALESCE(NULLIF(:current_user_name, ''), 'Admin User')", status: 403, code: TASK_TIMESHEET_REPORT_ACTOR, message: The report actor must match the signed-in user. }
        - { query: "SELECT 1 AS ok WHERE COALESCE(:company_name, COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')) = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company')", status: 403, code: TASK_TIMESHEET_REPORT_COMPANY, message: The report company must match the signed-in company. }
      steps:
        - query: "INSERT INTO timesheet_task_report_runs(id, task_id, task_name, project_id, project_name, requested_by, company_name, entry_count, total_hours, generated_at, row_version) VALUES(:id, :task_id, :task_name, :project_id, :project_name, :requested_by, :company_name, :entry_count, :total_hours, TIMESTAMP '2026-01-15 00:00:00', 1)"
      result: { query: "SELECT id, task_id, task_name, project_id, project_name, requested_by, company_name, entry_count, total_hours, CAST(generated_at AS VARCHAR) AS generated_at, row_version FROM timesheet_task_report_runs WHERE id = :id" }
  - id: create_task_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: New task timesheet
    action: timesheets.task_entries.create
    handler: yaml_mutation
    operation: create
    refresh: [task_timesheet_entries]
    mutation:
      operation: insert
      table: timesheet_entries
      fields: [name, employee_id, employee_name, project_id, project_name, task_id, task_name, work_date, description, hours, billable, unit_amount]
      required: [name, task_id, task_name, project_id, project_name, work_date, description, hours]
      defaults: { employee_id: employee-demo-001, employee_name: Admin User, billable: true, unit_amount: 125, state: Draft, row_version: 1 }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE task_id = :task_id LIMIT 1", status: 404, code: TASK_TIMESHEET_NOT_FOUND, message: Task not found or has no timesheets. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields: [{ field: name, label: Entry, type: text, required: true }, { field: task_id, label: Task ID, type: text, required: true }, { field: task_name, label: Task, type: text, required: true }, { field: project_id, label: Project ID, type: text, required: true }, { field: project_name, label: Project, type: text, required: true }, { field: employee_name, label: Employee, type: text }, { field: work_date, label: Date, type: date, required: true }, { field: description, label: Description, type: textarea, required: true }, { field: hours, label: Time Spent, type: number, required: true }]
  - id: edit_task_timesheet_entry
    type: server_form
    permission: timesheets.write
    title: Edit task timesheet
    action: timesheets.task_entries.update
    handler: yaml_mutation
    operation: update
    prefill: row
    refresh: [task_timesheet_entries]
    mutation:
      operation: update
      table: timesheet_entries
      fields: [work_date, description, hours, billable, unit_amount]
      required: [work_date, description, hours]
      concurrency: { required: true }
      guards:
        - { query: "SELECT id FROM timesheet_entries WHERE id = :id AND task_id = :task_id AND state IN ('Draft', 'Rejected')", status: 403, code: TASK_TIMESHEET_SCOPE, message: Only draft or rejected task timesheets can be edited. }
        - { query: "SELECT 1 AS ok WHERE TRY_CAST(:hours AS DECIMAL(18,3)) > 0 AND TRY_CAST(:hours AS DECIMAL(18,3)) <= 24 AND TRY_CAST(:work_date AS DATE) IS NOT NULL", status: 422, code: TIMESHEETS_ENTRY_INVALID, message: Enter a valid date and time between 0 and 24 hours. }
      result: { query: "SELECT * FROM timesheet_entries WHERE id = :id" }
    fields: [{ field: work_date, label: Date, type: date, required: true }, { field: description, label: Description, type: textarea, required: true }, { field: hours, label: Time Spent, type: number, required: true }, { field: billable, label: Billable, type: checkbox }, { field: unit_amount, label: Unit amount, type: number }]
  - id: delete_task_timesheet_entry
    type: server
    permission: timesheets.write
    action: timesheets.task_entries.delete
    handler: yaml_mutation
    operation: delete
    confirm: 'Delete task timesheet entry {{row.name}}?'
    refresh: [task_timesheet_entries]
    mutation:
      operation: delete
      table: timesheet_entries
      concurrency: { required: true }
      guards: [{ query: "SELECT id FROM timesheet_entries WHERE id = :id AND task_id = :task_id AND state IN ('Draft', 'Rejected')", status: 403, code: TASK_TIMESHEET_SCOPE, message: Only draft or rejected task timesheets can be deleted. }]
      result: { query: "SELECT :id AS id, TRUE AS deleted" }
