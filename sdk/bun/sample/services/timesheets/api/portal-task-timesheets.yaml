page: { id: portal-task-timesheets }
datasources:
  - id: portal_task_timesheet_entries
    permission: project.portal
    workflow: timesheet_entries
    pivot: { fields: [id, row_version, employee_id, employee_name, company_name, project_id, project_name, task_id, task_name, work_date, description, hours, time_spent_display, state] }
    error_states: { transport_error: { status: 503, code: PORTAL_TASK_TIMESHEETS_UNAVAILABLE, message: Shared task timesheets are temporarily unavailable. } }
    query: "SELECT e.id, e.row_version, e.employee_id, e.employee_name, e.company_name, e.project_id, e.project_name, e.task_id, e.task_name, CAST(e.work_date AS VARCHAR) AS work_date, e.description, e.hours, printf('%02d:%02d', CAST(FLOOR(e.hours) AS INTEGER), CAST(ROUND((e.hours - FLOOR(e.hours)) * 60) AS INTEGER)) AS time_spent_display, e.state FROM timesheet_entries e JOIN timesheet_tasks child ON child.id = e.task_id JOIN timesheet_task_portal_access access ON access.task_id = :task_id AND access.portal_user_name = COALESCE(NULLIF(:current_user_name, ''), 'Portal User') AND access.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND access.active WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND child.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND (e.task_id = :task_id OR child.parent_task_id = :task_id) AND (COALESCE(:expected_task_row_version, '') = '' OR child.row_version = TRY_CAST(:expected_task_row_version AS BIGINT)) ORDER BY e.work_date DESC, e.id"
  - id: portal_task_timesheet_hours
    permission: project.portal
    single: true
    error_states: { transport_error: { status: 503, code: PORTAL_TASK_TIMESHEET_HOURS_UNAVAILABLE, message: Shared task timesheet hours are temporarily unavailable. } }
    query: "SELECT task.id AS task_id, task.name AS task_name, task.allocated_hours, COALESCE(SUM(CASE WHEN e.task_id = task.id THEN e.hours ELSE 0 END), 0) AS effective_hours, task.allocated_hours - COALESCE(SUM(CASE WHEN e.task_id = task.id THEN e.hours ELSE 0 END), 0) AS remaining_hours, CASE WHEN task.allocated_hours > 0 THEN ROUND(COALESCE(SUM(CASE WHEN e.task_id = task.id THEN e.hours ELSE 0 END), 0) * 100 / task.allocated_hours, 2) ELSE 0 END AS progress_percent, printf('%02d:%02d', CAST(FLOOR(COALESCE(SUM(CASE WHEN e.task_id = task.id THEN e.hours ELSE 0 END), 0)) AS INTEGER), CAST(ROUND((COALESCE(SUM(CASE WHEN e.task_id = task.id THEN e.hours ELSE 0 END), 0) - FLOOR(COALESCE(SUM(CASE WHEN e.task_id = task.id THEN e.hours ELSE 0 END), 0))) * 60) AS INTEGER)) AS effective_time_spent FROM timesheet_tasks task JOIN timesheet_task_portal_access access ON access.task_id = task.id AND access.portal_user_name = COALESCE(NULLIF(:current_user_name, ''), 'Portal User') AND access.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND access.active LEFT JOIN timesheet_entries e ON e.task_id = task.id AND e.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND task.id = :task_id AND task.allow_timesheets AND task.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND (COALESCE(:expected_task_row_version, '') = '' OR task.row_version = TRY_CAST(:expected_task_row_version AS BIGINT)) GROUP BY task.id, task.name, task.allocated_hours"
actions:
  - id: view_portal_task_timesheet_entry
    type: navigate
    permission: project.portal
    navigate_to: /my/projects/task/timesheet/detail
    params: { id: '{row.id}', task_id: '{state.task_id}', expected_task_row_version: '{state.task_row_version}' }
