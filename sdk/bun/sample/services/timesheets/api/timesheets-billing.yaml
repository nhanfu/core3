page: { id: timesheets-billing }
datasources:
  - id: timesheet_report_by_billing_type
    permission: timesheets.manage
    single: false
    pivot: { fields: [id, date, month, billing_type, project_name, employee_name, task_name, amount, unit_amount, billable_time, non_billable_time, state] }
    query: "SELECT t.id, CAST(t.work_date AS DATE) AS date, CAST(strftime(t.work_date, '%Y_%m') AS VARCHAR) AS month, CASE COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) WHEN 'billable_fixed' THEN 'Billed at a Fixed Price' WHEN 'billable_manual' THEN 'Billed Manually' WHEN 'billable_milestones' THEN 'Billed on Milestones' WHEN 'billable_time' THEN 'Billed on Timesheets' ELSE 'Non-Billable' END AS billing_type, t.project_name, t.employee_name, t.task_name, CAST(-t.hours * t.unit_amount AS DECIMAL(18,2)) AS amount, CAST(t.hours AS DECIMAL(18,3)) AS unit_amount, CAST(CASE WHEN COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) = 'non_billable' THEN 0 ELSE t.hours END AS DECIMAL(18,3)) AS billable_time, CAST(CASE WHEN COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) = 'non_billable' THEN t.hours ELSE 0 END AS DECIMAL(18,3)) AS non_billable_time, t.state FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.project_name IS NOT NULL AND (:q IS NULL OR (CASE COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) WHEN 'billable_fixed' THEN 'Billed at a Fixed Price' WHEN 'billable_manual' THEN 'Billed Manually' WHEN 'billable_milestones' THEN 'Billed on Milestones' WHEN 'billable_time' THEN 'Billed on Timesheets' ELSE 'Non-Billable' END) ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') ORDER BY t.work_date DESC, t.billing_type, t.id"
