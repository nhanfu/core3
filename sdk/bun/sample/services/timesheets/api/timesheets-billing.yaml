page: { id: timesheets-billing }
datasources:
  - id: timesheet_report_by_billing_type
    permission: timesheets.manage
    single: false
    pivot: { fields: [id, date, month, billing_type, employee_id, employee_name, company_name, project_id, project_name, task_id, task_name, amount, unit_amount, billable_time, non_billable_time, state] }
    error_states:
      transport_error: { status: 503, code: TIMESHEETS_REPORT_BY_BILLING_TYPE_UNAVAILABLE, message: Timesheets by billing type report is unavailable. }
    query: "SELECT t.id, CAST(t.work_date AS DATE) AS date, CAST(strftime(t.work_date, '%Y_%m') AS VARCHAR) AS month, CASE COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) WHEN 'billable_fixed' THEN 'Billed at a Fixed Price' WHEN 'billable_manual' THEN 'Billed Manually' WHEN 'billable_milestones' THEN 'Billed on Milestones' WHEN 'billable_time' THEN 'Billed on Timesheets' ELSE 'Non-Billable' END AS billing_type, t.employee_id, t.employee_name, t.company_name, t.project_id, t.project_name, t.task_id, t.task_name, CAST(-t.hours * t.unit_amount AS DECIMAL(18,2)) AS amount, CAST(t.hours AS DECIMAL(18,3)) AS unit_amount, CAST(CASE WHEN COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) = 'non_billable' THEN 0 ELSE t.hours END AS DECIMAL(18,3)) AS billable_time, CAST(CASE WHEN COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) = 'non_billable' THEN t.hours ELSE 0 END AS DECIMAL(18,3)) AS non_billable_time, t.state FROM timesheet_entries t WHERE CASE WHEN COALESCE(:fixture_state, '') IN ('empty', 'not_found') THEN 0 ELSE 1 END = 1 AND t.company_name = COALESCE(NULLIF(:current_company_name, ''), 'Core3 Demo Company') AND t.project_name IS NOT NULL AND (:q IS NULL OR (CASE COALESCE(t.billing_type, CASE WHEN t.billable THEN 'billable_time' ELSE 'non_billable' END) WHEN 'billable_fixed' THEN 'Billed at a Fixed Price' WHEN 'billable_manual' THEN 'Billed Manually' WHEN 'billable_milestones' THEN 'Billed on Milestones' WHEN 'billable_time' THEN 'Billed on Timesheets' ELSE 'Non-Billable' END) ILIKE '%' || :q || '%' OR t.project_name ILIKE '%' || :q || '%' OR t.employee_name ILIKE '%' || :q || '%' OR t.task_name ILIKE '%' || :q || '%' OR t.description ILIKE '%' || :q || '%') ORDER BY t.work_date DESC, t.billing_type, t.id"
actions:
  - id: view_billing_report_entry
    type: navigate
    permission: timesheets.manage
    navigate_to: /timesheets/detail
    params: { id: '{row.id}', view_scope: all, report_scope: billing }
