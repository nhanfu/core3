# Application and module configuration consumed by the host.
# CORE3_ENV selects the database environment; paths can be overridden by env.
services:
  auth:
    database:
      driver: duckdb
      path:
        development: ${CORE3_AUTH_DB_PATH:-../coredb/auth.duckdb}
        production: ${CORE3_AUTH_DB_PATH:-../coredb/auth.duckdb}

  # Order storage is declared independently so the YAML service can acquire
  # its own database adapter for the Order service.
  order:
    database:
      driver: duckdb
      path:
        development: ${CORE3_ORDER_DB_PATH:-../coredb/order.duckdb}
        production: ${CORE3_ORDER_DB_PATH:-../coredb/order.duckdb}

  # Shared chat storage. This is intentionally independent of Order storage so
  # other applications can use the same conversations and participants.
  chat:
    database:
      driver: duckdb
      path:
        development: ${CORE3_CHAT_DB_PATH:-../coredb/chat.duckdb}
        production: ${CORE3_CHAT_DB_PATH:-../coredb/chat.duckdb}
    event_schema:
      table: event_log
      columns:
        - { name: id, type: varchar, source: id, nullable: false }
        - { name: sequence, type: bigint, source: sequence, nullable: false }
        - { name: event_at, type: bigint, source: at, nullable: false }
        - { name: topic, type: varchar, source: topic }
        - { name: event_key, type: varchar, source: key }
        - { name: source_node, type: varchar, source: sourceNode }
        - { name: operation, type: varchar }
        - { name: status, type: varchar }
        - { name: actor_id, type: varchar, source: actorId }
        - { name: client_message_id, type: varchar, source: clientMessageId }
        - { name: message_id, type: varchar, source: messageId }
        - { name: error, type: varchar }
        - { name: thread_id, type: varchar, source: threadId }
        - { name: message_thread_id, type: varchar, source: message.thread_id }
        - { name: message_sender_id, type: varchar, source: message.sender_id }
        - { name: message_sender_name, type: varchar, source: message.sender_name }
        - { name: message_body, type: varchar, source: message.body }
        - { name: message_created_at, type: varchar, source: message.created_at }
        - { name: message_attachment_id, type: varchar, source: message.attachment.id }
        - { name: message_attachment_file_name, type: varchar, source: message.attachment.file_name }
        - { name: message_attachment_mime_type, type: varchar, source: message.attachment.mime_type }
        - { name: message_attachment_size_bytes, type: bigint, source: message.attachment.size_bytes }

  # Shared durable event stream used by chat and future real-time features.
  event_store:
    mode: ${CORE3_EVENT_MODE:-embedded}
    mediator:
      endpoint: ${CORE3_EVENT_MEDIATOR_URL:-ws://127.0.0.1:3010/events}
      token: ${CORE3_EVENT_MEDIATOR_TOKEN:-}
      node_id: ${CORE3_NODE_ID:-}
      reconnect_ms: ${CORE3_EVENT_MEDIATOR_RECONNECT_MS:-1000}
    database:
      driver: parquet
      path:
        development: ${CORE3_EVENT_DB_PATH:-../coredb/events-parquet}
        production: ${CORE3_EVENT_DB_PATH:-../coredb/events-parquet}
    retention_ms: ${CORE3_EVENT_RETENTION_MS:-3600000}
    max_rows: ${CORE3_EVENT_MAX_ROWS:-1000}
    hot_max_rows: ${CORE3_EVENT_HOT_MAX_ROWS:-100000}
    hot_max_bytes: ${CORE3_EVENT_HOT_MAX_BYTES:-134217728}
    hot_retention_ms: ${CORE3_EVENT_HOT_RETENTION_MS:-3600000}
    hot_consumer_ttl_ms: ${CORE3_EVENT_HOT_CONSUMER_TTL_MS:-30000}
    segment_max_rows: ${CORE3_EVENT_SEGMENT_MAX_ROWS:-1000}
    pull_batch_size: ${CORE3_EVENT_PULL_BATCH_SIZE:-100}
    reader_connections: ${CORE3_EVENT_READER_CONNECTIONS:-2}
    buffer_max_rows: ${CORE3_EVENT_BUFFER_MAX_ROWS:-10000}
    write_mode: ${CORE3_EVENT_WRITE_MODE:-low_latency}

apps:
  - id: order
    label: Orders
    description: Order management
    icon: truck
    route: /orders
    module: order
    enabled: true
  - id: chat
    label: Chat
    description: Conversations and collaboration
    icon: message
    route: /chat/chat
    module: chat
    enabled: true
