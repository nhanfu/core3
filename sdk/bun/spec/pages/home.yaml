      - id: differentiators
        kicker: Why it holds up under real ERP load
        title: Four properties, not four features
        lead: >-
          These aren't bullet points bolted on for marketing — each one is a concrete, load-bearing
          design decision made in the gate service plan, not an aspiration.
        blocks:
          - type: cardgrid
            cards:
              - tag: Declarative
                title: It's the spec, not a hint
                body: Business intent lives only in YAML. A bug is either a spec problem (fix the business definition) or a runtime problem (fix the engine once) — never both at once.
              - tag: Portable
                title: No database lock-in
                body: PostgreSQL, DuckDB, MySQL, Oracle, and SQL Server all sit behind one DatabaseAdapter interface. Every CAS pattern is provably driver-agnostic, not just untested on the others.
              - tag: Auditable
                title: Every dispatch is on the record
                body: The gate durably writes an event/audit envelope for every client and service call to Parquet — not a logging afterthought bolted onto services individually.
              - tag: Consistent
                title: Cancellation and sagas are protocol, not convention
                body: Long-running operations and multi-step cross-service flows carry operation_id/cancellation_id end to end, with compensation as a first-class state, not a try/catch someone forgot.

      - id: quote
        kicker: Working principle
        title: The rule this whole framework runs on
        blocks:
          - type: quote
            text: >-
              When the same structure appears in two pages, write a YAML shorthand for it. When it
              appears in three, it becomes a first-class framework concept.
            attribution: 'Core3 working principle — see Roadmap: Pattern extraction'

      - id: scale
        kicker: Scale of the ambition
        title: 'Tracked against real Odoo, not a wish list'
        lead: >-
          The roadmap's module tracker uses Odoo's own app categories as the literal checklist —
          reported honestly against what has actually shipped.
        blocks:
          - type: stats
            items:
              - value: '8'
                label: Odoo app categories mapped
                visual: chips
                items: [Sales, Finance, Supply Chain, HR, Marketing, Services, Productivity, Website]
              - value: '43'
                label: modules and sub-modules tracked
                visual: units
              - value: '2'
                label: in progress today
                visual: chips
                items: [Sales, Discuss]
          - type: list
            items:
              - text: See the full module-by-module tracker on the Roadmap
                href: /roadmap

      - id: waitlist
        kicker: Get notified
        title: Chat-driven building isn't live yet — get in line for early access
        lead: >-
          We're building the live chat/YAML/preview loop shown above next. Leave an email and
          we'll reach out when there's something real to try.
        blocks:
          - type: email-capture
            placeholder: you@company.com
            buttonLabel: Join the waitlist
            note: 'No spam — one email when early access opens, nothing else.'

      - id: cta
        kicker: Decision needed
        title: Read the case for adopting Core3
        blocks:
          - type: list
            items:
              - text: Read the full Proposal
                href: /overview
              - text: See the Gate Service Plan
                href: /plan/auth-mediator
              - text: View the full roadmap and Odoo module tracker
                href: /roadmap
