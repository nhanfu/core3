title: Core3 — Build by talking to it
page:
  id: home

components:
  - type: DocPage
    hero:
      variant: home
      eyebrow: 'Homepage concept'
      title: 'Build your ERP by talking to it.'
      subtitle: >-
        Because business logic in Core3 is nothing but YAML, an AI assistant can read it, edit it,
        and show you the result live — chat on one side, the YAML it just changed on the other,
        and the page updating in front of you. This page is a concept mockup for that experience.
      ctas:
        - label: Read the full proposal
          href: /overview
          variant: primary
        - label: See the roadmap
          href: /roadmap
          variant: secondary
      stats:
        - value: '90'
          label: shared components available
          visual: units
        - value: '5'
          label: databases supported through one adapter interface
          visual: chips
          items: [PostgreSQL, DuckDB, MySQL, Oracle, SQL Server]

    sections:
      - id: live-build
        kicker: Live chat, live build
        title: "Talk is cheap. Let's build."
        lead: >-
          No requirements doc, no ticket, no sprint to wait on — say what you want changed, and
          watch the YAML update and the page change while you're still talking. Chat replaces the
          back-and-forth, not the spec.
        blocks:
          - type: callout
            tone: note
            title: Concept mockup — not wired up yet
            text: >-
              This panel is a static illustration of the intended experience, not a working
              feature. It exists to communicate the direction before any of it is built.
          - type: mockup
            caption: 'Static mockup — chat, live YAML, and live preview stay in sync because they are the same spec.'
            html: |
              <div class="doc-chatbar">
                <span class="doc-chatbar-icon">✦</span>
                <span class="doc-chatbar-placeholder">Add a "Cancel order" button with a confirm dialog…</span>
                <span class="doc-chatbar-send">↵ Send</span>
              </div>
              <div class="doc-chatbar-panes">
                <div class="doc-chatbar-pane">
                  <span class="doc-chatbar-pane-title">Chat</span>
                  <div class="doc-chatbar-msg doc-chatbar-msg-user">Add a "Cancel order" button with a confirm dialog</div>
                  <div class="doc-chatbar-msg doc-chatbar-msg-ai">Added an action to orders-detail.yaml — type: confirm, then delete on confirm. Preview updated.</div>
                </div>
                <div class="doc-chatbar-pane">
                  <span class="doc-chatbar-pane-title">Live YAML</span>
                  <pre class="doc-chatbar-code"><code class="language-yaml">actions:
                - id: cancel_order
                  type: confirm
                  label: Cancel order
                  message: "Cancel this order?"
                  then:
                    type: delete
                    table: orders</code></pre>
                </div>
                <div class="doc-chatbar-pane">
                  <span class="doc-chatbar-pane-title">Live preview</span>
                  <div class="doc-chatbar-preview-row"><span>#1042 · Acme Co.</span><button>Cancel order</button></div>
                  <div class="doc-chatbar-preview-row"><span>#1043 · Globex</span><button>Cancel order</button></div>
                  <div class="doc-chatbar-preview-row"><span>#1044 · Initech</span><button>Cancel order</button></div>
                </div>
              </div>
          - type: p
            text: >-
              Why this is plausible, not vaporware — a "server_form"/"delete" action is already a
              handful of validated YAML keys (see the Scripting and Backend pages), small and
              structured enough for an assistant to edit reliably. Nothing about it requires
              generating or reviewing arbitrary application code.

      - id: platform
        kicker: Platform
        title: This isn't a mockup of the framework — this site is running proof
        lead: >-
          Every panel below is real content pulled from this same spec project, dropped into a
          window frame — not a rendering of what the product might look like.
        blocks:
          - type: p
            text: 'The proposal page ends its pitch with four load-bearing properties, rendered as an ordinary cardgrid:'
          - type: mockup
            reveal: left
            caption: 'Real content — the Proposal page, "One shared framework" section.'
            html: |
              <div class="doc-browser-frame">
                <div class="doc-browser-frame-bar">
                  <span class="doc-browser-frame-dots"><span class="doc-browser-frame-dot"></span><span class="doc-browser-frame-dot"></span><span class="doc-browser-frame-dot"></span></span>
                  <span class="doc-browser-frame-url">core3.dev/overview#proposal</span>
                </div>
                <div class="doc-browser-frame-body">
                  <div class="doc-cardgrid">
                    <div class="doc-card"><span class="doc-card-tag">Data</span><h4>Server-first data</h4><p>The server performs joins and lookups; the browser never resolves references.</p></div>
                    <div class="doc-card"><span class="doc-card-tag">Components</span><h4>90 shared components</h4><p>GridView, ListView, forms, KPIs, and Odoo-style document views.</p></div>
                    <div class="doc-card"><span class="doc-card-tag">CRUD</span><h4>Declarative mutations</h4><p>crud: true generates insert/update/delete with row_version optimistic concurrency.</p></div>
                    <div class="doc-card"><span class="doc-card-tag">Extension</span><h4>Escape hatch when YAML isn't enough</h4><p>A per-project registry plugs in custom components without forking the framework.</p></div>
                  </div>
                </div>
              </div>
          - type: p
            text: 'The Backend page shows a real permission-gated datasource, SQL and all — not an abstracted example:'
          - type: mockup
            reveal: right
            caption: 'Real content — the Backend page, "Datasource with a permission gate" panel.'
            html: |
