                  <span class="doc-browser-frame-url">core3.dev/backend#permissions</span>
                </div>
                <div class="doc-browser-frame-body">
                  <pre><code class="language-yaml">datasources:
                - id: orders
                  permission: orders.read
                  query_window:
                    table: orders
                    date_field: order_date
                  query: |
                    SELECT o.id, o.order_number, o.customer_name, o.status
