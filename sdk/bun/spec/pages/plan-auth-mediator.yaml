title: Core3 — Gate Service Plan
page:
  id: plan-auth-mediator

components:
  - type: DocPage
    hero:
      variant: page
      eyebrow: Plan · sdk/bun/sample/plan
      title: Gate service — auth, event storage, and mediator POC
      subtitle: >-
        Auth and Med are merged into one process, the gate service. It signs identity-only client
        JWTs, injects permissions only into short-lived dispatch tokens right before a service call,
        owns event storage/dispatch, and owns the cancellation and saga-compensation chains.
        Condensed from sdk/bun/sample/plan/Auth and Mediator Refactor.md.
    sections:
      - id: scope
        kicker: '1 — Goal and scope'
        title: One gate process, single node first
        blocks:
          - type: callout
            tone: note
            title: Single-node POC, scale-out deferred
            text: >-
              This plan targets one node and one gate process. Leader election, replication,
              sharding, and service-mesh routing are explicitly deferred to phase 2 — see
              "Later scale-out decisions" below.
          - type: list
            items:
              - 'Authenticates client JWTs and loads current user/device state and permissions'
              - 'Authenticates service-to-service callers against a declarative communication policy'
              - 'Adds an authorization snapshot only right before dispatching to a concrete service'
              - 'Stores and dispatches events; owns the durable event/audit history'
              - 'Owns the cancellation chain for every call that passes through it'
              - 'Runs a generic multi-step saga/compensation state machine for cross-service business flows (e.g. Order → Inventory → Payment); domain services own what each step and compensation does'
          - type: p
            text: >-
              Domain services keep owning business data and business mutations; the gate owns
              identity, authorization, routing, event delivery, cancellation, and security/audit
              metadata.

      - id: security-model
        kicker: '2 — Security model'
        title: Permission-free client tokens, dispatch-time authorization
        blocks:
          - type: callout
            tone: warning
            title: No permissions in the client JWT
            text: >-
              The client token is a pure identity/session JWT (iss, aud, sub, jti, sid, did, iat,
              nbf, exp, user_security_revision, session_revision). It can remain cryptographically
              valid after logout or revocation — validity alone never grants access. The gate is
              the only authorization decision point, for every client and service dispatch.
          - type: table
            headers: [Durable record, Purpose]
            rows:
              - [user_device_sessions, 'Authority for active/revoked device+session state, refresh-token family/generation, and a keyed hash of the current refresh token — never the raw JWT or raw refresh token']
              - [refresh_token_history, 'Rotated refresh generations for replay detection; reuse of an old generation revokes the whole session family']
              - [Cached user-device token, 'Disposable authorization snapshot (state, revision, permissions, resolved time) rebuilt from the durable session row on a cache miss or stale revision — a cache miss fails closed, never open']
              - [KV deny list, 'Phase 1: in-process only. deny:jti / deny:session / deny:user markers reject a token immediately after signature checks, before any permission lookup — the durable revision remains authoritative if the marker is lost']
          - type: p
            text: >-
              Immediately before a gate-to-service dispatch, the gate resolves the newest
              permissions and signs a short-lived internal dispatch token (iss=gate,
              aud=<target-service>, token_type=gate_dispatch, authz_version, correlation/causation/
              cancellation ids, parent_jti). The target trusts this token's claims directly and does
              not call the gate again for a second permission decision.
          - type: panel
            title: Signing-key rotation (separate kid namespace per token purpose)
            language: text
            code: |
              generate + register key as "published"
                -> publish public key, wait for verifier refresh
                  -> mark "active", start signing with it
                    -> keep old key verifiable until every token it signed has expired
                      -> mark "retired", remove after retention window

              compromise path: stop signing immediately, drop kid from verification,
              bump security revision/epoch, force verifiers to refresh the key ring.

      - id: service-to-service
        kicker: '3 — Service-to-service authorization'
        title: Delegated calls get the newest permissions, not the caller's snapshot
        blocks:
          - type: list
            items:
              - 'Every service has a gate-recognized workload identity (configured credential/local key pair for the POC, mTLS-ready later)'
              - 'The gate checks a declarative communication policy before forwarding: source identity, allowed command/event type, target service, on-behalf-of-user flag, required permission, timeout, cancellation policy, idempotency requirements'
              - "The target receives the source's authenticated context AND the current user authorization snapshot — it may reject a command if the newer permission version makes it unsafe, even though the source started with an older snapshot"
              - 'Raw reusable bearer tokens are never written to ordinary Parquet columns — store a hash, jti, source/target, and audit claims unless replay/audit specifically requires the encrypted envelope'

      - id: event-storage
        kicker: '4 — Gate event storage and dispatch'
        title: Durable envelope, Parquet as audit history (not the live queue)
        blocks:
          - type: list
            items:
              - 'Append events durably before acknowledging publication; one local writer, bounded in-memory delivery queue'
              - 'Envelope carries event_id/type/version, source/target service, deadline/attempt/idempotency key, correlation/causation/cancellation ids, authz_version at creation and at dispatch, and a redacted service-token audit envelope'
              - 'Parquet segments: write temp -> flush/close -> validate -> atomic manifest publish; Parquet is audit/history, the live queue tracks delivery state separately'
              - 'Recovery replays valid durable segments and any recoverable append log, truncating only an incomplete tail — a corrupt committed segment stops startup rather than being silently skipped'
              - 'Duplicate delivery cannot duplicate a domain mutation when the target uses its inbox/idempotency contract'

      - id: cancellation
        kicker: '6 — Cancellation and long-running work'
        title: Operation-based cancellation, not an HTTP-disconnect hack
        blocks:
          - type: callout
            title: The Order → Report case
            text: >-
              A long-running report triggered by Order is not an uncancellable child of the
              original HTTP request. It gets its own operation_id/cancellation_id, its status is
              persisted, and that id is returned to the caller — so Order isn't stuck holding
              resources for the full report duration, and the browser connection doesn't matter.
          - type: table
            headers: [operations table field, Purpose]
            rows:
              - [operation_id / cancellation_id / correlation_id, Identity of the tracked long-running call and its causation chain]
              - [state, 'pending | running | cancel_requested | cancelled | completed | failed']
              - [row_version, Atomic CAS for state transitions — first terminal write wins]
          - type: list
            items:
              - 'The in-memory cancellation registry is a fast-path index rebuilt from the durable operations table on startup — it is not the source of truth'
              - 'On restart: pending/running rows with no confirmation are marked failed or re-queried; cancel_requested rows re-send the cancellation before being considered reconciled; no row is silently dropped'
              - 'Cancellation must stop queue delivery, cancel in-flight DB queries/streams/timers, stop retries, and be idempotent under a race with completion'
              - 'A late response can never revive a cancelled or expired request'

      - id: saga
        kicker: '11 — Saga-based cross-service consistency'
        title: Multi-step compensation, not 2PC or consensus
        blocks:
          - type: p
            text: >-
              Cross-service business flows (Order → Inventory → Payment, and longer chains) are
              not atomic transactions. Each step is a local ACID transaction inside its own
              service; consistency comes from an ordered sequence of steps plus compensations,
              driven by a generic saga state machine the gate owns. The gate never decides
              business outcomes — it sequences dispatch, tracks state durably, and invokes
              compensation when a step reports failure.
          - type: panel
            title: Forward and compensation flow
            language: text
            code: |
              step N command -> target's local transaction -> outcome event (success | failed)

              success -> mark step success, dispatch step N+1 (last step -> saga completed)
              failed  -> saga state = compensating
                         -> walk completed steps in strict reverse order
                         -> dispatch each step's compensation (idempotency key = saga_id:step:compensation)
                         -> all compensations succeed -> compensated
                         -> a compensation fails -> saga = failed (manual resolution, no infinite retry)
          - type: table
            headers: [Table, Purpose]
            rows:
              - [saga_instances, 'Overall state (running/compensating/completed/compensated/failed), current_step_index, row_version CAS']
              - [saga_steps, 'One row per step — service, command_event_id, outcome, compensation_event_id/outcome — lets a saga fan out to any number of services without changing the state-machine shape']
          - type: callout
            tone: note
            title: Why no 2PC / consensus
            text: >-
              Correctness needs (a) idempotent step commands, (b) each step's local commit being
              authoritative the moment it lands, and (c) failure after step N resolved by
              compensating 0..N-1. The only real race — a redelivered step and its original both
              recording an outcome — is resolved by row-version CAS, the same first-write-wins
              pattern used for the operations table, not a distributed consensus algorithm. A
              cancelled saga step is just one more path into the failed/compensating state.

      - id: architecture
        kicker: '7 — Single-node architecture and implementation language'
        title: 'Phase 1: Bun/TypeScript. Phase 2: Zig.'
        blocks:
          - type: list
            items:
              - 'One gate process: JWT signer/verifier, user/device/session resolver+cache, service-policy checker, dispatch-token issuer, route registry, durable operations + saga stores with an in-memory index rebuilt on startup, durable event store + Parquet writer/recovery, inbox/idempotency store, structured audit logging'
              - 'The gate may use direct local transport for the POC, but the transport interface must preserve deadlines, cancellation, identity, and target audience exactly as a network transport would'
          - type: callout
            tone: warning
            title: Phase 2 is a reimplementation behind the same contracts, in Zig
            text: >-
              Phase 1 stays in Bun/TypeScript to prove the contracts quickly against real domain
              services. Phase 2 — multi-node KV deny-list sync, replicated event/operation/saga
              state, gate-node routing and fencing — carries a materially different correctness
              burden: genuine multi-threaded concurrency, CAS/lock-free structures, and races that
              have to be reasoned about at the memory-model level. The gate is re-implemented in
              Zig for that phase for explicit memory control, no GC pauses on the hot
              dispatch/cancellation path, and precise concurrency primitives — but the wire
              formats and durable schemas fixed in this plan (client JWT/dispatch-token claims,
              event envelope, operations, saga_instances/saga_steps) do not change, so
              TypeScript domain services don't need to change how they talk to the gate.

      - id: storage-boundaries
        kicker: '7 — Storage backends'
        title: 'Parquet is fixed. Relational state is database-agnostic.'
        blocks:
          - type: callout
            tone: warning
            title: No vendor lock-in on the relational side
            text: >-
              The gate must not be locked to one database product. Three storage categories, three
              different portability rules.
          - type: table
            headers: [Storage category, Rule]
            rows:
              - ['Event/audit store', 'Always Parquet segments, regardless of which relational database is configured — chosen for high-throughput append/read and zero-copy access, not a database-portability concern']
              - ['KV deny list', "In-process memory only, as scoped in phase 1 — it isn't a database and never goes through a database driver"]
              - ['Everything else (signing keys, user_device_sessions, refresh_token_history, service communication policy, operations, saga_instances, saga_steps)', 'Written through the existing generic DatabaseAdapter/DatabaseDriver abstraction already used elsewhere in this codebase (Postgres, DuckDB, MySQL, Oracle, SQL Server) — no gate-specific schema tied to one product']
          - type: p
            text: >-
              Every row-version/CAS pattern in this plan (session rotation, deny-list revision
              bump, operations transitions, saga_instances/saga_steps transitions) must be a plain
              conditional update — "UPDATE ... WHERE id = ? AND row_version = ?", zero rows changed
              is a conflict — expressible on any supported driver. No advisory locks, FOR UPDATE, or
              other driver-specific locking: if a CAS pattern only works on one driver, the pattern
              gets redesigned, not the storage promise. The POC itself runs on a single configured
              adapter (e.g. DuckDB or Postgres); cross-driver compatibility is verified by running
              the same CAS contract suite against at least two drivers, not by the POC's own runtime
              choice.

      - id: scale-out
        kicker: '10 — Later scale-out decisions (phase 2)'
        title: Deferred until the single-node contracts are proven
        blocks:
          - type: list
            items:
              - 'Multiple gate nodes, leader election, replicated event/operation/saga state, gate-node routing and fencing, cross-node service discovery'
              - 'Multi-node KV deny-list sync: each node keeps its own in-memory list (no shared/consensus KV store); a writer best-effort broadcasts new deny markers to sibling nodes with no ack/quorum required'
              - "A node that misses a broadcast is still correct — its authorization-cache entries expire on their existing bounded TTL and re-resolve against the durable user_device_sessions revision, which reflects the revocation. Missing a broadcast only widens the rejection window to that existing bound, it never produces an incorrect accept"
              - 'This deliberately avoids building distributed-KV consistency for a dataset that is small and explicitly non-authoritative — the durable revision is, and remains, the source of truth'

      - id: gates
        kicker: '9 — Verification and acceptance gates'
        title: What must pass before phase 1 is done
        blocks:
          - type: cardgrid
            cards:
              - tag: Auth
                title: No permissions in the client JWT
                body: Logout, device revocation, and permission changes are rejected once the gate cache is cleared; a cache miss rebuilds from the durable session row and never resurrects a revoked token.
              - tag: Dispatch
                title: Target-specific gate tokens
                body: Internal tokens are rejected for the wrong target, issuer, type, signature, or expiry; a delegated service command receives newer permissions than the source's original snapshot.
              - tag: Events
                title: Idempotent, restart-safe
                body: Event publication survives restart/recovery; Parquet writes recover from an incomplete tail and reject committed corruption.
              - tag: Cancellation
                title: Order → Report end to end
                body: A long-running report can be cancelled from the client through Order to Report, and its database/worker resources are released — including races with successful completion.
              - tag: Saga
                title: Order → Inventory → Payment
                body: A multi-step saga completes on the happy path; a mid-chain failure compensates every prior step in strict reverse order with no duplicated business effect, including across a forced gate restart mid-saga.
              - tag: Restart
                title: No orphaned state
                body: A forced gate restart recovers acknowledged events and reconciles every non-terminal operations/saga_instances row — nothing is left running/compensating without an active redelivery.
