          - type: list
            items:
              - '1. Client sends its pure JWT (no permissions) to the gate.'
              - '2. Source service sends its service token to the gate for a delegated call.'
              - '3. The gate crosses its own trust boundary only with a short-lived dispatch token carrying current permissions — the target never sees the raw client JWT or service token.'
              - '4. The gate durably writes the event/audit record to Parquet, independent of which relational database backs everything else.'

      - id: security-model
        kicker: '2 — Security model'
        title: Permission-free client tokens, dispatch-time authorization
        blocks:
          - type: callout
            tone: warning
            title: No permissions in the client JWT
            text: >-
              The client token is a pure identity/session JWT (iss, aud, sub, jti, sid, did, iat,
              nbf, exp, user_security_revision, session_revision). It can remain cryptographically
              valid after logout or revocation — validity alone never grants access. The gate is
              the only authorization decision point, for every client and service dispatch.
          - type: table
            headers: [Durable record, Purpose]
            rows:
              - [user_device_sessions, 'Authority for active/revoked device+session state, refresh-token family/generation, and a keyed hash of the current refresh token — never the raw JWT or raw refresh token']
              - [refresh_token_history, 'Rotated refresh generations for replay detection; reuse of an old generation revokes the whole session family']
              - [Cached user-device token, 'Disposable authorization snapshot (state, revision, permissions, resolved time) rebuilt from the durable session row on a cache miss or stale revision — a cache miss fails closed, never open']
              - [KV deny list, 'Phase 1: in-process only. deny:jti / deny:session / deny:user markers reject a token immediately after signature checks, before any permission lookup — the durable revision remains authoritative if the marker is lost']
          - type: p
            text: >-
              Immediately before a gate-to-service dispatch, the gate resolves the newest
              permissions and signs a short-lived internal dispatch token (iss=gate,
              aud=<target-service>, token_type=gate_dispatch, authz_version, correlation/causation/
              cancellation ids, parent_jti). The target trusts this token's claims directly and does
              not call the gate again for a second permission decision.
          - type: panel
            title: Signing-key rotation (separate kid namespace per token purpose)
            language: text
            code: |
              generate + register key as "published"
                -> publish public key, wait for verifier refresh
                  -> mark "active", start signing with it
                    -> keep old key verifiable until every token it signed has expired
                      -> mark "retired", remove after retention window

              compromise path: stop signing immediately, drop kid from verification,
              bump security revision/epoch, force verifiers to refresh the key ring.

      - id: service-to-service
        kicker: '3 — Service-to-service authorization'
        title: Delegated calls get the newest permissions, not the caller's snapshot
        blocks:
          - type: list
            items:
              - 'Every service has a gate-recognized workload identity (configured credential/local key pair for the POC, mTLS-ready later)'
              - 'The gate checks a declarative communication policy before forwarding: source identity, allowed command/event type, target service, on-behalf-of-user flag, required permission, timeout, cancellation policy, idempotency requirements'
              - "The target receives the source's authenticated context AND the current user authorization snapshot — it may reject a command if the newer permission version makes it unsafe, even though the source started with an older snapshot"
              - 'Raw reusable bearer tokens are never written to ordinary Parquet columns — store a hash, jti, source/target, and audit claims unless replay/audit specifically requires the encrypted envelope'

      - id: event-storage
        kicker: '4 — Gate event storage and dispatch'
        title: Durable envelope, Parquet as audit history (not the live queue)
        blocks:
          - type: list
            items:
              - 'Append events durably before acknowledging publication; one local writer, bounded in-memory delivery queue'
              - 'Envelope carries event_id/type/version, source/target service, deadline/attempt/idempotency key, correlation/causation/cancellation ids, authz_version at creation and at dispatch, and a redacted service-token audit envelope'
              - 'Parquet segments: write temp -> flush/close -> validate -> atomic manifest publish; Parquet is audit/history, the live queue tracks delivery state separately'
              - 'Recovery replays valid durable segments and any recoverable append log, truncating only an incomplete tail — a corrupt committed segment stops startup rather than being silently skipped'
              - 'Duplicate delivery cannot duplicate a domain mutation when the target uses its inbox/idempotency contract'

      - id: cancellation
        kicker: '6 — Cancellation and long-running work'
        title: Operation-based cancellation, not an HTTP-disconnect hack
        blocks:
          - type: callout
            title: The Order → Report case
            text: >-
              A long-running report triggered by Order is not an uncancellable child of the
              original HTTP request. It gets its own operation_id/cancellation_id, its status is
              persisted, and that id is returned to the caller — so Order isn't stuck holding
              resources for the full report duration, and the browser connection doesn't matter.
          - type: table
            headers: [operations table field, Purpose]
            rows:
              - [operation_id / cancellation_id / correlation_id, Identity of the tracked long-running call and its causation chain]
              - [state, 'pending | running | cancel_requested | cancelled | completed | failed']
              - [row_version, Atomic CAS for state transitions — first terminal write wins]
          - type: list
            items:
              - 'The in-memory cancellation registry is a fast-path index rebuilt from the durable operations table on startup — it is not the source of truth'
              - 'On restart: pending/running rows with no confirmation are marked failed or re-queried; cancel_requested rows re-send the cancellation before being considered reconciled; no row is silently dropped'
              - 'Cancellation must stop queue delivery, cancel in-flight DB queries/streams/timers, stop retries, and be idempotent under a race with completion'
              - 'A late response can never revive a cancelled or expired request'

      - id: saga
        kicker: '11 — Saga-based cross-service consistency'
        title: Multi-step compensation, not 2PC or consensus
        blocks:
          - type: p
            text: >-
              Cross-service business flows (Order → Inventory → Payment, and longer chains) are
              not atomic transactions. Each step is a local ACID transaction inside its own
              service; consistency comes from an ordered sequence of steps plus compensations,
              driven by a generic saga state machine the gate owns. The gate never decides
              business outcomes — it sequences dispatch, tracks state durably, and invokes
              compensation when a step reports failure.
          - type: diagram
            caption: 'Dataflow: cancellation (Order → Report) and a saga (Order → Inventory → Payment) share the same shape — the gate dispatches forward from inside its trust boundary, tracks state durably, and only compensates on failure.'
