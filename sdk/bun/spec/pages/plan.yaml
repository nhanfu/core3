      - id: pattern-rule
        kicker: Working principle
        title: Pattern extraction
        blocks:
          - type: callout
            title: Pattern-extraction rule
            text: >-
              When the same structure appears in two pages, write a YAML shorthand for it. When it
              appears in three, it becomes a first-class framework concept — a new component, a new
              schema key, or a new registerPageComponentSchema-backed extension point.
          - type: p
            text: >-
              This spec project is itself an example of the rule: DocHero, DocPage, and DocTopNav
              exist because "hero + sidebar-linked sections + global nav" is a shape every doc-style
              project needs, not something worth re-describing per page.

      - id: next
        kicker: Next up
        title: What's next
        blocks:
          - type: list
            items:
              - Model new modules directly against Odoo's real feature set, using the order and chat services as the pattern to follow
              - Keep the component-library reference in sync as real components change
              - Grow the sample order service with more read-focused example pages (analytics, reports)
              - Keep extracting repeated DocPage block shapes into the schema as the doc set grows
              - text: Continue hardening auth and the event mediator per the Gate Service Plan (gateway refactor)
                href: /plan/auth-mediator

      - id: meta-model
        kicker: Design reference
        title: Component meta model and backend comms
        lead: >-
          The original spec described two core design contracts: a ComponentDef config object
          driving every component, and two data-transfer objects (SqlViewModel / PatchVM) for
          reads and writes. Both influenced what shipped, though in evolved forms.
        blocks:
          - type: p
            text: >-
              ComponentDef shipped as a per-component key-set registry in
              packages/server/src/yaml/schema.ts. Each component type declares its allowed YAML
              keys via registerPageComponentSchema; the validator enforces the surface at server
              startup rather than at page-load time. The aspirational shape from the original spec
              is shown below for historical reference.
          - type: panel
            title: Aspirational ComponentDef shape (original spec)
            language: typescript
            code: |
              {
                type, id, field, label, align, column, row,
                // Declarative expressions — new Function({ user, row, state })
                show_if, disabled_if, default, compute, validation,
                // Lifecycle events
                events: { on_dom_ready, on_user_input, on_before_save, on_after_save, on_disposed },
                // Permissions resolved from SecurityContext at render time
                can_read, can_write, can_delete,
                // Data binding
                source, query, pre_query, is_realtime, group_by, group_format,
                // Linked selects
                cascade_field, populate_field,
                // Actions and nested components
                actions: ActionDef[], components: ComponentDef[],
              }
          - type: p
            text: >-
              The backend comms spec described SqlViewModel (read DTO) and PatchVM (write DTO)
              flowing through a single Client singleton with JWT-aware fetch. The real server
              YAML surface uses action types instead — type: form / server_form / delete / patch /
              server for writes, and datasource service entries for reads. The DTO shapes are
              internal to the server pipeline; page YAML only declares action and datasource keys.

      - id: what-shipped
        kicker: Reconciliation
        title: What shipped vs. what was planned
        lead: >-
          Every component anticipated in the original wishlist shipped. The real component set has
          grown to over 70 entries, well beyond the original 13-item wishlist.
        blocks:
          - type: table
            headers: [Anticipated component, Status]
            rows:
              - [SearchEntry, 'Shipped — SearchEntry.ts; MultipleSearchEntry also added']
              - [ConfirmDialog, 'Shipped — ConfirmDialog.ts']
              - [Chart, 'Shipped — Chart.ts; extended with series and layout variants']
              - [Kanban, 'Shipped — Kanban.ts and KanbanView.ts']
              - [ButtonExcel, 'Shipped — ButtonExcel.ts; ButtonImportExcel also added']
              - [ButtonPdf, 'Shipped — ButtonPdf.ts']
              - [Section, 'Shipped — Section.ts']
              - [TimelinePanel, 'Shipped — TimelinePanel.ts']
              - [AvatarCell, 'Shipped — AvatarCell.ts']
              - [PercentCell, 'Shipped — PercentCell.ts']
              - [RankCell, 'Shipped — RankCell.ts']
              - [LinkCell, 'Shipped — LinkCell.ts']
              - [EmptyState, 'Shipped — EmptyState.ts']
          - type: p
            text: >-
              Components not on the original list but now shipped include OdooFormView,
              OdooChatter, OdooFollowerManager, OdooAttachmentPanel, ChatWorkspace, LineItemGrid,
              GroupGridView, TreeView, PivotView, CalendarView, GraphView, MapView, ScheduleGrid,
              and more — each driven by real product requirements in the order and chat sample
              services, not a hypothetical planning list.
          - type: callout
            tone: note
            title: YAML props wishlist
            text: >-
              Most anticipated YAML props (show_if, disabled_if, compute, depends_on,
              empty_state, is_realtime, group_by, export) are now first-class keys in the
              per-component schemas in schema.ts. A few (inline_edit, summary_row, threshold)
              are present in component implementations but live as internal conventions rather
              than top-level validated YAML keys.
