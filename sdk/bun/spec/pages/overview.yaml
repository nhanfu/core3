                <circle cx="430" cy="252" r="9" class="pa-badge"/><text x="430" y="255" text-anchor="middle" class="pa-badge-text">2</text>
                <text x="443" y="255" class="pa-rowlbl">produces</text>

                <path d="M300,328 L15,328 L15,52 L300,52" class="pa-edge-teal" marker-end="url(#pa-arrowTeal)"/>
