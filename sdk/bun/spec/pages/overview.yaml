title: Core3 — Proposal
page:
  id: overview

components:
  - type: DocPage
    hero:
      variant: home
      breadcrumb:
        - label: Docs
          href: /
        - label: Overview
        - label: Proposal
      articleType: Overview
      eyebrow: Proposal
      title: 'YAML is spec, YAML is code'
      subtitle: >-
        Every other line of code in Core3 — client, server, gate, database adapters — is runtime
        or compiler for the YAML. All business intent lives in YAML; nothing else is allowed to
        carry it. That split is what makes failures diagnosable: a bug is either a YAML spec
        problem (fix the business definition) or a runtime/compiler problem (fix once, every
        service running on it benefits). This proposes adopting that architecture as the standard
        for new ERP services first, since ERP is the easiest domain to verify it against.
      stats:
        - value: '90'
          label: shared components available
          visual: units
        - value: '5'
          label: databases supported through one adapter interface
          visual: chips
          items: [PostgreSQL, DuckDB, MySQL, Oracle, SQL Server]

    sections:
      - id: philosophy
        kicker: Core idea
        title: 'YAML is spec, YAML is code'
        lead: >-
          Everything that isn't YAML — the client renderer, the server pipeline, the gate service,
          the database adapters — is runtime or compiler. It exists to execute the YAML, never to
          hold business intent itself. That boundary is deliberate: it turns "why did this break"
          into a two-way classification instead of an open-ended investigation.
        blocks:
          - type: table
            headers: [When something breaks, What it means, Blast radius]
            rows:
              - ['The YAML spec is wrong', 'A business rule was defined incorrectly — wrong validation, wrong permission, wrong workflow transition', 'One page or one service; fix the business definition']
              - ['The runtime/compiler is wrong', 'The engine that executes YAML has a bug — parsing, rendering, CRUD generation, dispatch', 'Every service running on that engine version; fix once, everyone benefits']
          - type: diagram
            caption: 'Dataflow: YAML spec compiles through interchangeable runtime into a running service. Numbers match the steps below.'
