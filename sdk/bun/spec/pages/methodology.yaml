title: YShip — Feature methodology

page:
  id: feature-improvement

components:
  - type: DocPage
    hero:
      variant: page
      articleType: Reference
      breadcrumb:
        - label: Docs
          href: /
        - label: Reference
        - label: Feature improvement methodology
      eyebrow: Reference
      title: Feature improvement methodology
      subtitle: Evidence-driven parity, architecture decisions, bounded repair loops, and measurable learning.
    sections:
      - id: principle-and-scores
        kicker: Method
        title: Behavior-compatible, architecture-independent parity
        lead: >-
          Clone Odoo's observable behavior, not its internal architecture. Core3 must preserve
          user-visible behavior, workflows, permissions, data meaning, validation, views,
          navigation, actions, reference data, and seed-data behavior. The implementation may
          diverge whenever a more scalable Core3 architecture provides equivalent behavior.

        blocks:
          - type: p
            text: >-
              This methodology keeps behavioral parity separate from architecture fitness so the
              system cannot achieve a high parity score by blindly reproducing an unsuitable design.
              The methodology and workflow described on this page are illustrative defaults, not a
              locked process. Agents and projects may modify, replace, or extend them as long as
              their chosen approach remains observable, permission-safe, and verifiable.
          - type: table
            headers: [Odoo behavioral parity dimension, Weight]
            rows:
              - [Business workflows and transitions, 25]
              - [Screens, views, navigation, and actions, 20]
              - [Data model, relationships, reference data, and seed data, 15]
              - [Validation, errors, empty states, loading states, and boundaries, 15]
              - [Permissions, company scope, and security, 10]
              - [Search, filtering, reporting, and usability, 5]
              - [Accessibility and visual interaction quality, 5]
              - [Audit, reliability, and performance, 5]
              - [Total, 100]
          - type: p
            text: >-
              Each criterion receives 1.0 when equivalent behavior is proven by evidence, 0.5
              when it is partially equivalent or limited in scope, and 0.0 when it is missing,
              incorrect, or unverified. A security or tenant-scope failure caps parity at 49; a
              broken primary workflow caps parity at 69; missing evidence cannot receive full
              credit; and agent opinion alone cannot increase the score.
          - type: table
            headers: [Architecture fitness dimension, Weight]
            rows:
              - [Scalability and performance, 20]
              - [Correctness and data integrity, 15]
              - [Security and tenant isolation, 15]
              - [Operability, observability, and recovery, 15]
              - [Testability and verification quality, 10]
              - [Interface stability and module depth, 10]
              - [Migration and versioning strategy, 5]
              - [Complexity and maintainability, 10]
              - [Total, 100]
          - type: panel
            title: Example score report
            language: text
            code: |
              Odoo behavioral parity: 94/100
              Core3 architecture fitness: 62/100

              The feature is behaviorally close but not yet architecturally ready for broad adoption.

      - id: architecture-gate
        kicker: Decision process
        title: Architecture decision gate
        blocks:
          - type: panel
            title: Evidence-to-validation flow
            language: text
            code: |
              Odoo reference facts
                → behavior contract
                → architecture research
                → alternatives and trade-offs
                → architecture decision record
                → implementation
                → parity validation
                → architecture validation
          - type: list
            items:
              - Inspect existing Core3 modules and seams
              - Inspect Odoo only to understand behavior and constraints
              - Research authoritative alternatives
              - Propose at least two viable designs
              - Compare scalability, correctness, security, operations, migration cost, performance, and complexity
              - Identify reversible and irreversible choices
              - Benchmark or prototype high-risk choices
              - Record rejected alternatives and reasons
          - type: p
            text: The agent must never select an architecture solely because Odoo uses it.

      - id: pattern-rule
        kicker: Working principle
        title: Pattern extraction
        blocks:
          - type: callout
            title: Pattern-extraction rule
            text: >-
              When the same structure appears in two pages, write a YAML shorthand for it. When it
              appears in three, it becomes a first-class framework concept — a new component, a new
              schema key, or a new registerPageComponentSchema-backed extension point.
          - type: p
            text: >-
              This spec project is itself an example of the rule: DocHero, DocPage, and DocTopNav
              exist because "hero + sidebar-linked sections + global nav" is a shape every doc-style
              project needs, not something worth re-describing per page.

      - id: repair-loops
        kicker: Execution
        title: Agent graph and bounded repair loops
        blocks:
          - type: panel
            title: Agent graph
            language: text
            code: |
              BA (leader): scope, reference facts, behavior contract, and acceptance criteria
                ↔ dev: architecture choice, YAML implementation, focused checks, and repair feedback
              BA: verify evidence, decide acceptance, and lead the next bounded loop
          - type: p
            text: >-
              The loop uses only two roles: BA and dev, with BA as the leader. BA defines the target,
              contract, acceptance evidence, and next action; dev makes the smallest architecture-fit
              implementation and reports concrete results back to BA. BA performs the verification
              review that would otherwise be separated into QA. Every loop must declare a maximum iteration
              count, time limit, tool/action budget, and a no-progress stop condition. When a limit
              is reached, the agent stops and reports the unresolved state or asks the user for
              direction; it may not retry indefinitely or silently continue after a failed safety
              check. Lessons learned are added to the agent's notes for future runs, not written as
              a separate ledger or generated artifact.
          - type: panel
            title: Example loop policy
            language: text
            code: |
              max_iterations: 3
              max_duration: 15m
              max_actions: 20
              stop_if_no_score_change_after: 2 iterations
              stop_on: [safety_failure, permission_failure, repeated_same_error]
              on_limit: report_and_ask_user

      - id: execution-surface
        kicker: Product surface
        title: Feature work as the execution surface
        blocks:
          - type: p
            text: >-
              The unit of work is a BA-owned batch of bounded product features. The workflow above
              applies to feature development and parity work wherever it is initiated; it is not a
              plan for improving the AI module itself. BA plans several independent or dependency-
              ordered items for dev in one reviewable batch, and each item keeps its own contract,
              implementation status, verification results, and next action visible to the user.
          - type: list
            items:
              - start and continue feature-focused work in named threads
              - submit feature tasks and show readable agent responses
              - show live activity and feature progress
              - show loop limits, current attempts, remaining budget, and stop reasons
              - present structured results, tables, evidence, and technical details
              - open read-only previews of YAML pages or feature views
              - request and complete explicit mutation approvals
              - keep agent actions within the user's permissions and declared APIs
              - support feature-specific scores, criteria, decisions, lessons, and run status
          - type: p
            text: >-
              The execution surface should render the selected feature's workflow and data model,
              including optional drill-down to criteria, evidence, source references, failed tests,
              scores, and rejected alternatives. All agent operations remain declared,
              permission-checked, sandbox-scoped, time-limited, and audited. No arbitrary shell,
              SQL, filesystem, URL, or production-browser access is allowed.

      - id: acceptance
        kicker: Exit evidence
        title: Acceptance criteria
        blocks:
          - type: callout
            tone: important
            text: >-
              For this example workflow, the system should prove that parity criteria are traceable
              to approved evidence, scenarios are reproducible, scores are versioned, repairs are
              evidence-backed, and security failures are handled correctly. Other workflows may
              define different acceptance criteria; each agent must declare its criteria and produce
              enough evidence for the user to review the result. Every repair loop must expose its
              iteration, time, and action limits, stop on no progress or safety failure, and report
              the limit or stop reason in the workspace.
