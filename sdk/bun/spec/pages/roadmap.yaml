              - ['Server YAML pipeline', Complete, 'Discovery, schema validation, multi-database adapters (Postgres, DuckDB, MySQL, SQL Server, Oracle)']
              - ['Auth & event mediator', 'In progress', 'Typed JWT claims and a hardened mediator auth adapter landed most recently']
              - ['Sample services', Complete, 'order and chat services in sdk/bun/sample are the canonical reference implementation — every new Odoo-parity module should follow their CRUD/workflow/chatter/attachment patterns']
