title: YShip — Roadmap
page:
  id: roadmap

components:
  - type: DocPage
    hero:
      variant: page
      articleType: Overview
      breadcrumb:
        - label: Docs
          href: /
        - label: Overview
        - label: Roadmap
      eyebrow: Roadmap
      title: Plan & next steps
      subtitle: Where the framework is today and how progress is tracked toward AI-oriented Odoo parity.
    timelineNav: true
    sections:
      - id: direction
        kicker: Direction
        timeline: 0–3 months
        title: Target — a full Odoo clone
        lead: >-
          The framework's direction is to reproduce Odoo's ERP surface end to end on YShip, not to
          work from a hypothetical module list. Every new module should be modeled directly against
          Odoo's real behavior.
        blocks:
          - type: callout
            tone: important
            title: The sample code is the reference, not a demo
            text: >-
               sdk/bun/sample/services/order is the canonical reference implementation for this
               direction — CRUD, workflow state transitions, and file attachments are all driven by
               YAML page configs with no per-page UI code. New Odoo-parity modules should follow this
               service's patterns directly, the same way OdooFormView and OdooAttachmentPanel exist
               because the sample service needed them.
          - type: p
            text: >-
              This replaces the project's original planning approach (a hypothetical module
              breakdown used only to validate the framework's YAML concepts before any real service
               existed). That approach is now retired — the order service is real running proof, and
               Odoo itself is the specification for what comes next.

      - id: odoo-modules
        kicker: Odoo parity tracker
        timeline: 3–12 months
        title: Module / sub-module checklist and implementation status
        lead: >-
          Odoo's own app grouping is the literal tracking list for AI-oriented operations. Status is
          reported honestly against what has actually shipped, not what the pattern could theoretically
          support. The section also records the reference workflows.
        blocks:
          - type: callout
            tone: note
            title: How to read status
            text: >-
              In progress means a real discovered service exists with its core records, permissions,
              migration, route, and YAML CRUD surface. It does not mean the module is feature-complete
              against real Odoo. Not started means no real service exists yet.
          - type: callout
            tone: important
            title: Mutation assurance rule
            text: >-
              A module is not done when its pages merely discover. Every create, update, delete, and
              workflow mutation must derive protected values server-side, enforce its permission and
              record-scope boundary, reject stale or invalid transitions, and have an integration test
              that exercises the real YAML action against the module database before the roadmap status
              can move to In progress.
          - type: callout
            tone: note
            title: Inline FormView rule
            text: >-
              Every CRUD module should provide an inline FormView from its primary list when the
              record has a meaningful detail workflow. Follow
              sdk/bun/sample/services/order/pages/orders.yaml: configure form_view with the
              module detail page, side_panel behavior, and row-open navigation so users can inspect
              and edit records without leaving the list context. A standalone detail route does not
              replace this inline FormView requirement.
          - type: cardgrid
            cards:
              - tag: In progress
                tone: tip
                title: Sales & CRM
                body: Leads, sales, POS, subscriptions, and rentals.
                icons: [{name: users, label: CRM}, {name: cart, label: Sales}, {name: receipt, label: Point of Sale}, {name: repeat, label: Subscriptions}, {name: calendar, label: Rental}]
              - tag: In progress
                tone: important
                title: Finance
                body: Billing, expenses, documents, and reporting.
                icons: [{name: money, label: Accounting}, {name: invoice, label: Invoicing}, {name: file, label: Expenses}, {name: folder, label: Documents}, {name: analytics, label: Spreadsheet and Dashboards}]
              - tag: In progress
                tone: note
                title: Supply Chain
                body: Inventory, production, purchasing, quality, and maintenance.
                icons: [{name: warehouse, label: Inventory}, {name: factory, label: Manufacturing}, {name: purchase, label: Purchase}, {name: wrench, label: Maintenance}, {name: quality, label: Quality}, {name: engineering, label: PLM}]
              - tag: In progress
                tone: tip
                title: Human Resources
                body: Employees, hiring, leave, reviews, referrals, and fleet.
                icons: [{name: users, label: Employees}, {name: recruitment, label: Recruitment}, {name: calendar, label: Time Off}, {name: review, label: Appraisals}, {name: share, label: Referrals}, {name: car, label: Fleet}]
              - tag: In progress
                tone: note
                title: Marketing
                body: Campaigns, consent, events, surveys, and automation.
                icons: [{name: mail, label: Email Marketing}, {name: message, label: SMS Marketing}, {name: calendar, label: Events}, {name: survey, label: Surveys}, {name: automation, label: Marketing Automation}]
              - tag: In progress
                tone: note
                title: Services
                body: Projects, timesheets, field work, and helpdesk.
                icons: [{name: project, label: Project}, {name: activity, label: Timesheets}, {name: truck, label: Field Service}, {name: headset, label: Helpdesk}]
              - tag: In progress
                tone: important
                title: Productivity
                body: Guarded approvals with evidence and attachments.
                icons: [{name: check, label: Approvals}, {name: shield, label: Permission checks}, {name: file, label: Evidence}, {name: folder, label: Attachments}]
              - tag: Not started
                tone: warning
                title: Planned capabilities
                body: Reserved areas without a discovered service.
                icons: [{name: calendar, label: Appointments and Planning}, {name: document, label: Knowledge}, {name: edit, label: Sign}, {name: message, label: VoIP}]
