              - ['Package publishing', Future, '@core3/client and @core3/server as installable packages outside this monorepo']

      - id: direction
        kicker: Direction
        title: Target — a full Odoo clone
        lead: >-
          The framework's direction is to reproduce Odoo's ERP surface end to end on YShip, not to
          work from a hypothetical module list. Every new module should be modeled directly against
          Odoo's real behavior.
        blocks:
          - type: callout
            tone: important
            title: The sample code is the reference, not a demo
            text: >-
              sdk/bun/sample/services/order and sdk/bun/sample/services/chat are the canonical
              reference implementation for this direction — CRUD, workflow state transitions,
              chatter/messaging, and file attachments, all driven by YAML page configs with no
              per-page UI code. New Odoo-parity modules should follow these two services' patterns
              directly, the same way OdooFormView, OdooChatter, OdooFollowerManager, and
              OdooAttachmentPanel already exist because the sample services needed them.
          - type: p
            text: >-
              This replaces the project's original planning approach (a hypothetical module
              breakdown used only to validate the framework's YAML concepts before any real service
              existed). That approach is now retired — the order and chat services are real,
              running proof, and Odoo itself is the specification for what comes next.

      - id: odoo-modules
        kicker: Odoo parity tracker
        title: Module / sub-module checklist
        lead: >-
          Odoo's own app grouping, used as the literal tracking list for this direction. Status is
          reported honestly against what has actually shipped, not what the pattern could
          theoretically support.
        blocks:
          - type: callout
            tone: note
            title: How to read "In progress"
            text: >-
              Sales-track modules are marked in progress once a real discovered service exists with
              its core records, permissions, migration, route, and YAML CRUD surface — not because
              the app is feature-complete against real Odoo. Everything else is Not started until a
              real service exists for it.
          - type: callout
            tone: important
            title: Mutation assurance rule
            text: >-
              A module is not done when its pages merely discover. Every create, update, delete, and
              workflow mutation must derive protected values server-side, enforce its permission and
              record-scope boundary, reject stale or invalid transitions, and have an integration test
              that exercises the real YAML action against the module database before the roadmap status
              can move to In progress.
          - type: callout
            tone: note
            title: Inline FormView rule
            text: >-
              Every CRUD module should provide an inline FormView from its primary list when the
              record has a meaningful detail workflow. Follow
              sdk/bun/sample/services/ecommerce/pages/orders.yaml: configure form_view with the
              module detail page, side_panel behavior, and row-open navigation so users can inspect
              and edit records without leaving the list context. A standalone detail route does not
              replace this inline FormView requirement.
