      - id: next
        kicker: Next up
        title: What's next
        blocks:
          - type: list
            items:
              - Model new modules directly against Odoo's real feature set, using the order and chat services as the pattern to follow
              - Keep the component-library reference in sync as real components change
              - Grow the sample order service with more read-focused example pages (analytics, reports)
              - Keep extracting repeated DocPage block shapes into the schema as the doc set grows
              - text: Continue hardening auth and the event mediator per the Gate Service Plan (gateway refactor)
                href: /plan/auth-mediator

      - id: ai-app-builder
        kicker: Future platform layer
        title: Add YShip Studio after Odoo parity
        lead: >-
          Once the Odoo clone has a deep, reliable module foundation, YShip Studio can expose that
          foundation as a visual and conversational app builder. It is an important future layer,
          but it does not replace the Odoo parity roadmap.
        blocks:
          - type: callout
            tone: important
            title: Odoo parity is the foundation
            text: >-
              YShip Studio should eventually feel closer to v0.dev, Lovable, and Manus, but the first
              generated applications should be Odoo-parity modules and extensions: Sales, CRM,
              Inventory, Accounting, Projects, Helpdesk, and their workflows. Later, the same builder
              can generate portals, internal tools, and lightweight SaaS products.
          - type: p
            text: >-
              The key distinction is that the AI does not generate an opaque pile of frontend code.
              It plans against a component and capability registry, emits validated YAML, previews
              the result, runs focused checks, and keeps every decision editable. Custom code remains
              an escape hatch; the default path is composable, inspectable, upgradeable application
              configuration.
          - type: table
            headers: [Builder surface, What the user experiences, What YShip must provide]
            rows:
              - [Prompt to app, 'Describe the audience, data, screens, and behavior in plain language', 'Structured app plan, clarification loop, YAML generation, dependency-aware component selection']
              - [Visual canvas, 'See pages, responsive layouts, forms, tables, charts, and states immediately', 'Live PageRuntime preview, drag/reorder overrides, responsive preview, undoable patches']
              - [Data and actions, 'Connect a datasource or ask for a new model and CRUD flow', 'Schema-aware datasource builder, generic repositories, guarded mutations, migrations']
              - [Behavior and access, 'Add roles, approvals, notifications, and automations by describing them', 'Workflow/topic/permission registries, testable transitions, event-driven actions']
              - [Publish and share, 'Deploy a private tool, public portal, or multi-user application', 'Environment promotion, tenant isolation, auth, observability, version history, export']
          - type: table
            headers: [Phase, Builder milestone, Exit evidence]
            rows:
              - [0 — Registry, 'Make components, YAML keys, datasource fields, actions, workflows, and permissions machine-readable', 'The model can retrieve valid capabilities and cannot emit unknown component props or unsafe actions']
              - [1 — Generator, 'Generate a complete app manifest from a prompt and a small set of structured answers', 'Prompt produces a runnable multi-page app with valid YAML, seeded data, navigation, and role-aware CRUD']
              - [2 — Live refinement, 'Add chat-driven edits, visual selection, diffs, undo, snapshots, and targeted regeneration', 'User can select a screen or component, request a change, inspect the YAML diff, and roll it back']
              - [3 — Full-stack composition, 'Generate models, migrations, datasources, workflows, events, and integrations alongside UI', 'A non-trivial app ships without hand-written page code and passes schema, permission, and focused runtime checks']
              - [4 — Quality and trust, 'Add preview fixtures, browser checks, accessibility checks, security policy checks, and explainable errors', 'Every generated app has a reproducible validation report and actionable repair loop']
              - [5 — Marketplace, 'Let developers publish components, templates, connectors, and domain packs', 'Versioned packages install into the registry with compatibility metadata and safe upgrade paths']
          - type: list
            items:
              - Make the generated YAML the source of truth; the chat transcript is an interaction layer, not the application
              - Prefer deterministic planning plus constrained generation over unrestricted code generation
              - Show the user the app tree, data model, permissions, workflow graph, and YAML diff as first-class artifacts
              - Give AI read access only through permissioned queries and require approval for mutations, deployments, and secrets
              - Measure time-to-first-working-app, successful prompt-to-publish rate, repair rate, rollback rate, and generated-app reuse

      - id: flagship-product
        kicker: Primary product direction
        title: Build YShip OS — the Odoo operating system
        lead: >-
          The Odoo clone remains the primary product roadmap. YShip OS is the YAML-native operating
          system that brings Odoo's applications together while adding connected work, approvals,
          conversations, automations, and audit events.
        blocks:
          - type: callout
            tone: important
            title: Recommended app — YShip OS
            text: >-
              Build the Odoo clone as a world-class operations platform for teams that run repeatable, high-stakes
              processes: logistics, field service, procurement, finance operations, customer support,
              and internal approvals. Its differentiator is not a larger menu of modules; it is a
              shared operational graph. A record, task, message, approval, file, metric, and event
              should be different views of the same traceable business activity.
          - type: p
            text: >-
              YAML remains the product language: routes, menus, permissions, forms, workflows,
              datasources, mutations, notifications, and dashboards are declarative. The runtime
              supplies the hard guarantees—typed data access, local JWT verification, durable events,
              optimistic concurrency, auditability, and cross-service enrichment—so every new domain
              gets enterprise behavior without another bespoke application shell.
          - type: table
            headers: [Product pillar, User promise, Framework capability it forces]
            rows:
              - [Operational graph, 'Every task, record, conversation, and event is connected', 'Typed relations, cross-service enrichment, global search, event lineage']
              - [Process studio, 'Adapt a process without waiting for a full product release', 'YAML workflow editor, guarded mutations, approvals, versioned definitions']
              - [Command center, 'See what needs attention across every team and service', 'Realtime topics, saved views, alerts, KPIs, timeline and workload components']
              - [Trust layer, 'Know who changed what, why, and what happened next', 'Local JWT reads, permission scopes, immutable audit events, replayable history']
              - [AI with evidence, 'Get recommendations that can be inspected and approved', 'Tool/action registry, provenance, human approval gates, bounded queries']
          - type: table
            headers: [Phase, Product milestone, Exit evidence]
            rows:
              - [0 — Foundation, 'Define the universal work-item, relation, event, approval, and evidence contracts', 'YAML schemas, migration rules, permission model, event envelope, representative seeded dataset']
              - [1 — Control center, 'Ship a cross-service inbox, timeline, search, saved views, and operational dashboards', 'One user can discover and act on orders, chats, tasks, alerts, and audit history from one shell']
              - [2 — Process studio, 'Make workflows, forms, approval chains, SLAs, and notifications editable in YAML and UI', 'A new process ships from YAML without page-specific client code and survives a definition version change']
              - [3 — First vertical, 'Turn logistics into the reference vertical: order-to-delivery control tower', 'Live order, shipment, exception, document, conversation, and transition trace with role-based actions']
              - [4 — Evidence AI, 'Add explainable copilots for triage, next action, anomaly detection, and reporting', 'Every suggestion cites source records/events, is permission-scoped, and requires approval for mutations']
              - [5 — Platform, 'Let customers compose their own operations apps from the same primitives', 'Tenant-safe extension registry, packageable YAML modules, upgrade/migration tooling, usage telemetry']
          - type: list
            items:
              - Keep Odoo Sales and Discuss as the first real product tracks, then continue through Odoo's module list
              - Prioritize complete, coherent Odoo workflows before expanding into unrelated generated applications
              - Treat event history and evidence links as first-class data, not an after-the-fact audit screen
              - Make every AI capability consume the same permissioned query and mutation contracts as the UI
              - Measure success by time-to-model a new process, time-to-detect an exception, and audit completeness

      - id: delivery-timeline
        kicker: Delivery sequence
        title: Four milestones to Odoo parity, then Studio
        lead: >-
          This is a relative sequence, not a promise of fixed calendar dates. Each stage earns the
          next one by proving that generated applications are useful, editable, safe, and repeatable.
        blocks:
          - type: flowstrip
            steps:
              - label: 0–3 months
                sub: 'Foundation: harden the shared runtime, auth, events, and Odoo reference patterns'
              - label: 3–6 months
                sub: 'Core apps: deepen Sales and Discuss, then establish CRM and common master data'
              - label: 6–12 months
                sub: 'Odoo breadth: deliver Supply Chain, Finance, Projects, and service workflows'
              - label: 12–18 months
                sub: 'Studio layer: expose the proven Odoo components and modules for AI-assisted composition'
          - type: table
            headers: [Window, Outcome]
            rows:
              - [0–3 months, 'The shared runtime and YAML contracts reliably support Odoo-style CRUD, workflows, permissions, and audit']
              - [3–6 months, 'Sales and Discuss are deep, coherent reference applications rather than isolated demos']
              - [6–12 months, 'The highest-value Odoo modules share data, navigation, security, and workflow conventions']
              - [12–18 months, 'The proven Odoo surface can be composed and extended through an AI-assisted builder']

      - id: meta-model
        kicker: Design reference
        title: Component meta model and backend comms
        lead: >-
          The original spec described two core design contracts: a ComponentDef config object
          driving every component, and two data-transfer objects (SqlViewModel / PatchVM) for
          reads and writes. Both influenced what shipped, though in evolved forms.
        blocks:
          - type: p
            text: >-
              ComponentDef shipped as a per-component key-set registry in
              packages/server/src/yaml/schema.ts. Each component type declares its allowed YAML
              keys via registerPageComponentSchema; the validator enforces the surface at server
              startup rather than at page-load time. The aspirational shape from the original spec
              is shown below for historical reference.
          - type: panel
            title: Aspirational ComponentDef shape (original spec)
            language: typescript
            code: |
              {
                type, id, field, label, align, column, row,
                // Declarative expressions — new Function({ user, row, state })
                show_if, disabled_if, default, compute, validation,
                // Lifecycle events
                events: { on_dom_ready, on_user_input, on_before_save, on_after_save, on_disposed },
                // Permissions resolved from SecurityContext at render time
                can_read, can_write, can_delete,
                // Data binding
                source, query, pre_query, is_realtime, group_by, group_format,
                // Linked selects
                cascade_field, populate_field,
                // Actions and nested components
                actions: ActionDef[], components: ComponentDef[],
              }
          - type: p
            text: >-
              The backend comms spec described SqlViewModel (read DTO) and PatchVM (write DTO)
              flowing through a single Client singleton with JWT-aware fetch. The real server
              YAML surface uses action types instead — type: form / server_form / delete / patch /
              server for writes, and datasource service entries for reads. The DTO shapes are
              internal to the server pipeline; page YAML only declares action and datasource keys.

