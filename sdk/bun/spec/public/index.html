<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YShip — YAML spec, YAML shipping</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Applied before first paint so an explicit saved theme never flashes the
    // opposite theme for a frame. No saved preference means no attribute is
    // set here at all — the CSS prefers-color-scheme media query then governs.
    (function () {
      var saved = localStorage.getItem('core3-spec-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/styles/doc.css">
  <script type="importmap">
    {
      "imports": {
        "@core3/client/html": "/packages/client/src/html.ts",
        "@core3/client/expr": "/packages/client/src/expr.ts",
        "@core3/client/meta": "/packages/client/src/meta.ts",
        "@core3/client/i18n": "/packages/client/src/i18n.ts",
        "@core3/client/navigate": "/packages/client/src/navigate.ts",
        "@core3/client/auth-redirect": "/packages/client/src/auth-redirect.ts",
        "@core3/client/client": "/packages/client/src/client.ts",
        "@core3/client/dtos": "/packages/client/src/dtos.ts",
        "@core3/client/components/BaseComponent": "/packages/client/src/components/BaseComponent.ts",
        "@core3/client/components/Icon": "/packages/client/src/components/Icon.ts",
        "@core3/client/components/AsyncSelect": "/packages/client/src/components/AsyncSelect.ts",
        "@core3/client/components/MoneyInput": "/packages/client/src/components/MoneyInput.ts",
        "@core3/client/components/Toast": "/packages/client/src/components/Toast.ts",
        "@core3/client/components/EventPopup": "/packages/client/src/components/EventPopup.ts",
        "@core3/client/components/Dialog": "/packages/client/src/components/Dialog.ts",
        "@core3/client/components/ListToolbar": "/packages/client/src/components/ListToolbar.ts",
        "@core3/client/components/PageFormModal": "/packages/client/src/components/PageFormModal.ts",
        "@core3/client/components/PageGridRenderers": "/packages/client/src/components/PageGridRenderers.ts",
        "@core3/client/components/PageDetailRenderers": "/packages/client/src/components/PageDetailRenderers.ts",
        "@core3/client/components/PageRoot": "/packages/client/src/components/PageRoot.ts",
        "@core3/client/doc/DocTopNav": "/packages/client/src/doc/DocTopNav.ts",
        "@core3/client/doc/DocHero": "/packages/client/src/doc/DocHero.ts",
        "@core3/client/doc/DocPage": "/packages/client/src/doc/DocPage.ts",
        "highlight.js": "https://esm.sh/highlight.js@11.12.0",
        "@core3/server/yaml/schema": "/packages/server/src/yaml/schema.ts",
        "@core3/server/yaml/workflow-schema": "/packages/server/src/yaml/workflow-schema.ts"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app.ts"></script>
</body>
</html>
